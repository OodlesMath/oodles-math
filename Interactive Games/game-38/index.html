
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .logo-float {
            animation: floatLogo 3s ease-in-out infinite;
        }

        .chest-container {
            perspective: 1000px;
        }

        .chest {
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .chest:hover:not(.opened) {
            transform: scale(1.05) translateY(-5px);
            filter: brightness(1.1);
        }

        .chest.opened {
            cursor: default;
            animation: popOpen 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popOpen {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0); }
        }

        .modal-enter {
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideDown {
            0% { transform: translate(-50%, -100%); opacity: 0; }
            100% { transform: translate(-50%, -50%); opacity: 1; }
        }

        .team-card.active {
            box-shadow: 0 0 0 4px #fff, 0 0 20px rgba(255, 215, 0, 0.8);
            transform: scale(1.05);
            z-index: 10;
        }
    </style>
</head>
<body class="p-4 md:p-8 text-gray-800">

    <!-- Header Section -->
    <header class="text-center mb-8 flex flex-col items-center">
        <!-- Custom Logo with float effect and confetti -->
        <img alt="Game Logo" class="h-12 md:h-16 object-contain mb-2 logo-float drop-shadow-xl cursor-pointer hover:scale-110 transition-transform" src="https://image2url.com/r2/default/images/1770383335772-7e81e69c-f345-4dcc-a9f5-7f7060a6b7fc.png" onclick="shootConfetti()">
             
        <h1 class="text-5xl md:text-6xl font-black text-white drop-shadow-lg mb-2 flex items-center gap-3 justify-center" style="-webkit-text-stroke: 2px #4a5568;">
            <span>🏴‍☠️</span> Treasure Hunt <span>💎</span>
        </h1>
        <p class="text-xl text-gray-700 font-bold bg-white/50 inline-block px-4 py-1 rounded-full border-2 border-white mt-2">
            Select a team, then pick a chest!
        </p>
    </header>

    <!-- Scoreboard Section -->
    <div class="max-w-6xl mx-auto mb-10">
        <div id="scoreboard" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 relative items-stretch">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Game Board (30 Chests) -->
    <div class="max-w-6xl mx-auto">
        <div id="game-board" class="grid grid-cols-5 md:grid-cols-6 gap-3 md:gap-6 chest-container pb-20">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Controls -->
    <div class="fixed bottom-4 right-4 z-40 flex gap-2">
        <button onclick="addTeam()" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-full shadow-lg border-4 border-white transition transform hover:scale-110">
            ➕ Add Team
        </button>
        <button onclick="resetGame()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-full shadow-lg border-4 border-white transition transform hover:scale-110">
            🔄 Reset Board
        </button>
    </div>

    <!-- Overlay & Modal -->
    <div id="overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300"></div>
    
    <div id="modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-3xl p-8 shadow-2xl z-50 w-11/12 max-w-md text-center hidden flex-col items-center border-8 border-yellow-400">
        <div id="modal-icon" class="text-7xl mb-4 animate-bounce">🎁</div>
        <h2 id="modal-title" class="text-3xl font-black mb-2 text-gray-800">Title</h2>
        <p id="modal-desc" class="text-xl text-gray-600 mb-6 font-bold">Description</p>
        
        <!-- Standard Action Button -->
        <button id="modal-close-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-md text-xl transition transform hover:scale-105 hidden" onclick="closeModal()">
            Awesome!
        </button>

        <!-- Power-Up Selection Area -->
        <div id="modal-powerup-area" class="w-full flex flex-col gap-3 hidden">
            <p class="text-md font-bold text-red-500 mb-2">Choose target team:</p>
            <div id="target-teams-container" class="grid grid-cols-1 gap-2 max-h-48 overflow-y-auto p-2">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <!-- System Dialog (Alert/Confirm Replacement) -->
    <div id="sys-dialog" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-6 shadow-2xl z-[60] w-11/12 max-w-sm text-center hidden flex-col items-center border-4 border-gray-800">
        <h3 id="sys-dialog-msg" class="text-xl font-bold mb-4 text-gray-800">Message</h3>
        <input type="text" id="sys-dialog-input" class="w-full border-2 border-gray-300 rounded-xl px-4 py-2 mb-6 hidden focus:outline-none focus:border-blue-500 text-center font-bold text-lg" placeholder="Enter value...">
        <div class="flex gap-4 w-full justify-center">
            <button id="sys-btn-cancel" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-xl transition transform hover:scale-105 hidden">Cancel</button>
            <button id="sys-btn-ok" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-xl transition transform hover:scale-105">OK</button>
        </div>
    </div>

    <script>
        /* --- SOUND EFFECTS (Web Audio API) --- */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol=0.1) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function soundOpen() { playTone(400, 'sine', 0.1); setTimeout(()=>playTone(600, 'sine', 0.2), 100); }
        function soundWin() { playTone(440, 'triangle', 0.1); setTimeout(()=>playTone(554, 'triangle', 0.1), 100); setTimeout(()=>playTone(659, 'triangle', 0.3), 200); }
        function soundLose() { playTone(300, 'sawtooth', 0.3); setTimeout(()=>playTone(250, 'sawtooth', 0.4), 200); }
        function soundPowerUp() { playTone(800, 'sine', 0.1); setTimeout(()=>playTone(1000, 'sine', 0.1), 100); setTimeout(()=>playTone(1200, 'sine', 0.3), 200); }

        /* --- SYSTEM DIALOG & CONFETTI --- */
        function shootConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.3 },
                zIndex: 100
            });
        }

        function showSysDialog(msg, isConfirm, onOk) {
            const overlay = document.getElementById('overlay');
            const dialog = document.getElementById('sys-dialog');
            const inputField = document.getElementById('sys-dialog-input');
            
            document.getElementById('sys-dialog-msg').textContent = msg;
            inputField.classList.add('hidden');
            
            const btnCancel = document.getElementById('sys-btn-cancel');
            const btnOk = document.getElementById('sys-btn-ok');
            
            btnCancel.classList.toggle('hidden', !isConfirm);
            
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');

            btnCancel.onclick = () => closeSysDialog();
            btnOk.onclick = () => {
                closeSysDialog();
                if(onOk) onOk();
            };
        }

        function showInputDialog(msg, defaultValue, onOk, type="text") {
            const overlay = document.getElementById('overlay');
            const dialog = document.getElementById('sys-dialog');
            const inputField = document.getElementById('sys-dialog-input');
            
            document.getElementById('sys-dialog-msg').textContent = msg;
            
            inputField.type = type;
            inputField.value = defaultValue;
            inputField.classList.remove('hidden');
            
            const btnCancel = document.getElementById('sys-btn-cancel');
            const btnOk = document.getElementById('sys-btn-ok');
            
            btnCancel.classList.remove('hidden');
            
            overlay.classList.remove('hidden');
            setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            
            dialog.classList.remove('hidden');
            dialog.classList.add('flex');
            
            inputField.focus();

            btnCancel.onclick = () => closeSysDialog();
            btnOk.onclick = () => {
                const val = inputField.value;
                closeSysDialog();
                if(onOk) onOk(val);
            };
        }

        function closeSysDialog() {
            const dialog = document.getElementById('sys-dialog');
            dialog.classList.add('hidden');
            dialog.classList.remove('flex');
            
            if (document.getElementById('modal').classList.contains('hidden')) {
                const overlay = document.getElementById('overlay');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        /* --- GAME STATE --- */
        let teams = [
            { id: 1, name: "Team 1", score: 0, color: "bg-red-400", border: "border-red-500", text: "text-red-900" },
            { id: 2, name: "Team 2", score: 0, color: "bg-blue-400", border: "border-blue-500", text: "text-blue-900" },
            { id: 3, name: "Team 3", score: 0, color: "bg-green-400", border: "border-green-500", text: "text-green-900" },
            { id: 4, name: "Team 4", score: 0, color: "bg-yellow-400", border: "border-yellow-500", text: "text-yellow-900" }
        ];

        const extraColors = [
            { color: "bg-pink-400", border: "border-pink-500", text: "text-pink-900" },
            { color: "bg-purple-400", border: "border-purple-500", text: "text-purple-900" },
            { color: "bg-teal-400", border: "border-teal-500", text: "text-teal-900" },
            { color: "bg-orange-400", border: "border-orange-500", text: "text-orange-900" },
            { color: "bg-cyan-400", border: "border-cyan-500", text: "text-cyan-900" },
            { color: "bg-lime-400", border: "border-lime-500", text: "text-lime-900" }
        ];
        
        let activeTeamId = 1;
        let chests = [];

        /* --- INITIALIZATION --- */
        function initGame() {
            let chestContents = [];
            
            // 15 Standard Points (1 to 10)
            for(let i=0; i<15; i++) chestContents.push({ type: 'points', value: Math.floor(Math.random() * 10) + 1 });
            // 6 High Points (7 to 10)
            for(let i=0; i<6; i++) chestContents.push({ type: 'points', value: Math.floor(Math.random() * 4) + 7 });
            // 3 Minus Points (-2 to -5)
            for(let i=0; i<3; i++) chestContents.push({ type: 'minus', value: -(Math.floor(Math.random() * 4) + 2) });
            // 3 Swap Power-Ups
            for(let i=0; i<3; i++) chestContents.push({ type: 'swap', value: 0 });
            // 3 Steal Power-Ups (Steal 5 points)
            for(let i=0; i<3; i++) chestContents.push({ type: 'steal', value: 5 });

            // Shuffle
            chestContents.sort(() => Math.random() - 0.5);

            chests = chestContents.map((content, index) => ({
                id: index,
                opened: false,
                content: content
            }));

            // Reset scores but keep teams
            teams.forEach(t => t.score = 0);
            if (teams.length > 0 && !teams.find(t => t.id === activeTeamId)) {
                activeTeamId = teams[0].id;
            }

            renderTeams();
            renderChests();
        }

        /* --- RENDERING --- */
        function renderTeams() {
            const container = document.getElementById('scoreboard');
            container.innerHTML = '';
            
            teams.forEach((team, index) => {
                const isActive = team.id === activeTeamId;
                const card = document.createElement('div');
                card.className = `team-card relative ${team.color} ${team.border} border-4 rounded-2xl p-4 text-center cursor-pointer transition-all ${isActive ? 'active' : 'opacity-80 hover:opacity-100'}`;
                card.onclick = () => selectTeam(team.id);
                
                card.innerHTML = `
                    <button onclick="event.stopPropagation(); deleteTeam(${team.id})" class="absolute -top-3 -right-3 bg-red-600 hover:bg-red-700 text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold border-2 border-white shadow-md z-20 transition transform hover:scale-110" title="Delete Team">✕</button>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xl font-black ${team.text} truncate flex-1 hover:bg-white/30 rounded px-1 transition-colors" title="Click to rename" onclick="event.stopPropagation(); renameTeam(${team.id})">
                            ${team.name} ✏️
                        </h3>
                    </div>
                    <div class="bg-white/80 rounded-xl py-2 px-4 inline-block min-w-[80px] cursor-pointer hover:bg-white transition-colors" title="Edit Score" onclick="event.stopPropagation(); editScore(${team.id})">
                        <span class="text-4xl font-black ${team.text}">${team.score}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addTeam() {
            initAudio();
            const newId = teams.length > 0 ? Math.max(...teams.map(t => t.id)) + 1 : 1;
            const colorScheme = extraColors[teams.length % extraColors.length];
            teams.push({
                id: newId,
                name: `Team ${newId}`,
                score: 0,
                ...colorScheme
            });
            renderTeams();
        }

        function deleteTeam(id) {
            initAudio();
            showSysDialog("Are you sure you want to delete this team?", true, () => {
                teams = teams.filter(t => t.id !== id);
                if (activeTeamId === id && teams.length > 0) {
                    activeTeamId = teams[0].id; // Assign to first available team
                } else if (teams.length === 0) {
                    activeTeamId = null;
                }
                renderTeams();
            });
        }

        const chestSVG = `
            <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-2xl">
                <!-- Glowing shadow behind -->
                <ellipse cx="50" cy="90" rx="40" ry="10" fill="rgba(0,0,0,0.3)" />
                <!-- Chest Base -->
                <path d="M 15,50 L 85,50 L 85,85 C 85,92 80,95 75,95 L 25,95 C 20,95 15,92 15,85 Z" fill="#8B4513" stroke="#5C2E00" stroke-width="2"/>
                <!-- Base wood panels -->
                <path d="M 25,50 L 25,95 M 40,50 L 40,95 M 60,50 L 60,95 M 75,50 L 75,95" stroke="#5C2E00" stroke-width="2" opacity="0.6"/>
                <!-- Metal trim bottom -->
                <path d="M 15,85 C 15,92 20,95 25,95 L 75,95 C 80,95 85,92 85,85 L 85,80 L 15,80 Z" fill="#708090" stroke="#2F4F4F" stroke-width="2"/>
                <!-- Metal trim sides -->
                <rect x="15" y="50" width="8" height="35" fill="#708090" stroke="#2F4F4F" stroke-width="2"/>
                <rect x="77" y="50" width="8" height="35" fill="#708090" stroke="#2F4F4F" stroke-width="2"/>
                
                <!-- Chest Lid -->
                <path d="M 15,50 C 15,20 85,20 85,50 Z" fill="#A0522D" stroke="#5C2E00" stroke-width="2"/>
                <!-- Lid wood panels -->
                <path d="M 25,50 C 25,25 40,20 50,20 C 60,20 75,25 75,50" stroke="#5C2E00" stroke-width="2" fill="none" opacity="0.6"/>
                <!-- Metal trim lid -->
                <path d="M 15,50 C 15,20 30,20 50,20 C 70,20 85,20 85,50 L 77,50 C 77,28 65,28 50,28 C 35,28 23,28 23,50 Z" fill="#708090" stroke="#2F4F4F" stroke-width="2"/>
                
                <!-- Center Lock Mechanism -->
                <rect x="42" y="40" width="16" height="20" rx="3" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
                <!-- Keyhole -->
                <circle cx="50" cy="47" r="3" fill="#333"/>
                <path d="M 48,47 L 52,47 L 53,55 L 47,55 Z" fill="#333"/>
            </svg>
        `;

        function renderChests() {
            const container = document.getElementById('game-board');
            container.innerHTML = '';

            chests.forEach((chest, index) => {
                const box = document.createElement('div');
                box.className = `chest bg-white/40 backdrop-blur-sm p-2 rounded-2xl border-4 border-white/50 aspect-square flex items-center justify-center relative ${chest.opened ? 'opened bg-white/80' : ''}`;
                
                if (!chest.opened) {
                    box.innerHTML = `<div class="w-full h-full p-2">${chestSVG}</div>`;
                    box.innerHTML += `<div class="absolute top-1 left-2 text-white font-black text-lg drop-shadow-md">${index + 1}</div>`;
                    box.onclick = () => openChest(index);
                } else {
                    let icon, color;
                    switch(chest.content.type) {
                        case 'points': icon = '🪙'; color = 'text-green-600'; break;
                        case 'minus': icon = '💣'; color = 'text-red-600'; break;
                        case 'swap': icon = '🔄'; color = 'text-purple-600'; break;
                        case 'steal': icon = '🥷'; color = 'text-blue-600'; break;
                    }
                    box.innerHTML = `
                        <div class="text-center">
                            <div class="text-4xl md:text-5xl mb-1">${icon}</div>
                            <div class="text-xl md:text-2xl font-black ${color}">
                                ${chest.content.value !== 0 ? Math.abs(chest.content.value) : ''}
                            </div>
                        </div>
                    `;
                }
                
                container.appendChild(box);
            });
        }

        /* --- INTERACTIONS --- */
        function selectTeam(id) {
            initAudio();
            activeTeamId = id;
            renderTeams();
        }

        function renameTeam(id) {
            initAudio();
            const team = teams.find(t => t.id === id);
            showInputDialog(`Enter new name for ${team.name}:`, team.name, (newName) => {
                if (newName && newName.trim().length > 0) {
                    team.name = newName.substring(0, 15);
                    renderTeams();
                }
            });
        }

        function editScore(id) {
            initAudio();
            const team = teams.find(t => t.id === id);
            showInputDialog(`Enter new score for ${team.name}:`, team.score, (newScore) => {
                const parsedScore = parseInt(newScore, 10);
                if (!isNaN(parsedScore)) {
                    team.score = parsedScore;
                    renderTeams();
                } else {
                    showSysDialog("Invalid score! Please enter a number.", false);
                }
            }, "number");
        }

        function openChest(index) {
            if (teams.length === 0) {
                showSysDialog("Please add a team first!", false);
                return;
            }
            if (!activeTeamId) {
                showSysDialog("Please select a team first!", false);
                return;
            }

            const chest = chests[index];
            if (chest.opened) return;

            soundOpen();
            chest.opened = true;
            renderChests();

            const activeTeam = teams.find(t => t.id === activeTeamId);

            setTimeout(() => {
                showModal(chest.content, activeTeam);
            }, 400);
        }

        function showModal(content, activeTeam) {
            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            const desc = document.getElementById('modal-desc');
            const closeBtn = document.getElementById('modal-close-btn');
            const powerUpArea = document.getElementById('modal-powerup-area');
            const targetsContainer = document.getElementById('target-teams-container');

            // Reset UI
            closeBtn.classList.add('hidden');
            powerUpArea.classList.add('hidden');
            targetsContainer.innerHTML = '';
            closeBtn.textContent = "Awesome!";
            closeBtn.className = "bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full shadow-md text-xl transition transform hover:scale-105";
            modal.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-3xl p-8 shadow-2xl z-50 w-11/12 max-w-md text-center flex flex-col items-center border-8 modal-enter";

            switch(content.type) {
                case 'points':
                    soundWin();
                    modal.classList.add('border-green-400');
                    icon.textContent = '🪙';
                    title.textContent = 'Jackpot!';
                    title.className = "text-3xl font-black mb-2 text-green-600";
                    desc.innerHTML = `<span class="font-black text-green-600">${activeTeam.name}</span> found <span class="text-3xl font-black text-green-500">+${content.value}</span> points!`;
                    activeTeam.score += content.value;
                    closeBtn.classList.remove('hidden');
                    break;
                
                case 'minus':
                    soundLose();
                    modal.classList.add('border-red-400');
                    icon.textContent = '💣';
                    title.textContent = 'Oh no!';
                    title.className = "text-3xl font-black mb-2 text-red-600";
                    desc.innerHTML = `<span class="font-black text-red-600">${activeTeam.name}</span> lost <span class="text-3xl font-black text-red-500">${Math.abs(content.value)}</span> points!`;
                    activeTeam.score += content.value; 
                    closeBtn.classList.remove('hidden');
                    closeBtn.textContent = "Ouch!";
                    closeBtn.classList.replace('bg-green-500', 'bg-red-500');
                    closeBtn.classList.replace('hover:bg-green-600', 'hover:bg-red-600');
                    break;
                
                case 'swap':
                    soundPowerUp();
                    modal.classList.add('border-purple-400');
                    icon.textContent = '🔄';
                    title.textContent = 'Magic Swap!';
                    title.className = "text-3xl font-black mb-2 text-purple-600";
                    desc.innerHTML = `<span class="font-black">${activeTeam.name}</span>, swap your points with another team!`;
                    setupPowerUpUI(activeTeam, 'swap');
                    break;
                
                case 'steal':
                    soundPowerUp();
                    modal.classList.add('border-blue-400');
                    icon.textContent = '🥷';
                    title.textContent = 'Sneaky Steal!';
                    title.className = "text-3xl font-black mb-2 text-blue-600";
                    desc.innerHTML = `<span class="font-black">${activeTeam.name}</span> gets to steal <span class="text-3xl font-black text-blue-500">${content.value}</span> points!`;
                    setupPowerUpUI(activeTeam, 'steal', content.value);
                    break;
            }

            renderTeams(); 

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
            }, 10);
        }

        function setupPowerUpUI(activeTeam, type, amount = 0) {
            const powerUpArea = document.getElementById('modal-powerup-area');
            const targetsContainer = document.getElementById('target-teams-container');
            
            powerUpArea.classList.remove('hidden');
            
            const otherTeams = teams.filter(team => team.id !== activeTeam.id);
            
            if (otherTeams.length === 0) {
                targetsContainer.innerHTML = '<p class="text-gray-500 italic">No other teams to target.</p>';
                const closeBtn = document.getElementById('modal-close-btn');
                closeBtn.classList.remove('hidden');
                closeBtn.textContent = "Close";
                return;
            }

            otherTeams.forEach(team => {
                const btn = document.createElement('button');
                btn.className = `${team.color} border-2 border-white hover:brightness-110 text-gray-900 font-bold py-3 px-4 rounded-xl shadow transition transform hover:scale-105 w-full text-lg`;
                btn.innerHTML = `${team.name} <span class="bg-white/50 px-2 py-1 rounded-md text-sm ml-2">Score: ${team.score}</span>`;
                btn.onclick = () => resolvePowerUp(activeTeam.id, team.id, type, amount);
                targetsContainer.appendChild(btn);
            });
        }

        function resolvePowerUp(activeId, targetId, type, amount) {
            const activeTeam = teams.find(t => t.id === activeId);
            const targetTeam = teams.find(t => t.id === targetId);

            if (type === 'swap') {
                let temp = activeTeam.score;
                activeTeam.score = targetTeam.score;
                targetTeam.score = temp;
                soundWin();
            } else if (type === 'steal') {
                activeTeam.score += amount;
                targetTeam.score -= amount;
                soundWin();
            }

            renderTeams();
            closeModal();
        }

        function closeModal() {
            const overlay = document.getElementById('overlay');
            const modal = document.getElementById('modal');
            
            overlay.classList.remove('opacity-100');
            overlay.classList.add('opacity-0');
            modal.classList.remove('modal-enter');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                modal.classList.add('hidden');
            }, 300);
        }

        function resetGame() {
            showSysDialog("Are you sure you want to reset the board? Scores will reset to 0!", true, () => {
                initGame();
            });
        }

        // Start game on load
        window.onload = initGame;

    </script>
</body>
</html>

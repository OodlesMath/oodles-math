<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oodles Math: Background Only V7</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --primary: #1cb0f6;
            --success: #58cc02;
            --warning: #ffc800;
            --danger: #ff4b4b;
            --purple: #ce82ff;
            --dark: #0f172a;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #60c5f7 0%, #b5e6fc 100%);
            user-select: none;
            overflow: hidden; /* Prevent scrolling for clean background look */
            touch-action: pan-y;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        /* --- Scenery Background --- */
        .scenery {
            position: fixed;
            inset: 0;
            z-index: -10;
            pointer-events: none;
        }

        /* Rainbow - Phiên bản V7: Thu nhỏ 30% (từ 1400px xuống 980px) */
        .rainbow {
            position: fixed;
            /* Đẩy xuống dưới một lượng bằng 1/2 chiều cao (490px) để đường cắt nằm hoàn toàn sau đồi cỏ */
            bottom: calc(25vh - 490px); 
            left: 50%;
            transform: translateX(-50%);
            width: 980px;
            height: 980px;
            border-radius: 50%;
            /* Độ dày các dải màu cũng giảm 30% tương ứng (còn khoảng 18px mỗi dải) */
            box-shadow: 
                inset 0 0 0 18px #ff4b4b, 
                inset 0 0 0 36px #ff9600, 
                inset 0 0 0 54px #ffc800, 
                inset 0 0 0 72px #58cc02, 
                inset 0 0 0 90px #1cb0f6,
                inset 0 0 0 108px #ce82ff;
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            opacity: 0.85;
            z-index: -9;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            animation: move-clouds linear infinite;
            box-shadow: 0 8px 0 0 rgba(255,255,255,0.7);
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud::before { width: 50px; height: 50px; top: -20px; left: 15px; }
        .cloud::after { width: 70px; height: 70px; top: -30px; right: 15px; }

        @keyframes move-clouds {
            from { transform: translateX(-200px); }
            to { transform: translateX(100vw); }
        }

        /* Grass Hills - Cao đủ để giấu trọn chân cầu vồng */
        .bg-hills {
            position: fixed;
            bottom: -5vh; 
            left: -10%; 
            right: -10%;
            height: 38vh;
            background: #58cc02;
            border-top-left-radius: 50% 100%;
            border-top-right-radius: 50% 100%;
            z-index: -5;
            box-shadow: inset 0 20px 0 0 #7ade28;
            pointer-events: none;
        }

        /* Trees & Flowers */
        .tree {
            position: absolute;
            bottom: 60%;
            width: 30px;
            height: 50px;
            background: #8b5a2b; /* Trunk */
            border-radius: 5px;
        }
        .tree::after {
            content: '';
            position: absolute;
            bottom: 20px;
            left: -25px;
            width: 80px;
            height: 80px;
            background: #46a302; /* Leaves */
            border-radius: 50%;
            box-shadow: inset -10px -10px 0 0 rgba(0,0,0,0.1);
        }

        .flower {
            position: absolute;
            bottom: 40%;
            width: 6px;
            height: 30px;
            background: #46a302;
            border-radius: 3px;
        }
        .flower::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -12px;
            width: 30px;
            height: 30px;
            background: #ff4b4b; /* Petals */
            border-radius: 50%;
            box-shadow: inset -5px -5px 0 0 rgba(0,0,0,0.1);
        }
        .flower::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -2px;
            width: 10px;
            height: 10px;
            background: #ffc800; /* Center */
            border-radius: 50%;
        }

        /* Sunburst */
        .sunburst {
            position: fixed;
            top: 50%; left: 50%;
            width: 200vw; height: 200vw;
            margin-left: -100vw; margin-top: -100vw;
            background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, 0.2) 0deg 15deg, transparent 15deg 30deg);
            animation: rotate-sun 60s linear infinite;
            z-index: -8;
            pointer-events: none;
        }

        @keyframes rotate-sun { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Scenery Environment -->
    <div class="scenery">
        <div class="sunburst" id="bg-sunburst"></div>
        <div class="rainbow"></div>
        <div class="bg-clouds">
            <div class="cloud w-32 h-10 top-10" style="animation-duration: 45s; animation-delay: -5s;"></div>
            <div class="cloud w-48 h-12 top-32" style="animation-duration: 65s; animation-delay: -25s; opacity: 0.8;"></div>
            <div class="cloud w-40 h-10 top-60" style="animation-duration: 55s; animation-delay: -40s;"></div>
        </div>
        <div class="bg-hills" id="bg-hills">
            <!-- Scenery Details -->
            <div class="tree" style="left: 15%;"></div>
            <div class="tree" style="left: 85%; bottom: 65%; transform: scale(1.2);"></div>
            <div class="tree" style="left: 40%; bottom: 50%; transform: scale(0.8);"></div>
            <div class="flower" style="left: 25%;"></div>
            <div class="flower" style="left: 30%; bottom: 45%; filter: hue-rotate(90deg);"></div>
            <div class="flower" style="left: 70%; bottom: 55%; filter: hue-rotate(180deg);"></div>
            <div class="flower" style="left: 75%; filter: hue-rotate(270deg);"></div>
        </div>
    </div>
</body>
</html>

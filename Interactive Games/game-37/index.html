<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Snake Game Kinh Điển</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }

        .score-container,
        .high-score-container {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .score-container {
            background: rgba(255, 255, 255, 0.08);
        }

        .high-score-container {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .score-icon,
        .high-score-icon {
            font-size: 1.5rem;
        }

        .score-label,
        .high-score-label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .score-label {
            color: #aaa;
        }

        .high-score-label {
            color: #ffd700;
        }

        .score-value,
        .high-score-value {
            font-size: 1.6rem;
            font-weight: 700;
            min-width: 40px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .high-score-value {
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .canvas-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 200, 83, 0.25), 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1);
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%,
            100% {
                box-shadow: 0 0 40px rgba(0, 200, 83, 0.2), 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 70px rgba(0, 200, 83, 0.35), 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1);
            }
        }

        canvas {
            display: block;
            background: #0f0f1a;
            cursor: pointer;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-icon {
            font-size: 4rem;
            animation: bounce 1.5s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .overlay-title {
            color: #fff;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(0, 200, 83, 0.6);
        }

        .overlay-subtitle {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .overlay-score {
            color: #ffd700;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.25s ease;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
            box-shadow: 0 8px 30px rgba(0, 200, 83, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 200, 83, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }

        .controls-hint {
            display: flex;
            gap: 15px;
            color: #777;
            font-size: 0.85rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .key-hint {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .key {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 4px 10px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #ddd;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .mobile-controls {
            display: none;
            gap: 10px;
            margin-top: 5px;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .dpad-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .dpad-btn:active {
            background: rgba(0, 200, 83, 0.4);
            transform: scale(0.92);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .dpad-up {
            grid-column: 2;
            grid-row: 1;
        }
        .dpad-left {
            grid-column: 1;
            grid-row: 2;
        }
        .dpad-right {
            grid-column: 3;
            grid-row: 2;
        }
        .dpad-down {
            grid-column: 2;
            grid-row: 3;
        }

        @media (max-width: 550px) {
            .game-wrapper {
                gap: 12px;
                padding: 10px;
            }
            .game-header {
                padding: 0 5px;
            }
            .score-container,
            .high-score-container {
                padding: 8px 14px;
            }
            .score-value,
            .high-score-value {
                font-size: 1.2rem;
            }
            .overlay-title {
                font-size: 1.5rem;
            }
            .overlay-icon {
                font-size: 2.8rem;
            }
            .btn {
                padding: 12px 25px;
                font-size: 0.95rem;
            }
            .mobile-controls {
                display: grid;
            }
            .controls-hint {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .dpad-btn {
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
            }
            .dpad {
                grid-template-columns: repeat(3, 50px);
                grid-template-rows: repeat(3, 50px);
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <div class="score-container">
                <span class="score-icon">🍎</span>
                <span class="score-label">ĐIỂM</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="high-score-container">
                <span class="high-score-icon">🏆</span>
                <span class="high-score-label">KỶ LỤC</span>
                <span class="high-score-value" id="highScore">0</span>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
            <div class="overlay" id="overlay">
                <div class="overlay-icon">🐍</div>
                <div class="overlay-title">SNAKE GAME</div>
                <div class="overlay-subtitle">Kinh điển • Thư giãn • Gây nghiện</div>
                <div class="overlay-score" id="overlayScore" style="display: none;"></div>
                <div>
                    <button class="btn btn-primary" id="startBtn">▶ Bắt Đầu</button>
                </div>
            </div>
        </div>

        <div class="controls-hint">
            <div class="key-hint">
                <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> Di chuyển
            </div>
            <div class="key-hint">
                <span class="key">P</span> Tạm dừng
            </div>
            <div class="key-hint">
                <span class="key">Space</span> Bắt đầu lại
            </div>
        </div>

        <div class="mobile-controls">
            <div class="dpad">
                <button class="dpad-btn dpad-up" id="btnUp">▲</button>
                <button class="dpad-btn dpad-left" id="btnLeft">◀</button>
                <button class="dpad-btn dpad-right" id="btnRight">▶</button>
                <button class="dpad-btn dpad-down" id="btnDown">▼</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== CẤU HÌNH ====================
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('overlay');
            const startBtn = document.getElementById('startBtn');
            const scoreElement = document.getElementById('score');
            const highScoreElement = document.getElementById('highScore');
            const overlayScore = document.getElementById('overlayScore');

            const GRID_SIZE = 20;
            const COLS = canvas.width / GRID_SIZE;
            const ROWS = canvas.height / GRID_SIZE;

            // ==================== BIẾN GAME ====================
            let snake = [];
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let food = {};
            let score = 0;
            let highScore = 0;
            let gameRunning = false;
            let gamePaused = false;
            let gameOver = false;
            let gameLoop = null;
            let baseSpeed = 120;
            let currentSpeed = baseSpeed;

            // ==================== AN TOÀN LOCALSTORAGE ====================
            try {
                highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
            } catch (e) {
                highScore = 0;
            }

            // ==================== AN TOÀN AUDIO ====================
            let audioCtx = null;
            try {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                audioCtx = null;
            }

            function playTone(freq, duration, type, volume) {
                if (!audioCtx) return;
                try {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.type = type || 'sine';
                    oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(volume || 0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + duration);
                } catch (e) {
                    // Bỏ qua lỗi âm thanh
                }
            }

            function playEatSound() {
                playTone(600, 0.15, 'sine', 0.35);
                setTimeout(() => playTone(900, 0.15, 'sine', 0.3), 80);
            }

            function playDeathSound() {
                playTone(300, 0.3, 'sawtooth', 0.2);
                setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.2), 200);
                setTimeout(() => playTone(100, 0.4, 'sawtooth', 0.2), 400);
            }

            function playMoveSound() {
                playTone(200, 0.03, 'sine', 0.05);
            }

            // ==================== HÀM VẼ HÌNH CHỮ NHẬT BO GÓC ====================
            function roundedRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }

            // ==================== KHỞI TẠO GAME ====================
            function initGame() {
                snake = [
                    { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
                    { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
                    { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                currentSpeed = baseSpeed;
                gameOver = false;
                gamePaused = false;
                updateScoreDisplay();
                spawnFood();
            }

            function spawnFood() {
                let newFood;
                let attempts = 0;
                const maxAttempts = 10000;
                do {
                    newFood = {
                        x: Math.floor(Math.random() * COLS),
                        y: Math.floor(Math.random() * ROWS)
                    };
                    attempts++;
                } while (isOnSnake(newFood) && attempts < maxAttempts);

                if (attempts >= maxAttempts) {
                    for (let y = 0; y < ROWS; y++) {
                        for (let x = 0; x < COLS; x++) {
                            if (!isOnSnake({ x, y })) {
                                food = { x, y };
                                return;
                            }
                        }
                    }
                    gameOver = true;
                    food = { x: -1, y: -1 };
                } else {
                    food = newFood;
                }
            }

            function isOnSnake(pos) {
                return snake.some(segment => segment.x === pos.x && segment.y === pos.y);
            }

            function updateScoreDisplay() {
                scoreElement.textContent = score;
                highScoreElement.textContent = highScore;
                if (score > highScore) {
                    highScore = score;
                    try {
                        localStorage.setItem('snakeHighScore', highScore);
                    } catch (e) {
                        // Bỏ qua
                    }
                    highScoreElement.textContent = highScore;
                }
            }

            // ==================== VẼ GAME ====================
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Vẽ lưới nền
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= COLS; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * GRID_SIZE, 0);
                    ctx.lineTo(i * GRID_SIZE, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * GRID_SIZE);
                    ctx.lineTo(canvas.width, i * GRID_SIZE);
                    ctx.stroke();
                }

                // Vẽ thức ăn
                if (food.x >= 0 && food.y >= 0) {
                    drawFood(food.x, food.y);
                }

                // Vẽ rắn
                drawSnake();

                // Hiệu ứng game over
                if (gameOver) {
                    drawGameOverEffect();
                }
            }

            function drawFood(gridX, gridY) {
                const centerX = gridX * GRID_SIZE + GRID_SIZE / 2;
                const centerY = gridY * GRID_SIZE + GRID_SIZE / 2;
                const radius = GRID_SIZE / 2 - 3;

                // Phát sáng
                const glow = ctx.createRadialGradient(centerX, centerY, 2, centerX, centerY, radius * 2);
                glow.addColorStop(0, 'rgba(255, 82, 82, 0.6)');
                glow.addColorStop(0.5, 'rgba(255, 82, 82, 0.15)');
                glow.addColorStop(1, 'rgba(255, 82, 82, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius * 2, 0, Math.PI * 2);
                ctx.fill();

                // Thân táo
                const appleGradient = ctx.createRadialGradient(centerX - 2, centerY - 2, 1, centerX, centerY, radius);
                appleGradient.addColorStop(0, '#ff6b6b');
                appleGradient.addColorStop(0.7, '#e53935');
                appleGradient.addColorStop(1, '#b71c1c');
                ctx.fillStyle = appleGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();

                // Bóng sáng
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(centerX - radius * 0.3, centerY - radius * 0.3, radius * 0.25, 0, Math.PI * 2);
                ctx.fill();

                // Cuống
                ctx.strokeStyle = '#4e342e';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY - radius * 0.7);
                ctx.quadraticCurveTo(centerX + radius * 0.6, centerY - radius * 1.3, centerX + radius * 0.8, centerY - radius * 1.2);
                ctx.stroke();

                // Lá
                ctx.fillStyle = '#66bb6a';
                ctx.beginPath();
                ctx.ellipse(centerX + radius * 0.9, centerY - radius * 1.3, radius * 0.35, radius * 0.18, 0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawSnake() {
                const snakeLength = snake.length;

                // Bóng đổ
                ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 4;

                for (let i = 0; i < snakeLength; i++) {
                    const segment = snake[i];
                    const gridX = segment.x * GRID_SIZE;
                    const gridY = segment.y * GRID_SIZE;
                    const padding = 2;
                    const size = GRID_SIZE - padding * 2;
                    const borderRadius = 5;

                    const t = i / snakeLength;
                    const r = Math.round(76 + t * 25);
                    const g = Math.round(175 + t * 30);
                    const b = Math.round(80 + t * 20);

                    const gradient = ctx.createRadialGradient(
                        gridX + size / 2, gridY + size / 2, 1,
                        gridX + size / 2, gridY + size / 2, size / 2
                    );
                    gradient.addColorStop(0, `rgba(${r + 30}, ${g + 30}, ${b + 30}, 1)`);
                    gradient.addColorStop(0.6, `rgba(${r}, ${g}, ${b}, 1)`);
                    gradient.addColorStop(1, `rgba(${r - 30}, ${g - 30}, ${b - 30}, 1)`);

                    ctx.fillStyle = gradient;
                    // Sử dụng hàm vẽ bo góc an toàn
                    roundedRect(ctx, gridX + padding, gridY + padding, size, size, borderRadius);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.lineWidth = 0.8;
                    roundedRect(ctx, gridX + padding, gridY + padding, size, size, borderRadius);
                    ctx.stroke();
                }

                // Reset shadow
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;

                // Vẽ mắt cho đầu rắn
                if (snakeLength > 0) {
                    const head = snake[0];
                    const headX = head.x * GRID_SIZE;
                    const headY = head.y * GRID_SIZE;
                    const eyeSize = 3.5;
                    const eyeOffsetX = direction.x * 5 + (direction.y !== 0 ? 2.5 : 0);
                    const eyeOffsetY = direction.y * 5 + (direction.x !== 0 ? 2.5 : 0);

                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(headX + GRID_SIZE / 2 + eyeOffsetX - 2, headY + GRID_SIZE / 2 + eyeOffsetY - 2, eyeSize + 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(headX + GRID_SIZE / 2 + eyeOffsetX + 2, headY + GRID_SIZE / 2 + eyeOffsetY + 2, eyeSize + 1, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(headX + GRID_SIZE / 2 + eyeOffsetX - 1.5, headY + GRID_SIZE / 2 + eyeOffsetY - 1.5, eyeSize * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(headX + GRID_SIZE / 2 + eyeOffsetX + 2.5, headY + GRID_SIZE / 2 + eyeOffsetY + 2.5, eyeSize * 0.6, 0, Math.PI * 2);
                    ctx.fill();

                    // Lưỡi
                    if (gameRunning && !gameOver) {
                        const tongueLength = 8;
                        const tongueStartX = headX + GRID_SIZE / 2 + direction.x * 8;
                        const tongueStartY = headY + GRID_SIZE / 2 + direction.y * 8;
                        const tongueEndX = tongueStartX + direction.x * tongueLength;
                        const tongueEndY = tongueStartY + direction.y * tongueLength;

                        ctx.strokeStyle = '#ff5252';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(tongueStartX, tongueStartY);
                        ctx.lineTo(tongueEndX, tongueEndY);
                        ctx.stroke();

                        const perpX = -direction.y;
                        const perpY = direction.x;
                        ctx.beginPath();
                        ctx.moveTo(tongueEndX, tongueEndY);
                        ctx.lineTo(tongueEndX + perpX * 3 + direction.x * 2, tongueEndY + perpY * 3 + direction.y * 2);
                        ctx.moveTo(tongueEndX, tongueEndY);
                        ctx.lineTo(tongueEndX - perpX * 3 + direction.x * 2, tongueEndY - perpY * 3 + direction.y * 2);
                        ctx.stroke();
                    }
                }
            }

            function drawGameOverEffect() {
                const gradient = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 50,
                    canvas.width / 2, canvas.height / 2, canvas.width / 1.5
                );
                gradient.addColorStop(0, 'rgba(255, 0, 0, 0)');
                gradient.addColorStop(1, 'rgba(255, 0, 0, 0.25)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // ==================== CẬP NHẬT GAME ====================
            function update() {
                if (!gameRunning || gamePaused || gameOver) return;

                // Áp dụng hướng mới nếu hợp lệ
                const isOpposite = (direction.x === -nextDirection.x && direction.y === -nextDirection.y);
                if (!isOpposite && (nextDirection.x !== 0 || nextDirection.y !== 0)) {
                    direction = { ...nextDirection };
                }

                const newHead = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y
                };

                // Wrap around
                let wrappedHead = { ...newHead };
                if (wrappedHead.x < 0) wrappedHead.x = COLS - 1;
                if (wrappedHead.x >= COLS) wrappedHead.x = 0;
                if (wrappedHead.y < 0) wrappedHead.y = ROWS - 1;
                if (wrappedHead.y >= ROWS) wrappedHead.y = 0;

                const headCollidesWithBody = snake.some((segment, index) =>
                    index > 0 && segment.x === wrappedHead.x && segment.y === wrappedHead.y
                );

                if (headCollidesWithBody) {
                    handleGameOver();
                    return;
                }

                snake.unshift(wrappedHead);

                if (wrappedHead.x === food.x && wrappedHead.y === food.y) {
                    score++;
                    updateScoreDisplay();
                    playEatSound();
                    spawnFood();
                    if (score % 5 === 0) {
                        currentSpeed = Math.max(50, currentSpeed - 8);
                        restartLoop();
                    }
                } else {
                    snake.pop();
                    playMoveSound();
                }

                draw();
            }

            function handleGameOver() {
                gameOver = true;
                gameRunning = false;
                playDeathSound();
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                draw();

                overlayScore.textContent = `Điểm: ${score} | Kỷ lục: ${highScore}`;
                overlayScore.style.display = 'block';
                overlay.querySelector('.overlay-title').textContent = '💀 GAME OVER';
                overlay.querySelector('.overlay-subtitle').textContent = 'Bạn đã thua cuộc!';
                overlay.querySelector('.overlay-icon').textContent = '😵';
                startBtn.textContent = '🔄 Chơi Lại';
                overlay.classList.remove('hidden');
            }

            function restartLoop() {
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                if (gameRunning && !gamePaused && !gameOver) {
                    gameLoop = setInterval(update, currentSpeed);
                }
            }

            // ==================== ĐIỀU KHIỂN ====================
            function setDirection(newX, newY) {
                if (!gameRunning || gamePaused || gameOver) return;
                if (direction.x === -newX && direction.y === -newY) return;
                if (direction.x === newX && direction.y === newY) return;
                nextDirection = { x: newX, y: newY };
            }

            function startGame() {
                initGame();
                gameRunning = true;
                gamePaused = false;
                gameOver = false;
                overlay.classList.add('hidden');
                overlayScore.style.display = 'none';
                startBtn.textContent = '▶ Bắt Đầu';
                overlay.querySelector('.overlay-title').textContent = 'SNAKE GAME';
                overlay.querySelector('.overlay-subtitle').textContent = 'Kinh điển • Thư giãn • Gây nghiện';
                overlay.querySelector('.overlay-icon').textContent = '🐍';
                draw();
                restartLoop();
            }

            function togglePause() {
                if (!gameRunning || gameOver) return;
                gamePaused = !gamePaused;
                if (gamePaused) {
                    if (gameLoop) {
                        clearInterval(gameLoop);
                        gameLoop = null;
                    }
                    overlayScore.textContent = `Điểm: ${score} | Kỷ lục: ${highScore}`;
                    overlayScore.style.display = 'block';
                    overlay.querySelector('.overlay-title').textContent = '⏸️ TẠM DỪNG';
                    overlay.querySelector('.overlay-subtitle').textContent = 'Nhấn P hoặc nút bên dưới để tiếp tục';
                    overlay.querySelector('.overlay-icon').textContent = '⏸️';
                    startBtn.textContent = '▶ Tiếp Tục';
                    overlay.classList.remove('hidden');
                } else {
                    overlay.classList.add('hidden');
                    overlayScore.style.display = 'none';
                    restartLoop();
                }
            }

            // ==================== SỰ KIỆN ====================
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();

                if (key === 'arrowup' || key === 'w') {
                    e.preventDefault();
                    setDirection(0, -1);
                } else if (key === 'arrowdown' || key === 's') {
                    e.preventDefault();
                    setDirection(0, 1);
                } else if (key === 'arrowleft' || key === 'a') {
                    e.preventDefault();
                    setDirection(-1, 0);
                } else if (key === 'arrowright' || key === 'd') {
                    e.preventDefault();
                    setDirection(1, 0);
                } else if (key === 'p') {
                    e.preventDefault();
                    togglePause();
                } else if (key === ' ') {
                    e.preventDefault();
                    if (gameOver || !gameRunning) {
                        startGame();
                    }
                } else if (key === 'enter') {
                    e.preventDefault();
                    if (gameOver || !gameRunning) {
                        startGame();
                    }
                }
            });

            startBtn.addEventListener('click', () => {
                if (gamePaused) {
                    togglePause();
                } else {
                    startGame();
                }
            });

            canvas.addEventListener('click', () => {
                if (gamePaused) {
                    togglePause();
                } else if (!gameRunning || gameOver) {
                    startGame();
                }
            });

            document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
            document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
            document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
            document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));

            canvas.addEventListener('touchstart', (e) => e.preventDefault());
            canvas.addEventListener('touchmove', (e) => e.preventDefault());

            // ==================== KHỞI ĐỘNG ====================
            highScoreElement.textContent = highScore;
            initGame();
            draw();
            overlay.classList.remove('hidden');
            startBtn.textContent = '▶ Bắt Đầu';
            overlay.querySelector('.overlay-title').textContent = 'SNAKE GAME';
            overlay.querySelector('.overlay-subtitle').textContent = 'Kinh điển • Thư giãn • Gây nghiện';
            overlay.querySelector('.overlay-icon').textContent = '🐍';

            console.log('🐍 Snake Game đã sẵn sàng!');
        })();
    </script>
</body>
</html>

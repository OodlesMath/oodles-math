<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Quest V10 - Beautiful Background Only</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern, friendly Poppins font */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #48b1fa 0%, #87cefa 35%, #d7f4fc 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Lock scrollbar to act as a perfect background */
        }

        /* ----- SKY ELEMENTS ----- */
        .sun {
            position: fixed;
            top: 8%;
            left: 10%;
            width: 120px;
            height: 120px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4),
                        0 0 0 30px rgba(255, 215, 0, 0.2),
                        0 0 70px rgba(255, 215, 0, 0.9);
            z-index: 1;
            animation: pulseSun 4s infinite alternate ease-in-out;
        }

        @keyframes pulseSun {
            0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4), 0 0 0 30px rgba(255, 215, 0, 0.2), 0 0 70px rgba(255, 215, 0, 0.9); }
            100% { transform: scale(1.08) rotate(10deg); box-shadow: 0 0 0 18px rgba(255, 215, 0, 0.3), 0 0 0 45px rgba(255, 215, 0, 0.1), 0 0 100px rgba(255, 255, 0, 1); }
        }

        .rainbow {
            position: fixed;
            bottom: -5vh;
            left: 50%;
            transform: translateX(-50%);
            /* Reduced sizes for the rainbow */
            width: 100vw;
            height: 100vw;
            max-width: 900px;
            max-height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                transparent 48%,
                #a881fb 48%, #a881fb 51.5%, 
                #1cb0f6 51.5%, #1cb0f6 55%, 
                #58cc02 55%, #58cc02 58.5%, 
                #ffc800 58.5%, #ffc800 62%, 
                #ff9600 62%, #ff9600 65.5%, 
                #ff4b4b 65.5%, #ff4b4b 69%, 
                transparent 69%
            );
            opacity: 0.55;
            z-index: 2;
            pointer-events: none;
        }

        .cloud { position: fixed; background: #ffffff; border-radius: 50px; z-index: 3; opacity: 0.95; pointer-events: none; box-shadow: 0 10px 25px rgba(0,0,0,0.08), inset 0 -5px 0 #eaf6ff; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: #ffffff; border-radius: 50%; }
        .cloud::before { width: 55px; height: 55px; top: -22px; left: 15px; }
        .cloud::after { width: 75px; height: 75px; top: -35px; right: 15px; }
        
        .cloud1 { width: 140px; height: 50px; top: 12%; animation: floatCloud 55s linear infinite; }
        .cloud2 { width: 200px; height: 65px; top: 28%; animation: floatCloud 70s linear infinite; animation-delay: -30s; transform: scale(0.85); opacity: 0.85; }
        .cloud3 { width: 120px; height: 45px; top: 45%; animation: floatCloud 45s linear infinite; animation-delay: -15s; transform: scale(1.15); }

        @keyframes floatCloud { 0% { left: -20%; } 100% { left: 120%; } }

        /* ----- BEAUTIFUL SCENERY (HILLS, TREES, FLOWERS) ----- */
        .scenery-layer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }

        /* Z-index layering for true depth */
        .layer-back   { z-index: 10; }
        .layer-mid    { z-index: 20; }
        .layer-front  { z-index: 30; }

        .hill-svg {
            position: absolute;
            bottom: -5px; /* Prevent tiny gaps at bottom */
            left: 0;
            width: 100%;
            height: auto;
            min-height: 25vh;
        }

        /* Animations for flora (Only applied to flowers now) */
        .sway { transform-origin: bottom center; animation: swayAnim 5s ease-in-out infinite; }
        .sway-reverse { transform-origin: bottom center; animation: swayReverseAnim 6s ease-in-out infinite; }
        .sway-fast { transform-origin: bottom center; animation: swayAnim 3.5s ease-in-out infinite; }
        
        @keyframes swayAnim {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(4deg); }
        }
        @keyframes swayReverseAnim {
            0%, 100% { transform: rotate(4deg); }
            50% { transform: rotate(-4deg); }
        }

        /* Positioning Helpers for Flora */
        .flora { position: absolute; bottom: 0; }
    </style>
</head>
<body>
    
    <!-- GLOBAL SVG DEFINITIONS -->
    <!-- Replaced 'class="hidden"' (display: none) with absolute positioning. 
         display: none breaks SVG gradient URL references in many modern browsers! -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
        <defs>
            <!-- Gradients for Hills -->
            <linearGradient id="hillGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8ce62c" />
                <stop offset="100%" stop-color="#55b300" />
            </linearGradient>
            <linearGradient id="hillGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#73d914" />
                <stop offset="100%" stop-color="#449400" />
            </linearGradient>
            <linearGradient id="hillGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#58cc02" />
                <stop offset="100%" stop-color="#2c7000" />
            </linearGradient>

            <!-- Gradients for Trees -->
            <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#5C3A21" />
                <stop offset="50%" stop-color="#8B5A2B" />
                <stop offset="100%" stop-color="#4A2F1D" />
            </linearGradient>
            <linearGradient id="canopyGradBase" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#58CC02" />
                <stop offset="100%" stop-color="#2D7A00" />
            </linearGradient>
            <linearGradient id="canopyGradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8bf836" />
                <stop offset="100%" stop-color="#58CC02" />
            </linearGradient>

            <!-- 1. Beautiful Fluffy Tree Template (V10 - Thicker Trunk) -->
            <g id="beautiful-tree">
                <!-- Enlarged shadow at base to match thicker trunk -->
                <ellipse cx="100" cy="245" rx="45" ry="12" fill="rgba(0,0,0,0.15)" />
                
                <!-- Thicker Trunk and Base -->
                <!-- Path adjusted so the base goes from X=70 to X=130 (60px wide) -->
                <path d="M70,250 C80,190 85,150 90,110 L110,110 C115,150 120,190 130,250 Z" fill="url(#trunkGrad)" />
                
                <!-- Branches -->
                <path d="M92,150 C70,130 60,110 50,100" fill="none" stroke="url(#trunkGrad)" stroke-width="8" stroke-linecap="round"/>
                <path d="M108,140 C125,120 135,110 145,95" fill="none" stroke="url(#trunkGrad)" stroke-width="7" stroke-linecap="round"/>
                
                <!-- Back Canopy (Darker Green) -->
                <path d="M100,20 C40,20 20,70 30,110 C10,120 10,170 40,180 C50,200 90,200 100,190 C110,200 150,200 160,180 C190,170 190,120 170,110 C180,70 160,20 100,20 Z" fill="url(#canopyGradBase)" />
                
                <!-- Front Canopy Highlights (Lighter Green, shifted up and left) -->
                <path d="M95,25 C45,25 25,70 35,105 C15,115 15,155 45,165 C55,180 85,180 95,175 C105,180 145,180 155,165 C180,155 180,115 165,105 C175,70 155,25 95,25 Z" fill="url(#canopyGradHighlight)" opacity="0.9"/>
                
                <!-- Leaf Texture / Highlights -->
                <circle cx="70" cy="65" r="12" fill="#a4f763" opacity="0.7"/>
                <circle cx="120" cy="70" r="9" fill="#a4f763" opacity="0.7"/>
                <circle cx="145" cy="110" r="14" fill="#a4f763" opacity="0.6"/>
                <circle cx="50" cy="120" r="10" fill="#a4f763" opacity="0.6"/>
                <circle cx="95" cy="145" r="16" fill="#a4f763" opacity="0.5"/>
            </g>

            <!-- 2. Beautiful Flower: Daisy -->
            <g id="flower-daisy">
                <path d="M20,60 Q25,30 20,10" stroke="#3A8A00" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M20,40 Q10,35 5,25 Q15,30 20,40" fill="#46A302" />
                <path d="M20,45 Q30,40 35,30 Q25,35 20,45" fill="#46A302" />
                <g fill="#ffffff" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))">
                    <ellipse cx="20" cy="5" rx="4" ry="10" />
                    <ellipse cx="20" cy="25" rx="4" ry="10" />
                    <ellipse cx="10" cy="15" rx="10" ry="4" />
                    <ellipse cx="30" cy="15" rx="10" ry="4" />
                    <ellipse cx="13" cy="8" rx="8" ry="4" transform="rotate(45 13 8)"/>
                    <ellipse cx="27" cy="22" rx="8" ry="4" transform="rotate(45 27 22)"/>
                    <ellipse cx="27" cy="8" rx="8" ry="4" transform="rotate(-45 27 8)"/>
                    <ellipse cx="13" cy="22" rx="8" ry="4" transform="rotate(-45 13 22)"/>
                </g>
                <circle cx="20" cy="15" r="5" fill="#FFD700" stroke="#E5B400" stroke-width="1.5"/>
            </g>

            <!-- 3. Beautiful Flower: Pink Tulip -->
            <g id="flower-tulip">
                <path d="M20,60 Q18,35 20,15" stroke="#3A8A00" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M20,50 Q10,30 10,15 Q18,35 20,50" fill="#46A302" />
                <path d="M20,55 Q32,35 32,20 Q22,40 20,55" fill="#46A302" />
                <path d="M10,15 C10,30 30,30 30,15 C25,25 20,10 20,10 C20,10 15,25 10,15 Z" fill="#FF6B8B" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.15))"/>
                <path d="M12,16 C15,25 25,25 28,16 C23,22 20,12 20,12 C20,12 17,22 12,16 Z" fill="#FF9EAF" />
            </g>

            <!-- 4. Beautiful Flower: Blue Starflower -->
            <g id="flower-star">
                <path d="M20,60 Q22,35 20,15" stroke="#3A8A00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M20,35 Q10,30 5,20 Q15,25 20,35" fill="#46A302" />
                <path d="M20,42 Q30,37 35,27 Q25,32 20,42" fill="#46A302" />
                <g fill="#1CB0F6" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.15))">
                    <path d="M20,15 L23,5 L26,15 L36,18 L26,21 L23,31 L20,21 L10,18 Z" />
                </g>
                <circle cx="23" cy="18" r="3" fill="#ffffff" />
            </g>
        </defs>
    </svg>

    <!-- Sky Elements -->
    <div class="sun"></div>
    <div class="rainbow"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    
    <!-- BACK LAYER -->
    <div class="scenery-layer layer-back h-[35vh]">
        <!-- Smooth Back Hill -->
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="hill-svg h-full">
            <path fill="url(#hillGradBack)" d="M0,120 C320,280, 500,20, 1440,160 L1440,320 L0,320 Z"></path>
        </svg>

        <!-- Back Trees (Animation Removed for sturdy trunks) -->
        <div class="flora" style="left: 12%; bottom: 30%; width: 120px; height: 150px;">
            <svg viewBox="0 0 200 250" class="w-full h-full"><use href="#beautiful-tree" /></svg>
        </div>
        <div class="flora" style="left: 65%; bottom: 45%; width: 90px; height: 110px;">
            <svg viewBox="0 0 200 250" class="w-full h-full"><use href="#beautiful-tree" /></svg>
        </div>
        
        <!-- Back Flowers (Animation Kept) -->
        <div class="flora sway-fast" style="left: 25%; bottom: 35%; width: 30px; height: 45px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-daisy" /></svg>
        </div>
        <div class="flora sway" style="left: 55%; bottom: 48%; width: 25px; height: 40px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-star" /></svg>
        </div>
        <div class="flora sway-reverse" style="left: 85%; bottom: 30%; width: 35px; height: 50px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-tulip" /></svg>
        </div>
    </div>

    <!-- MID LAYER -->
    <div class="scenery-layer layer-mid h-[28vh]">
        <!-- Smooth Mid Hill -->
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="hill-svg h-full">
            <path fill="url(#hillGradMid)" d="M0,220 C450,50, 850,300, 1440,120 L1440,320 L0,320 Z"></path>
        </svg>

        <!-- Mid Trees (Animation Removed for sturdy trunks) -->
        <div class="flora" style="left: 28%; bottom: 15%; width: 150px; height: 180px;">
            <svg viewBox="0 0 200 250" class="w-full h-full"><use href="#beautiful-tree" /></svg>
        </div>
        <div class="flora" style="left: 80%; bottom: 20%; width: 130px; height: 160px;">
            <svg viewBox="0 0 200 250" class="w-full h-full"><use href="#beautiful-tree" /></svg>
        </div>

        <!-- Mid Flowers (Animation Kept) -->
        <div class="flora sway" style="left: 15%; bottom: 25%; width: 35px; height: 50px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-tulip" /></svg>
        </div>
        <div class="flora sway-fast" style="left: 45%; bottom: 35%; width: 30px; height: 45px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-daisy" /></svg>
        </div>
        <div class="flora sway-reverse" style="left: 70%; bottom: 28%; width: 32px; height: 48px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-star" /></svg>
        </div>
        <div class="flora sway" style="left: 92%; bottom: 15%; width: 40px; height: 60px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-daisy" /></svg>
        </div>
    </div>

    <!-- FRONT LAYER -->
    <div class="scenery-layer layer-front h-[20vh]">
        <!-- Smooth Front Hill -->
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="hill-svg h-full">
            <path fill="url(#hillGradFront)" d="M0,250 C400,320, 900,100, 1440,260 L1440,320 L0,320 Z"></path>
        </svg>

        <!-- Front Big Trees (Pushed far to sides to frame the view, Animation Removed) -->
        <div class="flora" style="left: 2%; bottom: 5%; width: 180px; height: 220px;">
            <svg viewBox="0 0 200 250" class="w-full h-full"><use href="#beautiful-tree" /></svg>
        </div>
        <div class="flora" style="left: 88%; bottom: 2%; width: 200px; height: 250px;">
            <svg viewBox="0 0 200 250" class="w-full h-full"><use href="#beautiful-tree" /></svg>
        </div>

        <!-- Front Detailed Flowers (Animation Kept) -->
        <div class="flora sway-reverse" style="left: 10%; bottom: 10%; width: 40px; height: 60px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-star" /></svg>
        </div>
        <div class="flora sway-fast" style="left: 22%; bottom: 5%; width: 45px; height: 70px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-daisy" /></svg>
        </div>
        <div class="flora sway" style="left: 35%; bottom: 18%; width: 38px; height: 55px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-tulip" /></svg>
        </div>
        <div class="flora sway-reverse" style="left: 50%; bottom: 8%; width: 45px; height: 70px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-star" /></svg>
        </div>
        <div class="flora sway-fast" style="left: 65%; bottom: 15%; width: 40px; height: 60px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-daisy" /></svg>
        </div>
        <div class="flora sway" style="left: 78%; bottom: 5%; width: 42px; height: 65px;">
            <svg viewBox="0 0 40 60" class="w-full h-full"><use href="#flower-tulip" /></svg>
        </div>
    </div>

</body>
</html>

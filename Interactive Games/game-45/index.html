    <style>
        :root {
            --sky-top: #1cb0f6;
            --sky-bottom: #89d4fb;
            --hill-back: #2ebd59;
            --hill-front: #58cc02;

        }

        body {

            margin: 0;
            padding: 0;
            overflow: hidden;

            background: var(--sky-bottom);
        }

        /* --- BACKGROUND --- */
        #bg-container {
            position: fixed;
            pointer-events: none;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
            z-index: 0;
            overflow: hidden;
        }

        .hill {
            position: absolute;
            bottom: 10%;
            width: 150%;
            height: 40%;
            border-radius: 100% 100% 0 0;
        }
        .hill-back {
            left: -20%;
            background:
                radial-gradient(ellipse at 30% 6%, rgba(179, 237, 135, .45), transparent 62%),
                linear-gradient(175deg, #65c976 0%, #3db760 44%, #279652 100%);
            box-shadow: inset 0 3px 1px rgba(213, 250, 177, .22);
            transform: rotate(-5deg);
            z-index: 1;
        }
        .hill-front {
            left: -10%;
            background:
                radial-gradient(ellipse at 28% 8%, rgba(210, 245, 127, .46), transparent 59%),
                linear-gradient(176deg, #83d740 0%, #64c52d 38%, #49aa27 77%, #379629 100%);
            box-shadow: inset 0 3px 1px rgba(222, 253, 150, .45);
            transform: rotate(3deg);
            z-index: 2;
        }

        .sun {
            position: absolute;
            top: 5vh;
            left: 5vw;
            width: 120px; height: 120px;
            background: #facc15;
            border-radius: 50%;
            box-shadow: 0 0 0 15px rgba(250, 204, 21, 0.3), 0 0 0 30px rgba(250, 204, 21, 0.1);
            z-index: 1;
            animation: pulse 4s infinite alternate;
        }

        .cloud-container { position: absolute; pointer-events: none; z-index: 2; }
        .cloud-shape { width: 140px; height: 50px; background: white; border-radius: 50px; position: relative; }
        .cloud-shape::after, .cloud-shape::before { content: ''; position: absolute; background: white; border-radius: 50%; }
        .cloud-shape::after { width: 70px; height: 70px; top: -35px; left: 20px; }
        .cloud-shape::before { width: 60px; height: 60px; top: -25px; right: 20px; }

        .cloud-move-1 { animation: float 40s infinite linear; top: 15%; opacity: 0.9;}
        .cloud-move-2 { animation: float 55s infinite linear reverse; top: 25%; opacity: 0.7;}

        @keyframes float { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.05); } }

        /* Dòng sông thuộc background; không chặn thao tác của game đặt phía trên. */
        #river-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 10;
        }

        @media (max-width: 600px) {
            .sun {
                width: 80px;
                height: 80px;
                box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.3),
                            0 0 0 20px rgba(250, 204, 21, 0.1);
            }
        }
    </style>

        </div>
        <canvas id="river-canvas"></canvas>
    </div>

    <!-- Thêm nội dung game tại đây, đặt position: relative và z-index: 1. -->

    <script>
        (() => {
            'use strict';

            const canvas = document.getElementById('river-canvas');
            const ctx = canvas.getContext('2d');
            let width = 0;
            let height = 0;
            let time = 0;

            // ver3: cây và hoa thuộc lớp riêng, không nằm trong stacking context của đồi.
            const hills = Array.from(document.querySelectorAll('.hill'));
            const trees = Array.from(document.querySelectorAll('#trees-layer .tree'));
            const flowers = Array.from(document.querySelectorAll('#flowers-layer .flower'));
            const butterflies = Array.from(document.querySelectorAll('.butterfly')).map((el) => ({
                el, xRatio: Number(el.dataset.x), lift: Number(el.dataset.lift),
                phase: Number(el.dataset.phase), baseX: 0, baseY: 0
            }));
            const rainbow = document.querySelector('.rainbow');
            let grassContours = [];

            function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }

            // Mép trên của border-radius: 100% 100% 0 0 là nửa ellipse.
            // Áp dụng đúng phép xoay của từng đồi để gốc cây bám vào mặt cỏ.
            function contourForHill(hill) {
                const style = getComputedStyle(hill);
                const w = parseFloat(style.width);
                const h = parseFloat(style.height);
                const left = hill.offsetLeft;
                const top = hill.offsetTop;
                const matrix = new DOMMatrixReadOnly(style.transform === 'none' ? undefined : style.transform);
                const points = [];
                for (let i = 0; i <= 160; i++) {
                    const angle = Math.PI + i / 160 * Math.PI;
                    const dx = w / 2 * Math.cos(angle);
                    const dy = h / 2 * Math.sin(angle);
                    points.push({
                        x: left + w / 2 + matrix.a * dx + matrix.c * dy,
                        y: top + h / 2 + matrix.b * dx + matrix.d * dy
                    });
                }
                return points;
            }

            function grassTopAt(x) {
                let surface = Infinity;
                for (const points of grassContours) {
                    for (let i = 1; i < points.length; i++) {
                        const a = points[i - 1], b = points[i];
                        if (x < Math.min(a.x, b.x) || x > Math.max(a.x, b.x)) continue;
                        const span = b.x - a.x;
                        if (Math.abs(span) < .0001) continue;
                        const t = (x - a.x) / span;
                        surface = Math.min(surface, a.y + (b.y - a.y) * t);
                    }
                }
                return Number.isFinite(surface) ? surface : height;
            }

            function layoutMeadow() {
                grassContours = hills.map(contourForHill);
                const shoreline = height - (Math.max(150, height * .25) - 40);
                const sizeFit = Math.min(1, Math.max(.66, width / 650), Math.max(.70, height / 530));

                trees.forEach((tree) => {
                    const scale = Number(tree.dataset.scale) * sizeFit;
                    const margin = 44 * scale + 4;
                    let x = clamp(Number(tree.dataset.x) * width, margin, width - margin);
                    let surface = grassTopAt(x);
                    // Khi cửa sổ rất thấp, tìm phần cỏ gần nhất còn lộ phía trên mặt nước.
                    if (surface + 10 > shoreline - 12) {
                        const preferredX = x;
                        let nearest = Infinity;
                        for (let probe = margin; probe <= width - margin; probe += 8) {
                            const y = grassTopAt(probe);
                            if (y + 10 > shoreline - 12 || Math.abs(probe - preferredX) >= nearest) continue;
                            nearest = Math.abs(probe - preferredX); x = probe; surface = y;
                        }
                    }
                    const hasGrass = surface + 10 <= shoreline - 12;
                    const groundY = Math.min(surface + 11 * scale, shoreline - 12);
                    tree.style.width = 82 * scale + 'px';
                    tree.style.height = 105 * scale + 'px';
                    tree.style.left = x + 'px';
                    tree.style.top = groundY + 'px';
                    tree.style.zIndex = String(Math.round(groundY));
                    tree.style.visibility = hasGrass ? 'visible' : 'hidden';
                });

                flowers.forEach((flower) => {
                    const x = clamp(Number(flower.dataset.x) * width, 16, width - 16);
                    // Đặt toàn bộ cuống và lá trên cỏ, chừa khoảng cách với bờ nước.
                    const top = grassTopAt(x) + 34;
                    const bottom = shoreline - 12;
                    flower.style.left = x + 'px';
                    flower.style.top = top + Math.max(0, bottom - top) * Number(flower.dataset.depth) + 'px';
                    flower.style.visibility = top <= bottom ? 'visible' : 'hidden';
                });

                const rainbowWidth = Math.min(740, Math.max(230, width * .46));
                const rainbowX = width * .98 - rainbowWidth / 2;
                const rainbowBase = grassTopAt(rainbowX) + Math.min(30, rainbowWidth * .055);
                rainbow.style.top = rainbowBase - rainbowWidth * 374 / 720 + 'px';

                butterflies.forEach((butterfly) => {
                    butterfly.baseX = butterfly.xRatio * width;
                    butterfly.baseY = Math.max(38, grassTopAt(butterfly.baseX) - butterfly.lift * sizeFit);
                    butterfly.el.style.visibility = 'visible';
                });
                animateButterflies();
            }

            function animateButterflies() {
                const range = Math.min(48, width * .065);
                butterflies.forEach((butterfly) => {
                    const phase = butterfly.phase;
                    const x = clamp(butterfly.baseX + Math.sin(time * .53 + phase) * range
                        + Math.sin(time * 1.07 + phase) * range * .17, 22, width - 22);
                    const y = Math.max(20, butterfly.baseY + Math.sin(time * .83 + phase) * 18
                        + Math.cos(time * .39 + phase) * 8);
                    const tilt = Math.sin(time * .67 + phase) * 14;
                    butterfly.el.style.transform = 'translate(' + (x - 17.5) + 'px, ' + (y - 13.675)
                        + 'px) rotate(' + tilt + 'deg)';
                });
            }

            function resizeBackground() {
                width = window.innerWidth;
                height = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                layoutMeadow();
                drawRiver();
            }

            // ver2: nước có chiều sâu, phản chiếu và gợn nhỏ; giữ nguyên vị trí dòng sông.
            const ripples = Array.from({ length: 62 }, (_, i) => ({
                x: ((i * 0.61803398875) % 1),
                depth: 0.035 + ((i * 0.41421356237) % 1) * 0.94,
                size: 0.35 + ((i * 0.73205080757) % 1) * 0.65,
                phase: i * 1.73
            }));
            let waterPalette;
            let paletteWidth = -1;
            let paletteHeight = -1;

            function shoreY(x, yOffset) {
                return yOffset + Math.sin(x * 0.011 - time * 0.45) * 1.7
                    + Math.sin(x * 0.029 + time * 0.3) * 0.55;
            }

            function traceShore(yOffset) {
                ctx.moveTo(-10, shoreY(-10, yOffset));
                for (let x = 0; x <= width + 10; x += 8) {
                    ctx.lineTo(x, shoreY(x, yOffset));
                }
            }

            function drawRiver() {
                const riverHeight = Math.max(150, height * 0.25) - 40;
                const yOffset = height - riverHeight;
                ctx.clearRect(0, 0, width, height);

                // Tạo lại màu chuyển khi đổi kích thước, dùng lại ở các khung hình sau.
                if (paletteWidth !== width || paletteHeight !== height) {
                    paletteWidth = width;
                    paletteHeight = height;
                    const depth = ctx.createLinearGradient(0, yOffset, 0, height);
                    depth.addColorStop(0, '#43bbca');
                    depth.addColorStop(.15, '#2badc6');
                    depth.addColorStop(.48, '#219dc5');
                    depth.addColorStop(1, '#087caf');
                    const bank = ctx.createLinearGradient(0, yOffset, 0, yOffset + 26);
                    bank.addColorStop(0, 'rgba(69, 132, 66, .20)');
                    bank.addColorStop(1, 'rgba(69, 132, 66, 0)');
                    const reflection = ctx.createRadialGradient(
                        width * .09, yOffset, 0,
                        width * .09, yOffset, Math.max(width * .38, riverHeight * 1.6)
                    );
                    reflection.addColorStop(0, 'rgba(239, 253, 207, .19)');
                    reflection.addColorStop(.36, 'rgba(194, 247, 232, .07)');
                    reflection.addColorStop(1, 'rgba(155, 223, 235, 0)');
                    waterPalette = { depth, bank, reflection };
                }

                ctx.save();
                ctx.beginPath();
                traceShore(yOffset);
                ctx.lineTo(width + 10, height + 10);
                ctx.lineTo(-10, height + 10);
                ctx.closePath();
                ctx.clip();
                ctx.fillStyle = waterPalette.depth;
                ctx.fillRect(0, yOffset - 5, width, riverHeight + 10);
                ctx.fillStyle = waterPalette.bank;
                ctx.fillRect(0, yOffset - 5, width, 35);
                ctx.fillStyle = waterPalette.reflection;
                ctx.fillRect(0, yOffset - 5, width, riverHeight + 10);

                // Các dải phản chiếu mỏng, hòa vào mặt nước.
                for (let layer = 0; layer < 3; layer++) {
                    const bandY = yOffset + riverHeight * (.24 + layer * .27);
                    ctx.beginPath();
                    for (let x = -10; x <= width + 10; x += 10) {
                        const y = bandY + Math.sin(x * .006 + time * (.20 + layer * .08)) * 4;
                        if (x === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    }
                    for (let x = width + 10; x >= -10; x -= 10) {
                        const y = bandY + 8 + layer * 2 + Math.sin(x * .006 + time * (.20 + layer * .08) + .35) * 4;
                        ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = layer % 2 ? 'rgba(184, 241, 240, .08)' : 'rgba(9, 111, 160, .055)';
                    ctx.fill();
                }

                ctx.lineCap = 'round';
                const count = Math.max(20, Math.min(ripples.length, Math.ceil(width / 20)));
                for (let i = 0; i < count; i++) {
                    const ripple = ripples[i];
                    const d = ripple.depth;
                    const x = (ripple.x * (width + 120) + time * (3 + d * 4)) % (width + 120) - 60;
                    const y = yOffset + d * riverHeight + Math.sin(time * .52 + ripple.phase) * (1 + d);
                    const length = (8 + 35 * d) * ripple.size;
                    const alpha = .12 + .11 * (.5 + .5 * Math.sin(time * .7 + ripple.phase));
                    ctx.strokeStyle = 'rgba(206, 250, 251, ' + alpha + ')';
                    ctx.lineWidth = .7 + d * .75;
                    ctx.beginPath();
                    ctx.moveTo(x - length / 2, y);
                    ctx.quadraticCurveTo(x, y + .6 + d, x + length / 2, y);
                    ctx.stroke();

                    if (i % 4 === 0) {
                        ctx.strokeStyle = 'rgba(230, 255, 247, ' + (alpha * .7) + ')';
                        ctx.lineWidth = .65;
                        ctx.beginPath();
                        ctx.moveTo(x - length * .12, y + 3 + d * 2);
                        ctx.lineTo(x + length * .32, y + 3 + d * 2);
                        ctx.stroke();
                    }
                }
                ctx.restore();

                // Viền nước sát bờ rất mảnh, thay cho các chấm bọt tròn.
                ctx.beginPath();
                traceShore(yOffset);
                ctx.strokeStyle = 'rgba(216, 249, 203, .48)';
                ctx.lineWidth = 1.1;
                ctx.stroke();
            }

            const startedAt = performance.now();
            function animateBackground(now) {
                time = (now - startedAt) / 1000 * 0.96;
                drawRiver();
                animateButterflies();
                requestAnimationFrame(animateBackground);
            }

            window.addEventListener('resize', resizeBackground);
            resizeBackground();
            requestAnimationFrame(animateBackground);
        })();
    </script>

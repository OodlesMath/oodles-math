    <style>
        body {
            overflow: hidden; /* Ngăn cuộn trang */
            touch-action: manipulation;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .scale-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes drawCross {
            0% { stroke-dasharray: 40; stroke-dashoffset: 40; }
            100% { stroke-dasharray: 40; stroke-dashoffset: 0; }
        }
        .animate-draw-cross line {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: drawCross 0.3s ease-out forwards;
        }

        @keyframes bounceShort {
            0%, 100% { transform: translateY(0) scale(1.05); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .animate-bounce-short {
            animation: bounceShort 0.5s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* 3D Button styles */
        .btn-3d {
            transition: all 0.1s;
        }
        .btn-3d:active {
            transform: translateY(4px) !important;
            border-bottom-width: 0px !important;
            margin-top: 4px;
        }

        .speaker-icon {
            transition: transform 0.2s;
        }
        .speaker-icon:hover {
            transform: scale(1.1);
        }
        .speaker-icon:active {
            transform: scale(0.9);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                90deg,
                rgba(255,255,255,0.03) 0%,
                rgba(255,255,255,0.10) 45%,
                rgba(255,255,255,0.03) 100%
            );
            z-index: 0;
        }

        #app-shell {
            z-index: 2;
            background: rgba(255,255,255,0.76) !important;
            border: 3px solid rgba(255,255,255,0.92) !important;
            border-bottom-width: 8px !important;
            border-bottom-color: rgba(42,89,36,0.18) !important;
            box-shadow:
                0 24px 60px rgba(30, 64, 175, 0.16),
                0 8px 20px rgba(34, 197, 94, 0.10) !important;
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        #app-shell > header {
            background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.56));
            border-bottom: 2px solid rgba(255,255,255,0.72);
        }

        #math-icon {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #ffb52e 0%, #ff7a18 100%) !important;
            border: 3px solid rgba(255,255,255,0.94) !important;
            border-bottom: 6px solid #d9640b !important;
            box-shadow: 0 7px 16px rgba(249,115,22,.24);
            text-shadow: 0 2px 2px rgba(0,0,0,.12);
            transform: rotate(-3deg);
        }

        #math-icon::after {
            content: "";
            position: absolute;
            width: 60%;
            height: 45%;
            top: -10%;
            left: 8%;
            border-radius: 50%;
            background: rgba(255,255,255,.34);
            transform: rotate(-20deg);
        }

        #score-card {
            background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,249,215,.94)) !important;
            border: 3px solid #fde68a !important;
            box-shadow: 0 6px 0 #f7c948, 0 10px 22px rgba(245,158,11,.14);
        }

        #question-panel {
            background: linear-gradient(155deg, rgba(255,255,255,.91), rgba(255,250,232,.84)) !important;
            border: 4px solid rgba(255,255,255,.92) !important;
            box-shadow: inset 0 0 0 2px rgba(253,230,138,.45), 0 12px 26px rgba(30,64,175,.08);
        }

        #frames-panel {
            background: linear-gradient(155deg, rgba(239,249,255,.92), rgba(245,255,240,.86)) !important;
            border: 4px solid rgba(255,255,255,.92) !important;
            box-shadow: inset 0 0 0 2px rgba(125,211,252,.34), 0 12px 26px rgba(14,165,233,.08);
        }

        #equation {
            color: #25446f;
            text-shadow: 0 3px 0 rgba(255,255,255,.95), 0 5px 10px rgba(30,64,175,.12);
        }

        .speaker-icon {
            background: linear-gradient(145deg, #43c7ff, #149be1) !important;
            border: 3px solid white !important;
            border-bottom: 6px solid #087ebb !important;
            box-shadow: 0 8px 16px rgba(14,165,233,.22) !important;
            position: relative;
            overflow: hidden;
        }

        .speaker-icon::after {
            content: "";
            position: absolute;
            width: 60%;
            height: 36%;
            top: 4%;
            left: 10%;
            background: rgba(255,255,255,.30);
            border-radius: 50%;
            transform: rotate(-18deg);
            pointer-events: none;
        }

        #number-bond-container svg line {
            stroke: #9fb7c9;
            filter: drop-shadow(0 2px 0 rgba(255,255,255,.9));
        }

        #nb-whole, #nb-part1, #nb-part2, #nb-part3 {
            box-shadow:
                inset 0 5px 0 rgba(255,255,255,.68),
                0 7px 0 rgba(100,116,139,.12),
                0 12px 20px rgba(30,64,175,.10) !important;
        }

        #nb-whole {
            background: linear-gradient(145deg,#ffffff,#f5efff) !important;
        }
        #nb-part1 {
            background: linear-gradient(145deg,#ffffff,#eaf8ff) !important;
        }
        #nb-part2 {
            background: linear-gradient(145deg,#ffffff,#efffe9) !important;
        }
        #nb-part3 {
            background: linear-gradient(145deg,#ffffff,#fff4e6) !important;
        }

        #options-container button {
            min-height: 64px;
            border: 3px solid rgba(255,255,255,.88) !important;
            letter-spacing: .02em;
            text-shadow: 0 2px 2px rgba(0,0,0,.12);
            box-shadow: 0 7px 0 rgba(15,23,42,.16), 0 10px 18px rgba(30,64,175,.10) !important;
        }

        #options-container button:not(:disabled):nth-child(1) {
            background: linear-gradient(145deg,#9b7cf7,#7857e8) !important;
            border-bottom-color: #5f42c7 !important;
        }
        #options-container button:not(:disabled):nth-child(2) {
            background: linear-gradient(145deg,#42c8f5,#1aa7e5) !important;
            border-bottom-color: #0a82bb !important;
        }
        #options-container button:not(:disabled):nth-child(3) {
            background: linear-gradient(145deg,#ff78b7,#ec4899) !important;
            border-bottom-color: #be185d !important;
        }
        #options-container button:not(:disabled):nth-child(4) {
            background: linear-gradient(145deg,#ffb347,#f97316) !important;
            border-bottom-color: #c2410c !important;
        }

        #options-container button:not(:disabled):hover {
            transform: translateY(-2px) scale(1.025);
            filter: brightness(1.04);
        }

    <script>
        // --- Sound Effects ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            try {
                if (!AudioContext) return null;
                if (!audioCtx) audioCtx = new AudioContext();
                return audioCtx;
            } catch (e) {
                console.warn('Audio is waiting for a user gesture.', e);
                return null;
            }
        }

        const playSuccessSound = () => {
            const ctx = initAudio();
            if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1);
            } catch(e) {}
        };

        const playErrorSound = () => {
            const ctx = initAudio();
            if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        };

        // --- Speech Synthesis ---
        const synth = window.speechSynthesis;
        function speakCurrentQuestion() {
            if (!nums) return;
            synth.cancel(); // Stop current speech
            let text = '';

            if (mode === 'add') {
                text = `${nums.a} plus ${nums.b} plus ${nums.c}`;
            } else {
                text = `${nums.total} minus ${nums.a} minus ${nums.b}`;
            }

            // Add "equals" when answered correctly
            if (selectedOption !== null && selectedOption === nums.answer) {
                text += ` equals ${nums.answer}`;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; // Slightly slower for kids
            utterance.pitch = 1.2;
            synth.speak(utterance);
        }

        // --- Confetti Logic (Using canvas-confetti) ---
        function fireConfetti() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                // Fire from left
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                // Fire from right
                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        // --- Game State ---
        const MAX_QUESTIONS = 10;
        let score = 0;
        let questionCount = 0;
        let mode = 'add';
        let nums = null;
        let options = [];
        let selectedOption = null;
        let animStep = 0; // Represents the "chunk/group" stage
        let history = new Set();
        let animTimeouts = [];

        // --- Core Logic ---
        function generateMathQuestion(qIndex) {
            const isAdd = Math.random() > 0.5;
            const isHard = qIndex >= 8; // Câu hỏi 9 và 10 sẽ khó hơn

            if (isAdd) {
                if (!isHard) {
                    // Dễ: 2 chữ số (10-20) + 1 chữ số (1-9) + 1 chữ số (1-9) => Dạng ab + c + d
                    let a = Math.floor(Math.random() * 11) + 10; // 10 đến 20
                    let b = Math.floor(Math.random() * 9) + 1;   // 1 đến 9
                    let maxC = 40 - a - b;
                    let c = Math.floor(Math.random() * Math.min(9, maxC)) + 1; // 1 đến 9
                    let total = a + b + c;
                    return { mode: 'add', a, b, c, total, answer: total };
                } else {
                    // Khó: 2 chữ số + 2 chữ số + 1 chữ số
                    let a = Math.floor(Math.random() * 6) + 10; // 10 đến 15
                    let b = Math.floor(Math.random() * 6) + 10; // 10 đến 15
                    let maxC = 40 - a - b;
                    let c = Math.floor(Math.random() * Math.min(9, maxC)) + 1;
                    let total = a + b + c;
                    return { mode: 'add', a, b, c, total, answer: total };
                }
            } else {
                if (!isHard) {
                    // Dễ: Tổng 2 chữ số (20-30) - 1 chữ số - 1 chữ số => Dạng ef - g - h
                    let total = Math.floor(Math.random() * 11) + 20; // 20 đến 30
                    let a = Math.floor(Math.random() * 9) + 1; // 1 đến 9
                    let b = Math.floor(Math.random() * 9) + 1; // 1 đến 9
                    let c = total - a - b;
                    return { mode: 'sub', a, b, c, total, answer: c };
                } else {
                    // Khó: Tổng 2 chữ số (30-40) - 2 chữ số - 1 chữ số
                    let total = Math.floor(Math.random() * 11) + 30; // 30 đến 40
                    let a = Math.floor(Math.random() * 6) + 10; // 10 đến 15
                    let b = Math.floor(Math.random() * 5) + 5;  // 5 đến 9

                    // Trộn vị trí a, b cho phong phú
                    if (Math.random() > 0.5) {
                        let temp = a; a = b; b = temp;
                    }

                    let c = total - a - b;
                    return { mode: 'sub', a, b, c, total, answer: c };
                }
            }
        }

        function getUniqueQuestion(qIndex) {
            let q;
            let qStr;
            let attempts = 0;
            do {
                q = generateMathQuestion(qIndex);
                qStr = q.mode === 'add' ? `add_${q.a}_${q.b}_${q.c}` : `sub_${q.total}_${q.a}_${q.b}`;
                attempts++;
            } while (history.has(qStr) && attempts < 100);
            history.add(qStr);
            return q;
        }

        function generateOptions(correctAnswer) {
            const opts = new Set([correctAnswer]);
            while (opts.size < 4) {
                let offset = Math.floor(Math.random() * 11) - 5;
                if (offset === 0) continue;
                let opt = correctAnswer + offset;
                if (opt >= 0 && opt <= 50) {
                    opts.add(opt);
                }
            }
            return Array.from(opts).sort(() => Math.random() - 0.5);
        }

        // --- Render Functions ---
        function updateUI() {
            // Update Score & Progress
            document.getElementById('score-text').innerText = score;
            const progressPercent = (questionCount / MAX_QUESTIONS) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // Equation
            const eqEl = document.getElementById('equation');
            if (mode === 'add') {
                eqEl.innerHTML = `
                    <span class="text-duo-blue">${nums.a}</span> +
                    <span class="text-duo-green">${nums.b}</span> +
                    <span class="text-duo-orange">${nums.c}</span> =
                    <span class="${selectedOption !== null ? (selectedOption === nums.answer ? 'text-duo-green' : 'text-duo-red') : 'text-slate-400'}">
                        ${selectedOption !== null ? nums.answer : '?'}
                    </span>`;
            } else {
                eqEl.innerHTML = `
                    <span class="text-duo-purple">${nums.total}</span> -
                    <span class="text-duo-red">${nums.a}</span> -
                    <span class="text-duo-blue">${nums.b}</span> =
                    <span class="${selectedOption !== null ? (selectedOption === nums.answer ? 'text-duo-green' : 'text-duo-red') : 'text-slate-400'}">
                        ${selectedOption !== null ? nums.answer : '?'}
                    </span>`;
            }

            // Number Bond
            const nbWhole = document.getElementById('nb-whole');
            const nbPart1 = document.getElementById('nb-part1');
            const nbPart2 = document.getElementById('nb-part2');
            const nbPart3 = document.getElementById('nb-part3');

            nbPart1.innerText = nums.a;
            nbPart2.innerText = nums.b;

            if (mode === 'add') {
                nbWhole.innerText = selectedOption !== null ? nums.total : '?';
                nbPart3.innerText = nums.c;

                // Colorize
                nbPart1.className = nbPart1.className.replace(/border-duo-\w+ text-duo-\w+/, 'border-duo-blue text-duo-blue');
                nbPart2.className = nbPart2.className.replace(/border-duo-\w+ text-duo-\w+/, 'border-duo-green text-duo-green');
                nbPart3.className = nbPart3.className.replace(/border-duo-\w+ text-duo-\w+/, 'border-duo-orange text-duo-orange');

                if (selectedOption === nums.answer) {
                    nbWhole.className = nbWhole.className.replace(/border-duo-\w+ text-duo-\w+/, 'border-duo-green text-duo-green scale-110');
                } else {
                    nbWhole.className = nbWhole.className.replace(/border-duo-\w+ text-duo-\w+ scale-110/, 'border-duo-purple text-duo-purple');
                }
            } else {
                nbWhole.innerText = nums.total;
                nbPart3.innerText = selectedOption !== null ? nums.c : '?';

                // Colorize
                nbPart1.className = nbPart1.className.replace(/border-duo-\w+ text-duo-\w+/, 'border-duo-red text-duo-red');
                nbPart2.className = nbPart2.className.replace(/border-duo-\w+ text-duo-\w+/, 'border-duo-blue text-duo-blue');
                nbWhole.className = nbWhole.className.replace(/border-duo-\w+ text-duo-\w+ scale-110/, 'border-duo-purple text-duo-purple');

                if (selectedOption === nums.answer) {
                    nbPart3.className = nbPart3.className.replace(/border-duo-\w+ text-duo-\w+/, 'border-duo-green text-duo-green scale-110');
                } else {
                    nbPart3.className = nbPart3.className.replace(/border-duo-\w+ text-duo-\w+ scale-110/, 'border-duo-orange text-duo-orange');
                }
            }

            // Options (All same beautiful color for consistency)
            const optsContainer = document.getElementById('options-container');
            let optsHtml = '';

            options.forEach((opt) => {
                let baseClass = `btn-3d py-2 md:py-3 px-4 text-2xl md:text-3xl font-black rounded-2xl flex items-center justify-center text-white transition-all `;

                if (selectedOption === null) {
                    // Default State: All options are Duo Blue
                    baseClass += `bg-duo-blue border-2 border-b-[6px] border-duo-bluedark hover:opacity-90 active:border-b-0 cursor-pointer shadow-sm`;
                } else if (opt === nums.answer) {
                    // Correct answer style
                    baseClass += `bg-duo-green border-2 border-b-[4px] border-duo-greendark scale-105 animate-bounce-short z-10 shadow-md`;
                } else if (opt === selectedOption) {
                    // Wrong clicked answer style
                    baseClass += `bg-duo-red border-2 border-b-[4px] border-duo-reddark opacity-90`;
                } else {
                    // Disabled style (for the other options that weren't clicked)
                    baseClass += `bg-slate-200 border-2 border-b-[4px] border-slate-300 text-slate-400 opacity-60`;
                }

                optsHtml += `<button ${selectedOption !== null ? 'disabled' : ''} onclick="handleAnswer(${opt})" class="${baseClass}">${opt}</button>`;
            });
            optsContainer.innerHTML = optsHtml;

            // Next Button Area
            const nextArea = document.getElementById('next-btn-area');
            if (selectedOption !== null) {
                const isLast = questionCount >= MAX_QUESTIONS;
                nextArea.innerHTML = `
                    <button onclick="${isLast ? 'showEndScreen()' : 'startQuestion()'}"
                            class="animate-fade-in btn-3d w-full max-w-sm bg-duo-blue border-b-[6px] border-duo-bluedark text-white text-xl md:text-2xl font-black py-3 md:py-4 px-8 rounded-2xl shadow-sm uppercase tracking-widest">
                        ${isLast ? 'Finish 🏆' : 'Continue ➡️'}
                    </button>
                `;
            } else {
                nextArea.innerHTML = '';
            }

            renderTenFrames();
        }

        // Gets Dots mapped for the chunked Animation Step
        function getDotsArray() {
            const arr = new Array(40).fill({ type: 'empty' });
            if (!nums) return arr;

            if (mode === 'add') {
                let visibleDots = 0;
                if (animStep >= 1) visibleDots += nums.a;
                if (animStep >= 2) visibleDots += nums.b;
                if (animStep >= 3) visibleDots += nums.c;

                for (let i = 0; i < visibleDots; i++) {
                    if (i < nums.a) {
                        arr[i] = { type: 'dot', color: 'bg-duo-blue' };
                    } else if (i < nums.a + nums.b) {
                        arr[i] = { type: 'dot', color: 'bg-duo-green' };
                    } else {
                        arr[i] = { type: 'dot', color: 'bg-duo-orange' };
                    }
                }
            } else if (mode === 'sub') {
                let visibleCrosses = 0;
                if (animStep >= 1) visibleCrosses += nums.a;
                if (animStep >= 2) visibleCrosses += nums.b;

                for (let i = 0; i < nums.total; i++) {
                    let hasCross = i >= nums.total - visibleCrosses;
                    let crossColor = null;
                    if (hasCross) {
                        let distanceFromEnd = (nums.total - 1) - i;
                        crossColor = distanceFromEnd < nums.a ? 'red' : 'blue';
                    }
                    arr[i] = { type: 'dot', color: 'bg-duo-purple', cross: hasCross, crossColor };
                }
            }
            return arr;
        }

        function renderTenFrames() {
            const arr = getDotsArray();
            const container = document.getElementById('ten-frames');
            let html = '';

            for(let f = 0; f < 4; f++) {
                html += `<div class="bg-white p-1.5 sm:p-2 md:p-3 rounded-2xl shadow-sm border-2 border-slate-100 relative">
                            <div class="grid grid-rows-2 grid-cols-5 gap-1 md:gap-2">`;

                for(let c = 0; c < 10; c++) {
                    const idx = f * 10 + c;
                    const dot = arr[idx];

                    html += `<div class="aspect-square border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center p-0.5 sm:p-1 bg-slate-50/50">`;

                    if (dot.type === 'dot') {
                        html += `<div class="relative w-full h-full rounded-full shadow-sm ${dot.color} scale-in">`;
                        if (dot.cross) {
                            const strokeC = dot.crossColor === 'red' ? '#FF4B4B' : '#1CB0F6';
                            html += `<svg class="absolute inset-0 w-full h-full animate-draw-cross z-10" viewBox="-2 -2 28 28">
                                        <line x1="2" y1="2" x2="22" y2="22" stroke="${strokeC}" stroke-width="6" stroke-linecap="round" />
                                        <line x1="22" y1="2" x2="2" y2="22" stroke="${strokeC}" stroke-width="6" stroke-linecap="round" />
                                     </svg>`;
                        }
                        html += `</div>`;
                    }

                    html += `</div>`;
                }
                html += `</div></div>`;
            }
            container.innerHTML = html;
        }

        function clearAnimTimeouts() {
            animTimeouts.forEach(clearTimeout);
            animTimeouts = [];
        }

        // --- Animations ---
        function controlAnimation() {
            clearAnimTimeouts();
            if (!nums || selectedOption !== null) return;

            // Flashing by Groups!
            if (mode === 'add') {
                animStep = 1; // Flash 1: Show a
                renderTenFrames();
                animTimeouts.push(setTimeout(() => {
                    if (selectedOption === null) {
                        animStep = 2; // Flash 2: Show a + b
                        renderTenFrames();
                        animTimeouts.push(setTimeout(() => {
                            if (selectedOption === null) {
                                animStep = 3; // Flash 3: Show a + b + c
                                renderTenFrames();
                            }
                        }, 800));
                    }
                }, 800));
            } else if (mode === 'sub') {
                animStep = 0; // Total dots only
                renderTenFrames();
                animTimeouts.push(setTimeout(() => {
                    if (selectedOption === null) {
                        animStep = 1; // Flash 1: Cross a
                        renderTenFrames();
                        animTimeouts.push(setTimeout(() => {
                            if (selectedOption === null) {
                                animStep = 2; // Flash 2: Cross a + b
                                renderTenFrames();
                            }
                        }, 800));
                    }
                }, 800));
            }
        }

        // --- Game Flow ---
        window.handleAnswer = (opt) => {
            selectedOption = opt;
            clearAnimTimeouts();

            // Fast forward animation to show the final piece
            animStep = mode === 'add' ? 3 : 2;

            if (opt === nums.answer) {
                playSuccessSound();
                score++;
            } else {
                playErrorSound();
            }

            updateUI();
        };

        function startQuestion() {
            // Sử dụng questionCount để kiểm soát độ khó
            nums = getUniqueQuestion(questionCount);
            mode = nums.mode;
            options = generateOptions(nums.answer);
            selectedOption = null;
            animStep = 0;
            questionCount++;

            updateUI();
            controlAnimation();

            // Speak after a tiny delay so UI updates first
            setTimeout(speakCurrentQuestion, 300);
        }

        function showEndScreen() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('end-screen').classList.add('flex');
            document.getElementById('final-score').innerText = score;

            playSuccessSound();
            fireConfetti();
        }

        window.startGame = () => {
            score = 0;
            questionCount = 0;
            history.clear();

            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.remove('flex');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');

            startQuestion();
        };

        // Reliable startup for local HTML files and browsers with strict media policies.
        function bootGame() {
            try {
                startGame();
            } catch (err) {
                console.error('Game startup error:', err);
                // One short retry handles rare timing issues with local files.
                setTimeout(() => {
                    try { startGame(); } catch (e) { console.error('Retry startup error:', e); }
                }, 80);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootGame, { once: true });
        } else {
            bootGame();
        }
    </script>
</body>
</html>

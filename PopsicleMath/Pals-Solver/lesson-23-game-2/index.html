<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun with Equal Groups - Pictorial Multiplication Game V3</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            purple: '#A855F7',
                            pink: '#EC4899',
                            yellow: '#FBBF24',
                            blue: '#3B82F6',
                            sky: '#38BDF8',
                            orange: '#F97316',
                            cyan: '#06B6D4'
                        }
                    },
                    boxShadow: {
                        'button': '0 6px 0px 0px rgba(0, 0, 0, 0.15)',
                        'button-pressed': '0 2px 0px 0px rgba(0, 0, 0, 0.15)',
                        'card': '0 8px 24px -4px rgba(0, 0, 0, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            /* Base sky color */
            background-color: #87CEEB; 
            overflow-x: hidden;
        }

        /* Beautiful Nature Background CSS */
        .scenery-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to bottom, #4CA1AF, #C4E0E5);
        }

        .sun {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 40px #FFD700, 0 0 80px #FF8C00;
            animation: pulseSun 4s infinite alternate;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            animation: floatCloud linear infinite;
        }
        
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .cloud1 { top: 15%; left: -20%; width: 120px; height: 40px; animation-duration: 40s; }
        .cloud1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud1::after { width: 70px; height: 70px; top: -35px; right: 15px; }

        .cloud2 { top: 25%; left: -30%; width: 160px; height: 50px; animation-duration: 55s; animation-delay: 5s; opacity: 0.8;}
        .cloud2::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud2::after { width: 90px; height: 90px; top: -45px; right: 20px; }

        .hills {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
        }

        .hill-bg {
            position: absolute;
            bottom: 0;
            left: -10%;
            width: 120%;
            height: 100%;
            background: #7CB342;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }

        .hill-fg {
            position: absolute;
            bottom: 0;
            left: -20%;
            width: 140%;
            height: 70%;
            background: #8BC34A;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: inset 0 20px 20px rgba(255,255,255,0.2);
        }

        /* Simple CSS Trees and Flowers */
        .tree { position: absolute; bottom: 20%; z-index: 1; }
        .trunk { width: 20px; height: 60px; background: #795548; margin: 0 auto; border-radius: 2px;}
        .leaves { width: 80px; height: 80px; background: #2E7D32; border-radius: 50%; position: absolute; top: -60px; left: -30px; box-shadow: -10px 10px 0 rgba(0,0,0,0.1); }
        .tree1 { left: 10%; transform: scale(1.2); }
        .tree2 { right: 15%; transform: scale(0.9); }
        
        .flower { position: absolute; bottom: 10%; z-index: 2; width: 30px; height: 30px; }
        .flower::before { content: '🌸'; font-size: 24px; position: absolute; animation: sway 3s ease-in-out infinite alternate; }
        .f1 { left: 25%; animation-delay: 0.1s;}
        .f2 { left: 45%; bottom: 5%; animation-delay: 0.5s; }
        .f3 { right: 35%; bottom: 15%; animation-delay: 0.3s; }
        .f4 { right: 10%; bottom: 8%; animation-delay: 0.7s; }

        @keyframes pulseSun {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes floatCloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(120vw); }
        }

        @keyframes sway {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        /* Component Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .group-card {
            transition: all 0.3s ease;
        }
        .group-card:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Confetti Canvas - Ensure it's on top */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
        
        /* Realistic Emoji font fallback */
        .emoji-item {
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.2));
        }

        /* Safe area for top right logo */
        .logo-safe-area {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: 50px;
            z-index: 50;
        }
    </style>
</head>

    <script>
        const TOTAL_QUESTIONS = 10;
        let currentQuestionIndex = 0;
        let score = 0;
        let streak = 0;
        let correctAnswersCount = 0;
        let totalAttemptsCount = 0;
        let isAudioMuted = false;
        let hasAnsweredCurrentQuestion = false;
        let currentQuestion = null;
        let activeViewMode = 'quiz';

        let sandboxGroups = 3;
        let sandboxPerGroup = 2;

        const OBJECT_THEMES = [
            { id: 'apples', emoji: '🍎', name: 'apples' },
            { id: 'stars', emoji: '⭐', name: 'stars' },
            { id: 'balls', emoji: '🏀', name: 'balls' },
            { id: 'cupcakes', emoji: '🧁', name: 'cupcakes' },
            { id: 'flowers', emoji: '🌻', name: 'flowers' },
            { id: 'balloons', emoji: '🎈', name: 'balloons' },
            { id: 'cookies', emoji: '🍪', name: 'cookies' },
            { id: 'fish', emoji: '🐠', name: 'fish' },
            { id: 'cars', emoji: '🚗', name: 'cars' },
            { id: 'donuts', emoji: '🍩', name: 'donuts' },
            { id: 'strawberries', emoji: '🍓', name: 'strawberries'},
            { id: 'presents', emoji: '🎁', name: 'presents'}
        ];

        const GROUP_COLORS = [
            { bg: 'bg-indigo-100', border: 'border-indigo-300', text: 'text-indigo-800' },
            { bg: 'bg-sky-100', border: 'border-sky-300', text: 'text-sky-800' },
            { bg: 'bg-purple-100', border: 'border-purple-300', text: 'text-purple-800' },
            { bg: 'bg-yellow-100', border: 'border-yellow-300', text: 'text-yellow-800' },
            { bg: 'bg-pink-100', border: 'border-pink-300', text: 'text-pink-800' },
            { bg: 'bg-orange-100', border: 'border-orange-300', text: 'text-orange-800' },
            { bg: 'bg-cyan-100', border: 'border-cyan-300', text: 'text-cyan-800' }
        ];

        class SoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            }
            playPop() {
                if (isAudioMuted) return;
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            }
            playSuccess() {
                if (isAudioMuted) return;
                this.init(); if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; 
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    const startTime = this.ctx.currentTime + (idx * 0.1);
                    gain.gain.setValueAtTime(0.1, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(startTime); osc.stop(startTime + 0.3);
                });
            }
            playWrong() {
                if (isAudioMuted) return;
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(180, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.3);
            }
        }
        const soundFx = new SoundEngine();

        function getPluralWord(num) {
            const words = { 2: "twos", 3: "threes", 4: "fours", 5: "fives", 6: "sixes", 7: "sevens", 8: "eights", 9: "nines", 10: "tens" };
            return words[num] || num + "s";
        }

        function generateQuestionSet(count = 10) {
            const validPerGroup = [2, 3, 5];
            const questions = [];
            const formats = ['groupsOf', 'pluralWords', 'repeatedAddition'];
            
            const seenSignatures = new Set();
            let attempts = 0;

            while(questions.length < count && attempts < 100) {
                attempts++;
                const numGroups = Math.floor(Math.random() * 9) + 2; // 2..10
                const itemsPerGroup = validPerGroup[Math.floor(Math.random() * validPerGroup.length)];
                
                const theme = OBJECT_THEMES[questions.length % OBJECT_THEMES.length];
                const formatType = formats[questions.length % formats.length];
                const colorTheme = GROUP_COLORS[questions.length % GROUP_COLORS.length];

                const signature = `${numGroups}-${itemsPerGroup}-${formatType}`;
                if (seenSignatures.has(signature) && count <= 20) {
                    continue; 
                }
                seenSignatures.add(signature);

                const options = generateOptions(numGroups, itemsPerGroup, formatType);
                
                let correctText = "";
                if (formatType === 'groupsOf') correctText = `${numGroups} groups of ${itemsPerGroup}`;
                else if (formatType === 'pluralWords') correctText = `${numGroups} ${getPluralWord(itemsPerGroup)}`;
                else if (formatType === 'repeatedAddition') correctText = Array(numGroups).fill(itemsPerGroup).join(' + ');

                questions.push({
                    groups: numGroups,
                    perGroup: itemsPerGroup,
                    total: numGroups * itemsPerGroup,
                    theme: theme,
                    colorTheme: colorTheme,
                    correctText: correctText,
                    formatType: formatType,
                    options: options
                });
            }
            return questions;
        }

        function generateOptions(numGroups, perGroup, formatType) {
            const optionsSet = new Set();
            const formatOption = (g, p) => {
                if (formatType === 'groupsOf') return `${g} groups of ${p}`;
                if (formatType === 'pluralWords') return `${g} ${getPluralWord(p)}`;
                if (formatType === 'repeatedAddition') return Array(g).fill(p).join(' + ');
                return `${g} groups of ${p}`;
            };

            optionsSet.add(formatOption(numGroups, perGroup));

            if (numGroups !== perGroup) optionsSet.add(formatOption(perGroup, numGroups));

            const possibleGroupOffsets = [numGroups + 1, numGroups - 1 >= 2 ? numGroups - 1 : numGroups + 2];
            for (let g of possibleGroupOffsets) {
                if (optionsSet.size >= 2) break;
                if (g >= 2 && g <= 10 && g !== numGroups) optionsSet.add(formatOption(g, perGroup));
            }

            for (let p of [2, 3, 5]) {
                if (optionsSet.size >= 2) break;
                if (p !== perGroup) optionsSet.add(formatOption(numGroups, p));
            }

            return shuffleArray(Array.from(optionsSet).slice(0, 2));
        }

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGame() {
            questionList = generateQuestionSet(TOTAL_QUESTIONS);
            currentQuestionIndex = 0;
            score = 0; streak = 0; correctAnswersCount = 0; totalAttemptsCount = 0;
            updateHeaderUI();
            loadQuestion(currentQuestionIndex);
        }

        function loadQuestion(index) {
            hasAnsweredCurrentQuestion = false;
            currentQuestion = questionList[index];

            document.getElementById('current-q-num').innerText = index + 1;
            document.getElementById('total-q-num').innerText = TOTAL_QUESTIONS;
            
            const progressPercent = ((index) / TOTAL_QUESTIONS) * 100;
            document.getElementById('progress-bar-fill').style.width = `${Math.max(5, progressPercent)}%`;

            const banner = document.getElementById('feedback-banner');
            banner.classList.add('hidden');
            document.getElementById('btn-next').classList.add('hidden');

            renderPictorialGroups(currentQuestion);
            renderAnswerButtons(currentQuestion);
            soundFx.playPop();
        }

        function renderPictorialGroups(q, targetId = 'groups-grid', isSandbox = false) {
            const grid = document.getElementById(targetId);
            grid.innerHTML = '';
            
            const colorTheme = q.colorTheme || GROUP_COLORS[0];

            for (let g = 0; g < q.groups; g++) {
                const groupCard = document.createElement('div');
                groupCard.className = `group-card ${colorTheme.bg} rounded-2xl p-2 sm:p-4 border-2 ${colorTheme.border} flex flex-col items-center justify-center relative min-w-[80px] sm:min-w-[120px] animate-pop-in bg-opacity-80`;
                groupCard.style.animationDelay = `${g * 0.05}s`;

                const groupTag = document.createElement('span');
                groupTag.className = `text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded-full mb-1 sm:mb-2 bg-white/60 ${colorTheme.text}`;
                groupTag.innerText = `Group ${g + 1}`;
                groupCard.appendChild(groupTag);

                const itemsWrapper = document.createElement('div');
                if (q.perGroup === 2 || q.perGroup === 3) {
                    itemsWrapper.className = 'flex items-center justify-center gap-1 sm:gap-2 py-1';
                } else {
                    itemsWrapper.className = 'grid grid-cols-3 gap-1 sm:gap-2 py-1 place-items-center';
                    itemsWrapper.style.justifyItems = 'center';
                }

                for (let i = 0; i < q.perGroup; i++) {
                    const itemEl = document.createElement('span');
                    itemEl.className = 'emoji-item text-3xl sm:text-5xl transform hover:scale-110 transition-transform cursor-pointer leading-none';
                    itemEl.innerText = q.theme.emoji;
                    if (q.perGroup === 5 && i >= 3) {
                        itemEl.classList.add('col-span-1');
                        if(i===3) itemEl.classList.add('col-start-1', 'translate-x-1/2'); 
                        if(i===4) itemEl.classList.add('col-start-3', '-translate-x-1/2'); 
                    }
                    itemsWrapper.appendChild(itemEl);
                }

                groupCard.appendChild(itemsWrapper);
                grid.appendChild(groupCard);
            }
        }

        function renderAnswerButtons(q) {
            const container = document.getElementById('answers-container');
            container.innerHTML = '';

            const colors = [
                { bg: 'bg-brand-purple hover:bg-purple-600', border: 'border-purple-800' },
                { bg: 'bg-brand-blue hover:bg-blue-600', border: 'border-blue-800' }
            ];

            q.options.forEach((optText, idx) => {
                const color = colors[idx % colors.length];
                const btn = document.createElement('button');
                btn.className = `w-full py-4 px-6 ${color.bg} text-white font-extrabold text-lg sm:text-xl rounded-2xl shadow-button active:translate-y-[4px] active:border-b-0 transition-all border-b-6 ${color.border} flex items-center justify-between group cursor-pointer`;
                
                btn.innerHTML = `
                    <span class="flex items-center gap-4 text-left">
                        <span class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-lg font-black shrink-0">${String.fromCharCode(65 + idx)}</span>
                        <span>${optText}</span>
                    </span>
                `;

                btn.onclick = () => handleAnswerSelect(optText, btn);
                container.appendChild(btn);
            });
        }

        function handleAnswerSelect(selectedOption, buttonEl) {
            if (hasAnsweredCurrentQuestion) return;
            totalAttemptsCount++;

            if (selectedOption === currentQuestion.correctText) {
                hasAnsweredCurrentQuestion = true;
                correctAnswersCount++;
                score += 10; streak++;
                updateHeaderUI();
                soundFx.playSuccess();
                triggerConfetti();

                buttonEl.className = buttonEl.className.replace(/bg-[a-z]+-\d+|bg-brand-[a-z]+/, 'bg-green-500').replace(/border-[a-z]+-\d+/, 'border-green-700');
                buttonEl.classList.add('animate-pulse');

                const allButtons = document.querySelectorAll('#answers-container button');
                allButtons.forEach(b => {
                    if (b !== buttonEl) b.classList.add('opacity-50', 'cursor-not-allowed');
                });

                showFeedback(true);
            } else {
                streak = 0; updateHeaderUI();
                soundFx.playWrong();
                buttonEl.classList.add('animate-shake', 'opacity-50');
                showFeedback(false);
            }
        }

        function showFeedback(isCorrect) {
            const banner = document.getElementById('feedback-banner');
            const iconBox = document.getElementById('feedback-icon');
            const titleEl = document.getElementById('feedback-title');
            const additionText = document.getElementById('repeated-addition-text');
            const nextBtn = document.getElementById('btn-next');

            banner.classList.remove('hidden');

            if (isCorrect) {
                banner.className = "rounded-2xl p-4 sm:p-5 border-4 border-green-300 bg-green-50 transition-all animate-pop-in shadow-lg mt-4";
                iconBox.className = "w-14 h-14 rounded-2xl flex items-center justify-center text-3xl text-white shadow-md shrink-0 bg-green-500";
                iconBox.innerHTML = '<i class="fa-solid fa-star"></i>';
                titleEl.className = "text-2xl font-black text-green-700";
                titleEl.innerText = "Awesome!";

                const additionParts = Array(currentQuestion.groups).fill(currentQuestion.perGroup);
                const additionFormula = additionParts.join(' + ') + ` = ${currentQuestion.total}`;

                additionText.innerHTML = `
                    <span class="text-slate-600">${currentQuestion.groups} groups of ${currentQuestion.perGroup}</span>
                    <i class="fa-solid fa-arrow-right text-sm mx-2 text-slate-400"></i>
                    <span class="text-brand-purple font-black text-xl sm:text-2xl">${additionFormula}</span>
                `;
                nextBtn.classList.remove('hidden');
                
                if (!isAudioMuted && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let msgText = `Awesome! ${currentQuestion.groups} groups of ${currentQuestion.perGroup} makes ${currentQuestion.total}`;
                    const msg = new SpeechSynthesisUtterance(msgText);
                    msg.rate = 0.9;
                    window.speechSynthesis.speak(msg);
                }
            } else {
                banner.className = "rounded-2xl p-4 sm:p-5 border-4 border-brand-orange bg-orange-50 transition-all animate-shake shadow-lg mt-4";
                iconBox.className = "w-14 h-14 rounded-2xl flex items-center justify-center text-3xl text-white shadow-md shrink-0 bg-brand-orange";
                iconBox.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
                titleEl.className = "text-2xl font-black text-orange-800";
                titleEl.innerText = "Oops! Try again.";
                additionText.innerHTML = `<span class="text-orange-700 font-semibold">Count the groups carefully!</span>`;
                nextBtn.classList.add('hidden');
            }
        }

        function nextQuestion() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            currentQuestionIndex++;
            if (currentQuestionIndex < TOTAL_QUESTIONS) loadQuestion(currentQuestionIndex);
            else showQuizResults();
        }

        function readQuestionAloud() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const text = `How many groups are there? And how many in each group?`;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85;
            utterance.pitch = 1.1; 
            window.speechSynthesis.speak(utterance);
        }

        function updateHeaderUI() {
            document.getElementById('score-counter').innerText = score;
            document.getElementById('streak-count').innerText = streak;
            const streakBadge = document.getElementById('streak-badge');
            if (streak > 1) streakBadge.classList.remove('hidden');
            else streakBadge.classList.add('hidden');
        }

        function toggleViewMode() {
            const quizView = document.getElementById('quiz-view');
            const sandboxView = document.getElementById('sandbox-view');
            const resultsView = document.getElementById('results-view');
            const modeText = document.getElementById('mode-toggle-text');
            const modeIcon = document.querySelector('#btn-toggle-mode i');

            if (activeViewMode === 'quiz') {
                activeViewMode = 'sandbox';
                quizView.classList.add('hidden');
                resultsView.classList.add('hidden');
                sandboxView.classList.remove('hidden');
                modeText.innerText = "Play Quiz";
                modeIcon.className = "fa-solid fa-gamepad";
                renderSandbox();
            } else {
                activeViewMode = 'quiz';
                sandboxView.classList.add('hidden');
                resultsView.classList.add('hidden');
                quizView.classList.remove('hidden');
                modeText.innerText = "Explore";
                modeIcon.className = "fa-solid fa-cubes";
            }
            soundFx.playPop();
        }

        function adjustSandboxGroups(delta) {
            const nextVal = sandboxGroups + delta;
            if (nextVal >= 2 && nextVal <= 10) {
                sandboxGroups = nextVal;
                renderSandbox();
                soundFx.playPop();
            }
        }

        function setSandboxPerGroup(val) {
            if ([2, 3, 5].includes(val)) {
                sandboxPerGroup = val;
                [2, 3, 5].forEach(v => {
                    const btn = document.getElementById(`sb-btn-${v}`);
                    if (v === val) {
                        btn.className = "px-4 py-2 bg-brand-orange text-white font-black rounded-xl border-b-4 border-orange-700 text-lg shadow-sm";
                    } else {
                        btn.className = "px-4 py-2 bg-white text-slate-600 font-black rounded-xl border-2 border-slate-200 text-lg shadow-sm";
                    }
                });
                renderSandbox();
                soundFx.playPop();
            }
        }

        function renderSandbox() {
            const themeSelect = document.getElementById('sandbox-theme-select');
            const selectedThemeId = themeSelect.value;
            const themeObj = OBJECT_THEMES.find(t => t.id === selectedThemeId) || OBJECT_THEMES[0];

            document.getElementById('sandbox-group-val').innerText = sandboxGroups;

            const sbQuestionObj = {
                groups: sandboxGroups,
                perGroup: sandboxPerGroup,
                theme: themeObj,
                colorTheme: GROUP_COLORS[1] 
            };

            renderPictorialGroups(sbQuestionObj, 'sandbox-groups-grid', true);

            const total = sandboxGroups * sandboxPerGroup;
            document.getElementById('sandbox-desc-text').innerText = `${sandboxGroups} groups of ${sandboxPerGroup}`;
            const additionParts = Array(sandboxGroups).fill(sandboxPerGroup);
            document.getElementById('sandbox-math-text').innerText = `${additionParts.join(' + ')} = ${total}`;
        }

        function showQuizResults() {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('sandbox-view').classList.add('hidden');
            const resultsView = document.getElementById('results-view');
            resultsView.classList.remove('hidden');

            document.getElementById('results-stars').innerText = `${score} ⭐`;
            const accuracy = Math.round((correctAnswersCount / Math.max(1, totalAttemptsCount)) * 100);
            document.getElementById('results-accuracy').innerText = `${accuracy}%`;

            triggerConfetti();
            soundFx.playSuccess();
        }

        function restartQuiz() {
            document.getElementById('results-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            activeViewMode = 'quiz';
            document.getElementById('mode-toggle-text').innerText = "Explore";
            document.querySelector('#btn-toggle-mode i').className = "fa-solid fa-cubes";
            initGame();
        }

        function toggleAudio() {
            isAudioMuted = !isAudioMuted;
            const icon = document.getElementById('audio-icon');
            const btn = document.getElementById('btn-audio');
            if (isAudioMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-base text-slate-500';
                btn.className = 'w-10 h-10 bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold rounded-xl flex items-center justify-center transition shadow-button border-b-4 border-slate-400 active:translate-y-1 active:border-b-0';
                if (window.speechSynthesis) window.speechSynthesis.cancel();
            } else {
                icon.className = 'fa-solid fa-volume-high text-base text-white';
                btn.className = 'w-10 h-10 bg-brand-yellow hover:bg-yellow-500 text-white font-bold rounded-xl flex items-center justify-center transition shadow-button border-b-4 border-yellow-700 active:translate-y-1 active:border-b-0';
                soundFx.playPop();
            }
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#A855F7', '#EC4899', '#FBBF24', '#3B82F6', '#38BDF8', '#10B981'];

            for (let i = 0; i < 150; i++) { 
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 - 100, 
                    vx: (Math.random() - 0.5) * 20, 
                    vy: (Math.random() - 0.8) * 20, 
                    size: Math.random() * 10 + 8,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rSpeed: (Math.random() - 0.5) * 15,
                    life: 1
                });
            }

            let animationFrame;
            function renderConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let stillAlive = false;

                // Fix bug: Added index parameter to forEach to fix ReferenceError
                particles.forEach((p, index) => {
                    if (p.life > 0) {
                        stillAlive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.4; 
                        p.life -= 0.01;
                        p.rotation += p.rSpeed;

                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = Math.max(0, p.life);
                        
                        if(index % 2 === 0) {
                            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        } else {
                            ctx.beginPath();
                            ctx.arc(0, 0, p.size/2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                });

                if (stillAlive) {
                    animationFrame = requestAnimationFrame(renderConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    cancelAnimationFrame(animationFrame);
                }
            }
            renderConfetti();
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });

        window.onload = initGame;
    </script>

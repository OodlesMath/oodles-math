button{font:inherit;font-family:"Poppins",sans-serif}
.app{height:100%;padding:12px;display:flex;align-items:center;justify-content:center}
.game{
  width:min(1020px,90vw);height:min(86vh,760px);min-height:600px;
  background:rgba(255,255,255,.63);backdrop-filter:blur(5px);
  border:4px solid rgba(255,255,255,.88);border-radius:30px;
  box-shadow:0 18px 45px rgba(25,82,120,.24);
  display:flex;flex-direction:column;overflow:hidden;position:relative;flex:0 0 auto;
}
.topbar{
  height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  background:rgba(255,255,255,.68);border-bottom:3px solid rgba(255,255,255,.82);gap:12px;
}
.brand{font-size:clamp(22px,3vw,34px);font-weight:1000;color:#2790d3;letter-spacing:.3px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#fff;border:3px solid #e5eef5;padding:7px 14px;border-radius:999px;font-weight:900;box-shadow:0 4px 0 #dbe6ee;font-size:15px}
.stage{flex:1;padding:10px 18px 10px;display:flex;flex-direction:column;align-items:center;min-height:0;overflow:hidden}
.eq-area{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin-top:2px;min-height:124px}
.term{display:flex;flex-direction:column;align-items:center;min-width:64px}
.eq-num,.eq-sign{font-size:clamp(40px,5.8vw,62px);line-height:1;font-weight:1000;color:#17324d}
.eq-sign{padding-top:2px}
.speaker{
  margin-top:3px;width:54px;height:54px;border:0;border-radius:50%;background:var(--blue);color:white;
  box-shadow:0 6px 0 var(--blue-d);font-size:25px;cursor:pointer;display:grid;place-items:center
}
.speaker:active{transform:translateY(5px);box-shadow:0 1px 0 var(--blue-d)}
.bond{width:92px;height:54px;position:relative;margin-top:2px}
.bond svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bond .part{position:absolute;bottom:-1px;width:39px;height:39px;background:white;border:3px solid #263b4d;border-radius:50%;display:grid;place-items:center;font-weight:1000;font-size:19px}
.bond .left{left:3px} .bond .right{right:3px}
.instruction{font-size:clamp(18px,2.3vw,26px);font-weight:1000;color:#566a7b;text-align:center;margin:8px 0 2px}
.object-wrap{width:100%;max-width:960px;position:relative;margin-top:10px}
.object-area{
  width:100%;height:178px;border-radius:26px;background:rgba(255,255,255,.52);
  border:4px solid rgba(255,255,255,.88);box-shadow:inset 0 0 0 2px rgba(70,130,170,.06);
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px 22px;
}
.icon-row{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:clamp(22px,3vw,42px);width:100%;z-index:2;pointer-events:none}
.group{display:grid;grid-template-columns:repeat(5,clamp(42px,4.8vw,56px));grid-auto-rows:clamp(42px,4.9vw,56px);align-items:center;justify-items:center;align-content:center;justify-content:center;gap:6px 8px}
.group + .group{margin-left:0}
.icon{width:clamp(36px,4.7vw,52px);height:clamp(36px,4.7vw,52px);display:grid;place-items:center;line-height:1;filter:drop-shadow(0 4px 3px rgba(0,0,0,.12)) saturate(1.08);transition:.22s transform,.22s filter;transform-origin:center}\n.icon svg{width:100%;height:100%;overflow:visible}\n.icon.inside{filter:drop-shadow(0 0 10px rgba(255,79,115,.38)) drop-shadow(0 4px 3px rgba(0,0,0,.12)) saturate(1.12);}
.icon svg{width:100%;height:100%;display:block;overflow:visible}
.icon.inside{transform:scale(1.13);filter:drop-shadow(0 0 8px #ffd84d)}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;touch-action:none;cursor:crosshair}
.clear-btn{
  position:absolute;right:12px;top:12px;z-index:6;border:0;border-radius:14px;background:rgba(255,255,255,.94);
  color:#657789;padding:8px 12px;font-weight:900;box-shadow:0 4px 0 #d8e1e8;cursor:pointer
}
.clear-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d8e1e8}
.feedback{height:30px;margin-top:5px;font-size:18px;font-weight:1000;text-align:center;color:#617586}
.feedback.good{color:#27953d} .feedback.bad{color:#df4550}
.strategy{height:38px;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(16px,2.1vw,23px);color:#6b52ca;opacity:0;transform:translateY(5px);transition:.25s}
.strategy.show{opacity:1;transform:none}
.answers-title{font-size:18px;font-weight:1000;color:#566a7b;margin:0 0 6px}
.answers{display:grid;grid-template-columns:repeat(4,minmax(88px,1fr));gap:13px;width:min(760px,100%)}
.answer{
  min-height:66px;border:3px solid rgba(255,255,255,.9);border-radius:20px;color:white;
  font-size:clamp(27px,3.7vw,39px);font-weight:1000;cursor:pointer;transition:.14s;box-shadow:0 7px 0 rgba(0,0,0,.15)
}
.answer:nth-child(1){background:#9567e8} .answer:nth-child(2){background:#36aeea}
.answer:nth-child(3){background:#ef6fa8} .answer:nth-child(4){background:#f39b3d}
.answer:hover:not(:disabled){transform:translateY(-3px)} .answer:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.answer:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.6)}
.answer.correct{background:#43bd59!important;box-shadow:0 7px 0 #278c39}
.answer.wrong{animation:shake .32s;background:#e95860!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bottom-row{margin-top:8px;display:flex;align-items:center;justify-content:center;min-height:56px}
.next{
  border:0;border-radius:20px;background:#43bd59;color:white;padding:14px 36px;font-size:21px;font-weight:1000;
  box-shadow:0 7px 0 #278c39;cursor:pointer;display:none
}
.next.show{display:inline-flex} .next:active{transform:translateY(6px);box-shadow:0 1px 0 #278c39}
.start-overlay,.end-overlay{
  position:absolute;inset:0;z-index:30;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px
}
.end-overlay{display:none}
.start-card,.end-card{
  width:min(520px,92%);background:white;border:4px solid #eaf2f8;border-radius:30px;padding:34px;text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.15)
}
.start-card h1,.end-card h1{margin:0 0 8px;font-size:clamp(34px,6vw,54px);color:#2c9bdd}
.start-card p,.end-card p{margin:8px 0 22px;font-size:18px;font-weight:800;color:#637485}
.start-btn,.play-btn{
  border:0;border-radius:20px;background:#43bd59;color:white;padding:15px 32px;font-size:22px;font-weight:1000;
  box-shadow:0 7px 0 #278c39;cursor:pointer
}
.start-btn:active,.play-btn:active{transform:translateY(6px);box-shadow:0 1px 0 #278c39}
.big-score{font-size:55px;font-weight:1000;color:#8d62e3;margin:10px 0 22px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.dot{position:absolute;width:10px;height:16px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:.9}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.13)}50%{transform:translateY(-10px) scale(1.13)}}
.icon.celebrate{animation:bounce .42s ease 2}
@media(max-width:760px){
 .game{width:96vw;height:94vh;min-height:590px;border-radius:22px}
 .topbar{height:58px;padding:0 12px} .pill{font-size:12px;padding:6px 9px}
 .stage{padding:8px 10px 8px} .object-area{height:165px;padding:12px 8px}

/* Ver1: three addends while preserving the original layout */
.eq-area.three-addends{gap:clamp(8px,1.5vw,14px)}
.eq-area.three-addends .term{min-width:58px}
/* Easy level: each addend stays on one row so a child can draw one clean circle across groups. */
.icon-row.three-groups{gap:clamp(10px,1.5vw,20px)}
.icon-row.three-groups .group{grid-template-columns:repeat(9,clamp(28px,3.45vw,35px));grid-auto-rows:clamp(30px,3.55vw,37px);gap:2px 3px}
.icon-row.three-groups .icon{width:clamp(27px,3.35vw,34px);height:clamp(27px,3.35vw,34px)}
/* Hard level: the two-digit first addend is arranged in rows of ten. The second addend stays on one row. */
.icon-row.level2 .group-a{grid-template-columns:repeat(10,clamp(25px,3vw,32px));grid-auto-rows:clamp(27px,3.1vw,34px);gap:2px 3px;height:108px;align-content:end}
.icon-row.level2 .group-b{grid-template-columns:repeat(9,clamp(25px,3vw,32px));grid-auto-rows:clamp(27px,3.1vw,34px);gap:2px 3px;height:108px;align-content:end}

/* =========================================================
   VER 2 — layout fix + smooth Balloon Tap bonus game
   ========================================================= */
/* Keep all three addend groups inside the object panel. Each group owns
   one equal-width column, so icons can never push the next group offscreen. */
.icon-row.three-groups{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:center;
  justify-items:center;
  gap:clamp(7px,1.2vw,14px);
  width:100%;
  min-width:0;
}
.icon-row.three-groups .group{
  width:100%;
  min-width:0;
  margin:0!important;
  grid-template-columns:repeat(5,minmax(0,34px));
  grid-auto-rows:35px;
  gap:3px 4px;
  align-content:center;
  justify-content:center;
}
.icon-row.three-groups .icon{
  width:32px;
  height:32px;
}
/* Two-digit first addend remains grouped by tens: 10 icons per row.
   The other addends wrap neatly rather than overflowing. */
.icon-row.level2 .group-a{
  grid-template-columns:repeat(10,minmax(0,28px));
  grid-auto-rows:30px;
  gap:2px 3px;
  height:126px;
  align-content:center;
}
.icon-row.level2 .group-b,
.icon-row.level2 .group-c{
  grid-template-columns:repeat(5,minmax(0,32px));
  grid-auto-rows:33px;
  gap:3px 4px;
  height:126px;
  align-content:center;
}
.icon-row.level2 .icon{width:27px;height:27px}
.icon-row.level2 .group-a.packed-first{display:flex;align-items:center;justify-content:center;height:126px;grid-template-columns:none;grid-auto-rows:auto;gap:0}

.icon-row.level2 .group-a.packed-first .ten-pack,.icon-row.level2 .group-a.packed-first .ones-pack{display:grid;justify-content:center;align-content:center}
.icon-row.level2 .group-a.packed-first .ten-pack{grid-template-columns:repeat(5,minmax(0,28px));grid-auto-rows:30px;gap:2px 3px;padding-right:5px}
.icon-row.level2 .group-a.packed-first .ones-pack{grid-template-columns:repeat(5,minmax(0,28px));grid-auto-rows:30px;gap:2px 3px;padding-left:9px;border-left:3px dashed rgba(109,129,153,.42)}
.balloon-field{background:

.balloon .mark{font-size:20px;line-height:1;color:rgba(255,255,255,.92);text-shadow:0 2px 4px rgba(0,0,0,.14);transform:translateY(3px)}

/* Balloon Tap bonus overlay. Kept self-contained so the original game
   interface and formatting are unchanged outside bonus rounds. */
.bonus-overlay{
  position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  padding:18px;background:rgba(18,68,112,.28);backdrop-filter:blur(5px);
}
.bonus-overlay.show{display:flex}
.bonus-card{
  width:min(900px,94vw);height:min(690px,90vh);background:rgba(245,252,255,.97);
  border:5px solid rgba(255,255,255,.95);border-radius:30px;box-shadow:0 20px 55px rgba(0,0,0,.22);
  padding:18px;display:grid;grid-template-rows:auto auto 1fr;gap:10px;overflow:hidden
}
.bonus-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bonus-title{font-size:clamp(25px,4vw,38px);font-weight:1000;color:#2790d3;line-height:1.1}
.bonus-stats{display:flex;gap:9px;flex-wrap:wrap}
.bonus-pill{background:white;border:3px solid #e5eef5;border-radius:999px;padding:7px 13px;font-weight:1000;box-shadow:0 4px 0 #dbe6ee}
.bonus-help{text-align:center;font-weight:900;color:#5f7181;font-size:16px}
.balloon-field{
  position:relative;overflow:hidden;border-radius:24px;border:4px solid rgba(255,255,255,.95);
  background:linear-gradient(180deg,#89d9ff 0%,#c8f0ff 70%,#e6facf 100%);
  box-shadow:inset 0 0 0 2px rgba(70,130,170,.07);touch-action:manipulation;user-select:none
}
.balloon{
  position:absolute;left:0;top:0;border:0;padding:0;cursor:pointer;will-change:transform,opacity;
  width:64px;height:78px;border-radius:50% 50% 47% 47%;box-shadow:inset -8px -11px 15px rgba(0,0,0,.10),0 8px 12px rgba(0,0,0,.12);
  transform:translate3d(0,0,0);touch-action:manipulation
}
.balloon::before{content:"";position:absolute;width:18%;height:28%;left:20%;top:13%;border-radius:50%;background:rgba(255,255,255,.48);transform:rotate(22deg)}
.balloon::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid currentColor;filter:brightness(.9)}
.balloon.pop{animation:balloonPop .12s ease-out forwards;pointer-events:none}
@keyframes balloonPop{to{transform:var(--balloon-pos) scale(1.28);opacity:0}}
.bonus-finish{
  position:absolute;inset:0;display:none;place-items:center;background:rgba(255,255,255,.82);backdrop-filter:blur(4px);z-index:20;text-align:center
}
.bonus-finish.show{display:grid}
.bonus-finish-box{font-weight:1000;color:#2790d3;font-size:clamp(30px,5vw,50px)}
.bonus-finish-box small{display:block;color:#567085;font-size:18px;margin-top:7px}
@media(max-width:600px){.bonus-card{height:min(720px,94vh);padding:12px}.balloon{width:54px;height:66px}}

    </div>

    </div>
  </main>
</div>

<div class="bonus-overlay" id="bonusOverlay" aria-hidden="true">

</div>

      <ellipse cx="23" cy="19" rx="2.6" ry="4.2" fill="#fff" opacity=".18" transform="rotate(18 23 19)"/>
    </svg>`,
    flower:`<svg ${common}>
      <defs><radialGradient id="gf" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffc3df"/><stop offset="60%" stop-color="#ff8cbb"/><stop offset="100%" stop-color="#ef5f9f"/></radialGradient></defs>
      <g fill="url(#gf)" stroke="#17324d" stroke-width="1.9"><ellipse cx="32" cy="14" rx="8" ry="12"/><ellipse cx="49" cy="25" rx="8" ry="12" transform="rotate(52 49 25)"/><ellipse cx="43" cy="45" rx="8" ry="12" transform="rotate(128 43 45)"/><ellipse cx="21" cy="45" rx="8" ry="12" transform="rotate(-128 21 45)"/><ellipse cx="15" cy="25" rx="8" ry="12" transform="rotate(-52 15 25)"/></g>
      <circle cx="32" cy="31" r="8.5" fill="#ffd85a" stroke="#17324d" stroke-width="1.9"/>
    </svg>`,
    daisy:`<svg ${common}>
      <g fill="#fffef8" stroke="#17324d" stroke-width="1.7"><ellipse cx="32" cy="13" rx="6.5" ry="12"/><ellipse cx="47" cy="19" rx="6.5" ry="12" transform="rotate(36 47 19)"/><ellipse cx="51" cy="34" rx="6.5" ry="12" transform="rotate(78 51 34)"/><ellipse cx="43" cy="47" rx="6.5" ry="12" transform="rotate(126 43 47)"/><ellipse cx="21" cy="47" rx="6.5" ry="12" transform="rotate(-126 21 47)"/><ellipse cx="13" cy="34" rx="6.5" ry="12" transform="rotate(-78 13 34)"/><ellipse cx="17" cy="19" rx="6.5" ry="12" transform="rotate(-36 17 19)"/></g>
      <circle cx="32" cy="31" r="8.5" fill="#ffd85a" stroke="#17324d" stroke-width="1.9"/>
    </svg>`
  };
  return icons[type] || icons.apple;
}
let questions=[],index=0,score=0,wrongTried=false,answered=false,madeTen=false;
let path=[],drawing=false,ctx=null,canvas=null;
let bonusActive=false,bonusRAF=0,bonusEndTime=0,bonusHits=0,bonusBalloons=[],bonusDone=null;
const BONUS_SECONDS=15;


function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function buildQuestions(){
  const easy=[],hard=[];

  // Questions 1–5: three one-digit addends.
  // The second addend can be split so the first addend makes 10.
  for(let a=2;a<=9;a++){
    const need=10-a;
    for(let b=need+1;b<=9;b++){
      for(let c=1;c<=9;c++){
        const total=a+b+c;
        if(total<=19){
          easy.push({level:1,a,b,c,need,rest:b-need,targetTen:10,total});
        }
      }
    }
  }

  // Questions 6–10: first addend is two digits, the other two are one digit.
  // Circle the ones from the first addend + part of the second addend to make 10,
  // which completes the next ten (e.g. 27 + 3 = 30).
  for(let a=11;a<=29;a++){
    if(a%10===0)continue;
    const ones=a%10;
    const need=10-ones;
    for(let b=need+1;b<=9;b++){
      for(let c=1;c<=9;c++){
        const total=a+b+c;
        const rest=b-need;
        if(total<=40 && rest + c !== 10){
          hard.push({level:2,a,b,c,ones,need,rest,targetTen:a+need,total});
        }
      }
    }
  }

  const chosen=[];
  const usedEasy=new Set();
  for(const q of shuffleArray(easy)){
    // Also avoid reordered duplicates among the three one-digit addends.
    const key=[q.a,q.b,q.c].sort((x,y)=>x-y).join('-');
    if(usedEasy.has(key))continue;
    usedEasy.add(key);chosen.push(q);
    if(chosen.length===5)break;
  }

  for(const q of shuffleArray(hard)){
    const key=`${q.a}-${q.b}-${q.c}`;
    if(chosen.some(x=>`${x.a}-${x.b}-${x.c}`===key))continue;
    chosen.push(q);
    if(chosen.length===10)break;
  }

  // Assign three different fruit types to every question.
  questions=chosen.map(q=>({...q,fruits:pickFruitTriple()}));
}

function shuffledAnswers(correct){
  const vals=new Set([correct]);
  const candidates=[correct-2,correct-1,correct+1,correct+2,correct-3,correct+3,correct-4,correct+4]
    .filter(n=>n>=3&&n<=40);
  for(const n of shuffleArray(candidates)){if(vals.size<4)vals.add(n);}
  while(vals.size<4){
    const n=Math.max(3,Math.min(40,correct+(Math.floor(Math.random()*9)-4)));
    vals.add(n);
  }
  return shuffleArray([...vals]);
}

function renderQuestion(){
  answered=false;wrongTried=false;madeTen=false;path=[];
  const q=questions[index];
  document.getElementById("progress").textContent=`Question ${index+1} / 10`;
  document.getElementById("score").textContent=`⭐ ${score}`;
  document.getElementById("aNum").textContent=q.a;
  document.getElementById("bNum").textContent=q.b;
  document.getElementById("cNum").textContent=q.c;
  document.getElementById("part1").textContent="";
  document.getElementById("part2").textContent="";
  document.getElementById("resultNum").textContent="?";
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";

  const restTotal=q.rest+q.c;
  if(q.level===1){
    document.getElementById("strategy").textContent=`${q.a} + ${q.b} + ${q.c} → 10 + ${q.rest} + ${q.c} → 10 + ${restTotal} → ?`;
  }else{
    document.getElementById("strategy").textContent=`${q.a} + ${q.b} + ${q.c} → ${q.targetTen} + ${q.rest} + ${q.c} → ${q.targetTen} + ${restTotal} → ?`;
  }
  document.getElementById("strategy").className="strategy";
  document.getElementById("nextBtn").className="next";

  const row=document.getElementById("iconRow");
  row.className=`icon-row three-groups ${q.level===2?'level2':''}`;
  const gA=document.getElementById("groupA"),gB=document.getElementById("groupB"),gC=document.getElementById("groupC");
  if(q.level===1){
    gA.classList.remove("packed-first");
    gA.innerHTML=Array.from({length:q.a},(_,i)=>`<span class="icon" data-group="A" data-pos="${i+1}">${iconSVG(q.fruits[0])}</span>`).join("");
  }else{
    gA.classList.add("packed-first");
    const tens=q.a-q.ones;
    const tenPacks=Math.floor(tens/10);
    const packHTML=Array.from({length:tenPacks},(_,pack)=>`<div class="ten-pack">${Array.from({length:10},(__,i)=>`<span class="icon" data-group="A" data-part="tens" data-pos="${pack*10+i+1}">${iconSVG(q.fruits[0])}</span>`).join("")}</div>`).join("");
    const onesHTML=`<div class="ones-pack">${Array.from({length:q.ones},(_,i)=>`<span class="icon" data-group="A" data-part="ones" data-pos="${tens+i+1}">${iconSVG(q.fruits[0])}</span>`).join("")}</div>`;
    gA.innerHTML=`<div class="first-addend-wrap">${packHTML}${onesHTML}</div>`;
  }
  gB.innerHTML=Array.from({length:q.b},(_,i)=>`<span class="icon" data-group="B" data-pos="${i+1}">${iconSVG(q.fruits[1])}</span>`).join("");
  gC.innerHTML=Array.from({length:q.c},(_,i)=>`<span class="icon" data-group="C" data-pos="${i+1}">${iconSVG(q.fruits[2])}</span>`).join("");

  const answers=document.getElementById("answers");
  answers.innerHTML="";
  shuffledAnswers(q.total).forEach(n=>{
    const btn=document.createElement("button");
    btn.className="answer";btn.textContent=n;btn.disabled=true;
    btn.addEventListener("click",()=>chooseAnswer(btn,n));
    answers.appendChild(btn);
  });
  requestAnimationFrame(resizeCanvas);
  setTimeout(speakQuestion,350);
}

function speakQuestion(){
  if(!("speechSynthesis" in window))return;
  const q=questions[index];
  speechSynthesis.cancel();
  const spoken = answered
    ? `${q.a} plus ${q.b} plus ${q.c} equals ${q.total}.`
    : `What is ${q.a} plus ${q.b} plus ${q.c}?`;
  const u=new SpeechSynthesisUtterance(spoken);
  u.lang="en-US";u.rate=.82;u.pitch=1.05;
  const voices=speechSynthesis.getVoices();
  const preferred=voices.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US English|Jenny|Aria|Female/i.test(v.name))
    || voices.find(v=>/^en/i.test(v.lang));
  if(preferred)u.voice=preferred;
  speechSynthesis.speak(u);
}

function resizeCanvas(){
  canvas=document.getElementById("drawCanvas");
  const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
  ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=7;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#ff4d6d";
  path=[];
}

function clearDrawing(){
  if(!ctx)return;
  const r=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);path=[];
  document.querySelectorAll(".icon").forEach(el=>el.classList.remove("inside","celebrate"));
  if(!madeTen){
    document.getElementById("feedback").textContent="";
    document.getElementById("feedback").className="feedback";
  }
}

function pointFromEvent(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function startDraw(e){
  if(madeTen)return;
  drawing=true;path=[pointFromEvent(e)];
  clearDrawing();path=[pointFromEvent(e)];
  canvas.setPointerCapture?.(e.pointerId);
}
function moveDraw(e){
  if(!drawing||madeTen)return;
  const p=pointFromEvent(e),last=path[path.length-1];
  path.push(p);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
}
function endDraw(e){
  if(!drawing||madeTen)return;drawing=false;
  if(path.length<8){showCircleRetry();return;}
  const first=path[0],last=path[path.length-1];
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(first.x,first.y);ctx.stroke();
  evaluateCircle();
}

function insidePoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    const hit=((yi>p.y)!=(yj>p.y))&&(p.x<(xj-xi)*(p.y-yi)/((yj-yi)||1e-9)+xi);
    if(hit)inside=!inside;
  }
  return inside;
}

function isCorrectMakeTen(chosen,q){
  if(chosen.length!==10)return false;
  const aPos=chosen.filter(el=>el.dataset.group==="A").map(el=>Number(el.dataset.pos)).sort((x,y)=>x-y);
  const bPos=chosen.filter(el=>el.dataset.group==="B").map(el=>Number(el.dataset.pos)).sort((x,y)=>x-y);
  const cCount=chosen.filter(el=>el.dataset.group==="C").length;
  if(cCount!==0)return false;

  if(q.level===1){
    // All of addend A plus exactly q.need fruits from addend B.
    return aPos.length===q.a && bPos.length===q.need;
  }

  // Level 2: circle all ones from the first addend (shown after the gap)
  // plus exactly q.need fruits from addend B.
  const aChosen=chosen.filter(el=>el.dataset.group==="A");
  const aOnes=aChosen.filter(el=>el.dataset.part==="ones").length;
  const aTens=aChosen.filter(el=>el.dataset.part==="tens").length;
  if(aTens!==0)return false;
  return aOnes===q.ones && bPos.length===q.need;
}

function evaluateCircle(){
  const area=document.getElementById("objectArea").getBoundingClientRect();
  const icons=[...document.querySelectorAll(".icon")];
  const chosen=[];
  icons.forEach(el=>{
    const r=el.getBoundingClientRect();
    const p={x:r.left+r.width/2-area.left,y:r.top+r.height/2-area.top};
    if(insidePoly(p,path))chosen.push(el);
  });

  const q=questions[index];
  if(isCorrectMakeTen(chosen,q)){
    madeTen=true;
    document.getElementById("part1").textContent=q.need;
    document.getElementById("part2").textContent=q.rest;
    chosen.forEach(el=>{el.classList.add("inside","celebrate")});
    const fb=document.getElementById("feedback");
    fb.textContent="Great! You made 10!";fb.className="feedback good";
    document.getElementById("strategy").className="strategy show";
    document.querySelectorAll(".answer").forEach(b=>b.disabled=false);
    beep("good");
  }else showCircleRetry();
}

function showCircleRetry(){
  const fb=document.getElementById("feedback");
  fb.textContent="Try again. Circle 10.";fb.className="feedback bad";
  beep("bad");
  setTimeout(()=>{if(!madeTen)clearDrawing();},650);
}

function chooseAnswer(btn,n){
  if(answered)return;
  const q=questions[index];
  if(n===q.total){
    answered=true;
    document.getElementById("resultNum").textContent=q.total;
    if(!wrongTried)score++;
    document.getElementById("score").textContent=`⭐ ${score}`;
    btn.classList.add("correct");
    [...document.querySelectorAll(".answer")].forEach(b=>b.disabled=true);
    const fb=document.getElementById("feedback");
    fb.textContent="Great job! ⭐";fb.className="feedback good";
    document.getElementById("nextBtn").className="next show";
    beep("good");
    burst(38);
  }else{
    wrongTried=true;btn.classList.add("wrong");
    const fb=document.getElementById("feedback");
    fb.textContent="Try again!";fb.className="feedback bad";
    beep("bad");
    setTimeout(()=>btn.classList.remove("wrong"),380);
  }
}

function beep(type){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    window._ac=window._ac||new AC();const ac=window._ac;
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    o.type="sine";o.frequency.value=type==="good"?660:220;
    g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);
    o.start();o.stop(ac.currentTime+.18);
  }catch(e){}
}

function burst(n=70){
  const box=document.getElementById("confetti"),cols=["#ff6fae","#32a8f0","#42bf55","#ffd85a","#9b6df6","#ff9f43"];
  for(let i=0;i<n;i++){
    const d=document.createElement("i");d.className="dot";d.style.left=(Math.random()*100)+"vw";
    d.style.top=(-10-Math.random()*20)+"px";d.style.background=cols[i%cols.length];
    d.style.animationDelay=(Math.random()*.35)+"s";d.style.transform=`rotate(${Math.random()*180}deg)`;
    box.appendChild(d);setTimeout(()=>d.remove(),3200);
  }
}

function advanceAfterQuestion(){
  index++;
  if(index>=questions.length)finishGame();
  else renderQuestion();
}

function nextQuestion(){
  if(bonusActive)return;
  const completed=index+1;
  if(completed%2===0){
    startBalloonBonus(advanceAfterQuestion);
  }else{
    advanceAfterQuestion();
  }
}

function startBalloonBonus(done){
  if(bonusActive)return;
  bonusActive=true;bonusDone=done;bonusHits=0;bonusBalloons=[];
  const overlay=document.getElementById("bonusOverlay");
  const field=document.getElementById("balloonField");
  const finish=document.getElementById("bonusFinish");
  finish.classList.remove("show");
  overlay.classList.add("show");overlay.setAttribute("aria-hidden","false");
  document.getElementById("bonusScore").textContent="🎈 0";
  document.getElementById("bonusTime").textContent=`⏱ ${BONUS_SECONDS}`;
  field.querySelectorAll(".balloon").forEach(el=>el.remove());
  bonusEndTime=performance.now()+BONUS_SECONDS*1000;

  requestAnimationFrame(()=>{
    const count=Math.max(8,Math.min(11,Math.floor(field.clientWidth/82)));
    for(let i=0;i<count;i++)createBalloon(i,true);
    bonusRAF=requestAnimationFrame(runBalloonFrame);
  });
}

function createBalloon(i,first=false){
  if(!bonusActive)return;
  const field=document.getElementById("balloonField");
  const colors=["#ff6fae","#32a8f0","#42bf55","#ffd85a","#9b6df6","#ff9f43","#ef5a62"];
  const size=52+Math.random()*22;
  const maxX=Math.max(8,field.clientWidth-size-8);
  const x=8+Math.random()*Math.max(1,maxX-8);
  const y=first ? Math.random()*Math.max(30,field.clientHeight-size) : field.clientHeight+18+Math.random()*100;
  const speed=48+Math.random()*48;
  const drift=(Math.random()-.5)*22;
  const color=colors[(Math.random()*colors.length)|0];

  let el=bonusBalloons[i]?.el;
  if(!el){
    el=document.createElement("button");
    el.type="button";el.className="balloon";el.setAttribute("aria-label","Tap balloon");
    el.addEventListener("pointerdown",e=>{e.preventDefault();popBalloon(i);},{passive:false});
    field.appendChild(el);
  }
  el.className="balloon";el.style.opacity="1";el.disabled=false;
  el.style.width=size+"px";el.style.height=(size*1.18)+"px";el.style.color=color;el.style.setProperty("--balloon-fill",`radial-gradient(circle at 30% 26%, rgba(255,255,255,.9) 0 11%, rgba(255,255,255,.45) 12%, transparent 24%), linear-gradient(180deg, ${color} 0%, ${color} 100%)`);
  el.innerHTML=`<span class="mark">${["★","❤","✦","●"][i%4]}</span>`;
  const pos=`translate3d(${x}px,${y}px,0)`;el.style.setProperty("--balloon-pos",pos);el.style.transform=pos;
  bonusBalloons[i]={el,x,y,size,speed,drift,phase:Math.random()*Math.PI*2};
}

function popBalloon(i){
  if(!bonusActive)return;
  const b=bonusBalloons[i];if(!b||b.el.classList.contains("pop"))return;
  bonusHits++;document.getElementById("bonusScore").textContent=`🎈 ${bonusHits}`;
  b.el.style.setProperty("--balloon-pos",`translate3d(${b.x}px,${b.y}px,0)`);
  b.el.classList.add("pop");
  beep("good");
  setTimeout(()=>{if(bonusActive)createBalloon(i,false);},105);
}

function runBalloonFrame(now){
  if(!bonusActive)return;
  const field=document.getElementById("balloonField");
  const remaining=Math.max(0,bonusEndTime-now);
  document.getElementById("bonusTime").textContent=`⏱ ${Math.ceil(remaining/1000)}`;
  if(remaining<=0){finishBalloonBonus();return;}

  const dt=Math.min(.035,Math.max(.001,(runBalloonFrame.last?now-runBalloonFrame.last:16.7)/1000));
  runBalloonFrame.last=now;
  const w=field.clientWidth;
  for(let i=0;i<bonusBalloons.length;i++){
    const b=bonusBalloons[i];if(!b||b.el.classList.contains("pop"))continue;
    b.phase+=dt*2.5;
    b.y-=b.speed*dt;
    b.x+=b.drift*dt+Math.sin(b.phase)*7*dt;
    if(b.x<4){b.x=4;b.drift=Math.abs(b.drift)}
    if(b.x>w-b.size-4){b.x=Math.max(4,w-b.size-4);b.drift=-Math.abs(b.drift)}
    if(b.y<-b.size*1.35){createBalloon(i,false);continue;}
    const pos=`translate3d(${b.x}px,${b.y}px,0)`;
    b.el.style.setProperty("--balloon-pos",pos);b.el.style.transform=pos;
  }
  bonusRAF=requestAnimationFrame(runBalloonFrame);
}
runBalloonFrame.last=0;

function finishBalloonBonus(){
  if(!bonusActive)return;
  cancelAnimationFrame(bonusRAF);bonusRAF=0;
  bonusBalloons.forEach(b=>{if(b?.el)b.el.disabled=true});
  const finish=document.getElementById("bonusFinish");
  document.getElementById("bonusFinishText").innerHTML=`Great job! 🎉<small>You popped ${bonusHits} balloons!</small>`;
  finish.classList.add("show");
  setTimeout(()=>{
    document.getElementById("bonusOverlay").classList.remove("show");
    document.getElementById("bonusOverlay").setAttribute("aria-hidden","true");
    finish.classList.remove("show");
    bonusActive=false;runBalloonFrame.last=0;
    const done=bonusDone;bonusDone=null;if(done)done();
  },950);
}

function finishGame(){
  speechSynthesis?.cancel?.();
  document.getElementById("finalScore").textContent=`${score} / 10`;
  document.getElementById("endOverlay").style.display="flex";
  burst(120);
}

function restart(){
  if(bonusRAF)cancelAnimationFrame(bonusRAF);bonusActive=false;document.getElementById("bonusOverlay").classList.remove("show");
  index=0;score=0;buildQuestions();
  document.getElementById("endOverlay").style.display="none";
  renderQuestion();
}

document.getElementById("speaker").addEventListener("click",speakQuestion);
document.getElementById("clearBtn").addEventListener("click",clearDrawing);
document.getElementById("nextBtn").addEventListener("click",nextQuestion);
document.getElementById("playAgain").addEventListener("click",restart);
document.getElementById("startBtn").addEventListener("click",()=>{
  if(bonusRAF)cancelAnimationFrame(bonusRAF);bonusActive=false;
  try{window._ac?.resume?.();}catch(e){}
  document.getElementById("startOverlay").style.display="none";
  buildQuestions();index=0;score=0;renderQuestion();
});
document.getElementById("drawCanvas").addEventListener("pointerdown",startDraw);
document.getElementById("drawCanvas").addEventListener("pointermove",moveDraw);
document.getElementById("drawCanvas").addEventListener("pointerup",endDraw);
document.getElementById("drawCanvas").addEventListener("pointercancel",()=>drawing=false);
window.addEventListener("resize",()=>requestAnimationFrame(resizeCanvas));
</script>

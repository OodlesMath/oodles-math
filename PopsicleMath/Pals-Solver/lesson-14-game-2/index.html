        /* Animated Clouds Background */
        .clouds-container { display: none !important; position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .cloud { position: absolute; background: #ffffff; border-radius: 50px; animation: float linear infinite; opacity: 0.95; box-shadow: 0 4px 0 rgba(255,255,255,0.4) inset; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
        .c1 { width: 120px; height: 35px; top: 12%; animation-duration: 40s; animation-delay: -5s; }
        .c1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
        .c1::after { width: 45px; height: 45px; top: -20px; right: 15px; }
        .c2 { width: 160px; height: 45px; top: 30%; animation-duration: 55s; animation-delay: -25s; transform: scale(1.1); opacity: 0.8; }
        .c2::before { width: 80px; height: 80px; top: -40px; left: 20px; }
        .c2::after { width: 65px; height: 65px; top: -25px; right: 25px; }
        .c3 { width: 90px; height: 30px; top: 60%; animation-duration: 35s; opacity: 0.85; }
        .c3::before { width: 50px; height: 50px; top: -25px; left: 10px; }
        
        @keyframes float { 
             0% { left: -200px; } 
             100% { left: 100vw; } 
        }

        /* 3D Chunky Buttons */
        .duo-btn-green { background-color: #58cc02; border-bottom: 5px solid #58a700; color: white; transition: transform 0.1s, border-bottom-width 0.1s; }
        .duo-btn-green:active:not(:disabled) { border-bottom-width: 0px; transform: translateY(5px); }
        
        .duo-btn-blue { background-color: #1cb0f6; border-bottom: 5px solid #1899d6; color: white; transition: transform 0.1s, border-bottom-width 0.1s; }
        .duo-btn-blue:active:not(:disabled) { border-bottom-width: 0px; transform: translateY(5px); }
        
        .duo-btn-white { background-color: #ffffff; border-bottom: 5px solid #e5e5e5; color: #4b4b4b; transition: transform 0.1s, border-bottom-width 0.1s, background-color 0.2s, color 0.2s; }
        .duo-btn-white:active:not(:disabled) { border-bottom-width: 0px; transform: translateY(5px); }
        
        .duo-btn-wrong { background-color: #ff4b4b; border-bottom: 5px solid #ea1515; color: white; transition: transform 0.1s, border-bottom-width 0.1s; }

        /* Realistic Glossy 3D Blocks */
        .base-cube {
            border-radius: 4px;
            box-shadow: 
                inset 1px 1px 2px rgba(255, 255, 255, 0.9), 
                inset -1px -1px 2px rgba(0, 0, 0, 0.25), 
                  1px 1px 3px rgba(0, 0, 0, 0.2);
        }
        .ten-rod-cube {
            background: linear-gradient(135deg, #60cffd 0%, #1cb0f6 40%, #009be5 100%);
            border: 1px solid #008cc9;
        }
        .one-cube {
            background: linear-gradient(135deg, #ffe970 0%, #ffc800 40%, #e5a900 100%);
            border: 1px solid #d69f00;
        }

        /* Subtracted / Ghosted styling (Soft fade, no X) */
        .subtracted-block {
            opacity: 0.25;
            filter: grayscale(40%);
            position: relative;
            transform: scale(0.95);
        }

        /* Card panels */
        .game-panel {
            background-color: #ffffff;
            box-shadow: 0 8px 0 rgba(220, 225, 230, 0.8);
            border: 2px solid #f1f5f9;
            border-radius: 24px;
        }

        /* Title Text Effect */
        .chunky-title {
            color: #ffffff;
            text-shadow: 0 6px 0 #1899d6, 0 10px 15px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }
        .text-glow-orange { text-shadow: 0 2px 4px rgba(255, 150, 0, 0.4); }
        .text-glow-purple { text-shadow: 0 2px 4px rgba(206, 130, 255, 0.4); }
        .text-glow-pink { text-shadow: 0 2px 4px rgba(255, 75, 75, 0.4); }

        /* Animations */
        @keyframes slide-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes bounce-in { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .animate-bounce-in { animation: bounce-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes wiggle { 
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg) scale(1.05); } 
        }
        .animate-wiggle { animation: wiggle 0.8s ease-in-out infinite; }

        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(88, 204, 2, 0); } 100% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0); } }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
        
        @keyframes balloon-float { 
             0% { transform: translate3d(0, 18vh, 0) scale(var(--scale)); opacity: 0; } 
             7% { opacity: 1; }
             100% { transform: translate3d(var(--drift), -128vh, 0) scale(var(--scale)); opacity: 1; } 
        }
        @keyframes balloon-sway {
            0% { transform: rotate(-4deg) translateX(-5px) scaleY(1); }
            33% { transform: rotate(3deg) translateX(5px) scaleY(1.015); }
            66% { transform: rotate(-2deg) translateX(2px) scaleY(.99); }
            100% { transform: rotate(-4deg) translateX(-5px) scaleY(1); }
        }
        .balloon-anim { will-change: transform, opacity; animation: balloon-float var(--duration) linear var(--delay) forwards; }
        .balloon-sway { will-change: transform; animation: balloon-sway var(--sway) ease-in-out infinite; transform-origin: 50% 95%; }
        .regroup-one { cursor: grab; filter: drop-shadow(0 0 5px rgba(255,200,0,.85)); }
        .regroup-one:active { cursor: grabbing; }
        .addition-drop-target { background: #e5ffcc !important; border: 3px solid #58cc02 !important; border-radius: 12px; box-shadow: inset 0 0 0 3px rgba(88,204,2,.12); }
        .addition-separator { width: 86%; border-top: 2px dashed rgba(148,163,184,.55); margin: 10px auto; }
        .made-ten { animation: make-ten-pop .55s cubic-bezier(.17,.89,.32,1.35); filter: drop-shadow(0 0 7px rgba(88,204,2,.6)); }
        @keyframes make-ten-pop { 0% { transform: scale(.25) rotate(-8deg); opacity: .2; } 65% { transform: scale(1.15) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        
        @keyframes float-inf { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .animate-float-inf { animation: float-inf 2s ease-in-out infinite; }
        
        .confetti-piece { position: absolute; z-index: 0; }


        /* Compact setup so the Play button stays visible on laptop screens */
        .setup-hero { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:10px; }
        .setup-icon { font-size:3.35rem; line-height:1; }
        .setup-card { margin-bottom:9px; padding:10px 12px; }
        .setup-card p { margin-bottom:7px; }
        @media (max-height: 850px) {
            #start-screen { justify-content:flex-start !important; padding-top:10px !important; padding-bottom:10px !important; }
            .setup-hero { margin-bottom:6px; }
            .setup-icon { font-size:2.8rem; }
            #start-title { font-size:2.7rem !important; line-height:1 !important; }
            .setup-subtitle { font-size:1.1rem !important; margin-top:4px !important; }

            subtractedTens: 0, // User clicked to subtract
            subtractedOnes: 0, // User clicked to subtract
            
            isBorrowingDrag: false,
            isMakingTenDrag: false,
            dragType: null,
            additionRegrouped: false,
            dragPos: { x: 0, y: 0, startX: 0, startY: 0 },
            selectedOption: null,
            feedback: null,
            notification: null,
            bonusActive: false
        };

        let audioCtx = null;
        let confettiReq = null;

        function playSound(type) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!audioCtx && AudioContext) audioCtx = new AudioContext();
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'unpop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1000, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'bonusPop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.15);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'magic') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(900, now + 0.4);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.linearRampToValueAtTime(0.25, now + 0.2);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'success') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'sine'; o.frequency.value = freq;
                    g.gain.setValueAtTime(0.2, now + i*0.1);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.25);
                    o.start(now + i*0.1); o.stop(now + i*0.1 + 0.25);
                });
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.25);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = i % 2 === 0 ? 'triangle' : 'sine'; 
                    o.frequency.value = freq;
                    const time = now + i * 0.15;
                    g.gain.setValueAtTime(0.2, time);
                    g.gain.linearRampToValueAtTime(0, time + 0.4);
                    o.start(time); o.stop(time + 0.4);
                });
            }
        }

        function speakEquation() {
            if ('speechSynthesis' in window) {
                const word = state.currentOperation === 'addition' ? 'plus' : 'minus';
                const text = `${state.question.n1} ${word} ${state.question.n2}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; 
                utterance.rate = 0.85; 
                utterance.pitch = 1.2; 
                window.speechSynthesis.cancel(); 
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateHeader() {

        function updateEquation() {

        function needsToBorrow() {
            if (state.currentOperation === 'addition') return false;
            const availableOnes = (state.question.n1 % 10) + (state.borrowedTens * 10);
            const targetOnes = state.question.n2 % 10;
            return availableOnes < targetOnes;
        }

        function updateBoard() {
            const tensCol = document.getElementById('tens-col');
            const onesCol = document.getElementById('ones-col');
            const hint = document.getElementById('borrow-hint');
            const isAddition = state.currentOperation === 'addition';

            tensCol.classList.remove('addition-drop-target');
            onesCol.classList.remove('bg-[#e5ffcc]', 'border-[#58cc02]', 'border-[3px]', 'rounded-lg');

            if (isAddition) {
                hint.classList.add('hidden');
                const baseTens = Math.floor(state.question.n1 / 10);
                const baseOnes = state.question.n1 % 10;
                const addTens = Math.floor(state.question.n2 / 10);
                const addOnes = state.question.n2 % 10;
                const totalOnes = baseOnes + addOnes;
                const needsRegroup = totalOnes >= 10;

                if (state.isMakingTenDrag) tensCol.classList.add('addition-drop-target');

                let topOnes = baseOnes;
                let bottomOnes = addOnes;
                if (state.additionRegrouped) {
                    const fromTop = Math.min(10, topOnes);
                    topOnes -= fromTop;
                    bottomOnes -= (10 - fromTop);
                }

                let tHtml = '<div class="w-full h-full flex flex-col items-center pt-2">';
                tHtml += '<div class="w-full flex flex-col items-center gap-1 min-h-[72px]">';
                for (let i = 0; i < baseTens; i++) tHtml += `<div class="inline-block m-[1px]">${getTenRodHTML()}</div>`;
                tHtml += '</div><div class="addition-separator"></div>';
                tHtml += '<div class="w-full flex flex-col items-center gap-1 min-h-[82px]">';
                for (let i = 0; i < addTens; i++) tHtml += `<div class="inline-block m-[1px]">${getTenRodHTML()}</div>`;
                if (state.additionRegrouped) {
                    tHtml += `<div class="made-ten inline-block m-[1px] relative">${getTenRodHTML()}<span class="absolute -right-12 top-1/2 -translate-y-1/2 text-[10px] font-black text-[#58a700] bg-white/90 px-1.5 py-0.5 rounded-lg border border-green-200 whitespace-nowrap">+1 TEN</span></div>`;
                }
                tHtml += '</div></div>';
                tensCol.innerHTML = tHtml;

                let globalIndex = 0;
                const cubeHTML = (count, afterRegroup=false) => {
                    let out = '<div class="flex flex-wrap justify-center content-start gap-[4px] min-h-[34px] px-1">';
                    for (let i = 0; i < count; i++) {
                        const regroupCandidate = needsRegroup && !state.additionRegrouped && globalIndex < 10;
                        const cls = regroupCandidate ? 'regroup-one draggable-ones-group hover:scale-110 active:scale-95 transition-transform' : '';
                        out += `<div class="inline-block ${cls}" data-regroup-one="${regroupCandidate ? 'true' : 'false'}">${getOneCubeHTML()}</div>`;
                        globalIndex++;
                    }
                    out += '</div>';
                    return out;
                };

                let oHtml = '<div class="w-full h-full flex flex-col items-center pt-3">';
                if (!state.additionRegrouped) {
                    oHtml += cubeHTML(baseOnes);
                    oHtml += '<div class="addition-separator"></div>';
                    oHtml += cubeHTML(addOnes);
                    if (needsRegroup) {
                        oHtml += `<div class="mt-auto mb-2 px-3 py-1.5 bg-[#fff8cc] border-2 border-[#ffc800] rounded-xl text-[11px] font-black text-[#b77900] shadow-sm animate-pulse">Drag the glowing 10 Ones → TENS</div>`;
                    }
                } else {
                    // Keep the two original addend rows after the ten Ones are exchanged.
                    oHtml += cubeHTML(topOnes, true);
                    oHtml += '<div class="addition-separator"></div>';
                    oHtml += cubeHTML(bottomOnes, true);
                    oHtml += `<div class="mt-auto mb-2 px-3 py-1 bg-[#e8ffd8] border-2 border-[#58cc02] rounded-xl text-[11px] font-black text-[#3f8f00]">10 Ones = 1 Ten ✓</div>`;
                }
                oHtml += '</div>';
                onesCol.innerHTML = oHtml;
            } else {
                const totalTens = Math.floor(state.question.n1 / 10) - state.borrowedTens;
                const totalOnes = (state.question.n1 % 10) + (state.borrowedTens * 10);
                let tHtml = '<div class="flex flex-col gap-1 w-full items-center justify-center mt-1">';
                const needBorrow = needsToBorrow();
                for(let i = 0; i < totalTens; i++) {
                    const isSubtracted = i >= (totalTens - state.subtractedTens);
                    const isBorrowable = (i === totalTens - state.subtractedTens - 1) && needBorrow;
                    let extraClasses = isSubtracted ? 'subtracted-block' : 'cursor-pointer hover:scale-105 active:scale-95 transition-transform';
                    if (isBorrowable) extraClasses += ' draggable-ten ring-4 ring-yellow-400 rounded-sm animate-wiggle';
                    tHtml += `<div data-action="toggle-ten" data-is-subtracted="${isSubtracted}" class="${extraClasses} inline-block m-[2px]">${getTenRodHTML()}</div>`;
                }
                tHtml += '</div>';
                tensCol.innerHTML = tHtml;
                if (needBorrow && !state.isBorrowingDrag) hint.classList.remove('hidden'); else hint.classList.add('hidden');
                if (state.isBorrowingDrag) onesCol.classList.add('bg-[#e5ffcc]', 'border-[#58cc02]', 'border-[3px]', 'rounded-lg');
                let oHtml = '<div class="flex flex-wrap content-start justify-center gap-[4px] w-full mt-1">';
                for(let i = 0; i < totalOnes; i++) {
                    const isSubtracted = i >= (totalOnes - state.subtractedOnes);
                    const extraClasses = isSubtracted ? 'subtracted-block' : 'cursor-pointer hover:scale-110 active:scale-90 transition-transform';
                    const isNew = state.borrowedTens > 0 && i >= (totalOnes - 10) && !isSubtracted;
                    const animClass = isNew ? 'animate-bounce-in' : '';
                    oHtml += `<div data-action="toggle-one" data-is-subtracted="${isSubtracted}" class="${extraClasses} ${animClass} inline-block">${getOneCubeHTML()}</div>`;
                }
                oHtml += '</div>';
                onesCol.innerHTML = oHtml;
            }
            if (isBoardCurrentlyValid()) document.getElementById('options-container').classList.add('animate-pulse-ring', 'rounded-[24px]');
            else document.getElementById('options-container').classList.remove('animate-pulse-ring');
        }

        function isBoardCurrentlyValid() {
            if (state.currentOperation === 'addition') {
                const totalOnes = (state.question.n1 % 10) + (state.question.n2 % 10);
                return totalOnes < 10 || state.additionRegrouped;
            }
            const targetTens = Math.floor(state.question.n2 / 10);
            const targetOnes = state.question.n2 % 10;
            return state.subtractedTens === targetTens && state.subtractedOnes === targetOnes;
        }

        function updateOptions() {
            const container = document.getElementById('options-container');
            const isBoardValid = isBoardCurrentlyValid();
            
            let html = '';
            state.options.forEach((opt) => {
                const isSelected = state.selectedOption === opt;
                
                let btnClass = "duo-btn-white shadow-sm text-[#1cb0f6]";
                let extraAttrs = `data-action="select-option" data-val="${opt}"`;
                let innerHtml = opt;
                
                if (!isBoardValid) {
                    btnClass = "bg-slate-100 text-slate-400 border-b-[5px] border-slate-200 cursor-not-allowed opacity-70";
                    extraAttrs = 'disabled';
                    innerHtml += `<div class="absolute right-4 opacity-40"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>`;
                } else if (isSelected && state.feedback === 'correct') {
                    btnClass = "duo-btn-green";
                } else if (isSelected && state.feedback === 'wrong') {
                    btnClass = "duo-btn-wrong";
                }
                
                if (state.feedback !== null) extraAttrs = 'disabled';
                
                html += `<button ${extraAttrs} class="h-[70px] rounded-[24px] text-4xl font-black relative flex items-center justify-center transition-transform ${btnClass}">${innerHtml}</button>`;
            });
            
            container.innerHTML = html;
        }

        function showNotification(msg) {
            const el = document.getElementById('notification-msg');
            el.innerText = msg;
            el.classList.remove('hidden');
            setTimeout(() => {
                el.classList.add('hidden');

        function updateFeedbackOverlay() {
            const overlay = document.getElementById('feedback-overlay');
            const iconContainer = document.getElementById('feedback-icon-container');
            const icon = document.getElementById('feedback-icon');
            
            if (state.feedback === 'correct' || state.feedback === 'wrong') {
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                
                if (state.feedback === 'correct') {
                    iconContainer.className = "p-8 md:p-10 rounded-full shadow-2xl animate-bounce-in border-[8px] border-white bg-[#58cc02]";
                    icon.innerHTML = '✓';
                } else {
                    iconContainer.className = "p-8 md:p-10 rounded-full shadow-2xl animate-bounce-in border-[8px] border-white bg-[#ff4b4b]";
                    icon.innerHTML = '✗';
                }
            } else {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
            }
        }

        function generateQuestion() {
            const maxVal = state.maxSum;
            // Mix alternates strictly: subtraction, addition, subtraction, addition...
            state.currentOperation = state.operationMode === 'mix'
                ? (state.completedQuestions % 2 === 0 ? 'subtraction' : 'addition')
                : state.operationMode;

            let n1, n2, ans, found = false, attempts = 0;
            while (!found && attempts < 500) {
                attempts++;
                if (state.currentOperation === 'addition') {
                    n1 = Math.floor(Math.random() * Math.max(2, maxVal - 2)) + 1;
                    n2 = Math.floor(Math.random() * Math.max(1, maxVal - n1)) + 1;
                    ans = n1 + n2;
                    if (ans > maxVal) continue;
                    const regroup = (n1 % 10) + (n2 % 10) >= 10;
                    if ((state.regroupMode === 'no-regroup' && !regroup) || (state.regroupMode === 'regroup' && regroup)) found = true;
                } else {
                    let minN1 = maxVal === 10 ? 3 : maxVal === 20 ? 11 : maxVal === 30 ? 21 : maxVal === 50 ? 31 : 51;
                    n1 = Math.floor(Math.random() * (maxVal - minN1 + 1)) + minN1;
                    n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
                    ans = n1 - n2;
                    if (ans % 10 === 0) continue;
                    const regroup = (n1 % 10) < (n2 % 10);
                    if ((state.regroupMode === 'no-regroup' && !regroup) || (state.regroupMode === 'regroup' && regroup)) found = true;
                }
            }
            if (!found) {
                if (state.currentOperation === 'addition') { n1 = Math.max(1, Math.floor(maxVal/2)-1); n2 = 1; ans = n1+n2; }
                else { n1 = Math.max(3, maxVal); n2 = 1; ans = n1-n2; }
            }

            const wrongOptions = new Set();
            while (wrongOptions.size < 3) {
                let offset = Math.random() > 0.5 ? (Math.random() > 0.5 ? 10 : -10) : (Math.floor(Math.random() * 7) - 3 || 1);
                const wrong = ans + offset;
                if (wrong >= 0 && wrong <= maxVal && wrong !== ans) wrongOptions.add(wrong);
            }
            state.question = { n1, n2, ans };
            state.options = [ans, ...wrongOptions].sort(() => Math.random() - 0.5);
            state.borrowedTens = 0;
            state.subtractedTens = 0;
            state.subtractedOnes = 0;
            state.additionRegrouped = false;
            state.isBorrowingDrag = false;
            state.isMakingTenDrag = false;
            state.dragType = null;
            state.selectedOption = null;
            state.feedback = null;
            updateUI();
        }

        function startGame() {
            playSound('success');
            state.score = 0;
            state.completedQuestions = 0;
            state.gameState = 'playing';
            if(confettiReq) { cancelAnimationFrame(confettiReq); confettiReq = null; }
            generateQuestion();
        }

        function handleAnswer(option) {
            if (state.feedback !== null) return;
            state.selectedOption = option;
            
            if (option === state.question.ans) {
                playSound('success');
                state.feedback = 'correct';
                state.score += 10;
                state.completedQuestions++;
                
                updateUI();
                
                setTimeout(() => {
                    const isLastRound = state.completedQuestions >= state.maxQuestions;
                    if ((state.completedQuestions % 2 === 0 && !isLastRound) || isLastRound) {
                        startBonusRound(isLastRound);
                    } else {
                        generateQuestion();
                    }
                }, 1500);

            } else {
                playSound('wrong');
                state.feedback = 'wrong';
                updateUI();
                setTimeout(() => {
                    state.feedback = null;
                    state.selectedOption = null;
                    updateUI();
                }, 1500);
            }
        }

        function setMainGameVisibility(visible) {
            const playing = document.getElementById('playing-screen');
            const header = document.getElementById('game-header');
            playing.style.visibility = visible ? 'visible' : 'hidden';
            header.style.visibility = visible ? 'visible' : 'hidden';
        }

        function startBonusRound(isLastRound) {

            state.feedback = null;
            updateFeedbackOverlay();
            setMainGameVisibility(false);

            const container = document.getElementById('bonus-container');

                <div class="absolute inset-0 overflow-hidden pointer-events-none">
                    <div class="absolute top-8 left-1/2 -translate-x-1/2 text-center animate-bounce-in z-20 pointer-events-none bg-white/85 px-7 py-3 rounded-[28px] border-4 border-white shadow-xl">
                      <h2 class="text-2xl md:text-[1.5rem] font-black text-[#ff9600] drop-shadow-sm">BALLOON TIME!</h2>

            `;

            const balloonColors = [
                { base: '#ff4b4b', dark:'#d92f2f', high: '#ffb0b0' },
                { base: '#1cb0f6', dark:'#087fba', high: '#b5eaff' },
                { base: '#58cc02', dark:'#399500', high: '#c8ff9f' },
                { base: '#ffc800', dark:'#d79e00', high: '#fff0a1' },
                { base: '#ce82ff', dark:'#9d4fd2', high: '#f0d3ff' },
                { base: '#ff9600', dark:'#d66d00', high: '#ffd29a' },

            const layer = document.getElementById('balloons-layer');
            for (let i = 0; i < 18; i++) {
                const id = `${Date.now()}-${i}`;
                const left = 4 + Math.random() * 90;
                const delay = -(Math.random() * 4.5);
                const duration = 9.5 + Math.random() * 4.5;
                const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
                const scale = 0.78 + Math.random() * 0.42;
                const swaySpeed = 2.8 + Math.random() * 2.1;
                const drift = `${(Math.random() - .5) * 110}px`;
                const bHTML = `
                    <div id="balloon-container-${id}" class="absolute bottom-[-145px] balloon-anim pointer-events-auto touch-none" data-color="${color.base}" style="left:${left}%; --scale:${scale}; --duration:${duration}s; --delay:${delay}s; --drift:${drift};">
                        <div id="balloon-${id}" class="balloon-sway cursor-pointer relative" style="--sway:${swaySpeed}s; width:70px; height:88px; background:radial-gradient(circle at 30% 24%, #ffffff 0 5%, ${color.high} 7%, ${color.base} 42%, ${color.dark} 100%); box-shadow:inset -8px -10px 16px rgba(0,0,0,.14), inset 6px 5px 10px rgba(255,255,255,.25), 0 7px 12px rgba(0,0,0,.14); border-radius:50% 50% 47% 47% / 43% 43% 58% 58%;" onpointerdown="popBalloon('${id}', event)">
                            <div class="absolute top-[13px] left-[15px] w-[14px] h-[25px] bg-white/55 rounded-full rotate-[24deg] blur-[.3px] pointer-events-none"></div>
                            <div class="absolute -bottom-[5px] left-1/2 -translate-x-1/2 w-0 h-0 border-l-[7px] border-r-[7px] border-t-[12px] border-l-transparent border-r-transparent pointer-events-none" style="border-top-color:${color.dark}"></div>
                            <svg class="absolute top-[92px] left-1/2 -translate-x-1/2 overflow-visible pointer-events-none" width="34" height="92" viewBox="0 0 34 92"><path d="M17 0 C 8 22, 27 31, 14 49 C 4 62, 24 72, 16 92" fill="none" stroke="rgba(90,90,90,.55)" stroke-width="1.4" stroke-linecap="round"/></svg>
                        </div>
                    </div>`;
                layer.insertAdjacentHTML('beforeend', bHTML);
            }
            container.classList.remove('hidden');

            setTimeout(() => {
                state.bonusActive = false;
                container.innerHTML = '';
                container.classList.add('hidden');
                setMainGameVisibility(true);
                if (isLastRound) {
                    playSound('fanfare');
                    state.gameState = 'finished';
                    updateUI();
                } else {
                    generateQuestion();
                }
            }, 15000);
        }

        function createBalloonPopEffect(x, y, color) {
            const layer = document.getElementById('balloons-layer');
            if (!layer) return;
            const ring = document.createElement('div');
            ring.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:18px;height:18px;border:4px solid ${color};border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);`;
            layer.appendChild(ring);
            ring.animate([
                { transform:'translate(-50%,-50%) scale(.4)', opacity:1 },
                { transform:'translate(-50%,-50%) scale(3.7)', opacity:0 }
            ], {duration:360, easing:'ease-out'}).onfinish = () => ring.remove();

            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                const size = 5 + Math.random() * 5;
                p.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color};border-radius:60% 35% 55% 40%;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.18);`;
                layer.appendChild(p);
                const a = (Math.PI * 2 * i / 12) + (Math.random()-.5)*.35;
                const d = 34 + Math.random()*48;
                const dx = Math.cos(a)*d, dy = Math.sin(a)*d;
                p.animate([
                    { transform:'translate(-50%,-50%) scale(1) rotate(0deg)', opacity:1 },
                    { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.2) rotate(${120+Math.random()*220}deg)`, opacity:0 }
                ], {duration:360+Math.random()*180, easing:'cubic-bezier(.12,.7,.25,1)'}).onfinish = () => p.remove();
            }
        }

        window.popBalloon = function(id, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const outer = document.getElementById(`balloon-container-${id}`);
            const inner = document.getElementById(`balloon-${id}`);
            if (!outer || !inner || outer.dataset.popped === '1') return;
            outer.dataset.popped = '1';
            playSound('bonusPop');
            state.score += 5;
            const rect = inner.getBoundingClientRect();
            const layerRect = document.getElementById('balloons-layer').getBoundingClientRect();
            const x = rect.left + rect.width/2 - layerRect.left;
            const y = rect.top + rect.height/2 - layerRect.top;
            createBalloonPopEffect(x, y, outer.dataset.color || '#ff4b4b');
            inner.animate([
                { transform:'scale(1)', opacity:1, filter:'brightness(1)' },
                { transform:'scale(1.22)', opacity:.95, filter:'brightness(1.35)' },
                { transform:'scale(.1)', opacity:0, filter:'brightness(2)' }
            ], {duration:150, easing:'ease-out'}).onfinish = () => outer.remove();
            updateHeader();
        }

        function startConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#58cc02', '#1cb0f6', '#ffc800', '#ff4b4b', '#ce82ff'];
            let particles = Array.from({ length: 120 }).map((_, i) => ({
              id: i,
              x: Math.random() * 100,
              y: -20 - Math.random() * 100,
              color: colors[Math.floor(Math.random() * colors.length)],
              speed: 0.4 + Math.random() * 1.2,
              spin: Math.random() * 360,
              spinSpeed: (Math.random() - 0.5) * 8,
              size: 0.6 + Math.random() * 1.2
            }));
            
            particles.forEach(p => {
                const el = document.createElement('div');
                el.className = 'confetti-piece rounded-[2px] shadow-sm';
                el.style.backgroundColor = p.color;
                el.style.width = `${14 * p.size}px`;
                el.style.height = `${14 * p.size}px`;
                el.id = `confetti-${p.id}`;
                container.appendChild(el);
            });

            function animate() {
                if(state.gameState !== 'finished') {
                    if(confettiReq) cancelAnimationFrame(confettiReq);
                    return;
                }
                particles.forEach(p => {
                    p.y += p.speed;
                    p.spin += p.spinSpeed;
                    
                    if (p.y > 110) {
                        p.y = -10;
                        p.x = Math.random() * 100;
                    }

                    const el = document.getElementById(`confetti-${p.id}`);
                    if (el) {
                        el.style.left = `${p.x}%`;
                        el.style.top = `${p.y}%`;
                        el.style.transform = `rotate(${p.spin}deg)`;
                    }
                });
                confettiReq = requestAnimationFrame(animate);
            }
            confettiReq = requestAnimationFrame(animate);
        }

        document.body.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            
            const action = target.getAttribute('data-action');
            
            if (action === 'start-game' || action === 'restart-game') {
                startGame();
            } else if (action === 'set-range') {
                const val = parseInt(target.getAttribute('data-val'));
                selectRange(val);
            } else if (action === 'set-mode') {
                const val = target.getAttribute('data-val');
                selectMode(val);
            } else if (action === 'set-operation') {
                const val = target.getAttribute('data-val');
                selectOperation(val);
            } else if (action === 'speak') {
                speakEquation();
            } else if (action === 'toggle-ten') {
                const isSubtracted = target.getAttribute('data-is-subtracted') === 'true';
                const targetTens = Math.floor(state.question.n2 / 10);
                
                if (isSubtracted) {
                    state.subtractedTens--;
                    playSound('unpop');
                } else {
                    if (state.subtractedTens < targetTens) {
                        state.subtractedTens++;
                        playSound('pop');
                    } else {
                        playSound('wrong');
                        showNotification(state.currentOperation === 'addition' ? `Add ${targetTens} Tens!` : `You only need to subtract ${targetTens} Tens!`);
                    }
                }
                updateBoard(); updateOptions();
            } else if (action === 'toggle-one') {
                const isSubtracted = target.getAttribute('data-is-subtracted') === 'true';
                const targetOnes = state.question.n2 % 10;
                
                if (isSubtracted) {
                    state.subtractedOnes--;
                    playSound('unpop');
                } else {
                    if (state.subtractedOnes < targetOnes) {
                        state.subtractedOnes++;
                        playSound('pop');
                    } else {
                        playSound('wrong');
                        showNotification(state.currentOperation === 'addition' ? `Add ${targetOnes} Ones!` : `You only need to subtract ${targetOnes} Ones!`);
                    }
                }
                updateBoard(); updateOptions();
            } else if (action === 'select-option') {
                if (!target.hasAttribute('disabled')) {
                    handleAnswer(parseInt(target.getAttribute('data-val')));
                }
            }
        });

        // Drag & Drop Regrouping Handling
        document.addEventListener('mousedown', handlePointerDown);
        document.addEventListener('touchstart', handlePointerDown, {passive: false});
        document.addEventListener('mousemove', handlePointerMove);
        document.addEventListener('touchmove', handlePointerMove, {passive: false});
        document.addEventListener('mouseup', handlePointerUp);
        document.addEventListener('touchend', handlePointerUp);

        function startDragPreview(clientX, clientY, html, borderColor='#1cb0f6') {
            const preview = document.getElementById('drag-preview');
            const content = document.getElementById('drag-preview-content');
            content.innerHTML = html;
            content.style.borderColor = borderColor;
            preview.style.left = `${clientX}px`;
            preview.style.top = `${clientY}px`;
            preview.classList.remove('hidden');
        }

        function handlePointerDown(e) {
            if (state.feedback !== null || state.bonusActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const makeTenCube = e.target.closest('.draggable-ones-group');
            if (makeTenCube && state.currentOperation === 'addition' && !state.additionRegrouped) {
                if (e.type === 'touchstart') e.preventDefault();
                state.isMakingTenDrag = true;
                state.dragType = 'make-ten';
                state.dragPos = { x:clientX, y:clientY, startX:clientX, startY:clientY };
                startDragPreview(clientX, clientY, getTenOnesPreviewHTML(), '#58cc02');
                updateBoard();
                return;
            }

            const draggableTen = e.target.closest('.draggable-ten');
            if (draggableTen && state.currentOperation === 'subtraction') {
                if(e.type === 'touchstart') e.preventDefault();
                state.isBorrowingDrag = true;
                state.dragType = 'break-ten';
                state.dragPos = { x:clientX, y:clientY, startX:clientX, startY:clientY };
                startDragPreview(clientX, clientY, getTenRodHTML(), '#1cb0f6');
                draggableTen.style.opacity = '0.3';
                draggableTen.id = 'current-dragged-ten';
                updateBoard();
            }
        }

        function handlePointerMove(e) {
            if (!state.isBorrowingDrag && !state.isMakingTenDrag) return;
            if(e.type === 'touchmove') e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            state.dragPos.x = clientX; state.dragPos.y = clientY;
            const preview = document.getElementById('drag-preview');
            preview.style.left = `${clientX}px`;
            preview.style.top = `${clientY}px`;
        }

        function handlePointerUp(e) {
            if (!state.isBorrowingDrag && !state.isMakingTenDrag) return;
            document.getElementById('drag-preview').classList.add('hidden');
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const dx = clientX - state.dragPos.startX, dy = clientY - state.dragPos.startY;
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (state.dragType === 'make-ten') {
                state.isMakingTenDrag = false;
                state.dragType = null;
                const tensCol = document.getElementById('tens-col');
                const rect = tensCol.getBoundingClientRect();
                if (clientX >= rect.left - 28 && clientX <= rect.right + 28 && clientY >= rect.top - 28 && clientY <= rect.bottom + 28) {
                    executeMakeTen();
                } else {
                    if (distance > 16) {
                        playSound('wrong');
                        showNotification('Drag the 10 Ones into the TENS area!');
                    }
                    updateBoard(); updateOptions();
                }
                return;
            }

            state.isBorrowingDrag = false;
            state.dragType = null;
            const dragged = document.getElementById('current-dragged-ten');
            if(dragged) { dragged.style.opacity = '1'; dragged.removeAttribute('id'); }
            const onesCol = document.getElementById('ones-col');
            const rect = onesCol.getBoundingClientRect();
            if (clientX >= rect.left - 20 && clientX <= rect.right + 20 && clientY >= rect.top - 20 && clientY <= rect.bottom + 20) {
                executeBreakTen();
            } else {
                if (distance > 20) {
                    playSound('wrong');
                    showNotification('Drag and Drop it in the ONES area!');
                }
                updateBoard(); updateOptions();
            }
        }

        function executeBreakTen() {
            playSound('magic');
            state.borrowedTens++;
            showNotification('Broke a Ten into 10 Ones!');
            updateBoard();
            updateOptions();
        }

        function executeMakeTen() {
            if (state.currentOperation !== 'addition' || state.additionRegrouped) return;
            const totalOnes = (state.question.n1 % 10) + (state.question.n2 % 10);
            if (totalOnes < 10) return;
            playSound('magic');
            state.additionRegrouped = true;
            showNotification('10 Ones = 1 Ten!');
            updateBoard();
            updateOptions();
        }

        // Initialize Game
        updateUI();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../assets/brand.css">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Position & Direction - Ver 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #87cefa; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        /* Background template extracted from Odd Even Ver1 */
        body {
            background: transparent !important;
        }
        #bgwao-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(180deg, #48b1fa 0%, #87cefa 35%, #d7f4fc 100%);
            isolation: isolate;
        }
        #bgwao-background > svg:first-child {
            position: absolute !important;
            width: 0 !important;
            height: 0 !important;
            pointer-events: none;
        }
        /* Sun from background */
        #bgwao-background .sun {
            display: block !important;
            position: absolute;
            top: 8%;
            left: 10%;
            width: 120px;
            height: 120px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4), 0 0 0 30px rgba(255, 215, 0, 0.2), 0 0 70px rgba(255, 215, 0, 0.9);
            z-index: 1;
            animation: bgwaoPulseSun 4s infinite alternate ease-in-out;
        }
        @keyframes bgwaoPulseSun {
            0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4), 0 0 0 30px rgba(255, 215, 0, 0.2), 0 0 70px rgba(255, 215, 0, 0.9); }
            100% { transform: scale(1.08) rotate(10deg); box-shadow: 0 0 0 18px rgba(255, 215, 0, 0.3), 0 0 0 45px rgba(255, 215, 0, 0.1), 0 0 100px rgba(255, 255, 0, 1); }
        }
        #bgwao-background .rainbow { display: none !important; }

        /* Keep the cloud feel from this code */
        #bgwao-background .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            z-index: 3;
            animation: bgwaoFloatCloud linear infinite;
            box-shadow: none;
        }
        #bgwao-background .cloud::before,
        #bgwao-background .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: none;
        }
        #bgwao-background .cloud1 {
            width: 100px;
            height: 40px;
            top: 10%;
            left: -100px;
            animation-duration: 25s;
        }
        #bgwao-background .cloud1::before {
            width: 50px;
            height: 50px;
            top: -20px;
            left: 15px;
        }
        #bgwao-background .cloud1::after {
            width: 40px;
            height: 40px;
            top: -15px;
            right: 15px;
        }
        #bgwao-background .cloud2 {
            width: 150px;
            height: 50px;
            top: 25%;
            left: -150px;
            animation-duration: 35s;
            animation-delay: 5s;
        }
        #bgwao-background .cloud2::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }
        #bgwao-background .cloud2::after {
            width: 50px;
            height: 50px;
            top: -20px;
            right: 25px;
        }
        #bgwao-background .cloud3 {
            width: 100px;
            height: 40px;
            top: 42%;
            left: -120px;
            animation-duration: 30s;
            animation-delay: 10s;
            transform: scale(.9);
        }
        #bgwao-background .cloud3::before {
            width: 50px;
            height: 50px;
            top: -20px;
            left: 15px;
        }
        #bgwao-background .cloud3::after {
            width: 40px;
            height: 40px;
            top: -15px;
            right: 15px;
        }
        @keyframes bgwaoFloatCloud {
            from { transform: translateX(-150px); }
            to { transform: translateX(110vw); }
        }

        #bgwao-background .scenery-layer { position: absolute; bottom: 0; left: 0; width: 100%; pointer-events: none; }
        #bgwao-background .layer-back { z-index: 10; height: 35vh; }
        #bgwao-background .layer-mid { z-index: 20; height: 28vh; }
        #bgwao-background .layer-front { z-index: 30; height: 20vh; }
        #bgwao-background .hill-svg { position: absolute; bottom: -5px; left: 0; width: 100%; height: 100%; min-height: 25vh; }
        #bgwao-background .flora { position: absolute; bottom: 0; }
        #bgwao-background .sway { transform-origin: bottom center; animation: bgwaoSway 5s ease-in-out infinite; }
        #bgwao-background .sway-reverse { transform-origin: bottom center; animation: bgwaoSwayReverse 6s ease-in-out infinite; }
        #bgwao-background .sway-fast { transform-origin: bottom center; animation: bgwaoSway 3.5s ease-in-out infinite; }
        @keyframes bgwaoSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
        @keyframes bgwaoSwayReverse { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }

        #bgwao-background .butterfly {
            position: absolute;
            z-index: 25;
            width: 34px;
            height: 26px;
            pointer-events: none;
            filter: drop-shadow(0 2px 3px rgba(15,23,42,.15));
        }
        #bgwao-background .butterfly svg { width: 100%; height: 100%; overflow: visible; }
        #bgwao-background .butterfly .wing-left,
        #bgwao-background .butterfly .wing-right {
            transform-box: fill-box;
            animation-duration: .34s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        #bgwao-background .butterfly .wing-left { transform-origin: 100% 50%; animation-name: prettyWingLeft; }
        #bgwao-background .butterfly .wing-right { transform-origin: 0% 50%; animation-name: prettyWingRight; }
        @keyframes prettyWingLeft {
            from { transform: scaleX(.38) rotate(-7deg); }
            to { transform: scaleX(1) rotate(7deg); }
        }
        @keyframes prettyWingRight {
            from { transform: scaleX(.38) rotate(7deg); }
            to { transform: scaleX(1) rotate(-7deg); }
        }
        #bgwao-background .butterfly .butterfly-body { filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
        @keyframes bgwaoFlyOne {
            0% { left: -8%; top: 20%; transform: translate(0,0) scale(.95); }
            25% { top: 14%; transform: translate(18vw, -1.2vh) scale(1.05); }
            50% { top: 24%; transform: translate(42vw, 1.8vh) scale(1); }
            75% { top: 17%; transform: translate(67vw, -2vh) scale(1.08); }
            100% { left: 102%; top: 22%; transform: translate(0,0) scale(1); }
        }
        @keyframes bgwaoFlyTwo {
            0% { left: 110%; top: 32%; transform: translate(0,0) scale(.8) scaleX(-1); }
            25% { top: 28%; transform: translate(-22vw, 1vh) scale(.92) scaleX(-1); }
            50% { top: 36%; transform: translate(-45vw, -1.5vh) scale(.84) scaleX(-1); }
            75% { top: 29%; transform: translate(-70vw, 1.8vh) scale(.95) scaleX(-1); }
            100% { left: -10%; top: 34%; transform: translate(0,0) scale(.88) scaleX(-1); }
        }
        @keyframes bgwaoFlyThree {
            0% { left: -6%; top: 48%; transform: translate(0,0) scale(.72); }
            30% { top: 42%; transform: translate(28vw, -2vh) scale(.8); }
            65% { top: 50%; transform: translate(56vw, 2.2vh) scale(.78); }
            100% { left: 104%; top: 44%; transform: translate(0,0) scale(.74); }
        }
        @keyframes bgwaoFlyFour {
            0% { left: 105%; top: 16%; transform: translate(0,0) scale(.82) scaleX(-1); }
            35% { top: 20%; transform: translate(-30vw, 2vh) scale(.9) scaleX(-1); }
            70% { top: 14%; transform: translate(-62vw, -1vh) scale(.86) scaleX(-1); }
            100% { left: -8%; top: 18%; transform: translate(0,0) scale(.82) scaleX(-1); }
        }
        #bgwao-background .butterfly-1 { animation: bgwaoFlyOne 20s linear infinite; }
        #bgwao-background .butterfly-2 { animation: bgwaoFlyTwo 24s linear infinite; }
        #bgwao-background .butterfly-3 { animation: bgwaoFlyThree 18s linear infinite; }
        #bgwao-background .butterfly-4 { animation: bgwaoFlyFour 22s linear infinite; }

        @media (max-width: 600px) {
            #bgwao-background .sun { width: 86px; height: 86px; left: 8%; top: 7%; }
            #bgwao-background .cloud1 { width: 72px; height: 28px; }
            #bgwao-background .cloud2 { width: 108px; height: 36px; }
            #bgwao-background .cloud3 { width: 72px; height: 28px; }
            #bgwao-background .cloud1::before, #bgwao-background .cloud3::before { width: 34px; height: 34px; top: -13px; left: 10px; }
            #bgwao-background .cloud1::after, #bgwao-background .cloud3::after { width: 28px; height: 28px; top: -10px; right: 10px; }
            #bgwao-background .cloud2::before { width: 42px; height: 42px; top: -18px; left: 14px; }
            #bgwao-background .cloud2::after { width: 34px; height: 34px; top: -13px; right: 16px; }
        }


    

/* ===== Position & Direction game overlay - Ver3 ===== */
:root{
  --ink:#183153; --muted:#54708c; --blue:#1cb0f6; --blue-dark:#1589c0;
  --green:#58cc02; --green-dark:#3f9b00; --red:#ff4b4b; --red-dark:#d92f2f;
  --purple:#8b5cf6; --purple-dark:#6d3bd1; --cyan:#13b7cf; --cyan-dark:#078aa0;
  --orange:#ff9f0a; --orange-dark:#c97800;
}
html,body{font-family:'Poppins',sans-serif;color:var(--ink);background:#87cefa;}
button{font:inherit}
#app{position:relative;z-index:60;width:100%;height:100%;display:flex;justify-content:center;padding:18px 26px 22px;pointer-events:none}
.shell{width:min(1450px,100%);height:100%;display:flex;flex-direction:column;min-width:0;pointer-events:none}
.topbar{height:90px;display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.35fr) 230px;align-items:center;gap:18px;padding:0 6px 10px;pointer-events:auto}
.brand{display:flex;align-items:center;gap:0;min-width:0;padding-left:8px}
.brand-badge{display:none!important}
.brand-copy b{display:block;font-size:clamp(20px,2vw,30px);font-weight:900;letter-spacing:-.035em;white-space:nowrap;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.brand-copy span{display:block;color:#45627e;font-weight:800;font-size:13px;text-shadow:0 1px 0 white}
.progress-wrap{background:rgba(255,255,255,.93);border:3px solid rgba(255,255,255,.98);border-radius:25px;padding:12px 17px;box-shadow:0 8px 0 rgba(23,99,139,.13),0 12px 28px rgba(22,82,121,.1);display:flex;align-items:center;gap:14px;min-width:0;backdrop-filter:blur(7px)}
.progress-copy{font-weight:900;white-space:nowrap;font-size:15px}.meter{flex:1;height:17px;border-radius:999px;background:#e6f0f6;border:3px solid #ccdde8;overflow:hidden;min-width:120px}.bar{height:100%;width:0%;background:repeating-linear-gradient(45deg,#7cde45,#7cde45 11px,#58cc02 11px,#58cc02 22px);border-radius:999px;transition:width .35s ease}.star-mini{font-size:18px;font-weight:900;white-space:nowrap;color:#9c6800}.logo-space{height:68px}

.game-card{flex:1;min-height:0;background:transparent;border:0;box-shadow:none;padding:0;display:flex;flex-direction:column;overflow:visible;pointer-events:auto}
#welcome,#finish{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:rgba(255,255,255,.83);border:4px solid rgba(255,255,255,.96);border-radius:36px;box-shadow:0 18px 45px rgba(28,90,127,.16);backdrop-filter:blur(8px);max-width:900px;width:100%;margin:auto}
.hero-icon{font-size:88px;line-height:1;filter:drop-shadow(0 10px 8px rgba(0,0,0,.12));animation:bob 2.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#welcome h1,#finish h1{font-size:clamp(38px,5vw,64px);line-height:1.02;margin:16px 0 7px;color:#6d45d8;font-weight:900;letter-spacing:-.05em}#welcome p,#finish p{font-size:clamp(17px,2vw,23px);max-width:760px;margin:5px 0 22px;color:var(--muted);font-weight:700}.vocab-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}.pill{background:#fff;border:3px solid #d7e4ec;border-radius:999px;padding:9px 15px;font-weight:900;font-size:15px;box-shadow:0 4px 0 #d7e4ec}.main-btn{border:0;border-radius:24px;background:var(--green);color:white;font-weight:900;font-size:23px;padding:17px 32px;box-shadow:0 8px 0 var(--green-dark);cursor:pointer;min-width:270px}.main-btn:active{transform:translateY(7px);box-shadow:0 1px 0 var(--green-dark)}

#quiz{height:100%;display:none;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0;padding-top:4px}
.question-zone{width:min(800px,66%);flex:0 0 auto;min-height:240px;background:rgba(255,255,255,.92);border:4px solid rgba(255,255,255,.98);border-radius:34px;padding:15px 22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;overflow:visible;box-shadow:0 12px 0 rgba(255,255,255,.28),0 20px 42px rgba(28,90,127,.13);backdrop-filter:blur(7px)}
.question-line{width:100%;display:flex;align-items:center;justify-content:center;gap:13px;min-height:58px}#questionText{font-size:clamp(26px,3vw,40px);font-weight:900;line-height:1.13;text-align:center;letter-spacing:-.035em}#speakBtn{width:52px;height:52px;flex:0 0 52px;border-radius:50%;border:3px solid white;background:var(--blue);color:white;font-size:23px;box-shadow:0 6px 0 var(--blue-dark);cursor:pointer}#speakBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--blue-dark)}
#visual{width:100%;display:flex;align-items:center;justify-content:center;gap:20px;min-height:148px;padding-top:8px;flex-wrap:wrap}
.object-card,.clock-card,.single-object{display:flex;align-items:center;justify-content:center;background:rgba(235,249,255,.52);border:4px solid rgba(255,255,255,.78);border-radius:28px;box-shadow:0 12px 30px rgba(35,114,156,.10),inset 0 1px 0 rgba(255,255,255,.75);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.object-card{width:184px;height:124px}.single-object{width:196px;height:126px}.clock-card{width:176px;height:176px}.arrow-card,.quarter-card{display:flex;align-items:center;justify-content:center;width:148px;height:128px;background:rgba(235,249,255,.52);border:4px solid rgba(255,255,255,.78);border-radius:28px;box-shadow:0 12px 30px rgba(35,114,156,.10),inset 0 1px 0 rgba(255,255,255,.75);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}.arrow-between{display:flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;background:rgba(108,197,242,.17)}.arrow-between svg{width:44px;height:44px}.worksheet-demo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%}.worksheet-box{display:flex;align-items:center;justify-content:center;gap:24px;min-height:138px;width:min(690px,88%);padding:12px 24px;background:linear-gradient(180deg,rgba(238,250,255,.68),rgba(224,246,255,.52));border:4px solid rgba(255,255,255,.86);border-radius:30px;box-shadow:0 14px 32px rgba(35,114,156,.10),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.worksheet-item{display:flex;align-items:center;justify-content:center;width:150px;height:106px}.worksheet-mid{display:flex;align-items:center;justify-content:center;width:90px;height:72px}.worksheet-caption{font-size:16px;font-weight:700;color:#1f2730}.worksheet-note{font-size:16px;font-weight:800;color:#1f2730;margin-bottom:4px}

.answer-grid{width:min(760px,74%);height:126px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;margin-top:auto;margin-bottom:34px;flex:none}
.answer{position:relative;border:4px solid rgba(255,255,255,.97);border-radius:30px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0;padding:10px 18px;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.16),0 12px 18px rgba(18,65,98,.12)}
.answer:nth-child(1){background:linear-gradient(180deg,#40d35d,#31c455);box-shadow:0 8px 0 #2298bf,0 12px 18px rgba(18,65,98,.12)}.answer:nth-child(2){background:linear-gradient(180deg,#f26abc,#ea8dcb);box-shadow:0 8px 0 #cc3f88,0 12px 18px rgba(18,65,98,.12)}
.answer:hover{filter:brightness(1.035);transform:translateY(-2px)}.answer:active{transform:translateY(7px);box-shadow:0 2px 0 rgba(0,0,0,.2)}.answer .letter{display:none}.answer-content{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-weight:900;font-size:clamp(24px,1.9vw,30px);line-height:1.05;text-shadow:0 2px 3px rgba(0,0,0,.16)}.answer-content .answer-icon{display:flex;align-items:center;justify-content:center;width:92px;height:60px}.answer-content .answer-icon svg{width:100%;height:100%}.answer.correct{background:linear-gradient(180deg,#6bd629,#58cc02)!important;box-shadow:0 8px 0 var(--green-dark)!important;animation:correctPop .38s ease}.answer.wrong{background:linear-gradient(180deg,#ff6767,#ff4b4b)!important;box-shadow:0 8px 0 var(--red-dark)!important;animation:shake .38s ease}@keyframes correctPop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.feedback{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);z-index:10;border-radius:999px;padding:8px 18px;font-weight:900;font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s;background:white;box-shadow:0 5px 18px rgba(0,0,0,.12);white-space:nowrap}.feedback.show{opacity:1}.feedback.good{color:#2f8d00}.feedback.bad{color:#d23030}
#confetti{position:fixed;inset:0;z-index:999;pointer-events:none;width:100%;height:100%}.hidden{display:none!important}

@media(max-height:760px){.topbar{height:78px}.question-zone{min-height:196px}.answer-grid{height:112px;margin-top:auto;margin-bottom:20px;width:min(700px,78%)}.object-card{width:156px;height:104px}.single-object{width:164px;height:106px}.clock-card{width:136px;height:136px}.arrow-card{width:122px;height:106px}.answer-content .answer-icon{width:82px;height:54px}}
@media(max-width:980px){#app{padding:10px 12px 16px}.topbar{height:76px;grid-template-columns:1fr 1.4fr 100px;gap:8px}.brand-copy span{display:none}.progress-wrap{padding:9px 10px}.progress-copy{font-size:12px}.star-mini{font-size:14px}.question-zone{width:96%}.answer-grid{width:min(720px,90%);height:118px;gap:18px;margin-top:auto;margin-bottom:24px}.answer{border-radius:24px}.answer-content{font-size:21px}.answer-content .answer-icon{width:84px;height:56px}.object-card{width:158px;height:108px}.single-object{width:166px;height:110px}.clock-card{width:144px;height:144px}.arrow-card{width:126px;height:112px}}
@media(max-width:760px){.topbar{grid-template-columns:1fr 1.3fr 40px}.logo-space{width:40px}.brand-copy b{font-size:16px}.star-mini{display:none}.answer-grid{height:auto;width:94%;grid-template-columns:1fr;grid-template-rows:repeat(2,96px);gap:10px;margin-top:auto;margin-bottom:14px}.answer-content{flex-direction:row;gap:12px}.answer-content .answer-icon{width:66px;height:46px}.question-zone{min-height:182px}#questionText{font-size:22px}.object-card{width:142px;height:98px}.single-object{width:150px;height:100px}.clock-card{width:124px;height:124px}.arrow-card{width:108px;height:92px}}

</style>

<body>
<img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div id="bgwao-background" aria-hidden="true">
<!-- GLOBAL SVG DEFINITIONS -->
    <!-- Replaced 'class="hidden"' (display: none) with absolute positioning. 
         display: none breaks SVG gradient URL references in many modern browsers! -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
        <defs>
            <!-- Gradients for Hills -->
            <linearGradient id="hillGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8ce62c" />
                <stop offset="100%" stop-color="#55b300" />
            </linearGradient>
            <linearGradient id="hillGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#73d914" />
                <stop offset="100%" stop-color="#449400" />
            </linearGradient>
            <linearGradient id="hillGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#58cc02" />
                <stop offset="100%" stop-color="#2c7000" />
            </linearGradient>

            <!-- Gradients for Trees -->
            <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#5C3A21" />
                <stop offset="50%" stop-color="#8B5A2B" />
                <stop offset="100%" stop-color="#4A2F1D" />
            </linearGradient>
            <linearGradient id="canopyGradBase" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#58CC02" />
                <stop offset="100%" stop-color="#2D7A00" />
            </linearGradient>
            <linearGradient id="canopyGradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8bf836" />
                <stop offset="100%" stop-color="#58CC02" />
            </linearGradient>

            <!-- 1. Beautiful Fluffy Tree Template (V10 - Thicker Trunk) -->
            <g id="beautiful-tree">
                <!-- Enlarged shadow at base to match thicker trunk -->
                <ellipse cx="100" cy="245" rx="45" ry="12" fill="rgba(0,0,0,0.15)" />

<script>
(()=>{
    const $ = sel => document.querySelector(sel);
    const welcome = $('#welcome');

    const againBtn = $('#againBtn');
    const speakBtn = $('#speakBtn');
    const questionText = $('#questionText');

    const answers = $('#answers');
    const progressText = $('#progressText');
    const progressBar = $('#progressBar');
    const starMini = $('#starMini');
    const feedback = $('#feedback');
    const finalScore = $('#finalScore');

    const ORIENTS = ['up','right','down','left'];
    const OBJECTS = [
      {id:'pencil',name:'pencil'},
      {id:'fork',name:'fork'},
      {id:'bottle',name:'bottle'},
      {id:'crayon',name:'crayon'},
      {id:'phone',name:'phone'},
      {id:'toothbrush',name:'toothbrush'},
      {id:'rocket',name:'rocket'},
      {id:'paintbrush',name:'paint brush'},
      {id:'spoon',name:'spoon'},
      {id:'key',name:'key'}
    ];

    let deck = [];
    let index = 0;
    let stars = 0;
    let hadMistake = false;
    let locked = false;

    const Sound = {
      ctx:null,
      ensure(){
        if(!this.ctx){
          const AC = window.AudioContext || window.webkitAudioContext;
          if(AC) this.ctx = new AC();
        }
        if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      beep(freq,dur=.12,type='sine',gain=.05,delay=0){
        this.ensure(); if(!this.ctx) return;
        const t=this.ctx.currentTime+delay, o=this.ctx.createOscillator(), g=this.ctx.createGain();
        o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+dur+.02);
      },
      good(){this.beep(660,.1,'triangle',.055);this.beep(880,.14,'triangle',.055,.11)},
      bad(){this.beep(170,.16,'sawtooth',.05);this.beep(120,.2,'sawtooth',.04,.08)},
      win(){this.beep(523,.12,'triangle',.05);this.beep(659,.12,'triangle',.05,.12);this.beep(784,.22,'triangle',.05,.24)}
    };

    function shuffle(arr){
      const a=[...arr];
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
      return a;
    }

    function rotateOrientation(orientation,dir){
      const i=ORIENTS.indexOf(orientation);
      return ORIENTS[(i + (dir==='cw'?1:3)) % 4];
    }

    function angleFor(o){return {up:0,right:90,down:180,left:270}[o] || 0;}

        <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb2a6"/><stop offset=".45" stop-color="#f36f5d"/><stop offset="1" stop-color="#c43b32"/></linearGradient>
      </defs>`;
      const start = `<g transform="rotate(${angle} 60 60)">`;
      let shape='';
      if(type==='pencil'){
        shape=`
          <path d="M48 24 Q48 18 54 18 H66 Q72 18 72 24 V88 Q72 94 66 94 H54 Q48 94 48 88 Z" fill="url(#gold)" stroke="${stroke}" stroke-width="2.2"/>
          <path d="M48 24 L60 6 L72 24 Z" fill="#e7c39a" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round"/>

        shape=`
          <path d="M53 38 Q53 32 59 32 H61 Q67 32 67 38 V96 Q67 103 60 103 Q53 103 53 96 Z" fill="url(#metal)" stroke="${stroke}" stroke-width="2.2"/>

        shape=`
          <rect x="52" y="7" width="16" height="12" rx="3.5" fill="url(#red)" stroke="${stroke}" stroke-width="2"/><path d="M54 11 H66" stroke="#ffd5ce" stroke-width="2" stroke-linecap="round" opacity=".8"/>
          <path d="M51 18 H69 V28 Q69 31 75 37 V91 Q75 103 63 105 H57 Q45 103 45 91 V37 Q51 31 51 28 Z" fill="url(#teal)" stroke="${stroke}" stroke-width="2.3"/>
          <path d="M49 40 Q60 34 71 40" fill="none" stroke="#8ad6ca" stroke-width="6" opacity=".8"/>
          <path d="M53 55 H67" stroke="#c9f2eb" stroke-width="4" stroke-linecap="round" opacity=".55"/>
          <path d="M48 25 C37 30 38 49 47 53" fill="none" stroke="#dfe8e6" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="46" cy="54" r="3" fill="#dfe8e6"/>
        `;
      } else if(type==='crayon'){
        shape=`
          <path d="M48 22 L60 6 L72 22 V96 Q72 101 67 101 H53 Q48 101 48 96 Z" fill="url(#pink)" stroke="${stroke}" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M48 37 H72 V50 H48 Z M48 67 H72 V80 H48 Z" fill="#fff2df" opacity=".96"/>
          <path d="M51 40 H69 M51 46 H69 M51 70 H69 M51 76 H69" stroke="#673548" stroke-width="2" stroke-linecap="round" opacity=".8"/>
          <path d="M54 25 V91" stroke="#ffb5c9" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        `;
      } else if(type==='phone'){
        shape=`
          <rect x="41" y="9" width="38" height="102" rx="11" fill="#1d2733" stroke="#17202a" stroke-width="2.6"/><rect x="44.5" y="12.5" width="31" height="95" rx="8" fill="#f8fbfd"/>
          <rect x="47" y="22" width="26" height="65" rx="4" fill="url(#blue)"/><path d="M50 26 H70" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
          <rect x="53" y="15" width="14" height="4" rx="2" fill="#657486"/>
          <circle cx="60" cy="99" r="4.2" fill="#59697a"/><circle cx="60" cy="99" r="2.2" fill="#cfd8df"/>
          <path d="M51 27 H69" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".65"/>
        `;
      } else if(type==='toothbrush'){
        shape=`
          <path d="M54 18 Q54 13 59 13 H61 Q66 13 66 18 V91 Q66 98 60 101 Q54 98 54 91 Z" fill="url(#blue)" stroke="${stroke}" stroke-width="2.2"/>
          <rect x="48" y="81" width="24" height="14" rx="7" fill="#f47b9d" stroke="${stroke}" stroke-width="2"/>
          <rect x="46" y="8" width="28" height="13" rx="5" fill="#e4f6ff" stroke="${stroke}" stroke-width="1.8"/>
          <path d="M50 8 V3 M56 8 V2 M62 8 V2 M68 8 V3" stroke="#8bd3f4" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M58 24 V75" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
        `;
      } else if(type==='rocket'){
        shape=`
          <path d="M60 8 C75 19 79 38 77 58 C75 75 69 90 60 103 C51 90 45 75 43 58 C41 38 45 19 60 8 Z" fill="#f3f6f8" stroke="${stroke}" stroke-width="2.4"/>
          <path d="M60 10 C69 22 72 38 70 55 C69 68 65 80 60 89 C55 80 51 68 50 55 C48 38 51 22 60 10 Z" fill="url(#blue)" opacity=".9"/>
          <circle cx="60" cy="42" r="9" fill="#58bce8" stroke="${stroke}" stroke-width="2"/><circle cx="57" cy="39" r="3" fill="#c9f2ff"/>
          <path d="M44 62 L32 78 L46 77 L50 68 Z M76 62 L88 78 L74 77 L70 68 Z" fill="#f65e73" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>
          <path d="M55 93 L60 109 L65 93 Z" fill="#ffb11e" stroke="#dc7d00" stroke-width="1.7"/>
        `;
      } else if(type==='paintbrush'){
        shape=`
          <path d="M53 34 H67 V92 Q67 99 60 101 Q53 99 53 92 Z" fill="url(#blue)" stroke="${stroke}" stroke-width="2.2"/>
          <path d="M49 28 H71 L68 40 H52 Z" fill="url(#metal)" stroke="${stroke}" stroke-width="2"/>
          <path d="M48 25 C49 12 71 12 72 25 Q67 31 60 32 Q53 31 48 25 Z" fill="url(#red)" stroke="${stroke}" stroke-width="2.2"/>
          <path d="M54 17 Q60 11 66 17" fill="none" stroke="#ffb3a6" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        `;
      } else if(type==='spoon'){
        shape=`
          <ellipse cx="60" cy="29" rx="17" ry="22" fill="url(#metal)" stroke="${stroke}" stroke-width="2.2"/>
          <ellipse cx="54" cy="22" rx="6" ry="9" fill="#ffffff" opacity=".58"/>
          <path d="M55 46 Q55 42 60 42 Q65 42 65 46 V98 Q65 104 60 104 Q55 104 55 98 Z" fill="url(#metal)" stroke="${stroke}" stroke-width="2.2"/>
          <path d="M58 50 V93" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".55"/>
        `;
      } else if(type==='key'){
        shape=`
          <circle cx="60" cy="27" r="16" fill="url(#gold)" stroke="${stroke}" stroke-width="2.3"/><path d="M50 19 Q60 12 70 20" fill="none" stroke="#fff6c6" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>
          <circle cx="60" cy="27" r="5.3" fill="#fffaf0" stroke="#d49f16" stroke-width="1.7"/>
          <path d="M56 41 H64 V78 H76 V85 H70 V92 H63 V85 H56 Z" fill="url(#gold)" stroke="${stroke}" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M54 18 Q60 12 66 18" fill="none" stroke="#fff4b5" stroke-width="2.6" stroke-linecap="round" opacity=".75"/>
        `;
      }
      return svgOpen + defs + start + shape + '</g></svg>';
    }

    function clockSvg(orientation='up',size=140){
      const angle=angleFor(orientation);
      let ticks='';
      for(let i=0;i<12;i++){
        const a=i*30*Math.PI/180;
        const x1=60+Math.sin(a)*33, y1=60-Math.cos(a)*33, x2=60+Math.sin(a)*43, y2=60-Math.cos(a)*43;
        ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>`;
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="clock" style="filter:drop-shadow(0 7px 7px rgba(31,71,111,.14))">
        <circle cx="60" cy="60" r="55" fill="none" stroke="#000000" stroke-width="4.5"/>
        <circle cx="60" cy="60" r="42" fill="#000000" stroke="#000000" stroke-width="4"/>
        ${ticks}
        <line x1="60" y1="60" x2="60" y2="30" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" transform="rotate(${angle} 60 60)"/>
        <line x1="60" y1="60" x2="81" y2="49" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
        <circle cx="60" cy="60" r="4.8" fill="#ffffff"/>
      </svg>`;
    }

    function directionArrowSvg(dir,size=92,stroke='white'){
      const isCw = dir==='cw';
      const topArc = isCw ? 'M26 48 A28 28 0 0 1 72 24' : 'M74 48 A28 28 0 0 0 28 24';
      const bottomArc = isCw ? 'M74 52 A28 28 0 0 1 28 76' : 'M26 52 A28 28 0 0 0 72 76';
      const topHead = isCw
        ? `<polygon points="68,14 84,24 67,35" fill="${stroke}"/>`
        : `<polygon points="32,14 16,24 33,35" fill="${stroke}"/>`;
      const bottomHead = isCw
        ? `<polygon points="32,65 16,76 33,87" fill="${stroke}"/>`
        : `<polygon points="68,65 84,76 67,87" fill="${stroke}"/>`;
      return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
        <path d="${topArc}" fill="none" stroke="${stroke}" stroke-width="6.5" stroke-linecap="round"/>
        <path d="${bottomArc}" fill="none" stroke="${stroke}" stroke-width="6.5" stroke-linecap="round"/>
        ${topHead}
        ${bottomHead}
      </svg>`;
    }

    function clockDirectionScene(size=224){
      return `<svg width="${size}" height="${size}" viewBox="0 0 220 220" aria-label="clock direction" style="overflow:visible">
        <path d="M164 48 A78 78 0 0 1 176 112" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
        <polygon points="170,106 188,118 168,126" fill="#000"/>
        <path d="M46 108 A78 78 0 0 1 58 44" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
        <polygon points="62,58 40,42 46,67" fill="#000"/>
        <path d="M153 156 A78 78 0 0 1 72 171" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
        <path d="M67 63 A78 78 0 0 1 147 49" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
        <circle cx="110" cy="110" r="42" fill="#000" stroke="#000" stroke-width="4"/>
        <g stroke="#fff" stroke-width="5" stroke-linecap="round">
          <line x1="110" y1="75" x2="110" y2="65"/><line x1="127" y1="79" x2="132" y2="71"/><line x1="141" y1="93" x2="149" y2="88"/><line x1="145" y1="110" x2="155" y2="110"/><line x1="141" y1="127" x2="149" y2="132"/><line x1="127" y1="141" x2="132" y2="149"/><line x1="110" y1="145" x2="110" y2="155"/><line x1="93" y1="141" x2="88" y2="149"/><line x1="79" y1="127" x2="71" y2="132"/><line x1="75" y1="110" x2="65" y2="110"/><line x1="79" y1="93" x2="71" y2="88"/><line x1="93" y1="79" x2="88" y2="71"/>
        </g>
        <line x1="110" y1="110" x2="100" y2="78" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <line x1="110" y1="110" x2="136" y2="96" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <circle cx="110" cy="110" r="5" fill="#fff"/>
      </svg>`;
    }

    function quarterTurnSvg(size=90,stroke='white'){
      return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="34" cy="69" r="5" fill="${stroke}" opacity=".92"/>
        <path d="M34 69 A35 35 0 0 1 69 34" fill="none" stroke="${stroke}" stroke-width="9" stroke-linecap="round"/>
        <polygon points="60,26 78,30 70,47" fill="${stroke}"/>
        <path d="M34 69 H69 V34" fill="none" stroke="${stroke}" stroke-width="3.5" stroke-linecap="round" opacity=".55"/>
        <text x="29" y="35" text-anchor="middle" font-size="19" font-weight="900" fill="${stroke}" font-family="Poppins, sans-serif">¼</text>
      </svg>`;
    }

    function answerCardSvg(type){
      if(type==='cw') return directionArrowSvg('cw',92,'white');
      return directionArrowSvg('ccw',92,'white');
    }

    function answerLabel(type){
      return type==='cw' ? 'Clockwise' : 'Anti-clockwise';
    }

    function buildVocabChoices(correct){
      return shuffle(['cw','ccw']).map(type=>(
        { value:type, correct:type===correct, html:`<div class="answer-icon">${answerCardSvg(type)}</div><div>${answerLabel(type)}</div>` }
      ));
    }

    function pairVisual(obj,before,after){
      return `
        <div class="worksheet-demo">
          <div class="worksheet-box">
            <div class="worksheet-item">${objectSvg(obj.id,before,154)}</div>
            <div class="worksheet-mid"><svg viewBox="0 0 100 60" aria-hidden="true"><path d="M10 30 H68" fill="none" stroke="#6cbcff" stroke-width="10" stroke-linecap="round"/><polygon points="64,15 90,30 64,45" fill="#6cbcff"/></svg></div>
            <div class="worksheet-item">${objectSvg(obj.id,after,154)}</div>
          </div>
          <div class="worksheet-caption">Clockwise / Anti-clockwise</div>
        </div>`;
    }
    function singleVisual(obj,before){return `<div class="single-object">${objectSvg(obj.id,before,154)}</div>`;}
    function clockPairVisual(){
      return `
        <div class="worksheet-demo">
          <div class="worksheet-note">Look at the clock!</div>
          <div class="clock-card">${clockDirectionScene(224)}</div>
        </div>`;
    }
    function arrowVisual(dir){return `<div class="arrow-card">${directionArrowSvg(dir,126,'#111111')}</div>`;}
    function quarterVisual(){return `<div class="quarter-card">${quarterTurnSvg(112,'#1aa4eb')}</div>`;}
    function objectWithTurnArrow(obj,before,dir){
      const after=rotateOrientation(before,dir);
      return pairVisual(obj,before,after);
    }

    function buildQuestionBank(){
      const bank=[];
      OBJECTS.forEach((obj,oi)=>{
        ORIENTS.forEach((before,bi)=>{
          const dir=(oi+bi)%2===0 ? 'cw' : 'ccw';
          const after=rotateOrientation(before,dir);
          bank.push({
            id:`${dir}-${obj.id}-${before}`,
            prompt:'Which way did it turn?',
            speech:'Which way did it turn?',
            visual:pairVisual(obj,before,after),
            correct:dir
          });
        });
      });
      return bank;
    }

    function pickDeck(){
      const bank = buildQuestionBank();
      const groups = {
        cw: shuffle(bank.filter(q=>q.correct==='cw')),
        ccw: shuffle(bank.filter(q=>q.correct==='ccw'))
      };
      const selected = [];
      for(let i=0;i<5;i++){
        if(groups.cw[i]) selected.push(groups.cw[i]);
        if(groups.ccw[i]) selected.push(groups.ccw[i]);
      }
      return shuffle(selected.slice(0,10));
    }

    function startGame(){
      Sound.ensure();
      if('speechSynthesis' in window) window.speechSynthesis.cancel();
      deck=pickDeck();index=0;stars=0;hadMistake=false;locked=false;
      welcome.classList.add('hidden');finish.classList.add('hidden');quiz.style.display='flex';
      renderQuestion();
    }

    function renderQuestion(){
      locked=false;hadMistake=false;
      feedback.className='feedback';feedback.textContent='';
      const q=deck[index];
      questionText.textContent=q.prompt;
      visual.innerHTML=q.visual;
      const choiceData=buildVocabChoices(q.correct);
      answers.innerHTML='';
      const letters=['A','B'];
      choiceData.forEach((choice,i)=>{
        const btn=document.createElement('button');
        btn.type='button';btn.className='answer';
        btn.dataset.correct=choice.correct?'1':'0';
        btn.innerHTML=`<span class="letter">${letters[i]}</span><div class="answer-content">${choice.html}</div>`;
        btn.addEventListener('click',()=>chooseAnswer(btn));
        answers.appendChild(btn);
      });
      progressText.textContent=`Question ${index+1} / 10`;
      progressBar.style.width=`${(index/10)*100}%`;
      starMini.textContent=`⭐ ${stars}`;
    }

    function chooseAnswer(btn){
      if(locked) return;
      if(btn.dataset.correct==='1'){
        locked=true;btn.classList.add('correct');
        if(!hadMistake) stars++;
        starMini.textContent=`⭐ ${stars}`;
        feedback.textContent=hadMistake?'Correct! Nice try!':'Great job! ⭐';
        feedback.className='feedback show good';
        Sound.good();burst(45);
        setTimeout(()=>{
          index++;
          progressBar.style.width=`${(index/10)*100}%`;
          if(index>=10) endGame(); else renderQuestion();
        },1100);
      }else{
        hadMistake=true;
        btn.classList.add('wrong');
        feedback.textContent='Try again!';
        feedback.className='feedback show bad';
        Sound.bad();
        setTimeout(()=>{btn.classList.remove('wrong');feedback.className='feedback';},700);
      }
    }

    function endGame(){
      quiz.style.display='none';finish.classList.remove('hidden');
      finalScore.textContent=`⭐ ${stars} / 10`;
      progressText.textContent='Finished!';progressBar.style.width='100%';starMini.textContent=`⭐ ${stars}`;
      Sound.win();burst(220);
      speak('Great job! You finished the Rotation Challenge!');
    }

    function speak(text){
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;u.pitch=1.05;
      const voices=window.speechSynthesis.getVoices();
      const preferred=voices.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google|Microsoft|English/i.test(v.name)) || voices.find(v=>/en/i.test(v.lang));
      if(preferred) u.voice=preferred;
      window.speechSynthesis.speak(u);
    }

    startBtn.addEventListener('click',startGame);
    againBtn.addEventListener('click',startGame);
    speakBtn.addEventListener('click',()=>{if(deck[index]) speak(deck[index].speech);});

    // Confetti
    const c=$('#confetti'),ctx=c.getContext('2d');let parts=[];
    function resizeConfetti(){const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2));c.width=Math.floor(innerWidth*dpr);c.height=Math.floor(innerHeight*dpr);c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
    addEventListener('resize',resizeConfetti);resizeConfetti();
    function burst(n){const colors=['#58cc02','#1cb0f6','#ffc800','#ec4899','#8b5cf6','#f97316'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.48,vx:(Math.random()-.5)*13,vy:-4-Math.random()*10,g:.20+Math.random()*.13,r:3+Math.random()*5,a:Math.random()*Math.PI*2,va:(Math.random()-.5)*.25,color:colors[Math.floor(Math.random()*colors.length)],life:80+Math.random()*70});}
    function confettiLoop(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);ctx.restore();if(p.life<=0||p.y>innerHeight+30)parts.splice(i,1);}requestAnimationFrame(confettiLoop);}confettiLoop();
  })();
</script>

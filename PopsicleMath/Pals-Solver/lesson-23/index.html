<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun with Groups - Version 7</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        @keyframes roll3d {
            0% { transform: rotate(0deg) scale(1) translateY(0); }
            20% { transform: rotate(-180deg) scale(1.15) translateY(-15px); }
            40% { transform: rotate(180deg) scale(0.9) translateY(10px); }
            60% { transform: rotate(-360deg) scale(1.1) translateY(-8px); }
            80% { transform: rotate(540deg) scale(0.95) translateY(4px); }
            100% { transform: rotate(720deg) scale(1) translateY(0); }
        }

        .rolling {
            animation: roll3d 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); transform: scale(1); }
            50% { box-shadow: 0 0 30px rgba(251, 191, 36, 1); transform: scale(1.05); }
        }

        .roll-me {
            animation: pulseGlow 2s infinite;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3) translateY(20px); }
            70% { opacity: 1; transform: scale(1.08) translateY(-4px); }
            100% { transform: scale(1) translateY(0); }
        }

        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        .dice-dot {
            width: 12px !important;
            height: 12px !important;
            min-width: 12px !important;
            min-height: 12px !important;
            background-color: #1e3a8a; /* Deep dark blue color */
            border-radius: 50% !important;
            flex-shrink: 0;
            aspect-ratio: 1 / 1;
            /* 3D Dimple Effect - Adjusted for smaller size */
            box-shadow: inset 0 2px 4px rgba(0,0,20,0.8), 0 1px 1px rgba(255,255,255,0.9);
        }

        .dice-dot-large {
            width: 15px !important; /* Reduced from 24px so dots don't touch */
            height: 15px !important;
            min-width: 15px !important;
            min-height: 15px !important;
        }

        .drop-target-active {
            background-color: rgba(255, 255, 255, 0.6) !important;
            border-color: #3b82f6 !important;
            transform: scale(1.01);
        }

        .custom-scroll::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(226, 232, 240, 0.5);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-2 md:p-6 text-slate-800 relative overflow-x-hidden">
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <div class="fixed inset-0 z-[-1] overflow-hidden bg-gradient-to-b from-sky-300 to-sky-100">
        <!-- Rainbow -->
        <svg class="absolute top-10 left-[-5%] md:left-10 w-64 h-64 md:w-80 md:h-80 opacity-70 drop-shadow-lg" viewBox="0 0 100 50">
            <path d="M 10,50 A 40,40 0 0,1 90,50" fill="none" stroke="#ef4444" stroke-width="6"/>
            <path d="M 17,50 A 33,33 0 0,1 83,50" fill="none" stroke="#f97316" stroke-width="6"/>
            <path d="M 24,50 A 26,26 0 0,1 76,50" fill="none" stroke="#eab308" stroke-width="6"/>
            <path d="M 31,50 A 19,19 0 0,1 69,50" fill="none" stroke="#22c55e" stroke-width="6"/>

    <header class="max-w-4xl mx-auto w-full bg-white/80 backdrop-blur-md border-4 border-white rounded-full p-2 md:p-3 shadow-xl flex justify-between items-center gap-2 mt-2 md:mt-4 relative z-10">

                <!-- Count & Clear Button -->

                    <span id="group-counter-badge" class="bg-blue-100 text-blue-800 border-2 border-blue-200 font-black text-sm md:text-base px-4 py-2 rounded-xl">
                        Placed: <span id="current-group-count" class="text-blue-600 font-extrabold text-lg">0</span>

        <!-- Inline Feedback Panel (Compact Laptop/Mobile Layout) -->
        <div id="inline-feedback-panel" class="hidden flex-col items-center w-full animate-pop mt-2">
            <div class="bg-white border-4 border-yellow-400 rounded-3xl w-full p-3 md:p-4 shadow-xl flex flex-col md:flex-row items-stretch justify-between gap-3 md:gap-4 relative overflow-hidden">
                
                <!-- Math Block -->
                <div class="bg-blue-50 border-4 border-blue-200 rounded-2xl p-3 md:p-4 shadow-sm flex-1 flex flex-col justify-center">
                    <div id="math-groups-desc" class="text-lg md:text-xl font-bold text-slate-800 mb-2 text-center"></div>
                    <div class="bg-white border-4 border-blue-300 rounded-xl p-2 text-center shadow-sm my-1">
                        <span id="math-equation" class="text-2xl md:text-4xl font-black text-pink-500 tracking-wide"></span>
                    </div>

                <button id="inline-next-btn" class="w-full md:w-auto md:min-w-[200px] shrink-0 bg-gradient-to-b from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white font-black text-xl md:text-2xl py-4 md:py-0 px-6 rounded-2xl shadow-lg border-b-[6px] border-green-700 active:translate-y-1.5 active:border-b-0 transition flex flex-row md:flex-col items-center justify-center gap-2">
                    <span>CONTINUE</span> <i class="fa-solid fa-arrow-right text-2xl md:mt-1"></i>
                </button>

            </div>
        </div>

    </main>

    <!-- End Game Modal -->
    <div id="endgame-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white border-8 border-pink-400 rounded-3xl max-w-lg w-full p-8 shadow-2xl text-center transform transition-all animate-pop relative overflow-hidden">
            <div class="text-7xl md:text-8xl mb-4 animate-bounce">🏆</div>
            <h2 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-pink-500 mb-2">Round Complete!</h2>
            <p class="text-slate-600 font-bold text-xl md:text-2xl mb-6">You are a math superstar! 🌟</p>
            
            <div class="bg-sky-50 border-4 border-sky-200 rounded-2xl p-6 mb-8 shadow-inner">
                <p class="text-sky-500 font-black uppercase tracking-widest mb-2 text-lg">Final Score</p>
                <div class="flex items-center justify-center gap-3">
                    <span class="text-4xl">⭐</span>
                    <p class="text-6xl font-black text-sky-600" id="final-score-text">100</p>
                </div>
            </div>

            <button id="play-again-btn" class="w-full bg-gradient-to-b from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-black text-2xl py-4 px-6 rounded-2xl shadow-xl border-b-[6px] border-pink-700 active:translate-y-1.5 active:border-b-0 transition flex items-center justify-center gap-3">
                <span>PLAY AGAIN</span> <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-msg" class="fixed top-20 left-1/2 -translate-x-1/2 bg-orange-500 text-white font-bold px-6 py-4 rounded-2xl shadow-2xl border-4 border-orange-300 flex items-center gap-4 transition-all transform -translate-y-20 opacity-0 z-[60] pointer-events-none">
        <i class="fa-solid fa-circle-exclamation text-3xl text-yellow-200"></i>
        <div>
            <p id="toast-title" class="font-extrabold text-lg leading-tight uppercase">Try again!</p>
            <p id="toast-desc" class="text-sm text-orange-100 font-medium">Check the number of dice.</p>
        </div>
    </div>

    <!-- Confetti on Top -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none w-full h-full z-[105]"></canvas>

    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playRoll() {
                if (!this.enabled) return;
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                for (let i = 0; i < 5; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200 + Math.random() * 300, now + i * 0.08);
                    gain.gain.setValueAtTime(0.15, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.06);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.07);
                }
            }

            playAdd() {
                if (!this.enabled) return;
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.12);
            }

            playRemove() {
                if (!this.enabled) return;
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.1);
            }

            playSuccess() {
                if (!this.enabled) return;
                this.init(); if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C E G C
                const now = this.ctx.currentTime;
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1); osc.stop(now + idx * 0.1 + 0.4);
                });
            }

            playTryAgain() {
                if (!this.enabled) return;
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [300, 250];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.2);
                    gain.gain.setValueAtTime(0.1, now + idx * 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.2 + 0.25);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.2); osc.stop(now + idx * 0.2 + 0.25);
                });
            }
            
            playWinRound() {
                if (!this.enabled) return;
                this.init(); if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.1, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1); osc.stop(now + idx * 0.1 + 0.3);
                });
            }
        }

        const sound = new SoundFX();

        const gameState = {
            questionPool: [],
            currentQuestionIndex: 0,
            maxQuestions: 10,
            
            currentDiceValue: null,
            targetGroupsCount: 0,
            placedDiceCount: 0,
            score: 0,
            hasRolled: false,
            boardFrozen: false, 
            currentMCQPoints: 10 
        };

        const mainDice = document.getElementById('main-dice');
        const diceDotsGrid = document.getElementById('dice-dots-grid');
        const rollBtn = document.getElementById('roll-btn');
        const instructionText = document.getElementById('instruction-text');
        const inlineSpeakBtn = document.getElementById('inline-speak-btn');
        const mcqSpeakBtn = document.getElementById('mcq-speak-btn');
        
        const workspaceDropzone = document.getElementById('workspace-dropzone');
        const playgroundFloor = document.getElementById('playground-floor');
        const emptyWorkspaceMsg = document.getElementById('empty-workspace-msg');
        const currentGroupCountEl = document.getElementById('current-group-count');
        
        const actionControls = document.getElementById('action-controls');
        const checkBtn = document.getElementById('check-btn');
        const clearBtn = document.getElementById('clear-btn');
        
        const mcqPanel = document.getElementById('mcq-panel');
        const mcqOptions = document.getElementById('mcq-options');
        const inlineFeedbackPanel = document.getElementById('inline-feedback-panel');
        const inlineNextBtn = document.getElementById('inline-next-btn');

        const scoreText = document.getElementById('score-text');
        const questionText = document.getElementById('question-text');
        const soundToggleBtn = document.getElementById('sound-toggle-btn');
        const soundIcon = document.getElementById('sound-icon');
        
        const endgameModal = document.getElementById('endgame-modal');
        const playAgainBtn = document.getElementById('play-again-btn');
        const finalScoreText = document.getElementById('final-score-text');
        const toastMsg = document.getElementById('toast-msg');

        function generateQuestionPool() {
            const allCombos = [];
            const validValues = [2, 3, 5];
            for (let target = 3; target <= 10; target++) {
                for (let val of validValues) {
                    allCombos.push({ targetGroupsCount: target, currentDiceValue: val });
                }
            }
            for (let i = allCombos.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allCombos[i], allCombos[j]] = [allCombos[j], allCombos[i]];
            }
            return allCombos.slice(0, 10);
        }

        function initRound() {
            gameState.questionPool = generateQuestionPool();
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            updateScoreUI();
            nextQuestionSetup();
        }

        function updateScoreUI() {
            scoreText.textContent = gameState.score;
            questionText.textContent = `${gameState.currentQuestionIndex}/${gameState.maxQuestions}`;
        }

        function renderDiceDots(containerEl, value, isLarge = false) {
            containerEl.innerHTML = '';
            let activePositions = [];
            if (value === 2) activePositions = [1, 9];
            else if (value === 3) activePositions = [1, 5, 9];
            else if (value === 5) activePositions = [1, 3, 5, 7, 9];

            const dotClass = isLarge ? 'dice-dot dice-dot-large' : 'dice-dot';

            for (let pos = 1; pos <= 9; pos++) {
                const cell = document.createElement('div');
                cell.className = 'w-full h-full flex items-center justify-center';
                if (activePositions.includes(pos)) {
                    const dot = document.createElement('div');
                    dot.className = dotClass;
                    cell.appendChild(dot);
                }
                containerEl.appendChild(cell);
            }
        }

        function rollDice() {
            if (mainDice.classList.contains('rolling') || gameState.hasRolled || gameState.boardFrozen) return;

            sound.playRoll();
            mainDice.classList.remove('roll-me');
            mainDice.classList.add('rolling');

            const validVals = [2,3,5];
            let intervalCount = 0;
            const rollInterval = setInterval(() => {
                const tempVal = validVals[Math.floor(Math.random() * validVals.length)];
                renderDiceDots(diceDotsGrid, tempVal, true);
                intervalCount++;
                if (intervalCount > 7) clearInterval(rollInterval);
            }, 80);

            setTimeout(() => {
                mainDice.classList.remove('rolling');

                const currentQ = gameState.questionPool[gameState.currentQuestionIndex];
                gameState.currentDiceValue = currentQ.currentDiceValue;
                gameState.targetGroupsCount = currentQ.targetGroupsCount;
                gameState.hasRolled = true;

                renderDiceDots(diceDotsGrid, gameState.currentDiceValue, true);
                instructionText.innerHTML = `Build <span class="text-sky-600 underline font-black decoration-orange-400 decoration-4">${gameState.targetGroupsCount} groups</span> of <span class="text-pink-500 font-black">${gameState.currentDiceValue}</span>`;

                mainDice.style.cursor = 'grab';
                checkBtn.disabled = false;
                inlineSpeakBtn.classList.remove('hidden');
                
                speakInstruction();
            }, 800);
        }

        function addDiceGroup() {
            if (!gameState.hasRolled || gameState.boardFrozen) {
                if (!gameState.boardFrozen) showToast("Roll first!", "Click the dice to begin.");
                return;
            }

            sound.playAdd();
            gameState.placedDiceCount++;
            if (emptyWorkspaceMsg) emptyWorkspaceMsg.classList.add('hidden');

            const diceCard = document.createElement('div');
            diceCard.className = "animate-pop relative bg-blue-50 border-4 border-blue-400 rounded-3xl p-3 shadow-md flex flex-col items-center justify-center gap-2 hover:border-blue-500 hover:-translate-y-1 transition cursor-pointer group dice-block shrink-0";
            diceCard.dataset.index = gameState.placedDiceCount;

            const label = document.createElement('span');
            label.className = "text-[11px] font-black uppercase tracking-widest text-blue-700 bg-blue-200 px-3 py-1 rounded-full shadow-inner";
            label.textContent = `Group ${gameState.placedDiceCount}`;

            const diceFace = document.createElement('div');
            diceFace.className = "w-16 h-16 bg-gradient-to-br from-white to-blue-50 border-4 border-blue-200 rounded-2xl p-1 grid grid-cols-3 grid-rows-3 items-center justify-items-center shadow-inner shrink-0";
            renderDiceDots(diceFace, gameState.currentDiceValue, false);

            const removeBtn = document.createElement('button');
            removeBtn.className = "remove-block-btn absolute -top-3 -right-3 bg-pink-500 hover:bg-pink-600 border-2 border-white text-white w-8 h-8 rounded-full flex items-center justify-center text-sm font-black shadow-lg transition transform scale-90 group-hover:scale-110";
            removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';

            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                removeDiceGroup(diceCard);
            });

            diceCard.addEventListener('click', () => {
                removeDiceGroup(diceCard);
            });

            diceCard.appendChild(removeBtn);
            diceCard.appendChild(label);
            diceCard.appendChild(diceFace);

            playgroundFloor.appendChild(diceCard);
            updateWorkspaceUI();
        }

        function removeDiceGroup(cardEl) {
            if (gameState.boardFrozen) return;
            sound.playRemove();
            cardEl.remove();
            gameState.placedDiceCount = Math.max(0, gameState.placedDiceCount - 1);
            
            const cards = playgroundFloor.querySelectorAll('.dice-block');
            cards.forEach((card, idx) => {
                const label = card.querySelector('span');
                if (label) label.textContent = `Group ${idx + 1}`;
            });

            if (gameState.placedDiceCount === 0) emptyWorkspaceMsg.classList.remove('hidden');
            updateWorkspaceUI();
        }

        function clearWorkspace() {
            if (gameState.placedDiceCount === 0 || gameState.boardFrozen) return;
            sound.playRemove();
            const cards = playgroundFloor.querySelectorAll('.dice-block');
            cards.forEach(card => card.remove());
            gameState.placedDiceCount = 0;
            emptyWorkspaceMsg.classList.remove('hidden');
            updateWorkspaceUI();
        }

        function updateWorkspaceUI() {
            currentGroupCountEl.textContent = gameState.placedDiceCount;
        }

        function checkAnswer() {
            if (!gameState.hasRolled || gameState.boardFrozen) return;

            const target = gameState.targetGroupsCount;
            const placed = gameState.placedDiceCount;
            const dots = gameState.currentDiceValue;

            if (placed === target) {
                sound.playAdd(); 
                showMCQPanel(target, dots);
            } else {
                sound.playTryAgain();
                if (placed === 0) showToast("Workspace is empty!", `Drag ${target} blocks into the area.`);
                else if (placed < target) showToast("Need more blocks!", `You have ${placed}, but need ${target}.`);
                else showToast("Too many blocks!", `You have ${placed}, but need only ${target}.`);
            }
        }

        function showMCQPanel(groups, dotsEach) {
            gameState.boardFrozen = true;
            clearBtn.disabled = true;
            clearBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            const removeBtns = playgroundFloor.querySelectorAll('.remove-block-btn');
            removeBtns.forEach(btn => btn.classList.add('hidden'));

            actionControls.classList.add('hidden');
            mcqPanel.classList.remove('hidden');
            mcqPanel.classList.add('flex');

            const correctAns = groups * dotsEach;
            let options = [correctAns];

            if (correctAns + dotsEach > 0) options.push(correctAns + dotsEach);
            if (correctAns - dotsEach > 0 && !options.includes(correctAns - dotsEach)) options.push(correctAns - dotsEach);
            if (!options.includes(groups + dotsEach)) options.push(groups + dotsEach);

            while(options.length < 4) {
                let wrong = correctAns + (Math.floor(Math.random() * 4) + 1) * (Math.random() > 0.5 ? 1 : -1);
                if (wrong > 0 && !options.includes(wrong)) options.push(wrong);
            }
            options = options.slice(0, 4);
            options.sort(() => Math.random() - 0.5);

            mcqOptions.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-white border-4 border-sky-300 hover:border-sky-500 hover:bg-sky-50 text-sky-700 font-black text-2xl md:text-3xl py-3 md:py-4 px-8 md:px-10 rounded-2xl shadow-md transform transition active:scale-95 flex-1 min-w-[80px] max-w-[120px]";
                btn.textContent = opt;
                btn.onclick = () => handleMCQSelection(opt, correctAns, btn, groups, dotsEach);
                mcqOptions.appendChild(btn);
            });

            speakMCQInstruction();
        }

        function speakMCQInstruction() {
            if ('speechSynthesis' in window && sound.enabled) {
                window.speechSynthesis.cancel();
                const speech = new SpeechSynthesisUtterance("How many dots are there altogether?");
                speech.rate = 0.9;
                window.speechSynthesis.speak(speech);
            }
        }

        function handleMCQSelection(selected, correct, btn, groups, dotsEach) {
            if (selected === correct) {
                sound.playSuccess();
                gameState.score += gameState.currentMCQPoints;
                updateScoreUI();
                
                showInlineVictory(groups, dotsEach);
                triggerConfetti(50, false);
            } else {
                sound.playTryAgain();
                gameState.currentMCQPoints = 0; 
                btn.classList.add('opacity-50', 'bg-slate-200', 'border-slate-300', 'text-slate-400');
                btn.classList.remove('hover:border-sky-500', 'hover:bg-sky-50', 'border-sky-300', 'text-sky-700');
                btn.disabled = true;
                showToast("Try Again!", "Count the dots carefully.");
            }
        }

        function showInlineVictory(groups, dotsEach) {
            const total = groups * dotsEach;
            document.getElementById('math-groups-desc').innerHTML = 
                `<span class="text-sky-600 font-extrabold">${groups} groups</span> of <span class="text-pink-500 font-extrabold">${dotsEach}</span> equals <span class="text-orange-500 font-extrabold">${total}</span>`;
            document.getElementById('math-equation').innerHTML = 
                `<span class="text-sky-500">${groups}</span> × <span class="text-pink-500">${dotsEach}</span> = <span class="text-purple-600 underline">${total}</span>`;
            
            const additionArr = Array(groups).fill(dotsEach);
            document.getElementById('repeated-addition').innerHTML = 
                `${additionArr.join(' + ')} = <b>${total}</b>`;

            mcqPanel.classList.add('hidden');
            mcqPanel.classList.remove('flex');
            
            inlineFeedbackPanel.classList.remove('hidden');
            inlineFeedbackPanel.classList.add('flex');

            if ('speechSynthesis' in window && sound.enabled) {
                setTimeout(() => {
                    const speech = new SpeechSynthesisUtterance(`${groups} groups of ${dotsEach} equals ${total}!`);
                    speech.rate = 0.9;
                    window.speechSynthesis.speak(speech);
                }, 500); 
            }
        }

        function handleInlineNext() {
            inlineFeedbackPanel.classList.add('hidden');
            inlineFeedbackPanel.classList.remove('flex');
            gameState.currentQuestionIndex++;
            updateScoreUI();

            if (gameState.currentQuestionIndex >= gameState.maxQuestions) {
                sound.playWinRound();
                finalScoreText.textContent = gameState.score;
                endgameModal.classList.remove('hidden');
                triggerConfetti(200, true);
            } else {
                nextQuestionSetup();
            }
        }

        function nextQuestionSetup() {
            gameState.boardFrozen = false;
            gameState.currentMCQPoints = 10;
            clearWorkspace();
            
            gameState.hasRolled = false;
            gameState.currentDiceValue = null;
            gameState.targetGroupsCount = 0;

            diceDotsGrid.innerHTML = `<span class="text-yellow-700 font-black text-sm text-center col-span-3 row-span-3 flex items-center justify-center uppercase tracking-widest">Roll</span>`;
            mainDice.classList.add('roll-me');
            mainDice.style.cursor = 'pointer';

            instructionText.textContent = "Roll the dice! 🎲";
            inlineSpeakBtn.classList.add('hidden');
            
            checkBtn.disabled = true;
            clearBtn.disabled = false;
            clearBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            mcqPanel.classList.add('hidden');
            mcqPanel.classList.remove('flex');
            
            inlineFeedbackPanel.classList.add('hidden');
            inlineFeedbackPanel.classList.remove('flex');

            actionControls.classList.remove('hidden');
        }

        let isDragging = false;
        let dragClone = null;

        function initPointerDragging() {
            mainDice.addEventListener('pointerdown', (e) => {
                if (!gameState.hasRolled || gameState.boardFrozen) return;
                isDragging = true;
                mainDice.setPointerCapture(e.pointerId);
                mainDice.style.cursor = 'grabbing';

                dragClone = document.createElement('div');
                dragClone.className = 'fixed pointer-events-none z-50 w-16 h-16 bg-white border-4 border-blue-400 rounded-2xl shadow-2xl flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 opacity-90 scale-110 shrink-0';
                
                const cloneGrid = document.createElement('div');
                cloneGrid.className = 'w-14 h-14 grid grid-cols-3 grid-rows-3 p-1 gap-1 items-center justify-items-center shrink-0';
                renderDiceDots(cloneGrid, gameState.currentDiceValue, true);
                
                dragClone.appendChild(cloneGrid);
                document.body.appendChild(dragClone);

                moveCloneAt(e.clientX, e.clientY);
                workspaceDropzone.classList.add('drop-target-active');
            });

            mainDice.addEventListener('pointermove', (e) => {
                if (!isDragging || !dragClone) return;
                moveCloneAt(e.clientX, e.clientY);

                const dropRect = workspaceDropzone.getBoundingClientRect();
                const isOver = e.clientX >= dropRect.left && e.clientX <= dropRect.right &&
                               e.clientY >= dropRect.top && e.clientY <= dropRect.bottom;

                if (isOver) workspaceDropzone.classList.add('drop-target-active');
                else workspaceDropzone.classList.remove('drop-target-active');
            });

            const handlePointerUp = (e) => {
                if (!isDragging) return;
                isDragging = false;

                if (mainDice.hasPointerCapture(e.pointerId)) mainDice.releasePointerCapture(e.pointerId);
                mainDice.style.cursor = 'grab';

                const dropRect = workspaceDropzone.getBoundingClientRect();
                const isOver = e.clientX >= dropRect.left && e.clientX <= dropRect.right &&
                               e.clientY >= dropRect.top && e.clientY <= dropRect.bottom;

                if (isOver) addDiceGroup();

                if (dragClone) {
                    dragClone.remove();
                    dragClone = null;
                }
                workspaceDropzone.classList.remove('drop-target-active');
            };

            mainDice.addEventListener('pointerup', handlePointerUp);
            mainDice.addEventListener('pointercancel', handlePointerUp);
        }

        function moveCloneAt(x, y) {
            if (dragClone) {
                dragClone.style.left = `${x}px`;
                dragClone.style.top = `${y}px`;
            }
        }

        function showToast(title, desc) {
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-desc').textContent = desc;
            toastMsg.classList.remove('-translate-y-20', 'opacity-0');
            toastMsg.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toastMsg.classList.remove('translate-y-0', 'opacity-100');
                toastMsg.classList.add('-translate-y-20', 'opacity-0');
            }, 3000);
        }

        function speakInstruction() {
            if (!('speechSynthesis' in window) || !sound.enabled) return;
            window.speechSynthesis.cancel();
            let textToSpeak = !gameState.hasRolled ? "Roll the dice!" : `Build ${gameState.targetGroupsCount} groups of ${gameState.currentDiceValue}`;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.rate = 0.9; utterance.pitch = 1.2;
            window.speechSynthesis.speak(utterance);
        }

        function triggerConfetti(particleCount = 50, continuous = false) {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444', '#06b6d4'];

            function createParticle() {
                return {
                    x: Math.random() * canvas.width,
                    y: continuous ? -20 : canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * (continuous ? 5 : 15) + (continuous ? 2 : 0),
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1, rotation: Math.random() * 360, rotationSpeed: (Math.random() - 0.5) * 10
                };
            }

            for (let i = 0; i < particleCount; i++) particles.push(createParticle());

            let animationId;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                if (continuous && Math.random() < 0.1 && particles.length < 300) particles.push(createParticle());

                particles.forEach(p => {
                    if (p.life > 0 || continuous) {
                        alive = true;
                        p.x += p.vx; p.y += p.vy; p.vy += 0.3;
                        if (!continuous) p.life -= 0.015;
                        p.rotation += p.rotationSpeed;

                        if (continuous && p.y > canvas.height + 20) {
                            p.y = -20; p.x = Math.random() * canvas.width; p.vy = (Math.random() * 5) + 2;
                        }

                        ctx.save();
                        ctx.translate(p.x, p.y); ctx.rotate(p.rotation * Math.PI / 180);
                        ctx.fillStyle = p.color; ctx.globalAlpha = continuous ? 1 : Math.max(0, p.life);
                        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                        ctx.restore();
                    }
                });

                if (alive) animationId = requestAnimationFrame(render);
            }
            render();
            if (continuous) setTimeout(() => { cancelAnimationFrame(animationId); ctx.clearRect(0, 0, canvas.width, canvas.height); }, 8000); 
        }

        document.addEventListener('DOMContentLoaded', () => {
            initRound();

            rollBtn.addEventListener('click', rollDice);
            mainDice.addEventListener('click', () => { if (!gameState.hasRolled && !gameState.boardFrozen) rollDice(); });

            clearBtn.addEventListener('click', clearWorkspace);
            checkBtn.addEventListener('click', checkAnswer);
            inlineNextBtn.addEventListener('click', handleInlineNext);
            
            if(mcqSpeakBtn) {
                mcqSpeakBtn.addEventListener('click', speakMCQInstruction);
            }
            
            playAgainBtn.addEventListener('click', () => {
                endgameModal.classList.add('hidden');
                initRound();
                const canvas = document.getElementById('confetti-canvas');
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            });

            soundToggleBtn.addEventListener('click', () => {
                sound.enabled = !sound.enabled;
                if (sound.enabled) {
                    soundIcon.className = "fa-solid fa-volume-high";
                    soundToggleBtn.classList.remove('text-slate-400');
                    soundToggleBtn.classList.add('text-slate-600');
                } else {
                    soundIcon.className = "fa-solid fa-volume-xmark";
                    soundToggleBtn.classList.add('text-slate-400');
                    soundToggleBtn.classList.remove('text-slate-600');
                    window.speechSynthesis.cancel();
                }
            });

            inlineSpeakBtn.addEventListener('click', speakInstruction);
            initPointerDragging();
            
            window.addEventListener('resize', () => {
                const canvas = document.getElementById('confetti-canvas');
                if(canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            });
        });
    </script>
</body>

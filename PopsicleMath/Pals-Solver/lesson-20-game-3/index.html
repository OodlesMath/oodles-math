        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(90deg,
                rgba(255,255,255,0.02) 0%,
                rgba(255,255,255,0.00) 28%,
                rgba(255,250,235,0.05) 45%,
                rgba(255,250,235,0.13) 100%);
            z-index: 0;
        }

        header, main { position: relative; z-index: 2; }

        @keyframes bounce-in {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .touch-none {
            touch-action: none;
            -webkit-user-drag: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .picnic-header {
            width: min(1050px, 86vw);
            margin: 16px auto 0;
            padding: 14px 20px 16px;
            border: 4px solid rgba(255,255,255,0.95);
            border-radius: 30px;
            color: var(--ink);
            background: linear-gradient(135deg, rgba(255,250,240,0.89), rgba(255,244,214,0.85));
            box-shadow: 0 12px 28px rgba(63, 92, 48, 0.22), inset 0 1px 0 rgba(255,255,255,0.9);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
        }

        .picnic-title {
            color: var(--leaf-dark);
            letter-spacing: .01em;
            text-shadow: 0 2px 0 rgba(255,255,255,.8);
        }

        .picnic-subtitle { color: #4d6d4e; }

        .audio-round {
            background: var(--sky) !important;
            box-shadow: 0 5px 0 #177fb8;
            border: 3px solid white;
        }
        .audio-round:active { transform: translateY(4px); box-shadow: 0 1px 0 #177fb8; }

        .equation-pill {
            color: var(--leaf-dark) !important;
            background: #ffffff !important;
            border-color: #ef8b76 !important;
            box-shadow: 0 7px 0 rgba(201,61,58,.18), 0 10px 22px rgba(77,92,52,.12);
        }


        .equation-pill.picnic-error {
            color: #b91c1c !important;
            border-color: #ef4444 !important;
            background: #fff1f2 !important;
            transform: scale(1.08);
        }

        .equation-pill.picnic-success {
            color: #166534 !important;
            border-color: #65a30d !important;
            background: #f0fdf4 !important;
        }

        .reset-btn {
            background: var(--sunny) !important;
            color: #6f4614 !important;
            box-shadow: 0 6px 0 var(--sunny-dark);
            border: 3px solid #fff2cf;
        }
        .reset-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--sunny-dark); }

        .check-btn-picnic {
            background: linear-gradient(135deg, #58b84f, #2d8b45) !important;
            box-shadow: 0 6px 0 #216d36;
            border: 3px solid #dff8d5;
        }
        .check-btn-picnic:active { transform: translateY(5px); box-shadow: 0 1px 0 #216d36; }

        .picnic-main {
            width: min(1050px, 86vw);
            margin: 8px auto 0;
            min-height: 0;
        }

        .picnic-table {
            background-color: rgba(255,255,255,0.84);
            background-image:
                linear-gradient(90deg, rgba(232,83,79,.16) 50%, transparent 50%),
                linear-gradient(rgba(232,83,79,.16) 50%, transparent 50%);
            background-size: 34px 34px;
            border: 6px solid rgba(255,255,255,0.96) !important;
            box-shadow: 0 12px 30px rgba(47, 90, 42, 0.20), inset 0 0 0 4px rgba(232,83,79,.16);
            min-height: 148px;
            max-height: 210px;
        }

        .picnic-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--picnic-red);
            color: #fffaf0;
            border: 3px solid white;
            box-shadow: 0 4px 0 var(--picnic-red-dark);
            opacity: 1 !important;
        }

        #plates-area {
            background: rgba(255,255,255,0.12);
            border-radius: 30px;
            margin: 0 14px 10px;
            padding: 12px 18px 18px !important;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .picnic-plate {
            background: radial-gradient(circle at 50% 48%, #fff 0 54%, #fff5df 55% 68%, #fff 69% 100%) !important;
            border-color: #ed6b62 !important;
            box-shadow: 0 10px 20px rgba(56, 92, 50, 0.22), 0 6px 0 rgba(194, 66, 59, 0.18) !important;
        }

        .picnic-ring {
            border-color: #f7b6a8 !important;
            border-style: dashed !important;
            border-width: 3px !important;
        }

        .picnic-cake {
            background: #fffdf8 !important;
            border-color: #f0b35f !important;
            box-shadow: 0 5px 0 rgba(205,137,50,.24), 0 7px 15px rgba(45,89,50,.13) !important;
        }

        .picnic-modal-card {
            background: linear-gradient(180deg, #fffdf7, #fff3d8) !important;
            border-color: #5cab50 !important;
            box-shadow: 0 25px 55px rgba(31,95,44,.28) !important;
        }

        .picnic-modal-title { color: var(--leaf-dark) !important; }
        .picnic-result { background: rgba(255,255,255,.88) !important; border: 3px solid #f1c675; }
        .picnic-next {
            background: linear-gradient(135deg, #e8534f, #ef7b56) !important;
            box-shadow: 0 7px 0 #bd3f3c;
        }

        #oodles-logo {
            position: absolute;
            top: 14px;
            right: 18px;
            width: 92px;
            height: 56px;
            object-fit: contain;
            padding: 5px 8px;
            background: rgba(255,255,255,.9);
            border-radius: 16px;
            border: 3px solid rgba(255,255,255,.98);
            box-shadow: 0 7px 17px rgba(32,89,50,.16);
        }

        @media (max-width: 900px) {
            .picnic-header, .picnic-main { width: calc(100vw - 20px); margin-left: auto; margin-right: auto; }
            .picnic-header { margin-top: 10px; padding: 12px 12px 14px; border-radius: 24px; }
            #oodles-logo { width: 74px; height: 46px; right: 10px; top: 10px; }
            .picnic-table { min-height: 132px; margin: 10px 8px !important; }
            #plates-area { margin: 0 8px 8px; gap: 14px !important; }
        }

        @media (max-height: 760px) and (min-width: 700px) {
            .picnic-header { margin-top: 8px; padding-top: 9px; padding-bottom: 10px; }
            .picnic-table { min-height: 120px; max-height: 150px; margin-top: 8px !important; margin-bottom: 8px !important; }
            #plates-area { padding-top: 8px !important; padding-bottom: 8px !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans overflow-hidden touch-none select-none">

    <!-- Header / Math Problem Area -->
    <header class="picnic-header text-center relative z-10">
        <!-- Logo -->
        <img id="oodles-logo" src="../assets/logo-oodles-math.png" alt="Oodles Math logo" onerror="this.style.display='none'">
        
        <h1 class="picnic-title text-2xl md:text-4xl font-black mb-1 md:mb-2">Picnic Division 🧺</h1>
        <div class="flex items-center justify-center gap-2 mb-1">
            <p class="picnic-subtitle text-base md:text-lg font-semibold" id="instruction">Loading...</p>
            <button onclick="playAudio()" class="audio-round p-2 rounded-full transition-all active:scale-95" title="Listen to instructions">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
        </div>
        <p class="text-lg md:text-2xl font-extrabold text-emerald-900 mb-2" id="question">How many cakes are on each plate?</p>
        <div class="equation-pill mt-1 py-2 px-6 font-black text-2xl md:text-3xl rounded-full inline-block border-4 transition-all duration-300" id="equation">
            ? ÷ ? = ?
        </div>
        <!-- Controls: Reset & Check Answer -->
        <div class="mt-4 flex justify-center items-center gap-4 h-12" id="controls-container">
            <button onclick="resetCakes()" class="reset-btn font-black py-2 px-6 rounded-full transition-transform hover:scale-105 active:scale-95 text-base md:text-lg" title="Move all cakes back to the table">
                Reset ↺
            </button>
            <button id="check-btn" onclick="onCheckAnswerClick()" class="check-btn-picnic hidden text-white font-black py-2 px-8 rounded-full transition-transform hover:scale-105 active:scale-95 text-lg md:text-xl">
                Check ✓
            </button>
        </div>
    </header>

    <!-- Game Area -->
    <main class="picnic-main flex-1 flex flex-col relative">
        
        <!-- Table Area (Starting point for cakes) -->
        <div class="picnic-table m-3 md:m-4 rounded-3xl p-4 flex flex-col relative">
            <div class="absolute top-0 left-0 w-full text-center mt-2">
                <span class="picnic-label text-xs md:text-sm font-black px-4 py-1 rounded-full uppercase tracking-widest">🧺 Cake Basket</span>
            </div>
            <!-- The actual drop zone for the table -->
            <div id="table" class="table-area flex flex-wrap justify-center content-center gap-2 md:gap-4 flex-1 mt-6 h-full w-full">
                <!-- Cakes will be injected here via JS -->
            </div>
        </div>

        <!-- Plates Area (Drop targets) -->
        <div class="flex-1 flex flex-wrap justify-center content-start md:content-center gap-5 md:gap-7 overflow-y-auto" id="plates-area">
            <!-- Plates will be injected here via JS -->
        </div>

    </main>

    <!-- Win Modal (Hidden by default) -->
    <div id="win-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex-col justify-center items-center backdrop-blur-sm transition-opacity duration-300">
        <div class="picnic-modal-card p-8 md:p-10 rounded-[2.5rem] text-center border-8" id="win-card">
            <div class="text-7xl mb-4" style="animation: float 2s infinite ease-in-out;">🧺🎉</div>
            <h2 class="picnic-modal-title text-4xl font-black mb-2">Great Sharing!</h2>
            <div class="picnic-result rounded-2xl py-4 px-8 my-6 shadow-inner">
                <p class="text-3xl font-extrabold text-slate-800" id="win-equation">12 ÷ 3 = 4</p>
            </div>
            <button id="next-btn" onclick="nextQuestion()" class="picnic-next text-white font-black py-4 px-10 rounded-full transition-transform hover:scale-105 active:scale-95 text-xl md:text-2xl w-full">
                Next Question 🌼
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const QUESTIONS_PER_ROUND = 10;
        const MAX_TOTAL = 40;
        const MIN_PLATES = 2;
        const MAX_PLATES = 5;

        let totalCakes = 0;
        let numPlates = 0;
        let cakesPerPlate = 0;
        let instructionText = "";

        let roundProblems = [];
        let currentQuestionIndex = 0;

        function shuffleArray(items) {
            const arr = [...items];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildRoundProblems() {
            const pool = [];

            // Every problem has at least 2 plates, a positive answer, and a total no greater than 40.
            for (let plates = MIN_PLATES; plates <= MAX_PLATES; plates++) {
                const maxPerPlate = Math.floor(MAX_TOTAL / plates);
                for (let perPlate = 1; perPlate <= maxPerPlate; perPlate++) {
                    const total = plates * perPlate;
                    if (total > 0 && total <= MAX_TOTAL) {
                        pool.push({
                            totalCakes: total,
                            numPlates: plates,
                            cakesPerPlate: perPlate
                        });
                    }
                }
            }

            // Shuffle once, then take 10 different equations.
            return shuffleArray(pool).slice(0, QUESTIONS_PER_ROUND);
        }

        // Start a brand-new 10-question round.
        function startRound() {
            roundProblems = buildRoundProblems();
            currentQuestionIndex = 0;
            loadQuestion();
        }

        // Kept for compatibility with the Ver 1 function name.
        function initGame() {
            startRound();
        }

        function loadQuestion() {
            const problem = roundProblems[currentQuestionIndex];
            if (!problem) {
                startRound();
                return;
            }

            totalCakes = problem.totalCakes;
            numPlates = problem.numPlates;
            cakesPerPlate = problem.cakesPerPlate;

            // Hide win modal.
            const modal = document.getElementById('win-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');

            // Hide Check until every cake has been moved from the basket.
            document.getElementById('check-btn').classList.add('hidden');

            instructionText = `Share ${totalCakes} cakes equally among ${numPlates} plates.`;
            document.getElementById('instruction').textContent =
                `Question ${currentQuestionIndex + 1} of ${QUESTIONS_PER_ROUND} · ${instructionText}`;
            document.getElementById('equation').textContent = `${totalCakes} ÷ ${numPlates} = ?`;
            document.getElementById('equation').className =
                "equation-pill mt-1 py-2 px-6 font-black text-2xl md:text-3xl rounded-full inline-block border-4 transition-all duration-300";

            const nextBtn = document.getElementById('next-btn');
            nextBtn.textContent = currentQuestionIndex === QUESTIONS_PER_ROUND - 1
                ? 'Play Again 🌼'
                : 'Next Question 🌼';

            renderGameArea();
        }

        function nextQuestion() {
            if (currentQuestionIndex < QUESTIONS_PER_ROUND - 1) {
                currentQuestionIndex += 1;
                loadQuestion();
            } else {
                startRound();
            }
        }

        function playAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textToRead = `${instructionText} How many cakes are on each plate?`;
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Text-to-speech is not supported in this browser.");
            }
        }

        function getTableCakeSize() {
            if (totalCakes <= 12) return { box: 56, font: 36, radius: 16 };
            if (totalCakes <= 20) return { box: 46, font: 30, radius: 14 };
            if (totalCakes <= 28) return { box: 38, font: 26, radius: 12 };
            if (totalCakes <= 34) return { box: 34, font: 23, radius: 11 };
            return { box: 30, font: 20, radius: 10 };
        }

        function getPlateCakeSize() {
            if (cakesPerPlate <= 4) return { box: 52, font: 34, radius: 15 };
            if (cakesPerPlate <= 6) return { box: 42, font: 28, radius: 13 };
            if (cakesPerPlate <= 9) return { box: 34, font: 24, radius: 11 };
            if (cakesPerPlate <= 12) return { box: 30, font: 21, radius: 10 };
            if (cakesPerPlate <= 16) return { box: 26, font: 18, radius: 9 };
            return { box: 22, font: 16, radius: 8 };
        }

        function applyCakeSize(cake, parent) {
            const inPlate = parent && parent.classList && parent.classList.contains('plate');
            const size = inPlate ? getPlateCakeSize() : getTableCakeSize();

            cake.style.width = `${size.box}px`;
            cake.style.height = `${size.box}px`;
            cake.style.fontSize = `${size.font}px`;
            cake.style.borderRadius = `${size.radius}px`;
            cake.style.flex = `0 0 ${size.box}px`;
            cake.style.lineHeight = '1';
        }

        function getPlateGap() {
            if (cakesPerPlate <= 6) return 6;
            if (cakesPerPlate <= 10) return 4;
            if (cakesPerPlate <= 16) return 3;
            return 2;
        }

        function renderGameArea() {
            // 1. Render Plates
            const platesArea = document.getElementById('plates-area');
            platesArea.innerHTML = '';

            for (let i = 0; i < numPlates; i++) {
                const plateWrapper = document.createElement('div');
                plateWrapper.className = 'flex flex-col items-center animate-bounce-in';
                plateWrapper.style.animationDelay = `${i * 0.1}s`;

                const plate = document.createElement('div');
                plate.className =
                    'plate picnic-plate w-32 h-32 md:w-40 md:h-40 rounded-full border-[6px] flex flex-wrap justify-center content-center p-3 relative overflow-hidden transition-all duration-200';
                plate.style.gap = `${getPlateGap()}px`;

                const innerRing = document.createElement('div');
                innerRing.className = 'picnic-ring absolute inset-2 rounded-full pointer-events-none';
                plate.appendChild(innerRing);

                plateWrapper.appendChild(plate);
                platesArea.appendChild(plateWrapper);
            }

            // 2. Render Cakes in the basket.
            const table = document.getElementById('table');
            table.innerHTML = '';

            for (let i = 0; i < totalCakes; i++) {
                const cake = document.createElement('div');
                cake.className =
                    'cake picnic-cake rounded-2xl flex items-center justify-center cursor-grab active:cursor-grabbing hover:scale-110 transition-transform duration-100 ease-in-out border-2 touch-none select-none z-10 animate-bounce-in';
                cake.innerHTML = '🍰';
                cake.style.animationDelay = `${Math.min((i * 0.025) + 0.12, 0.85)}s`;
                cake.ondragstart = () => false;

                table.appendChild(cake);
                applyCakeSize(cake, table);
            }
        }

        /* --- Custom Drag and Drop System (Mouse & Touch Support) --- */

        let activeCake = null;
        let shiftX = 0;
        let shiftY = 0;
        let initialParent = null;
        let initialSibling = null;

        document.addEventListener('pointerdown', (e) => {
            const cake = e.target.closest('.cake');
            if (!cake) return;

            activeCake = cake;
            initialParent = cake.parentNode;
            initialSibling = cake.nextSibling;

            const rect = cake.getBoundingClientRect();
            shiftX = e.clientX - rect.left;
            shiftY = e.clientY - rect.top;

            activeCake.style.position = 'fixed';
            activeCake.style.zIndex = '1000';
            activeCake.style.pointerEvents = 'none';

            activeCake.classList.remove('transition-transform', 'duration-100', 'ease-in-out', 'hover:scale-110');
            activeCake.classList.add('scale-125', 'shadow-2xl', 'rotate-3');

            document.body.append(activeCake);
            moveAt(e.clientX, e.clientY);
        });

        function moveAt(clientX, clientY) {
            if (!activeCake) return;
            activeCake.style.left = clientX - shiftX + 'px';
            activeCake.style.top = clientY - shiftY + 'px';
        }

        document.addEventListener('pointermove', (e) => {
            if (activeCake) {
                e.preventDefault();
                moveAt(e.clientX, e.clientY);
            }
        }, { passive: false });

        document.addEventListener('pointerup', (e) => {
            if (!activeCake) return;

            activeCake.style.display = 'none';
            const elemBelow = document.elementFromPoint(e.clientX, e.clientY);
            activeCake.style.display = 'flex';

            const droppable = elemBelow ? elemBelow.closest('.plate, .table-area') : null;

            activeCake.style.position = '';
            activeCake.style.zIndex = '';
            activeCake.style.pointerEvents = 'auto';
            activeCake.style.left = '';
            activeCake.style.top = '';

            activeCake.classList.add('transition-transform', 'duration-100', 'ease-in-out', 'hover:scale-110');
            activeCake.classList.remove('scale-125', 'shadow-2xl', 'rotate-3');

            if (droppable) {
                droppable.appendChild(activeCake);
                applyCakeSize(activeCake, droppable);

                if (droppable.classList.contains('plate')) {
                    droppable.classList.add('scale-105', 'ring-4', 'ring-lime-300');
                    setTimeout(() => {
                        droppable.classList.remove('scale-105', 'ring-4', 'ring-lime-300');
                    }, 200);
                }
            } else {
                if (initialSibling) {
                    initialParent.insertBefore(activeCake, initialSibling);
                } else {
                    initialParent.appendChild(activeCake);
                }
                applyCakeSize(activeCake, initialParent);
            }

            activeCake = null;
            setTimeout(checkWinCondition, 50);
        });

        /* --- Game Logic & Win Condition --- */

        function checkWinCondition() {
            const table = document.getElementById('table');
            const checkBtn = document.getElementById('check-btn');

            if (table.querySelectorAll('.cake').length === 0) {
                checkBtn.classList.remove('hidden');
            } else {
                checkBtn.classList.add('hidden');
            }
        }

        function onCheckAnswerClick() {
            const plates = document.querySelectorAll('.plate');
            let isWin = true;

            plates.forEach(plate => {
                const cakeCount = plate.querySelectorAll('.cake').length;
                if (cakeCount !== cakesPerPlate) {
                    isWin = false;
                }
            });

            if (isWin) {
                triggerWin();
            } else {
                const equation = document.getElementById('equation');
                equation.classList.add('picnic-error');
                setTimeout(() => {
                    equation.classList.remove('picnic-error');
                }, 300);
            }
        }

        function resetCakes() {
            const table = document.getElementById('table');
            const allCakes = document.querySelectorAll('.cake');

            allCakes.forEach(cake => {
                table.appendChild(cake);
                applyCakeSize(cake, table);
            });

            const equation = document.getElementById('equation');
            equation.classList.remove('picnic-error');

            checkWinCondition();
        }

        function triggerWin() {
            const modal = document.getElementById('win-modal');
            const eq = document.getElementById('win-equation');
            const headerEq = document.getElementById('equation');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.5 },
                    zIndex: 2000,
                    colors: ['#e8534f', '#58b84f', '#f8b84e', '#38a8e8']
                });
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const winUtterance = new SpeechSynthesisUtterance("Great job! Perfect sharing!");
                winUtterance.rate = 1.0;
                winUtterance.pitch = 1.15;
                window.speechSynthesis.speak(winUtterance);
            }

            const equationText = `${totalCakes} ÷ ${numPlates} = ${cakesPerPlate}`;
            eq.textContent = equationText;
            headerEq.textContent = equationText;
            headerEq.classList.add('picnic-success');

            const nextBtn = document.getElementById('next-btn');
            nextBtn.textContent = currentQuestionIndex === QUESTIONS_PER_ROUND - 1
                ? 'Play Again 🌼'
                : 'Next Question 🌼';

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const card = document.getElementById('win-card');
            card.classList.add('animate-bounce-in');

            setTimeout(() => {
                headerEq.classList.remove('picnic-success');
            }, 2000);
        }

        // The game starts immediately after the DOM above is available.
        // This avoids the Ver 1 first-question "Loading..." delay.
        startRound();
    </script>
</body>
</html>

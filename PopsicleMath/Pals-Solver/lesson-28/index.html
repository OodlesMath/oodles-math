<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Position & Direction - Slap Challenge Ver 7</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --pad1: #9557e6;
            --pad2: #11b7ea;
            --pad3: #ef55ad;
            --pad4: #f6c515;
            --ink: #17233f;
            --sky1: #75d0fa;
            --sky2: #dff7ff;
            --green: #58cc02;
            --green-dark: #3a9a00;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--sky1);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            color: var(--ink);
        }

        .hidden { display: none !important; }

        #backgroundCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ---------- Start / End screens ---------- */
        .screen {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            overflow: hidden;
            padding: 3vh 3vw;
        }

        .screen::before {
            content: "";
            position: absolute;
            width: min(900px, 92vw);
            height: min(820px, 90vh);
            border-radius: 44px;
            background: rgba(255,255,255,0.78);
            border: 5px solid rgba(255,255,255,0.92);
            box-shadow: 0 24px 60px rgba(27,88,121,0.20);
            backdrop-filter: blur(9px);
            z-index: 0;
        }

        .screen > * { position: relative; z-index: 1; }

        .title-text {
            font-size: clamp(2.6rem, 7vw, 5.6rem);
            font-weight: 900;
            color: var(--ink);
            text-align: center;
            text-shadow: 0 5px 0 #fff, 0 9px 18px rgba(17,54,92,0.16);
            line-height: 1.03;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }

        .subtitle-text {
            font-size: clamp(1.25rem, 3vw, 2.25rem);
            font-weight: 900;
            color: #ef476f;
            background: #fff8bd;
            padding: 9px 24px;
            border: 3px solid #ffe36e;
            border-radius: 999px;
            box-shadow: 0 6px 0 #efd14f;
            margin-bottom: 26px;
            letter-spacing: .06em;
        }

        .instruction-row {
            display: flex;
            gap: clamp(12px, 3vw, 34px);
            margin-bottom: 28px;
            flex-wrap: wrap;
            justify-content: center;
            color: #516174;
            font-size: clamp(1rem, 2vw, 1.45rem);
            font-weight: 800;
        }

        .instruction-row span {
            background: rgba(255,255,255,.82);
            border: 3px solid #e5eef6;
            border-radius: 18px;
            padding: 8px 14px;
            box-shadow: 0 5px 0 rgba(151,177,199,.26);
        }

        .btn-large {
            font-family: inherit;
            font-size: clamp(1.25rem, 3vw, 2rem);
            font-weight: 900;
            padding: 17px 42px;
            border-radius: 24px;
            background: var(--green);
            color: white;
            border: 4px solid rgba(255,255,255,.72);
            cursor: pointer;
            box-shadow: 0 9px 0 var(--green-dark), 0 18px 28px rgba(50,137,0,.18);
            transition: transform .11s ease, box-shadow .11s ease, filter .11s ease;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .btn-large:hover { filter: brightness(1.04); transform: translateY(-2px); }
        .btn-large:active { transform: translateY(8px); box-shadow: 0 1px 0 var(--green-dark); }

        .end-actions { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }

        /* ---------- Game Layout ---------- */
        #game-screen {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        #top-bar {
            height: 10vh;
            min-height: 64px;
            display: grid;
            grid-template-columns: auto minmax(220px, 1fr) auto auto;
            gap: clamp(10px, 2vw, 24px);
            align-items: center;
            padding: 0 clamp(14px, 2.6vw, 36px);
            background: rgba(255,255,255,0.88);
            border-bottom: 4px solid rgba(255,255,255,.96);
            box-shadow: 0 8px 24px rgba(29,82,113,0.11);
            font-size: clamp(1rem, 2vw, 1.55rem);
            font-weight: 900;
            color: var(--ink);
            backdrop-filter: blur(10px);
        }

        .top-badge {
            min-width: 112px;
            background: #fff;
            border: 3px solid #e4edf5;
            border-radius: 18px;
            padding: 8px 14px;
            text-align: center;
            box-shadow: 0 5px 0 #dbe8f1;
            white-space: nowrap;
        }

        .progress-wrap { min-width: 0; }
        .progress-title {
            text-align:center;
            font-size: clamp(.72rem, 1.4vw, .95rem);
            letter-spacing: .09em;
            color: #5b7087;
            margin-bottom: 5px;
        }
        .progress-track {
            height: 16px;
            border-radius: 999px;
            background: #dce9f1;
            border: 3px solid #c8dbe7;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,.08);
        }
        #top-progress-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #58cc02, #8be23b);
            transition: width .35s ease;
        }

        .tts-btn {
            background: #18b9ee;
            color: white;
            border: 3px solid rgba(255,255,255,.9);
            border-radius: 50%;
            width: clamp(44px, 6vh, 62px);
            height: clamp(44px, 6vh, 62px);
            font-size: clamp(1.15rem, 2.6vh, 1.9rem);
            cursor: pointer;
            box-shadow: 0 5px 0 #0787ba;
            display: grid;
            place-items: center;
            transition: transform .1s, box-shadow .1s;
        }
        .tts-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #0787ba; }

        #question-area {
            height: 14vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2vh 3vw 0;
            text-align: center;
            background: transparent;
        }

        #question-text {
            max-width: min(1040px, 92vw);
            font-size: clamp(1.65rem, 3.8vmin, 3.2rem);
            font-weight: 900;
            color: var(--ink);
            line-height: 1.15;
            text-shadow: 0 2px 0 rgba(255,255,255,.9);
            background: rgba(255,255,255,.76);
            border: 4px solid rgba(255,255,255,.92);
            border-radius: 24px;
            padding: .55vh 2vw;
            box-shadow: 0 8px 22px rgba(29,82,113,.09);
            backdrop-filter: blur(6px);
        }

        #picture-area {
            height: 48vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 1.5vh 2vw 2vh;
            background: transparent;
        }

        #picture-area::after {
            content:"";
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            width:min(610px, 72vw);
            height:min(30vh, 285px);
            border-radius:36px;
            background:rgba(255,255,255,.58);
            border:4px solid rgba(255,255,255,.78);
            box-shadow:0 16px 38px rgba(29,82,113,.10);
            backdrop-filter:blur(5px);
            pointer-events:none;
        }

        #main-svg-container {
            height: min(27vh, 255px);
            width: min(600px, 70vw);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        #main-svg-container svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: visible;
            filter: drop-shadow(0 10px 9px rgba(30,86,111,0.15));
        }

        #answer-area {
            height: 28vh;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: 1fr;
            gap: clamp(9px, 1.15vw, 18px);
            padding: clamp(10px, 1.15vw, 18px) clamp(14px, 1.8vw, 28px);
            padding-bottom: max(clamp(12px, 1.5vw, 22px), env(safe-area-inset-bottom));
            background: transparent;
            align-items: center;
        }

        .answer-pad {
            height: min(20vh, 180px);
            border-radius: clamp(18px, 1.8vw, 28px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform .1s, filter .2s, box-shadow .2s;
            font-size: clamp(1.15rem, 3.1vmin, 2.7rem);
            line-height: 1.05;
            font-weight: 900;
            color: white;
            text-shadow: 0 3px 0 rgba(55,55,55,.22);
            border: 4px solid rgba(255,255,255,.42);
            text-align: center;
            padding: 8px 10px;
            overflow: hidden;
            letter-spacing: .005em;
        }

        .answer-pad::after {
            content:"";
            position:absolute;
            inset:7px 12px auto;
            height:24%;
            border-radius:999px;
            background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0));
            pointer-events:none;
        }

        .pad-0 { background: linear-gradient(180deg,#a367ef,#8e4bd8); box-shadow: 0 10px 0 #6730a4, 0 16px 24px rgba(51,37,92,.18); }
        .pad-1 { background: linear-gradient(180deg,#20c4f1,#0aa9da); box-shadow: 0 10px 0 #087fa7, 0 16px 24px rgba(23,99,132,.18); }
        .pad-2 { background: linear-gradient(180deg,#f565b9,#e849a5); box-shadow: 0 10px 0 #ac3478, 0 16px 24px rgba(113,46,85,.18); }
        .pad-3 { background: linear-gradient(180deg,#ffd31f,#efbd09); box-shadow: 0 10px 0 #b98a05, 0 16px 24px rgba(110,83,22,.18); color:#fff; }

        .answer-pad:hover { filter: brightness(1.035); transform: translateY(-2px); }
        .answer-pad:active { transform: translateY(9px); }

        .answer-pad.image-option { padding: 4px; }
        .answer-pad.image-option .pad-content {
            width: 100%;
            height: 100%;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .answer-pad.image-option svg {
            width: 104%;
            height: 104%;
            pointer-events: none;
            overflow: visible;
            filter: drop-shadow(0 7px 6px rgba(52,54,78,.16));
        }

        .keyboard-hint {
            position: absolute;
            top: 9px;
            left: 15px;
            font-size: clamp(1rem, 2vw, 1.55rem);
            opacity: .60;
            text-shadow: none;
            z-index: 3;
        }

        @keyframes bounceCorrect {
            0%,100% { transform: scale(1) translateY(8px); }
            50% { transform: scale(1.055) translateY(-8px); }
        }
        @keyframes shakeWrong {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-13px); }
            40% { transform: translateX(13px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .pad-correct {
            animation: bounceCorrect .5s ease;
            background: linear-gradient(180deg,#4add73,#26b84d) !important;
            box-shadow: 0 10px 0 #17883a !important;
            z-index: 10;
        }
        .pad-wrong {
            animation: shakeWrong .4s ease;
            background: linear-gradient(180deg,#f45c68,#df3342) !important;
            box-shadow: 0 10px 0 #a92230 !important;
            filter: saturate(.86);
        }

        .feedback-icon {
            position: absolute;
            font-size: clamp(4rem, 11vmin, 10rem);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .3s cubic-bezier(.175,.885,.32,1.275);
            transform: scale(0);
            z-index: 5;
            color: white;
            text-shadow: 0 4px 10px rgba(0,0,0,.24);
        }
        .pad-correct .feedback-icon,
        .pad-wrong .feedback-icon { opacity: 1; transform: scale(1); }
        .pad-correct .feedback-icon::before { content:"✓"; }
        .pad-wrong .feedback-icon::before { content:"✗"; }

        .star-particle {
            position: absolute;
            color: #FFD700;
            font-size: 2rem;
            pointer-events: none;
            animation: floatStar 1s forwards ease-out;
            z-index: 20;
        }
        @keyframes floatStar {
            0% { transform: translate(0,0) scale(.5) rotate(0deg); opacity:1; }
            100% { transform: translate(var(--tx),var(--ty)) scale(1.5) rotate(360deg); opacity:0; }
        }

        .layout-word-to-pic #picture-area { display: none; }
        .layout-word-to-pic #question-area { height: 18vh; }
        .layout-word-to-pic #answer-area {
            height: 62vh;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: 1fr;
            padding-top: 4vh;
            padding-bottom: 7vh;
        }
        .layout-word-to-pic .answer-pad {
            height: min(48vh, 430px);
        }

        @media (max-width: 760px) {
            #top-bar {
                grid-template-columns: auto 1fr auto;
                gap: 7px;
                padding: 0 9px;
            }
            #top-bar .progress-wrap { display:none; }
            .top-badge { min-width: 82px; padding: 7px 9px; }
            #question-text { font-size: clamp(1.35rem, 5.5vw, 2.2rem); }
            .answer-pad { font-size: clamp(.82rem, 3.5vw, 1.55rem); padding: 5px; height:min(18vh,145px); }
            #answer-area { grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; padding-left:8px; padding-right:8px; }
            .layout-word-to-pic #answer-area { grid-template-columns:repeat(4,minmax(0,1fr)); padding-left:7px; padding-right:7px; }
            .layout-word-to-pic .answer-pad { height:min(46vh,390px); }
            .keyboard-hint { font-size: .95rem; top: 6px; left: 9px; }
            .screen::before { height: 94vh; }
        }

        @media (max-height: 650px) and (orientation: landscape) {
            .screen { padding: 1.5vh 2vw; }
            .screen::before { height: 94vh; }
            .title-text { font-size: clamp(2rem, 6vh, 3.7rem); }
            .subtitle-text { margin-bottom: 14px; padding: 5px 18px; }
            .instruction-row { margin-bottom: 16px; }
            #top-bar { min-height: 52px; }
        }
    </style>

</head>
<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <canvas id="backgroundCanvas" aria-label="Colorful nature background"></canvas>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <!-- Upgraded SVG Mascot (Cute Owl) -->
        <svg width="200" height="200" viewBox="0 0 200 200" style="margin-bottom: 20px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));">
            <!-- Body -->
            <ellipse cx="100" cy="110" rx="60" ry="70" fill="#8D6E63"/>
            <!-- Belly -->
            <ellipse cx="100" cy="125" rx="40" ry="50" fill="#D7CCC8"/>
            <!-- Big Cute Eyes -->
            <circle cx="75" cy="85" r="22" fill="#FFF"/>
            <circle cx="125" cy="85" r="22" fill="#FFF"/>
            <circle cx="75" cy="85" r="10" fill="#212121"/>
            <circle cx="125" cy="85" r="10" fill="#212121"/>
            <circle cx="79" cy="81" r="3" fill="#FFF"/>
            <circle cx="129" cy="81" r="3" fill="#FFF"/>
            <!-- Cute Beak -->
            <path d="M 92 100 L 108 100 L 100 115 Z" fill="#FFCA28"/>
            <!-- Ears / Feathers -->
            <path d="M 40 60 Q 60 40 75 55 Z" fill="#8D6E63"/>
            <path d="M 160 60 Q 140 40 125 55 Z" fill="#8D6E63"/>
        </svg>
        <div class="title-text">POSITION &<br>DIRECTION</div>
        <div class="subtitle-text">SLAP CHALLENGE</div>
        <div class="instruction-row">
            <span>👀 Look</span>
            <span>🧠 Think</span>
            <span>✋ Slap!</span>
        </div>
        <button class="btn-large" onclick="startGame()">START GAME</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
        <div id="top-bar">
            <div class="top-badge">Q: <span id="q-counter">1</span> / 15</div>
            <div class="progress-wrap">
                <div class="progress-title">POSITION &amp; DIRECTION</div>
                <div class="progress-track"><div id="top-progress-fill"></div></div>
            </div>
            <button class="tts-btn" onclick="readQuestion()" title="Read Question" aria-label="Read question">🔊</button>
            <div class="top-badge">⭐ <span id="score-counter">0</span></div>
        </div>
        
        <div id="question-area">
            <div id="question-text">Where is the ball?</div>
        </div>

        <div id="picture-area">
            <div id="main-svg-container">
                <!-- SVG Content Injected Here -->
            </div>
        </div>

        <div id="answer-area">
            <div class="answer-pad pad-0" id="pad-0" onclick="handleSlap(0)">
                <span class="keyboard-hint">1</span>
                <span class="pad-content">LEFT</span>
                <div class="feedback-icon"></div>
            </div>
            <div class="answer-pad pad-1" id="pad-1" onclick="handleSlap(1)">
                <span class="keyboard-hint">2</span>
                <span class="pad-content">RIGHT</span>
                <div class="feedback-icon"></div>
            </div>
            <div class="answer-pad pad-2" id="pad-2" onclick="handleSlap(2)">
                <span class="keyboard-hint">3</span>
                <span class="pad-content">ABOVE</span>
                <div class="feedback-icon"></div>
            </div>
            <div class="answer-pad pad-3" id="pad-3" onclick="handleSlap(3)">
                <span class="keyboard-hint">4</span>
                <span class="pad-content">BELOW</span>
                <div class="feedback-icon"></div>
            </div>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen hidden">
        <div style="font-size: 8rem; margin-bottom: -20px;">🏆</div>
        <div class="title-text" style="color: #ff9f1c;">AMAZING JOB!</div>
        <div class="subtitle-text" style="background: #2ec4b6; color: white;">Position & Direction Star!</div>
        <div style="font-size: 4rem; font-weight: 900; color: #2b2d42; margin-bottom: 10px;">⭐ <span id="final-score">15</span> / 15</div>
        <div id="accuracy-text" style="font-size: 2rem; font-weight: 600; color: #6c757d; margin-bottom: 40px;">Accuracy: 100%</div>
        <div class="end-actions">
            <button class="btn-large" onclick="startGame()" style="background: #4361ee; box-shadow: 0 10px 0 #3f37c9;">PLAY AGAIN</button>
            <button class="btn-large" onclick="goHome()" style="background: #e0e1dd; color: #1b263b; box-shadow: 0 10px 0 #778da9;">HOME</button>
        </div>
    </div>

    <script>

        // --- POLISHED ANIMATED NATURE BACKGROUND ---
        (() => {
            const canvas = document.getElementById('backgroundCanvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            let w = 0, h = 0, dpr = 1, t = 0;
            let clouds = [], trees = [], flowers = [], butterflies = [];

            function resizeBackground() {
                dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = Math.floor(w * dpr);
                canvas.height = Math.floor(h * dpr);
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                makeScene();
            }

            function makeScene() {
                clouds = [];
                trees = [];
                flowers = [];
                butterflies = [];

                const cloudCount = w < 700 ? 4 : 6;
                for (let i = 0; i < cloudCount; i++) {
                    clouds.push({
                        x: Math.random() * w,
                        y: h * (.08 + Math.random() * .30),
                        s: 22 + Math.random() * 30,
                        v: .05 + Math.random() * .08,
                        a: .62 + Math.random() * .22
                    });
                }

                const treeCount = w < 700 ? 5 : 9;
                for (let i = 0; i < treeCount; i++) {
                    trees.push({
                        x: (i + .5) * w / treeCount + (Math.random()*34 - 17),
                        y: h * (.72 + Math.random()*.035),
                        s: .55 + Math.random()*.45
                    });
                }

                const flowerCount = w < 700 ? 12 : 22;
                const colors = ['#ff6f91','#ffd93d','#a775f2','#ffffff','#32baf2','#ff9f43'];
                for (let i = 0; i < flowerCount; i++) {
                    flowers.push({
                        x: Math.random()*w,
                        y: h*(.82 + Math.random()*.14),
                        s: .55 + Math.random()*.55,
                        c: colors[Math.floor(Math.random()*colors.length)],
                        p: Math.random()*Math.PI*2
                    });
                }

                for (let i = 0; i < 4; i++) {
                    butterflies.push({
                        x: Math.random()*w,
                        y: h*(.22 + Math.random()*.30),
                        s: 5 + Math.random()*4,
                        v: .10 + Math.random()*.09,
                        p: Math.random()*Math.PI*2,
                        c: ['#ff6f91','#ffd93d','#9b5de5','#00bbf9'][i]
                    });
                }
            }

            function drawCloud(c) {
                ctx.save();
                ctx.globalAlpha = c.a;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.s, 0, Math.PI*2);
                ctx.arc(c.x + c.s*.85, c.y + c.s*.18, c.s*.72, 0, Math.PI*2);
                ctx.arc(c.x - c.s*.82, c.y + c.s*.2, c.s*.68, 0, Math.PI*2);
                ctx.arc(c.x + c.s*.12, c.y - c.s*.28, c.s*.72, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }

            function drawTree(tr) {
                ctx.save();
                ctx.translate(tr.x, tr.y);
                ctx.scale(tr.s, tr.s);
                ctx.fillStyle = '#8a5a34';
                ctx.fillRect(-8, -1, 16, 54);
                ctx.fillStyle = '#5fcf55';
                ctx.beginPath();
                ctx.arc(0, -29, 34, 0, Math.PI*2);
                ctx.arc(-23, -16, 26, 0, Math.PI*2);
                ctx.arc(22, -14, 27, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,.22)';
                ctx.beginPath();
                ctx.arc(-10, -40, 10, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }

            function drawFlower(f) {
                const sway = Math.sin(t*.002 + f.p)*1.5;
                ctx.save();
                ctx.translate(f.x + sway, f.y);
                ctx.scale(f.s, f.s);
                ctx.strokeStyle = '#2d9b45';
                ctx.lineWidth = 2.3;
                ctx.beginPath();
                ctx.moveTo(0, 4);
                ctx.quadraticCurveTo(2, 12, 0, 22);
                ctx.stroke();

                ctx.fillStyle = f.c;
                for (let i = 0; i < 6; i++) {
                    ctx.save();
                    ctx.rotate(i*Math.PI/3);
                    ctx.beginPath();
                    ctx.ellipse(0,-8,4.8,8.5,0,0,Math.PI*2);
                    ctx.fill();
                    ctx.restore();
                }
                ctx.fillStyle = '#ffe36b';
                ctx.beginPath();
                ctx.arc(0,0,4.5,0,Math.PI*2);
                ctx.fill();
                ctx.restore();
            }

            function drawButterfly(b) {
                const yy = b.y + Math.sin(b.p)*9;
                ctx.save();
                ctx.translate(b.x, yy);
                ctx.fillStyle = b.c;
                ctx.globalAlpha = .9;
                ctx.beginPath();
                ctx.ellipse(-b.s, 0, b.s, b.s*1.25, Math.sin(b.p)*.35, 0, Math.PI*2);
                ctx.ellipse(b.s, 0, b.s, b.s*1.25, -Math.sin(b.p)*.35, 0, Math.PI*2);
                ctx.fill();
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(0,-b.s);
                ctx.lineTo(0,b.s);
                ctx.stroke();
                ctx.restore();
            }

            function drawBackground() {
                const sky = ctx.createLinearGradient(0,0,0,h*.72);
                sky.addColorStop(0,'#72cef8');
                sky.addColorStop(.60,'#bcecff');
                sky.addColorStop(1,'#e7fbff');
                ctx.fillStyle = sky;
                ctx.fillRect(0,0,w,h);

                // Sun
                const sx = Math.min(92, w*.10), sy = Math.min(90, h*.12), sr = Math.max(30, Math.min(w,h)*.045);
                ctx.fillStyle = 'rgba(255,210,66,.18)';
                ctx.beginPath(); ctx.arc(sx,sy,sr*1.75,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#ffd65a';
                ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();

                clouds.forEach(drawCloud);
                butterflies.forEach(drawButterfly);

                // Far hills
                ctx.fillStyle = '#8bdc55';
                ctx.beginPath();
                ctx.moveTo(0,h);
                ctx.lineTo(0,h*.70);
                ctx.quadraticCurveTo(w*.22,h*.57,w*.45,h*.69);
                ctx.quadraticCurveTo(w*.70,h*.80,w,h*.65);
                ctx.lineTo(w,h);
                ctx.fill();

                ctx.fillStyle = '#6ac947';
                ctx.beginPath();
                ctx.moveTo(0,h);
                ctx.lineTo(0,h*.76);
                ctx.quadraticCurveTo(w*.30,h*.64,w*.56,h*.77);
                ctx.quadraticCurveTo(w*.78,h*.87,w,h*.72);
                ctx.lineTo(w,h);
                ctx.fill();

                trees.forEach(drawTree);

                // Front grass
                ctx.fillStyle = '#55bb35';
                ctx.beginPath();
                ctx.moveTo(0,h);
                ctx.lineTo(0,h*.84);
                ctx.quadraticCurveTo(w*.5,h*.76,w,h*.85);
                ctx.lineTo(w,h);
                ctx.fill();

                flowers.forEach(drawFlower);
            }

            function loop(ts) {
                t = ts || 0;
                clouds.forEach(c => {
                    c.x -= c.v;
                    if (c.x + c.s*2.5 < 0) c.x = w + c.s*2.5;
                });
                butterflies.forEach(b => {
                    b.x += b.v;
                    b.p += .045;
                    if (b.x > w + 30) b.x = -30;
                });
                drawBackground();
                requestAnimationFrame(loop);
            }

            window.addEventListener('resize', resizeBackground);
            resizeBackground();
            requestAnimationFrame(loop);
        })();

            arrow_down: `<path d="M100 174 L45 118 Q41 114 47 114 L76 114 L76 42 L124 42 L124 114 L153 114 Q159 114 155 118 Z" fill="#FF5A5F" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>`,
            arrow_left: `<path d="M26 100 L82 45 Q86 41 86 47 L86 76 L158 76 L158 124 L86 124 L86 153 Q86 159 82 155 Z" fill="#FF5A5F" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>`,
            arrow_right: `<path d="M174 100 L118 45 Q114 41 114 47 L114 76 L42 76 L42 124 L114 124 L114 153 Q114 159 118 155 Z" fill="#FF5A5F" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>`
        };

        // --- SCENE BUILDER ---
        // Shifts assets to create relations perfectly simulating real spatial layouts.
        function buildScene(obj1Name, obj2Name, relation, obj3Name = null) {
            let svgContent = '';
            const o1 = assets[obj1Name] || '';
            const o2 = assets[obj2Name] || '';
            const o3 = obj3Name ? (assets[obj3Name] || '') : '';
            const o2Front = assets[obj2Name + '_front'] || '';

            const place = (svg, dx, dy, scale=1) =>
                `<g transform="translate(${100 + dx}, ${100 + dy}) scale(${scale}) translate(-100,-100)">${svg}</g>`;

            switch (relation) {
                case 'LEFT':
                    svgContent = place(o1, -50, 4, .72) + place(o2, 50, 4, .72);
                    break;
                case 'RIGHT':
                    svgContent = place(o2, -50, 4, .72) + place(o1, 50, 4, .72);
                    break;
                case 'ABOVE':
                    svgContent = place(o2, 0, 51, .62) + place(o1, 0, -51, .62);
                    break;
                case 'BELOW':
                    svgContent = place(o2, 0, -51, .62) + place(o1, 0, 51, .62);
                    break;
                case 'UNDER':
                    svgContent = place(o2, 0, -24, .82) + place(o1, 0, 48, .53);
                    break;
                case 'INSIDE':
                    if (obj2Name === 'box') {
                        svgContent = place(o2, 0, 4, .96) + place(o1, 0, 13, .53) + place(o2Front, 0, 4, .96);
                    } else {
                        svgContent = place(o2, 0, 0, .94) + place(o1, 0, 18, .48) + place(o2Front, 0, 0, .94);
                    }
                    break;
                case 'BETWEEN':
                    svgContent = place(o2, -63, 8, .58) + place(o3 || o2, 63, 8, .58) + place(o1, 0, 7, .62);
                    break;
                case 'NEXT TO':
                    svgContent = place(o1, -37, 5, .72) + place(o2, 37, 5, .72);
                    break;
                case 'IN FRONT OF':
                    if (obj1Name === 'dog' && obj2Name === 'table') {
                        // Make the dog about 20% larger in the "in front of" distractor so it is easier
                        // to distinguish from "under" in the picture-choice question.
                        svgContent = place(o2, 16, -13, .68) + place(o1, -16, 18, 1.10);
                    } else {
                        svgContent = place(o2, 13, -13, .70) + place(o1, -12, 21, .91);
                    }
                    break;
                case 'BEHIND':
                    if (obj2Name === 'tree' && obj1Name === 'bird') {
                        // Bigger tree. Put the bird behind the tree trunk and let the face peek out.
                        svgContent = place(o1, 22, 44, .44) + place(o2, -2, 18, 1.12);
                    } else if (obj2Name === 'tree') {
                        // Larger tree with the hidden object peeking from behind it.
                        svgContent = place(o1, 26, 22, .55) + place(o2, -4, 18, 1.08);
                    } else {
                        svgContent = place(o1, 30, 4, .58) + place(o2, -8, 16, .91);
                    }
                    break;
                case 'UP':
                case 'DOWN':
                case 'DIR_LEFT':
                case 'DIR_RIGHT': {
                    const dirName = relation.replace('DIR_', '').toLowerCase();
                    const arrow = assets['arrow_' + dirName];
                    if (relation === 'UP') svgContent = place(o2, 0, 43, .53) + place(arrow, 0, -43, .43);
                    if (relation === 'DOWN') svgContent = place(o2, 0, -43, .53) + place(arrow, 0, 43, .43);
                    if (relation === 'DIR_LEFT') svgContent = place(o2, 43, 0, .53) + place(arrow, -43, 0, .43);
                    if (relation === 'DIR_RIGHT') svgContent = place(o2, -43, 0, .53) + place(arrow, 43, 0, .43);
                    break;
                }
            }

            return `<svg viewBox="-8 -8 216 216" xmlns="http://www.w3.org/2000/svg" overflow="visible">
                <g transform="translate(100,100) scale(1.10) translate(-100,-100)">${svgContent}</g>
            </svg>`;
        }

        const positionConcepts = ['LEFT', 'RIGHT', 'ABOVE', 'BELOW', 'UNDER', 'INSIDE', 'BETWEEN', 'NEXT TO', 'IN FRONT OF', 'BEHIND'];
        const directionConcepts = ['UP', 'DOWN', 'DIR_LEFT', 'DIR_RIGHT'];

        function displayConcept(concept) {
            return concept.replace('DIR_', '');
        }

        function getDistractors(correctConcept, count = 3) {
            let pool;

            if (directionConcepts.includes(correctConcept)) {
                pool = directionConcepts.filter(c => c !== correctConcept);
            } else {
                pool = positionConcepts.filter(c => c !== correctConcept);

                // Avoid semantically overlapping choices.
                if (correctConcept === 'UNDER' || correctConcept === 'BELOW') {
                    pool = pool.filter(c => c !== 'UNDER' && c !== 'BELOW');
                }
                if (correctConcept === 'NEXT TO') {
                    // LEFT/RIGHT can both be true in a next-to picture, so avoid them.
                    pool = pool.filter(c => !['LEFT','RIGHT'].includes(c));
                }
                if (correctConcept === 'LEFT' || correctConcept === 'RIGHT') {
                    pool = pool.filter(c => c !== 'NEXT TO');
                }
            }

            return shuffle([...pool]).slice(0, count);
        }

        const imageContrastMap = {
            'LEFT': ['RIGHT', 'ABOVE', 'INSIDE'],
            'RIGHT': ['LEFT', 'BELOW', 'INSIDE'],
            'ABOVE': ['BELOW', 'NEXT TO', 'LEFT'],
            'BELOW': ['ABOVE', 'RIGHT', 'INSIDE'],
            'UNDER': ['ABOVE', 'NEXT TO', 'INSIDE'],
            'INSIDE': ['ABOVE', 'NEXT TO', 'UNDER'],
            'BETWEEN': ['ABOVE', 'NEXT TO', 'INSIDE'],
            'NEXT TO': ['ABOVE', 'UNDER', 'INSIDE'],
            'IN FRONT OF': ['BEHIND', 'NEXT TO', 'ABOVE'],
            'BEHIND': ['IN FRONT OF', 'NEXT TO', 'ABOVE']
        };

        const questionBank = [];

        function addTextQ(concept, qText, obj1, obj2, obj3=null, level='easy') {
            const correct = displayConcept(concept);
            const distractors = getDistractors(concept, 3).map(displayConcept);

            questionBank.push({
                type: 'text_options',
                level,
                concept,
                question: qText,
                image: buildScene(obj1, obj2, concept, obj3),
                correct,
                distractors
            });
        }

        function addImageQ(concept, qText, obj1, obj2, obj3=null, level='image') {
            const contrastConcepts = imageContrastMap[concept] || getDistractors(concept, 3);
            questionBank.push({
                type: 'image_options',
                level,
                concept,
                question: qText,
                correct: buildScene(obj1, obj2, concept, obj3),
                correctLabel: concept,
                distractors: contrastConcepts.slice(0,3).map(dc => buildScene(obj1, obj2, dc, obj3))
            });
        }

        // --- CURATED QUESTION BANK: clear, child-friendly, non-ambiguous ---

        // Easy core positions
        addTextQ('LEFT', 'Where is the ball?', 'ball', 'teddy');
        addTextQ('RIGHT', 'Where is the dog?', 'dog', 'ball');
        addTextQ('LEFT', 'Where is the pencil?', 'pencil', 'book');
        addTextQ('RIGHT', 'Where is the apple?', 'apple', 'backpack');
        addTextQ('LEFT', 'Where is the toy car?', 'car', 'tree');
        addTextQ('RIGHT', 'Where is the mouse?', 'mouse', 'cheese');

        addTextQ('ABOVE', 'Where is the bird?', 'bird', 'cloud');
        addTextQ('BELOW', 'Where is the cloud?', 'cloud', 'bird');
        addTextQ('ABOVE', 'Where is the owl?', 'owl', 'box');
        addTextQ('BELOW', 'Where is the mouse?', 'mouse', 'book');
        addTextQ('ABOVE', 'Where is the apple?', 'apple', 'book');
        addTextQ('BELOW', 'Where is the toy car?', 'car', 'tree');

        addTextQ('UNDER', 'Where is the dog?', 'dog', 'table');
        addTextQ('UNDER', 'Where is the ball?', 'ball', 'table');
        addTextQ('UNDER', 'Where is the cat?', 'cat', 'table');
        addTextQ('UNDER', 'Where is the backpack?', 'backpack', 'table');

        addTextQ('INSIDE', 'Where is the fish?', 'fish', 'bowl');
        addTextQ('INSIDE', 'Where is the ball?', 'ball', 'box');
        addTextQ('INSIDE', 'Where is the mouse?', 'mouse', 'box');
        addTextQ('INSIDE', 'Where is the teddy bear?', 'teddy', 'box');

        // Advanced spatial language
        addTextQ('BETWEEN', 'Where is the cheese?', 'cheese', 'mouse', 'mouse', 'advanced');
        addTextQ('BETWEEN', 'Where is the ball?', 'ball', 'teddy', 'teddy', 'advanced');
        addTextQ('BETWEEN', 'Where is the apple?', 'apple', 'book', 'book', 'advanced');
        addTextQ('BETWEEN', 'Where is the owl?', 'owl', 'tree', 'tree', 'advanced');

        addTextQ('NEXT TO', 'Where is the cat?', 'cat', 'tree', null, 'advanced');
        addTextQ('NEXT TO', 'Where is the bird?', 'bird', 'kennel', null, 'advanced');
        addTextQ('NEXT TO', 'Where is the pencil?', 'pencil', 'book', null, 'advanced');
        addTextQ('NEXT TO', 'Where is the toy car?', 'car', 'backpack', null, 'advanced');

        addTextQ('IN FRONT OF', 'Where is the owl?', 'owl', 'tree', null, 'advanced');
        addTextQ('IN FRONT OF', 'Where is the teddy bear?', 'teddy', 'box', null, 'advanced');
        addTextQ('IN FRONT OF', 'Where is the dog?', 'dog', 'table', null, 'advanced');
        addTextQ('IN FRONT OF', 'Where is the apple?', 'apple', 'backpack', null, 'advanced');

        addTextQ('BEHIND', 'Where is the cat?', 'cat', 'box', null, 'advanced');
        addTextQ('BEHIND', 'Where is the bird?', 'bird', 'tree', null, 'advanced');
        addTextQ('BEHIND', 'Where is the mouse?', 'mouse', 'book', null, 'advanced');
        addTextQ('BEHIND', 'Where is the backpack?', 'backpack', 'tree', null, 'advanced');

        // Direction questions — answer set is always UP / DOWN / LEFT / RIGHT
        addTextQ('UP',        'Which way is the bird going?', 'bird', 'bird', null, 'direction');
        addTextQ('DOWN',      'Which way is the ball going?', 'ball', 'ball', null, 'direction');
        addTextQ('DIR_LEFT',  'Which way is the mouse going?', 'mouse', 'mouse', null, 'direction');
        addTextQ('DIR_RIGHT', 'Which way is the dog going?', 'dog', 'dog', null, 'direction');
        addTextQ('UP',        'Which way is the owl going?', 'owl', 'owl', null, 'direction');
        addTextQ('DIR_RIGHT', 'Which way is the toy car going?', 'car', 'car', null, 'direction');

        // Word -> picture questions. Contrast sets are intentionally non-overlapping.
        addImageQ('ABOVE',       'Which picture shows ABOVE?', 'bird', 'kennel');
        addImageQ('BELOW',       'Which picture shows BELOW?', 'apple', 'book');
        addImageQ('UNDER',       'Which picture shows UNDER?', 'dog', 'table');
        addImageQ('BETWEEN',     'Which picture shows BETWEEN?', 'ball', 'teddy', 'teddy');
        addImageQ('INSIDE',      'Which picture shows INSIDE?', 'fish', 'bowl');
        addImageQ('LEFT',        'Which picture shows LEFT?', 'owl', 'tree');
        addImageQ('RIGHT',       'Which picture shows RIGHT?', 'cat', 'box');
        addImageQ('IN FRONT OF', 'Which picture shows IN FRONT OF?', 'teddy', 'box');
        addImageQ('BEHIND',      'Which picture shows BEHIND?', 'mouse', 'book');
        addImageQ('NEXT TO',     'Which picture shows NEXT TO?', 'dog', 'ball');


        let currentSession = [];
        let currentQIndex = 0;
        let score = 0;
        let hasGuessedWrongCurrent = false;
        let isTransitioning = false;
        let correctPadIndex = -1;
        let currentQuestion = null;

        // Audio Setup (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playDing() {
            playTone(800, 'sine', 0.1, 0.2);
            setTimeout(() => playTone(1200, 'sine', 0.2, 0.2), 100);
        }
        function playBuzz() {
            playTone(150, 'sawtooth', 0.3, 0.1);
        }

        // TTS setup
        function readQuestion() {
            if (!window.speechSynthesis || !currentQuestion) return;
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(currentQuestion.question);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        }

        // Shuffle array helper
        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }


        function sample(arr, n) {
            return shuffle([...arr]).slice(0, Math.min(n, arr.length));
        }

        function pickFromConcepts(bank, concepts, n = 1) {
            const chosen = [];
            const usedConcepts = new Set();
            const shuffledBank = shuffle([...bank]);

            for (const q of shuffledBank) {
                if (!concepts.includes(q.concept)) continue;
                if (usedConcepts.has(q.concept)) continue;
                chosen.push(q);
                usedConcepts.add(q.concept);
                if (chosen.length >= n) break;
            }

            if (chosen.length < n) {
                for (const q of shuffledBank) {
                    if (!concepts.includes(q.concept)) continue;
                    if (chosen.includes(q)) continue;
                    chosen.push(q);
                    if (chosen.length >= n) break;
                }
            }
            return chosen.slice(0, n);
        }

        function arrangeNoAdjacentSameConcept(questions) {
            const remaining = shuffle([...questions]);
            const arranged = [];

            while (remaining.length) {
                const lastConcept = arranged.length ? arranged[arranged.length - 1].concept : null;
                let idx = remaining.findIndex(q => q.concept !== lastConcept);
                if (idx === -1) idx = 0;
                arranged.push(remaining.splice(idx, 1)[0]);
            }
            return arranged;
        }

        function buildSession() {
            const easyText = questionBank.filter(q => q.type === 'text_options' && q.level === 'easy');
            const advancedText = questionBank.filter(q => q.type === 'text_options' && q.level === 'advanced');
            const directionText = questionBank.filter(q => q.type === 'text_options' && q.level === 'direction');
            const imageQs = questionBank.filter(q => q.type === 'image_options');

            const session = [
                ...pickFromConcepts(easyText, ['LEFT', 'RIGHT'], 2),
                ...pickFromConcepts(easyText, ['ABOVE', 'BELOW'], 2),
                ...pickFromConcepts(easyText, ['UNDER'], 1),
                ...pickFromConcepts(easyText, ['INSIDE'], 1),

                ...pickFromConcepts(advancedText, ['BETWEEN'], 1),
                ...pickFromConcepts(advancedText, ['NEXT TO'], 1),
                ...pickFromConcepts(advancedText, ['IN FRONT OF'], 1),
                ...pickFromConcepts(advancedText, ['BEHIND'], 1),

                ...pickFromConcepts(directionText, ['UP', 'DOWN', 'DIR_LEFT', 'DIR_RIGHT'], 2),

                ...pickFromConcepts(imageQs, ['ABOVE', 'BELOW', 'UNDER', 'BETWEEN', 'INSIDE', 'LEFT', 'RIGHT', 'IN FRONT OF', 'BEHIND', 'NEXT TO'], 3)
            ];

            return arrangeNoAdjacentSameConcept(session);
        }

        function startGame() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            // Build a balanced 15-question round with gentle difficulty progression.
            currentSession = buildSession();
            currentQIndex = 0;
            score = 0;
            updateTopBar();
            document.getElementById('top-progress-fill').style.width = '0%';
            loadQuestion();
        }

        function loadQuestion() {
            isTransitioning = false;
            hasGuessedWrongCurrent = false;
            currentQuestion = currentSession[currentQIndex];

            // Reset UI Pads
            const gameScreen = document.getElementById('game-screen');
            const mainSvgContainer = document.getElementById('main-svg-container');
            const pads = document.querySelectorAll('.answer-pad');
            
            pads.forEach(pad => {
                pad.className = `answer-pad pad-${pad.id.split('-')[1]}`; // reset classes
                pad.classList.remove('image-option');
            });

            document.getElementById('question-text').innerText = currentQuestion.question;
            document.getElementById('q-counter').innerText = currentQIndex + 1;
            document.getElementById('top-progress-fill').style.width = `${((currentQIndex + 1) / currentSession.length) * 100}%`;

            // Prepare options (0 is correct, 1-3 are distractors)
            let options = [currentQuestion.correct, ...currentQuestion.distractors];
            if (currentQuestion.type === 'text_options') {
                options = [...new Set(options)];
                const fallback = ['LEFT','RIGHT','ABOVE','BELOW','UNDER','INSIDE','BETWEEN','NEXT TO','IN FRONT OF','BEHIND','UP','DOWN'];
                for (const item of fallback) {
                    if (options.length >= 4) break;
                    if (!options.includes(item)) options.push(item);
                }
                options = options.slice(0,4);
            }
            
            // Randomize position on pads
            const optionIndices = shuffle([0, 1, 2, 3]);
            
            if (currentQuestion.type === 'text_options') {
                gameScreen.classList.remove('layout-word-to-pic');
                mainSvgContainer.innerHTML = currentQuestion.image;
                
                optionIndices.forEach((optIndex, padIndex) => {
                    const pad = document.getElementById(`pad-${padIndex}`);
                    pad.querySelector('.pad-content').innerHTML = options[optIndex];
                    if (optIndex === 0) correctPadIndex = padIndex;
                });
            } else {
                gameScreen.classList.add('layout-word-to-pic');
                mainSvgContainer.innerHTML = ''; 
                
                optionIndices.forEach((optIndex, padIndex) => {
                    const pad = document.getElementById(`pad-${padIndex}`);
                    pad.classList.add('image-option');
                    pad.querySelector('.pad-content').innerHTML = options[optIndex];
                    if (optIndex === 0) correctPadIndex = padIndex;
                });
            }

            // Auto-read question gently
            setTimeout(readQuestion, 300);
        }

        function handleSlap(padIndex) {
            if (isTransitioning) return;
            
            const pad = document.getElementById(`pad-${padIndex}`);
            
            if (padIndex === correctPadIndex) {
                // Correct!
                isTransitioning = true;
                pad.classList.add('pad-correct');
                playDing();
                createStars(pad);
                
                if (!hasGuessedWrongCurrent) {
                    score++;
                    updateTopBar();
                }

                const qText = document.getElementById('question-text');
                const origText = qText.innerText;
                qText.innerText = ["Great job!", "You got it!", "Awesome!"][Math.floor(Math.random()*3)];
                qText.style.color = "#2dc653";

                setTimeout(() => {
                    qText.innerText = origText;
                    qText.style.color = "#14213d";
                    currentQIndex++;
                    if (currentQIndex < currentSession.length) {
                        loadQuestion();
                    } else {
                        endGame();
                    }
                }, 1200);

            } else {
                // Wrong!
                if(pad.classList.contains('pad-wrong')) return; 
                
                hasGuessedWrongCurrent = true;
                pad.classList.add('pad-wrong');
                playBuzz();
                
                const qText = document.getElementById('question-text');
                const origText = qText.innerText;
                qText.innerText = "Try again!";
                qText.style.color = "#e63946";
                
                setTimeout(() => {
                    if(!isTransitioning) {
                        qText.innerText = currentQuestion.question;
                        qText.style.color = "#14213d";
                    }
                }, 1000);
            }
        }

        function updateTopBar() {
            document.getElementById('score-counter').innerText = score;
        }

        function createStars(element) {
            const rect = element.getBoundingClientRect();
            for(let i=0; i<6; i++) {
                const star = document.createElement('div');
                star.innerHTML = '⭐';
                star.className = 'star-particle';
                
                const x = rect.left + Math.random() * rect.width;
                const y = rect.top + Math.random() * rect.height;
                
                star.style.left = `${x}px`;
                star.style.top = `${y}px`;
                
                const tx = (Math.random() - 0.5) * 200 + 'px';
                const ty = (Math.random() - 1) * 200 + 'px';
                star.style.setProperty('--tx', tx);
                star.style.setProperty('--ty', ty);
                
                document.body.appendChild(star);
                
                setTimeout(() => star.remove(), 1000);
            }
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');
            
            document.getElementById('final-score').innerText = score;
            const accuracy = Math.round((score / 15) * 100);
            document.getElementById('accuracy-text').innerText = `Accuracy: ${accuracy}%`;
            
            // Confetti effect
            for(let i=0; i<40; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = '12px';
                conf.style.height = '12px';
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                conf.style.backgroundColor = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590', '#9b5de5'][Math.floor(Math.random()*8)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.zIndex = '20';
                conf.style.animation = `floatStar ${1.5 + Math.random()*2}s linear forwards`;
                conf.style.setProperty('--tx', (Math.random()-0.5)*150 + 'px');
                conf.style.setProperty('--ty', '100vh');
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3500);
            }
            
            playTone(400, 'sine', 0.1);
            setTimeout(() => playTone(500, 'sine', 0.1), 100);
            setTimeout(() => playTone(600, 'sine', 0.3), 200);
            setTimeout(() => playTone(800, 'sine', 0.4), 300);
        }

        function goHome() {
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        // Keyboard shortcuts for Teacher / Facilitator
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('game-screen').classList.contains('hidden')) return;
            
            if (e.key === '1') handleSlap(0); // Top Left
            if (e.key === '2') handleSlap(1); // Top Right
            if (e.key === '3') handleSlap(2); // Bottom Left
            if (e.key === '4') handleSlap(3); // Bottom Right
        });

    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Position & Direction - Slap Challenge ver2</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pad1: #9557e6;
            --pad2: #11b7ea;
            --pad3: #ef55ad;
            --pad4: #f6c515;
            --ink: #17233f;
            --sky1: #75d0fa;
            --sky2: #dff7ff;
            --green: #58cc02;
            --green-dark: #3a9a00;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--sky1);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            color: var(--ink);
        }
        .hidden { display: none !important; }
        #backgroundCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        /* ---------- Start / End screens ---------- */
        .screen {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: transparent;
            overflow: hidden;
            padding: 3vh 3vw;
        }
        .screen::before {
            content: "";
            position: absolute;
            width: min(900px, 92vw);
            height: min(820px, 90vh);
            border-radius: 44px;
            background: rgba(255,255,255,0.78);
            border: 5px solid rgba(255,255,255,0.92);
            box-shadow: 0 24px 60px rgba(27,88,121,0.20);
            backdrop-filter: blur(9px);
            z-index: 0;
        }
        .screen > * { position: relative; z-index: 1; }
        .title-text {
            font-size: clamp(2.6rem, 7vw, 5.6rem);
            font-weight: 900;
            color: var(--ink);
            text-align: center;
            text-shadow: 0 5px 0 #fff, 0 9px 18px rgba(17,54,92,0.16);
            line-height: 1.03;
            margin-bottom: 10px;
            letter-spacing: -0.03em;
        }
        .subtitle-text {
            font-size: clamp(1.25rem, 3vw, 2.25rem);
            font-weight: 900;
            color: #ef476f;
            background: #fff8bd;
            padding: 9px 24px;
            border: 3px solid #ffe36e;
            border-radius: 999px;
            box-shadow: 0 6px 0 #efd14f;
            margin-bottom: 26px;
            letter-spacing: .06em;
        }
        .instruction-row {
            display: flex;
            gap: clamp(12px, 3vw, 34px);
            margin-bottom: 28px;
            flex-wrap: wrap;
            justify-content: center;
            color: #516174;
            font-size: clamp(1rem, 2vw, 1.45rem);
            font-weight: 800;
        }
        .instruction-row span {
            background: rgba(255,255,255,.82);
            border: 3px solid #e5eef6;
            border-radius: 18px;
            padding: 8px 14px;
            box-shadow: 0 5px 0 rgba(151,177,199,.26);
        }
        .btn-large {
            font-family: inherit;
            font-size: clamp(1.25rem, 3vw, 2rem);
            font-weight: 900;
            padding: 17px 42px;
            border-radius: 24px;
            background: var(--green);
            color: white;
            border: 4px solid rgba(255,255,255,.72);
            cursor: pointer;
            box-shadow: 0 9px 0 var(--green-dark), 0 18px 28px rgba(50,137,0,.18);
            transition: transform .11s ease, box-shadow .11s ease, filter .11s ease;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .btn-large:hover { filter: brightness(1.04); transform: translateY(-2px); }
        .btn-large:active { transform: translateY(8px); box-shadow: 0 1px 0 var(--green-dark); }
        .end-actions { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
        /* ---------- Game Layout ---------- */
        #game-screen {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }
        #top-bar {
            height: 10vh;
            min-height: 64px;
            display: grid;
            grid-template-columns: auto minmax(260px, 720px) auto auto 150px;
            gap: clamp(10px, 1.7vw, 20px);
            align-items: center;
            padding: 0 clamp(14px, 2.2vw, 30px);
            background: rgba(255,255,255,0.88);
            border-bottom: 4px solid rgba(255,255,255,.96);
            box-shadow: 0 8px 24px rgba(29,82,113,0.11);
            font-size: clamp(1rem, 2vw, 1.55rem);
            font-weight: 900;
            color: var(--ink);
            backdrop-filter: blur(10px);
        }
        .top-badge {
            min-width: 112px;
            background: #fff;
            border: 3px solid #e4edf5;
            border-radius: 18px;
            padding: 8px 14px;
            text-align: center;
            box-shadow: 0 5px 0 #dbe8f1;
            white-space: nowrap;
        }
        .progress-wrap {
            min-width: 0;
            width: 100%;
            max-width: min(720px, 56vw);
            justify-self: start;
        }
        .logo-space {
            width: 150px;
            min-width: 150px;
            height: 100%;
        }
        .progress-title {
            text-align:center;
            font-size: clamp(.72rem, 1.4vw, .95rem);
            letter-spacing: .09em;
            color: #5b7087;
            margin-bottom: 5px;
        }
        .progress-track {
            height: 16px;
            border-radius: 999px;
            background: #dce9f1;
            border: 3px solid #c8dbe7;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,.08);
        }
        #top-progress-fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #58cc02, #8be23b);
            transition: width .35s ease;
        }
        .tts-btn {
            background: #18b9ee;
            color: white;
            border: 3px solid rgba(255,255,255,.9);
            border-radius: 50%;
            width: clamp(44px, 6vh, 62px);
            height: clamp(44px, 6vh, 62px);
            font-size: clamp(1.15rem, 2.6vh, 1.9rem);
            cursor: pointer;
            box-shadow: 0 5px 0 #0787ba;
            display: grid;
            place-items: center;
            transition: transform .1s, box-shadow .1s;
        }
        .tts-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #0787ba; }
        #question-area {
            height: 14vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.2vh 3vw 0;
            text-align: center;
            background: transparent;
        }
        #question-text {
            max-width: min(1040px, 92vw);
            font-size: clamp(1.65rem, 3.8vmin, 3.2rem);
            font-weight: 900;
            color: var(--ink);
            line-height: 1.15;
            text-shadow: 0 2px 0 rgba(255,255,255,.9);
            background: rgba(255,255,255,.76);
            border: 4px solid rgba(255,255,255,.92);
            border-radius: 24px;
            padding: .55vh 2vw;
            box-shadow: 0 8px 22px rgba(29,82,113,.09);
            backdrop-filter: blur(6px);
        }
        #picture-area {
            height: 48vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 1.5vh 2vw 2vh;
            background: transparent;
        }
        #picture-area::after {
            content:"";
            position:absolute;
            left:50%;
            top:50%;
            transform:translate(-50%,-50%);
            width:min(610px, 72vw);
            height:min(30vh, 285px);
            border-radius:36px;
            background:rgba(255,255,255,.58);
            border:4px solid rgba(255,255,255,.78);
            box-shadow:0 16px 38px rgba(29,82,113,.10);
            backdrop-filter:blur(5px);
            pointer-events:none;
        }
        #main-svg-container {
            height: min(27vh, 255px);
            width: min(600px, 70vw);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        #main-svg-container svg {
            width: 100%;
            height: 100%;
            max-height: 100%;
            overflow: visible;
            filter: drop-shadow(0 10px 9px rgba(30,86,111,0.15));
        }
        #answer-area {
            height: 28vh;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: 1fr;
            gap: clamp(9px, 1.15vw, 18px);
            padding: clamp(10px, 1.15vw, 18px) clamp(14px, 1.8vw, 28px);
            padding-bottom: max(clamp(12px, 1.5vw, 22px), env(safe-area-inset-bottom));
            background: transparent;
            align-items: center;
        }
        .answer-pad {
            height: min(20vh, 180px);
            border-radius: clamp(18px, 1.8vw, 28px);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform .1s, filter .2s, box-shadow .2s;
            font-size: clamp(1.15rem, 3.1vmin, 2.7rem);
            line-height: 1.05;
            font-weight: 900;
            color: white;
            text-shadow: 0 3px 0 rgba(55,55,55,.22);
            border: 4px solid rgba(255,255,255,.42);
            text-align: center;
            padding: 8px 10px;
            overflow: hidden;
            letter-spacing: .005em;
        }
        .answer-pad::after {
            content:"";
            position:absolute;
            inset:7px 12px auto;
            height:24%;
            border-radius:999px;
            background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,0));
            pointer-events:none;
        }
        .pad-0 { background: linear-gradient(180deg,#a367ef,#8e4bd8); box-shadow: 0 10px 0 #6730a4, 0 16px 24px rgba(51,37,92,.18); }
        .pad-1 { background: linear-gradient(180deg,#20c4f1,#0aa9da); box-shadow: 0 10px 0 #087fa7, 0 16px 24px rgba(23,99,132,.18); }
        .pad-2 { background: linear-gradient(180deg,#f565b9,#e849a5); box-shadow: 0 10px 0 #ac3478, 0 16px 24px rgba(113,46,85,.18); }
        .pad-3 { background: linear-gradient(180deg,#ffd31f,#efbd09); box-shadow: 0 10px 0 #b98a05, 0 16px 24px rgba(110,83,22,.18); color:#fff; }
        .answer-pad:hover { filter: brightness(1.035); transform: translateY(-2px); }
        .answer-pad:active { transform: translateY(9px); }
        .answer-pad.image-option { padding: 4px; }
        .answer-pad.image-option .pad-content {
            width: 100%;
            height: 100%;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .answer-pad.image-option svg {
            width: 104%;
            height: 104%;
            pointer-events: none;
            overflow: visible;
            filter: drop-shadow(0 7px 6px rgba(52,54,78,.16));
        }
        .keyboard-hint {
            position: absolute;
            top: 9px;
            left: 15px;
            font-size: clamp(1rem, 2vw, 1.55rem);
            opacity: .60;
            text-shadow: none;
            z-index: 3;
        }
        @keyframes bounceCorrect {
            0%,100% { transform: scale(1) translateY(8px); }
            50% { transform: scale(1.055) translateY(-8px); }
        }
        @keyframes shakeWrong {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-13px); }
            40% { transform: translateX(13px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        .pad-correct {
            animation: bounceCorrect .5s ease;
            background: linear-gradient(180deg,#4add73,#26b84d) !important;
            box-shadow: 0 10px 0 #17883a !important;
            z-index: 10;
        }
        .pad-wrong {
            animation: shakeWrong .4s ease;
            background: linear-gradient(180deg,#f45c68,#df3342) !important;
            box-shadow: 0 10px 0 #a92230 !important;
            filter: saturate(.86);
        }
        .feedback-icon {
            position: absolute;
            font-size: clamp(4rem, 11vmin, 10rem);
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .3s cubic-bezier(.175,.885,.32,1.275);
            transform: scale(0);
            z-index: 5;
            color: white;
            text-shadow: 0 4px 10px rgba(0,0,0,.24);
        }
        .pad-correct .feedback-icon,
        .pad-wrong .feedback-icon { opacity: 1; transform: scale(1); }
        .pad-correct .feedback-icon::before { content:"✓"; }
        .pad-wrong .feedback-icon::before { content:"✗"; }
        .star-particle {
            position: absolute;
            color: #FFD700;
            font-size: 2rem;
            pointer-events: none;
            animation: floatStar 1s forwards ease-out;
            z-index: 20;
        }
        @keyframes floatStar {
            0% { transform: translate(0,0) scale(.5) rotate(0deg); opacity:1; }
            100% { transform: translate(var(--tx),var(--ty)) scale(1.5) rotate(360deg); opacity:0; }
        }
        .layout-word-to-pic #picture-area { display: none; }
        .layout-word-to-pic #question-area { height: 18vh; }
        .layout-word-to-pic #answer-area {
            height: 62vh;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: 1fr;
            padding-top: 4vh;
            padding-bottom: 7vh;
        }
        .layout-word-to-pic .answer-pad {
            height: min(48vh, 430px);
        }
        @media (max-width: 760px) {
            #top-bar {
                grid-template-columns: auto 1fr auto;
                gap: 7px;
                padding: 0 9px;
            }
            #top-bar .progress-wrap { display:none; }
            .top-badge { min-width: 82px; padding: 7px 9px; }
            #question-text { font-size: clamp(1.35rem, 5.5vw, 2.2rem); }
            .answer-pad { font-size: clamp(.82rem, 3.5vw, 1.55rem); padding: 5px; height:min(18vh,145px); }
            #answer-area { grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; padding-left:8px; padding-right:8px; }
            .layout-word-to-pic #answer-area { grid-template-columns:repeat(4,minmax(0,1fr)); padding-left:7px; padding-right:7px; }
            .layout-word-to-pic .answer-pad { height:min(46vh,390px); }
            .keyboard-hint { font-size: .95rem; top: 6px; left: 9px; }
            .screen::before { height: 94vh; }
        }
        @media (max-height: 650px) and (orientation: landscape) {
            .screen { padding: 1.5vh 2vw; }
            .screen::before { height: 94vh; }
            .title-text { font-size: clamp(2rem, 6vh, 3.7rem); }
            .subtitle-text { margin-bottom: 14px; padding: 5px 18px; }
            .instruction-row { margin-bottom: 16px; }
            #top-bar { min-height: 52px; }
        }

    #backgroundCanvas {display:none!important;}
    #game-screen {background:transparent;}
    .screen::before {background:rgba(255,255,255,.79);border:4px solid rgba(255,255,255,.86);box-shadow:0 14px 48px rgba(22,75,67,.12);}
    .title-text {color:#1c526b;text-shadow:0 3px 0 #fff,0 8px 15px rgba(14,79,108,.13);}
    .subtitle-text {color:#147e61;background:#e5ffe1;border-color:#a5eb83;box-shadow:0 5px 0 #7ecf74;}
    #top-bar {height:10vh;min-height:62px;grid-template-columns:auto minmax(220px,1fr) auto 145px;gap:clamp(10px,2vw,25px);background:none;border:0;box-shadow:none;backdrop-filter:none;padding:8px 2vw;}
    .top-badge {background:linear-gradient(180deg,#fffdf4,#e3fff2);border:3px solid #fff;box-shadow:0 5px 0 rgba(24,105,74,.26),0 8px 15px rgba(19,88,107,.1);color:#176b6a;padding:7px 16px;border-radius:999px;font-weight:900;}
    .progress-wrap {max-width:min(680px,50vw);justify-self:center;}
    .progress-title {color:#1a6779;font-size:clamp(.82rem,1.5vw,1rem);text-shadow:0 2px 0 #fff;font-weight:900;}
    .progress-track {height:23px;background:rgba(255,255,255,.8);border:3px solid #fff;box-shadow:0 4px 0 rgba(13,119,88,.18),inset 0 3px 5px rgba(17,97,89,.13);}
    #top-progress-fill {background:linear-gradient(90deg,#52d88f,#c9ed44,#ffe465);position:relative;box-shadow:inset 0 2px 4px rgba(255,255,255,.6);}
    #top-progress-fill::after {content:"⭐";position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:18px;filter:drop-shadow(0 2px 1px #a26d00);}
    #question-area {height:13vh;min-height:72px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 3vw;}
    #question-text {width:auto;max-width:min(860px,77vw);font-size:clamp(1.6rem,3.4vmin,2.8rem);line-height:1.16;border:3px solid rgba(255,255,255,.8);border-radius:23px;background:rgba(255,255,255,.84);box-shadow:0 5px 0 rgba(37,132,139,.14);backdrop-filter:blur(4px);padding:10px clamp(14px,2vw,28px);color:#184f64;text-shadow:none;}
    .tts-btn {position:static;flex-shrink:0;width:clamp(48px,5.5vw,64px);height:clamp(48px,5.5vw,64px);border-radius:50%;background:linear-gradient(#4ed5fd,#00a7d3);border:3px solid #fff;box-shadow:0 6px 0 #087daa,0 9px 14px rgba(17,75,97,.18);}
    #picture-area {height:49vh;min-height:220px;padding:0 2vw;}
    #picture-area::after {display:none!important;}
    #main-svg-container {height:100%;max-height:100%;width:min(620px,90vw);}
    .art-image {display:block;object-fit:contain;width:100%;height:100%;max-height:100%;margin:auto;filter:drop-shadow(0 8px 8px rgba(24,82,47,.16));user-select:none;pointer-events:none;}
    #answer-area {height:27vh;padding:1.5vh 2vw 3vh;gap:clamp(8px,1.4vw,22px);align-items:center;}
    .answer-pad {height:clamp(95px,19vh,174px);border-radius:clamp(17px,2vw,28px);border:4px solid rgba(255,255,255,.95);font-weight:900;font-size:clamp(1.15rem,3vmin,2.7rem);padding:12px;text-shadow:0 1px 0 rgba(255,255,255,.5);color:#124b62;box-shadow:0 8px 0 rgba(25,95,99,.23),0 14px 24px rgba(9,78,71,.12);}
    .pad-0 {background:linear-gradient(160deg,#eafdf8,#94eadb);border-color:#fff;box-shadow:0 9px 0 #54bcaa,0 15px 20px rgba(17,102,95,.14);}
    .pad-1 {background:linear-gradient(160deg,#f2fcff,#98dff6);border-color:#fff;box-shadow:0 9px 0 #54b4db,0 15px 20px rgba(17,102,129,.14);}
    .pad-2 {background:linear-gradient(160deg,#fffbe9,#ffe59b);border-color:#fff;box-shadow:0 9px 0 #edb862,0 15px 20px rgba(141,101,35,.15);}
    .pad-3 {background:linear-gradient(160deg,#fff5f2,#ffbdad);border-color:#fff;box-shadow:0 9px 0 #ef958c,0 15px 20px rgba(151,82,72,.14);color:#124b62;}
    .answer-pad .pad-content {position:relative;z-index:2;overflow-wrap:anywhere;}
    .answer-pad::after {background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);}
    .keyboard-hint {color:#206574;background:rgba(255,255,255,.64);border-radius:11px;padding:2px 9px;opacity:.85;font-size:clamp(.8rem,1.5vw,1.1rem);}
    .answer-pad.pad-wrong {background:linear-gradient(#ffb7b7,#f77e88)!important;box-shadow:0 9px 0 #da6070!important;}
    .answer-pad.pad-correct {background:linear-gradient(#a1f8a3,#54df8f)!important;box-shadow:0 9px 0 #20a15b!important;}
    #game-screen.text-only #answer-area {height:25vh;padding:0 min(10vw,150px) 2vh;}
    #game-screen.text-only .answer-pad {height:clamp(72px,13vh,118px);width:max-content;min-width:clamp(150px,11vw,200px);max-width:100%;justify-self:center;padding-inline:20px;}
    .layout-word-to-pic #question-area {height:16vh;}
    .layout-word-to-pic #answer-area {height:65vh;align-items:center;padding:1vh 2vw 6vh;}
    .layout-word-to-pic .answer-pad {height:min(41vh,330px);padding:8px;border-width:4px;}
    .answer-pad.image-option .pad-content {max-height:100%;}
    .answer-pad.image-option .art-image {width:100%;height:100%;max-height:min(39vh,315px);filter:drop-shadow(0 4px 4px rgba(36,85,74,.12));}
    #next-stage {position:absolute;bottom:28vh;left:50%;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;justify-content:center;padding:0 12px;white-space:nowrap;}
    #next-stage.hidden {display:none!important;}
    #feedback-text {font-size:clamp(1rem,2.4vw,1.5rem);font-weight:900;color:#18794c;text-shadow:0 2px 0 #fff;}

    #star-mini-game {position:fixed;inset:0;z-index:60;overflow:hidden;background:transparent;pointer-events:auto;}
    #star-mini-game.hidden {display:none!important;}

    #star-field {position:absolute;inset:0;overflow:hidden;}
    .falling-star {position:absolute;top:-70px;z-index:2;background:none;border:0;line-height:1;cursor:pointer;touch-action:manipulation;filter:drop-shadow(0 5px 3px rgba(107,72,18,.35));animation:starFall linear forwards;padding:0 8px;}

      .top-badge {font-size:clamp(.8rem,2.5vw,1.1rem);min-width:0;padding:6px 8px;}

      .progress-track {height:17px;}
      #question-area {height:14vh;min-height:68px;gap:8px;padding:0 9px;}
      #question-text {font-size:clamp(1.2rem,3.8vw,2rem);max-width:calc(100vw - 85px);padding:9px 12px;}
      .tts-btn {width:45px;height:45px;font-size:22px;}
      #picture-area {height:42vh;min-height:155px;}
      #answer-area {height:31vh;gap:8px;padding:4px 10px 14px;}

      #next-stage {bottom:32vh;gap:8px;}
      #next-btn {padding:9px 20px;}
      .mini-hud {gap:7px;font-size:clamp(.86rem,3vw,1.3rem);}

    @media (max-height:640px) and (orientation:landscape) {

        const CONCEPT_SUBJECT = {ABOVE:'bird', BELOW:'bird', UP:'bird', DOWN:'bird'};
        function targetName(relation) { return CONCEPT_SUBJECT[relation] || 'cat'; }
        function matchedQuestion(relation, prior) {
            const subject = targetName(relation);
            if (relation === 'UP' || relation === 'DOWN' || relation.startsWith('DIR_')) {
                return `Which way is the ${subject} going?`;
            }
            if (prior.startsWith('Which picture')) return prior;
            return `Where is the ${subject}?`;
        }
        function sceneIllustration(relation) {
            const uri = ART[relation];
            if (!uri) return null;
            const label = relation.replace('DIR_', '');
            return `<img class="art-image" src="${uri}" alt="${label} illustration" draggable="false">`;
        }

        // --- SCENE BUILDER ---
        // Shifts assets to create relations perfectly simulating real spatial layouts.
        function buildScene(obj1Name, obj2Name, relation, obj3Name = null) {
            // Illustrations replace the legacy SVG for the same concept; old scene builder remains as fallback.
            const newIllustration = sceneIllustration(relation);
            if (newIllustration) return newIllustration;
            let svgContent = '';
            const o1 = assets[obj1Name] || '';
            const o2 = assets[obj2Name] || '';
            const o3 = obj3Name ? (assets[obj3Name] || '') : '';
            const o2Front = assets[obj2Name + '_front'] || '';
            const place = (svg, dx, dy, scale=1) =>
                `<g transform="translate(${100 + dx}, ${100 + dy}) scale(${scale}) translate(-100,-100)">${svg}</g>`;
            switch (relation) {
                case 'LEFT':
                    svgContent = place(o1, -50, 4, .72) + place(o2, 50, 4, .72);
                    break;
                case 'RIGHT':
                    svgContent = place(o2, -50, 4, .72) + place(o1, 50, 4, .72);
                    break;
                case 'ABOVE':
                    svgContent = place(o2, 0, 51, .62) + place(o1, 0, -51, .62);
                    break;
                case 'BELOW':
                    svgContent = place(o2, 0, -51, .62) + place(o1, 0, 51, .62);
                    break;
                case 'UNDER':
                    svgContent = place(o2, 0, -24, .82) + place(o1, 0, 48, .53);
                    break;
                case 'IN':
                    if (obj2Name === 'box') {
                        svgContent = place(o2, 0, 4, .96) + place(o1, 0, 13, .53) + place(o2Front, 0, 4, .96);
                    } else {
                        svgContent = place(o2, 0, 0, .94) + place(o1, 0, 18, .48) + place(o2Front, 0, 0, .94);
                    }
                    break;
                case 'BETWEEN':
                    svgContent = place(o2, -63, 8, .58) + place(o3 || o2, 63, 8, .58) + place(o1, 0, 7, .62);
                    break;
                case 'NEXT TO':
                    svgContent = place(o1, -37, 5, .72) + place(o2, 37, 5, .72);
                    break;
                case 'IN FRONT OF':
                    if (obj1Name === 'dog' && obj2Name === 'table') {
                        // Make the dog about 20% larger in the "in front of" distractor so it is easier
                        // to distinguish from "under" in the picture-choice question.
                        svgContent = place(o2, 16, -13, .68) + place(o1, -16, 18, 1.10);
                    } else {
                        svgContent = place(o2, 13, -13, .70) + place(o1, -12, 21, .91);
                    }
                    break;
                case 'BEHIND':
                    if (obj2Name === 'tree' && obj1Name === 'bird') {
                        // Bigger tree. Put the bird behind the tree trunk and let the face peek out.
                        svgContent = place(o1, 22, 44, .44) + place(o2, -2, 18, 1.12);
                    } else if (obj2Name === 'tree') {
                        // Larger tree with the hidden object peeking from behind it.
                        svgContent = place(o1, 26, 22, .55) + place(o2, -4, 18, 1.08);
                    } else {
                        svgContent = place(o1, 30, 4, .58) + place(o2, -8, 16, .91);
                    }
                    break;
                case 'UP':
                case 'DOWN':
                case 'DIR_LEFT':
                case 'DIR_RIGHT': {
                    const dirName = relation.replace('DIR_', '').toLowerCase();
                    const arrow = assets['arrow_' + dirName];
                    if (relation === 'UP') svgContent = place(o2, 0, 43, .53) + place(arrow, 0, -43, .43);
                    if (relation === 'DOWN') svgContent = place(o2, 0, -43, .53) + place(arrow, 0, 43, .43);
                    if (relation === 'DIR_LEFT') svgContent = place(o2, 43, 0, .53) + place(arrow, -43, 0, .43);
                    if (relation === 'DIR_RIGHT') svgContent = place(o2, -43, 0, .53) + place(arrow, 43, 0, .43);
                    break;
                }
            }
            return `<svg viewBox="-8 -8 216 216" xmlns="http://www.w3.org/2000/svg" overflow="visible">
                <g transform="translate(100,100) scale(1.10) translate(-100,-100)">${svgContent}</g>
            </svg>`;
        }
        const positionConcepts = ['LEFT', 'RIGHT', 'ABOVE', 'BELOW', 'UNDER', 'IN', 'BETWEEN', 'NEXT TO', 'IN FRONT OF', 'BEHIND'];
        const directionConcepts = ['UP', 'DOWN', 'DIR_LEFT', 'DIR_RIGHT'];
        function displayConcept(concept) {
            return concept.replace('DIR_', '').replace('IN', 'IN');
        }
        function getDistractors(correctConcept, count = 3) {
            let pool;
            if (directionConcepts.includes(correctConcept)) {
                pool = directionConcepts.filter(c => c !== correctConcept);
            } else {
                pool = positionConcepts.filter(c => c !== correctConcept);
                // Avoid semantically overlapping choices.
                if (correctConcept === 'UNDER' || correctConcept === 'BELOW') {
                    pool = pool.filter(c => c !== 'UNDER' && c !== 'BELOW');
                }
                if (correctConcept === 'NEXT TO') {
                    // LEFT/RIGHT can both be true in a next-to picture, so avoid them.
                    pool = pool.filter(c => !['LEFT','RIGHT'].includes(c));
                }
                if (correctConcept === 'LEFT' || correctConcept === 'RIGHT') {
                    pool = pool.filter(c => c !== 'NEXT TO');
                }
            }
            return shuffle([...pool]).slice(0, count);
        }
        const imageContrastMap = {
            'LEFT': ['RIGHT', 'ABOVE', 'IN'],
            'RIGHT': ['LEFT', 'BELOW', 'IN'],
            'ABOVE': ['BELOW', 'NEXT TO', 'LEFT'],
            'BELOW': ['ABOVE', 'RIGHT', 'IN'],
            'UNDER': ['ABOVE', 'NEXT TO', 'IN'],
            'IN': ['ABOVE', 'NEXT TO', 'UNDER'],
            'BETWEEN': ['ABOVE', 'NEXT TO', 'IN'],
            'NEXT TO': ['ABOVE', 'UNDER', 'IN'],
            'IN FRONT OF': ['BEHIND', 'NEXT TO', 'ABOVE'],
            'BEHIND': ['IN FRONT OF', 'NEXT TO', 'ABOVE']
        };
        const questionBank = [];
        function addTextQ(concept, qText, obj1, obj2, obj3=null, level='easy') {
            const correct = displayConcept(concept);
            const distractors = getDistractors(concept, 3).map(displayConcept);
            questionBank.push({
                type: 'text_options',
                level,
                concept,
                question: matchedQuestion(concept, qText),
                image: buildScene(obj1, obj2, concept, obj3),
                correct,
                distractors
            });
        }
        function addImageQ(concept, qText, obj1, obj2, obj3=null, level='image') {
            const contrastConcepts = imageContrastMap[concept] || getDistractors(concept, 3);
            questionBank.push({
                type: 'image_options',
                level,
                concept,
                question: qText,
                correct: buildScene(obj1, obj2, concept, obj3),
                correctLabel: concept,
                distractors: contrastConcepts.slice(0,3).map(dc => buildScene(obj1, obj2, dc, obj3))
            });
        }
        // --- CURATED QUESTION BANK: clear, child-friendly, non-ambiguous ---
        // Easy core positions
        addTextQ('LEFT', 'Where is the ball?', 'ball', 'teddy');
        addTextQ('RIGHT', 'Where is the dog?', 'dog', 'ball');
        addTextQ('LEFT', 'Where is the pencil?', 'pencil', 'book');
        addTextQ('RIGHT', 'Where is the apple?', 'apple', 'backpack');
        addTextQ('LEFT', 'Where is the toy car?', 'car', 'tree');
        addTextQ('RIGHT', 'Where is the mouse?', 'mouse', 'cheese');
        addTextQ('ABOVE', 'Where is the bird?', 'bird', 'cloud');
        addTextQ('BELOW', 'Where is the cloud?', 'cloud', 'bird');
        addTextQ('ABOVE', 'Where is the owl?', 'owl', 'box');
        addTextQ('BELOW', 'Where is the mouse?', 'mouse', 'book');
        addTextQ('ABOVE', 'Where is the apple?', 'apple', 'book');
        addTextQ('BELOW', 'Where is the toy car?', 'car', 'tree');
        addTextQ('UNDER', 'Where is the dog?', 'dog', 'table');
        addTextQ('UNDER', 'Where is the ball?', 'ball', 'table');
        addTextQ('UNDER', 'Where is the cat?', 'cat', 'table');
        addTextQ('UNDER', 'Where is the backpack?', 'backpack', 'table');
        addTextQ('IN', 'Where is the fish?', 'fish', 'bowl');
        addTextQ('IN', 'Where is the ball?', 'ball', 'box');
        addTextQ('IN', 'Where is the mouse?', 'mouse', 'box');
        addTextQ('IN', 'Where is the teddy bear?', 'teddy', 'box');
        // Advanced spatial language
        addTextQ('BETWEEN', 'Where is the cheese?', 'cheese', 'mouse', 'mouse', 'advanced');
        addTextQ('BETWEEN', 'Where is the ball?', 'ball', 'teddy', 'teddy', 'advanced');
        addTextQ('BETWEEN', 'Where is the apple?', 'apple', 'book', 'book', 'advanced');
        addTextQ('BETWEEN', 'Where is the owl?', 'owl', 'tree', 'tree', 'advanced');
        addTextQ('NEXT TO', 'Where is the cat?', 'cat', 'tree', null, 'advanced');
        addTextQ('NEXT TO', 'Where is the bird?', 'bird', 'kennel', null, 'advanced');
        addTextQ('NEXT TO', 'Where is the pencil?', 'pencil', 'book', null, 'advanced');
        addTextQ('NEXT TO', 'Where is the toy car?', 'car', 'backpack', null, 'advanced');
        addTextQ('IN FRONT OF', 'Where is the owl?', 'owl', 'tree', null, 'advanced');
        addTextQ('IN FRONT OF', 'Where is the teddy bear?', 'teddy', 'box', null, 'advanced');
        addTextQ('IN FRONT OF', 'Where is the dog?', 'dog', 'table', null, 'advanced');
        addTextQ('IN FRONT OF', 'Where is the apple?', 'apple', 'backpack', null, 'advanced');
        addTextQ('BEHIND', 'Where is the cat?', 'cat', 'box', null, 'advanced');
        addTextQ('BEHIND', 'Where is the ball?', 'ball', 'box', null, 'advanced');
        addTextQ('BEHIND', 'Where is the mouse?', 'mouse', 'book', null, 'advanced');
        addTextQ('BEHIND', 'Where is the backpack?', 'backpack', 'tree', null, 'advanced');
        // Direction questions — answer set is always UP / DOWN / LEFT / RIGHT
        addTextQ('UP',        'Which way is the bird going?', 'bird', 'bird', null, 'direction');
        addTextQ('DOWN',      'Which way is the ball going?', 'ball', 'ball', null, 'direction');
        addTextQ('DIR_LEFT',  'Which way is the mouse going?', 'mouse', 'mouse', null, 'direction');
        addTextQ('DIR_RIGHT', 'Which way is the dog going?', 'dog', 'dog', null, 'direction');
        addTextQ('UP',        'Which way is the owl going?', 'owl', 'owl', null, 'direction');
        addTextQ('DIR_RIGHT', 'Which way is the toy car going?', 'car', 'car', null, 'direction');
        // Word -> picture questions. Contrast sets are intentionally non-overlapping.
        addImageQ('ABOVE',       'Which picture shows ABOVE?', 'bird', 'kennel');
        addImageQ('BELOW',       'Which picture shows BELOW?', 'apple', 'book');
        addImageQ('UNDER',       'Which picture shows UNDER?', 'dog', 'table');
        addImageQ('BETWEEN',     'Which picture shows BETWEEN?', 'ball', 'teddy', 'teddy');
        addImageQ('IN',      'Which picture shows IN?', 'fish', 'bowl');
        addImageQ('LEFT',        'Which picture shows LEFT?', 'owl', 'tree');
        addImageQ('RIGHT',       'Which picture shows RIGHT?', 'cat', 'box');
        addImageQ('IN FRONT OF', 'Which picture shows IN FRONT OF?', 'teddy', 'box');
        addImageQ('BEHIND',      'Which picture shows BEHIND?', 'mouse', 'book');
        addImageQ('NEXT TO',     'Which picture shows NEXT TO?', 'dog', 'ball');
        let currentSession = [];
        let currentQIndex = 0;
        let score = 0;
        let hasGuessedWrongCurrent = false;
        let isTransitioning = false;
        let correctPadIndex = -1;
        let currentQuestion = null;
        let bonusStars = 0;
        let miniActive = false;
        let miniInterval = null, miniSpawnInterval = null;
        // Audio Setup (Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        function playDing() {
            playTone(800, 'sine', 0.1, 0.2);
            setTimeout(() => playTone(1200, 'sine', 0.2, 0.2), 100);
        }
        function playBuzz() {
            playTone(150, 'sawtooth', 0.3, 0.1);
        }
        // TTS setup
        function readQuestion() {
            if (!window.speechSynthesis || !currentQuestion || miniActive) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentQuestion.question);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.04;
            window.speechSynthesis.speak(utterance);
        }
        // Shuffle array helper
        function shuffle(array) {
            let currentIndex = array.length,  randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }
        function sample(arr, n) {
            return shuffle([...arr]).slice(0, Math.min(n, arr.length));
        }
        function pickFromConcepts(bank, concepts, n = 1) {
            const chosen = [];
            const usedConcepts = new Set();
            const shuffledBank = shuffle([...bank]);
            for (const q of shuffledBank) {
                if (!concepts.includes(q.concept)) continue;
                if (usedConcepts.has(q.concept)) continue;
                chosen.push(q);
                usedConcepts.add(q.concept);
                if (chosen.length >= n) break;
            }
            if (chosen.length < n) {
                for (const q of shuffledBank) {
                    if (!concepts.includes(q.concept)) continue;
                    if (chosen.includes(q)) continue;
                    chosen.push(q);
                    if (chosen.length >= n) break;
                }
            }
            return chosen.slice(0, n);
        }
        function arrangeNoAdjacentSameConcept(questions) {
            const remaining = shuffle([...questions]);
            const arranged = [];
            while (remaining.length) {
                const lastConcept = arranged.length ? arranged[arranged.length - 1].concept : null;
                let idx = remaining.findIndex(q => q.concept !== lastConcept);
                if (idx === -1) idx = 0;
                arranged.push(remaining.splice(idx, 1)[0]);
            }
            return arranged;
        }
        function buildSession() {
            const easyText = questionBank.filter(q => q.type === 'text_options' && q.level === 'easy');
            const advancedText = questionBank.filter(q => q.type === 'text_options' && q.level === 'advanced');
            const directionText = questionBank.filter(q => q.type === 'text_options' && q.level === 'direction');
            const imageQs = questionBank.filter(q => q.type === 'image_options');
            const session = [
                ...pickFromConcepts(easyText, ['LEFT', 'RIGHT'], 2),
                ...pickFromConcepts(easyText, ['ABOVE', 'BELOW'], 2),
                ...pickFromConcepts(easyText, ['UNDER'], 1),
                ...pickFromConcepts(easyText, ['IN'], 1),
                ...pickFromConcepts(advancedText, ['BETWEEN'], 1),
                ...pickFromConcepts(advancedText, ['NEXT TO'], 1),
                ...pickFromConcepts(advancedText, ['IN FRONT OF'], 1),
                ...pickFromConcepts(advancedText, ['BEHIND'], 1),
                ...pickFromConcepts(directionText, ['UP', 'DOWN', 'DIR_LEFT', 'DIR_RIGHT'], 2),
                ...pickFromConcepts(imageQs, ['ABOVE', 'BELOW', 'UNDER', 'BETWEEN', 'IN', 'LEFT', 'RIGHT', 'IN FRONT OF', 'BEHIND', 'NEXT TO'], 3)
            ];
            return arrangeNoAdjacentSameConcept(session);
        }
        function startGame() {
            if(audioCtx.state === 'suspended') audioCtx.resume();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            // Build a balanced 15-question round with gentle difficulty progression.
            currentSession = buildSession();
            currentQIndex = 0;
            score = 0;
            bonusStars = 0;
            miniActive = false;
            closeMini();
            updateTopBar();
            document.getElementById('top-progress-fill').style.width = '0%';
            loadQuestion();
        }
        function loadQuestion() {
            isTransitioning = false;
            hasGuessedWrongCurrent = false;
            document.getElementById('next-stage').classList.add('hidden');
            currentQuestion = currentSession[currentQIndex];
            // Reset UI Pads
            const gameScreen = document.getElementById('game-screen');
            const mainSvgContainer = document.getElementById('main-svg-container');
            const pads = document.querySelectorAll('.answer-pad');

            pads.forEach(pad => {
                pad.className = `answer-pad pad-${pad.id.split('-')[1]}`; // reset classes
                pad.classList.remove('image-option');
            });
            gameScreen.classList.toggle('text-only', currentQuestion.type === 'text_options');
            document.getElementById('question-text').innerText = currentQuestion.question;
            document.getElementById('q-counter').innerText = currentQIndex + 1;
            document.getElementById('top-progress-fill').style.width = `${((currentQIndex + 1) / currentSession.length) * 100}%`;
            // Prepare options (0 is correct, 1-3 are distractors)
            let options = [currentQuestion.correct, ...currentQuestion.distractors];
            if (currentQuestion.type === 'text_options') {
                options = [...new Set(options)];
                const fallback = ['LEFT','RIGHT','ABOVE','BELOW','UNDER','IN','BETWEEN','NEXT TO','IN FRONT OF','BEHIND','UP','DOWN'];
                for (const item of fallback) {
                    if (options.length >= 4) break;
                    if (!options.includes(item)) options.push(item);
                }
                options = options.slice(0,4);
            }

            // Randomize position on pads
            const optionIndices = shuffle([0, 1, 2, 3]);

            if (currentQuestion.type === 'text_options') {
                gameScreen.classList.remove('layout-word-to-pic');
                mainSvgContainer.innerHTML = currentQuestion.image;

                optionIndices.forEach((optIndex, padIndex) => {
                    const pad = document.getElementById(`pad-${padIndex}`);
                    pad.querySelector('.pad-content').innerHTML = options[optIndex];
                    if (optIndex === 0) correctPadIndex = padIndex;
                });
            } else {
                gameScreen.classList.add('layout-word-to-pic');
                mainSvgContainer.innerHTML = '';

                optionIndices.forEach((optIndex, padIndex) => {
                    const pad = document.getElementById(`pad-${padIndex}`);
                    pad.classList.add('image-option');
                    pad.querySelector('.pad-content').innerHTML = options[optIndex];
                    if (optIndex === 0) correctPadIndex = padIndex;
                });
            }
            // Auto-read question gently
            const spokenIndex = currentQIndex;
            setTimeout(() => { if (currentQIndex === spokenIndex && !miniActive && !isTransitioning) readQuestion(); }, 380);
        }
        function handleSlap(padIndex) {
            if (isTransitioning) return;

            const pad = document.getElementById(`pad-${padIndex}`);

            if (padIndex === correctPadIndex) {
                // Correct!
                isTransitioning = true;
                pad.classList.add('pad-correct');
                playDing();
                createStars(pad);

                if (!hasGuessedWrongCurrent) {
                    score++;
                    updateTopBar();
                }
                const feedback = document.getElementById('feedback-text');
                feedback.textContent = ["Great job! ⭐", "You got it! 🌟", "Awesome! ✨"][Math.floor(Math.random()*3)];
                document.getElementById('next-stage').classList.remove('hidden');
            } else {
                // Wrong!
                if(pad.classList.contains('pad-wrong')) return;

                hasGuessedWrongCurrent = true;
                pad.classList.add('pad-wrong');
                playBuzz();

                const qText = document.getElementById('question-text');
                const origText = qText.innerText;
                qText.innerText = "Try again!";
                qText.style.color = "#e63946";

                setTimeout(() => {
                    if(!isTransitioning) {
                        qText.innerText = currentQuestion.question;
                        qText.style.color = "#14213d";
                    }
                }, 1000);
            }
        }
        function updateTopBar() {
            document.getElementById('score-counter').innerText = score + bonusStars;
        }
        function createStars(element) {
            const rect = element.getBoundingClientRect();
            for(let i=0; i<6; i++) {
                const star = document.createElement('div');
                star.innerHTML = '⭐';
                star.className = 'star-particle';

                const x = rect.left + Math.random() * rect.width;
                const y = rect.top + Math.random() * rect.height;

                star.style.left = `${x}px`;
                star.style.top = `${y}px`;

                const tx = (Math.random() - 0.5) * 200 + 'px';
                const ty = (Math.random() - 1) * 200 + 'px';
                star.style.setProperty('--tx', tx);
                star.style.setProperty('--ty', ty);

                document.body.appendChild(star);

                setTimeout(() => star.remove(), 1000);
            }
        }
        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');

            closeMini();
            document.getElementById('final-score').innerText = score + bonusStars;
            const accuracy = Math.round((score / currentSession.length) * 100);
            document.getElementById('accuracy-text').innerText = `Correct: ${score}/${currentSession.length}  ·  Accuracy: ${accuracy}%  ·  Bonus: ⭐ ${bonusStars}`;

            // Confetti effect
            for(let i=0; i<40; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = '12px';
                conf.style.height = '12px';
                conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                conf.style.backgroundColor = ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#577590', '#9b5de5'][Math.floor(Math.random()*8)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.zIndex = '20';
                conf.style.animation = `floatStar ${1.5 + Math.random()*2}s linear forwards`;
                conf.style.setProperty('--tx', (Math.random()-0.5)*150 + 'px');
                conf.style.setProperty('--ty', '100vh');
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3500);
            }

            playTone(400, 'sine', 0.1);
            setTimeout(() => playTone(500, 'sine', 0.1), 100);
            setTimeout(() => playTone(600, 'sine', 0.3), 200);
            setTimeout(() => playTone(800, 'sine', 0.4), 300);
        }
        function goHome() {
            closeMini();
            window.speechSynthesis?.cancel();
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        // --- ver2: explicit Next and 15-second falling-star challenge every two completed questions ---
        function goToNext() {
            if (!isTransitioning || miniActive) return;
            document.getElementById('next-stage').classList.add('hidden');
            window.speechSynthesis?.cancel();
            currentQIndex++;
            if (currentQIndex >= currentSession.length) { endGame(); return; }
            if (currentQIndex % 2 === 0) { startMiniGame(); }
            else { loadQuestion(); }
        }
        function closeMini() {
            if (miniInterval) clearInterval(miniInterval);
            if (miniSpawnInterval) clearInterval(miniSpawnInterval);
            miniInterval = miniSpawnInterval = null;
            miniActive = false;
            document.getElementById('star-mini-game').classList.add('hidden');
            document.body.classList.remove('mini-active');
            document.getElementById('star-field').replaceChildren();
        }
        function createFallingStar() {
            if (!miniActive) return;
            const field = document.getElementById('star-field');
            const star = document.createElement('button');
            star.type = 'button'; star.className = 'falling-star';
            star.textContent = Math.random() > .45 ? '⭐' : '🌟';
            star.setAttribute('aria-label','Catch star');
            star.style.left = (7 + Math.random() * 85) + '%';
            star.style.fontSize = (33 + Math.random() * 25) + 'px';
            const duration = 2.65 + Math.random() * 1.55;
            star.style.animationDuration = duration + 's';
            const collect = (e) => {
                e.preventDefault(); e.stopPropagation();
                if (!miniActive || star.dataset.hit) return;
                star.dataset.hit = '1';
                bonusStars++;
                document.getElementById('mini-score').textContent = bonusStars;
                updateTopBar();
                playTone(780 + Math.random()*280, 'sine', .11, .06);
                star.classList.add('star-hit');
                setTimeout(() => star.remove(), 260);
            };
            star.addEventListener('pointerdown', collect, {passive:false});
            star.addEventListener('animationend', () => star.remove());
            field.appendChild(star);
        }
        function startMiniGame() {
            closeMini();
            miniActive = true;
            window.speechSynthesis?.cancel();
            document.body.classList.add('mini-active');
            document.getElementById('mini-score').textContent = bonusStars;
            document.getElementById('mini-timer').textContent = '15';
            document.getElementById('star-mini-game').classList.remove('hidden');
            createFallingStar(); createFallingStar(); createFallingStar();
            miniSpawnInterval = setInterval(createFallingStar, 370);
            const endAt = performance.now() + 15000;
            miniInterval = setInterval(() => {
                if (!miniActive) return;
                const left = Math.max(0, endAt - performance.now());
                document.getElementById('mini-timer').textContent = String(Math.ceil(left/1000));
                if (left <= 0) { closeMini(); loadQuestion(); }
            }, 90);
        }

        // Keyboard shortcuts for Teacher / Facilitator
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('game-screen').classList.contains('hidden') || miniActive) return;
            if ((e.key === 'Enter' || e.code === 'Space') && isTransitioning) { e.preventDefault(); goToNext(); return; }

            if (e.key === '1') handleSlap(0); // Top Left
            if (e.key === '2') handleSlap(1); // Top Right
            if (e.key === '3') handleSlap(2); // Bottom Left
            if (e.key === '4') handleSlap(3); // Bottom Right
        });
    </script>

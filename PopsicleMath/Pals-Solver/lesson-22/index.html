<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clock Match Challenge - V9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --success: #58CC02;
            --success-dark: #4BA802;
            --error: #FF4B4B;
            --error-dark: #EA2B2B;
            --text-main: #4B4B4B;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
            color: var(--text-main);
            background-color: #87CEEB;
        }

        /* --- Wrapping Paper Nature Background --- */
        #game-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            background-color: #60BEEB;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 2px, transparent 3px),
                radial-gradient(circle at 70% 60%, rgba(255,255,255,0.15) 3px, transparent 4px),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.1) 2px, transparent 3px),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 4px, transparent 5px);
            background-size: 100px 100px;
        }

        /* Time Motifs */
        .bg-motif {
            position: absolute;
            opacity: 0.15;
            color: white;
            font-size: 40px;
        }
        .m-1 { top: 10%; left: 15%; transform: rotate(15deg); }
        .m-2 { top: 25%; right: 20%; font-size: 50px; transform: rotate(-20deg); }
        .m-3 { top: 60%; left: 10%; font-size: 30px; }
        .m-4 { top: 50%; right: 15%; transform: rotate(45deg); }

        /* Clouds & Rainbow */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.9;
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: white; border-radius: 50%;
        }
        .cloud-1 { top: 12%; left: 8%; width: 140px; height: 50px; }
        .cloud-1::before { width: 70px; height: 70px; top: -35px; left: 20px; }
        .cloud-1::after { width: 50px; height: 50px; top: -25px; right: 20px; }
        
        .cloud-2 { top: 18%; right: 10%; width: 180px; height: 60px; transform: scale(0.8); }
        .cloud-2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .cloud-2::after { width: 60px; height: 60px; top: -30px; right: 30px; }

        .rainbow-container {
            position: absolute; top: 15%; left: 5%; width: 300px; height: 150px; overflow: hidden; opacity: 0.8;
        }
        .rainbow {
            width: 300px; height: 300px; border-radius: 50%;
            box-shadow: inset 0 0 0 15px #FF4B4B, inset 0 0 0 30px #FF9600, inset 0 0 0 45px #FFC800, inset 0 0 0 60px #58CC02, inset 0 0 0 75px #1CB0F6, inset 0 0 0 90px #CE82FF;
        }

        /* Grass/Hills */
        .hill-bg {
            position: absolute; bottom: 0; width: 150%; height: 35vh; background: #58CC02;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0; left: -25%; transform: translateY(8vh);
        }
        .hill-fg {
            position: absolute; bottom: 0; width: 120%; height: 25vh; background: #6EE514;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0; left: -10%;
        }

        .screen {
            display: none; flex-direction: column; width: 100vw; height: 100vh;
            padding: 1rem; box-sizing: border-box; position: relative; z-index: 10;
            overflow-y: auto;
        }
        .screen.active { display: flex; }
        
        .game-container {
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            width: 100%; min-height: min-content; margin: 0 auto;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2.5rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 6px solid white;
            width: 100%;
        }

        .btn-3d {
            transition: all 0.1s ease; user-select: none; border-radius: 1.5rem; cursor: pointer;
        }
        .btn-3d:active { transform: translateY(6px) !important; box-shadow: 0 0px 0 transparent !important; }

        .option-card {
            border-radius: 1.5rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex; align-items: center; justify-content: center;
            user-select: none;
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .option-card:hover { transform: translateY(-4px); filter: brightness(1.05); }
        .option-card:active { transform: translateY(6px); box-shadow: 0 0px 0 transparent !important; }

        /* Harmonious Colors (No Red/Green for base options) */
        .theme-blue { background: #E1F5FE; border: 6px solid #29B6F6; box-shadow: 0 10px 0 #0288D1; color: #0277BD; }
        .theme-orange { background: #FFF3E0; border: 6px solid #FF9800; box-shadow: 0 10px 0 #F57C00; color: #E65100; }
        .theme-purple { background: #F3E5F5; border: 6px solid #AB47BC; box-shadow: 0 10px 0 #7B1FA2; color: #6A1B9A; }
        .theme-pink { background: #FCE4EC; border: 6px solid #EC407A; box-shadow: 0 10px 0 #C2185B; color: #AD1457; }
        .theme-teal { background: #E0F2F1; border: 6px solid #26A69A; box-shadow: 0 10px 0 #00796B; color: #004D40; }

        .option-card.correct {
            background-color: #F1FDF0 !important; border-color: var(--success) !important;
            box-shadow: 0 10px 0 var(--success-dark) !important; color: var(--success-dark) !important;
            transform: translateY(0); pointer-events: none;
        }
        .option-card.wrong {
            background-color: #FFF0F0 !important; border-color: var(--error) !important;
            box-shadow: 0 10px 0 var(--error-dark) !important; color: var(--error-dark) !important;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .clock-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .clock-wrapper svg { filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.15)); }
        
        .digital-display {
            background: #FFFFFF; 
            color: #FF4B4B; 
            font-family: 'Poppins', sans-serif; 
            font-weight: 900;
            border: 10px solid #1CB0F6; 
            border-radius: 2.5rem; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 15px rgba(0,0,0,0.05);
            padding: 1.2rem 3rem; 
            display: inline-flex; 
            justify-content: center;
            align-items: center;
            position: relative;
            letter-spacing: 0.05em;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
        .pop-in { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .header-bar {
            display: flex; justify-content: space-between; align-items: flex-start; width: 100%; max-width: 1400px;
            margin: 0 auto 1rem auto; z-index: 20; position: relative; gap: 1rem;
        }

        .speaker-btn {
            background: #1CB0F6; color: white; border-radius: 50%; width: 55px; height: 55px;
            display: inline-flex; justify-content: center; align-items: center; font-size: 28px;
            box-shadow: 0 6px 0 #1899D6; cursor: pointer; transition: all 0.1s; margin-left: 15px;
        }
        .speaker-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #1899D6; }
        
        #feedback-overlay {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: white; padding: 2rem 4rem; border-radius: 3rem; font-size: 3.5rem; font-weight: 900;
            z-index: 1000; box-shadow: 0 20px 50px rgba(0,0,0,0.4); opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        #feedback-overlay.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <div id="game-background">
        <div class="bg-motif m-1">⭐</div>
        <div class="bg-motif m-2">🕒</div>
        <div class="bg-motif m-3">⌛</div>
        <div class="bg-motif m-4">⭐</div>
        
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="rainbow-container"><div class="rainbow"></div></div>
        <div class="hill-bg"></div>
        <div class="hill-fg"></div>
    </div>

    <canvas id="confetti-canvas"></canvas>
    <div id="feedback-overlay"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <div class="game-container">
            <div class="pop-in glass-panel max-w-2xl text-center mx-4 mt-8">
                <h1 class="text-5xl md:text-7xl font-black mb-4 drop-shadow-md leading-tight">
                    <span style="color:#1CB0F6;">C</span><span style="color:#FF9600;">L</span><span style="color:#CE82FF;">O</span><span style="color:#58CC02;">C</span><span style="color:#FF4B4B;">K</span>
                    <span style="color:#FFC800;">M</span><span style="color:#1CB0F6;">A</span><span style="color:#CE82FF;">T</span><span style="color:#58CC02;">C</span><span style="color:#FF9600;">H</span><br>
                    <span class="text-pink-500 text-4xl md:text-5xl mt-2 block">CHALLENGE!</span>
                </h1>
                
                <div class="flex justify-center mb-10 mt-6">
                    <div id="start-clock-container" class="w-72 h-72 md:w-[22rem] md:h-[22rem]"></div>
                </div>

                <button id="btn-start" class="btn-3d text-white text-4xl font-black py-5 px-14 w-full md:w-auto uppercase tracking-wider mx-auto block" style="background-color: var(--success); box-shadow: 0 8px 0 var(--success-dark);">
                    Play Now!
                </button>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen">
        <div class="header-bar px-2 md:px-6 mt-2 md:mt-4 w-full flex">
            
            <!-- Left Group: Progress Bar + Q Num + Score -->
            <div class="flex flex-wrap items-center gap-2 md:gap-4 w-full lg:w-auto">
                <div class="w-44 md:w-64 bg-white/90 rounded-full p-1.5 md:p-2 shadow-sm border-4 border-gray-100 flex items-center">
                    <div class="w-full bg-gray-200 rounded-full h-4 md:h-6 overflow-hidden relative">
                        <div id="progress-bar" class="bg-green-500 h-full rounded-full transition-all duration-500 ease-out w-0">
                            <div class="absolute top-0 left-0 w-full h-full bg-white/30 transform -skew-x-12 translate-x-[-100%] animate-[shimmer_2s_infinite]"></div>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white px-3 md:px-5 py-1.5 md:py-2 rounded-2xl shadow-sm border-4 border-gray-100 flex items-center font-black text-lg md:text-2xl text-gray-500">
                    <span id="ui-question-num">1</span>/10
                </div>
                
                <div class="bg-white px-3 md:px-5 py-1.5 md:py-2 rounded-2xl shadow-sm border-4 border-yellow-300 flex items-center">
                    <span class="text-xl md:text-3xl mr-1 md:mr-2">⭐</span>
                    <span class="text-lg md:text-2xl font-black text-yellow-500" id="ui-score">0</span>
                </div>
            </div>

            <!-- Right Group: Empty Space for Custom Logo -->
            <div class="hidden md:flex flex-grow justify-end items-center min-h-[50px]">
                <!-- [LOGO GOES HERE] You can add an <img> tag here for your custom logo -->
            </div>
            
        </div>

        <div class="game-container justify-start pt-2 md:pt-4">
            <div class="glass-panel w-full max-w-5xl xl:max-w-7xl flex flex-col items-center py-6 px-4 md:px-10 relative">
                
                <div class="flex items-center justify-center mb-6 w-full">
                    <h2 id="instruction-text" class="text-3xl md:text-5xl font-black text-purple-600 text-center drop-shadow-sm">
                        What time is it?
                    </h2>
                    <button id="btn-speak-q" class="speaker-btn" aria-label="Read question">🔊</button>
                </div>

                <div id="question-display" class="mb-8 flex justify-center items-center w-full min-h-[250px] md:min-h-[350px]">
                    <!-- Main Clock/Time Injected via JS -->
                </div>

                <!-- Horizontal row on laptops (lg:grid-cols-4), 2x2 grid on mobile/tablet -->
                <div id="options-container" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 w-full px-2">
                    <!-- Cards Injected via JS -->
                </div>
                
            </div>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen">
        <div class="game-container">
            <div class="pop-in glass-panel text-center max-w-2xl mx-4 relative mt-10">
                <h1 class="text-6xl md:text-7xl font-black text-pink-500 mb-6 drop-shadow-md">
                    GREAT JOB! 🎉
                </h1>
                <p class="text-3xl text-gray-700 font-bold mb-8">
                    You finished the Clock Challenge!
                </p>
                
                <div class="bg-yellow-50 rounded-[3rem] p-8 mb-10 border-8 border-yellow-400 inline-block shadow-inner">
                    <p class="text-6xl font-black text-yellow-500 flex items-center justify-center gap-4">
                        <span>⭐</span> 10 / 10 <span>⭐</span>
                    </p>
                    <p class="text-2xl font-bold text-yellow-600 mt-4 uppercase tracking-widest">Questions Completed</p>
                </div>

                <div class="flex flex-col md:flex-row gap-6 justify-center">
                    <button id="btn-play-again" class="btn-3d text-white text-3xl font-black py-5 px-10 uppercase flex items-center justify-center gap-3" style="background-color: #1CB0F6; box-shadow: 0 8px 0 #1899D6;">
                        <span class="text-4xl">🔄</span> PLAY AGAIN
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_QUESTIONS = 10;
        let currentQuestionIndex = 0;
        let score = 0;
        let questions = [];
        let isAnimating = false;
        
        const screens = {
            start: document.getElementById('start-screen'),
            game: document.getElementById('game-screen'),
            end: document.getElementById('end-screen')
        };
        const elements = {
            questionNum: document.getElementById('ui-question-num'),
            score: document.getElementById('ui-score'),
            progressBar: document.getElementById('progress-bar'),
            instructionText: document.getElementById('instruction-text'),
            questionDisplay: document.getElementById('question-display'),
            optionsContainer: document.getElementById('options-container'),
            feedbackOverlay: document.getElementById('feedback-overlay'),
            startClockContainer: document.getElementById('start-clock-container'),
            btnSpeakQ: document.getElementById('btn-speak-q')
        };

        const synth = window.speechSynthesis;
        let audioCtx;

        function playTTS(text) {
            if (!synth) return;
            if (synth.speaking) synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            utterance.pitch = 1.2; 
            synth.speak(utterance);
        }

        elements.btnSpeakQ.addEventListener('click', () => {
            if (elements.instructionText.textContent) playTTS(elements.instructionText.textContent);
        });

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (synth) {
                let u = new SpeechSynthesisUtterance(''); u.volume = 0; synth.speak(u);
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
                gain.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'complete') {
                osc.type = 'sine';
                [440, 554, 659, 880].forEach((freq, i) => {
                    osc.frequency.setValueAtTime(freq, now + (i*0.15));
                });
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.4, now + 0.1);
                gain.gain.linearRampToValueAtTime(0, now + 1.5);
                osc.start(now); osc.stop(now + 1.5);
            }
        }

        function createSVGClock(timeStr, isLarge = false) {
            const [hStr, mStr] = timeStr.split(':');
            let h = parseInt(hStr); let m = parseInt(mStr);

            const minAngle = m * 6;
            const hourAngle = ((h % 12) * 30) + (m * 0.5);

            const size = 420; const center = size / 2; const radius = 175;
            
            let svg = `<svg viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%; display:block;">`;
            
            // Drop shadow for the entire clock body
            svg += `<circle cx="${center}" cy="${center+12}" r="${radius}" fill="rgba(0,0,0,0.15)" />`;

            if (isLarge) {
                // Left Bell Shadow
                svg += `<g transform="translate(${center - radius*0.65}, ${center - radius*0.8 + 10}) rotate(-25)">
                            <path d="M -60 0 A 60 60 0 0 1 60 0 Z" fill="rgba(0,0,0,0.15)"/>
                        </g>`;
                // Right Bell Shadow
                svg += `<g transform="translate(${center + radius*0.65}, ${center - radius*0.8 + 10}) rotate(25)">
                            <path d="M -60 0 A 60 60 0 0 1 60 0 Z" fill="rgba(0,0,0,0.15)"/>
                        </g>`;
                
                // Left Foot Shadow (Shrunk further, splayed out)
                svg += `<g transform="translate(${center - radius*0.62}, ${center + radius*0.86 + 8}) scale(0.76) rotate(-10)">
                            <path d="M -25 -20 L 25 -20 L 35 40 L -35 40 Z" fill="rgba(0,0,0,0.15)"/>
                        </g>`;
                // Right Foot Shadow (Shrunk further, splayed out)
                svg += `<g transform="translate(${center + radius*0.62}, ${center + radius*0.86 + 8}) scale(0.76) rotate(10)">
                            <path d="M -25 -20 L 25 -20 L 35 40 L -35 40 Z" fill="rgba(0,0,0,0.15)"/>
                        </g>`;

                // Left Bell
                svg += `<g transform="translate(${center - radius*0.65}, ${center - radius*0.8}) rotate(-25)">
                            <!-- Knob -->
                            <rect x="-8" y="-15" width="16" height="20" fill="#FF9600" />
                            <!-- Bell body -->
                            <path d="M -60 0 A 60 60 0 0 1 60 0 Z" fill="#42B3F5" stroke="#1F85C7" stroke-width="6"/>
                            <!-- Stripes -->
                            <path d="M -50 -33 Q 0 -50 50 -33 L 45 -20 Q 0 -35 -45 -20 Z" fill="#58CC02"/>
                            <path d="M -40 -45 Q 0 -60 40 -45 L 35 -35 Q 0 -45 -35 -35 Z" fill="#CE82FF"/>
                            <!-- Top tiny ball -->
                            <circle cx="0" cy="-60" r="10" fill="#42B3F5" stroke="#1F85C7" stroke-width="4"/>
                        </g>`;
                        
                // Right Bell
                svg += `<g transform="translate(${center + radius*0.65}, ${center - radius*0.8}) rotate(25)">
                            <rect x="-8" y="-15" width="16" height="20" fill="#FF9600" />
                            <path d="M -60 0 A 60 60 0 0 1 60 0 Z" fill="#42B3F5" stroke="#1F85C7" stroke-width="6"/>
                            <path d="M -50 -33 Q 0 -50 50 -33 L 45 -20 Q 0 -35 -45 -20 Z" fill="#58CC02"/>
                            <path d="M -40 -45 Q 0 -60 40 -45 L 35 -35 Q 0 -45 -35 -35 Z" fill="#CE82FF"/>
                            <circle cx="0" cy="-60" r="10" fill="#42B3F5" stroke="#1F85C7" stroke-width="4"/>
                        </g>`;
                
                // Feet (Shrunk further, splayed out, kept attached)
                // Left Foot
                svg += `<g transform="translate(${center - radius*0.62}, ${center + radius*0.86 - 2}) scale(0.76) rotate(-10)">
                            <path d="M -20 -20 L 20 -20 L 30 35 A 10 10 0 0 1 -30 35 Z" fill="#42B3F5" stroke="#1F85C7" stroke-width="6" stroke-linejoin="round"/>
                            <circle cx="0" cy="20" r="8" fill="#58CC02"/>
                        </g>`;
                // Right Foot
                svg += `<g transform="translate(${center + radius*0.62}, ${center + radius*0.86 - 2}) scale(0.76) rotate(10)">
                            <path d="M -20 -20 L 20 -20 L 30 35 A 10 10 0 0 1 -30 35 Z" fill="#42B3F5" stroke="#1F85C7" stroke-width="6" stroke-linejoin="round"/>
                            <circle cx="0" cy="20" r="8" fill="#FF4B4B"/>
                        </g>`;
            }

            // Main Rim
            svg += `<circle cx="${center}" cy="${center}" r="${radius}" fill="#42B3F5" stroke="#1F85C7" stroke-width="12" />`;
            // Inner rim light blue
            svg += `<circle cx="${center}" cy="${center}" r="${radius - 12}" fill="#8AD2F9" />`;
            // White Face
            svg += `<circle cx="${center}" cy="${center}" r="${radius - 22}" fill="#FFFFFF" />`;
            
            // Colors perfectly matched to the image
            const colors = [
                '#00BCD4', // 12 Cyan
                '#FF3D00', // 1 Red
                '#FF9100', // 2 Orange
                '#FFC400', // 3 Yellow
                '#7CB342', // 4 Green
                '#1E88E5', // 5 Blue
                '#8E24AA', // 6 Purple
                '#EC407A', // 7 Pink
                '#009688', // 8 Teal
                '#283593', // 9 Dark Blue
                '#4DB6AC', // 10 Mint
                '#D81B60'  // 11 Magenta
            ];
            
            // Minute Ticks (colored dots)
            for(let i=0; i<60; i++) {
                if(i % 5 !== 0) {
                    const angle = (i * 6 - 90) * (Math.PI / 180);
                    const dotX = center + (radius - 35) * Math.cos(angle);
                    const dotY = center + (radius - 35) * Math.sin(angle);
                    let closestHour = Math.round(i / 5);
                    if (closestHour === 0) closestHour = 12;
                    const dotColor = colors[closestHour % 12]; 
                    svg += `<circle cx="${dotX}" cy="${dotY}" r="3" fill="${dotColor}" opacity="0.7"/>`;
                }
            }

            // Colorful Numbers (Shrunk by ~10%)
            const fontSize = 42;
            for (let i = 1; i <= 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const x = center + (radius - 65) * Math.cos(angle);
                const y = center + (radius - 65) * Math.sin(angle) + (fontSize * 0.12);
                const color = colors[i % 12];
                svg += `<text x="${x}" y="${y}" fill="${color}" font-size="${fontSize}" font-weight="900" font-family="Poppins, sans-serif" text-anchor="middle" dominant-baseline="central">${i}</text>`;
            }

            // Hour Hand (Orange)
            const hrLen = 55; const hrW = 12; const hrColor = '#FF9100'; const hrStroke = '#E65100';
            svg += `<g transform="rotate(${hourAngle}, ${center}, ${center})">
                        <line x1="${center}" y1="${center + 15}" x2="${center}" y2="${center - hrLen}" stroke="${hrStroke}" stroke-width="${hrW+4}" stroke-linecap="round" />
                        <line x1="${center}" y1="${center + 15}" x2="${center}" y2="${center - hrLen}" stroke="${hrColor}" stroke-width="${hrW}" stroke-linecap="round" />
                        <polygon points="${center-14},${center-hrLen+5} ${center+14},${center-hrLen+5} ${center},${center-hrLen-18}" fill="${hrColor}" stroke="${hrStroke}" stroke-width="4" stroke-linejoin="round"/>
                    </g>`;

            // Minute Hand (Dark Blue)
            const minLen = 85; const minW = 10; const minColor = '#283593'; const minStroke = '#1A237E';
            svg += `<g transform="rotate(${minAngle}, ${center}, ${center})">
                        <line x1="${center}" y1="${center + 15}" x2="${center}" y2="${center - minLen}" stroke="${minStroke}" stroke-width="${minW+4}" stroke-linecap="round" />
                        <line x1="${center}" y1="${center + 15}" x2="${center}" y2="${center - minLen}" stroke="${minColor}" stroke-width="${minW}" stroke-linecap="round" />
                        <polygon points="${center-12},${center-minLen+5} ${center+12},${center-minLen+5} ${center},${center-minLen-18}" fill="${minColor}" stroke="${minStroke}" stroke-width="4" stroke-linejoin="round"/>
                    </g>`;

            // Cute Center Smiley (Yellow)
            svg += `<circle cx="${center}" cy="${center}" r="22" fill="#FFCA28" stroke="#FF8F00" stroke-width="4" />`;
            svg += `<circle cx="${center - 6}" cy="${center - 3}" r="3" fill="#5D4037" />`;
            svg += `<circle cx="${center + 6}" cy="${center - 3}" r="3" fill="#5D4037" />`;
            svg += `<path d="M ${center - 8} ${center + 5} Q ${center} ${center + 12} ${center + 8} ${center + 5}" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round" />`;

            // Removed Glare for maximum clarity

            svg += `</svg>`;
            return svg;
        }

        function generateTimePool() {
            let pool = [];
            for (let h = 1; h <= 12; h++) {
                pool.push(`${h}:00`); pool.push(`${h}:30`);
            }
            return pool;
        }

        function shuffleArray(array) {
            let cur = array.length, rnd;
            while (cur > 0) {
                rnd = Math.floor(Math.random() * cur); cur--;
                [array[cur], array[rnd]] = [array[rnd], array[cur]];
            }
            return array;
        }

        function getDistractors(correct, pool) {
            let avail = shuffleArray(pool.filter(t => t !== correct));
            return avail.slice(0, 3);
        }

        function generateQuestionSet() {
            const pool = generateTimePool();
            const targets = shuffleArray([...pool]).slice(0, TOTAL_QUESTIONS);
            questions = [];
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                let target = targets[i];
                let type = (i % 2 === 0) ? 1 : 2;
                let options = shuffleArray([target, ...getDistractors(target, pool)]);
                questions.push({ type, targetTime: target, options });
            }
        }

        const themeClasses = ['theme-blue', 'theme-orange', 'theme-purple', 'theme-pink', 'theme-teal'];

        function renderQuestion() {
            if (currentQuestionIndex >= TOTAL_QUESTIONS) { showEndScreen(); return; }
            isAnimating = false;
            const q = questions[currentQuestionIndex];
            
            elements.questionNum.textContent = currentQuestionIndex + 1;
            elements.score.textContent = score;
            elements.progressBar.style.width = `${(currentQuestionIndex / TOTAL_QUESTIONS) * 100}%`;
            
            elements.questionDisplay.innerHTML = '';
            elements.optionsContainer.innerHTML = '';
            
            let instructionStr = "";
            let selectedTheme = themeClasses[Math.floor(Math.random() * themeClasses.length)];

            if (q.type === 1) {
                instructionStr = "What time is it?";
                
                const clockDiv = document.createElement('div');
                // Increased size classes by ~10% across breakpoints
                clockDiv.className = 'w-72 h-72 md:w-[22rem] md:h-[22rem] lg:w-[32rem] lg:h-[32rem] flex-shrink-0';
                clockDiv.innerHTML = createSVGClock(q.targetTime, true);
                elements.questionDisplay.appendChild(clockDiv);

                q.options.forEach((opt) => {
                    const card = document.createElement('div');
                    card.className = `option-card ${selectedTheme} text-4xl md:text-5xl lg:text-4xl xl:text-5xl font-black py-8 md:py-12`;
                    card.innerHTML = `<span>${opt}</span>`;
                    card.onclick = () => handleAnswer(opt, q.targetTime, card);
                    elements.optionsContainer.appendChild(card);
                });
            } else {
                instructionStr = `Which clock shows ${q.targetTime}?`;
                
                const digiDiv = document.createElement('div');
                // Updated digital display classes for brighter, smaller look
                digiDiv.className = 'digital-display text-5xl md:text-7xl lg:text-8xl';
                digiDiv.textContent = q.targetTime;
                elements.questionDisplay.appendChild(digiDiv);

                q.options.forEach((opt) => {
                    const card = document.createElement('div');
                    card.className = `option-card ${selectedTheme}`;
                    card.style.aspectRatio = "1/1";
                    // Using CSS scale to enlarge clocks by ~5% inside their containers
                    card.innerHTML = `<div class="clock-wrapper" style="transform: scale(1.05);">${createSVGClock(opt, false)}</div>`;
                    card.onclick = () => handleAnswer(opt, q.targetTime, card);
                    elements.optionsContainer.appendChild(card);
                });
            }

            elements.instructionText.textContent = instructionStr;
            
            setTimeout(() => { playTTS(instructionStr); }, 300);
        }

        function showFeedback(emoji, text, isCorrect) {
            elements.feedbackOverlay.innerHTML = `<div class="text-7xl mb-2">${emoji}</div><div class="text-4xl md:text-5xl" style="color: ${isCorrect ? 'var(--success-dark)' : 'var(--error-dark)'}">${text}</div>`;
            elements.feedbackOverlay.style.border = `10px solid ${isCorrect ? 'var(--success)' : 'var(--error)'}`;
            elements.feedbackOverlay.classList.add('show');
            setTimeout(() => elements.feedbackOverlay.classList.remove('show'), 1200);
        }

        function handleAnswer(selected, correct, card) {
            if (isAnimating) return;
            if (selected === correct) {
                isAnimating = true;
                card.classList.add('correct');
                playSound('correct');
                score++;
                showFeedback("⭐", "Great job!", true);
                spawnConfetti(card);
                setTimeout(() => { currentQuestionIndex++; renderQuestion(); }, 1500);
            } else {
                card.classList.add('wrong');
                playSound('wrong');
                showFeedback("❌", "Try again!", false);
                setTimeout(() => card.classList.remove('wrong'), 500);
            }
        }

        function startGame() {
            initAudio();
            currentQuestionIndex = 0; score = 0; elements.progressBar.style.width = '0%';
            generateQuestionSet();
            switchScreen('game');
            renderQuestion();
        }

        function showEndScreen() {
            switchScreen('end');
            playSound('complete');
            if(synth) synth.cancel();
            setTimeout(() => playTTS("Great job! You finished the Clock Challenge!"), 500);
            elements.progressBar.style.width = '100%';
            startContinuousConfetti();
        }

        function switchScreen(id) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[id].classList.add('active');
        }

        elements.startClockContainer.innerHTML = createSVGClock("10:10", true);
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-play-again').addEventListener('click', () => {
            stopContinuousConfetti(); startGame();
        });

        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = []; let animationId; let isContinuous = false;

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();

        class Particle {
            constructor(x, y, isFull) {
                this.x = x; this.y = y; this.size = Math.random() * 15 + 8;
                this.speedX = Math.random() * 8 - 4;
                this.speedY = isFull ? Math.random() * -12 - 5 : Math.random() * -8 - 4;
                this.gravity = 0.6; this.rot = Math.random() * 360; this.rotSpeed = Math.random() * 12 - 6;
                this.colors = ['#FF4B4B', '#FF9600', '#FFC800', '#58CC02', '#1CB0F6', '#CE82FF'];
                this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
                this.life = 150; this.shape = Math.random() > 0.5 ? 'rect' : 'circle';
            }
            update() {
                this.speedY += this.gravity; this.x += this.speedX; this.y += this.speedY;
                this.rot += this.rotSpeed; this.life--;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot * Math.PI / 180);
                ctx.fillStyle = this.color;
                if(this.shape === 'rect') ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                else { ctx.beginPath(); ctx.arc(0, 0, this.size/2, 0, Math.PI*2); ctx.fill(); }
                ctx.restore();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isContinuous && Math.random() < 0.2) particles.push(new Particle(Math.random() * canvas.width, -20, true));
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                if (particles[i].y > canvas.height || particles[i].life <= 0) { particles.splice(i, 1); i--; }
            }
            if (particles.length > 0 || isContinuous) animationId = requestAnimationFrame(animateConfetti);
            else ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function spawnConfetti(el) {
            const rect = el.getBoundingClientRect();
            for (let i = 0; i < 50; i++) particles.push(new Particle(rect.left + rect.width/2, rect.top + rect.height/2, false));
            if (!animationId || particles.length === 50) animateConfetti();
        }

        function startContinuousConfetti() {
            isContinuous = true;
            for(let i=0; i<100; i++) particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height * 0.5, true));
            animateConfetti();
        }

        function stopContinuousConfetti() {
            isContinuous = false; particles = []; ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(animationId) cancelAnimationFrame(animationId);
        }
    </script>
</body>
</html>

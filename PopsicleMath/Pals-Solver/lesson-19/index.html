        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, var(--bg-sky-top) 0%, var(--bg-sky-bot) 100%);
            color: var(--text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .scenery {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .sun {
            position: absolute;
            top: 40px;
            left: 50px;
            width: 90px;
            height: 90px;
            background: #FFD54F;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 193, 7, 0.6);
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.95;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            animation: floatClouds linear infinite;
        }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: white; border-radius: 50%; }

        .cloud1 { width: 140px; height: 45px; top: 15%; left: -150px; animation-duration: 45s; }
        .cloud1::before { width: 70px; height: 70px; top: -30px; left: 20px; }
        .cloud1::after { width: 60px; height: 60px; top: -20px; left: 65px; }

        .cloud2 { width: 180px; height: 55px; top: 28%; left: -200px; animation-duration: 55s; animation-delay: 15s; }
        .cloud2::before { width: 90px; height: 90px; top: -45px; left: 25px; }
        .cloud2::after { width: 80px; height: 80px; top: -35px; left: 85px; }

        @keyframes floatClouds {
            0% { transform: translateX(-15vw); }
            100% { transform: translateX(115vw); }
        }

        .landscape-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            z-index: -1;
        }
        .hill-back {
            position: absolute;
            bottom: 15%;
            left: -10%;
            width: 120%;
            height: 100%;
            background: #66BB6A;
            border-radius: 50% 50% 0 0;
        }
        .hill-front {
            position: absolute;
            bottom: -10%;
            left: -20%;
            width: 140%;
            height: 90%;
            background: #4CAF50;
            border-radius: 50% 50% 0 0;
            box-shadow: inset 0 10px 0 rgba(255,255,255,0.1);
        }
        .flower { position: absolute; font-size: 1.8rem; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }

        .rainbow-container {
            position: absolute;
            bottom: 35%; /* Sits exactly on the grass line */
            left: 10%;
            width: 450px;
            height: 225px;
            overflow: hidden;
            opacity: 0.8;
            z-index: -1;
        }

        .rainbow {
            width: 450px;
            height: 450px;
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 24px #FF4B4B,
                inset 0 0 0 48px #FF9600,
                inset 0 0 0 72px #FFC800,
                inset 0 0 0 96px #58CC02,
                inset 0 0 0 120px #1CB0F6,
                inset 0 0 0 144px #CE82FF;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .screen.active { display: flex; }

        h1, h2 {
            color: white;
            text-shadow: 2px 4px 0px rgba(0,0,0,0.2);
            text-align: center;
            font-weight: 900;
        }
        h1 { font-size: 3.5rem; margin-bottom: 20px; letter-spacing: 2px; }
        h2 { font-size: 2rem; margin-bottom: 10px; }

        .settings-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 90%;
            max-width: 550px;
            text-align: center;
            border: 4px solid #FFF;
        }

        .setting-group { margin-bottom: 25px; }
        .setting-title { font-weight: 800; margin-bottom: 12px; font-size: 1.3rem; color: #555; text-transform: uppercase;}
        .options-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

        .option-btn {
            background: white;
            border: 3px solid #E0E0E0;
            color: #777;
            padding: 10px 20px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #E0E0E0;
        }
        .option-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #E0E0E0; }
        .option-btn.selected {
            background: var(--secondary); color: white;
            border-color: var(--secondary); box-shadow: 0 4px 0 #00838F;
        }

        #game-screen { justify-content: space-between; padding-top: 0; }

        .top-hud-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 650px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 35px;
            padding: 8px 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            border: 3px solid #E5E5E5;
            width: 100%;
        }

        .hud-left { display: flex; gap: 10px; }

        .icon-btn {
            background: white; border: 3px solid #E0E0E0; font-size: 1.3rem; cursor: pointer;
            border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 0 #E0E0E0; transition: transform 0.1s;
        }
        .icon-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #E0E0E0; }

        .hud-center { font-size: 1.3rem; font-weight: 800; color: #444; flex-grow: 1; text-align: center; }
        .hud-right { font-size: 1.3rem; font-weight: 800; color: #444; }
        .hud-score { color: var(--accent); font-size: 1.4rem; }

        .progress-wrapper { width: 100%; padding: 0 15px; }
        .progress-container { width: 100%; height: 14px; background: #E0E0E0; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: #4CAF50; width: 0%; transition: width 0.4s ease; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15); }

        .train-area {
            flex-grow: 1; display: flex; align-items: flex-end; width: 100%;
            position: relative; padding-bottom: 20px; overflow-x: hidden;
        }

        .track-ground {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 35px;
            background: #8D6E63; border-top: 5px solid #5D4037; z-index: 10;
        }
        .track-sleepers {
            position: absolute; bottom: 25px; left: 0; width: 100%; height: 12px;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 40px, #3E2723 40px, #3E2723 55px);
            z-index: 11; animation: moveTracks 1s linear infinite paused; will-change: background-position;
        }
        .track-rails {
            position: absolute; bottom: 32px; left: 0; width: 100%; height: 5px;
            background: #9E9E9E; border-top: 2px solid #E0E0E0; z-index: 12;
        }
        @keyframes moveTracks { from { background-position: 0 0; } to { background-position: -55px 0; } }

        .station-building {
            position: absolute; left: 2%; bottom: 35px;
            display: flex; flex-direction: column; align-items: center; z-index: 5;
        }
        .station-roof {
            width: 160px; height: 0;
            border-left: 25px solid transparent; border-right: 25px solid transparent;
            border-bottom: 45px solid #D84315;
            border-radius: 5px; position: relative; z-index: 2;
        }
        .station-body {
            width: 120px; height: 90px; background: #FFE082;
            border: 4px solid #EF6C00; border-top: none;
            display: flex; flex-direction: column; align-items: center; position: relative;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.05);
        }
        .station-sign-board {
            background: #FFF; color: #E65100; font-weight: 900; font-size: 0.8rem;
            padding: 2px 8px; border: 2px solid #E65100; border-radius: 8px;
            margin-top: 5px; box-shadow: 0 2px 0 #E65100;
        }
        .station-clock {
            width: 28px; height: 28px; background: white; border-radius: 50%;
            border: 3px solid #4E342E; margin-top: 5px; position: relative;
        }
        .clock-hands {
            position: absolute; top: 50%; left: 50%; width: 2px; height: 10px;
            background: #4E342E; transform-origin: bottom center; transform: translate(-50%, -100%) rotate(45deg);
        }
        .clock-hands::after {
            content:''; position: absolute; bottom: 0; left: 0; width: 8px; height: 2px;
            background: #4E342E; transform-origin: left bottom;
        }
        .station-door {
            position: absolute; bottom: 0; width: 35px; height: 40px;
            background: #795548; border-radius: 10px 10px 0 0; border: 2px solid #4E342E;
            display: flex; justify-content: center;
        }
        .door-window {
            width: 15px; height: 15px; background: #81D4FA; margin-top: 5px;
            border-radius: 3px; border: 2px solid #3E2723;
        }
        .station-platform {
            width: 180px; height: 10px; background: #9E9E9E; border-radius: 5px;
            border: 2px solid #616161; border-bottom: none;
        }

        .is-moving .track-sleepers, .is-moving .wheel-inner { animation-play-state: running; }

        .train-mover {
            position: absolute; right: 5%; bottom: 25px;
            transition: transform 1.8s cubic-bezier(0.3, 0, 0.2, 1); z-index: 15;
            display: flex; will-change: transform;
        }

        .train-scaler {
            display: flex; align-items: flex-end; gap: 10px;
            transform-origin: bottom right;
        }

        .engine { position: relative; width: 125px; height: 105px; flex-shrink: 0; margin-right: 5px; }
        .engine-body {
            position: absolute; bottom: 18px; right: 48px; width: 75px; height: 60px;
            background: #FF4757; border-radius: 20px 0 0 0;
            border: 4px solid #1E272E; box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2);
            z-index: 2;
        }
        .engine-chimney {
            position: absolute; bottom: calc(100% - 4px); left: 12px; width: 24px; height: 32px;
            background: #808E9B; border-radius: 4px 4px 0 0; border: 4px solid #1E272E; border-bottom: none;
            z-index: -1;
        }
        .engine-chimney::after { /* Cute brim on top of chimney */
            content: ''; position: absolute; top: -6px; left: -6px; width: 28px; height: 8px;
            background: #1E272E; border-radius: 4px;
        }

            box-shadow: 0 3px 0 #D9E7F1 !important;
        }
        .options-area {
            max-width: 900px !important;
            width: 100% !important;
            min-height: 88px !important;
            gap: 10px !important;
            align-items: flex-end !important;
        }
        .option-carriage {
            width: 82px !important;
            height: 92px !important;
            flex: 0 0 82px !important;
            margin: 0 !important;
        }
        .option-carriage .carriage-content { top: 12% !important; height: 44% !important; }
        .option-carriage .shape-value { font-size: 1.55rem !important; }
        .option-carriage .number-value { font-size: 1.8rem !important; }
        .next-btn { font-size: 1.18rem !important; padding: 12px 28px !important; margin-top: 2px !important; }
        .feedback-overlay { z-index: 50 !important; }
        @media (max-width: 900px) {
            .top-hud-container { top: 10px !important; }
            .hud-pill { padding: 8px 16px !important; }
            .instruction-text { font-size: 1rem !important; white-space: normal !important; text-align:center !important; }
            .option-carriage { width: 74px !important; height: 84px !important; flex-basis: 74px !important; }
            .option-carriage .shape-value { font-size: 1.38rem !important; }
            .option-carriage .number-value { font-size: 1.62rem !important; }
            .bottom-panel { width: min(96vw, 860px) !important; }
        }
        @media (max-width: 640px) {
            .hud-center, .hud-right { font-size: 1rem !important; }
            .hud-score { font-size: 1.1rem !important; }
            .progress-container { height: 15px !important; }
            .instruction-bar { padding: 8px 12px !important; border-width: 3px !important; }
            .instruction-text { font-size: .95rem !important; }
            .bottom-panel { gap: 8px !important; }
            .option-carriage { width: 66px !important; height: 76px !important; flex-basis: 66px !important; }
            .option-carriage .shape-value { font-size: 1.22rem !important; }
            .option-carriage .number-value { font-size: 1.4rem !important; }
        }

    
        /* VER8 final layout overrides */
        #game-screen .train-mover {
            right: var(--train-right, 24px) !important;
            bottom: var(--train-bottom, 150px) !important;
            z-index: 18 !important;
        }
        #game-screen .train-scaler {
            transform: scale(var(--train-scale, 0.86)) !important;
        }
        #game-screen .train-area {
            background-image: var(--game-bg) !important;
            background-size: cover !important;
            background-position: center bottom !important;
            background-repeat: no-repeat !important;
            background-color: #82cdf8 !important;
        }


        /* VER9: setup + fruit mini game use the same lightweight station background */
        #settings-screen {
            background-image: var(--game-bg);
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-color: #82cdf8;
        }
        #settings-screen .settings-card {
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(2px);
        }
        #settings-screen h1 { margin-top: 6px; }

        .fruit-game-overlay {
            position: absolute;
            inset: 0;
            z-index: 80;
            display: none;
            overflow: hidden;
            background-image: var(--game-bg);
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-color: #82cdf8;
            touch-action: none;
            cursor: none;
        }
        .fruit-game-overlay.active { display: block; }
        .fruit-hud {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 11px 22px;
            background: rgba(255,255,255,.95);
            border: 3px solid #DCEAF2;
            border-radius: 28px;
            box-shadow: 0 7px 18px rgba(0,0,0,.15);
            font-size: 1.15rem;
            font-weight: 900;
            color: #55413A;
            white-space: nowrap;
        }
        .fruit-title {
            position: absolute;
            top: 82px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            padding: 8px 18px;
            background: linear-gradient(180deg,#FFF8D8,#FFE58D);
            border: 3px solid #F2B400;
            border-radius: 22px;
            font-size: 1.05rem;
            font-weight: 900;
            color: #68493D;
            box-shadow: 0 5px 14px rgba(0,0,0,.14);
        }
        .fruit-basket {
            position: absolute;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            z-index: 5;
            width: 100px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.1rem;
            filter: drop-shadow(0 5px 3px rgba(0,0,0,.18));
            will-change: left;
        }
        .falling-fruit {
            position: absolute;
            z-index: 3;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.55rem;
            filter: drop-shadow(0 3px 2px rgba(0,0,0,.16));
            will-change: transform;
            pointer-events: none;
        }
        .fruit-result {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.10);
            font-size: 2rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 0 rgba(0,0,0,.25);
        }
        .fruit-result.show { display: flex; }
        @media (max-width: 700px) {
            .fruit-hud { top: 10px; font-size: .98rem; gap: 12px; padding: 9px 15px; }
            .fruit-title { top: 66px; font-size: .9rem; }
            .fruit-basket { width: 84px; height: 62px; font-size: 3.55rem; }
            .falling-fruit { width: 44px; height: 44px; font-size: 2.15rem; }
        }

    <!-- Pattern Train Ver1: station background + artwork train carriages -->
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <div class="scenery">
        <div class="sun"></div>
        <div class="rainbow-container"><div class="rainbow"></div></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <div class="landscape-bottom">
            <div class="hill-back"></div>

                <div class="flower" style="left: 28%; top: 60%;">🌼</div>
                <div class="flower" style="left: 45%; top: 35%;">🌷</div>
                <div class="flower" style="left: 65%; top: 55%;">🌻</div>
                <div class="flower" style="left: 85%; top: 40%;">🌺</div>

    <div id="settings-screen" class="screen active">

                <div class="options-row" id="mode-options">

                    <button class="option-btn" data-val="number">Numbers 🔢</button>
                    <button class="option-btn" data-val="mixed">Mixed 🎲</button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-title">Difficulty</div>

                    <button class="option-btn" data-val="medium">Medium</button>

            <div class="setting-group">

                </div>
            </div>
            <div class="progress-wrapper">
                <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
            </div>
        </div>

        <div id="feedback-msg" class="feedback-overlay"></div>

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol=0.1) {
            if (!state.soundEnabled) return;
            initAudio();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSound(type) {
            if (type === 'click') playTone(450, 'sine', 0.1, 0.1);
            if (type === 'success') {
                playTone(523.25, 'square', 0.1, 0.08); setTimeout(() => playTone(659.25, 'square', 0.15, 0.08), 100); setTimeout(() => playTone(783.99, 'square', 0.2, 0.08), 250);
            }
            if (type === 'error') playTone(200, 'sawtooth', 0.3, 0.05);
            if (type === 'train') {
                playTone(600, 'triangle', 0.3, 0.1); setTimeout(() => playTone(600, 'triangle', 0.5, 0.1), 350);
            }
            if (type === 'cheer') {
                playTone(800, 'sine', 0.1, 0.05); setTimeout(() => playTone(1000, 'sine', 0.2, 0.05), 100); setTimeout(() => playTone(1200, 'sine', 0.3, 0.05), 300);
            }
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled; els.soundBtn.innerHTML = state.soundEnabled ? '🔊' : '🔇';
            if (state.soundEnabled) initAudio();
        }

        function speakQuestion() {
            if (!state.soundEnabled || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance("What comes next in the pattern?");
            utterance.rate = 0.9; utterance.pitch = 1.1;
            let voices = window.speechSynthesis.getVoices();
            let engVoice = voices.find(v => v.lang.startsWith('en-') && v.name.includes('Female')) || voices.find(v => v.lang.startsWith('en-US')) || voices.find(v => v.lang.startsWith('en-'));
            if(engVoice) utterance.voice = engVoice;
            window.speechSynthesis.speak(utterance);
        }
        if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        function unlockAudioAndSpeech() { initAudio(); if (window.speechSynthesis) { let u = new SpeechSynthesisUtterance(""); u.volume = 0; window.speechSynthesis.speak(u); } }

        function setupOptionButtons(groupId, stateKey) {
            const container = document.getElementById(groupId);
            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('option-btn')) {
                    playSound('click');
                    container.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
                    e.target.classList.add('selected');
                    state[stateKey] = stateKey === 'numQuestions' ? parseInt(e.target.dataset.val) : e.target.dataset.val;
                }
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array;
        }

        function generateShapeQuestion() {
            const patterns = { easy: ['AB'], medium: ['AAB', 'ABB', 'ABC'], hard: ['ABCD'] };
            const patternType = patterns[state.difficulty][Math.floor(Math.random() * patterns[state.difficulty].length)];
            let pool = shuffle([...shapesPool]); const [A, B, C, D] = pool.slice(0, 4);
            let seqTemplate = []; let visibleLen = 4;
            switch(patternType) {
                case 'AB': seqTemplate = [A, B, A, B, A, B]; visibleLen = 4; break;
                case 'AAB': seqTemplate = [A, A, B, A, A, B, A, A]; visibleLen = 5; break;
                case 'ABB': seqTemplate = [A, B, B, A, B, B, A, B]; visibleLen = 5; break;
                case 'ABC': seqTemplate = [A, B, C, A, B, C, A, B]; visibleLen = 5; break;
                case 'ABCD': seqTemplate = [A, B, C, D, A, B, C, D]; visibleLen = 6; break;
            }
            const sequence = seqTemplate.slice(0, visibleLen); const answer = seqTemplate[visibleLen];
            // Ver1: carriage color follows the pattern symbol itself.
            // AB -> red/blue/red/blue..., ABC -> red/blue/yellow..., ABCD adds purple.
            const symbolOrder = [A, B, C, D];
            const sequenceColors = sequence.map(item => Math.max(0, symbolOrder.indexOf(item)));
            const answerColorIndex = Math.max(0, symbolOrder.indexOf(answer));
            let options = [answer]; let optPool = shuffle([...shapesPool]).filter(s => s !== answer);
            options.push(optPool[0], optPool[1], optPool[2]);
            return { type: 'shape', sequence, answer, options: shuffle(options), sequenceColors, answerColorIndex };
        }

        function generateNumberQuestion() {
            let steps = [];
            if (state.difficulty === 'easy') steps = [1, 2, -1, -2];
            else if (state.difficulty === 'medium') steps = [2, 3, 5, -2, -3, -5];
            else steps = [5, 10, -5, -10];

            const step = steps[Math.floor(Math.random() * steps.length)];
            // Hard ±10 cannot fit 6 terms inside 1–50. Use 4 visible terms for ±10;
            // other hard steps keep the longer 5-term train.
            const visibleLen = state.difficulty === 'hard' && Math.abs(step) === 10 ? 4 : (state.difficulty === 'hard' ? 5 : 4);
            const jumpsToAnswer = visibleLen;

            let minStart = 1;
            let maxStart = 50;
            if (step > 0) maxStart = 50 - jumpsToAnswer * step;
            if (step < 0) minStart = 1 - jumpsToAnswer * step;

            // Safety fallback: this prevents any impossible range from ever creating an infinite loop.
            if (minStart > maxStart) {
                minStart = 5;
                maxStart = 45;
            }

            const start = minStart + Math.floor(Math.random() * (maxStart - minStart + 1));
            const sequence = [];
            for (let i = 0; i < visibleLen; i++) sequence.push(start + i * step);
            const answer = start + visibleLen * step;

            const optionsSet = new Set([answer]);
            const offsets = [step, -step, step * 2, -step * 2, 1, -1, 2, -2, 3, -3];
            for (const offset of shuffle(offsets)) {
                const fake = answer + offset;
                if (fake >= 1 && fake <= 50 && fake !== answer) optionsSet.add(fake);
                if (optionsSet.size >= 4) break;
            }
            for (let candidate = 1; optionsSet.size < 4 && candidate <= 50; candidate++) {
                if (candidate !== answer) optionsSet.add(candidate);
            }

            const sequenceColors = sequence.map((_, idx) => idx % 4);
            const answerColorIndex = visibleLen % 4;
            return { type: 'number', sequence, answer, options: shuffle(Array.from(optionsSet)), sequenceColors, answerColorIndex };
        }

        function generateQuestion() {
            let mode = state.mode; if (mode === 'mixed') mode = Math.random() > 0.5 ? 'shape' : 'number';
            return mode === 'shape' ? generateShapeQuestion() : generateNumberQuestion();
        }

            switchScreen('game'); els.trainArea.classList.remove('is-moving');
            requestAnimationFrame(applyResponsiveSceneLayout);
            loadNextQuestion();
        }

        function isNumberLike(content) {
            return typeof content === 'number' || /^-?\d+$/.test(String(content));
        }

        function getCarriageContentHTML(content, colorIndex, isQuestion = false) {
            const safeIndex = ((colorIndex % carriageImages.length) + carriageImages.length) % carriageImages.length;
            if (isQuestion) return `<span class="question-mark">?</span>`;
            if (isNumberLike(content)) return `<span class="number-value num-color-${safeIndex}">${content}</span>`;
            return `<span class="shape-value">${content}</span>`;
        }

        function createCarriageHTML(content, colorIndex, isQuestion = false, id = '') {
            const safeIndex = ((colorIndex % carriageImages.length) + carriageImages.length) % carriageImages.length;
            const asset = carriageImages[safeIndex];
            const cls = isQuestion ? 'carriage question' : 'carriage';
            return `
                <div class="${cls}" style="--carriage-img:url(${asset})" ${id ? `id="${id}"` : ''}>
                    <div class="carriage-content">${getCarriageContentHTML(content, safeIndex, isQuestion)}</div>
                </div>
            `;
        }



        const sceneLayout = { bgW: 1672, bgH: 941, railBottomRatio: 0.41, panelBottomRatio: 0.018, rightMarginRatio: 0.02 };

        
        function applyResponsiveSceneLayout() {
            if (!els.screens.game.classList.contains('active')) return;
            const gameRect = els.screens.game.getBoundingClientRect();
            const W = gameRect.width;
            const H = gameRect.height;
            const bgScale = Math.max(W / sceneLayout.bgW, H / sceneLayout.bgH);
            const sceneW = sceneLayout.bgW * bgScale;
            const sceneH = sceneLayout.bgH * bgScale;
            const sceneX = (W - sceneW) / 2;

            const trainNaturalW = Math.max(els.trainContainer.scrollWidth || 0, 700);
            const trainNaturalH = Math.max(els.trainContainer.scrollHeight || 0, 110);
            const maxTrainW = Math.min(W * 0.47, sceneW * 0.50);
            const maxTrainH = Math.min(H * 0.18, sceneH * 0.18);
            const trainScale = Math.min(0.92, maxTrainW / trainNaturalW, maxTrainH / trainNaturalH);

            const trainRight = Math.max(18, W * sceneLayout.rightMarginRatio);
            const trainBottom = Math.max(118, sceneH * sceneLayout.railBottomRatio);

            els.screens.game.style.setProperty('--train-scale', String(trainScale));
            els.screens.game.style.setProperty('--train-right', `${Math.round(trainRight)}px`);
            els.screens.game.style.setProperty('--train-bottom', `${Math.round(trainBottom)}px`);

            const panel = document.querySelector('.bottom-panel');
            const panelBottom = Math.max(10, H * sceneLayout.panelBottomRatio);
            panel.style.bottom = `${Math.round(panelBottom)}px`;
            panel.style.width = `${Math.min(W * 0.92, 940)}px`;

            const instructionText = document.getElementById('instruction-text');
            if (sceneW < 760 || W < 760) instructionText.style.whiteSpace = 'normal';
            else instructionText.style.whiteSpace = 'nowrap';
        }

        function loadNextQuestion() {
            if (state.currentQIndex >= state.numQuestions) { endGame(); return; }
            state.currentQuestion = generateQuestion(); state.isFirstTry = true; state.isAnimating = false;
            els.instructionBar.style.display = 'inline-flex';

            els.qCounter.textContent = `${state.currentQIndex + 1}/${state.numQuestions}`;
            els.scoreDisplay.textContent = state.score;
            els.progressBar.style.width = `${(state.currentQIndex / state.numQuestions) * 100}%`;

            // Reset train position strictly to the right side
            els.trainMover.style.transition = 'none';
            els.trainMover.style.transform = 'translateX(0)';
            void els.trainMover.offsetWidth; // Force Reflow
            els.trainMover.style.transition = 'transform 1.8s cubic-bezier(0.3, 0, 0.2, 1)';

            renderTrain(); renderOptions();
            requestAnimationFrame(applyResponsiveSceneLayout);
            setTimeout(speakQuestion, 600);
        }

        function renderTrain() {
            const engineHTML = els.trainContainer.children[0].outerHTML; let carriagesHTML = '';
            state.currentQuestion.sequence.forEach((item, index) => {
                const colorIndex = state.currentQuestion.sequenceColors?.[index] ?? index;
                carriagesHTML += createCarriageHTML(item, colorIndex);
            });
            carriagesHTML += createCarriageHTML('?', state.currentQuestion.answerColorIndex ?? state.currentQuestion.sequence.length, true, 'question-carriage');
            els.trainContainer.innerHTML = engineHTML + carriagesHTML;
        }

        function renderOptions() {
            els.optionsContainer.innerHTML = '';
            state.currentQuestion.options.forEach((opt, index) => {
                const optDiv = document.createElement('div');
                optDiv.innerHTML = createCarriageHTML(opt, index + 2);
                const carriageEl = optDiv.firstElementChild; carriageEl.className = 'carriage option-carriage';
                carriageEl.addEventListener('click', () => handleAnswer(opt, carriageEl));
                els.optionsContainer.appendChild(carriageEl);
            });
        }

        function showFeedback(text, type) {
            els.feedbackMsg.textContent = text; els.feedbackMsg.className = `feedback-overlay show feedback-${type}`;
            setTimeout(() => { els.feedbackMsg.classList.remove('show'); }, 1000);
        }

        function handleAnswer(selectedOpt, optionEl) {
            if (state.isAnimating) return;

            if (selectedOpt === state.currentQuestion.answer) {
                state.isAnimating = true; playSound('success');
                if (state.isFirstTry) { state.score += 10; state.firstTryCount++; els.scoreDisplay.textContent = state.score; }
                showFeedback("Great!", "success");

                const qCarriage = document.getElementById('question-carriage');
                qCarriage.classList.remove('question');
                qCarriage.querySelector('.carriage-content').textContent = selectedOpt;

                els.optionsContainer.innerHTML = ''; // Hide options immediately

                playSound('train');
                els.trainArea.classList.add('is-moving');

                // Drive train left to pull up to the beautiful station
                setTimeout(() => {
                    els.trainMover.style.transform = 'translateX(-36vw)';
                    setTimeout(() => {
                        els.trainArea.classList.remove('is-moving');
                        // Hide the question prompt once the navigation block appears.
                        els.instructionBar.style.display = 'none';
                        const completed = state.currentQIndex + 1;
                        const hasMoreQuestions = completed < state.numQuestions;
                        const miniGameDue = hasMoreQuestions && completed % 2 === 0;
                        if (miniGameDue) {
                            els.optionsContainer.innerHTML = `<button class="btn btn-primary next-btn" onclick="advanceAfterQuestion()">PLAY FRUIT GAME 🍎</button>`;
                        } else {
                            els.optionsContainer.innerHTML = `<button class="btn btn-primary next-btn" onclick="advanceAfterQuestion()">NEXT QUESTION ➔</button>`;
                        }
                        requestAnimationFrame(applyResponsiveSceneLayout);
                    }, 1800);
                }, 500);

            } else {
                playSound('error'); state.isFirstTry = false; showFeedback("Try Again!", "error");
                optionEl.classList.add('shake'); setTimeout(() => optionEl.classList.remove('shake'), 500);
            }
        }

        const fruitEmojis = ['🍎','🍊','🍓','🍇','🍌','🍐','🍑'];
        let fruitGame = { active: false, caught: 0, remaining: 15, basketX: 0, fruits: [], spawnTimer: null, clockTimer: null, raf: null, lastTs: 0 };

        function moveFruitBasket(clientX) {
            if (!fruitGame.active) return;
            const rect = els.fruitOverlay.getBoundingClientRect();
            const half = els.fruitBasket.offsetWidth / 2;
            fruitGame.basketX = Math.max(half, Math.min(rect.width - half, clientX - rect.left));
            els.fruitBasket.style.left = `${fruitGame.basketX}px`;
        }

        function spawnFruit() {
            if (!fruitGame.active) return;
            const rect = els.fruitOverlay.getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'falling-fruit';
            el.textContent = fruitEmojis[Math.floor(Math.random() * fruitEmojis.length)];
            const size = rect.width < 700 ? 44 : 52;
            const x = Math.max(8, Math.random() * Math.max(1, rect.width - size - 16));
            const fruit = { el, x, y: -size, size, speed: 78 + Math.random() * 42 };
            el.style.left = `${x}px`;
            el.style.transform = `translateY(${fruit.y}px)`;
            els.fruitField.appendChild(el);
            fruitGame.fruits.push(fruit);
        }

        function fruitGameLoop(ts) {
            if (!fruitGame.active) return;
            if (!fruitGame.lastTs) fruitGame.lastTs = ts;
            const dt = Math.min(0.035, (ts - fruitGame.lastTs) / 1000);
            fruitGame.lastTs = ts;

            const overlayRect = els.fruitOverlay.getBoundingClientRect();
            const basketRect = els.fruitBasket.getBoundingClientRect();
            for (let i = fruitGame.fruits.length - 1; i >= 0; i--) {
                const fruit = fruitGame.fruits[i];
                fruit.y += fruit.speed * dt;
                fruit.el.style.transform = `translateY(${fruit.y}px)`;

                const fx1 = fruit.x, fx2 = fruit.x + fruit.size;
                const fy1 = fruit.y, fy2 = fruit.y + fruit.size;
                const bx1 = basketRect.left - overlayRect.left;
                const bx2 = basketRect.right - overlayRect.left;
                const by1 = basketRect.top - overlayRect.top + 12;
                const by2 = basketRect.bottom - overlayRect.top;
                const caught = fx2 > bx1 && fx1 < bx2 && fy2 > by1 && fy1 < by2;

                if (caught) {
                    fruitGame.caught++;
                    els.fruitScore.textContent = fruitGame.caught;
                    playTone(720, 'sine', 0.08, 0.035);
                    fruit.el.remove();
                    fruitGame.fruits.splice(i, 1);
                } else if (fruit.y > overlayRect.height + 20) {
                    fruit.el.remove();
                    fruitGame.fruits.splice(i, 1);
                }
            }
            fruitGame.raf = requestAnimationFrame(fruitGameLoop);
        }

        function stopFruitMiniGame() {
            if (!fruitGame.active) return;
            fruitGame.active = false;
            clearInterval(fruitGame.spawnTimer);
            clearInterval(fruitGame.clockTimer);
            cancelAnimationFrame(fruitGame.raf);
            fruitGame.fruits.forEach(f => f.el.remove());
            fruitGame.fruits = [];
            els.fruitResult.textContent = `Great! You caught ${fruitGame.caught} fruit! 🍎`;
            els.fruitResult.classList.add('show');
            setTimeout(() => {
                els.fruitResult.classList.remove('show');
                els.fruitOverlay.classList.remove('active');
                els.fruitOverlay.setAttribute('aria-hidden','true');
                state.currentQIndex++;
                loadNextQuestion();
            }, 850);
        }

        function startFruitMiniGame() {
            fruitGame.active = true;
            fruitGame.caught = 0;
            fruitGame.remaining = 15;
            fruitGame.fruits = [];
            fruitGame.lastTs = 0;
            els.fruitScore.textContent = '0';
            els.fruitTime.textContent = '15';
            els.fruitField.innerHTML = '';
            els.fruitOverlay.classList.add('active');
            els.fruitOverlay.setAttribute('aria-hidden','false');

            const rect = els.fruitOverlay.getBoundingClientRect();
            fruitGame.basketX = rect.width / 2;
            els.fruitBasket.style.left = `${fruitGame.basketX}px`;

            spawnFruit();
            fruitGame.spawnTimer = setInterval(spawnFruit, 700);
            fruitGame.clockTimer = setInterval(() => {
                fruitGame.remaining--;
                els.fruitTime.textContent = Math.max(0, fruitGame.remaining);
                if (fruitGame.remaining <= 0) stopFruitMiniGame();
            }, 1000);
            fruitGame.raf = requestAnimationFrame(fruitGameLoop);
        }

        els.fruitOverlay.addEventListener('pointermove', (e) => moveFruitBasket(e.clientX));
        els.fruitOverlay.addEventListener('pointerdown', (e) => moveFruitBasket(e.clientX));
        window.addEventListener('keydown', (e) => {
            if (!fruitGame.active) return;
            if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
            e.preventDefault();
            const rect = els.fruitOverlay.getBoundingClientRect();
            const step = Math.max(35, rect.width * 0.045);
            const next = fruitGame.basketX + (e.key === 'ArrowLeft' ? -step : step);
            moveFruitBasket(rect.left + next);
        });

        window.advanceAfterQuestion = function() {
            playSound('click');
            els.optionsContainer.innerHTML = '';
            const completed = state.currentQIndex + 1;
            if (completed >= state.numQuestions) {
                state.currentQIndex++;
                endGame();
                return;
            }
            if (completed % 2 === 0) {
                startFruitMiniGame();
                return;
            }
            state.currentQIndex++;
            loadNextQuestion();
        };
        window.nextQuestion = window.advanceAfterQuestion;

        function endGame() {
            switchScreen('end'); playSound('cheer'); els.progressBar.style.width = '100%';
            document.getElementById('final-score').textContent = state.score;
            document.getElementById('first-try-stats').textContent = `${state.firstTryCount} / ${state.numQuestions}`;

            const percent = state.firstTryCount / state.numQuestions; let title = "";
            if (percent >= 0.9) title = "Pattern Master 🏆"; else if (percent >= 0.7) title = "Super Train Driver 🚂"; else title = "Great Explorer 🗺️";
            document.getElementById('player-title').textContent = title;

            try {
                const key = `pt_high_${state.mode}_${state.difficulty}_${state.numQuestions}`;
                const currentHigh = localStorage.getItem(key) || 0;
                if (state.score > currentHigh) localStorage.setItem(key, state.score);
            } catch(e) {}
            startConfetti();
        }

        let confettiActive = false;
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas'); const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const pieces = []; const colors = ['#1CB0F6', '#58CC02', '#FF4B4B', '#FFC800', '#CE82FF'];
            for(let i=0; i<120; i++) {
                pieces.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height - canvas.height, w: Math.random() * 12 + 6, h: Math.random() * 12 + 6, color: colors[Math.floor(Math.random() * colors.length)], vy: Math.random() * 4 + 3, vx: Math.random() * 3 - 1.5, rot: Math.random() * 360, rotS: Math.random() * 6 - 3 });
            }
            confettiActive = true;
            function animate() {
                if(!confettiActive) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.vy; p.x += p.vx; p.rot += p.rotS;
                    if(p.y > canvas.height) p.y = -20;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color; ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
                });
                requestAnimationFrame(animate);
            }
            animate();
            setTimeout(() => { confettiActive = false; ctx.clearRect(0,0,canvas.width,canvas.height);}, 6000);
        }

        window.addEventListener('resize', () => {
            applyResponsiveSceneLayout();
            if(els.screens.end.classList.contains('active')) {
                const canvas = document.getElementById('confetti-canvas');
                canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            }
        });
        window.addEventListener('load', applyResponsiveSceneLayout);
    </script>
</body>
</html>

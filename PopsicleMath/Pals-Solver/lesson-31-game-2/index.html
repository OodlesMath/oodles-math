.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,0) 28%,rgba(248,223,156,.12) 65%,rgba(208,159,89,.18) 100%);pointer-events:none}
.scene:after{content:"";position:absolute;left:0;right:0;bottom:0;height:19%;background:linear-gradient(180deg,rgba(243,203,120,0) 0%,rgba(237,185,95,.18) 35%,rgba(203,139,76,.16) 100%);pointer-events:none}
.sun,.cloud,.mesas,.distant,.ground,.rock,.grass,.cactus,.flower{display:none}
.wood-mini{position:absolute;left:3.6%;top:33%;width:186px;padding:12px 8px;text-align:center;background:linear-gradient(#bf7a43,#985a31);color:#5a341e;border:5px solid #714222;border-radius:9px;transform:rotate(-5deg);font-weight:900;font-size:16px;line-height:1.3;text-shadow:0 1px #e7ae7f;box-shadow:0 10px 15px rgba(71,45,21,.16)}

/* ---------- Setup ---------- */
#setup{z-index:20}
.setup-card{position:relative;z-index:5;width:min(900px,92vw);max-height:90vh;padding:26px 30px 30px;background:rgba(255,248,226,.94);border:5px solid rgba(255,255,255,.9);border-radius:34px;box-shadow:0 24px 50px rgba(73,49,25,.26);backdrop-filter:blur(4px);text-align:center}
.title-sign{display:inline-block;position:relative;margin-top:-66px;padding:16px 48px 14px;background:linear-gradient(#b97642,#8f4f2a);color:white;border:5px solid #6f3d20;border-radius:14px;box-shadow:0 9px 0 #61351c,0 14px 25px rgba(74,46,28,.22);font-size:clamp(28px,4vw,48px);font-weight:900;letter-spacing:.5px;text-shadow:0 3px 0 #542b16}
.subtitle{margin:20px 0 8px;font-weight:800;color:#9b5d36;font-size:18px}
.big-question{font-size:clamp(22px,3vw,32px);font-weight:900;margin:8px 0 18px}
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mode-btn{border:4px solid rgba(255,255,255,.9);border-radius:24px;padding:22px 14px;color:#fff;font-size:clamp(18px,2.2vw,26px);font-weight:900;cursor:pointer;box-shadow:0 9px 0 rgba(80,50,30,.22);transition:.15s transform,.15s filter,.15s outline}
.mode-btn:hover{transform:translateY(-3px);filter:brightness(1.04)}
.mode-btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(80,50,30,.22)}
.mode-btn.odd{background:linear-gradient(135deg,#9b6ee1,#7447b9)}
.mode-btn.even{background:linear-gradient(135deg,#66c878,#349957)}
.mode-btn.selected{outline:6px solid #ffd45d;outline-offset:3px;transform:translateY(-3px)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0 22px}
.setting{background:white;border:3px solid #f0d8aa;border-radius:20px;padding:14px}
.setting b{display:block;margin-bottom:10px;font-size:14px;color:#8a5d3b;text-transform:uppercase;letter-spacing:.7px}
.segment{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg-btn{border:3px solid #e8cf9f;background:#fff8e6;border-radius:14px;padding:10px 14px;min-width:86px;color:#6f4a2f;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #d5b97f}
.seg-btn.active{background:#ffdc6a;border-color:#e9aa2b;box-shadow:0 4px 0 #cc891f;color:#6a3d13}
.play-btn{border:4px solid #fff;border-radius:22px;padding:17px 55px;background:linear-gradient(#72d451,#4bad2e);color:white;font-weight:900;font-size:27px;box-shadow:0 8px 0 #2d7f1b;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.13)}
.play-btn:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed}
.play-btn:not(:disabled):active{transform:translateY(7px);box-shadow:0 1px 0 #2d7f1b}
.setup-note{margin-top:12px;font-size:12px;font-weight:700;color:#9b775a}

/* ---------- Game HUD ---------- */
#game{z-index:25}
.hud{position:absolute;inset:0;z-index:20;pointer-events:none}
.hud>*{pointer-events:auto}
.badge{position:absolute;top:2.3%;background:linear-gradient(#ba7742,#8f4e2a);border:4px solid #6b391f;border-radius:17px;color:#fff;box-shadow:0 7px 0 #5f331c,0 11px 20px rgba(58,33,21,.15);text-shadow:0 2px 0 #5f3219;font-weight:900}
.timer-badge{left:2.5%;padding:11px 18px;font-size:clamp(20px,2.5vw,33px)}
.score-badge{left:clamp(150px,12.5vw,215px);right:auto;padding:11px 22px;font-size:clamp(20px,2.5vw,33px)}
.progress-wrap{position:absolute;top:2.7%;left:20%;right:20%;height:30px;border-radius:30px;background:rgba(255,255,255,.75);border:4px solid rgba(255,255,255,.92);box-shadow:inset 0 3px 8px rgba(0,0,0,.14)}
.progress-bar{height:100%;width:100%;border-radius:25px;background:repeating-linear-gradient(135deg,#66cd5b 0 18px,#57bb4c 18px 36px);transition:width .25s linear}
 .instruction-sign{position:absolute;left:7.2%;bottom:3.3%;top:auto;transform:none;min-width:0;max-width:320px;padding:9px 50px 10px 18px;text-align:left;background:linear-gradient(#b97843,#8d4e29);border:4px solid #67371d;border-radius:14px;color:#fff;font-size:clamp(15px,1.7vw,22px);font-weight:900;box-shadow:0 6px 0 #5f321a;text-shadow:0 2px 0 #4f2915;white-space:nowrap}
 .speak-btn{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:2px solid rgba(255,255,255,.75);border-radius:50%;background:#ffd55f;color:#4f321c;font-size:18px;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #bd8b21;padding:0}
.speak-btn:active{transform:translateY(-44%);box-shadow:0 1px 0 #c99021}
.corner-btn{position:absolute;bottom:3%;width:58px;height:58px;border:4px solid #6f3b20;border-radius:16px;background:linear-gradient(#ba7540,#8d4c27);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 6px 0 #5d3118;cursor:pointer}
#menuBtn{left:2.5%}#soundBtn{right:2.5%}
.corner-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #5d3118}

/* ---------- Mole board ---------- */
.board{position:absolute;z-index:10;left:50%;top:25.5%;transform:translateX(-50%);width:min(1100px,86vw);height:64%;padding:0}
.hole{position:absolute;display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.hole.h1{left:18%;top:22%;width:20%;height:28%}
.hole.h2{left:40%;top:28%;width:20%;height:28%}
.hole.h3{left:67%;top:24%;width:20%;height:28%}
.hole.h4{left:20%;top:58%;width:22%;height:30%}
.hole.h5{left:44%;top:58%;width:22%;height:30%}
.hole.h6{left:69%;top:56%;width:22%;height:30%}
.hole-shadow{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);width:82%;height:23%;border-radius:50%;background:radial-gradient(ellipse at center,#4e2b1d 0 26%,#6f432d 27% 50%,#8a5b3a 51% 65%,#c18b53 66% 77%,transparent 78%);box-shadow:0 8px 10px rgba(78,52,31,.25)}
.hole-rim{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:90%;height:34%;border-radius:50%;background:radial-gradient(ellipse at center,transparent 0 50%,#8e5a34 52% 58%,#b97c49 60% 69%,#d39c62 71% 76%,transparent 78%);z-index:7;pointer-events:none}
.mole-wrap{position:absolute;left:50%;bottom:13%;width:56%;height:72%;transform:translate(-50%,76%);opacity:0;visibility:hidden;transition:transform .28s cubic-bezier(.22,.9,.35,1.18),opacity .14s,visibility 0s linear .28s;z-index:6;cursor:pointer;pointer-events:none}
.mole-wrap.up{transform:translate(-50%,-7%);opacity:1;visibility:visible;transition-delay:0s;pointer-events:auto}
.mole-wrap.hit{transform:translate(-50%,70%) scale(.92);opacity:0;visibility:visible;transition:transform .18s ease-in,opacity .16s ease-in;pointer-events:none}
.mole-wrap.treasure{width:51%;height:54%;bottom:14%}
.number-bubble{position:absolute;left:50%;top:-2%;transform:translate(-50%,-92%);min-width:88px;padding:6px 15px;border-radius:24px;background:linear-gradient(#fffdf0,#f9e9bd);border:3px solid #6c4b33;color:#2d1d15;font-size:clamp(28px,2.8vw,44px);font-weight:900;text-align:center;box-shadow:0 5px 10px rgba(83,52,33,.15);z-index:10;white-space:nowrap}
.number-bubble:after{content:"";position:absolute;left:55%;bottom:-13px;width:20px;height:20px;background:#f9e9bd;border-right:3px solid #6c4b33;border-bottom:3px solid #6c4b33;transform:rotate(45deg)}
.mole{position:absolute;left:50%;bottom:0;width:100%;height:100%;transform:translateX(-50%)}
.body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:84%;height:78%;background:radial-gradient(circle at 45% 20%,#b1704d 0%,#875230 58%,#6f4228 100%);border-radius:48% 48% 42% 42%/52% 52% 35% 35%;box-shadow:inset 0 8px 0 rgba(255,255,255,.11), inset 0 -10px 0 rgba(76,39,19,.22), 0 4px 0 rgba(102,61,33,.22)}
.belly{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);width:54%;height:34%;border-radius:45% 45% 40% 40%;background:radial-gradient(circle at 50% 35%,#f7e3c4,#ecd0ab 70%,#d9b38a 100%)}
.cheek{position:absolute;top:41%;width:11%;height:10%;border-radius:50%;background:#f0ab9b;opacity:.55}.cheek.left{left:18%}.cheek.right{right:18%}
.ear{position:absolute;top:13%;width:20%;height:20%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#b77956,#7f4c2e 75%)}
.ear:after{content:"";position:absolute;inset:25%;border-radius:50%;background:#f3b5a4;opacity:.9}.ear.left{left:7%;transform:rotate(-14deg)}.ear.right{right:7%;transform:rotate(14deg)}
.eye{position:absolute;top:32%;width:12%;height:15%;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(117,83,59,.18)}
.eye:after{content:"";position:absolute;left:34%;top:30%;width:32%;height:38%;border-radius:50%;background:#3b2418;box-shadow:2px 2px 0 #000 inset}
.eye:before{content:"";position:absolute;left:54%;top:34%;width:16%;height:18%;border-radius:50%;background:#fff}.eye.left{left:25%}.eye.right{right:25%}

.gem{width:22%;height:22%;right:8%;bottom:55%}.coin{width:18%;height:18%;left:10%;bottom:58%}
.mole-wrap.treasure .mole,.mole-wrap.treasure .number-bubble,.mole-wrap.treasure .glasses,.mole-wrap.treasure .hat,.mole-wrap.treasure .bow{display:none}

.hole.spawn .dirt{animation:dirtPop .34s ease-out}
@keyframes dirtPop{0%{opacity:0;transform:translate(-50%,0) scale(.4)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px) scale(1.4)}}

/* ---------- Result ---------- */

.result-actions{display:flex;gap:12px;margin-top:18px}.result-actions button{flex:1;border:none;border-radius:18px;padding:14px 10px;color:white;font-weight:900;font-size:16px;cursor:pointer}.again{background:#57b53c;box-shadow:0 6px 0 #347d24}.change{background:#8f5ccf;box-shadow:0 6px 0 #65409a}

}

<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<!-- Ver 4: optimized lightweight background and compact instruction block at bottom-left -->

<div class="scene" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="mesas"><div class="mesa m1"></div><div class="mesa m2"></div><div class="mesa m3"></div><div class="mesa m4"></div></div>
  <div class="distant"></div>
  <div class="ground"></div>
  <div class="rock r1"></div><div class="rock r2"></div><div class="rock r3"></div>
  <div class="grass g1"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="grass g2"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="grass g3"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="grass g4"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="cactus cx1"><i></i></div><div class="cactus cx2"><i></i></div><div class="cactus cx3"><i></i></div>
  <div class="flower f1"></div><div class="flower f2"></div>
 
</div>

<!-- SETUP -->
<section id="setup" class="screen">
  <div class="setup-card">
    <div class="title-sign">WHACK-A-MOLE</div>
    <div class="subtitle">Odd & Even Number Game</div>
    <div class="big-question">What do you want to hit?</div>
    <div class="mode-row">
      <button class="mode-btn odd" data-mode="odd">🟣 HIT ODD NUMBERS</button>
      <button class="mode-btn even" data-mode="even">🟢 HIT EVEN NUMBERS</button>
    </div>

    <div class="settings-grid">
      <div class="setting">
        <b>Number Range</b>
        <div class="segment" id="rangeSegment">
          <button class="seg-btn" data-range="1-10">1–10</button>
          <button class="seg-btn active" data-range="1-20">1–20</button>
          <button class="seg-btn" data-range="7-20">7–20</button>
        </div>
      </div>
      <div class="setting">
        <b>Game Time</b>
        <div class="segment" id="timeSegment">
          <button class="seg-btn" data-time="30">30 sec</button>
          <button class="seg-btn" data-time="45">45 sec</button>
          <button class="seg-btn active" data-time="60">60 sec</button>
        </div>
      </div>
    </div>

    <button class="play-btn" id="playBtn" disabled>PLAY ▶</button>
    <div class="setup-note">Choose ODD or EVEN, then hit the matching moles as fast as you can!</div>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen hidden">
  <div class="hud">
    <div class="badge timer-badge">⏱ <span id="timeText">0:60</span></div>
    <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div class="badge score-badge">⭐ <span id="scoreText">0</span></div>
    <div class="instruction-sign"><span id="instructionText">HIT ODD NUMBERS!</span><button id="speakBtn" class="speak-btn" aria-label="Read instruction">🔊</button></div>
    <button id="menuBtn" class="corner-btn" aria-label="Back to setup">☰</button>
    <button id="soundBtn" class="corner-btn" aria-label="Sound">🔊</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="board" id="board"></div>
  <canvas id="confetti"></canvas>

  <div id="resultOverlay" class="hidden">
    <div class="result-card">
      <h2>GREAT JOB!</h2>
      <div class="stars" id="stars">⭐</div>
      <div class="final-score">⭐ <span id="finalScore">0</span></div>
      <div class="stats">
        <div class="stat">Correct Hits<b id="correctHits">0</b></div>
        <div class="stat">Wrong Hits<b id="wrongHits">0</b></div>
      </div>
      <div class="result-actions">
        <button class="again" id="againBtn">🔄 PLAY AGAIN</button>
        <button class="change" id="changeBtn">⚙️ CHANGE MODE</button>
      </div>
    </div>
  </div>
</section>

<script>
(() => {
  'use strict';

  const setup = document.getElementById('setup');
  const game = document.getElementById('game');
  const playBtn = document.getElementById('playBtn');
  const scoreText = document.getElementById('scoreText');
  const timeText = document.getElementById('timeText');
  const progressBar = document.getElementById('progressBar');
  const instructionText = document.getElementById('instructionText');
  const resultOverlay = document.getElementById('resultOverlay');
  const finalScore = document.getElementById('finalScore');
  const correctHits = document.getElementById('correctHits');
  const wrongHits = document.getElementById('wrongHits');
  const stars = document.getElementById('stars');
  const soundBtn = document.getElementById('soundBtn');
  const toast = document.getElementById('toast');
  const board = document.getElementById('board');

  const state = {
    mode: null,
    range: '1-20',
    duration: 60,
    timeLeft: 60,
    score: 0,
    correct: 0,
    wrong: 0,
    running: false,
    sound: true,
    startedAt: 0,
    endAt: 0,
    lastNumber: null,
    recentNumbers: [],
    timers: new Set(),
    activeCount: 0
  };

  const holes = [];
  for (let i = 0; i < 6; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole h' + (i+1);
    hole.innerHTML = `
      <div class="hole-shadow"></div>
      <div class="dirt"></div>
      <div class="mole-wrap" data-index="${i}">
        <div class="number-bubble">1</div>
        <div class="mole">
          <div class="body"></div><div class="belly"></div>
          <div class="ear left"></div><div class="ear right"></div>
          <div class="eye left"></div><div class="eye right"></div>
          <div class="cheek left"></div><div class="cheek right"></div>
          <div class="snout"></div><div class="nose"></div>
          <div class="whisker w1"></div><div class="whisker w2"></div><div class="whisker w3"></div><div class="whisker w4"></div>
          <div class="mouth"><div class="tooth t1"></div><div class="tooth t2"></div></div>
          <div class="paw left"></div><div class="paw right"></div>
          <div class="glasses"><i></i></div><div class="hat"></div><div class="bow"></div>
        </div>
        <div class="treasure-box">
          <div class="chest-lid"><div class="chest-band"></div><div class="chest-band2"></div></div>
          <div class="chest-base"><div class="chest-band"></div><div class="chest-band2"></div><div class="lock"></div></div>
          <div class="gem"></div><div class="coin"></div>
        </div>
        <div class="hit-mark">✓</div>
      </div>
      <div class="hole-rim"></div>`;
    board.appendChild(hole);
    const wrap = hole.querySelector('.mole-wrap');
    const item = {
      hole,
      wrap,
      bubble: hole.querySelector('.number-bubble'),
      mark: hole.querySelector('.hit-mark'),
      active: false,
      number: null,
      hideTimer: null,
      token: 0,
      kind: 'mole',
      bonus: null
    };
    wrap.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      hitMole(item);
    });
    holes.push(item);
  }

  // ---------- setup controls ----------
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.mode = btn.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(x => x.classList.toggle('selected', x === btn));
      playBtn.disabled = false;
      playTone('select');
    });
  });

  document.querySelectorAll('#rangeSegment .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.range = btn.dataset.range;
      document.querySelectorAll('#rangeSegment .seg-btn').forEach(x => x.classList.toggle('active', x === btn));
      playTone('select');
    });
  });

  document.querySelectorAll('#timeSegment .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.duration = Number(btn.dataset.time);
      document.querySelectorAll('#timeSegment .seg-btn').forEach(x => x.classList.toggle('active', x === btn));
      playTone('select');
    });
  });

  playBtn.addEventListener('click', () => startGame(false));
  document.getElementById('againBtn').addEventListener('click', () => startGame(true));
  document.getElementById('changeBtn').addEventListener('click', goSetup);
  document.getElementById('menuBtn').addEventListener('click', goSetup);
  document.getElementById('speakBtn').addEventListener('click', speakInstruction);
  soundBtn.addEventListener('click', () => {
    state.sound = !state.sound;
    soundBtn.textContent = state.sound ? '🔊' : '🔇';
    if (state.sound) playTone('select');
  });

  // ---------- audio ----------
  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function tone(freq, duration=.12, type='sine', volume=.06, when=0){
    if (!state.sound) return;
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime + when);
    gain.gain.exponentialRampToValueAtTime(volume, audioCtx.currentTime + when + .015);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + when + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + when); osc.stop(audioCtx.currentTime + when + duration + .02);
  }
  function playTone(kind){
    if (!state.sound) return;
    if (kind === 'correct'){tone(660,.12,'triangle',.06);tone(880,.14,'triangle',.055,.08)}
    else if (kind === 'wrong'){tone(220,.18,'sine',.045);tone(170,.18,'sine',.035,.09)}
    else if (kind === 'start'){tone(440,.11,'triangle',.05);tone(660,.11,'triangle',.05,.1);tone(880,.18,'triangle',.05,.2)}
    else if (kind === 'finish'){tone(523,.12,'triangle',.055);tone(659,.12,'triangle',.055,.1);tone(784,.14,'triangle',.06,.2);tone(1046,.25,'triangle',.06,.32)}
    else tone(520,.06,'sine',.03);
  }

  function speakInstruction(){
    if (!state.sound || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const text = state.mode === 'odd' ? 'Hit the odd numbers!' : 'Hit the even numbers!';
    const u = new SpeechSynthesisUtterance(text);
    u.rate = .86; u.pitch = 1.12; u.volume = 1;
    speechSynthesis.speak(u);
  }

  // ---------- game ----------
  function startGame(replay){
    ensureAudio();
    clearAllTimers();
    resultOverlay.classList.add('hidden');
    setup.classList.add('hidden');
    game.classList.remove('hidden');
    state.running = true;
    state.score = 0; state.correct = 0; state.wrong = 0;
    state.timeLeft = state.duration;
    state.startedAt = performance.now();
    state.endAt = state.startedAt + state.duration * 1000;
    state.recentNumbers = [];
    state.activeCount = 0;
    scoreText.textContent = '0';
    instructionText.textContent = state.mode === 'odd' ? 'HIT ODD NUMBERS!' : 'HIT EVEN NUMBERS!';
    holes.forEach(resetHole);
    updateTimeDisplay();
    playTone('start');
    setTimer(() => speakInstruction(), 350);
    tick();
    scheduleWave(300);
  }

  function goSetup(){
    state.running = false;
    clearAllTimers();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    game.classList.add('hidden');
    setup.classList.remove('hidden');
    resultOverlay.classList.add('hidden');
    holes.forEach(resetHole);
  }

  function setTimer(fn, ms){
    const id = setTimeout(() => { state.timers.delete(id); fn(); }, ms);
    state.timers.add(id); return id;
  }
  function clearAllTimers(){
    state.timers.forEach(id => clearTimeout(id));
    state.timers.clear();
    holes.forEach(h => { if (h.hideTimer) clearTimeout(h.hideTimer); h.hideTimer = null; });
  }

  function tick(){
    if (!state.running) return;
    const now = performance.now();
    state.timeLeft = Math.max(0, (state.endAt - now) / 1000);
    updateTimeDisplay();
    if (state.timeLeft <= 0){ endGame(); return; }
    requestAnimationFrame(tick);
  }

  function updateTimeDisplay(){
    const sec = Math.ceil(state.timeLeft);
    timeText.textContent = `0:${String(sec).padStart(2,'0')}`;
    progressBar.style.width = `${Math.max(0, Math.min(100, state.timeLeft / state.duration * 100))}%`;
  }

  function scheduleWave(delay){
    if (!state.running) return;
    setTimer(() => {
      if (!state.running) return;
      const elapsed = state.duration - state.timeLeft;
      const ratio = elapsed / state.duration;
      let count = Math.random() < .46 ? 1 : (Math.random() < .73 ? 2 : 3);
      if (ratio < .18) count = Math.min(count, 2);
      spawnWave(count);
      const next = ratio < .25 ? 900 + Math.random()*420 : ratio < .75 ? 680 + Math.random()*330 : 520 + Math.random()*260;
      scheduleWave(next);
    }, delay);
  }

  function spawnWave(count){
    const room = Math.max(0, 5 - state.activeCount);
    if (!room) return;
    const free = holes.filter(h => !h.active).sort(() => Math.random() - .5);
    free.slice(0, Math.min(count, room)).forEach((h, idx) => setTimer(() => spawnMole(h), idx * 90));
  }

  function spawnMole(h){
    if (!state.running || h.active) return;
    const special = Math.random() < 0.14;
    h.active = true;
    state.activeCount++;
    h.kind = special ? 'treasure' : 'mole';
    h.number = special ? null : nextNumber();
    h.bonus = special ? (Math.random() < 0.58 ? 'star' : 'time') : null;
    h.token++;
    const token = h.token;
    if (special){
      h.bubble.textContent = h.bonus === 'star' ? 'BONUS!' : '+TIME';
    } else {
      h.bubble.textContent = h.number;
    }
    h.mark.className = 'hit-mark';
    h.wrap.className = 'mole-wrap';
    if (special){
      h.wrap.classList.add('treasure');
    } else {
      const r = Math.random();
      if (r < .24) h.wrap.classList.add('variant-glasses');
      else if (r < .42) h.wrap.classList.add('variant-hat');
      else if (r < .58) h.wrap.classList.add('variant-bow');
    }
    h.hole.classList.remove('spawn'); void h.hole.offsetWidth; h.hole.classList.add('spawn');
    requestAnimationFrame(() => h.wrap.classList.add('up'));

    const elapsed = state.duration - state.timeLeft;
    const ratio = elapsed / state.duration;
    const visible = special ? (ratio < .65 ? 2550 : 2200) : (ratio < .25 ? 2550 : ratio < .75 ? 2180 : 1820);
    h.hideTimer = setTimer(() => {
      if (!state.running || h.token !== token) return;
      hideMole(h);
    }, visible + Math.random()*340);
  }

  function nextNumber(){
    let min=1,max=20;
    if (state.range === '1-10'){min=1;max=10}
    if (state.range === '7-20'){min=7;max=20}
    const pool = [];
    for(let n=min;n<=max;n++) pool.push(n);
    const filtered = pool.filter(n => !state.recentNumbers.slice(-2).includes(n));
    const source = filtered.length ? filtered : pool;
    const n = source[Math.floor(Math.random()*source.length)];
    state.recentNumbers.push(n);
    if (state.recentNumbers.length > 5) state.recentNumbers.shift();
    return n;
  }

  function hitMole(h){
    if (!state.running || !h.active) return;
    h.active = false;
    state.activeCount = Math.max(0, state.activeCount - 1);
    if (h.hideTimer) { clearTimeout(h.hideTimer); state.timers.delete(h.hideTimer); h.hideTimer = null; }

    if (h.kind === 'treasure'){
      state.correct++;
      if (h.bonus === 'time'){
        state.endAt += 5000;
        state.timeLeft += 5;
        h.mark.textContent = '⏱';
        showToast('+5 sec!', '#2a7dca');
      } else {
        state.score += 2;
        scoreText.textContent = state.score;
        h.mark.textContent = '⭐';
        showToast('+2 stars!', '#d08a17');
      }
      h.mark.className = 'hit-mark good show';
      playTone('correct');
      h.wrap.classList.add('hit');
      setTimer(() => resetHole(h), 260);
      return;
    }

    const isOdd = h.number % 2 !== 0;
    const correct = (state.mode === 'odd' && isOdd) || (state.mode === 'even' && !isOdd);
    if (correct){
      state.score++; state.correct++;
      h.mark.textContent = '✓'; h.mark.className = 'hit-mark good show';
      playTone('correct');
      showToast('+1 ⭐', '#2d9c45');
    } else {
      state.wrong++;
      h.mark.textContent = '✕'; h.mark.className = 'hit-mark bad show';
      playTone('wrong');
      showToast('Oops!', '#d4483f');
    }
    scoreText.textContent = state.score;
    h.wrap.classList.add('hit');
    setTimer(() => resetHole(h), 250);
  }

  function hideMole(h){
    h.active = false;
    state.activeCount = Math.max(0, state.activeCount - 1);
    h.wrap.classList.remove('up');
    setTimer(() => resetHole(h), 230);
  }

  function resetHole(h){
    h.active = false; h.number = null; h.kind = 'mole'; h.bonus = null;
    h.wrap.className = 'mole-wrap';
    h.mark.className = 'hit-mark';
    h.hole.classList.remove('spawn');
  }

  function showToast(text,color){
    toast.textContent = text; toast.style.color = color;
    toast.classList.add('show');
    setTimer(() => toast.classList.remove('show'), 480);
  }

  function endGame(){
    if (!state.running) return;
    state.running = false;
    clearAllTimers();
    holes.forEach(resetHole);
    finalScore.textContent = state.score;
    correctHits.textContent = state.correct;
    wrongHits.textContent = state.wrong;
    let starCount = state.score >= 15 ? 3 : state.score >= 8 ? 2 : 1;
    stars.textContent = '⭐'.repeat(starCount);
    resultOverlay.classList.remove('hidden');
    playTone('finish');
    if (starCount >= 2) confettiBurst();
  }

  // ---------- lightweight confetti ----------
  const confetti = document.getElementById('confetti');
  const cctx = confetti.getContext('2d');
  let particles = [];
  function resizeCanvas(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    confetti.width = innerWidth * dpr; confetti.height = innerHeight * dpr;
    confetti.style.width = innerWidth+'px'; confetti.style.height = innerHeight+'px';
    cctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();
  function confettiBurst(){
    const colors=['#ff5c5c','#ffd44d','#58c96a','#4db8ff','#9b6ee1','#ff7ab6'];
    particles = [];
    for(let i=0;i<130;i++) particles.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*13,vy:-Math.random()*10-3,g:.16+Math.random()*.12,r:3+Math.random()*4,rot:Math.random()*6,color:colors[i%colors.length],life:1});
    requestAnimationFrame(drawConfetti);
  }
  function drawConfetti(){
    cctx.clearRect(0,0,innerWidth,innerHeight);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=.1;p.life-=.007;cctx.save();cctx.globalAlpha=Math.max(0,p.life);cctx.translate(p.x,p.y);cctx.rotate(p.rot);cctx.fillStyle=p.color;cctx.fillRect(-p.r,-p.r,p.r*2,p.r*1.3);cctx.restore()});
    particles=particles.filter(p=>p.life>0 && p.y<innerHeight+30);
    if(particles.length) requestAnimationFrame(drawConfetti); else cctx.clearRect(0,0,innerWidth,innerHeight);
  }

  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>

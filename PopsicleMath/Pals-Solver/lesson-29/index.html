button{font:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #172554;outline-offset:3px}
.bg-wash{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.04));z-index:0}
.oodles-logo{position:fixed!important;right:18px!important;top:16px!important;z-index:100!important;max-width:126px!important;max-height:64px!important;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(0,0,0,.12))}
.app{position:relative;z-index:5;width:min(1180px,calc(100% - 28px));height:100%;margin:0 auto;padding:14px 0 18px;display:flex;flex-direction:column}
.hud{width:min(770px,calc(100% - 150px));display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.80);backdrop-filter:blur(10px);border:3px solid rgba(255,255,255,.9);border-radius:22px;padding:8px 11px;box-shadow:0 8px 22px rgba(34,83,116,.13);flex:0 0 auto}
.progress-wrap{flex:1;min-width:150px}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:900;color:#607089;margin-bottom:4px}.progress{height:13px;background:#e5edf3;border-radius:999px;overflow:hidden;border:2px solid #d6e1e9}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#95e95d);transition:width .35s ease;border-radius:999px}
.starbox{white-space:nowrap;background:#fff5bd;border:3px solid #f1cc3d;border-radius:15px;padding:5px 10px;font-size:14px;font-weight:900;color:#9a6600;box-shadow:0 4px 0 #e0b934}
.sound-btn{width:40px;height:40px;border:0;border-radius:13px;background:#e8f7ff;color:#0875b6;box-shadow:0 4px 0 #bae5fa;font-size:19px;cursor:pointer}
.screen{display:none;flex:1;min-height:0}.screen.active{display:flex}
.start,.finish{align-items:center;justify-content:center;text-align:center}
.glass-card{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:5px solid rgba(255,255,255,.95);border-radius:34px;box-shadow:var(--shadow)}
.start-box,.finish-box{width:min(690px,94%);padding:24px 26px 28px}.start-mascot,.finish-icon{font-size:68px;line-height:1;animation:bob 2.5s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.start h1,.finish h2{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:10px 0 8px;color:var(--purple)}.finish h2{color:#078ac9}.start p,.finish p{margin:8px auto 20px;max-width:560px;color:var(--muted);font-weight:700;line-height:1.5}
.primary-btn,.secondary-btn,.next-btn{border:0;border-radius:20px;padding:13px 24px;font-weight:900;cursor:pointer;transition:.12s}.primary-btn,.next-btn{background:var(--green);color:white;box-shadow:0 6px 0 var(--greenDark)}.secondary-btn{background:#e7edf2;color:#526174;box-shadow:0 6px 0 #c8d3dc}.primary-btn:active,.secondary-btn:active,.next-btn:active{transform:translateY(5px);box-shadow:none}
.game{align-items:center;justify-content:center;padding:10px 0 0}
.game-shell{width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.question-strip{position:relative;width:min(860px,96%);background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border:4px solid rgba(255,255,255,.96);border-radius:25px;padding:14px 72px 14px 18px;box-shadow:0 12px 26px rgba(32,79,116,.13);text-align:center}
.level-chip{display:inline-block;padding:5px 11px;margin-bottom:5px;border-radius:999px;background:#e9f8ff;border:3px solid #b7e7fb;color:#0876b5;font-size:11px;font-weight:900}.prompt{font-weight:900;font-size:clamp(17px,2.25vw,24px);line-height:1.38;color:#233452}.prompt .name{color:var(--purple)}
.speak{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:var(--blue);color:white;box-shadow:0 5px 0 var(--blueDark);font-size:21px;cursor:pointer}
.items-row{height:clamp(120px,21vh,175px);display:flex;justify-content:center;align-items:center;gap:clamp(22px,6vw,58px);width:100%;position:relative}
.item-visual{width:clamp(110px,16vw,165px);height:100%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 10px 8px rgba(41,84,93,.18))}
.item-visual img{max-width:100%;max-height:100%;object-fit:contain;display:block}.math-sign{font-size:clamp(30px,4vw,48px);font-weight:900;color:#607089;text-shadow:0 2px 0 white}
.cash-visual{width:clamp(110px,16vw,165px);height:clamp(95px,17vh,145px);display:grid;place-items:center;position:relative}.cash-stack{font-size:clamp(65px,9vw,98px);filter:drop-shadow(0 10px 7px rgba(37,89,51,.18))}.cash-amount{position:absolute;bottom:7px;background:#fff6b8;border:3px solid #edca40;border-radius:999px;padding:3px 11px;font-size:clamp(14px,2vw,20px);font-weight:900;color:#916300;box-shadow:0 4px 0 #d9b736}
.bond-zone{width:min(680px,96%);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-2px}
.bond-title{font-size:13px;font-weight:900;color:#624aa9;background:rgba(255,255,255,.76);border:3px solid rgba(255,255,255,.9);border-radius:999px;padding:5px 13px;box-shadow:0 5px 13px rgba(49,71,98,.08);margin-bottom:1px}
.pretty-bond{position:relative;width:250px;height:176px;margin:0 auto;filter:drop-shadow(0 7px 6px rgba(52,77,88,.12))}.bond-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.bond-svg path{fill:none;stroke:#334155;stroke-width:5;stroke-linecap:round}
.pretty-bond .circle{position:absolute;border:4px solid #334155;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:21px;font-weight:900;color:#25334f;width:66px;height:66px;z-index:2}.pretty-bond .circle.top{left:92px;top:0}.pretty-bond .circle.left{left:18px;bottom:0}.pretty-bond .circle.right{right:18px;bottom:0}.pretty-bond .whole{background:#fff5bd;border-color:#d3a72d;color:#875d00}.pretty-bond .part-a{background:#e8f7ff;border-color:#60bfea;color:#0875ad}.pretty-bond .part-b{background:#f2ffe8;border-color:#83cf58;color:#397c20}.pretty-bond .missing{background:#fff0f6;border-color:#ff83b8;color:#a52d65;animation:bondPulse 1.7s ease-in-out infinite}@keyframes bondPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.choice-grid{display:grid;grid-template-columns:repeat(4,minmax(88px,1fr));gap:9px;width:min(520px,95%);margin-top:-1px}.choice{min-height:52px;border:3px solid;border-radius:17px;font-size:clamp(17px,2.2vw,22px);font-weight:900;cursor:pointer;transition:.12s}.choice:nth-child(1){background:#fff0f6;border-color:#ff9ec6;box-shadow:0 5px 0 #ec78aa;color:#a52d65}.choice:nth-child(2){background:#ebfaff;border-color:#8ed9f6;box-shadow:0 5px 0 #64bde1;color:#0876ad}.choice:nth-child(3){background:#f0ffe5;border-color:#99d76d;box-shadow:0 5px 0 #70bd45;color:#397c20}.choice:nth-child(4){background:#fff8d4;border-color:#efd15a;box-shadow:0 5px 0 #d0ad39;color:#8e6700}.choice:active{transform:translateY(4px);box-shadow:none}.choice.correct{background:#eaffdc!important;border-color:#75cf47!important;box-shadow:0 5px 0 #56ad31!important;color:#2d7c1f!important}.choice.wrong{background:#fff0f0!important;border-color:#ff7f7f!important;color:#cf3333!important;animation:shake .32s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:22px;text-align:center;font-size:13px;font-weight:900;color:#288623;margin-top:7px;text-shadow:0 1px 0 white}.feedback.bad{color:#d63838}.next-wrap{height:52px;margin-top:5px;display:flex;align-items:center;justify-content:center}.next-btn{padding:10px 24px;min-width:160px}.finish-next{background:linear-gradient(180deg,#29b4f4,#138ed0);box-shadow:0 6px 0 #0875ad}

<body>
<div class="bg-wash"></div>
<img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div class="app">
  <div class="hud">
    <div class="progress-wrap">
      <div class="progress-meta"><span id="qMeta">Ready!</span><span id="stageMeta">Money Challenge</span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <div class="starbox">⭐ <span id="stars">0</span></div>
    <button class="sound-btn" id="soundBtn" type="button" aria-label="Toggle sound">🔊</button>
  </div>

  <section id="startScreen" class="screen active start">
    <div class="start-box glass-card">
      <div class="start-mascot">🛍️</div>
      <h1>Money Challenge!</h1>
      <p>Help our customers buy yummy treats. Add the prices or find the change with a number bond.</p>
      <button id="playBtn" class="primary-btn" type="button">PLAY NOW 🚀</button>
    </div>
  </section>

  <section id="gameScreen" class="screen game">
    <div class="game-shell">
      <div class="question-strip">
        <div id="levelChip" class="level-chip">Add the money</div>
        <div id="prompt" class="prompt"></div>
        <button id="speakBtn" class="speak" type="button" aria-label="Read question aloud">🔊</button>
      </div>
      <div id="itemsRow" class="items-row"></div>
      <div class="bond-zone">
        <div class="bond-title">NUMBER BOND</div>
        <div id="bondArea"></div>
        <div id="answerArea" class="choice-grid"></div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div id="nextWrap" class="next-wrap"></div>
      </div>
    </div>
  </section>

  <section id="finishScreen" class="screen finish">
    <div class="finish-box glass-card">
      <div class="finish-icon">🎉</div>
      <h2>GREAT JOB!</h2>
      <p>You finished the Money Challenge!</p>
      <div class="final-stars">⭐ <span id="finalStars">0</span> / 10</div>
      <div class="finish-actions">
        <button id="againBtn" class="primary-btn" type="button">PLAY AGAIN 🧁</button>
        <button id="homeBtn" class="secondary-btn" type="button">🏠 HOME</button>
      </div>
    </div>
  </section>
</div>

<div id="miniOverlay" class="mini-overlay" aria-hidden="true">
  <div class="mini-shade"></div>
  <div class="mini-hud">
    <div class="mini-title">🍩 Tap the Treats!</div>
    <div class="mini-pill">⏱️ <span id="miniTime">15</span>s</div>
    <div class="mini-pill">✨ <span id="miniScore">0</span></div>
  </div>
  <div id="miniField" class="mini-field"></div>
  <div class="mini-tip">Tap the falling food and drinks!</div>
</div>
<div id="confetti" class="confetti" aria-hidden="true"></div>

<script>

  let soundOn=true,audioCtx=null,questions=[],qIndex=0,stars=0,perfectQuestion=true,answered=false;
  let miniTimer=null,miniSpawnTimer=null,miniEndResolve=null,miniPoints=0;

  function showScreen(which){screens.forEach(s=>s.classList.remove("active"));which.classList.add("active")}
  function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function distractors(correct,count=4,min=4,max=50){const set=new Set([correct]);for(const off of [-1,1,-2,2,-3,3,-5,5,10,-10]){const v=correct+off;if(v>=min&&v<=max)set.add(v);if(set.size>=count)break}while(set.size<count)set.add(Math.floor(Math.random()*(max-min+1))+min);return shuffle([...set]).slice(0,count)}
  function buildQuestions(){
    const operations=["add","add","add","sub","sub","add","add","sub","add","sub"],usedAdd=new Set(),usedSub=new Set(),qs=[],subPeople=["Jane","Xavier","Mia","Ben","Amy","Tom"];
    operations.forEach((operation,idx)=>{
      if(operation==="add"){let a,b,key,tries=0;do{a=products[Math.floor(Math.random()*products.length)];b=products[Math.floor(Math.random()*products.length)];if(a.id===b.id){tries++;continue}key=[a.id,b.id].sort().join("|");tries++}while((a.id===b.id||usedAdd.has(key)||a.price+b.price>40)&&tries<500);usedAdd.add(key);const answer=a.price+b.price;qs.push({operation,p1:a,p2:b,answer,whole:answer,part1:a.price,part2:b.price,person:people[Math.floor(Math.random()*people.length)]})}
      else{let p,wallet,key,allowed,tries=0;do{p=products[Math.floor(Math.random()*products.length)];allowed=[30,40,50].filter(w=>w-p.price>=8&&w-p.price<=35);wallet=allowed[Math.floor(Math.random()*allowed.length)];key=`${p.id}|${wallet}`;tries++}while((!wallet||usedSub.has(key))&&tries<500);usedSub.add(key);const answer=wallet-p.price;qs.push({operation,p1:p,wallet,answer,whole:wallet,part1:p.price,part2:answer,person:subPeople[idx%subPeople.length]})}
    });return qs
  }
  function sound(freq=440,duration=.12,type="sine",gain=.05,delay=0){if(!soundOn)return;try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.03)}catch(e){}}
  const sfxCorrect=()=>{sound(660,.1,"triangle",.05);sound(880,.14,"triangle",.045,.08)};const sfxWrong=()=>sound(180,.18,"sawtooth",.035);const sfxCoin=()=>{sound(880,.08,"sine",.04);sound(1174,.11,"sine",.035,.08)};const sfxWin=()=>[523,659,784,1046].forEach((f,i)=>sound(f,.15,"triangle",.045,i*.12));
  function wrong(msg="Try again!"){perfectQuestion=false;feedback.textContent=msg;feedback.className="feedback bad";sfxWrong()}
  function good(msg="Great!"){feedback.textContent=msg;feedback.className="feedback";sfxCorrect()}
  function current(){return questions[qIndex]}
  function storyText(q){return q.operation==="sub"?`${q.person} buys ${q.p1.phrase} for $${q.p1.price}. ${q.person} has $${q.wallet}. How much change does ${q.person} get?`:`${q.person} buys ${q.p1.phrase} for $${q.p1.price} and ${q.p2.phrase} for $${q.p2.price}. How much does ${q.person} spend altogether?`}
  function renderItems(q){
    if(q.operation==="add")itemsRow.innerHTML=`<div class="item-visual"><img src="${q.p1.img}" alt="${q.p1.name}"></div><div class="math-sign">+</div><div class="item-visual"><img src="${q.p2.img}" alt="${q.p2.name}"></div>`;
    else itemsRow.innerHTML=`<div class="item-visual"><img src="${q.p1.img}" alt="${q.p1.name}"></div><div class="math-sign">←</div><div class="cash-visual"><div class="cash-stack">💵</div><div class="cash-amount">$${q.wallet}</div></div>`;
  }
  function bondMarkup(q){if(q.operation==="sub")return `<div class="pretty-bond"><svg class="bond-svg" viewBox="0 0 250 176" aria-hidden="true"><path d="M125 66 C108 86 84 101 51 121"></path><path d="M125 66 C142 86 166 101 199 121"></path></svg><div class="circle top whole">${q.whole}</div><div class="circle left part-a">${q.part1}</div><div class="circle right part-b missing">?</div></div>`;return `<div class="pretty-bond"><svg class="bond-svg" viewBox="0 0 250 176" aria-hidden="true"><path d="M125 66 C108 86 84 101 51 121"></path><path d="M125 66 C142 86 166 101 199 121"></path></svg><div class="circle top whole missing">?</div><div class="circle left part-a">${q.part1}</div><div class="circle right part-b">${q.part2}</div></div>`}
  function updateHud(){qMeta.textContent=`Question ${qIndex+1} / 10`;progressBar.style.width=`${(qIndex/10)*100}%`;stageMeta.textContent=current()?.operation==="sub"?"Find the change":"Add the money"}
  function renderQuestion(){
    const q=current();perfectQuestion=true;answered=false;feedback.textContent="";feedback.className="feedback";nextWrap.innerHTML="";updateHud();
    levelChip.textContent=q.operation==="sub"?"Find the change":"Add the money";
    if(q.operation==="sub")promptEl.innerHTML=`<span class="name">${q.person}</span> buys ${q.p1.phrase} for <b>$${q.p1.price}</b> and has <b>$${q.wallet}</b>.<br>How much change does ${q.person} get?`;
    else promptEl.innerHTML=`<span class="name">${q.person}</span> buys ${q.p1.phrase} for <b>$${q.p1.price}</b> and ${q.p2.phrase} for <b>$${q.p2.price}</b>.<br>How much altogether?`;
    renderItems(q);bondArea.innerHTML=bondMarkup(q);answerArea.innerHTML=distractors(q.answer,4,4,50).map(v=>`<button class="choice" type="button" data-v="${v}">$${v}</button>`).join("");
    answerArea.querySelectorAll(".choice").forEach(btn=>btn.addEventListener("click",()=>checkAnswer(btn,q)));
    setTimeout(()=>speakQuestion(),380)
  }
  function checkAnswer(btn,q){if(answered)return;const v=Number(btn.dataset.v);if(v!==q.answer){btn.classList.add("wrong");wrong(q.operation==="sub"?"Find the missing part. Try again!":"Add the two parts. Try again!");setTimeout(()=>btn.classList.remove("wrong"),430);return}answered=true;btn.classList.add("correct");answerArea.querySelectorAll(".choice").forEach(b=>b.disabled=true);const missing=bondArea.querySelector(".missing");if(missing)missing.textContent=q.answer;if(perfectQuestion){stars++;starsEl.textContent=stars}progressBar.style.width=`${((qIndex+1)/10)*100}%`;sfxCoin();coinPop();good(q.operation==="sub"?"You found the change!":"You found the total!");showNextButton()}
  function showNextButton(){const isLast=qIndex===questions.length-1;const b=document.createElement("button");b.className="next-btn"+(isLast?" finish-next":" ");b.textContent=isLast?"FINISH 🎉":"NEXT ➜";b.addEventListener("click",async()=>{b.disabled=true;const completed=qIndex+1;if(completed%2===0)await runMiniGame();if(isLast)finishGame();else{qIndex++;renderQuestion()}});nextWrap.appendChild(b)}
  function startGame(){questions=buildQuestions();qIndex=0;stars=0;starsEl.textContent="0";progressBar.style.width="0%";showScreen($("#gameScreen"));renderQuestion()}
  function finishGame(){progressBar.style.width="100%";qMeta.textContent="10 / 10";stageMeta.textContent="Complete!";finalStars.textContent=stars;showScreen($("#finishScreen"));sfxWin();burstConfetti()}
  function speakQuestion(){const q=current();if(!q||!soundOn||!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(storyText(q));u.lang="en-US";u.rate=.88;u.pitch=1.03;window.speechSynthesis.speak(u)}
  function coinPop(){const el=document.createElement("div");el.className="coin-pop";el.textContent="🪙";document.body.appendChild(el);setTimeout(()=>el.remove(),760)}
  function burstConfetti(){const box=$("#confetti");box.innerHTML="";const colors=["#58cc02","#1cb0f6","#ff4b4b","#ffc800","#9b6cff","#ff6fae"];for(let i=0;i<90;i++){const c=document.createElement("i");c.style.left=Math.random()*100+"%";c.style.top=(-10-Math.random()*40)+"px";c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.animationDelay=(Math.random()*.6)+"s";c.style.animationDuration=(1.2+Math.random()*1.2)+"s";box.appendChild(c)}setTimeout(()=>box.innerHTML="",2700)}
  function spawnMiniItem(){if(!miniOverlay.classList.contains("active"))return;const p=products[Math.floor(Math.random()*products.length)],btn=document.createElement("button");btn.className="falling-item";btn.type="button";btn.style.left=(3+Math.random()*88)+"%";btn.style.setProperty("--r0",(-18+Math.random()*36)+"deg");btn.style.setProperty("--r1",(-160+Math.random()*320)+"deg");btn.style.animationDuration=(3.6+Math.random()*2.2)+"s";btn.innerHTML=`<img src="${p.img}" alt="${p.name}">`;btn.addEventListener("click",e=>{e.preventDefault();if(btn.classList.contains("pop"))return;miniPoints++;miniScore.textContent=miniPoints;btn.classList.add("pop");sfxCoin();setTimeout(()=>btn.remove(),190)});btn.addEventListener("animationend",()=>btn.remove());miniField.appendChild(btn)}
  function runMiniGame(){return new Promise(resolve=>{miniEndResolve=resolve;miniPoints=0;miniScore.textContent="0";miniTime.textContent="15";miniField.innerHTML="";miniOverlay.classList.add("active");miniOverlay.setAttribute("aria-hidden","false");if("speechSynthesis" in window)window.speechSynthesis.cancel();let remaining=15;for(let i=0;i<5;i++)setTimeout(spawnMiniItem,i*120);miniSpawnTimer=setInterval(spawnMiniItem,390);miniTimer=setInterval(()=>{remaining--;miniTime.textContent=remaining;if(remaining<=0)endMiniGame()},1000)})}
  function endMiniGame(){clearInterval(miniTimer);clearInterval(miniSpawnTimer);miniTimer=miniSpawnTimer=null;miniOverlay.classList.remove("active");miniOverlay.setAttribute("aria-hidden","true");miniField.innerHTML="";const done=miniEndResolve;miniEndResolve=null;if(done)done()}
  $("#playBtn").addEventListener("click",startGame);$("#againBtn").addEventListener("click",startGame);$("#homeBtn").addEventListener("click",()=>{showScreen($("#startScreen"));progressBar.style.width="0%";qMeta.textContent="Ready!";stageMeta.textContent="Money Challenge";starsEl.textContent="0"});$("#speakBtn").addEventListener("click",speakQuestion);$("#soundBtn").addEventListener("click",()=>{soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"🔊":"🔇";if(!soundOn&&"speechSynthesis" in window)window.speechSynthesis.cancel()});
})();
</script>
</body>
</html>

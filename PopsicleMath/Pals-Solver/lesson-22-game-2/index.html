.brand-icon{font-size:31px;line-height:1}
.brand-title{font-size:18px;font-weight:900;line-height:1.05;color:#295e8a}.brand-sub{font-size:11px;font-weight:800;color:#7d95aa;margin-top:3px}
.round-track{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.9);border:3px solid #fff;border-radius:999px;padding:7px 10px;box-shadow:0 7px 20px rgba(31,79,115,.14)}
.round-pill{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:900;color:#8799a8;background:#edf3f7;white-space:nowrap}.round-pill.active{color:#fff;background:var(--blue)}.round-pill.done{color:#fff;background:var(--green)}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.panel{width:min(1040px,96vw);max-height:calc(100vh - 105px);overflow:auto;background:rgba(255,255,255,.91);border:4px solid rgba(255,255,255,.98);border-radius:30px;box-shadow:var(--shadow);padding:22px 24px;backdrop-filter:blur(5px);scrollbar-width:thin}
.panel.center{text-align:center}
.hero-icon{font-size:76px;filter:drop-shadow(0 9px 8px rgba(44,89,120,.14));animation:bob 2.5s ease-in-out infinite}.hero-title{font-size:clamp(34px,5vw,58px);line-height:1.02;margin:5px 0 0;font-weight:900;color:#287cb8;text-shadow:0 3px 0 rgba(255,255,255,.95)}
.hero-sub{font-size:clamp(19px,2.3vw,28px);font-weight:900;color:#ff6f9f;margin:7px 0 16px}.hero-note{max-width:650px;margin:0 auto 18px;font-size:15px;line-height:1.55;font-weight:700;color:#59758c}
.topic-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:650px;margin:0 auto 20px}.topic-card{border:3px solid #fff;border-radius:22px;padding:15px;background:#f8fbff;box-shadow:0 7px 0 #d9e8f2;font-weight:900;color:#345f7d}.topic-card span{font-size:31px;display:block;margin-bottom:2px}
.btn{border:0;border-radius:18px;padding:13px 24px;font-weight:900;cursor:pointer;transition:.12s transform,.12s box-shadow,.12s filter;min-width:150px}.btn:hover{filter:brightness(1.04);transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:none!important}.btn.primary{color:#fff;background:var(--blue);box-shadow:0 6px 0 var(--blue2)}.btn.green{color:#fff;background:var(--green);box-shadow:0 6px 0 var(--green2)}.btn.ghost{color:#567187;background:#edf4f8;box-shadow:0 6px 0 #cfdee7}.btn.pink{color:#fff;background:var(--pink);box-shadow:0 6px 0 #db477c}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.round-title{margin:0;font-size:clamp(24px,3vw,36px);font-weight:900;color:#287cb8}.part-chip{font-size:12px;font-weight:900;color:#805d00;background:#fff4b5;border:2px solid #ffd85a;border-radius:999px;padding:7px 12px;white-space:nowrap}
.instruction{margin:0 0 14px;font-size:20px;font-weight:900;color:#405f77;text-align:center}.instruction.small{font-size:16px;color:#6b8395;font-weight:800}.micro{font-size:12px;color:#7b92a4;font-weight:700;text-align:center;margin-top:6px}
.order-layout{display:grid;grid-template-columns:1fr;gap:13px}.bank{min-height:80px;border:3px dashed #b9d9ea;background:rgba(241,249,253,.82);border-radius:22px;padding:11px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:9px}.bank-label{width:100%;text-align:center;font-size:11px;font-weight:900;color:#7894a8;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.word-card{border:3px solid #fff;border-radius:15px;padding:9px 12px;min-height:48px;background:linear-gradient(180deg,#fff,#f4faff);box-shadow:0 5px 0 #cfe2ed;font-size:14px;font-weight:900;color:#315c78;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:grab;transition:.15s transform,.15s box-shadow,.15s opacity;user-select:none}.word-card:hover{transform:translateY(-2px)}.word-card.selected{outline:4px solid rgba(255,111,159,.32);transform:translateY(-3px);box-shadow:0 6px 0 #f7a8c3}.word-card.dragging{opacity:.45}.speak-mini{border:0;background:#e5f5ff;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:13px;cursor:pointer;padding:0;flex:0 0 25px}
.slots{display:grid;gap:9px}.slots.days{grid-template-columns:repeat(7,minmax(0,1fr))}.slots.months{grid-template-columns:repeat(6,minmax(0,1fr))}.slot{min-height:76px;border:3px dashed #bed6e4;background:rgba(255,255,255,.78);border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;position:relative;transition:.15s background,.15s border-color}.slot.over{background:#e5f7ff;border-color:var(--blue)}.slot-num{position:absolute;top:5px;left:8px;font-size:10px;font-weight:900;color:#9aafbd}.slot .word-card{width:100%;min-height:51px;font-size:clamp(10px,1.05vw,13px);padding:7px 4px}.slot-empty{font-size:22px;color:#c0d2dc;font-weight:900}.actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}.feedback{min-height:28px;text-align:center;font-weight:900;font-size:18px;margin-top:8px}.feedback.good{color:#31a744}.feedback.bad{color:#e15b63}
.quiz-card{max-width:790px;margin:2px auto 0;background:rgba(247,252,255,.87);border:3px solid #d9edf8;border-radius:26px;padding:20px}.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}.quiz-progress{font-size:13px;font-weight:900;color:#6e8799;background:#fff;border:2px solid #dcebf3;border-radius:999px;padding:7px 11px}.listen-wrap{text-align:center}.speaker-big{width:84px;height:84px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 7px 0 var(--blue2);transition:.12s;animation:pulse 2s ease-in-out infinite}.speaker-big:active{transform:translateY(6px);box-shadow:none}.speaker-caption{font-size:12px;font-weight:800;color:#6e8799;margin-top:9px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.choice{min-height:72px;border:3px solid #d9e8f1;border-radius:18px;background:#fff;box-shadow:0 6px 0 #d7e4ec;font-size:clamp(17px,2vw,23px);font-weight:900;color:#315c78;cursor:pointer;transition:.12s}.choice:hover{transform:translateY(-2px);border-color:#bddcec}.choice.correct{background:#e8f9e7;border-color:#6ad65e;color:#2f9738;box-shadow:0 6px 0 #95d98c}.choice.wrong{background:#fff0f0;border-color:#f28d93;color:#c94852;box-shadow:0 6px 0 #f4b6ba}.choice:disabled{cursor:default}
.complete-icon{font-size:74px;animation:bob 2s ease-in-out infinite}.complete-title{font-size:clamp(32px,4vw,48px);margin:6px 0 5px;color:#2b8ec8;font-weight:900}.complete-text{font-size:17px;font-weight:800;color:#678194;margin-bottom:20px}.stars{font-size:34px;letter-spacing:5px;margin:6px 0 18px}
.final-badges{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 20px}.final-badge{padding:11px 16px;border-radius:16px;background:#f4fbff;border:3px solid #d9edf7;font-size:14px;font-weight:900;color:#3c6d8c}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.confetti-piece{position:absolute;top:-25px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards;opacity:.95}
@keyframes fall{to{transform:translate3d(var(--drift),105vh,0) rotate(760deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media(max-width:900px){.slots.days{grid-template-columns:repeat(4,1fr)}.slots.months{grid-template-columns:repeat(4,1fr)}.panel{padding:18px}.topbar{height:60px}.brand{padding:7px 10px}.brand-sub{display:none}.round-pill{padding:6px 9px}.slot{min-height:70px}}
@media(max-width:620px){#app{padding:8px}.topbar{height:54px}.brand-title{font-size:14px}.brand-icon{font-size:24px}.round-pill{font-size:10px}.panel{width:98vw;border-radius:24px;padding:14px;max-height:calc(100vh - 72px)}.topic-row{grid-template-columns:1fr}.slots.days,.slots.months{grid-template-columns:repeat(3,1fr)}.choices{grid-template-columns:1fr}.head-row{align-items:flex-start}.part-chip{font-size:10px}.instruction{font-size:17px}.word-card{font-size:12px}.slot .word-card{font-size:10px}}
</style>
</head>
<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div id="veil"></div>
<div id="confetti"></div>
<div id="app">
  <div class="topbar">
    <div class="brand"><div class="brand-icon">📅</div><div><div class="brand-title">Calendar Adventure</div><div class="brand-sub">Days & Months</div></div></div>
    <div class="round-track" aria-label="game progress"><div id="pill1" class="round-pill">Round 1</div><div id="pill2" class="round-pill">Round 2</div></div>
  </div>
  <div class="stage-wrap"><main id="panel" class="panel center"></main></div>
</div>
<script>
(()=>{
'use strict';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const panel=document.getElementById('panel'), pill1=document.getElementById('pill1'), pill2=document.getElementById('pill2');
let state={screen:'home',round:0,part:'',selected:null,slots:[],bank:[],quizTargets:[],quizIndex:0,locked:false};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const escapeHtml=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setPills(round=0,done1=false,done2=false){pill1.className='round-pill'+(round===1?' active':done1?' done':'');pill2.className='round-pill'+(round===2?' active':done2?' done':'')}
function tone(ok=true){try{const AC=window.AudioContext||window.webkitAudioContext;const c=new AC();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?660:220,c.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.16);g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.start();o.stop(c.currentTime+.23);setTimeout(()=>c.close(),350)}catch(e){}}
function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=1.05;const voices=speechSynthesis.getVoices();const v=voices.find(v=>/^en(-|_)/i.test(v.lang)&&/female|samantha|zira|google/i.test(v.name))||voices.find(v=>/^en(-|_)/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function confetti(n=70){const box=document.getElementById('confetti'),colors=['#ff6f9f','#ffd85a','#5fcf49','#2596e8','#8d6be8','#ff9a4a'];for(let i=0;i<n;i++){const p=document.createElement('i');p.className='confetti-piece';p.style.left=Math.random()*100+'vw';p.style.background=colors[i%colors.length];p.style.setProperty('--drift',(Math.random()*220-110)+'px');p.style.animationDuration=(1.7+Math.random()*1.7)+'s';p.style.animationDelay=(Math.random()*.35)+'s';box.appendChild(p);setTimeout(()=>p.remove(),3800)}}
function home(){state={screen:'home',round:0,part:'',selected:null,slots:[],bank:[],quizTargets:[],quizIndex:0,locked:false};setPills();panel.className='panel center';panel.innerHTML=`<div class="hero-icon">🗓️</div><h1 class="hero-title">Calendar Adventure</h1><div class="hero-sub">Days & Months</div><p class="hero-note">Listen, arrange the words, and choose the right answer. Ready for a calendar adventure?</p><div class="topic-row"><div class="topic-card"><span>📆</span>Days of the Week</div><div class="topic-card"><span>🗓️</span>Months of the Year</div></div><button id="startBtn" class="btn primary">START</button>`;document.getElementById('startBtn').onclick=()=>startRound(1)}
function startRound(round){state.round=round;state.part='order';state.selected=null;const list=round===1?DAYS:MONTHS;state.slots=Array(list.length).fill(null);state.bank=shuffle(list);state.locked=false;setPills(round,round===2,false);renderOrder()}
function renderOrder(msg='',kind=''){panel.className='panel';const list=state.round===1?DAYS:MONTHS;const label=state.round===1?'Days of the Week':'Months of the Year';const gridClass=state.round===1?'days':'months';panel.innerHTML=`<div class="head-row"><h2 class="round-title">Round ${state.round}: ${label}</h2><div class="part-chip">Part A • Put in order</div></div><p class="instruction">Put the ${state.round===1?'days':'months'} in order!</p><div class="order-layout"><div id="bank" class="bank" aria-label="word bank"><div class="bank-label">Word Bank</div>${state.bank.map(cardHtml).join('')}</div><div id="slots" class="slots ${gridClass}">${state.slots.map((w,i)=>slotHtml(w,i)).join('')}</div></div><div class="micro">Drag the cards, or tap a card and then tap a numbered place.</div><div id="feedback" class="feedback ${kind}">${msg}</div><div class="actions"><button id="resetBtn" class="btn ghost">RESET</button><button id="checkBtn" class="btn green">CHECK</button></div>`;bindOrderEvents()}
function cardHtml(word){return `<div class="word-card${state.selected===word?' selected':''}" draggable="true" tabindex="0" data-word="${escapeHtml(word)}"><span>${escapeHtml(word)}</span><button class="speak-mini" type="button" aria-label="Hear ${escapeHtml(word)}" data-speak="${escapeHtml(word)}">🔊</button></div>`}
function slotHtml(word,i){return `<div class="slot" tabindex="0" data-index="${i}"><span class="slot-num">${i+1}</span>${word?cardHtml(word):'<span class="slot-empty">•</span>'}</div>`}
function bindOrderEvents(){document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.speak)});document.querySelectorAll('.word-card').forEach(c=>{c.addEventListener('click',e=>{if(e.target.closest('[data-speak]'))return;e.stopPropagation();const host=c.closest('.slot');if(host&&state.selected&&state.selected!==c.dataset.word){placeWord(state.selected,+host.dataset.index)}else{selectCard(c.dataset.word)}});c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const host=c.closest('.slot');if(host&&state.selected&&state.selected!==c.dataset.word){placeWord(state.selected,+host.dataset.index)}else{selectCard(c.dataset.word)}}});c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.word);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});c.addEventListener('dragend',()=>c.classList.remove('dragging'))});document.querySelectorAll('.slot').forEach(s=>{s.onclick=e=>{if(e.target.closest('[data-speak]'))return;slotClick(+s.dataset.index)};s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});s.addEventListener('dragleave',()=>s.classList.remove('over'));s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');placeWord(e.dataTransfer.getData('text/plain'),+s.dataset.index)})});const bank=document.getElementById('bank');bank.addEventListener('dragover',e=>e.preventDefault());bank.addEventListener('drop',e=>{e.preventDefault();returnToBank(e.dataTransfer.getData('text/plain'))});document.getElementById('resetBtn').onclick=()=>{const list=state.round===1?DAYS:MONTHS;state.slots=Array(list.length).fill(null);state.bank=shuffle(list);state.selected=null;renderOrder()};document.getElementById('checkBtn').onclick=checkOrder}
function selectCard(word){state.selected=state.selected===word?null:word;renderOrder()}
function slotClick(idx){const current=state.slots[idx];if(state.selected){placeWord(state.selected,idx)}else if(current){state.slots[idx]=null;if(!state.bank.includes(current))state.bank.push(current);state.selected=current;renderOrder()}}
function placeWord(word,idx){if(!word)return;const oldIdx=state.slots.indexOf(word);if(oldIdx>=0)state.slots[oldIdx]=null;state.bank=state.bank.filter(x=>x!==word);const displaced=state.slots[idx];state.slots[idx]=word;if(displaced&&displaced!==word&&!state.bank.includes(displaced))state.bank.push(displaced);state.selected=null;renderOrder()}
function returnToBank(word){if(!word)return;const idx=state.slots.indexOf(word);if(idx>=0)state.slots[idx]=null;if(!state.bank.includes(word))state.bank.push(word);state.selected=null;renderOrder()}
function checkOrder(){const answer=state.round===1?DAYS:MONTHS;if(state.slots.some(x=>!x)){tone(false);renderOrder('Fill every numbered place first.','bad');return}const ok=state.slots.every((x,i)=>x===answer[i]);if(ok){tone(true);confetti(45);renderOrder('Great job!','good');setTimeout(startQuiz,850)}else{tone(false);renderOrder('Try again!','bad')}}
function startQuiz(){state.part='quiz';const list=state.round===1?DAYS:MONTHS;state.quizTargets=shuffle(list).slice(0,5);state.quizIndex=0;state.locked=false;renderQuiz();setTimeout(()=>speak(state.quizTargets[0]),450)}
function renderQuiz(feedback='',kind='',selected=''){const list=state.round===1?DAYS:MONTHS,target=state.quizTargets[state.quizIndex];const label=state.round===1?'Days of the Week':'Months of the Year';if(!state.currentOptions||state.currentOptionsTarget!==target){state.currentOptions=makeOptions(target,list);state.currentOptionsTarget=target}const opts=state.currentOptions;panel.className='panel';panel.innerHTML=`<div class="head-row"><h2 class="round-title">Round ${state.round}: ${label}</h2><div class="part-chip">Part B • Listen & choose</div></div><p class="instruction">Listen and choose.</p><div class="quiz-card"><div class="quiz-top"><span class="instruction small">Which word do you hear?</span><span class="quiz-progress">${state.quizIndex+1} / 5</span></div><div class="listen-wrap"><button id="speakerBtn" class="speaker-big" aria-label="Play the word">🔊</button><div class="speaker-caption">Tap to hear it again</div></div><div class="choices">${opts.map(o=>`<button class="choice${selected===o?' '+kind:''}" data-choice="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div><div id="quizFeedback" class="feedback ${kind==='correct'?'good':kind==='wrong'?'bad':''}">${feedback}</div></div>`;document.getElementById('speakerBtn').onclick=()=>speak(target);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.choice))}
function makeOptions(target,list){const others=shuffle(list.filter(x=>x!==target)).slice(0,3);return shuffle([target,...others])}
function answerQuiz(choice){if(state.locked)return;const target=state.quizTargets[state.quizIndex];if(choice===target){state.locked=true;tone(true);renderQuiz('Great!','correct',choice);setTimeout(()=>{state.quizIndex++;state.locked=false;state.currentOptions=null;state.currentOptionsTarget=null;if(state.quizIndex>=5)roundComplete();else{renderQuiz();setTimeout(()=>speak(state.quizTargets[state.quizIndex]),380)}},780)}else{tone(false);renderQuiz('Try again!','wrong',choice);setTimeout(()=>{renderQuiz();setTimeout(()=>speak(target),220)},650)}}
function roundComplete(){tone(true);confetti(90);panel.className='panel center';const next=state.round===1;setPills(next?1:2,true,!next);panel.innerHTML=`<div class="complete-icon">${next?'🌟':'🎉'}</div><h2 class="complete-title">Round ${state.round} Complete!</h2><div class="stars">⭐ ⭐ ⭐</div><p class="complete-text">${next?'Great work with the days of the week!':'Great work with the months of the year!'}</p><button id="nextBtn" class="btn ${next?'primary':'pink'}">${next?'NEXT ROUND':'FINISH'}</button>`;document.getElementById('nextBtn').onclick=()=>next?startRound(2):finalScreen()}
function finalScreen(){setPills(0,true,true);confetti(130);panel.className='panel center';panel.innerHTML=`<div class="complete-icon">🏆</div><h1 class="complete-title">Amazing!</h1><p class="complete-text">You know your days and months!</p><div class="final-badges"><div class="final-badge">⭐ Days of the Week</div><div class="final-badge">⭐ Months of the Year</div></div><div class="actions"><button id="againBtn" class="btn green">PLAY AGAIN</button><button id="homeBtn" class="btn ghost">HOME</button></div>`;document.getElementById('againBtn').onclick=()=>startRound(1);document.getElementById('homeBtn').onclick=home}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
home();
})();
</script>
</body>
</html>

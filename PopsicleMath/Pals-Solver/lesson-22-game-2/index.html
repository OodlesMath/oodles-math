<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Picture Graph Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap');

        :root {
            /* Duolingo-inspired color palette */
            --bg-color: #fdf5e6;
            --primary: #1cb0f6; /* Bright Blue */
            --primary-shadow: #1899d6;
            --success: #58cc02; /* Green */
            --success-shadow: #58a700;
            --error: #ff4b4b;   /* Red */
            --error-shadow: #ea1515;
            --warning: #ffc800; /* Yellow */
            --warning-shadow: #d4a600;
            --text-main: #4b4b4b;
            --text-light: #ffffff;
            
            /* UPDATED: Light sky blue background for cards/blocks */
            --card-bg: #e0f2fe; 
            
            --border-color: #e5e5e5;
            
            /* Graph Colors from Image Reference */
            --col-0: #ff3b3b; /* Red */
            --col-1: #ffc800; /* Yellow */
            --col-2: #b265ff; /* Purple */
            --col-3: #58cc02; /* Green */
            --col-4: #1cb0f6; /* Blue */
            
            --cell-empty: #f1f5f9; 
            --axis-color: #475569;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            
            /* Yellow background with math pattern */
            background-color: var(--bg-color); 
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 20 l10 0 M25 15 l0 10' stroke='%23ffb8b8' stroke-width='4'/%3E%3Cpath d='M80 30 l10 0' stroke='%23b8e4ff' stroke-width='4'/%3E%3Cpath d='M30 80 l10 10 M30 90 l10 -10' stroke='%23ffe0b2' stroke-width='4'/%3E%3Ccircle cx='90' cy='85' r='3' fill='%23bdf4c8'/%3E%3Ccircle cx='90' cy='95' r='3' fill='%23bdf4c8'/%3E%3Cpath d='M85 90 l10 0' stroke='%23bdf4c8' stroke-width='4'/%3E%3Ctext x='55' y='65' fill='%23e0e0e0' font-family='Poppins, sans-serif' font-size='24' font-weight='bold' stroke='none'%3E%3D%3C/text%3E%3Ctext x='100' y='20' fill='%23ffb8b8' font-family='Poppins, sans-serif' font-size='18' font-weight='bold' stroke='none'%3E1%3C/text%3E%3Ctext x='15' y='110' fill='%23b8e4ff' font-family='Poppins, sans-serif' font-size='18' font-weight='bold' stroke='none'%3E2%3C/text%3E%3Ctext x='50' y='110' fill='%23ffe0b2' font-family='Poppins, sans-serif' font-size='22' font-weight='bold' stroke='none'%3E3%3C/text%3E%3C/g%3E%3C/svg%3E");
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #app-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .logo-space-placeholder {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 100px;
            height: 50px;
            z-index: 999;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid var(--border-color);
            border-bottom: 6px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-title h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .header-title p {
            margin: 0;
            font-size: 0.9rem;
            color: #7ba2c6;
            font-weight: 800;
            text-transform: uppercase;
        }

        .stats-area {
            display: flex;
            gap: 10px;
            align-items: center;
            font-weight: 800;
            font-size: 1.2rem;
            margin-right: 100px; 
        }

        .star-score {
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 5px;
            background: #ffffff;
            padding: 5px 12px;
            border-radius: 12px;
            border: 2px solid #ffeca8;
            box-shadow: 0 4px 0 #ffeca8;
        }

        .audio-btn {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-bottom: 4px solid var(--border-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 12px;
            transition: all 0.1s;
        }
        
        .audio-btn:active {
            transform: translateY(2px);
            border-bottom: 2px solid var(--border-color);
        }

        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 15px;
            flex-direction: column;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-shrink: 0;
        }

        .graph-panel {
            flex: 1;
            min-height: 0;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px 20px;
            border: 2px solid var(--border-color);
            border-bottom: 6px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) and (orientation: landscape) {
            .main-content {
                flex-direction: row;
            }
            .side-panel {
                /* UPDATED: Allowed side panel to stretch more so table fits comfortably */
                width: 55%; 
                max-width: 650px;
                justify-content: center; 
            }
            .graph-panel {
                width: 45%; 
            }
            .stats-area { margin-right: 120px; }
        }

        #stage1-panel, #stage2-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
            justify-content: center;
        }

        #stage2-panel { display: none; }

        .data-table-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-bottom: 6px solid var(--border-color);
            /* Allow hidden instead of auto to remove scrollbar, as we use wrap now */
            overflow: hidden; 
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            /* Fixed layout ensures columns share space equally */
            table-layout: fixed; 
        }

        th, td {
            border-right: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            padding: 10px 5px; 
            text-align: center;
            font-size: 0.95rem;
            /* Allow text to wrap nicely instead of spilling over */
            white-space: normal; 
            word-wrap: break-word;
        }
        
        th:first-child, td:first-child {
            width: 28%; /* Give the 'Item' column a bit more space */
        }

        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }

        th { background-color: #f0f8ff; color: var(--primary); font-weight: 800; }
        td { font-weight: 700; color: var(--text-main); background-color: #ffffff; }

        .legend {
            text-align: center;
            margin-top: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            color: #7ba2c6;
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: 2px solid var(--primary);
            border-bottom: 6px solid var(--primary-shadow);
            padding: 12px 20px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }
        
        .action-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
            margin-bottom: 4px;
        }

        .action-btn.check-btn {
            background-color: var(--success);
            border-color: var(--success);
            border-bottom-color: var(--success-shadow);
        }

        .action-btn:disabled {
            background-color: #e5e5e5;
            border-color: #e5e5e5;
            border-bottom-color: #d5d5d5;
            color: #afafaf;
            cursor: not-allowed;
            transform: none;
            margin-bottom: 0;
        }

        .feedback-text {
            font-size: 1.1rem;
            font-weight: 900;
            text-align: center;
            min-height: 25px;
        }
        .feedback-success { color: var(--success); }
        .feedback-error { color: var(--error); }

        .graph-grid-container {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: 1fr auto;
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .y-axis {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            flex-direction: column-reverse;
            padding-right: 12px;
            padding-bottom: 5px; 
            padding-top: 5px;
        }
        
        .y-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-weight: 800;
            font-size: 1rem;
            color: var(--axis-color);
        }

        .graph-plot-area {
            grid-column: 2;
            grid-row: 1;
            border-left: 4px solid var(--axis-color);
            border-bottom: 4px solid var(--axis-color);
            border-radius: 0 0 0 6px;
            display: flex;
            justify-content: space-evenly;
            align-items: stretch;
            padding: 5px 5px 0 5px;
        }

        .graph-col {
            flex: 1;
            max-width: 65px;
            display: flex;
            flex-direction: column-reverse;
            gap: 3px; 
            height: 100%;
            padding: 0 5px;
        }

        .graph-cell {
            flex: 1;
            width: 100%;
            background-color: var(--cell-empty);
            border-radius: 6px; 
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .col-filled-0 { background-color: var(--col-0); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }
        .col-filled-1 { background-color: var(--col-1); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }
        .col-filled-2 { background-color: var(--col-2); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }
        .col-filled-3 { background-color: var(--col-3); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }
        .col-filled-4 { background-color: var(--col-4); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }

        .x-axis {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            justify-content: space-evenly;
            padding-top: 10px;
        }

        .x-label {
            flex: 1;
            max-width: 65px;
            text-align: center;
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-main);
            /* Prevent overlap by wrapping long names if needed, though shortCats fixes this */
            word-wrap: break-word;
        }

        .x-label span { 
            font-size: 1.6rem; 
            filter: drop-shadow(0 3px 2px rgba(0,0,0,0.25));
            transform: scale(1.1);
        }

        .col-error .graph-cell { animation: pulseError 0.5s infinite alternate; }
        @keyframes pulseError {
            from { opacity: 1; }
            to { opacity: 0.4; background-color: var(--error); }
        }

        .question-header {
            font-size: 1.1rem;
            color: #7ba2c6;
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
        }

        .question-text-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 15px 20px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            gap: 15px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.4;
            margin: 0;
            flex: 1;
        }

        .tts-btn {
            background-color: var(--warning);
            border: 2px solid var(--warning);
            border-bottom: 4px solid var(--warning-shadow);
            color: white;
            font-size: 1.4rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            flex-shrink: 0;
        }
        
        .tts-btn:active {
            transform: translateY(2px) scale(0.95);
            border-bottom-width: 2px;
        }
        
        .tts-pulse { animation: pulse-ring 1s infinite; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 200, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 200, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 200, 0, 0); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid #38bdf8;
            border-bottom: 5px solid #0ea5e9;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.1s;
            color: #0369a1;
        }
        
        .option-btn:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
            margin-bottom: 3px;
        }
        
        .option-btn.correct {
            background-color: #ddf4c5;
            border-color: var(--success);
            border-bottom-color: var(--success-shadow);
            color: var(--success-shadow);
            pointer-events: none;
        }

        .option-btn.incorrect {
            background-color: #ffdfe0;
            border-color: var(--error);
            border-bottom-color: var(--error-shadow);
            color: var(--error-shadow);
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        #start-screen, #game-ui { display: none; }
        #start-screen.active, #game-ui.active { display: flex; }
        
        #start-screen {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            background: var(--card-bg); 
            padding: 30px;
            border-radius: 30px;
            border: 4px solid var(--border-color);
            border-bottom: 10px solid var(--border-color);
            max-width: 500px;
            width: 90%;
            margin: auto;
            position: relative;
            z-index: 10;
        }
        
        #start-screen h1 { font-size: 2.8rem; color: var(--primary); margin-bottom: 5px; line-height: 1.1; }
        #start-screen h2 { font-size: 1.4rem; color: #7ba2c6; font-weight: 800; margin-bottom: 30px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(255,255,255,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 24px;
            border: 4px solid var(--border-color);
            border-bottom: 10px solid var(--border-color);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal h2 { font-size: 2rem; color: var(--primary); margin: 0 0 10px 0; }
        .modal p { font-size: 1.2rem; font-weight: 800; color: var(--text-main); margin-bottom: 25px; }

        canvas#confetti {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999999;
        }

        @media (max-width: 400px) {
            header { padding: 8px 15px; }
            .header-title h1 { font-size: 1.2rem; }
            .stats-area { font-size: 1rem; margin-right: 80px;}
            th, td { padding: 8px 4px; font-size: 0.85rem; } 
            .action-btn { padding: 10px; font-size: 1rem; }
            .question-text { font-size: 1.1rem; }
            .option-btn { font-size: 1rem; padding: 12px; }
            .x-label span { font-size: 1.3rem; }
            .y-label { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <!-- Reserved empty space for logo in Top Right -->
    <div class="logo-space-placeholder"></div>

    <div id="start-screen" class="active">
        <h1>Picture Graph Builder 📊</h1>
        <h2>Read • Build • Compare</h2>
        <button class="action-btn check-btn" onclick="startGame()" style="font-size: 1.5rem; padding: 20px 40px; border-radius: 25px;">PLAY NOW 🚀</button>
    </div>

    <div id="game-ui">
        <div id="app-wrapper">
            <header>
                <div class="header-title">
                    <h1 id="theme-title">Theme Title</h1>
                    <p id="round-indicator">Round 1 / 5</p>
                </div>
                <div class="stats-area">
                    <div class="star-score">⭐ <span id="score-display">0</span></div>
                    <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()">🔊</button>
                </div>
            </header>

            <div class="main-content">
                <div class="side-panel">
                    
                    <div id="stage1-panel">
                        <div class="data-table-container">
                            <table id="data-table">
                            </table>
                            <div class="legend" id="graph-legend">▢ = 1 item</div>
                        </div>
                        <div id="stage1-feedback" class="feedback-text"></div>
                        <button class="action-btn check-btn" id="check-graph-btn" onclick="checkGraph()">CHECK MY GRAPH ✅</button>
                    </div>

                    <div id="stage2-panel">
                        <div class="question-header" id="question-counter">Question 1 / 5</div>
                        <div class="question-text-wrapper">
                            <div class="question-text" id="question-text">Question goes here?</div>
                            <button id="tts-btn" class="tts-btn" onclick="playTTS(true)">🔊</button>
                        </div>
                        <div class="options-grid" id="options-container">
                        </div>
                        <div id="stage2-feedback" class="feedback-text"></div>
                    </div>

                </div>

                <div class="graph-panel">
                    <div class="graph-grid-container">
                        <div class="y-axis" id="y-axis-labels"></div>
                        <div class="graph-plot-area" id="graph-cols"></div>
                        <div class="x-axis" id="x-axis-labels"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="round-modal">
        <div class="modal">
            <h2>Round Complete! 🎉</h2>
            <p id="round-modal-text">You earned X stars!</p>
            <button class="action-btn check-btn" onclick="nextRound()">NEXT ROUND ➡️</button>
        </div>
    </div>

    <div class="modal-overlay" id="game-modal">
        <div class="modal">
            <h2>Graph Superstar! 🏆</h2>
            <p id="game-modal-text">Total Stars: ⭐ XX<br>Graphs Built: 5<br>Questions Solved: 25</p>
            <button class="action-btn check-btn" onclick="resetGame()" style="margin-bottom:10px;">PLAY AGAIN 🔄</button>
            <button class="action-btn" style="background-color:#e5e5e5; color:#afafaf; border-color:#e5e5e5; border-bottom-color:#d5d5d5;" onclick="goHome()">HOME 🏠</button>
        </div>
    </div>

    <canvas id="confetti"></canvas>

    <script>
        const state = {
            round: 1,
            maxRounds: 5,
            score: 0,
            stage: 1, 
            currentTheme: null,
            currentData: [],
            userGraphHeights: [0, 0, 0, 0, 0],
            questionIndex: 0,
            questionsPerRound: 5,
            currentQuestions: [],
            audioEnabled: true,
            isInteractable: true,
            firstTry: true
        };

        // UPDATED: Added shortCats arrays to cleanly abbreviate table headers and graph labels to prevent text overlap.
        // Full categories are still used for TTS and reading out questions properly.
        const themes = [
            { id: 1, title: "Library", rowTitle: "Books", unit: "book", unitPlural: "books", prep: "in", categories: ["January", "February", "March", "April", "May"], shortCats: ["Jan", "Feb", "Mar", "Apr", "May"], icons: ["📘", "📙", "📗", "📕", "📔"] },
            { id: 2, title: "Fruit Shop", rowTitle: "Fruits", unit: "fruit", unitPlural: "fruits", prep: "on", categories: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], shortCats: ["Mon", "Tue", "Wed", "Thu", "Fri"], icons: ["🍎", "🍌", "🍇", "🍊", "🍓"] },
            { id: 3, title: "Stickers", rowTitle: "Stickers", unit: "sticker", unitPlural: "stickers", prep: "for", categories: ["Star", "Heart", "Dinosaur", "Cloud", "Flower"], shortCats: ["Star", "Heart", "Dino", "Cloud", "Flowr"], icons: ["⭐", "💖", "🦖", "☁️", "🌸"] },
            { id: 4, title: "Pet Shop", rowTitle: "Pets", unit: "pet", unitPlural: "pets", prep: "for", categories: ["Cats", "Dogs", "Bunnies", "Fish", "Birds"], shortCats: ["Cats", "Dogs", "Buns", "Fish", "Birds"], icons: ["🐱", "🐶", "🐰", "🐠", "🦜"] },
            { id: 5, title: "Toy Store", rowTitle: "Toys", unit: "toy", unitPlural: "toys", prep: "for", categories: ["Cars", "Dolls", "Balls", "Bears", "Blocks"], shortCats: ["Cars", "Dolls", "Balls", "Bears", "Block"], icons: ["🏎️", "🎎", "⚽", "🧸", "🧱"] }
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if (!state.audioEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            click: () => playTone(600, 'sine', 0.1, 0.05),
            graphClick: () => playTone(450, 'square', 0.08, 0.03),
            correct: () => { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.2), 100); },
            incorrect: () => playTone(200, 'sawtooth', 0.3, 0.05),
            roundWin: () => {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 'square', 0.15), i*150));
            }
        };

        function toggleAudio() {
            state.audioEnabled = !state.audioEnabled;
            document.getElementById('audio-toggle').innerText = state.audioEnabled ? "🔊" : "🔇";
            if(state.audioEnabled && audioCtx.state === 'suspended') audioCtx.resume();
        }

        let currentUtterance = null;

        function playTTS(manualClick = false) {
            if (!state.audioEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const text = document.getElementById('question-text').innerText;
                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.lang = 'en-US';
                currentUtterance.rate = 0.85; 
                currentUtterance.pitch = 1.2; 
                
                const btn = document.getElementById('tts-btn');
                
                currentUtterance.onstart = () => btn.classList.add('tts-pulse');
                currentUtterance.onend = () => btn.classList.remove('tts-pulse');
                currentUtterance.onerror = () => btn.classList.remove('tts-pulse');
                
                if (manualClick && audioCtx.state === 'suspended') audioCtx.resume();
                
                window.speechSynthesis.speak(currentUtterance);
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('game-ui').classList.add('active');
            sounds.click();
            resetGame();
        }

        function resetGame() {
            state.round = 1;
            state.score = 0;
            updateScore();
            document.getElementById('game-modal').style.display = 'none';
            shuffleArray(themes);
            startRound();
        }

        function goHome() {
            sounds.click();
            document.getElementById('game-modal').style.display = 'none';
            document.getElementById('game-ui').classList.remove('active');
            document.getElementById('start-screen').classList.add('active');
            window.speechSynthesis.cancel();
        }

        function startRound() {
            state.stage = 1;
            state.currentTheme = themes[(state.round - 1) % themes.length];
            state.userGraphHeights = [0, 0, 0, 0, 0];
            state.isInteractable = true;
            
            let pool = [4, 5, 6, 7, 8, 9, 10, 11, 12];
            shuffleArray(pool);
            state.currentData = pool.slice(0, 5);

            document.getElementById('theme-title').innerText = state.currentTheme.title;
            document.getElementById('round-indicator').innerText = `Round ${state.round} / ${state.maxRounds}`;
            document.getElementById('graph-legend').innerText = `▢ = 1 ${state.currentTheme.unit}`;
            
            document.getElementById('stage1-panel').style.display = 'flex';
            document.getElementById('stage2-panel').style.display = 'none';
            
            document.getElementById('check-graph-btn').disabled = false;
            document.getElementById('stage1-feedback').innerText = '';

            renderTable();
            renderGraph();
        }

        function renderTable() {
            const table = document.getElementById('data-table');
            // UPDATED: Use shortCats to prevent overlap/horizontal scrolling
            let headerRow = `<tr><th>Item</th>` + state.currentTheme.shortCats.map(c => `<th>${c}</th>`).join('') + `</tr>`;
            let dataRow = `<tr><td>${state.currentTheme.rowTitle}</td>` + state.currentData.map(d => `<td>${d}</td>`).join('') + `</tr>`;
            table.innerHTML = headerRow + dataRow;
        }

        function renderGraph() {
            const yLabels = document.getElementById('y-axis-labels');
            const colsArea = document.getElementById('graph-cols');
            const xLabels = document.getElementById('x-axis-labels');
            
            yLabels.innerHTML = '';
            colsArea.innerHTML = '';
            xLabels.innerHTML = '';

            for (let i = 1; i <= 12; i++) {
                const lbl = document.createElement('div');
                lbl.className = 'y-label';
                lbl.innerText = i;
                yLabels.appendChild(lbl);
            }

            for (let c = 0; c < 5; c++) {
                const col = document.createElement('div');
                col.className = 'graph-col';
                col.id = `col-${c}`;

                for (let r = 1; r <= 12; r++) {
                    const cell = document.createElement('div');
                    cell.className = 'graph-cell';
                    cell.dataset.col = c;
                    cell.dataset.row = r;
                    cell.onclick = () => handleCellClick(c, r);
                    col.appendChild(cell);
                }
                colsArea.appendChild(col);

                // UPDATED: Use shortCats for X-axis labels to prevent text stacking/overlapping
                const xLabel = document.createElement('div');
                xLabel.className = 'x-label';
                xLabel.innerHTML = `<span>${state.currentTheme.icons[c]}</span>${state.currentTheme.shortCats[c]}`;
                xLabels.appendChild(xLabel);
            }
            updateGraphVisuals();
        }

        function handleCellClick(colIndex, rowValue) {
            if (state.stage !== 1 || !state.isInteractable) return;
            sounds.graphClick();

            if (state.userGraphHeights[colIndex] === rowValue) {
                state.userGraphHeights[colIndex] = 0;
            } else {
                state.userGraphHeights[colIndex] = rowValue;
            }
            
            document.getElementById(`col-${colIndex}`).classList.remove('col-error');
            document.getElementById('stage1-feedback').innerText = '';

            updateGraphVisuals();
        }

        function updateGraphVisuals() {
            for (let c = 0; c < 5; c++) {
                const col = document.getElementById(`col-${c}`);
                const cells = col.children; 
                const height = state.userGraphHeights[c];
                
                for(let i=0; i<cells.length; i++) {
                    const cell = cells[i];
                    const r = parseInt(cell.dataset.row);
                    if (r <= height) {
                        cell.classList.add(`col-filled-${c}`);
                    } else {
                        cell.classList.remove(`col-filled-${c}`);
                    }
                }
            }
        }

        function checkGraph() {
            if (!state.isInteractable) return;
            
            let isCorrect = true;
            for (let i = 0; i < 5; i++) {
                const col = document.getElementById(`col-${i}`);
                col.classList.remove('col-error');
                
                if (state.userGraphHeights[i] !== state.currentData[i]) {
                    isCorrect = false;
                    void col.offsetWidth; 
                    col.classList.add('col-error');
                }
            }

            const feedback = document.getElementById('stage1-feedback');
            
            if (isCorrect) {
                sounds.correct();
                feedback.className = 'feedback-text feedback-success';
                feedback.innerText = 'Perfect Match! 🌟';
                state.isInteractable = false;
                document.getElementById('check-graph-btn').disabled = true;
                
                state.score += 2;
                updateScore();
                
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        const col = document.getElementById(`col-${i}`);
                        col.style.opacity = '0.5';
                        setTimeout(() => col.style.opacity = '1', 150);
                    }, i * 100);
                }

                setTimeout(startStage2, 1500);
            } else {
                sounds.incorrect();
                feedback.className = 'feedback-text feedback-error';
                feedback.innerText = 'Almost! Check the flashing columns. 🔍';
            }
        }

        function generateQuestions() {
            const data = state.currentData;
            // NOTE: Questions always use full names (categories array) for correct grammar/TTS reading.
            const cats = state.currentTheme.categories; 
            const units = state.currentTheme.unitPlural;
            const prep = state.currentTheme.prep;
            
            let maxIdx = 0, minIdx = 0;
            for(let i=1; i<5; i++) {
                if(data[i] > data[maxIdx]) maxIdx = i;
                if(data[i] < data[minIdx]) minIdx = i;
            }

            const getNumDistractors = (correctAns, count, min=1, max=15) => {
                let set = new Set([correctAns]);
                while(set.size < count) { set.add(Math.floor(Math.random() * (max - min + 1)) + min); }
                let arr = Array.from(set);
                arr.splice(arr.indexOf(correctAns), 1);
                return arr.slice(0, count-1);
            };

            const getCatDistractors = (correctIdx, count) => {
                let pool = [0,1,2,3,4].filter(i => i !== correctIdx);
                shuffleArray(pool);
                return pool.slice(0, count-1).map(i => cats[i]);
            };

            const questions = [];
            
            questions.push({
                text: `Which category has the most ${units}?`,
                correct: cats[maxIdx],
                options: shuffleArray([cats[maxIdx], ...getCatDistractors(maxIdx, 4)])
            });

            questions.push({
                text: `Which category has the fewest ${units}?`,
                correct: cats[minIdx],
                options: shuffleArray([cats[minIdx], ...getCatDistractors(minIdx, 4)]) 
            });

            let idxA = Math.floor(Math.random()*5);
            let idxB = (idxA + Math.floor(Math.random()*4) + 1) % 5;
            let valA = data[idxA];
            let valB = data[idxB];
            
            if (valB > valA) { let temp=idxA; idxA=idxB; idxB=temp; temp=valA; valA=valB; valB=temp; }
            let diff = valA - valB;

            questions.push({
                text: `How many more ${units} are there ${prep} ${cats[idxA]} than ${prep} ${cats[idxB]}?`,
                correct: diff.toString(),
                options: shuffleArray([diff.toString(), ...getNumDistractors(diff, 4, 1, 10).map(String)]) 
            });

            let idxC = Math.floor(Math.random()*5);
            let idxD = (idxC + Math.floor(Math.random()*4) + 1) % 5;
            let valC = data[idxC];
            let valD = data[idxD];
            
            if (valC > valD) { let temp=idxC; idxC=idxD; idxD=temp; temp=valC; valC=valD; valD=temp; }
            let diff2 = valD - valC;

            questions.push({
                text: `How many fewer ${units} are there ${prep} ${cats[idxC]} than ${prep} ${cats[idxD]}?`,
                correct: diff2.toString(),
                options: shuffleArray([diff2.toString(), ...getNumDistractors(diff2, 4, 1, 10).map(String)]) 
            });

            let idxE = Math.floor(Math.random()*5);
            questions.push({
                text: `How many ${units} are there ${prep} ${cats[idxE]}?`,
                correct: data[idxE].toString(),
                options: shuffleArray([data[idxE].toString(), ...getNumDistractors(data[idxE], 4, 2, 13).map(String)]) 
            });

            return shuffleArray(questions);
        }

        function startStage2() {
            state.stage = 2;
            state.questionIndex = 0;
            state.currentQuestions = generateQuestions();
            
            document.getElementById('stage1-panel').style.display = 'none';
            document.getElementById('stage2-panel').style.display = 'flex';
            
            const cells = document.querySelectorAll('.graph-cell');
            cells.forEach(c => c.style.cursor = 'default');

            renderQuestion();
        }

        function renderQuestion() {
            state.isInteractable = true;
            state.firstTry = true;
            
            const q = state.currentQuestions[state.questionIndex];
            
            document.getElementById('question-counter').innerText = `Question ${state.questionIndex + 1} / ${state.questionsPerRound}`;
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('stage2-feedback').innerText = '';
            
            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(btn, opt, q.correct);
                optContainer.appendChild(btn);
            });
            
            setTimeout(() => {
                if (state.audioEnabled) playTTS(false);
            }, 600);
        }

        function handleAnswer(btn, selected, correct) {
            if (!state.isInteractable) return;

            const feedback = document.getElementById('stage2-feedback');

            if (selected === correct) {
                state.isInteractable = false;
                window.speechSynthesis.cancel(); 
                sounds.correct();
                btn.classList.add('correct');
                feedback.className = 'feedback-text feedback-success';
                feedback.innerText = 'Correct! 🌟';
                
                if (state.firstTry) {
                    state.score += 1;
                    updateScore();
                }

                setTimeout(() => {
                    state.questionIndex++;
                    if (state.questionIndex < state.questionsPerRound) {
                        renderQuestion();
                    } else {
                        endRound();
                    }
                }, 1000);
            } else {
                state.isInteractable = false;
                sounds.incorrect();
                btn.classList.add('incorrect');
                feedback.className = 'feedback-text feedback-error';
                feedback.innerText = 'Try again! 💪';
                state.firstTry = false; 
                
                setTimeout(() => {
                    btn.classList.remove('incorrect');
                    feedback.innerText = '';
                    state.isInteractable = true;
                }, 800);
            }
        }

        function updateScore() {
            document.getElementById('score-display').innerText = state.score;
            document.querySelector('.star-score').style.transform = 'scale(1.1)';
            setTimeout(()=> document.querySelector('.star-score').style.transform = 'scale(1)', 200);
        }

        function endRound() {
            sounds.roundWin();
            const modal = document.getElementById('round-modal');
            document.getElementById('round-modal-text').innerText = `You earned ${state.score} stars so far!`;
            modal.style.display = 'flex';
        }

        function nextRound() {
            sounds.click();
            document.getElementById('round-modal').style.display = 'none';
            state.round++;
            if (state.round > state.maxRounds) {
                endGame();
            } else {
                startRound();
            }
        }

        function endGame() {
            sounds.roundWin();
            fireConfetti();
            const modal = document.getElementById('game-modal');
            document.getElementById('game-modal-text').innerHTML = `Total Stars: ⭐ ${state.score}<br>Graphs Built: 5<br>Questions Solved: 25<br><span style="color:var(--success); font-weight:900; font-size:1.4rem; display:block; margin-top:15px;">Great Job! 🌟</span>`;
            modal.style.display = 'flex';
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#1cb0f6', '#58cc02', '#b265ff', '#ff3b3b', '#ffc800'];
            
            for(let i=0; i<150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    r: Math.random() * 8 + 4,
                    dx: Math.random() * 25 - 12.5,
                    dy: Math.random() * -25 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }

            let animationId;
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                
                particles.forEach(p => {
                    p.tiltAngle += p.tiltAngleInc;
                    p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                    p.x += Math.sin(p.tiltAngle) * 2;
                    p.dy += 0.3; // gravity
                    p.y += p.dy;
                    p.x += p.dx;
                    
                    if (p.y <= canvas.height) active = true;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    ctx.stroke();
                });

                if(active) {
                    animationId = requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
            
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 6000);
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti');
            if(canvas.width > 0) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>

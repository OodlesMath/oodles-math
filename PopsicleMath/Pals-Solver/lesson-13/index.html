            display: flex;
            justify-content: center;
            align-items: center;

        /* Keep the center readable without changing the card layout */
        .scenery::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 48%, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0) 58%);
        }

        /* App Container & Screens */
        #app {
            position: relative;
            width: 100%;
            max-width: 700px;
            padding: 20px;
            z-index: 10;
            margin: auto;
        }

        .screen {
            display: none;
            width: 100%;
            background:
                radial-gradient(circle at 12% 10%, rgba(255,255,255,.88) 0 8%, transparent 22%),
                radial-gradient(circle at 88% 16%, rgba(255,255,255,.65) 0 7%, transparent 20%),
                linear-gradient(145deg, #FFF7CF 0%, #EAF8FF 43%, #F7E8FF 100%);
            border: 4px solid rgba(255,255,255,.92);
            border-radius: 30px;
            padding: 35px 25px;
            box-shadow: 0 12px 0 rgba(100, 87, 140, 0.12), 0 20px 34px rgba(46, 99, 135, 0.18), inset 0 2px 0 rgba(255,255,255,.95);
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            overflow: hidden;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen */
        .title {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(45deg, #FF4B4B, #FF9600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.1));
        }

        .subtitle {
            font-size: 22px;
            color: #1899D6;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .mascot {
            font-size: 100px;
            margin: 20px 0 30px 0;
            display: inline-block;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.15));
        }

        /* Buttons */
        .btn {
            background-color: var(--success);
            color: white;
            font-size: 24px;
            font-weight: 800;
            padding: 16px 45px;
            border: none;
            border-radius: 20px;
            border-bottom: 8px solid var(--success-dark);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.1s;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(88, 204, 2, 0.4);
        }

        .btn:active {
            transform: translateY(8px);
            border-bottom: 0px solid var(--success-dark);
            margin-bottom: 8px;
            box-shadow: 0 0 0 rgba(88, 204, 2, 0);
        }

        /* Game Screen */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 20px;
            font-weight: 800;
            color: #A0A0A0;
        }

        .score-display {
            color: var(--warning-dark);
            background: #FFF3C4;
            padding: 8px 20px;
            border-radius: 16px;
            border: 2px solid #FFE485;
        }

        .question-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            min-height: 80px;
            background: #F4F4FD;
            padding: 15px 20px;
            border-radius: 20px;
            border: 2px solid #E5E5F7;
        }

        .question-text {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.3;
        }

        .btn-speak {
            background: var(--primary);
            color: white;
            font-size: 26px;
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 18px;
            border-bottom: 6px solid var(--primary-dark);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.1s;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(28, 176, 246, 0.3);
        }

        .btn-speak:active {
            transform: translateY(6px);
            border-bottom: 0;
            margin-bottom: 6px;
            box-shadow: none;
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .option {
            background: rgba(255,255,255,.94);
            border: 3px solid rgba(255,255,255,.95);
            border-bottom: 6px solid #DDE7F0;
            border-radius: 20px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option:hover {
            background: #F9FAFB;
            border-color: #D1D5DB;
            transform: scale(1.01);
        }

        .option:active {
            transform: scale(0.99) translateY(4px);
            border-bottom-width: 2px;
            margin-bottom: 4px;
        }

        /* Visual track for comparing length */
        .option-inner {
            display: flex;
            align-items: center;
            width: 100%;
            height: 80px; /* Increased height for thicker realistic icons */
            background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(238,246,252,.92));
            border-radius: 16px;
            padding-left: 20px;
            border-left: 4px dashed #9CA3AF;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.04);
            position: relative;
        }

        /* States */
        .option.correct {
            background: #D7FFB8;
            border-color: var(--success);
            border-bottom-color: var(--success-dark);
            pointer-events: none;
        }

        .option.wrong {
            background: #FFD4D4;
            border-color: var(--danger);
            border-bottom-color: var(--danger-dark);
            animation: shake 0.4s;
        }

        .feedback-msg {
            height: 35px;
            font-size: 24px;
            font-weight: 800;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Confetti */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            top: -20px;
            width: 15px;
            height: 30px;
            border-radius: 6px;
            animation: fall linear forwards;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(110vw); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* Responsive Tweaks */

        /* Ver 1: brighter, kid-friendly icon polish */
        .mascot {
            text-shadow: 0 4px 0 rgba(255,255,255,0.7);
        }

        .mascot .mascot-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 150px;
            min-height: 96px;
            padding: 10px 18px;
            border-radius: 28px;
            background: linear-gradient(180deg, #fff9c9 0%, #ffe47a 100%);
            border: 5px solid #ffffff;
            box-shadow: 0 9px 0 #e5b400, 0 14px 24px rgba(74,21,75,0.16);
            transform: rotate(-2deg);
        }

        .mascot .ruler-cute {
            position: relative;
            width: 92px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(180deg, #ffd84d 0%, #f7b916 100%);
            border: 3px solid #d89100;
            box-shadow: inset 0 5px 0 rgba(255,255,255,0.45);
        }

        .mascot .ruler-cute::before {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            top: 0;
            height: 15px;
            background: repeating-linear-gradient(to right, #7c5a00 0 2px, transparent 2px 12px);
            opacity: .72;
        }

        .mascot .ruler-cute::after {
            content: "•ᴗ•";
            position: absolute;
            left: 50%;
            top: 15px;
            transform: translateX(-50%);
            color: #7a4b00;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 4px;
        }

        .mascot .sparkle-cute {
            font-size: 44px;
            line-height: 1;
            filter: drop-shadow(0 5px 3px rgba(255,150,0,.28));
        }

        .btn-speak {
            display: inline-grid;
            place-items: center;
        }

        .btn-speak svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 2px 0 rgba(0,0,0,.12));
            pointer-events: none;
        }

        .object-art {
            position: relative;
            isolation: isolate;
        }

        .object-art::after {
            content: "";
            position: absolute;
            left: 7%;
            right: 7%;
            top: 12%;
            height: 20%;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.08));
            pointer-events: none;
            z-index: 8;
        }

        /* Ver 2: softer, rounded cartoon object art */
        .object-art svg {
            display: block;
            width: 100%;
            height: 54px;
            overflow: visible;
            filter: drop-shadow(0 5px 4px rgba(55, 65, 81, .20));
        }
        .object-art.object-smooth::after { display: none; }
        /* Ver 3: every comparison object begins at exactly the same left guide. */
        .option-inner { justify-content: flex-start; }
        .object-art { flex: 0 0 auto; margin: 0; transform-origin: left center; }
        .cubes-art {
            height: 48px; display: grid; align-items: center; gap: 3px;
            filter: drop-shadow(0 5px 4px rgba(55,65,81,.18));
        }
        .cube-piece {
            height: 42px; min-width: 0; border-radius: 9px;
            border: 2px solid rgba(90,69,18,.26);
            background: linear-gradient(145deg,#ffe66d 0%,#ffc93d 58%,#f59e0b 100%);
            box-shadow: inset 0 5px 0 rgba(255,255,255,.52), inset 0 -5px 0 rgba(177,104,0,.14);
            position: relative;
        }
        .cube-piece::after {
            content: ''; position: absolute; inset: 5px 6px auto 6px; height: 6px;
            border-radius: 999px; background: rgba(255,255,255,.46);
        }
        .train-art {
            width: 100%;
            min-height: 52px;
            display: flex;
            align-items: center;
            gap: 4px;
            filter: drop-shadow(0 5px 4px rgba(55,65,81,.18));
        }
        .train-engine, .train-car {
            height: 34px;
            border-radius: 15px 15px 11px 11px;
            position: relative;
            box-shadow: inset 0 5px rgba(255,255,255,.34), inset 0 -5px rgba(0,0,0,.10);
        }
        .train-engine { flex: 1.15; background: linear-gradient(180deg,#42c5ff,#1688e8); min-width: 70px; }
        .train-car { flex: 1; background: linear-gradient(180deg,#ff7aa8,#e94d85); min-width: 54px; }
        .train-engine::before {
            content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
            right: 12px; top: -15px; background: #ffd75a; border: 4px solid #ffb600;
        }
        .train-engine::after, .train-car::after {
            content: ""; position: absolute; left: 12px; right: 12px; bottom: -9px; height: 15px;
            background: radial-gradient(circle at 12px 7px,#46566b 0 6px,transparent 6.5px), radial-gradient(circle at calc(100% - 12px) 7px,#46566b 0 6px,transparent 6.5px);
        }

        /* Ver 4: full-background Tap Fruits mini-game after every 2 questions. */
        #app { transition: opacity .28s ease, transform .28s ease; }
        body.fruit-mode #app { opacity: 0; transform: scale(.985); pointer-events: none; }
        #fruit-mini-game {
            position: fixed; inset: 0; z-index: 1200; display: none; overflow: hidden;
            pointer-events: none;
        }
        #fruit-mini-game.active { display: block; pointer-events: auto; }
        .fruit-hud {
            position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 14px; padding: 12px 18px;
            border-radius: 24px; background: rgba(255,255,255,.93); border: 4px solid rgba(255,255,255,.98);
            box-shadow: 0 9px 0 rgba(107,82,145,.14), 0 16px 30px rgba(30,72,100,.18);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            color: #4A154B; font-weight: 900; white-space: nowrap;
        }
        .fruit-hud-title { font-size: 22px; color: #ec4899; }
        .fruit-stat {
            min-width: 86px; padding: 7px 12px; border-radius: 16px; text-align: center;
            background: linear-gradient(180deg,#fff8ba,#ffe46e); color: #9a6200;
            border: 2px solid #ffd34d; box-shadow: inset 0 2px 0 rgba(255,255,255,.8);
        }
        #fruit-field { position: absolute; inset: 0; overflow: hidden; }
        .falling-fruit {
            position: absolute; top: -110px; width: 72px; height: 72px; border: 0; border-radius: 50%;
            display: grid; place-items: center; font-size: 48px; line-height: 1; cursor: pointer;
            background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.98) 0 13%, rgba(255,255,255,.86) 14% 31%, rgba(255,255,255,.28) 32% 100%);
            box-shadow: 0 8px 0 rgba(77,57,102,.13), 0 14px 24px rgba(51,65,85,.20);
            animation: fruitFall linear forwards;
            transition: transform .12s ease, opacity .12s ease;
            touch-action: manipulation;
        }
        .falling-fruit:hover { transform: scale(1.08); }
        .falling-fruit.popped { animation: none !important; transform: scale(1.35) rotate(12deg); opacity: 0; }
        .fruit-pop {
            position: absolute; pointer-events: none; font-size: 27px; font-weight: 900; color: #fff;
            text-shadow: 0 3px 0 #ec4899, 0 4px 10px rgba(0,0,0,.18);
            animation: fruitPop .55s ease-out forwards;
        }
        @keyframes fruitFall {
            0% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(55vh) rotate(8deg); }
            100% { transform: translateY(118vh) rotate(-6deg); }
        }
        @keyframes fruitPop {
            0% { opacity: 0; transform: translate(-50%,0) scale(.5); }
            30% { opacity: 1; transform: translate(-50%,-12px) scale(1.18); }
            100% { opacity: 0; transform: translate(-50%,-55px) scale(.9); }
        }
        .fruit-start-card {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
            background: rgba(255,255,255,.94); border: 5px solid #fff; border-radius: 28px;
            padding: 24px 30px; box-shadow: 0 12px 0 rgba(94,78,126,.13), 0 22px 38px rgba(25,70,95,.20);
            text-align: center; color: #4A154B; font-weight: 900; animation: popIn .35s ease both;
        }
        .fruit-start-card strong { display:block; font-size: 30px; color:#ec4899; margin-bottom: 4px; }
        .fruit-start-card span { font-size: 18px; color:#1899D6; }

        @media (max-width: 500px) {
            .screen { padding: 25px 15px; border-radius: 24px;}
            .title { font-size: 36px; }
            .question-text { font-size: 22px; }
            .option-inner { height: 70px; padding-left: 10px; }
            .btn-speak { width: 50px; height: 50px; font-size: 20px;}
        }
    </style>
</head>
<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <!-- Background Scenery -->
    <div class="scenery" aria-hidden="true"></div>

    <!-- App Container -->
    <div id="app">

        <!-- START SCREEN -->
        <div id="screen-start" class="screen active">
            <h1 class="title">Length Hunt</h1>
            <p class="subtitle">Look carefully. Find the correct object!</p>
            <div class="mascot"><div class="mascot-icon"><span class="ruler-cute"></span><span class="sparkle-cute">✨</span></div></div>

            <button class="btn" onclick="startGame()">Play</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="screen-game" class="screen">
            <div class="top-bar">
                <div class="progress">Question <span id="q-num">1</span> / 10</div>
                <div class="score-display">Score: <span id="score">0</span></div>
            </div>

            <div class="question-header">
                <h2 id="question-text" class="question-text">Question goes here?</h2>
                <button id="btn-speak" class="btn-speak" aria-label="Hear the question">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="white" d="M4 9v6h4l5 4V5L8 9H4z"/>
                        <path fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" d="M16 8.2c1.3 1.1 2 2.3 2 3.8s-.7 2.7-2 3.8M18.5 5.8c2.1 1.8 3.2 3.9 3.2 6.2s-1.1 4.4-3.2 6.2"/>
                    </svg>
                </button>
            </div>

            <div id="options-container" class="options-container">
                <!-- Options injected via JS -->
            </div>

            <div id="feedback-msg" class="feedback-msg">Great job!</div>
        </div>

        <!-- END SCREEN -->
        <div id="screen-end" class="screen">
            <h1 class="title" style="margin-bottom: 20px;">Game Complete!</h1>
            <div class="mascot" id="end-emoji">🏆</div>
            <h2 style="font-size: 32px; margin-bottom: 15px; font-weight: 800; color: #4A154B;">Your Score: <span id="final-score" style="color: var(--primary);">0 / 10</span></h2>
            <p id="final-msg" class="subtitle" style="color: var(--success); font-size: 26px;"></p>
            <button class="btn" onclick="startGame()">Play Again</button>
        </div>

    </div>

    <!-- Ver 4 Mini Game: Tap Fruits -->
    <div id="fruit-mini-game" aria-hidden="true">
        <div id="fruit-field"></div>
        <div class="fruit-hud">
            <span class="fruit-hud-title">🍓 Tap Fruits!</span>
            <span class="fruit-stat">🍎 <span id="fruit-score">0</span></span>
            <span class="fruit-stat">⏱️ <span id="fruit-time">9</span>s</span>
        </div>
        <div id="fruit-start-card" class="fruit-start-card">
            <strong>Fruit Break! 🍉</strong>
            <span>Tap the falling fruits!</span>
        </div>
    </div>

    <!-- Confetti Layer -->
    <div id="confetti-container"></div>

    <script>
        // --- Game Data ---
        // Ver 3: build each round from a larger question bank, then choose 10 unique questions.
        // Ver 4 uses clear, left-aligned comparison objects. Brush-type objects are removed; rope and snake stay straight.
        const questionBank = [
            { q: "Which pencil is longer?", obj: "pencil", lengths: [{v:50, id:'short'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which pencil is shorter?", obj: "pencil", lengths: [{v:100, id:'long'}, {v:50, id:'short'}], correct: 'short' },
            { q: "Which pencil is the longest?", obj: "pencil", lengths: [{v:40, id:'short'}, {v:70, id:'medium'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which pencil is the shortest?", obj: "pencil", lengths: [{v:70, id:'medium'}, {v:100, id:'long'}, {v:40, id:'short'}], correct: 'short' },

            { q: "Which pen is longer?", obj: "pen", lengths: [{v:50, id:'short'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which pen is shorter?", obj: "pen", lengths: [{v:100, id:'long'}, {v:50, id:'short'}], correct: 'short' },
            { q: "Which pen is the longest?", obj: "pen", lengths: [{v:40, id:'short'}, {v:70, id:'medium'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which pen is the shortest?", obj: "pen", lengths: [{v:100, id:'long'}, {v:40, id:'short'}, {v:70, id:'medium'}], correct: 'short' },

            { q: "Which row of cubes is longer?", obj: "cubes", lengths: [{v:50, id:'short'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which row of cubes is shorter?", obj: "cubes", lengths: [{v:100, id:'long'}, {v:50, id:'short'}], correct: 'short' },
            { q: "Which row of cubes is the longest?", obj: "cubes", lengths: [{v:40, id:'short'}, {v:70, id:'medium'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which row of cubes is the shortest?", obj: "cubes", lengths: [{v:70, id:'medium'}, {v:40, id:'short'}, {v:100, id:'long'}], correct: 'short' },

            { q: "Which rope is longer?", obj: "rope", lengths: [{v:50, id:'short'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which rope is shorter?", obj: "rope", lengths: [{v:100, id:'long'}, {v:50, id:'short'}], correct: 'short' },
            { q: "Which rope is the longest?", obj: "rope", lengths: [{v:40, id:'short'}, {v:70, id:'medium'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which rope is the shortest?", obj: "rope", lengths: [{v:100, id:'long'}, {v:70, id:'medium'}, {v:40, id:'short'}], correct: 'short' },

            { q: "Which snake is longer?", obj: "snake", lengths: [{v:50, id:'short'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which snake is shorter?", obj: "snake", lengths: [{v:100, id:'long'}, {v:50, id:'short'}], correct: 'short' },
            { q: "Which snake is the longest?", obj: "snake", lengths: [{v:40, id:'short'}, {v:70, id:'medium'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which snake is the shortest?", obj: "snake", lengths: [{v:70, id:'medium'}, {v:100, id:'long'}, {v:40, id:'short'}], correct: 'short' },

            { q: "Which ruler is longer?", obj: "ruler", lengths: [{v:50, id:'short'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which ruler is shorter?", obj: "ruler", lengths: [{v:100, id:'long'}, {v:50, id:'short'}], correct: 'short' },
            { q: "Which ruler is the longest?", obj: "ruler", lengths: [{v:70, id:'medium'}, {v:40, id:'short'}, {v:100, id:'long'}], correct: 'long' },
            { q: "Which ruler is the shortest?", obj: "ruler", lengths: [{v:100, id:'long'}, {v:40, id:'short'}, {v:70, id:'medium'}], correct: 'short' }
        ];

        let questions = [];

        function shuffledCopy(items) {
            const arr = [...items];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- State ---
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnimating = false;
        let audioCtx;

        // Ver 4 mini-game state
        let fruitScore = 0;
        let fruitSpawnTimer = null;
        let fruitClockTimer = null;
        let fruitEndTimer = null;
        let fruitGameRunning = false;
        const fruitIcons = ['🍎','🍊','🍓','🍇','🍉','🍍','🍌','🍒','🥝'];

        // --- Audio System (Web Audio API) ---
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playClick() { playTone(600, 'sine', 0.1); }
        function playCorrect() {
            playTone(440, 'sine', 0.15); // A4
            setTimeout(() => playTone(554, 'sine', 0.15), 100); // C#5
            setTimeout(() => playTone(659, 'sine', 0.25), 200); // E5
        }
        function playWrong() {
            playTone(300, 'triangle', 0.2, 0.15);
            setTimeout(() => playTone(250, 'triangle', 0.3, 0.15), 150);
        }
        function playWin() {
            [523, 659, 783, 1046, 1046].forEach((f, i) => {
                setTimeout(() => playTone(f, 'square', 0.2, 0.05), i * 150);
            });
        }

        // --- Text-to-Speech ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Slower, child-friendly
                utterance.pitch = 1.2; // Cheerful pitch
                window.speechSynthesis.speak(utterance);
            }
        }

        document.getElementById('btn-speak').addEventListener('click', () => {
            playClick();
            speak(questions[currentQuestionIndex].q);
        });

        // --- Core Logic ---
        function startGame() {
            initAudio();
            playClick();
            currentQuestionIndex = 0;
            score = 0;
            questions = shuffledCopy(questionBank).slice(0, 10);
            document.getElementById('confetti-container').innerHTML = '';

            switchScreen('screen-game');
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame();
                return;
            }

            isAnimating = false;
            const q = questions[currentQuestionIndex];

            // Update UI
            document.getElementById('q-num').innerText = currentQuestionIndex + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('feedback-msg').style.opacity = '0';

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Shuffle options visually
            const shuffledLengths = [...q.lengths].sort(() => Math.random() - 0.5);

            shuffledLengths.forEach(lenObj => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option';
                optDiv.onclick = () => checkAnswer(optDiv, lenObj.id, q.correct);

                const innerDiv = document.createElement('div');
                innerDiv.className = 'option-inner';
                innerDiv.innerHTML = generateObjectHTML(q.obj, lenObj.v);

                optDiv.appendChild(innerDiv);
                optionsContainer.appendChild(optDiv);
            });
        }

        function checkAnswer(optDiv, selectedId, correctId) {
            if (isAnimating) return;

            if (selectedId === correctId) {
                isAnimating = true;
                optDiv.classList.add('correct');
                playCorrect();
                score++;
                document.getElementById('score').innerText = score;

                const msgs = ["Great job!", "You got it!", "Awesome!", "Perfect!"];
                showFeedback(msgs[Math.floor(Math.random() * msgs.length)], 'var(--success)');

                setTimeout(() => {
                    currentQuestionIndex++;
                    const shouldPlayFruitBreak = currentQuestionIndex < questions.length && currentQuestionIndex % 2 === 0;
                    if (shouldPlayFruitBreak) startFruitMiniGame();
                    else loadQuestion();
                }, 1250);
            } else {
                optDiv.classList.add('wrong');
                playWrong();
                showFeedback("Try again!", 'var(--danger)');

                setTimeout(() => {
                    optDiv.classList.remove('wrong');
                    document.getElementById('feedback-msg').style.opacity = '0';
                }, 1000);
            }
        }

        function startFruitMiniGame() {
            fruitGameRunning = true;
            fruitScore = 0;
            window.speechSynthesis?.cancel?.();
            document.body.classList.add('fruit-mode');

            const mini = document.getElementById('fruit-mini-game');
            const field = document.getElementById('fruit-field');
            const startCard = document.getElementById('fruit-start-card');
            field.innerHTML = '';
            mini.classList.add('active');
            mini.setAttribute('aria-hidden', 'false');
            document.getElementById('fruit-score').innerText = '0';
            document.getElementById('fruit-time').innerText = '9';
            startCard.style.display = 'block';

            setTimeout(() => {
                if (!fruitGameRunning) return;
                startCard.style.display = 'none';
                spawnFruit();
                fruitSpawnTimer = setInterval(spawnFruit, 720); // slow, child-friendly rhythm
            }, 700);

            let timeLeft = 9;
            fruitClockTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('fruit-time').innerText = Math.max(0, timeLeft);
                if (timeLeft <= 0) finishFruitMiniGame();
            }, 1000);

            fruitEndTimer = setTimeout(finishFruitMiniGame, 9400);
        }

        function spawnFruit() {
            if (!fruitGameRunning) return;
            const field = document.getElementById('fruit-field');
            const fruit = document.createElement('button');
            fruit.type = 'button';
            fruit.className = 'falling-fruit';
            fruit.setAttribute('aria-label', 'Tap fruit');
            fruit.textContent = fruitIcons[Math.floor(Math.random() * fruitIcons.length)];

            const size = 62 + Math.random() * 18;
            const left = 4 + Math.random() * 90;
            const duration = 5.8 + Math.random() * 2.2; // intentionally slow fall
            fruit.style.width = size + 'px';
            fruit.style.height = size + 'px';
            fruit.style.fontSize = (size * .66) + 'px';
            fruit.style.left = `calc(${left}% - ${size/2}px)`;
            fruit.style.animationDuration = duration + 's';

            fruit.addEventListener('pointerdown', (event) => {
                event.preventDefault();
                if (!fruitGameRunning || fruit.classList.contains('popped')) return;
                fruit.classList.add('popped');
                fruitScore++;
                document.getElementById('fruit-score').innerText = fruitScore;
                playTone(740 + Math.min(fruitScore, 8) * 24, 'sine', .10, .06);
                showFruitPop(fruit);
                setTimeout(() => fruit.remove(), 140);
            }, { passive: false });

            fruit.addEventListener('animationend', () => fruit.remove());
            field.appendChild(fruit);
        }

        function showFruitPop(fruit) {
            const rect = fruit.getBoundingClientRect();
            const pop = document.createElement('div');
            pop.className = 'fruit-pop';
            pop.textContent = '+1 ✨';
            pop.style.left = (rect.left + rect.width / 2) + 'px';
            pop.style.top = (rect.top + rect.height / 2) + 'px';
            document.getElementById('fruit-field').appendChild(pop);
            setTimeout(() => pop.remove(), 600);
        }

        function finishFruitMiniGame() {
            if (!fruitGameRunning) return;
            fruitGameRunning = false;
            clearInterval(fruitSpawnTimer);
            clearInterval(fruitClockTimer);
            clearTimeout(fruitEndTimer);
            fruitSpawnTimer = fruitClockTimer = fruitEndTimer = null;

            const mini = document.getElementById('fruit-mini-game');
            mini.querySelectorAll('.falling-fruit').forEach(f => f.remove());
            mini.classList.remove('active');
            mini.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('fruit-mode');
            playCorrect();
            loadQuestion();
        }

        function showFeedback(text, color) {
            const msgEl = document.getElementById('feedback-msg');
            msgEl.innerText = text;
            msgEl.style.color = color;
            msgEl.style.opacity = '1';
        }

        function endGame() {
            switchScreen('screen-end');

            let msg = "";
            let emoji = "🏆";
            if(score === 10) { msg = "Amazing! You are a length expert!"; emoji = "🌟"; }
            else if(score >= 7) { msg = "Great job! You can compare lengths!"; emoji = "🎉"; }
            else if(score >= 4) { msg = "Good try! Let's practice more!"; emoji = "👍"; }
            else { msg = "Keep going! You can do it!"; emoji = "💪"; }

            document.getElementById('final-score').innerText = score + " / 10";
            document.getElementById('final-msg').innerText = msg;
            document.getElementById('end-emoji').innerText = emoji;

            playWin();
            createConfetti();
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- NEW! Fix for Flat Grey Lines: Fully Solid 3-Slice HTML/CSS Architecture ---
        function generateObjectHTML(type, lengthPct) {
            const wrap = (svg) => `<div class="object-art object-smooth" style="width:${lengthPct}%; min-width:0; display:flex; align-items:center;">${svg}</div>`;

            if (type === 'cubes') {
                const count = lengthPct >= 95 ? 10 : (lengthPct >= 65 ? 7 : 4);
                const cubes = Array.from({length: count}, () => '<span class="cube-piece"></span>').join('');
                return `<div class="object-art object-smooth cubes-art" style="width:${lengthPct}%; min-width:0; grid-template-columns:repeat(${count}, minmax(0,1fr));">${cubes}</div>`;
            }

            const defs = `

                    <linearGradient id="ropeGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8cd79"/><stop offset=".5" stop-color="#dda14a"/><stop offset="1" stop-color="#b97225"/></linearGradient>
                    <filter id="softShadow" x="-10%" y="-60%" width="120%" height="220%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#334155" flood-opacity=".22"/></filter>

            let art = '';

                        </g></svg>`;
                    break;
                case 'pen':
                    art = `<svg viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true">${defs}
                        <g filter="url(#softShadow)">
                            <rect x="2" y="16" width="504" height="28" rx="14" fill="url(#penBlue)"/>
                            <rect x="2" y="16" width="66" height="28" rx="14" fill="#167ec9"/>

                            <path d="M490 17 Q530 20 574 30 Q530 40 490 43 Z" fill="#d9e4ee"/>

                            <path d="M18 21 H476" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
                            <path d="M108 14 C160 6 220 7 270 14" fill="none" stroke="#167ec9" stroke-width="6" stroke-linecap="round"/>
                        </g></svg>`;
                    break;
                case 'rope':
                    art = `<svg viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true">${defs}
                        <g filter="url(#softShadow)">
                            <rect x="4" y="19" width="588" height="24" rx="12" fill="url(#ropeGold)" stroke="#9a5a20" stroke-width="2"/>
                            <path d="M12 31 H584" stroke="#f7d995" stroke-width="8" stroke-linecap="round" opacity=".62"/>

                            <circle cx="12" cy="31" r="10" fill="#d99b49"/><circle cx="584" cy="31" r="10" fill="#d99b49"/>
                        </g></svg>`;
                    break;
                case 'snake':
                    art = `<svg viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true">${defs}
                        <defs>
                            <linearGradient id="snakeGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bf15d"/><stop offset=".5" stop-color="#58cc02"/><stop offset="1" stop-color="#319300"/></linearGradient>
                        </defs>
                        <g filter="url(#softShadow)">
                            <rect x="14" y="19" width="534" height="24" rx="12" fill="url(#snakeGreen)" stroke="#287c00" stroke-width="2"/>

                            <g stroke="#765a24" stroke-width="3" stroke-linecap="round" opacity=".86">
                                <path d="M45 11 V31 M85 11 V25 M125 11 V31 M165 11 V25 M205 11 V31 M245 11 V25 M285 11 V31 M325 11 V25 M365 11 V31 M405 11 V25 M445 11 V31 M485 11 V25 M525 11 V31 M565 11 V25"/>
                            </g>
                            <circle cx="24" cy="38" r="5" fill="#f7f1d0" stroke="#d59a20" stroke-width="2"/>

            }
            return wrap(art);
        }

        // Confetti effect
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#58CC02', '#1CB0F6', '#FF4B4B', '#FFC800', '#CE82FF', '#FF9600'];

            for(let i = 0; i < 100; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 3 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 1) + 's';

                // Randomly rotate to make it look realistic
                conf.style.transform = `rotate(${Math.random() * 360}deg)`;

                container.appendChild(conf);
            }
        }
    </script>

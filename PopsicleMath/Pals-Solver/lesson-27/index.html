<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape Puzzle Garden V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Vibrant Duolingo-style Palette */
            --c-red: #FF4B4B;
            --c-blue: #1CB0F6;
            --c-green: #58CC02;
            --c-yellow: #FFC800;
            --c-orange: #FF9600;
            --c-purple: #CE82FF;
            --c-pink: #FF82C3;
            --c-brown: #895A2F;
            --c-gray: #AFAFAF;
            --c-cyan: #2BDEFD;
            --c-black: #4B4B4B;
            --sky-top: #38bdf8;
            --sky-bottom: #bae6fd;
            --grass-top: #58CC02;
            --grass-bottom: #46A302;
        }
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
            width: 100vw;
            height: 100vh;
        }

        /* Prevent default behaviors */
        img, svg { pointer-events: none; }

        /* Scenery Elements */
        .scenery {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; overflow: hidden;
        }

        .sun {
            position: absolute; top: 8%; left: 8%; width: 100px; height: 100px;
            background: var(--c-yellow); border-radius: 50%;
            box-shadow: 0 0 0 15px rgba(255, 200, 0, 0.3), inset -5px -5px 10px rgba(0,0,0,0.1);
            animation: pulse-spin 10s infinite linear;
        }

        .cloud {
            position: absolute; background: white; border-radius: 50px; opacity: 0.95;
            box-shadow: 0 8px 0 rgba(255,255,255,0.4) inset, 0 4px 10px rgba(0,0,0,0.05);
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: white; border-radius: 50%;
        }
        .cloud1 { top: 12%; left: -20%; width: 140px; height: 50px; animation: drift 35s linear infinite; }
        .cloud1::before { width: 70px; height: 70px; top: -35px; left: 20px; }
        .cloud1::after { width: 60px; height: 60px; top: -25px; left: 70px; }
        
        .cloud2 { top: 25%; left: 100%; width: 180px; height: 60px; animation: drift-reverse 45s linear infinite; }
        .cloud2::before { width: 90px; height: 90px; top: -45px; left: 25px; }
        .cloud2::after { width: 80px; height: 80px; top: -35px; left: 90px; }

        .grass-layer {
            position: absolute; bottom: 0; width: 100%; height: 25%;
            background: linear-gradient(to bottom, var(--grass-top), var(--grass-bottom));
            border-radius: 100% 100% 0 0 / 40px 40px 0 0;
            box-shadow: inset 0 15px 30px rgba(255,255,255,0.15);
        }

        /* UI Structure */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column; pointer-events: none;
        }
        .interactive { pointer-events: auto; }

        .empty-top-right { width: 150px; height: 60px; pointer-events: none; }

        /* Duolingo Style Buttons */
        .btn {
            background: var(--c-green); color: white; border: none;
            border-bottom: 6px solid var(--grass-bottom); border-radius: 20px;
            padding: 12px 24px; font-size: 1.25rem; font-weight: 800;
            cursor: pointer; transition: transform 0.1s, border-width 0.1s;
            text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: translateY(6px); border-bottom-width: 0px; margin-bottom: 6px; }
        
        .btn-blue { background: var(--c-blue); border-bottom-color: #1480B3; }
        .btn-blue:active { border-bottom-color: #1480B3; }
        .btn-icon { padding: 10px; font-size: 1.5rem; border-radius: 16px; min-width: 50px; height: 50px; }

        .panel {
            background: rgba(255, 255, 255, 0.95); border: 4px solid #F0F0F0;
            border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px;
        }

        /* Puzzle Board */
        #puzzle-board {
            position: relative; width: 100%; max-width: 450px; aspect-ratio: 1 / 1;
            background: rgba(255, 255, 255, 0.7); border-radius: 30px;
            border: 6px solid white; box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin: 0 auto;
        }

        #tray-area {
            width: 100%; max-width: 800px; min-height: 100px;
            background: rgba(255, 255, 255, 0.5); border-radius: 30px;
            padding: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 20px;
            border: 4px solid white; box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Target Slots & Pieces */
        .target-slot { position: absolute; pointer-events: none; }
        .target-svg path {
            fill: #F3F4F6; stroke: #D1D5DB; stroke-width: 3;
            stroke-dasharray: 8 6; stroke-linecap: round;
        }

        .draggable-piece {
            position: relative; touch-action: none; cursor: grab;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: left, top;
        }
        .draggable-piece:active { cursor: grabbing; }
        
        .draggable-svg { width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        /* Notice we use the SVG filter defined in HTML for the 3D block effect */
        
        /* Animations */
        @keyframes drift { from { transform: translateX(0); } to { transform: translateX(120vw); } }
        @keyframes drift-reverse { from { transform: translateX(0); } to { transform: translateX(-120vw); } }
        @keyframes pulse-spin { 
            0% { transform: scale(1) rotate(0deg); } 
            50% { transform: scale(1.05) rotate(180deg); } 
            100% { transform: scale(1) rotate(360deg); } 
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        @keyframes bounce-win {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08) translateY(-15px); }
        }
        .bounce-win-anim { animation: bounce-win 0.8s ease-in-out; }

        /* Sparkles */
        .sparkle {
            position: absolute; width: 12px; height: 12px; background: #FFC800; border-radius: 50%;
            pointer-events: none; animation: sparkle-fade 0.8s forwards; z-index: 100;
        }
        @keyframes sparkle-fade {
            0% { transform: scale(0) translate(0,0); opacity: 1; }
            100% { transform: scale(1.5) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        /* Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        #confetti-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 99999; pointer-events: none;
        }

        /* Responsive Landscape tweaks */
        @media (min-aspect-ratio: 4/3) and (max-height: 600px) {
            #game-layout { flex-direction: row !important; }
            #puzzle-board { max-width: 40vh; margin: 0; }
            #tray-area { max-width: 300px; height: 40vh; flex-direction: row; overflow-y: auto; align-content: flex-start;}
        }
    </style>
</head>
<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <!-- SVG Filters for 3D Block Effect -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true">
        <defs>
            <filter id="block-effect" x="-20%" y="-20%" width="140%" height="140%">
                <!-- Drop shadow for depth -->
                <feDropShadow dx="0" dy="6" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" result="shadow"/>
                <!-- Inner highlight/bevel -->
                <feComponentTransfer in="SourceAlpha" result="alpha"/>
                <feGaussianBlur in="alpha" stdDeviation="2" result="blur"/>
                <feOffset dx="-2" dy="-3" result="offsetBlur"/>
                <feComposite in2="alpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
                <feFlood flood-color="#ffffff" flood-opacity="0.6"/>
                <feComposite in2="shadowDiff" operator="in"/>
                <feComposite in2="SourceGraphic" operator="over"/>
                <feMerge>
                    <feMergeNode in="shadow"/>
                    <feMergeNode/>
                </feMerge>
            </filter>
        </defs>
    </svg>

    <!-- Scenery -->
    <div class="scenery">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="grass-layer">
            <!-- Scattered Trees -->
            <svg class="absolute bottom-2 left-[10%]" width="40" height="60" viewBox="0 0 40 60"><rect x="15" y="30" width="10" height="30" fill="var(--c-brown)"/><circle cx="20" cy="20" r="20" fill="var(--c-green)"/></svg>
            <svg class="absolute bottom-6 left-[25%]" width="30" height="40" viewBox="0 0 40 60"><rect x="15" y="30" width="10" height="30" fill="var(--c-brown)"/><circle cx="20" cy="20" r="20" fill="#71D128"/></svg>
            <svg class="absolute bottom-1 left-[50%]" width="50" height="70" viewBox="0 0 40 60"><rect x="15" y="30" width="10" height="30" fill="var(--c-brown)"/><circle cx="20" cy="20" r="20" fill="var(--c-green)"/></svg>
            <svg class="absolute bottom-5 left-[75%]" width="35" height="50" viewBox="0 0 40 60"><rect x="15" y="30" width="10" height="30" fill="var(--c-brown)"/><circle cx="20" cy="20" r="20" fill="#71D128"/></svg>
            <svg class="absolute bottom-2 left-[88%]" width="45" height="65" viewBox="0 0 40 60"><rect x="15" y="30" width="10" height="30" fill="var(--c-brown)"/><circle cx="20" cy="20" r="20" fill="var(--c-green)"/></svg>

            <!-- Scattered Flowers -->
            <svg class="absolute bottom-2 left-[18%]" width="20" height="30" viewBox="0 0 20 30"><rect x="9" y="10" width="2" height="20" fill="#58CC02"/><circle cx="10" cy="10" r="4" fill="var(--c-pink)"/><circle cx="5" cy="5" r="4" fill="var(--c-pink)"/><circle cx="15" cy="5" r="4" fill="var(--c-pink)"/><circle cx="5" cy="15" r="4" fill="var(--c-pink)"/><circle cx="15" cy="15" r="4" fill="var(--c-pink)"/><circle cx="10" cy="10" r="3" fill="#FFC800"/></svg>
            <svg class="absolute bottom-5 left-[38%]" width="15" height="25" viewBox="0 0 20 30"><rect x="9" y="10" width="2" height="20" fill="#58CC02"/><circle cx="10" cy="10" r="4" fill="var(--c-blue)"/><circle cx="5" cy="5" r="4" fill="var(--c-blue)"/><circle cx="15" cy="5" r="4" fill="var(--c-blue)"/><circle cx="5" cy="15" r="4" fill="var(--c-blue)"/><circle cx="15" cy="15" r="4" fill="var(--c-blue)"/><circle cx="10" cy="10" r="3" fill="#FFC800"/></svg>
            <svg class="absolute bottom-3 left-[62%]" width="20" height="30" viewBox="0 0 20 30"><rect x="9" y="10" width="2" height="20" fill="#58CC02"/><circle cx="10" cy="10" r="4" fill="var(--c-yellow)"/><circle cx="5" cy="5" r="4" fill="var(--c-yellow)"/><circle cx="15" cy="5" r="4" fill="var(--c-yellow)"/><circle cx="5" cy="15" r="4" fill="var(--c-yellow)"/><circle cx="15" cy="15" r="4" fill="var(--c-yellow)"/><circle cx="10" cy="10" r="3" fill="#FF4B4B"/></svg>
            <svg class="absolute bottom-6 left-[82%]" width="18" height="28" viewBox="0 0 20 30"><rect x="9" y="10" width="2" height="20" fill="#58CC02"/><circle cx="10" cy="10" r="4" fill="var(--c-red)"/><circle cx="5" cy="5" r="4" fill="var(--c-red)"/><circle cx="15" cy="5" r="4" fill="var(--c-red)"/><circle cx="5" cy="15" r="4" fill="var(--c-red)"/><circle cx="15" cy="15" r="4" fill="var(--c-red)"/><circle cx="10" cy="10" r="3" fill="#FFC800"/></svg>
        </div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <!-- Top Bar -->
        <div class="flex justify-between items-center p-4 w-full interactive">
            <div class="flex gap-3">
                <button class="btn btn-blue btn-icon" onclick="goHome()">🏠</button>
                <button class="btn btn-blue btn-icon" id="btn-sound" onclick="toggleSound()">🔊</button>
            </div>
            
            <!-- Progress Bar -->
            <div class="flex-1 max-w-md mx-4 lg:mx-10 bg-white rounded-full p-1 border-4 border-gray-100 shadow-sm">
                <div class="h-4 bg-gray-200 rounded-full w-full overflow-hidden relative">
                    <div id="progress-bar" class="h-full bg-green-500 w-0 transition-all duration-500 rounded-full">
                        <div class="absolute top-0 left-0 w-full h-full bg-white/20" style="background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent); background-size: 1rem 1rem;"></div>
                    </div>
                </div>
            </div>

            <div class="empty-top-right"></div> <!-- Mandatory Logo Space -->
        </div>

        <!-- Main Gameplay Area -->
        <div class="flex-1 flex flex-col items-center justify-center p-2 pb-6 interactive" id="game-area-container">
            
            <!-- Question Box -->
            <div class="panel py-2 px-6 mb-4 flex items-center gap-4 animate-fade-in text-center">
                <span class="text-xl md:text-2xl font-black text-gray-700" id="question-text">Let's build a picture!</span>
                <button class="btn-icon bg-blue-500 text-white rounded-full flex items-center justify-center border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all" onclick="speakQuestion()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </div>

            <!-- Game Layout (Board + Tray) -->
            <div id="game-layout" class="flex flex-col items-center gap-6 w-full h-full justify-center">
                <div id="puzzle-board"></div>
                <div id="tray-area"></div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <div class="panel flex flex-col items-center max-w-md text-center p-8 border-8 border-white bg-blue-50">
            <h1 class="text-4xl md:text-5xl font-black text-blue-500 mb-2 drop-shadow-sm leading-tight">Shape Puzzle<br><span class="text-green-500">Garden</span></h1>
            <p class="text-lg font-bold text-gray-600 mb-6">Match shapes and learn!</p>
            
            <!-- Mascot using basic shapes -->
            <div class="w-32 h-32 mb-8 relative">
                <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-lg">
                    <!-- Triangle Body -->
                    <path d="M 50 10 L 90 90 L 10 90 Z" fill="var(--c-blue)"/>
                    <!-- Circle Head -->
                    <circle cx="50" cy="30" r="25" fill="var(--c-yellow)"/>
                    <!-- Face -->
                    <circle cx="40" cy="25" r="4" fill="var(--c-black)"/>
                    <circle cx="60" cy="25" r="4" fill="var(--c-black)"/>
                    <path d="M 35 35 Q 50 45 65 35" fill="none" stroke="var(--c-black)" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>

            <button class="btn w-full text-2xl py-4 bg-green-500 text-white" onclick="startGame()">PLAY</button>
        </div>
    </div>

    <!-- Final Summary Screen -->
    <div id="summary-screen" class="screen">
        <div class="panel flex flex-col items-center max-w-md text-center p-8 border-8 border-white bg-purple-50">
            <h1 class="text-4xl font-black text-purple-600 mb-2">YOU DID IT!</h1>
            <h2 class="text-2xl font-bold text-blue-500 mb-6">Shape Puzzle Master</h2>
            
            <div class="bg-white rounded-2xl p-5 w-full mb-6 text-left shadow-sm border-2 border-gray-100">
                <div class="flex justify-between text-xl font-bold mb-3 border-b pb-2 text-gray-600">
                    <span>Completed Levels:</span><span class="text-green-500">10 / 10</span>
                </div>
                <div class="flex justify-between text-xl font-bold mb-3 border-b pb-2 text-gray-600">
                    <span>Total Score:</span><span id="final-score" class="text-blue-500">100</span>
                </div>
                <div class="flex justify-between text-xl font-bold text-gray-600">
                    <span>Shapes Matched:</span><span id="final-shapes" class="text-purple-500">0</span>
                </div>
            </div>

            <div class="flex gap-4 w-full">
                <button class="btn btn-blue flex-1 py-3 text-lg" onclick="goHome()">HOME</button>
                <button class="btn flex-1 py-3 text-lg" onclick="startGame()">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <!-- Confetti Canvas on top -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Game Script -->

                    { id: '2', type: 'quarter-circle', color: 'var(--c-purple)', l: 26, t: 12, w: 20, h: 20, r: 180 },
                    { id: '3', type: 'quarter-circle', color: 'var(--c-purple)', l: 54, t: 12, w: 20, h: 20, r: -90 },
                    { id: '4', type: 'quarter-circle', color: 'var(--c-pink)', l: 26, t: 32, w: 20, h: 20, r: 90 },
                    { id: '5', type: 'quarter-circle', color: 'var(--c-pink)', l: 54, t: 32, w: 20, h: 20, r: 0 }
                ]
            },
            {
                title: "Robot",
                targets: [
                    { id: '1', type: 'square', color: 'var(--c-gray)', l: 37, t: 14, w: 26, h: 26, r: 0 },
                    { id: '2', type: 'rectangle', color: 'var(--c-blue)', l: 32, t: 42, w: 36, h: 28, r: 0 },
                    { id: '3', type: 'rectangle', color: 'var(--c-green)', l: 18, t: 44, w: 12, h: 20, r: 0 },
                    { id: '4', type: 'rectangle', color: 'var(--c-green)', l: 70, t: 44, w: 12, h: 20, r: 0 },
                    { id: '5', type: 'semicircle', color: 'var(--c-red)', l: 43, t: 7, w: 14, h: 7, r: 0 }
                ]
            },
            {
                title: "Ice Cream",
                targets: [
                    { id: '1', type: 'triangle', color: 'var(--c-orange)', l: 35, t: 50, w: 30, h: 40, r: 180 },
                    { id: '2', type: 'circle', color: 'var(--c-pink)', l: 36, t: 26, w: 28, h: 28, r: 0 },
                    { id: '3', type: 'circle', color: 'var(--c-purple)', l: 42, t: 12, w: 16, h: 16, r: 0 }
                ]
            },
            {
                title: "Fish",
                targets: [
                    { id: '1', type: 'circle', color: 'var(--c-orange)', l: 32, t: 32, w: 36, h: 36, r: 0 },
                    { id: '2', type: 'triangle', color: 'var(--c-orange)', l: 10, t: 35, w: 24, h: 30, r: -90 },
                    { id: '3', type: 'quarter-circle', color: 'var(--c-pink)', l: 43, t: 18, w: 14, h: 14, r: -90 },
                    { id: '4', type: 'circle', color: 'var(--c-white)', l: 54, t: 40, w: 8, h: 8, r: 0 }
                ]
            },
            {
                title: "Castle",
                targets: [
                    { id: '1', type: 'square', color: 'var(--c-gray)', l: 35, t: 45, w: 30, h: 30, r: 0 },
                    { id: '2', type: 'rectangle', color: 'var(--c-gray)', l: 19, t: 35, w: 14, h: 40, r: 0 },
                    { id: '3', type: 'rectangle', color: 'var(--c-gray)', l: 67, t: 35, w: 14, h: 40, r: 0 },
                    { id: '4', type: 'triangle', color: 'var(--c-red)', l: 15, t: 17, w: 22, h: 18, r: 0 },
                    { id: '5', type: 'triangle', color: 'var(--c-red)', l: 63, t: 17, w: 22, h: 18, r: 0 },
                    { id: '6', type: 'semicircle', color: 'var(--c-brown)', l: 43, t: 61, w: 14, h: 14, r: 0 }
                ]
            },
            {
                title: "Car",
                targets: [
                    { id: '1', type: 'rectangle', color: 'var(--c-red)', l: 25, t: 55, w: 50, h: 20, r: 0 },
                    { id: '2', type: 'semicircle', color: 'var(--c-red)', l: 35, t: 40, w: 30, h: 15, r: 0 },
                    { id: '3', type: 'circle', color: 'var(--c-gray)', l: 30, t: 67, w: 16, h: 16, r: 0 },
                    { id: '4', type: 'circle', color: 'var(--c-gray)', l: 54, t: 67, w: 16, h: 16, r: 0 },
                    { id: '5', type: 'semicircle', color: 'var(--c-cyan)', l: 43, t: 44, w: 14, h: 7, r: 0 }
                ]
            }
        ];

        let sessionLevels = [];
        let currentLevelIdx = 0;
        let score = 0;
        let shapesMatchedTotal = 0;
        let shapesMatchedLevel = 0;
        let soundEnabled = true;
        let audioCtx = null;
        let isDragging = false;
        let draggedPiece = null;
        let activeTarget = null;
        const TOTAL_ROUNDS = 10;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Web Audio synthesized sound effects
        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            switch(type) {
                case 'click':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                    break;
                case 'pickup':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(500, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                    break;
                case 'drop-correct':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                    break;
                case 'drop-wrong':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(150, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2);
                    break;
                case 'win':
                    [440, 554, 659, 880].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'square';
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.15, now + i*0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + i*0.1 + 0.2);
                        o.connect(g); g.connect(audioCtx.destination);
                        o.start(now + i*0.1); o.stop(now + i*0.1 + 0.2);
                    });
                    break;
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('btn-sound').textContent = soundEnabled ? '🔊' : '🔇';
            initAudio();
            playSound('click');
        }

        // Speech synthesis for 100% English
        function speakQuestion() {
            playSound('click');
            const level = sessionLevels[currentLevelIdx];
            if (!level) return;
            const text = document.getElementById('question-text').textContent;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85; // Slower for kids
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakPhrase(phrase) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(phrase);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function startGame() {
            initAudio();
            playSound('click');
            
            // Randomly select 10 unique levels for this round
            let shuffled = [...allLevelsData].sort(() => 0.5 - Math.random());
            sessionLevels = shuffled.slice(0, TOTAL_ROUNDS);
            
            currentLevelIdx = 0;
            score = 0;
            shapesMatchedTotal = 0;
            
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            loadLevel();
        }

        function goHome() {
            playSound('click');
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('start-screen').classList.add('active');
            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            confettiCtx?.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }

        function loadLevel() {
            const level = sessionLevels[currentLevelIdx];
            shapesMatchedLevel = 0;
            
            // Generate varied questions
            const prompts = [
                "Let's build a [X]!",
                "Can you make a [X]?",
                "Time to build a [X]!",
                "Match shapes for the [X]!",
                "Create a beautiful [X]!",
                "Help me finish the [X]!"
            ];
            const promptTemplate = prompts[currentLevelIdx % prompts.length];
            const questionText = promptTemplate.replace('[X]', level.title);
            
            // Update UI
            document.getElementById('question-text').textContent = questionText;
            document.getElementById('progress-bar').style.width = `${(currentLevelIdx / TOTAL_ROUNDS) * 100}%`;

            const board = document.getElementById('puzzle-board');
            const tray = document.getElementById('tray-area');
            board.innerHTML = '';
            tray.innerHTML = '';
            board.classList.remove('bounce-win-anim');

            // Shuffle pieces for the tray
            let trayPieces = [...level.targets].sort(() => Math.random() - 0.5);

            // Render Target Slots on the board
            level.targets.forEach(target => {
                const targetEl = document.createElement('div');
                targetEl.className = 'target-slot';
                targetEl.id = 'target-' + target.id;
                
                targetEl.style.left = `${target.l}%`;
                targetEl.style.top = `${target.t}%`;
                targetEl.style.width = `${target.w}%`;
                targetEl.style.height = `${target.h}%`;
                targetEl.style.transform = `rotate(${target.r}deg)`;
                
                targetEl.innerHTML = `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="target-svg w-full h-full">
                        <path d="${shapePaths[target.type]}" vector-effect="non-scaling-stroke" />
                    </svg>
                `;
                board.appendChild(targetEl);
            });

            // Render Draggable Pieces in the tray
            trayPieces.forEach(target => {
                const pieceEl = document.createElement('div');
                pieceEl.className = 'draggable-piece drop-shadow-md';
                pieceEl.id = 'piece-' + target.id;
                pieceEl.dataset.targetId = target.id;
                pieceEl.dataset.type = target.type;
                
                // Calculate reasonable tray size maintaining aspect ratio
                const aspect = target.w / target.h;
                let baseSize = window.innerWidth < 600 ? 50 : 65;
                let pw = baseSize, ph = baseSize;
                if(aspect > 1) ph = baseSize / aspect;
                else pw = baseSize * aspect;

                pieceEl.style.width = `${pw}px`;
                pieceEl.style.height = `${ph}px`;
                pieceEl.style.transform = `rotate(${target.r}deg)`;
                
                pieceEl.innerHTML = `
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="draggable-svg w-full h-full">
                        <path d="${shapePaths[target.type]}" fill="${target.color}" filter="url(#block-effect)" vector-effect="non-scaling-stroke" />
                    </svg>
                `;

                pieceEl.addEventListener('pointerdown', handlePointerDown);
                tray.appendChild(pieceEl);
            });

            // Auto-speak question on new level (optional, but good for kids)
            setTimeout(speakQuestion, 500);
        }

        function handlePointerDown(e) {
            if (e.button !== 0 && e.type !== 'touchstart') return;
            if (isDragging) return;

            draggedPiece = e.currentTarget;
            isDragging = true;
            initAudio();
            playSound('pickup');

            const targetId = draggedPiece.dataset.targetId;
            activeTarget = document.getElementById('target-' + targetId);
            const targetRect = activeTarget.getBoundingClientRect();

            // Set size directly to the target slot's exact pixel size for 1:1 dragging visualization
            draggedPiece.style.width = `${targetRect.width}px`;
            draggedPiece.style.height = `${targetRect.height}px`;

            // Switch to fixed positioning
            draggedPiece.style.position = 'fixed';
            draggedPiece.style.zIndex = '1000';
            document.body.appendChild(draggedPiece);

            movePieceTo(e.clientX, e.clientY);

            document.addEventListener('pointermove', handlePointerMove, { passive: false });
            document.addEventListener('pointerup', handlePointerUp);
            document.addEventListener('pointercancel', handlePointerUp);
        }

        function handlePointerMove(e) {
            if (!isDragging || !draggedPiece) return;
            e.preventDefault(); // Stop scrolling
            movePieceTo(e.clientX, e.clientY);
        }

        function movePieceTo(x, y) {
            const w = parseFloat(draggedPiece.style.width) / 2;
            const h = parseFloat(draggedPiece.style.height) / 2;
            draggedPiece.style.left = `${x - w}px`;
            draggedPiece.style.top = `${y - h}px`;
        }

        function handlePointerUp(e) {
            if (!isDragging) return;
            
            document.removeEventListener('pointermove', handlePointerMove);
            document.removeEventListener('pointerup', handlePointerUp);
            document.removeEventListener('pointercancel', handlePointerUp);

            checkSnap();
        }

        function checkSnap() {
            if (!draggedPiece || !activeTarget) return;

            const pieceRect = draggedPiece.getBoundingClientRect();
            const targetRect = activeTarget.getBoundingClientRect();

            const pcX = pieceRect.left + pieceRect.width / 2;
            const pcY = pieceRect.top + pieceRect.height / 2;
            const tcX = targetRect.left + targetRect.width / 2;
            const tcY = targetRect.top + targetRect.height / 2;

            const dist = Math.hypot(pcX - tcX, pcY - tcY);
            const threshold = Math.max(targetRect.width, targetRect.height) * 0.85; // Increased for stickier snap

            if (dist < threshold) {
                snapSuccess();
            } else {
                snapFail();
            }
        }

        function snapSuccess() {
            playSound('drop-correct');
            
            const phrases = ["Great job!", "Perfect match!", "Awesome!", "Well done!"];
            speakPhrase(phrases[Math.floor(Math.random() * phrases.length)]);

            // Lock into the board by making it relative to the target container again
            draggedPiece.style.position = 'absolute';
            draggedPiece.style.left = '0';
            draggedPiece.style.top = '0';
            draggedPiece.style.width = '100%';
            draggedPiece.style.height = '100%';
            draggedPiece.style.zIndex = '1';
            draggedPiece.style.transform = 'none'; // Parent target handles rotation
            draggedPiece.style.pointerEvents = 'none';

            activeTarget.appendChild(draggedPiece);
            createSparkles(activeTarget);

            score += 10;
            shapesMatchedTotal++;
            shapesMatchedLevel++;
            
            cleanupDrag();

            if (shapesMatchedLevel >= sessionLevels[currentLevelIdx].targets.length) {
                setTimeout(levelComplete, 800);
            }
        }

        function snapFail() {
            playSound('drop-wrong');
            draggedPiece.classList.add('shake-anim');
            
            setTimeout(() => {
                if (draggedPiece) {
                    draggedPiece.classList.remove('shake-anim');
                    const tray = document.getElementById('tray-area');
                    
                    // Revert to tray styles
                    draggedPiece.style.position = 'relative';
                    draggedPiece.style.left = 'auto';
                    draggedPiece.style.top = 'auto';
                    draggedPiece.style.zIndex = 'auto';
                    
                    const targetData = sessionLevels[currentLevelIdx].targets.find(t => t.id === draggedPiece.dataset.targetId);
                    if(targetData) {
                        draggedPiece.style.transform = `rotate(${targetData.r}deg)`;
                        let baseSize = window.innerWidth < 600 ? 50 : 65;
                        const aspect = targetData.w / targetData.h;
                        let pw = baseSize, ph = baseSize;
                        if(aspect > 1) ph = baseSize / aspect;
                        else pw = baseSize * aspect;
                        draggedPiece.style.width = `${pw}px`;
                        draggedPiece.style.height = `${ph}px`;
                    }
                    tray.appendChild(draggedPiece);
                }
                cleanupDrag();
            }, 400);
        }

        function cleanupDrag() {
            isDragging = false;
            draggedPiece = null;
            activeTarget = null;
        }

        function createSparkles(element) {
            const rect = element.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;

            for(let i=0; i<6; i++) {
                const sp = document.createElement('div');
                sp.className = 'sparkle';
                const angle = (i / 6) * Math.PI * 2;
                const dist = 30 + Math.random() * 20;
                sp.style.setProperty('--tx', `${Math.cos(angle)*dist}px`);
                sp.style.setProperty('--ty', `${Math.sin(angle)*dist}px`);
                sp.style.left = `${cx}px`;
                sp.style.top = `${cy}px`;
                document.body.appendChild(sp);
                setTimeout(() => sp.remove(), 800);
            }
        }

        function levelComplete() {
            playSound('win');
            document.getElementById('puzzle-board').classList.add('bounce-win-anim');
            
            currentLevelIdx++;
            if (currentLevelIdx < TOTAL_ROUNDS) {
                setTimeout(loadLevel, 1500);
            } else {
                setTimeout(showSummary, 1500);
            }
        }

        function showSummary() {
            document.getElementById('progress-bar').style.width = `100%`;
            document.getElementById('summary-screen').classList.add('active');
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-shapes').textContent = shapesMatchedTotal;
            playSound('win');
            startConfetti();
        }

        let confettiCtx;
        let confettiParticles = [];
        let confettiAnimId;

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            confettiCtx = canvas.getContext('2d');
            confettiParticles = [];

            const colors = ['#FF4B4B', '#1CB0F6', '#58CC02', '#FFC800', '#CE82FF'];
            for(let i=0; i<150; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 4 - 2,
                    dy: Math.random() * 5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleInc: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            confettiAnimId = requestAnimationFrame(animateConfetti);
            confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            
            confettiParticles.forEach(p => {
                p.tiltAngle += p.tiltAngleInc;
                p.y += p.dy;
                p.x += Math.sin(p.tiltAngle) * 2;
                
                confettiCtx.beginPath();
                confettiCtx.lineWidth = p.r;
                confettiCtx.strokeStyle = p.color;
                confettiCtx.moveTo(p.x + p.tilt + p.r, p.y);
                confettiCtx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                confettiCtx.stroke();
                
                if (p.y > window.innerHeight) {
                    p.y = -10;
                    p.x = Math.random() * window.innerWidth;
                }
            });
        }

        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            if (canvas.width > 0) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            // Puzzle layout inherently scales via percentage coordinates and aspect-ratio.
        });
    </script>

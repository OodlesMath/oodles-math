<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oodles Math PALS-SOLVER</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --text: #1e3a8a;
            --blue: #0ea5e9; 
            --blue-dark: #0284c7; 
            --pink: #ec4899;
            --yellow: #f59e0b; 
            --green: #10b981; 
            --green-dark: #059669; 
            --purple: #8b5cf6;
            --orange: #f97316; 
            --red: #ef4444; 
            --red-dark: #dc2626; 
            --slate: #475569;
            --dark-border: #334155;
            --shadow: 0 12px 30px rgba(15,23,42,.13); 
            --radius: 30px;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #8ed8f8;
        }

        .oodles-app {
            width: 100vw;
            height: 100vh;
            font-family: "Poppins", sans-serif;
            color: var(--text);
            position: relative;
            box-sizing: border-box;
        }
        
        .oodles-app * {
            box-sizing: border-box;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .oodles-app button {
            font-family: inherit; 
            color: inherit;
        }

        #backgroundCanvas, #confetti {
            display: block;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #backgroundCanvas { z-index: 0; }
        #confetti { z-index: 9999; }

        .game-container {
            position: absolute;
            inset: 0;
            z-index: 10;
            overflow: auto;
            padding: 26px 16px; 
            scroll-behavior: smooth;
        }

        .wrap {
            width: min(1320px, 100%);
            min-height: 100%;
            margin: auto;
            display: grid;
            grid-template-columns: 440px minmax(0, 1fr);
            gap: 24px;
        }

        .app-card {
            background-color: #fefce8;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fde047' fill-opacity='0.4' font-family='Arial' font-weight='bold' font-size='18'%3E%3Ctext x='15' y='25' transform='rotate(15 15 25)'%3E%2B%3C/text%3E%3Ctext x='65' y='20' transform='rotate(-20 65 20)'%3E1%3C/text%3E%3Ctext x='35' y='75' transform='rotate(-10 35 75)'%3E-%3C/text%3E%3Ctext x='80' y='70' transform='rotate(25 80 70)'%3E%3D%3C/text%3E%3Ccircle cx='50' cy='45' r='4' fill='none' stroke='%23fde047' stroke-width='2'/%3E%3Cpath d='M80 85 L86 91 L92 85 L86 79 Z' fill='none' stroke='%23fde047' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E");
            border: 5px solid rgba(255,255,255,.95);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 18px 22px;
            background: rgba(255,255,255,.75);
            border-bottom: 4px dashed rgba(203,213,225,.7);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            backdrop-filter: blur(5px);
        }

        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-icon { font-size: 38px; filter: drop-shadow(0 4px 2px rgba(0,0,0,.12)); }
        .brand-copy { min-width: 0; color: var(--text); }
        .brand-copy b { display: block; font-size: 20px; line-height: 1.15; font-weight: 900; margin: 0; }
        .brand-copy span { display: block; color: var(--slate); font-size: 12px; font-weight: 800; margin-top: 3px; }

        .level-badge {
            background: var(--pink); color: #fff; padding: 4px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 3px 0 #be185d; margin-top: 5px; display: inline-block;
        }

        .chips { display: grid; gap: 8px; justify-items: end; }
        .chip {
            white-space: nowrap; background: #fef08a; color: #854d0e; border: 3px solid #eab308;
            border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 900; box-shadow: 0 4px 0 #ca8a04;
        }

        .left-body { padding: 22px; display: flex; flex-direction: column; flex: 1; background: rgba(255,255,255,0.4); }
        .big-text { font-size: 25px; color: var(--pink); font-weight: 900; margin: 0; }
        .sub-text { font-size: 14px; color: var(--slate); font-weight: 700; line-height: 1.5; margin-top: 3px; }

        .progress-card { margin-top: 15px; background: rgba(255,255,255,.9); border: 4px solid #fff; border-radius: 22px; padding: 15px; box-shadow: 0 8px 20px rgba(15,23,42,.08); }
        .progress-line { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 9px; font-size: 14px; color: #1e3a8a; font-weight: 900; }
        .meter { height: 20px; background: #e2e8f0; border: 3px solid #cbd5e1; border-radius: 999px; overflow: hidden; box-shadow: inset 0 3px 6px rgba(0,0,0,.08); }
        .bar { height: 100%; transition: width .45s cubic-bezier(.34,1.56,.64,1); background: repeating-linear-gradient(45deg,#34d399,#34d399 12px,#10b981 12px,#10b981 24px); border-radius: 999px; }

        .skills { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
        .skill {
            position: relative; background: rgba(255,255,255,.95); border: 3px solid #e2e8f0;
            border-radius: 18px; padding: 10px 9px; display: flex; align-items: center; gap: 8px;
            min-width: 0; transition: .18s; box-shadow: 0 4px 9px rgba(15,23,42,.06); cursor: pointer;
        }
        .skill:hover { border-color: #cbd5e1; transform: translateY(-2px); }
        .skill:active { transform: translateY(1px); box-shadow: 0 2px 4px rgba(15,23,42,.06); }
        .skill.active { border-color: var(--blue); background: #f0f9ff; box-shadow: 0 0 0 4px rgba(14,165,233,.18); transform: translateY(-2px); }
        .skill.answered { border-color: #86efac; background: #f0fdf4; }
        .skill.pending { opacity: .82; }

        .skill-flag { position: absolute; top: -8px; right: -8px; font-size: 17px; background: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.15); border: 2px solid #f97316; display: none; }
        .skill.flagged .skill-flag { display: flex; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .sico { width: 39px; height: 39px; flex: 0 0 39px; border-radius: 11px; background: #fff; border: 2px solid #e2e8f0; display: grid; place-items: center; font-size: 19px; box-shadow: 0 3px 0 #f1f5f9; }
        .skill b { display: block; font-size: 11px; line-height: 1.18; font-weight: 900; color: var(--text); }
        .skill span { display: block; font-size: 9px; line-height: 1.25; color: var(--slate); font-weight: 700; margin-top: 2px; }

        .start-wrap { margin-top: auto; padding-top: 18px; }
        .btn { border: 0; border-radius: 19px; padding: 14px 22px; font-size: 16px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; letter-spacing: .04em; transition: .1s; margin: 0; }
        .btn:active { transform: translateY(6px); box-shadow: none!important; }
        .btn:disabled { opacity: .45; cursor: not-allowed; transform: none!important; }
        .btn.green { background: var(--green); color: #fff; box-shadow: 0 6px 0 var(--green-dark); }
        .btn.blue { background: #38bdf8; color: #fff; box-shadow: 0 6px 0 var(--blue-dark); }
        .btn.pink { background: #f472b6; color: #fff; box-shadow: 0 6px 0 #be185d; }
        .btn.orange { background: #fb923c; color: #fff; box-shadow: 0 6px 0 #c2410c; }
        .btn.purple { background: #a855f7; color: #fff; box-shadow: 0 6px 0 #7e22ce; }
        .btn.ghost { background: #e2e8f0; color: #475569; box-shadow: 0 6px 0 #94a3b8; }
        .btn.ghost.active { background: #fef3c7; border: 2px solid #f59e0b; color: #b45309; box-shadow: 0 6px 0 #d97706; }
        .btn.full { width: 100%; }

        .right-stage { padding: 22px; display: flex; align-items: center; justify-content: center; flex: 1; position: relative; }
        .panel { width: 100%; max-width: 820px; background-color: #fefce8; background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23fde047' fill-opacity='0.4' font-family='Arial' font-weight='bold' font-size='18'%3E%3Ctext x='15' y='25' transform='rotate(15 15 25)'%3E%2B%3C/text%3E%3Ctext x='65' y='20' transform='rotate(-20 65 20)'%3E1%3C/text%3E%3Ctext x='35' y='75' transform='rotate(-10 35 75)'%3E-%3C/text%3E%3Ctext x='80' y='70' transform='rotate(25 80 70)'%3E%3D%3C/text%3E%3Ccircle cx='50' cy='45' r='4' fill='none' stroke='%23fde047' stroke-width='2'/%3E%3Cpath d='M80 85 L86 91 L92 85 L86 79 Z' fill='none' stroke='%23fde047' stroke-width='2'/%3E%3C/g%3E%3C/svg%3E"); border: 5px solid #fff; border-radius: 28px; padding: 28px; box-shadow: var(--shadow); }

        .welcome, .finish { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 560px; background: rgba(255,255,255,0.5); border-radius: 20px; padding: 20px; }
        .welcome-icon, .finish-icon { font-size: 105px; filter: drop-shadow(0 13px 12px rgba(0,0,0,.14)); animation: bob 2.8s ease-in-out infinite; }
        .welcome h1 { font-size: clamp(28px,4vw,43px); line-height: 1.15; color: var(--purple); font-weight: 900; margin-top: 12px; margin-bottom:0;}
        .welcome h2 { font-size: clamp(20px,3vw,29px); color: var(--blue-dark); font-weight: 900; margin-top: 7px; margin-bottom:0;}
        .welcome p { font-size: 17px; color: var(--slate); font-weight: 700; margin: 17px auto 28px; max-width: 580px; line-height: 1.55; }
        
        .welcome-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 26px; }
        .welcome-badge { padding: 9px 15px; border-radius: 999px; background: #f8fafc; border: 3px solid #e2e8f0; font-size: 13px; font-weight: 900; color: var(--slate); }
        .welcome-level { background: var(--pink); color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 0 #be185d; margin-bottom: 15px; display: inline-block; }

        .qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
        .qtitle { font-size: clamp(20px,3vw,27px); font-weight: 900; color: var(--text); background: rgba(255,255,255,0.7); padding: 4px 12px; border-radius: 12px; }
        .qtop-right { display: flex; gap: 10px; align-items: center; } 
        .tag { background: #e0f2fe; color: var(--blue-dark); padding: 7px 16px; border-radius: 999px; border: 3px solid #38bdf8; font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 7px; text-align: center; }

        .question-card { background: rgba(255,255,255,.92); border: 4px solid #e2e8f0; border-radius: 26px; padding: 24px; margin-bottom: 20px; transition: .2s; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .prompt-row { display: flex; align-items: flex-start; gap: 14px; }
        .prompt { font-size: clamp(20px,3.1vw,28px); font-weight: 900; color: var(--text); line-height: 1.36; flex: 1; }
        .speak-btn { width: 60px; height: 60px; flex: 0 0 60px; border: 3px solid #fff; border-radius: 50%; background: #38bdf8; color: white; font-size: 27px; box-shadow: 0 6px 0 var(--blue-dark); cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; transition: 0.1s;}
        .speak-btn:active { transform: translateY(6px); box-shadow: none; }

        .vis-box { width: 100%; margin-top: 18px; display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }

        .choice {
            min-height: 85px; border: 3px solid #e2e8f0; background: #fff; border-radius: 22px; 
            font-size: clamp(19px,2.8vw,25px); font-weight: 900; color: var(--text); display: flex; 
            align-items: center; justify-content: center; text-align: center; cursor: pointer; 
            transition: 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; box-shadow: 0 8px 0 #cbd5e1;
            padding: 10px;
        }
        .choice:hover { transform: translateY(-3px); border-color: #cbd5e1; }
        .choice:active { transform: translateY(8px); box-shadow: 0 0 0 transparent; }
        .choice.selected { transform: translateY(4px); box-shadow: 0 0 0 4px #fff, 0 0 0 8px #0ea5e9; border-color: #0ea5e9; background: #f0f9ff; z-index: 2; }
        .choice.selected::after {
            content: '✓'; position: absolute; top: -10px; right: -10px; background: #0ea5e9; color: #fff; 
            width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fff; display: flex; 
            align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .number-strip { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
        .number-cell { min-width: 48px; height: 52px; border: 3px solid #64748b; background: white; border-radius: 12px; display: grid; place-items: center; font-size: 18px; font-weight: 900; color: var(--text); cursor: pointer; box-shadow: 0 5px 0 #cbd5e1; transition: 0.1s; }
        .number-cell.selected { background: #e0f2fe; border-color: var(--blue); color: var(--blue-dark); box-shadow: 0 5px 0 var(--blue-dark); }

        .to-table { border-collapse: collapse; background: #fff; min-width: 380px; max-width: 100%; font-size: 18px; font-weight: 900; text-align: center; border: 4px solid var(--dark-border); margin: auto; }
        .to-table th, .to-table td { border: 2px solid var(--dark-border); padding: 10px 16px; color: var(--text); }
        .to-table th { background: #e0f2fe; color: var(--blue-dark); }

        .pattern-row { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
        .pattern-cell { min-width: 59px; height: 56px; border: 3px solid #94a3b8; border-radius: 14px; background: #fff; display: grid; place-items: center; font-size: 21px; font-weight: 900; color: var(--text); }
        .pattern-cell.missing { border-style: dashed; color: var(--pink); background: #fff1f2; }

        .action-row { display: flex; justify-content: space-between; align-items: center; gap: 11px; margin-top: 22px; padding-top: 20px; border-top: 3px dashed #e2e8f0; flex-wrap: wrap; }
        .action-group { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
        .submit-btn-anim { animation: pulseSubmit 2s infinite; margin-top: 15px; font-size: 20px; padding: 18px 24px; }
        
        .teacher-toggle { width: 100%; margin-top: 13px; text-align: center; }
        .teacher-panel { display: none; margin-top: 12px; padding: 13px; background: #fff7ed; border: 3px solid #fdba74; border-radius: 18px; }
        .teacher-panel.show { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .teacher-note { font-size: 12px; color: #9a3412; font-weight: 800; text-align: center; width: 100%; margin-bottom: 3px; }

        .finish { min-height: 570px; background: rgba(255,255,255,0.85); }
        .finish h2 { font-size: clamp(30px,5vw,49px); font-weight: 900; color: var(--blue-dark); margin-top: 10px; margin-bottom:0; }
        .finish p { font-size: 18px; font-weight: 800; color: var(--slate); margin-top: 8px; }
        .score-ring { width: 150px; height: 150px; border-radius: 50%; background: #fef3c7; border: 8px solid #f59e0b; display: grid; place-items: center; margin: 19px auto; box-shadow: 0 8px 0 #d97706; }
        .score-ring b { font-size: 42px; color: #b45309; }
        .summary-container { width: 100%; max-height: 300px; overflow: auto; border: 4px solid #bae6fd; border-radius: 20px; background: #fff; margin-top: 15px; }
        .summary-table { border-collapse: collapse; width: 100%; text-align: left; }
        .summary-table th { position: sticky; top: 0; background: #e0f2fe; color: var(--blue-dark); padding: 12px; font-size: 14px; }
        .summary-table td { padding: 11px 12px; border-top: 2px solid #f1f5f9; font-size: 13px; font-weight: 700; color: var(--text); }
        .result-star { font-size: 22px; text-align: center; }
        .finish-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-13px); } }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
        @keyframes pulseSubmit { 
            0% { box-shadow: 0 6px 0 #7e22ce, 0 0 0 0 rgba(168,85,247,0.4); } 
            70% { box-shadow: 0 6px 0 #7e22ce, 0 0 0 15px rgba(168,85,247,0); } 
            100% { box-shadow: 0 6px 0 #7e22ce, 0 0 0 0 rgba(168,85,247,0); } 
        }

        @media(max-width: 950px) {
            .wrap { grid-template-columns: 1fr; }
            .left-side { order: 2; }
            .right-side { order: 1; }
            .skills { grid-template-columns: repeat(2, 1fr); }
            .welcome, .finish { min-height: 450px; }
        }

        @media(max-width: 620px) {
            .game-container { padding: 10px; }
            .app-card { border-width: 3px; border-radius: 23px; }
            .card-header { padding: 13px; }
            .brand-copy b { font-size: 15px; }
            .brand-copy span { font-size: 10px; }
            .brand-icon { font-size: 31px; }
            .chip { font-size: 10px; padding: 5px 9px; }
            .right-stage { padding: 10px; }
            .panel { padding: 15px; border-radius: 21px; }
            .question-card { padding: 15px; }
            .prompt-row { gap: 9px; }
            .speak-btn { width: 50px; height: 50px; flex-basis: 50px; font-size: 22px; }
            .choices { grid-template-columns: 1fr; }
            .choice { min-height: 70px; }
            .skills { grid-template-columns: 1fr 1fr; }
            .action-row, .action-group { width: 100%; }
            .action-group .btn { flex: 1; }
            .to-table { min-width: 0; width: 100%; font-size: 14px; }
            .to-table th, .to-table td { padding: 7px 6px; }
            .qtop { align-items: flex-start; flex-direction: column; gap: 10px; }
            .tag { font-size: 12px; }
        }
    </style>
</head>
<body class="oodles-app">
<img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <!-- Background and Confetti -->
    <canvas id="backgroundCanvas" aria-label="Background animation"></canvas>
    <canvas id="confetti"></canvas>

    <!-- App Container -->
    <div id="app-root" class="game-container"></div>

    <script>
        const state = {
            appState: 'welcome', // welcome, quiz, finish
            questions: [],
            answers: [],
            flags: [],
            currentIndex: 0,
            seconds: 0,
            showTeacherPanel: false,
            timerInterval: null
        };

        let audioCtx = null;

        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        const shuffle = (arr) => {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        };

        const uniqueChoices = (correct, candidates, count = 4) => {
            const out = [String(correct)];
            for (const c of shuffle(candidates.map(String))) {
                if (!out.includes(c)) out.push(c);
                if (out.length === count) break;
            }
            let bump = 1;
            while (out.length < count) {
                const v = String(Number(correct) + bump++);
                if (!out.includes(v)) out.push(v);
            }
            return shuffle(out);
        };

        const playTone = (freq, dur = 0.12, type = 'sine', vol = 0.06, delay = 0) => {
            if (!audioCtx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (C) audioCtx = new C();
            }
            if (audioCtx?.state === 'suspended') audioCtx.resume();
            if (!audioCtx) return;
            
            const ctx = audioCtx;
            const t = ctx.currentTime + delay;
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            
            o.connect(g);
            g.connect(ctx.destination);
            o.start(t);
            o.stop(t + dur + 0.03);
        };

        const sounds = {
            click: () => playTone(420, 0.08, 'triangle', 0.04),
            jump: () => { playTone(420, 0.07, 'triangle', 0.045); playTone(650, 0.08, 'triangle', 0.04, 0.06); },
            finish: () => { [523, 659, 784, 1046].forEach((f, i) => playTone(f, 0.25, 'triangle', 0.055, i * 0.12)); },
            flag: () => playTone(600, 0.1, 'square', 0.03)
        };

        const speakText = (text) => {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.88; u.pitch = 1.05;
            window.speechSynthesis.speak(u);
        };

        const formatTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;

        const skillsList = [

                let prompt = `What is ${a} minus ${b}?`;
                return { 
                    skill: 'subtraction', tag: '➖ Subtraction', prompt, speak: prompt, 
                    answer: String(total), choices: uniqueChoices(total, [total - 2, total - 1, total + 1, total + 2, total + 10].filter(c => c > 0)),

        window.handleGoHome = () => {

            let ans = state.answers[i];
            if (typeof ans === 'object' && ans !== null) ans = ans?.value;

                                <b>End Of Module Assessment</b>
                                <span>Oral Exam • 10 Questions</span>

                            </div>

                    </div>
                </section>
            `;
        };

        const renderMain = () => {
            let innerHtml = '';
            
            if (state.appState === 'welcome') {
                innerHtml = `
                    <div class="welcome">
                        <div class="welcome-icon">🧠</div>
                        <div class="welcome-level">PALS-SOLVER A</div>
                        <h1>End Of Module Assessment</h1>
                        <h2>Oral Exam</h2>
                        <p>Complete 10 different math challenges in order. You can move freely between questions and flag those you want to review. Click 'Submit Test' when you are done.</p>
                        <div class="welcome-badges">
                            <div class="welcome-badge">🧩 10 Questions</div>

                            <div class="welcome-badge">🚩 Flag to Review</div>
                        </div>

            } 
            else if (state.appState === 'quiz') {
                const q = state.questions[state.currentIndex];
                const currentAnsObj = state.answers[state.currentIndex];
                const currentVal = (typeof currentAnsObj === 'object' && currentAnsObj !== null) ? currentAnsObj?.value : currentAnsObj;
                const answeredCount = state.answers.filter(a => a !== null).length;
                const allAnswered = answeredCount === state.questions.length;
                
                let visHtml = '';
                if (q.type === 'html') visHtml = q.visHtml;
                else if (q.type === 'addition') visHtml = getAdditionHtml(q.data, currentAnsObj);
                else if (q.type === 'subtraction') visHtml = getSubtractionHtml(q.data, currentAnsObj);

                let choicesHtml = q.choices.map((c, i) => `

                            </div>
                        </div>
                        
                        ${allAnswered ? `<button class="btn purple full submit-btn-anim" onclick="handleSubmit()">📝 Submit Test</button>` : ''}

                        <div class="teacher-toggle"><button class="btn orange" onclick="handleToggleTeacher()" style="padding: 10px 16px; font-size: 14px;">👩‍🏫 Teacher Controls</button></div>
                        <div class="teacher-panel ${state.showTeacherPanel ? 'show' : ''}">

                            <button class="btn green" style="opacity: ${currentVal === '__teacher_correct__' ? 0.5 : 1}" onclick="handleAnswerChange('__teacher_correct__')">✓ Mark Correct</button>
                            <button class="btn ghost" style="opacity: ${currentVal === '__teacher_support__' ? 0.5 : 1}" onclick="handleAnswerChange('__teacher_support__')">Needs Support</button>

            else if (state.appState === 'finish') {
                const results = getResults();
                const stars = results.filter(Boolean).length;

                else if (ratio >= 0.7) titleMsg = 'Great Work!';

                let summaryHtml = state.questions.map((q, i) => {
                    let displayAns = state.answers[i];
                    if (typeof displayAns === 'object' && displayAns !== null) displayAns = displayAns?.value;

        const renderApp = () => {
            const root = document.getElementById('app-root');
            root.innerHTML = `<div class="wrap">${renderSidebar()}${renderMain()}</div>`;
        };

        const initCanvasAnimations = () => {
            const canvas = document.getElementById('backgroundCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d', { alpha: false });
            let bgWidth = 0, bgHeight = 0;
            let bgClouds = [], bgTrees = [], bgFlowers = [], bgButterflies = [];
            const flowerColors = ['#ff4b4b', '#ffc800', '#ce82ff', '#ffffff', '#1cb0f6', '#ff8fab'];

            const initBg = () => {
                bgClouds = []; bgTrees = []; bgFlowers = []; bgButterflies = [];
                const cloudCount = bgWidth < 600 ? 3 : 5;
                for (let i = 0; i < cloudCount; i++) bgClouds.push({ x: Math.random() * bgWidth, y: bgHeight * (0.08 + Math.random() * 0.34), size: 28 + Math.random() * (bgWidth < 600 ? 34 : 52), speed: Math.random() * 0.16 + 0.05, opacity: 0.72 + Math.random() * 0.24 });
                const treeCount = bgWidth < 600 ? 6 : 11;
                for (let i = 0; i < treeCount; i++) bgTrees.push({ x: (i / Math.max(1, treeCount - 1)) * bgWidth + (Math.random() * 70 - 35), y: bgHeight * (0.66 + Math.random() * 0.04), scale: 0.48 + Math.random() * 0.56 });
                const flowerCount = bgWidth < 600 ? 10 : 18;
                for (let i = 0; i < flowerCount; i++) bgFlowers.push({ x: Math.random() * bgWidth, y: bgHeight * 0.80 + Math.random() * (bgHeight * 0.16), color: flowerColors[Math.floor(Math.random() * flowerColors.length)], scale: 0.42 + Math.random() * 0.42, sway: Math.random() * Math.PI * 2, petals: Math.random() > 0.45 ? 6 : 5 });
                for (let i = 0; i < 4; i++) bgButterflies.push({ x: Math.random() * bgWidth, y: bgHeight * (0.28 + Math.random() * 0.24), size: 5 + Math.random() * 4, speed: 0.18 + Math.random() * 0.18, phase: Math.random() * Math.PI * 2, color: ['#ff6b9d', '#ffd93d', '#9b5de5', '#00bbf9'][i % 4] });
            };

            const resize = () => {
                const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
                bgWidth = window.innerWidth; bgHeight = window.innerHeight;
                canvas.width = Math.floor(bgWidth * dpr); canvas.height = Math.floor(bgHeight * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                initBg();
            };

            const draw = (time) => {
                bgClouds.forEach(c => { c.x -= c.speed; if (c.x + c.size * 2.4 < 0) { c.x = bgWidth + c.size * 2.4; c.y = bgHeight * (0.08 + Math.random() * 0.34); } });
                bgButterflies.forEach(b => { b.x += b.speed; b.phase += 0.08; if (b.x > bgWidth + 30) { b.x = -30; b.y = bgHeight * (0.28 + Math.random() * 0.24); } });

                const skyGrad = ctx.createLinearGradient(0, 0, 0, bgHeight * 0.72);
                skyGrad.addColorStop(0, '#7dd3fc'); skyGrad.addColorStop(0.62, '#bae6fd'); skyGrad.addColorStop(1, '#e0f8ff');
                ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, bgWidth, bgHeight);

                const sx = Math.min(90, bgWidth * 0.12), sy = Math.min(92, bgHeight * 0.13), sr = Math.max(35, Math.min(bgWidth, bgHeight) * 0.055);
                ctx.save(); ctx.translate(sx, sy);
                ctx.fillStyle = 'rgba(255, 213, 82, 0.22)'; ctx.beginPath(); ctx.arc(0, 0, sr * 1.75, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#FFD369'; ctx.beginPath(); ctx.arc(0, 0, sr, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#D35400'; ctx.beginPath(); ctx.arc(-sr * 0.32, -sr * 0.1, sr * 0.08, 0, Math.PI * 2); ctx.arc(sr * 0.32, -sr * 0.1, sr * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#D35400'; ctx.lineWidth = Math.max(3, sr * 0.07); ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, sr * 0.12, sr * 0.36, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); ctx.restore();

                ctx.save(); ctx.translate(bgWidth * 0.5, bgHeight * 0.67); ctx.lineWidth = Math.max(13, Math.min(22, bgWidth * 0.015)); ctx.lineCap = 'round';
                ['#ff4b4b', '#ff9900', '#ffc800', '#58cc02', '#1cb0f6', '#ce82ff'].forEach((color, i) => {
                    ctx.strokeStyle = color; ctx.globalAlpha = 0.82; ctx.beginPath(); ctx.arc(0, 0, Math.min(bgWidth * 0.34, bgHeight * 0.46, 420) - i * ctx.lineWidth, Math.PI, 0); ctx.stroke();
                });
                ctx.restore();

                bgClouds.forEach(c => {
                    ctx.save(); ctx.globalAlpha = c.opacity; ctx.fillStyle = '#ffffff'; ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2); ctx.arc(c.x + c.size * 0.82, c.y + c.size * 0.2, c.size * 0.72, 0, Math.PI * 2);
                    ctx.arc(c.x - c.size * 0.85, c.y + c.size * 0.22, c.size * 0.68, 0, Math.PI * 2); ctx.arc(c.x + c.size * 0.15, c.y - c.size * 0.28, c.size * 0.72, 0, Math.PI * 2);
                    ctx.fill(); ctx.restore();
                });

                ctx.fillStyle = '#65a30d'; ctx.beginPath(); ctx.moveTo(0, bgHeight); ctx.lineTo(0, bgHeight * 0.66);
                for (let x = 0; x <= bgWidth + 280; x += 280) ctx.quadraticCurveTo(x - 140, bgHeight * 0.55, x, bgHeight * 0.66);
                ctx.lineTo(bgWidth, bgHeight); ctx.fill();

                bgTrees.forEach(t => {
                    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(t.scale, t.scale);
                    ctx.fillStyle = '#8B5A2B'; ctx.fillRect(-9, 0, 18, 56);
                    ctx.fillStyle = '#4ade80'; ctx.beginPath(); ctx.arc(0, -24, 38, 0, Math.PI * 2); ctx.arc(-25, -12, 29, 0, Math.PI * 2); ctx.arc(24, -10, 30, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.arc(-12, -34, 12, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                });

                ctx.fillStyle = '#58cc02'; ctx.beginPath(); ctx.moveTo(0, bgHeight); ctx.lineTo(0, bgHeight * 0.72); ctx.quadraticCurveTo(bgWidth * 0.5, bgHeight * 0.66, bgWidth, bgHeight * 0.72); ctx.lineTo(bgWidth, bgHeight); ctx.fill();
                ctx.strokeStyle = '#84cc16'; ctx.lineWidth = Math.max(10, Math.min(18, bgWidth * 0.014)); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-20, bgHeight * 0.72); ctx.quadraticCurveTo(bgWidth * 0.5, bgHeight * 0.66, bgWidth + 20, bgHeight * 0.72); ctx.stroke();

                bgFlowers.forEach(f => {
                    ctx.save(); ctx.translate(f.x + Math.sin(time * 0.0015 + f.sway) * 1.4, f.y); ctx.scale(f.scale, f.scale);
                    ctx.strokeStyle = '#259a3f'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 5); ctx.quadraticCurveTo(2, 14, 0, 23); ctx.stroke();
                    ctx.fillStyle = '#55d85a'; ctx.beginPath(); ctx.ellipse(-6, 15, 4, 8, -0.8, 0, Math.PI * 2); ctx.ellipse(6, 18, 4, 8, 0.75, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = f.color;
                    for (let petal = 0; petal < (f.petals || 6); petal++) { ctx.save(); ctx.rotate((Math.PI * 2 * petal) / (f.petals || 6)); ctx.beginPath(); ctx.ellipse(0, -9, 5.2, 9.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
                    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = 'rgba(154,103,0,0.28)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
                });

                bgButterflies.forEach(b => {
                    ctx.save(); ctx.translate(b.x, b.y + Math.sin(b.phase) * 10); ctx.fillStyle = b.color; ctx.globalAlpha = 0.88;
                    ctx.beginPath(); ctx.ellipse(-b.size, 0, b.size, b.size * 1.35, Math.sin(b.phase) * 0.5, 0, Math.PI * 2); ctx.ellipse(b.size, 0, b.size, b.size * 1.35, -Math.sin(b.phase) * 0.5, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#334155'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -b.size * 1.1); ctx.lineTo(0, b.size * 1.2); ctx.stroke(); ctx.restore();
                });

                requestAnimationFrame(draw);
            };

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(draw);
        };

        const triggerConfetti = () => {
            const canvas = document.getElementById('confetti');
            if (!canvas) return;
            const cctx = canvas.getContext('2d');
            const dpr = Math.min(2, window.devicePixelRatio || 1);
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            let pieces = [];
            const colors = ['#58cc02', '#1cb0f6', '#ff4b4b', '#ffc800', '#ce82ff', '#ff8fab'];
            for (let i = 0; i < 220; i++) pieces.push({ x: window.innerWidth / 2, y: window.innerHeight * 0.35, vx: (Math.random() - 0.5) * 15, vy: -Math.random() * 12 - 4, g: 0.25 + Math.random() * 0.14, w: 5 + Math.random() * 7, h: 4 + Math.random() * 7, r: Math.random() * 6, color: colors[rand(0, colors.length - 1)], life: 160 + rand(0, 80) });
            
            const anim = () => {
                cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                pieces.forEach(p => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += 0.15; p.life--; cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.r); cctx.fillStyle = p.color; cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cctx.restore(); });
                pieces = pieces.filter(p => p.life > 0 && p.y < window.innerHeight + 50);
                if (pieces.length > 0) requestAnimationFrame(anim);
            };
            requestAnimationFrame(anim);
        };

        window.onload = () => {
            initCanvasAnimations();
            renderApp();
        };
    </script>
</body>
</html>

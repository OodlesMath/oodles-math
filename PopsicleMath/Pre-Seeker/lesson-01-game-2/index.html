<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Tracing Adventure - Ver2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {

            font-family: 'Nunito', sans-serif;

            background-color: #f0fdf4; /* Light green background */

            touch-action: none; /* Prevent scrolling while tracing */

            overflow: hidden;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            height: 100vh;

            margin: 0;

        }



        h1, .number-btn, .action-btn {

            font-family: 'Fredoka One', cursive;

        }



        #game-container {

            width: 100%;

            max-width: 600px;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding: 10px;

            box-sizing: border-box;

        }



        #canvas-wrapper {

            position: relative;

            width: 90vmin; /* Responsive square */

            height: 90vmin;

            max-width: 400px;

            max-height: 400px;

            margin-bottom: 20px;

            background-color: white;

            border-radius: 20px;

            box-shadow: 0 10px 25px rgba(0,0,0,0.1);

            border: 8px solid #a7f3d0; /* Mint border */

            overflow: hidden;

        }



        canvas {

            display: block;

            width: 100%;

            height: 100%;

            touch-action: none;

            cursor: crosshair;

        }



        #number-selector {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

            width: 100%;

            margin-bottom: 15px;

        }



        .number-btn {

            background-color: #6ee7b7;

            color: white;

            border: none;

            border-radius: 12px;

            width: 40px;

            height: 40px;

            font-size: 1.2rem;

            cursor: pointer;

            box-shadow: 0 4px 0 #34d399;

            transition: transform 0.1s, box-shadow 0.1s;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 0;

        }



        .number-btn:active {

            transform: translateY(4px);

            box-shadow: 0 0 0 #34d399;

        }



        .number-btn.active {

            background-color: #f472b6; /* Pink for active */

            box-shadow: 0 4px 0 #db2777;

        }



        .number-btn.completed {

            background-color: #fbbf24; /* Yellow for completed */

            box-shadow: 0 4px 0 #d97706;

        }



        #controls {

            display: flex;

            gap: 15px;

        }



        .action-btn {

            background-color: #60a5fa;

            color: white;

            border: none;

            border-radius: 15px;

            padding: 10px 20px;

            font-size: 1.1rem;

            cursor: pointer;

            box-shadow: 0 5px 0 #3b82f6;

            transition: transform 0.1s, box-shadow 0.1s;

        }



        .action-btn:active {

            transform: translateY(5px);

            box-shadow: 0 0 0 #3b82f6;

        }



        .action-btn.clear-btn {

            background-color: #f87171;

            box-shadow: 0 5px 0 #ef4444;

        }



        #feedback-message {

            position: absolute;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            font-size: 3rem;

            font-weight: bold;

            color: #fbbf24;

            text-shadow: 2px 2px 0px #d97706, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.3s, transform 0.3s;

            z-index: 10;

            font-family: 'Fredoka One', cursive;

            text-align: center;

            width: 100%;

        }



        #feedback-message.show {

            opacity: 1;

            transform: translate(-50%, -60%); /* Slight upward animation */

        }



        #page-header {

            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }



        .audio-btn {

            background-color: #f59e0b; /* Amber */

            color: white;

            border: none;

            border-radius: 50%;

            width: 50px;

            height: 50px;

            font-size: 1.5rem;

            cursor: pointer;

            box-shadow: 0 5px 0 #d97706;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: transform 0.1s, box-shadow 0.1s;

        }



        .audio-btn:active {

            transform: translateY(5px);

            box-shadow: 0 0 0 #d97706;

        }



        /* SVG icon styling for audio button */

        .audio-btn svg {

            width: 24px;

            height: 24px;

            fill: currentColor;

        }



        /* Guide layer inside canvas wrapper to show tracing path */

        #guide-layer {

            display: none;

        }

        #game-container {
            position: relative;
            width: 100vw;
            max-width: none;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        #page-header {
            position: absolute;
            top: 12.5%;
            right: 18%;
            width: auto;
            margin: 0;
            z-index: 20;
        }

        #page-header h1 {
            display: none !important;
        }

        .audio-btn {
            width: clamp(42px, 3vw, 50px);
            height: clamp(42px, 3vw, 50px);
            background: #38bdf8;
            box-shadow: 0 5px 0 #0284c7, 0 0 0 4px rgba(255,255,255,.92);
        }

        #number-selector {
            position: absolute;
            top: 12.5%;
            left: 50%;
            transform: translateX(-50%);
            width: min(58vw, 920px);
            margin: 0;
            gap: clamp(5px, .55vw, 9px);
            z-index: 18;
            background: transparent;
            padding: 0;
        }

        .number-btn {
            width: clamp(36px, 3.1vw, 46px);
            height: clamp(36px, 3.1vw, 46px);
            border-radius: 14px;
            border: 3px solid rgba(255,255,255,.95);
            font-size: clamp(1rem, 1.3vw, 1.25rem);
            box-shadow: 0 5px 0 rgba(15,23,42,.18), 0 7px 14px rgba(15,23,42,.12);
            color: #fff;
        }

        .number-btn:nth-child(5n+1) { background:#ff5b76; }
        .number-btn:nth-child(5n+2) { background:#28a9f6; }
        .number-btn:nth-child(5n+3) { background:#58c845; }
        .number-btn:nth-child(5n+4) { background:#9b6cf2; }
        .number-btn:nth-child(5n)   { background:#ff9f2d; }

        .number-btn.active {
            background: #ec4899 !important;
            box-shadow: 0 5px 0 #be185d, 0 0 0 4px rgba(255,255,255,.95), 0 8px 18px rgba(190,24,93,.22);
            transform: translateY(-2px) scale(1.07);
        }

        .number-btn.completed {
            background: #fbbf24 !important;
            box-shadow: 0 5px 0 #d97706, 0 0 0 3px rgba(255,255,255,.9);
        }

        #canvas-wrapper {
            position: absolute;
            left: 50%;
            top: 54%;
            transform: translate(-50%, -50%);
            width: min(46vmin, 440px);
            height: min(46vmin, 440px);
            max-width: none;
            max-height: none;
            margin: 0;
            background: transparent;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            overflow: visible;
            z-index: 12;
        }

        #drawing-canvas {
            filter: drop-shadow(0 5px 2px rgba(30,64,175,.06));
        }

        #feedback-message {
            font-size: clamp(2.1rem, 4vw, 3.2rem);
            text-shadow: 2px 2px 0 #d97706, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white, 0 5px 10px rgba(0,0,0,.12);
        }

        #controls {
            position: absolute;
            left: 50%;
            bottom: 7.5%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .action-btn {
            padding: 9px 22px;
            border: 3px solid rgba(255,255,255,.95);
            border-radius: 16px;
            box-shadow: 0 5px 0 #dc2626, 0 8px 15px rgba(220,38,38,.16);
        }

        .action-btn.clear-btn {
            background: #fb7185;
            box-shadow: 0 5px 0 #e11d48, 0 8px 15px rgba(225,29,72,.16);
        }

        @media (max-width: 900px) {
            #page-header {
                right: 9%;
                top: 12%;
            }
            #number-selector {
                width: 72vw;
                top: 12%;
            }
            #canvas-wrapper {
                width: min(54vmin, 410px);
                height: min(54vmin, 410px);
                top: 55%;
            }
        }

        @media (max-aspect-ratio: 4/3) {
            body {
                background-size: auto 100%;
            }
            #number-selector {
                width: 86vw;
                top: 12.5%;
            }
            #page-header {
                right: 5%;
                top: 20%;
            }
            #canvas-wrapper {
                width: min(63vw, 390px);
                height: min(63vw, 390px);
                top: 56%;
            }
            #controls {
                bottom: 6%;
            }
        }

        @media (max-height: 650px) and (min-aspect-ratio: 4/3) {
            #number-selector, #page-header { top: 10.5%; }
            #canvas-wrapper {
                width: min(48vmin, 350px);
                height: min(48vmin, 350px);
                top: 54%;
            }
            #controls { bottom: 4.5%; }
        }


        /* ===== VER4: SMOOTH VER1 NUMBERS + FREE TRACING + FULL FILL ===== */
        #controls {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 12px 14px;
            background: rgba(255,255,255,.92);
            border: 3px solid rgba(255,255,255,.98);
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(15,23,42,.14);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #controls.visible { display: flex; }
        .action-btn.next-btn {
            background: #58cc02;
            box-shadow: 0 5px 0 #3ea800, 0 8px 15px rgba(62,168,0,.18);
        }
        .action-btn.next-btn:hover { filter: brightness(1.03); }
        #drawing-canvas.locked { cursor: default; }
        #feedback-message {
            width: min(92%, 520px);
            line-height: 1.05;
        }
        @media (max-width: 600px) {
            #controls { gap: 8px; padding: 8px 9px 12px; }
            .action-btn { padding: 8px 15px; font-size: 1rem; }
        }

    </style>

</head>

<body>
<img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <div id="game-container">

        <div id="page-header">
<button class="audio-btn" onclick="speakNumber()" title="Listen Again" id="listen-btn">

                <svg viewBox="0 0 24 24">

                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>

                </svg>

            </button>

        </div>



        <div id="number-selector">

            <!-- Buttons will be generated by JS -->

        </div>



        <div id="canvas-wrapper">

            <!-- Canvas for the background guide number -->

            <canvas id="guide-layer"></canvas>

            <!-- Canvas for user drawing -->

            <canvas id="drawing-canvas"></canvas>

            <div id="feedback-message">Great Job!</div>

        </div>



        <div id="controls" aria-live="polite">

            <button id="retry-btn" class="action-btn clear-btn" onclick="clearCanvas()">Try Again</button>

            <button id="next-btn" class="action-btn next-btn" onclick="nextNumber()">Next ➜</button>

        </div>

    </div>



    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const guideCanvas = document.getElementById('guide-layer');
        const guideCtx = guideCanvas.getContext('2d', { willReadFrequently: true });
        const rawCanvas = document.createElement('canvas');
        const rawCtx = rawCanvas.getContext('2d', { willReadFrequently: true });

        const wrapper = document.getElementById('canvas-wrapper');
        const feedbackMsg = document.getElementById('feedback-message');
        const numberSelector = document.getElementById('number-selector');
        const controls = document.getElementById('controls');
        const nextBtn = document.getElementById('next-btn');
        const retryBtn = document.getElementById('retry-btn');

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentNumber = 1;
        let currentStrokeIndex = 0;
        let currentStrokePoints = [];
        let tracingCompleted = false;
        let attemptLocked = false;
        let feedbackTimer = null;

        const drawColors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#f97316'];
        let currentDrawColor = drawColors[0];

        const synth = window.speechSynthesis;
        let voices = [];

        function populateVoiceList() {
            voices = synth.getVoices();
        }
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        function speakNumber() {
            if (synth.speaking) synth.cancel();
            const utterThis = new SpeechSynthesisUtterance(currentNumber.toString());
            const friendlyVoice = voices.find(voice =>
                voice.lang.includes('en') && (voice.name.includes('Female') || voice.name.includes('Google US English'))
            ) || voices.find(voice => voice.lang.includes('en'));
            if (friendlyVoice) utterThis.voice = friendlyVoice;
            utterThis.pitch = 1.2;
            utterThis.rate = 0.9;
            synth.speak(utterThis);
        }

        /*
         * VER4
         * Keep the smooth, rounded number appearance from ver1.
         * Tracing can be continuous or split into multiple strokes.
         * Great Job appears only when the visible number is sufficiently filled.
         */
        const traceTemplates = {
            0: [
                [{x:68,y:18},{x:55,y:11},{x:41,y:13},{x:31,y:25},{x:27,y:43},{x:28,y:64},{x:36,y:81},{x:49,y:89},{x:63,y:86},{x:73,y:73},{x:77,y:54},{x:75,y:34},{x:68,y:18}]
            ],
            1: [
                [{x:31,y:34},{x:45,y:21},{x:57,y:16}],
                [{x:57,y:16},{x:57,y:87}]
            ],
            2: [
                [{x:25,y:29},{x:34,y:18},{x:49,y:13},{x:64,y:16},{x:74,y:27},{x:75,y:39},{x:69,y:49},{x:57,y:59},{x:30,y:81},{x:76,y:81}]
            ],
            3: [
                [{x:28,y:21},{x:46,y:14},{x:62,y:16},{x:72,y:26},{x:69,y:37},{x:59,y:45},{x:49,y:49},{x:61,y:51},{x:71,y:59},{x:76,y:70},{x:72,y:81},{x:61,y:88},{x:45,y:88},{x:30,y:81}]
            ],
            4: [
                [{x:67,y:15},{x:32,y:61}],
                [{x:32,y:61},{x:80,y:61}],
                [{x:67,y:15},{x:67,y:88}]
            ],
            5: [
                [{x:72,y:16},{x:34,y:16}],
                [{x:34,y:16},{x:34,y:48}],
                [{x:34,y:48},{x:58,y:48},{x:70,y:53},{x:77,y:63},{x:77,y:73},{x:71,y:83},{x:59,y:89},{x:44,y:88},{x:31,y:80}]
            ],
            6: [
                [{x:70,y:18},{x:56,y:14},{x:44,y:20},{x:35,y:34},{x:31,y:51},{x:32,y:69},{x:40,y:82},{x:52,y:89},{x:65,y:86},{x:74,y:77},{x:77,y:65},{x:72,y:55},{x:62,y:49},{x:50,y:50},{x:41,y:57},{x:39,y:68},{x:44,y:77},{x:53,y:81},{x:63,y:78},{x:69,y:70},{x:69,y:61},{x:63,y:55},{x:54,y:53}]
            ],
            7: [
                [{x:23,y:18},{x:79,y:18}],
                [{x:79,y:18},{x:42,y:88}]
            ],
            8: [
                [{x:66,y:18},{x:53,y:12},{x:40,y:16},{x:32,y:27},{x:32,y:39},{x:39,y:47},{x:50,y:53},{x:62,y:59},{x:70,y:68},{x:71,y:78},{x:65,y:87},{x:53,y:92},{x:40,y:88},{x:31,y:79},{x:30,y:68},{x:36,y:59},{x:50,y:53},{x:62,y:47},{x:70,y:39},{x:72,y:29},{x:66,y:18}]
            ],
            9: [
                [{x:68,y:18},{x:54,y:12},{x:41,y:16},{x:33,y:27},{x:33,y:39},{x:40,y:47},{x:51,y:51},{x:62,y:47},{x:70,y:38},{x:71,y:27},{x:68,y:18}],
                [{x:71,y:27},{x:71,y:51},{x:70,y:68},{x:65,y:81},{x:55,y:89},{x:43,y:91},{x:34,y:86}]
            ],
            10: [
                [{x:13,y:34},{x:24,y:22},{x:33,y:18}],
                [{x:33,y:18},{x:33,y:85}],
                [{x:73,y:18},{x:62,y:13},{x:53,y:18},{x:49,y:31},{x:48,y:50},{x:49,y:69},{x:54,y:82},{x:63,y:88},{x:73,y:84},{x:80,y:72},{x:82,y:54},{x:81,y:35},{x:77,y:23},{x:73,y:18}]
            ]
        };

        function templateFor(num) {
            return traceTemplates[num] || traceTemplates[1];
        }

        function toCanvasPoint(p) {
            return { x: p.x * canvas.width / 100, y: p.y * canvas.height / 100 };
        }

        function canvasStroke(stroke) {
            return stroke.map(toCanvasPoint);
        }

        function distance(a, b) {
            return Math.hypot(a.x - b.x, a.y - b.y);
        }

        function polylineLength(points) {
            let total = 0;
            for (let i = 1; i < points.length; i++) total += distance(points[i - 1], points[i]);
            return total;
        }

        function pointToSegmentDistance(p, a, b) {
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const len2 = dx * dx + dy * dy;
            if (!len2) return distance(p, a);
            let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            const q = { x: a.x + t * dx, y: a.y + t * dy };
            return distance(p, q);
        }

        function distanceToPolyline(p, line) {
            let best = Infinity;
            for (let i = 1; i < line.length; i++) {
                best = Math.min(best, pointToSegmentDistance(p, line[i - 1], line[i]));
            }
            return best;
        }

        function densify(points, spacing = 4) {
            if (!points.length) return [];
            const out = [points[0]];
            for (let i = 1; i < points.length; i++) {
                const a = points[i - 1];
                const b = points[i];
                const d = distance(a, b);
                const steps = Math.max(1, Math.ceil(d / spacing));
                for (let step = 1; step <= steps; step++) {
                    const t = step / steps;
                    out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
                }
            }
            return out;
        }

        function samplePolyline(points, sampleCount = 160) {
            if (points.length < 2) return points.slice();
            const segLens = [];
            let total = 0;
            for (let i = 1; i < points.length; i++) {
                const l = distance(points[i - 1], points[i]);
                segLens.push(l);
                total += l;
            }
            const samples = [];
            let seg = 0;
            let segStartDistance = 0;
            for (let sample = 0; sample < sampleCount; sample++) {
                const target = total * sample / (sampleCount - 1);
                while (seg < segLens.length - 1 && segStartDistance + segLens[seg] < target) {
                    segStartDistance += segLens[seg];
                    seg++;
                }
                const local = segLens[seg] ? (target - segStartDistance) / segLens[seg] : 0;
                const a = points[seg];
                const b = points[seg + 1];
                samples.push({ x: a.x + (b.x - a.x) * local, y: a.y + (b.y - a.y) * local });
            }
            return samples;
        }

        // Draw exactly the same smooth font-based number as ver1 into the hidden mask.
        function drawGuideMask(num) {
            guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
            guideCtx.globalCompositeOperation = 'source-over';
            guideCtx.font = `bold ${guideCanvas.height * 0.8}px 'Nunito'`;
            guideCtx.textAlign = 'center';
            guideCtx.textBaseline = 'middle';
            guideCtx.fillStyle = '#000000';
            let xOffset = guideCanvas.width / 2;
            if (num === 1) xOffset -= guideCanvas.width * 0.05;
            guideCtx.fillText(num, xOffset, guideCanvas.height / 2 + guideCanvas.height * 0.05);
        }

        // Visible rendering = ver1: a soft gray, rounded font glyph with the child's
        // paint clipped INSIDE the number. No angular tracing template is shown.
        function renderDisplay() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';
            ctx.font = `bold ${canvas.height * 0.8}px 'Nunito'`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#e5e7eb';
            let xOffset = canvas.width / 2;
            if (currentNumber === 1) xOffset -= canvas.width * 0.05;
            ctx.fillText(currentNumber, xOffset, canvas.height / 2 + canvas.height * 0.05);

            ctx.globalCompositeOperation = 'source-atop';
            ctx.drawImage(rawCanvas, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
        }

        function paintedTargetCoverage() {
            const guide = guideCtx.getImageData(0, 0, guideCanvas.width, guideCanvas.height).data;
            const paint = rawCtx.getImageData(0, 0, rawCanvas.width, rawCanvas.height).data;
            let targetPixels = 0;
            let paintedPixels = 0;
            for (let i = 3; i < guide.length; i += 4) {
                if (guide[i] > 45) {
                    targetPixels++;
                    if (paint[i] > 28) paintedPixels++;
                }
            }
            return targetPixels ? paintedPixels / targetPixels : 0;
        }

        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            const width = Math.max(1, Math.round(rect.width));
            const height = Math.max(1, Math.round(rect.height));
            canvas.width = width;
            canvas.height = height;
            guideCanvas.width = width;
            guideCanvas.height = height;
            rawCanvas.width = width;
            rawCanvas.height = height;
            rawCtx.lineJoin = 'round';
            rawCtx.lineCap = 'round';
            rawCtx.lineWidth = Math.min(width, height) * 0.15; // Same brush width as ver1
            drawGuideMask(currentNumber);
            resetAttemptState(false);
            renderDisplay();
        }
        window.addEventListener('resize', resizeCanvas);

        function setupButtons() {
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = `number-btn ${i === currentNumber ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => selectNumber(i);
                btn.id = `btn-${i}`;
                numberSelector.appendChild(btn);
            }
        }

        function hideFeedback() {
            clearTimeout(feedbackTimer);
            feedbackMsg.classList.remove('show');
        }

        function showFeedback(text, color, duration = 900) {
            clearTimeout(feedbackTimer);
            feedbackMsg.textContent = text;
            feedbackMsg.style.color = color;
            feedbackMsg.classList.add('show');
            if (duration > 0) {
                feedbackTimer = setTimeout(() => feedbackMsg.classList.remove('show'), duration);
            }
        }

        function hideControls() {
            controls.classList.remove('visible');
            nextBtn.style.display = 'none';
            retryBtn.style.display = 'inline-flex';
        }

        function showRetryControls() {
            controls.classList.add('visible');
            nextBtn.style.display = 'none';
            retryBtn.style.display = 'inline-flex';
        }

        function showSuccessControls() {
            controls.classList.add('visible');
            nextBtn.style.display = 'inline-flex';
            retryBtn.style.display = 'inline-flex';
        }

        function resetAttemptState(redraw = true) {
            isDrawing = false;
            currentStrokeIndex = 0;
            currentStrokePoints = [];
            tracingCompleted = false;
            attemptLocked = false;
            canvas.classList.remove('locked');
            rawCtx.clearRect(0, 0, rawCanvas.width, rawCanvas.height);
            hideFeedback();
            hideControls();
            if (redraw) renderDisplay();
        }

        function selectNumber(num) {
            currentNumber = num;
            document.querySelectorAll('.number-btn').forEach(btn => btn.classList.remove('active'));
            const selected = document.getElementById(`btn-${num}`);
            if (selected) selected.classList.add('active');
            currentDrawColor = drawColors[Math.floor(Math.random() * drawColors.length)];
            drawGuideMask(currentNumber);
            resetAttemptState(true);
            setTimeout(speakNumber, 250);
        }

        function clearCanvas() {
            resetAttemptState(true);
        }

        function nextNumber() {
            if (!tracingCompleted) return;
            hideFeedback();
            if (currentNumber < 10) {
                selectNumber(currentNumber + 1);
            } else {
                showFeedback('You did it!', '#58cc02', 800);
                setTimeout(() => selectNumber(1), 850);
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const source = e.touches && e.touches.length ? e.touches[0] : e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e;
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (source.clientX - rect.left) * scaleX,
                y: (source.clientY - rect.top) * scaleY
            };
        }

        function appendStrokePoint(pos) {
            const prev = currentStrokePoints[currentStrokePoints.length - 1];
            if (!prev || distance(prev, pos) >= 1.5) currentStrokePoints.push(pos);
        }

        function startDrawing(e) {
            if (attemptLocked || tracingCompleted) return;
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x;
            lastY = pos.y;

            // Same behavior as ver1: start the stroke exactly under the pointer.
            draw(e);

            if (e.type.startsWith('touch')) e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing || attemptLocked || tracingCompleted) return;
            if (e.type.startsWith('touch')) e.preventDefault();
            const pos = getPos(e);
            rawCtx.beginPath();
            rawCtx.moveTo(lastX, lastY);
            rawCtx.lineTo(pos.x, pos.y);
            rawCtx.strokeStyle = currentDrawColor;
            rawCtx.stroke();
            lastX = pos.x;
            lastY = pos.y;
            renderDisplay();
        }

        function validateStroke(userPoints, expectedLogical) {
            const expected = canvasStroke(expectedLogical);
            const minSide = Math.min(canvas.width, canvas.height);
            const denseUser = densify(userPoints, Math.max(2.8, minSide * 0.008));
            const denseExpected = samplePolyline(expected, 150);
            const pathTolerance = minSide * 0.105;
            const milestoneTolerance = minSide * 0.115;
            const startTolerance = minSide * 0.125;
            const endTolerance = minSide * 0.135;

            if (denseUser.length < 4) return { ok:false, reason:'too-short' };
            if (distance(denseUser[0], expected[0]) > startTolerance) return { ok:false, reason:'wrong-start' };
            if (distance(denseUser[denseUser.length - 1], expected[expected.length - 1]) > endTolerance) return { ok:false, reason:'wrong-end' };

            let outside = 0;
            for (const p of denseUser) {
                if (distanceToPolyline(p, expected) > pathTolerance * 1.25) outside++;
            }
            const insideRatio = 1 - outside / denseUser.length;
            if (insideRatio < 0.76) return { ok:false, reason:'off-path' };

            let covered = 0;
            for (const ep of denseExpected) {
                let near = false;
                for (const up of denseUser) {
                    if (distance(ep, up) <= pathTolerance) { near = true; break; }
                }
                if (near) covered++;
            }
            const coverage = covered / denseExpected.length;
            if (coverage < 0.82) return { ok:false, reason:'not-complete' };

            const expectedLength = polylineLength(expected);
            const userLength = polylineLength(denseUser);
            if (userLength < expectedLength * 0.70 || userLength > expectedLength * 2.45) {
                return { ok:false, reason:'length' };
            }

            // Direction/order check: the child must pass ordered milestones along the path.
            const milestoneCount = Math.max(6, Math.min(10, Math.round(expectedLength / (minSide * 0.10))));
            let cursor = 0;
            for (let m = 0; m < milestoneCount; m++) {
                const idx = Math.round((denseExpected.length - 1) * m / (milestoneCount - 1));
                const milestone = denseExpected[idx];
                let found = -1;
                for (let j = cursor; j < denseUser.length; j++) {
                    if (distance(denseUser[j], milestone) <= milestoneTolerance) {
                        found = j;
                        break;
                    }
                }
                if (found < 0) return { ok:false, reason:'wrong-direction' };
                cursor = found;
            }

            return { ok:true, coverage, insideRatio };
        }

        function stopDrawing(e) {
            if (!isDrawing || attemptLocked || tracingCompleted) return;
            isDrawing = false;
            if (e && e.type && e.type.startsWith('touch')) e.preventDefault();

            // VER4: the child may trace continuously or with many separate strokes.
            // We do not check stroke order or direction. We only check how much of
            // the smooth visible number has actually been painted.
            const fillCoverage = paintedTargetCoverage();

            // Require the number to be genuinely filled before showing Great Job.
            // 90% keeps the requirement strict while allowing anti-aliased edges.
            if (fillCoverage >= 0.90) {
                successFeedback();
            } else {
                // Keep the attempt active so the child can continue filling the same number.
                renderDisplay();
            }
        }

        function failFeedback() {
            attemptLocked = true;
            canvas.classList.add('locked');
            showFeedback('Try Again!', '#fb7185', 0);
            showRetryControls();
        }

        function successFeedback() {
            if (tracingCompleted) return;
            tracingCompleted = true;
            attemptLocked = true;
            canvas.classList.add('locked');
            const btn = document.getElementById(`btn-${currentNumber}`);
            if (btn) btn.classList.add('completed');
            renderDisplay();
            showFeedback('Great Job!', '#fbbf24', 0);
            showSuccessControls();

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 95,
                    spread: 70,
                    origin: { y: 0.62 },
                    colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d', '#ff36ff']
                });
            }
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing, { passive: false });
        canvas.addEventListener('touchcancel', stopDrawing, { passive: false });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        window.onload = () => {
            setupButtons();
            setTimeout(() => {
                resizeCanvas();
                selectNumber(1);
            }, 50);
        };
    </script>

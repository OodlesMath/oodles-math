body::after{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.10));z-index:-2;pointer-events:none}
button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:flex}
#setup{align-items:center;justify-content:center;padding:20px}
.setup-card{width:min(760px,88vw);background:rgba(255,255,255,.90);border:5px solid rgba(255,255,255,.85);border-radius:34px;padding:28px 34px 30px;box-shadow:0 18px 40px rgba(32,97,86,.18);backdrop-filter:blur(5px);text-align:center}
.title{font-size:clamp(34px,4.3vw,58px);line-height:1;margin:0 0 10px;font-weight:800;color:#009f76;text-shadow:0 3px 0 #fff}
.subtitle{font-size:clamp(17px,2vw,24px);margin:4px 0 22px;color:#347a6c;font-weight:700}
.levels{display:grid;grid-template-columns:repeat(2,minmax(170px,1fr));gap:12px;margin:16px auto 22px;max-width:460px}
.level-btn{padding:17px 8px;border-radius:18px;background:#7de5c2;color:#fff;font-weight:800;box-shadow:0 7px 0 #36bf91;transition:.15s transform,.15s box-shadow}
.level-btn:nth-child(1){background:#ffc037;box-shadow:0 7px 0 #e99a00}
.level-btn:nth-child(2){background:#ff8f50;box-shadow:0 7px 0 #e76628}
.level-btn:nth-child(3){background:#f56fb1;box-shadow:0 7px 0 #d63e8a}
.level-btn.selected{outline:5px solid #fff;transform:translateY(3px);box-shadow:0 4px 0 #129b73,0 0 0 8px #0fb77f}
.mode-title{font-size:17px;margin:2px 0 8px;color:#347a6c;font-weight:800}
.trace-modes{display:grid;grid-template-columns:repeat(2,minmax(170px,1fr));gap:12px;margin:8px auto 22px;max-width:520px}
.mode-btn{padding:14px 10px;border-radius:18px;background:#75d8ff;color:#fff;font-weight:800;box-shadow:0 7px 0 #2ea9dc;transition:.15s transform,.15s box-shadow;line-height:1.2}
.mode-btn:first-child{background:#a989f7;box-shadow:0 7px 0 #7654cf}
.mode-btn.selected{outline:5px solid #fff;transform:translateY(3px);box-shadow:0 4px 0 #129b73,0 0 0 8px #0fb77f}
.mode-btn small{display:block;font-size:11px;font-weight:700;opacity:.9;margin-top:4px}
.primary{padding:15px 34px;border-radius:18px;background:#0fb77f;color:#fff;font-weight:800;font-size:22px;box-shadow:0 7px 0 #087c5b;min-width:210px}
.primary:active,.soft-btn:active,.speaker:active{transform:translateY(3px);box-shadow:none}
.tiny-note{font-size:13px;opacity:.72;margin-top:16px}

#game{flex-direction:column;padding:16px 24px 18px}
.topbar{width:min(980px,86vw);margin:0 auto 8px;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding-right:120px;min-height:70px}
.game-title{font-size:clamp(28px,3vw,43px);font-weight:800;color:#009f76;text-shadow:0 3px 0 #fff}
.stats{display:flex;gap:10px;align-items:center}
.badge{background:rgba(255,255,255,.9);border:3px solid #98efce;border-radius:16px;padding:8px 13px;font-weight:800;box-shadow:0 5px 0 rgba(26,164,119,.22);white-space:nowrap}
.speaker{width:56px;height:56px;border-radius:50%;background:#ffa90b;color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 #dc7f00;font-size:27px}
.speaker svg{width:26px;height:26px;fill:#fff}
.progress-wrap{width:min(720px,72vw);height:13px;border-radius:20px;background:rgba(255,255,255,.72);margin:0 auto 8px;overflow:hidden;border:2px solid rgba(255,255,255,.95)}
.progress{height:100%;width:0;background:linear-gradient(90deg,#ffba2f,#f45ca6,#52dcae);border-radius:20px;transition:width .35s ease}
.main-area{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.prompt{font-size:clamp(19px,2vw,27px);font-weight:800;color:#226e60;background:rgba(255,255,255,.82);padding:8px 18px;border-radius:16px;box-shadow:0 5px 18px rgba(45,115,98,.12)}
.token-row{min-height:64px;display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
.token{min-width:48px;height:52px;padding:0 9px;border-radius:14px;background:rgba(255,255,255,.76);border:3px solid rgba(125,229,194,.8);display:grid;place-items:center;font-size:29px;font-weight:800;color:#6b8d87;transition:.2s}
.token.current{background:#fff6cb;color:#e98900;border-color:#ffc237;transform:scale(1.08);box-shadow:0 5px 0 rgba(239,157,0,.28)}
.token.done{background:#d9fff1;color:#0a9e70;border-color:#5fdcaf}
.board{position:relative;width:min(760px,70vw);height:min(500px,56vh);min-height:300px;background:transparent;border:none;border-radius:0;box-shadow:none;overflow:visible}
#traceCanvas{display:block;width:100%;height:100%;touch-action:none;-ms-touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair}
.hint{position:absolute;left:14px;bottom:11px;background:rgba(255,255,255,.87);border-radius:12px;padding:7px 11px;font-size:13px;font-weight:700;color:#4e8076;pointer-events:none}
.controls{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:1px;flex-wrap:wrap}.controls [hidden]{display:none !important}.next-btn{background:#13b67f;box-shadow:0 5px 0 #0b8a61}
.soft-btn{padding:10px 20px;border-radius:15px;background:#ff7474;color:#fff;font-weight:800;box-shadow:0 5px 0 #e84343}
.feedback{height:30px;font-size:22px;font-weight:800;color:#0ba06e;text-shadow:0 2px 0 white}
.feedback.bad{color:#f04d67}

#mini{align-items:center;justify-content:center;overflow:hidden}
#mini::before{content:"";position:absolute;inset:0;background:rgba(91,216,255,.07);pointer-events:none}
.mini-hud{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.9);padding:10px 18px;border-radius:20px;border:4px solid #8fe8ca;box-shadow:0 8px 24px rgba(33,110,93,.15);font-weight:800;font-size:22px}
.mini-title{color:#009f76;font-size:26px}
#balloonField{position:absolute;inset:0;overflow:hidden}
.balloon{position:absolute;bottom:-130px;width:62px;height:78px;border-radius:52% 48% 48% 52% / 56% 56% 44% 44%;box-shadow:inset -8px -10px 0 rgba(0,0,0,.10),inset 8px 8px 0 rgba(255,255,255,.28),0 7px 10px rgba(47,87,80,.12);animation:flyUp linear forwards,wiggle 1.2s ease-in-out infinite alternate;cursor:pointer;z-index:3}
.balloon::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:14px solid currentColor;filter:brightness(.78)}
.balloon::before{content:"";position:absolute;left:50%;top:72px;width:2px;height:70px;background:rgba(67,82,80,.35)}
@keyframes flyUp{to{bottom:110vh}}
@keyframes wiggle{from{margin-left:-10px;transform:rotate(-4deg)}to{margin-left:10px;transform:rotate(4deg)}}
.pop{animation:pop .16s ease-out forwards!important}
@keyframes pop{to{transform:scale(1.65);opacity:0}}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:burst .45s ease-out forwards;z-index:8}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

#results{align-items:center;justify-content:center;padding:20px}
.result-card{background:rgba(255,255,255,.92);border:6px solid #a2efd4;border-radius:34px;padding:30px 38px;text-align:center;box-shadow:0 18px 40px rgba(32,97,86,.18);min-width:min(520px,86vw)}
.result-score{font-size:64px;font-weight:800;color:#f39a00;line-height:1.1;margin:12px 0}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.secondary{background:#63dcb3;box-shadow:0 7px 0 #27b889}
.stars{font-size:36px;letter-spacing:7px;animation:floaty 1.2s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-6px)}}
.logo-space{position:absolute;right:18px;top:14px;width:140px;height:70px;pointer-events:none}
@media(max-width:800px){
  .levels{grid-template-columns:repeat(2,1fr)} .levels .level-btn:last-child{grid-column:1/-1}
  .setup-card{padding:22px}.topbar{width:96vw;padding-right:80px;grid-template-columns:1fr auto}.stats{grid-row:2;grid-column:1/3}.speaker{position:absolute;right:88px;top:19px}
  .board{width:92vw;height:54vh;background:transparent;border:none;box-shadow:none}.token{min-width:40px;height:44px;font-size:24px}.game-title{font-size:28px}.logo-space{width:74px}
}
@media(max-height:720px){.board{height:49vh;min-height:260px;background:transparent;border:none;box-shadow:none}.topbar{min-height:54px}.prompt{padding:5px 14px}.token-row{min-height:48px}.token{height:42px;font-size:23px}.feedback{height:24px;font-size:18px}}
</style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div class="logo-space"><!-- LOGO AREA --></div>
<section id="setup" class="screen active">
  <div class="setup-card">
    <h1 class="title">Number Tracing Adventure</h1>
    <div class="subtitle">Choose a Level</div>
    <div class="levels" id="levelButtons">
      <button class="level-btn selected" data-min="0" data-max="10">0–10</button>
      <button class="level-btn" data-min="11" data-max="20">11–20</button>
    </div>
    <div class="mode-title">Choose a Drawing Style</div>
    <div class="trace-modes" id="drawingStyleButtons">
      <button class="mode-btn selected" data-style="autofill">Auto Fill<small>Fills the white path for younger kids</small></button>
      <button class="mode-btn" data-style="free">Keep My Stroke<small>Keeps your own thick tracing line</small></button>
    </div>
    <button id="startBtn" class="primary">Start Game</button>
    <div class="tiny-note">8 tracing numbers and 2 tracing equations in each round.</div>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="game-title" aria-hidden="true"></div>
    <div class="stats">
      <div class="badge" id="scoreBadge">Score: 0 / 10</div>
      <div class="badge" id="progressBadge">1 / 10</div>
    </div>
    <button id="speakerBtn" class="speaker" aria-label="Hear it again" title="Hear it again">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zm0-8.5v2.08A7.5 7.5 0 0 1 20 12a7.5 7.5 0 0 1-3.5 6.42v2.08A9.48 9.48 0 0 0 22 12a9.48 9.48 0 0 0-5.5-8.5z"/></svg>
    </button>
  </div>
  <div class="progress-wrap"><div id="progressBar" class="progress"></div></div>
  <div class="main-area">
    <div id="prompt" class="prompt">Trace the number.</div>
    <div id="tokenRow" class="token-row"></div>
    <div class="board">
      <canvas id="traceCanvas"></canvas>
      <div class="hint">Start at the green dot and follow the path.</div>
    </div>
    <div id="feedback" class="feedback"></div>
    <div class="controls"><button id="resetBtn" class="soft-btn">Try Again</button><button id="nextBtn" class="soft-btn next-btn" hidden>Next</button></div>
  </div>
</section>



<section id="results" class="screen">
  <div class="result-card">
    <div class="stars">⭐ ⭐ ⭐</div>
    <h2 class="title" style="font-size:44px">Great Job!</h2>
    <div class="subtitle">Your Score</div>
    <div id="finalScore" class="result-score">0 / 10</div>
    <div class="result-actions">
      <button id="playAgainBtn" class="primary">Play Again</button>
      <button id="chooseLevelBtn" class="primary secondary">Choose Level</button>
    </div>
  </div>
</section>

const assetsReady = Promise.all(Object.entries(ASSET_DATA).map(([key,src])=>new Promise(resolve=>{

function getSymbolLaneMask(sym){
  if(symbolLaneMaskCache[sym]) return symbolLaneMaskCache[sym];
  const img = assetImages[sym];
  if(!img) return null;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  const x = c.getContext('2d');
  x.drawImage(img,0,0);
  const id = x.getImageData(0,0,c.width,c.height);
  const d = id.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i], g=d[i+1], b=d[i+2], a=d[i+3];
    const nearNeutral = Math.max(r,g,b)-Math.min(r,g,b) < 26;
    const isLane = a>6 && nearNeutral && r>214 && g>214 && b>214;
    d[i]=255; d[i+1]=255; d[i+2]=255; d[i+3]=isLane?255:0;
  }
  x.putImageData(id,0,0);
  c._laneAlpha = d;
  c._laneW = c.width;
  c._laneH = c.height;
  symbolLaneMaskCache[sym] = c;
  return c;
}

function makeNumberQuestions(){
  const nums=[]; for(let n=state.min;n<=state.max;n++) nums.push(n);

function makeEquationQuestion(existing){
  let tries=0;
  while(tries++<500){
    let op = Math.random()<0.5 ? '+' : '-';
    let a,b,result;
    if(state.max<=10){
      if(op==='+'){
        result=rand(0,10); a=rand(0,result); b=result-a;
      }else{
        a=rand(1,10); b=rand(0,Math.min(9,a)); result=a-b;
      }
    }else{
      if(op==='+'){
        result=rand(state.min,state.max);
        a=rand(1,Math.min(10,result-1)); b=result-a;
      }else{
        result=rand(state.min,state.max-1);
        b=rand(1,Math.min(9,state.max-result)); a=result+b;
      }
    }
    if(result<state.min || result>state.max) continue;
    if(a<0||b<0) continue;
    const text=`${a}${op}${b}=${result}`;

  const p=canvasPoint(e);
  const path=state.currentPath||[],tol=traceTolerance();
  if(state.strokeStarted&&!state.strokeReady){
    appendInterpolatedUserPoint(p);
    validateInkPoint(p);
    updateTraceProgress(p);
  }
  const total=Math.max(1,state.pathMetrics?.total||1);
  const progress=state.traceDistance/total;
  const end=path[path.length-1];

  // Ver4 is deliberately less sensitive than Ver3: lifting only completes a stroke
  // after the child has really reached its ending region.
  const nearEnd=!!end && dist(p,end)<=tol*1.75;
  const completedEnough=state.strokeReady||(progress>=.88&&nearEnd);
  if(completedEnough && state.drawStyle==='free' && state.completionFromDistance==null){
    state.completionFromDistance=state.traceDistance;
  }

  state.drawing=false;
  try{canvas.releasePointerCapture?.(e.pointerId)}catch(_){}
  if(!completedEnough){fail();return}

  // Preserve exactly the ink from this pointer session.
  commitCurrentStrokeInk();
  state.sessionSnapshot=null;
  state.strokeStarted=false;
  state.strokeReady=false;
  state.bridgeCandidate=false;
  state.offTrackCount=0;

  // Advance exactly ONE logical stroke after a lift.
  const sym=state.tokens[state.tokenIndex],strokes=P[sym]||P['0'];
  if(state.strokeIndex<strokes.length-1){
    state.strokeIndex++;
    preparePath();
    $('#feedback').textContent='Good! Next stroke.';
    $('#feedback').className='feedback';
    beep(550,.05,'sine',.025);
    draw();
    return;
  }

  state.tokenIndex++;
  state.strokeIndex=0;
  beep(700,.06,'sine',.035);
  if(state.tokenIndex<state.tokens.length){
    renderTokens();
    preparePath();
    $('#feedback').textContent='Nice! Keep going.';
    $('#feedback').className='feedback';
    draw();
    return;
  }
  completeQuestion();
});
canvas.addEventListener('pointercancel',()=>{if(state.drawing&&!state.questionComplete)fail()});
canvas.addEventListener('lostpointercapture',()=>{if(state.drawing&&!state.questionComplete){state.drawing=false;state.userLine=[];draw()}});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function completeQuestion(){
  if(!state.questionResolved){ if(state.eligible) state.score++; state.questionResolved=true; }
  state.questionComplete=true;
  $('#scoreBadge').textContent=`Score: ${state.score} / 10`;
  $('#feedback').textContent=state.eligible?'Great!':'Nice job!'; $('#feedback').className='feedback';
  $('#progressBar').style.width=`${(state.qIndex+1)*10}%`;
  $('#nextBtn').hidden=false; beep(880,.16,'sine',.07); draw();
}
function advanceAfterQuestion(){ if(state.qIndex>=9){ showResults(); return } state.qIndex++; loadQuestion() }
function resetCurrentQuestion(){
  speechSynthesis.cancel();
  if(!state.questionResolved)registerTryAgain();
  state.tokenIndex=0; state.strokeIndex=0; state.checkpointIndex=0; state.traceDistance=0; state.progressSegment=0; state.progressT=0; state.progressPoint=null; state.lastTracePointer=null; state.completionFromDistance=null; state.drawing=false; state.userLine=[]; state.bridgeMode=false; state.strokeStarted=false; state.offTrackCount=0; state.pendingTokenComplete=false; state.sessionSnapshot=null;
  state.inkSegments=[]; state.questionComplete=false; state.strokeReady=false;
  $('#nextBtn').hidden = true;
  renderTokens(); preparePath();
  $('#feedback').textContent='Try again!'; $('#feedback').className='feedback bad'; draw();
}
$('#resetBtn').addEventListener('click',()=>{resetCurrentQuestion()});
$('#nextBtn').addEventListener('click',()=>advanceAfterQuestion());
$('#speakerBtn').addEventListener('click',()=>speak(state.questions[state.qIndex].speak));
let resizeTimer=0;
function handleGameResize(){
  if(!$('#game').classList.contains('active'))return;
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(state.drawing)return;
    resizeCanvas(); computeLayout(); preparePath(); draw();
  },90);
}
window.addEventListener('resize',handleGameResize,{passive:true});
window.addEventListener('orientationchange',handleGameResize,{passive:true});
if(typeof ResizeObserver!=='undefined'){
  const ro=new ResizeObserver(()=>handleGameResize());
  if(canvas.parentElement)ro.observe(canvas.parentElement);
}

function beep(freq=440,dur=.08,type='sine',vol=.04){try{const AC=window.AudioContext||window.webkitAudioContext;beep.ac=beep.ac||new AC();const ac=beep.ac,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}}
function showResults(){speechSynthesis.cancel(); $('#finalScore').textContent=`${state.score} / 10`; show('results'); beep(700,.12,'sine',.04); setTimeout(()=>beep(880,.16,'sine',.05),130)}
async function startRound(){await assetsReady; state.questions=questionPool(); state.qIndex=0; state.score=0; show('game'); requestAnimationFrame(loadQuestion)}
$$('.level-btn').forEach(btn=>btn.addEventListener('click',()=>{$$('.level-btn').forEach(x=>x.classList.remove('selected')); btn.classList.add('selected'); state.min=+btn.dataset.min; state.max=+btn.dataset.max}));
$$('.mode-btn').forEach(btn=>btn.addEventListener('click',()=>{$$('.mode-btn').forEach(x=>x.classList.remove('selected')); btn.classList.add('selected'); state.drawStyle=btn.dataset.style;}));
$('#startBtn').addEventListener('click',()=>{beep(520,.06); startRound()});
$('#playAgainBtn').addEventListener('click',startRound);
$('#chooseLevelBtn').addEventListener('click',()=>show('setup'));
if('speechSynthesis' in window) speechSynthesis.getVoices();
})();
</script>
</body>
</html>

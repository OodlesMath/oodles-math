    .soft-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 48%, rgba(14, 86, 68, .10) 100%);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vh, 20px);
    }
    .screen.active { display: flex; }

    .card {
      width: min(680px, 94vw);
      background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(250,253,255,.94));
      border: 5px solid rgba(255,255,255,.98);
      border-radius: 32px;
      box-shadow: var(--shadow), inset 0 0 0 2px rgba(48,180,215,.10), 0 0 0 1px rgba(30,170,208,.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      width: 160px; height: 160px;
      right: -88px; top: -92px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(96,220,242,.16), rgba(96,220,242,0) 72%);
      pointer-events: none;
    }

    .start-card, .finish-card {
      max-width: 570px;
      padding: clamp(22px, 4vh, 40px);
      text-align: center;
      animation: popIn .32s cubic-bezier(.2,.9,.3,1.2);
    }

    .hero-icon {
      width: clamp(86px, 12vh, 112px);
      height: clamp(86px, 12vh, 112px);
      margin: 0 auto clamp(10px, 2vh, 18px);
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: linear-gradient(145deg, #fff9cf, #ffe889);
      border: 5px solid #fff;
      box-shadow: 0 10px 0 #e3b633, 0 18px 32px rgba(99, 77, 15, .15), inset 0 0 0 3px rgba(255,255,255,.42);
      font-size: clamp(48px, 7vh, 68px);
      animation: floaty 2.8s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -.03em;
      color: #21344e;
    }
    .lead {
      margin: clamp(10px, 2vh, 16px) auto clamp(18px, 3vh, 28px);
      max-width: 460px;
      font-size: clamp(16px, 2.1vw, 20px);
      line-height: 1.5;
      color: var(--muted);
      font-weight: 600;
    }

    .main-btn {
      width: 100%;
      border: 0;
      border-radius: 20px;
      padding: clamp(14px, 2.4vh, 19px) 24px;
      color: white;
      font-size: clamp(20px, 2.8vw, 26px);
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
    }
    .main-btn.start { background: var(--cyan); box-shadow: 0 7px 0 var(--cyan-dark); }
    .main-btn.again { background: var(--pink); box-shadow: 0 7px 0 var(--pink-dark); }
    .main-btn:hover { filter: brightness(1.04); transform: translateY(-2px); }
    .main-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }

    .game-shell {
      width: min(760px, 95vw);
      height: min(790px, 96vh);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(8px, 1.3vh, 14px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
    }
    .pill {
      min-height: 49px;
      padding: 8px 17px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.99), rgba(248,253,255,.95));
      border: 3px solid rgba(255,255,255,1);
      box-shadow: 0 6px 0 rgba(41,147,173,.13), 0 10px 20px rgba(49, 105, 114, .12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(15px, 2vw, 20px);
      font-weight: 900;
      white-space: nowrap;
    }
    #questionPill { color: #058ab2; justify-self: start; }
    #scorePill { color: #df4f86; justify-self: end; }
    #soundBtn {
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      box-shadow: 0 7px 18px rgba(49,105,114,.14);
      cursor: pointer;
      display: grid;
      place-items: center;
      color: #40526a;
      transition: transform .12s ease;
    }
    #soundBtn:active { transform: scale(.93); }
    #soundBtn svg { width: 27px; height: 27px; }

    .progress-track {
      width: min(420px, 62%);
      height: 18px;
      padding: 3px;
      margin: 0 auto;
      border-radius: 99px;
      background: rgba(255,255,255,.96);
      border: 2px solid rgba(255,255,255,.98);
      box-shadow: 0 5px 0 rgba(35,139,163,.16), 0 8px 18px rgba(49,105,114,.10);
      position: relative;
      overflow: visible;
    }
    .progress-track::before, .progress-track::after {
      position: absolute;
      top: 50%;
      transform: translateY(-54%);
      font-size: 17px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.08));
    }
    .progress-track::before { content: "🌼"; left: -28px; }
    .progress-track::after { content: "⭐"; right: -27px; }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.20) 0 22px, rgba(255,255,255,0) 22px 27px),
        linear-gradient(90deg, #29c4e8 0%, #66dbef 45%, #7be6cf 100%);
      box-shadow: inset 0 2px 2px rgba(255,255,255,.45);
      transition: width .45s cubic-bezier(.2,.8,.2,1);
      position: relative;
    }
    .progress-fill::after {
      content: "";
      position: absolute;
      right: 3px; top: 50%;
      width: 7px; height: 7px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 0 2px rgba(255,255,255,.36);
    }

    .game-card {
      flex: 0 1 auto;
      padding: clamp(16px, 2.6vh, 26px);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      box-shadow: 0 15px 38px rgba(25,79,99,.20), 0 7px 0 rgba(255,255,255,.66), inset 0 0 0 2px rgba(48,180,215,.08);
    }

    .question-title-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: clamp(10px, 1.7vh, 16px);
    }
    .question-title {
      margin: 0;
      font-size: clamp(25px, 4vw, 38px);
      font-weight: 900;
      color: #34455d;
      line-height: 1.15;
    }
    .mini-speaker {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #e5f9ff;
      color: #099bc1;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #a8e4f1;
    }
    .mini-speaker:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8e4f1; }
    .mini-speaker svg { width: 24px; height: 24px; }

    .pair-box {
      min-height: clamp(150px, 23vh, 220px);
      padding: clamp(12px, 2vh, 22px);
      border-radius: 28px;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,.90) 0 7px, transparent 8px),
        radial-gradient(circle at 88% 25%, rgba(255,255,255,.74) 0 5px, transparent 6px),
        linear-gradient(145deg, #fff9d8 0%, #fff0bd 48%, #ffefcf 100%);
      border: 4px solid #fff;
      box-shadow: inset 0 5px 15px rgba(171,125,28,.08), 0 8px 0 rgba(228,190,91,.22), 0 12px 22px rgba(32,48,71,.06);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: clamp(10px, 1.5vh, 14px);
      position: relative;
      overflow: hidden;
    }
    .pair-box::before {
      content: "✦";
      position: absolute;
      left: 18px; top: 13px;
      color: rgba(255,189,61,.55);
      font-size: 24px;
      transform: rotate(-12deg);
    }
    .pair-box::after {
      content: "✿";
      position: absolute;
      right: 18px; bottom: 9px;
      color: rgba(255,112,164,.38);
      font-size: 26px;
      transform: rotate(10deg);
    }

    .pair-line {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: clamp(10px, 2vw, 22px);
      width: min(500px, 100%);
    }
    .icon-tile {
      height: clamp(104px, 16vh, 142px);
      border-radius: 28px;
      border: 4px solid rgba(255,255,255,.98);
      display: grid;
      place-items: center;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
      font-size: clamp(62px, 9.5vh, 92px);
      line-height: 1;
      transition: transform .2s ease, opacity .2s ease;
      position: relative;
      overflow: hidden;
      filter: saturate(1.08);
      text-shadow: 0 5px 10px rgba(35,55,80,.08);
    }
    #leftIcon {
      background: linear-gradient(145deg, #fff 0%, #fff1f7 55%, #ffe4ef 100%);
      box-shadow: 0 9px 0 #efbfd0, 0 13px 22px rgba(157,67,102,.12);
      animation: iconFloatLeft 3.1s ease-in-out infinite;
    }
    #rightIcon {
      background: linear-gradient(145deg, #fff 0%, #eafaff 55%, #d9f6ff 100%);
      box-shadow: 0 9px 0 #b5e1ec, 0 13px 22px rgba(41,113,134,.12);
      animation: iconFloatRight 3.1s ease-in-out infinite;
    }
    .icon-tile::before {
      content: "";
      position: absolute;
      width: 54px; height: 54px;
      right: -18px; top: -18px;
      border-radius: 50%;
      background: rgba(255,255,255,.64);
    }
    .icon-tile::after {
      content: "✦";
      position: absolute;
      left: 11px; top: 7px;
      font-family: "Poppins", sans-serif;
      font-size: 17px;
      color: rgba(255,194,56,.68);
    }
    .plus {
      font-size: clamp(28px, 4.5vw, 46px);
      font-weight: 900;
      color: #f0a61c;
      text-shadow: 0 2px 0 white;
    }

    .feedback-slot {
      min-height: clamp(70px, 10vh, 92px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: clamp(8px, 1.2vh, 12px);
    }
    .feedback {
      width: 100%;
      border-radius: 18px;
      padding: clamp(10px, 1.5vh, 14px) 14px;
      animation: popIn .25s cubic-bezier(.2,.9,.3,1.2);
    }
    .feedback.correct { background: #e8f9ee; color: #19783a; border: 3px solid #b8efc8; }
    .feedback.wrong { background: #fff0f0; color: #b93d3d; border: 3px solid #ffc9c9; }
    .feedback-title { font-weight: 900; font-size: clamp(16px, 2.4vw, 21px); line-height: 1.2; }
    .feedback-text { margin-top: 3px; font-weight: 600; font-size: clamp(13px, 1.8vw, 16px); line-height: 1.35; }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(12px, 2vw, 18px);
    }
    .answer-btn {
      min-height: clamp(64px, 9vh, 82px);
      border: 0;
      border-radius: 24px;
      font-weight: 900;
      font-size: clamp(22px, 3vw, 29px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
    }
    .answer-btn.yes {
      background: linear-gradient(180deg, #72e9f5 0%, #4dd4e8 100%);
      color: #164b5c;
      border: 3px solid #bcf5fb;
      box-shadow: 0 8px 0 #28a9bf, 0 12px 20px rgba(28,156,180,.16);
    }
    .answer-btn.no {
      background: linear-gradient(180deg, #ff8fbd 0%, #ff68a5 100%);
      color: white;
      border: 3px solid #ffc0da;
      box-shadow: 0 8px 0 #d84a84, 0 12px 20px rgba(196,54,111,.16);
    }
    .answer-btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.03); }
    .answer-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.17); }
    .answer-btn:disabled { opacity: .52; cursor: default; }
    .thumb-icon { width: 30px; height: 30px; }

    .finish-score {
      margin: clamp(12px, 2vh, 18px) auto clamp(16px, 2.5vh, 26px);
      width: clamp(150px, 22vh, 185px);
      height: clamp(150px, 22vh, 185px);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #fff8c8, #ffe97d);
      border: 6px solid white;
      box-shadow: 0 9px 0 #e0b538, 0 18px 30px rgba(95,73,19,.18);
    }
    .finish-score b { display: block; font-size: clamp(42px, 7vh, 66px); line-height: 1; color: #d89200; }
    .finish-score span { display: block; margin-top: 4px; font-weight: 800; color: #926600; font-size: 14px; }
    .finish-message { font-size: clamp(16px, 2.2vw, 20px); color: var(--muted); font-weight: 650; margin-bottom: 20px; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.90); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-12px) rotate(-3deg); }
      50% { transform: translateX(12px) rotate(3deg); }
      75% { transform: translateX(-8px) rotate(-2deg); }
    }
    @keyframes correctPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.10); }
      100% { transform: scale(1); }
    }
    @keyframes floaty {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    .shake .icon-tile { animation: shake .42s ease; opacity: .75; }
    .correct-pop .icon-tile { animation: correctPop .44s ease; }

    @keyframes iconFloatLeft {
      0%,100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    @keyframes iconFloatRight {
      0%,100% { transform: translateY(-2px) rotate(1deg); }
      50% { transform: translateY(2px) rotate(-1deg); }
    }

    @media (max-height: 700px) {
      .game-shell { height: 98vh; gap: 7px; }
      .game-card { padding: 13px 18px; }
      .pair-box { min-height: 140px; margin-bottom: 8px; }
      .icon-tile { height: 100px; font-size: 58px; border-radius: 20px; }
      .feedback-slot { min-height: 58px; margin-bottom: 6px; }
      .answer-btn { min-height: 58px; }
      .question-title-row { margin-bottom: 8px; }
      .pill { min-height: 42px; padding: 6px 13px; }
      #soundBtn { width: 46px; height: 46px; }
    }

    @media (max-width: 560px) {
      .screen { padding: 9px; }
      .topbar { grid-template-columns: 1fr auto 1fr; gap: 5px; }
      .pill { padding: 6px 9px; font-size: 13px; }
      #soundBtn { width: 44px; height: 44px; }
      .game-card { border-radius: 24px; }
      .pair-line { gap: 7px; }
      .icon-tile { border-radius: 20px; }
      .answers { gap: 9px; }
      .answer-btn { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
  <main class="app" aria-label="Pair or Not game">
    <div class="soft-vignette"></div>

    <section id="startScreen" class="screen active">
      <div class="card start-card">
        <div class="hero-icon" aria-hidden="true">🧩</div>
        <h1>Pair or Not?</h1>
        <p class="lead">Do these two things go together? Look carefully and choose Yes or No.</p>
        <button id="startBtn" class="main-btn start">Start Game 🚀</button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="game-shell">
        <div class="topbar">
          <div id="questionPill" class="pill">Question 1 / 10</div>
          <button id="soundBtn" aria-label="Turn sound off" title="Sound on"></button>
          <div id="scorePill" class="pill">Score: 0 ⭐</div>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div id="progressFill" class="progress-fill"></div>
        </div>

        <div id="gameCard" class="card game-card">
          <div class="question-title-row">
            <h2 class="question-title">Are they a pair?</h2>
            <button id="speakBtn" class="mini-speaker" aria-label="Read the question" title="Listen"></button>
          </div>

          <div class="pair-box">
            <div class="pair-line" aria-live="polite">
              <div id="leftIcon" class="icon-tile"></div>
              <div class="plus">+</div>
              <div id="rightIcon" class="icon-tile"></div>
            </div>
          </div>

          <div class="feedback-slot" aria-live="polite">
            <div id="feedback" hidden></div>
          </div>

          <div class="answers">
            <button id="yesBtn" class="answer-btn yes">
              Yes
              <svg class="thumb-icon" viewBox="0 0 64 64" aria-hidden="true">
                <path fill="currentColor" d="M23 56H11c-3.3 0-6-2.7-6-6V29c0-3.3 2.7-6 6-6h12v33Zm6-2V25l9-16c1.5-2.7 5-3.8 7.7-2.3 2.3 1.2 3.5 3.8 2.9 6.3l-2.7 10H55c3.1 0 5.8 2.4 6 5.5v.5l-3.2 20.2c-.5 2.9-3 4.8-5.9 4.8H29Z"/>
              </svg>
            </button>
            <button id="noBtn" class="answer-btn no">
              No
              <svg class="thumb-icon" viewBox="0 0 64 64" aria-hidden="true">
                <path fill="currentColor" d="M23 8H11c-3.3 0-6 2.7-6 6v21c0 3.3 2.7 6 6 6h12V8Zm6 2v29l9 16c1.5 2.7 5 3.8 7.7 2.3 2.3-1.2 3.5-3.8 2.9-6.3l-2.7-10H55c3.1 0 5.8-2.4 6-5.5V35l-3.2-20.2c-.5-2.9-3-4.8-5.9-4.8H29Z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section id="finishScreen" class="screen">
      <div class="card finish-card">
        <div id="finishIcon" class="hero-icon" aria-hidden="true">🎈</div>
        <h1>Game Over!</h1>
        <div class="finish-score">
          <div><b id="finalScore">0 / 10</b><span>Your score</span></div>
        </div>
        <div id="finishMessage" class="finish-message">Great effort! Try again and beat your score.</div>
        <button id="againBtn" class="main-btn again">Play Again 🔄</button>
      </div>
    </section>
  </main>

  <script>
    const questionPool = [
      { left: "👟", right: "🧦", answer: true,  explanation: "Shoes and socks both go on your feet." },
      { left: "🥄", right: "🥣", answer: true,  explanation: "You can use a spoon with a bowl." },
      { left: "🍓", right: "🍰", answer: true,  explanation: "Strawberries can go nicely with cake." },
      { left: "🪥", right: "🦷", answer: true,  explanation: "A toothbrush helps clean your teeth." },
      { left: "🐶", right: "🦴", answer: true,  explanation: "Dogs often like to chew bones." },
      { left: "🐥", right: "🥚", answer: true,  explanation: "A chick comes from an egg." },
      { left: "🐝", right: "🌼", answer: true,  explanation: "Bees visit flowers for nectar." },
      { left: "🍔", right: "🍟", answer: true,  explanation: "Burgers and fries are often eaten together." },
      { left: "🌧️", right: "☂️", answer: true, explanation: "An umbrella helps keep you dry in the rain." },
      { left: "🌙", right: "⭐", answer: true,  explanation: "The moon and stars can be seen at night." },
      { left: "👟", right: "🍌", answer: false, explanation: "A shoe and a banana do not belong together." },
      { left: "☕", right: "⚽", answer: false, explanation: "Coffee and a soccer ball do not make a pair." },
      { left: "🦷", right: "🚗", answer: false, explanation: "A tooth and a car do not belong together." },
      { left: "🐟", right: "🌳", answer: false, explanation: "Fish live in water, not in trees." },
      { left: "🐱", right: "🥄", answer: false, explanation: "A cat and a spoon do not make a pair." },
      { left: "🍎", right: "🎮", answer: false, explanation: "An apple is food, but a game controller is not." },
      { left: "🍕", right: "🧼", answer: false, explanation: "Pizza and soap do not belong together." },
      { left: "🌻", right: "🚗", answer: false, explanation: "A sunflower and a car do not make a pair." },
      { left: "🔥", right: "🍦", answer: false, explanation: "Fire and ice cream do not make a matching pair." },
      { left: "🚲", right: "🚀", answer: false, explanation: "A bike and a rocket are very different vehicles." }
    ];
    const startScreen = document.getElementById('startScreen');
    const gameScreen = document.getElementById('gameScreen');
    const finishScreen = document.getElementById('finishScreen');
    const startBtn = document.getElementById('startBtn');
    const againBtn = document.getElementById('againBtn');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const soundBtn = document.getElementById('soundBtn');
    const speakBtn = document.getElementById('speakBtn');
    const questionPill = document.getElementById('questionPill');
    const scorePill = document.getElementById('scorePill');
    const progressFill = document.getElementById('progressFill');
    const leftIcon = document.getElementById('leftIcon');
    const rightIcon = document.getElementById('rightIcon');
    const feedback = document.getElementById('feedback');
    const gameCard = document.getElementById('gameCard');
    const finalScore = document.getElementById('finalScore');
    const finishIcon = document.getElementById('finishIcon');
    const finishMessage = document.getElementById('finishMessage');

    const speakerSvg = (muted = false) => muted
      ? `<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M8 25h12L34 13v38L20 39H8z"/><path d="M43 24l13 16M56 24L43 40" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>`
      : `<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M8 25h12L34 13v38L20 39H8z"/><path d="M42 23c5 4 5 14 0 18M49 17c10 8 10 22 0 30" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>`;

    soundBtn.innerHTML = speakerSvg(false);
    speakBtn.innerHTML = speakerSvg(false);

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let soundEnabled = true;
    let isTransitioning = false;
    let timerId = null;
    let audioCtx = null;

    function showScreen(screen) {
      [startScreen, gameScreen, finishScreen].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function shuffledTen() {
      const seen = new Set();
      const uniquePool = questionPool.filter(q => {
        const key = `${q.left}|${q.right}|${q.answer}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
      const arr = [...uniquePool];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.slice(0, 10);
    }

    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function playTone(type, f1, f2, duration) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f1, audioCtx.currentTime);
        if (f2) osc.frequency.exponentialRampToValueAtTime(f2, audioCtx.currentTime + duration * .7);
        gain.gain.setValueAtTime(.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function speak(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = .82;
      u.pitch = 1.05;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    }

    function updateSoundButton() {
      soundBtn.innerHTML = speakerSvg(!soundEnabled);
      soundBtn.setAttribute('aria-label', soundEnabled ? 'Turn sound off' : 'Turn sound on');
      soundBtn.title = soundEnabled ? 'Sound on' : 'Sound off';
      speakBtn.innerHTML = speakerSvg(false);
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      if (!q) return;

      questionPill.textContent = `Question ${currentIndex + 1} / ${questions.length}`;
      scorePill.textContent = `Score: ${score} ⭐`;
      progressFill.style.width = `${(currentIndex / questions.length) * 100}%`;
      leftIcon.textContent = q.left;
      rightIcon.textContent = q.right;
      feedback.hidden = true;
      feedback.className = '';
      feedback.innerHTML = '';
      gameCard.classList.remove('shake', 'correct-pop');
      yesBtn.disabled = false;
      noBtn.disabled = false;
      isTransitioning = false;

      if (soundEnabled) {
        setTimeout(() => speak('Are they a pair?'), 180);
      }
    }

    function startGame() {
      clearTimeout(timerId);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      initAudio();
      questions = shuffledTen();
      currentIndex = 0;
      score = 0;
      isTransitioning = false;
      showScreen(gameScreen);
      renderQuestion();
    }

    function handleAnswer(choice) {
      if (isTransitioning) return;
      isTransitioning = true;
      yesBtn.disabled = true;
      noBtn.disabled = true;

      const q = questions[currentIndex];
      const correct = choice === q.answer;

      feedback.hidden = false;
      feedback.className = `feedback ${correct ? 'correct' : 'wrong'}`;
      feedback.innerHTML = `
        <div class="feedback-title">${correct ? '🎉 Great job! That is right.' : '💡 Nice try! That is not the pair.'}</div>
        <div class="feedback-text">${q.explanation}</div>
      `;

      if (correct) {
        score += 1;
        scorePill.textContent = `Score: ${score} ⭐`;
        gameCard.classList.remove('shake');
        void gameCard.offsetWidth;
        gameCard.classList.add('correct-pop');
        playTone('sine', 520, 760, .42);
      } else {
        gameCard.classList.remove('correct-pop');
        void gameCard.offsetWidth;
        gameCard.classList.add('shake');
        playTone('triangle', 190, 120, .38);
      }

      if (soundEnabled) speak(q.explanation);

      timerId = setTimeout(() => {
        gameCard.classList.remove('shake', 'correct-pop');
        if (currentIndex < questions.length - 1) {
          currentIndex += 1;
          renderQuestion();
        } else {
          finishGame();
        }
      }, soundEnabled ? 3000 : 1700);
    }

    function finishGame() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      progressFill.style.width = '100%';
      finalScore.textContent = `${score} / ${questions.length}`;
      const perfect = score === questions.length;
      finishIcon.textContent = perfect ? '🏆' : '🎈';
      finishMessage.textContent = perfect
        ? 'Perfect! You are a matching master!'
        : 'Great effort! Play again and try for a perfect score.';
      showScreen(finishScreen);
      if (soundEnabled) {
        playTone('sine', 520, 850, .7);
        setTimeout(() => speak(perfect ? 'Perfect! You are a matching master!' : 'Great effort!'), 180);
      }
    }

    startBtn.addEventListener('click', startGame);
    againBtn.addEventListener('click', startGame);
    yesBtn.addEventListener('click', () => handleAnswer(true));
    noBtn.addEventListener('click', () => handleAnswer(false));
    speakBtn.addEventListener('click', () => speak('Are they a pair?'));
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (!soundEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
      if (soundEnabled) initAudio();
      updateSoundButton();
    });

    document.addEventListener('keydown', (e) => {
      if (!gameScreen.classList.contains('active') || isTransitioning) return;
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'y') handleAnswer(true);
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'n') handleAnswer(false);
    });
  </script>
</body>
</html>

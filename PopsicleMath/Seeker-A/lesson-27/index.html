<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Adventure - Heavy & Light (Ver 6)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            touch-action: manipulation;
            user-select: none;
            overflow: hidden;
            background: #bae6fd;
        }

        /* --- BEAUTIFUL TYPOGRAPHY --- */
        .text-fun-title {
            background: linear-gradient(to bottom, #ffffff, #fde047, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 6px 0px #b45309) drop-shadow(0px 8px 10px rgba(0,0,0,0.3));
            letter-spacing: 2px;
        }

        .text-fun-subtitle {
            color: #fff;
            text-shadow: 
                3px 3px 0 #ec4899, -2px -2px 0 #ec4899,  
                2px -2px 0 #ec4899, -2px 2px 0 #ec4899,
                2px 2px 0 #ec4899, 0 6px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        /* --- ENHANCED ICONS --- */
        .emoji-sticker {
            display: inline-block;
            filter: drop-shadow(0 12px 10px rgba(0,0,0,0.35)) drop-shadow(0 0 4px rgba(255,255,255,0.8));
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- NEW CUSTOM UNITS --- */
        .icon-marble {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 30%),
                        repeating-linear-gradient(60deg, #3b82f6 0%, #3b82f6 25%, #f8fafc 25%, #f8fafc 35%, #ec4899 35%, #ec4899 60%, #f8fafc 60%, #f8fafc 70%); 
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.5), 2px 2px 4px rgba(0,0,0,0.3);
            vertical-align: middle;
        }

        /* Cục tẩy thay cho sỏi */
        .icon-eraser {
            display: inline-block;
            width: 32px;
            height: 18px;
            background: linear-gradient(to right, #f472b6 40%, #0ea5e9 40%);
            border-radius: 4px;
            box-shadow: 
                inset 2px 2px 4px rgba(255,255,255,0.4),
                inset -2px -2px 4px rgba(0,0,0,0.2),
                2px 2px 4px rgba(0,0,0,0.3);
            vertical-align: middle;
            transform: rotate(-10deg);
        }

        .icon-cap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 
                inset 0 0 0 3px #dc2626,
                inset 0 0 5px 4px rgba(0,0,0,0.3), 
                2px 2px 4px rgba(0,0,0,0.3); 
            vertical-align: middle;
            position: relative;
        }
        .icon-cap::after {
            content: '';
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
        }

        /* --- BACKGROUND ELEMENTS --- */
        .sky-bg {
            background: linear-gradient(to bottom, #38bdf8 0%, #7dd3fc 50%, #bae6fd 100%);
            position: relative;
        }

        .sun {
            position: absolute;
            top: -20px;
            left: -20px;
            width: clamp(100px, 15vw, 160px);
            height: clamp(100px, 15vw, 160px);
            background: radial-gradient(circle, #fff 10%, #fef08a 30%, #facc15 60%, transparent 75%);
            border-radius: 50%;
            box-shadow: 0 0 60px 30px rgba(253, 224, 71, 0.6);
            animation: sun-glow 4s infinite alternate ease-in-out;
            z-index: 0;
        }

        @keyframes sun-glow {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.15); opacity: 1; }
        }

        .cloud-container {
            position: absolute;
            z-index: 0;
            filter: drop-shadow(0 15px 20px rgba(255, 255, 255, 0.5));
        }
        .cloud-float { animation: float-h 45s infinite linear; }
        .cloud-bob { animation: bob 4s infinite alternate ease-in-out; }
        @keyframes float-h {
            from { transform: translateX(-250px); }
            to { transform: translateX(100vw); }
        }
        @keyframes bob {
            from { transform: translateY(0px); }
            to { transform: translateY(15px); }
        }

        /* Grass */
        .grass-ground {
            background-color: #22c55e;
            background-image: 
                radial-gradient(circle at 15% 30%, #16a34a 2%, transparent 2.5%),
                radial-gradient(circle at 85% 70%, #16a34a 2%, transparent 2.5%);
            background-size: 80px 80px;
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.15);
        }

        /* --- ENHANCED BALANCE SCALE --- */
        .scale-wrapper {
            position: relative;
            transform-origin: bottom center;
            transform: scale(min(1, min(calc(100vw / 460), calc(100vh / 750))));
            width: 420px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 10;
        }

        .scale-base-new {
            width: 260px;
            height: 35px;
            background: linear-gradient(to bottom, #1e40af, #1e3a8a);
            border-radius: 20px 20px 8px 8px;
            position: absolute;
            bottom: 0;
            border-bottom: 8px solid #172554;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .scale-pillar-new {
            width: 35px;
            height: 210px;
            background: linear-gradient(to right, #1d4ed8, #3b82f6, #1d4ed8);
            position: absolute;
            bottom: 35px;
            border-radius: 20px 20px 0 0;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            border: 2px solid #1e3a8a;
        }

        .scale-pivot-new {
            width: 65px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, #60a5fa, #1e40af, #172554);
            border-radius: 50%;
            position: absolute;
            bottom: 210px; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            border: 3px solid #1e3a8a;
        }

        .scale-pivot-inner {
            width: 25px;
            height: 25px;
            background: #fbbf24;
            border-radius: 50%;
            box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
        }

        .scale-beam-new {
            width: 400px;
            height: 22px;
            background: linear-gradient(to bottom, #3b82f6, #1e40af);
            position: absolute;
            bottom: 232px;
            border-radius: 11px;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
            z-index: 15;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4);
            border: 2px solid #1e3a8a;
        }

        .pan-hinge {
            position: absolute;
            top: 11px;
            width: 16px;
            height: 55px;
            background: linear-gradient(to right, #94a3b8, #cbd5e1);
            border-radius: 8px;
            transform-origin: top center;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 16;
            border: 2px solid #64748b;
        }

        .pan-plate {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 40px;
            background: linear-gradient(to bottom, #fde047, #eab308);
            border-radius: 0 0 85px 85px;
            border-top: 6px solid #ca8a04;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 3px 6px rgba(255,255,255,0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 5px;
        }

        .scale-obj-left {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: -5px;
            font-size: 6.5rem; 
            filter: drop-shadow(0 12px 10px rgba(0,0,0,0.35));
            z-index: 25;
        }

        .scale-units-right {
            position: absolute;
            bottom: 100%;
            width: 100%;
            display: flex;
            flex-wrap: wrap-reverse;
            justify-content: center;
            align-content: flex-start;
            gap: 2px;
            margin-bottom: -2px;
            z-index: 25;
        }

        .unit-item {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .unit-item:active { transform: scale(0.9); }
        .unit-item:hover { transform: scale(1.1) translateY(-5px); }

        /* --- STUNNING 2.5D BOWLING --- */
        #screen-bowling {
            background: radial-gradient(circle at 50% 100%, #fbcfe8 0%, #d8b4fe 40%, #4f46e5 100%);
        }

        .bowling-lane-2d {
            width: clamp(280px, 80vw, 400px);
            height: clamp(350px, 45vh, 450px);
            position: relative;
            margin: 0 auto;
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            background: 
                linear-gradient(to top, rgba(0,0,0,0.15), transparent),
                repeating-linear-gradient(90deg, transparent, transparent 8%, rgba(0,0,0,0.1) 8%, rgba(0,0,0,0.1) 10%),
                linear-gradient(to top, #fef08a, #b45309);
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.6);
        }

        #bowling-area {
            position: absolute;
            top: 5%; left: 0; width: 100%; height: 35%;
        }

        .pin-wrapper {
            position: absolute;
            width: clamp(25px, 7%, 40px);
            height: clamp(70px, 18%, 110px);
            transform: translateX(-50%);
            transform-origin: bottom center;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s;
            z-index: 10;
        }

        .bowling-ball-2d {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: clamp(65px, 16vw, 95px);
            height: clamp(65px, 16vw, 95px);
            background: radial-gradient(circle at 30% 20%, #ff8a80 0%, #e53935 20%, #b71c1c 50%, #4a0404 85%, #000000 100%);
            border-radius: 50%;
            transform: translateX(-50%);
            box-shadow: 15px 15px 30px rgba(0,0,0,0.8), inset -15px -15px 25px rgba(0,0,0,0.9), inset 8px 8px 20px rgba(255,255,255,0.4);
            z-index: 50;
            transition: bottom 0.7s cubic-bezier(0.3, 0, 0.2, 1), left 0.7s linear, transform 0.7s cubic-bezier(0.3, 0, 0.2, 1), opacity 0.7s;
        }

        .ball-hole {
            position: absolute;
            background: radial-gradient(circle at 70% 70%, #000 30%, #2a0000 100%);
            border-radius: 50%;
            box-shadow: inset 3px 3px 8px #000, 1px 1px 2px rgba(255,255,255,0.3);
        }

        /* --- AIM BAR --- */
        .aim-container {
            width: w-full; max-width: 400px;
            margin: 15px auto; padding: 8px;
            background: #1e293b; border-radius: 50px;
            border: 4px solid #475569;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer; position: relative;
        }
        
        .aim-track {
            width: 100%; height: 24px; border-radius: 12px;
            background: linear-gradient(to right, #ef4444 0%, #facc15 30%, #22c55e 50%, #facc15 70%, #ef4444 100%);
            position: relative;
        }

        #aim-cursor {
            position: absolute; top: -4px; bottom: -4px;
            width: 12px; background: #ffffff;
            border: 2px solid #000; border-radius: 6px;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            transform: translateX(-50%); left: 50%;
        }

        /* --- UI HELPERS --- */
        .pop-in { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .wiggle { animation: wiggle 0.4s ease-in-out; }
        @keyframes wiggle {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
        }

        .candy-btn {
            background: linear-gradient(to bottom, #4ade80, #16a34a);
            border-bottom: 6px solid #14532d;
            box-shadow: 0 10px 20px rgba(22, 163, 74, 0.4), inset 0 2px 5px rgba(255,255,255,0.5);
            transition: all 0.2s;
        }
        .candy-btn:active { border-bottom: 0px; transform: translateY(6px); }
        
        .mc-btn {
            background: white;
            border-bottom: 8px solid #cbd5e1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .mc-btn:hover { transform: translateY(-5px); border-bottom-width: 10px; }
        .mc-btn:active { border-bottom-width: 0px; transform: translateY(8px); }

        #fireworksCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 100;
        }

        /* --- VER 2: BGwao embedded background --- */
        #bgwao-frame {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            z-index: 0;
            pointer-events: none;
        }
        body > .sun,
        body > .cloud-container,
        body > .grass-ground { display: none !important; }

        /* --- VER 2: comparison balance scale for HEAVIER/LIGHTER --- */
        .compare-scale-wrap {
            position: relative;
            width: min(760px, 94vw);
            height: min(470px, 58vh);
            min-height: 360px;
            margin: 20px auto 86px;
            filter: drop-shadow(0 18px 18px rgba(15, 23, 42, .18));
        }
        .compare-scale-base {
            position: absolute;
            left: 50%; bottom: 4px;
            transform: translateX(-50%);
            width: 260px; height: 42px;
            border-radius: 24px 24px 10px 10px;
            background: linear-gradient(#2563eb, #1e3a8a);
            border-bottom: 8px solid #172554;
        }
        .compare-scale-pillar {
            position: absolute;
            left: 50%; bottom: 42px;
            transform: translateX(-50%);
            width: 36px; height: 255px;
            border-radius: 20px 20px 0 0;
            background: linear-gradient(90deg,#1d4ed8,#60a5fa,#1d4ed8);
            border: 2px solid #1e3a8a;
        }
        .compare-scale-pivot {
            position:absolute;
            left:50%; bottom:270px;
            transform:translateX(-50%);
            width:72px; height:72px;
            border-radius:50%;
            z-index:8;
            background:radial-gradient(circle at 30% 25%,#93c5fd,#2563eb 55%,#172554);
            border:4px solid #fff;
            box-shadow:0 5px 0 #1e3a8a;
        }
        .compare-scale-pivot::after {
            content:""; position:absolute; inset:22px; border-radius:50%; background:#facc15;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,.2);
        }
        .compare-scale-beam {
            position:absolute;
            left:50%; bottom:302px;
            width:min(690px, 88vw); height:24px;
            transform:translateX(-50%) rotate(var(--compare-tilt,0deg));
            transform-origin:center center;
            border-radius:14px;
            background:linear-gradient(#60a5fa,#1d4ed8);
            border:2px solid #1e3a8a;
            box-shadow:0 8px 12px rgba(0,0,0,.2);
            transition:transform .6s cubic-bezier(.34,1.56,.64,1);
            z-index:6;
        }
        .compare-pan-hinge {
            position:absolute;
            top:10px;
            width:16px; height:96px;
            border-radius:8px;
            background:linear-gradient(90deg,#94a3b8,#e2e8f0,#94a3b8);
            border:2px solid #64748b;
            transform:rotate(calc(-1 * var(--compare-tilt,0deg)));
            transform-origin:top center;
        }
        .compare-pan-hinge.left { left:14px; }
        .compare-pan-hinge.right { right:14px; }
        .compare-pan {
            position:absolute;
            top:84px; left:50%;
            transform:translateX(-50%);
            width:220px; height:62px;
            border-radius:0 0 110px 110px;
            background:linear-gradient(#fde047,#eab308);
            border-top:7px solid #ca8a04;
            box-shadow:0 10px 18px rgba(0,0,0,.2), inset 0 4px 7px rgba(255,255,255,.45);
        }
        .compare-item-button {
            position:absolute;
            left:50%; bottom:28px;
            transform:translateX(-50%);
            width:170px;
            border:0; background:transparent;
            cursor:pointer;
            font-family:inherit;
            -webkit-tap-highlight-color:transparent;
            z-index:20;
        }
        .compare-item-button:hover .compare-emoji { transform:translateY(-6px) scale(1.05); }
        .compare-item-button:active .compare-emoji { transform:translateY(2px) scale(.96); }
        .compare-item-button.wrong { animation:wiggle .4s ease-in-out; }
        .compare-emoji {
            display:block;
            font-size:clamp(70px,9vw,105px);
            line-height:1;
            filter:drop-shadow(0 10px 9px rgba(0,0,0,.25));
            transition:.16s;
        }
        .compare-name {
            margin-top:6px;
            font-size:clamp(17px,2.2vw,24px);
            font-weight:900;
            color:#334155;
            text-shadow:0 2px 0 rgba(255,255,255,.8);
        }
        .compare-mass-badge {
            position:absolute;
            left:50%; bottom:calc(100% + 8px);
            transform:translateX(-50%);
            min-width:112px;
            padding:7px 12px;
            border-radius:999px;
            background:rgba(255,255,255,.97);
            border:3px solid #bae6fd;
            box-shadow:0 6px 12px rgba(0,0,0,.14);
            display:flex; align-items:center; justify-content:center; gap:8px;
            color:#0284c7;
            font-size:clamp(18px,2vw,23px); font-weight:900;
            white-space:nowrap;
        }
        .compare-mass-badge .icon-marble { width:24px; height:24px; }
        .compare-mass-badge .icon-eraser { width:28px; height:16px; }
        .compare-mass-badge .icon-cap { width:28px; height:28px; }
        .compare-scale-title {
            position:absolute; left:50%; top:-6px; transform:translateX(-50%);
            padding:8px 18px; border-radius:999px;
            background:rgba(255,255,255,.88); border:3px solid rgba(255,255,255,.95);
            color:#475569; font-weight:800; font-size:clamp(12px,1.7vw,16px);
            box-shadow:0 6px 14px rgba(0,0,0,.08);
            white-space:nowrap;
        }
        @media (max-width: 600px) {
            .compare-scale-wrap { transform:scale(.82); transform-origin:center bottom; width:112vw; margin-left:-6vw; margin-bottom:40px; }
            .compare-pan { width:190px; }
            .compare-item-button { width:145px; }
        }
    

        /* --- VER 3: direct BGwao background fix --- */
        #bgwao-frame { display: none !important; }
        #bgwao-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background: linear-gradient(180deg, #48b1fa 0%, #87cefa 35%, #d7f4fc 100%);
        }
        #bgwao-bg, #bgwao-bg * { box-sizing: border-box; }
        .bgwao-sun {
            position: fixed;
            top: 8%;
            left: 10%;
            width: 120px;
            height: 120px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4),
                        0 0 0 30px rgba(255, 215, 0, 0.2),
                        0 0 70px rgba(255, 215, 0, 0.9);
            z-index: 1;
            animation: bgwao-pulseSun 4s infinite alternate ease-in-out;
        }
        @keyframes bgwao-pulseSun {
            0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4), 0 0 0 30px rgba(255, 215, 0, 0.2), 0 0 70px rgba(255, 215, 0, 0.9); }
            100% { transform: scale(1.08) rotate(10deg); box-shadow: 0 0 0 18px rgba(255, 215, 0, 0.3), 0 0 0 45px rgba(255, 215, 0, 0.1), 0 0 100px rgba(255, 255, 0, 1); }
        }
        .bgwao-rainbow {
            display: none;
            position: fixed;
            bottom: -5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vw;
            max-width: 900px;
            max-height: 900px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                transparent 48%,
                #a881fb 48%, #a881fb 51.5%, 
                #1cb0f6 51.5%, #1cb0f6 55%, 
                #58cc02 55%, #58cc02 58.5%, 
                #ffc800 58.5%, #ffc800 62%, 
                #ff9600 62%, #ff9600 65.5%, 
                #ff4b4b 65.5%, #ff4b4b 69%, 
                transparent 69%
            );
            opacity: 0.55;
            z-index: 2;
        }
        .bgwao-cloud {
            position: fixed;
            background: #ffffff;
            border-radius: 50px;
            z-index: 3;
            opacity: 0.95;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08), inset 0 -5px 0 #eaf6ff;
        }
        .bgwao-cloud::before, .bgwao-cloud::after {
            content: '';
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
        }
        .bgwao-cloud::before { width: 55px; height: 55px; top: -22px; left: 15px; }
        .bgwao-cloud::after { width: 75px; height: 75px; top: -35px; right: 15px; }
        .bgwao-cloud1 { width: 140px; height: 50px; top: 12%; animation: bgwao-floatCloud 55s linear infinite; }
        .bgwao-cloud2 { width: 200px; height: 65px; top: 20%; animation: bgwao-floatCloud 70s linear infinite; animation-delay: -30s; transform: scale(0.85); opacity: 0.85; }
        .bgwao-cloud3 { width: 120px; height: 45px; top: 45%; animation: bgwao-floatCloud 45s linear infinite; animation-delay: -15s; transform: scale(1.15); }
        @keyframes bgwao-floatCloud { 0% { left: -20%; } 100% { left: 120%; } }
        .bgwao-scenery-layer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }
        .bgwao-layer-back { z-index: 10; }
        .bgwao-layer-mid { z-index: 20; }

    <script>

        // VER 5: 20 familiar child-friendly items. Each item has a unique mass.

        const ITEMS = [
            { id: 'kite', name: 'Kite', emoji: '🪁', mass: 1 },

            { id: 'backpack', name: 'Backpack', emoji: '🎒', mass: 16 },
            { id: 'drum', name: 'Drum', emoji: '🥁', mass: 17 },
            { id: 'toy_robot', name: 'Toy Robot', emoji: '🤖', mass: 18 },
            { id: 'lunch_box', name: 'Lunch Box', emoji: '🍱', mass: 19 },
            { id: 'watermelon', name: 'Watermelon', emoji: '🍉', mass: 20 }
        ];

        // Store Custom SVG/CSS units
        const UNIT_ICONS = {
            'marble': '<div class="icon-marble"></div>',
            'eraser': '<div class="icon-eraser"></div>',
            'cap': '<div class="icon-cap"></div>'
        };

        let state = {
            unit: null, 
            level: 1, // 1 to 10
            maxLevels: 10, 
            score: 0,
            questionType: '', 
            shuffledItems: [],
            questionDeck: [],
            currentRoundItems: [],
            weighedCount: 0,
            rightMass: 0,
            firstTry: true,
            busy: false,
            bowlingActive: false,
            pinsStatus: [],
            bowlingTime: 60,
            bowlingTimer: null,
            bonusReturnMode: 'end'
        };

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let rollingSoundNode = null;
        
        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            if (type === 'ting') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now);
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'correct') {
                [659.25, 880.00, 1046.50, 1318.51].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sine'; osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0, now + i*0.08);
                    gain.gain.linearRampToValueAtTime(0.15, now + i*0.08 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i*0.08 + 0.5);
                    osc.start(now + i*0.08); osc.stop(now + i*0.08 + 0.6);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'add') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        function playRollingSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 2.0;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            rollingSoundNode = audioCtx.createBufferSource();
            rollingSoundNode.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.value = 180; 
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.6, now + 0.2);
            rollingSoundNode.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            rollingSoundNode.start(now); rollingSoundNode.gainNode = gain;
        }

        function playWoodCrashSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const createClack = (time, pitchMult, vol) => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(400 * pitchMult, time);
                osc.frequency.exponentialRampToValueAtTime(100 * pitchMult, time + 0.1);
                gain.gain.setValueAtTime(vol, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(time); osc.stop(time + 0.2);
            };
            createClack(now, 0.8, 1.2); createClack(now, 1.2, 1.0);
            for(let i=0; i<6; i++) createClack(now + 0.03 + (Math.random()*0.1), 0.8+(Math.random()*0.6), 0.4+(Math.random()*0.5));
            const bufferSize = audioCtx.sampleRate * 0.4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
            const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1000; filter.Q.value = 1.0;
            const gainNoise = audioCtx.createGain(); gainNoise.gain.setValueAtTime(0.6, now); gainNoise.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            noise.connect(filter); filter.connect(gainNoise); gainNoise.connect(audioCtx.destination);
            noise.start(now); noise.stop(now + 0.4);
        }

        // --- TTS Helpers ---
        function readTextOutLoud(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; utterance.rate = 0.9; utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function readInstruction() {
            let text = "";
            if (document.getElementById('screen-weighing').classList.contains('hidden') === false) {
                let currentObj = state.currentRoundItems[state.weighedCount];
                text = `Let's weigh the ${currentObj.name}!`;
            } else if (document.getElementById('screen-compare').classList.contains('hidden') === false) {
                if (state.questionType === 'heavier') text = "Which one is heavier?";
                else if (state.questionType === 'lighter') text = "Which one is lighter?";
            }
            if(text) readTextOutLoud(text);
        }
        
        function readWeighSuccess() {
            let currentObj = state.currentRoundItems[state.weighedCount];
            let suffix = currentObj.mass > 1 ? 's' : '';
            readTextOutLoud(`The ${currentObj.name} weighs ${currentObj.mass} ${state.unit.name}${suffix}!`);

        // --- NAVIGATION ---
        function changeScreen(id) {
            ['screen-start', 'screen-unit-select', 'screen-weighing', 'screen-compare', 'screen-bowling', 'screen-end']
                .forEach(s => {
                    const el = document.getElementById(s);
                    if (el) el.classList.add('hidden');
                });
            if(id) {
                const el = document.getElementById(id);
                if (el) el.classList.remove('hidden');
            }
        }

        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            changeScreen('screen-unit-select');
        }

        function buildQuestionDeck() {
            // Shuffle all 20 items, then pair them sequentially.
            // This guarantees 10 unique questions and no repeated comparison icons in one game.
            const shuffled = [...ITEMS].sort(() => Math.random() - 0.5);
            const deck = [];

            for (let i = 0; i < 10; i++) {
                let pair = [shuffled[i * 2], shuffled[i * 2 + 1]];
                if (Math.random() < 0.5) pair.reverse();

                deck.push({
                    items: pair,
                    type: Math.random() < 0.5 ? 'heavier' : 'lighter'
                });
            }
            return deck;
        }

        function selectUnit(unitId, name) {
            state.unit = { id: unitId, name: name };
            
            document.getElementById('add-unit-btn').innerHTML = `<div class="scale-[1.8] transform transition-transform pointer-events-none">${UNIT_ICONS[unitId]}</div>`;
            
            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('instruction-container').classList.remove('hidden');
            
            state.shuffledItems = [];
            state.questionDeck = buildQuestionDeck();
            state.level = 1;
            state.score = 0;
            state.questionType = '';
            state.bonusReturnMode = 'end';
            
            startRound();
        }

        // --- MAIN GAME LOOP ---
        function startRound() {
            if(state.level > state.maxLevels) {
                document.getElementById('instruction-container').classList.add('hidden');
                document.getElementById('game-ui').classList.add('hidden');
                showGameOver();
                return;
            }
            updateUI();

            // VER 5: exactly 10 pre-generated questions, each comparing only 2 icons.
            const question = state.questionDeck[state.level - 1];
            state.currentRoundItems = [...question.items];
            state.questionType = question.type; // only 'heavier' or 'lighter'

            state.weighedCount = 0;
            startWeighingCurrentItem();
        }

        function updateUI() {
            document.getElementById('score-text').innerText = state.score;
            document.getElementById('level-text').innerText = `${state.level}/${state.maxLevels}`;
        }

        function getCorrectColorClass() {
            return state.questionType === 'heavier' ? 'text-rose-500' : 'text-sky-500';
        }

        // --- STEP 1: WEIGHING PHASE ---
        function startWeighingCurrentItem() {
            state.busy = false;
            state.rightMass = 0;
            
            changeScreen('screen-weighing');
            document.getElementById('mc-container').classList.add('hidden');

            updateScalePhysics();
            setTimeout(readInstruction, 500);
        }

        function addUnit() {
            // VER 6: remove the old hard 15-unit cap. Allow adding units
            // until the current object reaches its actual measured mass.
            const currentObj = state.currentRoundItems[state.weighedCount];
            if (state.busy || !currentObj || state.rightMass >= currentObj.mass) return;
            state.rightMass++;
            playSfx('add');
            
            const item = document.createElement('div');

        function removeUnit(element) {
            if(state.busy || state.rightMass <= 0) return;
            state.rightMass--;
            playSfx('add');
            element.remove();
            updateScalePhysics();
            checkBalance();
        }

        function updateScalePhysics() {
            let currentObj = state.currentRoundItems[state.weighedCount];
            const beam = document.getElementById('weigh-scale-beam');
            const panLeft = document.getElementById('weigh-pan-left-hinge');
            const panRight = document.getElementById('weigh-pan-right-hinge');

            let diff = state.rightMass - currentObj.mass;
            let tilt = Math.max(-20, Math.min(20, diff * 4));

            beam.style.transform = `rotate(${tilt}deg)`;
            panLeft.style.transform = `rotate(${-tilt}deg)`;
            panRight.style.transform = `rotate(${-tilt}deg)`;

        function checkBalance() {
            let currentObj = state.currentRoundItems[state.weighedCount];
            const mcContainer = document.getElementById('mc-container');
            const addContainer = document.getElementById('add-unit-container');

            if(state.rightMass === currentObj.mass) {
                // Balanced!
                if (mcContainer.classList.contains('hidden')) {
                    playSfx('ting'); 
                    mcContainer.classList.remove('hidden');
                    mcContainer.classList.add('pop-in');

            state.weighedCount++;

        // --- STEP 2: COMPARISON PHASE ---

        function renderCompareCards() {

        function checkCompareAnswer(selectedObj, btnEl) {
            if(state.busy) return;

            const correctObj = state.questionType === 'heavier'
                ? state.currentRoundItems.reduce((a, b) => a.mass > b.mass ? a : b)
                : state.currentRoundItems.reduce((a, b) => a.mass < b.mass ? a : b);

            if(selectedObj.id === correctObj.id) {
                state.busy = true;
                playSfx('correct');
                if(state.firstTry) state.score += 10;
                updateUI();

                const completedQuestion = state.level;
                state.level++;

                setTimeout(() => {
                    // Play the bonus game after question 5 and question 10.
                    if (completedQuestion % 5 === 0) {
                        launchBonusGame(completedQuestion >= state.maxLevels ? 'end' : 'continue');
                    } else {
                        startRound();
                    }
                }, 1500);
            } else {
                // Wrong answer: let the child try again, but this question can no longer earn points.
                playSfx('wrong');
                state.firstTry = false;
                btnEl.classList.add('wiggle', 'wrong');

                if(btnEl.tagName === 'BUTTON') {
                    btnEl.style.borderColor = '#ef4444';
                    setTimeout(() => { btnEl.style.borderColor = ''; }, 500);

                setTimeout(() => { btnEl.classList.remove('wiggle', 'wrong'); }, 500);

        // --- BOWLING MINI GAME ---

        const pinLayout2D = [
            { id: 7, top: '0%', left: '35%', scale: 0.55 }, { id: 8, top: '0%', left: '45%', scale: 0.55 }, { id: 9, top: '0%', left: '55%', scale: 0.55 }, { id: 10, top: '0%', left: '65%', scale: 0.55 },

        function initBowling() {
            changeScreen('screen-bowling');
            state.bowlingActive = false;
            state.pinsStatus = new Array(10).fill(true);
            state.bowlingTime = 60;
            
            document.getElementById('bowling-timer').innerText = state.bowlingTime;

            state.bowlingTimer = setInterval(() => {

        function resetBallAndAim() {
            const ball = document.getElementById('bowling-ball');
            ball.style.transition = 'none'; 
            ball.style.bottom = '10px';
            ball.style.left = '50%';
            ball.style.transform = 'translateX(-50%) scale(1) rotate(0deg)';
            ball.style.opacity = '1';
            
            void ball.offsetWidth; // Reflow
            ball.style.transition = 'bottom 0.7s cubic-bezier(0.3, 0, 0.2, 1), left 0.7s linear, transform 0.7s cubic-bezier(0.3, 0, 0.2, 1), opacity 0.7s';

            state.bowlingActive = true;
            aimPos = 0;
            aimDirection = 1;
            const cursor = document.getElementById('aim-cursor');
            clearInterval(aimInterval);
            aimInterval = setInterval(() => {
                aimPos += 0.05 * aimDirection;
                if(aimPos >= 1) { aimPos = 1; aimDirection = -1; }
                if(aimPos <= -1) { aimPos = -1; aimDirection = 1; }
                cursor.style.left = `${(aimPos + 1) / 2 * 100}%`;
            }, 20);
        }

        function throwBall() {
            if (!state.bowlingActive) return;
            state.bowlingActive = false;
            clearInterval(aimInterval);
            
            const ball = document.getElementById('bowling-ball');
            playRollingSound();

            const accuracy = Math.abs(aimPos);
            const endX = 50 + (aimPos * 30); 
            ball.style.bottom = '80%';
            ball.style.left = `${endX}%`;
            ball.style.transform = 'translateX(-50%) scale(0.35) rotateZ(720deg)';
            
            setTimeout(() => {
                if (rollingSoundNode) {
                    rollingSoundNode.gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    rollingSoundNode.stop(audioCtx.currentTime + 0.1);
                }
                
                let hitAny = false;
                let pinsToFall = [];
                
                state.pinsStatus.forEach((isStanding, idx) => {
                    if(!isStanding) return;
                    let prob = 0;
                    if (accuracy < 0.15) prob = 1.0; 
                    else if (accuracy < 0.4) prob = 0.6;
                    else if (accuracy < 0.7) prob = 0.3;
                    else prob = 0.1;
                    
                    if(Math.random() < prob) {
                        pinsToFall.push(idx);
                        state.pinsStatus[idx] = false;
                        hitAny = true;
                    }
                });

                if(hitAny) {
                    playWoodCrashSound();
                    state.score += (pinsToFall.length * 2);
                    updateUI();
                }
                
                pinsToFall.forEach(idx => {
                    const pin = document.getElementById(`pin-${idx}`);
                    if (pin) {
                        const explodeX = (Math.random() - 0.5) * 200;
                        const explodeY = -(Math.random() * 100 + 50); 
                        const spin = (Math.random() - 0.5) * 360;
                        pin.style.transform = `translateX(calc(-50% + ${explodeX}px)) translateY(${explodeY}px) rotateZ(${spin}deg) scale(0.5)`;
                        pin.style.opacity = '0';
                    }
                });
                
                ball.style.opacity = '0';
                
                const allDown = state.pinsStatus.every(s => !s);
                
                setTimeout(() => {
                    if(allDown) {
                        document.getElementById('strike-text').classList.remove('hidden');
                        document.getElementById('strike-text').classList.add('pop-in');
                        state.score += 50; 
                        clearInterval(state.bowlingTimer);
                        setTimeout(finishBonusGame, 2000);
                    } else if(state.bowlingTime > 0) {
                        resetBallAndAim();
                    }
                }, 1000);
            }, 700); 
        }

        // --- END GAME ---
        let fwInterval;

            changeScreen('screen-end');
            document.getElementById('final-score').innerText = state.score;

            fwInterval = setInterval(triggerFireworks, 2500);

        // --- FIREWORKS ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeFw() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFw);
        resizeFw();

        function animateFw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.alpha -= 0.02; 
                ctx.save(); 
                ctx.globalAlpha = Math.max(0, p.alpha); 
                ctx.fillStyle = p.color; 
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); 
                ctx.restore();
                if (p.alpha <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateFw);
        }
        animateFw();

        function triggerFireworks() {
            const colors = ['#fde047', '#38bdf8', '#f43f5e', '#4ade80', '#c084fc', '#fb923c'];
            for(let i=0; i<4; i++) { 
                setTimeout(() => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height * 0.5); 
                    const color = colors[Math.floor(Math.random()*colors.length)];
                    for(let j=0; j<35; j++) {
                        particles.push({ 
                            x, y, 
                            vx: Math.cos(j)*Math.random()*10, 
                            vy: Math.sin(j)*Math.random()*10, 
                            color, 
                            alpha: 1,
                            size: Math.random() * 4 + 3 
                        });
                    }
                }, i * 250);
            }
        }

        function triggerSmallFireworks() {
            const colors = ['#fde047', '#38bdf8', '#f43f5e', '#4ade80'];
            const x = canvas.width / 2;
            const y = canvas.height / 2;
            const color = colors[Math.floor(Math.random()*colors.length)];
            for(let j=0; j<25; j++) {
                particles.push({ 
                    x, y, 
                    vx: Math.cos(j)*Math.random()*8, 
                    vy: Math.sin(j)*Math.random()*8, 
                    color, 
                    alpha: 1,
                    size: Math.random() * 4 + 2
                });
            }
        }
    </script>

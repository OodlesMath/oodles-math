        /* One soft moving cloud over the illustrated background */
        .cloud {
            position: fixed;
            background: rgba(255,255,255,0.95);
            border-radius: 100px;
            box-shadow: 0 8px 16px rgba(80,160,210,0.12);
            pointer-events: none;
            z-index: 2;
            animation: moveClouds 32s linear infinite;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.98);
            border-radius: 50%;
        }
        .cloud1 { width: 118px; height: 38px; top: 24%; left: -170px; opacity: .92; }
        .cloud1::before { width: 58px; height: 58px; top: -28px; left: 18px; }
        .cloud1::after { width: 44px; height: 44px; top: -20px; right: 16px; }
        .cloud2 { display: none !important; }

        @keyframes moveClouds {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 340px)); }
        }

        /* The illustration already contains grass, trees and flowers. */
        .grass-hill { display: none !important; }

        /* Grass Hill & Decorations - FIXED AT BOTTOM */
        .grass-hill {
            position: fixed;
            bottom: -15vh;
            left: -10vw;
            width: 120vw;
            height: 45vh;
            background: #58cc02;
            border-radius: 50% 50% 0 0;
            border-top: 12px solid #46a302;
            z-index: -2;
        }

        .decoration {
            position: absolute;
            z-index: -1;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.15));
        }

        /* Duolingo Style 3D Buttons */
        .btn-3d {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 0 transparent !important;
        }

        /* Premium Jelly Bubbles */
        .bubble-btn {
            box-shadow: 0 8px 0 0 #cbd5e1, 0 15px 15px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
        }
        .bubble-btn:active:not(.clicked) {
            transform: translateY(8px) scale(0.95);
            box-shadow: 0 0px 0 0 #cbd5e1, 0 5px 5px rgba(0,0,0,0.1);
        }

        .bubble-clicked {
            animation: popIn 0.4s forwards;
            box-shadow: 0 8px 0 0 rgba(0,0,0,0.2) !important;
        }
        .bubble-clicked:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 0 transparent !important;
        }

        /* Striped Candy Progress Bar */
        .striped-bg {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.3) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.3) 50%, rgba(255, 255, 255, 0.3) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
            animation: moveStripes 1s linear infinite;
        }
        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes wiggle {
            0%, 7% { transform: rotateZ(0); }
            15% { transform: rotateZ(-8deg); }
            20% { transform: rotateZ(12deg); }
            25% { transform: rotateZ(-12deg); }
            30% { transform: rotateZ(8deg); }
            35% { transform: rotateZ(-4deg); }
            40%, 100% { transform: rotateZ(0); }
        }
        .wiggle { animation: wiggle 2.5s linear infinite; }

        /* Confetti */
        .confetti {
            position: absolute;
            z-index: 100;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); }
        }

        /* Text Stroke/Shadow */
        .text-outline {
            text-shadow:
                -3px -3px 0 #fff,
                 3px -3px 0 #fff,
                -3px  3px 0 #fff,
                 3px  3px 0 #fff,
                 0px  6px 0 #e2e8f0;
        }
        .text-outline-dark {
            text-shadow:
                -2px -2px 0 #1e293b,
                 2px -2px 0 #1e293b,
                -2px  2px 0 #1e293b,
                 2px  2px 0 #1e293b;
        }
        .number-shadow {
            text-shadow: 0 10px 0px rgba(0,0,0,0.15);
        }

        /* Magical Mini-Game Background */
        .magical-sky {
            background: linear-gradient(180deg, #1e1b4b 0%, #4c1d95 60%, #7e22ce 100%);
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: 0.2;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px 2px rgba(255,255,255,0.8); }
        }

        /* Falling Fruit Animation */
        @keyframes fallFruit {
            0% { transform: translateY(-100px) rotate(0deg) scale(1); }
            50% { transform: translateY(50vh) rotate(180deg) scale(1.1); }
            100% { transform: translateY(120vh) rotate(360deg) scale(1); }
        }
        .fruit-item {
            animation: fallFruit linear forwards;
            transition: transform 0.12s ease, filter 0.12s ease;
            filter: drop-shadow(0 12px 10px rgba(0,0,0,0.35));
            z-index: 20;
            width: 92px;
            height: 92px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .fruit-item svg { width: 100%; height: 100%; display: block; overflow: visible; }
        .fruit-item:hover { filter: drop-shadow(0 14px 12px rgba(0,0,0,0.35)) brightness(1.07); }
        .fruit-item:active { transform: scale(1.25); }

        /* Responsive overlay cards to avoid being cut off on smaller screens */

            padding: 16px;

        .overlay-card {
            width: min(92vw, 760px);

            overflow: visible;

        /* Pretty progress bar with text */
        .progress-shell {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;

        .progress-label {

            inset: 0;

            align-items: center;

<body>
    <img src="https://oodlesmath.github.io/oodles-math/PopsicleMath/Seeker-A/assets/logo-oodles-math.png" class="oodles-logo">
    <!-- Environment Background -->

            <h1 class="text-4xl md:text-7xl font-black text-[#58cc02] mb-3 md:mb-4 animate-float text-outline tracking-wide">Count With Me!</h1>

            </button>

            <div class="mt-6 md:mt-8 flex items-center justify-center gap-2 bg-blue-100/80 text-blue-500 px-5 md:px-6 py-3 rounded-full font-bold shadow-sm text-base md:text-xl">

    <!-- Game UI -->

        <!-- Top Bar: Left Progress + Right Logo Area -->

            <!-- Left: Beautiful Progress & Close -->

                <!-- Close Button -->
                <button onclick="restartGame()" class="btn-3d shrink-0 bg-red-400 text-white w-10 h-10 md:w-12 md:h-12 rounded-full shadow-[0_4px_0_0_#ef4444] flex items-center justify-center hover:bg-red-500 border-2 border-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7 font-bold" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>

                <!-- Progress Bar -->
                <div class="progress-shell">
                    <div class="flex-grow h-7 md:h-9 bg-[#dbeafe] rounded-full overflow-hidden relative border-2 border-white shadow-[inset_0_4px_8px_rgba(0,0,0,0.08)]">
                        <div id="progress-fill" class="h-full bg-gradient-to-r from-[#58cc02] via-[#9be515] to-[#ffc800] striped-bg w-0 transition-all duration-700 rounded-full relative shadow-[inset_0_-3px_0_rgba(0,0,0,0.1)]"></div>
                        <div id="progress-text" class="progress-label">Round 0 / 10</div>

            <!-- Right: Logo Area (Empty for user) -->
            <div id="logo-placeholder" class="w-24 h-12 md:w-32 md:h-16 flex items-start justify-end">
                <!-- LOGO PLACEHOLDER: Put your <img> tag here. Example below: -->

        <!-- Instruction & Number Display -->
        <div class="flex flex-col items-center justify-center mb-6 md:mb-10 bg-white/95 px-12 py-6 md:py-8 rounded-[3rem] shadow-xl border-8 border-white transform transition hover:scale-105 z-20">
            <h2 id="instruction-text" class="text-2xl md:text-4xl font-black text-[#afafaf] mb-2 text-center uppercase tracking-widest">

            </h2>
            <div id="target-number" class="text-[120px] md:text-[180px] leading-none font-black text-[#1cb0f6] number-shadow transition-transform duration-300">

            </div>
        </div>

        <!-- Interactive Area -->
        <div id="circles-container" class="flex-grow flex flex-wrap content-start md:content-center justify-center gap-4 md:gap-8 w-full max-w-3xl relative z-10">

        <!-- Bottom Status -->
        <div class="h-24 md:h-28 flex items-center justify-center mt-auto w-full z-20 pointer-events-none">
            <div id="feedback-text" class="text-4xl md:text-6xl font-black text-[#58cc02] opacity-0 transition-all duration-300 transform scale-50 text-outline text-center px-4">

    <!-- Mini-Game Overlay -->

        <div id="stars-container" class="absolute inset-0 z-0 pointer-events-none"></div>

        <!-- Moon/Stars decoration for mini-game -->
        <div class="absolute top-10 right-10 text-7xl text-yellow-200 animate-pulse drop-shadow-[0_0_15px_rgba(253,224,71,0.6)] z-10 pointer-events-none">🌙</div>
        <div class="absolute top-24 left-16 text-5xl text-yellow-100 animate-ping z-10 pointer-events-none">✨</div>

        <h2 class="text-5xl md:text-7xl font-black text-white mt-20 text-outline-dark number-shadow z-10 text-center px-4 tracking-wide pointer-events-none">
            Fruit Break!
        </h2>
        <p class="text-[#fde047] text-2xl md:text-3xl font-bold mt-4 z-10 drop-shadow-md pointer-events-none">Tap 10 fruits to continue</p>

        <div class="bg-white/95 px-8 py-3 rounded-full mt-6 z-10 border-8 border-[#ffc800] shadow-[0_10px_20px_rgba(0,0,0,0.3)] flex items-center gap-4 pointer-events-none">
            <span class="text-4xl animate-bounce" style="animation-duration: 2s;">🍎</span>

        <!-- Container for falling fruits -->

    <!-- End Screen -->
    <div id="end-screen" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-white/40 backdrop-blur-lg p-4">
        <div class="bg-white p-7 md:p-14 rounded-[2.8rem] md:rounded-[4rem] shadow-2xl flex flex-col items-center text-center border-[10px] md:border-[12px] border-[#ffc800] w-[94%] max-w-[820px]">
            <h1 class="text-5xl md:text-8xl font-black text-[#ffc800] mb-3 md:mb-4 animate-bounce text-outline number-shadow">Perfect!</h1>

            <div class="bg-[#f0f9ff] px-7 md:px-12 py-5 md:py-6 rounded-[2rem] my-6 md:my-8 border-4 border-[#bae6fd] w-full max-w-xl">
                <p class="text-2xl md:text-3xl text-gray-400 font-bold uppercase tracking-widest mb-2">Final Score</p>
                <p id="final-score" class="text-5xl md:text-8xl font-black text-[#1cb0f6] number-shadow">10 / 10</p>
            </div>

            <div class="flex gap-3 md:gap-6 mb-8 md:mb-12">
                <span class="text-6xl md:text-8xl wiggle">🌟</span>
                <span class="text-6xl md:text-8xl animate-float">🌟</span>
                <span class="text-6xl md:text-8xl wiggle">🌟</span>
            </div>

            <button onclick="restartGame()" class="btn-3d w-full max-w-md bg-[#1cb0f6] text-white text-3xl md:text-4xl font-black py-5 md:py-6 px-10 rounded-3xl shadow-[0_10px_0_0_#1899d6] hover:bg-[#1493d1] uppercase tracking-wider">
                Play Again ↺
            </button>
        </div>
    </div>

    <script>
        // Game State
        const TOTAL_ROUNDS = 10;
        let currentRound = 0;
        let targetNumber = 0;
        let currentCount = 0;
        let gameQuestions = [];
        let canInteract = false;

        // Minigame State
        let fruitsCaught = 0;
        let fruitInterval;
        let waitingForNext = false;

        // Colors pool
        const vibrantColors = [
            { bg: '#58cc02', shadow: '#46a302', border: '#79e02c' }, // Green
            { bg: '#1cb0f6', shadow: '#1899d6', border: '#4dd2ff' }, // Blue
            { bg: '#ff4b4b', shadow: '#ea2b2b', border: '#ff7979' }, // Red
            { bg: '#ffc800', shadow: '#e5b400', border: '#ffe14d' }, // Yellow
            { bg: '#ce82ff', shadow: '#a568cc', border: '#e2afff' }  // Purple
        ];

        let roundColorsPool = [];

        // Audio Context
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        // --- Audio System ---
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playPopSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSquishSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSuccessSound() {
            playTone(523.25, 'sine', 0.4, 0.1);
            setTimeout(() => playTone(659.25, 'sine', 0.4, 0.1), 80);
            setTimeout(() => playTone(783.99, 'sine', 0.6, 0.1), 160);
            setTimeout(() => playTone(1046.50, 'sine', 0.6, 0.15), 240);
        }

        function playWinSound() {
            [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'triangle', 0.6, 0.15), i * 120);
            });
        }

        // --- Voice System ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                utterance.pitch = 1.3;

                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(voice => voice.name.includes("Female") || voice.name.includes("Google US English"));
                if (preferredVoice) utterance.voice = preferredVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Generate Magic Stars for Minigame ---
        function generateStars() {
            const container = document.getElementById('stars-container');
            container.innerHTML = '';
            for(let i=0; i<30; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 4 + 2;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 2 + 1}s`);
                container.appendChild(star);
            }
        }

        // --- Game Logic ---
        function generateQuestions() {
            let questions = [];
            let lastNumber = -1;

            for(let i = 0; i < TOTAL_ROUNDS; i++) {
                let nextNumber;
                do {
                    nextNumber = Math.floor(Math.random() * 5) + 1; // 1 to 5
                } while (nextNumber === lastNumber);

                questions.push(nextNumber);
                lastNumber = nextNumber;
            }
            return questions;
        }

        function startGame() {
            window.scrollTo(0, 0);
            initAudio();
            generateStars();

            currentRound = 0;
            gameQuestions = generateQuestions();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('minigame-screen').classList.add('hidden');

            document.getElementById('game-ui').classList.remove('hidden');
            document.getElementById('game-ui').classList.add('flex');

            updateProgressBar();
            loadRound();
        }

        function updateProgressBar() {
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            const progressPercent = document.getElementById('progress-percent');
            const percentage = Math.round((currentRound / TOTAL_ROUNDS) * 100);
            const displayRound = currentRound >= TOTAL_ROUNDS ? TOTAL_ROUNDS : currentRound + 1;
            progressFill.style.width = `${percentage}%`;
            if (progressText) progressText.textContent = `Round ${displayRound} / ${TOTAL_ROUNDS}`;
            if (progressPercent) progressPercent.textContent = `${percentage}%`;
        }

        function loadRound() {
            targetNumber = gameQuestions[currentRound];
            currentCount = 0;
            canInteract = false;
            waitingForNext = false;
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.add('hidden');
            nextBtn.textContent = 'Next ▶';

            // Shuffle colors for this round to ensure unique bubble colors
            roundColorsPool = [...vibrantColors].sort(() => Math.random() - 0.5);

            // Text update
            const numberEl = document.getElementById('target-number');
            numberEl.textContent = targetNumber;
            numberEl.classList.remove('scale-100');
            numberEl.classList.add('scale-50', 'opacity-50');
            setTimeout(() => {
                numberEl.classList.remove('scale-50', 'opacity-50');
                numberEl.classList.add('scale-100');
            }, 50);

            // Hide feedback
            const feedback = document.getElementById('feedback-text');
            feedback.classList.remove('opacity-100', 'scale-100');
            feedback.classList.add('opacity-0', 'scale-50');

            // Setup Bubbles (Always exactly 5)
            const container = document.getElementById('circles-container');
            container.innerHTML = '';

            const totalCirclesToShow = 5;

            for (let i = 0; i < totalCirclesToShow; i++) {
                const circle = document.createElement('div');

                circle.className = `bubble-btn w-24 h-24 md:w-32 md:h-32 rounded-full flex items-center justify-center cursor-pointer border-[6px] border-white relative overflow-hidden`;
                circle.dataset.clicked = "false";

                const shine = document.createElement('div');
                shine.className = "absolute top-2 left-4 right-10 h-6 bg-white/70 rounded-full rotate-[-15deg]";
                circle.appendChild(shine);

                const numberSpan = document.createElement('span');
                numberSpan.className = "text-white text-5xl md:text-6xl font-black number-shadow hidden z-10";
                circle.appendChild(numberSpan);

                const tapHandler = (e) => {
                    e.preventDefault();
                    handleCircleClick(circle, numberSpan);
                };

                circle.addEventListener('mousedown', tapHandler);
                circle.addEventListener('touchstart', tapHandler, {passive: false});

                container.appendChild(circle);
            }

            // Voice Prompt
            setTimeout(() => {
                const phrases = [
                    `Find number ${targetNumber}!`,
                    `Can you count to ${targetNumber}?`,
                    `Where is number ${targetNumber}?`
                ];
                speak(phrases[currentRound % 3]);
                canInteract = true;
            }, 600);
        }

        function handleCircleClick(circle, numberSpan) {
            if (!canInteract) return;
            if (circle.dataset.clicked === "true") return;
            if (currentCount >= targetNumber) return;

            circle.dataset.clicked = "true";
            currentCount++;

            // Pop a unique color from the shuffled pool, cycle if pool is empty
            if (roundColorsPool.length === 0) {
                 roundColorsPool = [...vibrantColors].sort(() => Math.random() - 0.5);
            }
            const colorTheme = roundColorsPool.pop();

            circle.style.background = colorTheme.bg;
            circle.style.borderColor = colorTheme.border;
            circle.style.boxShadow = `0 8px 0 0 ${colorTheme.shadow} !important`;
            circle.classList.add('bubble-clicked');

            // Show number
            numberSpan.textContent = currentCount;
            numberSpan.classList.remove('hidden');

            playPopSound();

            if (currentCount === targetNumber) {
                canInteract = false;
                handleSuccess();
            }
        }

        function handleSuccess() {
            setTimeout(playSuccessSound, 300);

            const feedback = document.getElementById('feedback-text');
            const praise = ["Excellent!", "Awesome!", "You did it!", "Super!", "Brilliant!"];
            feedback.textContent = praise[Math.floor(Math.random() * praise.length)];
            feedback.classList.remove('opacity-0', 'scale-50');
            feedback.classList.add('opacity-100', 'scale-100');

            setTimeout(() => speak(feedback.textContent), 400);

            waitingForNext = true;
            const nextBtn = document.getElementById('next-btn');
            if (currentRound === TOTAL_ROUNDS - 1) {
                nextBtn.textContent = 'Finish ★';
            } else if (currentRound === 4) {
                nextBtn.textContent = 'Next ▶';
            } else {
                nextBtn.textContent = 'Next ▶';
            }
            setTimeout(() => {
                nextBtn.classList.remove('hidden');
            }, 500);
        }

        function goToNextStep() {
            if (!waitingForNext) return;
            waitingForNext = false;
            document.getElementById('next-btn').classList.add('hidden');

            currentRound++;
            updateProgressBar();

            if (currentRound === 5) {
                startMiniGame();
            } else if (currentRound < TOTAL_ROUNDS) {
                loadRound();
            } else {
                endGame();
            }
        }

        // --- Mini Game Logic ---
        function startMiniGame() {
            document.getElementById('minigame-screen').classList.remove('hidden');
            fruitsCaught = 0;
            document.getElementById('fruit-score').textContent = fruitsCaught;
            document.getElementById('fruit-container').innerHTML = '';

            speak("Break time! Let's catch 10 fruits.");

            fruitInterval = setInterval(spawnFruit, 800);
        }

        function spawnFruit() {
            const fruitIcons = [
                `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="a" cx="30%" cy="22%"><stop stop-color="#ffb0b0"/><stop offset=".45" stop-color="#ff4b4b"/><stop offset="1" stop-color="#c91432"/></radialGradient></defs><path d="M53 26c7-14 20-13 25-10-4 9-12 14-23 14" fill="#58cc02"/><path d="M51 29c-2-9 1-17 5-21" fill="none" stroke="#7a4b21" stroke-width="6" stroke-linecap="round"/><path d="M50 24c-23-12-38 6-35 31 3 25 20 38 35 38s32-13 35-38C88 30 73 12 50 24Z" fill="url(#a)" stroke="#a90f2d" stroke-width="4"/><ellipse cx="35" cy="41" rx="11" ry="7" fill="#fff" opacity=".48"/></svg>`,
                `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="o" cx="30%" cy="22%"><stop stop-color="#ffe27a"/><stop offset=".42" stop-color="#ff9f1a"/><stop offset="1" stop-color="#f36f00"/></radialGradient></defs><path d="M52 24c8-13 20-12 28-6-8 8-16 11-27 10" fill="#58cc02" stroke="#35a100" stroke-width="3"/><circle cx="50" cy="57" r="35" fill="url(#o)" stroke="#df6500" stroke-width="4"/><ellipse cx="36" cy="42" rx="11" ry="7" fill="#fff" opacity=".5"/><circle cx="68" cy="64" r="3" fill="#e36f00" opacity=".6"/></svg>`,
                `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="g" cx="30%" cy="25%"><stop stop-color="#d6b7ff"/><stop offset=".42" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/></radialGradient></defs><path d="M49 29c-3-10 1-18 6-23" fill="none" stroke="#6b4726" stroke-width="5" stroke-linecap="round"/><path d="M50 25c9-10 20-7 27 0-9 5-17 6-27 0Z" fill="#58cc02"/><g fill="url(#g)" stroke="#5b21b6" stroke-width="2"><circle cx="37" cy="42" r="14"/><circle cx="54" cy="40" r="14"/><circle cx="68" cy="48" r="14"/><circle cx="31" cy="58" r="14"/><circle cx="49" cy="58" r="14"/><circle cx="63" cy="64" r="14"/><circle cx="43" cy="75" r="14"/><circle cx="57" cy="78" r="12"/></g><circle cx="32" cy="37" r="5" fill="#fff" opacity=".45"/></svg>`,
                `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff718f"/><stop offset="1" stop-color="#e11d48"/></linearGradient></defs><path d="M50 24 33 14l3 15-17-4 11 14-13 4c7 8 15 11 21 10h24c7 0 15-3 21-10l-13-4 11-14-17 4 3-15Z" fill="#58cc02" stroke="#35a100" stroke-width="3"/><path d="M50 92C27 79 18 60 25 42c7-18 43-18 50 0 7 18-2 37-25 50Z" fill="url(#s)" stroke="#be123c" stroke-width="4"/><g fill="#ffe066"><circle cx="38" cy="54" r="2.4"/><circle cx="57" cy="49" r="2.4"/><circle cx="67" cy="60" r="2.4"/><circle cx="47" cy="67" r="2.4"/><circle cx="35" cy="71" r="2.4"/><circle cx="58" cy="77" r="2.4"/></g><ellipse cx="37" cy="43" rx="9" ry="6" fill="#fff" opacity=".38"/></svg>`,
                `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff718f"/><stop offset="1" stop-color="#ef233c"/></linearGradient></defs><path d="M13 53a38 38 0 0 1 74 0Z" fill="#36b24a" stroke="#16843a" stroke-width="5"/><path d="M20 53a31 31 0 0 1 60 0Z" fill="#d7ff79"/><path d="M25 53a26 26 0 0 1 50 0Z" fill="url(#w)"/><g fill="#3f1d2e"><ellipse cx="40" cy="40" rx="2" ry="5" transform="rotate(-25 40 40)"/><ellipse cx="55" cy="36" rx="2" ry="5" transform="rotate(20 55 36)"/><ellipse cx="65" cy="45" rx="2" ry="5" transform="rotate(28 65 45)"/></g><path d="M12 54c4 23 20 36 38 36s34-13 38-36Z" fill="#36b24a" opacity=".16"/></svg>`,
                `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="p" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe066"/><stop offset="1" stop-color="#ffb703"/></linearGradient></defs><g fill="#58cc02" stroke="#319600" stroke-width="3"><path d="M50 29 30 9l7 24L21 20l18 21Z"/><path d="M50 29 70 9l-7 24 16-13-18 21Z"/><path d="M50 30 50 4 42 31Z"/></g><path d="M25 39c0-11 50-11 50 0v35c0 19-50 19-50 0Z" fill="url(#p)" stroke="#df8f00" stroke-width="4"/><path d="m31 46 38 35M69 46 31 81M27 58h46M27 70h46" stroke="#f08c00" stroke-width="2.5" opacity=".7"/><ellipse cx="38" cy="45" rx="9" ry="5" fill="#fff" opacity=".35"/></svg>`
            ];
            const container = document.getElementById('fruit-container');

            const fruit = document.createElement('div');
            fruit.innerHTML = fruitIcons[Math.floor(Math.random() * fruitIcons.length)];

            const size = Math.random() * 24 + 78;
            fruit.style.width = `${size}px`;
            fruit.style.height = `${size}px`;
            fruit.style.left = `${Math.random() * 80 + 10}%`;
            fruit.style.position = 'absolute';
            fruit.className = 'fruit-item cursor-pointer select-none';

            const duration = Math.random() * 2 + 3.5;
            fruit.style.animationDuration = `${duration}s`;

            const catchHandler = (e) => {
                e.preventDefault();
                playSquishSound();
                fruit.remove();
                fruitsCaught++;
                document.getElementById('fruit-score').textContent = fruitsCaught;

                const scoreEl = document.getElementById('fruit-score');
                scoreEl.style.transform = 'scale(1.5)';
                setTimeout(() => scoreEl.style.transform = 'scale(1)', 150);

                if (fruitsCaught >= 10) {
                    endMiniGame();
                }
            };

            fruit.addEventListener('mousedown', catchHandler);
            fruit.addEventListener('touchstart', catchHandler, {passive: false});

            container.appendChild(fruit);

            setTimeout(() => {
                if (fruit.parentNode) fruit.remove();
            }, duration * 1000);
        }

        function endMiniGame() {
            clearInterval(fruitInterval);

            speak("Yummy! Back to counting!");
            playSuccessSound();

            setTimeout(() => {
                document.getElementById('minigame-screen').classList.add('hidden');
                document.getElementById('fruit-container').innerHTML = '';
                loadRound();
            }, 2500);
        }

        // --- End Screen Logic ---
        function endGame() {
            playWinSound();
            createConfetti();

            document.getElementById('final-score').textContent = `${TOTAL_ROUNDS} / ${TOTAL_ROUNDS}`;

            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('flex');
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('end-screen').classList.add('flex');

            speak("Perfect score! You are a counting superstar!");
        }

        function restartGame() {
            window.scrollTo(0, 0);
            clearInterval(fruitInterval);
            waitingForNext = false;
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('minigame-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('flex');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function createConfetti() {
            const colors = ['#58cc02', '#1cb0f6', '#ff4b4b', '#ffc800', '#ce82ff'];

            for (let i = 0; i < 100; i++) {
                const conf = document.createElement('div');
                const isCircle = Math.random() > 0.5;

                conf.className = `confetti ${isCircle ? 'rounded-full' : 'rounded-sm'}`;

                const sizeW = Math.random() * 12 + 10;
                const sizeH = isCircle ? sizeW : Math.random() * 20 + 10;

                conf.style.width = `${sizeW}px`;
                conf.style.height = `${sizeH}px`;
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-50px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 3 + 3) + 's';
                conf.style.animationDelay = (Math.random() * 1.5) + 's';

                document.body.appendChild(conf);

                setTimeout(() => conf.remove(), 6000);
            }
        }

        // Init speech synthesis voices
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }

    </script>
</body>

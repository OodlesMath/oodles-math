/* Base & Resets */
body {

/* Duolingo Style Buttons */
.btn-duo {
border-radius: 1.5rem;
transition: all 0.15s ease;
}
.btn-duo:active {
transform: translateY(6px);
border-bottom-width: 0 !important;
margin-top: 6px;
}

/* Ver4 Animal Icons: sharper transparent cutout animals, no white plate background. */
.animal-btn {
background: transparent;
border: none;
border-bottom: none;
border-radius: 0;
transition: all 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
box-shadow: none;
width: clamp(5.6rem, 13vw, 9rem);
height: clamp(4.6rem, 10vw, 7rem);
font-size: 0;
display: flex;
align-items: center;
justify-content: center;
padding: 0;
overflow: visible;
}
.animal-btn:hover {
transform: translateY(-2px) scale(1.03);
}
.animal-btn:active {
transform: scale(0.96) translateY(2px);
border-bottom-width: 0;
box-shadow: none;
}

.animal-btn img {
width: 100%;
height: 100%;
object-fit: contain;
pointer-events: none;
filter: drop-shadow(0px 5px 6px rgba(0,0,0,0.22));
image-rendering: auto;
backface-visibility: hidden;
transform: translateZ(0);
}

/* Animations */
@keyframes bounce-happy {
0%, 100% { transform: translateY(0) scale(1); }
40% { transform: translateY(-30px) scale(1.1) rotate(5deg); }
60% { transform: translateY(-15px) scale(1.05) rotate(-5deg); }
80% { transform: translateY(-30px) scale(1.1) rotate(5deg); }
}
.anim-correct {
animation: bounce-happy 1s ease infinite;
background: transparent;
border: none;
box-shadow: none;
}
.anim-correct img {
filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.75)) drop-shadow(0px 5px 6px rgba(0,0,0,0.22));
}

@keyframes gentle-shake {
0%, 100% { transform: translateX(0); }
20% { transform: translateX(-8px) rotate(-5deg); }
40% { transform: translateX(8px) rotate(5deg); }
60% { transform: translateX(-8px) rotate(-5deg); }
80% { transform: translateX(8px) rotate(5deg); }
}
.anim-wrong {
animation: gentle-shake 0.5s ease;
opacity: 0.7;
filter: grayscale(0.6);
}

/* Clouds */
@keyframes drift {
from { transform: translateX(-200px); }
to { transform: translateX(120vw); }
}
.cloud {
position: absolute;
background: #fff;
border-radius: 50px;
opacity: 0.9;
animation: drift linear infinite;
}
.cloud::before, .cloud::after {
content: '';
position: absolute;
background: #fff;
border-radius: 50%;
}
.cloud1 { width: 120px; height: 40px; top: 8%; animation-duration: 35s; }
.cloud1::before { width: 60px; height: 60px; top: -25px; left: 20px; }
.cloud1::after { width: 45px; height: 45px; top: -15px; right: 20px; }
.cloud2 { width: 180px; height: 50px; top: 18%; animation-duration: 45s; animation-delay: -15s; opacity: 0.7; transform: scale(0.8); }
.cloud2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
.cloud2::after { width: 60px; height: 60px; top: -20px; right: 30px; }

#confetti-canvas {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
pointer-events: none;
z-index: 99999; /* Ensure it is on top of everything */
}

<script>
(() => {
            'use strict';

            const canvas = document.getElementById('river-canvas');
            const ctx = canvas.getContext('2d');
            let width = 0;
            let height = 0;
            let time = 0;
            const RIVER_FLOW_SPEED = 1.15;
            let riverTime = 0;

            // ver3: cây và hoa thuộc lớp riêng, không nằm trong stacking context của đồi.
            const hills = Array.from(document.querySelectorAll('.hill'));
            const trees = Array.from(document.querySelectorAll('#trees-layer .tree'));
            const flowers = Array.from(document.querySelectorAll('#flowers-layer .flower'));
            const butterflies = Array.from(document.querySelectorAll('.butterfly')).map((el) => ({
                el, xRatio: Number(el.dataset.x), lift: Number(el.dataset.lift),
                phase: Number(el.dataset.phase), baseX: 0, baseY: 0
            }));
            const rainbow = document.querySelector('.rainbow');
            let grassContours = [];

            function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }

            // Mép trên của border-radius: 100% 100% 0 0 là nửa ellipse.
            // Áp dụng đúng phép xoay của từng đồi để gốc cây bám vào mặt cỏ.
            function contourForHill(hill) {
                const style = getComputedStyle(hill);
                const w = parseFloat(style.width);
                const h = parseFloat(style.height);
                const left = hill.offsetLeft;
                const top = hill.offsetTop;
                const matrix = new DOMMatrixReadOnly(style.transform === 'none' ? undefined : style.transform);
                const points = [];
                for (let i = 0; i <= 160; i++) {
                    const angle = Math.PI + i / 160 * Math.PI;
                    const dx = w / 2 * Math.cos(angle);
                    const dy = h / 2 * Math.sin(angle);
                    points.push({
                        x: left + w / 2 + matrix.a * dx + matrix.c * dy,
                        y: top + h / 2 + matrix.b * dx + matrix.d * dy
                    });
                }
                return points;
            }

            function grassTopAt(x) {
                let surface = Infinity;
                for (const points of grassContours) {
                    for (let i = 1; i < points.length; i++) {
                        const a = points[i - 1], b = points[i];
                        if (x < Math.min(a.x, b.x) || x > Math.max(a.x, b.x)) continue;
                        const span = b.x - a.x;
                        if (Math.abs(span) < .0001) continue;
                        const t = (x - a.x) / span;
                        surface = Math.min(surface, a.y + (b.y - a.y) * t);
                    }
                }
                return Number.isFinite(surface) ? surface : height;
            }

            function layoutMeadow() {
                grassContours = hills.map(contourForHill);
                const shoreline = height - (Math.max(150, height * .25) - 40);
                const sizeFit = Math.min(1, Math.max(.66, width / 650), Math.max(.70, height / 530));

                trees.forEach((tree) => {
                    const scale = Number(tree.dataset.scale) * sizeFit;
                    const margin = 44 * scale + 4;
                    let x = clamp(Number(tree.dataset.x) * width, margin, width - margin);
                    let surface = grassTopAt(x);
                    // Khi cửa sổ rất thấp, tìm phần cỏ gần nhất còn lộ phía trên mặt nước.
                    if (surface + 10 > shoreline - 12) {
                        const preferredX = x;
                        let nearest = Infinity;
                        for (let probe = margin; probe <= width - margin; probe += 8) {
                            const y = grassTopAt(probe);
                            if (y + 10 > shoreline - 12 || Math.abs(probe - preferredX) >= nearest) continue;
                            nearest = Math.abs(probe - preferredX); x = probe; surface = y;
                        }
                    }
                    const hasGrass = surface + 10 <= shoreline - 12;
                    const groundY = Math.min(surface + 11 * scale, shoreline - 12);
                    tree.style.width = 82 * scale + 'px';
                    tree.style.height = 105 * scale + 'px';
                    tree.style.left = x + 'px';
                    tree.style.top = groundY + 'px';
                    tree.style.zIndex = String(Math.round(groundY));
                    tree.style.visibility = hasGrass ? 'visible' : 'hidden';
                });

                flowers.forEach((flower) => {
                    const x = clamp(Number(flower.dataset.x) * width, 16, width - 16);
                    // Đặt toàn bộ cuống và lá trên cỏ, chừa khoảng cách với bờ nước.
                    const top = grassTopAt(x) + 34;
                    const bottom = shoreline - 12;
                    flower.style.left = x + 'px';
                    flower.style.top = top + Math.max(0, bottom - top) * Number(flower.dataset.depth) + 'px';
                    flower.style.visibility = top <= bottom ? 'visible' : 'hidden';
                });

                const rainbowWidth = Math.min(740, Math.max(230, width * .46));
                const rainbowX = width * .98 - rainbowWidth / 2;
                const rainbowBase = grassTopAt(rainbowX) + Math.min(30, rainbowWidth * .055);
                rainbow.style.top = rainbowBase - rainbowWidth * 374 / 720 + 'px';

                butterflies.forEach((butterfly) => {
                    butterfly.baseX = butterfly.xRatio * width;
                    butterfly.baseY = Math.max(38, grassTopAt(butterfly.baseX) - butterfly.lift * sizeFit);
                    butterfly.el.style.visibility = 'visible';
                });
                animateButterflies();
            }

            function animateButterflies() {
                const range = Math.min(48, width * .065);
                butterflies.forEach((butterfly) => {
                    const phase = butterfly.phase;
                    const x = clamp(butterfly.baseX + Math.sin(time * .53 + phase) * range
                        + Math.sin(time * 1.07 + phase) * range * .17, 22, width - 22);
                    const y = Math.max(20, butterfly.baseY + Math.sin(time * .83 + phase) * 18
                        + Math.cos(time * .39 + phase) * 8);
                    const tilt = Math.sin(time * .67 + phase) * 14;
                    butterfly.el.style.transform = 'translate(' + (x - 17.5) + 'px, ' + (y - 13.675)
                        + 'px) rotate(' + tilt + 'deg)';
                });
            }

            function resizeBackground() {
                width = window.innerWidth;
                height = window.innerHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                layoutMeadow();
                drawRiver();
            }

            // ver5: bờ đất/cỏ được vẽ một lần khi đổi kích thước; nước tiếp tục chuyển động.
            const bankCanvas = document.createElement('canvas');
            const bankCtx = bankCanvas.getContext('2d');
            let bankTop = 0;
            let waterPalette;
            let paletteWidth = -1;
            let paletteHeight = -1;
            let paletteDpr = -1;
            let waterWaves = [];
            const fineRipples = Array.from({ length: 190 }, (_, i) => ({
                x: (i * .61803398875) % 1,
                d: .025 + ((i * .41421356237) % 1) * .96,
                size: .3 + ((i * .73205080757) % 1) * .7,
                phase: i * 1.73
            }));

            function noise(seed) {
                const n = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
                return n - Math.floor(n);
            }

            function bankY(x, yOffset) {
                return yOffset + Math.sin(x * .0065 + .6) * 5.5 + Math.sin(x * .027 + 1.7) * 2.0;
            }

            function traceBank(context, yOffset, offset = 0) {
                context.moveTo(-12, bankY(-12, yOffset) + offset);
                for (let x = -4; x <= width + 12; x += 8) context.lineTo(x, bankY(x, yOffset) + offset);
            }

            function buildRiverBank(yOffset, dpr) {
                bankTop = Math.floor(yOffset - 38);
                bankCanvas.width = Math.round(width * dpr);
                bankCanvas.height = Math.round(62 * dpr);
                bankCtx.setTransform(dpr, 0, 0, dpr, 0, -bankTop * dpr);
                bankCtx.clearRect(0, bankTop, width, 62);

                // Lớp đất thấp, có sắc ẩm ở chân bờ; nằm ngay dưới các bụi cỏ.
                const soil = bankCtx.createLinearGradient(0, yOffset - 12, 0, yOffset + 4);
                soil.addColorStop(0, '#506b30');
                soil.addColorStop(.38, '#76613d');
                soil.addColorStop(.8, '#ac8d64');
                soil.addColorStop(1, '#536c59');
                bankCtx.beginPath();
                traceBank(bankCtx, yOffset, -13);
                for (let x = width + 12; x >= -12; x -= 8) {
                    bankCtx.lineTo(x, bankY(x, yOffset) + 1.7 + Math.sin(x * .084) * .9);
                }
                bankCtx.closePath();bankCtx.fillStyle = soil;bankCtx.fill();

                // Đá cuội nhỏ nằm trong bờ đất, không phủ kín đường bờ.
                for (let i = 0, x = 10; x < width; i++, x += 37 + noise(i + 9) * 27) {
                    const y = bankY(x, yOffset) - 1.2;
                    const rx = 3.5 + noise(i + 23) * 5.2;
                    const ry = 2.4 + noise(i + 53) * 2.5;
                    const rock = bankCtx.createLinearGradient(x, y - ry, x, y + ry);
                    rock.addColorStop(0, '#d5c49d');rock.addColorStop(.5, '#ad9e81');rock.addColorStop(1, '#827e67');
                    bankCtx.fillStyle = rock;bankCtx.beginPath();
                    bankCtx.ellipse(x, y, rx, ry, -.3 + noise(i + 32) * .6, 0, Math.PI * 2);bankCtx.fill();
                    bankCtx.strokeStyle = 'rgba(241, 230, 199, .55)';bankCtx.lineWidth = .65;
                    bankCtx.beginPath();bankCtx.moveTo(x - rx * .5, y - ry * .5);bankCtx.quadraticCurveTo(x, y - ry, x + rx * .65, y - ry * .3);bankCtx.stroke();
                }

                // Dải cỏ nền và từng phiến lá cong tạo đường ranh mềm, không phải một nét thẳng.
                bankCtx.beginPath();traceBank(bankCtx, yOffset, -17);
                for (let x = width + 12; x >= -12; x -= 7) bankCtx.lineTo(x, bankY(x, yOffset) - 7 + Math.sin(x * .16) * 2);
                bankCtx.closePath();bankCtx.fillStyle = '#4b9c29';bankCtx.fill();
                const shades = ['#367f24', '#429328', '#57aa2b', '#70be32', '#8acd3b', '#a0d649'];
                for (let i = 0, x = -9; x <= width + 12; i++, x += 8 + noise(i + 70) * 8) {
                    const rootY = bankY(x, yOffset) - 6 + noise(i + 80) * 2;
                    for (let blade = 0; blade < 6; blade++) {
                        const n = i * 9 + blade;
                        const spread = (blade - 2.5) * 3.6 + (noise(n + 11) - .5) * 6;
                        const length = 7 + noise(n + 33) * 12;
                        const tipX = x + spread;
                        const tipY = rootY - length + Math.abs(spread) * .2;
                        const baseX = x + (blade - 2.5) * .6;
                        bankCtx.fillStyle = shades[(i + blade) % shades.length];
                        bankCtx.beginPath();bankCtx.moveTo(baseX - 1.4, rootY + 1);
                        bankCtx.bezierCurveTo(baseX - 1, rootY - length * .58, tipX - spread * .26, tipY - 1, tipX, tipY);
                        bankCtx.bezierCurveTo(tipX - spread * .28, tipY + 3, baseX + 2, rootY - length * .35, baseX + 1.7, rootY + 1);
                        bankCtx.closePath();bankCtx.fill();
                        if (blade === 3) {
                            bankCtx.strokeStyle = 'rgba(190, 225, 88, .42)';bankCtx.lineWidth = .6;
                            bankCtx.beginPath();bankCtx.moveTo(baseX, rootY - 2);bankCtx.quadraticCurveTo(baseX + spread * .15, rootY - length * .55, tipX, tipY + 1);bankCtx.stroke();
                        }
                    }
                    // Lá cỏ phía trước cong rủ xuống bờ, che bớt đất giữa các viên đá.
                    for (let front = 0; front < 3; front++) {
                        const n = i * 5 + front;
                        const lean = (front % 2 ? -1 : 1) * (9 + noise(n + 210) * 12);
                        const baseY = rootY - 2;
                        const tipX = x + lean;
                        const tipY = bankY(tipX, yOffset) - 1.5 - noise(n + 220) * 3;
                        bankCtx.fillStyle = shades[2 + (i + front) % 4];
                        bankCtx.beginPath();bankCtx.moveTo(x - 1.7, baseY + 1);
                        bankCtx.bezierCurveTo(x + lean * .10, baseY - 13,
                            x + lean * .70, baseY - 10, tipX, tipY);
                        bankCtx.bezierCurveTo(x + lean * .65, baseY - 5,
                            x + lean * .25, baseY - 5, x + 1.9, baseY + 1);
                        bankCtx.closePath();bankCtx.fill();
                    }
                }
            }

            function prepareWater(yOffset, riverHeight) {
                const dpr = window.devicePixelRatio || 1;
                if (paletteWidth === width && paletteHeight === height && paletteDpr === dpr) return;
                paletteWidth = width;paletteHeight = height;paletteDpr = dpr;
                const depth = ctx.createLinearGradient(0, yOffset, 0, height);
                depth.addColorStop(0, '#6bcfc8');depth.addColorStop(.12, '#37bed0');
                depth.addColorStop(.46, '#159fca');depth.addColorStop(1, '#0879a9');
                const bankReflection = ctx.createLinearGradient(0, yOffset, 0, yOffset + riverHeight * .46);
                bankReflection.addColorStop(0, 'rgba(128, 159, 79, .24)');
                bankReflection.addColorStop(.4, 'rgba(111, 177, 118, .10)');bankReflection.addColorStop(1, 'rgba(80, 171, 161, 0)');
                const sunX = width * .05 + (width <= 600 ? 36 : 54);
                const glow = ctx.createRadialGradient(sunX, yOffset + 10, 1, sunX, yOffset + 10, riverHeight * 1.25);
                glow.addColorStop(0, 'rgba(255, 249, 197, .22)');glow.addColorStop(.5, 'rgba(224, 249, 226, .08)');glow.addColorStop(1, 'rgba(204, 239, 236, 0)');
                waterPalette = { depth, bankReflection, glow, sunX };
                waterWaves = [];
                const rows = Math.max(7, Math.min(12, Math.round(riverHeight / 17)));
                for (let row = 0; row < rows; row++) {
                    const d = Math.pow((row + .65) / rows, 1.15);
                    const spacing = 120 + d * 150;
                    for (let j = -1; j <= Math.ceil(width / spacing) + 1; j++) {
                        const seed = row * 31 + j + 30;
                        waterWaves.push({
                            baseX: j * spacing + noise(seed) * spacing * .48,
                            d: clamp(d + (noise(seed + 1) - .5) * .032, .025, .98),
                            length: (75 + d * 185) * (.72 + noise(seed + 2) * .55),
                            phase: noise(seed + 3) * Math.PI * 2,
                            bright: .4 + noise(seed + 4) * .6
                        });
                    }
                }
                buildRiverBank(yOffset, dpr);
            }

            function crestY(x, wave, yOffset, riverHeight) {
                const amplitude = 1.2 + wave.d * 10.5;
                return yOffset + wave.d * riverHeight
                    + Math.sin(x * .016 - riverTime * .43 + wave.phase) * amplitude
                    + Math.sin(x * .036 - riverTime * .24 + wave.phase) * amplitude * .24;
            }

            function traceWave(wave, x, yOffset, riverHeight, offset = 0) {
                for (let step = 0; step <= 16; step++) {
                    const xx = x + wave.length * step / 16;
                    const yy = crestY(xx, wave, yOffset, riverHeight) + offset;
                    if (step === 0) ctx.moveTo(xx, yy);else ctx.lineTo(xx, yy);
                }
            }

            function drawRiver() {
                const trackHeight = Math.max(150, height * .25) - 40;
                const yOffset = height - trackHeight;
                ctx.clearRect(0, 0, width, height);

                // Soft grass-to-track edge, keeping BGgreat's meadow composition.
                const shoulder = ctx.createLinearGradient(0, yOffset - 22, 0, yOffset + 14);
                shoulder.addColorStop(0, 'rgba(45, 133, 55, 0)');
                shoulder.addColorStop(.38, '#4b8e3c');
                shoulder.addColorStop(.62, '#6f7a45');
                shoulder.addColorStop(1, '#9d6947');
                ctx.fillStyle = shoulder;
                ctx.fillRect(0, yOffset - 22, width, 36);

                // Main warm running track.
                const track = ctx.createLinearGradient(0, yOffset, 0, height);
                track.addColorStop(0, '#c97c4d');
                track.addColorStop(.45, '#b96b42');
                track.addColorStop(1, '#9e5739');
                ctx.fillStyle = track;
                ctx.fillRect(0, yOffset, width, trackHeight);

                // Slight texture so the track does not look flat.
                ctx.save();
                ctx.globalAlpha = .12;
                for (let i = 0; i < 130; i++) {
                    const x = (i * 83.17) % Math.max(1, width);
                    const y = yOffset + 8 + ((i * 47.31) % Math.max(1, trackHeight - 16));
                    const r = 1 + ((i * 1.71) % 2.6);
                    ctx.fillStyle = i % 3 ? '#6f3c2a' : '#f0b184';
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // Curbs / boundaries.
                ctx.strokeStyle = 'rgba(255,255,255,.94)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, yOffset + 9);
                ctx.lineTo(width, yOffset + 9);
                ctx.stroke();

                // Parallel lane lines reinforce the idea of a real running track.
                ctx.lineWidth = 2.2;
                ctx.strokeStyle = 'rgba(255,255,255,.62)';
                const lanes = 4;
                for (let lane = 1; lane < lanes; lane++) {
                    const yy = yOffset + (trackHeight * lane / lanes);
                    ctx.setLineDash([24, 18]);
                    ctx.lineDashOffset = -time * (10 + lane * 2);
                    ctx.beginPath();
                    ctx.moveTo(0, yy);
                    ctx.lineTo(width, yy);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                // Dark lower trim gives the same polished depth as the original game.
                const trim = ctx.createLinearGradient(0, height - 20, 0, height);
                trim.addColorStop(0, 'rgba(105,55,38,.25)');
                trim.addColorStop(1, 'rgba(74,39,30,.55)');
                ctx.fillStyle = trim;
                ctx.fillRect(0, height - 20, width, 20);
            }

            const startedAt = performance.now();
            function animateBackground(now) {
                time = (now - startedAt) / 1000 * 0.96;
                drawRiver();
                animateButterflies();
                requestAnimationFrame(animateBackground);
            }

            window.addEventListener('resize', resizeBackground);
            resizeBackground();
            requestAnimationFrame(animateBackground);
        })();

const ORDINALS = ['1st', '2nd', '3rd', '4th', '5th'];
const PRAISE_WORDS = ['Great job!', 'Awesome!', 'Perfect!', 'You did it!', 'Super!'];
const ENCOURAGE_WORDS = ['Oops! Try again!', 'Look carefully!', 'Not quite!', 'Which is it?'];

let gameState = {
round: 0,
score: 0,
questionOrder: [],
currentAnimalsOrder: [],
targetOrdinalIndex: 0,
isInputLocked: false
};

// --- Audio System ---
let audioCtx;
function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
}

function playTone(freq, type, duration, vol=0.1) {
if(!audioCtx) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type;
osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
gain.gain.setValueAtTime(0, audioCtx.currentTime);
gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + duration);
}

function playCorrectSound() {
initAudio();
playTone(523.25, 'sine', 0.15, 0.15); // C5
setTimeout(() => playTone(659.25, 'sine', 0.15, 0.15), 100); // E5
setTimeout(() => playTone(783.99, 'sine', 0.3, 0.15), 200); // G5
}

function playWrongSound() {
initAudio();
playTone(300, 'triangle', 0.2, 0.1);
setTimeout(() => playTone(250, 'triangle', 0.3, 0.1), 150);
}

function playWinSound() {
initAudio();
[0, 150, 300].forEach((time, i) => {
setTimeout(() => playTone(523.25 + (i*100), 'square', 0.2, 0.1), time);
});
setTimeout(() => playTone(1046.50, 'square', 0.6, 0.1), 450);
setTimeout(() => playTone(1318.51, 'square', 0.8, 0.1), 700);
}

// --- Speech ---
function speak(text) {
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
utterance.rate = 0.85;
utterance.pitch = 1.2;
utterance.lang = 'en-US';
window.speechSynthesis.speak(utterance);
}
}

function speakCurrentQuestion() {
const targetWord = ORDINALS[gameState.targetOrdinalIndex];
speak(`Which is ${targetWord}?`);
}

// --- Utils ---
function shuffle(array) {
let currentIndex = array.length, randomIndex;
while (currentIndex != 0) {
randomIndex = Math.floor(Math.random() * currentIndex);
currentIndex--;
[array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
}
return array;
}

// --- Game Logic ---
function startGame() {
initAudio();
gameState.round = 0;
gameState.score = 0;
gameState.questionOrder = shuffle([0, 1, 2, 3, 4]);

document.getElementById('start-screen').classList.add('hidden');
document.getElementById('end-screen').classList.add('hidden');
document.getElementById('game-screen').classList.remove('hidden');
document.getElementById('game-screen').classList.add('flex');
loadRound();
}

function loadRound() {
gameState.isInputLocked = false;
document.getElementById('correct-modal').classList.add('hidden');
document.getElementById('correct-modal').classList.remove('flex');
const toast = document.getElementById('wrong-feedback');
toast.classList.add('hidden');
toast.style.opacity = '0';
gameState.targetOrdinalIndex = gameState.questionOrder[gameState.round];
const targetWord = ORDINALS[gameState.targetOrdinalIndex];
// Cập nhật text câu hỏi (Which is...)
document.getElementById('question-text').innerText = `Which is ${targetWord}?`;
gameState.currentAnimalsOrder = shuffle([...ALL_ANIMALS]);
renderAnimals();
renderStars();
setTimeout(() => {
speakCurrentQuestion();
}, 500);
}

function renderStars() {
const container = document.getElementById('stars-container');
container.innerHTML = '';
for(let i = 0; i < 5; i++) {
if (i < gameState.score) {
container.innerHTML += `<span class="text-[#FFC800] drop-shadow-sm">⭐</span>`;
} else {
container.innerHTML += `<span class="text-gray-300">⭐</span>`;
}
}
}

function renderAnimals() {
const container = document.getElementById('animals-container');
container.innerHTML = '';
gameState.currentAnimalsOrder.forEach((animal, index) => {
const animalHTML = `
<div class="flex flex-col items-center justify-end h-full">
<div onclick="handleAnimalClick(${index})"
id="animal-btn-${index}"
class="animal-btn cursor-pointer">
<img src="${animal.image}" alt="${animal.id}" draggable="false">
</div>
<div id="marker-${index}" class="opacity-0 transition-opacity duration-300
bg-[#1CB0F6] text-white font-black
text-sm sm:text-lg md:text-2xl px-3 sm:px-4 py-1
rounded-xl mt-2 md:mt-4 shadow-sm border-b-[4px] border-[#1899D6]">
${ORDINALS[index]}
</div>
</div>
`;
container.innerHTML += animalHTML;
});
}

function handleAnimalClick(clickedIndex) {
if (gameState.isInputLocked) return;

const btn = document.getElementById(`animal-btn-${clickedIndex}`);
const marker = document.getElementById(`marker-${clickedIndex}`);
if (clickedIndex === gameState.targetOrdinalIndex) {
gameState.isInputLocked = true;
gameState.score++;
playCorrectSound();
fireConfetti();
btn.classList.add('anim-correct');
marker.classList.remove('opacity-0');
marker.classList.add('opacity-100');
const praise = PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)];
document.getElementById('praise-text').innerText = praise;
speak(praise);
setTimeout(() => {
renderStars();
document.getElementById('correct-modal').classList.remove('hidden');
document.getElementById('correct-modal').classList.add('flex');
}, 1000);

} else {
playWrongSound();
btn.classList.add('anim-wrong');
setTimeout(() => btn.classList.remove('anim-wrong'), 500);
const encourage = ENCOURAGE_WORDS[Math.floor(Math.random() * ENCOURAGE_WORDS.length)];
const toast = document.getElementById('wrong-feedback');
toast.innerText = encourage;
toast.classList.remove('hidden');
toast.style.opacity = '1';
speak(encourage);
setTimeout(() => {
toast.style.opacity = '0';
setTimeout(() => toast.classList.add('hidden'), 300);
}, 1500);
}
}

function nextQuestion() {
gameState.round++;
if (gameState.round >= 5) {
showEndScreen();
} else {
loadRound();
}
}

function showEndScreen() {
playWinSound();
fireworks();
document.getElementById('game-screen').classList.add('hidden');
document.getElementById('game-screen').classList.remove('flex');
const endScreen = document.getElementById('end-screen');
endScreen.classList.remove('hidden');
endScreen.classList.add('flex');
document.getElementById('final-score').innerText = gameState.score;
const finalStarsContainer = document.getElementById('final-stars');
finalStarsContainer.innerHTML = '';
for(let i = 0; i < 5; i++) {
if (i < gameState.score) {
finalStarsContainer.innerHTML += `<span>⭐</span>`;
} else {
finalStarsContainer.innerHTML += `<span class="opacity-30 grayscale">⭐</span>`;
}
}

speak(`Lesson Complete! Your score is ${gameState.score} out of 5!`);
}

function goHome() {
document.getElementById('game-screen').classList.add('hidden');
document.getElementById('game-screen').classList.remove('flex');
document.getElementById('end-screen').classList.add('hidden');
document.getElementById('start-screen').classList.remove('hidden');
}

// --- Confetti System ---
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animationId;

function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
constructor(x, y, isBig, color = null) {
this.x = x;
this.y = y;
this.size = (Math.random() * 10 + 5) * (isBig ? 1.5 : 1);
const colors = ['#FF4B4B', '#FF9000', '#FFC800', '#58CC02', '#1CB0F6', '#CE82FF'];
this.color = color || colors[Math.floor(Math.random() * colors.length)];
const angle = Math.random() * Math.PI * 2;
const velocity = (Math.random() * 15 + 5) * (isBig ? 1.2 : 1);
this.speedX = Math.cos(angle) * velocity;
this.speedY = Math.sin(angle) * velocity - 3;
this.gravity = 0.4;
this.friction = 0.96;
this.rotation = Math.random() * 360;
this.rotationSpeed = Math.random() * 15 - 7.5;
this.opacity = 1;
this.decay = Math.random() * 0.015 + 0.01;
}
update() {
this.speedX *= this.friction;
this.speedY *= this.friction;
this.speedY += this.gravity;
this.x += this.speedX;
this.y += this.speedY;
this.rotation += this.rotationSpeed;
this.opacity -= this.decay;
}
draw() {
if (this.opacity <= 0) return;
ctx.save();
ctx.translate(this.x, this.y);
ctx.rotate(this.rotation * Math.PI / 180);
ctx.globalAlpha = this.opacity;
ctx.fillStyle = this.color;
if(this.size % 2 > 1) {
ctx.beginPath();
ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
ctx.fill();
} else {
ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
}
ctx.restore();
}
}

function fireConfetti(isBig = false) {
const count = isBig ? 150 : 60;
const originX = canvas.width / 2;
const originY = canvas.height / 2;
for (let i = 0; i < count; i++) {
particles.push(new Particle(
originX + (Math.random() * 100 - 50),
originY + (Math.random() * 100 - 50),
isBig
));
}
if (!animationId) animateConfetti();
}

function fireworks() {
const burstCount = 6;
let bursts = 0;
const interval = setInterval(() => {
const x = Math.random() * canvas.width;
const y = Math.random() * (canvas.height / 2);
for (let i = 0; i < 80; i++) {
particles.push(new Particle(x, y, true));
}
if (!animationId) animateConfetti();
bursts++;
if (bursts >= burstCount) clearInterval(interval);
}, 400);
}

function animateConfetti() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
particles = particles.filter(p => p.y < canvas.height + 50 && p.opacity > 0);
particles.forEach(p => {
p.update();
p.draw();
});
if (particles.length > 0) {
animationId = requestAnimationFrame(animateConfetti);
} else {
animationId = null;
}
}

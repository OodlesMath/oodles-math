<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/brand.css">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Frog Balance Math - Ver 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#23304a; --blue:#22a7f0; --blue-d:#117cc0; --green:#63c84d; --green-d:#389b2d;
  --yellow:#ffd65a; --orange:#ff9b42; --pink:#ff6fae; --purple:#9a72ef; --red:#f25b5b;
  --paper:rgba(255,255,255,.92); --shadow:0 14px 35px rgba(35,48,74,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Poppins,sans-serif;color:var(--ink);overflow:hidden;background:#7dd3fc;user-select:none}
button{font:inherit}
.bg-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
.sun{position:absolute;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff4a7 0 13%,#ffd85c 36%,#ffc94a 100%);top:30px;left:36px;box-shadow:0 0 0 15px rgba(255,216,92,.14),0 0 36px rgba(255,206,72,.30);z-index:1}
.rainbow{position:absolute;left:50%;top:59%;width:min(72vw,760px);aspect-ratio:2/1;transform:translate(-50%,-50%);border-radius:999px 999px 0 0;overflow:hidden;opacity:.72;z-index:0}
.rainbow:before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 100%,transparent 0 49%,#ce82ff 49.5% 53%,#1cb0f6 53.5% 57%,#58cc02 57.5% 61%,#ffc800 61.5% 65%,#ff9900 65.5% 69%,#ff4b4b 69.5% 73%,transparent 73.5%)}

.screen{position:relative;z-index:5;width:100%;height:100%}.hidden{display:none!important}
.home{height:100%;overflow:auto;padding:22px 16px 34px;display:flex;align-items:center;justify-content:center}
.home-card{width:min(850px,96vw);background:var(--paper);border:5px solid white;border-radius:36px;box-shadow:var(--shadow);padding:28px;text-align:center;backdrop-filter:blur(8px)}
.logo-mark{width:128px;height:128px;margin:0 auto 12px;filter:drop-shadow(0 10px 12px rgba(40,80,70,.18));animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
h1{margin:4px 0 2px;font-size:clamp(2rem,5vw,3.6rem);font-weight:900;letter-spacing:-.04em;color:#338b31}
.subtitle{font-size:clamp(1rem,2vw,1.25rem);font-weight:700;color:#5d6a7b;margin-bottom:20px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.mode{border:none;border-radius:28px;padding:22px 18px;color:white;font-weight:900;font-size:1.35rem;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.18);transition:.12s}.mode:hover{transform:translateY(-3px)}.mode:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18)}.explore{background:var(--green)}.challenge{background:var(--blue)}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}.badge{background:#f5f8fb;border:2px solid #dfe8ef;border-radius:999px;padding:7px 12px;font-size:.78rem;font-weight:800;color:#617083}

.game{height:100%;padding:10px 12px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.86);border:3px solid white;border-radius:22px;padding:8px 12px;box-shadow:0 8px 20px rgba(32,75,99,.1);backdrop-filter:blur(7px)}
.top-left-group{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand svg{width:40px;height:40px;flex:0 0 40px}.brand b{font-size:clamp(.95rem,2vw,1.25rem);font-weight:900;color:#338b31;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-start}.chip{padding:6px 10px;border-radius:999px;background:white;border:2px solid #dbe7ee;font-weight:900;font-size:.75rem;white-space:nowrap}.score{color:#b77800;background:#fff8cf;border-color:#f2d565}.qchip{color:#25679e;background:#eaf7ff;border-color:#b9e1fb}
.custom-logo-space{min-width:100px;height:36px}

.instruction-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;}
.instruction-center{flex:1;display:flex;justify-content:center;min-width:200px;}
.instruction{background:rgba(255,255,255,.94);border:3px solid white;border-radius:18px;padding:10px 14px;box-shadow:0 7px 18px rgba(32,75,99,.08);font-size:clamp(.88rem,2vw,1.08rem);font-weight:900;text-align:center;display:inline-block;}
.smallbtn{border:none;border-radius:15px;padding:10px 12px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.14)}.homebtn{background:#e7edf2;color:#566575}.speak{background:var(--blue);color:white}.reset{background:#fff2cb;color:#a56e00}.smallbtn:active{transform:translateY(4px);box-shadow:none}

.stage-wrap{min-height:0;display:flex;justify-content:center;align-items:stretch}
.stage{
  position:relative;width:min(1050px,100%);height:100%;min-height:330px;
  background:transparent; border:none; box-shadow:none;
}
.balance-label{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.94);border:2px solid white;border-radius:999px;padding:6px 13px;font-size:.8rem;font-weight:900;z-index:20;box-shadow:0 5px 12px rgba(0,0,0,.08)}

/* Hide the yellow beam framework entirely */
.pivot, .endpoint, .tray-string { display: none !important; }
.beam { opacity: 0; pointer-events: none; position:absolute; left:50%; top:54%; width:min(48%, 400px); height:20px; transform-origin:center center; transform:translate(-50%,-50%) rotate(0deg); }

.tray-unit{position:absolute; top:54%; width:190px; height:190px; z-index:9; transform:translateX(-50%); transition:top .55s cubic-bezier(.25,.8,.25,1)}
.pan{position:absolute; left:0; bottom:0; width:100%; height:100%; z-index:10; border-radius:12px;}

/* Visual Leaf Plate */
.leaf-plate {
  position:absolute; left:50%; bottom:0; transform:translateX(-50%);
  width:180px; height:62px; border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%, #a7f48a 0%, #67d544 55%, #2e8f2e 100%);
  border:4px solid #1f6c1f;
  box-shadow:0 8px 0 #185a18, inset 0 -4px 10px rgba(0,0,0,0.15), inset 0 6px 12px rgba(255,255,255,0.4);
  transition:0.18s; z-index:0;
}
.leaf-plate::after {
  content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:8px; height:8px; border-radius:50%; background:#1a5c1a; opacity:0.4;
}
.pan.hot .leaf-plate {
  box-shadow:0 8px 0 #185a18, 0 0 0 6px rgba(255,214,90,.75), 0 0 25px rgba(255,214,90,.66), inset 0 6px 12px rgba(255,255,255,0.4);
}

.pan-items{
  position:absolute; left:0; bottom:26px;
  width:100%; height:calc(100% - 26px);
  display:flex; flex-wrap:wrap; align-content:flex-end; justify-content:center; gap:2px;
  z-index:1; padding:0 8px;
}
.pan-value{
  position:absolute; top:100%; left:50%; transform:translate(-50%, 10px);
  background:rgba(255,255,255,.95); border:2px solid #d8e4ec; border-radius:999px;
  padding:5px 12px; font-size:.72rem; font-weight:900; white-space:nowrap; box-shadow:0 4px 8px rgba(0,0,0,.08);
}

/* SVG Frog Hand attached under the lotus leaf, wrapping the edge */
.frog-hand{
  position:absolute; bottom:-12px; left:50%; transform:translateX(-50%);
  width:66px; height:33px; z-index:15; overflow:visible;
}

.frog-main{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);height:min(60%,320px);width:auto;z-index:8;filter:drop-shadow(0 12px 12px rgba(42,91,48,.24));transition:.3s}
.frog-main.happy{animation:celebrate .55s ease 2}@keyframes celebrate{50%{transform:translateX(-50%) translateY(-12px) scale(1.03)}}

.game-item{touch-action:none;cursor:grab;display:grid;place-items:center;position:relative}.game-item:active{cursor:grabbing}.frog-token{width:42px;height:38px;flex:0 0 42px}.frog-token svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}.num-token{width:46px;height:46px;flex:0 0 46px;border-radius:13px;border:3px solid rgba(0,0,0,.15);color:white;font-size:1.45rem;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.16);box-shadow:0 5px 0 rgba(0,0,0,.17), inset 0 5px 8px rgba(255,255,255,.25)}
.drag-ghost{position:fixed!important;z-index:9999!important;pointer-events:none!important;transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 10px 8px rgba(0,0,0,.22));opacity:.96}
.toolbox{background:rgba(255,255,255,.94);border:3px solid white;border-radius:24px;padding:8px 10px 10px;box-shadow:0 8px 22px rgba(32,75,99,.12);overflow:hidden}.tool-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.78rem;font-weight:900;margin-bottom:7px}.tools{display:flex;align-items:center;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}.source-card{flex:0 0 auto;min-width:70px;background:#f8fbfd;border:2px solid #dde9f0;border-radius:16px;padding:6px;display:flex;align-items:center;justify-content:center;gap:5px;min-height:56px}.source-card span{font-size:.65rem;font-weight:800;color:#647487}.num-source{width:43px;height:43px;flex-basis:43px}.frog-source{width:47px;height:42px;flex-basis:47px}
.actionbar{display:flex;justify-content:center;gap:10px;margin-top:7px}.action{border:none;border-radius:16px;padding:10px 22px;font-weight:900;color:white;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.17);min-width:140px}.check{background:var(--green)}.next{background:var(--blue)}.action:active{transform:translateY(5px);box-shadow:none}
.feedback{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.9);background:white;border:4px solid white;border-radius:22px;padding:12px 22px;font-size:1.25rem;font-weight:900;box-shadow:0 14px 35px rgba(0,0,0,.18);z-index:50;opacity:0;pointer-events:none;transition:.22s}.feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.feedback.good{color:#2f9830}.feedback.bad{color:#d26926}.feedback .equation{display:block;color:#415168;font-size:.88rem;margin-top:3px;text-align:center}
.choice-row{position:absolute;left:50%;top:73%;transform:translate(-50%,-50%);z-index:35;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:92%}.cmp{border:none;border-radius:18px;padding:12px 16px;background:white;border:3px solid #dce7ee;box-shadow:0 5px 0 #c4d2dc;font-size:1.05rem;font-weight:900;cursor:pointer}.cmp:active{transform:translateY(5px);box-shadow:none}.cmp.selected{border-color:#5ab9ee;background:#eaf7ff;color:#1678b5}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:10000}.end-overlay{position:fixed;inset:0;background:rgba(27,48,72,.28);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.end-card{width:min(480px,95vw);background:white;border:5px solid white;border-radius:34px;padding:28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.22)}.end-card h2{font-size:2rem;margin:6px 0;color:#318d36}.stars{font-size:2.5rem;color:#f3b813;letter-spacing:5px}.end-actions{display:grid;gap:10px;margin-top:18px}.end-actions button{border:none;border-radius:18px;padding:13px;font-weight:900;cursor:pointer;color:white}.again{background:var(--green)}.goexplore{background:var(--blue)}.gohome{background:#8797a6}

@media(max-width:800px){
  .game{padding:7px;gap:6px}.topbar{padding:6px 9px}.brand svg{width:34px;height:34px;flex-basis:34px}.chip{font-size:.66rem;padding:5px 8px}
  .top-left-group{gap:10px}
  .reset{display:none}.stage{min-height:300px}
  .toolbox{padding:7px}.source-card{min-width:62px}.action{padding:9px 18px;min-width:120px}
}
@media (max-width:768px){
  .beam{top:52%; width:min(55%, 380px);}
  .tray-unit{top:52%; width:160px; height:160px;}
  .leaf-plate{width:150px; height:52px;}
  .pan-items{bottom:22px;}
  .frog-hand{width:56px; height:28px; bottom:-10px;}
  .frog-main{height:min(55%,280px);bottom:4%}
}
@media (max-width:560px){
  .mode-grid{grid-template-columns:1fr}.home-card{padding:22px 16px}.game{grid-template-rows:auto auto minmax(0,1fr) auto}.brand b{font-size:.82rem}.score{display:none}.instruction{font-size:.82rem;padding:8px}.smallbtn{padding:8px 10px}.stage{min-height:320px;}
  .top-left-group{gap:6px}.custom-logo-space{display:none}
  .beam{top:50%; width:min(65%, 320px);}
  .tray-unit{top:50%; width:135px; height:140px;}
  .leaf-plate{width:126px; height:46px;}
  .pan-items{bottom:19px;}
  .pan-value{transform:translate(-50%, 6px);font-size:.69rem}
  .frog-hand{width:50px; height:25px; bottom:-8px;}
  .frog-main{height:min(50%,240px);bottom:4%}
  .frog-token{width:35px;height:32px;flex-basis:35px}.num-token{width:39px;height:39px;flex-basis:39px;font-size:1.15rem;border-radius:10px}.choice-row{top:75%}.cmp{padding:10px 12px;font-size:.9rem}.tool-title{margin-bottom:4px}.tools{gap:5px}.source-card{min-height:50px;padding:4px}.actionbar{margin-top:4px}.action{padding:8px 15px;font-size:.85rem}
}
</style>
</head>
<body>
  <!-- Global Logo -->
    <div class="absolute top-4 right-4 md:top-6 md:right-6 z-[100] bg-white rounded-2xl shadow-md border-2 border-gray-100 border-b-[4px] px-3 py-2 flex items-center justify-center">
        <img src="../assets/logo-oodles-math.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="Oodles Math Logo" class="h-8 md:h-10 object-contain">
        
        <!-- Dòng chữ dự phòng này chỉ hiện ra khi link ảnh bị lỗi -->
        <div style="display:none" class="font-black text-[#0B2B5B] text-sm md:text-base leading-tight text-center">
            OODLES<br>MATH
        </div>
    </div>
<canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>
<div class="sun"></div>

<svg style="display:none" aria-hidden="true">

    <circle cx="36" cy="38" r="18" fill="#67d153" stroke="#2f8f2e" stroke-width="5"/><circle cx="84" cy="38" r="18" fill="#67d153" stroke="#2f8f2e" stroke-width="5"/>

    <circle cx="24" cy="21" r="5" fill="#fff"/><circle cx="56" cy="21" r="5" fill="#fff"/><circle cx="25" cy="22" r="2.6" fill="#23304a"/><circle cx="55" cy="22" r="2.6" fill="#23304a"/>

</svg>

<section id="homeScreen" class="screen home">
  <div class="home-card">
    <svg class="logo-mark" viewBox="0 0 120 120"><use href="#frog-logo"/></svg>
    <h1>Frog Balance Math</h1>
    <div class="subtitle">Play with numbers and make the scale balance!</div>
    <div class="mode-grid">
      <button class="mode explore" id="exploreBtn">EXPLORE<br><small style="font-size:.68em">Free Play</small></button>
      <button class="mode challenge" id="challengeBtn">CHALLENGES<br><small style="font-size:.68em">10 Math Puzzles</small></button>
    </div>
    <div class="badges"><span class="badge">Numbers</span><span class="badge">Addition</span><span class="badge">Comparison</span><span class="badge">Number Bonds</span></div>
  </div>
</section>

<section id="gameScreen" class="screen game hidden">
  <div class="topbar">
    <div class="top-left-group">
      <div class="brand"><svg viewBox="0 0 120 120"><use href="#frog-logo"/></svg><b>FROG BALANCE MATH</b></div>
      <div class="chips"><span class="chip qchip" id="questionChip">Free Play</span><span class="chip score" id="scoreChip">Score: 0</span></div>
    </div>
    
    <!-- KHÔNG GIAN TRỐNG ĐỂ BẠN CHÈN LOGO -->
    <!-- (Bạn có thể bỏ thẻ <img> vào bên trong div này) -->
    <div id="customLogoSpace" class="custom-logo-space"></div>
  </div>

  <div class="instruction-row">
    <button class="smallbtn homebtn" id="homeBtn">HOME</button>
    <div class="instruction-center">
      <div class="instruction" id="instruction">Make the two sides balance!</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="smallbtn speak" id="speakBtn">SPEAK</button>
      <button class="smallbtn reset" id="resetBtn">RESET</button>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="balance-label" id="balanceLabel">Try the scale</div>
      <div class="beam" id="beam"></div><div class="pivot"></div>
      <div class="endpoint" id="leftEnd"></div><div class="endpoint" id="rightEnd"></div>
      
      <!-- Dynamic SVG Canvas for arms connecting body to pans -->
      <svg id="armCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:3; pointer-events:none; overflow:visible;">
         <!-- Outer borders for the arms -->
         <path id="frogArmL_border" fill="none" stroke="#2f8f2e" stroke-width="34" stroke-linecap="round"/>

         <!-- Inner green body color of the arms -->

         <path id="frogArmR" fill="none" stroke="#62c84d" stroke-width="22" stroke-linecap="round"/>
      </svg>

      <div class="tray-unit" id="leftTrayUnit">
        <div class="pan" id="leftPan">
            <div class="leaf-plate" id="leftLeaf"></div>
            <div class="pan-items" id="leftItems"></div>
        </div>
        <!-- Hand is tracked perfectly via its ID for continuous arm drawing -->
        <svg class="frog-hand" id="leftHand" viewBox="0 0 50 25">
          <circle cx="10" cy="12" r="8" fill="#68d153" stroke="#2f8f2e" stroke-width="4"/>
          <circle cx="20" cy="8" r="9" fill="#68d153" stroke="#2f8f2e" stroke-width="4"/>
          <circle cx="30" cy="8" r="9" fill="#68d153" stroke="#2f8f2e" stroke-width="4"/>
          <circle cx="40" cy="12" r="8" fill="#68d153" stroke="#2f8f2e" stroke-width="4"/>
        </svg>
        <div class="pan-value" id="leftValue">Left: 0</div>

      <div class="tray-unit" id="rightTrayUnit">

            <div class="pan-items" id="rightItems"></div>
        </div>

      <!-- Frog Body Container -->

        <ellipse cx="160" cy="232" rx="80" ry="86" fill="#62c84d" stroke="#2f8f2e" stroke-width="8"/>
        <ellipse cx="160" cy="248" rx="50" ry="58" fill="#abe47d" opacity=".96"/>
        <ellipse cx="160" cy="146" rx="92" ry="76" fill="#63c84f" stroke="#2f8f2e" stroke-width="8"/>
        <circle cx="108" cy="96" r="42" fill="#68d153" stroke="#2f8f2e" stroke-width="8"/>

<script>
(() => {
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d', { alpha: false });
  let bgW = 0, bgH = 0, bgWater = 0, bgTime = 0, bgLast = 0;
  let clouds = [], bgTrees = [], mountains = [], shoreMounds = [], decorFishes = [], standingLotuses = [], floatingLeaves = [];

  function resizeBackground(){
    bgW = window.innerWidth; bgH = window.innerHeight;
    bgCanvas.width = bgW; bgCanvas.height = bgH;
    bgWater = bgH * 0.7;
    generateEnvironment();
  }

  function generateEnvironment(){
    clouds = []; bgTrees = []; mountains = []; shoreMounds = []; decorFishes = []; standingLotuses = []; floatingLeaves = [];
    for(let i=0; i<4; i++){
      clouds.push({ x: Math.random()*bgW, y: Math.random()*(bgWater*0.46), size: 15 + Math.random()*25, speed: 0.1 + Math.random()*0.2 });
    }
    for(let i=0; i<8; i++){
      bgTrees.push({ x: Math.random()*bgW, y: bgWater - (10 + Math.random()*20), scale: 0.4 + Math.random()*0.5 });
    }
    mountains.push({ x: bgW*0.15, h: 260, w: 500, c1: '#a68be0', c2: '#8c6bc9' }); 
    mountains.push({ x: bgW*0.85, h: 230, w: 450, c1: '#eab26f', c2: '#d49445' }); 
    mountains.push({ x: bgW*0.5, h: 320, w: 600, c1: '#64a3e8', c2: '#4786cd' });  
    
    const numMounds = Math.ceil(bgW/60) + 2;
    for(let i=-1; i<numMounds; i++){
      shoreMounds.push({ x: i*60 + Math.random()*30, y: bgWater, w: 100 + Math.random()*60, h: 15 + Math.random()*25, color: Math.random()>0.5 ? '#1a4d0f' : '#236316' });
    }
    const fishColors = [
      {body:'#ff9900', stripe:'#ffd633'}, {body:'#00b4d8', stripe:'#74c69d'},
      {body:'#ce82ff', stripe:'#ffb2d1'}, {body:'#ff4b4b', stripe:'#ffc800'}
    ];
    for(let i=0; i<15; i++){
      decorFishes.push({ x: Math.random()*bgW, y: bgWater + 40 + Math.random()*(bgH-bgWater-60), speed: 0.5 + Math.random(), dir: Math.random()>0.5 ? 1 : -1, scale: 0.4 + Math.random()*0.3, bobOffset: Math.random()*Math.PI*2, colorObj: fishColors[Math.floor(Math.random()*fishColors.length)] });
    }
    for(let i=0; i<10; i++){
      standingLotuses.push({ x: Math.random()*bgW, y: bgWater - 10 + Math.random()*10, height: 40 + Math.random()*30, scale: 0.5 + Math.random()*0.3, swayOffset: Math.random()*Math.PI*2 });
      floatingLeaves.push({ x: Math.random()*bgW, y: bgWater + Math.random()*20, scale: 0.3 + Math.random()*0.4, rotation: Math.random()*Math.PI*2 });
    }
  }

  function updateBackground(ts=1){
    bgTime += 0.03 * ts;
    clouds.forEach(c => { c.x -= c.speed * ts; if(c.x + c.size*2 < 0){ c.x = bgW + c.size*2; c.y = Math.random()*(bgWater*0.4); }});
    decorFishes.forEach(f => {
      f.x += f.speed * f.dir * ts;
      if(f.dir===1 && f.x > bgW + 100){ f.x = -100; f.y = bgWater + 40 + Math.random()*(bgH - bgWater - 60); }
      else if(f.dir===-1 && f.x < -100){ f.x = bgW + 100; f.y = bgWater + 40 + Math.random()*(bgH - bgWater - 60); }
    });
  }

  function drawMountain(mx,my,mw,mh,colorLight,colorDark){
    const peakX = mx, peakY = my - mh;
    bgCtx.fillStyle = colorLight; bgCtx.beginPath(); bgCtx.moveTo(mx-mw/2,my); bgCtx.lineTo(peakX,peakY); bgCtx.lineTo(peakX,my); bgCtx.fill();
    bgCtx.fillStyle = colorDark; bgCtx.beginPath(); bgCtx.moveTo(peakX,peakY); bgCtx.lineTo(mx+mw/2,my); bgCtx.lineTo(peakX,my); bgCtx.fill();
    bgCtx.fillStyle = '#ffffff'; bgCtx.beginPath();
    const sH = mh * 0.2; bgCtx.moveTo(peakX,peakY); bgCtx.lineTo(peakX - (mw/2)*(sH/mh), peakY + sH);
    const wStep = (mw/2)*(sH/mh)/3;
    bgCtx.lineTo(peakX - wStep*2, peakY + sH + 15); bgCtx.lineTo(peakX - wStep, peakY + sH - 5); bgCtx.lineTo(peakX, peakY + sH + 20);
    bgCtx.lineTo(peakX + wStep, peakY + sH - 5); bgCtx.lineTo(peakX + wStep*2, peakY + sH + 15); bgCtx.lineTo(peakX + (mw/2)*(sH/mh), peakY + sH);
    bgCtx.closePath(); bgCtx.fill();
  }

  function drawStandingLotus(px,py,h,scale,sway){
    bgCtx.save(); bgCtx.translate(px,py); bgCtx.rotate(sway); bgCtx.scale(scale,scale);
    bgCtx.strokeStyle = '#276b1f'; bgCtx.lineWidth = 6; bgCtx.beginPath(); bgCtx.moveTo(0,0); bgCtx.quadraticCurveTo(-10,-h/2,0,-h); bgCtx.stroke();
    bgCtx.translate(0,-h);
    bgCtx.fillStyle = '#ff63a5'; bgCtx.beginPath(); bgCtx.ellipse(-18,-10,16,28,-Math.PI/4,0,Math.PI*2); bgCtx.fill(); bgCtx.beginPath(); bgCtx.ellipse(18,-10,16,28,Math.PI/4,0,Math.PI*2); bgCtx.fill();
    bgCtx.fillStyle = '#ff9ec4'; bgCtx.beginPath(); bgCtx.ellipse(-10,-15,14,32,-Math.PI/8,0,Math.PI*2); bgCtx.fill(); bgCtx.beginPath(); bgCtx.ellipse(10,-15,14,32,Math.PI/8,0,Math.PI*2); bgCtx.fill();
    bgCtx.fillStyle = '#ffe0ec'; bgCtx.beginPath(); bgCtx.ellipse(0,-20,14,34,0,0,Math.PI*2); bgCtx.fill();
    bgCtx.fillStyle = '#ffc800'; bgCtx.beginPath(); bgCtx.ellipse(0,0,14,6,0,0,Math.PI*2); bgCtx.fill();
    bgCtx.restore();
  }

  function drawFloatingLeaf(px,py,scale,rot){
    bgCtx.save(); bgCtx.translate(px,py); bgCtx.scale(scale,scale*0.5); bgCtx.rotate(rot);
    const w = 120;
    bgCtx.fillStyle = '#1e7a1e'; bgCtx.beginPath(); bgCtx.arc(0,10,w/2,Math.PI*0.1,Math.PI*1.9); bgCtx.lineTo(0,10); bgCtx.fill();
    const leafGrad = bgCtx.createLinearGradient(-w/2,-w/2,w/2,w/2); leafGrad.addColorStop(0,'#58cc02'); leafGrad.addColorStop(1,'#3ba302');
    bgCtx.fillStyle = leafGrad; bgCtx.beginPath(); bgCtx.arc(0,0,w/2,Math.PI*0.1,Math.PI*1.9); bgCtx.lineTo(0,0); bgCtx.fill();
    bgCtx.restore();
  }

  function renderBackground(){
    const skyGrad = bgCtx.createLinearGradient(0,0,0,bgWater); skyGrad.addColorStop(0,'#7dd3fc'); skyGrad.addColorStop(1,'#bae6fd');
    bgCtx.fillStyle = skyGrad; bgCtx.fillRect(0,0,bgW,bgWater);
    bgCtx.save(); bgCtx.translate(bgW/2, bgWater); bgCtx.lineWidth = Math.min(25, bgW*0.02);
    const rbColors = ['#ff4b4b','#ff9900','#ffc800','#58cc02','#1cb0f6','#ce82ff']; const baseRad = Math.min(bgW*0.45,600);
    for(let i=0; i<rbColors.length; i++){ bgCtx.strokeStyle = rbColors[i]; bgCtx.beginPath(); bgCtx.arc(0,0,baseRad - i*bgCtx.lineWidth, Math.PI, 0); bgCtx.stroke(); }
    bgCtx.restore();
    
    mountains.forEach(m => drawMountain(m.x,bgWater,m.w,m.h,m.c1,m.c2));
    
    shoreMounds.forEach(m => { bgCtx.fillStyle = m.color; bgCtx.beginPath(); bgCtx.ellipse(m.x,m.y,m.w/2,m.h,0,Math.PI,Math.PI*2); bgCtx.fill(); });
    bgCtx.fillStyle = 'rgba(255,255,255,0.95)';
    clouds.forEach(el => { bgCtx.beginPath(); bgCtx.arc(el.x,el.y,el.size,0,Math.PI*2); bgCtx.arc(el.x+el.size*0.8,el.y+el.size*0.2,el.size*0.7,0,Math.PI*2); bgCtx.arc(el.x-el.size*0.8,el.y+el.size*0.2,el.size*0.7,0,Math.PI*2); bgCtx.fill(); });
    bgTrees.forEach(t => { bgCtx.save(); bgCtx.translate(t.x,t.y); bgCtx.scale(t.scale,t.scale); bgCtx.fillStyle='#78350f'; bgCtx.fillRect(-10,0,20,60); bgCtx.fillStyle='#4ade80'; bgCtx.beginPath(); bgCtx.arc(0,-20,40,0,Math.PI*2); bgCtx.fill(); bgCtx.beginPath(); bgCtx.arc(-25,-10,30,0,Math.PI*2); bgCtx.fill(); bgCtx.beginPath(); bgCtx.arc(25,-10,30,0,Math.PI*2); bgCtx.fill(); bgCtx.restore(); });
    const waterGrad = bgCtx.createLinearGradient(0,bgWater,0,bgH); waterGrad.addColorStop(0,'#1ca3ec'); waterGrad.addColorStop(1,'#0f5e9c');
    bgCtx.fillStyle = waterGrad; bgCtx.fillRect(0,bgWater,bgW,bgH-bgWater);
    bgCtx.fillStyle = 'rgba(0,40,80,0.4)';
    for(let x=0; x<bgW; x+=120){ bgCtx.beginPath(); bgCtx.ellipse(x + Math.sin(x)*40, bgH - 30, 30 + Math.sin(x)*10, 15, 0, 0, Math.PI*2); bgCtx.fill(); }
    bgCtx.fillStyle = 'rgba(100,200,255,0.4)'; bgCtx.beginPath(); bgCtx.moveTo(0,bgH); const speed1 = bgTime * 0.8;
    for(let x=0; x<=bgW+50; x+=50){ const wave = Math.sin(x/120 + speed1)*6; bgCtx.lineTo(x,bgWater + 10 + wave); }
    bgCtx.lineTo(bgW,bgH); bgCtx.fill();
    standingLotuses.forEach(l => drawStandingLotus(l.x,l.y,l.height,l.scale,Math.sin(bgTime*1.5 + l.swayOffset)*0.15));
    floatingLeaves.forEach(leaf => drawFloatingLeaf(leaf.x, leaf.y + Math.sin(leaf.x/120 + speed1)*6, leaf.scale, leaf.rotation + Math.sin(bgTime)*0.05));
    bgCtx.fillStyle = 'rgba(40,180,240,0.8)'; bgCtx.beginPath(); bgCtx.moveTo(0,bgH); const speed2 = bgTime * 1.0;
    for(let x=0; x<=bgW+50; x+=50){ const wave = Math.sin(x/150 + speed2)*10; bgCtx.lineTo(x,bgWater + 30 + wave); }
    bgCtx.lineTo(bgW,bgH); bgCtx.fill();
    bgCtx.strokeStyle = 'rgba(255,255,255,0.5)'; bgCtx.lineWidth = 4; bgCtx.beginPath();
    for(let x=0; x<=bgW+50; x+=50){ const wave = Math.sin(x/150 + speed2)*10; if(x===0) bgCtx.moveTo(x,bgWater + 30 + wave); else bgCtx.lineTo(x,bgWater + 30 + wave); }
    bgCtx.stroke();
    decorFishes.forEach(f => {
      bgCtx.save(); bgCtx.translate(f.x, f.y + Math.sin(bgTime*5 + f.bobOffset)*15); bgCtx.scale(f.scale*f.dir, f.scale);
      bgCtx.fillStyle = f.colorObj.body; bgCtx.beginPath(); bgCtx.ellipse(0,0,25,15,0,0,Math.PI*2); bgCtx.fill();
      bgCtx.fillStyle = f.colorObj.stripe; bgCtx.beginPath(); bgCtx.moveTo(-20,0); bgCtx.lineTo(-40,-15); bgCtx.lineTo(-35,0); bgCtx.lineTo(-40,15); bgCtx.fill();
      bgCtx.beginPath(); bgCtx.moveTo(0,-15); bgCtx.lineTo(-10,-25); bgCtx.lineTo(-15,-10); bgCtx.fill(); bgCtx.beginPath(); bgCtx.moveTo(0,15); bgCtx.lineTo(-10,25); bgCtx.lineTo(-15,10); bgCtx.fill();
      bgCtx.beginPath(); bgCtx.ellipse(-5,0,4,18,0,0,Math.PI*2); bgCtx.fill(); bgCtx.beginPath(); bgCtx.ellipse(-15,0,3,14,0,0,Math.PI*2); bgCtx.fill();
      bgCtx.fillStyle = '#ffffff'; bgCtx.beginPath(); bgCtx.arc(15,-5,8,0,Math.PI*2); bgCtx.fill(); bgCtx.fillStyle = '#000000'; bgCtx.beginPath(); bgCtx.arc(18,-5,4,0,Math.PI*2); bgCtx.fill(); bgCtx.fillStyle = '#ffffff'; bgCtx.beginPath(); bgCtx.arc(19,-6,1.5,0,Math.PI*2); bgCtx.fill();
      bgCtx.restore();
    });
  }

  function loopBackground(timestamp){
    if(!bgLast) bgLast = timestamp;
    let dt = timestamp - bgLast; bgLast = timestamp;
    if(dt > 100) dt = 16.66;
    const timeScale = dt / 16.666;
    updateBackground(timeScale);
    renderBackground();
    requestAnimationFrame(loopBackground);
  }

  window.addEventListener('resize', resizeBackground);
  resizeBackground();
  requestAnimationFrame(loopBackground);
})();
</script>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const numColors=['#ff6fae','#22a7f0','#ffd65a','#9a72ef','#ff9b42','#55c987','#f25b5b','#38b6aa','#7f8ff4','#e18b38'];
const state={mode:'explore',left:[],right:[],angle:0,score:0,qIndex:0,questions:[],question:null,selectedCompare:null,locked:false};
const frogSVG=()=>`<svg viewBox="0 0 80 70"><use href="#mini-frog"/></svg>`;

function makeItem(type,value,source=false){
  const el=document.createElement('div'); el.className='game-item '+(type==='frog'?'frog-token':'num-token')+(source?' source-item':'');
  el.dataset.type=type;el.dataset.value=value;el.dataset.source=source?'1':'0';el.dataset.uid=source?'src-'+type+'-'+value:'i'+Math.random().toString(36).slice(2);
  if(type==='frog') el.innerHTML=frogSVG(); else {el.textContent=value;el.style.background=numColors[(value-1)%numColors.length];}
  bindDrag(el);return el;
}
function buildTools(){const tools=$('tools');tools.innerHTML='';const fc=document.createElement('div');fc.className='source-card';const f=makeItem('frog',1,true);f.classList.add('frog-source');fc.append(f,Object.assign(document.createElement('span'),{textContent:'Frog = 1'}));tools.appendChild(fc);for(let n=1;n<=10;n++){const c=document.createElement('div');c.className='source-card';const item=makeItem('number',n,true);item.classList.add('num-source');c.appendChild(item);tools.appendChild(c)}}
function trayWeight(side){return state[side].reduce((s,o)=>s+o.value,0)}
function renderTrays(){['left','right'].forEach(side=>{const box=$(side+'Items');box.innerHTML='';const count=state[side].length;state[side].forEach(o=>{const el=makeItem(o.type,o.value,false);el.dataset.uid=o.uid;if(count>7){el.style.transform='scale(.82)';el.style.margin='-3px'}box.appendChild(el)});$(side+'Value').textContent=(side==='left'?'Left: ':'Right: ')+trayWeight(side)});updateBalance()}

function updateBalance(){
  const L=trayWeight('left'),R=trayWeight('right');
  const diff=L-R;
  const target=Math.max(-10,Math.min(10,-diff*2.2));
  state.angle=target;
  $('beam').style.transform=`translate(-50%,-50%) rotate(${target}deg)`;
  
  const stage=$('stage');
  const beam=$('beam');
  const stageRect=stage.getBoundingClientRect();
  const bw=beam.getBoundingClientRect().width;
  
  // TOÁN HỌC ĐỘNG: Tìm tọa độ vai ếch để neo lá sen luôn nằm ngang vai
  let frogScaleH = 0.6, frogMaxH = 320, frogBottom = 0.03;
  if (window.innerWidth <= 560) { frogScaleH = 0.5; frogMaxH = 240; frogBottom = 0.04; }
  else if (window.innerWidth <= 768) { frogScaleH = 0.55; frogMaxH = 280; frogBottom = 0.04; }
  const frogH = Math.min(stageRect.height * frogScaleH, frogMaxH);
  const frogTop = stageRect.height * (1 - frogBottom) - frogH;
  const shoulderY = frogTop + frogH * 0.52; // Xác định chuẩn xác điểm mọc cánh tay (Vai ếch)
  
  const tRect = $('leftTrayUnit').getBoundingClientRect();
  const trayHeight = tRect.height > 0 ? tRect.height : (window.innerWidth <= 560 ? 140 : window.innerWidth <= 768 ? 160 : 190);
  const pivotTop = shoulderY - trayHeight + (frogH * 0.06); // Trục cân tự động bám theo vai ếch
  
  const half=bw/2;
  const rad=target*Math.PI/180;
  const dy=Math.sin(rad)*half;
  const cx=stageRect.width/2;
  
  const lx=cx-Math.cos(rad)*half, rx=cx+Math.cos(rad)*half;
  const ly=pivotTop-dy, ry=pivotTop+dy;
  $('leftEnd').style.left=lx+'px'; $('rightEnd').style.left=rx+'px';
  $('leftEnd').style.top=ly+'px'; $('rightEnd').style.top=ry+'px';
  $('leftTrayUnit').style.left=lx+'px'; $('rightTrayUnit').style.left=rx+'px';
  $('leftTrayUnit').style.top=ly+'px'; $('rightTrayUnit').style.top=ry+'px';
  
  if(L===R&&L>0){$('balanceLabel').textContent='Balanced!';$('balanceLabel').style.color='#2f9830'}
  else if(L>R){$('balanceLabel').textContent='Left side is heavier';$('balanceLabel').style.color='#a85b22'}
  else if(R>L){$('balanceLabel').textContent='Right side is heavier';$('balanceLabel').style.color='#a85b22'}
  else{$('balanceLabel').textContent='Try the scale';$('balanceLabel').style.color=''} 
}

// Ver 6/7 fix: Draw frog arms continuously in a requestAnimationFrame loop 
// so they perfectly track the CSS transition of the trays without detaching
function drawFrogArmsContinuous() {
  const stage = $('stage');
  const frog = $('frogMain');
  const lHand = $('leftHand'); // Anchor perfectly to the hand under the left leaf
  const rHand = $('rightHand'); // Anchor perfectly to the hand under the right leaf
  
  if(!stage || !frog || !lHand || !rHand) return requestAnimationFrame(drawFrogArmsContinuous);
  const sRect = stage.getBoundingClientRect();
  const fRect = frog.getBoundingClientRect();
  if (fRect.width === 0) return requestAnimationFrame(drawFrogArmsContinuous); 

  // TOÁN HỌC CHỐNG BIẾN DẠNG ZOOM: Dùng BoxModel thay cho SVG Client Rect
  let frogScaleH = 0.6, frogMaxH = 320, frogBottom = 0.03;
  if (window.innerWidth <= 560) { frogScaleH = 0.5; frogMaxH = 240; frogBottom = 0.04; }
  else if (window.innerWidth <= 768) { frogScaleH = 0.55; frogMaxH = 280; frogBottom = 0.04; }
  const frogH = Math.min(sRect.height * frogScaleH, frogMaxH);
  const frogW = frogH * (320/360); 
  const frogTop = sRect.height * (1 - frogBottom) - frogH;
  const frogLeft = sRect.width * 0.5 - frogW * 0.5;

  const lRect = lHand.getBoundingClientRect();
  const rRect = rHand.getBoundingClientRect();

  // Shoulder coordinates (inside the frog body)
  const sxL = frogLeft + frogW * 0.35;
  const syL = frogTop + frogH * 0.52;
  const sxR = frogLeft + frogW * 0.65;
  const syR = frogTop + frogH * 0.52;

  // Hand coordinates (Connect precisely to the center of the hand element, regardless of transition)
  const pxL = lRect.left - sRect.left + lRect.width * 0.5;
  const pyL = lRect.top - sRect.top + lRect.height * 0.5;
  const pxR = rRect.left - sRect.left + rRect.width * 0.5;
  const pyR = rRect.top - sRect.top + rRect.height * 0.5;

  // Natural U-shaped outward curve (Cubic bezier) - Kéo cong theo tỷ lệ biến dãn của màn hình
  const distX_L = Math.abs(sxL - pxL);
  const distX_R = Math.abs(sxR - pxR);
  const ctrlX_L = Math.max(15, distX_L * 0.35);
  const ctrlX_R = Math.max(15, distX_R * 0.35);
  const dY = frogH * 0.16;
  
  const pathL = `M ${sxL} ${syL} C ${sxL - ctrlX_L} ${syL + dY}, ${pxL - ctrlX_L*0.4} ${pyL + dY}, ${pxL} ${pyL}`;
  const pathR = `M ${sxR} ${syR} C ${sxR + ctrlX_R} ${syR + dY}, ${pxR + ctrlX_R*0.4} ${pyR + dY}, ${pxR} ${pyR}`;

  $('frogArmL').setAttribute('d', pathL);
  $('frogArmL_border').setAttribute('d', pathL);
  $('frogArmR').setAttribute('d', pathR);
  $('frogArmR_border').setAttribute('d', pathR);
  
  // Continuously request next frame to keep arms glued during 0.55s CSS transition drops
  requestAnimationFrame(drawFrogArmsContinuous);
}
// Start continuous tracker
requestAnimationFrame(drawFrogArmsContinuous);

function dropTo(side,obj){state.left=state.left.filter(x=>x.uid!==obj.uid);state.right=state.right.filter(x=>x.uid!==obj.uid);state[side].push(obj);renderTrays();Sound.pop()}
function removeItem(uid){state.left=state.left.filter(x=>x.uid!==uid);state.right=state.right.filter(x=>x.uid!==uid);renderTrays()}
function bindDrag(el){el.addEventListener('pointerdown',e=>{if(state.locked&&!el.dataset.source)return;e.preventDefault();Sound.ensure();const isSource=el.dataset.source==='1';const obj={type:el.dataset.type,value:Number(el.dataset.value),uid:isSource?'i'+Math.random().toString(36).slice(2):el.dataset.uid};const ghost=makeItem(obj.type,obj.value,false);ghost.classList.add('drag-ghost');ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.appendChild(ghost);el.setPointerCapture?.(e.pointerId);highlight(e.clientX,e.clientY);const move=ev=>{ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';highlight(ev.clientX,ev.clientY)};const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);ghost.remove();$('leftPan').classList.remove('hot');$('rightPan').classList.remove('hot');const side=hitSide(ev.clientX,ev.clientY);if(side)dropTo(side,obj);else if(!isSource)removeItem(obj.uid)};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true})})}
function hitSide(x,y){for(const s of ['left','right']){const r=$(s+'Pan').getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return s}return null}
function highlight(x,y){['left','right'].forEach(s=>$(s+'Pan').classList.toggle('hot',hitSide(x,y)===s))}

const Sound={ctx:null,ensure(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A()}if(this.ctx?.state==='suspended')this.ctx.resume()},tone(f,d=.1,type='sine',g=.06,delay=0){this.ensure();if(!this.ctx)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),v=this.ctx.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.001,t);v.gain.exponentialRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(this.ctx.destination);o.start(t);o.stop(t+d+.02)},pop(){this.tone(520,.06,'triangle',.035)},good(){[523,659,784].forEach((f,i)=>this.tone(f,.18,'triangle',.06,i*.11))},bad(){this.tone(180,.13,'sine',.04);this.tone(145,.15,'sine',.03,.1)}};
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.88;u.pitch=1.08;u.lang='en-US';speechSynthesis.speak(u)}
function showFeedback(ok,text,eq=''){const f=$('feedback');f.className='feedback '+(ok?'good':'bad')+' show';f.innerHTML=text+(eq?`<span class="equation">${eq}</span>`:'');setTimeout(()=>f.classList.remove('show'),ok?1800:1200)}
function celebrate(eq=''){Sound.good();confettiBurst();$('frogMain').classList.add('happy');setTimeout(()=>$('frogMain').classList.remove('happy'),1300);showFeedback(true,'Great job!',eq)}
function confettiBurst(){const c=$('confetti'),ctx=c.getContext('2d');const dpr=Math.min(devicePixelRatio||1,2);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);let ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*12,vy:-Math.random()*10-4,g:.26,r:3+Math.random()*4,c:numColors[Math.floor(Math.random()*numColors.length)],life:90}));let frames=0;function step(){ctx.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.life--;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r*1.7)});ps=ps.filter(p=>p.life>0&&p.y<innerHeight+30);frames++;if(ps.length&&frames<110)requestAnimationFrame(step);else ctx.clearRect(0,0,innerWidth,innerHeight)}requestAnimationFrame(step)}

function setMode(mode){state.mode=mode;state.score=0;state.qIndex=0;state.locked=false;$('homeScreen').classList.add('hidden');$('gameScreen').classList.remove('hidden');$('scoreChip').textContent='Score: 0';$('choiceRow').classList.add('hidden');$('actionbar').classList.toggle('hidden',mode==='explore');if(mode==='explore'){state.question=null;$('questionChip').textContent='Free Play';$('instruction').textContent='Make the two sides balance!';clearScale();speak('Make the two sides balance!')}else{state.questions=generateQuestions();loadQuestion(0)}setTimeout(updateBalance,80)}
function clearScale(){state.left=[];state.right=[];state.selectedCompare=null;renderTrays()}
function addPreset(side,type,value){state[side].push({type,value,uid:'p'+Math.random().toString(36).slice(2)})}
function generateQuestions(){const qs=[];const values=[2,3,4,5,6,7,8,9];shuffle(values).slice(0,3).forEach(v=>qs.push({type:'match',n:v,text:'Make the scale balance.'}));const n=rand(4,8);qs.push({type:'make',n,text:`Use frogs to make ${n}.`});let whole=rand(6,10),part=rand(2,whole-2);qs.push({type:'bond',whole,part,missing:whole-part,text:'Add frogs to make the two sides equal.'});let a=rand(2,5),b=rand(1,Math.min(5,10-a));qs.push({type:'add',a,b,sum:a+b,text:'What number balances the frogs?'});whole=rand(7,10);part=rand(2,whole-2);qs.push({type:'missing',whole,part,missing:whole-part,text:'What is the missing number?'});for(let i=0;i<2;i++){let x=rand(2,10),y=rand(2,10);if(i===0&&x===y)y=x===10?9:x+1;qs.push({type:'compare',x,y,text:'Which number is greater?'});}qs.push({type:'abstract',a:rand(2,6),b:0});qs[qs.length-1].b=rand(1,Math.min(4,10-qs[qs.length-1].a));qs[qs.length-1].sum=qs[qs.length-1].a+qs[qs.length-1].b;qs[qs.length-1].text='Balance the equation.';return shuffle(qs).slice(0,10)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}

function loadQuestion(i){state.qIndex=i;state.question=state.questions[i];state.locked=false;clearScale();$('questionChip').textContent=`Question ${i+1}/10`;$('instruction').textContent=state.question.text;$('nextBtn').classList.add('hidden');$('checkBtn').classList.remove('hidden');$('choiceRow').innerHTML='';$('choiceRow').classList.add('hidden');const q=state.question;if(q.type==='match'){for(let k=0;k<q.n;k++)addPreset('left','frog',1)}else if(q.type==='make'){addPreset('left','number',q.n)}else if(q.type==='bond'){addPreset('left','number',q.whole);addPreset('right','number',q.part)}else if(q.type==='add'){for(let k=0;k<q.a+q.b;k++)addPreset('left','frog',1)}else if(q.type==='missing'){addPreset('left','number',q.whole);addPreset('right','number',q.part)}else if(q.type==='compare'){addPreset('left','number',q.x);addPreset('right','number',q.y);buildCompareChoices(q)}else if(q.type==='abstract'){addPreset('left','number',q.a);addPreset('left','number',q.b)}renderTrays();setTimeout(()=>speak(q.text),250)}
function buildCompareChoices(q){const row=$('choiceRow');row.classList.remove('hidden');const labels=[`${q.x} > ${q.y}`,`${q.x} = ${q.y}`,`${q.x} < ${q.y}`];labels.forEach((lab,idx)=>{const b=document.createElement('button');b.className='cmp';b.textContent=lab;b.onclick=()=>{row.querySelectorAll('.cmp').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.selectedCompare=idx};row.appendChild(b)})}
function evaluate(){const q=state.question,L=trayWeight('left'),R=trayWeight('right');if(!q)return false;if(q.type==='compare'){const correct=q.x>q.y?0:q.x===q.y?1:2;return state.selectedCompare===correct}return L===R&&L>0}
function successEquation(q){if(q.type==='match')return `${q.n} frogs = ${q.n}`;if(q.type==='make')return `${q.n} frogs = ${q.n}`;if(q.type==='bond')return `${q.part} + ${q.missing} = ${q.whole}`;if(q.type==='add')return `${q.a} + ${q.b} = ${q.sum}`;if(q.type==='missing')return `${q.part} + ${q.missing} = ${q.whole}`;if(q.type==='compare')return q.x>q.y?`${q.x} is greater than ${q.y}`:q.x<q.y?`${q.y} is greater than ${q.x}`:`${q.x} equals ${q.y}`;if(q.type==='abstract')return `${q.a} + ${q.b} = ${q.sum}`;return ''}
function checkAnswer(){if(state.mode!=='challenge'||state.locked)return;const ok=evaluate();if(ok){state.locked=true;state.score++;$('scoreChip').textContent=`Score: ${state.score}`;const eq=successEquation(state.question);celebrate(eq);speak('Great job! '+eq.replace('=','equals'));$('checkBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden')}else{Sound.bad();showFeedback(false,'Almost! Try again.');speak('Almost! Try again.') }}
function nextQuestion(){if(state.qIndex>=9){finishGame();return}loadQuestion(state.qIndex+1)}
function finishGame(){const stars=state.score===10?'★★★':state.score>=7?'★★':'★';$('finalScore').textContent=`Score: ${state.score} / 10`;$('finalStars').textContent=stars;$('endOverlay').classList.remove('hidden');confettiBurst();Sound.good()}
function goHome(){$('gameScreen').classList.add('hidden');$('homeScreen').classList.remove('hidden');$('endOverlay').classList.add('hidden');speechSynthesis.cancel()}
$('exploreBtn').onclick=()=>setMode('explore');$('challengeBtn').onclick=()=>setMode('challenge');$('homeBtn').onclick=goHome;$('resetBtn').onclick=()=>{clearScale();Sound.pop()};$('speakBtn').onclick=()=>speak($('instruction').textContent);$('checkBtn').onclick=checkAnswer;$('nextBtn').onclick=nextQuestion;$('againBtn').onclick=()=>{$('endOverlay').classList.add('hidden');setMode('challenge')};$('exploreEndBtn').onclick=()=>{$('endOverlay').classList.add('hidden');setMode('explore')};$('homeEndBtn').onclick=goHome;

window.addEventListener('resize',()=>setTimeout(updateBalance,60));
buildTools();

})();
</script>

:0 7px 0 #3f9700}.mainBtn:disabled{opacity:.55;cursor:default}.counter{font-weight:800;color:#ef4444;min-height:28px}.mini{position:absolute;inset:0;background:linear-gradient(180deg,#bfefffed,#eafff5f2);z-index:20;display:none;overflow:hidden}.mini h2{text-align:center;font-size:38px;color:#0878c9;margin:22px 0 0;text-shadow:0 2px #fff}.timer{position:absolute;top:20px;left:22px;background:#fff;padding:10px 17px;border-radius:18px;font-weight:900;font-size:22px;box-shadow:0 5px 15px #0002;z-index:3}.miniScore{position:absolute;top:20px;right:22px;background:#fff;padding:10px 17px;border-radius:18px;font-weight:900;font-size:20px;box-shadow:0 5px 15px #0002;z-index:3}.mini-fruit{position:absolute;top:-110px;width:76px;height:76px;border:0;border-radius:50%;display:grid;place-items:center;font-size:55px;cursor:pointer;background:radial-gradient(circle at 35% 25%,#ffffffee 0 13%,#ffffff66 14% 26%,#ffffff16 27% 100%);filter:drop-shadow(0 9px 8px #144d6b40);will-change:transform,top;animation:fallFruit linear forwards}.mini-fruit::after{content:'';position:absolute;inset:7px;border-radius:50%;border:2px solid #ffffffaa;pointer-events:none}.mini-fruit.popped{animation:none!important;pointer-events:none;transform:scale(1.45) rotate(12deg);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s ease}.juice{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:25;animation:juicePop .48s ease-out forwards}.miniDone{position:absolute;inset:0;display:none;place-items:center;background:#ffffff90;z-index:30;font-size:clamp(34px,7vw,70px);font-weight:900;color:#58a700;text-shadow:0 3px #fff}.endScore{font-size:34px;font-weight:900;margin:18px}.row{display:flex;gap:15px;justify-content:center}.hidden{display:none!important}#confettiCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}@keyframes xin{from{transform:scale(0) rotate(-30deg)}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes fly{to{transform:translate(180px,-100px) scale(.2) rotate(35deg);opacity:0}}@keyframes fallFruit{0%{transform:translateY(-10px) rotate(var(--r0));}50%{transform:translateY(50vh) translateX(var(--drift)) rotate(var(--r1));}100%{transform:translateY(112vh) rotate(var(--r2));}}@keyframes juicePop{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}@media(max-width:650px){.card{height:95vh}.top{padding:10px}.title{font-size:20px}.stage{padding:8px 12px}.visual{min-height:145px;gap:7px}.fruit{width:55px;height:55px;font-size:45px}.ans{width:75px;height:58px}.instruction{font-size:20px}.equation{font-size:36px}.mini-fruit{width:64px;height:64px;font-size:46px}}

<body>
 <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div class="shade"></div>
<canvas id="confettiCanvas"></canvas>
<main class="app">
<section class="card home" id="home"><div class="stage"><h1>Fruit Math Adventure</h1><p>Add, take away, and count!</p><p>Choose a game!</p><div class="modes"><button class="mode sel" data-mode="add">➕ Add</button><button class="mode" data-mode="sub">➖ Subtract</button><button class="mode" data-mode="mix">🔀 Mix</button></div><button class="mainBtn" id="start">START</button></div></section>
<section class="card hidden" id="game"><div class="top"><div class="title">Fruit Math Adventure</div><div class="progressWrap"><div class="progress" id="progress"></div></div><div class="qnum" id="qnum"></div></div><div class="stage"><div class="instruction"><span id="instruction"></span><button class="speak" id="speak" aria-label="Hear the question">🔊</button></div><div class="counter" id="counter"></div><div class="visual" id="visual"></div><div class="equation" id="equation"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">NEXT →</button></div></section>
<section class="card home hidden" id="end"><div class="stage"><h1>Fantastic!</h1><div class="endScore" id="score"></div><p>Great math work!</p><div class="row"><button class="mainBtn" id="again">PLAY AGAIN</button><button class="mode" id="homeBtn">HOME</button></div></div></section>
<div class="mini" id="mini"><div class="timer" id="timer">⏱ 8</div><div class="miniScore" id="miniScore">🍓 0</div><h2>Tap the falling fruit!</h2><div class="miniDone" id="miniDone">Great popping!</div></div>
</main>
<script>
const fruits=['🍎','🍊','🍓','🍉','🍇','🥝','🍍','🥭','🍋','🍐'];
let mode='add',qs=[],qi=0,score=0,current=null,locked=false,crossed=0,added=0,miniScore=0,pointAvailable=true;
const $=id=>document.getElementById(id);

document.querySelectorAll('.mode[data-mode]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.mode[data-mode]').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); mode=b.dataset.mode; tone(520,.05);
});

let audioCtx=null;
function tone(freq=600,d=.1,type='sine'){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
    const now=audioCtx.currentTime;g.gain.setValueAtTime(.12,now);g.gain.exponentialRampToValueAtTime(.001,now+d);
    o.start(now);o.stop(now+d);
  }catch(e){}
}

let voices=[];
function loadVoices(){voices=window.speechSynthesis?speechSynthesis.getVoices():[]}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(t){
  if(!('speechSynthesis' in window)||!t)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;u.pitch=1.12;u.volume=1;
  const preferred=voices.find(v=>/^en-US/i.test(v.lang)&&/Samantha|Jenny|Aria|Google US English|Female/i.test(v.name))||voices.find(v=>/^en/i.test(v.lang));
  if(preferred)u.voice=preferred;
  speechSynthesis.speak(u);
}

function makeQuestions(){
  const arr=[],keys=new Set();
  while(arr.length<10){
    const type=mode==='mix'?(Math.random()<.5?'add':'sub'):mode;
    let a,b,c,variant;
    if(type==='add'){
      c=3+Math.floor(Math.random()*8);a=1+Math.floor(Math.random()*(c-1));b=c-a;
      variant=Math.random()<.5?'groups':'addmore';
    }else{
      a=3+Math.floor(Math.random()*8);b=1+Math.floor(Math.random()*a);c=a-b;
      variant=Math.random()<.65?'cross':'take';
    }
    const k=`${type}:${variant}:${a}:${b}:${c}`;
    if(keys.has(k))continue;
    keys.add(k);
    arr.push({type,a,b,c,variant,fruit:variant==='addmore'?'🍎':fruits[Math.floor(Math.random()*fruits.length)]});
  }
  if(mode==='mix'){
    // Guarantee both operations appear in Mix mode.
    if(!arr.some(q=>q.type==='add')) arr[0]={type:'add',a:4,b:3,c:7,variant:'groups',fruit:'🍓'};
    if(!arr.some(q=>q.type==='sub')) arr[1]={type:'sub',a:8,b:3,c:5,variant:'cross',fruit:'🍊'};
  }
  return arr;
}

function start(){
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  qs=makeQuestions();qi=0;score=0;
  $('home').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');showQ();
}

function fruitEl(f,extra=''){
  const d=document.createElement('div');d.className='fruit'+(extra?' '+extra:'');d.textContent=f;return d;
}

function setInstruction(displayText,voiceText=displayText,auto=true){
  $('instruction').textContent=displayText;$('instruction').dataset.voice=voiceText;
  if(auto)setTimeout(()=>speak(voiceText),220);
}

function showQ(){
  speechSynthesis?.cancel?.();
  locked=false;crossed=0;added=0;pointAvailable=true;current=qs[qi];
  $('qnum').textContent=`${qi+1} / 10`;$('progress').style.width=`${qi*10}%`;
  $('feedback').textContent='';$('next').style.display='none';$('answers').innerHTML='';$('visual').innerHTML='';$('counter').textContent='';
  const q=current;
  if(q.type==='add'&&q.variant==='groups'){
    setInstruction('Count all the fruit.',`Count all the fruit. ${q.a} plus ${q.b} equals what?`);
    for(let i=0;i<q.a;i++)$('visual').append(fruitEl(q.fruit));
    const plus=document.createElement('b');plus.textContent='+';plus.style.fontSize='45px';$('visual').append(plus);
    for(let i=0;i<q.b;i++)$('visual').append(fruitEl(q.fruit));
    $('equation').textContent=`${q.a} + ${q.b} = ?`;answers(q.c);
  }else if(q.type==='add'){
    setInstruction(`Add green apples to make ${q.c}.`,`Add green apples to make ${q.c}. ${q.a} plus what equals ${q.c}?`);
    for(let i=0;i<q.a;i++)$('visual').append(fruitEl('🍎'));
    $('equation').textContent=`${q.a} + ? = ${q.c}`;$('counter').textContent=`Added: 0 / ${q.b}`;
    const add=document.createElement('button');add.className='mainBtn';add.textContent='＋ Add 🍏';
    add.onclick=()=>{
      if(added>=q.b||locked)return;added++;tone(720,.06,'triangle');
      $('visual').append(fruitEl('🍏','added-green'));$('counter').textContent=`Added: ${added} / ${q.b}`;
      if(added===q.b){
        add.disabled=true;
        setTimeout(()=>{setInstruction('How many green apples did you add?',`How many green apples did you add?`);answers(q.b)},300);
      }
    };
    $('answers').append(add);
  }else{
    const isCross=q.variant==='cross';
    const action=isCross?`Cross out ${q.b} fruits.`:`Take away ${q.b} fruits.`;
    setInstruction(action,`${action} ${q.a} minus ${q.b} equals what?`);
    for(let i=0;i<q.a;i++){
      const f=fruitEl(q.fruit);
      f.onclick=()=>{
        if(locked||f.dataset.used||crossed>=q.b)return;
        f.dataset.used='1';crossed++;tone(isCross?430:510,.07,'triangle');
        if(isCross)f.classList.add('crossed');
        else{f.classList.add('removing');setTimeout(()=>f.style.visibility='hidden',520)}
        $('counter').textContent=`${isCross?'Crossed out':'Taken away'}: ${crossed} / ${q.b}`;
        if(crossed===q.b){
          locked=true;
          setTimeout(()=>{locked=false;setInstruction('How many are left?');answers(q.c)},650);
        }
      };
      $('visual').append(f);
    }
    $('equation').textContent=`${q.a} − ${q.b} = ?`;
  }
}

$('speak').onclick=()=>speak($('instruction').dataset.voice||$('instruction').textContent);

function answers(correct){
  $('answers').innerHTML='';
  const s=new Set([correct]);
  while(s.size<4){const n=Math.max(0,Math.min(10,correct-3+Math.floor(Math.random()*7)));s.add(n)}
  [...s].sort(()=>Math.random()-.5).forEach(n=>{
    const b=document.createElement('button');b.className='ans';b.textContent=n;b.onclick=()=>check(b,n,correct);$('answers').append(b);
  });
}

function check(b,n,c){
  if(locked)return;
  if(n===c){
    locked=true;b.classList.add('correct');tone(880,.22,'triangle');
    if(pointAvailable)score++;
    $('feedback').textContent=['Great job!','Well done!','Awesome!','Nice work!','You got it!'][Math.floor(Math.random()*5)];
    $('equation').textContent=current.type==='add'?`${current.a} + ${current.b} = ${current.c}`:`${current.a} − ${current.b} = ${current.c}`;
    document.querySelectorAll('.ans').forEach(x=>x.disabled=true);
    confettiBurst(window.innerWidth*.5,window.innerHeight*.48,34);
    $('next').style.display='block';
  }else{
    pointAvailable=false;
    b.classList.add('wrong');tone(230,.12,'sine');$('feedback').textContent='Try again!';
    setTimeout(()=>b.classList.remove('wrong'),420);
  }
}

$('next').onclick=()=>{
  qi++;
  if(qi>=10){finish();return}
  if(qi%2===0)miniGame();else showQ();
};

const miniFruitSet=['🍓','🍊','🍍','🍉','🍇','🥝','🍋','🍎','🍐','🥭'];
function miniGame(){
  speechSynthesis?.cancel?.();
  const m=$('mini');m.style.display='block';$('miniDone').style.display='none';miniScore=0;$('miniScore').textContent='🍓 0';
  let left=8;$('timer').textContent='⏱ 8';speak('Tap the falling fruit!');
  const spawn=setInterval(()=>spawnMiniFruit(m),360);
  const timer=setInterval(()=>{
    left--;$('timer').textContent=`⏱ ${left}`;
    if(left<=0){
      clearInterval(timer);clearInterval(spawn);
      m.querySelectorAll('.mini-fruit').forEach(x=>x.remove());
      $('miniDone').style.display='grid';tone(760,.12,'triangle');setTimeout(()=>tone(980,.16,'triangle'),120);
      setTimeout(()=>{m.style.display='none';$('miniDone').style.display='none';showQ()},900);
    }
  },1000);
}
function spawnMiniFruit(m){
  const b=document.createElement('button');b.className='mini-fruit';b.textContent=miniFruitSet[Math.floor(Math.random()*miniFruitSet.length)];
  b.style.left=(3+Math.random()*89)+'%';b.style.setProperty('--drift',(Math.random()*90-45)+'px');
  b.style.setProperty('--r0',(Math.random()*40-20)+'deg');b.style.setProperty('--r1',(Math.random()*180-90)+'deg');b.style.setProperty('--r2',(Math.random()*380-190)+'deg');
  b.style.animationDuration=(3.1+Math.random()*1.9)+'s';
  b.onclick=e=>popMiniFruit(b,m,e);
  m.append(b);setTimeout(()=>b.remove(),5400);
}
function popMiniFruit(b,m,e){
  if(b.classList.contains('popped'))return;
  const r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  b.classList.add('popped');miniScore++;$('miniScore').textContent=`🍓 ${miniScore}`;tone(680+Math.random()*320,.07,'triangle');
  const colors=['#ff4b4b','#ffc800','#58cc02','#1cb0f6','#ce82ff','#ff8fab'];
  for(let i=0;i<10;i++){
    const p=document.createElement('span');p.className='juice';p.style.left=(cx-5)+'px';p.style.top=(cy-5)+'px';p.style.background=colors[i%colors.length];
    const a=Math.random()*Math.PI*2,d=28+Math.random()*55;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');m.append(p);setTimeout(()=>p.remove(),520);
  }
  setTimeout(()=>b.remove(),230);
}

// Realistic canvas confetti: gravity, drag, rotation and flutter.
const cc=$('confettiCanvas'),ctx=cc.getContext('2d');let confetti=[];
function resizeConfetti(){const dpr=Math.min(devicePixelRatio||1,2);cc.width=Math.floor(innerWidth*dpr);cc.height=Math.floor(innerHeight*dpr);cc.style.width=innerWidth+'px';cc.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resizeConfetti);resizeConfetti();
const confettiColors=['#ff4b4b','#ff9f1c','#ffd60a','#58cc02','#1cb0f6','#7c4dff','#ff5ca8','#ffffff'];
function confettiBurst(x,y,count=60,power=1){
  for(let i=0;i<count;i++){
    const a=(-Math.PI*.92)+(Math.random()*Math.PI*.84),speed=(5+Math.random()*9)*power;
    confetti.push({x,y,vx:Math.cos(a)*speed+(Math.random()*2-1),vy:Math.sin(a)*speed-2,w:5+Math.random()*7,h:9+Math.random()*12,g:.22+Math.random()*.12,drag:.992,rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.32,flip:Math.random()*Math.PI*2,ff:.12+Math.random()*.12,color:confettiColors[Math.floor(Math.random()*confettiColors.length)],life:0,max:180+Math.random()*80,shape:Math.random()<.18?'circle':'rect'});
  }
}
function confettiLoop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i];p.life++;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.flip+=p.ff;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.color;
    const sy=Math.max(.18,Math.abs(Math.cos(p.flip)));ctx.scale(1,sy);
    if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.w*.6,0,Math.PI*2);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
    if(p.y>innerHeight+40||p.life>p.max)confetti.splice(i,1);
  }
  requestAnimationFrame(confettiLoop);
}
requestAnimationFrame(confettiLoop);

function finish(){
  $('progress').style.width='100%';$('game').classList.add('hidden');$('end').classList.remove('hidden');$('score').textContent=`⭐ Score: ${score} / 10`;
  speak(`Fantastic! Your score is ${score} out of 10. Great math work!`);
  let shots=0;const show=setInterval(()=>{
    confettiBurst(innerWidth*(.12+Math.random()*.76),innerHeight*(.15+Math.random()*.18),85,1.15);shots++;if(shots>=10)clearInterval(show);
  },180);
}

$('start').onclick=start;$('again').onclick=start;$('homeBtn').onclick=()=>{speechSynthesis?.cancel?.();$('end').classList.add('hidden');$('home').classList.remove('hidden')};
</script>

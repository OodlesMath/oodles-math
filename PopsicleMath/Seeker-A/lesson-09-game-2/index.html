    }

    .soft-overlay {
      position:absolute;
      inset:0;
      background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));
      z-index:1;
      pointer-events:none;
    }

    @keyframes float {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-10px); }
    }
    @keyframes wiggle {
      0%,100% { transform:rotate(0deg) scale(1); }
      25% { transform:rotate(-13deg) scale(1.03); }
      75% { transform:rotate(13deg) scale(1.03); }
    }
    @keyframes popOut {
      0% { transform:scale(1); opacity:1; }
      50% { transform:scale(1.22); opacity:.9; }
      100% { transform:scale(0); opacity:0; }
    }
    @keyframes pulse {
      0%,100% { transform:scale(1); }
      50% { transform:scale(1.045); }
    }
    @keyframes cloudMove {
      from { transform:translateX(110vw); }
      to { transform:translateX(-30vw); }
    }
    @keyframes bounce {
      0%,100% { transform:translateY(0); }
      50% { transform:translateY(-14px); }
    }
    @keyframes modalIn {
      0% { transform:scale(.72); opacity:0; }
      70% { transform:scale(1.05); opacity:1; }
      100% { transform:scale(1); opacity:1; }
    }

    .cloud {
      position:absolute;
      background:rgba(255,255,255,.74);
      border-radius:50px;
      z-index:2;
      pointer-events:none;
      filter:blur(.15px);
    }
    .cloud::before,.cloud::after {
      content:'';
      position:absolute;
      background:inherit;
      border-radius:50%;
    }
    .cloud::before { width:48px; height:48px; top:-20px; left:16px; }
    .cloud::after { width:68px; height:68px; top:-30px; left:45px; }
    .cloud-1 { top:13%; width:118px; height:38px; animation:cloudMove 40s linear infinite; }
    .cloud-2 { top:31%; width:150px; height:45px; opacity:.42; animation:cloudMove 47s linear infinite -19s; }

    .screen {
      position:absolute;
      inset:0;
      z-index:10;
      display:none;
    }
    .screen.active { display:flex; }

    #start-screen {
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .start-card {
      width:min(520px,92vw);
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      padding:32px 34px 34px;
      background:rgba(255,255,255,.50);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      border:4px solid rgba(255,255,255,.96);
      border-radius:32px;
      box-shadow:0 20px 48px rgba(61,89,111,.20);
    }
    .start-card h1 {
      margin:0 0 8px;
      font-size:clamp(42px,6vw,64px);
      line-height:1.05;
      color:var(--pink);
      font-weight:900;
      text-shadow:0 3px 0 rgba(255,255,255,.85);
    }
    .start-card p {
      margin:0 0 20px;
      color:#374151;
      font-weight:800;
      font-size:clamp(19px,2.5vw,26px);
    }
    .hero-shape {
      width:138px;
      height:126px;
      margin:2px 0 18px;
      animation:bounce 2.2s ease-in-out infinite;
    }

    .big-btn {
      border:0;
      cursor:pointer;
      color:white;
      font-family:inherit;
      font-weight:900;
      font-size:clamp(25px,3vw,32px);
      letter-spacing:.5px;
      padding:15px 46px;
      border-radius:999px;
      background:var(--pink);
      box-shadow:0 8px 0 var(--pink-dark),0 12px 20px rgba(0,0,0,.12);
      animation:pulse 2s ease-in-out infinite;
      transition:transform .12s,box-shadow .12s;
    }
    .big-btn:active {
      transform:translateY(8px);
      box-shadow:0 0 0 var(--pink-dark),0 4px 8px rgba(0,0,0,.08);
    }

    #game-screen {
      position:relative;
      flex-direction:column;
      padding:24px 18px 84px;
    }

    .game-header {
      width:fit-content;
      max-width:min(92vw,780px);
      min-height:78px;
      margin:0 auto 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      padding:12px 28px;
      background:rgba(255,255,255,.68);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      border:3px solid rgba(255,255,255,.96);
      border-radius:999px;
      box-shadow:0 10px 24px rgba(39,76,97,.13);
    }
    .target-line {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-width:0;
      color:var(--ink);
      font-size:clamp(21px,3vw,31px);
      font-weight:900;
      white-space:nowrap;
      text-align:center;
    }
    .target-line .word { color:var(--pink); }
    .mini-rectangle {
      width:54px;
      height:34px;
      flex:0 0 auto;
      border:3px solid rgba(145,57,57,.24);
      background:linear-gradient(145deg,#ffb2b8 0%,#ff7f89 100%);
      border-radius:3px;
      box-shadow:inset 0 3px 0 rgba(255,255,255,.48),0 4px 0 rgba(189,74,82,.22);
    }
    .stars {
      position:absolute;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-width:188px;
      padding:10px 18px;
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      border:3px solid rgba(255,255,255,.96);
      border-radius:999px;
      box-shadow:0 8px 20px rgba(39,76,97,.14);
      z-index:20;
    }
    .star {
      width:35px;
      height:35px;
      color:#cbd5e1;
      opacity:.58;
      filter:drop-shadow(0 2px 1px rgba(0,0,0,.08));
      transition:.25s;
    }
    .star.on {
      color:#facc15;
      opacity:1;
      transform:scale(1.14) rotate(-4deg);
      filter:drop-shadow(0 3px 2px rgba(180,125,0,.22));
    }

    .play-area {
      flex:1;
      width:min(1100px,94vw);
      margin:0 auto;
      display:flex;
      flex-wrap:wrap;
      align-content:center;
      align-items:center;
      justify-content:center;
      gap:clamp(12px,2.2vw,30px);
      padding:26px 26px 34px;
      overflow:hidden;
      background:rgba(255,255,255,.34);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      border:3px solid rgba(255,255,255,.88);
      border-radius:34px;
      box-shadow:0 18px 36px rgba(39,76,97,.10);
    }

    .shape-wrap {
      width:clamp(104px,11vw,142px);
      height:clamp(104px,11vw,142px);
      cursor:pointer;
      touch-action:manipulation;
      animation:float 3s ease-in-out infinite;
      transition:filter .15s,transform .15s;
      filter:drop-shadow(0 10px 8px rgba(34,69,86,.18));
    }
    .shape-wrap:hover { filter:drop-shadow(0 12px 9px rgba(34,69,86,.24)) brightness(1.03); }
    .shape-wrap.wrong { animation:wiggle .4s ease-in-out; }
    .shape-wrap.found { animation:popOut .5s forwards; pointer-events:none; }
    .shape-svg { width:100%; height:100%; overflow:visible; }

    .face-eye { fill:#263238; }
    .face-mouth { fill:none; stroke:#263238; stroke-width:4.5; stroke-linecap:round; }
    .cheek { fill:#ff9fb3; opacity:.72; }
    .shape-edge { stroke:rgba(39,48,55,.22); stroke-width:3.5; stroke-linejoin:round; }
    .shape-highlight { fill:none; stroke:rgba(255,255,255,.43); stroke-width:4; stroke-linecap:round; }

    #won-screen {
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(15,23,42,.18);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      z-index:50;
    }
    .win-card {
      width:min(490px,92vw);
      background:white;
      border:8px solid #b5ead7;
      border-radius:40px;
      padding:34px 30px 32px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      box-shadow:0 26px 55px rgba(0,0,0,.22);
      animation:modalIn .46s ease-out both;
    }
    .win-card h2 {
      margin:0 0 12px;
      color:var(--green);
      font-weight:900;
      font-size:clamp(42px,6vw,62px);
    }
    .win-stars { display:flex; gap:10px; margin:2px 0 24px; }
    .win-stars span { font-size:62px; line-height:1; animation:bounce 1.2s ease-in-out infinite; }
    .win-stars span:nth-child(2) { font-size:78px; animation-delay:.1s; }
    .win-stars span:nth-child(3) { animation-delay:.2s; }
    .next-btn {
      border:0;
      cursor:pointer;
      color:white;
      font-family:inherit;
      font-size:clamp(22px,3vw,30px);
      font-weight:900;
      padding:14px 34px;
      border-radius:999px;
      background:var(--green);
      box-shadow:0 8px 0 var(--green-dark),0 12px 20px rgba(0,0,0,.12);
      animation:pulse 2s ease-in-out infinite;
    }
    .next-btn:active { transform:translateY(8px); box-shadow:none; }


    /* --- VER 4: START SETUP --- */
    .start-card {
      width:min(660px,94vw);
      padding:26px 30px 30px;
    }
    .start-card h1 { margin-bottom:4px; }
    .start-card p { margin-bottom:14px; }
    .hero-shape { width:110px; height:96px; margin:0 0 12px; }
    .setup-title {
      margin:2px 0 10px;
      color:#475569;
      font-size:16px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.06em;
    }
    .shape-setup {
      width:100%;
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:10px;
      margin:0 0 20px;
    }
    .setup-option {
      min-width:0;
      border:3px solid rgba(255,255,255,.98);
      border-radius:20px;
      padding:10px 6px 9px;
      background:rgba(255,255,255,.76);
      box-shadow:0 6px 0 rgba(148,163,184,.42),0 9px 16px rgba(51,65,85,.08);
      font-family:inherit;
      color:#475569;
      font-weight:900;
      cursor:pointer;
      transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;
    }
    .setup-option:hover { transform:translateY(-2px); }
    .setup-option:active { transform:translateY(5px); box-shadow:0 1px 0 rgba(148,163,184,.42); }
    .setup-option.selected {
      background:#e0f2fe;
      border-color:#38bdf8;
      color:#0284c7;
      box-shadow:0 6px 0 #0284c7,0 9px 18px rgba(2,132,199,.16);
      transform:translateY(-2px);
    }
    .setup-icon {
      width:54px;
      height:44px;
      margin:0 auto 4px;
      display:grid;
      place-items:center;
    }
    .setup-icon svg { width:100%; height:100%; }
    .setup-label { display:block; font-size:12px; line-height:1.1; white-space:nowrap; }
    .mix-icon {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:2px;
      width:42px;
      height:36px;
      margin:auto;
    }
    .mix-dot { width:17px; height:17px; align-self:center; justify-self:center; }
    .mix-circle { border-radius:50%; background:#ff7f89; }
    .mix-square { background:#55b8f3; border-radius:2px; }
    .mix-triangle { width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:17px solid #ffd43b; }
    .mix-rect { width:20px; height:12px; background:#79d369; border-radius:2px; }

    @media (max-width:700px) {
      .start-card { padding:20px 16px 22px; }
      .shape-setup { grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
      .setup-option:last-child { grid-column:2; }
      .setup-icon { width:46px; height:38px; }
      .setup-label { font-size:11px; }
    }

    /* --- VER 3: VOICE, 10 QUESTIONS, BALLOON MINI-GAME & FINAL SCORE --- */
    .mini-shape {
      width:56px;
      height:42px;
      flex:0 0 auto;
      display:grid;
      place-items:center;
      filter:drop-shadow(0 4px 3px rgba(62,82,96,.16));
    }
    .mini-shape svg { width:100%; height:100%; overflow:visible; }

    .speak-question-btn {
      width:48px;
      height:48px;
      flex:0 0 48px;
      border:3px solid rgba(255,255,255,.96);
      border-radius:50%;
      display:grid;
      place-items:center;
      padding:0;
      background:#38bdf8;
      color:#fff;
      font-size:24px;
      cursor:pointer;
      box-shadow:0 5px 0 #0284c7,0 8px 14px rgba(2,132,199,.18);
      transition:transform .1s,box-shadow .1s;
    }
    .speak-question-btn:active {
      transform:translateY(5px);
      box-shadow:0 0 0 #0284c7,0 3px 8px rgba(2,132,199,.12);
    }

    .stars { max-width:min(520px,94vw); }
    .star.missed {
      color:#94a3b8;
      opacity:1;
      transform:scale(.96);
    }

    #mini-game {
      position:fixed;
      inset:0;
      z-index:80;
      display:none;
      overflow:hidden;
      background:rgba(227,247,255,.14);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
      touch-action:manipulation;
    }
    #mini-game.active { display:block; }
    .mini-game-top {
      position:absolute;
      top:20px;
      left:50%;
      transform:translateX(-50%);
      z-index:4;
      width:min(630px,92vw);
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      background:rgba(255,255,255,.86);
      border:3px solid rgba(255,255,255,.98);
      border-radius:28px;
      box-shadow:0 14px 30px rgba(39,76,97,.16);
      text-align:left;
    }
    .mini-game-title {
      margin:0;
      color:#ec4899;
      font-size:clamp(24px,4vw,36px);
      line-height:1.05;
      font-weight:900;
      white-space:nowrap;
    }
    .mini-game-stats {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .mini-stat {
      padding:7px 13px;
      border-radius:999px;
      background:#f8fafc;
      border:2px solid #e2e8f0;
      color:#334155;
      font-size:18px;
      font-weight:900;
      white-space:nowrap;
    }
    #balloon-field {
      position:absolute;
      inset:0;
      overflow:hidden;
      cursor:crosshair;
    }
    .balloon {
      --balloon-color:#ff6b9d;
      position:absolute;
      left:50%;
      bottom:-130px;
      width:72px;
      height:88px;
      border:0;
      padding:0;
      border-radius:52% 52% 48% 48% / 46% 46% 58% 58%;
      background:radial-gradient(circle at 31% 25%,rgba(255,255,255,.86) 0 8%,transparent 9%),
                 linear-gradient(145deg,rgba(255,255,255,.38),transparent 33%),
                 var(--balloon-color);
      box-shadow:inset -8px -12px 0 rgba(0,0,0,.08),0 10px 18px rgba(40,70,90,.16);
      cursor:pointer;
      animation:balloonRise var(--rise,6s) linear forwards;
      transform-origin:center bottom;
      touch-action:manipulation;
    }
    .balloon::before {
      content:'';
      position:absolute;
      left:50%;
      bottom:-9px;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:8px solid transparent;
      border-right:8px solid transparent;
      border-top:13px solid var(--balloon-color);
    }
    .balloon::after {
      content:'';
      position:absolute;
      left:50%;
      top:96px;
      width:2px;
      height:74px;
      background:rgba(71,85,105,.5);
      transform:translateX(-50%);
      border-radius:50%;
    }
    .balloon.pop {
      animation:none !important;
      transform:scale(1.28);
      opacity:0;
      transition:transform .16s ease-out,opacity .16s ease-out;
      pointer-events:none;
    }
    .balloon-pop-ring {
      position:absolute;
      width:54px;
      height:54px;
      border:6px solid rgba(255,255,255,.95);
      border-radius:50%;
      transform:translate(-50%,-50%) scale(.45);
      opacity:0;
      pointer-events:none;
      animation:ringPop .42s ease-out forwards;
    }
    @keyframes ringPop {
      0% { opacity:1; transform:translate(-50%,-50%) scale(.35); }
      100% { opacity:0; transform:translate(-50%,-50%) scale(1.75); }
    }
    @keyframes balloonRise {
      from { transform:translateY(0) rotate(-3deg); }
      25% { transform:translateY(-30vh) translateX(16px) rotate(4deg); }
      50% { transform:translateY(-60vh) translateX(-10px) rotate(-3deg); }
      75% { transform:translateY(-90vh) translateX(13px) rotate(3deg); }
      to { transform:translateY(-125vh) translateX(-7px) rotate(-2deg); }
    }

    #confetti-canvas {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:999;
    }
    .score-summary {
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin:2px 0 24px;
    }
    .score-box {
      background:#f8fafc;
      border:3px solid #e2e8f0;
      border-radius:22px;
      padding:14px 10px;
      box-shadow:0 5px 0 #e2e8f0;
    }
    .score-box span {
      display:block;
      color:#64748b;
      font-size:13px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.04em;
    }
    .score-box b {
      display:block;
      margin-top:2px;
      color:#0ea5e9;
      font-size:clamp(30px,5vw,46px);
      line-height:1.05;
      font-weight:900;
    }
    .score-box:last-child b { color:#ec4899; }

    @media (max-width:700px) {
      #game-screen { padding:12px 8px 76px; }
      .game-header { max-width:96vw; padding:9px 12px; }
      .target-line { font-size:clamp(17px,5.5vw,25px); gap:6px; }
      .mini-shape { width:42px; height:32px; }
      .speak-question-btn { width:42px; height:42px; flex-basis:42px; font-size:20px; }
      .stars { gap:3px; padding:8px 10px; min-width:0; width:min(390px,94vw); }
      .star { width:clamp(21px,6vw,28px); height:clamp(21px,6vw,28px); }
      .mini-game-top { top:12px; padding:11px 13px; border-radius:22px; gap:8px; }
      .mini-game-title { font-size:clamp(20px,5vw,28px); }
      .mini-stat { font-size:15px; padding:5px 9px; }
      .balloon { width:62px; height:76px; }
      .balloon::after { top:84px; }
      .score-summary { gap:8px; }
    }

    @media (max-width:700px) {
      #game-screen { padding:12px 8px 76px; }
      .game-header { border-radius:26px; padding:10px 14px; min-height:68px; }
      .target-line { gap:7px; }
      .mini-rectangle { width:42px; height:28px; }
      .star { width:28px; height:28px; }
      .play-area { width:98vw; gap:10px; padding:14px 9px 22px; }
      .shape-wrap { width:clamp(88px,25vw,118px); height:clamp(88px,25vw,118px); }
      .cloud-2 { display:none; }
    }

    @media (max-height:650px) {
      .start-card { transform:scale(.88); }
      .game-header { min-height:60px; margin-bottom:8px; }
      .play-area { padding-bottom:16px; }
      .shape-wrap { width:clamp(88px,10vw,116px); height:clamp(88px,10vw,116px); }
      .win-card { transform:scale(.9); }
    }
  </style>
</head>
<body>

  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
  
<div id="app">
  <div class="background"></div>
  <div class="soft-overlay"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>

  <section id="start-screen" class="screen active" aria-label="Start screen">
    <div class="start-card">
      <h1>Shape Explorer!</h1>
      <p>Can you find the 2D shapes?</p>
      <div id="hero-shape" class="hero-shape" aria-hidden="true"></div>
      <div class="setup-title">Choose a shape</div>
      <div class="shape-setup" role="group" aria-label="Choose question type">
        <button class="setup-option" data-mode="circle" type="button"><span id="setup-circle" class="setup-icon" aria-hidden="true"></span><span class="setup-label">Circle</span></button>
        <button class="setup-option" data-mode="square" type="button"><span id="setup-square" class="setup-icon" aria-hidden="true"></span><span class="setup-label">Square</span></button>
        <button class="setup-option" data-mode="triangle" type="button"><span id="setup-triangle" class="setup-icon" aria-hidden="true"></span><span class="setup-label">Triangle</span></button>
        <button class="setup-option" data-mode="rectangle" type="button"><span id="setup-rectangle" class="setup-icon" aria-hidden="true"></span><span class="setup-label">Rectangle</span></button>
        <button class="setup-option selected" data-mode="mix" type="button" aria-pressed="true"><span class="setup-icon" aria-hidden="true"><span class="mix-icon"><i class="mix-dot mix-circle"></i><i class="mix-dot mix-square"></i><i class="mix-dot mix-triangle"></i><i class="mix-dot mix-rect"></i></span></span><span class="setup-label">Mix</span></button>
      </div>
      <button id="play-btn" class="big-btn" type="button">PLAY</button>
    </div>
  </section>

  <section id="game-screen" class="screen" aria-label="Game screen">
    <div class="game-header">
      <div class="target-line">
        <span>Find the</span>
        <span id="target-icon" class="mini-shape" aria-hidden="true"></span>
        <span id="target-word" class="word">rectangle!</span>
        <button id="speak-btn" class="speak-question-btn" type="button" aria-label="Hear the question">🔊</button>
      </div>
    </div>
    <div id="play-area" class="play-area"></div>
    <div id="stars" class="stars" aria-label="Question progress"></div>
  </section>

  <section id="won-screen" class="screen" aria-label="Game complete">
    <div class="win-card">
      <h2>Great job!</h2>
      <div class="win-stars" aria-hidden="true"><span>⭐</span><span>⭐</span><span>⭐</span></div>
      <div class="score-summary">
        <div class="score-box">
          <span>Math Score</span>
          <b id="final-score">0 / 10</b>
        </div>
        <div class="score-box">
          <span>Balloons Popped</span>
          <b id="final-balloons">0</b>
        </div>
      </div>
      <button id="play-again-btn" class="next-btn" type="button">Play Again!</button>
    </div>
  </section>

  <section id="mini-game" aria-label="Tap the balloons mini-game" aria-hidden="true">
    <div class="mini-game-top">
      <h2 class="mini-game-title">Tap the Balloons!</h2>
      <div class="mini-game-stats">
        <div class="mini-stat">⏱ <b id="mini-time">10</b>s</div>
        <div class="mini-stat">🎈 <b id="balloon-score">0</b></div>
      </div>
    </div>
    <div id="balloon-field"></div>
  </section>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>
</div>

<script>
(() => {
  'use strict';

  const COLORS = [
    ['#ff8f9a','#ff6673'],
    ['#ffb88e','#ff8d5c'],
    ['#ffd96b','#f3b91f'],
    ['#77d86b','#48b947'],
    ['#61d6d0','#2db8b2'],
    ['#69b9ff','#3d92e6'],
    ['#b38cff','#845ee0'],
    ['#f18bd0','#d45bac']
  ];
  const SHAPE_TYPES = ['circle','square','triangle','rectangle'];
  const TOTAL_QUESTIONS = 10;
  const SHAPES_PER_QUESTION = 8;
  const MINI_GAME_SECONDS = 10;

  let gameState = 'start';
  let questions = [];
  let currentQuestion = 0;
  let shapes = [];
  let targetType = 'rectangle';
  let selectedMode = 'mix';
  let results = Array(TOTAL_QUESTIONS).fill(null);
  let mathScore = 0;
  let hadWrongTry = false;
  let questionLocked = false;
  let audioCtx = null;
  let balloonTotal = 0;
  let balloonSession = 0;
  let balloonSpawnTimer = null;
  let balloonClockTimer = null;
  let balloonTimeLeft = MINI_GAME_SECONDS;

  const startScreen = document.getElementById('start-screen');
  const gameScreen = document.getElementById('game-screen');
  const wonScreen = document.getElementById('won-screen');
  const miniGame = document.getElementById('mini-game');
  const playArea = document.getElementById('play-area');
  const starsEl = document.getElementById('stars');
  const heroShape = document.getElementById('hero-shape');
  const targetIcon = document.getElementById('target-icon');
  const targetWord = document.getElementById('target-word');
  const speakBtn = document.getElementById('speak-btn');
  const balloonField = document.getElementById('balloon-field');
  const miniTimeEl = document.getElementById('mini-time');
  const balloonScoreEl = document.getElementById('balloon-score');
  const finalScoreEl = document.getElementById('final-score');
  const finalBalloonsEl = document.getElementById('final-balloons');
  const setupOptions = [...document.querySelectorAll('.setup-option')];

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type) {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'tada') {
      [523.25,659.25,783.99,1046.5].forEach((freq,i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0,now);
        g.gain.linearRampToValueAtTime(.18,now+.08+i*.08);
        g.gain.exponentialRampToValueAtTime(.01,now+1.25);
        o.start(now+i*.08); o.stop(now+1.5);
      });
      return;
    }

    if (type === 'pop') {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(520,now);
      o.frequency.exponentialRampToValueAtTime(190,now+.08);
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.14,now);
      g.gain.exponentialRampToValueAtTime(.01,now+.09);
      o.start(now); o.stop(now+.1);
      return;
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);

    if (type === 'yay') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800,now);
      osc.frequency.exponentialRampToValueAtTime(1200,now+.11);
      gain.gain.setValueAtTime(.28,now);
      gain.gain.exponentialRampToValueAtTime(.01,now+.28);
      osc.start(now); osc.stop(now+.3);
    } else {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(250,now);
      osc.frequency.exponentialRampToValueAtTime(150,now+.2);
      gain.gain.setValueAtTime(.24,now);
      gain.gain.exponentialRampToValueAtTime(.01,now+.2);
      osc.start(now); osc.stop(now+.22);
    }
  }

  function speakQuestion() {
    if (!('speechSynthesis' in window) || gameState !== 'playing') return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(`Find the ${targetType}.`);
    utterance.lang = 'en-US';
    utterance.rate = 0.88;
    utterance.pitch = 1.08;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
  }

  function faceSvg(yShift=0) {
    return `
      <g transform="translate(0 ${yShift})">
        <circle class="face-eye" cx="35" cy="45" r="5" />
        <circle class="face-eye" cx="65" cy="45" r="5" />
        <circle cx="33.5" cy="43.5" r="1.6" fill="#fff" />
        <circle cx="63.5" cy="43.5" r="1.6" fill="#fff" />
        <path class="face-mouth" d="M40 60 Q50 70 60 60" />
        <circle class="cheek" cx="24" cy="55" r="5.5" />
        <circle class="cheek" cx="76" cy="55" r="5.5" />
      </g>`;
  }

  function makeShapeSvg(type, palette) {
    const [c1,c2] = palette;
    const uid = Math.random().toString(36).slice(2,8);
    const defs = `<defs><linearGradient id="g${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>`;
    let body='';

    if (type === 'rectangle') {
      body = `
        <rect x="9" y="25" width="82" height="50" rx="2" fill="url(#g${uid})" class="shape-edge"/>
        <path d="M17 31 H82" class="shape-highlight"/>
        ${faceSvg(-4)}`;
    } else if (type === 'square') {
      body = `
        <rect x="16" y="16" width="68" height="68" rx="2" fill="url(#g${uid})" class="shape-edge"/>
        <path d="M24 23 H75" class="shape-highlight"/>
        ${faceSvg(0)}`;
    } else if (type === 'circle') {
      body = `
        <circle cx="50" cy="50" r="40" fill="url(#g${uid})" class="shape-edge"/>
        <path d="M27 27 Q50 14 72 28" class="shape-highlight"/>
        ${faceSvg(0)}`;
    } else {
      body = `
        <path d="M50 11 L92 86 L8 86 Z" fill="url(#g${uid})" class="shape-edge"/>
        <path d="M50 18 L83 78" class="shape-highlight"/>
        ${faceSvg(12)}`;
    }

    return `<svg class="shape-svg" viewBox="0 0 100 100" role="img" aria-label="${type}">${defs}${body}</svg>`;
  }

  function makeMiniShapeSvg(type) {
    const fill1='#ffb0b7', fill2='#ff7c88';
    const uid='mini'+Math.random().toString(36).slice(2,7);
    const defs=`<defs><linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${fill1}"/><stop offset="1" stop-color="${fill2}"/></linearGradient></defs>`;
    let body='';
    if(type==='rectangle') body=`<rect x="7" y="25" width="86" height="50" rx="2" fill="url(#${uid})" stroke="rgba(120,45,55,.28)" stroke-width="4"/><path d="M15 32 H82" stroke="rgba(255,255,255,.52)" stroke-width="4" stroke-linecap="round"/>`;
    if(type==='square') body=`<rect x="17" y="17" width="66" height="66" rx="2" fill="url(#${uid})" stroke="rgba(120,45,55,.28)" stroke-width="4"/><path d="M25 24 H74" stroke="rgba(255,255,255,.52)" stroke-width="4" stroke-linecap="round"/>`;
    if(type==='circle') body=`<circle cx="50" cy="50" r="39" fill="url(#${uid})" stroke="rgba(120,45,55,.28)" stroke-width="4"/><path d="M27 28 Q50 15 72 28" stroke="rgba(255,255,255,.52)" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    if(type==='triangle') body=`<path d="M50 10 L93 87 L7 87 Z" fill="url(#${uid})" stroke="rgba(120,45,55,.28)" stroke-width="4" stroke-linejoin="round"/><path d="M50 18 L82 76" stroke="rgba(255,255,255,.52)" stroke-width="4" fill="none" stroke-linecap="round"/>`;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">${defs}${body}</svg>`;
  }

  heroShape.innerHTML = makeShapeSvg('rectangle',['#78dcbf','#45ba99']);
  document.getElementById('setup-circle').innerHTML = makeMiniShapeSvg('circle');
  document.getElementById('setup-square').innerHTML = makeMiniShapeSvg('square');
  document.getElementById('setup-triangle').innerHTML = makeMiniShapeSvg('triangle');
  document.getElementById('setup-rectangle').innerHTML = makeMiniShapeSvg('rectangle');

  function selectSetupMode(mode) {
    selectedMode = mode;
    setupOptions.forEach(btn => {
      const active = btn.dataset.mode === mode;
      btn.classList.toggle('selected', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    if (mode !== 'mix') heroShape.innerHTML = makeShapeSvg(mode,['#78dcbf','#45ba99']);
    else heroShape.innerHTML = makeShapeSvg('rectangle',['#78dcbf','#45ba99']);
  }

  setupOptions.forEach(btn => btn.addEventListener('click', () => selectSetupMode(btn.dataset.mode)));

  function setScreen(name) {
    [startScreen,gameScreen,wonScreen].forEach(el => el.classList.remove('active'));
    if (name === 'start') startScreen.classList.add('active');
    if (name === 'playing') gameScreen.classList.add('active');
    if (name === 'won') wonScreen.classList.add('active');
    gameState = name;
  }

  function shuffle(arr) {
    for (let i=arr.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function createQuestionBank() {
    let targetPool;
    if (selectedMode === 'mix') {
      targetPool = shuffle(['circle','square','triangle','rectangle','circle','square','triangle','rectangle','circle','square']);
    } else {
      targetPool = Array(TOTAL_QUESTIONS).fill(selectedMode);
    }
    const bank=[];
    const signatures=new Set();

    for (let q=0; q<TOTAL_QUESTIONS; q++) {
      const target=targetPool[q];
      const distractors=SHAPE_TYPES.filter(t=>t!==target);
      let made=false;

      while(!made) {
        const targetIndex=Math.floor(Math.random()*SHAPES_PER_QUESTION);
        const shapeSet=[];
        const typeSignature=[];
        const colorSignature=[];

        for(let i=0;i<SHAPES_PER_QUESTION;i++) {
          const type = i===targetIndex ? target : distractors[Math.floor(Math.random()*distractors.length)];
          const colorIndex=Math.floor(Math.random()*COLORS.length);
          shapeSet.push({
            id:`q${q}-s${i}-${Math.random().toString(36).slice(2,6)}`,
            type,
            palette:COLORS[colorIndex],
            found:false
          });
          typeSignature.push(type[0]);
          colorSignature.push(colorIndex);
        }

        const signature=`${target}|${targetIndex}|${typeSignature.join('')}|${colorSignature.join('')}`;
        if(!signatures.has(signature)) {
          signatures.add(signature);
          bank.push({target,shapes:shapeSet,signature});
          made=true;
        }
      }
    }
    return bank;
  }

  function renderProgress() {
    starsEl.innerHTML='';
    for (let i=0;i<TOTAL_QUESTIONS;i++) {
      const star=document.createElement('div');
      let cls='star';
      if(results[i]===1) cls+=' on';
      if(results[i]===0) cls+=' missed';
      star.className=cls;
      star.innerHTML=`<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`;
      starsEl.appendChild(star);
    }
  }

  function renderQuestion(autoSpeak=true) {
    const q=questions[currentQuestion];
    targetType=q.target;
    shapes=q.shapes.map(s=>({...s,found:false}));
    hadWrongTry=false;
    questionLocked=false;

    targetWord.textContent=`${targetType}!`;
    targetIcon.innerHTML=makeMiniShapeSvg(targetType);
    playArea.innerHTML='';
    renderProgress();

    shapes.forEach((shape,index) => {
      const el=document.createElement('button');
      el.type='button';
      el.className='shape-wrap';
      el.setAttribute('aria-label',shape.type);
      el.style.border='0';
      el.style.background='transparent';
      el.style.padding='0';
      el.style.animationDelay=`${-(index*.37)%3}s`;
      el.innerHTML=makeShapeSvg(shape.type,shape.palette);
      el.addEventListener('click',()=>handleShapeClick(shape,el));
      playArea.appendChild(el);
    });

    if(autoSpeak) setTimeout(speakQuestion,260);
  }

  function handleShapeClick(shape,el) {
    if (questionLocked || gameState!=='playing') return;

    if (shape.type===targetType) {
      questionLocked=true;
      playSound('yay');
      shape.found=true;
      el.classList.add('found');
      results[currentQuestion]=hadWrongTry ? 0 : 1;
      if(!hadWrongTry) mathScore++;
      renderProgress();

      setTimeout(()=>{
        const completed=currentQuestion+1;
        if(completed>=TOTAL_QUESTIONS) {
          finishGame();
        } else if(completed%3===0) {
          startMiniGame();
        } else {
          currentQuestion++;
          renderQuestion(true);
        }
      },560);
    } else {
      hadWrongTry=true;
      playSound('boink');
      el.classList.remove('wrong');
      void el.offsetWidth;
      el.classList.add('wrong');
      setTimeout(()=>el.classList.remove('wrong'),410);
    }
  }

  function startMiniGame() {
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    gameState='mini';
    miniGame.classList.add('active');
    miniGame.setAttribute('aria-hidden','false');
    balloonField.innerHTML='';
    balloonSession=0;
    balloonTimeLeft=MINI_GAME_SECONDS;
    miniTimeEl.textContent=balloonTimeLeft;
    balloonScoreEl.textContent=balloonSession;

    for(let i=0;i<5;i++) setTimeout(spawnBalloon,i*130);
    balloonSpawnTimer=setInterval(spawnBalloon,470);
    balloonClockTimer=setInterval(()=>{
      balloonTimeLeft--;
      miniTimeEl.textContent=Math.max(0,balloonTimeLeft);
      if(balloonTimeLeft<=0) endMiniGame();
    },1000);
  }

  function spawnBalloon() {
    if(gameState!=='mini') return;
    const colors=['#ff5f8f','#ff9f43','#ffd43b','#58cc02','#22c1dc','#6c8cff','#a66cff','#f06ed2'];
    const b=document.createElement('button');
    b.type='button';
    b.className='balloon';
    b.setAttribute('aria-label','Tap balloon');
    b.style.left=`${4+Math.random()*88}%`;
    b.style.setProperty('--balloon-color',colors[Math.floor(Math.random()*colors.length)]);
    b.style.setProperty('--rise',`${5.2+Math.random()*2.5}s`);
    b.style.transform=`scale(${0.78+Math.random()*.38})`;

    const pop=(ev)=>{
      ev.preventDefault();
      if(b.classList.contains('pop')) return;
      playSound('pop');
      balloonSession++;
      balloonTotal++;
      balloonScoreEl.textContent=balloonSession;
      const rect=b.getBoundingClientRect();
      const ring=document.createElement('div');
      ring.className='balloon-pop-ring';
      ring.style.left=`${rect.left+rect.width/2}px`;
      ring.style.top=`${rect.top+rect.height/2}px`;
      balloonField.appendChild(ring);
      b.classList.add('pop');
      setTimeout(()=>b.remove(),180);
      setTimeout(()=>ring.remove(),450);
    };
    b.addEventListener('pointerdown',pop,{passive:false});
    b.addEventListener('animationend',()=>b.remove(),{once:true});
    balloonField.appendChild(b);
  }

  function endMiniGame() {
    if(gameState!=='mini') return;
    clearInterval(balloonSpawnTimer);
    clearInterval(balloonClockTimer);
    balloonSpawnTimer=null;
    balloonClockTimer=null;
    miniGame.classList.remove('active');
    miniGame.setAttribute('aria-hidden','true');
    balloonField.innerHTML='';
    currentQuestion++;
    gameState='playing';
    renderQuestion(true);
  }

  function finishGame() {
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    finalScoreEl.textContent=`${mathScore} / ${TOTAL_QUESTIONS}`;
    finalBalloonsEl.textContent=balloonTotal;
    setScreen('won');
    playSound('tada');
    launchConfetti();
  }

  function startNewGame() {
    ensureAudio();
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    questions=createQuestionBank();
    currentQuestion=0;
    results=Array(TOTAL_QUESTIONS).fill(null);
    mathScore=0;
    balloonTotal=0;
    hadWrongTry=false;
    questionLocked=false;
    setScreen('playing');
    renderQuestion(true);
  }

  speakBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    speakQuestion();
  });
  document.getElementById('play-btn').addEventListener('click',startNewGame);
  document.getElementById('play-again-btn').addEventListener('click',startNewGame);

  /* --- Confetti --- */
  const confettiCanvas=document.getElementById('confetti-canvas');
  const cctx=confettiCanvas.getContext('2d');
  let confettiParticles=[];
  let confettiFrame=null;

  function resizeConfetti() {
    const dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2));
    confettiCanvas.width=Math.floor(innerWidth*dpr);
    confettiCanvas.height=Math.floor(innerHeight*dpr);
    confettiCanvas.style.width=innerWidth+'px';
    confettiCanvas.style.height=innerHeight+'px';
    cctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize',resizeConfetti);
  resizeConfetti();

  function launchConfetti() {
    confettiParticles=[];
    const colors=['#ff4b4b','#ff9f43','#ffc800','#58cc02','#1cb0f6','#8b5cf6','#ec4899'];
    for(let i=0;i<190;i++) {
      confettiParticles.push({
        x:innerWidth*.5+(Math.random()-.5)*180,
        y:innerHeight*.36+(Math.random()-.5)*80,
        vx:(Math.random()-.5)*13,
        vy:-4-Math.random()*11,
        g:.18+Math.random()*.09,
        w:5+Math.random()*7,
        h:8+Math.random()*10,
        r:Math.random()*Math.PI,
        vr:(Math.random()-.5)*.28,
        color:colors[Math.floor(Math.random()*colors.length)],
        life:140+Math.random()*60
      });
    }
    if(confettiFrame) cancelAnimationFrame(confettiFrame);
    animateConfetti();
  }

  function animateConfetti() {
    cctx.clearRect(0,0,innerWidth,innerHeight);
    confettiParticles.forEach(p=>{
      p.vy+=p.g;
      p.x+=p.vx;
      p.y+=p.vy;
      p.r+=p.vr;
      p.life--;
      cctx.save();
      cctx.translate(p.x,p.y);
      cctx.rotate(p.r);
      cctx.fillStyle=p.color;
      cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cctx.restore();
    });
    confettiParticles=confettiParticles.filter(p=>p.life>0 && p.y<innerHeight+40);
    if(confettiParticles.length) confettiFrame=requestAnimationFrame(animateConfetti);
    else {
      cctx.clearRect(0,0,innerWidth,innerHeight);
      confettiFrame=null;
    }
  }
})();
</script>

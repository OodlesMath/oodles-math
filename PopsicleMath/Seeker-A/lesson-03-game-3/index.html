    .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));pointer-events:none}
    .screen{position:absolute;inset:0;display:none;padding:16px;z-index:2}
    .screen.active{display:flex}

    /* Start & finish screens */
    .center-screen{align-items:center;justify-content:center}
    .start-card,.finish-card{
      width:min(455px,92vw);
      background:rgba(255,255,255,.94);
      border:5px solid rgba(255,255,255,.98);
      border-radius:34px;
      box-shadow:var(--shadow),0 8px 0 rgba(30,109,145,.13);
      padding:30px 28px 28px;
      text-align:center;
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
      animation:cardIn .45s cubic-bezier(.2,.9,.3,1.25);
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}

    .hero-icon{
      width:132px;height:132px;margin:0 auto 18px;
      border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(145deg,#fff9b9,#ffe36f);
      border:5px solid #fff;
      box-shadow:0 12px 0 #edbd2b,0 18px 30px rgba(130,99,0,.18);
      position:relative;
      animation:floaty 2.5s ease-in-out infinite;
    }
    .hero-icon .emoji{font-size:76px;line-height:1;filter:drop-shadow(0 5px 3px rgba(0,0,0,.12))}
    .sparkle{position:absolute;font-size:24px;animation:twinkle 1.6s ease-in-out infinite alternate}
    .sparkle.s1{top:4px;right:2px}.sparkle.s2{left:-5px;bottom:18px;animation-delay:.35s}
    @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
    @keyframes twinkle{from{transform:scale(.75) rotate(-8deg);opacity:.5}to{transform:scale(1.15) rotate(8deg);opacity:1}}

    h1{font-size:clamp(34px,7vw,47px);line-height:1.08;margin:8px 0 8px;font-weight:900;color:#268bd3;letter-spacing:-1.3px}
    .subtitle{font-size:clamp(16px,3.7vw,20px);font-weight:700;color:#64748b;margin:0 0 24px}

    .big-btn{
      width:100%;min-height:72px;border-radius:22px;color:#fff;
      display:flex;align-items:center;justify-content:center;gap:13px;
      font-size:clamp(22px,5vw,29px);font-weight:900;
      background:linear-gradient(180deg,#68da4b,#4fc333);
      box-shadow:0 8px 0 #349824,0 13px 22px rgba(47,150,34,.18);
      transition:.12s ease;
    }
    .big-btn:hover{filter:brightness(1.035);transform:translateY(-2px)}
    .big-btn:active{transform:translateY(7px);box-shadow:0 1px 0 #349824}
    .big-btn.purple{background:linear-gradient(180deg,#ac7df8,#8e60e8);box-shadow:0 8px 0 #7047be,0 13px 22px rgba(104,61,178,.18)}
    .btn-icon{width:34px;height:34px;display:block;fill:currentColor}

    /* Game */
    #gameScreen{flex-direction:column;gap:10px}
    .topbar{width:min(980px,100%);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .progress-pill{
      background:rgba(255,255,255,.92);border:3px solid rgba(255,255,255,.98);
      border-radius:999px;padding:8px 16px;font-size:clamp(13px,2.8vw,17px);font-weight:800;
      color:#516078;box-shadow:0 5px 14px rgba(46,95,124,.13);backdrop-filter:blur(5px)
    }
    .sound-btn{
      width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(180deg,#fff,#f8fcff);color:#168bd3;
      border:4px solid rgba(255,255,255,.98);box-shadow:0 6px 0 #b8dceb,0 10px 20px rgba(28,100,137,.15);
      transition:.12s ease;
    }
    .sound-btn:hover{transform:translateY(-2px) scale(1.03)}
    .sound-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b8dceb}
    .sound-btn svg{width:31px;height:31px;fill:currentColor}

    .game-main{flex:1;min-height:0;width:min(900px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .question-title{
      margin:2px 0 12px;padding:10px 22px;border-radius:18px;
      background:rgba(255,255,255,.89);border:3px solid rgba(255,255,255,.98);
      box-shadow:0 7px 18px rgba(37,91,119,.12);
      font-size:clamp(22px,4vw,31px);font-weight:900;color:#334155;text-align:center;
      backdrop-filter:blur(5px);
    }
    .object-card{
      width:min(690px,96vw);height:min(43vh,360px);min-height:245px;
      background:rgba(255,255,255,.94);border:5px solid rgba(255,255,255,.98);
      border-radius:32px;box-shadow:var(--shadow);padding:24px;
      display:flex;align-items:center;justify-content:center;overflow:hidden;
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    }
    .object-grid{display:grid;gap:16px;place-items:center;justify-content:center;align-content:center;width:100%;height:100%}
    .object-grid.c1{grid-template-columns:1fr}.object-grid.c2{grid-template-columns:repeat(2,minmax(100px,1fr))}.object-grid.c3,.object-grid.c4,.object-grid.c5{grid-template-columns:repeat(3,minmax(88px,1fr))}
    .object-tile{
      width:clamp(88px,12vw,120px);height:clamp(88px,12vw,120px);
      border-radius:28px;display:grid;place-items:center;position:relative;
      background:linear-gradient(145deg,#ffffff,#f2faff);
      border:4px solid #fff;
      box-shadow:0 8px 0 #dcebf3,0 12px 22px rgba(33,97,128,.12);
      cursor:pointer;transition:.18s cubic-bezier(.2,.8,.2,1);
      animation:popIn .4s cubic-bezier(.2,.9,.3,1.3) both;
    }
    .object-tile::after{content:'✦';position:absolute;top:8px;right:10px;color:#ffd34f;font-size:16px;opacity:.9}
    .object-tile:hover{transform:translateY(-5px) rotate(-1deg) scale(1.04)}
    .object-tile:active{transform:translateY(3px) scale(.96);box-shadow:0 3px 0 #dcebf3}
    .object-tile .obj{font-size:clamp(54px,8.4vw,78px);line-height:1;filter:drop-shadow(0 5px 3px rgba(0,0,0,.14))}
    @keyframes popIn{from{opacity:0;transform:scale(.65) translateY(15px)}to{opacity:1;transform:scale(1)}}
    .correct-bounce{animation:happyBounce .65s ease-in-out infinite alternate}
    @keyframes happyBounce{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-12px) rotate(2deg)}}

    .answers{
      width:min(760px,100%);margin:10px auto 0;
      display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(7px,1.8vw,14px);
      padding-bottom:max(6px,env(safe-area-inset-bottom));
    }
    .answer{
      position:relative;aspect-ratio:1/1;min-height:66px;border-radius:22px;color:#fff;
      font-size:clamp(31px,6vw,49px);font-weight:900;
      border:4px solid rgba(255,255,255,.95);
      text-shadow:0 3px 0 rgba(0,0,0,.09);
      transition:.14s cubic-bezier(.2,.8,.2,1);
      overflow:hidden;
    }
    .answer::before{content:'';position:absolute;left:10%;right:10%;top:8%;height:30%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
    .answer:nth-child(1){background:linear-gradient(180deg,#8f76f7,#755be6);box-shadow:0 8px 0 #5842b9,0 12px 20px rgba(79,60,162,.18)}
    .answer:nth-child(2){background:linear-gradient(180deg,#45c7f3,#1da8df);box-shadow:0 8px 0 #147eaf,0 12px 20px rgba(20,126,175,.18)}
    .answer:nth-child(3){background:linear-gradient(180deg,#ff79b8,#ed5aa1);box-shadow:0 8px 0 #bd3a7d,0 12px 20px rgba(189,58,125,.18)}
    .answer:nth-child(4){background:linear-gradient(180deg,#ffad51,#f28b2e);box-shadow:0 8px 0 #c5671d,0 12px 20px rgba(197,103,29,.18)}
    .answer:nth-child(5){background:linear-gradient(180deg,#33c8d8,#1ba6bb);box-shadow:0 8px 0 #117b8a,0 12px 20px rgba(17,123,138,.18)}
    .answer:hover{transform:translateY(-5px) scale(1.03);filter:brightness(1.04)}
    .answer:active{transform:translateY(7px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.2)}
    .answer.correct{background:linear-gradient(180deg,#ffd95a,#f5b52f)!important;box-shadow:0 8px 0 #c48912,0 0 0 6px rgba(255,255,255,.85)!important;transform:translateY(-4px) scale(1.08);color:#fff3cf}
    .answer.wrong{animation:shake .35s ease-in-out}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

    .feedback{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
      z-index:50;border-radius:24px;padding:15px 26px;border:4px solid #fff;
      color:#fff;font-size:clamp(24px,5vw,34px);font-weight:900;
      box-shadow:0 16px 35px rgba(0,0,0,.22);opacity:0;pointer-events:none;
      transition:.2s ease;
    }
    .feedback.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .feedback.good{background:linear-gradient(180deg,#54d75b,#32b942)}
    .feedback.try{background:linear-gradient(180deg,#ffa64f,#f47d32)}

    /* Finish */
    .trophy-wrap{width:126px;height:126px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#fff9bf,#ffe266);border:5px solid #fff;box-shadow:0 9px 0 #e2b52d,0 15px 26px rgba(131,94,0,.18);animation:floaty 2.4s ease-in-out infinite}
    .trophy-wrap svg{width:78px;height:78px;fill:#f7bd28;filter:drop-shadow(0 5px 2px rgba(0,0,0,.12))}
    .finish-card h1{color:#8860dc}.finish-card .subtitle{font-size:20px;margin-bottom:17px}
    .stars{display:flex;justify-content:center;gap:7px;margin:8px 0 24px}
    .stars svg{width:40px;height:40px;fill:#ffd23d;filter:drop-shadow(0 3px 1px rgba(0,0,0,.13));animation:starBounce .7s ease-in-out infinite alternate}
    .stars svg:nth-child(2){animation-delay:.1s}.stars svg:nth-child(3){animation-delay:.2s}.stars svg:nth-child(4){animation-delay:.3s}.stars svg:nth-child(5){animation-delay:.4s}
    @keyframes starBounce{from{transform:translateY(0) rotate(-5deg)}to{transform:translateY(-8px) rotate(5deg)}}

    @media (max-height:720px){
      .screen{padding:10px}.topbar{margin-bottom:0}.object-card{height:min(40vh,300px);min-height:220px;padding:18px}.question-title{margin-bottom:8px}.answers{margin-top:6px}.sound-btn{width:50px;height:50px}.sound-btn svg{width:27px;height:27px}
    }
    @media (max-width:620px){
      .screen{padding:10px}.object-card{width:98vw;border-radius:25px}.object-grid{gap:10px}.object-grid.c3,.object-grid.c4,.object-grid.c5{grid-template-columns:repeat(3,1fr)}
      .object-tile{width:clamp(72px,22vw,98px);height:clamp(72px,22vw,98px);border-radius:22px}.object-tile .obj{font-size:clamp(48px,15vw,67px)}
      .answers{gap:7px}.answer{border-radius:17px;border-width:3px}.answer:nth-child(n){box-shadow:0 6px 0 rgba(32,58,95,.28),0 8px 14px rgba(0,0,0,.11)}
    }
  
    .score-line{margin:-4px 0 16px;font-size:clamp(18px,3.4vw,24px);font-weight:900;color:#4b5e79}

    .mini-game-overlay{
      position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
      background:linear-gradient(rgba(47,92,126,.18),rgba(38,78,108,.28));
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
      padding:18px;
    }
    .mini-game-overlay.active{display:flex}
    .mini-game-card{
      width:min(980px,100%);height:min(84vh,720px);position:relative;overflow:hidden;
      border-radius:34px;border:5px solid rgba(255,255,255,.98);
      background:linear-gradient(rgba(255,255,255,.10),rgba(255,255,255,.10));
      box-shadow:0 18px 38px rgba(27,64,89,.24);
    }
    .mini-game-head{
      position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:3;
    }
    .mini-pill{
      background:rgba(255,255,255,.93);border:4px solid rgba(255,255,255,.98);border-radius:999px;
      padding:10px 16px;box-shadow:0 7px 16px rgba(37,91,119,.12);font-size:clamp(13px,2.7vw,18px);font-weight:900;color:#4f5f79;
    }
    .mini-center-note{
      position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:3;
      background:rgba(255,255,255,.95);border:4px solid rgba(255,255,255,.98);border-radius:20px;
      padding:12px 18px;box-shadow:0 7px 16px rgba(37,91,119,.12);text-align:center;max-width:min(88%,640px);
    }
    .mini-title{font-size:clamp(24px,4.5vw,34px);font-weight:900;color:#6f52d8;line-height:1.05;margin:0}
    .mini-subtitle{font-size:clamp(13px,2.6vw,17px);font-weight:700;color:#55657e;margin-top:3px}
    .mini-field{position:absolute;inset:0;overflow:hidden}
    .mini-msg{
      position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;
      background:rgba(255,255,255,.92);border:4px solid rgba(255,255,255,.98);border-radius:20px;padding:10px 18px;
      font-size:clamp(15px,2.8vw,18px);font-weight:800;color:#516078;box-shadow:0 7px 16px rgba(37,91,119,.12);text-align:center;
    }
    .butterfly-btn{
      position:absolute;width:68px;height:52px;padding:0;border:none;background:transparent;appearance:none;
      transform-origin:center center;filter:drop-shadow(0 6px 6px rgba(0,0,0,.16));
    }
    .butterfly-btn:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 7px rgba(45,140,255,.8)}
    .butterfly-btn svg{width:100%;height:100%;overflow:visible}
    .butterfly-btn .wing-left,.butterfly-btn .wing-right{animation:wingFlap .42s ease-in-out infinite alternate;transform-box:fill-box}
    .butterfly-btn .wing-left{transform-origin:100% 50%}
    .butterfly-btn .wing-right{transform-origin:0% 50%}
    .butterfly-btn.caught{animation:popGone .28s ease forwards}
    @keyframes wingFlap{from{transform:scaleX(.45) rotate(-10deg)}to{transform:scaleX(1) rotate(10deg)}}
    @keyframes popGone{to{opacity:0;transform:scale(1.55)}}
    @media (max-width:620px){
      .mini-game-card{height:min(88vh,700px);border-radius:26px}
      .mini-game-head{top:12px;left:10px;right:10px}
      .mini-center-note{top:74px;padding:10px 12px;border-radius:17px}
      .butterfly-btn{width:56px;height:44px}
      .mini-msg{left:12px;right:12px;transform:none;bottom:12px}
    }

  </style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
  <main class="app" id="app">
    <div class="veil"></div>

    <section class="screen center-screen active" id="startScreen" aria-label="Start screen">
      <div class="start-card">
        <div class="hero-icon" aria-hidden="true">
          <span class="sparkle s1">✨</span><span class="sparkle s2">⭐</span>
          <span class="emoji">🦁</span>
        </div>
        <h1>Counting Fun!</h1>
        <p class="subtitle">Learn to count from 1 to 5</p>
        <button class="big-btn" id="startBtn" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.3 0-1.7l-10-6.8C8.9 3.9 8 4.4 8 5.2Z"/></svg>
          Let's Play!
        </button>
      </div>
    </section>

    <section class="screen" id="gameScreen" aria-label="Counting game">
      <div class="topbar">
        <div class="progress-pill" id="progressText">Question 1 / 10</div>
        <button class="sound-btn" id="soundBtn" type="button" aria-label="Repeat question">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.3-3.9v7.8a4.5 4.5 0 0 0 2.3-3.9Zm-2.3-8.2v2.1a6.8 6.8 0 0 1 0 12.2v2.1A8.9 8.9 0 0 0 23 12a8.9 8.9 0 0 0-8.8-8.2Z"/></svg>
        </button>
      </div>

      <div class="game-main">
        <h2 class="question-title" id="questionTitle">Count the lion!</h2>
        <div class="object-card">
          <div class="object-grid c1" id="objectGrid"></div>
        </div>
      </div>

      <div class="answers" id="answers" aria-label="Answer choices"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    </section>

    <section class="screen center-screen" id="finishScreen" aria-label="Finish screen">
      <div class="finish-card">
        <div class="trophy-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3h10v2h3a1 1 0 0 1 1 1v2c0 3.1-2.4 5.6-5.5 5.9A5.4 5.4 0 0 1 13 16.7V19h4v2H7v-2h4v-2.3A5.4 5.4 0 0 1 8.5 14C5.4 13.6 3 11.1 3 8V6a1 1 0 0 1 1-1h3V3Zm0 4H5v1a4 4 0 0 0 2.3 3.6A8 8 0 0 1 7 9.5V7Zm10 0v2.5c0 .7-.1 1.4-.3 2.1A4 4 0 0 0 19 8V7h-2Z"/></svg>
        </div>
        <h1>You Won!</h1>
        <p class="subtitle">You are a Counting Super Star!</p>
        <p class="score-line" id="scoreLine">Score: 0 / 10</p>
        <div class="stars" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9L12 2.8Z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9L12 2.8Z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9L12 2.8Z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9L12 2.8Z"/></svg>
          <svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9L12 2.8Z"/></svg>
        </div>
        <button class="big-btn purple" id="restartBtn" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.5 9.6l1.9-.8A5 5 0 1 0 9 7.4V10H3V4l2.5 2.5A7 7 0 0 1 12 5Z"/></svg>
          Play Again
        </button>
      </div>
    </section>
  </main>

  
  <script>
    (() => {
      'use strict';

      const TOTAL_QUESTIONS = 10;
      const MINI_GAME_AFTER = 5;
      const QUESTION_POOL = [
        { count: 1, emoji: '🦁', singular: 'lion', plural: 'lions' },
        { count: 2, emoji: '🐱', singular: 'cat', plural: 'cats' },
        { count: 3, emoji: '🎈', singular: 'balloon', plural: 'balloons' },
        { count: 4, emoji: '🍌', singular: 'banana', plural: 'bananas' },
        { count: 5, emoji: '🚗', singular: 'car', plural: 'cars' },
        { count: 1, emoji: '🦋', singular: 'butterfly', plural: 'butterflies' },
        { count: 2, emoji: '🐸', singular: 'frog', plural: 'frogs' },
        { count: 3, emoji: '🍎', singular: 'apple', plural: 'apples' },
        { count: 4, emoji: '⭐', singular: 'star', plural: 'stars' },
        { count: 5, emoji: '🍪', singular: 'cookie', plural: 'cookies' },
        { count: 1, emoji: '🌈', singular: 'rainbow', plural: 'rainbows' },
        { count: 2, emoji: '🪁', singular: 'kite', plural: 'kites' },
        { count: 3, emoji: '🐠', singular: 'fish', plural: 'fish' },
        { count: 4, emoji: '🌼', singular: 'flower', plural: 'flowers' },
        { count: 5, emoji: '🦆', singular: 'duck', plural: 'ducks' },
        { count: 1, emoji: '☀️', singular: 'sun', plural: 'suns' },
        { count: 2, emoji: '📚', singular: 'book', plural: 'books' },
        { count: 3, emoji: '🐝', singular: 'bee', plural: 'bees' },
        { count: 4, emoji: '🧁', singular: 'cupcake', plural: 'cupcakes' },
        { count: 5, emoji: '⚽', singular: 'ball', plural: 'balls' }
      ];

      const startScreen = document.getElementById('startScreen');
      const gameScreen = document.getElementById('gameScreen');
      const finishScreen = document.getElementById('finishScreen');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const soundBtn = document.getElementById('soundBtn');
      const progressText = document.getElementById('progressText');
      const questionTitle = document.getElementById('questionTitle');
      const objectGrid = document.getElementById('objectGrid');
      const answers = document.getElementById('answers');
      const feedback = document.getElementById('feedback');
      const scoreLine = document.getElementById('scoreLine');
      const app = document.getElementById('app');

      let roundQuestions = [];
      let currentQIndex = 0;
      let feedbackState = null;
      let nextTimer = null;
      let feedbackTimer = null;
      let audioCtx = null;
      let score = 0;
      let canScoreCurrent = true;
      let hasMiniGamePlayed = false;

      let miniOverlay = null;
      let miniField = null;
      let miniTimerText = null;
      let miniCaughtText = null;
      let miniHintText = null;
      let miniFinalMsg = null;
      let miniRunning = false;
      let miniRemaining = 15;
      let miniCaught = 0;
      let miniInterval = null;
      let miniRaf = null;
      let miniLast = 0;
      let miniIdCounter = 0;
      let butterflies = [];

      function showScreen(target){
        [startScreen, gameScreen, finishScreen].forEach(s => s.classList.remove('active'));
        target.classList.add('active');
      }

      function ensureAudio(){
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
      }

      function playSound(type){
        ensureAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + .10);
          osc.frequency.setValueAtTime(783.99, now + .20);
          gain.gain.setValueAtTime(.24, now);
          gain.gain.exponentialRampToValueAtTime(.01, now + .62);
          osc.start(now); osc.stop(now + .62);
        } else if (type === 'wrong') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(.22, now);
          gain.gain.exponentialRampToValueAtTime(.01, now + .36);
          osc.start(now); osc.stop(now + .36);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(820, now);
          gain.gain.setValueAtTime(.09, now);
          gain.gain.exponentialRampToValueAtTime(.01, now + .10);
          osc.start(now); osc.stop(now + .10);
        }
      }

      function speak(text){
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        u.voice = voices.find(v => v.lang === 'en-US' && /Samantha|Ava|Jenny|Aria|Female/i.test(v.name))
          || voices.find(v => v.lang === 'en-US') || null;
        u.lang = 'en-US'; u.pitch = 1.16; u.rate = .88; u.volume = 1;
        window.speechSynthesis.speak(u);
      }

      function shuffle(arr){
        const out = arr.slice();
        for(let i = out.length - 1; i > 0; i--){
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      function labelFor(q){
        return q.count === 1 ? q.singular : q.plural;
      }

      function buildRoundQuestions(){
        roundQuestions = shuffle(QUESTION_POOL).slice(0, TOTAL_QUESTIONS);
      }

      function updateScoreLine(){
        scoreLine.textContent = `Score: ${score} / ${TOTAL_QUESTIONS}`;
      }

      function showFeedback(kind,text){
        feedback.textContent=text;
        feedback.className=`feedback show ${kind}`;
      }

      function clearFeedback(){
        feedback.className = 'feedback';
        feedback.textContent = '';
      }

      function renderQuestion(){
        clearTimeout(nextTimer); clearTimeout(feedbackTimer);
        feedbackState = null;
        canScoreCurrent = true;
        clearFeedback();

        const q = roundQuestions[currentQIndex];
        progressText.textContent = `Question ${currentQIndex + 1} / ${TOTAL_QUESTIONS}`;
        questionTitle.textContent = `Count the ${labelFor(q)}!`;

        objectGrid.className = `object-grid c${q.count}`;
        objectGrid.innerHTML = '';
        for(let i=0;i<q.count;i++){
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'object-tile';
          tile.style.animationDelay = `${i * .08}s`;
          tile.setAttribute('aria-label', `${q.singular} ${i+1}`);
          tile.innerHTML = `<span class="obj">${q.emoji}</span>`;
          tile.addEventListener('click',()=>playSound('pop'));
          objectGrid.appendChild(tile);
        }

        answers.innerHTML='';
        [1,2,3,4,5].forEach(number=>{
          const b=document.createElement('button');
          b.type='button'; b.className='answer'; b.textContent=number;
          b.setAttribute('aria-label',`Answer ${number}`);
          b.addEventListener('click',()=>handleAnswer(number,b));
          answers.appendChild(b);
        });

        setTimeout(()=>{
          if(gameScreen.classList.contains('active') && feedbackState===null){
            speak(`Let's count. How many ${labelFor(q)}?`);
          }
        },450);
      }

      function finishGame(){
        showScreen(finishScreen);
        updateScoreLine();
        speak(`Hooray! You finished the game! Your score is ${score} out of ${TOTAL_QUESTIONS}.`);
        playSound('correct');
      }

      function goNextStep(){
        if(currentQIndex === MINI_GAME_AFTER && !hasMiniGamePlayed){
          startMiniGame();
          return;
        }
        if(currentQIndex < TOTAL_QUESTIONS){
          renderQuestion();
        }else{
          finishGame();
        }
      }

      function handleAnswer(number,button){
        if(feedbackState === 'correct' || feedbackState === 'locked') return;
        const q = roundQuestions[currentQIndex];
        if(number === q.count){
          feedbackState = 'correct';
          if(canScoreCurrent) score++;
          updateScoreLine();
          playSound('correct');
          button.classList.add('correct');
          objectGrid.querySelectorAll('.object-tile').forEach(el=>el.classList.add('correct-bounce'));
          showFeedback('good','🎉 Correct!');
          const praise=['Great job!','You did it!','Awesome!','Correct!'];
          const line=praise[Math.floor(Math.random()*praise.length)];
          speak(`${line} There ${q.count === 1 ? 'is' : 'are'} ${q.count} ${labelFor(q)}.`);
          currentQIndex++;
          nextTimer = setTimeout(goNextStep, 2200);
        }else{
          canScoreCurrent = false;
          feedbackState = 'wrong';
          playSound('wrong');
          button.classList.add('wrong');
          showFeedback('try','🤔 Try Again!');
          speak('Not quite. Try again!');
          feedbackTimer = setTimeout(()=>{
            feedbackState = null;
            clearFeedback();
            button.classList.remove('wrong');
          }, 900);
        }
      }

      function createMiniGameMarkup(){
        miniOverlay = document.createElement('div');
        miniOverlay.className = 'mini-game-overlay';
        miniOverlay.id = 'miniGameOverlay';
        miniOverlay.innerHTML = `
          <div class="mini-game-card" role="dialog" aria-modal="true" aria-label="Catch the butterflies mini game">
            <div class="mini-game-head">
              <div class="mini-pill" id="miniTimer">⏰ Time: 15s</div>
              <div class="mini-pill" id="miniCaught">🦋 Caught: 0</div>
            </div>
            <div class="mini-center-note">
              <div class="mini-title">Catch the Butterflies!</div>
              <div class="mini-subtitle" id="miniHint">Tap the colourful butterflies in 15 seconds.</div>
            </div>
            <div class="mini-field" id="miniField"></div>
            <div class="mini-msg" id="miniFinalMsg">Tap the butterflies to catch them!</div>
          </div>`;
        app.appendChild(miniOverlay);
        miniField = document.getElementById('miniField');
        miniTimerText = document.getElementById('miniTimer');
        miniCaughtText = document.getElementById('miniCaught');
        miniHintText = document.getElementById('miniHint');
        miniFinalMsg = document.getElementById('miniFinalMsg');
      }

      function butterflySVG(primary, secondary){
        return `
          <svg viewBox="0 0 76 54" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g class="wing-left">
              <path d="M34 27C19 30 7 24 4 13C1 4 9 1 18 4C26 7 32 16 34 27Z" fill="${primary}"/>
              <path d="M33 28C19 28 10 36 12 45C14 52 24 53 31 49C36 46 38 39 33 28Z" fill="${secondary}"/>
              <ellipse cx="18" cy="13" rx="6" ry="3.4" fill="rgba(255,255,255,.38)"/>
              <circle cx="22" cy="20" r="2.6" fill="rgba(255,255,255,.45)"/>
            </g>
            <g class="wing-right">
              <path d="M42 27C57 30 69 24 72 13C75 4 67 1 58 4C50 7 44 16 42 27Z" fill="${primary}"/>
              <path d="M43 28C57 28 66 36 64 45C62 52 52 53 45 49C40 46 38 39 43 28Z" fill="${secondary}"/>
              <ellipse cx="58" cy="13" rx="6" ry="3.4" fill="rgba(255,255,255,.38)"/>
              <circle cx="54" cy="20" r="2.6" fill="rgba(255,255,255,.45)"/>
            </g>
            <g>
              <ellipse cx="38" cy="28" rx="4.4" ry="15" fill="#334155"/>
              <circle cx="38" cy="12" r="4.8" fill="#1f2937"/>
              <path d="M36 9C31 4 26 4 22 5" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M40 9C45 4 50 4 54 5" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
            </g>
          </svg>`;
      }

      const BUTTERFLY_COLORS = [
        ['#ff72ae', '#ffb6d3'],
        ['#ffd54f', '#ffef9a'],
        ['#8b7bff', '#c0b5ff'],
        ['#33c8d8', '#95f0ff'],
        ['#ff9f45', '#ffd09a'],
        ['#6a8cff', '#b6c7ff']
      ];

      function makeButterfly(){
        const rect = miniField.getBoundingClientRect();
        const width = rect.width || miniField.clientWidth || 800;
        const height = rect.height || miniField.clientHeight || 500;
        const size = 0.82 + Math.random() * 0.42;
        const speed = 28 + Math.random() * 26;
        const angle = Math.random() * Math.PI * 2;
        const colorPair = BUTTERFLY_COLORS[Math.floor(Math.random() * BUTTERFLY_COLORS.length)];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'butterfly-btn';
        btn.setAttribute('aria-label', 'Catch butterfly');
        btn.innerHTML = butterflySVG(colorPair[0], colorPair[1]);
        miniField.appendChild(btn);
        const butterfly = {
          id: ++miniIdCounter,
          el: btn,
          x: Math.random() * Math.max(60, width - 90),
          y: 120 + Math.random() * Math.max(60, height - 210),
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * (speed * 0.55),
          bob: Math.random() * Math.PI * 2,
          bobSpeed: 1.2 + Math.random() * 1.1,
          scale: size,
          rot: -8 + Math.random() * 16,
          caught: false,
          w: 68 * size,
          h: 52 * size
        };
        btn.addEventListener('click', () => catchButterfly(butterfly));
        butterflies.push(butterfly);
        return butterfly;
      }

      function catchButterfly(butterfly){
        if(!miniRunning || butterfly.caught) return;
        butterfly.caught = true;
        miniCaught++;
        playSound('pop');
        miniCaughtText.textContent = `🦋 Caught: ${miniCaught}`;
        butterfly.el.classList.add('caught');
        setTimeout(() => {
          butterfly.el.remove();
          butterflies = butterflies.filter(b => b !== butterfly);
          if(miniRunning){
            makeButterfly();
          }
        }, 220);
      }

      function renderButterflies(dt){
        const rect = miniField.getBoundingClientRect();
        const width = rect.width || miniField.clientWidth || 800;
        const height = rect.height || miniField.clientHeight || 500;
        butterflies.forEach(b => {
          if(b.caught) return;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.bob += dt * b.bobSpeed;
          if(b.x < 6){ b.x = 6; b.vx *= -1; }
          if(b.x > width - b.w - 6){ b.x = width - b.w - 6; b.vx *= -1; }
          if(b.y < 112){ b.y = 112; b.vy *= -1; }
          if(b.y > height - b.h - 28){ b.y = height - b.h - 28; b.vy *= -1; }
          const bobY = Math.sin(b.bob) * 8;
          const tilt = b.rot + Math.sin(b.bob * 1.7) * 6;
          b.el.style.transform = `translate(${b.x}px, ${b.y + bobY}px) scale(${b.scale}) rotate(${tilt}deg)`;
        });
      }

      function miniLoop(ts){
        if(!miniRunning) return;
        if(!miniLast) miniLast = ts;
        let dt = (ts - miniLast) / 1000;
        if(dt > 0.045) dt = 0.045;
        miniLast = ts;
        renderButterflies(dt);
        miniRaf = requestAnimationFrame(miniLoop);
      }

      function stopMiniTimers(){
        clearInterval(miniInterval);
        miniInterval = null;
        cancelAnimationFrame(miniRaf);
        miniRaf = null;
      }

      function endMiniGame(){
        miniRunning = false;
        stopMiniTimers();
        miniHintText.textContent = 'Great catching!';
        miniFinalMsg.textContent = `Time's up! You caught ${miniCaught} ${miniCaught === 1 ? 'butterfly' : 'butterflies'}!`;
        speak(`Time is up! You caught ${miniCaught} ${miniCaught === 1 ? 'butterfly' : 'butterflies'}.`);
        setTimeout(() => {
          butterflies.forEach(b => b.el.remove());
          butterflies = [];
          miniOverlay.classList.remove('active');
          miniLast = 0;
          if(currentQIndex < TOTAL_QUESTIONS){
            renderQuestion();
          } else {
            finishGame();
          }
        }, 1800);
      }

      function startMiniGame(){
        if(!miniOverlay) createMiniGameMarkup();
        hasMiniGamePlayed = true;
        feedbackState = 'locked';
        clearFeedback();
        miniRemaining = 15;
        miniCaught = 0;
        miniLast = 0;
        butterflies.forEach(b => b.el.remove());
        butterflies = [];
        miniTimerText.textContent = '⏰ Time: 15s';
        miniCaughtText.textContent = '🦋 Caught: 0';
        miniHintText.textContent = 'Tap the colourful butterflies in 15 seconds.';
        miniFinalMsg.textContent = 'Tap the butterflies to catch them!';
        miniOverlay.classList.add('active');
        miniRunning = true;

        for(let i = 0; i < 10; i++) makeButterfly();
        speak('Mini game time! Catch the butterflies!');
        miniInterval = setInterval(() => {
          miniRemaining--;
          miniTimerText.textContent = `⏰ Time: ${miniRemaining}s`;
          if(miniRemaining <= 0) endMiniGame();
        }, 1000);
        miniRaf = requestAnimationFrame(miniLoop);
      }

      function startGame(){
        ensureAudio();
        playSound('correct');
        buildRoundQuestions();
        currentQIndex = 0;
        feedbackState = null;
        score = 0;
        hasMiniGamePlayed = false;
        updateScoreLine();
        showScreen(gameScreen);
        renderQuestion();
        speak("Hi! Let's play a counting game. Are you ready?");
      }

      startBtn.addEventListener('click',startGame);
      restartBtn.addEventListener('click',startGame);
      soundBtn.addEventListener('click',()=>{
        playSound('pop');
        const q = roundQuestions[currentQIndex];
        if(q) speak(`How many ${labelFor(q)} can you see?`);
      });

      document.addEventListener('visibilitychange',()=>{
        if(document.hidden && 'speechSynthesis' in window) window.speechSynthesis.cancel();
      });
      if('speechSynthesis' in window){
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
      }
      updateScoreLine();
    })();
  </script>

</body>
</html>

#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));pointer-events:none}
.top-ui{position:absolute;left:50%;top:1.3%;transform:translateX(-50%);width:72%;text-align:center;z-index:10}
.title{
  display:inline-block;margin:0;padding:.4% 2.1%;font-size:clamp(24px,3.15vw,54px);
  line-height:1;color:var(--navy);font-weight:900;letter-spacing:-1.5px;
  text-shadow:0 3px 0 rgba(255,255,255,.9),0 5px 10px rgba(12,49,74,.12)
}
.subrow{margin-top:.35%;display:flex;justify-content:center;align-items:center;gap:.7vw}
.instruction{
  padding:.38vw 1.15vw;border-radius:999px;background:rgba(255,255,255,.9);
  border:2px solid rgba(9,80,129,.12);color:#254b6c;font-size:clamp(12px,1.02vw,18px);font-weight:700;
  box-shadow:0 4px 10px rgba(19,65,95,.08)
}
.icon-btn{
  width:clamp(34px,2.8vw,48px);height:clamp(34px,2.8vw,48px);border-radius:50%;
  background:#fff;color:var(--navy);display:grid;place-items:center;font-size:clamp(18px,1.35vw,24px);
  box-shadow:0 5px 0 rgba(12,67,103,.15);border:2px solid rgba(0,0,0,.05)
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(12,67,103,.15)}
.progress-wrap{margin:.5% auto 0;width:34%;min-width:220px;display:flex;align-items:center;gap:.7vw}
.progress-label{font-size:clamp(11px,.85vw,15px);font-weight:900;color:var(--navy);white-space:nowrap}
.progress{height:clamp(8px,.7vw,12px);flex:1;border-radius:999px;background:rgba(255,255,255,.82);overflow:hidden;border:2px solid rgba(4,71,113,.12)}
.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#31cc67,#77df52);transition:width .35s ease;border-radius:inherit}

.dice-area{position:absolute;left:50%;top:14.7%;transform:translateX(-50%);z-index:11;display:flex;align-items:center;gap:1vw}
.dice{
  width:clamp(66px,5.2vw,92px);aspect-ratio:1;border-radius:22%;background:#fff;border:4px solid #163550;
  box-shadow:0 .5vw 0 rgba(16,53,80,.18);position:relative;transition:transform .15s ease
}
.dice.rolling{animation:diceRoll .14s linear infinite}
@keyframes diceRoll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(10deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
.pip{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;background:#102f4b;transform:translate(-50%,-50%);display:none}
.p1{left:25%;top:25%}.p2{left:75%;top:25%}.p3{left:25%;top:50%}.p4{left:50%;top:50%}.p5{left:75%;top:50%}.p6{left:25%;top:75%}.p7{left:75%;top:75%}
.roll-btn,.check-btn,.next-btn,.reset-btn,.final-btn{
  padding:.75vw 1.55vw;border-radius:18px;background:linear-gradient(#22b9ee,#0d9fd8);
  color:white;font-size:clamp(14px,1.12vw,20px);font-weight:900;letter-spacing:.6px;
  box-shadow:0 .4vw 0 #0879ad;border:3px solid rgba(255,255,255,.85)
}
.roll-btn:active,.check-btn:active,.next-btn:active,.reset-btn:active,.final-btn:active{transform:translateY(.28vw);box-shadow:0 .12vw 0 #0879ad}
.roll-btn:disabled,.check-btn:disabled,.reset-btn:disabled{opacity:.45;cursor:not-allowed}

.bond{position:absolute;left:50%;top:28%;transform:translateX(-50%);width:42%;height:42%;z-index:9}
.bond-lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;filter:drop-shadow(0 .18vw 0 rgba(10,45,70,.12))}
.bond-lines line{stroke:#163a5a;stroke-width:2.15;stroke-linecap:round}
.circle{
  position:absolute;z-index:2;border-radius:50%;background:#fff;border:.34vw solid #163a5a;
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 .22vw rgba(30,174,232,.09),0 .45vw 0 rgba(14,51,80,.12),0 .55vw 1vw rgba(22,58,90,.07);
}
.whole{width:20%;aspect-ratio:1;left:40%;top:0;background:#fff;isolation:isolate}
.left-part,.right-part{width:24%;aspect-ratio:1;top:54%}
.left-part{left:12%}.right-part{right:12%}
.whole-num,.part-num{position:absolute;font-weight:900;color:var(--navy);z-index:4;pointer-events:none}
.whole-num{font-size:clamp(28px,3.25vw,58px)}
.part-num{font-size:clamp(20px,2.2vw,40px);top:5%;right:10%;background:#fff;border-radius:50%;min-width:27%;aspect-ratio:1;display:grid;place-items:center;border:2px solid rgba(17,55,84,.12)}
.items{position:absolute;inset:18% 10% 8%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3%;z-index:2}
.circle.drop-hot{background:#eafcff;border-color:#00a8e8;box-shadow:0 0 0 .35vw rgba(0,168,232,.22),0 .45vw 0 rgba(14,51,80,.12)}
.circle.shake{animation:shake .32s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5%)}75%{transform:translateX(5%)}}
.circle.success{animation:pop .5s ease;background:#effff1;border-color:#2db957}
@keyframes pop{0%{scale:1}45%{scale:1.08}100%{scale:1}}

.tray{
  position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);width:47%;height:14.5%;
  border-radius:2vw;background:rgba(255,255,255,.87);border:.26vw solid rgba(10,79,123,.19);
  box-shadow:0 .55vw 1.3vw rgba(15,68,99,.11);z-index:12;padding:.5% 1.2%;
  display:flex;align-items:center;justify-content:center;gap:.7vw
}
.tray::before{
  content:"BATTERY TRAY";position:absolute;left:50%;top:-23%;transform:translateX(-50%);
  font-size:clamp(10px,.8vw,14px);font-weight:900;color:var(--navy);background:#fff;padding:.18vw .75vw;border-radius:999px;
  border:2px solid rgba(9,80,129,.12)
}
.tray.drop-hot{outline:.35vw solid rgba(0,168,232,.28)}
.battery{
  width:clamp(30px,2.45vw,44px);height:clamp(53px,4.45vw,78px);position:relative;flex:0 0 auto;
  border:.18vw solid #213442;border-radius:.42vw;background:linear-gradient(90deg,#ffcf2e 0 17%,#ffe25f 17% 83%,#ffcf2e 83%);
  box-shadow:0 .24vw 0 rgba(16,54,80,.18);cursor:grab;touch-action:none;transition:transform .12s ease,opacity .12s ease
}
.battery:active{cursor:grabbing}
.battery::before{
  content:"";position:absolute;left:28%;top:-10%;width:44%;height:11%;background:#d9d9d9;border:.12vw solid #263746;border-radius:.2vw .2vw 0 0
}
.battery::after{
  content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:#ef3f45;
  font-size:clamp(18px,1.55vw,28px);font-weight:900;text-shadow:0 1px 0 #b71f28
}
.circle .battery{width:22%;height:44%;min-width:0;min-height:0;border-width:.12vw;border-radius:.3vw;box-shadow:0 .15vw 0 rgba(16,54,80,.15)}
.circle .battery::before{border-width:.08vw}.circle .battery::after{font-size:clamp(10px,1vw,18px)}
.battery.drag-source{opacity:.25}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.16);filter:drop-shadow(0 10px 12px rgba(8,49,78,.28));transition:none}

.action-area{
  position:absolute;left:50%;bottom:1.1%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:.8vw
}
.check-btn{background:linear-gradient(#4bd36d,#2cb957);box-shadow:0 .4vw 0 #218a43}
.reset-btn{background:linear-gradient(#a98bff,#8666e8);box-shadow:0 .4vw 0 #654abf;display:none}
.next-btn{background:linear-gradient(#ffc92f,#f3a918);box-shadow:0 .4vw 0 #c87d0d;color:#5e3b00;display:none}
.answer-grid{
  position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);width:47%;height:14.5%;z-index:13;
  display:none;grid-template-columns:repeat(4,1fr);align-items:center;gap:.9vw;padding:.65vw 1vw;
  border-radius:2vw;background:rgba(255,255,255,.88);border:.26vw solid rgba(10,79,123,.19);
  box-shadow:0 .55vw 1.3vw rgba(15,68,99,.11)
}
.answer-grid.show{display:grid}
.answer-grid::before{
  content:"CHOOSE THE MISSING NUMBER";position:absolute;left:50%;top:-23%;transform:translateX(-50%);white-space:nowrap;
  font-size:clamp(10px,.78vw,14px);font-weight:900;color:var(--navy);background:#fff;padding:.18vw .75vw;border-radius:999px;
  border:2px solid rgba(9,80,129,.12)
}
.answer-btn{
  min-width:0;height:72%;border-radius:1.15vw;color:#fff;font-size:clamp(22px,2.25vw,40px);font-weight:900;
  border:.2vw solid rgba(255,255,255,.9);transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;
  text-shadow:0 2px 2px rgba(0,0,0,.16)
}
.answer-btn:nth-child(1){background:linear-gradient(#9b7cff,#7b58df);box-shadow:0 .38vw 0 #6041bd}
.answer-btn:nth-child(2){background:linear-gradient(#35c7ed,#0da6d6);box-shadow:0 .38vw 0 #087aa3}
.answer-btn:nth-child(3){background:linear-gradient(#ff7abb,#e64e95);box-shadow:0 .38vw 0 #bd3474}
.answer-btn:nth-child(4){background:linear-gradient(#ffad52,#f27a2c);box-shadow:0 .38vw 0 #bf5719}
.answer-btn:active{transform:translateY(.25vw);box-shadow:0 .1vw 0 rgba(0,0,0,.18)}
.answer-btn.selected{transform:translateY(-.12vw) scale(1.04);outline:.28vw solid #173a59;outline-offset:.12vw;filter:brightness(1.07)}
.answer-btn.wrong{animation:answerWrong .35s ease;outline:.3vw solid #e33b42}
.answer-btn.correct{outline:.3vw solid #22a94d;filter:brightness(1.1)}
@keyframes answerWrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-5%)}75%{transform:translateX(5%)}}
.status{
  min-width:230px;max-width:34vw;padding:.55vw 1vw;border-radius:999px;background:rgba(255,255,255,.94);
  color:var(--navy);font-size:clamp(12px,.95vw,17px);font-weight:800;text-align:center;
  border:2px solid rgba(10,79,123,.14);box-shadow:0 .28vw .8vw rgba(17,62,91,.08)
}
.status.good{color:#167d35;background:#effff4}.status.warn{color:#a95b00;background:#fff8df}

.equation{
  position:absolute;left:50%;top:69.3%;transform:translateX(-50%);z-index:15;
  padding:.35vw 1vw;border-radius:999px;background:rgba(255,255,255,.94);color:var(--navy);
  font-weight:900;font-size:clamp(16px,1.35vw,24px);border:2px solid rgba(8,73,116,.12);
  opacity:0;transition:opacity .25s ease,transform .25s ease
}
.equation.show{opacity:1;transform:translateX(-50%) translateY(-.25vw)}

#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.overlay{
  position:absolute;inset:0;background:rgba(10,49,77,.34);z-index:80;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(3px)
}
.overlay.show{display:flex}
.final-card{
  width:min(74%,650px);background:#fff;border-radius:36px;padding:3.1% 4%;text-align:center;
  border:5px solid rgba(255,255,255,.9);box-shadow:0 20px 50px rgba(6,38,61,.28)
}
.final-card .stars{font-size:clamp(44px,5vw,82px);animation:float 1.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8%)}}
.final-card h2{margin:.1em 0;color:var(--navy);font-size:clamp(34px,4vw,66px);line-height:1;font-weight:900}
.final-card p{margin:.8em 0 1.5em;color:#45647d;font-size:clamp(14px,1.25vw,21px);font-weight:700}
.final-actions{display:flex;justify-content:center;gap:1vw;flex-wrap:wrap}
.final-btn.secondary{background:linear-gradient(#eef3f7,#dbe5eb);color:#35556e;box-shadow:0 .4vw 0 #b7c7d1}
.mini-check{position:absolute;right:7%;bottom:7%;font-size:clamp(18px,2vw,34px);opacity:0}
.circle.success .mini-check{opacity:1}

@media(max-width:700px) and (orientation:portrait){
  #viewport::after{
    content:"Turn your device sideways to play.";position:fixed;inset:0;display:grid;place-items:center;
    padding:30px;text-align:center;background:#e6f7ff;color:#0b4c7a;font:800 22px "Poppins",Arial,sans-serif;z-index:99999
  }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div id="viewport">
  <main id="stage" aria-label="Drag the Batteries number bond game">
    <div id="shade"></div>
    <canvas id="confetti"></canvas>

    <section class="top-ui" aria-label="Game header">
      <h1 class="title">Drag the Batteries</h1>
      <div class="subrow">
        <div class="instruction" id="instruction">Roll the dice. Make the number bond.</div>
        <button class="icon-btn" id="speakBtn" type="button" aria-label="Hear the instruction">🔊</button>
      </div>
      <div class="progress-wrap">
        <span class="progress-label" id="progressLabel">Round 1 • 0 / 5</span>
        <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
      </div>
    </section>

    <div class="dice-area">
      <div class="dice" id="dice" aria-label="Dice">
        <i class="pip p1"></i><i class="pip p2"></i><i class="pip p3"></i><i class="pip p4"></i>
        <i class="pip p5"></i><i class="pip p6"></i><i class="pip p7"></i>
      </div>
      <button class="roll-btn" id="rollBtn" type="button">ROLL</button>
    </div>

    <section class="bond" aria-label="Number bond">
      <svg class="bond-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <line x1="50" y1="31" x2="26" y2="65"></line>
        <line x1="50" y1="31" x2="74" y2="65"></line>
      </svg>

      <div class="circle whole" aria-label="Whole">
        <span class="whole-num" id="wholeNum">?</span>
      </div>

      <div class="circle left-part drop-zone" id="leftZone" data-zone="left" aria-label="Left part">
        <span class="part-num" id="leftNum">?</span>
        <div class="items" id="leftItems"></div>
        <span class="mini-check">✓</span>
      </div>

      <div class="circle right-part drop-zone" id="rightZone" data-zone="right" aria-label="Right part">
        <span class="part-num" id="rightNum">?</span>
        <div class="items" id="rightItems"></div>
        <span class="mini-check">✓</span>
      </div>
    </section>

    <div class="equation" id="equation">3 + 3 = 6</div>

    <section class="tray drop-zone" id="tray" data-zone="tray" aria-label="Battery tray"></section>

    <section class="answer-grid" id="answerGrid" aria-label="Answer choices">
      <button class="answer-btn" type="button"></button>
      <button class="answer-btn" type="button"></button>
      <button class="answer-btn" type="button"></button>
      <button class="answer-btn" type="button"></button>
    </section>

    <div class="action-area">
      <div class="status" id="status" aria-live="polite">Roll the dice to start!</div>
      <button class="reset-btn" id="resetBtn" type="button">RESET</button>
      <button class="check-btn" id="checkBtn" type="button" disabled>CHECK</button>
      <button class="next-btn" id="nextBtn" type="button">NEXT</button>
    </div>

    <div class="overlay" id="finalOverlay" role="dialog" aria-modal="true" aria-labelledby="finalTitle">
      <div class="final-card">
        <div class="stars">🌟 🤖 🌟</div>
        <h2 id="finalTitle">Fantastic!</h2>
        <p>You completed both rounds!</p>
        <div class="final-actions">
          <button class="final-btn" id="playAgainBtn" type="button">PLAY AGAIN</button>
          <button class="final-btn secondary" id="homeBtn" type="button">HOME</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const stage = $("#stage"), dice = $("#dice"), rollBtn = $("#rollBtn"), checkBtn = $("#checkBtn"),
        resetBtn = $("#resetBtn"), nextBtn = $("#nextBtn"), speakBtn = $("#speakBtn"), tray = $("#tray"),
        answerGrid = $("#answerGrid"), answerBtns = [...document.querySelectorAll(".answer-btn")],
        diceArea = $(".dice-area"), leftZone = $("#leftZone"), rightZone = $("#rightZone"),
        leftItems = $("#leftItems"), rightItems = $("#rightItems"),
        leftNum = $("#leftNum"), rightNum = $("#rightNum"), wholeNum = $("#wholeNum"),
        status = $("#status"), equation = $("#equation"),
        progressLabel = $("#progressLabel"), progressBar = $("#progressBar"),
        instruction = $("#instruction"), finalOverlay = $("#finalOverlay"),
        playAgainBtn = $("#playAgainBtn"), homeBtn = $("#homeBtn"),
        confettiCanvas = $("#confetti"), ctx = confettiCanvas.getContext("2d");

  const QUESTIONS_PER_ROUND = 5;
  let currentRound = 1, roundDone = 0, totalDone = 0;
  let whole = null, previousWhole = null, locked = false, rolling = false;
  let selectedAnswer = null, missingPosition = null, partA = null, partB = null;
  let audioCtx = null, particles = [], confettiRAF = null;
  const dicePatterns = {1:[4],2:[1,7],3:[1,4,7],4:[1,2,6,7],5:[1,2,4,6,7],6:[1,2,3,5,6,7]};

  function tone(freq=440,duration=.08,type="sine",volume=.05){
    try{
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audioCtx.destination);
      const t=audioCtx.currentTime;g.gain.setValueAtTime(volume,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
      o.start(t);o.stop(t+duration);
    }catch(e){}
  }
  function clickSound(){tone(360,.05,"sine",.035)}
  function dropSound(){tone(520,.07,"triangle",.045)}
  function correctSound(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.18,"sine",.055),i*95))}
  function wrongSound(){tone(210,.12,"triangle",.035)}
  function rollSound(){let n=0;const id=setInterval(()=>{tone(180+n*18,.035,"square",.018);if(++n>7)clearInterval(id)},70)}

  function speak(text){
    if(!("speechSynthesis" in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;u.pitch=1.08;
    const voices=speechSynthesis.getVoices();
    const preferred=voices.find(v=>/^en(-|_)/i.test(v.lang)&&/Samantha|Google US English|Microsoft Zira|English/i.test(v.name))||voices.find(v=>/^en(-|_)/i.test(v.lang));
    if(preferred)u.voice=preferred;speechSynthesis.speak(u);
  }
  function numberWord(n){return ["zero","one","two","three","four","five","six"][n]||String(n)}

  function showDice(n){
    document.querySelectorAll(".pip").forEach(p=>p.style.display="none");
    (dicePatterns[n]||[]).forEach(i=>$(".p"+i).style.display="block");
    dice.setAttribute("aria-label","Dice shows "+n);
  }
  function setStatus(text,kind=""){status.textContent=text;status.className="status"+(kind?" "+kind:"")}
  function updateProgress(){
    progressLabel.textContent="Round "+currentRound+" • "+roundDone+" / "+QUESTIONS_PER_ROUND;
    progressBar.style.width=(roundDone/QUESTIONS_PER_ROUND*100)+"%";
  }
  function clearBondEffects(){
    leftZone.classList.remove("success","shake");rightZone.classList.remove("success","shake");
    document.querySelector(".whole").classList.remove("success","shake");
  }
  function updateCounts(){
    const l=leftItems.children.length,r=rightItems.children.length;
    leftNum.textContent=l?l:"?";rightNum.textContent=r?r:"?";
    checkBtn.disabled=locked||whole===null;
  }

  function createBattery(i){
    const b=document.createElement("div");b.className="battery";b.tabIndex=0;b.dataset.id=String(i);b.dataset.loc="tray";
    b.setAttribute("role","button");b.setAttribute("aria-label","Battery "+(i+1)+". Drag to a part.");
    b.addEventListener("pointerdown",beginDrag);
    b.addEventListener("keydown",e=>{
      if(locked||whole===null||currentRound!==1)return;
      if(e.key==="1"||e.key==="ArrowLeft"){e.preventDefault();moveBattery(b,"left")}
      if(e.key==="2"||e.key==="ArrowRight"){e.preventDefault();moveBattery(b,"right")}
      if(e.key==="0"||e.key==="ArrowDown"){e.preventDefault();moveBattery(b,"tray")}
    });
    return b;
  }
  function moveBattery(b,zone){
    if(locked||currentRound!==1)return;
    if(zone==="left")leftItems.appendChild(b);else if(zone==="right")rightItems.appendChild(b);else tray.appendChild(b);
    b.dataset.loc=zone;updateCounts();dropSound();
  }

  let drag=null;
  function beginDrag(e){
    const b=e.currentTarget;if(locked||whole===null||rolling||currentRound!==1)return;
    e.preventDefault();const rect=b.getBoundingClientRect(),ghost=b.cloneNode(true);
    ghost.className="battery drag-ghost";ghost.removeAttribute("tabindex");ghost.style.width=rect.width+"px";ghost.style.height=rect.height+"px";
    document.body.appendChild(ghost);b.classList.add("drag-source");drag={b,ghost,source:b.dataset.loc};moveGhost(e.clientX,e.clientY);
    window.addEventListener("pointermove",onDragMove,{passive:false});window.addEventListener("pointerup",endDrag,{once:true});window.addEventListener("pointercancel",endDrag,{once:true});
  }
  function moveGhost(x,y){if(!drag)return;drag.ghost.style.left=x+"px";drag.ghost.style.top=y+"px"}
  function clearHot(){document.querySelectorAll(".drop-hot").forEach(z=>z.classList.remove("drop-hot"))}
  function onDragMove(e){
    if(!drag)return;e.preventDefault();moveGhost(e.clientX,e.clientY);clearHot();
    const el=document.elementFromPoint(e.clientX,e.clientY),z=el&&el.closest(".drop-zone");if(z)z.classList.add("drop-hot");
  }
  function endDrag(e){
    window.removeEventListener("pointermove",onDragMove);if(!drag)return;clearHot();
    const el=document.elementFromPoint(e.clientX,e.clientY),z=el&&el.closest(".drop-zone"),zone=z?z.dataset.zone:drag.source;
    drag.b.classList.remove("drag-source");drag.ghost.remove();const b=drag.b;drag=null;moveBattery(b,zone);
  }

  function resetRoundOneTurn(){
    if(currentRound!==1||whole===null||locked)return;
    clickSound();[...leftItems.children,...rightItems.children].forEach(b=>tray.appendChild(b));
    tray.querySelectorAll(".battery").forEach(b=>b.dataset.loc="tray");
    clearBondEffects();equation.classList.remove("show");updateCounts();setStatus("Try again. Make two groups.");
  }

  function clearRoundOneQuestion(){
    tray.querySelectorAll(".battery").forEach(b=>b.remove());leftItems.innerHTML="";rightItems.innerHTML="";clearBondEffects();
    leftNum.textContent="?";rightNum.textContent="?";wholeNum.textContent="?";whole=null;locked=false;equation.classList.remove("show");
    nextBtn.style.display="none";nextBtn.textContent="NEXT";resetBtn.style.display="none";rollBtn.style.display="";rollBtn.disabled=false;checkBtn.disabled=true;
    showDice(1);instruction.textContent="Roll the dice. Make the number bond.";setStatus("Roll the dice to start!");
  }

  async function roll(){
    if(rolling||locked||currentRound!==1)return;
    rolling=true;clickSound();rollSound();rollBtn.disabled=true;dice.classList.add("rolling");
    const start=performance.now();await new Promise(resolve=>{
      const id=setInterval(()=>{showDice(1+Math.floor(Math.random()*6));if(performance.now()-start>760){clearInterval(id);resolve()}},85);
    });
    let n;do{n=2+Math.floor(Math.random()*5)}while(n===previousWhole);
    previousWhole=n;whole=n;showDice(n);dice.classList.remove("rolling");wholeNum.textContent=n;tray.innerHTML="";
    for(let i=0;i<n;i++)tray.appendChild(createBattery(i));
    updateCounts();instruction.textContent="Make "+n+".";setStatus("Drag the batteries into two groups.");rollBtn.style.display="none";resetBtn.style.display="inline-flex";
    rolling=false;speak("Make "+numberWord(n)+".");
  }

  function finishCorrectRoundOne(){
    const l=leftItems.children.length,r=rightItems.children.length;
    locked=true;checkBtn.disabled=true;resetBtn.disabled=true;leftZone.classList.add("success");rightZone.classList.add("success");
    equation.textContent=l+" + "+r+" = "+whole;equation.classList.add("show");setStatus("Great job!","good");correctSound();burst();
    roundDone++;totalDone++;updateProgress();speak(numberWord(l)+" plus "+numberWord(r)+" equals "+numberWord(whole)+".");
    nextBtn.textContent=roundDone>=QUESTIONS_PER_ROUND?"ROUND 2":"NEXT";nextBtn.style.display="inline-flex";
  }

  function checkRoundOne(){
    const l=leftItems.children.length,r=rightItems.children.length,t=tray.querySelectorAll(".battery").length;
    clearBondEffects();void leftZone.offsetWidth;
    if(t>0){setStatus("Use all the batteries.","warn");tray.classList.add("drop-hot");setTimeout(()=>tray.classList.remove("drop-hot"),600);return}
    if(l===0||r===0){setStatus("Make two groups.","warn");(l===0?leftZone:rightZone).classList.add("shake");return}
    if(l+r===whole)finishCorrectRoundOne();
  }

  function makeChoices(correct){
    const set=new Set([correct]);
    const pool=[1,2,3,4,5,6].filter(n=>n!==correct);
    while(set.size<4){set.add(pool[Math.floor(Math.random()*pool.length)])}
    return [...set].sort(()=>Math.random()-.5);
  }

  function buildRoundTwoQuestion(){
    locked=false;selectedAnswer=null;clearBondEffects();equation.classList.remove("show");answerBtns.forEach(b=>{b.classList.remove("selected","wrong","correct");b.disabled=false});
    whole=3+Math.floor(Math.random()*4);partA=1+Math.floor(Math.random()*(whole-1));partB=whole-partA;
    missingPosition=["whole","left","right"][Math.floor(Math.random()*3)];
    wholeNum.textContent=missingPosition==="whole"?"?":whole;
    leftNum.textContent=missingPosition==="left"?"?":partA;
    rightNum.textContent=missingPosition==="right"?"?":partB;
    leftItems.innerHTML="";rightItems.innerHTML="";
    const correct=missingPosition==="whole"?whole:(missingPosition==="left"?partA:partB);
    const choices=makeChoices(correct);
    answerBtns.forEach((b,i)=>{b.textContent=choices[i];b.dataset.value=choices[i]});
    checkBtn.disabled=true;nextBtn.style.display="none";nextBtn.textContent="NEXT";instruction.textContent="Find the missing number.";
    setStatus("Choose the missing number.");speak("Find the missing number.");
  }

  function selectAnswer(btn){
    if(currentRound!==2||locked)return;
    clickSound();selectedAnswer=Number(btn.dataset.value);answerBtns.forEach(b=>b.classList.toggle("selected",b===btn));checkBtn.disabled=false;
  }

  function revealRoundTwoAnswer(){
    if(missingPosition==="whole")wholeNum.textContent=whole;
    else if(missingPosition==="left")leftNum.textContent=partA;
    else rightNum.textContent=partB;
    document.querySelector(missingPosition==="whole"?".whole":missingPosition==="left"?".left-part":".right-part").classList.add("success");
  }

  function checkRoundTwo(){
    if(selectedAnswer===null){setStatus("Choose an answer.","warn");return}
    const correct=missingPosition==="whole"?whole:(missingPosition==="left"?partA:partB);
    const picked=answerBtns.find(b=>Number(b.dataset.value)===selectedAnswer);
    if(selectedAnswer!==correct){
      wrongSound();setStatus("Try again!","warn");picked.classList.remove("selected");picked.classList.add("wrong");
      setTimeout(()=>picked.classList.remove("wrong"),420);selectedAnswer=null;checkBtn.disabled=true;return;
    }
    locked=true;checkBtn.disabled=true;answerBtns.forEach(b=>b.disabled=true);picked.classList.add("correct");
    revealRoundTwoAnswer();equation.textContent=partA+" + "+partB+" = "+whole;equation.classList.add("show");
    setStatus("Great job!","good");correctSound();burst();roundDone++;totalDone++;updateProgress();
    speak(numberWord(partA)+" plus "+numberWord(partB)+" equals "+numberWord(whole)+".");
    nextBtn.textContent=roundDone>=QUESTIONS_PER_ROUND?"FINISH":"NEXT";nextBtn.style.display="inline-flex";
  }

  function check(){
    if(locked||whole===null)return;clickSound();
    if(currentRound===1)checkRoundOne();else checkRoundTwo();
  }

  function startRoundTwo(){
    currentRound=2;roundDone=0;previousWhole=null;locked=false;whole=null;
    tray.style.display="none";answerGrid.classList.add("show");diceArea.style.display="none";resetBtn.style.display="none";resetBtn.disabled=false;
    nextBtn.style.display="none";rollBtn.style.display="none";equation.classList.remove("show");updateProgress();
    buildRoundTwoQuestion();
  }

  function nextQuestion(){
    clickSound();
    if(currentRound===1){
      if(roundDone>=QUESTIONS_PER_ROUND){startRoundTwo()}else{resetBtn.disabled=false;clearRoundOneQuestion()}
    }else{
      if(roundDone>=QUESTIONS_PER_ROUND){burst(180);finalOverlay.classList.add("show")}else buildRoundTwoQuestion();
    }
  }

  function resetGame(startImmediately=false){
    currentRound=1;roundDone=0;totalDone=0;previousWhole=null;selectedAnswer=null;missingPosition=null;
    finalOverlay.classList.remove("show");tray.style.display="flex";answerGrid.classList.remove("show");diceArea.style.display="flex";resetBtn.disabled=false;
    updateProgress();clearRoundOneQuestion();if(startImmediately)setTimeout(roll,180);
  }

  function resizeConfetti(){
    const r=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);confettiCanvas.width=Math.round(r.width*dpr);confettiCanvas.height=Math.round(r.height*dpr);
    confettiCanvas.style.width=r.width+"px";confettiCanvas.style.height=r.height+"px";ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function burst(count=110){
    resizeConfetti();const r=stage.getBoundingClientRect(),colors=["#ff4f4f","#ffd33d","#20b7ef","#44cf68","#b67cff"];
    for(let i=0;i<count;i++)particles.push({x:r.width*.5,y:r.height*.5,dx:(Math.random()-.5)*14,dy:-4-Math.random()*10,g:.22+Math.random()*.12,w:4+Math.random()*7,h:7+Math.random()*10,rot:Math.random()*6,dr:(Math.random()-.5)*.3,c:colors[Math.floor(Math.random()*colors.length)],life:100+Math.random()*35});
    if(!confettiRAF)animateConfetti();
  }
  function animateConfetti(){
    confettiRAF=requestAnimationFrame(animateConfetti);const r=stage.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);
    particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dy+=p.g;p.rot+=p.dr;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    particles=particles.filter(p=>p.life>0&&p.y<r.height+40);if(!particles.length){cancelAnimationFrame(confettiRAF);confettiRAF=null;ctx.clearRect(0,0,r.width,r.height)}
  }

  rollBtn.addEventListener("click",roll);checkBtn.addEventListener("click",check);resetBtn.addEventListener("click",resetRoundOneTurn);nextBtn.addEventListener("click",nextQuestion);
  answerBtns.forEach(b=>b.addEventListener("click",()=>selectAnswer(b)));
  speakBtn.addEventListener("click",()=>{clickSound();speak(currentRound===2?"Find the missing number.":whole===null?"Roll the dice. Make the number bond.":"Make "+numberWord(whole)+".")});
  playAgainBtn.addEventListener("click",()=>resetGame(true));homeBtn.addEventListener("click",()=>resetGame(false));window.addEventListener("resize",resizeConfetti);

  showDice(1);updateProgress();resizeConfetti();
})();
</script>

button{font-family:inherit}
.hidden{display:none!important}
.app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.shell{
  width:min(1050px,78vw);
  height:min(690px,88vh);
  background:rgba(255,255,255,.74);
  border:5px solid rgba(255,255,255,.96);
  border-radius:32px;
  box-shadow:0 20px 50px rgba(41,76,104,.24);
  backdrop-filter:blur(7px);
  display:flex;flex-direction:column;overflow:hidden
}
.topbar{
  min-height:84px;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.68);border-bottom:3px dashed #c8e7f5;gap:12px
}
.title-wrap{display:flex;align-items:center;gap:12px}
.logo{
  width:54px;height:54px;border-radius:18px;background:#f3e8ff;border:3px solid #c4b5fd;
  display:grid;place-items:center;box-shadow:0 5px 0 #a78bfa
}
.logo svg{width:36px;height:36px}
.title{font-size:clamp(24px,2.3vw,34px);font-weight:900;color:#2563a8;line-height:1}
.subtitle{font-size:12px;font-weight:700;color:#68839a;margin-top:5px}
.scorebox{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.badge{background:#fff7c2;border:3px solid #facc15;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:900;box-shadow:0 4px 0 #eab308}
.content{flex:1;min-height:0;padding:18px 22px 20px;display:flex;flex-direction:column}
.setup{height:100%;display:flex;align-items:center;justify-content:center}
.setup-card{
  width:min(720px,95%);background:rgba(255,255,255,.80);border:4px solid #dbeafe;border-radius:28px;
  padding:28px 32px;text-align:center;box-shadow:0 14px 30px rgba(37,99,235,.12)
}
.setup-card h1{font-size:clamp(34px,4vw,52px);margin:0;color:#8b5cf6;font-weight:900}
.setup-card p{font-size:17px;font-weight:700;color:#526d84;margin:9px auto 24px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.level{
  border:3px solid #dbe4ef;border-radius:22px;background:#fff;padding:16px 8px;cursor:pointer;font-size:18px;font-weight:900;
  box-shadow:0 6px 0 #cbd5e1;transition:.12s
}
.level:nth-child(1){color:#16a34a} .level:nth-child(2){color:#2563eb} .level:nth-child(3){color:#9333ea}
.level.selected{border-color:#38bdf8;background:#eff9ff;box-shadow:0 6px 0 #0ea5e9;transform:translateY(-2px)}
.big-btn{
  border:none;border-radius:22px;padding:16px 34px;font-size:22px;font-weight:900;color:white;background:#58cc02;
  box-shadow:0 7px 0 #3fa000;cursor:pointer;transition:.12s
}
.big-btn:active,.next-btn:active,.continue-btn:active{transform:translateY(6px);box-shadow:none}
.game{height:100%;display:flex;flex-direction:column;gap:14px}
.progress-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress-wrap{flex:1;max-width:520px;height:18px;background:#e5eef5;border:3px solid #c7d7e5;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#34d399,#58cc02);transition:width .35s;border-radius:999px}
.qcounter{font-size:14px;font-weight:900;color:#51718c}
.question-card{
  flex:1;min-height:0;background:rgba(255,255,255,.80);border:4px solid #dbeafe;border-radius:28px;
  padding:18px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(37,99,235,.11)
}
.prompt-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.prompt{font-size:clamp(25px,3vw,36px);font-weight:900;color:#334155}
.speak{width:52px;height:52px;border-radius:50%;border:3px solid white;background:#38bdf8;color:white;box-shadow:0 5px 0 #0284c7;font-size:24px;cursor:pointer}
.pattern{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:nowrap;margin:4px 0 17px;width:100%}
.pattern-cell{
  width:84px;height:84px;border-radius:20px;background:rgba(255,255,255,.90);border:3px solid #d9e4ef;box-shadow:0 6px 0 #c8d4df;
  display:grid;place-items:center;animation:pop .28s both
}
.pattern-cell.missing{background:#fff5fb;border-style:dashed;border-color:#f59ac1;color:#ec4899;font-size:38px;font-weight:900;box-shadow:0 6px 0 #f3c4d8}
.shape{display:block;filter:drop-shadow(0 4px 2px rgba(0,0,0,.12))}
.circle{width:52px;height:52px;border-radius:50%}
.square{width:52px;height:52px;border-radius:0}
.rectangle{width:66px;height:42px;border-radius:0}
.triangle{width:0;height:0;border-left:29px solid transparent;border-right:29px solid transparent;border-bottom:52px solid currentColor;background:transparent!important;filter:drop-shadow(0 4px 2px rgba(0,0,0,.12))}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(720px,100%)}
.choice{
  height:94px;border-radius:22px;border:4px solid #e3e8ef;background:rgba(255,255,255,.92);box-shadow:0 7px 0 #ccd5de;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.14s;position:relative
}
.choice:hover{transform:translateY(-3px);border-color:#b8c8d7}
.choice:active{transform:translateY(5px);box-shadow:0 2px 0 #ccd5de}
.choice.correct{border-color:#58cc02;background:#f0ffe8;box-shadow:0 7px 0 #3fa000}
.choice.correct::after{content:"✓";position:absolute;right:8px;top:4px;font-size:22px;color:#22a447;font-weight:900}
.choice.wrong{border-color:#ff4b4b;background:#fff1f1;animation:shake .3s}
.choice.wrong::after{content:"✕";position:absolute;right:8px;top:4px;font-size:22px;color:#ef4444;font-weight:900}
.feedback-row{min-height:78px;display:flex;align-items:center;justify-content:center;gap:16px;margin-top:14px;padding-top:6px}
.feedback{font-size:22px;font-weight:900;min-width:160px;text-align:center}
.feedback.ok{color:#22a447} .feedback.no{color:#ef4444}
.next-btn,.continue-btn{
  border:none;border-radius:18px;padding:11px 25px;font-size:17px;font-weight:900;color:white;background:#1cb0f6;
  box-shadow:0 6px 0 #168bc3;cursor:pointer;min-width:160px
}
.mini-overlay,.summary-overlay{
  position:absolute;inset:0;background:rgba(25,53,74,.35);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;z-index:20
}
.mini-card,.summary-card{
  width:min(760px,86vw);height:min(560px,76vh);background:rgba(255,255,255,.97);
  border:5px solid white;border-radius:30px;box-shadow:0 22px 55px rgba(20,50,70,.28);padding:22px;text-align:center;position:relative;overflow:hidden
}
.mini-title{font-size:34px;font-weight:900;color:#ec4899;margin:0}
.mini-sub{font-size:15px;font-weight:700;color:#64748b;margin:3px 0 8px}
.timer{display:inline-block;background:#fff0f7;color:#be185d;border:3px solid #f9a8d4;border-radius:999px;padding:6px 14px;font-weight:900}
.arena{position:absolute;left:18px;right:18px;top:112px;bottom:82px;border-radius:24px;background:linear-gradient(#dff6ff 0%,#eefcff 55%,#ecfccb 100%);border:4px solid #d8eff7;overflow:hidden}
.float-shape{
  position:absolute;cursor:pointer;animation:balloonFloat linear infinite;
  width:62px;height:78px;display:flex;align-items:flex-start;justify-content:center;
}
.balloon-body{
  width:50px;height:60px;border-radius:50% 50% 46% 46%;
  position:relative;box-shadow:inset -7px -8px 0 rgba(0,0,0,.08), inset 7px 7px 0 rgba(255,255,255,.28), 0 5px 8px rgba(0,0,0,.13);
}
.balloon-body::before{
  content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
  width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid currentColor;
}
.balloon-body::after{
  content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);
  width:10px;height:15px;border-radius:50%;background:rgba(255,255,255,.42);filter:blur(.2px);
}
.balloon-string{
  position:absolute;left:50%;top:62px;width:2px;height:18px;background:#64748b;transform:translateX(-50%);
  opacity:.8;
}
.float-shape.pop{animation:popAway .22s forwards}
.mini-score{position:absolute;bottom:22px;left:22px;font-weight:900;color:#6d28d9;font-size:18px}
.continue-btn{position:absolute;right:22px;bottom:18px;background:#58cc02;box-shadow:0 6px 0 #3fa000}
.summary-card{height:auto;max-width:520px;padding:30px}
.summary-card h2{font-size:44px;color:#8b5cf6;margin:0 0 8px;font-weight:900}
.summary-icon{font-size:80px;animation:bob 1.8s infinite}
.final-score{font-size:52px;color:#f59e0b;font-weight:900;margin:10px 0}
.final-note{font-size:18px;color:#475569;font-weight:800;margin-bottom:18px}
.summary-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.home-btn{background:#94a3b8;box-shadow:0 6px 0 #64748b}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@keyframes pop{0%{transform:scale(.75);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{50%{transform:translateY(-9px)}}
@keyframes popAway{to{transform:scale(1.7);opacity:0}}
@keyframes balloonFloat{0%{transform:translateY(40px) translateX(0) rotate(-3deg)}50%{transform:translateY(-28px) translateX(18px) rotate(3deg)}100%{transform:translateY(-95px) translateX(-8px) rotate(-2deg)}}

/* Ver2: sharper geometric corners */
.choice .square, .pattern-cell .square { border-radius: 0 !important; }
.choice .rectangle, .pattern-cell .rectangle { border-radius: 0 !important; }

@media(max-width:900px){
  .shell{width:92vw;height:90vh} .pattern-cell{width:68px;height:68px} .choices{gap:10px}
  .choice{height:82px} .shape.circle,.shape.square{width:44px;height:44px} .shape.rectangle{width:56px;height:36px}
  .triangle{border-left-width:24px;border-right-width:24px;border-bottom-width:44px}
}
@media(max-width:620px){
  .app{padding:7px} .shell{width:97vw;height:96vh;border-radius:22px} .topbar{padding:10px 12px;min-height:70px}
  .subtitle{display:none} .content{padding:10px} .pattern{gap:6px} .pattern-cell{width:51px;height:51px;border-radius:13px}
  .shape.circle,.shape.square{width:34px;height:34px} .shape.rectangle{width:44px;height:28px}
  .triangle{border-left-width:19px;border-right-width:19px;border-bottom-width:34px}
  .choices{grid-template-columns:repeat(2,1fr)} .choice{height:70px} .question-card{padding:10px} .prompt{font-size:22px}
  .logo{width:44px;height:44px} .badge{font-size:12px;padding:6px 10px} .levels{grid-template-columns:1fr}
}
</style>
</head>

    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div class="app">
  <section class="shell" id="shell">
    <div class="topbar">
      <div class="title-wrap">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <circle cx="20" cy="20" r="10" fill="#1cb0f6"/>
            <rect x="35" y="10" width="20" height="20" rx="4" fill="#ff9f1c"/>
            <path d="M16 52 L27 32 L38 52 Z" fill="#58cc02"/>
          </svg>
        </div>
        <div>
          <div class="title">Shape Patterns</div>
          <div class="subtitle">Look, think, and complete the pattern!</div>
        </div>
      </div>
      <div class="scorebox">
        <div class="badge">⭐ <span id="score">0</span></div>
        <div class="badge">🎯 <span id="modeLabel">Mix</span></div>
      </div>
    </div>

    <div class="content">
      <div id="setupScreen" class="setup">
        <div class="setup-card">
          <h1>Shape Patterns</h1>
          <p>Find the missing shape and complete the pattern!</p>
          <div class="levels">
            <button class="level" data-mode="easy">Easy<br><small>AB patterns</small></button>
            <button class="level" data-mode="medium">Medium<br><small>AB • AAB • ABB • ABC</small></button>
            <button class="level selected" data-mode="mix">Mix<br><small>All patterns</small></button>
          </div>
          <button class="big-btn" id="startBtn">START GAME 🚀</button>
        </div>
      </div>

      <div id="gameScreen" class="game hidden">
        <div class="progress-row">
          <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
          <div class="qcounter" id="qCounter">1 / 10</div>
        </div>
        <div class="question-card">
          <div class="prompt-row">
            <div class="prompt" id="prompt">What comes next?</div>
            <button class="speak" id="speakBtn" aria-label="Hear the question">🔊</button>
          </div>
          <div class="pattern" id="pattern"></div>
          <div class="choices" id="choices"></div>
          <div class="feedback-row">
            <div class="feedback" id="feedback"></div>
            <button class="next-btn hidden" id="nextBtn">NEXT ➜</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<div id="miniOverlay" class="mini-overlay hidden">
  <div class="mini-card">
    <h2 class="mini-title">Tap the Balloons!</h2>
    <div class="mini-sub">Pop as many balloons as you can!</div>
    <div class="timer">⏱ <span id="miniTime">10</span>s</div>
    <div class="arena" id="arena"></div>
    <div class="mini-score">Balloons: <span id="miniScore">0</span></div>
    <button class="continue-btn hidden" id="continueBtn">CONTINUE ➜</button>
  </div>
</div>

<div id="summaryOverlay" class="summary-overlay hidden">
  <div class="summary-card">
    <div class="summary-icon">🌟</div>
    <h2>Amazing!</h2>
    <div class="final-score"><span id="finalScore">0</span> / 10</div>
    <div class="final-note" id="finalNote">Great pattern work!</div>
    <div class="summary-actions">
      <button class="big-btn" id="againBtn">PLAY AGAIN</button>
      <button class="big-btn home-btn" id="homeBtn">HOME</button>
    </div>
  </div>
</div>

<canvas id="confetti" class="confetti"></canvas>

<script>
(() => {
  const SHAPES = ["circle","square","triangle","rectangle"];
  const COLORS = ["#1cb0f6","#ff9f1c","#58cc02","#9b5de5","#ff6b9d","#ffd93d"];
  const setupScreen = document.getElementById("setupScreen");
  const gameScreen = document.getElementById("gameScreen");
  const patternEl = document.getElementById("pattern");
  const choicesEl = document.getElementById("choices");
  const feedbackEl = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");
  const qCounter = document.getElementById("qCounter");
  const progressBar = document.getElementById("progressBar");
  const scoreEl = document.getElementById("score");
  const promptEl = document.getElementById("prompt");
  const modeLabel = document.getElementById("modeLabel");
  const miniOverlay = document.getElementById("miniOverlay");
  const arena = document.getElementById("arena");
  const miniTime = document.getElementById("miniTime");
  const miniScoreEl = document.getElementById("miniScore");
  const continueBtn = document.getElementById("continueBtn");
  const summaryOverlay = document.getElementById("summaryOverlay");
  const finalScore = document.getElementById("finalScore");
  const finalNote = document.getElementById("finalNote");

  let mode = "mix", questions = [], index = 0, score = 0, answered = false, miniScore = 0;
  let audioCtx = null;

  document.querySelectorAll(".level").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".level").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    mode = btn.dataset.mode;
    modeLabel.textContent = mode[0].toUpperCase() + mode.slice(1);
    clickSound();
  }));

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("speakBtn").addEventListener("click", () => speak(promptEl.textContent));
  nextBtn.addEventListener("click", nextQuestion);
  continueBtn.addEventListener("click", () => {
    miniOverlay.classList.add("hidden");
    continueBtn.classList.add("hidden");
    renderQuestion();
  });
  document.getElementById("againBtn").addEventListener("click", () => { summaryOverlay.classList.add("hidden"); startGame(); });
  document.getElementById("homeBtn").addEventListener("click", () => {
    summaryOverlay.classList.add("hidden");
    gameScreen.classList.add("hidden");
    setupScreen.classList.remove("hidden");
  });

  function startGame() {
    initAudio();
    questions = buildQuestions(mode);
    index = 0; score = 0; answered = false;
    scoreEl.textContent = "0";
    setupScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    summaryOverlay.classList.add("hidden");
    renderQuestion();
  }

  function buildQuestions(mode) {
    const wanted = [];
    const plan = mode === "easy"
      ? ["AB","AB","AB","AB","AB","AB","AB","AB","AB","AB"]
      : mode === "medium"
      ? ["AB","AB","AAB","ABB","ABC","AB","AAB","ABB","ABC","ABC"]
      : ["AB","AB","AB","AAB","ABB","AB","ABC","AAB","ABB","ABC"];

    const seen = new Set();
    while (wanted.length < 10) {
      const type = plan[wanted.length];
      const q = makeQuestion(type, wanted.length >= 6 && Math.random() < .55);
      const key = q.pattern.join(",") + "|" + q.missingIndex + "|" + q.answer;
      if (!seen.has(key)) { seen.add(key); wanted.push(q); }
    }
    return wanted;
  }

  function makeQuestion(type, forceInternal=false) {
    const pool = shuffle([...SHAPES]);
    let unit;
    if (type === "AB") unit = [pool[0], pool[1]];
    if (type === "AAB") unit = [pool[0], pool[0], pool[1]];
    if (type === "ABB") unit = [pool[0], pool[1], pool[1]];
    if (type === "ABC") unit = [pool[0], pool[1], pool[2]];

    const len = type === "AB" ? 6 : 6;
    let full = Array.from({length: len}, (_,i) => unit[i % unit.length]);
    let missingIndex;
    if (forceInternal) {
      const valid = [];
      for (let i=1;i<full.length-1;i++) valid.push(i);
      missingIndex = valid[Math.floor(Math.random()*valid.length)];
    } else {
      missingIndex = Math.random() < .72 ? full.length-1 : 1 + Math.floor(Math.random()*(full.length-2));
    }
    const answer = full[missingIndex];
    const shown = [...full];
    shown[missingIndex] = null;

    // Build consistent but lively colors by shape.
    const shapeColors = {};
    shuffle([...COLORS]).forEach((c,i) => { if (i<SHAPES.length) shapeColors[SHAPES[i]] = c; });
    return {
      type, pattern: shown, full, missingIndex, answer, shapeColors,
      prompt: missingIndex === full.length-1 ? "What comes next?" : "Which shape is missing?"
    };
  }

  function renderQuestion() {
    if (index >= 10) return endGame();
    answered = false;
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    nextBtn.classList.add("hidden");
    qCounter.textContent = `${index+1} / 10`;
    progressBar.style.width = `${index*10}%`;
    const q = questions[index];
    promptEl.textContent = q.prompt;
    patternEl.innerHTML = "";
    q.pattern.forEach((s,i) => {
      const cell = document.createElement("div");
      cell.className = "pattern-cell" + (s===null ? " missing" : "");
      cell.style.animationDelay = `${i*60}ms`;
      if (s===null) cell.textContent = "?";
      else cell.appendChild(shapeNode(s, q.shapeColors[s]));
      patternEl.appendChild(cell);
    });

    choicesEl.innerHTML = "";
    shuffle([...SHAPES]).forEach((s,idx) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.dataset.shape = s;
      const color = q.shapeColors[s] || COLORS[(idx+index)%COLORS.length];
      b.appendChild(shapeNode(s,color));
      b.addEventListener("click", () => choose(b,s));
      choicesEl.appendChild(b);
    });
    setTimeout(() => speak(q.prompt), 250);
  }

  function choose(btn, shape) {
    if (answered) return;
    initAudio();
    const q = questions[index];
    if (shape === q.answer) {
      answered = true;
      score++; scoreEl.textContent = score;
      btn.classList.add("correct");
      feedbackEl.textContent = "Great job!";
      feedbackEl.className = "feedback ok";
      successSound();
      fillMissing(q);
      choicesEl.querySelectorAll(".choice").forEach(x => x.disabled = true);
      nextBtn.classList.remove("hidden");
    } else {
      btn.classList.add("wrong");
      feedbackEl.textContent = "Try again!";
      feedbackEl.className = "feedback no";
      wrongSound();
      setTimeout(() => btn.classList.remove("wrong"), 520);
    }
  }

  function fillMissing(q) {
    const cell = patternEl.children[q.missingIndex];
    cell.textContent = "";
    cell.classList.remove("missing");
    cell.appendChild(shapeNode(q.answer,q.shapeColors[q.answer]));
    cell.style.transform = "scale(1.1)";
    cell.style.borderColor = "#58cc02";
    setTimeout(() => { cell.style.transform=""; cell.style.borderColor=""; }, 850);
  }

  function nextQuestion() {
    clickSound();
    index++;
    if (index < 10 && index % 3 === 0) startMiniGame();
    else renderQuestion();
  }

  function shapeNode(type,color) {
    const s = document.createElement("span");
    s.className = "shape " + type;
    if (type === "triangle") {
      s.style.color = color;
      s.style.borderBottomColor = color;
    } else s.style.background = color;
    return s;
  }

  function startMiniGame() {
    miniOverlay.classList.remove("hidden");
    arena.innerHTML = "";
    continueBtn.classList.add("hidden");
    miniScore = 0; miniScoreEl.textContent = "0";
    let t = 10; miniTime.textContent = t;

    for (let i=0;i<15;i++) spawnMiniShape(i);
    const timer = setInterval(() => {
      t--; miniTime.textContent = t;
      if (t <= 0) {
        clearInterval(timer);
        arena.querySelectorAll(".float-shape").forEach(x => x.style.pointerEvents = "none");
        continueBtn.classList.remove("hidden");
        successSound();
      }
    },1000);
  }

  function spawnMiniShape(i) {
    const wrap = document.createElement("div");
    wrap.className = "float-shape";
    wrap.style.left = `${5 + Math.random()*84}%`;
    wrap.style.top = `${18 + Math.random()*64}%`;
    wrap.style.animationDuration = `${4.6 + Math.random()*2.8}s`;
    wrap.style.animationDelay = `${-Math.random()*3}s`;

    const color = COLORS[Math.floor(Math.random()*COLORS.length)];
    const balloon = document.createElement("div");
    balloon.className = "balloon-body";
    balloon.style.background = color;
    balloon.style.color = color;

    const string = document.createElement("div");
    string.className = "balloon-string";

    wrap.appendChild(balloon);
    wrap.appendChild(string);

    wrap.addEventListener("click", () => {
      if (wrap.classList.contains("pop")) return;
      wrap.classList.add("pop");
      miniScore++;
      miniScoreEl.textContent = miniScore;
      popSound();

      setTimeout(() => {
        if (wrap.parentNode) {
          wrap.classList.remove("pop");
          wrap.style.left = `${5 + Math.random()*84}%`;
          wrap.style.top = `${22 + Math.random()*58}%`;
          wrap.style.animationDuration = `${4.6 + Math.random()*2.8}s`;
          wrap.style.animationDelay = "0s";
        }
      }, 260);
    });

    arena.appendChild(wrap);
  }

  function endGame() {
    progressBar.style.width = "100%";
    finalScore.textContent = score;
    finalNote.textContent = score === 10 ? "Pattern Superstar! 🌟" : score >= 8 ? "Fantastic pattern work!" : "Great job! Keep practicing!";
    summaryOverlay.classList.remove("hidden");
    celebrationSound(); burstConfetti();
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .86; u.pitch = 1.08;
    speechSynthesis.speak(u);
  }

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }
  function tone(freq,dur,type="sine",vol=.07,delay=0) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    const t=audioCtx.currentTime+delay; o.start(t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.stop(t+dur);
  }
  function clickSound(){initAudio();tone(430,.08,"sine",.04)}
  function popSound(){initAudio();tone(720,.09,"triangle",.05)}
  function wrongSound(){initAudio();tone(190,.18,"sawtooth",.035);tone(150,.2,"sawtooth",.025,.08)}
  function successSound(){initAudio();tone(523,.12,"triangle",.06);tone(659,.12,"triangle",.06,.1);tone(784,.2,"triangle",.07,.2)}
  function celebrationSound(){initAudio();[523,659,784,1047].forEach((f,i)=>tone(f,.28,"triangle",.07,i*.11))}

  function shuffle(a) {
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a;
  }

  function burstConfetti() {
    const c=document.getElementById("confetti"), ctx=c.getContext("2d");
    c.width=innerWidth; c.height=innerHeight;
    const P=Array.from({length:150},()=>({
      x:innerWidth/2,y:innerHeight*.28,dx:(Math.random()-.5)*14,dy:-Math.random()*9-3,
      r:3+Math.random()*5,col:COLORS[Math.floor(Math.random()*COLORS.length)],a:Math.random()*6.28
    }));
    let frames=0;
    function step(){
      ctx.clearRect(0,0,c.width,c.height);
      P.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.dy+=.22;p.a+=.12;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.col;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
      frames++; if(frames<180) requestAnimationFrame(step); else ctx.clearRect(0,0,c.width,c.height);
    }
    step();
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Penalty Kicks - Ver 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import Font Poppins */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            touch-action: none;
            background-color: #7cd1f9; /* Soft sky blue */
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #4cb8ee 0%, #a4e1ff 60%, #58cc02 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1200px;
        }

        /* --- Background Scenery (Duolingo Style) --- */
        .background-hills {
            position: absolute;
            bottom: 35%;
            left: 0;
            width: 100%;
            height: 30%;
            z-index: 1;
        }

        .hill {
            position: absolute;
            border-radius: 50%;
        }

        .hill-1 {
            width: 150%; height: 150%; left: -25%; bottom: -100%;
            background: #73d124;
        }

        .hill-2 {
            width: 100%; height: 100%; right: -20%; bottom: -60%;
            background: #58cc02; z-index: 2;
        }

        .hill-3 {
            width: 80%; height: 80%; left: -10%; bottom: -40%;
            background: #46a302; z-index: 3;
        }

        /* Cây xanh (Trees) */
        .scenery-item {
            position: absolute;
            font-size: 8vmin;
            z-index: 4;
            filter: drop-shadow(0 0.5vmin 0.5vmin rgba(0,0,0,0.2));
            transform-origin: bottom center;
            animation: sway 4s infinite ease-in-out alternate;
        }

        @keyframes sway {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        /* --- Clouds --- */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            animation: floatCloud linear infinite;
            z-index: 5;
        }
        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud-1 { width: 18vmin; height: 6vmin; top: 8%; left: -20vmin; animation-duration: 32s; }
        .cloud-1::after { width: 8vmin; height: 8vmin; top: -4vmin; left: 3vmin; }
        .cloud-1::before { width: 6vmin; height: 6vmin; top: -2vmin; left: 9vmin; }

        .cloud-2 { width: 14vmin; height: 5vmin; top: 18%; left: -15vmin; animation-duration: 40s; animation-delay: 5s; }
        .cloud-2::after { width: 6vmin; height: 6vmin; top: -3vmin; left: 2vmin; }
        .cloud-2::before { width: 5vmin; height: 5vmin; top: -2vmin; left: 7vmin; }

        @keyframes floatCloud {
            0% { transform: translateX(-20vmin); }
            100% { transform: translateX(110vw); }
        }

        /* Vạch vôi và sân cỏ */
        .field-lines {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%; /* Cố định chiều cao sân cỏ */
            pointer-events: none;
            transform-style: preserve-3d;
            background: #58cc02;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.15) 0px,
                rgba(255,255,255,0.15) 6vmin,
                transparent 6vmin,
                transparent 12vmin
            );
            border-top: 1.5vmin solid #46a302;
            z-index: 2;
        }

        /* Bông hoa trên cỏ (Flowers) */
        .flower-item {
            position: absolute;
            font-size: 3vmin;
            z-index: 5;
            animation: popIn 0.8s ease-out backwards;
        }

        .penalty-box {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) perspective(600px) rotateX(60deg);
            width: 70%;
            max-width: 90vmin;
            height: 40vmin;
            border: 1vmin solid rgba(255,255,255,0.8);
            border-top: none;
            border-radius: 0 0 2vmin 2vmin;
        }

        /* Khung thành - Neo chính xác vào mép sân cỏ để khi Responsive không bị lệch */
        .goal-post {
            position: absolute;
            bottom: 35%; /* Bằng chính xác height của .field-lines */
            left: 50%;
            transform: translateX(-50%);
            width: 75vmin;
            height: 27vmin;
            border-top: 2.5vmin solid #fff;
            border-left: 2.5vmin solid #fff;
            border-right: 2.5vmin solid #fff;
            box-shadow: 0 2vmin 4vmin rgba(0,0,0,0.15);
            background: rgba(255, 255, 255, 0.1);
            z-index: 10;
            perspective: 800px;
            border-radius: 3vmin 3vmin 0 0;
        }

        .net {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255,255,255,0.8) 0.3vmin, transparent 0.3vmin),
                linear-gradient(90deg, rgba(255,255,255,0.8) 0.3vmin, transparent 0.3vmin);
            background-size: 3vmin 3vmin;
            z-index: -1;
            opacity: 0.6;
        }

        /* Đáp án */
        .targets-container {
            position: absolute;
            bottom: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 90vmin;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 30;
        }

        .target-zone {
            position: relative;
            width: 16vmin;
            height: 16vmin;
            border-radius: 50%;
            background: #ffffff;
            border: 1vmin solid #e5e5e5;
            border-bottom: 2vmin solid #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6vmin;
            font-weight: 900;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 1.5vmin 2vmin rgba(0,0,0,0.15);
        }

        .target-zone:nth-child(1) { border-color: #ff4b4b; border-bottom-color: #ea1515; color: #ea1515; }
        .target-zone:nth-child(2) { border-color: #ffb703; border-bottom-color: #e09f00; color: #e09f00; }
        .target-zone:nth-child(3) { border-color: #1cb0f6; border-bottom-color: #147ab0; color: #147ab0; }

        .target-zone:active, .target-zone.clicked {
             transform: translateY(1vmin);
             border-bottom-width: 1vmin;
             filter: brightness(0.95);
        }

        /* Thủ môn (CUTE BEAR) */
        .goalkeeper-container {
            position: absolute;
            bottom: -2vmin;
            left: 50%;
            transform: translateX(-50%);
            width: 25vmin;
            height: 28vmin;
            z-index: 20;
            transition: left 0.5s ease-out, transform 0.5s ease-out;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transform-origin: bottom center;
        }

        .gk-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 1vmin 1vmin rgba(0,0,0,0.3));
        }

        /* Bóng */
        .ball-container {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
            width: 14vmin;
            height: 14vmin;
        }

        .ball {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 1.5vmin 2vmin rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        .ball svg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .ball-flying {
            transition: transform 0.7s cubic-bezier(0.2, 0.6, 0.35, 1);
        }

        .ball-flying .ball svg {
            animation: spinBall 0.7s linear;
        }

        @keyframes spinBall {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(1080deg); }
        }

        /* UI Panels */
        .scoreboard {
            position: absolute;
            top: 2vmin;
            left: 2vmin;
            background: #ffffff;
            padding: 1.5vmin 3vmin;
            border-radius: 3vmin;
            color: #afafaf;
            font-size: 3.5vmin;
            z-index: 50;
            border: 0.6vmin solid #e5e5e5;
            border-bottom: 1vmin solid #e5e5e5;
            font-weight: 900;
        }

        .question-panel {
            position: absolute;
            top: 10%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3vmin;
            z-index: 50;
            pointer-events: none;
        }

        .question-bg {
            background: #1cb0f6;
            color: white;
            padding: 2vmin 6vmin;
            border-radius: 5vmin;
            font-size: 8vmin;
            font-weight: 900;
            display: inline-block;
            border: 0.8vmin solid #1899d6;
            border-bottom: 1.5vmin solid #1899d6;
            box-shadow: 0 1.5vmin 2vmin rgba(0,0,0,0.15);
            text-shadow: 0 0.5vmin 0 #147ab0;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Nút loa đọc phép tính */
        .speak-btn {
            pointer-events: auto;
            background: #ffffff;
            width: 11vmin;
            height: 11vmin;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 0.8vmin solid #1899d6;
            border-bottom: 1.5vmin solid #1899d6;
            box-shadow: 0 1.5vmin 2vmin rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.1s;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-delay: 0.1s;
            animation-fill-mode: backwards;
        }

        .speak-btn:active {
            transform: translateY(1vmin);
            border-bottom-width: 0.8vmin;
            margin-top: 0.7vmin;
        }

        .speak-btn svg {
            width: 55%;
            height: 55%;
            fill: #1cb0f6;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .feedback-text {
            font-size: 14vmin;
            font-weight: 900;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-text-stroke: 0.4vmin white;
            text-align: center;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(124, 209, 249, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            text-align: center;
            backdrop-filter: blur(5px);
            padding: 2vmin;
        }

        .title-text {
            color: #fff;
            -webkit-text-stroke: 0.3vmin #1cb0f6;
            text-shadow: 0 1vmin 0 #1899d6;
            line-height: 1.2;
        }

        .info-box {
            font-size: 3.5vmin;
            padding: 4vmin;
            border-radius: 4vmin;
            max-width: 80vmin;
            margin-bottom: 5vmin;
            border: 0.8vmin solid #e5e5e5;
            border-bottom: 1.5vmin solid #e5e5e5;
        }

        /* Buttons */
        .btn {
            background: #58cc02;
            color: white;
            border: none;
            padding: 3vmin 8vmin;
            font-size: 5vmin;
            border-radius: 6vmin;
            cursor: pointer;
            margin-top: 2vmin;
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            border-bottom: 1.2vmin solid #46a302;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(1.2vmin);
            border-bottom-width: 0;
            margin-bottom: 1.2vmin;
        }

        .hidden { display: none !important; }

        #fireworks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1100;
        }

        /* --- Mystery Box Game Styles --- */
        .box-container {
            display: flex;
            justify-content: center;
            gap: 5vmin;
            margin-top: 5vmin;
            position: relative;
            height: 25vmin;
            width: 100%;
        }

        .mystery-box {
            width: 22vmin;
            height: 22vmin;
            background: #a855f7;
            border: 0.8vmin solid #9333ea;
            border-bottom: 2vmin solid #7e22ce;
            border-radius: 3vmin;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8vmin;
            cursor: pointer;
            position: absolute;
            top: 0;
            transition: left 0.5s ease-in-out, transform 0.3s, filter 0.2s;
            box-shadow: 0 1.5vmin 2vmin rgba(0,0,0,0.2);
            z-index: 10;
        }

        .mystery-box::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 4vmin;
            background: #fde047;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            box-shadow: 0 0 1vmin rgba(0,0,0,0.1);
            z-index: 1;
        }

        .mystery-box::after {
            content: '';
            position: absolute;
            height: 100%;
            width: 4vmin;
            background: #fde047;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            box-shadow: 0 0 1vmin rgba(0,0,0,0.1);
            z-index: 1;
        }

        .box-lid-mark {
            position: absolute;
            color: white;
            font-size: 10vmin;
            font-weight: 900;
            z-index: 2;
            text-shadow: 0 0.5vmin 0 rgba(0,0,0,0.2);
            -webkit-text-stroke: 0.2vmin #7e22ce;
        }

        .mystery-box:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        .mystery-box.open {
            background: #fff;
            border-color: #fde047;
            border-bottom-color: #eab308;
        }

        .mystery-box.open::before, .mystery-box.open::after, .mystery-box.open .box-lid-mark {
            display: none;
        }

        .mystery-content {
            opacity: 0;
            transition: opacity 0.3s;
            transform: scale(0);
            z-index: 5;
        }

        .mystery-box.open .mystery-content {
            opacity: 1;
            transform: scale(1);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes winnerPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1) translateY(-2vmin); box-shadow: 0 0 4vmin #fde047; }
            100% { transform: scale(1); }
        }
        .mystery-box.highlight {
            animation: winnerPulse 0.8s ease-in-out infinite;
            z-index: 20;
        }

        .pos-0 { left: calc(50% - 38vmin); }
        .pos-1 { left: calc(50% - 11vmin); }
        .pos-2 { left: calc(50% + 16vmin); }



        /* --- VER 2: Number Line Controls --- */
        .mode-picker {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2vmin;
            width: min(84vmin, 92vw);
            margin: 2vmin auto 1vmin;
        }

        .mode-btn {
            border: 0.6vmin solid #e5e7eb;
            border-bottom: 1.2vmin solid #cbd5e1;
            border-radius: 3vmin;
            background: #fff;
            color: #475569;
            padding: 2.2vmin 2vmin;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(16px, 3.2vmin, 28px);
            font-weight: 900;
            cursor: pointer;
            transition: 0.12s ease;
        }

        .mode-btn.active {
            background: #e0f2fe;
            color: #0284c7;
            border-color: #38bdf8;
            border-bottom-color: #0284c7;
            transform: translateY(-0.4vmin);
            box-shadow: 0 1vmin 2vmin rgba(2,132,199,0.15);
        }

        .mode-btn:active { transform: translateY(0.7vmin); border-bottom-width: 0.5vmin; }

        .setup-note {
            font-size: clamp(12px, 2.3vmin, 20px);
            color: #64748b;
            font-weight: 700;
            margin-top: 1.4vmin;
        }

        .question-badge {
            position: absolute;
            top: 2vmin;
            right: 2vmin;
            background: #ffffff;
            padding: 1.5vmin 3vmin;
            border-radius: 3vmin;
            color: #afafaf;
            font-size: 3.5vmin;
            z-index: 50;
            border: 0.6vmin solid #e5e5e5;
            border-bottom: 1vmin solid #e5e5e5;
            font-weight: 900;
        }

        .number-line-zone {
            position: absolute;
            left: 50%;
            bottom: 2.5%;
            transform: translateX(-50%);
            width: min(96vw, 118vmin);
            z-index: 70;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4vmin;
        }

        .number-line-track {
            position: relative;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(11, minmax(0, 1fr));
            align-items: center;
            gap: 0;
            padding: 0 1vmin;
        }

        .number-line-track::before {
            content: '';
            position: absolute;
            left: 4.5%;
            right: 4.5%;
            top: 50%;
            height: 0.9vmin;
            min-height: 4px;
            border-radius: 99px;
            background: #ffffff;
            box-shadow: 0 0.55vmin 0 rgba(24,153,214,0.75);
            transform: translateY(-50%);
            z-index: 0;
        }

        .number-node {
            justify-self: center;
            width: clamp(28px, 6.5vmin, 58px);
            height: clamp(28px, 6.5vmin, 58px);
            border-radius: 50%;
            background: #fff;
            border: 0.55vmin solid #1cb0f6;
            border-bottom: 0.9vmin solid #1899d6;
            display: grid;
            place-items: center;
            color: #147ab0;
            font-weight: 900;
            font-size: clamp(12px, 2.7vmin, 24px);
            z-index: 2;
            box-shadow: 0 0.8vmin 1.4vmin rgba(0,0,0,0.12);
            transition: 0.2s ease;
        }

        .number-node.start-node {
            background: #fff7cc;
            color: #b77900;
            border-color: #ffc800;
            border-bottom-color: #d3a600;
        }

        .number-node.current-node {
            background: #dcfce7;
            color: #15803d;
            border-color: #58cc02;
            border-bottom-color: #46a302;
            transform: translateY(-0.6vmin) scale(1.06);
        }

        .movement-controls {
            display: grid;
            grid-template-columns: 1fr 1.25fr 1fr;
            gap: 1.6vmin;
            width: min(78vmin, 92vw);
            align-items: stretch;
        }

        .control-btn {
            border: 0;
            border-radius: 2.6vmin;
            padding: 1.5vmin 2.2vmin;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(14px, 2.7vmin, 24px);
            font-weight: 900;
            color: white;
            cursor: pointer;
            transition: 0.1s ease;
            min-height: clamp(45px, 7vmin, 66px);
        }

        .control-btn.move {
            background: #1cb0f6;
            box-shadow: 0 0.8vmin 0 #1899d6;
        }

        .control-btn.shoot {
            background: #ff4b4b;
            box-shadow: 0 0.8vmin 0 #d92f2f;
        }

        .control-btn:active:not(:disabled) {
            transform: translateY(0.8vmin);
            box-shadow: none;
        }

        .control-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .next-block {
            position: absolute;
            right: 3vmin;
            top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            background: #58cc02;
            color: white;
            border: 0.6vmin solid #7be52c;
            border-bottom: 1.2vmin solid #46a302;
            border-radius: 3vmin;
            padding: 2vmin 3.5vmin;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(18px, 3.6vmin, 32px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 1.2vmin 2vmin rgba(0,0,0,0.16);
            animation: popIn 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
        }

        .next-block:active { transform: translateY(calc(-50% + 0.8vmin)); border-bottom-width: 0.5vmin; }

        .retry-note {
            position: absolute;
            left: 50%;
            bottom: 18%;
            transform: translateX(-50%);
            z-index: 85;
            background: rgba(255,255,255,0.96);
            border: 0.5vmin solid #ffb4b4;
            border-bottom: 0.9vmin solid #ff7a7a;
            border-radius: 99px;
            padding: 1vmin 2.6vmin;
            color: #dc2626;
            font-size: clamp(12px, 2.3vmin, 20px);
            font-weight: 900;
            white-space: nowrap;
        }

        #ballWrapper {
            transition: left 0.32s ease, top 0.32s ease, transform 0.32s ease, opacity 0.2s ease;
        }

        #ballWrapper .ball.hop-once { animation: hopOnce 0.34s ease; }
        @keyframes hopOnce {
            0% { transform: translateY(0) rotate(0deg); }
            45% { transform: translateY(-5.2vmin) rotate(120deg); }
            100% { transform: translateY(0) rotate(240deg); }
        }

        @media (max-width: 700px) {
            .question-panel { top: 11%; }
            .question-bg { font-size: 6.3vmin; padding: 1.6vmin 4vmin; }
            .speak-btn { width: 9vmin; height: 9vmin; }
            .goal-post { width: 70vmin; height: 25vmin; }
            .number-line-zone { bottom: 2%; width: 98vw; }
            .number-line-track { padding: 0 0.5vmin; }
            .movement-controls { width: 94vw; }
            .next-block { top: auto; bottom: 20%; right: 2vmin; transform: none; }
            .next-block:active { transform: translateY(0.7vmin); }
            .retry-note { bottom: 21%; }
        }

    </style>
</head>
<body>

    <!-- Start Screen -->

        <div class="question-panel">

            <!-- Nút bấm nghe đọc phép tính -->

                <svg viewBox="0 0 24 24">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"/>

        <div class="number-line-zone" id="numberLineZone">

                <button class="control-btn move" id="leftBtn" type="button" onclick="moveBall(-1)">⬅ LEFT</button>
                <button class="control-btn shoot" id="shootBtn" type="button" onclick="shootCurrentAnswer()">⚽ SHOOT</button>

        </div>
        <div id="retryNote" class="retry-note hidden">Try again — no point this time.</div>
        <button id="nextBtn" class="next-block hidden" type="button" onclick="goNextQuestion()">NEXT ➡</button>

        <div class="ball-container" id="ballWrapper">
            <div class="ball">
                <!-- Quả bóng SVG Mới - Thiết kế 3D chân thực dạng Telstar -->
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="shine" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                            <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>

                    </defs>
                    <circle cx="50" cy="50" r="48" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>

                    <!-- Hình khối đen (Ngũ giác/Lục giác cắt) -->
                    <path d="M50 12 L65 24 L59 42 L41 42 L35 24 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M12 36 L25 28 L35 45 L25 60 L10 52 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M88 36 L75 28 L65 45 L75 60 L90 52 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M30 82 L41 68 L59 68 L70 82 L50 94 Z" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>

                    <!-- Các đường nối chìm (Seams) -->
                    <path d="M50 12 L50 2" stroke="#64748b" stroke-width="1.5"/>

                    <path d="M25 60 L41 68" stroke="#64748b" stroke-width="1.5"/>
                    <path d="M75 60 L59 68" stroke="#64748b" stroke-width="1.5"/>
                    <path d="M30 82 L15 88" stroke="#64748b" stroke-width="1.5"/>
                    <path d="M70 82 L85 88" stroke="#64748b" stroke-width="1.5"/>

    <script>
        // --- Audio Logic ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let ambienceNode;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            startAmbience();
        }

        function createNoiseBuffer() {
            if(!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
            return buffer;
        }

        function startAmbience() {
            if (!audioCtx) return;
            if (ambienceNode) try{ ambienceNode.stop(); } catch(e){}
            const noise = audioCtx.createBufferSource();
            noise.buffer = createNoiseBuffer();
            noise.loop = true;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 400;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.03;
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
            ambienceNode = noise;
        }

        function playSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;

            if (type === 'kick') {
                playNote(300, t, 0.1, 'triangle');
                playNote(150, t+0.05, 0.1, 'triangle');
            } else if (type === 'goal') {
                // Cheerful arpeggio
                playNote(523.25, t, 0.1, 'sine'); // C5
                playNote(659.25, t+0.1, 0.1, 'sine'); // E5
                playNote(783.99, t+0.2, 0.1, 'sine'); // G5
                playNote(1046.50, t+0.3, 0.3, 'sine'); // C6
            } else if (type === 'miss') {
                // Sad slide down
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.3);
                osc.start(t);
                osc.stop(t + 0.3);
            } else if (type === 'confetti') {
                playNote(440, t, 0.1, 'square');
                playNote(554.37, t+0.1, 0.1, 'square');
                playNote(659.25, t+0.2, 0.4, 'square');
            }
        }

        function playNote(freq, t, dur, type='sine') {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = type;
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.1, t);
            g.gain.linearRampToValueAtTime(0, t+dur);
            o.start(t);
            o.stop(t+dur);
        }

        // --- VER 2: Speech + Number Line Game Logic ---
        const totalQuestions = 10;
        let selectedMode = '0-10';
        let questionQueue = [];
        let currentQuestion = 0;
        let score = 0;
        let correctAnswer = 0;
        let currentBallValue = 0;
        let startBallValue = 0;
        let canInteract = false;
        let questionSolved = false;
        let firstAttemptEligible = true;

        const ballWrapper = document.getElementById('ballWrapper');
        const ballVisual = ballWrapper.querySelector('.ball');
        const questionText = document.getElementById('questionText');
        const questionCount = document.getElementById('questionCount');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const feedbackText = document.getElementById('feedbackText');
        const goalkeeper = document.getElementById('goalkeeper');
        const goalPost = document.querySelector('.goal-post');
        const numberLineTrack = document.getElementById('numberLineTrack');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const shootBtn = document.getElementById('shootBtn');
        const nextBtn = document.getElementById('nextBtn');
        const retryNote = document.getElementById('retryNote');

        const startScreen = document.getElementById('startScreen');
        const miniGameScreen = document.getElementById('miniGameScreen');
        const boxContainer = document.getElementById('boxContainer');
        const boxPhase = document.getElementById('boxPhase');
        const resultPhase = document.getElementById('resultPhase');
        const finalScoreDisplay = document.getElementById('finalScoreDisplay');
        const prizeDisplay = document.getElementById('prizeDisplay');

        function selectMode(mode) {
            selectedMode = mode;
            document.getElementById('mode0to10').classList.toggle('active', mode === '0-10');
            document.getElementById('mode10to20').classList.toggle('active', mode === '10-20');
        }

        function buildQuestionPool(mode, op) {
            const pool = [];
            if (mode === '0-10') {
                if (op === '+') {
                    for (let a = 0; a <= 9; a++) {
                        for (let b = 1; b <= 10 - a; b++) {
                            pool.push({ a, b, op, answer: a + b });
                        }
                    }
                } else {
                    for (let a = 1; a <= 10; a++) {
                        for (let b = 1; b <= a; b++) {
                            pool.push({ a, b, op, answer: a - b });
                        }
                    }
                }
            } else {
                if (op === '+') {
                    for (let a = 10; a <= 19; a++) {
                        for (let b = 1; b <= 20 - a; b++) {
                            pool.push({ a, b, op, answer: a + b });
                        }
                    }
                } else {
                    for (let a = 11; a <= 20; a++) {
                        for (let b = 1; b <= a - 10; b++) {
                            pool.push({ a, b, op, answer: a - b });
                        }
                    }
                }
            }
            return pool;
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function createQuestionQueue() {
            const plusPool = shuffle(buildQuestionPool(selectedMode, '+'));
            const minusPool = shuffle(buildQuestionPool(selectedMode, '-'));
            const queue = [];
            for (let i = 0; i < 5; i++) {
                queue.push(plusPool[i]);
                queue.push(minusPool[i]);
            }
            return queue;
        }

        function initGame() {
            initAudio();
            startScreen.classList.add('hidden');
            miniGameScreen.classList.add('hidden');
            boxPhase.classList.remove('hidden');
            resultPhase.classList.add('hidden');

            score = 0;
            currentQuestion = 0;
            scoreDisplay.innerText = score;
            questionQueue = createQuestionQueue();
            buildNumberLine();
            showQuestion();
        }

        function resetGame() {
            boxContainer.innerHTML = '';
            startScreen.classList.remove('hidden');
            miniGameScreen.classList.add('hidden');
            resultPhase.classList.add('hidden');
            boxPhase.classList.remove('hidden');
            feedbackText.style.opacity = 0;
            window.speechSynthesis?.cancel?.();
        }

        function buildNumberLine() {
            const min = selectedMode === '0-10' ? 0 : 10;
            numberLineTrack.innerHTML = '';
            for (let i = 0; i < 11; i++) {
                const value = min + i;
                const node = document.createElement('div');
                node.className = 'number-node';
                node.dataset.value = value;
                node.textContent = value;
                numberLineTrack.appendChild(node);
            }
        }

        function showQuestion() {
            if (currentQuestion >= totalQuestions) {
                endGame();
                return;
            }

            const q = questionQueue[currentQuestion];
            correctAnswer = q.answer;
            startBallValue = q.a;
            currentBallValue = q.a;
            firstAttemptEligible = true;
            questionSolved = false;
            canInteract = true;

            questionText.innerText = `${q.a} ${q.op} ${q.b} = ?`;
            questionCount.innerText = currentQuestion + 1;
            feedbackText.style.opacity = 0;
            feedbackText.style.transform = 'scale(0.5)';
            nextBtn.classList.add('hidden');
            retryNote.classList.add('hidden');
            resetGoalkeeper();
            updateControls();
            updateNumberLineState();

            requestAnimationFrame(() => {
                snapBallToValue(currentBallValue, false);
                setTimeout(() => speakQuestion(false), 350);
            });
        }

        function speechForCurrentQuestion(solved = false) {
            const q = questionQueue[currentQuestion];
            if (!q) return '';
            const opWord = q.op === '+' ? 'plus' : 'minus';
            if (solved) return `${q.a} ${opWord} ${q.b} equals ${q.answer}.`;
            return `${q.a} ${opWord} ${q.b} equals what?`;
        }

        function speakQuestion(solved = false) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(speechForCurrentQuestion(solved));
            utterance.lang = 'en-US';
            utterance.rate = 0.82;
            utterance.pitch = 1.15;
            window.speechSynthesis.speak(utterance);

            const btn = document.getElementById('speakBtn');
            btn.style.transform = 'scale(0.9)';
            setTimeout(() => btn.style.transform = '', 150);
        }

        function updateNumberLineState() {
            document.querySelectorAll('.number-node').forEach(node => {
                const value = Number(node.dataset.value);
                node.classList.toggle('start-node', value === startBallValue);
                node.classList.toggle('current-node', value === currentBallValue);
            });
        }

        function getNodeForValue(value) {
            return [...numberLineTrack.querySelectorAll('.number-node')]
                .find(n => Number(n.dataset.value) === value);
        }

        function snapBallToValue(value, animate = true) {
            const node = getNodeForValue(value);
            if (!node) return;
            const gameRect = document.getElementById('gameContainer').getBoundingClientRect();
            const nodeRect = node.getBoundingClientRect();
            const x = nodeRect.left - gameRect.left + nodeRect.width / 2;
            const y = nodeRect.top - gameRect.top - Math.max(4, nodeRect.height * 0.08);

            ballWrapper.style.bottom = 'auto';
            ballWrapper.style.left = `${x}px`;
            ballWrapper.style.top = `${y}px`;
            ballWrapper.style.opacity = 1;
            ballWrapper.style.transform = 'translate(-50%, -100%) scale(0.72)';
            ballWrapper.style.transition = animate
                ? 'left 0.32s ease, top 0.32s ease, transform 0.32s ease, opacity 0.2s ease'
                : 'none';

            if (animate) {
                ballVisual.classList.remove('hop-once');
                void ballVisual.offsetWidth;
                ballVisual.classList.add('hop-once');
                setTimeout(() => ballVisual.classList.remove('hop-once'), 360);
            }
        }

        function moveBall(direction) {
            if (!canInteract || questionSolved) return;
            const min = selectedMode === '0-10' ? 0 : 10;
            const max = selectedMode === '0-10' ? 10 : 20;
            const next = currentBallValue + direction;
            if (next < min || next > max) return;
            currentBallValue = next;
            updateNumberLineState();
            snapBallToValue(currentBallValue, true);
            playSound('kick');
            updateControls();
        }

        function updateControls() {
            const min = selectedMode === '0-10' ? 0 : 10;
            const max = selectedMode === '0-10' ? 10 : 20;
            leftBtn.disabled = !canInteract || currentBallValue <= min;
            rightBtn.disabled = !canInteract || currentBallValue >= max;
            shootBtn.disabled = !canInteract;
        }

        function resetGoalkeeper() {
            goalkeeper.style.transition = 'left 0.5s ease-out, transform 0.5s ease-out';
            goalkeeper.style.left = '50%';
            goalkeeper.style.transform = 'translateX(-50%) rotate(0deg)';
        }

        function shootCurrentAnswer() {
            if (!canInteract || questionSolved) return;
            canInteract = false;
            updateControls();
            playSound('kick');

            const isCorrect = currentBallValue === correctAnswer;
            const gameRect = document.getElementById('gameContainer').getBoundingClientRect();
            const goalRect = goalPost.getBoundingClientRect();
            const targetX = goalRect.left - gameRect.left + goalRect.width * (0.32 + Math.random() * 0.36);
            const targetY = goalRect.top - gameRect.top + goalRect.height * (0.42 + Math.random() * 0.18);

            ballWrapper.style.transition = 'left 0.72s cubic-bezier(0.2,0.6,0.35,1), top 0.72s cubic-bezier(0.2,0.6,0.35,1), transform 0.72s ease';

            if (isCorrect) {
                ballWrapper.style.left = `${targetX}px`;
                ballWrapper.style.top = `${targetY}px`;
                ballWrapper.style.transform = 'translate(-50%, -50%) scale(0.48) rotate(720deg)';

                const dive = Math.random() > 0.5 ? 120 : -120;
                goalkeeper.style.transform = `translateX(-50%) translateX(${dive}px) rotate(${dive > 0 ? 42 : -42}deg)`;
                setTimeout(handleCorrectShot, 760);
            } else {
                firstAttemptEligible = false;
                const caught = Math.random() > 0.45;
                if (caught) {
                    const gkCenterX = goalRect.left - gameRect.left + goalRect.width / 2;
                    const gkCenterY = goalRect.top - gameRect.top + goalRect.height * 0.68;
                    ballWrapper.style.left = `${gkCenterX}px`;
                    ballWrapper.style.top = `${gkCenterY}px`;
                    ballWrapper.style.transform = 'translate(-50%, -50%) scale(0.52) rotate(540deg)';
                    goalkeeper.style.transform = 'translateX(-50%) translateY(-2vmin) scale(1.08)';
                } else {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    ballWrapper.style.left = `${goalRect.left - gameRect.left + goalRect.width/2 + side * goalRect.width * 0.72}px`;
                    ballWrapper.style.top = `${goalRect.top - gameRect.top + goalRect.height * 0.32}px`;
                    ballWrapper.style.transform = 'translate(-50%, -50%) scale(0.48) rotate(720deg)';
                    goalkeeper.style.transform = `translateX(-50%) translateX(${-side * 70}px) rotate(${-side * 25}deg)`;
                }
                setTimeout(handleWrongShot, 760);
            }
        }

        function handleCorrectShot() {
            questionSolved = true;
            if (firstAttemptEligible) {
                score++;
                scoreDisplay.innerText = score;
            }

            feedbackText.innerText = firstAttemptEligible ? 'GOAL!!!' : 'GOAL!';
            feedbackText.className = 'feedback-text text-[#fde047]';
            feedbackText.style.textShadow = '0 1vmin 0 #ca8a04';
            feedbackText.style.opacity = 1;
            feedbackText.style.transform = 'scale(1)';
            playSound('goal');

            const q = questionQueue[currentQuestion];
            questionText.innerText = `${q.a} ${q.op} ${q.b} = ${q.answer}`;
            retryNote.classList.add('hidden');
            nextBtn.classList.remove('hidden');
            setTimeout(() => speakQuestion(true), 260);
        }

        function handleWrongShot() {
            feedbackText.innerText = 'TRY AGAIN!';
            feedbackText.className = 'feedback-text text-[#ef4444]';
            feedbackText.style.textShadow = '0 1vmin 0 #991b1b';
            feedbackText.style.opacity = 1;
            feedbackText.style.transform = 'scale(1)';
            retryNote.classList.remove('hidden');
            playSound('miss');

            setTimeout(() => {
                feedbackText.style.opacity = 0;
                feedbackText.style.transform = 'scale(0.5)';
                resetGoalkeeper();
                currentBallValue = startBallValue;
                updateNumberLineState();
                snapBallToValue(currentBallValue, false);
                canInteract = true;
                updateControls();
            }, 1050);
        }

        function goNextQuestion() {
            if (!questionSolved) return;
            currentQuestion++;
            showQuestion();
        }

        function endGame() {
            canInteract = false;
            updateControls();
            window.speechSynthesis?.cancel?.();
            miniGameScreen.classList.remove('hidden');
            startMiniGame();
        }

        window.addEventListener('resize', () => {
            if (!startScreen.classList.contains('hidden') || miniGameScreen.classList.contains('hidden') === false) return;
            if (!questionSolved) requestAnimationFrame(() => snapBallToValue(currentBallValue, false));
        });

        // --- Mini Game Logic ---
        function startMiniGame() {
            boxContainer.innerHTML = '';

            let reward = "";
            let rewardStyle = "";
            if (score >= 8) {
                reward = "🏆";
                rewardStyle = "filter: drop-shadow(0 0 10px gold); font-size: 10vmin;";
            } else if (score >= 5) {
                reward = "🥈";
                rewardStyle = "filter: grayscale(100%) brightness(120%) drop-shadow(0 0 10px silver); font-size: 10vmin;";
            } else {
                reward = "⭐";
                rewardStyle = "filter: drop-shadow(0 0 10px gold); font-size: 10vmin;";
            }

            const boxes = [];
            const winningIndex = Math.floor(Math.random() * 3);

            for(let i=0; i<3; i++) {
                const box = document.createElement('div');
                box.className = `mystery-box pos-${i}`;
                box.dataset.index = i;

                const lid = document.createElement('div');
                lid.className = "box-lid-mark";
                lid.innerText = "?";
                box.appendChild(lid);

                const content = document.createElement('div');
                content.className = "mystery-content";

                if (i === winningIndex) {
                    content.innerHTML = reward;
                    content.style.cssText = rewardStyle;
                    box.dataset.type = "win";
                } else {
                    content.innerText = "💨";
                    content.style.cssText = "font-size: 10vmin;";
                    box.dataset.type = "lose";
                }

                box.appendChild(content);
                boxContainer.appendChild(box);
                boxes.push(box);
            }

            setTimeout(() => {
                const winBox = boxes[winningIndex];
                winBox.classList.add('open', 'highlight');
                playSound('goal');

                setTimeout(() => {
                    winBox.classList.remove('open', 'highlight');
                    setTimeout(() => shuffleBoxes(boxes), 500);
                }, 2000);
            }, 500);
        }

        function shuffleBoxes(boxes) {
            let shuffles = 0;
            const maxShuffles = 8; // Kept short to not lose toddler's attention
            let currentPositions = [0, 1, 2];

            const interval = setInterval(() => {
                shuffles++;
                currentPositions.sort(() => Math.random() - 0.5);

                boxes.forEach((box, index) => {
                    box.classList.remove('pos-0', 'pos-1', 'pos-2');
                    box.classList.add(`pos-${currentPositions[index]}`);
                    box.style.transform = "scale(0.9)";
                    setTimeout(() => box.style.transform = "scale(1)", 200);
                });

                if (shuffles >= maxShuffles) {
                    clearInterval(interval);
                    setTimeout(() => enableBoxPicking(boxes), 500);
                }
            }, 500);
        }

        function enableBoxPicking(boxes) {
            boxes.forEach(box => {
                box.onclick = () => {
                    if (box.classList.contains('open')) return;

                    boxes.forEach(b => b.onclick = null);
                    box.classList.add('open');
                    let isWin = box.dataset.type === "win";

                    if (isWin) {
                        playSound('goal');
                    } else {
                        playSound('miss');
                        const winBox = boxes.find(b => b.dataset.type === "win");
                        if(winBox) winBox.classList.add('open');
                    }

                    // Transition to Final Summary
                    setTimeout(() => {
                        boxPhase.classList.add('hidden');
                        resultPhase.classList.remove('hidden');
                        finalScoreDisplay.innerText = `${score}/10`;

                        // Luôn hiển thị bắn pháo giấy ở phần tổng kết
                        startConfetti();

                        if (isWin) {
                            prizeDisplay.innerHTML = box.querySelector('.mystery-content').innerHTML;
                            prizeDisplay.className = "text-[15vmin] drop-shadow-lg mb-6 animate-bounce";
                        } else {
                            prizeDisplay.innerHTML = "😊"; // Keep it positive
                            prizeDisplay.className = "text-[15vmin] drop-shadow-lg mb-6";
                        }
                    }, 1500);
                }
            });
        }

        // --- Beautiful Falling Confetti System ---
        const cvs = document.getElementById('fireworks');
        const ctx = cvs.getContext('2d');
        let confettis = [];
        let fwInterval;

        function resizeCvs() {
            cvs.width = window.innerWidth;
            cvs.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCvs);
        resizeCvs();

        class ConfettiParticle {
            constructor() {
                this.x = Math.random() * cvs.width;
                this.y = Math.random() * cvs.height - cvs.height; // Start off-screen
                this.w = Math.random() * 15 + 10;
                this.h = Math.random() * 10 + 5;
                this.vx = Math.random() * 4 - 2;
                this.vy = Math.random() * 3 + 3;
                const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ffd166', '#06d6a0', '#118ab2', '#58cc02', '#ffb703', '#fde047', '#a855f7'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.tilt = Math.floor(Math.random() * 10) - 10;
                this.tiltAngleInc = (Math.random() * 0.07) + 0.05;
                this.tiltAngle = 0;
            }
            update() {
                this.tiltAngle += this.tiltAngleInc;
                this.y += this.vy;
                this.x += Math.sin(this.tiltAngle) * 2;
                this.tilt = Math.sin(this.tiltAngle) * 15;
                if (this.y > cvs.height) {
                    this.y = -20;
                    this.x = Math.random() * cvs.width;
                }
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.lineWidth = this.w;
                ctx.strokeStyle = this.color;
                ctx.moveTo(this.x + this.tilt + this.w / 2, this.y);
                ctx.lineTo(this.x + this.tilt, this.y + this.tilt + this.h);
                ctx.stroke();
            }
        }

        function startConfetti() {
            confettis = [];
            for(let i=0; i<150; i++) {
                confettis.push(new ConfettiParticle());
            }
            playSound('confetti');
            if(fwInterval) clearInterval(fwInterval);
            loopConfetti();
        }

        function loopConfetti() {
            if(resultPhase.classList.contains('hidden')) {
                ctx.clearRect(0,0,cvs.width, cvs.height);
                return;
            }
            ctx.clearRect(0,0,cvs.width, cvs.height);
            confettis.forEach(c => {
                c.update();
                c.draw(ctx);
            });
            requestAnimationFrame(loopConfetti);
        }
    </script>
</body>
</html>

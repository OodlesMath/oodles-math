button{font:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.screen{position:absolute;inset:0;z-index:10;overflow:hidden}
#brand{position:fixed;top:2.5%;right:2%;z-index:55;width:134px;max-width:17vw;line-height:.86;text-align:center;color:#144875;text-shadow:0 1px 0 #fff;font-weight:900;font-size:clamp(12px,1.55vw,24px);pointer-events:none;letter-spacing:.035em}
#brand:before{content:'◉◉';color:#ff5e68;letter-spacing:-.25em;margin-right:.18em;font-size:1.1em}
.btn-3d{border-bottom-width:6px!important;border-bottom-style:solid;transition:transform .12s,border-bottom-width .12s,filter .15s}
.btn-3d:active:not(:disabled){transform:translateY(5px);border-bottom-width:1px!important}
.btn-3d:hover:not(:disabled){filter:brightness(1.035)}
#setup-screen,#end-screen{display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(245,250,255,.3);backdrop-filter:blur(6px)}
.modal{position:relative;background:rgba(255,255,255,.97);width:min(450px,94vw);padding:30px 32px;border-radius:44px;text-align:center;box-shadow:0 20px 50px #13233e33;border-bottom:8px solid var(--cyan)}
.setup-title{font-weight:900;color:var(--blue);font-size:clamp(30px,4vw,45px);line-height:1.12;margin:0 0 7px;letter-spacing:-1px}
.setup-sub{color:#6b7280;font-size:18px;font-weight:800;margin:0 0 23px}
.setup-box{background:#f2f4f6;border:2px solid #e5e7eb;border-radius:24px;padding:16px;margin-bottom:25px}
.small-label{font-size:14px;letter-spacing:.08em;font-weight:800;color:#64748b;margin:0 0 12px}
.range-row{display:flex;justify-content:center;gap:9px}
.range-btn{border:0;border-bottom-color:#9ca3af;padding:10px 17px;background:#d1d5db;color:#58616f;border-radius:16px;font-weight:900;font-size:21px}
.range-btn.selected{color:#fff;background:var(--cyan);border-bottom-color:var(--cyanDark)}
.big-btn{border:0;width:100%;padding:14px;background:var(--green);border-bottom-color:var(--greenDark);color:white;font-size:clamp(22px,3vw,29px);border-radius:17px;font-weight:900;letter-spacing:.06em}
#game-screen{z-index:20}
#hud{position:absolute;top:2.9%;left:1.3%;z-index:35;display:flex;gap:12px}
.hud-card{background:rgba(255,255,255,.96);border-radius:21px;box-shadow:0 7px 1px #64748b26;padding:10px 19px;border-bottom:4px solid #e5e7eb;font-size:clamp(17px,2vw,31px);font-weight:900;white-space:nowrap;line-height:1.4}
.hud-card.question{color:var(--blue)}.hud-card.points{color:#f4ba00}
#instruction-outer{position:absolute;top:10.2%;left:50%;transform:translateX(-50%);z-index:35;pointer-events:none;width:max-content;max-width:95vw}
#instruction-box{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 19px 14px 27px;background:#ffffffef;border:2px solid white;border-bottom:5px solid #cfd8df;border-radius:38px;box-shadow:0 13px 30px #253a4b2d;pointer-events:auto;max-width:100%}
#ui-instruction{font-size:clamp(17px,2.4vw,40px);line-height:1.18;font-weight:900;text-align:center;white-space:nowrap}
#btn-tts{width:clamp(47px,5vw,80px);height:clamp(47px,5vw,80px);border:0;border-bottom-color:var(--cyanDark);border-radius:50%;background:var(--cyan);color:#fff;display:grid;place-items:center;flex-shrink:0}
#btn-tts svg{width:56%;height:56%}
/* Transparent interactive window sits exactly on the windows painted in the illustration. */
#dropzone-bus{position:absolute;left:11.8%;top:46.9%;width:38.7%;height:15.7%;z-index:24;display:flex;flex-wrap:wrap;align-content:center;justify-content:space-evenly;align-items:center;gap:1px 3px;border-radius:14px;padding:3px 5px;transition:background .15s,outline-color .15s}
#dropzone-bus.dropzone-active{background:rgba(88,204,2,.18);outline:4px dashed rgba(50,190,19,.7);outline-offset:-2px}
#stop-scene{position:absolute;left:62.5%;top:43.5%;width:34.5%;height:36%;z-index:22;pointer-events:none}
#busstop-sign{position:absolute;left:41%;bottom:85%;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(2px 4px 4px #0003);pointer-events:none}
#busstop-sign .face{width:clamp(52px,6.1vw,111px);height:clamp(52px,6.1vw,111px);border-radius:11px;border:4px solid #232a3f;background:#ffd800;display:grid;place-items:center;text-align:center;color:#17243a;font-weight:900;font-size:clamp(12px,1.4vw,19px);line-height:1.15}
#busstop-sign .pole{height:clamp(21px,3.4vw,48px);width:12px;background:#a6acb5;border-left:2px solid #747a82;border-right:2px solid #747a82}
#dropzone-stop{position:absolute;inset:0;border:5px dashed #64748b;border-radius:50px;background:rgba(240,255,239,.67);backdrop-filter:blur(2px);box-shadow:0 11px 30px #0002;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;align-items:center;gap:2px 6px;padding:12px 15px;pointer-events:auto;transition:background .15s}
#dropzone-stop.dropzone-active{border-color:var(--green);background:rgba(191,255,176,.83);box-shadow:0 0 25px #4abf353e inset}
.student-icon{display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;touch-action:none;position:relative;filter:drop-shadow(0 3px 3px #0004);transition:transform .13s cubic-bezier(.175,.885,.32,1.275);z-index:1}
.student-icon:hover{transform:scale(1.13)}.student-icon:active{transform:scale(1.19) rotate(-3deg)}
.student-icon img{width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.student-icon.draggable{animation:tinyPulse 2.4s infinite ease-in-out}
@keyframes tinyPulse{0%,100%{filter:drop-shadow(0 3px 3px #0004)}50%{filter:drop-shadow(0 4px 3px #c8dafa) brightness(1.08)}}
.student-icon.is-dragging{position:fixed!important;z-index:9999!important;margin:0!important;transform:scale(1.25) rotate(-8deg)!important;pointer-events:none!important;filter:drop-shadow(0 10px 9px #0007)!important;animation:none!important}
#answer-panel{position:absolute;bottom:0;left:0;width:100%;z-index:45;background:transparent;border:0;border-radius:0;box-shadow:none;padding:17px 20px 22px;transform:translateY(105%);transition:transform .48s ease}
#ui-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,24px);max-width:780px;margin:8px auto}
.btn-answer{background:var(--cyan);color:white;border:3px solid var(--cyanDark);border-bottom-color:var(--cyanDark);border-bottom-width:8px!important;border-radius:18px;font-size:clamp(26px,3.6vw,51px);font-weight:900;padding:9px 3px;line-height:1.4;text-align:center;box-shadow:0 3px 5px #0002}
.btn-answer.correct{background:var(--green);border-color:var(--greenDark)}.btn-answer.wrong{background:var(--red);border-color:#e54343}
.btn-answer:disabled{cursor:default}
.math-line{display:flex;justify-content:center;align-items:center;gap:clamp(8px,1.2vw,18px);font-size:clamp(30px,3.5vw,60px);font-weight:900}
.num-a{color:#159fc7}.num-b{color:#e9a700}.math-symbol{color:#99a3b0}.num-result{color:#b9c0c9}.num-result.correct{color:var(--green)}
#end-screen{z-index:60;background:#1f293766;backdrop-filter:blur(5px)}
.end-modal{width:min(520px,95vw);padding:30px 42px 34px;border-bottom:10px solid var(--cyan);border-radius:44px}
.end-title{font-size:clamp(36px,5vw,64px);margin:0 0 4px;font-weight:900;letter-spacing:-2px;color:var(--cyanDark)}
#ui-stars{font-size:clamp(45px,6vw,84px);margin:5px 0 7px;line-height:1.4;animation:bobbing 1.6s infinite alternate}
@keyframes bobbing{to{transform:translateY(-7px)}}
.end-score{font-size:26px;line-height:1.35;letter-spacing:.16em;font-weight:900;color:#a6a6aa;margin-bottom:25px}
#ui-final-score{display:block;font-size:clamp(58px,7vw,98px);color:var(--green);letter-spacing:0}
#btn-replay{background:var(--pink);border-bottom-color:var(--pinkDark);font-size:clamp(22px,3vw,35px)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
@media(max-height:610px){#instruction-outer{top:8%}#instruction-box{padding:7px 13px 7px 21px}#dropzone-stop{padding:4px 10px}.hud-card{padding:6px 12px}.student-icon{filter:none}}

const AudioSys={ctx:null,init(){try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},playTone(freq,type,duration,vol=.1){if(!this.ctx)return;try{const osc=this.ctx.createOscillator(),gain=this.ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,this.ctx.currentTime);gain.gain.setValueAtTime(vol,this.ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+duration);osc.connect(gain);gain.connect(this.ctx.destination);osc.start();osc.stop(this.ctx.currentTime+duration)}catch(e){}},pop(){this.playTone(600,'sine',.1,.1)},correct(){this.playTone(500,'sine',.1);setTimeout(()=>this.playTone(800,'sine',.2),100)},wrong(){this.playTone(250,'sawtooth',.2);setTimeout(()=>this.playTone(200,'sawtooth',.3),150)},win(){[500,600,700,800,1200].forEach((f,i)=>setTimeout(()=>this.playTone(f,'square',.15),i*150))}};

document.querySelectorAll('.range-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');state.maxRange=Number(btn.dataset.range)}));
function generateQuestion(){let a,b,answer,type,signature,attempts=0;type=state.qNum%2===1?'add':'sub';do{if(type==='add'){answer=Math.floor(Math.random()*(state.maxRange-4))+5;a=Math.floor(Math.random()*(answer-1))+1;b=answer-a}else{a=Math.floor(Math.random()*(state.maxRange-5))+6;b=Math.floor(Math.random()*(a-1))+1;answer=a-b}signature=`${a}${type}${b}`;attempts++}while(state.usedQuestions.has(signature)&&attempts<100);state.usedQuestions.add(signature);return{type,a,b,answer}}
function generateChoices(correct){const choices=new Set([correct]);while(choices.size<4){const offset=Math.floor(Math.random()*11)-5;if(!offset)continue;const wrong=correct+offset;if(wrong>=0&&wrong<=state.maxRange+5)choices.add(wrong)}return [...choices].sort(()=>Math.random()-.5)}
function iconSize(container,count){/* Small enough to show 50 animals without obscuring the bus windows */const area=container.getBoundingClientRect();const busArea=ui.busZone.getBoundingClientRect();const width=Math.min(area.width,busArea.width)-15,height=Math.min(area.height,busArea.height)-10;let px=count>30?27:count>15?38:55;const min=window.innerWidth<500?10:17;for(;px>min;px--){const cols=Math.max(1,Math.floor(width/(px+3))),rows=Math.max(1,Math.floor(height/(px+3)));if(cols*rows>=count)break}return Math.max(min,px)}
function renderStudents(container,count,draggable){container.innerHTML='';const size=iconSize(container,count);const fragment=document.createDocumentFragment();for(let i=0;i<count;i++){const animalIndex=Math.floor(Math.random()*animalData.length);const el=document.createElement('div');el.className=`student-icon ${draggable?'draggable':''}`;el.style.width=size+'px';el.style.height=size+'px';el.setAttribute('role','img');el.setAttribute('aria-label',animalNames[animalIndex]);el.innerHTML=`<img src="${animalData[animalIndex]}" alt="${animalNames[animalIndex]}" draggable="false">`;if(draggable)setupDraggable(el);fragment.appendChild(el)}container.appendChild(fragment)}
function loadQuestion(){if(state.qNum>=state.totalQ)return endGame();state.qNum++;state.firstTry=true;state.dragTaskDone=false;state.currentQ=generateQuestion();const q=state.currentQ;ui.qnum.textContent=state.qNum;ui.panel.style.transform='translateY(105%)';if(q.type==='add'){renderStudents(ui.busZone,q.a,false);renderStudents(ui.stopZone,q.b,true);state.speechText=`Drag ${q.b} animals onto the bus.`}else{renderStudents(ui.busZone,q.a,true);renderStudents(ui.stopZone,0,false);state.speechText=`Drag ${q.b} animals off the bus.`}ui.instruction.textContent=state.speechText;syncAnimalSizes();speak(state.speechText)}
function syncAnimalSizes(){const q=state.currentQ;if(!q)return;const count=q.type==='add'?q.a+q.b:q.a;const size=iconSize(ui.busZone,count);document.querySelectorAll('#dropzone-bus .student-icon, #dropzone-stop .student-icon').forEach(el=>{if(!el.classList.contains('is-dragging')){el.style.width=size+'px';el.style.height=size+'px'}})}
function checkDragTask(){const q=state.currentQ;if(!q||state.dragTaskDone)return;const done=q.type==='add'?(ui.busZone.children.length===q.a+q.b&&ui.stopZone.children.length===0):(ui.stopZone.children.length===q.b&&ui.busZone.children.length===q.a-q.b);if(!done)return;state.dragTaskDone=true;document.querySelectorAll('.draggable').forEach(el=>el.classList.remove('draggable'));const sign=q.type==='add'?'+':'−';ui.instruction.innerHTML=`<div class="math-line"><span class="num-a">${q.a}</span><span class="math-symbol">${sign}</span><span class="num-b">${q.b}</span><span class="math-symbol">=</span><span id="math-result" class="num-result">?</span></div>`;ui.choices.innerHTML='';generateChoices(q.answer).forEach(val=>{const btn=document.createElement('button');btn.className='btn-answer btn-3d';btn.textContent=val;btn.onclick=()=>handleAnswer(btn,val);ui.choices.appendChild(btn)});state.speechText=`${q.a} ${q.type==='add'?'plus':'minus'} ${q.b} equals what?`;speak(state.speechText);ui.panel.style.transform='translateY(0)'}
function handleAnswer(btn,val){const correct=val===state.currentQ.answer;const btns=[...document.querySelectorAll('.btn-answer')];btns.forEach(b=>b.disabled=true);if(correct){btn.classList.add('correct');AudioSys.correct();const result=$('math-result');if(result){result.textContent=val;result.classList.add('correct')}if(state.firstTry){state.score++;ui.score.textContent=state.score}setTimeout(loadQuestion,1500)}else{btn.classList.add('wrong');AudioSys.wrong();state.firstTry=false;const oldHTML=ui.instruction.innerHTML;ui.instruction.innerHTML='<span style="color:#FF4B4B">Try again!</span>';speak('Try again!');setTimeout(()=>{ui.instruction.innerHTML=oldHTML;btn.classList.remove('wrong');btns.forEach(b=>b.disabled=false)},1000)}}
/* Pointer/tap-to-move interactions from Ver 1; drop outside the correct zone returns the animal. */
let activeDrag=null,startX=0,startY=0,initLeft=0,initTop=0,dragPointerId=null;
function setupDraggable(el){el.addEventListener('pointerdown',e=>{if(!el.classList.contains('draggable')||state.dragTaskDone||activeDrag)return;if(state.currentQ.type==='add'&&el.parentElement===ui.busZone)return;if(state.currentQ.type==='sub'&&el.parentElement===ui.stopZone)return;e.preventDefault();activeDrag=el;dragPointerId=e.pointerId;AudioSys.init();const rect=el.getBoundingClientRect();initLeft=rect.left;initTop=rect.top;startX=e.clientX;startY=e.clientY;el.dataset.moved='false';document.body.appendChild(el);el.classList.add('is-dragging');el.style.left=initLeft+'px';el.style.top=initTop+'px';try{el.setPointerCapture(e.pointerId)}catch(ex){}if(state.currentQ.type==='add')ui.busZone.classList.add('dropzone-active');else ui.stopZone.classList.add('dropzone-active')})}
function moveDrag(e){if(!activeDrag||e.pointerId!==dragPointerId)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>5||Math.abs(dy)>5)activeDrag.dataset.moved='true';activeDrag.style.left=(initLeft+dx)+'px';activeDrag.style.top=(initTop+dy)+'px'}
function finishDrag(e){if(!activeDrag||e.pointerId!==dragPointerId)return;const el=activeDrag;const q=state.currentQ;const tap=el.dataset.moved!=='true';try{if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId)}catch(ex){}el.classList.remove('is-dragging');el.style.position='';el.style.left='';el.style.top='';ui.busZone.classList.remove('dropzone-active');ui.stopZone.classList.remove('dropzone-active');if(tap){(q.type==='add'?ui.busZone:ui.stopZone).appendChild(el);el.classList.remove('draggable');AudioSys.pop();syncAnimalSizes();checkDragTask()}else{el.style.display='none';const below=document.elementFromPoint(e.clientX,e.clientY);el.style.display='flex';const zone=below?below.closest('#dropzone-bus,#dropzone-stop'):null;const valid=zone&&((q.type==='add'&&zone===ui.busZone)||(q.type==='sub'&&zone===ui.stopZone));if(valid){zone.appendChild(el);el.classList.remove('draggable');AudioSys.pop();syncAnimalSizes();checkDragTask()}else{(q.type==='add'?ui.stopZone:ui.busZone).appendChild(el)}}activeDrag=null;dragPointerId=null}
document.addEventListener('pointermove',moveDrag);document.addEventListener('pointerup',finishDrag);document.addEventListener('pointercancel',e=>{if(!activeDrag)return;const q=state.currentQ;activeDrag.classList.remove('is-dragging');activeDrag.style.cssText='';(q.type==='add'?ui.stopZone:ui.busZone).appendChild(activeDrag);activeDrag=null;dragPointerId=null;ui.busZone.classList.remove('dropzone-active');ui.stopZone.classList.remove('dropzone-active')});
$('btn-start').onclick=()=>{AudioSys.init();screens.setup.classList.add('hidden');screens.game.classList.remove('hidden');state.qNum=0;state.score=0;state.currentQ=null;state.usedQuestions.clear();ui.score.textContent='0';loadQuestion()};
$('btn-tts').onclick=()=>speak(state.speechText);
$('btn-replay').onclick=()=>{screens.end.classList.add('hidden');screens.setup.classList.remove('hidden');state.usedQuestions.clear();if(window.speechSynthesis)window.speechSynthesis.cancel()};
function endGame(){screens.game.classList.add('hidden');screens.end.classList.remove('hidden');AudioSys.win();$('ui-final-score').textContent=`${state.score}/${state.totalQ}`;$('ui-stars').textContent=state.score>=9?'⭐⭐⭐':state.score>=6?'⭐⭐':state.score>=3?'⭐':'🌱';startConfetti()}
let confettiCtx,confettiParticles=[],confettiLoop;
function startConfetti(){const canvas=$('confetti');canvas.width=innerWidth;canvas.height=innerHeight;confettiCtx=canvas.getContext('2d');confettiParticles=[];const colors=['#1CB0F6','#58CC02','#FFC800','#FF4B4B','#FF71C6'];for(let i=0;i<200;i++)confettiParticles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,w:Math.random()*15+10,h:Math.random()*15+10,color:colors[Math.floor(Math.random()*colors.length)],vy:Math.random()*6+3,vx:Math.random()*6-3,rot:Math.random()*360,rotSpeed:Math.random()*15-7});cancelAnimationFrame(confettiLoop);confettiLoop=requestAnimationFrame(drawConfetti)}
function drawConfetti(){if(screens.end.classList.contains('hidden'))return;confettiCtx.clearRect(0,0,confettiCtx.canvas.width,confettiCtx.canvas.height);confettiParticles.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.rotSpeed;if(p.y>confettiCtx.canvas.height){p.y=-20;p.x=Math.random()*confettiCtx.canvas.width}confettiCtx.save();confettiCtx.translate(p.x,p.y);confettiCtx.rotate(p.rot*Math.PI/180);confettiCtx.fillStyle=p.color;confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);confettiCtx.restore()});confettiLoop=requestAnimationFrame(drawConfetti)}
window.addEventListener('resize',()=>{if(!screens.end.classList.contains('hidden')){const canvas=$('confetti');canvas.width=innerWidth;canvas.height=innerHeight}});
</script>
</body>

    .safe-logo-zone{position:absolute;top:0;right:0;width:min(22vw,340px);height:min(17vh,150px);z-index:2;pointer-events:none}

    /* MAIN HUD */
    #gameUI{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:18px 20px 20px;pointer-events:none}
    .hud{width:min(1040px,calc(100vw - 40px));height:72px;display:grid;grid-template-columns:240px minmax(320px,520px) 240px;align-items:center;gap:20px;pointer-events:auto}
    .brand-card{justify-self:start;background:rgba(255,255,255,.88);border:3px solid rgba(255,255,255,.95);border-radius:22px;padding:9px 16px;box-shadow:0 8px 22px rgba(35,93,130,.16);backdrop-filter:blur(7px)}
    .brand-card b{display:block;font-size:18px;font-weight:900;color:#6950d8;line-height:1.05}.brand-card span{font-size:11px;font-weight:800;color:#58708c}
    .progress-wrap{width:100%;align-self:center}
    .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;font-weight:900;color:#31506f;text-shadow:0 2px 0 rgba(255,255,255,.75)}
    .progress-shell{height:18px;background:rgba(255,255,255,.8);border:3px solid #fff;border-radius:999px;overflow:hidden;box-shadow:0 5px 14px rgba(31,84,122,.15)}
    .progress-bar{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#b8ec25);border-radius:999px;transition:width .45s cubic-bezier(.34,1.56,.64,1)}
    .hud-actions{justify-self:start;display:flex;gap:9px}
    .round-btn{width:46px;height:46px;border:3px solid #fff;border-radius:16px;background:rgba(255,255,255,.91);box-shadow:0 6px 0 rgba(70,115,145,.22);display:grid;place-items:center;font-size:22px;cursor:pointer;color:#35536d;transition:.1s}
    .round-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(70,115,145,.22)}

    /* QUESTION PANEL */
    #questionPanel{pointer-events:auto;margin:auto 0;transform:translateY(-8px);width:min(820px,calc(100vw - 44px));background:var(--paper);border:5px solid rgba(255,255,255,.96);border-radius:34px;box-shadow:var(--shadow);backdrop-filter:blur(9px);padding:22px 28px 25px;position:relative}
    .instruction{text-align:center;margin-bottom:8px}.instruction h1{font-size:clamp(20px,2.4vw,29px);margin:0;color:#334b69;font-weight:900}.instruction p{margin:3px 0 0;font-size:clamp(12px,1.3vw,15px);font-weight:700;color:#71839a}
    .question-grid{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:center;min-height:245px}
    .ordinal-box{display:flex;align-items:center;justify-content:center;position:relative;height:235px}
    .ordinal-art{width:170px;height:235px;background-image:var(--icons);background-size:500% 200%;background-repeat:no-repeat;filter:drop-shadow(0 10px 8px rgba(45,73,102,.15));transform:scale(1.08)}
    .speak-btn{position:absolute;bottom:7px;right:10px;width:48px;height:48px;border:none;border-radius:50%;background:#1cb0f6;color:#fff;box-shadow:0 6px 0 #1687c8;font-size:22px;cursor:pointer}.speak-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #1687c8}
    .spell-zone{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
    .slot-row{width:100%;display:flex;justify-content:center;gap:clamp(6px,1vw,11px);margin:6px 0 17px;min-height:70px}
    .slot{width:clamp(47px,5.4vw,62px);height:clamp(58px,6.6vw,72px);border:4px dashed #93b7d0;border-radius:17px;background:rgba(255,255,255,.82);box-shadow:inset 0 -5px 0 rgba(98,142,172,.08);display:grid;place-items:center;transition:.15s;position:relative}
    .slot.filled{border-style:solid;border-color:#b6d7eb;background:#fff;box-shadow:0 6px 0 #dcecf6}.slot.drop-ready{transform:scale(1.06);border-color:#1cb0f6;background:#e8f7ff}.slot.wrong{animation:shake .38s;border-color:#ff4b4b;background:#fff1f1}.slot.correct{border-color:#58cc02;background:#eaffdf;box-shadow:0 6px 0 #bdeba4}
    .slot-letter{font-size:clamp(26px,3vw,36px);font-weight:900;color:#274060;cursor:pointer;user-select:none}
    .letter-bank{width:100%;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;min-height:72px;padding:8px 6px 2px}
    .letter-tile,.drag-ghost{width:clamp(48px,5.5vw,62px);height:clamp(55px,6.2vw,68px);border:3px solid rgba(255,255,255,.85);border-radius:17px;display:grid;place-items:center;color:white;font-size:clamp(24px,2.8vw,34px);font-weight:900;text-shadow:0 2px 2px rgba(0,0,0,.12);box-shadow:0 7px 0 rgba(42,87,117,.20);cursor:grab;user-select:none;transition:transform .12s,filter .12s,opacity .12s}.letter-tile:hover{transform:translateY(-3px) scale(1.03);filter:brightness(1.06)}.letter-tile:active{cursor:grabbing}.letter-tile:nth-child(6n+1),.drag-ghost.c1{background:#ff5aa5}.letter-tile:nth-child(6n+2),.drag-ghost.c2{background:#1cb0f6}.letter-tile:nth-child(6n+3),.drag-ghost.c3{background:#8b5cf6}.letter-tile:nth-child(6n+4),.drag-ghost.c4{background:#ff9600}.letter-tile:nth-child(6n+5),.drag-ghost.c5{background:#58cc02}.letter-tile:nth-child(6n),.drag-ghost.c6{background:#ef5350}
    .drag-ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.92;box-shadow:0 14px 24px rgba(0,0,0,.2)}
    .feedback{height:28px;text-align:center;font-size:17px;font-weight:900;margin-top:8px}.feedback.good{color:#3da300}.feedback.bad{color:#ef4444}

    /* MINI GAME */
    #miniGame{position:absolute;inset:0;z-index:30;display:none;overflow:hidden;background:transparent;pointer-events:auto}
    #miniGame.show{display:block}
    .mini-hud{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:35;min-width:330px;background:rgba(255,255,255,.9);border:4px solid #fff;border-radius:24px;box-shadow:0 10px 25px rgba(38,86,118,.18);padding:10px 20px;text-align:center;backdrop-filter:blur(7px)}
    .mini-hud b{font-size:19px;font-weight:900;color:#7554db}.mini-sub{font-size:12px;font-weight:800;color:#607990;margin-top:2px}.mini-stats{display:flex;justify-content:center;gap:20px;margin-top:6px;font-size:15px;font-weight:900}.mini-stats span:first-child{color:#e89000}.mini-stats span:last-child{color:#1b8bc2}
    .falling-icon{position:absolute;width:90px;height:126px;background-image:var(--icons);background-size:500% 200%;background-repeat:no-repeat;cursor:pointer;filter:drop-shadow(0 8px 6px rgba(25,75,105,.23));animation:wiggle 1.6s ease-in-out infinite alternate;touch-action:none}
    .falling-icon:active{transform:scale(.86)}
    .tap-pop{position:absolute;z-index:40;font-size:25px;font-weight:900;color:#ff9a00;text-shadow:0 2px 0 #fff;pointer-events:none;animation:floatUp .65s ease-out forwards}

    /* CELEBRATION + FINISH */
    #finishScreen{position:absolute;inset:0;z-index:50;display:none;place-items:center;background:rgba(33,86,120,.14);backdrop-filter:blur(4px);pointer-events:auto}#finishScreen.show{display:grid}
    .finish-card{width:min(500px,calc(100vw - 40px));background:rgba(255,255,255,.95);border:5px solid #fff;border-radius:34px;box-shadow:0 22px 50px rgba(32,80,115,.25);padding:30px;text-align:center}.finish-emoji{font-size:74px;line-height:1}.finish-card h2{font-size:38px;color:#6f55d7;margin:8px 0 4px}.finish-card p{font-size:15px;font-weight:700;color:#687e94;margin:0}.score-pill{display:inline-block;margin:18px auto 22px;padding:10px 25px;background:#fff7ce;border:4px solid #ffd454;border-radius:999px;font-size:27px;font-weight:900;color:#c77d00}.finish-buttons{display:flex;gap:12px;justify-content:center}.big-btn{border:none;border-radius:19px;padding:14px 24px;color:#fff;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.16)}.big-btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.16)}.big-btn.green{background:#58cc02}.big-btn.blue{background:#1cb0f6}
    #confetti{position:absolute;inset:0;z-index:80;pointer-events:none;overflow:hidden}.confetti-piece{position:absolute;width:10px;height:16px;border-radius:3px;animation:confettiFall 1.25s ease-out forwards}

    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
    @keyframes wiggle{from{rotate:-4deg}to{rotate:4deg}}
    @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-60px) scale(1.35)}}
    @keyframes confettiFall{0%{opacity:1;transform:translateY(-20px) rotate(0deg)}100%{opacity:0;transform:translateY(230px) rotate(430deg)}}

    @media(max-width:760px){
      #gameUI{padding:10px 10px 12px}.hud{width:calc(100vw - 20px);height:62px;grid-template-columns:1fr minmax(180px,1.3fr);gap:12px}.brand-card{padding:7px 11px}.brand-card b{font-size:14px}.brand-card span{font-size:9px}.hud-actions{display:none}.progress-top{font-size:11px}.progress-shell{height:15px}
      #questionPanel{width:calc(100vw - 20px);padding:15px 14px 16px;border-radius:26px}.question-grid{grid-template-columns:150px 1fr;gap:10px;min-height:205px}.ordinal-box{height:200px}.ordinal-art{width:132px;height:184px}.speak-btn{width:40px;height:40px;font-size:18px}.instruction h1{font-size:18px}.instruction p{font-size:11px}.feedback{font-size:14px;height:22px}.slot-row{gap:5px}.letter-bank{gap:7px}.safe-logo-zone{width:25vw;height:13vh}.mini-hud{top:10px;min-width:290px;padding:8px 14px}.falling-icon{width:70px;height:98px}
    }
    @media(max-height:680px){
      #gameUI{padding-top:8px}.hud{height:58px}#questionPanel{padding-top:14px;padding-bottom:14px}.instruction{margin-bottom:3px}.question-grid{min-height:190px}.ordinal-box{height:185px}.ordinal-art{width:132px;height:184px}.slot-row{margin:2px 0 10px}.letter-bank{min-height:60px;padding-top:4px}.feedback{margin-top:3px}
    }
  </style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div class="screen">
  <div id="bg"></div>
  <div class="safe-logo-zone" aria-hidden="true"></div>
  <div id="confetti"></div>

  <main id="gameUI">
    <div class="hud">
      <div class="brand-card"><b>Ordinal Numbers</b><span>Spell the word!</span></div>
      <div class="progress-wrap">
        <div class="progress-top"><span id="questionLabel">Question 1 of 10</span><span id="starLabel">⭐ 0</span></div>
        <div class="progress-shell"><div id="progressBar" class="progress-bar"></div></div>
      </div>
      <div class="hud-actions">
        <button id="soundBtn" class="round-btn" aria-label="Sound">🔊</button>
        <button id="restartTop" class="round-btn" aria-label="Restart">↻</button>
      </div>
    </div>

    <section id="questionPanel">
      <div class="instruction"><h1>Drag the letters to spell the word.</h1><p>You can also tap a letter to place it.</p></div>
      <div class="question-grid">
        <div class="ordinal-box"><div id="ordinalArt" class="ordinal-art"></div><button id="speakBtn" class="speak-btn" aria-label="Hear the word">🔊</button></div>
        <div class="spell-zone">
          <div id="slotRow" class="slot-row"></div>
          <div id="letterBank" class="letter-bank"></div>
          <div id="feedback" class="feedback"></div>
        </div>
      </div>
    </section>
  </main>

  <section id="miniGame" aria-hidden="true">
    <div class="mini-hud"><b>Bonus Round!</b><div class="mini-sub">Tap the falling ordinal numbers.</div><div class="mini-stats"><span id="miniScore">⭐ 0</span><span id="miniTime">⏱ 15</span></div></div>
  </section>

  <section id="finishScreen">
    <div class="finish-card">
      <div class="finish-emoji">🏆</div><h2>Great Job!</h2><p>You completed all 10 words!</p>
      <div id="finalScore" class="score-pill">⭐ 10 / 10</div>
      <div class="finish-buttons"><button id="playAgain" class="big-btn green">PLAY AGAIN</button><button id="homeBtn" class="big-btn blue">HOME</button></div>
    </div>
  </section>
</div>
<script>
(() => {
  'use strict';
  const QUESTIONS = [
    {ordinal:'1st',word:'FIRST',idx:0},{ordinal:'2nd',word:'SECOND',idx:1},{ordinal:'3rd',word:'THIRD',idx:2},{ordinal:'4th',word:'FOURTH',idx:3},{ordinal:'5th',word:'FIFTH',idx:4},
    {ordinal:'6th',word:'SIXTH',idx:5},{ordinal:'7th',word:'SEVENTH',idx:6},{ordinal:'8th',word:'EIGHTH',idx:7},{ordinal:'9th',word:'NINTH',idx:8},{ordinal:'10th',word:'TENTH',idx:9}
  ];
  const els = Object.fromEntries(['questionLabel','starLabel','progressBar','ordinalArt','slotRow','letterBank','feedback','soundBtn','restartTop','speakBtn','miniGame','miniScore','miniTime','finishScreen','finalScore','playAgain','homeBtn','questionPanel'].map(id=>[id,document.getElementById(id)]));
  let order=[], qIndex=0, stars=0, tiles=[], slots=[], locked=false, soundOn=true, activeDrag=null, miniRAF=0, miniTimer=0, miniRunning=false, miniCallback=null, miniPoints=0;
  const palette=['#ff5aa5','#1cb0f6','#8b5cf6','#ff9600','#58cc02','#ef5350'];

  function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function shuffledLetters(word){ let a=word.split(''); let out=a; for(let i=0;i<8;i++){out=shuffle(a); if(out.join('')!==word) break;} return out; }
  function spritePos(idx){ const col=idx%5,row=Math.floor(idx/5); return `${col*25}% ${row*100}%`; }
  function setSprite(el,idx){el.style.backgroundPosition=spritePos(idx)}

  const AudioFX={ctx:null,ensure(){if(!soundOn)return null; if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)(); if(this.ctx.state==='suspended')this.ctx.resume(); return this.ctx;},tone(freq=440,dur=.08,type='sine',vol=.05){const c=this.ensure(); if(!c)return; const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.stop(c.currentTime+dur)},correct(){[523,659,784].forEach((f,i)=>setTimeout(()=>this.tone(f,.12,'triangle',.06),i*85))},wrong(){this.tone(180,.18,'sawtooth',.035)},tap(){this.tone(700,.05,'sine',.025)},finish(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.18,'triangle',.06),i*100))}};

  function newRound(){
    stopMiniGame(); order=shuffle(QUESTIONS); qIndex=0; stars=0; locked=false; els.finishScreen.classList.remove('show'); renderQuestion();
  }
  function renderQuestion(){
    locked=false; els.feedback.textContent='';els.feedback.className='feedback';
    const q=order[qIndex]; setSprite(els.ordinalArt,q.idx);
    els.questionLabel.textContent=`Question ${qIndex+1} of 10`;els.starLabel.textContent=`⭐ ${stars}`;els.progressBar.style.width=`${qIndex*10}%`;
    tiles=shuffledLetters(q.word).map((ch,i)=>({id:`q${qIndex}-t${i}-${Math.random().toString(36).slice(2,7)}`,ch,placed:false}));
    slots=Array(q.word.length).fill(null); renderSlots(); renderBank();
  }
  function renderSlots(){
    els.slotRow.innerHTML=''; slots.forEach((tileId,i)=>{const s=document.createElement('div');s.className='slot'+(tileId?' filled':'');s.dataset.index=i;if(tileId){const t=tiles.find(x=>x.id===tileId);const letter=document.createElement('div');letter.className='slot-letter';letter.textContent=t.ch;letter.title='Tap to move this letter back';letter.addEventListener('click',()=>{if(locked)return;returnTile(i)});s.appendChild(letter)}els.slotRow.appendChild(s)});
  }
  function renderBank(){
    els.letterBank.innerHTML=''; tiles.filter(t=>!t.placed).forEach((t,i)=>{const b=document.createElement('div');b.className='letter-tile';b.textContent=t.ch;b.dataset.tileId=t.id;b.style.background=palette[i%palette.length];b.addEventListener('pointerdown',ev=>pointerStart(ev,t.id,b,i%6));els.letterBank.appendChild(b)});
  }
  function placeTile(tileId,index){
    if(locked||index<0||index>=slots.length)return;
    const t=tiles.find(x=>x.id===tileId);if(!t)return;
    const oldIndex=slots.indexOf(tileId); if(oldIndex>=0)slots[oldIndex]=null;
    if(slots[index]){const old=tiles.find(x=>x.id===slots[index]);if(old)old.placed=false;}
    slots[index]=tileId;t.placed=true;AudioFX.tap();renderSlots();renderBank(); if(slots.every(Boolean))setTimeout(checkAnswer,120);
  }
  function placeFirstEmpty(tileId){const i=slots.findIndex(x=>!x);if(i>=0)placeTile(tileId,i)}
  function returnTile(index){const id=slots[index];if(!id)return;const t=tiles.find(x=>x.id===id);if(t)t.placed=false;slots[index]=null;AudioFX.tap();renderSlots();renderBank()}

  function pointerStart(ev,id,el,colorIndex){
    if(locked)return;ev.preventDefault();
    activeDrag={id,pointerId:ev.pointerId,sx:ev.clientX,sy:ev.clientY,x:ev.clientX,y:ev.clientY,dragging:false,ghost:null,colorIndex};
    try{el.setPointerCapture(ev.pointerId)}catch(e){}
  }
  document.addEventListener('pointermove',ev=>{
    if(!activeDrag||ev.pointerId!==activeDrag.pointerId)return;activeDrag.x=ev.clientX;activeDrag.y=ev.clientY;const dist=Math.hypot(ev.clientX-activeDrag.sx,ev.clientY-activeDrag.sy);
    if(!activeDrag.dragging&&dist>7){activeDrag.dragging=true;const t=tiles.find(x=>x.id===activeDrag.id);const g=document.createElement('div');g.className=`drag-ghost c${activeDrag.colorIndex+1}`;g.textContent=t?t.ch:'';document.body.appendChild(g);activeDrag.ghost=g}
    if(activeDrag.ghost){activeDrag.ghost.style.left=ev.clientX+'px';activeDrag.ghost.style.top=ev.clientY+'px';document.querySelectorAll('.slot').forEach(s=>s.classList.remove('drop-ready'));const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');if(target)target.classList.add('drop-ready')}
  },{passive:false});
  document.addEventListener('pointerup',ev=>{
    if(!activeDrag||ev.pointerId!==activeDrag.pointerId)return;document.querySelectorAll('.slot').forEach(s=>s.classList.remove('drop-ready'));
    if(activeDrag.dragging){const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.slot');if(target)placeTile(activeDrag.id,Number(target.dataset.index));}
    else placeFirstEmpty(activeDrag.id);
    if(activeDrag.ghost)activeDrag.ghost.remove();activeDrag=null;
  });

  function currentAnswer(){return slots.map(id=>{const t=tiles.find(x=>x.id===id);return t?t.ch:''}).join('')}
  function checkAnswer(){
    if(locked)return;const q=order[qIndex];
    if(currentAnswer()===q.word){
      locked=true;stars++;els.starLabel.textContent=`⭐ ${stars}`;els.feedback.textContent='Great job!';els.feedback.className='feedback good';document.querySelectorAll('.slot').forEach(s=>s.classList.add('correct'));AudioFX.correct();burstConfetti(36);els.progressBar.style.width=`${(qIndex+1)*10}%`;
      setTimeout(()=>{if((qIndex+1)%2===0)startMiniGame(()=>advance());else advance()},1050);
    }else{
      els.feedback.textContent='Try again!';els.feedback.className='feedback bad';document.querySelectorAll('.slot').forEach(s=>s.classList.add('wrong'));AudioFX.wrong();setTimeout(()=>document.querySelectorAll('.slot').forEach(s=>s.classList.remove('wrong')),500);
    }
  }
  function advance(){qIndex++;if(qIndex>=order.length)showFinish();else renderQuestion()}
  function speakWord(){const q=order[qIndex];if(!('speechSynthesis'in window)||!q)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.word.toLowerCase());u.lang='en-US';u.rate=.8;u.pitch=1.05;window.speechSynthesis.speak(u)}

  function burstConfetti(count=45){const box=document.getElementById('confetti');for(let i=0;i<count;i++){const p=document.createElement('i');p.className='confetti-piece';p.style.left=(40+Math.random()*20)+'%';p.style.top=(28+Math.random()*12)+'%';p.style.background=palette[i%palette.length];p.style.animationDelay=(Math.random()*.18)+'s';p.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(p);setTimeout(()=>p.remove(),1600)}}

  function startMiniGame(callback){
    locked=true;miniRunning=true;miniCallback=callback;miniPoints=0;els.miniScore.textContent='⭐ 0';els.miniTime.textContent='⏱ 15';els.miniGame.classList.add('show');els.miniGame.setAttribute('aria-hidden','false');els.questionPanel.style.visibility='hidden';
    let start=performance.now(),lastSpawn=0; const duration=15000;
    function loop(now){if(!miniRunning)return;const elapsed=now-start,remain=Math.max(0,Math.ceil((duration-elapsed)/1000));els.miniTime.textContent=`⏱ ${remain}`;
      if(now-lastSpawn>650){spawnFalling();lastSpawn=now}
      document.querySelectorAll('.falling-icon').forEach(icon=>{const y=Number(icon.dataset.y)+Number(icon.dataset.speed);icon.dataset.y=y;icon.style.top=y+'px';if(y>innerHeight+140)icon.remove()});
      if(elapsed>=duration){endMiniGame()}else miniRAF=requestAnimationFrame(loop)
    }
    miniRAF=requestAnimationFrame(loop);
  }
  function spawnFalling(){
    const idx=Math.floor(Math.random()*10),d=document.createElement('div');d.className='falling-icon';setSprite(d,idx);const size=innerWidth<700?70:90;const margin=30;d.style.left=(margin+Math.random()*Math.max(10,innerWidth-size-margin*2))+'px';d.dataset.y='-140';d.dataset.speed=(3.5+Math.random()*1.4).toFixed(2);d.style.top='-140px';
    d.addEventListener('pointerdown',ev=>{ev.preventDefault();if(!miniRunning)return;miniPoints++;els.miniScore.textContent=`⭐ ${miniPoints}`;AudioFX.tap();tapPop(ev.clientX,ev.clientY);d.remove()});els.miniGame.appendChild(d)
  }
  function tapPop(x,y){const p=document.createElement('div');p.className='tap-pop';p.textContent='+1';p.style.left=(x-15)+'px';p.style.top=(y-20)+'px';els.miniGame.appendChild(p);setTimeout(()=>p.remove(),700)}
  function endMiniGame(){
    if(!miniRunning)return;miniRunning=false;cancelAnimationFrame(miniRAF);document.querySelectorAll('.falling-icon,.tap-pop').forEach(x=>x.remove());els.miniTime.textContent='⏱ 0';burstConfetti(24);setTimeout(()=>{els.miniGame.classList.remove('show');els.miniGame.setAttribute('aria-hidden','true');els.questionPanel.style.visibility='visible';const cb=miniCallback;miniCallback=null;if(cb)cb()},500)
  }
  function stopMiniGame(){miniRunning=false;cancelAnimationFrame(miniRAF);clearTimeout(miniTimer);document.querySelectorAll('.falling-icon,.tap-pop').forEach(x=>x.remove());els.miniGame.classList.remove('show');els.questionPanel.style.visibility='visible'}

  function showFinish(){locked=true;els.finalScore.textContent=`⭐ ${stars} / 10`;els.finishScreen.classList.add('show');AudioFX.finish();burstConfetti(85)}
  function goHome(){newRound()}
  els.speakBtn.addEventListener('click',speakWord);els.soundBtn.addEventListener('click',()=>{soundOn=!soundOn;els.soundBtn.textContent=soundOn?'🔊':'🔇';if(soundOn)AudioFX.ensure()});els.restartTop.addEventListener('click',newRound);els.playAgain.addEventListener('click',newRound);els.homeBtn.addEventListener('click',goHome);
  window.addEventListener('resize',()=>{if(miniRunning)document.querySelectorAll('.falling-icon').forEach(x=>{const left=Math.min(parseFloat(x.style.left)||0,innerWidth-90);x.style.left=Math.max(8,left)+'px'})});
  newRound();
})();
</script>
</body>
</html>

*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Poppins,"Trebuchet MS",Arial,sans-serif;color:var(--navy);background:#f8e8c7}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,select:focus-visible{outline:4px solid #ffbf22;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.46;filter:grayscale(.25)}.hidden{display:none!important}svg{display:block}
#desktop-shell{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#fff4d6,#c3e9f6)}
#design-stage{width:1672px;height:941px;position:absolute;left:50%;top:50%;overflow:hidden;transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center center;background-image:var(--bg-image);background-size:100% 100%;background-repeat:no-repeat;isolation:isolate}
.icon{width:23px;height:23px;display:inline-block;vertical-align:middle;flex-shrink:0;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.6;fill:none}.icon-lg{width:30px;height:30px}.icon-sm{width:18px;height:18px}.star-icon{fill:#ffd64d;stroke:#ec9a13;stroke-width:2.4}.speak-icon{fill:none}
.team-station{position:absolute;top:546px;height:330px;isolation:isolate}.team-station[data-team="0"]{left:104px;width:451px;--team:#f05269}.team-station[data-team="1"]{left:595px;width:461px;--team:#139cf2}.team-station[data-team="2"]{left:1090px;width:460px;--team:#41bd48}
.score-row{position:absolute;top:0;left:0;width:100%;height:41px;display:flex;align-items:center;justify-content:center;gap:11px;z-index:2}.score-chip{background:#ffffffea;border:2.5px solid var(--team,#ffbb39);border-radius:999px;padding:3px 12px;min-width:88px;height:38px;display:flex;align-items:center;gap:5px;justify-content:center;color:#203951;box-shadow:0 3px 0 #d9dfe3;font-weight:900;font-size:23px}.score-chip .icon{width:25px;height:25px}.grade-set{display:flex;align-items:center;gap:5px;background:#ffffffeb;padding:4px 7px;border:2px solid #cbd5e1;border-radius:18px;box-shadow:0 3px 0 #dce2e8}.grade-set .mini-label{font-size:12px;color:#566982;font-weight:900;margin-right:2px}.grade-btn{width:30px;height:29px;background:#f2f6fa;border:1.5px solid #cbd5e1;color:#42546c;border-radius:9px;font-size:16px;font-weight:900;padding:0}.grade-btn.selected{background:var(--team);border-color:var(--team);color:white;box-shadow:0 2px 0 #8b99a9}
.math-core{position:absolute;top:0;left:0;right:0;bottom:0;--bond-y:170px}.equation{position:absolute;top:61px;width:100%;height:55px;display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;color:#151e2d;font-size:35px;font-weight:800;line-height:1}.term,.op,.equals{display:inline-block;text-align:center}.term{min-width:25px}.answer-line{min-width:72px;height:49px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid #162338;font-size:38px;color:#ed2439;font-weight:900}.answer-line .answer-n{animation:answerPop .38s cubic-bezier(.2,1.6,.5,1) both}.speaker-btn{width:45px;height:45px;border:0;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 4px 0 #a8dbef;color:#128bc7;margin-left:0px;transition:transform .12s}.speaker-btn:active,.game-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #a3b7c5}.speaker-btn:hover{background:#e9faff}
.bond-svg{position:absolute;top:0;left:0;width:100%;height:208px;overflow:visible;pointer-events:none}.bond-svg .bond-line{stroke:#272f3d;stroke-width:2.7;stroke-linecap:round;fill:none}.bond-svg .bond-ring{fill:#fffdfd;stroke:#252e40;stroke-width:2.7}.bond-svg .bond-value{fill:#f12d37;font-size:25px;font-weight:800;text-anchor:middle;dominant-baseline:middle;font-family:Poppins,"Trebuchet MS",Arial,sans-serif;animation:answerPop .5s cubic-bezier(.2,1.4,.5,1) both}

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const icon=(name,extra='')=>`<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const COLORS=['#f05269','#139cf2','#41bd48'];
const game={started:false,roundCount:5,index:0,rounds:[],grades:[],checked:[],activeTeam:0,muted:false,final:false};
let stageScale=1,lastMode='',resizePending=0,toastTimeout=0,confettiAnimation=0;
function randShuffle(input){const a=[...input];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDirect(a,b,c,pair){const terms=[a,b,c],other=[0,1,2].find(i=>!pair.includes(i));return{type:'A',terms,sum:a+b+c,pair:[...pair],steps:[`${terms[pair[0]]} + ${terms[pair[1]]} = 10`,`10 + ${terms[other]} = ${a+b+c}`]}}
function makeSplit(a,b,c,split,partner,makePart){const terms=[a,b,c],rest=terms[split]-makePart,leftover=[0,1,2].find(i=>i!==split&&i!==partner),rem=terms[leftover],sum=a+b+c;
const text=partner>split?`${makePart} + ${terms[partner]} = 10`:`${terms[partner]} + ${makePart} = 10`;
const second=leftover<split?`${rem} + ${rest} = ${rem+rest}`:`${rest} + ${rem} = ${rest+rem}`;
return{type:'B',terms,sum,split,partner,parts:[makePart,rest],remaining:leftover,steps:[text,second,`10 + ${sum-10} = ${sum}`]}}
function validate(q){const t=q.terms,s=t.reduce((a,b)=>a+b,0);if(t.length!==3||t.some(x=>!Number.isInteger(x)||x<1||x>9)||s<11||s>20||q.sum!==s)return false;
if(q.type==='A'){if(q.pair.length!==2||q.pair[1]!==q.pair[0]+1)return false;return t[q.pair[0]]+t[q.pair[1]]===10}
if(q.type!=='B'||q.split===q.partner||q.parts[0]<=0||q.parts[1]<=0||q.parts[0]+q.parts[1]!==t[q.split]||q.parts[0]+t[q.partner]!==10)return false;
if([t[0]+t[1],t[1]+t[2],t[0]+t[2]].includes(10))return false;
const rem=t[q.remaining];return q.parts[1]+rem===s-10&&q.steps.length===3}
const exampleRound=[makeDirect(6,4,6,[0,1]),makeSplit(3,8,4,0,1,2),makeSplit(9,5,3,1,0,1)];
const allowedSplit=[{s:0,p:1},{s:1,p:0},{s:1,p:2},{s:2,p:1}];
function questionPools(){const A=[],B=[];for(let a=1;a<=9;a++)for(let b=1;b<=9;b++)for(let c=1;c<=9;c++){
const s=a+b+c;if(s<12||s>20)continue;
const pair=a+b===10?[0,1]:b+c===10?[1,2]:null;
if(pair){let q=makeDirect(a,b,c,pair);if(validate(q))A.push(q);continue}
if(a+c===10)continue;
const possible=[];
for(let{ s:sp,p:pa}of allowedSplit){const terms=[a,b,c],part=10-terms[pa];if(part<=0||part>=terms[sp])continue;
let q=makeSplit(a,b,c,sp,pa,part);if(validate(q))possible.push(q)}
// A single consistent number bond per equation: prefer splitting the
// middle number so the left and right bond parts match neighboring terms.
// When the middle and last terms are equal, prefer making 10 to the right.
if(possible.length){
const middle=possible.filter(q=>q.split===1),options=middle.length?middle:possible;
const preferred=(middle.length&&b===c)?options.find(q=>q.partner===2):null;
B.push(preferred||options.find(q=>q.partner<q.split)||options[0])}
}return{A:randShuffle(A),B:randShuffle(B)}}
function newRounds(count){const pool=questionPools(),used=new Set(exampleRound.map(q=>q.terms.join(','))),rounds=[exampleRound.map(q=>({...q}))];
for(let r=1;r<count;r++){const row=[];for(let t=0;t<3;t++){const expected=((r+t+1)%2===0)?'A':'B';let q=pool[expected].find(x=>!used.has(x.terms.join(','))&&x.sum>=14&&x.sum<=20);if(!q)q=pool[expected].find(x=>!used.has(x.terms.join(',')));if(!q)throw Error('Not enough unique questions');row.push({...q});used.add(q.terms.join(','))}rounds.push(row)}
return rounds}
function totalStars(team){return game.grades.reduce((sum,r)=>sum+(r[team]??0),0)}
function save(){try{localStorage.setItem('oodles_make10_v3',JSON.stringify({roundCount:game.roundCount,index:game.index,rounds:game.rounds,grades:game.grades,checked:game.checked,activeTeam:game.activeTeam,started:game.started,final:game.final}))}catch(e){}}
function restore(){try{const old=JSON.parse(localStorage.getItem('oodles_make10_v3')||'null');if(!old||!Array.isArray(old.rounds)||!Array.isArray(old.grades)||old.rounds.length!==5||old.roundCount!==5||!old.rounds.every(row=>Array.isArray(row)&&row.length===3&&row.every(validate)))return;
Object.assign(game,old);game.index=clamp(game.index,0,game.roundCount-1);game.activeTeam=clamp(game.activeTeam,0,2);$('play-btn').textContent='RESUME GAME ▶'}catch(e){}}
function resetGame(){game.roundCount=5;game.index=0;game.rounds=newRounds(game.roundCount);game.grades=Array.from({length:game.roundCount},()=>[null,null,null]);game.checked=Array(game.roundCount).fill(false);game.activeTeam=0;game.started=true;game.final=false;save()}
function scoreHTML(t){const chosen=game.grades[game.index][t],checked=game.checked[game.index];return `<div class="score-row"><div class="score-chip">${icon('star','star-icon')} <span class="score-total" data-score-team="${t}">${totalStars(t)}</span></div>${checked?`<div class="grade-set"><span class="mini-label">POINTS</span>${[0,1,2].map(n=>`<button class="grade-btn ${n===chosen?'selected':''}" data-grade-team="${t}" data-grade-value="${n}" aria-label="Give Team ${t+1} ${n} points" aria-pressed="${n===chosen}">${n}</button>`).join('')}</div>`:''}</div>`}
function equationHTML(q,t){return `<div class="equation" aria-label="${q.terms.join(' plus ')} equals what">${q.terms.map((n,i)=>`${i?'<span class="op">+</span>':''}<span class="term" data-term="${i}">${n}</span>`).join('')}<span class="equals">=</span><span class="answer-line">${game.checked[game.index]?`<span class="answer-n">${q.sum}</span>`:''}</span><button class="speaker-btn" data-speaker-team="${t}" aria-label="Read question for Team ${t+1}">${icon('sound','speak-icon')}</button></div>`}
function questionHTML(q,t,mobile){const checked=game.checked[game.index],steps=checked?q.steps.map((x,i)=>`<div class="solution-step" style="animation-delay:${.18+i*.35}s">${x}</div>`).join(''):'<div class="no-answer-placeholder"></div>';
return `<div class="${mobile?'mobile-team':'team-station'} ${mobile&&game.activeTeam===t?'active':''}" data-team="${t}" ${mobile?`style="--team:${COLORS[t]}"`:''}>${scoreHTML(t)}<div class="math-core">${equationHTML(q,t)}<svg class="bond-svg" aria-label="Number bond"></svg><div class="solution">${steps}</div></div>${mobile&&!checked?'<span class="mobile-hint">Write your answer before CHECK!</span>':''}</div>`}
function drawBond(container,q){const svg=container.querySelector('.bond-svg'),eq=container.querySelector('.equation'),core=container.querySelector('.math-core');if(!svg||!eq||!core)return;
const base=core.getBoundingClientRect(),k=core.offsetWidth/base.width;if(!Number.isFinite(k))return;
const cx=i=>{let r=eq.querySelector(`[data-term="${i}"]`).getBoundingClientRect();return(r.left+r.width/2-base.left)*k};
const bottom=i=>{let r=eq.querySelector(`[data-term="${i}"]`).getBoundingClientRect();return(r.bottom-base.top)*k};
const mobile=container.classList.contains('mobile-team');const W=core.offsetWidth,H=mobile?190:208,Y=mobile?(window.innerHeight<=720?133:158):167,r=mobile?23:27;
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const shown=game.checked[game.index];let html='';
const path=(x1,y1,x2,y2)=>`<path class="bond-line" d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
const circle=(x,y,val)=>`<circle class="bond-ring" cx="${x.toFixed(1)}" cy="${y}" r="${r}"/>${shown?`<text class="bond-value" x="${x.toFixed(1)}" y="${y+1}">${val}</text>`:''}`;
if(q.type==='A'){let x=(cx(q.pair[0])+cx(q.pair[1]))/2;html+=path(cx(q.pair[0]),bottom(q.pair[0])+3,x-r*.3,Y-r+3);html+=path(cx(q.pair[1]),bottom(q.pair[1])+3,x+r*.3,Y-r+3);html+=circle(x,Y,10)}
else{let x=cx(q.split),gap=mobile?37:43,cy=Y;
html+=path(x,bottom(q.split)+5,x-gap+4,cy-r+5);html+=path(x,bottom(q.split)+5,x+gap-4,cy-r+5);
// Number bonds follow the equation from left to right: the part nearest
// the partner makes 10, the other part stays on the opposite side.
const bondParts=q.partner<q.split?q.parts:[q.parts[1],q.parts[0]];
 html+=circle(x-gap,cy,bondParts[0]);html+=circle(x+gap,cy,bondParts[1])}
svg.innerHTML=html}
function renderAll(){if(!game.started||!game.rounds.length)return;
let row=game.rounds[game.index];$('desktop-teams').innerHTML=row.map((q,t)=>questionHTML(q,t,false)).join('');$('mobile-team-holder').innerHTML=row.map((q,t)=>questionHTML(q,t,true)).join('');
$('desktop-round').textContent=`ROUND ${game.index+1} / ${game.roundCount}`;$('mobile-round').textContent=`ROUND ${game.index+1} / ${game.roundCount}`;
for(let el of document.querySelectorAll('.team-tab')){let active=Number(el.dataset.tab)===game.activeTeam;el.classList.toggle('active',active);el.setAttribute('aria-selected',String(active))}
const checked=game.checked[game.index];for(let b of document.querySelectorAll('[data-action="prev"]'))b.disabled=game.index===0;
for(let b of document.querySelectorAll('[data-action="next"]')){b.disabled=!checked;let isLast=game.index===game.roundCount-1;b.innerHTML=(isLast?'FINISH ':'NEXT '+(b.closest('#desktop-shell')?'ROUND ':''))+icon('right')}
for(let b of document.querySelectorAll('[data-action="check"]')){b.disabled=checked;b.innerHTML=icon('check')+(b.closest('#desktop-shell')?' CHECK':' CHECK')}
for(let b of document.querySelectorAll('[data-action="replay"]'))b.classList.toggle('hidden',!checked);
for(let b of document.querySelectorAll('[data-action="mute"]'))b.innerHTML=icon(game.muted?'mute':'sound');
requestAnimationFrame(()=>document.querySelectorAll('.team-station,.mobile-team.active').forEach(c=>drawBond(c,row[Number(c.dataset.team)])))}
function redrawBonds(){if(!game.started||!game.rounds.length)return;const row=game.rounds[game.index];document.querySelectorAll('.team-station,.mobile-team.active').forEach(c=>drawBond(c,row[+c.dataset.team]))}
function setGrade(t,n){if(!game.checked[game.index])return;game.grades[game.index][t]=n;save();playClick();for(let x of document.querySelectorAll('[data-score-team]'))x.textContent=totalStars(+x.dataset.scoreTeam);
for(let b of document.querySelectorAll('[data-grade-team]')){if(+b.dataset.gradeTeam!==t)continue;b.classList.toggle('selected',+b.dataset.gradeValue===n);b.setAttribute('aria-pressed',String(+b.dataset.gradeValue===n))}}
function showToast(msg){const el=$('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2400)}
function doCheck(){if(game.checked[game.index])return;game.checked[game.index]=true;save();playSuccess();renderAll()}
function goNext(){if(!game.checked[game.index]){showToast('Check the answers first!');return}if(game.index===game.roundCount-1){showEnd();return}game.index++;stopSpeech();playTransition();save();renderAll()}
function goBack(){if(game.index<=0)return;game.index--;stopSpeech();playClick();save();renderAll()}
function replay(){if(!game.checked[game.index])return;playSuccess();renderAll()}
function showEnd(){game.final=true;save();stopSpeech();const scores=[0,1,2].map(totalStars),top=Math.max(...scores),winners=scores.map((n,i)=>n===top?i:-1).filter(i=>i>=0);const maxPossible=game.roundCount*2;
$('podium').innerHTML=scores.map((s,t)=>`<div class="podium-card ${winners.includes(t)?'winner':''}"><div class="podium-name" style="color:${COLORS[t]}">TEAM ${t+1}</div><div class="podium-stars">${icon('star','star-icon')} ${s}<small style="font-size:12px;color:#8794a4">/${maxPossible}</small></div>${winners.includes(t)?'<span style="font-size:14px">🏆</span>':'<span style="font-size:14px">✨</span>'}</div>`).join('');
$('champion-line').textContent=winners.length===3?'ALL TEAMS ARE CHAMPIONS! 🏆':winners.length===2?`TEAMS ${winners[0]+1} & ${winners[1]+1} ARE CHAMPIONS! 🏆`:`TEAM ${winners[0]+1} IS THE CHAMPION! 🏆`;
$('end-screen').classList.remove('hidden');playFanfare();launchConfetti()}
function showHome(){stopSpeech();stopConfetti();$('end-screen').classList.add('hidden');$('intro-screen').classList.remove('hidden');$('play-btn').textContent=game.started?'RESUME GAME ▶':'PLAY NOW ▶'}
function playStart(){if(!game.started||game.final){resetGame()}else{game.final=false;save()}
$('intro-screen').classList.add('hidden');$('end-screen').classList.add('hidden');playTransition();renderAll()}
function startAgain(){stopConfetti();resetGame();$('end-screen').classList.add('hidden');$('intro-screen').classList.add('hidden');playTransition();renderAll()}
function speakQuestion(team){if(game.muted)return;const q=game.rounds[game.index][team];if(!('speechSynthesis' in window))return showToast('Voice is not available on this device.');stopSpeech();const u=new SpeechSynthesisUtterance(`${q.terms[0]} plus ${q.terms[1]} plus ${q.terms[2]} equals what? Make ten first!`);u.lang='en-US';u.rate=.83;u.pitch=1.08;u.volume=.95;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('en-us')&&/female|samantha|zira|jenny|aria|google/i.test(v.name))||voices.find(v=>v.lang.toLowerCase().startsWith('en-us'))||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;try{window.speechSynthesis.speak(u)}catch(e){showToast('Voice is not available.') }}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
let audioContext=null;function playNotes(notes){if(game.muted)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();let start=audioContext.currentTime+.01;for(let [freq,delay,dur]of notes){let osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,start+delay);gain.gain.setValueAtTime(.001,start+delay);gain.gain.exponentialRampToValueAtTime(.08,start+delay+.018);gain.gain.exponentialRampToValueAtTime(.001,start+delay+dur);osc.connect(gain);gain.connect(audioContext.destination);osc.start(start+delay);osc.stop(start+delay+dur+.02)}}catch(e){}}
function playClick(){playNotes([[550,0,.095]])}function playTransition(){playNotes([[540,0,.14],[660,.11,.15]])}function playSuccess(){playNotes([[523,0,.18],[659,.14,.19],[784,.28,.25]])}function playFanfare(){playNotes([[523,0,.18],[659,.13,.2],[784,.28,.2],[1047,.44,.42],[880,.72,.18],[1047,.88,.48]])}
function toggleSound(){game.muted=!game.muted;if(game.muted)stopSpeech();playClick();for(let b of document.querySelectorAll('[data-action="mute"]'))b.innerHTML=icon(game.muted?'mute':'sound')}
async function toggleFullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen()}else await document.exitFullscreen()}catch(e){showToast('Fullscreen is not available here.')}}
function onAction(action){if(action==='home')showHome();else if(action==='prev')goBack();else if(action==='next')goNext();else if(action==='check')doCheck();else if(action==='replay')replay();else if(action==='mute')toggleSound();else if(action==='fullscreen')toggleFullscreen()}
document.addEventListener('click',e=>{const speaker=e.target.closest('[data-speaker-team]');if(speaker){speakQuestion(+speaker.dataset.speakerTeam);return}
const grade=e.target.closest('[data-grade-value]');if(grade){setGrade(+grade.dataset.gradeTeam,+grade.dataset.gradeValue);return}
const action=e.target.closest('[data-action]');if(action){onAction(action.dataset.action);return}
const tab=e.target.closest('[data-tab]');if(tab){game.activeTeam=+tab.dataset.tab;playClick();save();renderAll()}});
$('play-btn').addEventListener('click',playStart);$('again-btn').addEventListener('click',startAgain);$('finish-home').addEventListener('click',showHome);
document.addEventListener('keydown',e=>{if($('intro-screen').classList.contains('hidden')&&!game.final){if(e.key==='ArrowRight'){e.preventDefault();goNext()}else if(e.key==='ArrowLeft'){e.preventDefault();goBack()}else if(e.key==='Enter'&&e.target===document.body){e.preventDefault();doCheck()}}});
function resize(){const w=window.innerWidth,h=window.innerHeight;stageScale=Math.min(w/1672,h/941);$('design-stage').style.setProperty('--stage-scale',stageScale.toFixed(5));const mode=w/h<=1.25?'mobile':'desktop';if(lastMode!==mode){lastMode=mode;if(game.started&&!game.final&&$('intro-screen').classList.contains('hidden'))renderAll()}else redrawBonds()}
window.addEventListener('resize',()=>{cancelAnimationFrame(resizePending);resizePending=requestAnimationFrame(resize)});
// Celebration on its own topmost, click-through canvas.
const canvas=$('confetti-canvas'),ctx=canvas.getContext('2d');let particles=[],dpr=1,startTime=0;
function sizeConfetti(){dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(window.innerWidth*dpr);canvas.height=Math.round(window.innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function launchConfetti(){stopConfetti();sizeConfetti();let w=window.innerWidth,h=window.innerHeight,colors=['#f9516c','#ffc43d','#1eaff7','#55d54c','#bd82ff','#ff8ecc','#ffffff'];particles=[];
for(let i=0;i<260;i++){const side=i%4,x=side===0?-30:side===1?w+30:Math.random()*w,y=side<2?h*(.30+Math.random()*.5):-20-Math.random()*h*.5;particles.push({x,y,vx:side===0?(2+Math.random()*5):side===1?(-2-Math.random()*5):Math.random()*3-1.5,vy:side<2?-7-Math.random()*7:2+Math.random()*2.5,rot:Math.random()*6,spin:(Math.random()-.5)*.18,w:3+Math.random()*6,h:6+Math.random()*10,color:colors[i%colors.length],gravity:.15+Math.random()*.07})}
startTime=performance.now();const frame=now=>{ctx.clearRect(0,0,w,h);for(let p of particles){p.x+=p.vx;p.vy+=p.gravity;p.y+=p.vy;p.vx*=.993;p.rot+=p.spin;if(p.y>h+30)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}particles=particles.filter(p=>p.y<h+30);if(particles.length&&now-startTime<8000)confettiAnimation=requestAnimationFrame(frame);else stopConfetti()};confettiAnimation=requestAnimationFrame(frame)}
function stopConfetti(){cancelAnimationFrame(confettiAnimation);particles=[];ctx.clearRect(0,0,canvas.width,canvas.height)}
window.addEventListener('resize',()=>{if(!$('end-screen').classList.contains('hidden'))sizeConfetti()});
restore();resize();if(game.started&&!game.final){renderAll();$('intro-screen').classList.remove('hidden')}else if(game.final){$('play-btn').textContent='PLAY NOW ▶';}
})();
</script>

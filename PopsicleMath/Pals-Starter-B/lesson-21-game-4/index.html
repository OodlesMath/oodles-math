body::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.08) 50%,rgba(255,255,255,.03));z-index:0;pointer-events:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #f7bf25;outline-offset:4px}
.app{position:relative;z-index:1;min-height:100dvh;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:clamp(117px,18vh,194px) 18px 18px}
.shell{width:min(1140px,100%);margin:0 auto;background:rgba(255,249,239,.96);border:4px solid rgba(255,255,255,.95);border-radius:31px;box-shadow:0 14px 38px rgba(60,65,104,.22),inset 0 2px 3px #fff;padding:clamp(12px,1.6vw,20px);display:flex;flex-direction:column;gap:clamp(11px,1.7vh,17px)}
.shell[hidden],.screen[hidden],.feedback[hidden]{display:none!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.game-title{font-weight:900;font-size:clamp(19px,2.3vw,28px);color:var(--purple);letter-spacing:-.03em;margin:0;line-height:1.1}
.status{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.pill{display:inline-flex;gap:7px;align-items:center;justify-content:center;background:white;border:2px solid #d4dffc;border-radius:999px;padding:6px 14px;font-size:clamp(11px,1.25vw,15px);font-weight:800;box-shadow:0 3px 0 #e7edf9;white-space:nowrap}
.pill strong{color:var(--purple)}
.audio-toggle{width:40px;height:40px;border-radius:50%;border:2px solid #cedbff;background:white;font-size:19px;box-shadow:0 3px 0 #d3dcf4;display:grid;place-items:center}
.progress{height:9px;background:#e6e9fa;border-radius:999px;overflow:hidden;margin-top:-4px}
.progress>div{height:100%;width:0%;background:linear-gradient(90deg,#39cddd,#3ca0f4,#9179f4);border-radius:inherit;transition:width .3s ease}
.question{background:#edf4ff;border:2px solid #cfe2ff;border-radius:24px;display:flex;align-items:center;gap:14px;padding:clamp(12px,1.8vw,22px);min-height:104px}
.mascot{width:clamp(54px,6.3vw,80px);height:clamp(54px,6.3vw,80px);flex-shrink:0;filter:drop-shadow(0 4px 3px rgba(92,63,41,.13))}
.q-copy{flex:1;min-width:0}.eyebrow{font-size:clamp(10px,1.15vw,14px);font-weight:900;letter-spacing:.05em;color:var(--pink);margin-bottom:3px}.q-text{font-size:clamp(19px,2.35vw,31px);line-height:1.21;font-weight:900;letter-spacing:-.035em;color:var(--blue);overflow-wrap:break-word}
.speaker{border-radius:50%;width:clamp(46px,5.3vw,61px);height:clamp(46px,5.3vw,61px);border:2px solid #b6d9ff;background:white;color:#2071e9;box-shadow:0 4px 0 #d6e6ff;display:grid;place-items:center;flex-shrink:0;transition:transform .15s}
.speaker:hover{transform:translateY(-2px)}.speaker:active{transform:translateY(3px)}.speaker svg{width:29px;height:29px}
.visual{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:clamp(185px,28vh,285px);min-height:0;overflow:hidden;background:rgba(255,255,255,.88);border:2px solid #e2eaf6;border-radius:24px;padding:10px}
.visual img{display:block;max-width:min(95%,330px);width:auto;max-height:97%;object-fit:contain;filter:drop-shadow(0 8px 7px rgba(55,71,101,.13));animation:appear .35s ease both}
.visual svg{display:block;max-width:100%;max-height:100%;animation:appear .32s ease both}
.visual .shape-art{width:min(245px,60%);height:min(240px,90%)}.visual .shape-art svg{width:100%;height:100%}
.visual .count-art{width:min(570px,96%);height:100%}
.visual .lineup{display:flex;justify-content:center;align-items:center;gap:clamp(2px,.7vw,13px);width:100%;height:100%;min-width:0}
.visual .lineup .mini{width:clamp(36px,12%,105px);max-width:105px;display:flex;align-items:center;justify-content:center;flex:0 1 auto}
.visual .lineup .mini svg{width:100%;height:auto;aspect-ratio:1;filter:drop-shadow(0 5px 3px rgba(0,0,0,.1))}
.visual .lineup .mini.emph{transform:scale(1.07)}
.screen#quiz{display:flex;flex-direction:column;gap:clamp(8px,1.2vh,11px)}
.visual .caption{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:clamp(11px,1.2vw,15px);color:#8493b9;font-weight:800;text-align:center;white-space:nowrap}
.answer-heading{font-size:clamp(11px,1.35vw,16px);color:#8a91e8;font-weight:900;letter-spacing:.11em;text-align:center;line-height:1}
.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.3vw,16px)}
.answer{min-width:0;min-height:clamp(71px,9vh,94px);border:3px solid var(--border);border-radius:21px;background:var(--lavender);color:var(--purple);font-size:clamp(15px,1.75vw,24px);font-weight:900;line-height:1.15;letter-spacing:-.035em;padding:8px;box-shadow:0 7px 0 rgba(158,169,214,.5),0 11px 16px rgba(53,58,129,.12);transition:background .16s,transform .16s,box-shadow .16s;overflow-wrap:anywhere}
.answer:hover:not(:disabled){transform:translateY(-3px);background:#e2e7ff}.answer:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 #b0bef4}
.answer:disabled{cursor:default}.answer.correct{background:#d6fbe4;border-color:#22c579;color:#087f45;box-shadow:0 4px 0 #9cdeb7;animation:pop .3s both}.answer.wrong{background:#ffe2eb;border-color:#fb77a3;color:#c02b69;box-shadow:0 4px 0 #f3a5c1;animation:shake .26s both}
.footer{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.feedback{font-size:clamp(13px,1.45vw,17px);font-weight:900;color:#31875f}.feedback.error{color:#d34c7f}.feedback.celebrate{color:#17a56a}
.next{border:2px solid #d1ddff;background:#fff;color:var(--blue);border-radius:14px;font-size:13px;font-weight:800;padding:9px 16px;box-shadow:0 3px 0 #dce4f8;margin-left:auto}.next:disabled{opacity:.45;cursor:default}
.welcome,.finish{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:clamp(430px,64vh,620px);gap:16px;padding:18px 18px 26px}
.hero-title{margin:0;color:var(--blue);font-size:clamp(29px,5.4vw,57px);line-height:1.09;font-weight:900;letter-spacing:-.04em}.welcome p,.finish p{font-size:clamp(15px,1.65vw,19px);font-weight:700;color:#5f6b95;max-width:670px;margin:0}.shape-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(5px,.9vw,15px);width:min(710px,100%);margin:4px 0 8px}.shape-chip{background:white;border:2px solid #deebff;min-width:0;aspect-ratio:1;border-radius:17px;padding:8px;display:grid;place-items:center}.shape-chip svg{width:100%;max-width:86px}
.primary{border:0;border-radius:21px;background:linear-gradient(180deg,#6548f2,#4938d8);color:#fff;padding:17px 43px;font-size:clamp(19px,2.4vw,26px);font-weight:900;box-shadow:0 7px 0 #31269e,0 14px 19px rgba(72,55,199,.16);transition:transform .15s}.primary:hover{transform:translateY(-3px)}.primary:active{transform:translateY(5px);box-shadow:0 2px 0 #31269e}

/* Ver3 – compact open-air prompt, top-left status and explicit Check → Next flow. */
.topline{justify-content:flex-start;min-height:44px}

/* Ver4 – compact aligned progress, narrower answer row, and top-left HUD. */
.topline{
  position:fixed;
  top:max(8px,env(safe-area-inset-top));
  left:clamp(10px,2.1vw,30px);
  z-index:25;
  min-height:0;
  width:max-content;
  max-width:calc(100vw - 20px);
  justify-content:flex-start;
}

.progress{flex-shrink:0;margin-top:0;margin-bottom:2px}

.answers,.footer{width:min(1130px,calc(100% - 28px));margin-left:auto;margin-right:auto}

}

  .pill{gap:4px;padding:4px 6px;font-size:9px}

const LABELS = ['Circle','Square','Triangle','Rectangle','Half-circle','Quarter-circle'];
const COLORS = {Circle:'#ff6584',Square:'#438ff2',Triangle:'#45c975',Rectangle:'#ffcb3c','Half-circle':'#a56cf0','Quarter-circle':'#ff9636'};
const TOTAL=15;
const $=id=>document.getElementById(id);
const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a)=>a[Math.floor(Math.random()*a.length)];
function shapeInner(name){const fill=COLORS[name]||'#45c975', stroke='#273b77';let content='';
switch(name){case 'Circle':content='<circle cx="50" cy="50" r="37"/>';break;case 'Square':content='<rect x="14" y="14" width="72" height="72" rx="4"/>';break;case 'Triangle':content='<polygon points="50,9 95,89 5,89"/>';break;case 'Rectangle':content='<rect x="6" y="25" width="88" height="50" rx="4"/>';break;case 'Half-circle':content='<path d="M5 78 A45 45 0 0 1 95 78 Z"/>';break;case 'Quarter-circle':content='<path d="M12 88 L12 12 A76 76 0 0 1 88 88 Z"/>';break;}
return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="${fill}" stroke="${stroke}" stroke-width="3.5" stroke-linejoin="round">${content}</g></svg>`;}
function visualIcon(k){return `<img alt="" draggable="false" src="${IMAGES[k]}">`;}
const objectGroups={
 'Circle':[['coin','gold coin'],['plate','round plate'],['cookie','cookie'],['clock','wall clock']],
 'Square':[['window','window'],['window_pane','window pane'],['picture','picture frame'],['chocolate_piece','chocolate piece']],
 'Triangle':[['ruler_tri','triangle ruler'],['warning','warning sign'],['flag','red flag'],['flag_pennant','red pennant']],
 'Rectangle':[['phone','phone'],['door','door'],['chalkboard','chalkboard'],['chocolate','chocolate bar']],
 'Half-circle':[['rainbow','rainbow'],['orange_half','orange slice'],['protractor','blue protractor'],['arched_window','arched window']],
 'Quarter-circle':[['orange_quarter','orange wedge'],['ruler_quarter','pink ruler'],['pizza','pizza slice'],['quarter_window','corner window']]
};
const BANK=[];
for(const s of LABELS){BANK.push({id:`identify-${s}`,type:'identify',shape:s,text:'What shape is this?',render:()=>`<div class="shape-art">${shapeInner(s)}</div>`,answer:s});
 for(const [image,objectName] of objectGroups[s]){
  BANK.push({id:`object-${image}`,type:'object',shape:s,text:`What shape is this ${objectName}?`,render:()=>visualIcon(image),answer:s});
 }}
const POSITION_TERMS=[['first','left',1],['second','right',2],['third','left',3],['fourth','right',4],['fifth','left',5],['third','right',3],['second','left',2],['fourth','left',4]];
POSITION_TERMS.forEach(([ord,side,n],i)=>BANK.push({id:`position-${i}`,type:'position',text:`Which shape is the ${ord} from the ${side}?`,make(){const row=shuffle(LABELS);return {row,answer:row[side==='left'?n-1:row.length-n]};},render(q){return `<div class="lineup">${q.row.map(name=>`<div class="mini">${shapeInner(name)}</div>`).join('')}</div>`;}}));
LABELS.forEach((different,i)=>{const same=LABELS[(i+2)%LABELS.length];BANK.push({id:`odd-${i}`,type:'odd',text:'Which shape is different?',shape:different,make(){const row=shuffle([different,same,same,same,same]);return {row,answer:different};},render(q){return `<div class="lineup">${q.row.map(name=>`<div class="mini">${shapeInner(name)}</div>`).join('')}</div>`;}});});
const PROPERTIES=[
 ['Half-circle','Which shape looks like half of a circle?'],
 ['Quarter-circle','Which shape looks like one quarter of a circle?']
];
PROPERTIES.forEach(([answer,text],i)=>BANK.push({id:`property-${i}`,type:'property',answer,text,render:()=>`<div class="lineup">${shuffle(LABELS).map(name=>`<div class="mini">${shapeInner(name)}</div>`).join('')}</div>`}));
function svgScene(parts){return `<svg class="count-art" viewBox="0 0 560 286" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${parts}</svg>`;}
const countArt={
 tree:svgScene('<rect x="258" y="227" width="44" height="56" rx="4" fill="#a56835"/><polygon points="280,12 231,92 329,92" fill="#37ce7c" stroke="#137e48" stroke-width="5" stroke-linejoin="round"/><polygon points="280,102 215,181 345,181" fill="#1da85e" stroke="#137e48" stroke-width="5" stroke-linejoin="round"/><polygon points="280,191 195,264 365,264" fill="#147d4a" stroke="#105e3d" stroke-width="5" stroke-linejoin="round"/>'),
 truck:svgScene('<rect x="69" y="77" width="220" height="136" rx="5" fill="#1fcb91" stroke="#107c5c" stroke-width="6"/><rect x="296" y="119" width="157" height="94" rx="5" fill="#3788fb" stroke="#2057c8" stroke-width="6"/><rect x="317" y="131" width="76" height="46" rx="3" fill="#a9eaff" stroke="#146caf" stroke-width="5"/><circle cx="140" cy="224" r="28" fill="#243049"/><circle cx="140" cy="224" r="12" fill="#aebfd5"/><circle cx="407" cy="224" r="28" fill="#243049"/><circle cx="407" cy="224" r="12" fill="#aebfd5"/>'),
 robot:svgScene('<rect x="224" y="35" width="112" height="112" rx="2" fill="#5db4fa" stroke="#2163b0" stroke-width="6"/><rect x="220" y="160" width="120" height="120" rx="2" fill="#f3be42" stroke="#ba8020" stroke-width="6"/><circle cx="251" cy="82" r="11" fill="#203875"/><circle cx="309" cy="82" r="11" fill="#203875"/><path d="M254 116 Q280 130 306 116" fill="none" stroke="#203875" stroke-width="5"/><path d="M209 180 H165 V230M351 180 H395 V230" fill="none" stroke="#ee7d8c" stroke-width="15"/><path d="M241 275 V285M319 275 V285" stroke="#596b93" stroke-width="17"/>'),
 bunting:svgScene('<path d="M40 52 Q280 15 520 52" stroke="#e0ac52" stroke-width="7" fill="none"/>'+[70,170,270,370,470].map((x,i)=>`<polygon points="${x-33},66 ${x+33},66 ${x},174" fill="${['#ff7f96','#ffcd47','#63c9f3','#a18cff','#48d49a'][i]}" stroke="#3f5182" stroke-width="4" stroke-linejoin="round"/>`).join('')),
 circles:svgScene([75,177,280,383,486].map((x,i)=>`<circle cx="${x}" cy="143" r="39" fill="${['#fb7894','#7ad7ff','#ffcd48','#ad84f4','#70d49b'][i]}" stroke="#4a5b93" stroke-width="5"/>`).join('')),
 semicircles:svgScene([137,280,423].map((x,i)=>`<path d="M${x-60} 185 A60 60 0 0 1 ${x+60} 185 Z" fill="${['#f598bd','#76c9fa','#b294f2'][i]}" stroke="#475a9e" stroke-width="5"/>`).join('')),
 quarters:svgScene([105,215,325,435].map((x,i)=>`<g transform="translate(${x-36} 92)"><path d="M0 100 L0 0 A100 100 0 0 1 100 100 Z" fill="${['#ffc549','#fd92bd','#94b7f7','#71dba5'][i]}" stroke="#455897" stroke-width="4"/></g>`).join('')),
 rectangles:svgScene([55,190,325,460].map((x,i)=>`<rect x="${x-42}" y="102" width="94" height="66" rx="4" fill="${['#56a0f5','#fac84b','#f58dab','#6dd7a5'][i]}" stroke="#3f5182" stroke-width="5"/>`).join(''))
};
const COUNT_ITEMS=[['tree','triangles',3],['truck','rectangles',3],['robot','squares',2],['bunting','triangles',5],['circles','circles',5],['semicircles','half-circles',3],['quarters','quarter-circles',4],['rectangles','rectangles',4]];
COUNT_ITEMS.forEach(([id,word,number])=>BANK.push({id:`count-${id}`,type:'count',text:id==='tree'?`How many triangles can you find in this tree?`:id==='truck'?`How many rectangles can you find in this truck?`:id==='robot'?`How many squares can you find in this robot?`:id==='bunting'?`How many triangles can you find on the bunting?`:`How many ${word} can you find?`,answer:String(number),render:()=>countArt[id]}));
let session=[],index=0,score=0,locked=false,answered=false,selectedValue=null,pending=null,audioOn=true,audioCtx=null;
const getAudio=()=>{if(!audioOn)return null;try{audioCtx||=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}catch(e){return null;}};
function tone(freq=540,dur=.16,delay=0,type='sine',vol=.06){const ctx=getAudio();if(!ctx)return;const t=ctx.currentTime+delay,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(vol,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+dur+.02);}
function sound(type){if(!audioOn)return;if(type==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.2,i*.09,'sine',.055));}else if(type==='wrong'){tone(260,.17,0,'triangle',.045);tone(205,.22,.12,'sine',.04);}else if(type==='click'){tone(500,.075,0,'sine',.025);}else if(type==='finish'){[392,523,659,784,1046].forEach((f,i)=>tone(f,.32,i*.11,'sine',.063));}}
function speakNow(){if(!('speechSynthesis' in window)||!session[index]){setFeedback('Voice is not available in this browser.',true);return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(session[index].text);u.lang='en-US';u.rate=.85;u.pitch=1.09;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='en-us' && /female|samantha|zira|jenny|ava|aria/i.test(v.name))||voices.find(v=>v.lang.toLowerCase()==='en-us')||null;speechSynthesis.speak(u);}catch(e){setFeedback('Voice is not available in this browser.',true);}}
function choicesFor(q){if(q.type==='count'){
  const n=Number(q.answer);const base=[n-2,n-1,n,n+1,n+2,n+3].filter(v=>v>=1&&v<=9&&v!==n);return shuffle([String(n),...shuffle(base).slice(0,3).map(String)]);
 }
 const other=LABELS.filter(s=>s!==q.answer);if(q.type==='position'||q.type==='odd'){const nearby=[...new Set(q.row.filter(s=>s!==q.answer))];const pool=[...nearby,...LABELS.filter(s=>s!==q.answer&&!nearby.includes(s))];return shuffle([q.answer,...pool.slice(0,3)]);}
 return shuffle([q.answer,...shuffle(other).slice(0,3)]);
}
function chooseSession(){const groups=['Circle','Square','Triangle','Rectangle','Half-circle','Quarter-circle'].map(shape=>pick(BANK.filter(q=>q.type==='object'&&q.shape===shape)));
 const types=[['identify',2],['count',2],['position',2],['odd',2],['property',1]];
 let chosen=groups.slice();for(const [type,n] of types){chosen.push(...shuffle(BANK.filter(q=>q.type===type&&!chosen.includes(q))).slice(0,n));}
 chosen=shuffle(chosen);
 return chosen.map(q=>{const made=q.make?q.make():{};return {...q,...made,answer:made.answer||q.answer};});}
function setFeedback(text,error=false){$('feedback').textContent=text;$('feedback').className='feedback'+(error?' error':' celebrate');}
function showScreen(name){for(const id of ['welcome','quiz','finish'])$(id).hidden=(id!==name);}
function showQuestion(){
 const q=session[index];locked=false;answered=false;selectedValue=null;clearTimeout(pending);
 $('questionText').textContent=q.text;
 $('visual').innerHTML=q.render(q);
 $('visual').setAttribute('aria-label',`Picture for: ${q.text}`);
 $('answers').innerHTML='';setFeedback('');
 $('check').disabled=true;$('check').hidden=false;$('next').disabled=true;$('next').hidden=true;
 $('next').textContent=index===TOTAL-1?'Finish ➜':'Next ➜';
 const options=choicesFor(q);
 options.forEach(value=>{
  const b=document.createElement('button');b.type='button';b.className='answer';
  b.textContent=value;b.dataset.value=value;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>selectAnswer(value,b));$('answers').appendChild(b);
 });
 $('counter').textContent=`🧩 Question ${index+1} / ${TOTAL}`;
 $('points').innerHTML=`⭐ <strong>${score}</strong> points`;
 $('progress').style.width=Math.round(index/TOTAL*100)+'%';
 $('progressShell').setAttribute('aria-valuenow',String(index));
 speakNow();
}
function selectAnswer(value,button){
 if(locked||answered)return;
 selectedValue=value;
 $('answers').querySelectorAll('.answer').forEach(b=>{
  const selected=b===button;b.classList.toggle('selected',selected);
  b.setAttribute('aria-pressed',String(selected));
 });
 setFeedback('');$('check').disabled=false;sound('click');
}
function checkAnswer(){
 if(locked||answered||selectedValue===null)return;
 locked=true;answered=true;$('check').disabled=true;
 const q=session[index],correct=selectedValue===q.answer;
 const selected=$('answers').querySelector('.answer.selected');
 if(correct){
  score++;setFeedback(pick(['Amazing! You got it! 🌟','Correct! Well done! 🎉','Yes! Great thinking! ✨']));sound('win');
 }else{
  setFeedback(`Good try! The answer is ${q.answer}.`,true);sound('wrong');
 }
 $('answers').querySelectorAll('button').forEach(b=>{
  b.disabled=true;
  if(b.dataset.value===q.answer)b.classList.add('correct');
  else if(b===selected)b.classList.add('wrong');
 });
 $('points').innerHTML=`⭐ <strong>${score}</strong> points`;
 $('check').hidden=true;$('next').hidden=false;$('next').disabled=false;
}
function goNext(){
 if(!answered)return;
 clearTimeout(pending);window.speechSynthesis?.cancel();
 if(index===TOTAL-1)showFinish();else{index++;showQuestion();}
}
function startGame(){window.speechSynthesis?.cancel();session=chooseSession();index=0;score=0;locked=false;answered=false;selectedValue=null;showScreen('quiz');showQuestion();sound('click');}
function showFinish(){showScreen('finish');$('progress').style.width='100%';$('progressShell').setAttribute('aria-valuenow',String(TOTAL));$('counter').textContent='🧩 All finished!';$('points').innerHTML=`⭐ <strong>${score}</strong> points`;
 const high=score>=13,mid=score>=9;$('finishTitle').textContent=high?'Shape Superstar!':mid?'Great Job!':'Well Done!';$('finishText').textContent=`You answered ${score} out of ${TOTAL} questions correctly!`;$('finalScore').textContent=`${score}/${TOTAL}`;$('finishHint').textContent=high?'You know your 2D shapes!':mid?'Keep exploring shapes everywhere!':'Every try helps you learn. Play again!';$('stars').textContent=high?'⭐⭐⭐':mid?'⭐⭐':'⭐';sound('finish');burstConfetti();}
$('shapeStrip').innerHTML=LABELS.map(s=>`<div class="shape-chip">${shapeInner(s)}</div>`).join('');
$('play').addEventListener('click',startGame);$('again').addEventListener('click',startGame);$('next').addEventListener('click',goNext);$('check').addEventListener('click',checkAnswer);$('speak').addEventListener('click',speakNow);
$('sound').addEventListener('click',()=>{audioOn=!audioOn;$('sound').textContent=audioOn?'🔊':'🔇';$('sound').setAttribute('aria-label',audioOn?'Turn sound effects off':'Turn sound effects on');$('sound').title=audioOn?'Sound effects on':'Sound effects off';if(audioOn)sound('click');});
// Always paint confetti above every game panel and dialog.
const canvas=$('confetti'),ctx=canvas.getContext('2d');let particles=[],confettiFrame=0,confettiStart=0;
function resizeCanvas(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(window.innerWidth*dpr);canvas.height=Math.round(window.innerHeight*dpr);canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function burstConfetti(){cancelAnimationFrame(confettiFrame);resizeCanvas();ctx.clearRect(0,0,window.innerWidth,window.innerHeight);if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#fa557e','#ffc738','#49b9ff','#9b6af6','#4ddaaa','#ff8138'];const W=window.innerWidth,H=window.innerHeight;particles=Array.from({length:Math.min(200,Math.max(95,W/6))},()=>({x:Math.random()*W,y:-Math.random()*H*.8-15,w:5+Math.random()*9,h:4+Math.random()*8,vy:1.8+Math.random()*4.2,vx:(Math.random()-.5)*2.8,spin:Math.random()*6,omega:(Math.random()-.5)*.15,c:pick(colors)}));confettiStart=performance.now();
 function draw(t){ctx.clearRect(0,0,W,H);const elapsed=t-confettiStart;particles.forEach(p=>{p.x+=p.vx+Math.sin(elapsed*.002+p.spin)*.4;p.y+=p.vy;p.spin+=p.omega;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(elapsed<6500)confettiFrame=requestAnimationFrame(draw);else ctx.clearRect(0,0,W,H);}confettiFrame=requestAnimationFrame(draw);
}
</script>

<body>
<div id="stage" aria-label="Three-team classroom math game"><div id="desktopContent"></div></div>
<main id="mobile" aria-label="Mobile Big Board Race"><div class="mobile-cover"></div><div id="mobileContent"></div></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
'use strict';
const NS={min:1,max:50};
const icons={speaker:'<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg>'};
const teams=['Team 1','Team 2','Team 3'];
let state={phase:'intro',round:0,sets:[],marks:[],voiceReady:false};
let lastMobile=false;
const $=id=>document.getElementById(id);
function rand(n){return Math.floor(Math.random()*n)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=rand(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function chooseDistinct(n){return shuffle(Array.from({length:NS.max-NS.min+1},(_,i)=>i+NS.min)).slice(0,n)}
function makeSession(){
 const usedPairs=new Set(),usedSets=new Set();
 const first=Array.from({length:3},()=>{
   const relations=shuffle(['<','>','=']);
   const pairs=relations.map(type=>{
     let a,b,key,attempt=0;
     do{
       if(type==='='){a=NS.min+rand(NS.max);b=a}
       else{[a,b]=chooseDistinct(2);if(type==='<'&&a>b||type==='>'&&a<b)[a,b]=[b,a]}
       key=[Math.min(a,b),Math.max(a,b)].join(':');
       attempt++;
     }while(usedPairs.has(key)&&attempt<300);
     usedPairs.add(key);return {a,b};
   });
   return {pairs};
 });
 function orderSet(count,dir){let nums,key,attempt=0;do{nums=chooseDistinct(count);key=[...nums].sort((a,b)=>a-b).join(':');attempt++}while((usedSets.has(key)||nums.join(',')===[...nums].sort((a,b)=>a-b).join(',')||nums.join(',')===[...nums].sort((a,b)=>b-a).join(','))&&attempt<300);usedSets.add(key);return {nums,dir};}
 const second=Array.from({length:3},()=>orderSet(3,'asc'));
 const directions=shuffle(['asc','asc','desc']);
 const third=Array.from({length:3},(_,i)=>orderSet(5,directions[i]));
 return [first,second,third];
}
function getCorrectSymbols(p){return p.a>p.b?'>':p.a<p.b?'<':'='}
function sorted(task){return [...task.nums].sort((a,b)=>task.dir==='asc'?a-b:b-a)}
function total(t){return state.marks.reduce((acc,r)=>acc+(Number.isInteger(r[t])?r[t]:0),0)}
function allowedPoints(){return 5}
function allMarked(){return state.marks[state.round].every(Number.isInteger)}
function speak(txt){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(txt);utter.lang='en-US';utter.rate=.87;utter.pitch=1.08;const voices=speechSynthesis.getVoices();utter.voice=voices.find(v=>/^en/i.test(v.lang)&&/female|samantha|zira|aria|google us english/i.test(v.name))||voices.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(utter)}catch(e){}}
function instruction(){return state.round===0?'Compare the numbers. Write greater than, less than, or equal to.':state.round===1?'Arrange the three numbers from smallest to greatest.':'Arrange five numbers in the correct order. Follow your team’s arrows.'}
function speechTeam(t){const q=state.sets[state.round][t];if(state.round===0)return `${teams[t]}. Compare these three pairs of numbers. `+q.pairs.map(p=>`${p.a} and ${p.b}.`).join(' ');return `${teams[t]}. Arrange ${q.nums.length} numbers from ${q.dir==='asc'?'smallest to greatest':'greatest to smallest'}. ${q.nums.join(', ')}.`}
function beep(kind='win'){
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!window._audio)window._audio=new C();const ctx=window._audio;ctx.resume();const notes=kind==='win'?[523,659,784]:kind==='finish'?[523,659,784,1046,1318]:kind==='tick'?[660]:[330,440];notes.forEach((f,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+i*.085;osc.type='sine';osc.frequency.setValueAtTime(f,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.065,start+.018);gain.gain.exponentialRampToValueAtTime(.0001,start+.18);osc.connect(gain);gain.connect(ctx.destination);osc.start(start);osc.stop(start+.2)})}catch(e){}
}
function buttonSpeaker(text,extra=''){return `<button type="button" class="speaker ${extra}" data-action="speak" data-text="${encodeURIComponent(text)}" aria-label="Play English instructions">${icons.speaker}</button>`}
function getTeamBody(t,forMobile=false){
 const q=state.sets[state.round][t],show=state.phase==='revealed';
 if(state.round===0){
  if(forMobile)return `<div class="m-pairs">${q.pairs.map(p=>`<div class="m-pair"><div class="m-pair-row"><span>${p.a}</span><span class="m-write ${show?'filled':''}">${show?`<span class="revealed-symbol">${getCorrectSymbols(p)}</span>`:''}</span><span>${p.b}</span></div></div>`).join('')}</div>`;
  return `<div class="pairs">${q.pairs.map(p=>`<div class="pair-item"><div class="pair-main"><span>${p.a}</span><span class="write-blank ${show?'filled':''}">${show?`<span class="revealed-symbol">${getCorrectSymbols(p)}</span>`:''}</span><span>${p.b}</span></div></div>`).join('')}</div>`;
 }
 const seq=sorted(q),sym=q.dir==='asc'?'&lt;':'&gt;';const five=state.round===2;
 const slots=Array.from({length:q.nums.length},(_,i)=>`<span class="order-blank ${show?'filled':''}">${show?`<span class="revealed-number">${seq[i]}</span>`:''}</span>${i<q.nums.length-1?`<span class="order-sym">${sym}</span>`:''}`).join('');
 if(forMobile)return `<div class="task-note">${q.dir==='asc'?'SMALLEST → GREATEST':'GREATEST → SMALLEST'}</div><div class="m-given">${q.nums.join(', ')}</div><div class="m-order ${five?'five':''}">${slots}</div>`;
 return `<div class="task-note">${q.dir==='asc'?'SMALLEST → GREATEST':'GREATEST → SMALLEST'}</div><div class="given-set">${q.nums.join(', ')}</div><div class="number-sequence ${five?'five':''}">${slots}</div>`;
}
function scoreControls(t,mobile){if(state.phase!=='revealed')return '';const max=allowedPoints(),score=state.marks[state.round][t];return `<div class="${mobile?'m-score-options':'score-zone'}"><span>SCORE</span>${Array.from({length:max+1},(_,i)=>`<button class="score-option ${score===i?'selected':''}" data-action="points" data-team="${t}" data-points="${i}" aria-label="Give ${i} point${i!==1?'s':''} to ${teams[t]}" aria-pressed="${score===i}">${i}</button>`).join('')}</div>`}
function nextButton(){if(state.phase==='question')return `<button class="action" data-action="check">CHECK ✓</button>`;if(state.phase==='revealed')return `<button class="action secondary" data-action="next" ${allMarked()?'':'disabled'}>${state.round===2?'FINISH GAME ★':'NEXT ROUND →'}</button>`;return ''}
function displayDesktop(){let out='';
 if(state.phase==='intro'){
  out=`<section class="screen" aria-label="Welcome"><div class="hero-title">BIG BOARD RACE!</div><div class="hero-sub">COMPARING NUMBERS • 3 TEAMS</div><div class="hero-round"><span class="round-pill">3 FUN ROUNDS</span><span class="round-stars">★★★</span></div><div class="intro-message">Ready, Set, Solve!</div><div class="intro-explain">Write on the board • Check together • Earn stars</div><div class="bottom-actions"><button class="action" data-action="start">PLAY NOW ▶</button></div></section>`;
 } else if(state.phase==='finished'){
  const scores=teams.map((_,i)=>total(i)),best=Math.max(...scores);out=`<section class="screen" aria-label="Final scores"><div class="result-title">AMAZING JOB!</div><div class="result-sub">Three teams, three super challenges!</div><div class="results">${scores.map((s,i)=>`<div class="result-team"><div class="rank-symbol">${s===best?'🏆':'⭐'}</div><div class="result-points">${s} <small style="font-size:28px">/ 15</small></div><div class="winner">${s===best?'TOP TEAM!':'GREAT WORK!'}</div></div>`).join('')}</div><div class="bottom-actions"><button class="action" data-action="start">PLAY AGAIN ↻</button></div></section>`;
 }else{
  const title=['Compare the Numbers!','Order Three Numbers!','Order Five Numbers!'][state.round];
  out=`<section class="screen" aria-label="Round ${state.round+1}"><div class="hero-title">BIG BOARD RACE!</div><div class="hero-sub">${title}</div><div class="hero-round"><span class="round-pill">ROUND ${state.round+1} / 3</span><span class="round-stars">${'★'.repeat(state.round+1)}</span></div><div class="prompt-line"><span>${instruction()}</span>${buttonSpeaker(instruction())}</div><div class="team-grid">${teams.map((t,i)=>`<section class="team" aria-label="${t}"><div class="team-score">★ <strong>${total(i)}</strong> / 15 ${buttonSpeaker(speechTeam(i),'team-speaker')}</div><div class="team-body">${getTeamBody(i)}</div></section>`).join('')}</div>${state.phase==='revealed'?`<div class="scoring">${teams.map((_,i)=>scoreControls(i,false)).join('')}</div>`:''}<div class="bottom-actions">${nextButton()}${state.phase==='revealed'&&!allMarked()?'<span class="score-hint">Choose each team’s score</span>':''}</div></section>`;
 }
 $('desktopContent').innerHTML=out;
}
function displayMobile(){const mobile=$('mobile'),scroll=mobile.scrollTop;let out='';
 if(state.phase==='intro')out=`<div class="mobile-top"><h1>BIG BOARD RACE!</h1><div class="mobile-round">3 TEAMS • 3 FUN ROUNDS</div><div class="mobile-msg">Ready, Set, Solve!<p style="font-size:14px">Write on the board. Earn stars together!</p></div></div><div class="mobile-buttons"><button class="action" data-action="start">PLAY NOW ▶</button></div>`;
 else if(state.phase==='finished'){const scores=teams.map((_,i)=>total(i)),best=Math.max(...scores);out=`<div class="mobile-top"><h1>AMAZING JOB!</h1><div class="mobile-round">Your final team scores</div></div><div class="mobile-result">${scores.map((s,i)=>`<div class="result-row ${s===best?'winning':''}"><span>${s===best?'🏆':'⭐'} ${teams[i]}</span><strong>${s} / 15</strong><span>${s===best?'WINNER!':'GREAT!'}</span></div>`).join('')}</div><div class="mobile-buttons"><button class="action" data-action="start">PLAY AGAIN ↻</button></div>`}
 else out=`<div class="mobile-top"><h1>BIG BOARD RACE!</h1><div class="mobile-round">ROUND ${state.round+1} / 3 • ${['COMPARE TWO NUMBERS','ORDER THREE NUMBERS','ORDER FIVE NUMBERS'][state.round]}</div><div class="mobile-prompt"><span>${instruction()}</span>${buttonSpeaker(instruction())}</div></div><div class="mobile-teams">${teams.map((name,i)=>`<section class="mobile-team"><h2>${name.toUpperCase()}</h2><div class="m-score">★ ${total(i)} / 15 &nbsp; ${buttonSpeaker(speechTeam(i),'m-team-speaker')}</div>${getTeamBody(i,true)}${scoreControls(i,true)}</section>`).join('')}</div><div class="mobile-buttons">${nextButton()}${state.phase==='revealed'&&!allMarked()?'<div class="score-hint">Choose each team’s score first.</div>':''}</div>`;
 $('mobileContent').innerHTML=out;mobile.scrollTop=scroll;
}
function render(){displayDesktop();displayMobile()}
function start(){state={phase:'question',round:0,sets:makeSession(),marks:[[null,null,null],[null,null,null],[null,null,null]],voiceReady:true};beep('tick');render();setTimeout(()=>speak(instruction()),350)}
function check(){if(state.phase!=='question')return;state.phase='revealed';beep('win');render()}
function next(){if(state.phase!=='revealed'||!allMarked())return;beep('tick');if(state.round===2){state.phase='finished';render();speak('Amazing job! Great work, everyone!');beep('finish');startConfetti()}else{state.round++;state.phase='question';render();setTimeout(()=>speak(instruction()),250)}}
function setPoints(t,p){if(state.phase!=='revealed'||p<0||p>allowedPoints())return;state.marks[state.round][t]=p;beep('tick');render()}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action;if(action==='start')start();else if(action==='check')check();else if(action==='next')next();else if(action==='points')setPoints(+btn.dataset.team,+btn.dataset.points);else if(action==='speak')speak(decodeURIComponent(btn.dataset.text||''))});
function resize(){const w=innerWidth,h=innerHeight,mobile=(w<850)||(h>w*1.04);if(lastMobile!==mobile){document.body.classList.toggle('mobile-layout',mobile);lastMobile=mobile}const sc=Math.min(w/1671,h/941);const stage=$('stage');stage.style.transform=`scale(${sc})`;stage.style.left=`${(w-1671*sc)/2}px`;stage.style.top=`${(h-941*sc)/2}px`;}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);
/* Confetti is deliberately on top of all other elements */
function startConfetti(){const cv=$('confetti'),ctx=cv.getContext('2d');if(!ctx)return;const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;const dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cv.style.display='block';const cols=['#ff596c','#ffbe2e','#2dc6fe','#67d35d','#a66ef5','#ff914b'];const particles=Array.from({length:reduce?50:180},()=>({x:Math.random()*innerWidth,y:-(Math.random()*innerHeight),vx:(Math.random()-.5)*2.6,vy:1.7+Math.random()*3.3,w:4+Math.random()*7,h:7+Math.random()*10,theta:Math.random()*7,spin:(Math.random()-.5)*.12,col:cols[rand(cols.length)]}));const since=performance.now();function frame(now){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.theta+=p.spin;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.theta);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}if(now-since<6500&&state.phase==='finished')requestAnimationFrame(frame);else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.style.display='none'}}requestAnimationFrame(frame)}
render();resize();
// Optional enhancement: Poppins is fetched without delaying the self-contained game.
window.addEventListener('load',()=>{try{const fontLink=document.createElement('link');fontLink.rel='stylesheet';fontLink.href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap';document.head.appendChild(fontLink)}catch(e){}},{once:true});
</script>
</body>
</html>

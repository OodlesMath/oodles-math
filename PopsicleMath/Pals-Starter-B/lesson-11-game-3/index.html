.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04) 58%,rgba(15,96,30,.08))}
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.site-header{width:min(1140px,100%);margin:0 auto;padding:18px 18px 7px;min-height:80px;display:flex;align-items:center;justify-content:flex-start}
.brand{display:flex;align-items:center;gap:11px;width:max-content;max-width:calc(100% - 112px);padding:8px 17px 8px 10px;border:3px solid rgba(255,255,255,.94);border-radius:21px;background:rgba(255,255,255,.93);box-shadow:0 6px 20px rgba(36,96,126,.11)}
.brand-symbol{width:41px;height:41px;display:grid;place-items:center;border-radius:14px;background:#fff1bc;font-size:25px;box-shadow:inset 0 -3px rgba(247,176,21,.2)}
.brand-title{font-weight:900;color:#0289c4;line-height:1.05;font-size:clamp(15px,2.15vw,21px);letter-spacing:-.6px}
.brand-sub{color:#6093a0;font-size:10px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.main-wrap{width:min(960px,calc(100% - 24px));margin:auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:7px 0 23px}
.panel{background:rgba(255,255,255,.96);border:4px solid #fff;box-shadow:0 16px 48px rgba(33,94,125,.18),0 6px 0 rgba(44,131,139,.10);border-radius:33px;padding:clamp(17px,3vw,29px);width:100%}
.screen{animation:enter .33s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(11px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.welcome{text-align:center;max-width:750px;margin:auto;padding:clamp(23px,4vw,42px)}
.mascot{width:106px;height:106px;margin:0 auto 11px;display:grid;place-items:center;font-size:68px;background:#f1fce6;border-radius:34px;box-shadow:0 8px 0 #cfe6ac;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1,h2,h3,p{margin:0}
.welcome h1{color:#117ed1;letter-spacing:-1.8px;font-size:clamp(29px,5vw,47px);line-height:1.14;font-weight:900}
.welcome-lead{font-size:clamp(15px,2.6vw,19px);color:#56677b;font-weight:650;margin:10px 0 23px}
.section-label{font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:#7c8da0;font-weight:850;text-align:left;margin:0 0 8px 4px}
.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;text-align:left;margin-bottom:23px}
.mode-option{border:3px solid #e3ebef;background:#f7fbfc;border-radius:20px;padding:14px 12px;min-height:119px;display:flex;flex-direction:column;gap:5px;box-shadow:0 5px 0 #d4e1e8;color:var(--ink);transition:transform .12s,border-color .12s,background .12s}
.mode-option:hover{transform:translateY(-3px)}
.mode-option.active{border-color:#58cc02;background:#eeffde;box-shadow:0 5px 0 #b5df93}
.mode-option .mode-emoji{font-size:24px;line-height:1.1}
.mode-option .mode-head{font-size:15px;font-weight:900;line-height:1.25}
.mode-option .mode-desc{font-size:12px;color:#667b8b;font-weight:650}
.btn{border:0;border-radius:18px;padding:14px 22px;min-height:51px;display:inline-flex;justify-content:center;align-items:center;gap:8px;font-size:15px;font-weight:900;transition:transform .1s,filter .1s;box-shadow:0 5px 0 rgba(0,0,0,.16)}
.btn:not(:disabled):hover{filter:brightness(1.045);transform:translateY(-2px)}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn-green{background:var(--green);color:white;box-shadow:0 6px 0 var(--green-dark)}
.btn-blue{background:var(--blue);color:white;box-shadow:0 6px 0 var(--blue-dark)}
.btn-grey{background:#e8f0f5;color:#435b75;box-shadow:0 5px 0 #c9d8e3}
.btn-yellow{background:var(--yellow);color:#5b4700;box-shadow:0 6px 0 #e1a900}
.btn-wide{width:min(330px,100%);font-size:20px;min-height:62px;border-radius:20px}
.welcome-note{margin-top:16px;font-size:12px;color:#778b99;font-weight:600}
.quiz{width:100%}
.quiz-head{display:flex;align-items:center;gap:15px;justify-content:space-between;margin-bottom:12px}
.quiz-title{font-weight:900;font-size:clamp(17px,2.8vw,23px);color:#1985c5;line-height:1.1}
.quiz-sub{font-size:12px;color:#7e8c99;font-weight:800;margin-top:4px}
.top-right{display:flex;align-items:center;gap:9px;flex-shrink:0}
.score-chip{font-size:17px;font-weight:900;color:#a7780d;background:#fff5cd;border:2px solid #f5dd88;padding:8px 12px;border-radius:14px;white-space:nowrap}
.sound-toggle{border:2px solid #d7edf8;background:#eaf8ff;border-radius:13px;min-width:43px;height:43px;font-size:19px;display:grid;place-items:center}
.progress-track{height:13px;background:#e9f1f5;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.04);margin:0 0 10px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#91e544);border-radius:999px;transition:width .34s}
.step-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.step-caption{color:#8293a5;text-transform:uppercase;letter-spacing:.7px;font-size:11px;font-weight:900}
.step-dots{display:flex;gap:5px;flex:1;max-width:250px}
.step-dot{height:6px;border-radius:99px;background:#e1ebef;flex:1;transition:background .15s}
.step-dot.on{background:#22a8e4}
.story{display:grid;gap:7px;margin-bottom:12px}
.story-line{min-height:55px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 11px 9px 17px;border-radius:16px;background:#f2f9fd;border:2px solid #d8ecf5;animation:appear .25s ease-out both}
.story-line.active{background:#eefae8;border-color:#aadea4}
.story-line.past{opacity:.85}
.story-copy{font-size:clamp(14px,2.4vw,19px);line-height:1.44;font-weight:750;color:#293d55}
.voice-btn{flex:none;width:39px;height:39px;display:grid;place-items:center;border:0;background:#1cb0f6;color:#fff;border-radius:50%;box-shadow:0 4px 0 #138cc7;font-size:19px}
.voice-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #138cc7}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.diagram{min-height:152px;background:linear-gradient(180deg,#fbfdff,#f0faff);border:2px dashed #b7dfee;border-radius:23px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.diagram-caption{font-size:11px;font-weight:850;letter-spacing:.7px;text-transform:uppercase;color:#58849b;margin-bottom:10px;align-self:center}
.waiting-visual{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#84b6c9;gap:7px;min-height:112px}
.waiting-visual .wait-icon{font-size:43px;animation:floaty 3s ease-in-out infinite}
.waiting-visual span:last-child{font-size:13px;font-weight:750}
.object-cell{width:var(--icon-size,45px);height:var(--icon-size,45px);display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.8);border:1px solid #e0ecf3;flex:none;animation:pop .26s both}
.object-cell.first{background:rgba(210,240,255,.82);border-color:#b6e4f9}
.object-cell.more{background:rgba(255,244,193,.92);border-color:#f4dc80}
.object-cell img{width:96%;height:96%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.items-grid{--icon-size:46px;display:grid;grid-template-columns:repeat(5,var(--icon-size));grid-auto-rows:var(--icon-size);gap:4px;justify-content:start;align-content:start;width:max-content}
.items-grid .object-cell:nth-child(n+16){animation-delay:.08s}
.add-set{display:flex;align-items:center;justify-content:center;flex-direction:column;min-width:0}
.add-set-label{font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.6px;color:#3d95bd;margin-bottom:7px}
.add-visual{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:25px;min-height:130px;max-width:100%}
.ten-circle{position:relative;padding:14px;border-radius:26px;flex:none}
.ten-circle:after{content:"";position:absolute;inset:2px 1px;border:4px solid #ff9447;border-radius:48% 51% 50% 48%/52% 48% 54% 49%;transform:rotate(-3deg);pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.42);animation:circleIn .5s ease-out both}
@keyframes circleIn{from{opacity:0;transform:rotate(-6deg) scale(.85)}to{opacity:1;transform:rotate(-3deg) scale(1)}}
.add-extras{padding:8px 0;min-width:0}
.add-extras .items-grid{--icon-size:46px}
.add-key{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:9px;font-size:11px;color:#6c8596;font-weight:750}
.key-marker{width:11px;height:11px;display:inline-block;border-radius:4px;vertical-align:middle;margin-right:4px;border:1px solid #b8dce7}
.key-marker.original{background:#d3efff}.key-marker.added{background:#fff0aa;border-color:#e9d57c}
.sub-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 2px 16px;scrollbar-color:#a9d6e9 transparent;scrollbar-width:thin}
.sub-row{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:0;width:max-content;margin-inline:auto;min-height:70px}
.sub-group{display:flex;gap:3px;align-items:center;flex:none;position:relative}
.sub-group .object-cell{width:var(--sub-icon-size,44px);height:var(--sub-icon-size,44px)}
.sub-group.taken{border-left:3px dashed #fb923c;padding-left:12px;margin-left:10px}
.sub-group.taken .object-cell{animation:fadeTake .45s both}
@keyframes fadeTake{from{opacity:1;filter:grayscale(0)}to{opacity:.36;filter:grayscale(.65)}}
.sub-legend{margin-top:3px;display:flex;gap:15px;justify-content:center;font-size:11px;font-weight:700;color:#718296}
.swipe-note{font-size:10px;color:#7799a7;margin-top:4px;display:none}
.question-box{margin-top:12px;background:#fff9e9;border:2px solid #f7e3a5;border-radius:16px;padding:12px 13px;display:flex;align-items:center;justify-content:space-between;gap:11px;animation:appear .28s both}
.question-box .story-copy{color:#614c1d}
.answer-heading{font-size:12px;font-weight:900;color:#687f93;margin:13px 0 9px;text-align:center;letter-spacing:.25px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.answer{min-height:60px;border:3px solid #a58bfa;border-radius:18px;color:white;background:linear-gradient(#9870f2,#855de0);box-shadow:0 5px 0 #6747b5;font-weight:900;font-size:clamp(16px,2.9vw,23px);text-shadow:0 1px 2px rgba(44,15,112,.25);position:relative;transition:transform .12s,box-shadow .12s,background .12s,border-color .12s}
.answer:not(:disabled):hover{filter:brightness(1.05);transform:translateY(-2px)}
.answer:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #6747b5}
.answer.selected{border-color:#1698e8;box-shadow:0 0 0 3px #daf4ff,0 5px 0 #2d77af;transform:translateY(-1px)}
.answer.correct{background:linear-gradient(#6adc23,#47b90a);border-color:#b3f76b;box-shadow:0 5px 0 #368a08;opacity:1}
.answer.wrong{background:linear-gradient(#ffaf66,#f18750);border-color:#ffd3a6;box-shadow:0 5px 0 #d66b35;opacity:1}
.answer.unselected-after{opacity:.61}
.answer:disabled{cursor:default}
.answer .status-mark{position:absolute;top:-10px;right:-8px;border:2px solid white;border-radius:50%;height:25px;width:25px;background:#fff;color:#279a00;display:grid;place-items:center;font-size:14px;text-shadow:none}
.answer.wrong .status-mark{color:#d26415}
.feedback{margin:11px auto 0;border-radius:15px;padding:10px 15px;font-weight:900;text-align:center;font-size:15px;animation:appear .26s both}
.feedback.good{background:#e7f9df;color:#359007;border:2px solid #b9eaa3}
.feedback.try{background:#fff2db;color:#ac6721;border:2px solid #f8d9a4}
.action-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:15px;padding-top:12px;border-top:2px dashed #ddebf0}
.action-row .btn{min-width:130px}
.action-row .action-main{min-width:200px;margin-left:auto}
.finish{text-align:center;max-width:730px;margin:auto;padding:clamp(19px,4vw,33px)}
.medal{font-size:69px;line-height:1;animation:floaty 2.6s infinite;margin-bottom:7px}
.finish h2{font-size:clamp(27px,4.5vw,43px);color:#1592cf;font-weight:900;line-height:1.1}
.finish .congrats{color:#677b90;font-size:15px;font-weight:700;margin:8px 0 18px}
.score-circle{width:132px;height:132px;margin:0 auto 18px;background:#fff8d7;border:8px solid #ffcf41;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 0 #e1ad26}
.score-circle b{color:#b17a07;font-size:35px;font-weight:900;line-height:1.1}
.score-circle small{color:#a18438;font-weight:800;font-size:10px;text-transform:uppercase}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.result-item{padding:11px 5px;border:2px solid #e4edf4;border-radius:16px;background:#f8fbff}
.result-item strong{font-size:22px;display:block;color:#526ed2;line-height:1.2}
.result-item span{font-size:11px;color:#6f8394;font-weight:800}
.finish-actions{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.review-details{margin-top:19px;text-align:left}
.review-details summary{font-size:12px;font-weight:800;color:#53788f;cursor:pointer;list-style:none;text-decoration:underline;text-underline-offset:3px;text-align:center}
.review-list{margin-top:8px;max-height:190px;overflow-y:auto;display:grid;gap:6px}
.review-row{padding:6px 9px;border-radius:10px;background:#f4f8fb;color:#53657a;font-size:11px;font-weight:700;display:flex;gap:10px;align-items:center}
.review-row b{color:#0c89a9;margin-left:auto;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999999;width:100%;height:100%}
@media(max-width:700px){
 .site-header{min-height:70px;padding:10px 12px 5px}.brand{max-width:calc(100% - 88px);padding:6px 11px 6px 7px}.brand-symbol{width:34px;height:34px;font-size:21px}
 .main-wrap{width:calc(100% - 16px);padding:6px 0 12px}.panel{padding:15px;border-radius:25px;border-width:3px}
 .mode-grid{gap:8px}.mode-option{min-height:115px;padding:10px 9px}.mode-option .mode-head{font-size:12px}.mode-option .mode-desc{font-size:10px}
 .story-line{min-height:51px;padding:8px 9px 8px 12px}.story-copy{font-size:clamp(13px,3.4vw,16px)}
 .diagram{padding:10px 8px;min-height:143px}.items-grid{--icon-size:39px}.ten-circle{padding:12px}.add-extras .items-grid{--icon-size:39px}.add-visual{gap:9px}
 .answer{min-height:60px;font-size:clamp(14px,4.2vw,19px)}.answers{gap:9px}.action-row .btn{min-width:101px;font-size:13px;padding:10px 13px}.action-row .action-main{min-width:145px}
 .sub-group .object-cell{width:40px;height:40px}.swipe-note{display:block}
}
@media(max-width:440px){
 .site-header{min-height:57px;padding:5px 12px 2px}
 .panel{padding:10px}.quiz-head{gap:8px}.quiz-title{font-size:17px}.quiz-sub{font-size:10px}.score-chip{font-size:14px;padding:8px}.sound-toggle{width:38px;height:38px;min-width:38px;font-size:17px}
 .story-line{min-height:46px}.voice-btn{height:34px;width:34px;font-size:17px}
 .diagram{min-height:132px}.diagram-caption{margin-bottom:6px}.items-grid,.add-extras .items-grid{--icon-size:31px;gap:2px}.ten-circle{padding:6px}.add-visual{gap:6px}.add-key{margin-top:5px}
 .mode-grid{grid-template-columns:1fr}.mode-option{min-height:69px;flex-direction:row;align-items:center;gap:9px}.mode-option .mode-emoji{font-size:27px}.mode-copy{flex:1}
 .welcome{padding:20px 15px}.welcome h1{font-size:30px}.mascot{width:82px;height:82px;font-size:55px}
 .sub-group .object-cell{width:38px;height:38px}
 .answer{font-size:15px;padding:5px 3px;min-height:53px}.action-row{margin-top:9px;padding-top:8px}.action-row .action-main{min-width:132px}
}
@media(max-height:900px) and (min-width:720px){
 .site-header{min-height:55px;padding:5px 18px 1px}.panel{padding:12px 20px}.main-wrap{padding:1px 0 3px}.diagram{min-height:105px;padding:6px}.story-line{min-height:46px}.story{margin-bottom:4px}.quiz-head{margin-bottom:4px}.step-line{margin-bottom:4px}.answer{min-height:46px}.action-row{margin-top:7px;padding-top:6px}.items-grid{--icon-size:39px}.add-extras .items-grid{--icon-size:39px}.ten-circle{padding:9px}.add-visual{min-height:98px}.question-box{margin-top:8px;padding:8px 12px}.answer-heading{margin:8px 0}
}

/* ===== VERSION 2: precise storyboard layout, independent answer area ===== */
.mascot,.waiting-visual .wait-icon{animation:none!important}
.site-header{width:min(1240px,100%);min-height:82px;justify-content:space-between;gap:16px;padding:12px 18px 7px}
.site-header .brand{max-width:100%;flex:none}
.header-hud{display:flex;min-width:0;flex:1;align-items:center;gap:13px;justify-content:flex-end}
.header-hud[hidden]{display:none!important}
.hud-progress{flex:1;min-width:90px;max-width:480px;background:rgba(255,255,255,.93);border:2px solid rgba(255,255,255,.98);border-radius:23px;padding:10px 15px;box-shadow:0 5px 16px rgba(21,83,125,.12)}
.hud-progress-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#317fa4;font-size:12px;font-weight:900;margin-bottom:6px}
.hud-progress .progress-track{margin:0;height:11px;background:#dfeaf1}
.hud-steps{display:flex;gap:4px;min-width:90px;width:28%;max-width:148px}
.hud-steps .step-dot{height:8px}
.hud-badges{display:flex;gap:8px;align-items:center;flex:none}
.hud-badges .score-chip{background:#fff5cd;border-color:#f5dd88;box-shadow:0 3px 0 rgba(191,142,36,.21);padding:7px 10px;min-height:41px;display:flex;align-items:center}

function generateTrueChoices(q){
 // Every displayed equation is mathematically true; exactly one describes the story.
 const a=q.firstNumber,b=q.secondNumber,correct=q.correctEquation;
 const candidates=[];
 for(const sign of ['+','−'])for(let n=1;n<=20;n++){
   const result=sign==='+'?a+n:a-n;
   if(result<0||result>20||((sign===q.operator||(sign==='−'&&q.operator==='-'))&&n===b))continue;
   candidates.push({equation:`${a} ${sign} ${n} = ${result}`,rank:Math.abs(n-b)+(sign!==q.operator?1.15:0)});
 }
 const plus=shuffle(candidates.filter(x=>x.equation.includes(' + '))).sort((x,y)=>x.rank-y.rank);
 const minus=shuffle(candidates.filter(x=>x.equation.includes(' − '))).sort((x,y)=>x.rank-y.rank);
 const preferred=q.operator==='+'?minus:plus;
 const others=shuffle(candidates).sort((x,y)=>x.rank-y.rank);
 const picked=[];
 const add=(c)=>{if(c&&c.equation!==correct&&!picked.includes(c.equation))picked.push(c.equation)};
 // Include at least one alternative-operation option when possible.
 add(preferred[0]);for(const c of others){if(picked.length>=3)break;add(c)};
 return shuffle([correct,...picked]);
}

function nextQuestion(){if(!checked)return;stopSpeech();tapSound();qIndex++;if(qIndex>=questions.length){renderFinish();burstConfetti();goodSound();return}step=0;selected=-1;checked=false;renderQuestion();speakCurrentStep()}
function renderFinish(){stopSpeech();document.querySelector('.site-header').classList.remove('playing');$id('headerHud').hidden=true;const stats=balanceStats(),total=questions.length,accuracy=Math.round(score/total*100);const headline=accuracy===100?"Perfect Score! You're a Math Star!":accuracy>=80?'Excellent Work!':accuracy>=50?'Great Effort! Keep Practicing!':'Good Try! Let\'s Practice Again!';
 screen.innerHTML=`<section class="panel finish screen"><div class="medal" aria-hidden="true">🏆</div><h2>AMAZING WORK!</h2><p class="congrats">${esc(headline)}</p><div class="score-circle"><b>${score} / ${total}</b><small>Your score</small></div><div class="results"><div class="result-item"><strong>${stats.addition.correct} / ${stats.addition.total}</strong><span>➕ Addition</span></div><div class="result-item"><strong>${stats.subtraction.correct} / ${stats.subtraction.total}</strong><span>➖ Subtraction</span></div><div class="result-item"><strong>${accuracy}%</strong><span>🎯 Accuracy</span></div></div><div class="finish-actions"><button type="button" id="againButton" class="btn btn-green">🔄 PLAY AGAIN</button><button type="button" id="homeButton" class="btn btn-grey">🏠 HOME</button></div><details class="review-details"><summary>Review your answers ▾</summary><div class="review-list">${solved.map((s,i)=>`<div class="review-row"><span>${s.correct?'✅':'🟠'}</span><span>Question ${i+1} · ${s.id}</span><b>${esc(s.equation)}</b></div>`).join('')}</div></details></section>`;
 $id('againButton').addEventListener('click',startGame);$id('homeButton').addEventListener('click',()=>{tapSound();renderWelcome()});
}
// Lightweight confetti always drawn above the result card.
const canvas=$id('confetti'),ctx=canvas.getContext('2d');let particles=[],burstHandle=0,burstStarted=0;
function canvasSize(){const dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(window.innerWidth*dpr);canvas.height=Math.round(window.innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
canvasSize();window.addEventListener('resize',canvasSize,{passive:true});
function burstConfetti(){cancelAnimationFrame(burstHandle);canvasSize();particles=[];const count=window.matchMedia('(prefers-reduced-motion: reduce)').matches?55:190;const cols=['#58cc02','#1cb0f6','#ffc800','#ff8fb3','#ce82ff','#ff793d'];const w=innerWidth,h=innerHeight;for(let i=0;i<count;i++){const side=i%2===0;particles.push({x:side?-30:w+30,y:h*.3+Math.random()*h*.45,vx:(side?1:-1)*(2+Math.random()*7),vy:-5-Math.random()*7,g:.12+Math.random()*.12,a:Math.random()*6.283,spin:(Math.random()-.5)*.25,size:4+Math.random()*6,color:cols[Math.floor(Math.random()*cols.length)],opacity:1});}burstStarted=performance.now();burstHandle=requestAnimationFrame(drawConfetti)}
function drawConfetti(t){const w=window.innerWidth,h=window.innerHeight;ctx.clearRect(0,0,w,h);const elapsed=t-burstStarted;for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.a+=p.spin;p.vx*=.993;if(elapsed>2300)p.opacity=Math.max(0,1-(elapsed-2300)/1800);ctx.save();ctx.globalAlpha=p.opacity;ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.64);ctx.restore();}if(elapsed<4100)burstHandle=requestAnimationFrame(drawConfetti);else{particles=[];ctx.clearRect(0,0,w,h)}}
// Friendly keyboard controls for teacher use on laptop.
document.addEventListener('keydown',e=>{if(!questions.length||!$id('actionButton'))return;if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'&&(step===1||step===3)){e.preventDefault();$id('actionButton').click()}if(e.key==='ArrowLeft'&&step>0&&!checked){e.preventDefault();$id('backButton').click()}if(step===4&&!checked&&['1','2','3','4'].includes(e.key)){e.preventDefault();screen.querySelectorAll('[data-answer]')[Number(e.key)-1]?.click()}if(e.key==='Enter'&&document.activeElement===document.body){e.preventDefault();$id('actionButton').click()}});
// Validate the bundled bank before starting; the quiz must never show a faulty equation.
function validateBank(){const ids=new Set(),signatures=new Set();let ac=0,sc=0;for(const q of BANK){if(ids.has(q.id)||!ICONS[q.iconKey])throw Error('Invalid question or missing icon: '+q.id);ids.add(q.id);const addition=q.type==='addition';if(addition)ac++;else sc++;const ans=addition?q.firstNumber+q.secondNumber:q.firstNumber-q.secondNumber;if(ans!==q.answer||q.firstNumber>20||q.answer<0||q.answer>20||addition&&q.answer<10||!addition&&q.firstNumber<10||q.choices.length!==4||q.choices.filter(c=>c===q.correctEquation).length!==1)throw Error('Invalid math data: '+q.id);const sig=addition?[q.firstNumber,q.secondNumber].sort((a,b)=>a-b).join('+'):q.firstNumber+'-'+q.secondNumber;if(signatures.has(sig+(addition?'+':'-')))throw Error('Duplicate equation: '+q.id);signatures.add(sig+(addition?'+':'-'));}if(BANK.length!==40||ac!==20||sc!==20)throw Error('The question bank must contain 20 addition and 20 subtraction problems')}
try{validateBank();renderWelcome()}catch(e){screen.innerHTML='<div class="panel"><h2>Game data error</h2><p>Please check the question bank.</p></div>';console.error(e)}
</script>
</body>
</html>

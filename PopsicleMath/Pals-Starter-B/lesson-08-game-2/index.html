    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.voices = [];
                this.initVoices();
            }
            initVoices() {
                if ('speechSynthesis' in window) {
                    const load = () => {
                        this.voices = window.speechSynthesis.getVoices();
                    };
                    load();
                    if (window.speechSynthesis.onvoiceschanged !== undefined) {
                        window.speechSynthesis.onvoiceschanged = load;
                    }
                }
            }
            initCtx() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playSuccess() {
                if (this.muted) return;
                this.initCtx();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }
            playWrong() {
                if (this.muted) return;
                this.initCtx();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.22);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }
            playPop() {
                if (this.muted) return;
                this.initCtx();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            }
            getBestNaturalVoice() {
                if (!this.voices || this.voices.length === 0) return null;
                const priorityKeywords = [
                    'google us english',
                    'microsoft aria online (natural)',
                    'microsoft jenny online (natural)',
                    'natural',
                    'samantha',
                    'siri'
                ];
                for (let kw of priorityKeywords) {
                    const match = this.voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(kw));
                    if (match) return match;
                }
                return this.voices.find(v => v.lang.startsWith('en')) || this.voices[0];
            }
            speakText(text, onEndCallback = null) {
                if (this.muted || !('speechSynthesis' in window)) {
                    if (onEndCallback) onEndCallback();
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.88;
                utterance.pitch = 1.05;
                const bestVoice = this.getBestNaturalVoice();
                if (bestVoice) {
                    utterance.voice = bestVoice;
                }
                let completed = false;
                const handleFinish = () => {
                    if (!completed) {
                        completed = true;
                        if (onEndCallback) onEndCallback();
                    }
                };
                utterance.onend = handleFinish;
                utterance.onerror = handleFinish;
                const fallbackMs = Math.max(1200, (text.length / 8) * 1000 + 700);
                setTimeout(handleFinish, fallbackMs);
                window.speechSynthesis.speak(utterance);
            }
        }
        const audioFX = new SoundFX();
        function toggleSound() {
            audioFX.muted = !audioFX.muted;
            const icon = document.getElementById('sound-icon');
            if (audioFX.muted) {
                icon.className = 'fa-solid fa-volume-xmark text-base sm:text-lg text-rose-500';
            } else {

                x = Math.max(40, Math.min(rect.width - 40, x));
                y = Math.max(40, Math.min(rect.height - 40, y));

                    const dist = Math.hypot(x - toyX, y - toyY);

                }
            } else {
                audioFX.playWrong();
                audioFX.speakText(`That is not a ${shape.name}. Keep looking!`);
            }
        }
        function goToNextSlide() {
            slideIndex++;
            loadStage();
        }
        function nextShapeLevel() {
            currentShapeIdx++;
            if (currentShapeIdx >= activeShapesQueue.length) {
                if (currentRound < totalRounds) {
                    currentRound++;
                    initRoundData();
                    slideIndex = 1;
                    audioFX.speakText(`Round 1 complete! Let’s start Round ${currentRound}!`);
                    loadStage();
                } else {
                    audioFX.playSuccess();
                    triggerConfetti();
                    const victorySpeech = `Amazing! You completed both rounds!`;
                    audioFX.speakText(victorySpeech, () => {
                        showCelebrationModal(
                            `🏆 STICKY BALL CHAMPION!`,
                            `Sensational! You completed both rounds and earned ${starCount} stars!`,
                            () => {
                                currentRound = 1;
                                starCount = 0;
                                document.getElementById("star-counter").innerText = "0";
                                initRoundData();
                                slideIndex = 1;
                                loadStage();
                            }
                        );
                    });
                }
            } else {
                slideIndex = 1;
                loadStage();
            }
        }
        function triggerConfetti() {
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444', '#facc15'];
            const container = document.body;
            for (let i = 0; i < 28; i++) {
                const p = document.createElement('div');
                p.className = 'fixed z-50 pointer-events-none rounded-sm shadow-sm';
                const size = Math.floor(Math.random() * 8) + 6;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = `${Math.random() * 100}vw`;
                p.style.top = `-20px`;
                p.style.opacity = '1';
                p.style.transform = `rotate(${Math.random() * 360}deg)`;
                p.style.transition = `all ${0.8 + Math.random() * 1.2}s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                container.appendChild(p);
                setTimeout(() => {
                    p.style.top = `${50 + Math.random() * 45}vh`;
                    p.style.left = `${parseFloat(p.style.left) + (Math.random() * 160 - 80)}px`;
                    p.style.opacity = '0';
                    p.style.transform = `rotate(${Math.random() * 720}deg) scale(0.5)`;
                }, 20);
                setTimeout(() => {
                    if (p.parentNode) p.parentNode.removeChild(p);
                }, 2200);
            }
        }
        function showCelebrationModal(title, message, onNext) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            modalNextCallback = onNext;
            const modal = document.getElementById('celebration-modal');
            modal.classList.remove('hidden');
        }
        function closeCelebrationModal() {
            const modal = document.getElementById('celebration-modal');
            modal.classList.add('hidden');
            if (modalNextCallback) {
                modalNextCallback();
                modalNextCallback = null;
            }
        }

        function fitGameToWindow() {
            const root = document.getElementById('game-scale-root');
            const width = Math.max(1, window.innerWidth);
            const height = Math.max(1, window.innerHeight);
            const factor = Math.min(width / 1440, height / 810);
            root.style.transform = `scale(${factor})`;
        }
        window.addEventListener('resize', fitGameToWindow, {passive:true});
        window.addEventListener('orientationchange', fitGameToWindow, {passive:true});
        fitGameToWindow();

        window.onload = function() {
            initRoundData();
            loadStage();
        };
    </script>
</body>
</html>

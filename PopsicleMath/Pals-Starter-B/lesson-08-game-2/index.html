    <script>
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.voices = [];
                this.initVoices();
            }
            initVoices() {
                if ('speechSynthesis' in window) {
                    const load = () => {
                        this.voices = window.speechSynthesis.getVoices();
                    };
                    load();
                    if (window.speechSynthesis.onvoiceschanged !== undefined) {
                        window.speechSynthesis.onvoiceschanged = load;
                    }
                }
            }
            initCtx() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playSuccess() {
                if (this.muted) return;
                this.initCtx();
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }
            playWrong() {
                if (this.muted) return;
                this.initCtx();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.22);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }
            playPop() {
                if (this.muted) return;
                this.initCtx();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.14);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            }
            getBestNaturalVoice() {
                if (!this.voices || this.voices.length === 0) return null;
                const priorityKeywords = [
                    'google us english',
                    'microsoft aria online (natural)',
                    'microsoft jenny online (natural)',
                    'natural',
                    'samantha',
                    'siri'
                ];
                for (let kw of priorityKeywords) {
                    const match = this.voices.find(v => v.lang.startsWith('en') && v.name.toLowerCase().includes(kw));
                    if (match) return match;
                }
                return this.voices.find(v => v.lang.startsWith('en')) || this.voices[0];
            }
            speakText(text, onEndCallback = null) {
                if (this.muted || !('speechSynthesis' in window)) {
                    if (onEndCallback) onEndCallback();
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.88;
                utterance.pitch = 1.05;
                const bestVoice = this.getBestNaturalVoice();

                let completed = false;

                    if (!completed) {
                        completed = true;
                        if (onEndCallback) onEndCallback();
                    }
                };
                utterance.onend = handleFinish;
                utterance.onerror = handleFinish;
                const fallbackMs = Math.max(1200, (text.length / 8) * 1000 + 700);
                setTimeout(handleFinish, fallbackMs);
                window.speechSynthesis.speak(utterance);
            }
        }

            audioFX.muted = !audioFX.muted;

                audioFX.playSuccess();
                audioFX.speakText("Sound on!");

        const objectImage = key => `<img class="game-object-icon" src="${ICON_IMAGES[key]}" alt="" draggable="false">`;
        const shapeImage = key => `<img class="game-shape-icon" src="${SHAPE_IMAGES[key]}" alt="" draggable="false">`;
        const MASTER_SHAPES_DATA = [{"id":"circle","name":"circle","displayName":"Circle","colorClass":"text-rose-500","sides":0,"vertices":0,"iconKeys":["gold_coin","round_coaster","round_cookie","round_clock"]},{"id":"square","name":"square","displayName":"Square","colorClass":"text-yellow-600","sides":4,"vertices":4,"iconKeys":["square_window","square_cushion","square_picture","square_chessboard"]},{"id":"triangle","name":"triangle","displayName":"Triangle","colorClass":"text-sky-600","sides":3,"vertices":3,"iconKeys":["triangle_ruler","triangle_warning","triangle_flag","triangle_cake"]},{"id":"rectangle","name":"rectangle","displayName":"Rectangle","colorClass":"text-emerald-600","sides":4,"vertices":4,"iconKeys":["rectangle_phone","rectangle_door","rectangle_blackboard","rectangle_chocolate"]}];
        const QUESTION_BANK = MASTER_SHAPES_DATA.flatMap(shape =>
          shape.iconKeys.map(key => ({ id: shape.id + ':' + key, shapeId: shape.id, correctIcon: key }))
        );
    </script>
    <script>
        let currentRound = 1;
        const totalRounds = 2;
        let activeShapesQueue = [];
        let currentShapeIdx = 0;
        let slideIndex = 1; // 1: Step 1 (Picture Match), 2: Step 2 (Sides), 3: Step 3 (Vertices), 4: Step 4 (Magnifier Mini-Game)
        let starCount = 0;
        let targetFoundCount = 0;
        const miniGameGoal = 3;
        let isAnswered = false;
        let modalNextCallback = null;
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }
        // Ver 3: 4 shapes per round, each with 4 steps = 16 questions per round.
        const SHAPE_ORDER = ['square', 'rectangle', 'triangle', 'circle'];
        const STEPS_PER_SHAPE = 4;
        const QUESTIONS_PER_ROUND = SHAPE_ORDER.length;
        let roundDecks = [];
        // Give each round all four shapes, in the same order.
        // Choose a different matching object for each shape in each round.
        function newQuestionDecks() {
            const keysByShape = new Map(MASTER_SHAPES_DATA.map(shape => [
                shape.id, shuffleArray(shape.iconKeys)
            ]));
            return Array.from({length: totalRounds}, (_, round) =>
                SHAPE_ORDER.map(shapeId => {
                    const keys = keysByShape.get(shapeId);
                    const correctIcon = keys[round % keys.length];
                    return {id: shapeId + ':' + correctIcon, shapeId, correctIcon};
                })
            );
        }
        function makeQuestion(item) {
            const data = MASTER_SHAPES_DATA.find(s => s.id === item.shapeId);
            const distractors = shuffleArray(QUESTION_BANK.filter(q => q.shapeId !== data.id));
            const answerChoices = shuffleArray([
                { name: item.correctIcon, svg: objectImage(item.correctIcon), isCorrect: true },
                ...distractors.slice(0, 2).map(q => ({ name: q.correctIcon, svg: objectImage(q.correctIcon), isCorrect: false }))
            ]);
            const sidePool = shuffleArray([0,1,2,3,4,5].filter(n => n !== data.sides)).slice(0,2);
            const vertexPool = shuffleArray([0,1,2,3,4,5].filter(n => n !== data.vertices)).slice(0,2);
            const foundIcons = shuffleArray(data.iconKeys).slice(0,3);
            const otherIcons = shuffleArray(distractors).slice(0,3);
            return {
                id:item.id, name:data.name, displayName:data.displayName,
                colorClass:data.colorClass, svg:shapeImage(data.id),
                step1Audio:`Which object is a ${data.name}?`,
                objects:answerChoices,
                sidesQuestionAudio:'How many sides?',
                sidesOptions:shuffleArray([ {value:String(data.sides),correct:true},...sidePool.map(n => ({value:String(n),correct:false})) ]),
                verticesQuestionAudio:'How many vertices?',
                verticesOptions:shuffleArray([ {value:String(data.vertices),correct:true},...vertexPool.map(n => ({value:String(n),correct:false})) ]),
                stickyBallToys:shuffleArray([
                    ...foundIcons.map(key=>({svg:objectImage(key),isTarget:true})),
                    ...otherIcons.map(q=>({svg:objectImage(q.correctIcon),isTarget:false}))
                ])
            };
        }
        function initRoundData() {
            if (currentRound === 1 || roundDecks.length !== totalRounds) roundDecks = newQuestionDecks();
            activeShapesQueue = roundDecks[currentRound-1].map(makeQuestion);
            currentShapeIdx = 0;
            updateQuestionCounter();
        }
        function updateQuestionCounter() {
            const totalSteps = QUESTIONS_PER_ROUND * STEPS_PER_SHAPE;
            const currentStep = Math.min(currentShapeIdx * STEPS_PER_SHAPE + slideIndex, totalSteps);
            document.getElementById('round-indicator').innerText =
                `Round ${currentRound} / ${totalRounds}  ·  ${currentStep} / ${totalSteps}`;
        }
        function addStars(num) {
            starCount += num;
            document.getElementById('star-counter').innerText = starCount;
        }
        function updateStepTabs() {
            const tabs = [
                { id: 'step-tab-1', idx: 1 },
                { id: 'step-tab-2', idx: 2 },
                { id: 'step-tab-3', idx: 3 },
                { id: 'step-tab-4', idx: 4 }
            ];
            tabs.forEach(tab => {
                const el = document.getElementById(tab.id);
                if (tab.idx === slideIndex) {
                    el.className = "flex-1 text-center py-1.5 px-1 rounded-xl transition font-black text-xs sm:text-sm flex items-center justify-center gap-1 bg-amber-400 text-slate-950 shadow-md transform scale-105";
                } else if (tab.idx < slideIndex) {
                    el.className = "flex-1 text-center py-1.5 px-1 rounded-xl transition font-black text-xs sm:text-sm flex items-center justify-center gap-1 bg-emerald-500 text-white shadow-sm opacity-90";
                } else {
                    el.className = "flex-1 text-center py-1.5 px-1 rounded-xl transition font-black text-xs sm:text-sm flex items-center justify-center gap-1 bg-slate-100 text-slate-500";
                }
            });
        }
        function loadStage() {
            isAnswered = false;
            updateStepTabs();
            updateQuestionCounter();
            const container = document.getElementById('stage-content');
            container.innerHTML = '';
            if (slideIndex === 1) {
                renderStep1(container);
            } else if (slideIndex === 2) {
                renderStep2(container);
            } else if (slideIndex === 3) {
                renderStep3(container);
            } else if (slideIndex === 4) {
                renderStep4(container);
            }
        }
        // STEP 1: Picture match question (No vocabulary text below choices)
        function renderStep1(container) {

        function renderStep4(container) {

                                    { left: 25, top: 68 },
                                    { left: 58, top: 72 },

                                ];

                                return `
                                    <div id="toy-item-${idx}" onclick="handleToyClick(${idx})"
                                        data-target="${toy.isTarget}"
                                        class="toy-item p-2 rounded-2xl bg-slate-800/40 border border-slate-700/50"

                                `;
                            }).join('')}

        function initMagnifierLensEvents() {
            const board = document.getElementById('sticky-room-board');
            const lens = document.getElementById('sticky-ball-lens');
            if (!board || !lens) return;
            // Center lens initially
            lens.style.left = '50%';
            lens.style.top = '50%';
            function updateLensPos(clientX, clientY) {
                const rect = board.getBoundingClientRect();
                let x = clientX - rect.left;
                let y = clientY - rect.top;
                // Clamp within board bounds
                x = Math.max(40, Math.min(rect.width - 40, x));
                y = Math.max(40, Math.min(rect.height - 40, y));
                lens.style.left = `${x}px`;
                lens.style.top = `${y}px`;
                const toys = board.querySelectorAll('.toy-item');
                toys.forEach(toy => {
                    const toyRect = toy.getBoundingClientRect();
                    const toyX = toyRect.left + toyRect.width / 2 - rect.left;
                    const toyY = toyRect.top + toyRect.height / 2 - rect.top;
                    const dist = Math.hypot(x - toyX, y - toyY);
                    if (dist < 65) {
                        toy.classList.add('in-lens');
                    } else {
                        toy.classList.remove('in-lens');
                    }
                });
            }
            board.addEventListener('mousemove', (e) => updateLensPos(e.clientX, e.clientY));
            board.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches[0]) {
                    updateLensPos(e.touches[0].clientX, e.touches[0].clientY);
                }
            });
        }
        function handleToyClick(idx) {
            const toyEl = document.getElementById(`toy-item-${idx}`);
            if (!toyEl || toyEl.dataset.found === "true") return;
            const isTarget = toyEl.dataset.target === "true";
            const shape = activeShapesQueue[currentShapeIdx];
            if (isTarget) {
                toyEl.dataset.found = "true";
                audioFX.playPop();
                targetFoundCount++;
                document.getElementById('sticky-found-count').innerText = targetFoundCount;
                toyEl.className = "toy-item absolute p-2.5 rounded-2xl bg-emerald-950 border-4 border-emerald-400 shadow-2xl scale-125 z-20 transition opacity-100 filter-none";
                if (targetFoundCount >= miniGameGoal) {
                    audioFX.playSuccess();
                    triggerConfetti();
                    addStars(3);
                    const winSpeech = `Great job! You found all three ${shape.name} objects!`;

                        nextShapeLevel();

                    audioFX.speakText(`You found a ${shape.name}!`);
                }
            } else {
                audioFX.playWrong();
                audioFX.speakText(`That is not a ${shape.name}. Keep looking!`);
            }
        }
        function goToNextSlide() {
            slideIndex++;
            loadStage();
        }
        function nextShapeLevel() {
            currentShapeIdx++;
            if (currentShapeIdx >= activeShapesQueue.length) {
                if (currentRound < totalRounds) {
                    currentRound++;
                    initRoundData();
                    slideIndex = 1;
                    audioFX.speakText(`Round 1 complete! Let’s start Round ${currentRound}!`);
                    loadStage();
                } else {
                    audioFX.playSuccess();
                    triggerConfetti();
                    const victorySpeech = `Amazing! You completed both rounds!`;

                        showCelebrationModal(

                            () => {
                                currentRound = 1;
                                starCount = 0;
                                document.getElementById("star-counter").innerText = "0";
                                initRoundData();
                                slideIndex = 1;
                                loadStage();
                            }
                        );
                    });
                }
            } else {
                slideIndex = 1;
                loadStage();
            }
        }
        function triggerConfetti() {
            const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6', '#ef4444', '#facc15'];
            const container = document.body;
            for (let i = 0; i < 28; i++) {
                const p = document.createElement('div');
                p.className = 'fixed z-50 pointer-events-none rounded-sm shadow-sm';
                const size = Math.floor(Math.random() * 8) + 6;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = `${Math.random() * 100}vw`;
                p.style.top = `-20px`;
                p.style.opacity = '1';
                p.style.transform = `rotate(${Math.random() * 360}deg)`;
                p.style.transition = `all ${0.8 + Math.random() * 1.2}s cubic-bezier(0.25, 0.46, 0.45, 0.94)`;
                container.appendChild(p);
                setTimeout(() => {
                    p.style.top = `${50 + Math.random() * 45}vh`;
                    p.style.left = `${parseFloat(p.style.left) + (Math.random() * 160 - 80)}px`;
                    p.style.opacity = '0';
                    p.style.transform = `rotate(${Math.random() * 720}deg) scale(0.5)`;
                }, 20);
                setTimeout(() => {
                    if (p.parentNode) p.parentNode.removeChild(p);
                }, 2200);
            }
        }
        function showCelebrationModal(title, message, onNext) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            modalNextCallback = onNext;
            const modal = document.getElementById('celebration-modal');
            modal.classList.remove('hidden');
        }
        function closeCelebrationModal() {
            const modal = document.getElementById('celebration-modal');
            modal.classList.add('hidden');
            if (modalNextCallback) {
                modalNextCallback();
                modalNextCallback = null;
            }
        }

        function fitGameToWindow() {
            const root = document.getElementById('game-scale-root');
            const width = Math.max(1, window.innerWidth);
            const height = Math.max(1, window.innerHeight);
            const factor = Math.min(width / 1440, height / 810);
            root.style.transform = `scale(${factor})`;
        }
        window.addEventListener('resize', fitGameToWindow, {passive:true});
        window.addEventListener('orientationchange', fitGameToWindow, {passive:true});
        fitGameToWindow();

        window.onload = function() {
            initRoundData();
            loadStage();

button{font:inherit;font-family:"Poppins",sans-serif}
.app{height:100%;padding:12px;display:flex;align-items:center;justify-content:center}
.game{
  width:min(1020px,90vw);height:min(86vh,760px);min-height:600px;
  background:rgba(255,255,255,.63);backdrop-filter:blur(5px);
  border:4px solid rgba(255,255,255,.88);border-radius:30px;
  box-shadow:0 18px 45px rgba(25,82,120,.24);
  display:flex;flex-direction:column;overflow:hidden;position:relative;flex:0 0 auto;
}
.topbar{
  height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  background:rgba(255,255,255,.68);border-bottom:3px solid rgba(255,255,255,.82);gap:12px;
}
.brand{font-size:clamp(22px,3vw,34px);font-weight:1000;color:#2790d3;letter-spacing:.3px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#fff;border:3px solid #e5eef5;padding:7px 14px;border-radius:999px;font-weight:900;box-shadow:0 4px 0 #dbe6ee;font-size:15px}
.stage{flex:1;padding:10px 18px 10px;display:flex;flex-direction:column;align-items:center;min-height:0;overflow:hidden}
.eq-area{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin-top:2px;min-height:124px}
.term{display:flex;flex-direction:column;align-items:center;min-width:64px}
.eq-num,.eq-sign{font-size:clamp(40px,5.8vw,62px);line-height:1;font-weight:1000;color:#17324d}
.eq-sign{padding-top:2px}
.speaker{
  margin-top:3px;width:54px;height:54px;border:0;border-radius:50%;background:var(--blue);color:white;
  box-shadow:0 6px 0 var(--blue-d);font-size:25px;cursor:pointer;display:grid;place-items:center
}
.speaker:active{transform:translateY(5px);box-shadow:0 1px 0 var(--blue-d)}
.bond{width:92px;height:54px;position:relative;margin-top:2px}
.bond svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bond .part{position:absolute;bottom:-1px;width:39px;height:39px;background:white;border:3px solid #263b4d;border-radius:50%;display:grid;place-items:center;font-weight:1000;font-size:19px}
.bond .left{left:3px} .bond .right{right:3px}
.instruction{font-size:clamp(18px,2.3vw,26px);font-weight:1000;color:#566a7b;text-align:center;margin:8px 0 2px}
.object-wrap{width:100%;max-width:960px;position:relative;margin-top:10px}
.object-area{
  width:100%;height:178px;border-radius:26px;background:rgba(255,255,255,.52);
  border:4px solid rgba(255,255,255,.88);box-shadow:inset 0 0 0 2px rgba(70,130,170,.06);
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px 22px;
}
.icon-row{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:clamp(22px,3vw,42px);width:100%;z-index:2;pointer-events:none}
.group{display:grid;grid-template-columns:repeat(5,clamp(42px,4.8vw,56px));grid-auto-rows:clamp(42px,4.9vw,56px);align-items:center;justify-items:center;align-content:center;justify-content:center;gap:6px 8px}
.group + .group{margin-left:0}
.icon{width:clamp(36px,4.7vw,52px);height:clamp(36px,4.7vw,52px);display:grid;place-items:center;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.10));transition:.22s transform,.22s filter;transform-origin:center}
.icon svg{width:100%;height:100%;display:block;overflow:visible}
.icon.inside{transform:scale(1.13);filter:drop-shadow(0 0 8px #ffd84d)}
#drawCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;touch-action:none;cursor:crosshair}
.clear-btn{
  position:absolute;right:12px;top:12px;z-index:6;border:0;border-radius:14px;background:rgba(255,255,255,.94);
  color:#657789;padding:8px 12px;font-weight:900;box-shadow:0 4px 0 #d8e1e8;cursor:pointer
}
.clear-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d8e1e8}
.feedback{height:30px;margin-top:5px;font-size:18px;font-weight:1000;text-align:center;color:#617586}
.feedback.good{color:#27953d} .feedback.bad{color:#df4550}
.strategy{height:38px;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:clamp(16px,2.1vw,23px);color:#6b52ca;opacity:0;transform:translateY(5px);transition:.25s}
.strategy.show{opacity:1;transform:none}
.answers-title{font-size:18px;font-weight:1000;color:#566a7b;margin:0 0 6px}
.answers{display:grid;grid-template-columns:repeat(4,minmax(88px,1fr));gap:13px;width:min(760px,100%)}
.answer{
  min-height:66px;border:3px solid rgba(255,255,255,.9);border-radius:20px;color:white;
  font-size:clamp(27px,3.7vw,39px);font-weight:1000;cursor:pointer;transition:.14s;box-shadow:0 7px 0 rgba(0,0,0,.15)
}
.answer:nth-child(1){background:#9567e8} .answer:nth-child(2){background:#36aeea}
.answer:nth-child(3){background:#ef6fa8} .answer:nth-child(4){background:#f39b3d}
.answer:hover:not(:disabled){transform:translateY(-3px)} .answer:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.answer:disabled{opacity:.48;cursor:not-allowed;filter:saturate(.6)}
.answer.correct{background:#43bd59!important;box-shadow:0 7px 0 #278c39}
.answer.wrong{animation:shake .32s;background:#e95860!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bottom-row{margin-top:8px;display:flex;align-items:center;justify-content:center;min-height:56px}
.next{
  border:0;border-radius:20px;background:#43bd59;color:white;padding:14px 36px;font-size:21px;font-weight:1000;
  box-shadow:0 7px 0 #278c39;cursor:pointer;display:none
}
.next.show{display:inline-flex} .next:active{transform:translateY(6px);box-shadow:0 1px 0 #278c39}
.start-overlay,.end-overlay{
  position:absolute;inset:0;z-index:30;background:rgba(255,255,255,.78);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px
}
.end-overlay{display:none}
.start-card,.end-card{
  width:min(520px,92%);background:white;border:4px solid #eaf2f8;border-radius:30px;padding:34px;text-align:center;
  box-shadow:0 18px 40px rgba(0,0,0,.15)
}
.start-card h1,.end-card h1{margin:0 0 8px;font-size:clamp(34px,6vw,54px);color:#2c9bdd}
.start-card p,.end-card p{margin:8px 0 22px;font-size:18px;font-weight:800;color:#637485}
.start-btn,.play-btn{
  border:0;border-radius:20px;background:#43bd59;color:white;padding:15px 32px;font-size:22px;font-weight:1000;
  box-shadow:0 7px 0 #278c39;cursor:pointer
}
.start-btn:active,.play-btn:active{transform:translateY(6px);box-shadow:0 1px 0 #278c39}
.big-score{font-size:55px;font-weight:1000;color:#8d62e3;margin:10px 0 22px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.dot{position:absolute;width:10px;height:16px;border-radius:3px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:.9}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.13)}50%{transform:translateY(-10px) scale(1.13)}}
.icon.celebrate{animation:bounce .42s ease 2}
@media(max-width:760px){
 .game{width:96vw;height:94vh;min-height:590px;border-radius:22px}
 .topbar{height:58px;padding:0 12px} .pill{font-size:12px;padding:6px 9px}
 .stage{padding:8px 10px 8px} .object-area{height:165px;padding:12px 8px}
 .group{grid-template-columns:repeat(5,40px);grid-auto-rows:42px;gap:2px 3px}.icon-row{gap:16px}
 .answers{gap:8px} .answer{min-height:58px;border-radius:16px}
}
@media(max-width:520px){
 .brand{font-size:19px} .stats{gap:5px} .pill{padding:5px 7px} 
 .eq-area{gap:8px;min-height:98px} .term{min-width:48px} .bond{width:78px}
 .group{grid-template-columns:repeat(5,32px);grid-auto-rows:34px;gap:2px}.icon{width:30px;height:30px}.icon-row{gap:9px}.object-area{height:160px}
 .answers{grid-template-columns:repeat(2,1fr)} .game{min-height:650px} 
}
</style>
</head>

    <header class="topbar">

      <div class="stats">
        <div class="pill" id="progress">Question 1 / 10</div>
        <div class="pill" id="score">⭐ 0</div>

    </header>

    <section class="stage">
      <div class="eq-area" aria-live="polite">
        <div class="term"><div class="eq-num" id="aNum">7</div></div>
        <div class="eq-sign">+</div>
        <div class="term">
          <div class="eq-num" id="bNum">5</div>
          <div class="bond" aria-label="Number bond">
            <svg viewBox="0 0 92 54" aria-hidden="true">
              <path d="M46 2 L23 28 M46 2 L69 28" fill="none" stroke="#263b4d" stroke-width="3.5" stroke-linecap="round"/>
            </svg>
            <div class="part left" id="part1">3</div>
            <div class="part right" id="part2">2</div>
          </div>
        </div>
        <div class="eq-sign">=</div>
        <div class="eq-num" id="resultNum">?</div>
        <button class="speaker" id="speaker" aria-label="Hear the question">🔊</button>
      </div>

      <div class="object-wrap">
        <div class="object-area" id="objectArea">
          <div class="icon-row" id="iconRow">
            <div class="group" id="groupA"></div>
            <div class="group" id="groupB"></div>
          </div>
          <canvas id="drawCanvas"></canvas>
          <button class="clear-btn" id="clearBtn">↻ Clear</button>
        </div>
      </div>

      <div class="instruction">Circle 10.</div>
      <div class="feedback" id="feedback"></div>
      <div class="strategy" id="strategy"></div>
      <div class="answers-title">Choose the answer.</div>
      <div class="answers" id="answers"></div>
      <div class="bottom-row"><button class="next" id="nextBtn">NEXT ➜</button></div>
    </section>

    <div class="start-overlay" id="startOverlay">
      <div class="start-card">
        <h1>Make 10! 🌟</h1>
        <p>Circle 10, then choose the answer.</p>
        <button class="start-btn" id="startBtn">START</button>
      </div>
    </div>

    <div class="end-overlay" id="endOverlay">
      <div class="end-card">
        <h1>Amazing Work! 🎉</h1>
        <p>Your Score</p>
        <div class="big-score" id="finalScore">0 / 10</div>
        <button class="play-btn" id="playAgain">PLAY AGAIN</button>
      </div>
    </div>
  </main>
</div>
<div class="confetti" id="confetti"></div>

<script>
const pairs=[
  ["apple","orange"],
  ["strawberry","blueberry"],
  ["cherry","lemon"],
  ["kiwi","grapes"],
  ["flower","daisy"],
  ["apple","lemon"],
  ["strawberry","grapes"],
  ["cherry","orange"],
  ["kiwi","blueberry"],
  ["flower","apple"]
];

  const common='viewBox="0 0 64 64" aria-hidden="true"';
  const icons={

      <path d="M31 19c-5-4-13-2-17 5-5 10-2 27 6 32 6 4 9-1 12-1s6 5 12 1c8-5 11-22 6-32-4-7-12-9-17-5-.8.6-1.2.6-2 0z" fill="url(#ga)" stroke="#17324d" stroke-width="2.6"/>

    orange:`<svg ${common}>

    </svg>`,
    strawberry:`<svg ${common}>
      <defs><radialGradient id="gs" cx="38%" cy="26%" r="72%"><stop offset="0%" stop-color="#ff9d9d"/><stop offset="60%" stop-color="#f34b3d"/><stop offset="100%" stop-color="#cb2220"/></radialGradient></defs>

      <path d="M17 23c6 0 10-4 15-10 5 6 9 10 15 10-2 4-8 7-15 7s-13-3-15-7z" fill="#43b54a" stroke="#2f7938" stroke-width="1.6"/>
      <g fill="#ffd66e"><circle cx="23" cy="33" r="1.3"/><circle cx="31" cy="31" r="1.3"/><circle cx="39" cy="33" r="1.3"/><circle cx="27" cy="42" r="1.3"/><circle cx="35" cy="42" r="1.3"/><circle cx="31" cy="50" r="1.3"/></g>
      <ellipse cx="25" cy="30" rx="4.5" ry="7.5" fill="#fff" opacity=".16" transform="rotate(18 25 30)"/>
    </svg>`,
    blueberry:`<svg ${common}>
      <defs><radialGradient id="gb" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#aec3ff"/><stop offset="60%" stop-color="#637fe0"/><stop offset="100%" stop-color="#3750ad"/></radialGradient></defs>
      <circle cx="32" cy="33" r="19" fill="url(#gb)" stroke="#17324d" stroke-width="2.6"/>
      <path d="M32 18l3 5 6-1-3.5 4.5 4.5 4-6.2-.2-3.8 5-3.8-5-6.2.2 4.5-4-3.5-4.5 6 1z" fill="#8498ec" opacity=".62"/>
      <circle cx="32" cy="33" r="6" fill="#455db0" opacity=".55"/>
      <ellipse cx="25" cy="26" rx="4.5" ry="7.5" fill="#fff" opacity=".16" transform="rotate(20 25 26)"/>
    </svg>`,
    cherry:`<svg ${common}>
      <defs><radialGradient id="gc" cx="35%" cy="28%" r="70%"><stop offset="0%" stop-color="#ff9aaa"/><stop offset="60%" stop-color="#ef4b67"/><stop offset="100%" stop-color="#c72646"/></radialGradient></defs>
      <path d="M31 18c1-7 6-12 14-14M33 18c-2-7-7-11-14-13" fill="none" stroke="#5c923f" stroke-width="3" stroke-linecap="round"/>
      <circle cx="22" cy="39" r="12" fill="url(#gc)" stroke="#17324d" stroke-width="2.6"/>
      <circle cx="43" cy="39" r="12" fill="url(#gc)" stroke="#17324d" stroke-width="2.6"/>
      <ellipse cx="18" cy="34" rx="3.5" ry="5.5" fill="#fff" opacity=".15" transform="rotate(18 18 34)"/>
      <ellipse cx="39" cy="34" rx="3.5" ry="5.5" fill="#fff" opacity=".15" transform="rotate(18 39 34)"/>
    </svg>`,
    lemon:`<svg ${common}>
      <defs><radialGradient id="gl" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fff3a6"/><stop offset="60%" stop-color="#f3d84c"/><stop offset="100%" stop-color="#ddb621"/></radialGradient></defs>
      <path d="M13 32c0-8 7-15 18-16 13-2 23 5 24 14 2 10-6 19-18 21-12 2-24-6-24-19z" fill="url(#gl)" stroke="#17324d" stroke-width="2.6"/>
      <ellipse cx="24" cy="28" rx="4.5" ry="7.5" fill="#fff" opacity=".16" transform="rotate(20 24 28)"/>
    </svg>`,
    kiwi:`<svg ${common}>
      <defs><radialGradient id="gk" cx="50%" cy="50%" r="65%"><stop offset="0%" stop-color="#b8da6f"/><stop offset="70%" stop-color="#7caf48"/><stop offset="100%" stop-color="#5e8032"/></radialGradient></defs>
      <circle cx="32" cy="32" r="22" fill="url(#gk)" stroke="#17324d" stroke-width="2.6"/>
      <circle cx="32" cy="32" r="15.5" fill="#d0e69a"/>
      <circle cx="32" cy="32" r="6" fill="#f4f0d3"/>
      <g fill="#1d1d1d"><circle cx="32" cy="16" r="1.2"/><circle cx="43" cy="20" r="1.2"/><circle cx="48" cy="32" r="1.2"/><circle cx="43" cy="44" r="1.2"/><circle cx="32" cy="48" r="1.2"/><circle cx="21" cy="44" r="1.2"/><circle cx="16" cy="32" r="1.2"/><circle cx="21" cy="20" r="1.2"/></g>
    </svg>`,
    grapes:`<svg ${common}>
      <defs><radialGradient id="gg" cx="35%" cy="28%" r="70%"><stop offset="0%" stop-color="#c9a7ff"/><stop offset="60%" stop-color="#8f65ec"/><stop offset="100%" stop-color="#6e45cd"/></radialGradient></defs>
      <path d="M34 14c1-5 6-9 12-10" fill="none" stroke="#5c923f" stroke-width="3" stroke-linecap="round"/>
      <g fill="url(#gg)" stroke="#17324d" stroke-width="2"><circle cx="26" cy="22" r="7"/><circle cx="38" cy="22" r="7"/><circle cx="20" cy="33" r="7"/><circle cx="32" cy="33" r="7"/><circle cx="44" cy="33" r="7"/><circle cx="26" cy="44" r="7"/><circle cx="38" cy="44" r="7"/></g>
      <ellipse cx="23" cy="19" rx="2.6" ry="4.2" fill="#fff" opacity=".18" transform="rotate(18 23 19)"/>
    </svg>`,
    flower:`<svg ${common}>
      <defs><radialGradient id="gf" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffc3df"/><stop offset="60%" stop-color="#ff8cbb"/><stop offset="100%" stop-color="#ef5f9f"/></radialGradient></defs>
      <g fill="url(#gf)" stroke="#17324d" stroke-width="1.9"><ellipse cx="32" cy="14" rx="8" ry="12"/><ellipse cx="49" cy="25" rx="8" ry="12" transform="rotate(52 49 25)"/><ellipse cx="43" cy="45" rx="8" ry="12" transform="rotate(128 43 45)"/><ellipse cx="21" cy="45" rx="8" ry="12" transform="rotate(-128 21 45)"/><ellipse cx="15" cy="25" rx="8" ry="12" transform="rotate(-52 15 25)"/></g>
      <circle cx="32" cy="31" r="8.5" fill="#ffd85a" stroke="#17324d" stroke-width="1.9"/>
    </svg>`,
    daisy:`<svg ${common}>
      <g fill="#fffef8" stroke="#17324d" stroke-width="1.7"><ellipse cx="32" cy="13" rx="6.5" ry="12"/><ellipse cx="47" cy="19" rx="6.5" ry="12" transform="rotate(36 47 19)"/><ellipse cx="51" cy="34" rx="6.5" ry="12" transform="rotate(78 51 34)"/><ellipse cx="43" cy="47" rx="6.5" ry="12" transform="rotate(126 43 47)"/><ellipse cx="21" cy="47" rx="6.5" ry="12" transform="rotate(-126 21 47)"/><ellipse cx="13" cy="34" rx="6.5" ry="12" transform="rotate(-78 13 34)"/><ellipse cx="17" cy="19" rx="6.5" ry="12" transform="rotate(-36 17 19)"/></g>
      <circle cx="32" cy="31" r="8.5" fill="#ffd85a" stroke="#17324d" stroke-width="1.9"/>
    </svg>`
  };
  return icons[type] || icons.apple;
}
let questions=[],index=0,score=0,wrongTried=false,answered=false,madeTen=false;
let path=[],drawing=false,ctx=null,canvas=null;

function buildQuestions(){
  const pool=[];
  for(let a=6;a<=9;a++){
    const need=10-a;
    for(let b=need+1;b<=9;b++){
      if(a+b<=20) pool.push({a,b,need,rest:b-need,total:a+b});
    }
  }
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  questions=pool.slice(0,10);
}

function shuffledAnswers(correct){
  const vals=new Set([correct]);
  const candidates=[correct-2,correct-1,correct+1,correct+2,correct-3,correct+3].filter(n=>n>=10&&n<=20);
  for(const n of candidates){if(vals.size<4) vals.add(n);}
  while(vals.size<4) vals.add(10+Math.floor(Math.random()*11));
  const arr=[...vals];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function renderQuestion(){
  answered=false;wrongTried=false;madeTen=false;path=[];
  const q=questions[index];
  document.getElementById("progress").textContent=`Question ${index+1} / 10`;
  document.getElementById("score").textContent=`⭐ ${score}`;
  document.getElementById("aNum").textContent=q.a;
  document.getElementById("bNum").textContent=q.b;
  document.getElementById("part1").textContent="";
  document.getElementById("part2").textContent="";
  document.getElementById("resultNum").textContent="?";
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";
  document.getElementById("strategy").textContent=`${q.a} + ${q.b} → ${q.a} + ${q.need} + ${q.rest} → 10 + ${q.rest} → ?`;
  document.getElementById("strategy").className="strategy";
  document.getElementById("nextBtn").className="next";

  const pair=pairs[index%pairs.length];
  const gA=document.getElementById("groupA"),gB=document.getElementById("groupB");
  gA.innerHTML=Array.from({length:q.a},()=>`<span class="icon">${iconSVG(pair[0])}</span>`).join("");
  gB.innerHTML=Array.from({length:q.b},()=>`<span class="icon">${iconSVG(pair[1])}</span>`).join("");

  const answers=document.getElementById("answers");
  answers.innerHTML="";
  shuffledAnswers(q.total).forEach(n=>{
    const btn=document.createElement("button");
    btn.className="answer";btn.textContent=n;btn.disabled=true;
    btn.addEventListener("click",()=>chooseAnswer(btn,n));
    answers.appendChild(btn);
  });
  requestAnimationFrame(resizeCanvas);
  setTimeout(speakQuestion,350);
}

function speakQuestion(){
  if(!("speechSynthesis" in window))return;
  const q=questions[index];
  speechSynthesis.cancel();
  const spoken = answered
    ? `${q.a} plus ${q.b} equals ${q.total}.`
    : `What is ${q.a} plus ${q.b}?`;
  const u=new SpeechSynthesisUtterance(spoken);
  u.lang="en-US";u.rate=.82;u.pitch=1.05;
  const voices=speechSynthesis.getVoices();
  const preferred=voices.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US English|Jenny|Aria|Female/i.test(v.name))
    || voices.find(v=>/^en/i.test(v.lang));
  if(preferred)u.voice=preferred;
  speechSynthesis.speak(u);
}

function resizeCanvas(){
  canvas=document.getElementById("drawCanvas");
  const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);
  ctx=canvas.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=7;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#ff4d6d";
  path=[];
}

function clearDrawing(){
  if(!ctx)return;
  const r=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);path=[];
  document.querySelectorAll(".icon").forEach(el=>el.classList.remove("inside","celebrate"));
  if(!madeTen){
    document.getElementById("feedback").textContent="";
    document.getElementById("feedback").className="feedback";
  }
}

function pointFromEvent(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function startDraw(e){
  if(madeTen)return;
  drawing=true;path=[pointFromEvent(e)];
  clearDrawing();path=[pointFromEvent(e)];
  canvas.setPointerCapture?.(e.pointerId);
}
function moveDraw(e){
  if(!drawing||madeTen)return;
  const p=pointFromEvent(e),last=path[path.length-1];
  path.push(p);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
}
function endDraw(e){
  if(!drawing||madeTen)return;drawing=false;
  if(path.length<8){showCircleRetry();return;}
  const first=path[0],last=path[path.length-1];
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(first.x,first.y);ctx.stroke();
  evaluateCircle();
}

function insidePoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    const hit=((yi>p.y)!=(yj>p.y))&&(p.x<(xj-xi)*(p.y-yi)/((yj-yi)||1e-9)+xi);
    if(hit)inside=!inside;
  }
  return inside;
}

function evaluateCircle(){
  const area=document.getElementById("objectArea").getBoundingClientRect();
  const icons=[...document.querySelectorAll(".icon")];
  let count=0;const chosen=[];
  icons.forEach(el=>{
    const r=el.getBoundingClientRect();
    const p={x:r.left+r.width/2-area.left,y:r.top+r.height/2-area.top};
    if(insidePoly(p,path)){count++;chosen.push(el);}
  });
  if(count===10){
    madeTen=true;
    document.getElementById("part1").textContent=questions[index].need;
    document.getElementById("part2").textContent=questions[index].rest;
    chosen.forEach(el=>{el.classList.add("inside","celebrate")});
    const fb=document.getElementById("feedback");
    fb.textContent="Great! You made 10!";fb.className="feedback good";
    document.getElementById("strategy").className="strategy show";
    document.querySelectorAll(".answer").forEach(b=>b.disabled=false);
    beep("good");
  }else showCircleRetry();
}

function showCircleRetry(){
  const fb=document.getElementById("feedback");
  fb.textContent="Try again. Circle 10.";fb.className="feedback bad";
  beep("bad");
  setTimeout(()=>{if(!madeTen)clearDrawing();},650);
}

function chooseAnswer(btn,n){
  if(answered)return;
  const q=questions[index];
  if(n===q.total){
    answered=true;
    document.getElementById("resultNum").textContent=q.total;
    if(!wrongTried)score++;
    document.getElementById("score").textContent=`⭐ ${score}`;
    btn.classList.add("correct");
    [...document.querySelectorAll(".answer")].forEach(b=>b.disabled=true);
    const fb=document.getElementById("feedback");
    fb.textContent="Great job! ⭐";fb.className="feedback good";
    document.getElementById("nextBtn").className="next show";
    beep("good");
    burst(38);
  }else{
    wrongTried=true;btn.classList.add("wrong");btn.disabled=true;
    const fb=document.getElementById("feedback");
    fb.textContent="Try again!";fb.className="feedback bad";
    beep("bad");
    setTimeout(()=>btn.classList.remove("wrong"),380);
  }
}

function beep(type){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    window._ac=window._ac||new AC();const ac=window._ac;
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    o.type="sine";o.frequency.value=type==="good"?660:220;
    g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);
    o.start();o.stop(ac.currentTime+.18);
  }catch(e){}
}

function burst(n=70){
  const box=document.getElementById("confetti"),cols=["#ff6fae","#32a8f0","#42bf55","#ffd85a","#9b6df6","#ff9f43"];
  for(let i=0;i<n;i++){
    const d=document.createElement("i");d.className="dot";d.style.left=(Math.random()*100)+"vw";
    d.style.top=(-10-Math.random()*20)+"px";d.style.background=cols[i%cols.length];
    d.style.animationDelay=(Math.random()*.35)+"s";d.style.transform=`rotate(${Math.random()*180}deg)`;
    box.appendChild(d);setTimeout(()=>d.remove(),3200);
  }
}

function nextQuestion(){
  index++;
  if(index>=questions.length)finishGame();
  else renderQuestion();
}

function finishGame(){
  speechSynthesis?.cancel?.();
  document.getElementById("finalScore").textContent=`${score} / 10`;
  document.getElementById("endOverlay").style.display="flex";
  burst(120);
}

function restart(){
  index=0;score=0;buildQuestions();
  document.getElementById("endOverlay").style.display="none";
  renderQuestion();
}

document.getElementById("speaker").addEventListener("click",speakQuestion);
document.getElementById("clearBtn").addEventListener("click",clearDrawing);
document.getElementById("nextBtn").addEventListener("click",nextQuestion);
document.getElementById("playAgain").addEventListener("click",restart);
document.getElementById("startBtn").addEventListener("click",()=>{
  document.getElementById("startOverlay").style.display="none";
  buildQuestions();index=0;score=0;renderQuestion();
});
document.getElementById("drawCanvas").addEventListener("pointerdown",startDraw);
document.getElementById("drawCanvas").addEventListener("pointermove",moveDraw);
document.getElementById("drawCanvas").addEventListener("pointerup",endDraw);
document.getElementById("drawCanvas").addEventListener("pointercancel",()=>drawing=false);
window.addEventListener("resize",()=>requestAnimationFrame(resizeCanvas));
</script>
</body>
</html>

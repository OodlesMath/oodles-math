.circle-btn{width:48px;height:45px;border:2px solid #b9e4ff;background:#f0faff;box-shadow:0 4px 0 #9ad6f3}
.screen{background:transparent;padding:5px 12px 13px;scrollbar-width:thin}
.home{min-height:100%;justify-content:center;align-items:center;padding-bottom:7vh}
.home-box.compact-setup{width:min(550px,100%);background:rgba(255,255,255,.95);border:4px solid #fff;border-radius:30px;padding:clamp(23px,3.5vw,40px);box-shadow:0 10px 0 #d8edf8,0 20px 30px #297ca52a;text-align:center}
.setup-eyebrow{font-weight:900;font-size:clamp(14px,2vw,20px);letter-spacing:2px;color:#8b5bdd}
.compact-setup h1{margin:8px 0 4px;color:#118dc6;font-size:clamp(28px,4vw,45px);line-height:1.15;font-weight:900}
.compact-setup p{font-size:clamp(13px,1.6vw,18px);font-weight:700;color:#667999;margin:9px 0 18px}
.setup-steps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.setup-steps span{padding:9px 13px;border-radius:14px;background:#ecf8ff;border:2px solid #d2ecfa;color:#217db2;font-size:clamp(11px,1.3vw,15px);font-weight:900}
.compact-setup .setup-count{margin:18px 0 3px;color:#8b5bdd;font-size:14px;font-weight:900}
.compact-setup .start-btn{width:min(340px,100%);margin:15px auto 0;font-size:19px}
.game{height:100%;min-height:0;display:flex;flex-direction:column;gap:clamp(7px,1.2vh,13px)}
.progress-area{display:flex;align-items:center;gap:14px;justify-content:flex-start;min-height:36px;flex:0 0 auto}
.progress-head{min-width:0;display:flex;align-items:center;gap:12px;justify-content:flex-start;flex-wrap:wrap}
.progress-label{display:none}
.category{font-size:clamp(10px,1vw,12px);padding:5px 11px;background:rgba(247,238,255,.95)}
.progress-track{width:clamp(90px,16vw,218px);max-width:35%;height:11px;flex-shrink:0;border:2px solid #cfe1f1;background:#e5eff7;box-shadow:0 2px 0 #d2e5f3}
.question-card{width:100%;max-width:1200px;margin:0 auto;flex:1 1 auto;min-height:0;padding:clamp(12px,2.1vh,20px);border-radius:28px;background:rgba(255,255,255,.93);border:4px solid rgba(255,255,255,.97);box-shadow:0 7px 0 #dbeefa,0 13px 27px #6daacd25;gap:9px}
.q-heading{flex:0 0 auto;justify-content:center;gap:12px}
.q-heading h2{font-size:clamp(21px,3vw,36px)}
.visual-stage{width:100%;min-height:0;flex:1;padding:4px;display:flex;align-items:center;justify-content:center}
.pattern-grid{max-width:770px;width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1.1vh,10px);place-content:center;justify-items:center}
.shape-slot{width:100%;max-width:145px;aspect-ratio:1;border:2px solid #dcebf8;background:linear-gradient(180deg,#fff,#f6fbff);box-shadow:0 3px 0 #e4effa}
.sort-grid{max-width:730px;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,2vw,20px)}
.sort-grid .shape-slot{max-width:150px}
.sort-label{position:absolute;top:5px;left:7px;width:25px;height:25px;border-radius:8px;display:grid;place-items:center;color:#2485bd;background:#ddf4ff;font-weight:900;font-size:15px;border:1px solid #b8e9fb}
.answer-zone{max-width:1100px;width:100%;margin:0 auto;flex:0 0 auto}
.answer-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,1.2vw,15px);width:100%;align-items:stretch}
.answer-card{min-width:0;height:clamp(75px,14vh,124px);display:flex;justify-content:center;align-items:center;position:relative;background:linear-gradient(180deg,#f3fcff,#dff5ff);border:3px solid #8dd4f9;border-radius:clamp(12px,1.6vw,20px);box-shadow:0 5px 0 #8bc9e7,0 6px 8px #2f769f24;color:#196f9f;transition:.16s;padding:7px}
.answer-card:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.02)}
.answer-card:active:not(:disabled){transform:translateY(3px)}
.answer-card.selected{border-color:#ef8d2f;background:linear-gradient(180deg,#fff8e4,#ffedc2);box-shadow:0 5px 0 #eebf70}
.answer-card.correct{border-color:#25c482;background:linear-gradient(180deg,#effff8,#d5fae9);box-shadow:0 5px 0 #a1e1c1;opacity:1!important}
.answer-card.wrong{border-color:#f37897;background:#ffeff5;box-shadow:0 5px 0 #ffb3c8;opacity:1!important}
.answer-card:disabled{cursor:default;transform:none;box-shadow:0 4px 0 #bcdceb;opacity:.85}
.answer-card img{width:auto;height:78%;max-width:74%;object-fit:contain;pointer-events:none}
.answer-card img.smaller{height:49%;max-width:48%}
.answer-letter{position:absolute;top:6px;left:7px;display:grid;place-items:center;width:clamp(24px,2.6vw,33px);height:clamp(24px,2.6vw,33px);border-radius:10px;background:#168fce;border:2px solid white;color:white;font-size:clamp(14px,1.5vw,19px);font-weight:900;box-shadow:0 2px 0 #0f6b9f}
.answer-status{position:absolute;right:8px;top:0;font-size:clamp(18px,2vw,27px);font-weight:900;color:#15aa6d}
.answer-card.wrong .answer-status{color:#ec4b81}
.actions{flex:0 0 auto;width:100%;max-width:870px;margin:0 auto;grid-template-columns:1fr auto 1fr;gap:clamp(6px,2vw,18px)}
.actions .btn{min-height:48px}
.actions .check{min-width:clamp(140px,20vw,210px)}
.bottom-hint{flex:0 0 auto;min-height:21px;font-size:clamp(11px,1.2vw,14px);font-weight:900;color:#586a89;text-shadow:0 1px 1px white}
.bottom-hint.result{color:#177e58}
.finish{min-height:100%;padding:0 12px 6vh}
.finish-panel{background:rgba(255,255,255,.95);width:min(650px,100%);border:4px solid #fff;border-radius:30px;padding:clamp(20px,3vw,35px);box-shadow:0 10px 0 #dbeefa,0 20px 32px #2c7ba92c;display:flex;align-items:center;flex-direction:column;gap:12px}
.trophy{animation:none!important;font-size:clamp(62px,8vw,85px);transform:none!important}
.finish h2{font-size:clamp(30px,4vw,45px)}
.finish-score{display:flex;flex-direction:column;align-items:center;padding:15px 34px;border:4px solid #f8d376;border-radius:24px;background:#fff6d9;box-shadow:0 5px 0 #efd895}
.score-number{font-size:clamp(37px,5vw,54px);font-weight:900;color:#b87b07;line-height:1.1}
.score-number small{font-size:.55em;color:#be9438}.score-caption{font-size:12px;font-weight:900;letter-spacing:1.5px;color:#997122}
.finish-note{margin:0;font-weight:800;font-size:14px;color:#476d8d}.finish-note.subtle{font-size:11px;color:#7b8fa7}

.question-card{
  background:transparent;
  border:0;
  box-shadow:none;
  border-radius:0;
  padding:clamp(5px,1.25vh,15px) clamp(2px,.9vw,12px);
}
.visual-stage{width:100%;min-height:110px;overflow:visible;padding:6px 0}
.pattern-grid{
  width:100%;max-width:1160px;
  display:grid;
  grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));
  gap:clamp(2px,.7vw,12px);
  place-items:center;
  align-content:center;
}
.pattern-grid .shape-slot{
  background:transparent;
  border:0;
  box-shadow:none;
  max-width:144px;
}
.pattern-grid .shape-slot.missing{
  border:3px dashed #fba1c5;
  background:rgba(255,240,248,.86);
  box-shadow:0 3px 0 #f9d6e6;
}
.pattern-grid .shape-slot.revealed{
  background:rgba(229,255,239,.78);
  border:2px solid #6de2a6;
  box-shadow:0 3px 0 #addfc5;
}
.sort-grid{
  width:100%;max-width:790px;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:clamp(5px,1.9vw,24px);
  place-items:center;
  margin:auto;
}
.sort-grid .shape-slot{
  appearance:none;
  -webkit-appearance:none;
  border:3px solid transparent;
  background:transparent;
  box-shadow:none;
  padding:5px;
  width:100%;max-width:185px;
  aspect-ratio:1;
  transition:background .15s,border-color .15s,transform .15s;
}
.sort-grid button.shape-slot{cursor:pointer;touch-action:manipulation}
.sort-grid button.shape-slot:hover:not([aria-disabled="true"]){
  background:rgba(239,249,255,.75);
  border-color:#95dafa;
  transform:translateY(-2px);
}
.sort-grid .shape-slot.chosen{
  background:rgba(255,245,209,.84);
  border-color:#ffb648;
  box-shadow:0 3px 0 #ebcb8d;
}
.sort-grid .shape-slot.wrong-pick{
  background:rgba(255,235,241,.9);
  border-color:#f77994;
  box-shadow:0 3px 0 #ffd0db;
}
.sort-grid .shape-slot.odd{
  background:rgba(230,255,237,.9);
  border-color:#38c986;
  box-shadow:0 3px 0 #9fdfb8;
}
.sort-grid .shape-slot.odd::after{z-index:2}
.sort-grid .sort-label{z-index:1}
.sorting-game .question-card{flex:1 1 auto}
.sorting-game .visual-stage{min-height:160px}

 .pattern-grid{grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));max-width:100%;gap:clamp(2px,.6vw,7px)}

 .sort-grid{max-width:680px}
}

 .pattern-grid{grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));gap:2px;max-width:100%}

 .sort-grid{gap:3px}
 .sort-grid .shape-slot{border-width:2px;padding:2px;border-radius:10px}

 .sorting-game .question-card{height:auto;min-height:clamp(260px,40dvh,430px)}

}
@media (orientation:portrait) and (max-width:880px){

}
@media (orientation:landscape) and (max-height:560px){
 .sorting-game .question-card{min-height:230px}
}

function makePattern(type,parts,num,level,variant='original'){
 let unit=parts.map(p=>type==='shape'?item(p,variant):type==='color'?item(variant,p):item(variant,'blue',p));
 let tokens=Array.from({length:num},(_,i)=>unit[i%unit.length]);let answer=unit[num%unit.length];
 let about=type==='shape'?`The shapes repeat: ${parts.map(s=>displayNames[s]).join(', ')}.`:type==='color'?`The colors repeat: ${parts.join(', ')}.`:`The sizes repeat: ${parts.join(', ')}.`;
 return {kind:'pattern',type,level,prompt:'What comes next?',tokens,answer,explain:about};
}
function makeOdd(type,groupShape,oddShape,normal,oddV,pos,level){
 let tokens=[];for(let i=0;i<4;i++){
   const shape=type==='shape'?(i===pos?oddShape:groupShape):(type==='size'?shapes[groupShape]:(shapes[(i*2+groupShape)%6]));
   const variant=type==='color'?(i===pos?oddV:normal):(type==='shape'?normal:'blue');
   const size=type==='size'?(i===pos?oddV:normal):'big';
   tokens.push(item(shape,variant,size));
 }
 let answer=tokens[pos],about=type==='shape'?`The ${displayNames[oddShape]} is different.`:type==='color'?`The ${oddV} shape is different.`:`The ${oddV} shape is different.`;
 return {kind:'sorting',type,level,prompt:'Which one does not belong?',tokens,answer,oddIndex:pos,explain:about};
}

function assemble(rounds=12){
 const all=bank();
 const quotas={shape:4,color:3,size:2,sorting:3};
 const chosen=[];
 for(const [k,n] of Object.entries(quotas)){
  const candidates=all.filter(q=>k==='sorting'?q.kind==='sorting':q.kind==='pattern'&&q.type===k);
  chosen.push(...pick(candidates,n));
 }
 return [1,2,3].flatMap(level=>pick(chosen.filter(q=>q.level===level),100));
}
function keyItem(it){return [it.shape,it.variant,it.size].join('|')}
function makeChoices(q){
 if(q.kind==='sorting'){
  q.choices=q.tokens.slice();q.correctChoice=q.oddIndex;return;
 }
 const target=q.answer, pool=[], seen=new Set([keyItem(target)]);
 function add(it){if(it&&ART[it.variant]?.[it.shape]&&!seen.has(keyItem(it))){seen.add(keyItem(it));pool.push(it)}}
 if(q.type==='shape'){
  pick(shapes.filter(s=>s!==target.shape),6).forEach(s=>add(item(s,target.variant,target.size)));
 }else if(q.type==='color'){
  pick(['red','blue','yellow','original'],4).forEach(v=>{
   const orig={circle:'red',square:'yellow',triangle:'blue',rectangle:'green',semicircle:'purple',quarter:'pink'};
   if(v!=='original'||!['red','blue','yellow'].includes(orig[target.shape]))add(item(target.shape,v,target.size));
  });
  pick(shapes.filter(s=>s!==target.shape),6).forEach(s=>add(item(s,target.variant,target.size)));
 }else if(q.type==='size'){
  add(item(target.shape,target.variant,target.size==='small'?'big':'small'));
  pick(shapes.filter(s=>s!==target.shape),6).forEach(s=>add(item(s,target.variant,target.size)));
 }
 if(pool.length<3)pick(shapes.filter(s=>s!==target.shape),6).forEach(s=>add(item(s,target.variant,target.size)));
 const options=pick([target,...pool.slice(0,3)],4);
 q.choices=options;
 q.correctChoice=options.findIndex(it=>keyItem(it)===keyItem(target));
}
function current(){return state.questions[state.index]}
function audioCtx(){if(!window.AudioContext&&!window.webkitAudioContext)return null;try{if(!audioCtx.ctx)audioCtx.ctx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.ctx.state==='suspended')audioCtx.ctx.resume();return audioCtx.ctx}catch(e){return null}}
function tone(freq,dur,delay=0,volume=.055,type='sine'){if(state.muted)return;const ctx=audioCtx();if(!ctx)return;const t=ctx.currentTime+delay;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(volume,t+.018);gain.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+dur+.02)}
function sound(which){if(state.muted)return;if(which==='click'){tone(540,.11,0,.03,'triangle')}else if(which==='check'){[523,659,784].forEach((x,i)=>tone(x,.18,i*.095,.06,'triangle'))}else if(which==='start'){[392,523,659].forEach((x,i)=>tone(x,.15,i*.09,.055,'sine'))}else if(which==='finish'){[523,659,784,1047,1319].forEach((x,i)=>tone(x,.28,i*.13,.07,'triangle'))}}
function speakQuestion(){if(state.muted||!('speechSynthesis' in window))return;try{const s=window.speechSynthesis;s.cancel();const utter=new SpeechSynthesisUtterance(current().prompt);utter.lang='en-US';utter.rate=.84;utter.pitch=1.05;utter.volume=.95;const voices=s.getVoices();const us=voices.find(v=>v.lang.toLowerCase()==='en-us'&&/female|samantha|jenny|aria|zira/i.test(v.name))||voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(us)utter.voice=us;s.speak(utter)}catch(e){}}
function header(){
 const inGame=state.phase==='game';
 topbar.innerHTML=`<div class="top-actions">${inGame?`<span class="round-chip" aria-label="Question ${state.index+1} of ${state.questions.length}">${state.index+1} / ${state.questions.length}</span>`:''}<button type="button" class="circle-btn" data-action="mute" title="${state.muted?'Turn sound on':'Turn sound off'}" aria-label="${state.muted?'Turn sound on':'Turn sound off'}">${svg(state.muted?'mute':'speaker')}</button>${state.phase!=='home'?`<button type="button" class="circle-btn" data-action="home" title="Home" aria-label="Home">${svg('home')}</button>`:''}</div>`;
}
function home(){
 screen.innerHTML=`<div class="home"><div class="home-box compact-setup"><div class="setup-eyebrow">READY TO PLAY?</div><h1>Look, Think &amp; Show!</h1><p>Find the shape that fits. Hold up your card!</p><div class="setup-steps"><span>1 · Look</span><span>2 · Pick a card</span><span>3 · Cards up!</span></div><p class="setup-count">12 surprise questions each game</p><button type="button" class="btn green start-btn" data-action="start">${svg('play')} START GAME</button></div></div>`;
}
function visual(q,checked){
 if(q.kind==='pattern'){
  return `<div class="pattern-grid" style="--cols:${q.tokens.length+1}">${q.tokens.map(it=>`<div class="shape-slot">${imgHTML(it,it.size==='small'?'smaller':'')}</div>`).join('')}<div class="shape-slot ${checked?'revealed':'missing'}" aria-label="${checked?'Answer: '+readable(q.answer):'Missing shape'}">${checked?imgHTML(q.answer,q.answer.size==='small'?'smaller':''):'<span class="question-mark">?</span>'}</div></div>`;
 }
  const selected=state.selected[state.index];
  return `<div class="sort-grid" role="group" aria-label="Choose the shape that does not belong">${q.tokens.map((it,i)=>{
   const isChosen=selected===i;
   const classes=[isChosen?'chosen':'',checked&&i===q.oddIndex?'odd':'',checked&&isChosen&&i!==q.oddIndex?'wrong-pick':''].filter(Boolean).join(' ');
   return `<button type="button" class="shape-slot ${classes}" data-action="choose" data-value="${i}" aria-label="Option ${'ABCD'[i]}: ${readable(it)}" aria-pressed="${isChosen}" aria-disabled="${checked}"><span class="sort-label">${'ABCD'[i]}</span>${imgHTML(it,it.size==='small'?'smaller':'')}</button>`;
  }).join('')}</div>`;
}
function answersHTML(q,checked){
 const selected=state.selected[state.index];
 return `<div class="answer-row" aria-label="Answer choices A to D">${q.choices.map((it,i)=>{
  const isCorrect=i===q.correctChoice;
  const classes=[selected===i?'selected':'',checked&&isCorrect?'correct':'',checked&&selected===i&&!isCorrect?'wrong':''].filter(Boolean).join(' ');
  return `<button type="button" class="answer-card ${classes}" data-action="choose" data-value="${i}" ${checked?'disabled':''} aria-label="${'ABCD'[i]}: ${readable(it)}" aria-pressed="${selected===i}"><span class="answer-letter">${'ABCD'[i]}</span>${imgHTML(it,it.size==='small'?'smaller':'')}<span class="answer-status">${checked&&isCorrect?'✓':checked&&selected===i?'×':''}</span></button>`;
 }).join('')}</div>`;
}
function game(){
 const q=current(),checked=state.checked[state.index],progress=(state.index+1)/state.questions.length*100;
 const selected=state.selected[state.index],answered=selected!==null;
  let note=q.kind==='sorting'?'Tap the one shape that does not belong.':'Look at the shapes. Pick a card and hold it up!';
  if(checked){note=answered?(selected===q.correctChoice?'Great job! That is correct!':`The correct answer is ${'ABCD'[q.correctChoice]}.`):`The correct answer is ${'ABCD'[q.correctChoice]}.`}
  screen.innerHTML=`<div class="game ${q.kind==='sorting'?'sorting-game':'pattern-game'}"><div class="progress-area"><div class="progress-head"><span class="progress-label">QUESTION ${state.index+1} OF ${state.questions.length}</span><span class="category">${q.kind==='sorting'?'SORT BY '+q.type.toUpperCase():q.type.toUpperCase()+' PATTERN'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div></div><section class="question-card"><div class="q-heading"><h2>${q.prompt.replace('next?','<span class="accent">next?</span>').replace('not belong?','<span class="accent">not belong?</span>')}</h2><button class="speaker" data-action="speak" aria-label="Listen to the question" title="Listen to the question">${svg('speaker')}</button></div><div class="visual-stage">${visual(q,checked)}</div></section>${q.kind==='pattern'?`<div class="answer-zone">${answersHTML(q,checked)}</div>`:''}<div class="actions"><button type="button" class="btn gray previous" data-action="previous" ${state.index===0?'disabled':''}>${svg('back')} Previous</button><button type="button" class="btn ${checked?'green':'pink'} check" data-action="check" ${checked?'disabled':''}>${svg('check')} ${checked?'CHECKED':'CHECK'}</button><button type="button" class="btn blue next" data-action="next" ${checked?'':'disabled'}>${state.index===state.questions.length-1?'Finish':'Next'} ${svg('next')}</button></div><div class="bottom-hint ${checked?'result':''}" role="status">${note}</div></div>`;
}
function finish(){
 const total=state.questions.length;
 const attempted=state.selected.filter(x=>x!==null).length;
 const correct=state.questions.reduce((n,q,i)=>n+(state.checked[i]&&state.selected[i]===q.correctChoice?1:0),0);
 const info=attempted?`${correct} correct out of ${attempted} selected answers`:'All questions revealed together!';
 const mainCount=attempted?correct:total;
 const mainCaption=attempted?'CORRECT ANSWERS':'QUESTIONS COMPLETED';
 const optionalNote=attempted?'<p class="finish-note subtle">Only answers selected on the screen are scored.</p>':'';
 screen.innerHTML=`<div class="finish"><div class="finish-panel"><div class="trophy" aria-hidden="true">🏆</div><h2>Amazing Work!</h2><p class="finish-sub">You finished all ${total} shape challenges!</p><div class="finish-score"><span class="score-number">${mainCount} <small>/ ${total}</small></span><span class="score-caption">${mainCaption}</span></div><p class="finish-note">${info}</p>${optionalNote}<div class="finish-buttons"><button type="button" class="btn green" data-action="again">${svg('play')} Play Again</button><button type="button" class="btn purple" data-action="home">${svg('home')} Home</button></div></div></div>`;
}
function render(){
 header();screen.className='screen';
 if(state.phase==='home')home();else if(state.phase==='game')game();else finish();
 screen.scrollTop=0;
}
function startGame(){
 state.questions=assemble(12);
 state.questions.forEach(makeChoices);
 state.index=0;
 state.checked=Array(state.questions.length).fill(false);
 state.selected=Array(state.questions.length).fill(null);
 state.phase='game';sound('start');render();
 speakQuestion();
}
let confettiRaf=0;function stopConfetti(){cancelAnimationFrame(confettiRaf);document.getElementById('confetti').style.display='none'}
function startConfetti(){stopConfetti();const c=document.getElementById('confetti'),ctx=c.getContext('2d');if(!ctx)return;const dpr=Math.min(2,window.devicePixelRatio||1);function resize(){c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}resize();c.style.display='block';const W=innerWidth,H=innerHeight;const cols=['#fe4d92','#ffce3c','#41cc87','#199ff2','#936cf0','#ff8b45'];const flakes=Array.from({length:Math.min(180,Math.round(W*.13))},()=>({x:Math.random()*W,y:-Math.random()*H*.7-20,vx:(Math.random()-.5)*2.8,vy:2.3+Math.random()*3.2,w:5+Math.random()*8,h:4+Math.random()*6,a:Math.random()*6.3,spin:(Math.random()-.5)*.15,color:cols[Math.floor(Math.random()*cols.length)]}));const started=performance.now();function frame(now){const elapsed=now-started;ctx.clearRect(0,0,W,H);const fade=Math.min(1,Math.max(0,(5200-elapsed)/1400));ctx.globalAlpha=fade;for(const f of flakes){f.x+=f.vx+Math.sin(now*.001+f.a)*.5;f.y+=f.vy;f.a+=f.spin;if(f.y>H+15){f.y=-15;f.x=Math.random()*W}ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.fillStyle=f.color;ctx.fillRect(-f.w/2,-f.h/2,f.w,f.h);ctx.restore()}ctx.globalAlpha=1;if(elapsed<5200)confettiRaf=requestAnimationFrame(frame);else stopConfetti()}confettiRaf=requestAnimationFrame(frame)}
function goHome(){
 if('speechSynthesis'in window)window.speechSynthesis.cancel();
 stopConfetti();state.phase='home';sound('click');render();
}
document.getElementById('app').addEventListener('click',event=>{
 const btn=event.target.closest('button[data-action]');if(!btn||btn.disabled)return;
 const act=btn.dataset.action,val=Number(btn.dataset.value);
 switch(act){
 case 'start':startGame();break;
 case 'home':goHome();break;
 case 'mute':state.muted=!state.muted;if(state.muted&&'speechSynthesis'in window)window.speechSynthesis.cancel();else if(state.phase==='game')speakQuestion();render();break;
 case 'speak':speakQuestion();break;
 case 'choose':if(state.phase!=='game'||state.checked[state.index])break;state.selected[state.index]=val;sound('click');game();break;
 case 'check':if(state.phase!=='game'||state.checked[state.index])break;state.checked[state.index]=true;if('speechSynthesis'in window)window.speechSynthesis.cancel();sound('check');game();break;
 case 'previous':if(state.index>0){state.index--;sound('click');render();speakQuestion()}break;
 case 'next':if(!state.checked[state.index])break;if(state.index<state.questions.length-1){state.index++;sound('click');render();speakQuestion()}else{state.phase='finish';sound('finish');render();startConfetti()}break;
 case 'again':stopConfetti();startGame();break;
 }
});
render();
</script>
</body>

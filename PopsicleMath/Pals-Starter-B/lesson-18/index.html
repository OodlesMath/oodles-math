*{box-sizing:border-box}
html,body{margin:0;min-width:310px;min-height:100%;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
body{background:#a3e4ec var(--bgurl) center center/cover fixed no-repeat;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,[role="button"]:focus-visible{outline:4px solid #f59e0b;outline-offset:3px}
.hidden{display:none!important}
#confetti{position:fixed;inset:0;width:100vw;height:100dvh;pointer-events:none;z-index:99999}
.shell{position:relative;z-index:1;width:min(1280px,calc(100% - 28px));min-height:100dvh;margin:auto;display:flex;align-items:flex-start;justify-content:center;padding:clamp(12px,2.2vh,24px) 0 16px}
.game-card{width:100%;max-width:1160px;background:transparent;border:0;box-shadow:none;backdrop-filter:none;padding:clamp(8px,1.35vw,17px);position:relative;overflow:visible}
.gameplay{width:100%}.gameplay.obscured{visibility:hidden;pointer-events:none}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-height:104px;margin:0 0 9px}.header-left{display:flex;flex-direction:column;align-items:flex-start;gap:9px;min-width:0}
.brand{font-size:clamp(18px,2.8vw,33px);font-weight:900;line-height:1.12;letter-spacing:-.055em;text-shadow:0 2px #fff}
.brand .a{color:#0ba5d1}.brand .b{color:#ff668f}.brand .c{color:#4aa948}
.progress{white-space:nowrap;font-weight:900;font-size:clamp(12px,1.4vw,15px);border-radius:20px;padding:6px 13px;background:#fff3c5;border:2px solid #f7d972;color:#a86300;box-shadow:0 4px 0 rgba(149,106,27,.1)}
.logo-clear-space{width:clamp(70px,14vw,155px);height:49px;flex:0 0 auto}
.prompt-bar{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin:0;padding:6px 9px 6px 14px;border-radius:20px;background:linear-gradient(120deg,rgba(232,248,255,.98),rgba(248,234,255,.98));border:2px solid #d5e7ff;width:fit-content;max-width:100%;text-align:left;box-shadow:0 4px 0 rgba(93,163,199,.2)}
.prompt-label{font-size:clamp(16px,2.05vw,23px);font-weight:900;color:#0a80ca;line-height:1.25}
.speaker{display:inline-grid;place-items:center;flex:0 0 auto;border:0;color:#fff;border-radius:50%;width:43px;height:43px;background:linear-gradient(160deg,#3ab5ff,#087cc6);box-shadow:0 5px 0 #086b9e;font-size:23px;transition:transform .15s}
.speaker:hover{filter:brightness(1.07);transform:translateY(-2px)}.speaker:active{transform:translateY(3px);box-shadow:0 2px 0 #086b9e}
.number-bar{display:grid;grid-template-columns:minmax(0,1fr) clamp(70px,12vw,145px) minmax(0,1fr);gap:8px;align-items:center;max-width:1000px;margin:0 auto 12px}
.number-pill{justify-self:center;min-width:clamp(92px,12vw,156px);height:clamp(59px,8.5vw,94px);display:grid;place-items:center;border-radius:25px;border:4px solid white;font-size:clamp(35px,5vw,64px);font-weight:900;line-height:1;box-shadow:0 7px 0 rgba(24,115,130,.14)}
.number-pill.left{background:#e8e0ff;color:#7448ca}.number-pill.right{background:#ffdeed;color:#d84891}
.math-symbol{display:grid;place-items:center;justify-self:center;width:clamp(58px,7vw,84px);height:clamp(58px,7vw,84px);border:4px solid #fff;border-radius:24px;background:#ffe587;color:#bf7302;font-size:clamp(38px,5vw,59px);font-family: Arial, sans-serif !important;
    font-weight: 400 !important;line-height:1;box-shadow:0 6px 0 #d0b95a;transition:transform .3s,background .3s}
.math-symbol:not(.revealed){animation:none;transform:none}.math-symbol.revealed{background:#b0efac;color:#238443;animation:pop .45s cubic-bezier(.2,1.5,.3,1)}
.choices-area{display:grid;grid-template-columns:minmax(0,1fr) clamp(70px,12vw,144px) minmax(0,1fr);align-items:stretch;gap:8px;width:100%;max-width:1050px;margin:0 auto}
.option{border:4px solid #d9e8ed;border-radius:27px;background:rgba(255,255,255,.92);min-height:260px;padding:12px 10px 14px;box-shadow:0 8px 0 rgba(71,131,149,.15);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;min-width:0;transition:box-shadow .18s,border-color .18s,transform .18s;user-select:none;position:relative;overflow:hidden}
.option.left{background:linear-gradient(165deg,rgba(255,250,255,.99),rgba(239,232,255,.96))}.option.right{background:linear-gradient(165deg,rgba(255,250,253,.99),rgba(255,233,243,.97))}
.option:not(:disabled):hover{transform:translateY(-3px);border-color:#84cdeb}.option:disabled{cursor:default}
.option.selected{border-color:#22a5ef;box-shadow:0 8px 0 #78c5ff,0 0 0 4px rgba(44,174,254,.21);transform:translateY(-3px)}
.option.correct{border-color:#42c86d;box-shadow:0 8px 0 #90e6a5,0 0 25px rgba(45,213,103,.32);background:#f0fff3}
.option.wrong{border-color:#ff7c8d;background:#fff0f3;animation:shake .4s ease}
.option-title{font-size:clamp(12px,1.3vw,15px);font-weight:800;color:#677b8e;line-height:1;letter-spacing:.04em}
.apple-stack{width:100%;max-width:370px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(3px,.5vw,7px);min-width:0}
.ten-pack{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));place-items:center;width:100%;padding:3px 5px;background:rgba(255,244,185,.52);border:1px dashed #f2d58f;border-radius:11px;gap:1px;min-height:30px}
.apple{width:min(100%,31px);height:auto;aspect-ratio:1;object-fit:contain;display:block;filter:drop-shadow(0 2px 1px rgba(155,75,30,.12));pointer-events:none}
.croc-zone{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.sleep-croc{display:grid;place-items:center;font-size:clamp(26px,4vw,48px);font-weight:900;color:#70b4c8;background:#ecfcff;border:3px dashed #b9e8ee;border-radius:50%;width:clamp(48px,6vw,70px);height:clamp(48px,6vw,70px);animation:none;transform:none}
.croc-head{width:100%;max-width:160px;height:auto;object-fit:contain;filter:drop-shadow(0 7px 4px rgba(27,97,45,.23));animation:crocPop .55s cubic-bezier(.17,1.4,.36,1) both}
.croc-head.chomp{animation:crocPop .55s cubic-bezier(.17,1.4,.36,1) both,crocChomp .52s ease-in-out .66s 2}
.feedback{min-height:41px;display:flex;align-items:center;justify-content:center;gap:8px;margin:10px auto 5px;font-size:clamp(14px,1.8vw,20px);font-weight:900;text-align:center;color:#287e49}
.feedback.error{color:#e7586c}
.feedback .result-speak{width:33px;height:33px;font-size:18px;box-shadow:0 3px 0 #086b9e}
.controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:3px}
.cta{border:0;color:#fff;font-size:clamp(16px,2vw,22px);font-weight:900;border-radius:20px;padding:12px 38px;min-width:175px;min-height:52px;box-shadow:0 7px 0 #158c50;background:linear-gradient(180deg,#52d985,#28b967);transition:transform .12s,filter .12s}
.cta:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-2px)}.cta:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 #158c50}.cta:disabled{opacity:.48;filter:grayscale(.24);cursor:not-allowed}
.cta.next{background:linear-gradient(180deg,#36b6f7,#0b8fcf);box-shadow:0 7px 0 #076ca4}.cta.pink{background:linear-gradient(180deg,#ff8ec1,#ea499d);box-shadow:0 7px 0 #af2a75}

/* Ver 2: small elements float over the original illustrated background; confetti is topmost. */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px;background:transparent;text-align:center}
.overlay-inner{width:100%;max-width:590px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.hero-croc{display:block;width:min(220px,40vw);height:auto;max-height:180px;object-fit:contain;filter:drop-shadow(0 10px 8px rgba(49,104,59,.18));animation:none;transform:none;will-change:auto}
.hero-title{font-size:clamp(30px,5vw,56px);font-weight:900;line-height:1.1;color:#18a4cf;text-shadow:2px 3px 0 #fff}.hero-title span{color:#f35c94}
.hero-desc{max-width:470px;font-size:clamp(17px,2vw,22px);font-weight:800;color:#1784a6;background:rgba(255,255,255,.93);padding:10px 20px;border:3px solid #e2f9ff;border-radius:19px;box-shadow:0 6px 0 rgba(47,135,155,.15)}
.score-big{font-size:clamp(56px,11vw,100px);font-weight:900;line-height:1;color:#e99c15;text-shadow:0 5px 0 #fff}
.score-detail{background:rgba(255,249,216,.97);padding:10px 20px;border-radius:17px;border:2px solid #ffe4a0;font-weight:800;color:#94631f;font-size:clamp(14px,1.8vw,19px);box-shadow:0 5px 0 rgba(153,103,13,.12)}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg)}72%{transform:scale(1.19) rotate(4deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes shake{15%,45%,75%{transform:translateX(-6px)}30%,60%,90%{transform:translateX(6px)}}
@keyframes crocPop{0%{opacity:0;transform:scale(.22) rotate(-15deg)}75%{opacity:1;transform:scale(1.14) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes crocChomp{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(3deg) scale(1.12)}}
@media(max-width:720px){
.shell{width:calc(100% - 12px);min-height:100dvh;padding:8px 0}
.game-card{border:0;border-radius:0;padding:8px 5px 12px}
.topbar{display:flex;min-height:82px;gap:7px;margin-bottom:7px}.header-left{gap:6px}
.progress{padding:4px 9px;font-size:10px;border-width:1px}.logo-clear-space{width:58px;height:38px}
.prompt-bar{padding:5px 7px 5px 10px;gap:6px;margin:0;border-radius:16px}
.prompt-label{font-size:clamp(14px,3.8vw,20px)}.speaker{width:34px;height:34px;font-size:19px}
.number-bar{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:3px;margin-bottom:8px}
.number-pill{min-width:70px;height:55px;font-size:34px;border-width:3px;border-radius:18px}
.math-symbol{width:50px;height:50px;font-size:34px;border-radius:16px;border-width:3px}
.choices-area{grid-template-columns:minmax(0,1fr) 59px minmax(0,1fr);gap:3px}
.option{border-radius:17px;padding:7px 4px;min-height:258px;border-width:3px;box-shadow:0 4px 0 rgba(71,131,149,.15)}
.option-title{font-size:10px}
.apple-stack{gap:3px;max-width:130px}
.ten-pack{grid-template-columns:repeat(5,minmax(0,1fr));gap:0;min-height:0;padding:2px 3px;border-radius:7px;width:100%}
.apple{width:min(100%,21px)}
.croc-head{max-width:69px;width:calc(100% + 10px)}.sleep-croc{width:39px;height:39px;font-size:23px}
.feedback{min-height:46px;font-size:clamp(12px,3.2vw,15px);margin:7px auto 0}
.cta{min-height:45px;min-width:138px;padding:10px 26px;font-size:16px;border-radius:15px;box-shadow:0 5px 0 #158c50}

.hero-croc{max-height:145px}
}
@media(max-width:370px){.topbar{gap:4px}.logo-clear-space{width:38px}.progress{font-size:9px}.prompt-label{font-size:13px}.choices-area{grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr)}.apple-stack{max-width:115px}.croc-head{max-width:61px}.option{min-height:253px}.apple{width:min(100%,19px)}}
@media(max-height:675px) and (min-width:721px){.game-card{padding:11px 17px}.topbar{min-height:42px}.prompt-bar{margin:4px auto 6px;padding:5px}.number-bar{margin-bottom:7px}.number-pill{height:60px;font-size:42px}.math-symbol{height:59px;width:62px;font-size:42px}.option{min-height:205px;padding:6px}.apple-stack{gap:3px}.apple{max-width:25px}.ten-pack{padding:1px 4px;min-height:0}.feedback{margin:5px auto 0;min-height:32px}.cta{min-height:44px;padding:7px 28px}.mute-btn{bottom:8px}}
@media(max-height:660px) and (max-width:720px){.shell{align-items:flex-start}.topbar{min-height:76px}.header-left{gap:5px}.prompt-bar{margin:0}.number-pill{height:48px;font-size:30px}.math-symbol{height:44px;width:45px;font-size:29px}.option{min-height:210px}.ten-pack{padding:1px 3px}.apple{max-width:16px}.feedback{min-height:31px;margin:4px auto 0}.cta{min-height:41px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="shell"><main class="game-card" id="gameCard">
 <div class="gameplay obscured" id="gameplay">
 <header class="topbar"><div class="header-left"><div class="progress" id="progress">⭐ 0 / 10</div><div class="prompt-bar"><span class="prompt-label" id="questionText">Which number is greater?</span><button class="speaker" id="questionSpeak" type="button" aria-label="Listen to the question" title="Listen to the question">🔊</button></div></div><div class="logo-clear-space" aria-hidden="true"></div></header>
 <div class="number-bar"><div class="number-pill left" id="leftNumber">23</div><div class="math-symbol" id="comparison">?</div><div class="number-pill right" id="rightNumber">45</div></div>
 <div class="choices-area"><button id="leftOption" type="button" class="option left" aria-label="Choose the left apple group"><span class="option-title">APPLES</span><span id="leftApples" class="apple-stack"></span></button>
 <div class="croc-zone" aria-live="off"><div class="sleep-croc" id="sleepCroc">?</div><img class="croc-head hidden" id="crocHead" alt="Smiling crocodile mouth opens toward the greater number"></div>
 <button id="rightOption" type="button" class="option right" aria-label="Choose the right apple group"><span class="option-title">APPLES</span><span id="rightApples" class="apple-stack"></span></button></div>
 <div class="feedback" id="feedback" role="status" aria-live="polite">Tap the group with more apples!</div>
 <div class="controls"><button class="cta" id="checkBtn" disabled type="button">CHECK ✓</button><button class="cta next hidden" id="nextBtn" type="button">NEXT ➜</button></div>
 </div>
 <div class="overlay" id="startScreen"><div class="overlay-inner"><img class="hero-croc" id="heroCroc" alt="Friendly smiling crocodile"><div class="hero-desc">Help Croc find more apples!</div><button type="button" class="cta pink" id="startBtn">PLAY NOW ▶</button></div></div>
 <div class="overlay hidden" id="finishScreen"><div class="overlay-inner"><img class="hero-croc" id="finishCroc" alt="Happy crocodile"><div class="hero-title">AMAZING <span>JOB!</span></div><div class="score-big" id="finalScore">10/10</div><div class="score-detail" id="scoreDetail">10 challenges completed!</div><button type="button" class="cta pink" id="restartBtn">PLAY AGAIN ↻</button></div></div>
</main></div>

 symbol.textContent=q.left>q.right?'>':'<';symbol.classList.add('revealed');$('progress').textContent=`⭐ ${firstTry} / ${ROUNDS}  •  ${index+1}/${ROUNDS}`;setFeedback(`🌟 ${answerSentence(q)}`);let sp=document.createElement('button');sp.type='button';sp.className='speaker result-speak';sp.textContent='🔊';sp.setAttribute('aria-label','Hear the comparison');sp.addEventListener('click',()=>{ensureAudio();speak(answerSentence(q));});feedback.appendChild(sp);
 nextBtn.textContent=index===ROUNDS-1?'FINISH 🏆':'NEXT ➜';nextBtn.classList.remove('hidden');checkBtn.classList.add('hidden');speak(answerSentence(q),1120);
}
function newGame(){cancelSpeech();questions=createQuestions();index=0;firstTry=0;mistakes=0;phase='choose';$('startScreen').classList.add('hidden');$('finishScreen').classList.add('hidden');$('gameplay').classList.remove('obscured');ensureAudio();showQuestion();}
function next(){if(phase!=='success')return;if(index===ROUNDS-1){finish();return;}index++;showQuestion();}
function finish(){phase='finished';cancelSpeech();$('finalScore').textContent=`${firstTry}/${ROUNDS}`;$('scoreDetail').textContent=`${ROUNDS} challenges completed! • ${firstTry} correct on the first try`;$('gameplay').classList.add('obscured');$('finishScreen').classList.remove('hidden');soundSuccess();burstConfetti();speak(`Amazing job! You finished all ten challenges!`,280);}
leftOption.addEventListener('click',()=>setSelected('left'));rightOption.addEventListener('click',()=>setSelected('right'));checkBtn.addEventListener('click',checkAnswer);nextBtn.addEventListener('click',next);$('startBtn').addEventListener('click',newGame);$('restartBtn').addEventListener('click',newGame);
$('questionSpeak').addEventListener('click',()=>{ensureAudio();speak('Which number is greater?');});
$('heroCroc').src=CROC_LEFT;$('finishCroc').src=CROC_LEFT;
// Confetti canvas is fixed above every screen and control.
const canvas=$('confetti'),ctx=canvas.getContext('2d');let particles=[],raf=0,scale=1;
function resizeCanvas(){scale=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*scale);canvas.height=Math.round(innerHeight*scale);ctx.setTransform(scale,0,0,scale,0,0);}
window.addEventListener('resize',resizeCanvas);resizeCanvas();
function burstConfetti(){particles=[];const colors=['#ff6aa4','#ffdd55','#34ca7e','#4ca6ff','#af7cff','#ff934a'];for(let i=0;i<210;i++){const x=innerWidth*(.2+Math.random()*.6);particles.push({x,y:-20-Math.random()*innerHeight*.35,vx:(Math.random()-.5)*4.5,vy:1.2+Math.random()*3.5,size:4+Math.random()*8,spin:Math.random()*6.28,rs:(Math.random()-.5)*.18,color:colors[i%colors.length],life:Math.random()*70+130});}cancelAnimationFrame(raf);animateConfetti();}
function animateConfetti(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0&&p.y<innerHeight+30);particles.forEach(p=>{p.x+=p.vx+Math.sin(p.spin)*.55;p.y+=p.vy;p.vy+=.045;p.spin+=p.rs;p.life--;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);ctx.restore();});if(particles.length)raf=requestAnimationFrame(animateConfetti);else ctx.clearRect(0,0,innerWidth,innerHeight);}
})();

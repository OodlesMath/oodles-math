button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
#app{position:relative;z-index:1;width:min(1060px,calc(100vw - 28px));height:100dvh;min-height:0;margin:auto;display:flex;align-items:center;justify-content:center}
.oodles-logo{position:fixed;top:12px;right:16px;max-width:130px;width:12vw;height:auto;z-index:15;pointer-events:none;object-fit:contain}
.hidden-element{display:none!important}
.card{background:rgba(255,255,255,.95);border:4px solid #fff;border-radius:40px;box-shadow:0 17px 0 rgba(38,113,138,.12),0 22px 40px rgba(23,77,108,.16);text-align:center}
.start-screen,.finish-screen{width:100%;display:flex;align-items:center;justify-content:center;padding:18px}
.start-card{width:min(490px,100%);padding:36px 34px 40px}
.start-icon,.finish-icon{font-size:82px;line-height:1.15;filter:drop-shadow(0 9px 9px rgba(0,0,0,.15));animation:bounce 3s ease-in-out infinite}
.start-card h1{font-size:clamp(31px,4.1vw,49px);line-height:1.12;font-weight:900;margin:15px 0 10px;letter-spacing:-1.7px;color:#33546a}
.start-card h1 span{color:var(--sky)}
.start-card p,.finish-card p{font-size:clamp(15px,2vw,19px);font-weight:700;color:#698398;margin:10px 0 28px;line-height:1.5}
.big-button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:17px 22px;border-radius:24px;background:var(--grass);color:white;font-size:clamp(21px,2.7vw,27px);font-weight:900;letter-spacing:.8px;border:3px solid #fff;border-bottom:7px solid var(--grass-dark);box-shadow:0 8px 14px rgba(20,95,13,.12);transition:transform .13s ease,filter .13s ease}
.big-button:hover{filter:brightness(1.045);transform:translateY(-2px)}.big-button:active{transform:translateY(5px);border-bottom-width:3px}
.game-ui{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(9px,1.4vh,15px);padding:clamp(10px,1.7vh,18px) 0}
.game-topbar{width:min(82%,860px);margin:0 auto;min-height:72px;display:flex;align-items:center;gap:17px;background:rgba(255,255,255,.92);border:3px solid #fff;border-radius:24px;padding:10px 16px;box-shadow:0 8px 16px rgba(33,122,163,.12);backdrop-filter:blur(6px)}
.home-btn{width:45px;height:45px;flex:none;border-radius:16px;background:#edfaff;border:2px solid #d0edf9;color:#348eae;font-size:28px;font-weight:900;display:grid;place-items:center;line-height:1;box-shadow:0 3px 0 #c4e2ed}
.home-btn:active{transform:translateY(3px);box-shadow:none}
.progress-stack{flex:1;min-width:0}.progress-label{width:100%;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;font-size:12px;font-weight:900;letter-spacing:.7px;color:#467a8b}
#progress-count{font-size:15px;color:#2c8baa;white-space:nowrap}
.progress-track{width:100%;margin-inline:auto;display:flex;gap:5px;border-radius:99px;background:#e0f4f0;padding:5px;box-shadow:inset 0 2px 5px rgba(0,65,84,.12)}
.progress-segment{height:16px;flex:1;min-width:0;border-radius:99px;background:#b8dce2;transition:background .28s,box-shadow .28s,transform .28s}
.progress-segment.active{background:linear-gradient(180deg,#ffe771,#ffc800);box-shadow:0 0 0 2px rgba(255,255,255,.85),0 1px 8px rgba(255,201,0,.48);animation:glow 1.3s ease-in-out infinite}
.progress-segment.complete{background:linear-gradient(180deg,#8ae849,#48b904);box-shadow:inset 0 -2px 0 rgba(12,119,0,.18)}
.score-pill{border-radius:17px;background:#fff2ba;border:2px solid #ffe076;padding:9px 14px;min-width:79px;text-align:center;white-space:nowrap;color:#a97900;font-weight:900;font-size:21px;box-shadow:0 4px 0 #e4c55a}
.stage-frame{position:relative;flex:1;min-height:150px;max-height:min(55dvh,530px);width:min(70%,679px);margin:0 auto;overflow:hidden;background:radial-gradient(circle at 50% 48%,#fff 15%,#eaf9ff 100%);border:5px solid rgba(255,255,255,.97);border-radius:34px;box-shadow:0 10px 0 rgba(13,126,163,.17),0 17px 33px rgba(0,67,94,.15);cursor:crosshair;touch-action:none}
/* Correct answer: remove the whole dark picture panel, leaving the shape on the illustrated background. */
.stage-frame.shape-revealed{background:transparent;border-color:transparent;box-shadow:none;cursor:default}
.stage-frame.shape-revealed .stage-pattern,.stage-frame.shape-revealed .flashlight-overlay,.stage-frame.shape-revealed .torch-ring,.stage-frame.shape-revealed .success-label{display:none!important}
.game-ui.showing-reveal .game-controls{visibility:hidden}
.stage-pattern{position:absolute;inset:0;background-image:radial-gradient(rgba(28,176,246,.3) 2.3px,transparent 2.5px);background-size:34px 34px;opacity:.3;pointer-events:none}
#shape-render-area{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:transform 1s}
#shape-render-area svg{width:min(43vh,260px);height:min(43vh,260px);max-width:65%;max-height:75%;filter:drop-shadow(0 12px 12px rgba(0,0,0,.16))}
.flashlight-overlay{position:absolute;inset:0;background:#0f172a;pointer-events:none;transition:opacity .5s ease;-webkit-mask-image:radial-gradient(circle var(--torch-size,100px) at var(--torch-x,50%) var(--torch-y,50%),transparent 0%,#000 100%);mask-image:radial-gradient(circle var(--torch-size,100px) at var(--torch-x,50%) var(--torch-y,50%),transparent 0%,#000 100%)}
.torch-ring{position:absolute;pointer-events:none;width:calc(var(--torch-size,100px)*2);height:calc(var(--torch-size,100px)*2);left:var(--torch-x,50%);top:var(--torch-y,50%);transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(255,255,255,.65);box-shadow:inset 0 0 20px rgba(255,255,255,.25),0 0 32px rgba(255,255,255,.25);transition:width .1s,height .1s}
.success-label{position:absolute;top:25%;left:0;width:100%;z-index:20;text-align:center;pointer-events:none}.success-label span{display:inline-block;background:rgba(255,255,255,.97);border:4px solid var(--grass);border-radius:99px;padding:10px 24px;color:var(--grass-dark);font-size:clamp(22px,3vw,42px);font-weight:900;letter-spacing:2px;box-shadow:0 9px 23px rgba(0,0,0,.18);animation:bounce 1.3s infinite}
.game-controls{width:min(970px,100%);margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.3vh,16px);padding-bottom:4px}
.question-block{display:inline-flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,18px);width:max-content;max-width:100%;padding:9px 12px 9px 28px;background:rgba(255,255,255,.96);border:3px solid white;border-radius:24px;box-shadow:0 6px 0 rgba(39,137,161,.15),0 7px 17px rgba(21,92,125,.1);backdrop-filter:blur(5px)}
.question-block h2{margin:0;font-size:clamp(21px,2.7vw,31px);line-height:1.25;color:#28506a;font-weight:900;white-space:normal}
.speak-btn{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border:3px solid white;border-radius:50%;background:var(--sky);color:#fff;box-shadow:0 5px 0 var(--sky-dark);font-size:22px;transition:transform .1s}
.speak-btn:hover{filter:brightness(1.04)}.speak-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-dark)}
.answers-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:clamp(7px,1.7vw,20px);width:100%;padding:2px 4px 8px}
.answer-choice{width:100%;min-width:0;min-height:clamp(65px,9vh,83px);padding:10px 9px;border:3px solid #fff;border-bottom:7px solid #7bbfd9;border-radius:22px;background:linear-gradient(180deg,rgba(248,254,255,.98),rgba(206,241,252,.97));box-shadow:0 7px 15px rgba(23,110,138,.16);color:#26607b;font-size:clamp(13px,2.35vw,24px);line-height:1.17;font-weight:900;letter-spacing:.4px;text-transform:uppercase;text-align:center;overflow-wrap:break-word;transition:background .15s,transform .13s,filter .13s}
.answer-choice:hover:not(.answer-correct){transform:translateY(-3px);background:linear-gradient(180deg,#fff,#ecfcff);filter:brightness(1.02)}.answer-choice:active{transform:translateY(5px);border-bottom-width:3px}
.answer-choice.answer-correct{background:linear-gradient(180deg,#8fe960,#51c80c);border-color:#e9ffde;border-bottom-color:#39a000;color:#fff;text-shadow:0 2px 3px rgba(22,101,0,.3)}
.answer-choice.answer-wrong{background:#ffe2e7;color:#d74253;border-color:#ffb4c2;border-bottom-color:#dd7f90}
.torch-control{display:flex;justify-content:center;align-items:center;gap:11px;background:rgba(255,255,255,.9);border:2px solid #fff;border-radius:99px;box-shadow:0 4px 12px rgba(15,99,130,.1);padding:6px 16px;font-weight:800;color:#47748a;font-size:13px;white-space:nowrap}
.torch-control .torch-symbol{font-size:22px}.torch-control label{text-transform:uppercase;letter-spacing:.5px}
input[type=range]{appearance:none;-webkit-appearance:none;width:clamp(100px,18vw,180px);height:8px;border-radius:99px;background:linear-gradient(90deg,#d2f6b2,#a5e6f7);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:23px;height:23px;border-radius:50%;background:#ffc800;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,.2)}input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#ffc800;border:3px solid white;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.finish-card{max-width:570px;width:100%;padding:34px 32px 40px}.finish-card h1{font-size:clamp(36px,5vw,55px);font-weight:900;color:#2d9cce;margin:8px 0 0}.stars{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:clamp(30px,5vw,52px);margin:22px 0 26px}
.star-earned{animation:bounce 1.5s ease-in-out infinite}.star-missing{opacity:.35}.finish-card .big-button{background:var(--sky);border-bottom-color:var(--sky-dark)}
.juicy-shape{filter:drop-shadow(0px 10px 15px rgba(0,0,0,.2))}
.shake{animation:shake .4s both}@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@media(max-width:700px){#app{width:calc(100vw - 18px)}.game-topbar{width:100%;padding:8px 9px;gap:8px;min-height:60px;border-radius:19px}.home-btn{width:39px;height:39px;font-size:24px;border-radius:13px}.progress-label{font-size:10px}.progress-segment{height:12px}.score-pill{font-size:17px;min-width:65px;padding:6px 8px;border-radius:13px}.stage-frame{width:100%;border-width:4px;border-radius:24px;max-height:55dvh}.question-block{border-radius:19px;padding:7px 9px 7px 16px}.speak-btn{width:42px;height:42px;flex-basis:42px;font-size:18px}.answer-choice{min-height:66px;border-radius:16px;border-bottom-width:5px;padding:7px 5px}.torch-control{font-size:11px;padding:5px 12px}.torch-control .torch-symbol{font-size:19px}.oodles-logo{width:80px}}
@media(max-height:670px){.game-ui{gap:6px;padding:5px 0}.game-topbar{min-height:54px;padding:6px 10px}.stage-frame{max-height:48dvh;min-height:110px}.question-block{padding:5px 9px 5px 16px}.question-block h2{font-size:20px}.speak-btn{width:37px;height:37px;flex-basis:37px}.answer-choice{min-height:54px;border-bottom-width:4px}.torch-control{padding:3px 12px}.start-icon,.finish-icon{font-size:65px}}
@media(max-width:390px){.progress-label{font-size:9px}.score-pill{min-width:56px}.answer-choice{font-size:12px;letter-spacing:0}.torch-control{gap:7px}.torch-control input{width:95px}}
</style>
</head>
<body>
<!-- Preserve the original logo resource and upper-right placement. -->
<img src="https://oodlesmath.github.io/oodles-math/PopsicleMath/Pals-Solver/assets/logo-oodles-math.png" class="oodles-logo" alt="Oodles Math" onerror="this.style.display='none'">
<canvas id="confetti-canvas" style="position:fixed;inset:0;pointer-events:none;z-index:9999"></canvas>
<main id="app">
  <section id="screen-start" class="start-screen">
    <div class="card start-card">
      <div class="start-icon" aria-hidden="true">🔭</div>
      <h1>SHAPE <span>EXPLORER</span></h1>
      <p>Find all the hidden magic shapes!</p>
      <button onclick="startGame()" class="big-button">▶ PLAY GAME</button>
    </div>
  </section>

  <section id="screen-over" class="finish-screen hidden-element" aria-live="polite">
    <div class="card finish-card">
      <div class="finish-icon" aria-hidden="true">🏆</div>
      <h1>WOW!</h1>
      <p>You found every single shape!</p>
      <div id="star-container" class="stars" aria-label="Stars earned"></div>
      <button onclick="location.reload()" class="big-button">↻ PLAY AGAIN</button>
    </div>
  </section>

  <section id="game-ui" class="game-ui hidden-element">
    <header class="game-topbar">
      <button onclick="location.reload()" class="home-btn" title="Restart" aria-label="Restart game">↺</button>
      <div class="progress-stack">
        <div class="progress-label"><span>SHAPE QUEST</span><span id="progress-count">1 / 6</span></div>
        <div id="progress-dots" class="progress-track" role="progressbar" aria-label="Completed shape challenges" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"></div>
      </div>
      <div class="score-pill" title="Correct answers">⭐ <span id="current-score">0</span></div>
    </header>

    <div id="game-stage" class="stage-frame" aria-label="Move your flashlight to find the hidden shape">
      <div class="stage-pattern"></div>
      <div id="shape-render-area"></div>
      <div id="darkness" class="flashlight-overlay"></div>
      <div id="torch-ring" class="torch-ring"></div>
      <div id="success-label" class="success-label hidden-element"><span>PERFECT!</span></div>
    </div>

    <div class="game-controls">
      <div class="question-block">
        <h2>What shape is it?</h2>
        <button onclick="playTTS('What shape is it?')" class="speak-btn" aria-label="Read the question aloud" title="Listen again">🔊</button>
      </div>
      <div id="options-container" class="answers-row" role="group" aria-label="Choose the correct shape"></div>
      <div class="torch-control">
        <span class="torch-symbol" aria-hidden="true">🔦</span>
        <label for="torch-slider">Light Size</label>
        <input id="torch-slider" type="range" min="60" max="180" value="100" aria-label="Flashlight size">
      </div>
    </div>
  </section>
</main>
<script>

        // Small built-in celebration so Play Again and the finish screen work offline.
        function confetti({particleCount=100,spread=90,origin={y:0.5},colors=['#ff4b4b','#1cb0f6','#ffc800','#58cc02','#ce82ff']}={}){
            const canvas=document.getElementById('confetti-canvas'); const ctx=canvas.getContext('2d');
            const dpr=Math.min(window.devicePixelRatio||1,2);
            canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
            const w=innerWidth,h=innerHeight,x0=w*.5,y0=h*(origin.y??.5),angleSpread=spread*Math.PI/180;
            const dots=Array.from({length:Math.min(particleCount,400)},()=>{const a=-Math.PI/2+(Math.random()-.5)*angleSpread;const speed=4+Math.random()*10;return{x:x0,y:y0,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*6.28,spin:(Math.random()-.5)*.25,size:4+Math.random()*6,life:0}});
            let frame=0;function animate(){frame++;ctx.clearRect(0,0,w,h);for(const p of dots){p.x+=p.vx;p.y+=p.vy;p.vy+=.17;p.vx*=.993;p.rot+=p.spin;p.life++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.66);ctx.restore()}if(frame<130)requestAnimationFrame(animate);else ctx.clearRect(0,0,w,h)}requestAnimationFrame(animate);
        }
// --- High Quality, Realistic & Juicy SVGs ---
        // Enhanced with gradients, drop shadows, and highlights for 4-5 year olds
        
        const SVG_DEFS = `
            <defs>
                <!-- 2D Glossy Highlight -->
                <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
                    <stop offset="40%" stop-color="white" stop-opacity="0.1"/>
                    <stop offset="100%" stop-color="white" stop-opacity="0"/>
                </linearGradient>
            </defs>
        `;

        const SHAPES_2D = [
            { name: 'Circle', color: '#ff2d3f', svg: `<g><defs><linearGradient id="grad-circle" x1="15%" y1="10%" x2="85%" y2="90%"><stop offset="0%" stop-color="#ff4a59"/><stop offset="100%" stop-color="#ff1f2f"/></linearGradient></defs><circle cx="50" cy="50" r="40" fill="url(#grad-circle)" stroke="#c80f14" stroke-width="4"/><ellipse cx="38" cy="30" rx="18" ry="11" fill="rgba(255,255,255,0.20)" opacity="0.45"/></g>` },
            { name: 'Square', color: '#ffd400', svg: `<g><defs><linearGradient id="grad-square" x1="12%" y1="10%" x2="88%" y2="90%"><stop offset="0%" stop-color="#ffe95a"/><stop offset="100%" stop-color="#ffd400"/></linearGradient></defs><rect x="20" y="20" width="60" height="60" rx="4" fill="url(#grad-square)" stroke="#b57b00" stroke-width="4"/><rect x="26" y="26" width="48" height="12" rx="6" fill="rgba(255,255,255,0.22)" opacity="0.4"/></g>` },
            { name: 'Triangle', color: '#23a8ec', svg: `<g><defs><linearGradient id="grad-triangle" x1="20%" y1="10%" x2="80%" y2="90%"><stop offset="0%" stop-color="#42bfff"/><stop offset="100%" stop-color="#1596e0"/></linearGradient></defs><polygon points="50,15 89,85 11,85" fill="url(#grad-triangle)" stroke="#0a3cbf" stroke-width="4" stroke-linejoin="round"/><path d="M50 24 L76 72 L24 72 Z" fill="rgba(255,255,255,0.14)" opacity="0.35" stroke="none"/></g>` },
            { name: 'Rectangle', color: '#59df4c', svg: `<g><defs><linearGradient id="grad-rectangle" x1="10%" y1="15%" x2="90%" y2="85%"><stop offset="0%" stop-color="#61eb55"/><stop offset="100%" stop-color="#52de47"/></linearGradient></defs><rect x="10" y="30" width="80" height="40" rx="2" fill="url(#grad-rectangle)" stroke="#089212" stroke-width="4"/><rect x="18" y="36" width="58" height="8" rx="4" fill="rgba(255,255,255,0.2)" opacity="0.4"/></g>` },
            { name: 'Half Circle', color: '#a846f6', svg: `<g><defs><linearGradient id="grad-half" x1="18%" y1="15%" x2="82%" y2="88%"><stop offset="0%" stop-color="#c161ff"/><stop offset="100%" stop-color="#9740f2"/></linearGradient></defs><path d="M 10 70 A 40 40 0 0 1 90 70 L 10 70 Z" fill="url(#grad-half)" stroke="#5f00d4" stroke-width="4" stroke-linejoin="round"/><path d="M18 66 A 32 32 0 0 1 82 66" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="6" stroke-linecap="round" opacity="0.4"/></g>` },
            { name: 'Quarter Circle', color: '#f23ea3', svg: `<g><defs><linearGradient id="grad-quarter" x1="15%" y1="12%" x2="88%" y2="88%"><stop offset="0%" stop-color="#ff5bb6"/><stop offset="100%" stop-color="#ef3594"/></linearGradient></defs><path d="M 20 20 L 20 80 L 80 80 A 60 60 0 0 0 20 20 Z" fill="url(#grad-quarter)" stroke="#c60062" stroke-width="4" stroke-linejoin="round"/><path d="M30 30 L30 72 L72 72 A 42 42 0 0 0 30 30 Z" fill="rgba(255,255,255,0.14)" opacity="0.35" stroke="none"/></g>` }
        ];

        // --- State ---
                let currentRound = 1;
        let score = 0;
        let shapeQueue = [];
        let currentTarget = null;
        let isRevealed = false;

        // --- Core Functions ---
        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        // Upgraded Sound Effects for kids
        function playSfx(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                
                if (type === 'correct') {
                    // Cheerful Arpeggio
                    osc.type = 'sine'; 
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3); // C6
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                } else {
                    // Gentle boop
                    osc.type = 'triangle'; 
                    osc.frequency.setValueAtTime(250, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch(e) {}
        }

        // Text-to-Speech Function
        function playTTS(text) {
            // Browser-compatible speech: never block the lesson if speech is unavailable.
            if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== 'function') return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "en-US";
                utterance.rate = 0.85;
                utterance.pitch = 1.3;
                const voices = window.speechSynthesis.getVoices() || [];
                const voice = voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.startsWith('en'));
                if (voice) utterance.voice = voice;
                window.activeShapeSpeech = utterance;
                window.speechSynthesis.speak(utterance);
            } catch (e) { /* Continue playing without voice on unsupported devices. */ }
        }

        // --- Game Flow ---
        function startGame() {
            document.getElementById('screen-start').classList.add('hidden-element');
            document.getElementById('game-ui').classList.remove('hidden-element');
            
            // Adjust background elements
            // The illustrated background stays visible throughout the game. 
            
            const list = [...SHAPES_2D];
            shapeQueue = shuffle(list); // Six unique 2D shapes, each shown once

            initProgressDots();
            setupRound();
            updateTorchSize(document.getElementById('torch-slider').value);
        }

        function initProgressDots() {
            const container = document.getElementById('progress-dots');
            container.innerHTML = '';
            shapeQueue.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'progress-segment';
                dot.id = `dot-${i + 1}`;
                container.appendChild(dot);
            });
        }

        function setupRound() {
            isRevealed = false;
            currentTarget = shapeQueue[currentRound - 1];
            document.getElementById('game-stage').classList.remove('shape-revealed');
            document.getElementById('game-ui').classList.remove('showing-reveal');
            
            document.getElementById('darkness').style.opacity = '1';
            document.getElementById('torch-ring').style.opacity = '1';
            document.getElementById('success-label').classList.add('hidden-element');
            
            const currentDot = document.getElementById(`dot-${currentRound}`);
            currentDot.classList.remove('pending');
            currentDot.classList.add('active');
            document.getElementById('progress-count').textContent = `${currentRound} / ${shapeQueue.length}`;
            document.getElementById('progress-dots').setAttribute('aria-valuenow', String(score));

            const area = document.getElementById('shape-render-area');
            area.innerHTML = `
                <svg width="250" height="250" viewBox="0 0 100 100" style="color: ${currentTarget.color}" class="max-w-[70%] max-h-[70%] drop-shadow-2xl">
                    ${SVG_DEFS}
                    ${currentTarget.svg}
                </svg>
            `;
            area.style.transform = 'scale(1)';

            // Auto-play the question sound on new round
            setTimeout(() => playTTS("What shape is it?"), 500);

            // Generate 3 Options
            const allShapes = SHAPES_2D;
            let wrongs = shuffle(allShapes.filter(s => s.name !== currentTarget.name)).slice(0, 2);
            const opts = shuffle([currentTarget, ...wrongs]);

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'answer-choice';
                btn.innerText = opt.name;
                btn.onclick = () => handleGuess(opt.name, btn);
                optContainer.appendChild(btn);
            });
        }

        function handleGuess(name, btn) {
            if (isRevealed) return;
            if (name === currentTarget.name) {
                isRevealed = true; score++;
                playSfx('correct');
                playTTS("Correct! It's a " + name);
                
                document.getElementById('current-score').innerText = score;
                document.getElementById('progress-dots').setAttribute('aria-valuenow', String(score));
                document.getElementById('darkness').style.opacity = '0';
                document.getElementById('torch-ring').style.opacity = '0';
                document.getElementById('success-label').classList.add('hidden-element');
                document.getElementById('game-stage').classList.add('shape-revealed');
                document.getElementById('game-ui').classList.add('showing-reveal');
                document.getElementById('shape-render-area').style.transform = 'scale(1.3)';
                
                const dot = document.getElementById(`dot-${currentRound}`);
                dot.className = 'progress-segment complete';
                
                btn.classList.add('answer-correct');

                setTimeout(() => {
                    if (currentRound < shapeQueue.length) {
                        currentRound++;
                        setupRound();
                    } else {
                        finishGame();
                    }
                }, 2500);
            } else {
                playSfx('wrong');
                btn.classList.add('shake', 'answer-wrong');
                setTimeout(() => btn.classList.remove('shake', 'answer-wrong'), 400);
            }
        }

        function finishGame() {
            document.getElementById('game-ui').classList.add('hidden-element');
            // Keep the same illustrated background for the end screen.
            document.getElementById('screen-over').classList.remove('hidden-element');
            
            playTTS("Wow! You found every single shape!");

            const starContainer = document.getElementById('star-container');
            starContainer.innerHTML = '';
            for(let i=0; i<shapeQueue.length; i++) {
                const s = document.createElement('span');
                s.innerText = i < score ? '⭐' : '☆';
                s.className = i < score ? 'star-earned' : 'star-missing';
                s.style.animationDelay = `${i * 0.1}s`;
                starContainer.appendChild(s);
            }
            
            // Fire high-priority confetti
            confetti({ particleCount: 300, spread: 100, origin: { y: 0.5 }, zIndex: 9999, colors: ['#ff4b4b', '#1cb0f6', '#ffc800', '#58cc02', '#ce82ff'] });
            setTimeout(() => confetti({ particleCount: 200, spread: 140, origin: { y: 0.6 }, zIndex: 9999 }), 800);
            setTimeout(() => confetti({ particleCount: 200, spread: 140, origin: { y: 0.7 }, zIndex: 9999 }), 1600);
        }

        // --- Interaction & Torch Logic ---
        const stage = document.getElementById('game-stage');
        const torchSlider = document.getElementById('torch-slider');

        function moveTorch(e) {
            const rect = stage.getBoundingClientRect();
            // ClientX/Y ensures it follows cursor even if page scrolled
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            
            // Constrain within bounds
            const boundedX = Math.max(0, Math.min(x, rect.width));
            const boundedY = Math.max(0, Math.min(y, rect.height));

            stage.style.setProperty('--torch-x', `${boundedX}px`);
            stage.style.setProperty('--torch-y', `${boundedY}px`);
        }
        
        function updateTorchSize(val) {
            // Scale dynamically based on window width to feel consistent on mobile
            const scale = window.innerWidth < 768 ? 0.7 : 1;
            stage.style.setProperty('--torch-size', `${val * scale}px`);
        }

        stage.addEventListener('mousemove', moveTorch);
        stage.addEventListener('touchmove', (e) => { e.preventDefault(); moveTorch(e); }, { passive: false });
        
        torchSlider.addEventListener('input', (e) => {
            updateTorchSize(e.target.value);
        });

        // Initialize center pos
        stage.style.setProperty('--torch-x', `50%`);
        stage.style.setProperty('--torch-y', `50%`);
        updateTorchSize(100);

        // Handle window resize dynamically adjusting torch
        window.addEventListener('resize', () => { 
             updateTorchSize(torchSlider.value);
        });
</script>
</body>
</html>

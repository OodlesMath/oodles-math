        .btn-candy {
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 8px solid rgba(0,0,0,0.15);
        }
        .btn-candy:hover { transform: translateY(-3px) scale(1.02); border-bottom-width: 10px; }
        .btn-candy:active { transform: translateY(6px) scale(0.98); border-bottom-width: 2px; }
        .btn-candy[disabled] { opacity: 0.55; cursor: not-allowed; }
        .btn-candy[disabled]:hover { transform: none; border-bottom-width: 8px; }

        .treasure-item {
            font-size: 5rem;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));
            animation: treasure-float 3s ease-in-out infinite;
        }
        @keyframes treasure-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
        @keyframes bounce-pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }
        .bounce-pop { animation: bounce-pop 0.45s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-10px); }
            40%,80% { transform: translateX(10px); }
        }
        .shake { animation: shake 0.45s ease-in-out; }
        @keyframes pulse-glow {
            0%,100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.8)); transform: scale(1.04); }
        }
        .text-glow { animation: pulse-glow 2s infinite; }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }
        .particle {
            position: absolute; width: 14px; height: 14px; border-radius: 50%; pointer-events: none;
            opacity: 0; z-index: 100; box-shadow: 0 0 10px currentColor;
        }
        @keyframes fallConfetti {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 1; }
        }
        .custom-scrollbar::-webkit-scrollbar { height: 12px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(99,102,241,.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99,102,241,.35); border-radius: 10px; }

        .shape-icon {
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
        }
        .shape-icon img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .shape-large { width: 74px; height: 74px; padding: 2px; }
        .shape-small { width: 62px; height: 62px; padding: 2px; }
        @media (min-width: 768px) {
            .shape-large { width: 96px; height: 96px; }
            .shape-small { width: 82px; height: 82px; }
        }
        .option-button.correct { background: #dcfce7 !important; border-color: #22c55e !important; }
        .option-button.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; }
        .option-button.solved { box-shadow: 0 0 0 5px rgba(34,197,94,0.18); }

        .falling-shape {
            position: absolute;
            top: -100px;
            width: 72px;
            height: 72px;
            border: none;
            background: transparent;
            padding: 0;
            cursor: pointer;
            animation-name: bonusFall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
        .falling-shape img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(0,0,0,.18)); }
        @keyframes bonusFall {
            from { transform: translateY(-110px) rotate(0deg); }
            to { transform: translateY(calc(65vh + 120px)) rotate(360deg); }
        }
        .score-float {
            position: absolute; color: white; font-weight: 900; font-size: 28px; pointer-events: none;
            animation: floatUp 0.8s ease-out forwards; text-shadow: 0 4px 8px rgba(0,0,0,.35);
        }
    
/* Ver 3 visual refinements: keep the Ver 2 layout and colors */
body { min-height: 100vh; width: 100vw; margin: 0; }
#game-container { max-height: calc(100vh - 16px); }

.oodles-logo { position:fixed;right:16px;top:15px;z-index:2;
  display:flex;align-items:center;gap:2px;color:#214b7a;
  font:900 17px/0.84 'Arial Rounded MT Bold', system-ui, sans-serif;letter-spacing:-.6px;}
.oodles-logo .logo-eyes {display:flex;align-items:flex-end;gap:0;position:relative;padding-top:7px;}
.oodles-logo .logo-eyes::before {content:'';position:absolute;top:0;left:1px;width:33px;height:17px;background:#f45b7c;border-radius:22px 22px 3px 3px;}
.oodles-logo .logo-eyes i {display:block;width:17px;height:17px;border:4px solid #214b7a;
   background:white;border-radius:50%;position:relative;z-index:1;}
.oodles-logo .logo-eyes i::after {content:'';position:absolute;left:3px;top:3px;width:4px;height:4px;background:#214b7a;border-radius:50%;}

.shape-icon { filter: none; }
.shape-large { width: clamp(64px, 7vw, 90px); height:clamp(64px, 7vw, 90px); }
.shape-small { width: clamp(55px, 6vw, 76px); height:clamp(55px, 6vw, 76px); }
#pattern-display { gap:clamp(8px,1.65vw,21px); }
#next-button { transition: transform .18s ease, background-color .18s ease; }
#question-mark.is-solved { border-color:#86efac; background:#f0fdf4; box-shadow:0 0 0 6px rgba(34,197,94,.1); }
#question-mark.is-solved .shape-icon { animation: bounce-pop .36s ease-out both; }
.option-button.wrong { animation: shake .28s ease-in-out; }
.option-button.correct { border-color:#86efac !important; background:#f0fdf4 !important; }
.option-button.solved { opacity:1; }
#feedback-modal { display:none !important; } /* Spoken feedback only */

.bonus-overlay.hidden {display:none !important;}
.bonus-hud {position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;

.bonus-title {font-weight:900;font-size:clamp(28px,4.2vw,52px);color:#4f46e5;

.bonus-canvas {position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;touch-action:none;cursor:crosshair;}
.bonus-message {position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);

 padding:28px 40px;border-radius:30px;box-shadow:0 15px 45px rgba(0,0,0,.24);
 font-size:clamp(26px,4vw,46px);font-weight:900;text-align:center;white-space:nowrap;pointer-events:none;}

        // Four simple, mathematically consistent repeating sequences only.
        // Random shapes/color schemes make each of the 10 questions unique.
        const TEMPLATES = [
            { id: 'ABAB', slots: 2, pattern: [0,1,0,1], answer: 0 },
            { id: 'BBABBA', slots: 2, pattern: [1,1,0,1,1,0], answer: 1 },
            { id: 'ABCABC', slots: 3, pattern: [0,1,2,0,1,2], answer: 0 },
            { id: 'ABBABB', slots: 2, pattern: [0,1,1,0,1,1], answer: 0 }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let bonusCaught = 0;
        let questionCanScore = true;
        let questionSolved = false;
        let isChecking = false;
        let bonusRunning = false;
        let bonusRAF = 0;
        let bonusNextCallback = null;
        let bonusTimeRemaining = 15;
        let bonusLastTick = null;
        let bonusSpawnCounter = 0;
        let bonusItems = [];
        let bonusParticles = [];
        let bonusRoundScore = 0;
        let feedbackTimeout = null;
        let speechTimeout = null;

        const speechSynth = window.speechSynthesis;
        function speak(text) {
            try {
                speechSynth.cancel();
                if (speechTimeout) clearTimeout(speechTimeout);
                speechTimeout = setTimeout(() => {
                    if (document.hidden) return;
                    const u = new SpeechSynthesisUtterance(text);
                    const voices = speechSynth.getVoices();
                    const chosen = voices.find(v => /^en-US$/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
                    if (chosen) u.voice = chosen;
                    u.lang = 'en-US'; u.rate = 0.91; u.pitch = 1.15; u.volume = 1;
                    speechSynth.speak(u);
                }, 130);
            } catch (e) { /* Speech synthesis may be unavailable in some browsers */ }
        }

        // Small native WebAudio effects: no external audio library; optional.
        let audioContext = null;
        function playPop(freq=640) {
            try {
                audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();
                const start=audioContext.currentTime;
                const osc=audioContext.createOscillator();
                const gain=audioContext.createGain();
                osc.type='sine';
                osc.frequency.setValueAtTime(freq,start);
                osc.frequency.exponentialRampToValueAtTime(freq*1.26,start+0.09);
                gain.gain.setValueAtTime(0.065,start);
                gain.gain.exponentialRampToValueAtTime(0.001,start+0.11);
                osc.connect(gain).connect(audioContext.destination);
                osc.start(start); osc.stop(start+0.12);
            } catch (e) {}
        }

        const $ = id=>document.getElementById(id);
        const startScreen = $('start-screen');
        const startBtn = $('start-button');
        const patternDisplay = $('pattern-display');
        const optionsDisplay = $('options-display');
        const bonusModal = $('bonus-modal');
        const bonusCanvas = $('bonus-canvas');
        const bonusTimerEl = $('bonus-timer');
        const bonusRoundScoreEl = $('bonus-round-score');
        const bonusMessageEl = $('bonus-message');
        const gameOverModal = $('game-over-modal');
        const scoreEl = $('score');
        const progressTextEl = $('progress-text');
        const progressBarEl = $('progress-bar');
        const nextButton = $('next-button');
        const gameContainer = $('game-container');
        const fxContainer = $('fx-container');

        function shuffle(arr) {
            const result = [...arr];
            for(let i=result.length-1;i>0;i--) {
                const j=Math.floor(Math.random()*(i+1));
                [result[i],result[j]]=[result[j],result[i]];
            }
            return result;
        }
        function sample(arr,count) {return shuffle(arr).slice(0,count);}

        function getShapeHtml(item,size='large') {
            const cls=size==='large'?'shape-large':'shape-small';
            return `<div class="shape-icon ${cls}"><img alt="${item.name}" draggable="false" src="${item.src}"></div>`;
        }

        function buildQuestionSet(count=10) {
            const result=[];
            const seen=new Set();
            // At least two examples of each of the four core patterns in 10 questions.
            const templateQueue=shuffle([...TEMPLATES,...TEMPLATES,...sample(TEMPLATES,2)]);
            let tries=0;
            while(result.length<count && tries++<1000) {
                const tmpl=templateQueue[result.length] || TEMPLATES[Math.floor(Math.random()*TEMPLATES.length)];
                const picked=sample(SHAPES,tmpl.slots);
                const pattern=tmpl.pattern.map(idx=>picked[idx]);
                const correct=picked[tmpl.answer];
                const signature=pattern.map(s=>s.id).join('-')+'=>'+correct.id;
                if(seen.has(signature)) continue;
                seen.add(signature);
                const distractors=sample(SHAPES.filter(s=>s.id!==correct.id),2);
                result.push({pattern,correct,options:shuffle([correct,...distractors]),type:tmpl.id});
            }
            return result;
        }

        function updateUI() {
            scoreEl.textContent=`⭐ POINTS: ${score}`;
            progressTextEl.textContent=`LEVEL ${Math.min(currentQuestionIndex+1,questions.length)} / ${questions.length}`;
            progressBarEl.style.width=`${currentQuestionIndex/questions.length*100}%`;
        }

        function createConfetti() {
            const colors=['#818cf8','#f472b6','#34d399','#fbbf24','#a78bfa'];
            for(let i=0;i<34;i++) {
                const c=document.createElement('div');
                c.className='particle';
                c.style.backgroundColor=colors[i%colors.length];
                c.style.left=`${Math.random()*100}%`;
                c.style.top='-20px';
                c.style.animation=`fallConfetti ${2+Math.random()*1.1}s ease-out forwards`;
                c.style.opacity='1';
                fxContainer.appendChild(c);
                c.addEventListener('animationend',()=>c.remove(),{once:true});
            }
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {showGameOver();return;}
            questionCanScore=true;
            questionSolved=false;
            isChecking=false;
            nextButton.classList.add('hidden');
            nextButton.disabled=true;
            const q=questions[currentQuestionIndex];
            patternDisplay.innerHTML='';
            q.pattern.forEach((item,idx)=>{
                const el=document.createElement('div');
                el.className='bounce-pop shrink-0';
                el.style.animationDelay=`${idx*.075}s`;
                el.innerHTML=getShapeHtml(item);
                patternDisplay.appendChild(el);
            });
            const questionMark=document.createElement('div');
            questionMark.className='bounce-pop shrink-0';
            questionMark.style.animationDelay=`${q.pattern.length*.075}s`;
            questionMark.innerHTML=`<div class="relative flex items-center justify-center p-2"><div id="question-mark" class="w-[74px] h-[74px] md:w-[96px] md:h-[96px] bg-white border-4 border-dashed border-indigo-300 rounded-[1.7rem] flex items-center justify-center text-5xl md:text-7xl font-black text-indigo-200 shadow-inner">?</div></div>`;
            patternDisplay.appendChild(questionMark);
            optionsDisplay.innerHTML='';
            q.options.forEach(opt=>{
                const btn=document.createElement('button');
                btn.className='option-button btn-candy bg-white rounded-[2.2rem] p-4 md:p-6 shadow-xl border-4 border-slate-50 hover:bg-slate-50 active:bg-indigo-50 transition-colors';
                btn.setAttribute('aria-label',opt.name);
                btn.innerHTML=getShapeHtml(opt,'small');
                btn.onclick=()=>handleChoice(opt,btn);
                optionsDisplay.appendChild(btn);
            });
            updateUI();
            speak("What's next?");
        }

        const PRAISE=['Great job!','Well done!','Excellent!','You got it!','Fantastic!'];
        function handleChoice(selected,btn) {
            if(isChecking||questionSolved||bonusRunning) return;
            const q=questions[currentQuestionIndex];
            if(selected.id===q.correct.id) {
                questionSolved=true;
                if(questionCanScore) score++;
                btn.classList.add('correct','solved');
                optionsDisplay.querySelectorAll('button').forEach(b=>b.disabled=true);
                const qm=$('question-mark');
                qm.textContent='';
                qm.classList.add('is-solved');
                qm.innerHTML=getShapeHtml(q.correct,'large');
                // Be mindful that 96px shape within 96px question box. Use adaptive size.
                qm.querySelector('.shape-large').style.width='100%';
                qm.querySelector('.shape-large').style.height='100%';
                nextButton.classList.remove('hidden');
                nextButton.disabled=false;
                createConfetti();
                playPop(760);
                speak(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
                updateUI();
            } else {
                questionCanScore=false;
                btn.classList.add('wrong');
                playPop(260);
                speak('Try again!');
                if(feedbackTimeout) clearTimeout(feedbackTimeout);
                feedbackTimeout=setTimeout(()=>btn.classList.remove('wrong'),430);
            }
        }

        function goNext() {
            if(!questionSolved||bonusRunning) return;
            const finished=currentQuestionIndex+1;
            if(finished%2===0) startBonusRound(()=>{currentQuestionIndex++;loadQuestion();});
            else {currentQuestionIndex++;loadQuestion();}
        }

        // Optimized bonus: all falling sprites and click bursts share ONE canvas.
        // No continuously inserted DOM nodes, no CSS animation buildup.
        const ctx=bonusCanvas.getContext('2d',{alpha:true});
        let canvasW=0,canvasH=0,dpr=1;
        const loadedSprites=new Map();
        for(const shape of SHAPES) {
            const img=new Image();
            img.src=shape.src;
            loadedSprites.set(shape.id,img);
        }

        function resizeBonusCanvas() {
            canvasW=window.innerWidth;
            canvasH=window.innerHeight;
            dpr=Math.min(window.devicePixelRatio||1,2);
            bonusCanvas.width=Math.round(canvasW*dpr);
            bonusCanvas.height=Math.round(canvasH*dpr);
            ctx.setTransform(dpr,0,0,dpr,0,0);
        }
        window.addEventListener('resize',()=>{if(bonusRunning)resizeBonusCanvas();});

        const SPAWN_INTERVAL=0.48;
        function spawnShape() {
            if(bonusItems.length>=14) return;
            const shape=SHAPES[Math.floor(Math.random()*SHAPES.length)];
            const size=Math.max(61,Math.min(83,canvasW*.062));
            const lanes=Math.max(5,Math.floor(canvasW/(size*1.4)));
            const lane=Math.floor(Math.random()*lanes);
            const x=(lane+.5)*canvasW/lanes + (Math.random()-.5)*8;
            bonusItems.push({
                shape, x:Math.max(size/2,Math.min(canvasW-size/2,x)),
                y: -size/2, size,
                vy:140+Math.random()*85,
                rot:(Math.random()-.5)*.3,
                spin:(Math.random()-.5)*1.2
            });
        }
        function spawnBurst(x,y,color) {
            for(let i=0;i<13;i++) {
                const angle=(i/13)*Math.PI*2;
                const speed=80+Math.random()*160;
                bonusParticles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-25,
                    ttl:.42,life:.42,r:3+Math.random()*5,color});
            }
        }
        const BURST_COLORS={circle:'#fa284b',square:'#1788ff',triangle:'#ffc928',star:'#a522f1',
            pentagon:'#22c55e',rectangle:'#ff8c12',oval:'#f82ea1',hexagon:'#01d6df'};
        function drawBonusFrame(dt) {
            ctx.clearRect(0,0,canvasW,canvasH);
            ctx.save();
            for(let i=bonusItems.length-1;i>=0;i--) {
                const item=bonusItems[i];
                item.y+=item.vy*dt;
                item.rot+=item.spin*dt;
                if(item.y>canvasH+item.size) {bonusItems.splice(i,1);continue;}
                const sprite=loadedSprites.get(item.shape.id);
                if(sprite && sprite.complete && sprite.naturalWidth) {
                    ctx.save();
                    ctx.translate(item.x,item.y);
                    ctx.rotate(item.rot);
                    // Preserve rectangle / oval aspect ratio.
                    const ratio=sprite.naturalWidth/sprite.naturalHeight;
                    let w=item.size,h=item.size;
                    if(ratio>1)h=w/ratio;else w=h*ratio;
                    ctx.drawImage(sprite,-w/2,-h/2,w,h);
                    ctx.restore();
                }
            }
            for(let i=bonusParticles.length-1;i>=0;i--) {
                const p=bonusParticles[i];
                p.ttl-=dt;
                if(p.ttl<=0) {bonusParticles.splice(i,1);continue;}
                p.x+=p.vx*dt;
                p.y+=p.vy*dt;
                p.vy+=360*dt;
                ctx.globalAlpha=Math.max(0,p.ttl/p.life);
                ctx.fillStyle=p.color;
                ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
            }
            ctx.restore();
        }
        function bonusLoop(ts) {
            if(!bonusRunning) return;
            if(bonusLastTick===null)bonusLastTick=ts;
            const dt=Math.min((ts-bonusLastTick)/1000,0.055);
            bonusLastTick=ts;
            bonusTimeRemaining-=dt;
            bonusSpawnCounter+=dt;
            if(bonusSpawnCounter>=SPAWN_INTERVAL) {
                bonusSpawnCounter-=SPAWN_INTERVAL;
                spawnShape();
            }
            drawBonusFrame(dt);
            bonusTimerEl.textContent=`⏱ ${Math.max(0,Math.ceil(bonusTimeRemaining))}s`;
            if(bonusTimeRemaining<=0) {finishBonusRound();return;}
            bonusRAF=requestAnimationFrame(bonusLoop);
        }

        bonusCanvas.addEventListener('pointerdown',(e)=>{
            if(!bonusRunning)return;
            e.preventDefault();
            const rect=bonusCanvas.getBoundingClientRect();
            const x=(e.clientX-rect.left)*canvasW/rect.width;
            const y=(e.clientY-rect.top)*canvasH/rect.height;
            for(let i=bonusItems.length-1;i>=0;i--) {
                const item=bonusItems[i];
                // Generous touch/click hitbox around the visible shape.
                if(Math.abs(x-item.x)<=item.size*.59 && Math.abs(y-item.y)<=item.size*.59) {
                    bonusItems.splice(i,1); // Remove immediately, before any effects.
                    bonusCaught++;
                    bonusRoundScore++;
                    bonusRoundScoreEl.textContent=`⭐ ${bonusRoundScore}`;
                    spawnBurst(item.x,item.y,BURST_COLORS[item.shape.id]||'#fbbf24');
                    playPop(560+Math.random()*190);
                    drawBonusFrame(0); // Clear the caught shape right on this input event.
                    break;
                }
            }
        },{passive:false});

        function startBonusRound(callback) {
            bonusRunning=true;
            bonusNextCallback=callback;
            bonusTimeRemaining=15;
            bonusLastTick=null;
            bonusSpawnCounter=0;
            bonusItems=[];
            bonusParticles=[];
            bonusRoundScore=0;
            bonusMessageEl.classList.add('hidden');
            bonusRoundScoreEl.textContent='⭐ 0';
            bonusTimerEl.textContent='⏱ 15s';
            bonusModal.classList.remove('hidden');
            resizeBonusCanvas();
            spawnShape();
            speak('Bonus time! Tap the falling shapes!');
            bonusRAF=requestAnimationFrame(bonusLoop);
        }
        function finishBonusRound() {
            if(!bonusRunning)return;
            bonusRunning=false;
            cancelAnimationFrame(bonusRAF);
            bonusLastTick=null;
            bonusTimerEl.textContent='⏱ 0s';
            bonusItems=[];
            bonusParticles=[];
            ctx.clearRect(0,0,canvasW,canvasH);
            bonusMessageEl.textContent=`You caught ${bonusRoundScore} shapes!`;
            bonusMessageEl.classList.remove('hidden');
            speak('Nice job!');
            setTimeout(()=>{
                bonusModal.classList.add('hidden');
                if(bonusNextCallback){const cb=bonusNextCallback;bonusNextCallback=null;cb();}
            },1100);
        }

        function showGameOver() {
            $('final-score').textContent=`Score: ${score} / ${questions.length}`;
            $('final-bonus').textContent=`Bonus Catches: ${bonusCaught}`;
            progressBarEl.style.width='100%';
            gameOverModal.classList.remove('hidden');
            createConfetti();
            speak('Super star! You finished all ten questions!');
        }
        function resetGame() {
            if(bonusRAF)cancelAnimationFrame(bonusRAF);
            bonusRunning=false;
            bonusItems=[];
            bonusParticles=[];
            questions=buildQuestionSet(10);
            currentQuestionIndex=0;
            score=0;
            bonusCaught=0;
            bonusModal.classList.add('hidden');
            gameOverModal.classList.add('hidden');
            fxContainer.innerHTML='';
            loadQuestion();
        }

        startBtn.onclick=()=>{
            startScreen.classList.add('hidden');
            resetGame();
        };
        nextButton.onclick=goNext;
        $('play-again-button').onclick=resetGame;
        $('replay-speech-button').onclick=()=>{
            if(bonusRunning)speak('Bonus time! Tap the falling shapes!');
            else if(!gameOverModal.classList.contains('hidden')) speak('Super star! You finished all ten questions!');
            else speak("What's next?");
        };

    </script>
</body>
</html>

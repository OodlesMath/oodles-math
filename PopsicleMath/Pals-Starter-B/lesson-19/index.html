/* Home */
#welcome{align-items:center;justify-content:center;padding:18px} .welcome-card{width:min(690px,95%);border-radius:36px;border:3px solid rgba(255,255,255,.83);background:rgba(255,255,255,.80);box-shadow:0 18px 55px rgba(26,110,148,.16),inset 0 1px 0 #fff;backdrop-filter:blur(11px);text-align:center;padding:clamp(20px,5vh,40px) 24px}.sparkle{font-size:clamp(21px,4vw,29px);color:#fc9606;letter-spacing:5px}.welcome-card h1{font-weight:900;font-size:clamp(35px,6.3vw,58px);line-height:1.13;color:#1670d1;margin:8px 0;text-shadow:0 3px 0 #fff}.welcome-card h1 span{color:#f28c1e}.welcome-card p{font-size:clamp(16px,2.5vw,21px);font-weight:700;color:#486585;margin:12px 0 20px}.welcome-fruits{display:flex;justify-content:center;align-items:end;gap:clamp(6px,2vw,20px);min-height:85px;margin:14px auto 26px}.welcome-fruits .fruit{--fruit-size:clamp(55px,10vw,90px);animation:none}.welcome-fruits .fruit:nth-child(2){animation-delay:.25s}.welcome-fruits .fruit:nth-child(3){animation-delay:.45s}.welcome-fruits .fruit:nth-child(4){animation-delay:.7s}.welcome-fruits .fruit:nth-child(5){animation-delay:.9s}.primary-button{border:3px solid #fff;border-radius:21px;color:white;background:linear-gradient(#6bdf47,#38bb2a);box-shadow:0 7px 0 #258b25,0 13px 15px rgba(44,125,35,.20);font-size:clamp(19px,2.6vw,25px);font-weight:900;padding:15px 32px;min-width:180px;cursor:pointer;transition:transform .15s,filter .15s}.primary-button:hover{filter:brightness(1.05);transform:translateY(-2px)}.primary-button:active{transform:translateY(5px);box-shadow:0 2px 0 #258b25}.primary-button:disabled{opacity:.52;cursor:default}.home-sub{margin-top:20px;font-size:13px;color:#517b96;font-weight:700}

<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<main id="welcome" class="screen active" aria-label="Welcome screen">
  <div class="welcome-card"><div class="sparkle">✦ ★ ✦</div><h1>FRUIT ADDITION<br><span>ADVENTURE!</span></h1><p>Let's add and have fun!</p><div class="welcome-fruits" aria-hidden="true"><span class="fruit apple"></span><span class="fruit banana"></span><span class="fruit orange"></span><span class="fruit grapes"></span><span class="fruit watermelon"></span></div><button class="primary-button" id="playBtn">▶ PLAY NOW</button><div class="home-sub">🍎 10 Fun Questions &nbsp;·&nbsp; ⭐ Number Bonds</div></div>
</main>
<main id="game" class="screen" aria-label="Math game">
  <div class="game-shell">
    <header class="topbar"><div class="brand"><span class="brand-emoji">🍎</span> FRUIT ADDITION</div><div class="top-meta"><div class="chip" id="questionChip">Question 1 / 10</div><div class="chip">⭐ <strong id="scoreChip">0</strong></div></div></header>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="lesson-caption" id="stepLabel">Step 1 · Look and count!</div>
    <section class="equation" aria-label="Addition problem"><div class="first-number" id="firstNumber">34<div class="number-bond" id="numberBond" aria-label="Number bond"><svg viewBox="0 0 140 90" preserveAspectRatio="none" aria-hidden="true"><path d="M70,1 L28,57 M70,1 L112,57" fill="none" stroke="#2876bf" stroke-width="3.3" stroke-linecap="round"/></svg><div class="bond-circle left" id="tensValue">30</div><div class="bond-circle right" id="onesValue">4</div></div></div><span class="op">+</span><span class="second-number" id="secondNumber">3</span><span class="equal">=</span><span class="unknown" id="answerSign">?</span><button class="speaker" id="speakBtn" title="Listen again" aria-label="Listen to the question">🔊</button></section>
    <section class="scene" aria-label="Fruit illustration"><div class="fruit-arrangement" id="fruitArrangement"></div></section>
    <div class="hint" id="hint">Count the fruits!</div>
    <section class="answers concealed" id="answers" aria-label="Choose an answer"></section>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <nav class="footer-nav"><button class="primary-button show" id="nextBtn">NEXT ➜</button></nav>
  </div>
</main>
<main id="results" class="screen" aria-label="Game results"><section class="result-card"><div class="result-trophy">🏆</div><h2>AMAZING JOB!</h2><div class="score-spot" id="finalScore">10 / 10</div><div class="result-message" id="resultMessage">You are a math star!</div><div class="results-buttons"><button class="primary-button" id="againBtn">↻ PLAY AGAIN</button><button class="secondary-button" id="homeBtn">⌂ HOME</button></div></section></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
(()=>{'use strict';
let QUESTIONS=[];
const QUESTIONS_PER_ROUND=10;
function generateQuestions(){
 const pool=[];
 for(let a=10;a<=39;a++){
  for(let b=1;b<=9;b++){
   if(a%10+b<10&&a+b<=40)pool.push({a,b});
  }
 }
 // Shuffle without replacement: ten different equations for every PLAY NOW / PLAY AGAIN.
 return shuffle(pool).slice(0,QUESTIONS_PER_ROUND);
}
const $=id=>document.getElementById(id);
let questionIndex=0,phase='intro',score=0,madeMistake=false,answered=false,selectedWrong=new Set();
let audioContext=null,voiceTimer=null,confettiFrame=null,confettiParticles=[];
const screens=['welcome','game','results'];
function showScreen(name){screens.forEach(s=>$(s).classList.toggle('active',s===name));}
function shuffle(list){let a=[...list];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function numberOfFruits(count,fruit){return Array.from({length:count},()=>`<span class="fruit ${fruit}" aria-hidden="true"></span>`).join('');}
function renderFruits(q){const tens=Math.floor(q.a/10),ones=q.a%10;
 const tensHtml=Array.from({length:tens},()=>`<div class="ten-group" aria-label="Ten apples">${numberOfFruits(10,'apple')}</div>`).join('');
 const onesHtml=numberOfFruits(ones,'apple');
 const bananaHtml=numberOfFruits(q.b,'banana');
 $('fruitArrangement').innerHTML=`<div class="ten-section"><div class="ten-label">${tens*10} APPLES</div><div class="groups-of-ten">${tensHtml}</div></div><div class="units-section"><div class="units-label">${ones} APPLES + ${q.b} BANANAS</div><div class="units-combined"><div class="small-group ${ones===0?'is-empty':''}">${onesHtml}</div><div class="mini-plus">+</div><div class="small-group">${bananaHtml}</div><div class="group-ring" id="groupRing" aria-hidden="true"></div></div></div>`;
 // Put the invisible zero-apples operator out of the oval: no extra fruit when the ones value is zero.
 if(ones===0){$('fruitArrangement').querySelector('.mini-plus').style.display='none';}
}
function choicesFor(correct){let values=new Set([correct]);for(let d of shuffle([-4,-3,-2,-1,1,2,3,4,5])){if(correct+d>=0)values.add(correct+d);if(values.size===4)break;}return shuffle([...values]);}
function renderQuestion(){const q=QUESTIONS[questionIndex];phase='intro';answered=false;madeMistake=false;selectedWrong.clear();
 $('firstNumber').firstChild.nodeValue=String(q.a);$('secondNumber').textContent=String(q.b);$('answerSign').textContent='?';
 $('tensValue').textContent=String(Math.floor(q.a/10)*10);$('onesValue').textContent=String(q.a%10);
 $('numberBond').classList.remove('reveal');$('questionChip').textContent=`Question ${questionIndex+1} / ${QUESTIONS.length}`;
 $('scoreChip').textContent=String(score);$('progressFill').style.width=`${100*questionIndex/QUESTIONS.length}%`;
 $('stepLabel').textContent='Step 1 · Look and count!';$('hint').textContent='Count the fruits!';$('feedback').textContent='';$('feedback').className='feedback';
 $('nextBtn').textContent='NEXT ➜';$('nextBtn').classList.add('show');$('answers').classList.add('concealed');
 $('answers').innerHTML=choicesFor(q.a+q.b).map(n=>`<button class="choice" data-value="${n}" aria-label="Answer ${n}">${n}</button>`).join('');
 renderFruits(q);clearTimeout(voiceTimer);voiceTimer=setTimeout(()=>speakQuestion(),280);
}
function reveal(){if(phase!=='intro')return;phase='choose';$('numberBond').classList.add('reveal');
 const ring=$('groupRing');if(ring){ring.classList.add('reveal');}
 $('stepLabel').textContent='Step 2 · Add the ones!';$('hint').textContent='How many altogether?';$('answers').classList.remove('concealed');
 $('nextBtn').classList.remove('show');sound('reveal');}
function selectAnswer(btn){if(phase!=='choose'||answered)return;const q=QUESTIONS[questionIndex],val=Number(btn.dataset.value),correct=q.a+q.b;if(val!==correct){madeMistake=true;selectedWrong.add(val);btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');$('feedback').className='feedback mistake';$('feedback').textContent='Try again! You can do it!';sound('wrong');return;}
 answered=true;phase='solved';if(!madeMistake)score++;$('scoreChip').textContent=String(score);btn.classList.add('correct');$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);$('answerSign').textContent=String(correct);
 $('feedback').className='feedback success';$('feedback').textContent=`Amazing! ${q.a} + ${q.b} = ${correct}!`;sound('correct');
 $('nextBtn').textContent=questionIndex===QUESTIONS.length-1?'SEE MY SCORE ★':'NEXT QUESTION ➜';$('nextBtn').classList.add('show');
}
function nextStep(){if(phase==='intro'){reveal();return;}if(phase==='solved'){questionIndex++;if(questionIndex>=QUESTIONS.length){endGame();}else{renderQuestion();}}}
function startGame(){stopConfetti();cancelVoice();QUESTIONS=generateQuestions();showScreen('game');questionIndex=0;score=0;initAudio();sound('click');renderQuestion();}
function endGame(){phase='done';cancelVoice();showScreen('results');$('progressFill').style.width='100%';$('finalScore').textContent=`${score} / ${QUESTIONS.length}`;
 $('resultMessage').textContent=score===QUESTIONS.length?'Perfect score! You are a fruit math champion!':score>=Math.ceil(QUESTIONS.length*.75)?'Wonderful work! You are a math star!':score>=Math.ceil(QUESTIONS.length*.5)?'Great effort! Keep practicing and have fun!':'Good try! Every little step makes you stronger!';sound('victory');launchConfetti();}
function home(){stopConfetti();cancelVoice();showScreen('welcome');}
function initAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){audioContext??=new AC();if(audioContext.state==='suspended')audioContext.resume();}}catch(e){}}
function tone(freq,when,duration=.12,type='sine',vol=.045){if(!audioContext)return;try{let osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type;osc.frequency.value=freq;const t=audioContext.currentTime+when;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(vol,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain).connect(audioContext.destination);osc.start(t);osc.stop(t+duration+.04);}catch(e){}}
function sound(kind){initAudio();switch(kind){case'click':tone(540,0,.09);break;case'reveal':tone(470,0,.09,'triangle');tone(740,.09,.15,'sine');break;case'wrong':tone(340,0,.16,'sine',.03);tone(280,.15,.16,'sine',.025);break;case'correct':[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.2,'triangle',.05));break;case'victory':[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.15,.34,'triangle',.06));break;}}
function cancelVoice(){clearTimeout(voiceTimer);if('speechSynthesis'in window){try{speechSynthesis.cancel();}catch(e){}}$('speakBtn').classList.remove('speaking');}
function speakQuestion(){if(!('speechSynthesis'in window)||!$('game').classList.contains('active'))return;const q=QUESTIONS[questionIndex];try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(answered?`${q.a} plus ${q.b} equals ${q.a+q.b}.`:`What is ${q.a} plus ${q.b}?`);u.lang='en-US';u.rate=.87;u.pitch=1.08;u.volume=1;const voices=speechSynthesis.getVoices();let matches=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));u.voice=matches.find(v=>/samantha|jenny|aria|ava|zira|female/i.test(v.name))||matches.find(v=>/en-us/i.test(v.lang))||matches[0]||null;u.onstart=()=>$('speakBtn').classList.add('speaking');u.onend=u.onerror=()=>$('speakBtn').classList.remove('speaking');speechSynthesis.speak(u);}catch(e){}}
const canvas=$('confetti'),ctx=canvas.getContext('2d');let W=0,H=0,confettiUntil=0;
function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
function launchConfetti(){resizeCanvas();const colors=['#ff477e','#1cb4ee','#ffe14a','#65d550','#9c62eb','#ff8f29','#fff'];confettiParticles=[];for(let i=0;i<205;i++){const fromLeft=i%3===0,fromRight=i%3===1;confettiParticles.push({x:fromLeft?-15:fromRight?W+15:Math.random()*W,y:fromLeft||fromRight?H*(.3+Math.random()*.45):-20-Math.random()*H*.3,vx:fromLeft?3+Math.random()*6:fromRight?-3-Math.random()*6:(Math.random()-.5)*3,vy:fromLeft||fromRight?-6-Math.random()*5:1+Math.random()*3,rotation:Math.random()*7,rv:(Math.random()-.5)*.22,w:4+Math.random()*7,h:5+Math.random()*8,color:colors[i%colors.length],life:0});}confettiUntil=performance.now()+6800;cancelAnimationFrame(confettiFrame);confettiFrame=requestAnimationFrame(drawConfetti);}
function drawConfetti(now){ctx.clearRect(0,0,W,H);let count=0;for(const p of confettiParticles){p.life++;p.vy+=.095;p.vx*=.996;p.x+=p.vx;p.y+=p.vy;p.rotation+=p.rv;if(p.y>H+30||p.x< -70||p.x>W+70)continue;count++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}if(now<confettiUntil&&count>0)confettiFrame=requestAnimationFrame(drawConfetti);else stopConfetti();}
function stopConfetti(){cancelAnimationFrame(confettiFrame);confettiParticles=[];ctx.clearRect(0,0,W,H);}
$('playBtn').addEventListener('click',startGame);$('againBtn').addEventListener('click',startGame);$('homeBtn').addEventListener('click',home);
$('nextBtn').addEventListener('click',()=>{sound('click');nextStep()});$('speakBtn').addEventListener('click',()=>{initAudio();speakQuestion()});
$('answers').addEventListener('click',e=>{const btn=e.target.closest('.choice');if(btn)selectAnswer(btn)});
window.addEventListener('resize',()=>{resizeCanvas()},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelVoice()});
window.addEventListener('keydown',e=>{if(!e.repeat&&e.key==='Enter'&&$('game').classList.contains('active')&&phase!=='choose'&&document.activeElement===document.body){e.preventDefault();nextStep();}});
resizeCanvas();
})();
</script>
</body></html>

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Poppins','Trebuchet MS',sans-serif;user-select:none}
    body{background:radial-gradient(circle at 50% 45%,#fff4db,#e5b98d)}
    button{font:inherit;touch-action:manipulation;cursor:pointer}
    button:focus-visible{outline:4px solid #47dcef;outline-offset:5px}
    #scene{position:absolute;left:50%;top:50%;width:1672px;height:941px;transform:translate(-50%,-50%) scale(1);transform-origin:center;overflow:hidden;background:var(--photo) center/100% 100% no-repeat}
    #hud{position:absolute;top:47px;right:130px;display:flex;align-items:center;gap:12px;z-index:2}
    .hud-chip{background:rgba(255,251,234,.93);border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 9px #704b2730;border-radius:50px;padding:9px 18px;color:#92521a;font-weight:800;font-size:18px;white-space:nowrap}
    #scoreChip{color:#1f896b}
    #controls{position:absolute;top:46px;right:26px;display:flex;gap:12px;z-index:3}
    .round-icon{width:45px;height:45px;display:grid;place-items:center;background:rgba(255,251,234,.92);border:2px solid #fff;color:#995726;border-radius:50%;box-shadow:0 4px 9px #70502738;transition:transform .15s,background .15s}
    .round-icon:hover{transform:translateY(-2px);background:#fff}
    .round-icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    #board{position:absolute;left:565px;top:115px;width:473px;height:248px;z-index:1;color:#fff;overflow:visible}
    #equation{position:absolute;top:2px;left:0;width:100%;height:65px;display:flex;align-items:center;justify-content:center;gap:11px;font-size:52px;font-weight:900;letter-spacing:0.3px;white-space:nowrap;text-shadow:0 3px 3px #00231c77}
    .num-a{color:#ffdc78}.num-b{color:#8be9f4}.sym{color:#fffef1}.answer-mark{color:#fff1ae}
    .pop{animation:pop .42s cubic-bezier(.16,1.7,.45,1) both}
    @keyframes pop{from{opacity:.2;transform:translateY(11px) scale(.75)}to{opacity:1;transform:translateY(0) scale(1)}}
    #mathArea{position:absolute;top:85px;left:4px;width:465px;height:147px;display:flex;align-items:center;justify-content:center;gap:13px}
    #rods{display:flex;align-items:flex-end;justify-content:center;gap:5px;min-width:52px;min-height:122px;flex-shrink:0;transition:all .25s}
    .rod{width:23px;height:121px;flex:none;border:2px solid #ab6c12;border-radius:6px;display:flex;flex-direction:column;overflow:hidden;background:#ffd060;box-shadow:inset -4px 0 2px #d99120,0 3px 6px #001e1870;position:relative;transform-origin:center bottom}
    .rod:before{content:"";position:absolute;inset:1px auto 1px 2px;width:4px;border-radius:3px;background:#fff2b37a;z-index:2;pointer-events:none}
    .rod-unit{flex:1;border-bottom:1px solid #bc871f;box-shadow:inset 0 2px 0 #ffec9b}

    const tempo=ms=>Math.max(1,Math.round(ms*speedFactor));
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    const question=()=>questions[index];
    function resize(){if(matchMedia('(orientation: portrait)').matches){scene.style.transform='none';return} const s=Math.min(innerWidth/1672,innerHeight/941);scene.style.transform=`translate(-50%,-50%) scale(${s})`}
    addEventListener('resize',resize);resize();
    function sfx(kind){if(!soundOn)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const notes=kind==='win'?[523,659,784,1046]:kind==='wrong'?[220,190]:kind==='make'?[550,730,980]:kind==='move'?[460]:[630];notes.forEach((f,i)=>{const t=audioCtx.currentTime+i*.12,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=kind==='wrong'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.18)})}catch(e){}}
    function speak(text){if(!soundOn||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;u.pitch=1.1;u.volume=1;const voices=speechSynthesis.getVoices();const en=voices.find(v=>v.lang==='en-US'&&/female|samantha|zira|jenny|aria|ava|google us/i.test(v.name))||voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(en)u.voice=en;speechSynthesis.speak(u)}catch(e){}}
    function rodNode(blue=false){const r=document.createElement('div');r.className='rod'+(blue?' blue':'');for(let i=0;i<10;i++){const part=document.createElement('i');part.className='rod-unit';r.append(part)}return r}
    function cubeNode(blue=false){const c=document.createElement('i');c.className='cube'+(blue?' blue':'');return c}
    function createFrame(n=0,baseColor='amber'){const f=document.createElement('div');f.className='tenframe';for(let i=0;i<10;i++){const cell=document.createElement('div');cell.className='frame-cell';cell.dataset.slot=i;if(i<n)cell.append(cubeNode(baseColor==='blue'));f.append(cell)}return f}
    const setMsg=(text,cls='')=>{message.textContent=text;message.className=cls};
    function makeQuestions(){const pool=new Map([...PERFECT,...STANDARD].map(([a,b])=>[`${a}+${b}`,{a,b,sum:a+b}]));return shuffle([...pool.values()]).slice(0,10)}
    function populateChoices(sum){const wrongs=shuffle([sum-2,sum-1,sum+1,sum+2,sum-10,sum+10].filter(x=>x>=0&&x<=40&&x!==sum));const options=shuffle([sum,...wrongs.slice(0,2)]);optionEls.forEach((b,i)=>{b.textContent=options[i];b.dataset.value=options[i];b.disabled=false;b.className='choice';b.setAttribute('aria-pressed','false')});}
    function updateHUD(){$('questionChip').textContent=`Question ${index+1} / ${questions.length}`;$('scoreChip').textContent=`★ ${score}`}
    function showEquation(showAll=false,revealResult=false){const {a,b,sum}=question();equation.replaceChildren();const num=document.createElement('span');num.textContent=a;num.className='num-a';equation.append(num);if(showAll){[['+','sym'],[b,'num-b'],['=','sym'],[revealResult?sum:'?',revealResult?'answer-mark':'sym']].forEach(([t,c])=>{const part=document.createElement('span');part.textContent=t;part.className=c+' pop';equation.append(part)});const replay=document.createElement('button');replay.type='button';replay.className='eq-replay pop';replay.title='Listen again';replay.setAttribute('aria-label','Listen to the equation again');replay.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z M15 9a5 5 0 0 1 0 6 M18 6a9 9 0 0 1 0 12"/></svg>';replay.addEventListener('click',()=>speak(revealResult?`${a} plus ${b} equals ${sum}.`:`What is ${a} plus ${b}?`));equation.append(replay)}}
    function clearFlights(){$('flightLayer').replaceChildren()}
    function load(){epoch++;locked=false;phase='initial';chosen=null;clearFlights();incoming.classList.remove('show');incomingRods.replaceChildren();incomingCubes.replaceChildren();rods.replaceChildren();frameHost.replaceChildren();row.classList.remove('visible');hint.textContent='';$('makeTag').classList.remove('flash');setMsg('Press NEXT to add more.');next.disabled=false;next.textContent='NEXT →';optionEls.forEach(b=>{b.className='choice';b.disabled=false;b.textContent=''});updateHUD();showEquation(false);const {a,sum}=question();for(let j=0;j<Math.floor(a/10);j++)rods.append(rodNode());frameHost.append(createFrame(a%10));populateChoices(sum)}
    function flight(from,to,type='cube',duration=360){return new Promise(resolve=>{if(!from||!to){resolve();return}const r1=from.getBoundingClientRect(),r2=to.getBoundingClientRect();if(!r1.width||!r2.width){resolve();return}const clone=from.cloneNode(true);clone.classList.add('flying');clone.style.width=r1.width+'px';clone.style.height=r1.height+'px';clone.style.left=r1.left+'px';clone.style.top=r1.top+'px';$('flightLayer').append(clone);const dx=(r2.left+r2.width/2)-(r1.left+r1.width/2),dy=(r2.top+r2.height/2)-(r1.top+r1.height/2),scale=Math.min(r2.width/r1.width,r2.height/r1.height);const anim=clone.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(${scale})`,opacity:1}],{duration:tempo(duration),easing:'cubic-bezier(.25,.75,.33,1)',fill:'forwards'});anim.onfinish=()=>{clone.remove();resolve()};anim.oncancel=()=>{clone.remove();resolve()}})}
    async function flyRod(source,token){const placeholder=rodNode();placeholder.style.opacity='0';rods.append(placeholder);await flight(source,placeholder,'rod',480);if(token!==epoch)return false;placeholder.style.opacity='1';source.remove();sfx('move');return true}
    async function flyCube(source,target,token){await flight(source,target,'cube',340);if(token!==epoch)return false;target.replaceChildren(cubeNode(true));source.remove();sfx('move');return true}
    // Ver4: Show the second addend and all its base-ten blocks first. They remain still until NEXT is clicked again.
    function showSecondAddend(){
      if(phase!=='initial'||locked)return;
      const {a,b}=question();
      showEquation(true);
      incomingRods.replaceChildren();incomingCubes.replaceChildren();
      for(let j=0;j<Math.floor(b/10);j++)incomingRods.append(rodNode(true));
      for(let j=0;j<b%10;j++)incomingCubes.append(cubeNode(true));
      incoming.classList.add('show');
      phase='ready';
      next.textContent='NEXT →';
      setMsg('Press NEXT to make 10.');
      speak(`What is ${a} plus ${b}?`);
    }
    async function animationSequence(){
      if(phase!=='ready'||locked)return;
      const token=epoch;locked=true;phase='animating';next.disabled=true;next.textContent='ADDING...';
      const {a,b}=question();
      const bTens=Math.floor(b/10),bOnes=b%10;
      // The blocks were already revealed in the previous step; move them only now.
      for(let j=0;j<bTens;j++){const first=incomingRods.firstElementChild;if(!first)break;await flyRod(first,token);if(token!==epoch)return;await sleep(tempo(70))}
      const need=10-a%10;const original=frameHost.querySelector('.tenframe');const emptyCells=[...original.querySelectorAll('.frame-cell')].filter(cell=>!cell.firstElementChild);
      for(let j=0;j<need;j++){const source=incomingCubes.firstElementChild;if(!source)break;await flyCube(source,emptyCells[j],token);if(token!==epoch)return;await sleep(tempo(75))}
      // Exactly ten single cubes are now grouped and exchanged for one tens rod.
      $('makeTag').classList.remove('flash');void $('makeTag').offsetWidth;$('makeTag').classList.add('flash');sfx('make');
      await sleep(tempo(240));if(token!==epoch)return;
      await original.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.5) rotate(-10deg)',opacity:0}],{duration:tempo(420),easing:'ease-in',fill:'forwards'}).finished.catch(()=>{});if(token!==epoch)return;
      frameHost.replaceChildren();const exchanged=rodNode();exchanged.classList.add('pop');rods.append(exchanged);
      const remaining=bOnes-need;
      if(remaining>0){const newFrame=createFrame(0);frameHost.append(newFrame);const slots=[...newFrame.querySelectorAll('.frame-cell')];await sleep(tempo(160));for(let j=0;j<remaining;j++){const source=incomingCubes.firstElementChild;if(!source)break;await flyCube(source,slots[j],token);if(token!==epoch)return;await sleep(tempo(75))}}
      incoming.classList.remove('show');incomingRods.replaceChildren();incomingCubes.replaceChildren();
      // Canonical base-ten representation: floor(sum/10) rods and sum%10 ones.
      const sum=a+b,expectedRods=Math.floor(sum/10),expectedOnes=sum%10;
      if(rods.childElementCount!==expectedRods || (frameHost.querySelectorAll('.cube').length!==expectedOnes)){
        rods.replaceChildren();for(let j=0;j<expectedRods;j++)rods.append(rodNode());frameHost.replaceChildren();if(expectedOnes)frameHost.append(createFrame(expectedOnes,'blue'));
      }
      await sleep(tempo(300));if(token!==epoch)return;
      hint.textContent=`${expectedRods} tens and ${expectedOnes} ones`;
      row.classList.add('visible');setMsg('Choose the correct answer.');next.textContent='CHECK ✓';next.disabled=true;phase='choose';locked=false;
    }
    function selectOption(btn){if(locked||phase!=='choose')return;sfx('tap');chosen=Number(btn.dataset.value);optionEls.forEach(b=>{b.classList.toggle('selected',b===btn);b.setAttribute('aria-pressed',String(b===btn))});next.disabled=false;setMsg('Press CHECK to see the answer.')}
    function check(){if(chosen===null)return;locked=true;phase='checked';const {a,b,sum}=question();const correct=chosen===sum;if(correct){score+=10;sfx('win');setMsg('Great job! You made a ten!','success')}else{sfx('wrong');setMsg(`Nice try! The answer is ${sum}.`,'error')}showEquation(true,true);speak(`${a} plus ${b} equals ${sum}.`);updateHUD();optionEls.forEach(b=>{const right=Number(b.dataset.value)===sum;b.classList.remove('selected');if(right)b.classList.add('correct');else if(Number(b.dataset.value)===chosen)b.classList.add('wrong');b.disabled=true;if(right){const mark=document.createElement('span');mark.className='mark';mark.textContent='✓';b.append(mark)}});next.disabled=false;next.textContent=index===questions.length-1?'FINISH ★':'NEXT →';locked=false}
    function launchConfetti(){const canvas=$('confetti'),ctx=canvas.getContext('2d');const dpr=Math.min(2,devicePixelRatio||1);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.scale(dpr,dpr);const bits=Array.from({length:110},()=>({x:Math.random()*innerWidth,y:-Math.random()*innerHeight*.6,v:1.2+Math.random()*2.8,s:3+Math.random()*5,c:['#f2b43d','#33c8ad','#56aee5','#f3789c'][Math.floor(Math.random()*4)],r:Math.random()*6}));let frame=0;function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);bits.forEach(p=>{p.y+=p.v;p.x+=Math.sin(frame*.04+p.r)*.5;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s*.7)});frame++;if(frame<190)requestAnimationFrame(draw);else ctx.clearRect(0,0,innerWidth,innerHeight)}draw()}
    function finish(){phase='finish';$('finish').classList.add('show');$('finishScore').textContent=`Score: ${score} / ${questions.length*10}`;$('finishSub').textContent=score===100?'Perfect! You are a Make-10 star!':'You practiced making tens and ones!';sfx('win');launchConfetti()}
    function restart(){epoch++;try{speechSynthesis.cancel()}catch(e){}questions=[];index=0;score=0;chosen=null;locked=false;phase='setup';clearFlights();rods.replaceChildren();frameHost.replaceChildren();incoming.classList.remove('show');row.classList.remove('visible');equation.replaceChildren();$('board').classList.add('setup-mode');$('setup').classList.add('show');$('finish').classList.remove('show');next.classList.add('setup-hidden');$('questionChip').textContent='Question 0 / 10';$('scoreChip').textContent='★ 0';setMsg('')}
    function selectSpeed(value){if(!(value in SPEEDS))return;speed=value;speedFactor=SPEEDS[value];document.querySelectorAll('.speed-btn').forEach(btn=>{const active=btn.dataset.speed===value;btn.classList.toggle('selected',active);btn.setAttribute('aria-pressed',String(active))})}
    function startGame(){if(phase!=='setup')return;questions=makeQuestions();index=0;score=0;$('setup').classList.remove('show');$('board').classList.remove('setup-mode');next.classList.remove('setup-hidden');load();sfx('tap')}
    document.querySelectorAll('.speed-btn').forEach(btn=>btn.addEventListener('click',()=>{selectSpeed(btn.dataset.speed);sfx('tap')}));
    $('start').addEventListener('click',startGame);
    selectSpeed('normal');
    next.addEventListener('click',()=>{if(locked)return;if(phase==='initial'){sfx('tap');showSecondAddend()}else if(phase==='ready'){sfx('tap');animationSequence().catch(e=>{console.error(e);locked=false;phase='ready';next.disabled=false;next.textContent='NEXT →'})}else if(phase==='choose'){check()}else if(phase==='checked'){if(index===questions.length-1)finish();else{index++;load()}}});
    optionEls.forEach(b=>b.addEventListener('click',()=>selectOption(b)));
    $('restart').addEventListener('click',()=>{sfx('tap');restart()});$('again').addEventListener('click',()=>{sfx('tap');restart()});
    $('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').title=soundOn?'Sound on':'Sound off';$('sound').setAttribute('aria-label',soundOn?'Turn sound off':'Turn sound on');$('speakerPath').setAttribute('d',soundOn?'M11 5 6 9H3v6h3l5 4z M15 9a5 5 0 0 1 0 6 M18 6a9 9 0 0 1 0 12':'M11 5 6 9H3v6h3l5 4z M16 9l5 6 M21 9l-5 6');if(!soundOn){try{speechSynthesis.cancel()}catch(e){}}else if(phase==='choose'||phase==='checked'){const {a,b,sum}=question();speak(phase==='checked'?`${a} plus ${b} equals ${sum}.`:`What is ${a} plus ${b}?`)}});
    // Expose simple readonly hooks for classroom QA / automated math checks.
    window.__gameTest={state:()=>({index,score,phase,chosen,speed,speedFactor,question:question(),rods:rods.children.length,ones:frameHost.querySelectorAll('.cube').length}),getQuestions:()=>questions.map(q=>({...q})),setSpeed:selectSpeed};
    restart();
  })();
  </script>

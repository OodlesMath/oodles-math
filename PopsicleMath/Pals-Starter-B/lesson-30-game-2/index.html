      background-size:cover;background-position:center;z-index:0;
    }
    #bg::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.08) 60%,rgba(18,100,56,.10));
      pointer-events:none;
    }
    #app{position:relative;z-index:2;width:100%;height:100%}
    .hidden{display:none!important}

    /* HUD */
    #hud{
      position:absolute;left:18px;right:160px;top:14px;height:54px;z-index:40;
      display:flex;align-items:center;gap:12px;pointer-events:none;
    }
    .hud-pill{
      pointer-events:auto;background:rgba(255,255,255,.92);border:3px solid rgba(255,255,255,.95);
      box-shadow:0 5px 0 rgba(35,94,126,.15),0 8px 20px rgba(0,0,0,.08);
      border-radius:18px;padding:8px 14px;font-weight:900;display:flex;align-items:center;gap:8px;
      min-height:46px;backdrop-filter:blur(5px);
    }
    #progressPill{min-width:116px}
    #progressText{font-size:15px}
    #starsPill{color:#b77900}
    #soundBtn{border:0;color:#13516e;cursor:pointer;min-width:48px;justify-content:center}
    #progressTrack{
      flex:1;max-width:260px;height:16px;background:rgba(255,255,255,.85);border:3px solid white;
      border-radius:999px;overflow:hidden;box-shadow:0 3px 0 rgba(35,94,126,.15)
    }
    #progressBar{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#9bea47);transition:width .35s ease;border-radius:999px}

    .global-logo{
      position:absolute;top:14px;right:18px;z-index:50;width:122px;height:54px;
      display:flex;align-items:center;justify-content:flex-end;pointer-events:none;
    }
    .global-logo img{max-width:118px;max-height:50px;object-fit:contain;filter:drop-shadow(0 4px 5px rgba(0,0,0,.10))}

    /* Screens */
    .screen{position:absolute;inset:0}
    #startScreen,#finishScreen{
      z-index:80;display:grid;place-items:center;padding:24px;background:rgba(98,183,232,.13);backdrop-filter:blur(2px);
    }
    .hero-card{
      width:min(720px,92vw);background:rgba(255,255,255,.95);border:5px solid white;border-radius:34px;
      box-shadow:0 18px 0 rgba(27,108,151,.13),0 26px 50px rgba(21,61,95,.22);
      padding:24px 30px 28px;text-align:center;
    }
    .hero-badge{font-size:14px;font-weight:900;color:#0b7ab2;letter-spacing:.12em;text-transform:uppercase}
    .hero-card h1{margin:4px 0 2px;font-size:clamp(32px,5vw,54px);line-height:1;color:#7138d0;font-weight:900}
    .hero-card p{margin:8px auto 16px;font-size:clamp(14px,2vw,18px);font-weight:700;color:#5d7181}
    .preview-row{display:flex;justify-content:center;align-items:flex-end;gap:32px;margin:10px 0 20px}
    .preview-box{
      width:190px;min-height:190px;border-radius:28px;padding:14px 12px 12px;border:4px solid #e8eef3;
      background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    }
    .preview-box.odd{background:var(--odd-soft);border-color:#d8b4fe}
    .preview-box.even{background:var(--even-soft);border-color:#7dd3fc}
    .preview-box img{max-height:118px;max-width:112px;object-fit:contain}
    .preview-box b{font-size:21px;margin-top:8px}
    .preview-box.odd b{color:var(--odd-dark)} .preview-box.even b{color:var(--even-dark)}
    .preview-box span{font-size:12px;font-weight:800;color:#627386}
    .big-btn{
      border:0;border-radius:22px;padding:16px 34px;min-width:230px;font-size:23px;font-weight:900;color:white;
      background:var(--green);box-shadow:0 8px 0 var(--green-dark);cursor:pointer;transition:.1s transform,.1s box-shadow;
    }
    .big-btn:active{transform:translateY(7px);box-shadow:0 1px 0 var(--green-dark)}

    /* Game */
    #gameScreen{
      z-index:10;padding:76px 22px 18px;display:grid;
      grid-template-columns:minmax(260px,420px) minmax(390px,620px);
      grid-template-rows:1fr;gap:24px;align-items:center;justify-content:center;
    }
    #playfield{
      position:relative;width:min(100%,420px,calc((100vh - 108px) / 2));height:auto;aspect-ratio:1 / 2;
      margin:0 0 0 auto;
      background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.40));
      border:4px solid rgba(255,255,255,.82);border-radius:30px;box-shadow:var(--shadow);
      overflow:hidden;backdrop-filter:blur(2px);
    }
    #playfield::before{
      content:"";position:absolute;left:50%;top:56px;bottom:22px;width:0;border-left:3px dashed rgba(255,255,255,.46);
    }
    .zone{
      position:absolute;top:14px;padding:7px 18px;border-radius:999px;font-size:15px;font-weight:900;letter-spacing:.08em;
      background:rgba(255,255,255,.88);box-shadow:0 4px 0 rgba(0,0,0,.07);z-index:5
    }
    .zone.odd{left:18px;color:var(--odd-dark);border:3px solid #d8b4fe}
    .zone.even{right:18px;color:var(--even-dark);border:3px solid #7dd3fc}
    #floor{
      position:absolute;left:5%;right:5%;bottom:22px;height:10px;border-radius:999px;
      background:rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(29,106,60,.25),0 0 18px rgba(255,255,255,.75)
    }
    .tower{
      position:absolute;z-index:12;object-fit:contain;transform-origin:center bottom;will-change:left,top,transform,filter,opacity;
      filter:drop-shadow(0 8px 7px rgba(11,58,87,.22));transition:filter .2s ease,transform .2s ease,opacity .2s ease;
    }
    .tower.subtractor{animation:warningPulse .58s ease-in-out infinite alternate}
    @keyframes warningPulse{
      from{filter:drop-shadow(0 0 4px rgba(255,255,255,.6)) drop-shadow(0 8px 7px rgba(11,58,87,.2));opacity:.82}
      to{filter:drop-shadow(0 0 18px rgba(255,220,70,.95)) drop-shadow(0 8px 7px rgba(11,58,87,.2));opacity:1}
    }
    .result-pop{animation:resultPop .45s cubic-bezier(.2,1.35,.4,1)}
    @keyframes resultPop{0%{transform:scale(.72);opacity:.2}70%{transform:scale(1.10)}100%{transform:scale(1);opacity:1}}
    .odd-glow{animation:oddGlow .75s ease-in-out 2}
    .even-glow{animation:evenGlow .75s ease-in-out 2}
    @keyframes oddGlow{50%{filter:drop-shadow(0 0 20px #c084fc) drop-shadow(0 8px 7px rgba(11,58,87,.2))}}
    @keyframes evenGlow{50%{filter:drop-shadow(0 0 20px #38bdf8) drop-shadow(0 8px 7px rgba(11,58,87,.2))}}

    #pairNote{
      position:absolute;left:50%;top:68px;transform:translateX(-50%) scale(.9);opacity:0;z-index:24;
      padding:9px 18px;border-radius:18px;background:rgba(255,255,255,.94);font-size:16px;font-weight:900;
      box-shadow:0 6px 18px rgba(16,73,110,.18);transition:.25s ease;white-space:nowrap;
    }
    #pairNote.show{opacity:1;transform:translateX(-50%) scale(1)}
    #unpairedRing{
      display:none;position:absolute;z-index:25;border:5px solid #f0abfc;border-radius:16px;
      box-shadow:0 0 0 5px rgba(255,255,255,.72),0 0 22px #e879f9;pointer-events:none;
      animation:ringPulse .7s ease-in-out infinite alternate;
    }
    @keyframes ringPulse{from{transform:scale(.90)}to{transform:scale(1.08)}}

    #instruction{display:none!important}

    #touchControls{display:none!important}
    #touchControls.active{display:none!important}

    #impactFlash{
      position:absolute;width:34px;height:34px;border-radius:50%;z-index:44;pointer-events:none;opacity:0;
      background:radial-gradient(circle,#fff 0 18%,#fde047 22% 42%,rgba(56,189,248,.72) 46% 62%,transparent 70%);
      transform:translate(-50%,-50%) scale(.2);
    }
    #impactFlash.show{animation:impactFlash .55s ease-out forwards}
    @keyframes impactFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}28%{opacity:1;transform:translate(-50%,-50%) scale(3.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(6.2)}}
    #playfield.impact{animation:fieldImpact .38s ease-out}
    @keyframes fieldImpact{0%,100%{filter:none}35%{filter:brightness(1.18) saturate(1.18)}}
    .tower.falling-glow{filter:drop-shadow(0 0 13px rgba(255,255,255,.75)) drop-shadow(0 8px 7px rgba(11,58,87,.22))}
    .move-btn{
      width:78px;height:58px;border:3px solid white;border-radius:20px;background:rgba(255,255,255,.93);
      color:#17688d;font-size:32px;font-weight:900;box-shadow:0 7px 0 rgba(34,104,138,.25);cursor:pointer;
    }
    .move-btn:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(34,104,138,.25)}

    /* right math dock */
    #mathDock{
      width:min(620px,100%);height:auto;margin:0 auto 0 0;display:flex;flex-direction:column;gap:18px;align-self:center;
    }
    #equationCard,#answerCard{
      background:rgba(255,255,255,.95);border:4px solid white;border-radius:28px;box-shadow:var(--shadow);
      min-width:0;backdrop-filter:blur(5px);
    }
    #equationCard{
      min-height:158px;font-size:clamp(34px,4.3vw,58px);font-weight:900;color:#243b53;padding:18px 22px;
      display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;text-align:center;
    }
    #equationText{min-width:0}
    #equationCard .answer-pop{display:inline-block;color:#f59e0b;animation:answerPop .45s cubic-bezier(.2,1.5,.4,1)}
    @keyframes answerPop{0%{transform:scale(.2) rotate(-10deg);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
    #answerCard{min-height:252px;display:flex;flex-direction:column;padding:18px 20px;gap:14px;justify-content:center}
    .question-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%}
    #parityQuestion{font-size:clamp(22px,2.4vw,30px);font-weight:900;text-align:center;color:#324b62;line-height:1.28}
    .speak-mini{
      width:58px;height:58px;flex:0 0 58px;border:3px solid #fff;border-radius:18px;background:linear-gradient(180deg,#7dd3fc,#38bdf8);
      color:#075985;font-size:27px;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 0 #0284c7;transition:.1s;
    }
    .speak-mini:hover{filter:brightness(1.06)}
    .speak-mini:active{transform:translateY(5px);box-shadow:0 1px 0 #0284c7}
    .speak-mini.speaking{animation:speakerPulse .55s ease-in-out infinite alternate}
    @keyframes speakerPulse{to{transform:scale(1.08);filter:brightness(1.14) drop-shadow(0 0 10px rgba(56,189,248,.75))}}
    #answerButtons{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
    .answer-btn{
      min-height:78px;border:4px solid white;border-radius:22px;font-size:24px;font-weight:900;color:white;
      cursor:pointer;transition:.12s transform,.12s box-shadow,.12s filter;
    }
    .answer-btn.odd{background:linear-gradient(180deg,#c267f5,#a855f7);box-shadow:0 8px 0 var(--odd-dark)}
    .answer-btn.even{background:linear-gradient(180deg,#38bdf8,#0ea5e9);box-shadow:0 8px 0 var(--even-dark)}
    .answer-btn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
    .answer-btn.correct{animation:correctBounce .45s ease;filter:brightness(1.13)}
    .answer-btn.wrong{animation:shake .38s ease}
    @keyframes correctBounce{50%{transform:translateY(-8px) scale(1.05)}}
    @keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
    #feedback{min-height:20px;font-size:14px;font-weight:900;text-align:center;color:#3f6b30}

    /* particles */
    .particle{position:absolute;width:13px;height:13px;border-radius:4px;z-index:45;pointer-events:none;animation:particleFly .7s ease-out forwards}

    .star-particle{position:fixed;z-index:200;pointer-events:none;font-size:20px;animation:confettiFall .95s ease-out forwards}

  function speakText(text,button){

    u.lang="en-US";u.rate=.82;u.pitch=1.08;u.volume=1;

    if(!current || els.answerButtons.classList.contains("hidden")) return "Build the tower first.";

  function ensureAudio(){
    if(!audioOn) return null;
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function tone(freq=440, duration=.12, type="sine", vol=.04, delay=0){
    const ctx = ensureAudio(); if(!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(ctx.destination);
    const t=ctx.currentTime+delay;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.start(t); o.stop(t+duration+.02);
  }
  const sfx = {
    land(){tone(180,.09,"triangle",.035);tone(260,.07,"triangle",.025,.05)},
    move(){tone(260,.045,"sine",.018)},
    fall(){tone(520,.05,"sine",.018);tone(420,.07,"sine",.014,.07)},

    pop(){tone(170,.07,"square",.03);tone(110,.13,"triangle",.038,.06);tone(620,.09,"sine",.022,.15)},
    correct(){tone(523,.1,"sine",.035);tone(659,.1,"sine",.035,.1);tone(784,.16,"sine",.04,.2)},

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function buildPool(op, pa, pb){
    const pool=[];
    for(let a=1;a<=10;a++){
      if(parity(a)!==pa) continue;
      for(let b=1;b<=10;b++){
        if(parity(b)!==pb) continue;
        const r=op==="+"?a+b:a-b;
        if(op==="+" && r<=10 && r>=1) pool.push({a,b,op,result:r});
        if(op==="-" && a>b && r>=1 && r<=10) pool.push({a,b,op,result:r});
      }
    }
    return pool;
  }

  function generateRound(){
    const cats=[
      ["+","odd","odd"],["+","even","even"],["+","odd","even"],["+","even","odd"],
      ["-","odd","odd"],["-","even","even"],["-","odd","even"],["-","even","odd"]
    ];
    const round=[];
    const used=new Set();

    for(const [op,pa,pb] of cats){
      let choice;
      if(op==="+" && pa==="odd" && pb==="even"){
        choice={a:7,b:2,op:"+",result:9};
      }else{
        const pool=shuffle(buildPool(op,pa,pb));
        choice=pool.find(q=>!used.has(`${q.a}${q.op}${q.b}`)) || pool[0];
      }
      used.add(`${choice.a}${choice.op}${choice.b}`);
      round.push(choice);
    }

    const all=[];
    for(const [op,pa,pb] of cats) all.push(...buildPool(op,pa,pb));
    shuffle(all);
    for(const q of all){
      const key=`${q.a}${q.op}${q.b}`;
      if(!used.has(key)){
        round.push(q); used.add(key);
        if(round.length===TOTAL) break;
      }
    }

    const demoIndex=round.findIndex(q=>q.a===7&&q.b===2&&q.op==="+");
    const demo=round.splice(demoIndex,1)[0];
    shuffle(round);
    round.unshift(demo);
    return round.slice(0,TOTAL);
  }

  function resetTower(el){
    el.className="tower hidden";
    el.style.left="0px";el.style.top="0px";el.style.width="auto";el.style.height="auto";
    el.style.transition="";el.style.opacity="1";el.style.transform="";
  }

  function dimsForNumber(n){
    const rows=Math.ceil(n/2);
    const pf=els.playfield.getBoundingClientRect();
    const cube=0.85*Math.max(38,Math.min(62,(pf.height-105)/5.7)); // Ver4: cubes 15% smaller
    const h=rows*cube;
    const sourceImg=new Image();
    // aspect ratios measured from optimized tower assets; fallback approximates 2 columns.
    const ratios={1:77/72,2:129/72,3:145/144,4:139/144,5:149/216,6:151/216,7:156/288,8:159/288,9:162/360,10:161/360};
    return {h,w:h*ratios[n],cube};
  }

  function setTower(el,n,x,y,extra=""){
    const d=dimsForNumber(n);
    el.src=TOWERS[n];
    el.alt=`${n} cube tower`;
    el.className=`tower ${extra}`.trim();
    el.dataset.number=n;
    el.style.width=`${d.w}px`;
    el.style.height=`${d.h}px`;
    el.style.left=`${x}px`;
    el.style.top=`${y}px`;
    return d;
  }

  function floorYFor(h){
    const pf=els.playfield.getBoundingClientRect();
    return pf.height-32-h;
  }

  function centerXFor(w){
    const pf=els.playfield.getBoundingClientRect();
    return pf.width/2-w/2;
  }

  function spawnXFor(n,w){
    const pf=els.playfield.getBoundingClientRect();
    const p=parity(n);
    return p==="odd" ? Math.max(14,pf.width*.08-w/2) : Math.min(pf.width-w-14,pf.width*.92-w/2);
  }

  async function animateFirstTower(){
    const {a}=current;
    const d=dimsForNumber(a);
    const startX=spawnXFor(a,d.w);
    const endX=centerXFor(d.w);
    const startY=-d.h-12;
    const endY=floorYFor(d.h);
    setTower(els.towerA,a,startX,startY,"falling-glow");
    sfx.fall();
    await tweenPosition(els.towerA,{x:startX,y:startY},{x:endX,y:endY},980);
    els.towerA.classList.remove("falling-glow");
    sfx.land();
    await sleep(140);
  }

  function tweenPosition(el,from,to,duration=400){
    return new Promise(resolve=>{
      const start=performance.now();
      const ease=t=>1-Math.pow(1-t,3);
      function frame(now){
        const p=Math.min(1,(now-start)/duration),e=ease(p);
        const x=from.x+(to.x-from.x)*e, y=from.y+(to.y-from.y)*e;
        el.style.left=`${x}px`;el.style.top=`${y}px`;
        if(p<1) requestAnimationFrame(frame); else resolve();
      }
      requestAnimationFrame(frame);
    });
  }

  function getXY(el){
    return {x:parseFloat(el.style.left)||0,y:parseFloat(el.style.top)||0,w:el.offsetWidth,h:el.offsetHeight};
  }

  function showTutorial(){ tutorialShown=true; }

  function spawnSecondTower(){
    const {b,op}=current;
    const d=dimsForNumber(b);
    const a=getXY(els.towerA);
    const x=spawnXFor(b,d.w);
    const y=-d.h-14;
    const targetX=centerXFor(d.w);
    const contactY=Math.max(54,a.y-d.h+5);
    setTower(els.towerB,b,x,y,`${op==="-"?"subtractor ":""}falling-glow`.trim());
    secondState={x,y,startX:x,startY:y,targetX,contactY,w:d.w,h:d.h,last:performance.now(),falling:true};
    sfx.fall();
    showTutorial();
    cancelAnimationFrame(fallRAF);
    fallRAF=requestAnimationFrame(fallLoop);
  }

  function fallLoop(now){
    if(!secondState || locked) return;
    const dt=Math.min(34,now-secondState.last);
    secondState.last=now;
    if(secondState.falling){
      secondState.y += dt*.125;
      const travel=Math.max(1,secondState.contactY-secondState.startY);
      const p=Math.max(0,Math.min(1,(secondState.y-secondState.startY)/travel));
      const e=1-Math.pow(1-p,2.2);
      secondState.x=secondState.startX+(secondState.targetX-secondState.startX)*e;
      if(secondState.y>=secondState.contactY){
        secondState.y=secondState.contactY;secondState.x=secondState.targetX;secondState.falling=false;
      }
      els.towerB.style.left=`${secondState.x}px`;
      els.towerB.style.top=`${secondState.y}px`;
    }
    checkSnap();
    if(secondState && !locked) fallRAF=requestAnimationFrame(fallLoop);
  }

  function moveSecond(){ /* Ver2: towers auto-align to the center. */ }

  function checkSnap(){
    if(!secondState || locked) return;
    if(!secondState.falling && secondState.y>=secondState.contactY) resolveMath();
  }

  async function resolveMath(){
    if(locked) return;
    locked=true;
    cancelAnimationFrame(fallRAF);

    const b=getXY(els.towerB);
    const hitX=b.x+b.w/2, hitY=b.y+b.h;
    els.towerB.classList.remove("falling-glow");
    sfx.impact();

    els.impactFlash.style.left=`${hitX}px`;els.impactFlash.style.top=`${hitY}px`;
    els.impactFlash.classList.remove("show");void els.impactFlash.offsetWidth;els.impactFlash.classList.add("show");

    if(current.op==="+"){
      sfx.merge();

      els.towerB.style.opacity="0";
      els.towerB.style.transform="scale(.35) rotate(15deg)";
      els.towerA.style.filter="drop-shadow(0 0 20px rgba(255,200,0,.9))";
      await sleep(230);
    }

    els.towerA.classList.add("hidden");
    els.towerB.classList.add("hidden");
    showResultTower();
  }

  function burstAt(x,y,count=20,isPop=false){
    const colors=isPop?["#ff4b4b","#ffc800","#ffffff","#f97316"]:["#a855f7","#0ea5e9","#58cc02","#ffc800","#ffffff"];
    for(let i=0;i<count;i++){
      const p=document.createElement("i");
      p.className="particle";
      p.style.left=(x-6)+"px";p.style.top=(y-6)+"px";
      p.style.background=colors[i%colors.length];
      p.style.setProperty("--dx",`${(Math.random()-.5)*170}px`);
      p.style.setProperty("--dy",`${-35-Math.random()*120}px`);
      els.playfield.appendChild(p);setTimeout(()=>p.remove(),760);
    }
  }

  async function showResultTower(){
    const n=current.result;
    const d=dimsForNumber(n);
    const pf=els.playfield.getBoundingClientRect();
    const x=pf.width/2-d.w/2;
    const y=floorYFor(d.h);
    setTower(els.towerResult,n,x,y,"result-pop");
    els.equation.innerHTML=`${current.a} ${opSymbol(current.op)} ${current.b} = <span class="answer-pop">${n}</span>`;
    await sleep(520);

    if(parity(n)==="odd"){
      els.towerResult.classList.add("odd-glow");
      els.pairNote.textContent="One cube has no partner!";
      placeUnpairedRing(n,x,y,d);
    }else{
      els.towerResult.classList.add("even-glow");
      els.pairNote.textContent="All cubes have a partner!";
      els.unpairedRing.style.display="none";
    }
    els.pairNote.classList.add("show");
    await sleep(700);
    els.pairNote.classList.remove("show");
    await sleep(120);
    askParity();
  }

  function placeUnpairedRing(n,x,y,d){
    const rows=Math.ceil(n/2), cube=d.h/rows;
    els.unpairedRing.style.display="block";
    els.unpairedRing.style.width=`${cube*.88}px`;
    els.unpairedRing.style.height=`${cube*.86}px`;
    // left column top cube
    els.unpairedRing.style.left=`${x+cube*.08}px`;
    els.unpairedRing.style.top=`${y+cube*.05}px`;
  }

  function askParity(){
    const n=current.result;
    els.parityQ.textContent=`Is ${n} odd or even?`;
    els.answerButtons.classList.remove("hidden");
    els.feedback.textContent="";
    $$(".answer-btn").forEach(b=>b.classList.remove("correct","wrong"));
    locked=false;
  }

  async function answerParity(choice,btn){
    if(locked || els.answerButtons.classList.contains("hidden")) return;
    const correct=parity(current.result);
    if(choice===correct){
      locked=true;
      if(!questionHadWrong){
        stars++;
        els.starCount.textContent=stars;
      }
      btn.classList.add("correct");sfx.correct();
      els.feedback.textContent=questionHadWrong
        ? `${current.result} is ${correct}! Try for a star on the next one!`
        : `${current.result} is ${correct}! Great job!`;
      els.feedback.style.color=correct==="odd"?varColor("--odd-dark"):varColor("--even-dark");
      confetti(btn.getBoundingClientRect());
      await sleep(420);
      els.nextBtn.classList.remove("hidden");
    }else{
      questionHadWrong=true;
      btn.classList.remove("wrong");void btn.offsetWidth;btn.classList.add("wrong");sfx.wrong();
      els.feedback.textContent="Try again!";
      els.feedback.style.color="#c2410c";
    }
  }

  function goNextQuestion(){
    if(els.nextBtn.classList.contains("hidden")) return;
    els.nextBtn.classList.add("hidden");
    qIndex++;
    if(qIndex>=TOTAL){finishRound();return}
    beginQuestion();
  }

  function varColor(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}

  function confetti(rect){
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const chars=["⭐","✨","◆","●"];
    for(let i=0;i<22;i++){
      const s=document.createElement("span");s.className="star-particle";s.textContent=chars[i%chars.length];
      s.style.left=cx+"px";s.style.top=cy+"px";
      s.style.setProperty("--dx",`${(Math.random()-.5)*260}px`);
      s.style.setProperty("--dy",`${-50+Math.random()*210}px`);
      document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
    }
  }

  function updateHUD(){
    els.progressText.textContent=`${qIndex+1} / ${TOTAL}`;
    els.progressBar.style.width=`${(qIndex/TOTAL)*100}%`;
  }

  async function beginQuestion(){
    locked=true;
    questionHadWrong=false;
    els.nextBtn.classList.add("hidden");
    current=questions[qIndex];
    secondState=null;
    resetTower(els.towerA);resetTower(els.towerB);resetTower(els.towerResult);
    els.unpairedRing.style.display="none";
    els.pairNote.classList.remove("show");
    els.answerButtons.classList.add("hidden");
    els.feedback.textContent="";
    els.parityQ.textContent="Build the tower first!";
    els.equation.textContent=`${current.a} ${opSymbol(current.op)} ${current.b} = ?`;
    updateHUD();
    await sleep(120);
    await animateFirstTower();
    locked=false;
    spawnSecondTower();
  }

  function startRound(){
    ensureAudio();
    questions=generateRound();qIndex=0;stars=0;current=null;secondState=null;
    tutorialShown=false;questionHadWrong=false;
    els.nextBtn.classList.add("hidden");
    els.starCount.textContent="0";
    els.start.classList.add("hidden");els.finish.classList.add("hidden");
    els.game.classList.remove("hidden");els.hud.classList.remove("hidden");
    beginQuestion();
  }

  function finishRound(){
    cancelAnimationFrame(fallRAF);
    els.hud.classList.add("hidden");els.game.classList.add("hidden");
    els.finalScore.textContent=`⭐ ${stars} / ${TOTAL}`;
    els.finish.classList.remove("hidden");
    sfx.correct();setTimeout(()=>sfx.correct(),260);
    const r=$("#finalEmoji").getBoundingClientRect();confetti(r);
  }

  function goHome(){
    cancelAnimationFrame(fallRAF);
    els.finish.classList.add("hidden");els.game.classList.add("hidden");els.hud.classList.add("hidden");
    els.start.classList.remove("hidden");
  }

  $("#playBtn").addEventListener("click",startRound);
  $("#againBtn").addEventListener("click",startRound);
  $("#homeBtn").addEventListener("click",goHome);
  // Ver4 (kept from Ver3): no left/right input is needed; towers auto-center while falling.

  els.equationSpeak.addEventListener("click",()=>speakText(equationSpeechText(),els.equationSpeak));
  els.questionSpeak.addEventListener("click",()=>speakText(questionSpeechText(),els.questionSpeak));

  $$(".answer-btn").forEach(btn=>btn.addEventListener("click",()=>answerParity(btn.dataset.answer,btn)));
  els.nextBtn.addEventListener("click",goNextQuestion);

  els.soundBtn.addEventListener("click",()=>{
    audioOn=!audioOn;els.soundBtn.textContent=audioOn?"🔊":"🔇";
    if(audioOn) ensureAudio();
  });

  // Reflow current towers safely on resize.
  window.addEventListener("resize",()=>{
    if(els.game.classList.contains("hidden")||!current) return;
    if(!els.towerResult.classList.contains("hidden")){
      const d=dimsForNumber(current.result),x=centerXFor(d.w),y=floorYFor(d.h);
      setTower(els.towerResult,current.result,x,y,`result-pop ${parity(current.result)}-glow`);
      if(parity(current.result)==="odd") placeUnpairedRing(current.result,x,y,d);
    }
  });

})();
</script>
</body>
</html>

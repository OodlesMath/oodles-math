.hud-pill{position:absolute;top:24px;display:flex;align-items:center;justify-content:center;min-width:110px;height:62px;padding:0 18px;border-radius:22px;background:rgba(255,255,255,.95);box-shadow:0 6px 0 rgba(0,0,0,.14);font-weight:900;font-size:26px;color:#149ad6;z-index:25}
#hud-q{left:28px} #hud-score{left:175px;gap:10px;color:#d59b00}
#hud-score .star{font-size:32px;line-height:1}
#top-wrap{position:absolute;left:510px;top:78px;display:flex;align-items:flex-start;gap:18px;z-index:30}
#equation-card{min-width:480px;max-width:600px;padding:20px 26px 18px;border-radius:38px;display:flex;align-items:center;gap:20px}
#equation-main{flex:1}
#equation{font-size:48px;font-weight:900;line-height:1.1;letter-spacing:-1px;white-space:nowrap}
.eq-num1{color:#15a2d5}.eq-num2{color:#f39a0c}.eq-num3{color:#7c3aed}.eq-op{color:#8ea0b6}.eq-q{color:#7d8593}
#prompt{margin-top:8px;font-size:22px;font-weight:700;color:#48576d;line-height:1.2}
#speak-btn{width:58px;height:58px;border:none;border-radius:50%;background:var(--cyan);color:#fff;font-size:30px;box-shadow:0 5px 0 var(--cyanDark)}
#bond-box{width:245px;min-height:160px;padding:10px 12px;border-radius:28px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);display:none;align-items:center;justify-content:center}
#bond-box.show{display:flex}
#bond-svg text{font-weight:900;fill:#364152;font-family:Poppins, sans-serif}
#bond-svg .whole{fill:#ffd964;stroke:#e0ae16;stroke-width:4}
#bond-svg .partA{fill:#76d7ff;stroke:#24a7d8;stroke-width:4}
#bond-svg .partB{fill:#ffb768;stroke:#e48b2f;stroke-width:4}
#bond-svg .partC{fill:#d7b6ff;stroke:#9967f4;stroke-width:4}
#bond-svg .bond-line{stroke:#475569;stroke-width:4;stroke-linecap:round}
#bus-zone{position:absolute;left:151px;top:411px;width:735px;height:147px;z-index:24;border-radius:16px}
#bus-zone.active{outline:4px solid rgba(70,200,120,.8);outline-offset:6px}
#slot-wrap{position:absolute;inset:0}
.ten-frame{position:absolute;top:0;height:147px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr)}
#frame-1{left:0;width:340px} #frame-2{left:366px;width:355px}
.bus-slot{display:flex;align-items:center;justify-content:center;position:relative}
.bus-slot img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.bus-slot.removed{opacity:.08}
#bus-group-layer{position:absolute;inset:0;pointer-events:none}
.bus-group-chip{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border:3px solid #24a7d8;border-bottom-width:7px;border-radius:18px;padding:6px 12px 8px;box-shadow:0 5px 12px rgba(0,0,0,.12);font-weight:800;font-size:19px;color:#334155}
.bus-group-chip img{width:34px;height:34px;object-fit:contain}
#stop-zone{position:absolute;left:1085px;top:365px;width:516px;height:306px;z-index:24;border-radius:53px;padding:18px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px}
#stop-zone.active{background:rgba(91,223,91,.16);box-shadow:0 0 18px rgba(76,206,89,.22) inset}
.group-card{width:146px;min-height:92px;border-radius:26px;background:rgba(255,255,255,.96);border:3px solid #8fdcf6;border-bottom-width:8px;border-bottom-color:#53b6d7;box-shadow:0 8px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px 12px;gap:4px;touch-action:none;transition:transform .12s, opacity .12s}
.group-card.done{opacity:.42;filter:grayscale(.2)}
.group-card.current{outline:4px solid #7c3aed;outline-offset:2px}
.group-card img{width:50px;height:50px;object-fit:contain}
.group-card .count{font-weight:900;font-size:28px;color:#149ad6;line-height:1}
.group-card .label{font-weight:800;font-size:16px;color:#475569;line-height:1.05;text-align:center}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.96}
#answers{position:absolute;left:302px;bottom:30px;width:1068px;z-index:40;display:flex;flex-direction:column;align-items:center;gap:14px}
#choice-row{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.choice{height:78px;border:none;border-radius:22px;background:var(--cyan);color:#fff;font-size:42px;font-weight:900;box-shadow:0 7px 0 var(--cyanDark)}
.choice.selected{background:#8b5cf6;box-shadow:0 0 0 5px #fff,0 0 0 10px #8b5cf6,0 7px 0 #6d3ded}
.choice.correct{background:var(--green);box-shadow:0 7px 0 var(--greenDark)}
.choice.wrong{background:var(--red);box-shadow:0 7px 0 #d14452}
#action-row{display:flex;gap:16px}
.action-btn{min-width:150px;height:60px;border:none;border-radius:20px;color:#fff;font-weight:900;font-size:28px;box-shadow:0 7px 0 rgba(0,0,0,.14)}
#check-btn{background:#7c3aed;box-shadow:0 7px 0 #5b21b6} #next-btn{background:var(--pink);box-shadow:0 7px 0 var(--pinkDark)}
.action-btn:disabled{opacity:.6;filter:grayscale(.15);cursor:default}
#feedback{position:absolute;left:50%;bottom:187px;transform:translateX(-50%);z-index:50;font-size:32px;font-weight:900;text-shadow:0 2px 6px rgba(255,255,255,.8)}
#feedback.good{color:var(--green)} #feedback.bad{color:var(--red)}
.overlay{position:absolute;inset:0;background:rgba(31,41,55,.38);display:flex;align-items:center;justify-content:center;z-index:70;backdrop-filter:blur(4px)}
.modal{width:min(560px,92vw);padding:36px 40px;border-radius:36px;background:rgba(255,255,255,.97);box-shadow:0 16px 35px rgba(0,0,0,.18);text-align:center}
.modal h1{margin:0 0 8px;font-size:52px;line-height:1;font-weight:900;color:#149ad6}
.modal p{margin:10px 0 22px;font-size:24px;font-weight:700;color:#475569;line-height:1.4}
.big-score{font-size:76px;font-weight:900;color:var(--green);line-height:1}
.main-btn{padding:16px 32px;border:none;border-radius:24px;background:var(--yellow);box-shadow:0 7px 0 #dbaf00;color:#344154;font-size:30px;font-weight:900}
.small-note{font-size:18px;color:#64748b;font-weight:600}

/* Ver 6: larger animal faces; group drag operates on individual faces (no number-label overlays). */
.bus-slot img{width:65px;height:65px;object-fit:contain}
.bus-slot.can-drag{cursor:grab;touch-action:none}
.bus-slot.can-drag:active{cursor:grabbing}
#bus-group-layer{display:none!important}
#stop-zone{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:69px;justify-items:center;align-content:center;align-items:center;gap:4px 2px;padding:13px 17px}
.stop-animal{width:65px;height:65px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;border-radius:12px}
.stop-animal:active{cursor:grabbing}
.stop-animal img{width:65px;height:65px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.23));pointer-events:none}
.drag-ghost{position:fixed;z-index:99999;width:65px;height:65px;object-fit:contain;transform:none!important;transition:none!important;pointer-events:none;filter:drop-shadow(0 5px 5px rgba(0,0,0,.25))}
.answer-reveal{color:#58cc02;filter:drop-shadow(0 1px 0 #248c10)}

</style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div class="screen">
  <div id="stage">
    <div id="hud-q" class="hud-pill">Q: <span id="qnum">1</span>/10</div>
    <div id="hud-score" class="hud-pill"><span class="star">⭐</span><span id="score">0</span></div>

    <div id="top-wrap">
      <div id="equation-card" class="card">
        <div id="equation-main">
          <div id="equation">5 + 7 = ?</div>
          <div id="prompt">Drag the groups to solve the problem.</div>
        </div>
        <button id="speak-btn" title="Read aloud">🔊</button>
      </div>
      <div id="bond-box"></div>
    </div>

    <div id="bus-zone">
      <div id="slot-wrap">
        <div id="frame-1" class="ten-frame"></div>
        <div id="frame-2" class="ten-frame"></div>
      </div>
      <div id="bus-group-layer"></div>
    </div>

    <div id="stop-zone"></div>

    <div id="feedback"></div>

    <div id="answers">
      <div id="choice-row"></div>
      <div id="action-row">
        <button id="check-btn" class="action-btn" disabled>Check</button>
        <button id="next-btn" class="action-btn hidden">Next</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="modal">
        <h1>Math Bus</h1>
        <p>Solve <b>10</b> addition and subtraction questions within <b>20</b>.<br>Drag each <b>animal group</b>, pick the answer, then press <b>Check</b>.</p>
        <button id="start-btn" class="main-btn">Start Game</button>
        <p class="small-note">Drag animal groups · Check your answer · See the number bond</p>
      </div>
    </div>

    <div id="end-screen" class="overlay hidden">
      <div class="modal">
        <h1>Great Job!</h1>
        <p>You finished all 10 questions.</p>
        <div class="big-score"><span id="final-score">0</span>/10 ⭐</div>
        <p id="end-text"></p>
        <button id="restart-btn" class="main-btn">Play Again</button>
      </div>
    </div>
  </div>
</div>

const ANIMAL_INFO = {cat:{name:'cat', plural:'cats'}, dog:{name:'dog', plural:'dogs'}, panda:{name:'panda', plural:'pandas'}, rabbit:{name:'rabbit', plural:'rabbits'}, lion:{name:'lion', plural:'lions'}};
const ORDER = ['cat','dog','panda','rabbit','lion'];
const SLOT_POS = Array.from({length:20}, (_,i)=>{
  const frame = i<10 ? 0 : 1;
  const idx = i<10 ? i : i-10;
  const row = Math.floor(idx/5);
  const col = idx%5;
  const frameLeft = frame===0 ? 0 : 366;
  const frameWidth = frame===0 ? 340 : 355;
  const cellW = frameWidth/5;
  const cellH = 147/2;
  return {left:frameLeft + col*cellW, top:row*cellH, width:cellW, height:cellH, cx:frameLeft + col*cellW + cellW/2, cy:row*cellH + cellH/2};
});

};
const state = {questions:[], index:0, score:0, current:null, selected:null, checked:false, draggedDone:false, speech:'', busAnimals:Array(20).fill(null), nextGroup:0};

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function pickAnimals(n, exclude=[]){const pool=ORDER.filter(a=>!exclude.includes(a)); return shuffle(pool.slice()).slice(0,n)}
function plural(animal,count){const info=ANIMAL_INFO[animal]; return count===1 ? info.name : info.plural}
function joinLabels(parts){if(parts.length===1) return parts[0]; if(parts.length===2) return parts[0]+' and '+parts[1]; return parts.slice(0,-1).join(', ')+', and '+parts.at(-1)}

function buildQuestions(){
  const used = new Set();
  const list = [];
  function addQ(q){ if(used.has(q.key)) return false; used.add(q.key); list.push(q); return true; }
  while(list.length<4){
    const idx=list.length;
    if(idx%2===0){
      const a=rand(1,9), b=rand(1,20-a);
      const animals=pickAnimals(2);
      addQ({kind:'add', terms:[{n:a,animal:animals[0]},{n:b,animal:animals[1]}], answer:a+b, whole:a+b, key:`A2-${a}-${b}`, parts:[a,b]});
    } else {
      const answer=rand(1,14), b=rand(1,20-answer);
      const total=answer+b; const animals=pickAnimals(1,['cat']);
      addQ({kind:'sub', terms:[{n:answer,animal:'cat',role:'remain'},{n:b,animal:animals[0],role:'remove'}], answer, whole:total, key:`S2-${total}-${b}`, parts:[answer,b]});
    }
  }
  while(list.length<10){
    const idx=list.length-4;
    if(idx%2===0){
      const a=rand(1,8), b=rand(1,8), c=rand(1,20-a-b); if(c<1) continue;
      const animals=pickAnimals(3);
      addQ({kind:'add', terms:[{n:a,animal:animals[0]},{n:b,animal:animals[1]},{n:c,animal:animals[2]}], answer:a+b+c, whole:a+b+c, key:`A3-${a}-${b}-${c}`, parts:[a,b,c]});
    } else {
      const answer=rand(1,10), b=rand(1,5), c=rand(1,20-answer-b); if(c<1) continue;
      const total=answer+b+c; if(total>20) continue; const animals=pickAnimals(2,['cat']);
      addQ({kind:'sub', terms:[{n:answer,animal:'cat',role:'remain'},{n:b,animal:animals[0],role:'remove'},{n:c,animal:animals[1],role:'remove'}], answer, whole:total, key:`S3-${total}-${b}-${c}`, parts:[answer,b,c]});
    }
  }
  return list;
}

function eqHTML(q, revealed=false){
  const nums = q.kind==='add' ? q.terms.map(t=>t.n) : [q.whole, ...q.terms.filter(t=>t.role==='remove').map(t=>t.n)];
  const op = q.kind==='add' ? '+' : '-';
  const pieces=[];
  nums.forEach((n,i)=>{
    pieces.push(`<span class="eq-num${(i%3)+1}">${n}</span>`);
    if(i<nums.length-1) pieces.push(`<span class="eq-op">${op}</span>`);
  });
  pieces.push('<span class="eq-op">=</span>');
  pieces.push(revealed ? `<span class="answer-reveal">${q.answer}</span>` : '<span class="eq-q">?</span>');
  return pieces.join(' ');
}
function equationSpeech(q, reveal=false){
  const nums = q.kind==='add' ? q.terms.map(t=>t.n) : [q.whole, ...q.terms.filter(t=>t.role==='remove').map(t=>t.n)];
  const operator = q.kind==='add' ? 'plus' : 'minus';
  const expression = nums.join(` ${operator} `);
  return reveal ? `${expression} equals ${q.answer}.` : `What is ${expression}?`;
}
function promptText(q){
  if(q.kind==='add'){
    const parts=q.terms.map(t=>`${t.n} ${plural(t.animal,t.n)}`);
    return `Drag ${joinLabels(parts)} onto the bus.`;
  }
  const rem=q.terms.filter(t=>t.role==='remove').map(t=>`${t.n} ${plural(t.animal,t.n)}`);
  return `Drag ${joinLabels(rem)} off the bus. How many cats remain?`;
}

function makeSlots(){
  for(let i=0;i<10;i++){const d=document.createElement('div'); d.className='bus-slot'; ui.frame1.appendChild(d)}
  for(let i=10;i<20;i++){const d=document.createElement('div'); d.className='bus-slot'; ui.frame2.appendChild(d)}
}
function slotEls(){return [...ui.frame1.children, ...ui.frame2.children]}
function renderBus(){
  const removable = state.current && state.current.kind==='sub' ? state.current.terms.filter(t=>t.role==='remove') : [];
  slotEls().forEach((el,i)=>{
    const animal=state.busAnimals[i];
    el.classList.toggle('removed',!animal);
    el.classList.remove('can-drag');
    el.innerHTML=animal ? `<img src="${ICONS[animal]}" alt="${animal}" draggable="false">` : '';
    const group=removable.findIndex(t=>!t.done && i>=t.start && i<=t.end);
    if(group>=0 && animal){
      el.classList.add('can-drag');
      // Rebind after a render; each live face is a handle for the WHOLE group.
      el.onpointerdown=(event)=>beginGroupDrag(event,{type:'busgroup',idx:group},el);
    } else {
      el.onpointerdown=null;
    }
  });
}
function generateChoices(correct){
  const set=new Set([correct]);
  const candidates=shuffle(Array.from({length:21},(_,i)=>i).filter(n=>n!==correct).sort((a,b)=>Math.abs(a-correct)-Math.abs(b-correct)).slice(0,12));
  for(const c of candidates){set.add(c); if(set.size>=4) break;}
  return shuffle([...set]);
}
function renderChoices(q){
  ui.choices.innerHTML='';
  generateChoices(q.answer).forEach(n=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=n; b.onclick=()=>selectAnswer(n,b); ui.choices.appendChild(b);
  });
}
function selectAnswer(num,btn){ if(state.checked) return; state.selected=num; [...ui.choices.children].forEach(c=>c.classList.remove('selected')); btn.classList.add('selected'); updateCheckEnabled(); popSound(); }
function updateCheckEnabled(){ ui.check.disabled = !(state.selected!==null && state.draggedDone && !state.checked); }
function clearDragZones(){ui.busZone.classList.remove('active'); ui.stopZone.classList.remove('active')}

function createGroupCard(term, idx){
  const card=document.createElement('div'); card.className='group-card'; card.dataset.idx=idx;
  card.innerHTML=`<img src="${ICONS[term.animal]}" alt="${term.animal}"><div class="count">${term.n}</div><div class="label">${plural(term.animal,term.n)}</div>`;
  if(idx===state.nextGroup && !term.done) card.classList.add('current');
  if(term.done) card.classList.add('done');
  attachDrag(card, {type:'source', idx});
  return card;
}
function renderStopZone(){
  ui.stopZone.innerHTML='';
  const q=state.current;
  const parts=q.kind==='add' ? q.terms.map((term,idx)=>({term,idx})).filter(x=>!x.term.done)
                             : q.parked.map(term=>({term,idx:-1}));
  parts.forEach(({term,idx})=>{
    for(let i=0;i<term.n;i++){
      const face=document.createElement('div');
      face.className='stop-animal';
      face.dataset.animal=term.animal;
      face.innerHTML=`<img src="${ICONS[term.animal]}" alt="${term.animal}" draggable="false">`;
      if(q.kind==='add'){
        face.dataset.group=String(idx);
        face.onpointerdown=event=>beginGroupDrag(event,{type:'source',idx},face);
      }
      ui.stopZone.appendChild(face);
    }
  });
}
function renderSubtractionChips(){
  // Ver 6: no floating labels, no badges over the 20 ten-frame windows.
  ui.busGroupLayer.replaceChildren();
}
function setupQuestion(){
  state.current = JSON.parse(JSON.stringify(state.questions[state.index]));
  state.current.parked=[]; state.selected=null; state.checked=false; state.nextGroup=0;
  ui.feedback.textContent=''; ui.feedback.className='';
  ui.check.classList.remove('hidden'); ui.next.classList.add('hidden');
  ui.bond.classList.remove('show'); ui.bond.innerHTML='';
  ui.qnum.textContent=state.index+1;
  ui.equation.innerHTML=eqHTML(state.current); ui.prompt.textContent=promptText(state.current); state.speech = equationSpeech(state.current);
  state.busAnimals = Array(20).fill(null);
  if(state.current.kind==='add'){
    state.current.terms.forEach(t=>t.done=false); state.draggedDone=false;
  } else {
    let pos=0; state.current.terms.forEach(term=>{ term.start=pos; for(let i=0;i<term.n;i++){state.busAnimals[pos++]=term.animal;} term.end=pos-1; term.done=false; });
    state.draggedDone=false;
  }
  renderBus(); renderChoices(state.current); renderStopZone(); renderSubtractionChips(); updateCheckEnabled();
}
function placeAdditionGroup(idx){
  if(idx!==state.nextGroup || state.current.kind!=='add') return false;
  const term=state.current.terms[idx]; const start=state.busAnimals.findIndex(v=>v===null); if(start<0) return false;
  for(let i=0;i<term.n;i++) state.busAnimals[start+i]=term.animal;
  term.done=true; state.nextGroup++; state.draggedDone = state.current.terms.every(t=>t.done);
  renderBus(); renderStopZone(); updateCheckEnabled(); popSound(); return true;
}
function removeSubtractionGroup(idx){
  const removable=state.current.terms.filter(t=>t.role==='remove'); const term=removable[idx];
  if(idx!==state.nextGroup || !term || term.done) return false;
  for(let i=term.start;i<=term.end;i++) state.busAnimals[i]=null;
  term.done=true; state.current.parked.push(term); state.nextGroup++; state.draggedDone = state.nextGroup >= removable.length;
  renderBus(); renderStopZone(); renderSubtractionChips(); updateCheckEnabled(); popSound(); return true;
}
function attachDrag(el,meta){
  // Compatibility wrapper for the original group logic.
  el.onpointerdown=event=>beginGroupDrag(event,meta,el);
}
function beginGroupDrag(event,meta,source){
  if(state.checked || state.draggedDone || meta.idx!==state.nextGroup) return;
  if(event.button!==undefined && event.button!==0) return;
  event.preventDefault();
  const q=state.current;
  const term=meta.type==='source' ? q.terms[meta.idx] : q.terms.filter(t=>t.role==='remove')[meta.idx];
  if(!term || term.done) return;
  const rect=source.getBoundingClientRect();
  const ghost=document.createElement('img');
  ghost.src=ICONS[term.animal];
  ghost.alt='';ghost.className='drag-ghost';ghost.draggable=false;
  const sz=rect.height;
  ghost.style.width=sz+'px';ghost.style.height=sz+'px';
  const originX=event.clientX,originY=event.clientY;
  let moved=false;
  const offsetX=Math.min(sz*.75,Math.max(sz*.25,event.clientX-rect.left));
  const offsetY=Math.min(sz*.75,Math.max(sz*.25,event.clientY-rect.top));
  document.body.appendChild(ghost);
  function point(ev){
    ghost.style.left=(ev.clientX-offsetX)+'px';ghost.style.top=(ev.clientY-offsetY)+'px';
    if(Math.hypot(ev.clientX-originX,ev.clientY-originY)>8)moved=true;
    clearDragZones();
    const below=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=meta.type==='source'?ui.busZone:ui.stopZone;
    if(target.contains(below))target.classList.add('active');
  }
  function cleanup(){
    document.removeEventListener('pointermove',point);
    document.removeEventListener('pointerup',release);
    document.removeEventListener('pointercancel',cancel);
    clearDragZones();ghost.remove();
  }
  function cancel(){cleanup()}
  function release(ev){
    const below=document.elementFromPoint(ev.clientX,ev.clientY);
    const target=meta.type==='source'?ui.busZone:ui.stopZone;
    const valid=!moved || target.contains(below);
    cleanup();
    if(valid){
      if(meta.type==='source')placeAdditionGroup(meta.idx);
      else removeSubtractionGroup(meta.idx);
    }else wrongTap();
  }
  document.addEventListener('pointermove',point);
  document.addEventListener('pointerup',release);
  document.addEventListener('pointercancel',cancel);
  point(event);
}
function checkAnswer(){
  if(ui.check.disabled || state.checked) return;
  state.checked=true;
  const correct=state.selected===state.current.answer;
  [...ui.choices.children].forEach(btn=>{
    const val=Number(btn.textContent);
    if(val===state.current.answer)btn.classList.add('correct');
    if(val===state.selected && !correct)btn.classList.add('wrong');
    btn.disabled=true;
  });
  if(correct){
    state.score++;ui.score.textContent=state.score;
    ui.feedback.textContent='Correct!';ui.feedback.className='good';
    goodSound();
  }else{
    ui.feedback.textContent='Look at the number bond!';ui.feedback.className='bad';
    wrongSound();
  }
  // Always reveal the correct answer, and read the complete equation aloud.
  ui.equation.innerHTML=eqHTML(state.current,true);
  state.speech=equationSpeech(state.current,true);
  ui.bond.innerHTML=bondSVG(state.current);ui.bond.classList.add('show');
  ui.check.classList.add('hidden');ui.next.classList.remove('hidden');
  speak();
}
function nextQuestion(){ if(state.index>=state.questions.length-1) return finishGame(); state.index++; setupQuestion(); }
function finishGame(){ ui.finalScore.textContent=state.score; ui.endText.textContent = state.score===10 ? 'Perfect score!' : (state.score>=7 ? 'Nice work! Keep going!' : 'Good try! Practice again for more stars.'); ui.end.classList.remove('hidden'); winSound(); }
function startGame(){ state.questions=buildQuestions(); state.index=0; state.score=0; ui.score.textContent='0'; ui.start.classList.add('hidden'); ui.end.classList.add('hidden'); setupQuestion(); speak(); }
function restartGame(){ startGame(); }
function speak(){ try{ const u=new SpeechSynthesisUtterance(state.speech); u.rate=.92; u.pitch=1.02; u.lang='en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function beep(freq=.0, type='sine', dur=.12){ try{ if(!window.AudioContext && !window.webkitAudioContext) return; const ctx=beep.ctx || (beep.ctx=new (window.AudioContext||window.webkitAudioContext)()); const o=ctx.createOscillator(); const g=ctx.createGain(); o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination); const t=ctx.currentTime; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.02); }catch(e){} }
function popSound(){beep(620,'triangle',.08)} function wrongTap(){beep(180,'sawtooth',.08)} function goodSound(){beep(520,'sine',.12); setTimeout(()=>beep(760,'sine',.18),110)} function wrongSound(){beep(240,'square',.22)} function winSound(){[420,520,660,860].forEach((f,i)=>setTimeout(()=>beep(f,'sine',.2),i*120))}
function fitStage(){ const s=Math.min(window.innerWidth/1672, window.innerHeight/941); ui.stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
window.addEventListener('resize', fitStage);
ui.startBtn.onclick=startGame; ui.restart.onclick=restartGame; ui.check.onclick=checkAnswer; ui.next.onclick=nextQuestion; ui.speak.onclick=speak;
makeSlots(); fitStage();
</script>
</body>

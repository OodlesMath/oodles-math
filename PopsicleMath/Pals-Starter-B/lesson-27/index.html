<script>
(()=>{'use strict';

  }
  function renderBond(q){

    $('hint').classList.remove('hidden');pieces.next.classList.add('hidden');pieces.choices.innerHTML='';renderBond(q);
    q.options.forEach((option,i)=>{
      const btn=document.createElement('button');btn.className='choice';btn.type='button';btn.dataset.value=option;btn.setAttribute('aria-label',`Option ${i+1}: ${option.replaceAll('−','minus').replaceAll('+','plus').replace('=','equals')}`);
      const span=document.createElement('span');span.textContent=option;
      const check=document.createElement('span');check.className='choice-check';check.setAttribute('aria-hidden','true');
      btn.append(span,check);btn.addEventListener('click',()=>choose(option));pieces.choices.appendChild(btn);
    });
    speak(true);
  }
  function choose(value){
    if(app.phase!=='play'||app.answered)return;
    const q=app.questions[app.index],correct=value===q.answer;
    app.answered=true;app.picked=value;app.results.push(correct);if('speechSynthesis' in window)window.speechSynthesis.cancel();$('speakBtn').classList.remove('speaking');if(correct){app.score++;tone.yes()}else tone.no();
    pieces.liveScore.textContent=app.score;pieces.progress.style.width=`${(app.index+1)/TOTAL*100}%`;
    pieces.choices.querySelectorAll('.choice').forEach(btn=>{
      btn.disabled=true;
      if(btn.dataset.value===q.answer){btn.classList.add('correct');btn.querySelector('.choice-check').textContent='✓'}
      else if(btn.dataset.value===value){btn.classList.add('wrong');btn.querySelector('.choice-check').textContent='✕'}
      else btn.classList.add('muted');
    });
    pieces.feedback.textContent=correct?'Amazing! You got it!':'Good try! Look at the green answer.';
    pieces.feedback.classList.toggle('bad',!correct);
    $('hint').classList.add('hidden');pieces.next.innerHTML=app.index===TOTAL-1?'SEE RESULTS <span class="arrow">★</span>':'NEXT <span class="arrow">➜</span>';
    pieces.next.classList.remove('hidden');
  }
  function start(){tone.click();if('speechSynthesis' in window)window.speechSynthesis.cancel();stopConfetti();app.questions=newRound();app.index=0;app.score=0;app.results=[];app.phase='play';app.answered=false;
    pieces.intro.classList.add('hidden');pieces.outro.classList.add('hidden');pieces.play.classList.remove('hidden');pieces.questionPill.classList.remove('hidden');pieces.scorePill.classList.remove('hidden');render();}
  function next(){if(!app.answered)return;tone.click();if(app.index+1<TOTAL){app.index++;render()}else finish()}
  function finish(){if('speechSynthesis' in window)window.speechSynthesis.cancel();$('speakBtn').classList.remove('speaking');app.phase='outro';pieces.play.classList.add('hidden');pieces.outro.classList.remove('hidden');pieces.questionPill.classList.add('hidden');pieces.scorePill.classList.add('hidden');
    $('finalScore').textContent=`${app.score} / ${TOTAL}`;
    $('finalTitle').textContent=app.score===10?'Perfect score!':app.score>=8?'Amazing work!':app.score>=5?'Great effort!':'Keep practicing!';
    $('summaryLine').textContent=app.score===10?'You solved every number bond!':`${app.score} correct • ${TOTAL-app.score} to practice. Let's keep learning!`;
    $('roundDots').innerHTML='';app.results.forEach((v,i)=>{const el=document.createElement('div');el.className='round-dot '+(v?'yes':'no');el.textContent=v?'✓':'✕';el.title=`Question ${i+1}: ${v?'Correct':'Try again'}`;$('roundDots').appendChild(el)});tone.finish();launchConfetti();}
  function speak(auto=false){
    if(!auto)tone.click();if(!('speechSynthesis' in window)||app.phase!=='play')return;
    const u=new SpeechSynthesisUtterance('Look at the number bond. Which equation matches the number bond?');
    u.lang='en-US';u.rate=.83;u.pitch=1.08;
    const vs=window.speechSynthesis.getVoices(),american=vs.find(v=>/^en-US/i.test(v.lang)&&/Google|Samantha|Jenny|Aria|US English/i.test(v.name))||vs.find(v=>/^en-US/i.test(v.lang));if(american)u.voice=american;
    window.speechSynthesis.cancel();$('speakBtn').classList.add('speaking');u.onend=u.onerror=()=>$('speakBtn').classList.remove('speaking');
    window.speechSynthesis.speak(u);
  }
  $('startBtn').addEventListener('click',start);$('againBtn').addEventListener('click',start);pieces.next.addEventListener('click',next);$('speakBtn').addEventListener('click',()=>speak(false));
  $('fullBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}});
  window.addEventListener('resize',()=>{if(app.phase==='play')renderBond(app.questions[app.index]);resizeCanvas()},{passive:true});
  document.addEventListener('keydown',e=>{if(e.repeat)return;if(app.phase==='play'){if(['1','2','3'].includes(e.key)&&!app.answered){const btn=pieces.choices.children[Number(e.key)-1];if(btn)btn.click()}else if((e.key==='Enter'||e.key==='ArrowRight')&&app.answered){e.preventDefault();next()}}else if((e.key==='Enter'||e.key===' ')&&document.activeElement===document.body){e.preventDefault();if(app.phase==='intro')start();else if(app.phase==='outro')start()}});
  // Confetti starts at the very top of the screen and stays above every game element.
  const canvas=$('confetti'),ctx=canvas.getContext('2d');let flakes=[],frame=0,confettiRaf=null;
  function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
  function stopConfetti(){if(confettiRaf!==null)cancelAnimationFrame(confettiRaf);confettiRaf=null;flakes=[];ctx.clearRect(0,0,innerWidth,innerHeight)}
  function launchConfetti(){stopConfetti();resizeCanvas();frame=0;const colors=['#ffab42','#ff6f8d','#3c9edd','#32c58e','#fce16b','#9767df','#ffffff'];
    for(let i=0;i<210;i++)flakes.push({x:Math.random()*innerWidth,y:-15-Math.random()*innerHeight*.8,vx:(Math.random()-.5)*3.3,vy:2+Math.random()*3.3,rotation:Math.random()*6.28,spin:(Math.random()-.5)*.2,w:4+Math.random()*7,h:7+Math.random()*9,color:colors[i%colors.length],wiggle:Math.random()*6.28});
    function animate(){frame++;ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of flakes){p.y+=p.vy;p.x+=p.vx+Math.sin(frame*.05+p.wiggle)*.55;p.rotation+=p.spin;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
      flakes=flakes.filter(p=>p.y<innerHeight+35);if(flakes.length&&frame<520)confettiRaf=requestAnimationFrame(animate);else stopConfetti();}confettiRaf=requestAnimationFrame(animate);
  }
  resizeCanvas();
})();
</script>

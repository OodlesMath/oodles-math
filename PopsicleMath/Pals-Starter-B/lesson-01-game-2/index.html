.app{position:relative;z-index:5;width:100%;height:100%;padding:18px;display:flex;align-items:center;justify-content:center}
.shell{
  width:min(1160px,96vw);
  height:min(760px,94vh);
  background:rgba(255,255,255,.84);
  border:4px solid rgba(255,255,255,.95);
  box-shadow:0 20px 55px rgba(19,75,116,.2);
  border-radius:34px;
  backdrop-filter:blur(7px);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.topbar{
  min-height:78px;padding:12px 22px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  background:rgba(255,255,255,.72);
  border-bottom:3px solid rgba(27,87,131,.10);
}
.brand{font-weight:900;font-size:clamp(18px,2.2vw,26px);letter-spacing:.2px}
.brand .more{color:#ef4d63}.brand .fewer{color:#1aa6e7}
.title{font-size:clamp(22px,2.7vw,34px);font-weight:900;text-align:center;color:#173e78}
.hud{justify-self:end;display:flex;gap:10px}
.pill{
  min-width:112px;padding:8px 14px;border-radius:99px;background:#fff;
  box-shadow:0 5px 0 rgba(35,83,120,.12);font-weight:900;text-align:center;
  border:2px solid rgba(27,102,151,.10);font-size:14px
}
.pill.star{color:#c88700;background:#fff9d9}
.game{flex:1;min-height:0;padding:18px 24px 20px;display:flex;flex-direction:column;gap:14px}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0;flex:1}
.set-card{
  position:relative;min-width:0;background:rgba(255,255,255,.94);
  border:4px solid rgba(58,101,138,.22);border-radius:28px;
  padding:14px 16px 12px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  box-shadow:0 9px 0 rgba(57,96,129,.10),0 12px 22px rgba(32,75,108,.08);
  transition:.16s ease;cursor:pointer;overflow:hidden
}
.set-card.clickable:hover{transform:translateY(-5px) scale(1.012);border-color:#43b8e9;box-shadow:0 12px 0 rgba(26,146,200,.14),0 18px 28px rgba(32,75,108,.10)}
.set-card.wrong{animation:shake .34s ease;border-color:#ff6767;background:#fff1f1}
.set-card.correct{border-color:#5acb31;background:#f2ffed;box-shadow:0 9px 0 #d7f3ca}
.set-label{font-size:clamp(23px,2.8vw,34px);font-weight:900;line-height:1;margin:3px 0 10px}
.set-label.a{color:#8358ca}.set-label.b{color:#118fca}
.icons{
  width:100%;flex:1;min-height:110px;display:grid;
  grid-template-columns:repeat(5,1fr);align-content:center;justify-items:center;
  gap:3px 4px;padding:4px 10px
}
.obj{
  width:100%;display:grid;place-items:center;
  font-size:clamp(26px,4.0vw,48px);line-height:1.05;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.08));
  transform:translateZ(0)
}
.count{font-size:clamp(34px,4.5vw,52px);font-weight:900;color:#ff3b4d;line-height:1;margin-top:4px}
.mark{
  position:absolute;top:11px;right:13px;width:36px;height:36px;border-radius:50%;
  display:none;align-items:center;justify-content:center;font-size:25px;font-weight:900;color:#fff
}
.correct .mark{display:flex;background:#53c72b}.wrong .mark{display:flex;background:#ff5b5b}
.question-zone{
  background:rgba(255,255,255,.92);border:3px solid rgba(30,100,150,.13);
  border-radius:25px;padding:12px 16px 14px;box-shadow:0 8px 18px rgba(42,80,115,.08)
}
.question-row{display:flex;align-items:center;justify-content:center;gap:11px}
.question{
  text-align:center;font-size:clamp(22px,3.0vw,33px);font-weight:900;line-height:1.18;color:#173f78
}
.question strong.more{color:#ef4d63}.question strong.fewer{color:#159bda}
.speak{
  width:46px;height:46px;flex:0 0 46px;border:0;border-radius:50%;cursor:pointer;
  background:#3eb4ea;color:#fff;font-size:23px;box-shadow:0 5px 0 #138bc0;transition:.1s
}
.speak:active{transform:translateY(5px);box-shadow:none}
.help{text-align:center;color:#698198;font-size:13px;font-weight:800;margin-top:4px}
.feedback{height:23px;text-align:center;font-weight:900;font-size:16px;margin-top:3px}
.feedback.good{color:#349b18}.feedback.bad{color:#e4414d}
.controls{display:flex;justify-content:center;align-items:center;margin-top:7px;min-height:54px}
.next{
  border:0;border-radius:18px;padding:12px 28px;color:#fff;font-weight:900;font-size:18px;
  letter-spacing:.3px;background:#55c91b;box-shadow:0 6px 0 #319a10;cursor:pointer;
  transition:.12s;display:none
}
.next.show{display:inline-flex;align-items:center;gap:7px;animation:pulse 1.4s ease-in-out infinite}
.next:active{transform:translateY(6px);box-shadow:none;animation:none}
.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.answer{
  min-height:74px;border:3px solid rgba(255,255,255,.72);border-radius:20px;color:white;
  font-size:clamp(29px,4vw,40px);font-weight:900;cursor:pointer;transition:.12s;
  text-shadow:0 2px 2px rgba(0,0,0,.11)
}
.answer:nth-child(1){background:#8b62d9;box-shadow:0 7px 0 #6e45ba}
.answer:nth-child(2){background:#24aee4;box-shadow:0 7px 0 #1688b8}
.answer:nth-child(3){background:#ef5aa1;box-shadow:0 7px 0 #c93b7e}
.answer:nth-child(4){background:#ff8a28;box-shadow:0 7px 0 #d7660d}
.answer:hover{transform:translateY(-3px);filter:brightness(1.04)}
.answer:active{transform:translateY(6px);box-shadow:none}
.answer.wrong{animation:shake .34s ease;background:#ff5b5b!important;box-shadow:0 7px 0 #d83d3d!important}
.answer.correct{background:#55c91b!important;box-shadow:0 7px 0 #319a10!important}
.answer[disabled]{cursor:default}
.stage2line{font-size:clamp(15px,2vw,19px);font-weight:800;color:#536f88;text-align:center;margin-top:4px}
.stage2line b{color:#173f78}
.finish{
  position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.84);backdrop-filter:blur(7px)
}
.finish.show{display:flex}
.finish-card{
  width:min(520px,90%);background:#fff;border-radius:34px;padding:34px 28px;text-align:center;
  border:5px solid #fff;box-shadow:0 24px 70px rgba(19,70,110,.22)
}
.finish .emoji{font-size:76px;animation:bob 1.8s ease-in-out infinite}
.finish h1{margin:7px 0 2px;font-size:42px;color:#188fc8}
.finish p{margin:8px 0 20px;font-size:18px;font-weight:800;color:#60788f}
.scorebig{font-size:34px;font-weight:900;color:#d59800;background:#fff9d9;border:3px solid #ffe174;border-radius:20px;padding:12px}
.playagain{margin-top:22px;border:0;border-radius:18px;padding:14px 28px;background:#55c91b;color:white;font-weight:900;font-size:18px;box-shadow:0 6px 0 #319a10;cursor:pointer}
.playagain:active{transform:translateY(6px);box-shadow:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media(max-width:760px){
  .app{padding:8px}.shell{width:100%;height:100%;border-radius:22px}.topbar{min-height:66px;padding:8px 12px;grid-template-columns:1fr auto}
  .title{display:none}.brand{font-size:16px}.hud{gap:5px}.pill{min-width:88px;padding:6px 8px;font-size:12px}
  .game{padding:10px;gap:9px}.sets{gap:9px}.set-card{border-radius:20px;padding:10px 6px}
  .icons{padding:2px;gap:2px}.obj{font-size:clamp(22px,6vw,36px)}.count{font-size:34px}
  .question-zone{padding:9px;border-radius:19px}.answers{gap:7px}.answer{min-height:60px;border-radius:16px}
}
@media(max-height:650px){
  .shell{height:98vh}.topbar{min-height:60px}.game{padding:9px 18px;gap:7px}.set-card{padding-top:8px}.set-label{margin-bottom:4px}
  .icons{min-height:70px}.count{font-size:34px}.question-zone{padding:8px 12px 9px}.answers{margin-top:7px}.answer{min-height:58px}
}
</style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<canvas id="confetti"></canvas>
<div class="app">
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="more">MORE</span> or <span class="fewer">FEWER?</span></div>
      <div class="title">Compare the Sets</div>
      <div class="hud">
        <div class="pill" id="roundPill">Round 1 / 10</div>
        <div class="pill star">⭐ <span id="stars">0</span></div>
      </div>
    </header>

    <section class="game">
      <div class="sets">
        <article class="set-card clickable" id="setA" data-set="A" role="button" aria-label="Set A">
          <div class="mark">✓</div>
          <div class="set-label a">Set A</div>
          <div class="icons" id="iconsA"></div>
          <div class="count" id="countA">8</div>
        </article>
        <article class="set-card clickable" id="setB" data-set="B" role="button" aria-label="Set B">
          <div class="mark">✓</div>
          <div class="set-label b">Set B</div>
          <div class="icons" id="iconsB"></div>
          <div class="count" id="countB">3</div>
        </article>
      </div>

      <div class="question-zone">
        <div class="question-row">
          <div class="question" id="question">Which set has <strong class="more">more</strong>?</div>
          <button class="speak" id="speakBtn" aria-label="Read question aloud">🔊</button>
        </div>
        <div class="stage2line" id="stage2line" style="display:none"></div>
        <div class="answers" id="answers" style="display:none"></div>
        <div class="help" id="help">Click Set A or Set B.</div>
        <div class="feedback" id="feedback"></div>
        <div class="controls">
          <button class="next" id="nextBtn">NEXT <span>➜</span></button>
        </div>
      </div>
    </section>

    <section class="finish" id="finish">
      <div class="finish-card">
        <div class="emoji">🎉</div>
        <h1>Great Job!</h1>
        <p>You completed all 10 comparisons!</p>
        <div class="scorebig">⭐ <span id="finalStars">10</span> / 10</div>
        <button class="playagain" id="playAgain">PLAY AGAIN</button>
      </div>
    </section>
  </main>
</div>

<script>
(()=>{"use strict";
const TOTAL=10;
const objects=["🍎","⭐","🐟","🦋","🍓","🎈","🚗","🐞","🌽","🥕","🍦","🎒","🐤","🌸","🧸","🍊","🐠","🍉","🍪","🚀"];
let round=1,stars=0,stage=1,locked=false,current=null,lastPair="";
const $=id=>document.getElementById(id);
const setA=$("setA"),setB=$("setB"),question=$("question"),feedback=$("feedback"),help=$("help"),
      nextBtn=$("nextBtn"),answers=$("answers"),stage2line=$("stage2line");
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function beep(ok=true){
  try{
    const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.type=ok?"sine":"triangle";o.frequency.value=ok?660:210;
    g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.13,ctx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(ok?.22:.28));o.start();o.stop(ctx.currentTime+(ok?.24:.3));
  }catch(e){}
}
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.82;u.pitch=1.06;u.volume=1;
  speechSynthesis.speak(u);
}
function currentSpeech(){
  if(stage===1)return `Which set has ${current.kind}?`;
  const s=current.kind==="more"?current.large:current.small;
  const o=current.kind==="more"?current.small:current.large;
  return `How many ${current.kind}? Set ${s} has how many ${current.kind} than Set ${o}?`;
}
function drawIcons(el,emoji,n){
  el.innerHTML="";
  for(let i=0;i<n;i++){const d=document.createElement("div");d.className="obj";d.textContent=emoji;el.appendChild(d)}
}
function makeRound(){
  let a,b,pair;
  do{
    a=rand(3,15);
    const diff=rand(1,7);
    b=Math.random()<.5?a+diff:a-diff;
    if(b<3||b>15){b=a+(a<=8?diff:-diff)}
    pair=`${a}-${b}`;
  }while(a===b||pair===lastPair);
  lastPair=pair;
  const kind=Math.random()<.5?"more":"fewer";
  const imgs=shuffle(objects.slice());
  const large=a>b?"A":"B",small=a<b?"A":"B";
  current={a,b,kind,large,small,diff:Math.abs(a-b),emojiA:imgs[0],emojiB:imgs[1]};
}
function renderRound(){
  stage=1;locked=false;makeRound();
  $("roundPill").textContent=`Round ${round} / ${TOTAL}`;
  $("stars").textContent=stars;
  drawIcons($("iconsA"),current.emojiA,current.a);drawIcons($("iconsB"),current.emojiB,current.b);
  $("countA").textContent=current.a;$("countB").textContent=current.b;
  [setA,setB].forEach(c=>{c.className="set-card clickable";c.querySelector(".mark").textContent="✓"});
  const cls=current.kind==="more"?"more":"fewer";
  question.innerHTML=`Which set has <strong class="${cls}">${current.kind}</strong>?`;
  stage2line.style.display="none";answers.style.display="none";answers.innerHTML="";
  help.style.display="block";help.textContent="Click Set A or Set B.";
  feedback.textContent="";feedback.className="feedback";nextBtn.classList.remove("show");
  nextBtn.textContent="NEXT ➜";
  setTimeout(()=>speak(currentSpeech()),250);
}
function setWrong(card){
  card.classList.remove("wrong");void card.offsetWidth;card.classList.add("wrong");
  card.querySelector(".mark").textContent="×";beep(false);
  feedback.textContent="Try again!";feedback.className="feedback bad";
  setTimeout(()=>{card.classList.remove("wrong");card.querySelector(".mark").textContent="✓"},600);
}
function chooseSet(card){
  if(stage!==1||locked)return;
  const selected=card.dataset.set;
  const correct=current.kind==="more"?current.large:current.small;
  if(selected===correct){
    locked=true;card.classList.add("correct");card.querySelector(".mark").textContent="✓";
    setA.classList.remove("clickable");setB.classList.remove("clickable");
    feedback.textContent="Great job!";feedback.className="feedback good";beep(true);
    nextBtn.classList.add("show");help.style.display="none";
  }else setWrong(card);
}
function uniqueAnswers(correct){
  const s=new Set([correct]);
  const nearby=[correct-1,correct+1,correct-2,correct+2,correct-3,correct+3].filter(n=>n>=1&&n<=10);
  shuffle(nearby).forEach(n=>{if(s.size<4)s.add(n)});
  while(s.size<4){s.add(rand(1,10))}
  return shuffle([...s]);
}
function showStage2(){
  stage=2;locked=false;nextBtn.classList.remove("show");feedback.textContent="";
  [setA,setB].forEach(c=>{c.classList.remove("correct","wrong","clickable");c.querySelector(".mark").textContent="✓"});
  const s=current.kind==="more"?current.large:current.small;
  const o=current.kind==="more"?current.small:current.large;
  const cls=current.kind==="more"?"more":"fewer";
  question.innerHTML=`How many <strong class="${cls}">${current.kind}</strong>?`;
  stage2line.style.display="block";
  stage2line.innerHTML=`Set <b>${s}</b> has ___ <b>${current.kind}</b> than Set <b>${o}</b>.`;
  help.style.display="none";answers.style.display="grid";answers.innerHTML="";
  uniqueAnswers(current.diff).forEach(n=>{
    const b=document.createElement("button");b.className="answer";b.textContent=n;b.dataset.value=n;
    b.addEventListener("click",()=>chooseAnswer(b));answers.appendChild(b);
  });
  setTimeout(()=>speak(currentSpeech()),180);
}
function chooseAnswer(btn){
  if(stage!==2||locked)return;
  const v=Number(btn.dataset.value);
  if(v===current.diff){
    locked=true;btn.classList.add("correct");[...answers.children].forEach(b=>b.disabled=true);
    feedback.textContent="Excellent!";feedback.className="feedback good";beep(true);stars++;$("stars").textContent=stars;
    confettiBurst();nextBtn.textContent=round===TOTAL?"FINISH ★":"NEXT QUESTION ➜";nextBtn.classList.add("show");
  }else{
    btn.classList.remove("wrong");void btn.offsetWidth;btn.classList.add("wrong");beep(false);
    feedback.textContent="Try again!";feedback.className="feedback bad";setTimeout(()=>btn.classList.remove("wrong"),560);
  }
}
function advance(){
  if(stage===1){showStage2();return}
  if(round>=TOTAL){finishGame();return}
  round++;renderRound()
}
setA.addEventListener("click",()=>chooseSet(setA));setB.addEventListener("click",()=>chooseSet(setB));
nextBtn.addEventListener("click",advance);$("speakBtn").addEventListener("click",()=>speak(currentSpeech()));
$("playAgain").addEventListener("click",()=>{round=1;stars=0;lastPair="";$("finish").classList.remove("show");renderRound()});
function finishGame(){
  $("finalStars").textContent=stars;$("finish").classList.add("show");
  speak("Great job! You completed all ten comparisons!");for(let i=0;i<4;i++)setTimeout(confettiBurst,i*320)
}
const canvas=$("confetti"),ctx=canvas.getContext("2d");let parts=[];
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
function confettiBurst(){
  const colors=["#55c91b","#28a9e8","#ef5aa1","#ffd447","#8b62d9","#ff8a28"];
  for(let i=0;i<65;i++)parts.push({x:innerWidth/2,y:innerHeight*.60,vx:(Math.random()-.5)*12,vy:-Math.random()*10-4,g:.22,r:rand(3,6),c:pick(colors),life:95+rand(0,30),rot:Math.random()*6})
}
(function loop(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.rot+=.12;p.life--;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();
    if(p.life<=0||p.y>innerHeight+30)parts.splice(i,1)
  }requestAnimationFrame(loop)
})();
renderRound();
})();
</script>
</body>
</html>

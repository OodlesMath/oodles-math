                /* Top Bar */

            width: 100%; max-width: 800px; padding: 15px 20px;

        /* Main Container */

        /* Colorful Typography */
        h1, .colorful-title {

        }
        h2 { font-size: 28px; color: #1A365D; margin-bottom: 10px; font-weight: 900; text-shadow: 2px 2px 0px white; }
        p { font-size: 22px; margin-bottom: 10px; font-weight: 700; color: #2D3748; }

        /* Speaker Icon */
        .speaker-icon {
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            margin-left: 10px; transition: transform 0.2s; font-size: 24px;
            vertical-align: middle; background: white; border-radius: 50%;

        .speaker-icon:active { transform: scale(0.9) translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0); }
        .question-text-container { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 5px; }

        /* Buttons */
        .btn {
            background: var(--primary); color: white; border: none;
            padding: 12px 30px; font-size: 24px; font-weight: 900; font-family: 'Poppins', sans-serif;
            border-radius: 30px; cursor: pointer; box-shadow: 0 8px 0 #C0392B;
            transition: transform 0.1s, box-shadow 0.1s; text-transform: uppercase; letter-spacing: 1px; margin: 10px;
        }
        .btn:active { transform: translateY(8px); box-shadow: 0 0 0 #C0392B; }

        /* Pulse Animation for Next Button */
        @keyframes pulseNext { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .btn-next { background: var(--green-ans); box-shadow: 0 8px 0 #2E7D32; animation: pulseNext 2s infinite; }
        .btn-next:active { transform: translateY(8px) scale(1); box-shadow: 0 0 0 #2E7D32; animation: none; }

        /* Choices Grid (2x2) */
        .choices-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            margin-top: 10px; width: 100%; max-width: 450px;
        }
        .btn-choice {
            background: white; border: 4px solid var(--secondary); color: var(--secondary);
            font-size: 26px; font-weight: 900; padding: 12px 5px; border-radius: 20px;
            box-shadow: 0 6px 0 #06A5A3; cursor: pointer; font-family: 'Poppins', sans-serif;
            white-space: nowrap; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-choice:active { transform: translateY(6px); box-shadow: 0 0 0 #06A5A3; }

        /* Ten Frames */
        .double-ten-frame { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin: 5px 0; }
        .ten-frame {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 4px; padding: 8px; background: white; border: 4px solid #CBD5E0;
            border-radius: 12px; width: 250px; height: 105px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .small-ten-frame {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr);
            gap: 2px; padding: 4px; background: rgba(255,255,255,0.9); border: 3px solid #A0AEC0;

        }
        .tf-cell { border: 2px solid #E2E8F0; border-radius: 6px; display: flex; justify-content: center; align-items: center; position: relative; }
        .small-ten-frame .tf-cell { border-width: 1px; border-radius: 4px; }

        .dot {
            width: 30px; height: 30px; border-radius: 50%; background: var(--primary);
            box-shadow: inset -3px -3px 0 rgba(0,0,0,0.2), 0 2px 4px rgba(0,0,0,0.3);

        /* Horizontal Layout for Source Frames */
        .source-area {
            display: flex; flex-direction: row; align-items: center; justify-content: center;

        /* Mascot */

        /* Progress Bar */

        /* General Equations */
        .equation { font-size: 40px; font-weight: 900; color: #1A365D; margin: 5px 0; display: flex; align-items: center; justify-content: center; gap: 10px; text-shadow: 2px 2px 0px white; flex-wrap: wrap; text-align: center;}

        .mg-container {
            position: relative; width: 100%; height: 400px; border-radius: 20px;

            /* Custom hammer cursor */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 32 32"><text y="24" font-size="24">🔨</text></svg>'), pointer;
        }
        .timer-display {
            position: absolute; top: 10px; right: 15px; background: white; padding: 5px 15px;
            border-radius: 15px; font-weight: 900; color: #D32F2F; border: 3px solid #F6B93B;
            box-shadow: 0 4px 0 #F6B93B; z-index: 10; font-size: 20px;
        }
        .timer-warning { animation: pulseWarning 0.5s infinite alternate; }

        .mole-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;
            justify-items: center; align-content: center; height: 100%; padding: 10px;
            padding-top: 30px;
        }
        .mole-container { width: 100px; height: 110px; position: relative; overflow: hidden; }

        .mole-hole-bg {
            position: absolute; bottom: 10px; left: 10px; width: 80px; height: 35px;
            background: radial-gradient(ellipse at center, #000000 0%, #2E1503 80%);
            border-radius: 50%; box-shadow: 0 3px 0 rgba(255,255,255,0.2), inset 0 5px 10px rgba(0,0,0,0.9);
        }
        .mole-grass-front {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 30px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 30"><path d="M0,30 L0,15 Q10,0 20,15 T40,15 T60,15 T80,15 T100,15 L100,30 Z" fill="%232E7D32"/></svg>');
            background-size: cover;
            z-index: 2; pointer-events: none;
        }

        .mole {
            position: absolute; bottom: -80px; left: 15px; width: 70px; height: 80px;
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
            font-size: 65px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4)); touch-action: manipulation;
            z-index: 1; /* Behind grass, in front of hole */
        }
        .mole.up { bottom: 25px; }

        .bomb-pulse { animation: bombPulse 0.3s infinite alternate; }

        /* Animations */
        @keyframes bombPulse { from { filter: drop-shadow(0 0 5px red); transform: scale(1); } to { filter: drop-shadow(0 0 20px red); transform: scale(1.1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { transform: scale(0); } 80% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulseWarning { 0% { transform: scale(1); } 100% { transform: scale(1.1); background: #FFCDD2; } }

        /* Fireworks */
        .firework { position: absolute; border-radius: 50%; z-index: 1000; pointer-events: none; }

        @media (max-width: 600px) {
            h1, .colorful-title { font-size: 34px; margin-bottom: 10px;}
            h2 { font-size: 22px; }
            .btn { padding: 10px 20px; font-size: 20px; }
            .ten-frame { transform: scale(0.9); margin: -10px 0; }
            .equation { font-size: 28px; }
            .btn-choice { font-size: 20px; padding: 10px 5px; }

            .small-ten-frame { width: 110px; height: 48px; }
            .small-ten-frame .dot { width: 14px; height: 14px; }

            .c1 { transform: scale(0.78); transform-origin: left center; top: 9%; }
            .c2 { transform: scale(0.72); transform-origin: right center; top: 18%; }

            .mg-container { height: 350px; border-width: 5px; }

            .mole-hole-bg { width: 70px; height: 30px; left: 7px; bottom: 8px;}
            .mole.up { bottom: 20px; }
        }
    </style>

<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo" onerror="this.style.display='none'">
    <!-- Cute Sun -->

                <div class="sun-eye"></div>

            </div>
            <div class="sun-smile"></div>
        </div>
    </div>

    <div id="top-bar">
        <button class="icon-btn" onclick="goHome()" title="Home">🏠</button>
        <div id="score-display">⭐ <span id="score-val">0</span></div>
        <button class="icon-btn" onclick="toggleMute()" id="mute-btn" title="Sound">🔊</button>
    </div>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="screen-start" class="screen active" style="justify-content: center;">
            <div style="font-size: 90px; animation: bounce 2s infinite; filter: drop-shadow(0 10px 5px rgba(0,0,0,0.2));">🦁</div>
            <h1 class="colorful-title">Addition<br>Adventure!</h1>
            <p>Let's make 10 to add faster!</p>
            <button class="btn" onclick="startGame()">Play Now!</button>
        </div>

        <!-- Main Game Round: Addition Make 10 -->
        <div id="screen-main" class="screen">
            <h2>Magic Addition!</h2>
            <div class="progress-bg"><div class="progress-fill" id="p-game"></div></div>
            <div class="equation" id="game-eq">8 <span class="op-sign">+</span> 6 <span class="op-sign">=</span> ?</div>

            <div class="question-text-container" id="game-drag-prompt" style="color: #E53E3E; font-weight: bold;">
               <!-- Injected via JS -->
            </div>

            <!-- Source Frames -->
            <div class="source-area" id="game-source">
                <div class="source-group" id="game-source-group1"></div>
                <div class="source-group" id="game-source-group2"></div>
            </div>

            <!-- Target Frames -->
            <div class="double-ten-frame" id="game-target-frames"></div>

            <!-- Steps (Choices) -->
            <div id="game-step-choices" style="display: none; flex-direction: column; align-items: center; width: 100%;">
                <div class="question-text-container" id="game-q1"></div>
                <div class="choices-container" id="game-number-choices"></div>
            </div>

            <!-- Next Button Container -->
            <div id="next-container" style="display: none; width: 100%; text-align: center; margin-top: 20px;">
                <button class="btn btn-next" onclick="nextQuestion()">Next ➡️</button>
            </div>
        </div>

        <!-- Mini Game: Whack a Mole -->
        <div id="screen-mole" class="screen">
            <h2>Mini Game: Whack the Moles!</h2>
            <div class="question-text-container" id="mole-prompt-container">
               <!-- Injected via JS -->
            </div>
            <div class="mg-container mg-grass-bg">
                <div class="timer-display" id="mole-timer">Time: 15s</div>
                <div class="mole-grid" id="mole-grid">
                    <!-- Moles injected via JS -->
                </div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="screen-end" class="screen" style="justify-content: center;">
            <h1 class="colorful-title" style="font-size: 50px;">You Did It! 🎉</h1>
            <h2>Math Master!</h2>
            <div style="font-size: 80px; margin: 10px 0; animation: bounce 2s infinite;">🏅</div>
            <p>You earned <span id="final-score" style="font-weight: 900; color: #E53E3E; font-size: 36px;">0</span> stars!</p>
            <button class="btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <!-- Mascot Area -->
    <div id="mascot-area" style="display:none;">
        <div id="mascot">🦁</div>
        <div class="bubble" id="mascot-text">Hi! Let's learn!</div>
    </div>

    <script>
        // --- GAME STATE ---
        let score = 0;
        let questionIndex = 0;
        const questionsPerRound = 10;
        let currentQuestionData = {};
        let questionFailed = false;
        let roundQuestions = [];
        let isFinalMiniGame = false;

        let soundEnabled = true;
        let audioCtx = null;

        // --- AUDIO SYSTEM & TTS ---
        function initAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        function speakText(text) {
            if (!soundEnabled || !window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function setQuestionWithTTS(containerId, text) {
            const container = document.getElementById(containerId);
            const safeText = text.replace(/'/g, "\\\\'");
            container.innerHTML = `<p style="margin:0;">${text}</p> <span class="speaker-icon" onclick="speakText('${safeText}')" title="Listen">🔊</span>`;
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function playCorrect() {
            playTone(523.25, 'sine', 0.1, 0.1);
            setTimeout(() => playTone(659.25, 'sine', 0.2, 0.1), 100);
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200);
        }
        function playWrong() { playTone(300, 'sawtooth', 0.2, 0.1); setTimeout(() => playTone(250, 'sawtooth', 0.3, 0.1), 200); }
        function playExplosion() {
            playTone(100, 'sawtooth', 1.0, 0.4);
            setTimeout(() => playTone(80, 'square', 0.8, 0.5), 100);
        }
        function playPop() { playTone(800, 'square', 0.05, 0.05); }
        function playDrop() { playTone(400, 'sine', 0.1, 0.1); }
        function playClick() { playTone(600, 'triangle', 0.05, 0.05); }
        function playTada() {
            playTone(440, 'sine', 0.1); setTimeout(() => playTone(554, 'sine', 0.1), 100);
            setTimeout(() => playTone(659, 'sine', 0.1), 200); setTimeout(() => playTone(880, 'sine', 0.4), 300);
        }

        function toggleMute() {
            soundEnabled = !soundEnabled;
            document.getElementById('mute-btn').innerText = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) initAudio();
            else window.speechSynthesis.cancel();
        }

        // --- UI UTILITIES ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function updateScore(points) { score += points; document.getElementById('score-val').innerText = score; }
        function setMascot(text, emotion = 'happy') {
            document.getElementById('mascot-text').innerText = text;
            const mascotEmoji = document.getElementById('mascot');
            if(emotion === 'sad') mascotEmoji.innerText = '😿';
            else if(emotion === 'wow') mascotEmoji.innerText = '🤩';
            else mascotEmoji.innerText = '🦁';
        }
        function updateProgressBar() {
            const fill = document.getElementById(`p-game`);
            // Adjust progress relative to total questions per round
            if(fill) fill.style.width = `${(questionIndex / questionsPerRound) * 100}%`;
        }

        function generateRoundQuestions() {
            // Build every valid pair of one-digit addends whose sum is from 11 to 20.
            // With one-digit addends (1-9), the reachable sums are 11-18.
            // Treat reversed pairs (e.g. 7+5 and 5+7) as the same fact so no fact repeats.
            const pool = [];
            for (let a = 1; a <= 9; a++) {
                for (let b = a; b <= 9; b++) {
                    const sum = a + b;
                    if (sum >= 11 && sum <= 20) {
                        pool.push({ a, b, sum });
                    }
                }
            }

            // Fisher-Yates shuffle for an unbiased random order.
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            return pool.slice(0, questionsPerRound).map(q => {
                // Randomly swap the display order while keeping each fact unique.
                if (q.a !== q.b && Math.random() < 0.5) {
                    return { n1: q.b, n2: q.a, sum: q.sum };
                }
                return { n1: q.a, n2: q.b, sum: q.sum };
            });
        }

        function generateEquationChoices(correctSum) {
            let choices = new Set();
            let correctRemainder = correctSum - 10;
            let correctStr = `10 + ${correctRemainder} = ${correctSum}`;
            choices.add(correctStr);

            while(choices.size < 4) {
                let randomRemainder = correctRemainder + (Math.floor(Math.random() * 5) - 2);
                if(randomRemainder > 0 && randomRemainder <= 10 && randomRemainder !== correctRemainder) {
                    choices.add(`10 + ${randomRemainder} = ${10 + randomRemainder}`);
                } else {
                    let fallback = Math.floor(Math.random() * 10) + 1;
                    if(fallback !== correctRemainder) {
                        choices.add(`10 + ${fallback} = ${10 + fallback}`);
                    }
                }
            }
            return Array.from(choices).sort(() => Math.random() - 0.5);
        }

        // --- TEN FRAME BUILDERS ---
        function createEmptyDoubleFrame(containerId, isSmall = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for(let f = 0; f < 2; f++) {
                const tf = document.createElement('div');
                tf.className = isSmall ? 'small-ten-frame' : 'ten-frame';
                for (let i = 0; i < 10; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'tf-cell';
                    cell.style.gridColumn = Math.floor(i / 2) + 1;
                    cell.style.gridRow = (i % 2) + 1;
                    tf.appendChild(cell);
                }
                container.appendChild(tf);
            }
        }

        function fillSmallTenFrames(containerId, number, color) {
            const container = document.getElementById(containerId);
            const cells = container.querySelectorAll('.tf-cell');
            for(let i=0; i<number && i<cells.length; i++) {
                let d = document.createElement('div');
                d.className = 'dot';
                d.style.backgroundColor = color;
                cells[i].appendChild(d);
            }
        }

        // --- DRAG AND DROP GROUP ---
        function makeGroupDraggable(el, dotCount, dotColor, onDropSuccess) {
            el.onpointerdown = function(e) {
                e.preventDefault();
                el.setPointerCapture(e.pointerId);

                let clone = el.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.zIndex = '1000';
                clone.style.margin = '0';
                clone.style.pointerEvents = 'none';
                document.body.appendChild(clone);

                el.style.opacity = '0.3';

                let shiftX = el.offsetWidth / 2;
                let shiftY = el.offsetHeight / 2;

                function moveAt(clientX, clientY) {
                    clone.style.left = clientX - shiftX + 'px';
                    clone.style.top = clientY - shiftY + 'px';
                }
                moveAt(e.clientX, e.clientY);

                el.onpointermove = function(ev) { moveAt(ev.clientX, ev.clientY); };

                el.onpointerup = function(ev) {
                    el.onpointermove = null; el.onpointerup = null; el.releasePointerCapture(ev.pointerId);

                    let targetArea = document.getElementById('game-target-frames');
                    let targetRect = targetArea.getBoundingClientRect();
                    let dropped = false;

                    if(ev.clientX >= targetRect.left && ev.clientX <= targetRect.right &&
                       ev.clientY >= targetRect.top && ev.clientY <= targetRect.bottom) {
                        dropped = true;
                        clone.remove();
                        el.style.visibility = 'hidden';

                        let emptyCells = targetArea.querySelectorAll('.tf-cell:empty');
                        for(let i=0; i<dotCount; i++) {
                            if(emptyCells[i]) {
                                let d = document.createElement('div');
                                d.className = 'dot';
                                d.style.backgroundColor = dotColor;
                                d.style.animationDelay = `${i * 0.05}s`;
                                emptyCells[i].appendChild(d);
                            }
                        }
                        playDrop();
                        onDropSuccess();
                    }

                    if(!dropped) {
                        clone.remove();
                        el.style.opacity = '1';
                    }
                };
            };
        }

        // --- GAME FLOW ---
        function goHome() {
            if(confirm("Quit and go to the home screen?")) { resetGame(); showScreen('screen-start'); document.getElementById('mascot-area').style.display = 'none'; }
        }

        function startGame() {
            initAudio(); playClick(); score = 0; updateScore(0);
            roundQuestions = generateRoundQuestions();
            document.getElementById('mascot-area').style.display = 'flex';
            setMascot("Let's add the dots together!", "happy");
            startAdditionRound();
        }

        // --- MAIN ROUND: ADDITION (MAKE 10) ---
        function startAdditionRound() {
            questionIndex = 0;
            showScreen('screen-main');
            setQuestionWithTTS('game-drag-prompt', 'Drag the groups of dots into the big frames!');
            setQuestionWithTTS('game-q1', 'Which equation is correct?');
            loadQuestion();
        }

        function loadQuestion() {
            updateProgressBar();
            questionFailed = false; // Reset fail state for new question

            document.getElementById('game-source').style.display = 'flex';
            document.getElementById('game-drag-prompt').style.display = 'flex';
            document.getElementById('game-step-choices').style.display = 'none';
            document.getElementById('next-container').style.display = 'none'; // Hide next button

            // Use the pre-generated 10 unique equations for this game.
            const q = roundQuestions[questionIndex];
            const n1 = q.n1;
            const n2 = q.n2;
            const sum = q.sum;

            currentQuestionData = { n1, n2, sum, groupsDropped: 0 };

            document.getElementById('game-eq').innerHTML = `<span style="color:var(--red-dot)">${n1}</span> <span class="op-sign">+</span> <span style="color:var(--blue-dot)">${n2}</span> <span class="op-sign">=</span> ?`;

            // TTS dynamically reads the equation
            speakText(`${n1} plus ${n2}, equals what?`);

            let g1 = document.getElementById('game-source-group1');
            let g2 = document.getElementById('game-source-group2');
            g1.style.display = 'flex'; g1.style.visibility = 'visible'; g1.style.opacity = '1';
            g2.style.display = 'flex'; g2.style.visibility = 'visible'; g2.style.opacity = '1';

            createEmptyDoubleFrame('game-source-group1', true);
            createEmptyDoubleFrame('game-source-group2', true);

            if(n1 <= 10) g1.children[1].style.display = 'none';
            if(n2 <= 10) g2.children[1].style.display = 'none';

            fillSmallTenFrames('game-source-group1', n1, 'var(--red-dot)');
            fillSmallTenFrames('game-source-group2', n2, 'var(--blue-dot)');

            makeGroupDraggable(g1, n1, 'var(--red-dot)', handleGroupDrop);
            makeGroupDraggable(g2, n2, 'var(--blue-dot)', handleGroupDrop);

            createEmptyDoubleFrame('game-target-frames');
            setMascot(`Drag the dots into the big frames!`, "wow");
        }

        function handleGroupDrop() {
            currentQuestionData.groupsDropped++;
            if(currentQuestionData.groupsDropped === 2) {
                document.getElementById('game-source').style.display = 'none';
                document.getElementById('game-drag-prompt').style.display = 'none';
                document.getElementById('game-step-choices').style.display = 'flex';

                let choices = generateEquationChoices(currentQuestionData.sum);
                let container = document.getElementById('game-number-choices');
                container.innerHTML = '';

                choices.forEach(c => {
                    let b = document.createElement('button');
                    b.className = 'btn-choice';
                    b.innerText = c;
                    b.onclick = () => checkSum(c);
                    container.appendChild(b);
                });

                setMascot("Awesome! See how making a 10 makes it easier to add?", "happy");
            }
        }

        function checkSum(chosenEquation) {
            let correctRemainder = currentQuestionData.sum - 10;
            let correctStr = `10 + ${correctRemainder} = ${currentQuestionData.sum}`;

            if(chosenEquation === correctStr) {
                playCorrect();
                if(!questionFailed) updateScore(1); // Point only if not failed previously
                document.getElementById('game-step-choices').style.display = 'none';

                // Display the full expanded equation: 5 + 7 = 10 + 2 = 12
                document.getElementById('game-eq').innerHTML = `
                    <span style="color:var(--red-dot)">${currentQuestionData.n1}</span>
                    <span class="op-sign">+</span>
                    <span style="color:var(--blue-dot)">${currentQuestionData.n2}</span>
                    <span class="op-sign">=</span>
                    10 <span class="op-sign">+</span> ${correctRemainder}
                    <span class="op-sign">=</span>
                    <span style="color: var(--green-ans)">${currentQuestionData.sum}</span>
                `;

                setMascot(`Brilliant! ${currentQuestionData.n1} + ${currentQuestionData.n2} is the same as 10 + ${correctRemainder}!`, "wow");

                // Show the next button
                document.getElementById('next-container').style.display = 'block';
            } else {
                playWrong();
                questionFailed = true; // Mark as failed, no points for retries
                setMascot("Not quite right, check the dots in the frames again!", "sad");
            }
        }

        function nextQuestion() {
            document.getElementById('next-container').style.display = 'none';
            questionIndex++;
            updateProgressBar();

            if (questionIndex === 5) {
                // Mid-game mini-game
                startWhackAMole(false);
            } else if (questionIndex >= questionsPerRound) {
                // End-game mini-game
                startWhackAMole(true);
            } else {
                loadQuestion();
            }
        }

        // --- MINI GAME: WHACK A MOLE (AVOID BOMBS) ---
        let moleInterval;
        let moleTimerInterval;
        let moleActive = false;
        let timeLeft = 15;

        function startWhackAMole(isFinal) {
            isFinalMiniGame = isFinal;
            showScreen('screen-mole');
            timeLeft = 15; // 15 seconds for mini-game
            setMascot("Whack the moles! But AVOID the bombs!", "wow");
            setQuestionWithTTS('mole-prompt-container', 'Whack the moles! Avoid the bombs!');

            document.getElementById('mole-timer').innerText = `Time: ${timeLeft}s`;
            document.getElementById('mole-timer').classList.remove('timer-warning');

            const area = document.getElementById('mole-grid');
            area.innerHTML = '';

            // Generate 9 moles holes
            let holes = [];
            for(let i=0; i<9; i++) {
                let container = document.createElement('div');
                container.className = 'mole-container';
                container.innerHTML = `
                    <div class="mole-hole-bg"></div>
                    <div class="mole" id="mole-${i}">🐹</div>
                    <div class="mole-grass-front"></div>
                `;
                area.appendChild(container);
                holes.push(document.getElementById(`mole-${i}`));
            }

            moleActive = true;
            let whackedCount = 0;
            clearInterval(moleInterval);
            clearInterval(moleTimerInterval);

            // Timer logic
            moleTimerInterval = setInterval(() => {
                timeLeft--;
                let timerDisplay = document.getElementById('mole-timer');
                timerDisplay.innerText = `Time: ${timeLeft}s`;

                if(timeLeft <= 5) timerDisplay.classList.add('timer-warning');

                if(timeLeft <= 0) {
                    endMiniGame(whackedCount, false);
                }
            }, 1000);

            // Spawning logic
            moleInterval = setInterval(() => {
                if(!moleActive) return;

                let idx = Math.floor(Math.random() * 9);
                let mole = holes[idx];
                if(mole.classList.contains('up')) return;

                // 25% chance for a bomb
                let isBomb = Math.random() < 0.25;

                if(isBomb) {
                    mole.innerHTML = '💣';
                    mole.classList.add('bomb-pulse');
                } else {
                    mole.innerHTML = '🐹';
                    mole.classList.remove('bomb-pulse');
                }

                mole.classList.add('up');

                mole.onpointerdown = (e) => {
                    e.preventDefault();
                    if (isBomb) {
                        // Explode bomb
                        playExplosion();
                        mole.innerHTML = '💥';
                        mole.style.transform = 'scale(1.5)';
                        setMascot("Oh no! You hit a bomb! BOOM!", "sad");
                        endMiniGame(whackedCount, true);
                    } else {
                        // Good mole
                        playPop();
                        mole.innerHTML = '✨';
                        whackedCount++;
                        updateScore(1);
                        mole.classList.remove('up');
                        mole.onpointerdown = null;
                    }
                };

                // Auto hide
                setTimeout(() => {
                    if(mole.classList.contains('up') && moleActive) {
                        mole.classList.remove('up');
                        mole.onpointerdown = null;
                        mole.style.transform = 'scale(1)';
                    }
                }, 900);

            }, 550);
        }

        function endMiniGame(whackedCount, hitBomb) {
            moleActive = false;
            clearInterval(moleInterval);
            clearInterval(moleTimerInterval);

            const nextAction = isFinalMiniGame ? endGame : resumeMainGame;

            if(hitBomb) {
                setTimeout(nextAction, 2000);
            } else {
                playTada();
                setMascot(`Awesome! You whacked ${whackedCount} moles!`, "happy");
                setTimeout(nextAction, 3000);
            }
        }

        function resumeMainGame() {
            showScreen('screen-main');
            setMascot("Let's keep adding!", "happy");
            loadQuestion();
        }

        // --- END GAME & FIREWORKS ---
        function createFireworks() {
            if(!soundEnabled && Math.random()>0.5) return;
            const colors = ['#FF5A5F', '#08D9D6', '#FFD369', '#4CAF50', '#FF4757', '#1E90FF', '#FF00FF', '#FFFFFF'];
            const startX = 10 + Math.random() * 80; const startY = 10 + Math.random() * 50;

            for(let i=0; i<80; i++) {
                const fw = document.createElement('div'); fw.className = 'firework';
                const color = colors[Math.floor(Math.random() * colors.length)];
                fw.style.backgroundColor = color;
                fw.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
                fw.style.width = '8px'; fw.style.height = '8px';
                fw.style.left = startX + 'vw'; fw.style.top = startY + 'vh';
                document.body.appendChild(fw);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 80 + Math.random() * 200;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                fw.animate([
                    { transform: `translate(0,0) scale(1.5)`, opacity: 1 },
                    { transform: `translate(${tx}px, ${ty + 150}px) scale(0)`, opacity: 0 }
                ], { duration: 1500 + Math.random()*1200, easing: 'cubic-bezier(.17,.89,.32,1)' });
                setTimeout(() => fw.remove(), 2800);
            }
            playTone(800 + Math.random()*400, 'sine', 0.1, 0.05);
        }

        let fireworksInterval;
        function endGame() {
            document.getElementById('mascot-area').style.display = 'none';
            document.getElementById('final-score').innerText = score;
            showScreen('screen-end');
            playTada(); setTimeout(playTada, 500);
            let count = 0;
            fireworksInterval = setInterval(() => {
                createFireworks();
                count++;
                if(count > 20) clearInterval(fireworksInterval);
            }, 300);
        }

        function resetGame() {
            window.speechSynthesis.cancel();
            clearInterval(moleInterval);
            clearInterval(moleTimerInterval);
            clearInterval(fireworksInterval);
            score = 0; updateScore(0); moleActive = false;
            showScreen('screen-start');
        }
        document.getElementById('score-val').innerText = score;

    </script>
</body>

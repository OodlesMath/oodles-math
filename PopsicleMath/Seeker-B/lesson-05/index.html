<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Place Value Party - Ver 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        :root {
            /* Duolingo-inspired color palette */
            --c-green: #58CC02;
            --c-green-dark: #58A700;
            --c-blue: #1CB0F6;
            --c-blue-dark: #1899D6;
            --c-yellow: #FFC800;
            --c-yellow-dark: #F4A600;
            --c-red: #FF4B4B;
            --c-red-dark: #EA2B2B;
            --c-purple: #CE82FF;
            --c-purple-dark: #A559C0;
            --c-white: #FFFFFF;
            --c-gray-light: #F7F7F7;
            --c-gray-border: #E5E5E5;
            --c-text: #4B4B4B;

            --font-main: 'Poppins', sans-serif;
            --shadow-panel: 0 10px 25px rgba(0, 150, 255, 0.15);

            /* Variables for exactly matching fruit sizes */
            --fruit-size: 34px;
            --fruit-font: 1.95rem;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-main);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            position: relative;
            background: #8ed8f8;
            color: var(--c-text);
            touch-action: none;
        }

        #backgroundCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        #game-shell {
            --fit-scale: 1;
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(920px, calc(100vw - 16px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(6px, 1.2vh, 14px);
            transform: translate(-50%, -50%) scale(var(--fit-scale));
            transform-origin: center center;
            z-index: 10;
        }

        /* --- Header --- */
        header {
            width: 100%;
            max-width: 920px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 25px;
            border: 3px solid white;
            box-shadow: var(--shadow-panel);
            margin-bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .title-group h1 {
            color: var(--c-green);
            font-size: 1.8rem;
            margin: 0;
            font-weight: 900;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .speaker-btn {
            background: var(--c-blue);
            color: white;
            border: none;
            border-radius: 18px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 5px 0 var(--c-blue-dark);
            transition: all 0.1s;
        }
        .speaker-btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--c-blue-dark); }

        .score-board {
            background: var(--c-yellow);
            color: white;
            padding: 10px 20px;
            border-radius: 18px;
            font-size: 1.3rem;
            font-weight: 900;
            box-shadow: 0 5px 0 var(--c-yellow-dark);
            text-align: center;
            border: 2px solid white;
        }

        /* --- Main Stage --- */
        #main-stage {
            width: 100%;
            max-width: 920px;
            background: rgba(255, 255, 255, 0.93);
            border-radius: 30px;
            padding: 20px 30px;
            border: 4px solid white;
            box-shadow: var(--shadow-panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 0 0 auto;
            position: relative;
        }

        .instruction-text {
            font-size: 1.6rem;
            color: var(--c-purple);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 900;
            background: var(--c-gray-light);
            padding: 12px 30px;
            border-radius: 20px;
            border: 2px solid var(--c-gray-border);
            width: 100%;
        }

        /* --- Full Width Target Panel --- */
        .target-panel {
            width: 100%;
            background: #F0FDFA;
            border: 3px solid var(--c-green);
            border-radius: 25px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 20px rgba(88, 204, 2, 0.05);
        }

        .panel-title {
            text-align: center;
            font-weight: 900;
            margin-bottom: 20px;
            color: var(--c-text);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .full-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .column-header { font-weight: 900; font-size: 1.8rem; text-transform: uppercase; }
        .tens-header { color: var(--c-red); }
        .ones-header { color: var(--c-blue); }

        /* Drop Zones */
        .drop-column {
            background: var(--c-white);
            border: 4px dashed var(--c-gray-border);
            border-radius: 20px;
            width: 100%;
            min-height: 190px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
            transition: all 0.2s ease;
        }
        .drop-column.highlight {
            border-color: var(--c-yellow);
            background: #FFFCF0;
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(255, 200, 0, 0.2);
        }

        .drop-area {
            flex: 1; width: 100%;
            display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
            gap: 10px;
            transition: min-height .35s ease, padding .35s ease;
        }

        .target-panel.completed-layout .drop-column {
            min-height: 150px;
        }
        .target-panel.completed-layout .drop-area {
            align-content: center;
        }

        /* Unified Source Zone */
        .unified-tray-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .unified-tray-wrap.hidden-tray {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            display: none;
        }

        .tray-label {
            font-weight: 800;
            color: var(--c-purple);
            font-size: 1.3rem;
            margin-bottom: -15px;
            background: white;
            padding: 8px 25px;
            border-radius: 20px;
            border: 3px solid var(--c-purple);
            z-index: 2;
        }

        .source-area {
            background: #FAF5FF;
            border: 4px solid var(--c-purple);
            border-radius: 25px;
            width: 100%;
            min-height: 120px;
            padding: 30px 20px 20px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 10px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
        }

        /* --- Uniform Cards --- */
        .draggable-item {
            cursor: grab;
            touch-action: none;
            transition: transform 0.1s;
            position: relative;
        }

        .dragging {
            opacity: 0.94;
            z-index: 1000 !important;
            cursor: grabbing;
            pointer-events: none;
            box-shadow: 0 15px 20px rgba(0,0,0,0.3) !important;
            will-change: left, top, transform;
        }

        /* IDENTICAL SIZE FRUITS */
        .tens-card span, .ones-card span {
            width: var(--fruit-size);
            height: var(--fruit-size);
            font-size: var(--fruit-font);
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.25));
            line-height: 1;
        }

        .ones-card {
            background: #E0F2FE;
            border: 3px solid var(--c-blue);
            box-shadow: 0 6px 0 var(--c-blue-dark);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 7px;
        }

        .tens-card {
            background: #FFE4E6;
            border: 3px solid var(--c-red);
            box-shadow: 0 6px 0 var(--c-red-dark);
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(5, var(--fruit-size));
            grid-template-rows: repeat(2, var(--fruit-size));
            gap: 1px;
            padding: 6px;
            align-items: center;
            justify-items: center;
        }

        /* --- Footer Options --- */
        .options-bar {
            width: 100%;
            padding-top: 12px;
            margin-top: 12px;
            border-top: 3px dashed var(--c-gray-border);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ans-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

        .ans-btn {
            background: var(--c-white);
            border: 3px solid var(--c-gray-border);
            border-radius: 20px;
            padding: 15px 40px;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--c-blue);
            cursor: pointer;
            box-shadow: 0 6px 0 var(--c-gray-border);
            transition: all 0.1s;
        }
        .ans-btn:not(.locked):hover { background: #F0F9FF; border-color: var(--c-blue); box-shadow: 0 6px 0 var(--c-blue-dark); }
        .ans-btn:not(.locked):active { transform: translateY(6px); box-shadow: 0 0 0 var(--c-blue-dark); }
        .ans-btn.locked { background: var(--c-gray-light); color: #AFAFAF; cursor: not-allowed; transform: translateY(6px); box-shadow: none; border-color: var(--c-gray-border); }

        /* --- Overlays & Modals --- */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; text-align: center;
            backdrop-filter: blur(8px);
        }
        .hidden { display: none !important; }

        .start-btn {
            background: var(--c-green);
            color: white;
            border: 4px solid white;
            padding: 20px 60px;
            font-size: 2.2rem;
            font-weight: 900;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 0 var(--c-green-dark), 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 210;
        }
        .start-btn:active { transform: translateY(8px); box-shadow: 0 0 0 var(--c-green-dark), 0 5px 10px rgba(0,0,0,0.2); }

        /* --- Fullscreen Game Overlay Adjustments --- */
        #game-overlay {
            background: rgba(0, 0, 0, 0.5);
            justify-content: flex-start;
            padding-top: 40px;
        }

        .mini-game-ui {
            z-index: 210;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 205;
            touch-action: none;
            cursor: crosshair;
        }

        .mini-instruction-block {
            transition: opacity .28s ease, transform .28s ease, max-height .28s ease, margin .28s ease;
            max-height: 180px;
            overflow: hidden;
        }
        #game-overlay.mini-running .mini-instruction-block {
            opacity: 0;
            transform: translateY(-12px) scale(.96);
            max-height: 0;
            margin: 0;
            pointer-events: none;
        }
        #game-overlay.mini-running {
            padding-top: clamp(10px, 2vh, 24px);
        }
        #game-overlay.mini-running .mini-game-ui {
            width: min(92vw, 420px);
            background: rgba(255,255,255,.16);
            border: 2px solid rgba(255,255,255,.36);
            border-radius: 24px;
            padding: 8px 18px 10px;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0,0,0,.12);
        }

        .feedback-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px 50px; border-radius: 30px;
            font-size: 3rem; font-weight: 900;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 500; display: none; text-transform: uppercase;
            border: 5px solid;
            animation: popOut 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
        }

        #fireworks-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 300; }

        /* --- Responsiveness --- */
        @media (max-width: 850px) {
            :root { --fruit-size: 28px; --fruit-font: 1.65rem; }
            header { padding: 10px 14px; border-radius: 20px; }
            .title-group h1 { font-size: 1.35rem; }
            .controls { gap: 8px; }
            .speaker-btn { width: 44px; height: 44px; border-radius: 15px; font-size: 1.25rem; }
            .score-board { padding: 8px 13px; font-size: 1.05rem; }
            #main-stage { padding: 12px; border-radius: 24px; }
            .instruction-text { font-size: 1.15rem; padding: 8px 14px; margin-bottom: 10px; }
            .target-panel { padding: 11px; border-radius: 20px; }
            .panel-title { font-size: 1.35rem; margin-bottom: 8px; }
            .chart-grid { gap: 10px; }
            .column-header { font-size: 1.25rem; }
            .drop-column { min-height: 150px; padding: 8px; border-width: 3px; }
            .target-panel.completed-layout .drop-column { min-height: 125px; }
            .unified-tray-wrap { margin-top: 10px; }
            .tray-label { font-size: .95rem; padding: 5px 14px; margin-bottom: -11px; }
            .source-area { min-height: 95px; padding: 22px 8px 8px; border-width: 3px; }
            .ans-btn { font-size: 1.55rem; padding: 9px 24px; border-radius: 16px; }
            .options-bar { margin-top: 9px; padding-top: 9px; }
            .options-bar .panel-title { font-size: 1.05rem; }
            .ans-grid { gap: 10px; }
        }

        @media (max-width: 550px) {
            :root { --fruit-size: 21px; --fruit-font: 1.28rem; }
            #game-shell { width: min(390px, calc(100vw - 10px)); }
            header { padding: 8px 10px; border-width: 2px; }
            .title-group h1 { font-size: 1.08rem; letter-spacing: 0; }
            .speaker-btn { width: 38px; height: 38px; font-size: 1.05rem; }
            .score-board { padding: 7px 9px; font-size: .9rem; }
            #main-stage { padding: 8px; border-width: 3px; }
            .instruction-text { font-size: .95rem; padding: 6px 8px; margin-bottom: 7px; border-radius: 14px; }
            .target-panel { padding: 7px; border-width: 2px; }
            .panel-title { font-size: 1.06rem; margin-bottom: 5px; }
            .chart-grid { gap: 6px; }
            .full-column { gap: 5px; }
            .column-header { font-size: 1rem; }
            .drop-column { min-height: 118px; padding: 5px; border-width: 2px; border-radius: 14px; }
            .target-panel.completed-layout .drop-column { min-height: 104px; }
            .drop-area { gap: 5px; }
            .ones-card { padding: 4px; border-width: 2px; border-radius: 10px; box-shadow: 0 4px 0 var(--c-blue-dark); }
            .tens-card { padding: 4px; border-width: 2px; border-radius: 10px; box-shadow: 0 4px 0 var(--c-red-dark); }
            .unified-tray-wrap { margin-top: 7px; }
            .tray-label { font-size: .78rem; padding: 4px 10px; border-width: 2px; }
            .source-area { min-height: 78px; padding: 18px 5px 5px; gap: 5px; border-width: 2px; border-radius: 14px; }
            .options-bar { margin-top: 6px; padding-top: 6px; }
            .options-bar .panel-title { font-size: .85rem; margin-bottom: 5px !important; }
            .ans-grid { gap: 7px; }
            .ans-btn { font-size: 1.25rem; padding: 7px 18px; border-width: 2px; box-shadow: 0 4px 0 var(--c-gray-border); }
            .start-btn { font-size: 1.25rem; padding: 13px 28px; }
            .feedback-label { font-size: 1.6rem; width: 90%; text-align: center; }
            .mini-game-ui { transform: scale(.9); transform-origin: top center; }
        }

        @media (max-height: 700px) and (min-width: 650px) {
            :root { --fruit-size: 26px; --fruit-font: 1.5rem; }
            header { padding-top: 8px; padding-bottom: 8px; }
            .speaker-btn { width: 40px; height: 40px; }
            #main-stage { padding: 9px 13px; }
            .instruction-text { margin-bottom: 7px; padding: 6px 12px; font-size: 1.05rem; }
            .target-panel { padding: 8px 12px; }
            .panel-title { margin-bottom: 5px; font-size: 1.15rem; }
            .column-header { font-size: 1.05rem; }
            .drop-column { min-height: 120px; padding: 6px; }
            .target-panel.completed-layout .drop-column { min-height: 105px; }
            .unified-tray-wrap { margin-top: 7px; }
            .source-area { min-height: 78px; padding: 18px 8px 6px; }
            .tray-label { font-size: .82rem; padding: 4px 12px; }
            .options-bar { margin-top: 6px; padding-top: 6px; }
            .options-bar .panel-title { font-size: .9rem; margin-bottom: 4px !important; }
            .ans-btn { font-size: 1.25rem; padding: 6px 22px; }
        }
    </style>
</head>
<body>
    <canvas id="backgroundCanvas" aria-hidden="true"></canvas>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <div id="game-shell">
    <header>
        <div class="title-group">
            <h1>🍎 Fruit Place Value!</h1>
        </div>
        <div class="controls">
            <button class="speaker-btn" onclick="speakInstruction()" title="Listen">🔊</button>
            <div class="score-board">Score: <span id="score-val">0</span></div>
        </div>
    </header>

    <main id="main-stage">
        <div id="instruction" class="instruction-text">Drag ALL fruits to the chart! 👇</div>

        <div class="target-panel">
            <div class="panel-title">Place Value Chart 📊</div>

            <div class="chart-grid">
                <!-- TENS COLUMN (Left) -->
                <div class="full-column">
                    <div class="column-header tens-header">Tens</div>
                    <div id="tens-col" class="drop-column">
                        <div id="tens-drop" class="drop-area"></div>
                    </div>
                </div>

                <!-- ONES COLUMN (Right) -->
                <div class="full-column">
                    <div class="column-header ones-header">Ones</div>
                    <div id="ones-col" class="drop-column">
                        <div id="ones-drop" class="drop-area"></div>
                    </div>
                </div>
            </div>

            <!-- Unified Source Box -->
            <div id="unified-tray-wrap" class="unified-tray-wrap">
                <div class="tray-label">Drag Fruits From Here ⬆️</div>
                <div id="unified-source" class="source-area"></div>
            </div>
        </div>

        <div class="options-bar">
            <div class="panel-title" style="color: var(--c-purple); margin-bottom: 10px;">How Many? (Drag First!)</div>
            <div id="ans-grid" class="ans-grid"></div>
        </div>
    </main>
    </div>

    <!-- Overlays -->
    <div id="start-overlay" class="overlay">
        <h1 style="font-size: clamp(3rem, 8vw, 4.5rem); font-weight: 900; color: var(--c-green); margin-bottom: 10px;">Fruit Place Value!</h1>
        <div style="font-size: clamp(4rem, 10vw, 6rem); margin-bottom: 30px; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2));">🍓🍎🍉</div>
        <button class="start-btn" onclick="startGame()">START LEARNING ▶</button>
    </div>

    <!-- Fullscreen Mini-game Overlay -->
    <div id="game-overlay" class="overlay hidden">
        <canvas id="game-canvas"></canvas>

        <div class="mini-game-ui">
            <div class="mini-instruction-block">
                <h2 style="font-size: clamp(2.1rem, 6vw, 3.5rem); font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.3); margin: 0 0 8px;">CATCH THE FRUITS!</h2>
                <p style="font-size: clamp(1rem, 3vw, 1.25rem); font-weight: 700; color: var(--c-purple-dark); margin: 0 0 12px; background: white; padding: 8px 22px; border-radius: 25px; border: 3px solid var(--c-purple); box-shadow: 0 6px 0 var(--c-purple-dark);">Drag the basket to catch! 🧺</p>
            </div>
            <div style="font-size: 2.2rem; font-weight: 900; color: white; text-shadow: 0 3px 5px rgba(0,0,0,0.5); margin-bottom: 15px;">Time: <span id="timer-val">15</span>s</div>

            <div id="game-score-display" style="font-size: 3rem; font-weight: 900; color: var(--c-yellow); text-shadow: 0 4px 6px rgba(0,0,0,0.5); margin-top: 20px;">Caught: 0</div>
            <button id="game-start-btn" class="start-btn" style="margin-top: 25px;" onclick="startGameMini()">READY, GO!</button>
        </div>
    </div>

    <div id="win-overlay" class="overlay hidden">
        <canvas id="fireworks-canvas"></canvas>
        <div style="font-size: clamp(5rem, 15vw, 8rem); position: relative; z-index: 10; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));">🏆✨</div>
        <h1 style="font-size: clamp(3rem, 8vw, 5rem); font-weight: 900; color: var(--c-yellow-dark); position: relative; z-index: 10; text-shadow: 0 4px 10px white;">YOU WON!</h1>
        <div style="font-size: 2.5rem; font-weight: 900; color: var(--c-blue); margin-bottom: 40px; position: relative; z-index: 10; background: white; padding: 15px 50px; border-radius: 30px; border: 4px solid var(--c-blue); box-shadow: 0 8px 0 var(--c-blue-dark);">Total Score: <span id="final-score">0</span></div>
        <button class="start-btn" style="position: relative; z-index: 10; background: var(--c-purple); box-shadow: 0 8px 0 var(--c-purple-dark), 0 15px 20px rgba(0,0,0,0.2); border-color: white;" onclick="location.reload()">PLAY AGAIN ↺</button>
    </div>

    <div id="feedback" class="feedback-label"></div>


    <script>
    (() => {
        const canvas = document.getElementById('backgroundCanvas');
        const bctx = canvas.getContext('2d', { alpha: false });
        let w = 0, h = 0, clouds = [], flowers = [], butterflies = [], t = 0;

        function resizeBg() {
            const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
            canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
            bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            clouds = Array.from({length: w < 600 ? 3 : 5}, (_, i) => ({
                x: (i + .3) * w / (w < 600 ? 3 : 5), y: h * (.09 + Math.random() * .26),
                r: 18 + Math.random() * (w < 600 ? 14 : 24), speed: .06 + Math.random() * .08, a: .75 + Math.random() * .2
            }));
            flowers = Array.from({length: w < 600 ? 10 : 18}, () => ({
                x: Math.random() * w, y: h * (.81 + Math.random() * .15), s: .45 + Math.random() * .5,
                c: ['#ff7aa2','#ffd84d','#ffffff','#b886ff','#5ecbff'][Math.floor(Math.random()*5)]
            }));
            butterflies = Array.from({length: w < 600 ? 2 : 4}, (_,i) => ({
                x: Math.random()*w, y: h*(.28+Math.random()*.2), phase: i*1.6, speed: .12+Math.random()*.12,
                c: ['#ff5d8f','#ffd43b','#8b5cf6','#1cb0f6'][i%4]
            }));
        }

        function cloud(c) {
            bctx.save(); bctx.globalAlpha = c.a; bctx.fillStyle = '#fff';
            bctx.shadowColor = 'rgba(70,140,190,.12)'; bctx.shadowBlur = 12; bctx.shadowOffsetY = 5;
            bctx.beginPath();
            bctx.arc(c.x, c.y, c.r*.68, 0, Math.PI*2);
            bctx.arc(c.x+c.r*.65, c.y-c.r*.24, c.r*.82, 0, Math.PI*2);
            bctx.arc(c.x+c.r*1.35, c.y, c.r*.62, 0, Math.PI*2);
            bctx.roundRect(c.x-c.r*.65, c.y, c.r*2.55, c.r*.7, c.r*.34); bctx.fill(); bctx.restore();
        }

        function flower(f) {
            bctx.save(); bctx.translate(f.x,f.y); bctx.scale(f.s,f.s);
            bctx.strokeStyle='#369c46'; bctx.lineWidth=2.5; bctx.beginPath(); bctx.moveTo(0,4); bctx.lineTo(0,23); bctx.stroke();
            bctx.fillStyle=f.c;
            for(let i=0;i<6;i++){ bctx.save(); bctx.rotate(i*Math.PI/3); bctx.beginPath(); bctx.ellipse(0,-8,4.8,8.2,0,0,Math.PI*2); bctx.fill(); bctx.restore(); }
            bctx.fillStyle='#ffd84d'; bctx.beginPath(); bctx.arc(0,0,4.8,0,Math.PI*2); bctx.fill(); bctx.restore();
        }

        function drawBg(){
            t += .016;
            const sky=bctx.createLinearGradient(0,0,0,h*.75); sky.addColorStop(0,'#73d3ff'); sky.addColorStop(.62,'#b9ecff'); sky.addColorStop(1,'#e7fbff');
            bctx.fillStyle=sky; bctx.fillRect(0,0,w,h);
            // sun
            const sr=Math.max(30,Math.min(w,h)*.052), sx=Math.min(w-65,Math.max(58,w*.11)), sy=Math.max(58,h*.11);
            bctx.fillStyle='rgba(255,217,83,.2)'; bctx.beginPath(); bctx.arc(sx,sy,sr*1.75,0,Math.PI*2); bctx.fill();
            bctx.fillStyle='#ffd85c'; bctx.beginPath(); bctx.arc(sx,sy,sr,0,Math.PI*2); bctx.fill();
            // rainbow
            bctx.save(); bctx.translate(w*.5,h*.71); bctx.lineCap='round'; const lw=Math.max(10,Math.min(19,w*.014)); bctx.lineWidth=lw;
            const cols=['#ff6b6b','#ff9f43','#ffd93d','#62d843','#44b9f3','#b887ff']; const rr=Math.min(w*.35,h*.44,400);
            cols.forEach((c,i)=>{ bctx.strokeStyle=c; bctx.globalAlpha=.78; bctx.beginPath(); bctx.arc(0,0,rr-i*lw,Math.PI,0); bctx.stroke(); }); bctx.restore();
            clouds.forEach(c=>{ c.x-=c.speed; if(c.x+c.r*3<0)c.x=w+c.r*2; cloud(c); });
            // distant hills
            bctx.fillStyle='#8bd34b'; bctx.beginPath(); bctx.moveTo(0,h); bctx.lineTo(0,h*.67); bctx.quadraticCurveTo(w*.22,h*.53,w*.46,h*.68); bctx.quadraticCurveTo(w*.72,h*.55,w,h*.67); bctx.lineTo(w,h); bctx.fill();
            bctx.fillStyle='#5fc43b'; bctx.beginPath(); bctx.moveTo(0,h); bctx.lineTo(0,h*.73); bctx.quadraticCurveTo(w*.35,h*.64,w*.62,h*.75); bctx.quadraticCurveTo(w*.82,h*.68,w,h*.72); bctx.lineTo(w,h); bctx.fill();
            // foreground grass
            bctx.fillStyle='#48b82f'; bctx.fillRect(0,h*.83,w,h*.17);
            bctx.fillStyle='rgba(255,255,255,.2)'; bctx.fillRect(0,h*.83,w,4);
            flowers.forEach(flower);
            butterflies.forEach(b=>{ b.x+=b.speed; b.phase+=.07; if(b.x>w+20)b.x=-20; const yy=b.y+Math.sin(b.phase)*9; bctx.save(); bctx.translate(b.x,yy); bctx.fillStyle=b.c; bctx.globalAlpha=.85; const flap=.55+Math.abs(Math.sin(b.phase))*1.4; bctx.beginPath(); bctx.ellipse(-5,0,5,7*flap,-.4,0,Math.PI*2); bctx.ellipse(5,0,5,7*flap,.4,0,Math.PI*2); bctx.fill(); bctx.fillStyle='#374151'; bctx.fillRect(-1,-6,2,12); bctx.restore(); });
            requestAnimationFrame(drawBg);
        }
        window.addEventListener('resize', resizeBg); resizeBg(); requestAnimationFrame(drawBg);
    })();
    </script>

    <script>
        const QUESTIONS = [
            { num: 14, item: '🍎', options: [14, 41, 15] },
            { num: 23, item: '🍓', options: [23, 32, 22] },
            { num: 12, item: '🍇', options: [12, 21, 11] },
            { num: 25, item: '🍊', options: [25, 52, 24] },
            { num: 31, item: '🍉', options: [31, 13, 30] },
            { num: 15, item: '🍌', options: [15, 51, 14] },
            { num: 22, item: '🍒', options: [22, 12, 23] },
            { num: 24, item: '🍍', options: [24, 42, 25] },
            { num: 13, item: '🥝', options: [13, 31, 12] },
            { num: 32, item: '🍑', options: [32, 23, 33] }
        ];

        // V7 Diverse Fruits list for the minigame
        const ALL_FRUITS = ['🍎', '🍌', '🍓', '🍊', '🍇', '🍉', '🍒', '🍍', '🥝', '🍑'];

        let state = {
            idx: 0,
            score: 0,
            dropped: 0,
            totalToDrag: 0,
            soundStarted: false
        };

        function fitGameShell() {
            const shell = document.getElementById('game-shell');
            if (!shell) return;
            shell.style.setProperty('--fit-scale', '1');
            const naturalW = shell.offsetWidth || 1;
            const naturalH = shell.scrollHeight || 1;
            const pad = 10;
            const scale = Math.min(1, (window.innerWidth - pad * 2) / naturalW, (window.innerHeight - pad * 2) / naturalH);
            shell.style.setProperty('--fit-scale', Math.max(.45, scale).toFixed(4));
        }
        window.addEventListener('resize', () => requestAnimationFrame(fitGameShell));
        window.addEventListener('load', () => { requestAnimationFrame(fitGameShell); setTimeout(fitGameShell, 350); });

        const sounds = {
            pop: new Tone.Synth({ oscillator: { type: 'sine' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 } }).toDestination(),
            catch: new Tone.Synth({ oscillator: { type: 'triangle' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.2 } }).toDestination(),
            correct: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.4, sustain: 0.2, release: 1 } }).toDestination(),
            wrong: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 2, envelope: { attack: 0.01, decay: 0.4, sustain: 0, release: 0.1 } }).toDestination(),
            fanfare: new Tone.PolySynth(Tone.Synth, { oscillator: { type: "square" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.5, release: 1.5 } }).toDestination()
        };

        function playSfx(s) {
            if(!state.soundStarted) return;
            try {
                if(s==='correct') sounds.correct.triggerAttackRelease(['C5','E5','G5','C6'], '4n');
                else if(s==='wrong') sounds.wrong.triggerAttackRelease('G2', '8n');
                else if(s==='catch') sounds.catch.triggerAttackRelease('A5', '16n');
                else if(s==='fanfare') sounds.fanfare.triggerAttackRelease(['C5','E5','G5'], '2n');
                else sounds.pop.triggerAttackRelease('E5', '32n');
            } catch(e) { console.log("Audio play error ignored."); }
        }

        function speakInstruction() {
            window.speechSynthesis.cancel();
            const text = (state.dropped < state.totalToDrag) ? "Drag all the fruits to the chart!" : `Choose the number for ${QUESTIONS[state.idx].num}.`;
            const ut = new SpeechSynthesisUtterance(text);
            ut.lang = 'en-US';
            ut.rate = 0.85;
            ut.pitch = 1.1;
            window.speechSynthesis.speak(ut);
        }

        function showFeedback(text, color) {
            const f = document.getElementById('feedback');
            const newF = f.cloneNode(true);
            f.parentNode.replaceChild(newF, f);

            newF.innerText = text;
            newF.style.color = color;
            newF.style.borderColor = color;
            newF.style.display = 'block';

            setTimeout(() => newF.style.display = 'none', 1500);
        }

        function startGame() {
            if(Tone.context.state !== 'running') { Tone.start(); }
            state.soundStarted = true;
            document.getElementById('start-overlay').classList.add('hidden');
            QUESTIONS.sort(() => Math.random() - 0.5);
            loadQuestion();
        }

        function loadQuestion() {
            const q = QUESTIONS[state.idx];
            const tens = Math.floor(q.num / 10);
            const ones = q.num % 10;

            state.dropped = 0;
            state.totalToDrag = tens + ones;

            const trayWrap = document.getElementById('unified-tray-wrap');
            trayWrap.classList.remove('hidden-tray');
            document.querySelector('.target-panel').classList.remove('completed-layout');

            const unifiedSource = document.getElementById('unified-source');
            unifiedSource.innerHTML = '';
            document.getElementById('tens-drop').innerHTML = '';
            document.getElementById('ones-drop').innerHTML = '';
            document.getElementById('ans-grid').innerHTML = '';

            const inst = document.getElementById('instruction');
            inst.innerText = "Drag ALL fruits to the chart! 👇";
            inst.style.color = "var(--c-purple)";
            inst.style.background = "var(--c-gray-light)";

            let elements = [];
            for(let i=0; i<tens; i++) elements.push(createBlock('tens', q.item));
            for(let i=0; i<ones; i++) elements.push(createBlock('ones', q.item));

            elements.forEach(el => unifiedSource.appendChild(el));

            const opts = [...q.options].sort(() => Math.random() - 0.5);
            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "ans-btn locked";
                btn.innerText = opt;
                btn.disabled = true;
                btn.onclick = () => checkAnswer(opt, q.num, btn);
                document.getElementById('ans-grid').appendChild(btn);
            });

            requestAnimationFrame(fitGameShell);
            setTimeout(() => { speakInstruction(); fitGameShell(); }, 500);
        }

        function createBlock(type, emoji) {
            const div = document.createElement('div');
            div.className = `draggable-item ${type==='tens' ? 'tens-card' : 'ones-card'}`;
            div.dataset.type = type;

            if (type === 'tens') {
                let inner = '';
                for(let i=0; i<10; i++) inner += `<span>${emoji}</span>`;
                div.innerHTML = inner;
            } else {
                div.innerHTML = `<span>${emoji}</span>`;
            }

            div.onpointerdown = handlePointerDown;
            return div;
        }

        let dragItem = null, placeholder = null, startX = 0, startY = 0;
        let dragPointerId = null, dragScale = 1;

        function clearDragStyles(item) {
            if(!item) return;
            item.style.position = '';
            item.style.width = '';
            item.style.height = '';
            item.style.left = '';
            item.style.top = '';
            item.style.margin = '';
            item.style.transform = '';
            item.style.transformOrigin = '';
            item.style.transition = '';
            item.style.zIndex = '';
        }

        function handlePointerDown(e) {
            if(e.currentTarget.parentElement && e.currentTarget.parentElement.id.includes('drop')) return;
            e.preventDefault();

            dragItem = e.currentTarget;
            dragPointerId = e.pointerId;

            const rect = dragItem.getBoundingClientRect();
            const shell = document.getElementById('game-shell');
            dragScale = parseFloat(getComputedStyle(shell).getPropertyValue('--fit-scale')) || 1;

            // Keep the source layout stable while the real card is temporarily
            // moved to <body>. This avoids the transformed #game-shell becoming
            // the containing block for position:fixed (the cause of the offset bug).
            placeholder = dragItem.cloneNode(true);
            placeholder.style.visibility = 'hidden';
            placeholder.style.pointerEvents = 'none';
            dragItem.parentNode.insertBefore(placeholder, dragItem);

            const naturalW = dragItem.offsetWidth;
            const naturalH = dragItem.offsetHeight;

            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            document.body.appendChild(dragItem);
            dragItem.style.position = 'fixed';
            dragItem.style.width = naturalW + 'px';
            dragItem.style.height = naturalH + 'px';
            dragItem.style.left = rect.left + 'px';
            dragItem.style.top = rect.top + 'px';
            dragItem.style.margin = '0';
            dragItem.style.transformOrigin = 'top left';
            dragItem.style.transition = 'none';
            dragItem.style.transform = `scale(${dragScale * 1.045}) rotate(2deg)`;
            dragItem.style.zIndex = '1000';
            dragItem.classList.add('dragging');

            playSfx('pop');
        }

        function handlePointerMove(e) {
            if(!dragItem || e.pointerId !== dragPointerId) return;
            e.preventDefault();

            dragItem.style.left = (e.clientX - startX) + 'px';
            dragItem.style.top = (e.clientY - startY) + 'px';

            const tCol = document.getElementById('tens-col');
            const oCol = document.getElementById('ones-col');
            const tRect = tCol.getBoundingClientRect();
            const oRect = oCol.getBoundingClientRect();

            tCol.classList.remove('highlight');
            oCol.classList.remove('highlight');

            if(e.clientX > tRect.left && e.clientX < tRect.right && e.clientY > tRect.top && e.clientY < tRect.bottom) {
                tCol.classList.add('highlight');
            } else if(e.clientX > oRect.left && e.clientX < oRect.right && e.clientY > oRect.top && e.clientY < oRect.bottom) {
                oCol.classList.add('highlight');
            }
        }

        function finishPointerDrag(e, cancelled = false) {
            if(!dragItem || e.pointerId !== dragPointerId) return;
            e.preventDefault();

            const tCol = document.getElementById('tens-col');
            const oCol = document.getElementById('ones-col');
            const tRect = tCol.getBoundingClientRect();
            const oRect = oCol.getBoundingClientRect();
            let success = false;

            if(!cancelled && dragItem.dataset.type === 'tens' && e.clientX > tRect.left && e.clientX < tRect.right && e.clientY > tRect.top && e.clientY < tRect.bottom) {
                document.getElementById('tens-drop').appendChild(dragItem);
                success = true;
            } else if(!cancelled && dragItem.dataset.type === 'ones' && e.clientX > oRect.left && e.clientX < oRect.right && e.clientY > oRect.top && e.clientY < oRect.bottom) {
                document.getElementById('ones-drop').appendChild(dragItem);
                success = true;
            }

            dragItem.classList.remove('dragging');
            clearDragStyles(dragItem);

            if(success) {
                dragItem.onpointerdown = null;
                state.dropped++;
                playSfx('pop');

                if(state.dropped === state.totalToDrag) {
                    const trayWrap = document.getElementById('unified-tray-wrap');
                    trayWrap.classList.add('hidden-tray');
                    document.querySelector('.target-panel').classList.add('completed-layout');
                    requestAnimationFrame(fitGameShell);

                    document.querySelectorAll('.ans-btn').forEach(b => { b.disabled = false; b.classList.remove('locked'); });
                    const inst = document.getElementById('instruction');
                    inst.innerText = "Awesome! Choose the right number! 🔢";
                    inst.style.color = "var(--c-white)";
                    inst.style.background = "var(--c-green)";
                    playSfx('correct');
                }
            } else {
                if(placeholder && placeholder.parentNode) {
                    placeholder.replaceWith(dragItem);
                }
                playSfx('wrong');
            }

            if(placeholder && placeholder.parentNode) placeholder.remove();
            dragItem = null;
            placeholder = null;
            dragPointerId = null;
            tCol.classList.remove('highlight');
            oCol.classList.remove('highlight');
        }

        function handlePointerUp(e) {
            finishPointerDrag(e, false);
        }

        function handlePointerCancel(e) {
            finishPointerDrag(e, true);
        }

        // Window-level listeners keep dragging stable after the card is re-parented
        // to <body>, on mouse, stylus and touch screens alike.
        window.addEventListener('pointermove', handlePointerMove, { passive: false });
        window.addEventListener('pointerup', handlePointerUp, { passive: false });
        window.addEventListener('pointercancel', handlePointerCancel, { passive: false });

        function checkAnswer(val, correct, btn) {
            if(val === correct) {
                playSfx('correct');
                showFeedback("GREAT JOB! 🌟", "var(--c-green)");
                setTimeout(() => {
                    document.getElementById('game-overlay').classList.remove('hidden');
                    // We no longer pass a specific fruit, it will be diverse
                    setupMiniGame();
                }, 1500);
            } else {
                playSfx('wrong');
                btn.style.background = "#FFE4E6";
                btn.style.borderColor = "var(--c-red)";
                btn.style.color = "var(--c-red-dark)";
                btn.disabled = true;
                showFeedback("Try again!", "var(--c-red)");
            }
        }

        // --- Fullscreen Fruit Catcher Mini Game (V7 Duolingo Style Background) ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let gameId, isMiniRunning = false, miniScore = 0, startTime;

        let basket = { x: 0, targetX: 0, y: 0, width: 98, height: 50, catchOffset: 0 };
        let fallingFruits = [];
        let hitEffects = [];
        let groundY = 0;
        let miniLastFrame = 0;
        let nextFruitSpawn = 0;

        // Setup initial cloud positions
        let clouds = [
            {x: 110, y: 105, s: 0.62},
            {x: 520, y: 145, s: 0.48},
            {x: 920, y: 88, s: 0.56}
        ];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            groundY = canvas.height - Math.max(92, Math.min(120, canvas.height * 0.15));

            // Ver 3: smaller basket so the mini-game feels lighter and less crowded.
            basket.width = canvas.width < 500 ? 84 : 98;
            basket.height = canvas.width < 500 ? 43 : 50;
            basket.y = groundY - basket.height + 10;

            const initialX = basket.targetX || basket.x || canvas.width / 2;
            basket.targetX = Math.min(Math.max(initialX, basket.width / 2), canvas.width - basket.width / 2);
            basket.x = Math.min(Math.max(basket.x || basket.targetX, basket.width / 2), canvas.width - basket.width / 2);
        }
        window.addEventListener('resize', () => { if(isMiniRunning) resizeCanvas(); });

        function updateBasketPos(clientX) {
            // Convert viewport coordinates to canvas coordinates. This stays accurate
            // even when the browser is zoomed or the CSS canvas size changes.
            const rect = canvas.getBoundingClientRect();
            let x = (clientX - rect.left) * (canvas.width / Math.max(1, rect.width));
            if(x < basket.width / 2) x = basket.width / 2;
            if(x > canvas.width - basket.width / 2) x = canvas.width - basket.width / 2;
            basket.targetX = x;
        }

        canvas.addEventListener('pointermove', (e) => {
            if(isMiniRunning) {
                e.preventDefault();
                updateBasketPos(e.clientX);
            }
        }, { passive: false });

        canvas.addEventListener('pointerdown', (e) => {
            if(isMiniRunning) {
                e.preventDefault();
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
                updateBasketPos(e.clientX);
            }
        }, { passive: false });

        canvas.addEventListener('pointerup', (e) => {
            try { if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        });

        function setupMiniGame() {
            document.getElementById('game-overlay').classList.remove('mini-running');
            document.getElementById('game-start-btn').classList.remove('hidden');
            document.getElementById('game-start-btn').innerText = "START CATCHING!";
            resizeCanvas();
            drawMiniGameFrame();
        }

        function startGameMini() {
            document.getElementById('game-overlay').classList.add('mini-running');
            document.getElementById('game-start-btn').classList.add('hidden');
            fallingFruits = [];
            hitEffects = [];
            miniScore = 0;
            startTime = Date.now();
            miniLastFrame = performance.now();
            nextFruitSpawn = 0.08;
            basket.targetX = basket.x || canvas.width / 2;
            isMiniRunning = true;
            document.getElementById('game-score-display').innerText = "Caught: 0";
            updateMini(miniLastFrame);
        }

        function drawBackground() {
            // Storybook sky
            const sky = ctx.createLinearGradient(0, 0, 0, groundY);
            sky.addColorStop(0, '#63c9ff');
            sky.addColorStop(.6, '#a8e8ff');
            sky.addColorStop(1, '#e9fbff');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Soft sun with glow
            const sunX = canvas.width - Math.max(62, canvas.width * .09);
            const sunY = Math.max(55, canvas.height * .1);
            const sunR = canvas.width < 500 ? 34 : 48;
            ctx.fillStyle = 'rgba(255, 221, 90, .20)';
            ctx.beginPath(); ctx.arc(sunX, sunY, sunR * 1.7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#FFD85C';
            ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI*2); ctx.fill();

            // Small rounded clouds
            ctx.fillStyle = 'rgba(255,255,255,.95)';
            clouds.forEach(c => {
                if(isMiniRunning) c.x -= 0.38 * c.s;
                if(c.x < -150) c.x = canvas.width + 110;
                const r = 34 * c.s;
                ctx.save();
                ctx.shadowColor='rgba(57,125,170,.10)'; ctx.shadowBlur=8; ctx.shadowOffsetY=4;
                ctx.beginPath();
                ctx.arc(c.x, c.y, r*.65, 0, Math.PI*2);
                ctx.arc(c.x+r*.68, c.y-r*.24, r*.82, 0, Math.PI*2);
                ctx.arc(c.x+r*1.35, c.y, r*.62, 0, Math.PI*2);
                ctx.roundRect(c.x-r*.62, c.y, r*2.55, r*.7, r*.32);
                ctx.fill(); ctx.restore();
            });

            // Far orchard hills
            ctx.fillStyle = '#A2DB5C';
            ctx.beginPath(); ctx.moveTo(0, canvas.height); ctx.lineTo(0, groundY - 32);
            ctx.quadraticCurveTo(canvas.width*.23, groundY-135, canvas.width*.47, groundY-28);
            ctx.quadraticCurveTo(canvas.width*.72, groundY-120, canvas.width, groundY-34);
            ctx.lineTo(canvas.width, canvas.height); ctx.fill();

            ctx.fillStyle = '#72C94B';
            ctx.beginPath(); ctx.moveTo(0, canvas.height); ctx.lineTo(0, groundY-10);
            ctx.quadraticCurveTo(canvas.width*.36, groundY-85, canvas.width*.63, groundY-5);
            ctx.quadraticCurveTo(canvas.width*.84, groundY-62, canvas.width, groundY-12);
            ctx.lineTo(canvas.width, canvas.height); ctx.fill();

            // Fruit trees as decorative silhouettes
            const treeStep = Math.max(170, canvas.width / 6);
            for(let tx = 70; tx < canvas.width + 80; tx += treeStep) {
                const base = groundY - 4;
                ctx.fillStyle = '#87552c'; ctx.fillRect(tx-6, base-52, 12, 52);
                ctx.fillStyle = '#32A852';
                ctx.beginPath(); ctx.arc(tx, base-65, 29, 0, Math.PI*2); ctx.arc(tx-23,base-55,22,0,Math.PI*2); ctx.arc(tx+23,base-55,22,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#ff5d68'; ctx.beginPath(); ctx.arc(tx-12,base-67,4,0,Math.PI*2); ctx.arc(tx+15,base-52,4,0,Math.PI*2); ctx.fill();
            }

            // Front grass
            ctx.fillStyle = '#58CC02';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = '#49AE08';
            ctx.fillRect(0, groundY + 28, canvas.width, canvas.height - groundY - 28);
            ctx.fillStyle = '#86E04A'; ctx.fillRect(0, groundY, canvas.width, 7);

            // Tiny flowers along the floor
            const flowerCount = Math.ceil(canvas.width / 130);
            for(let i=0;i<flowerCount;i++) {
                const fx=(i*137+55)%canvas.width, fy=groundY+45+(i%2)*20;
                ctx.fillStyle = i%3===0 ? '#ff8fab' : (i%3===1 ? '#ffd84d' : '#ffffff');
                for(let p=0;p<5;p++){ const a=p*Math.PI*2/5; ctx.beginPath(); ctx.arc(fx+Math.cos(a)*6,fy+Math.sin(a)*6,4,0,Math.PI*2); ctx.fill(); }
                ctx.fillStyle='#f59e0b'; ctx.beginPath(); ctx.arc(fx,fy,3.5,0,Math.PI*2); ctx.fill();
            }
        }

        function drawBeautifulBasket() {
            const bw = basket.width, bh = basket.height;
            const bx = basket.x - bw/2, by = basket.y + basket.catchOffset;
            ctx.save();

            // Handle behind the basket
            ctx.strokeStyle = '#8A4E1F';
            ctx.lineWidth = Math.max(7, bw * .065);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(basket.x, by + 8, bw * .36, Math.PI * 1.05, Math.PI * 1.95);
            ctx.stroke();
            ctx.strokeStyle = '#D48B45';
            ctx.lineWidth = Math.max(3, bw * .025);
            ctx.stroke();

            ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
            const grad = ctx.createLinearGradient(0, by, 0, by + bh);
            grad.addColorStop(0, '#E7A55F'); grad.addColorStop(.5, '#C77A32'); grad.addColorStop(1, '#A85B22');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(bx + 5, by + 4); ctx.lineTo(bx + bw - 5, by + 4);
            ctx.quadraticCurveTo(bx+bw-12, by+bh, bx+bw-25, by+bh);
            ctx.lineTo(bx+25,by+bh); ctx.quadraticCurveTo(bx+12,by+bh,bx+5,by+4); ctx.closePath(); ctx.fill();
            ctx.shadowColor='transparent';

            // Woven pattern
            ctx.strokeStyle='rgba(111,55,17,.7)'; ctx.lineWidth=2;
            for(let y=by+18;y<by+bh-4;y+=14){ ctx.beginPath(); ctx.moveTo(bx+15,y); ctx.lineTo(bx+bw-15,y); ctx.stroke(); }
            for(let x=bx+24;x<bx+bw-20;x+=20){ ctx.beginPath(); ctx.moveTo(x,by+8); ctx.lineTo(x-7,by+bh-4); ctx.stroke(); }

            // Thick rounded rim
            ctx.fillStyle='#8F4D1B'; ctx.beginPath(); ctx.roundRect(bx-4,by-4,bw+8,16,8); ctx.fill();
            ctx.fillStyle='#E9A65F'; ctx.beginPath(); ctx.roundRect(bx,by-1,bw,8,4); ctx.fill();
            ctx.restore();
        }

        function drawHitEffects(dt = 1 / 60) {
            hitEffects.forEach((eff, i) => {
                eff.life -= dt * 1.8;
                eff.y -= dt * 150;

                ctx.globalAlpha = Math.max(0, eff.life);
                ctx.fillStyle = "#FFF";
                ctx.font = `900 ${canvas.width < 500 ? 34 : 42}px Poppins`;
                ctx.strokeStyle = "#FF9F43";
                ctx.lineWidth = canvas.width < 500 ? 5 : 6;
                ctx.textAlign = "center";
                ctx.strokeText(eff.text, eff.x, eff.y);
                ctx.fillText(eff.text, eff.x, eff.y);
                ctx.globalAlpha = 1.0;

                if(eff.life <= 0) hitEffects.splice(i, 1);
            });
        }

        function drawMiniGameFrame(dt = 1 / 60) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawBeautifulBasket();
            drawHitEffects(dt);
        }

        function updateMini(frameTime = performance.now()) {
            if(!isMiniRunning) return;

            const dt = Math.min(0.034, Math.max(0.001, (frameTime - miniLastFrame) / 1000 || 1 / 60));
            miniLastFrame = frameTime;

            // Fast, frame-rate independent follow: responsive to the finger/mouse,
            // while smoothing tiny pointer jitters.
            const follow = 1 - Math.pow(0.45, dt * 60);
            basket.x += (basket.targetX - basket.x) * follow;
            if(Math.abs(basket.targetX - basket.x) < 0.15) basket.x = basket.targetX;

            if(basket.catchOffset > 0) basket.catchOffset -= dt * 100;
            if(basket.catchOffset < 0) basket.catchOffset = 0;

            const timePassed = Math.max(0, 15 - Math.floor((Date.now() - startTime)/1000));
            document.getElementById('timer-val').innerText = timePassed;

            if(timePassed <= 0) return endMiniRun("TIME'S UP!");

            drawMiniGameFrame(dt);

            // Time-based spawning keeps the game equally smooth on 60/90/120 Hz screens.
            nextFruitSpawn -= dt;
            if(nextFruitSpawn <= 0) {
                const randomFruitEmoji = ALL_FRUITS[Math.floor(Math.random() * ALL_FRUITS.length)];
                const edgePad = canvas.width < 500 ? 28 : 34;
                fallingFruits.push({
                    x: Math.random() * Math.max(1, canvas.width - edgePad * 2) + edgePad,
                    y: -46,
                    speed: 250 + Math.random() * 145, // pixels per second
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 3.0, // radians per second
                    emoji: randomFruitEmoji
                });
                nextFruitSpawn = 0.20 + Math.random() * 0.14;
            }

            for(let i = fallingFruits.length - 1; i >= 0; i--) {
                const f = fallingFruits[i];
                f.y += f.speed * dt;
                f.rotation += f.rotSpeed * dt;

                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rotation);

                // Ver 3: smaller fruit for a cleaner mini-game.
                const fruitSize = canvas.width < 500 ? 34 : 40;
                ctx.font = `${fruitSize}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(0, 0, 0, 0.32)";
                ctx.shadowBlur = 7;
                ctx.shadowOffsetY = 5;
                ctx.fillText(f.emoji, 0, 0);
                ctx.restore();

                // Slightly forgiving catch zone: the basket is visually smaller,
                // but catching stays responsive and kid-friendly.
                const basketTop = basket.y + basket.catchOffset;
                const horizontalHit = Math.abs(f.x - basket.x) <= (basket.width * 0.54 + fruitSize * 0.22);
                const verticalHit = f.y >= basketTop - fruitSize * 0.68 && f.y <= basketTop + basket.height * 0.34;

                if(horizontalHit && verticalHit) {
                    fallingFruits.splice(i, 1);
                    miniScore++;
                    basket.catchOffset = Math.min(10, basket.height * 0.22);

                    document.getElementById('game-score-display').innerText = `Caught: ${miniScore}`;
                    playSfx('catch');
                    hitEffects.push({x: f.x, y: basket.y - 20, life: 1, text: "+1"});
                } else if(f.y > canvas.height + 55) {
                    fallingFruits.splice(i, 1);
                }
            }

            gameId = requestAnimationFrame(updateMini);
        }

        function endMiniRun(msg) {
            isMiniRunning = false;
            document.getElementById('game-overlay').classList.remove('mini-running');
            cancelAnimationFrame(gameId);
            playSfx('correct');

            const btn = document.getElementById('game-start-btn');
            btn.innerText = `NICE CATCHING! NEXT ➔`;
            btn.classList.remove('hidden');

            btn.onclick = () => {
                document.getElementById('game-overlay').classList.add('hidden');
                state.score += miniScore;
                document.getElementById('score-val').innerText = state.score;
                state.idx++;
                if(state.idx < QUESTIONS.length) loadQuestion();
                else showVictory();
                btn.onclick = startGameMini;
            };
        }

        function showVictory() {
            document.getElementById('win-overlay').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score;
            playSfx('fanfare');
            startWinFireworks();
        }

        function startWinFireworks() {
            const fw = document.getElementById('fireworks-canvas');
            const fctx = fw.getContext('2d');
            fw.width = window.innerWidth;
            fw.height = window.innerHeight;
            let particlesArr = [];

            function loopFw() {
                fctx.clearRect(0,0,fw.width,fw.height);

                if(Math.random() < 0.15) {
                    const colors = ['#58CC02', '#1CB0F6', '#FFC800', '#FF4B4B', '#CE82FF'];
                    const x = Math.random() * fw.width;

                    for(let i=0; i<40; i++) {
                        particlesArr.push({
                            x: x,
                            y: -20,
                            vx: (Math.random() - 0.5) * 12,
                            vy: Math.random() * 6 + 3,
                            c: colors[Math.floor(Math.random() * colors.length)],
                            size: Math.random() * 12 + 6,
                            rot: Math.random() * Math.PI * 2,
                            rotSpeed: (Math.random() - 0.5) * 0.3
                        });
                    }
                }

                particlesArr.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.15;
                    p.rot += p.rotSpeed;

                    fctx.save();
                    fctx.translate(p.x, p.y);
                    fctx.rotate(p.rot);
                    fctx.fillStyle = p.c;
                    fctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                    fctx.restore();

                    if(p.y > fw.height + 50) particlesArr.splice(i, 1);
                });

                requestAnimationFrame(loopFw);
            }
            loopFw();
        }
    </script>
</body>

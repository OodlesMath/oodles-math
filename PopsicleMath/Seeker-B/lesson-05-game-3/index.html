    display:flex;align-items:center;justify-content:center;
    padding:18px clamp(18px,8vw,155px);
  }
  .game-card{
    width:min(1080px,100%);
    max-height:calc(100dvh - 36px);
    background:var(--card);
    border:4px solid rgba(255,255,255,.98);
    border-radius:34px;
    box-shadow:0 18px 45px rgba(18,77,112,.24),0 5px 0 rgba(255,255,255,.55) inset;
    backdrop-filter:blur(4px);
    overflow:hidden;
    position:relative;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 20px 10px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:900;font-size:clamp(16px,2vw,23px);letter-spacing:.2px;
    color:#1d6f95;
  }
  .brand-badge{
    width:40px;height:40px;border-radius:13px;
    background:linear-gradient(145deg,#fff7a8,#ffd93d);
    display:grid;place-items:center;
    box-shadow:0 4px 0 #e8b800;
    font-size:24px;
  }
  .progress-area{display:flex;align-items:center;gap:10px}
  .progress-text{
    font-size:14px;font-weight:900;color:#567;
    background:#fff;border:2px solid #e3edf2;border-radius:999px;padding:6px 12px;
  }
  .dots{display:flex;gap:5px}
  .dotp{width:13px;height:13px;border-radius:50%;background:#dbe7ec;border:2px solid #c4d5dc;transition:.25s}
  .dotp.done{background:#84df4f;border-color:#58cc02}
  .dotp.active{background:#ffd84a;border-color:#e1ac00;transform:scale(1.25)}

  .question-row{
    display:flex;justify-content:center;align-items:center;gap:12px;
    padding:0 20px 8px;
  }
  .question{
    font-size:clamp(24px,3.2vw,38px);
    font-weight:900;
    text-align:center;
    color:#164b70;
    line-height:1.12;
  }
  .speak-btn{
    flex:0 0 auto;width:54px;height:54px;border-radius:50%;border:3px solid white;
    background:var(--blue);color:white;font-size:24px;cursor:pointer;
    box-shadow:0 6px 0 var(--blue-dark);
    display:grid;place-items:center;
    transition:.1s;
  }
  .speak-btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--blue-dark)}
  .hint{
    text-align:center;font-size:13px;font-weight:700;color:#658196;
    margin:0 18px 7px;
  }

  .learning-row{
    display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr);
    gap:22px;
    align-items:center;
    padding:8px 28px 10px;
  }
  .visual-panel{
    background:rgba(250,254,255,.80);
    border:3px solid rgba(192,225,239,.9);
    border-radius:26px;
    min-height:clamp(245px,42vh,410px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
    box-shadow:0 7px 18px rgba(57,121,151,.09);
  }
  .panel-title{
    position:absolute;top:12px;left:16px;
    padding:5px 11px;border-radius:999px;
    font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
    background:#e7f7ff;color:#1683b7;
  }

  /* TEN FRAME */
  .ten-frame{
    display:grid;
    grid-template-columns:repeat(5,clamp(52px,6.1vw,78px));
    grid-template-rows:repeat(2,clamp(52px,6.1vw,78px));
    border:5px solid #258ec3;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 8px 0 rgba(25,125,171,.16);
  }
  .tf-cell{
    display:grid;place-items:center;
    border-right:3px solid #8fcce6;
    border-bottom:3px solid #8fcce6;
    position:relative;
  }
  .tf-cell:nth-child(5n){border-right:0}
  .tf-cell:nth-child(n+6){border-bottom:0}

  .apple{width:76%;height:76%;display:block;filter:drop-shadow(0 3px 2px rgba(66,79,85,.18));}
  .apple.pop{animation:applePop .42s cubic-bezier(.17,.89,.32,1.35) both}
  @keyframes applePop{0%{transform:scale(.1) rotate(-15deg);opacity:0}75%{transform:scale(1.13) rotate(4deg)}100%{transform:scale(1);opacity:1}}

  /* NUMBER BOND */
  .bond-wrap{
    width:min(320px,92%);height:275px;position:relative;margin-top:20px;
  }
  .bond-lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .bond-lines line{stroke:#5a7080;stroke-width:7;stroke-linecap:round}
  .bond-node{
    position:absolute;border-radius:50%;display:grid;place-items:center;
    background:white;border:5px solid #6f8290;
    font-weight:900;color:var(--ink);
    box-shadow:0 7px 0 rgba(69,91,107,.12);
  }
  .bond-whole{
    width:108px;height:108px;left:50%;top:5px;transform:translateX(-50%);
    border-color:#f1b90b;background:#fff9d6;font-size:43px;color:#9e7000;
  }
  .bond-part{
    width:94px;height:94px;bottom:3px;font-size:37px;
  }
  .bond-left{left:34px;border-color:#ed5b63;background:#fff0f1;color:#c6303d}
  .bond-right{right:34px;border-color:#52b7f3;background:#eef9ff;color:#157ab2}
  .bond-right.revealed{border-color:#58cc02;background:#f0ffe7;color:#369300;animation:numPop .42s cubic-bezier(.17,.89,.32,1.35)}
  @keyframes numPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}

  .result-strip{
    min-height:78px;
    display:flex;align-items:center;justify-content:center;gap:18px;
    padding:2px 20px 6px;
  }
  .equation{
    display:flex;align-items:center;gap:12px;
    font-size:clamp(30px,4vw,46px);font-weight:900;
    opacity:0;transform:scale(.86);pointer-events:none;
  }
  .equation.show{animation:eqShow .38s ease-out forwards}
  @keyframes eqShow{to{opacity:1;transform:scale(1)}}
  .eq-known{color:#d63b47}.eq-missing{color:#3ea000}.eq-ten{color:#1687bd}
  .message{
    font-size:clamp(16px,2vw,21px);font-weight:800;color:#4f6b7d;
    opacity:0;transform:translateY(8px);white-space:nowrap;
  }
  .message.show{animation:msgShow .35s .12s ease-out forwards}
  @keyframes msgShow{to{opacity:1;transform:translateY(0)}}

  .actions{
    display:flex;justify-content:center;align-items:center;gap:14px;
    padding:0 24px 20px;
  }
  .btn{
    min-width:210px;border:0;border-radius:20px;padding:15px 28px;
    font-family:inherit;font-size:20px;font-weight:900;letter-spacing:.7px;
    color:white;cursor:pointer;transition:.1s;text-transform:uppercase;
    display:inline-flex;align-items:center;justify-content:center;text-align:center;
  }
  .btn:active{transform:translateY(6px);box-shadow:none!important}
  .btn.check{background:var(--green);box-shadow:0 7px 0 var(--green-dark)}
  .btn.next{background:var(--blue);box-shadow:0 7px 0 var(--blue-dark);display:none}

  .finish{
    display:none;position:absolute;inset:0;z-index:20;
    background:rgba(255,255,255,.96);
    align-items:center;justify-content:center;text-align:center;padding:30px;
  }
  .finish.show{display:flex}
  .finish-inner{max-width:560px}
  .finish .big-star{font-size:82px;animation:bob 1.7s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px) rotate(5deg)}}
  .finish h2{font-size:clamp(34px,5vw,58px);margin:6px 0;color:#1492cf;font-weight:900}
  .finish p{font-size:19px;color:#607b8d;font-weight:700;margin:0 0 24px}
  .play-again{background:#9b63f5;box-shadow:0 7px 0 #6f3ec1}

  #confetti{position:fixed;inset:0;z-index:50;pointer-events:none}

  @media(max-width:880px){
    #app{padding:12px}
    .learning-row{grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px 8px}
    .visual-panel{min-height:310px}
    .bond-wrap{transform:scale(.9)}
    .topbar{padding:10px 14px 6px}
    .dots{display:none}
  }
  @media(max-width:700px){
    body{overflow:auto}
    #app{height:auto;min-height:100dvh;align-items:flex-start;padding:10px}
    .game-card{max-height:none}
    .learning-row{grid-template-columns:1fr;gap:10px}
    .visual-panel{min-height:290px}
    .bond-wrap{height:250px}
    .result-strip{flex-direction:column;gap:3px;min-height:102px}
    .message{white-space:normal;text-align:center}
  }
  @media(max-height:700px) and (min-width:701px){
    #app{padding-top:8px;padding-bottom:8px}
    .game-card{max-height:calc(100dvh - 16px)}
    .topbar{padding:8px 18px 4px}
    .question{font-size:28px}.speak-btn{width:46px;height:46px}
    .hint{margin-bottom:3px}
    .learning-row{padding-top:3px;padding-bottom:4px}
    .visual-panel{min-height:300px}
    .ten-frame{grid-template-columns:repeat(5,60px);grid-template-rows:repeat(2,60px)}
    .bond-wrap{transform:scale(.88);margin-top:6px}
    .result-strip{min-height:60px}
    .actions{padding-bottom:12px}
    .btn{padding:12px 26px}
  }
</style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<div class="bg" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
<canvas id="confetti"></canvas>

<div id="app">
  <main class="game-card" aria-live="polite">
    <div class="topbar">
      <div class="brand"><div class="brand-badge">➕</div><span>Make 10!</span></div>
      <div class="progress-area">
        <div class="dots" id="dots"></div>
        <div class="progress-text" id="progressText">1 / 10</div>
      </div>
    </div>

    <div class="question-row">
      <div class="question">How many more make 10?</div>
      <button class="speak-btn" id="speakBtn" aria-label="Read aloud">🔊</button>
    </div>
    <div class="hint">Say the answer, then tap CHECK.</div>

    <section class="learning-row">
      <div class="visual-panel">
        <div class="panel-title">Ten Frame</div>
        <div class="ten-frame" id="tenFrame" aria-label="Ten frame"></div>
      </div>

      <div class="visual-panel">
        <div class="panel-title">Number Bond</div>
        <div class="bond-wrap" aria-label="Number bond">
          <svg class="bond-lines" viewBox="0 0 320 275" preserveAspectRatio="none" aria-hidden="true">
            <line x1="160" y1="95" x2="82" y2="190"></line>
            <line x1="160" y1="95" x2="238" y2="190"></line>
          </svg>
          <div class="bond-node bond-whole">10</div>
          <div class="bond-node bond-part bond-left" id="knownPart">6</div>
          <div class="bond-node bond-part bond-right" id="missingPart">?</div>
        </div>
      </div>
    </section>

    <div class="result-strip">
      <div class="equation" id="equation">
        <span class="eq-known" id="eqKnown">6</span><span>+</span><span class="eq-missing" id="eqMissing">4</span><span>=</span><span class="eq-ten">10</span>
      </div>
      <div class="message" id="message">6 and 4 make 10!</div>
    </div>

    <div class="actions">
      <button class="btn check" id="checkBtn">CHECK</button>
      <button class="btn next" id="nextBtn">NEXT →</button>
    </div>

    <div class="finish" id="finishScreen">
      <div class="finish-inner">
        <div class="big-star">🌟</div>
        <h2>Great job!</h2>
        <p>You made 10 in lots of ways!</p>
        <button class="btn play-again" id="playAgainBtn">PLAY AGAIN</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const TOTAL = 10;
  let questions = [];
  let index = 0;
  let revealed = false;
  let autoSpeakTimer = 0;

  const tenFrame = document.getElementById('tenFrame');
  const knownPart = document.getElementById('knownPart');
  const missingPart = document.getElementById('missingPart');
  const eqKnown = document.getElementById('eqKnown');
  const eqMissing = document.getElementById('eqMissing');
  const equation = document.getElementById('equation');
  const message = document.getElementById('message');
  const checkBtn = document.getElementById('checkBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressText = document.getElementById('progressText');
  const dots = document.getElementById('dots');
  const finishScreen = document.getElementById('finishScreen');
  const speakBtn = document.getElementById('speakBtn');

  function shuffle(arr){
    const a = [...arr];
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  // QUESTION GENERATION: all 1–9 combinations, plus one non-consecutive repeat.
  function makeQuestionSet(){
    const base = shuffle([1,2,3,4,5,6,7,8,9]);
    let extra = 1 + Math.floor(Math.random()*9);
    if(extra === base[base.length-1]) extra = extra === 9 ? 8 : extra + 1;
    return [...base, extra];
  }

  function appleSVG(color){
    const isRed = color === 'red';
    const main = isRed ? '#f04444' : '#63c928';
    const dark = isRed ? '#c82333' : '#369313';
    const hi = isRed ? '#ff7f79' : '#9ee85f';
    return `
      <svg class="apple" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 26 C43 16 45 7 55 3" fill="none" stroke="#704019" stroke-width="8" stroke-linecap="round"/>
        <path d="M53 17 C64 8 76 11 82 20 C69 23 60 22 53 17Z" fill="#4aa52f"/>
        <path d="M49 27 C39 20 27 22 19 31 C6 46 12 73 29 88 C37 95 44 92 50 89 C56 92 63 95 71 88 C88 73 94 46 81 31 C73 22 61 20 51 27Z" fill="${main}" stroke="${dark}" stroke-width="4"/>
        <path d="M28 38 C34 31 41 31 45 33" fill="none" stroke="${hi}" stroke-width="7" stroke-linecap="round" opacity=".8"/>
      </svg>`;
  }

  // TEN FRAME RENDERING: row-major order, left-to-right then top-to-bottom.
  function renderTenFrame(known, reveal=false){
    tenFrame.innerHTML = '';
    const missing = 10 - known;
    for(let i=0;i<10;i++){
      const cell = document.createElement('div');
      cell.className = 'tf-cell';
      if(i < known){
        cell.innerHTML = appleSVG('red');
      } else if(reveal){
        cell.innerHTML = appleSVG('green');
        const a = cell.querySelector('.apple');
        a.classList.add('pop');
        a.style.animationDelay = `${(i-known)*90}ms`;
      }
      tenFrame.appendChild(cell);
    }
  }

  function updateProgress(){
    progressText.textContent = `${index+1} / ${TOTAL}`;
    dots.innerHTML = '';
    for(let i=0;i<TOTAL;i++){
      const d=document.createElement('span');
      d.className='dotp' + (i<index?' done':i===index?' active':'');
      dots.appendChild(d);
    }
  }

  // NUMBER BOND + QUESTION RENDERING.
  function loadQuestion(){
    revealed = false;
    const known = questions[index];
    const missing = 10-known;
    renderTenFrame(known,false);
    knownPart.textContent = known;
    missingPart.textContent = '?';
    missingPart.classList.remove('revealed');
    eqKnown.textContent = known;
    eqMissing.textContent = missing;
    equation.classList.remove('show');
    message.classList.remove('show');
    message.textContent = `${known} and ${missing} make 10!`;
    checkBtn.style.display = 'inline-flex';
    nextBtn.style.display = 'none';
    checkBtn.disabled = false;
    updateProgress();

    // AUTO AUDIO: read each new question aloud after the visuals appear.
    clearTimeout(autoSpeakTimer);
    autoSpeakTimer = setTimeout(() => {
      if(!revealed && !finishScreen.classList.contains('show')) speak();
    }, 420);
  }

  function chime(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();
      const now=ac.currentTime;
      [523.25,659.25,783.99].forEach((f,k)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,now+k*.09);
        g.gain.exponentialRampToValueAtTime(.13,now+k*.09+.015);
        g.gain.exponentialRampToValueAtTime(.0001,now+k*.09+.24);
        o.connect(g).connect(ac.destination);o.start(now+k*.09);o.stop(now+k*.09+.26);
      });
      setTimeout(()=>ac.close(),700);
    }catch(e){}
  }

  // ANSWER REVEAL: green apples + missing part + equation.
  function revealAnswer(){
    if(revealed) return;
    revealed = true;
    checkBtn.disabled = true;
    const known = questions[index];
    const missing = 10-known;
    renderTenFrame(known,true);
    missingPart.textContent = missing;
    missingPart.classList.add('revealed');
    equation.classList.add('show');
    message.classList.add('show');
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'inline-flex';
    chime();
  }

  // AUDIO: question before reveal; full number fact after reveal.
  function speak(){
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const known = questions[index];
    const missing = 10-known;
    const text = revealed ? `${known} and ${missing} make ten.` : 'How many more make ten?';
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=.82;u.pitch=1.08;
    const voices = speechSynthesis.getVoices();
    const preferred = voices.find(v=>/Samantha|Ava|Google US English|Microsoft Aria|English United States/i.test(v.name));
    if(preferred) u.voice=preferred;
    speechSynthesis.speak(u);
  }

  // NEXT QUESTION: no page reload.
  function nextQuestion(){
    if(!revealed) return;
    if(index < TOTAL-1){index++;loadQuestion();}
    else finishGame();
  }

  function finishGame(){
    clearTimeout(autoSpeakTimer);
    finishScreen.classList.add('show');
    burstConfetti();
    if('speechSynthesis' in window){
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance('Great job! You made ten in lots of ways!');
      u.lang='en-US';u.rate=.88;
      speechSynthesis.speak(u);
    }
  }

  function restart(){
    questions = makeQuestionSet();index=0;revealed=false;
    finishScreen.classList.remove('show');
    loadQuestion();
  }

  // Lightweight confetti for the finish screen only.
  const canvas=document.getElementById('confetti');
  const ctx=canvas.getContext('2d');
  let pieces=[], raf=0;
  function resizeConfetti(){canvas.width=innerWidth;canvas.height=innerHeight}
  addEventListener('resize',resizeConfetti);resizeConfetti();
  function burstConfetti(){
    const cols=['#58cc02','#19a9f5','#ffd84a','#f04444','#9b63f5','#ff8f3f'];
    pieces=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*14,vy:-4-Math.random()*10,g:.22+Math.random()*.12,s:5+Math.random()*7,r:Math.random()*6.2,c:cols[Math.floor(Math.random()*cols.length)]}));
    cancelAnimationFrame(raf);animateConfetti();
  }
  function animateConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.r+=.13;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore()});
    pieces=pieces.filter(p=>p.y<innerHeight+30);
    if(pieces.length) raf=requestAnimationFrame(animateConfetti); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  checkBtn.addEventListener('click',revealAnswer);
  nextBtn.addEventListener('click',nextQuestion);
  speakBtn.addEventListener('click',speak);
  document.getElementById('playAgainBtn').addEventListener('click',restart);
  document.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();revealed?nextQuestion():revealAnswer()}
  });

  questions = makeQuestionSet();
  loadQuestion();
})();
</script>
</body>
</html>

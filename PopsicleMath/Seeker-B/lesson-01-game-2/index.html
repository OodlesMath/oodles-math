<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="../assets/brand.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Help The Frog! • Number Path 1–20</title>
<link rel="stylesheet" href="../assets/brand.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#25a9e8; --blue2:#1076bd; --green:#58cc02; --green2:#3fa300;
  --yellow:#ffd84d; --pink:#ff83b5; --red:#ff5b5b; --ink:#17324d;
  --cream:#fffdf4; --line:#dbe8ef; --shadow:0 12px 30px rgba(30,80,120,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;font-family:Poppins,sans-serif;color:var(--ink);overflow:hidden}
body{
  background:
    radial-gradient(circle at 9% 12%, rgba(255,255,255,.95) 0 24px, transparent 25px),
    linear-gradient(#9ee4ff 0 62%,#8dd458 62% 70%,#47bde4 70% 100%);
}
.oodles-logo{position:fixed;right:16px;bottom:12px;max-width:76px;z-index:40}
.scenery{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;left:4%;top:5%;width:74px;height:74px;border-radius:50%;background:#ffd84d;box-shadow:0 0 0 12px rgba(255,216,77,.22)}
.cloud{position:absolute;width:110px;height:32px;background:#fff;border-radius:30px;opacity:.9}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:44px;height:44px;left:18px;top:-18px}.cloud:after{width:55px;height:55px;right:16px;top:-26px}
.c1{top:10%;left:24%;transform:scale(.72)} .c2{top:19%;right:12%;transform:scale(.9)}
.hills{position:absolute;left:-5%;right:-5%;bottom:29%;height:24%;background:#69c84a;border-radius:50% 50% 0 0/100% 100% 0 0}
.hills:after{content:"";position:absolute;left:35%;width:50%;height:100%;background:#52b83f;border-radius:50% 50% 0 0/100% 100% 0 0}
.water{position:absolute;left:0;right:0;bottom:0;height:31%;background:linear-gradient(#57c9ed,#279fcf)}
.water:before{content:"";position:absolute;left:0;right:0;top:7px;height:10px;background:rgba(255,255,255,.45);clip-path:polygon(0 50%,5% 20%,10% 50%,15% 80%,20% 50%,25% 20%,30% 50%,35% 80%,40% 50%,45% 20%,50% 50%,55% 80%,60% 50%,65% 20%,70% 50%,75% 80%,80% 50%,85% 20%,90% 50%,95% 80%,100% 50%,100% 100%,0 100%)}
.lotus{position:absolute;width:64px;height:25px;border-radius:50%;background:#55ac3b;box-shadow:inset -8px -5px 0 rgba(0,0,0,.12)}
.l1{left:8%;bottom:11%}.l2{right:13%;bottom:17%;transform:scale(.8)}.l3{left:45%;bottom:5%;transform:scale(.65)}
.flower{position:absolute;font-size:32px}.f1{left:18%;bottom:29%}.f2{right:24%;bottom:30%}.f3{left:68%;bottom:27%}

.app{position:relative;z-index:5;width:100%;height:100%;padding:14px;display:flex;flex-direction:column;align-items:center}
.topbar{width:min(1100px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.title-wrap{display:flex;align-items:center;gap:10px}
.mini-frog{width:54px;height:54px;filter:drop-shadow(0 5px 4px rgba(0,0,0,.12))}
.title h1{margin:0;font-size:clamp(24px,4vw,42px);line-height:1;color:#0587d2;text-shadow:0 3px 0 #fff}
.title p{margin:5px 0 0;font-weight:800;font-size:clamp(12px,1.6vw,16px)}
.sound-btn,.hint-btn,.new-btn{
  border:0;border-radius:18px;font-family:inherit;font-weight:900;cursor:pointer;transition:.12s
}
.sound-btn{width:52px;height:52px;background:#fff;color:#087fc1;box-shadow:0 5px 0 #c7dfeb;font-size:23px}
.sound-btn:active,.hint-btn:active,.new-btn:active{transform:translateY(4px);box-shadow:none}

.game-shell{
  width:min(1120px,100%);flex:1;min-height:0;
  display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;
}
.board-card,.side-card{
  background:rgba(255,255,255,.94);border:4px solid rgba(255,255,255,.95);border-radius:28px;box-shadow:var(--shadow)
}
.board-card{padding:12px;display:flex;align-items:center;justify-content:center;min-height:0}
.board-wrap{position:relative;width:min(74vh,720px);max-width:100%;aspect-ratio:1/1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:5px;width:100%;height:100%}
.cell{
  position:relative;border:3px solid #d1dbe3;background:#fff;border-radius:11px;
  display:grid;place-items:center;font-size:clamp(18px,2.4vw,34px);font-weight:900;color:#16212d;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.04);cursor:pointer;transition:.14s;
}
.cell:hover{transform:translateY(-2px);border-color:#a8cadb}
.cell.correct{background:#dff7c9;border-color:#63c82f;color:#246e16;box-shadow:inset 0 -4px 0 rgba(55,154,35,.16)}
.cell.correct:after{content:"✓";position:absolute;right:5px;top:1px;font-size:.48em;color:#2b9a23}
.cell.wrong{animation:shake .35s;background:#ffe4e4;border-color:#ff6b6b}
.cell.hint{animation:pulse 1.1s ease-in-out 1;background:#fff5a8;border-color:#f3c724;box-shadow:0 0 0 6px rgba(255,216,77,.24)}
.cell.target20:before{content:"★";position:absolute;left:5px;top:1px;color:#ffc400;font-size:.48em}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 10px rgba(255,216,77,.22)}}

#pathCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#frog{
  position:absolute;z-index:5;width:calc(100%/7*.88);height:calc(100%/7*.88);
  transform:translate(-50%,-50%);transition:left .38s cubic-bezier(.2,.8,.2,1),top .38s cubic-bezier(.2,.8,.2,1),transform .2s;
  pointer-events:none;filter:drop-shadow(0 7px 5px rgba(0,0,0,.18))
}
#frog.jump{animation:frogJump .38s ease}
@keyframes frogJump{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-95%) scale(1.07,.94)}100%{transform:translate(-50%,-50%) scale(1)}}

.side-card{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.target-box{background:#e9f7ff;border:3px solid #8fd8f8;border-radius:22px;padding:15px;text-align:center}
.target-label{font-size:13px;font-weight:900;color:#3f6e8b;text-transform:uppercase;letter-spacing:.08em}
.target-number{font-size:clamp(50px,8vh,82px);line-height:1;font-weight:900;color:#0787d1;margin:3px 0}
.progress-text{display:flex;justify-content:space-between;font-weight:900;font-size:14px}
.progress{height:18px;background:#e8eef2;border:2px solid #ccd7df;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#58cc02,#9ae150);transition:.3s}
.tip{background:#fff8d8;border:3px solid #ffe078;border-radius:18px;padding:12px;font-size:12px;line-height:1.45;font-weight:700;color:#6f5b17}
.controls{display:grid;gap:10px;margin-top:auto}
.hint-btn{padding:14px;background:#ffd84d;color:#775900;box-shadow:0 6px 0 #d9ad13;font-size:16px}
.new-btn{padding:12px;background:#28a9e8;color:#fff;box-shadow:0 6px 0 #1378b6;font-size:14px}

.modal{
  position:fixed;inset:0;background:rgba(13,44,69,.36);display:none;align-items:center;justify-content:center;z-index:50;padding:18px
}
.modal.show{display:flex}
.modal-card{
  width:min(430px,100%);background:#fff;border:5px solid #fff;border-radius:32px;text-align:center;padding:26px;
  box-shadow:0 28px 80px rgba(14,48,72,.28)
}
.modal-card .big-icon{font-size:80px;animation:bounce 1s infinite alternate}
@keyframes bounce{to{transform:translateY(-10px)}}
.modal-card h2{font-size:38px;margin:4px 0;color:#087fc1}
.modal-card p{font-weight:800;color:#557187}
.score-pill{display:inline-block;background:#fff4c1;border:3px solid #ffd84d;border-radius:999px;padding:8px 18px;font-size:24px;font-weight:900;margin:8px 0 18px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions button{border:0;border-radius:18px;padding:13px;font-family:inherit;font-weight:900;cursor:pointer}
.playagain{background:#58cc02;color:#fff;box-shadow:0 6px 0 #3c9e00}.newmaze{background:#25a9e8;color:#fff;box-shadow:0 6px 0 #1276b0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:49}

@media(max-width:820px){
  .app{padding:8px}.topbar{margin-bottom:7px}.title p{display:none}
  .game-shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:8px}
  .side-card{padding:9px;display:grid;grid-template-columns:120px 1fr 145px;align-items:center;gap:8px}
  .target-box{padding:8px}.target-number{font-size:43px}.tip{display:none}.controls{margin:0}.hint-btn,.new-btn{padding:9px;font-size:12px}
  .board-card{padding:7px}.board-wrap{width:min(72vh,100%)}
}
@media(max-width:540px){
  body{overflow:auto}.app{min-height:100%;height:auto}.game-shell{display:flex;flex-direction:column}
  .board-wrap{width:100%;aspect-ratio:1/1}.side-card{grid-template-columns:95px 1fr 115px}
  .cell{gap:2px;border-width:2px;border-radius:8px;font-size:clamp(16px,5.5vw,25px)} .grid{gap:3px}
  .title h1{font-size:24px}.mini-frog{width:44px;height:44px}.sound-btn{width:44px;height:44px}
  .oodles-logo{max-width:55px}.modal-actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<img src="../assets/logo-oodles-math.png" class="oodles-logo" onerror="this.style.display='none'">
<div class="scenery">
  <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="hills"></div><div class="water"></div>
  <div class="lotus l1"></div><div class="lotus l2"></div><div class="lotus l3"></div>
  <div class="flower f1">🌼</div><div class="flower f2">🌷</div><div class="flower f3">🌸</div>
</div>

<div class="app">
  <div class="topbar">
    <div class="title-wrap">
      <svg class="mini-frog" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="63" rx="31" ry="24" fill="#56c936" stroke="#236a20" stroke-width="4"/>
        <circle cx="34" cy="31" r="15" fill="#72df4e" stroke="#236a20" stroke-width="4"/><circle cx="66" cy="31" r="15" fill="#72df4e" stroke="#236a20" stroke-width="4"/>
        <circle cx="36" cy="30" r="6" fill="#fff"/><circle cx="64" cy="30" r="6" fill="#fff"/><circle cx="37" cy="31" r="3" fill="#111"/><circle cx="63" cy="31" r="3" fill="#111"/>
        <path d="M35 63 Q50 76 66 62" fill="none" stroke="#1e5c1a" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="23" cy="83" rx="18" ry="7" fill="#56c936" stroke="#236a20" stroke-width="4"/><ellipse cx="77" cy="83" rx="18" ry="7" fill="#56c936" stroke="#236a20" stroke-width="4"/>
      </svg>
      <div class="title"><h1>Help The Frog!</h1><p>Find the path from 1 to 20.</p></div>
    </div>
    <button class="sound-btn" id="soundBtn" aria-label="Sound">🔊</button>
  </div>

  <div class="game-shell">
    <section class="board-card">
      <div class="board-wrap" id="boardWrap">
        <div class="grid" id="grid"></div>
        <canvas id="pathCanvas"></canvas>
        <svg id="frog" viewBox="0 0 100 100" aria-label="Frog">
          <ellipse cx="50" cy="61" rx="31" ry="25" fill="#58cc02" stroke="#236a20" stroke-width="5"/>
          <circle cx="33" cy="29" r="16" fill="#6ede46" stroke="#236a20" stroke-width="5"/>
          <circle cx="67" cy="29" r="16" fill="#6ede46" stroke="#236a20" stroke-width="5"/>
          <circle cx="35" cy="28" r="7" fill="#fff"/><circle cx="65" cy="28" r="7" fill="#fff"/>
          <circle cx="36" cy="29" r="3.3" fill="#101010"/><circle cx="64" cy="29" r="3.3" fill="#101010"/>
          <circle cx="28" cy="58" r="5" fill="#ff8fab" opacity=".7"/><circle cx="72" cy="58" r="5" fill="#ff8fab" opacity=".7"/>
          <path d="M34 63 Q50 78 67 62" fill="none" stroke="#1e5c1a" stroke-width="5" stroke-linecap="round"/>
          <path d="M25 75 Q12 81 9 92 Q25 94 38 84" fill="#58cc02" stroke="#236a20" stroke-width="5" stroke-linejoin="round"/>
          <path d="M75 75 Q88 81 91 92 Q75 94 62 84" fill="#58cc02" stroke="#236a20" stroke-width="5" stroke-linejoin="round"/>
        </svg>
      </div>
    </section>

    <aside class="side-card">
      <div class="target-box">
        <div class="target-label">Find</div>
        <div class="target-number" id="targetNum">1</div>
      </div>
      <div>
        <div class="progress-text"><span>Path</span><span id="progressLabel">0 / 20</span></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <div class="tip">Tap the next number beside the frog. You can move up, down, left or right — not diagonally.</div>
      <div class="controls">
        <button class="hint-btn" id="hintBtn">💡 Hint</button>
        <button class="new-btn" id="newBtn">🔄 New Maze</button>
      </div>
    </aside>
  </div>
</div>

<canvas id="confetti"></canvas>

<div class="modal" id="winModal">
  <div class="modal-card">
    <div class="big-icon">🐸✨</div>
    <h2>Great Job!</h2>
    <p>You found the path from 1 to 20!</p>
    <div class="score-pill">⭐ 20 / 20</div>
    <div class="modal-actions">
      <button class="playagain" id="playAgainBtn">PLAY AGAIN</button>
      <button class="newmaze" id="newMazeBtn">NEW MAZE</button>
    </div>
  </div>
</div>

<script>
(() => {
  const N = 7, MAX = 20;
  const grid = document.getElementById('grid');
  const boardWrap = document.getElementById('boardWrap');
  const frog = document.getElementById('frog');
  const targetNum = document.getElementById('targetNum');
  const progressLabel = document.getElementById('progressLabel');
  const progressBar = document.getElementById('progressBar');
  const hintBtn = document.getElementById('hintBtn');
  const newBtn = document.getElementById('newBtn');
  const soundBtn = document.getElementById('soundBtn');
  const winModal = document.getElementById('winModal');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const newMazeBtn = document.getElementById('newMazeBtn');
  const pathCanvas = document.getElementById('pathCanvas');
  const pctx = pathCanvas.getContext('2d');
  const confetti = document.getElementById('confetti');
  const cctx = confetti.getContext('2d');

  let maze, path, step = 0, soundOn = true, audioCtx, confettiBits = [], rafConfetti;

  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  const key = (r,c)=>r+','+c;
  const inside = (r,c)=>r>=0&&r<N&&c>=0&&c<N;
  const shuffle = a => [...a].sort(()=>Math.random()-.5);

  function generatePath(){
    for(let attempt=0; attempt<500; attempt++){
      const start = [Math.floor(Math.random()*N), Math.floor(Math.random()*N)];
      const used = new Set([key(...start)]);
      const p=[start];
      function dfs(r,c){
        if(p.length===MAX) return true;
        const options=shuffle(dirs).map(([dr,dc])=>[r+dr,c+dc]).filter(([nr,nc])=>inside(nr,nc)&&!used.has(key(nr,nc)));
        for(const [nr,nc] of options){
          used.add(key(nr,nc)); p.push([nr,nc]);
          if(dfs(nr,nc)) return true;
          p.pop(); used.delete(key(nr,nc));
        }
        return false;
      }
      if(dfs(...start)) return p;
    }
    throw new Error('Could not generate path');
  }

  function generateMaze(){
    path = generatePath();
    maze = Array.from({length:N},()=>Array(N).fill(0));
    const pathMap = new Map();
    path.forEach((pos,i)=>pathMap.set(key(...pos),i+1));
    path.forEach((pos,i)=>maze[pos[0]][pos[1]]=i+1);

    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      if(maze[r][c]) continue;
      let banned = new Set();
      for(const [dr,dc] of dirs){
        const pr=r+dr, pc=c+dc;
        if(inside(pr,pc) && pathMap.has(key(pr,pc))){
          const v=pathMap.get(key(pr,pc));
          if(v<MAX) banned.add(v+1);
        }
      }
      let choices=[];
      for(let n=1;n<=MAX;n++) if(!banned.has(n)) choices.push(n);
      maze[r][c]=choices[Math.floor(Math.random()*choices.length)];
    }
  }

  function render(){
    grid.innerHTML='';
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      const d=document.createElement('button');
      d.className='cell';
      d.dataset.r=r; d.dataset.c=c;
      d.textContent=maze[r][c];
      if(maze[r][c]===20) d.classList.add('target20');
      d.addEventListener('click',()=>chooseCell(r,c,d));
      grid.appendChild(d);
    }
    step=0; updateUI(); requestAnimationFrame(()=>{resizeCanvases(); placeFrog(path[0][0],path[0][1],false); drawPath();});
    speak('Help the frog! Find the path from one to twenty.');
  }

  function chooseCell(r,c,el){
    if(step>=MAX) return;
    const [tr,tc]=path[step];
    if(r===tr && c===tc){
      el.classList.add('correct');
      step++;
      playTone(step===MAX?880:620,.09,'triangle');
      placeFrog(r,c,true);
      updateUI(); drawPath();
      if(step<MAX) setTimeout(()=>speak('Find number '+(step+1)+'.'),180);
      else setTimeout(win,500);
    } else {
      el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong');
      playTone(160,.13,'sawtooth');
      setTimeout(()=>el.classList.remove('wrong'),420);
    }
  }

  function updateUI(){
    targetNum.textContent=step<MAX?step+1:'✓';
    progressLabel.textContent=`${step} / ${MAX}`;
    progressBar.style.width=(step/MAX*100)+'%';
  }

  function cellCenter(r,c){
    const cell=grid.children[r*N+c], br=boardWrap.getBoundingClientRect(), cr=cell.getBoundingClientRect();
    return {x:cr.left-br.left+cr.width/2,y:cr.top-br.top+cr.height/2};
  }

  function placeFrog(r,c,jump){
    const p=cellCenter(r,c);
    frog.style.left=p.x+'px'; frog.style.top=p.y+'px';
    if(jump){frog.classList.remove('jump');void frog.offsetWidth;frog.classList.add('jump')}
  }

  function resizeCanvases(){
    const rect=boardWrap.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    pathCanvas.width=rect.width*dpr; pathCanvas.height=rect.height*dpr; pathCanvas.style.width=rect.width+'px'; pathCanvas.style.height=rect.height+'px';
    pctx.setTransform(dpr,0,0,dpr,0,0);
    confetti.width=innerWidth*dpr; confetti.height=innerHeight*dpr; confetti.style.width=innerWidth+'px'; confetti.style.height=innerHeight+'px'; cctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function drawPath(){
    pctx.clearRect(0,0,pathCanvas.width,pathCanvas.height);
    if(step<2) return;
    pctx.lineWidth=10; pctx.lineCap='round'; pctx.lineJoin='round'; pctx.strokeStyle='rgba(88,204,2,.55)';
    pctx.beginPath();
    for(let i=0;i<step;i++){
      const p=cellCenter(...path[i]); if(i===0)pctx.moveTo(p.x,p.y);else pctx.lineTo(p.x,p.y);
    }
    pctx.stroke();
  }

  function hint(){
    if(step>=MAX)return;
    const [r,c]=path[step], el=grid.children[r*N+c];
    el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint');
    playTone(760,.08,'sine');
    setTimeout(()=>el.classList.remove('hint'),1200);
  }

  function resetSameMaze(){step=0;[...grid.children].forEach(x=>x.classList.remove('correct','wrong','hint'));updateUI();placeFrog(...path[0],false);drawPath();winModal.classList.remove('show')}
  function newMaze(){generateMaze();render();winModal.classList.remove('show')}

  function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
  function playTone(freq,dur,type='sine'){if(!soundOn)return;try{const a=getAudio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.08,a.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur+.03)}catch(e){}}
  function speak(text){if(!soundOn||!('speechSynthesis'in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.rate=.9;u.pitch=1.08;u.lang='en-US';speechSynthesis.speak(u)}

  function win(){
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.16,'triangle'),i*110));
    burstConfetti(); winModal.classList.add('show');
  }

  function burstConfetti(){
    confettiBits=[];
    const cols=['#58cc02','#25a9e8','#ffd84d','#ff83b5','#a77cf2','#ff6b6b'];
    for(let i=0;i<150;i++)confettiBits.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,g:.28+Math.random()*.12,s:5+Math.random()*7,c:cols[i%cols.length],a:Math.random()*6.28});
    cancelAnimationFrame(rafConfetti); animateConfetti();
  }
  function animateConfetti(){
    cctx.clearRect(0,0,innerWidth,innerHeight);
    confettiBits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.a+=.12;cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.a);cctx.fillStyle=p.c;cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cctx.restore()});
    confettiBits=confettiBits.filter(p=>p.y<innerHeight+40);
    if(confettiBits.length)rafConfetti=requestAnimationFrame(animateConfetti); else cctx.clearRect(0,0,innerWidth,innerHeight);
  }

  hintBtn.addEventListener('click',hint);
  newBtn.addEventListener('click',newMaze);
  playAgainBtn.addEventListener('click',resetSameMaze);
  newMazeBtn.addEventListener('click',newMaze);
  soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊':'🔇';if(soundOn)speak(step<MAX?'Find number '+(step+1)+'.':'Great job!')});
  window.addEventListener('resize',()=>requestAnimationFrame(()=>{resizeCanvases(); if(step>0)placeFrog(...path[Math.min(step-1,MAX-1)],false); else placeFrog(...path[0],false); drawPath()}));

  generateMaze(); render(); resizeCanvases();
})();
</script>
</body>
</html>

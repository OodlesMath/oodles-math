    button{font:inherit}

    #bgCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:none;
      z-index:0;
      pointer-events:none;
    }
    .bunting{
      position:fixed; left:0; right:0; top:calc(var(--top-h) + 3px); height:20px; z-index:6;
      border-top:2px solid rgba(255,245,230,.95);
      display:flex; justify-content:space-around; pointer-events:none;
    }
    .bunting span{
      display:block; width:0; height:0;
      border-left:11px solid transparent; border-right:11px solid transparent; border-top:12px solid #ffd943;
      transform:translateY(-1px);
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.5));
    }
    .bunting span:nth-child(3n+2){border-top-color:#ff8c5b}
    .bunting span:nth-child(3n){border-top-color:#ffe85f}

    .game{
      position:relative; z-index:10; width:100%; height:100%;
      display:grid;
      grid-template-rows:var(--top-h) minmax(0,1fr) var(--bottom-h);
    }
    .feedback-bar{
      display:grid; grid-template-columns:minmax(300px,1fr) auto minmax(300px,1fr); align-items:center;
      padding:8px 18px 0;
      background:transparent;
      border-bottom:0;
      box-shadow:none;
      backdrop-filter:none;
    }
    .score-group{display:flex;align-items:center;gap:12px;justify-self:start;}
    .drag-hint{
      background:rgba(255,255,255,.96);
      color:#1d7cb0;
      border:2px solid #4ba9db;
      box-shadow:0 3px 0 rgba(75,169,219,.22);
      border-radius:999px;
      padding:6px 14px;
      font-size:12px;
      font-weight:900;
      letter-spacing:.04em;
      white-space:nowrap;
      pointer-events:none;
    }
    .feedback{
      text-align:center; font-size:clamp(28px,3vw,42px); font-weight:800; color:#172f46;
      min-height:1em;
      text-shadow:0 1px 0 rgba(255,255,255,.8);
    }
    .score{
      justify-self:start; font-size:clamp(25px,2.4vw,34px); font-weight:900; display:flex; align-items:center; gap:8px;
      text-shadow:0 1px 0 rgba(255,255,255,.8);
      background:rgba(255,255,255,.88);
      border:2px solid rgba(255,255,255,.95);
      border-radius:16px;
      padding:5px 12px;
      box-shadow:0 4px 12px rgba(30,86,120,.10);
    }
    .score-check{font-size:1.15em}

    .main{
      min-height:0;
      display:grid;
      grid-template-rows:var(--objects-h) minmax(0,1fr);
      padding:22px clamp(14px,3vw,44px) 12px;
      gap:18px;
    }

    .objects-zone{
      position:relative;
      border-bottom:2px solid rgba(255,240,220,.92);
      overflow:hidden;
    }
    .objects-track{
      width:100%;
      height:100%;
      position:absolute;
      left:0; top:0;
    }
    .object-slot{
      position:absolute;
      left:0; top:50%;
      transform:translate3d(0,-50%,0);
      width:clamp(112px,11.5vw,172px);
      aspect-ratio:1/1;
      display:grid;
      place-items:center;
    }

    .object-card{
      width:90%;
      height:90%;
      border:2px solid rgba(231,124,34,.90);
      background:
        radial-gradient(circle at 28% 24%, rgba(255,255,255,.62), transparent 24%),
        linear-gradient(145deg, rgba(255,192,124,.98), rgba(255,230,152,.96));
      display:grid;
      place-items:center;
      position:relative;
      box-shadow:
        0 10px 18px rgba(50,83,106,.10),
        inset 0 2px 0 rgba(255,255,255,.55);
      transition:transform .12s ease;
      overflow:visible;
      border-radius:6px;
      cursor:grab;
      touch-action:none;
      will-change:transform;
    }
    .object-card img{
      width:auto;
      height:auto;
      max-width:82%;
      max-height:82%;
      object-fit:contain;
      display:block;
      overflow:visible;
      filter:drop-shadow(0 6px 5px rgba(0,0,0,.15));
      pointer-events:none;
    }
    .object-card:hover:not(.dragging){transform:translateY(-3px) scale(1.04)}
    .object-card.dragging{
      cursor:grabbing;
      z-index:250;
      box-shadow:0 12px 26px rgba(28,89,124,.28),0 0 0 5px rgba(255,255,255,.7),0 0 0 9px rgba(69,169,228,.72);
    }
    .object-card.placed{
      opacity:0;
      pointer-events:none;
      transform:scale(.75) !important;
    }
    .object-card:after{
      content:""; position:absolute; inset:0; border-radius:4px;
      box-shadow:inset 0 -10px 18px rgba(255,255,255,.05); pointer-events:none;
    }
    .drag-tip{
      display:none !important;
      position:absolute;
      left:50%;
      bottom:0px;
      transform:translateX(-50%);
      background:rgba(255,255,255,.96);
      color:#1d7cb0;
      border:2px solid #4ba9db;
      box-shadow:0 3px 0 rgba(75,169,219,.22);
      border-radius:999px;
      padding:4px 12px;
      font-size:11px;
      font-weight:900;
      letter-spacing:.04em;
      white-space:nowrap;
      z-index:2;
      pointer-events:none;
    }

    .answers-zone{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:0;
    }
    .answers{
      width:100%;
      max-width:920px; /* Increased from 760px to fit larger blocks */
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:clamp(12px, 2vw, 26px);
    }
    .shape-card{
      width:clamp(120px, 26vw, 200px); /* Increased size by ~20% */
      height:clamp(90px, 19vh, 138px); /* Increased size by ~20% */
      background:linear-gradient(180deg,rgba(252,255,230,.94),rgba(238,245,210,.95));
      border:2px dashed rgba(231,124,34,.75);
      border-radius:6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:6px;
      color:var(--burgundy);
      box-shadow:0 6px 14px rgba(61,95,80,.07);
      transition:transform .12s ease,filter .12s ease,background .18s ease,border-color .18s ease, box-shadow .18s ease;
      position:relative;
    }
    .shape-card img.shape-icon{
      height:clamp(50px, 10.2vh, 82px);
      width:auto;
      max-width:92%;
      object-fit:contain;
      transition:transform .18s ease;
      filter:drop-shadow(0 4px 3px rgba(0,0,0,.12));
      pointer-events:none;
      margin-bottom:4px;
      display:block;
    }
    .shape-name{
      font-size:clamp(16px, 2.1vw, 24px); /* Increased slightly for proportion */
      font-weight:800;
      line-height:1;
      text-align:center;
    }
    
    .shape-card.drop-ready{
      transform:translateY(-4px);
      background:linear-gradient(180deg,rgba(235,252,255,.98),rgba(217,242,249,.96));
      border-color:#3fa7d9;
      box-shadow:0 0 0 4px rgba(255,255,255,.8),0 0 0 6px rgba(63,167,217,.30),0 10px 20px rgba(63,167,217,.15);
    }
    .shape-card.correct{
      border-style:solid;
      border-color:var(--green);
      background:linear-gradient(180deg,rgba(230,255,222,.98),rgba(198,240,182,.96));
      animation:correctPop .6s ease;
    }
    .shape-card.correct img.shape-icon{transform:scale(1.08)}
    .shape-card.wrong{
      animation:shake .36s ease;
      background:rgba(255,218,218,.95);
      border-color:#ef5b54;
    }

    @keyframes correctPop{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
    @keyframes shake{
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-10px)}
      40%{transform:translateX(9px)}
      60%{transform:translateX(-7px)}
      80%{transform:translateX(5px)}
    }

    .bottom-bar{
      display:flex; justify-content:space-between; align-items:center;
      padding:0 16px 10px; position:relative; z-index:12;
    }
    .icon-row{display:flex;align-items:center;gap:14px}
    .icon-btn{
      width:50px; height:50px; border:0; background:rgba(255,255,255,.26); border-radius:13px;
      display:grid; place-items:center; cursor:pointer; color:#152d25; transition:.12s; box-shadow:0 4px 10px rgba(0,0,0,.04);
    }
    .icon-btn:hover{background:rgba(255,255,255,.55);transform:translateY(-2px)}
    .icon-btn svg{width:34px;height:34px}

    .overlay{
      position:fixed;inset:0;z-index:50;
      background:rgba(18,67,99,.35); backdrop-filter:blur(7px);
      display:grid;place-items:center;padding:20px;
    }
    .overlay.hidden{display:none}
    .modal{
      width:min(520px,94vw); background:rgba(255,255,255,.97); border:5px solid white;
      border-radius:28px; box-shadow:0 22px 60px rgba(16,64,97,.28); padding:30px; text-align:center;
    }
    .modal h1,.modal h2{ margin:0 0 10px; color:#3160a6; font-size:clamp(34px,5vw,54px); line-height:1; }
    .modal p{ font-size:19px; color:#506275; font-weight:700; margin:12px auto 24px; max-width:380px; }
    .hero-icon{width:130px;height:110px;margin:0 auto 16px; filter:drop-shadow(0 10px 10px rgba(0,0,0,.15))}
    .primary-btn,.secondary-btn{
      border:0;border-radius:18px;padding:16px 26px;font-size:20px;font-weight:900;cursor:pointer;
      text-transform:uppercase;letter-spacing:.04em;transition:.1s;margin:5px;
    }
    .primary-btn{background:#39b854;color:white;box-shadow:0 6px 0 #268c3d}
    .secondary-btn{background:#e7edf2;color:#526272;box-shadow:0 6px 0 #c3ccd5}
    .primary-btn:active,.secondary-btn:active{transform:translateY(5px);box-shadow:none}

    .menu-panel{
      position:fixed;left:18px;bottom:74px;z-index:45; width:190px;background:white;
      border-radius:18px;padding:10px;box-shadow:0 16px 45px rgba(20,62,82,.25); border:3px solid rgba(255,255,255,.95);
    }
    .menu-panel.hidden{display:none}
    .menu-panel button{
      width:100%;border:0;background:#f4f7f9;border-radius:12px;padding:11px 12px;
      text-align:left;font-weight:800;color:#3f5466;margin:4px 0;cursor:pointer
    }
    .menu-panel button:hover{background:#eaf4fa}
    #confetti{ position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60; }

    @media (max-height:760px){
      :root{--top-h:64px;--bottom-h:54px;--objects-h:minmax(128px,29%)}
      .main{padding-top:12px;gap:10px}
    }
    @media (max-width:860px){
      .main{padding-left:12px;padding-right:12px;gap:12px}
      .feedback-bar{grid-template-columns:minmax(250px,1fr) auto minmax(80px,1fr)}
      .score-group{gap:8px}
      .drag-hint{font-size:10px;padding:5px 10px}
      .object-slot{width:clamp(94px,14vw,140px)}
      .drag-tip{font-size:9px;padding:3px 8px;bottom:-15px;}
    }
    @media (max-width:620px) and (orientation:portrait){
      :root{--top-h:64px;--bottom-h:58px;--objects-h:minmax(106px,24%)}
      .main{padding:10px 8px 6px;gap:8px}
      .objects-zone{padding:0 4px}
      .object-slot{width:clamp(84px,28vw,102px)}
      .drag-tip{display:none}
      .icon-btn{width:42px;height:42px}
      .icon-btn svg{width:27px;height:27px}
      .icon-row{gap:5px}
      .feedback{font-size:27px}
      .feedback-bar{grid-template-columns:1fr auto 1fr;padding-left:8px;padding-right:8px}
      .score{font-size:22px;padding:4px 9px}
      .drag-hint{display:none}
    }
  </style>
</head>

    ];
    const shapeNames = ["Sphere","Cube","Cuboid","Cone","Cylinder","Prism","Pyramid"];
    const groupedByShape = shapeNames.reduce((acc,shape) => {
      acc[shape] = questionPool.filter(q => q.answer === shape);
      return acc;
    }, {});

    let rounds = [];
    let currentRoundIndex = 0;
    let score = 0;
    let soundOn = true;
    let matchedInRound = 0;
    let activeDrag = null;
    let pendingAdvance = null;
    let conveyorSlots = [];
    let conveyorRAF = null;

    const feedback = document.getElementById("feedback");
    const scoreEl = document.getElementById("score");
    const objectsTrack = document.getElementById("objectsTrack");
    const answers = document.getElementById("answers");
    const startOverlay = document.getElementById("startOverlay");
    const finishOverlay = document.getElementById("finishOverlay");
    const finalScore = document.getElementById("finalScore");
    const menuPanel = document.getElementById("menuPanel");
    const soundBtn = document.getElementById("soundBtn");

    const shuffle = arr => {
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]]=[a[j],a[i]];
      }
      return a;
    };

    function updateScore(){
      scoreEl.textContent = score;
    }

    function buildRounds(){
      if (pendingAdvance) clearTimeout(pendingAdvance);
      stopConveyor();
      rounds = [];
      currentRoundIndex = 0;
      score = 0;
      matchedInRound = 0;
      feedback.textContent = "";
      const usedObjects = new Set();
      for(let r=0; r<ROUND_LENGTH; r++){
        const roundShapes = shuffle(shapeNames).slice(0, OBJECTS_PER_ROUND);
        const roundItems = roundShapes.map(shape => {
          let choices = shuffle(groupedByShape[shape]);
          let selected = choices.find(item => !usedObjects.has(item.name)) || choices[0];
          usedObjects.add(selected.name);
          return selected;
        });
        rounds.push(shuffle(roundItems));
      }
      renderRound();
    }

    function getCurrentRound(){
      return rounds[currentRoundIndex] || [];
    }

    function renderRound(){
      if (pendingAdvance) clearTimeout(pendingAdvance);
      stopConveyor();
      feedback.textContent = "";
      matchedInRound = 0;
      updateScore();
      renderObjects();
      renderAnswers();
      setTimeout(speakInstructions, 180);
    }

    function renderObjects(){
      const items = getCurrentRound();
      objectsTrack.innerHTML = '';
      conveyorSlots = [];

      const zoneWidth = objectsTrack.parentElement.clientWidth;
      const spacing = zoneWidth / items.length;
      
      items.forEach((item, i) => {
        const slot = document.createElement("div");
        slot.className = "object-slot";
        slot.dataset.slot = i;
        slot.innerHTML = `
          <div class="object-card" data-object="${item.name}" data-answer="${item.answer}" data-src="${item.src}" aria-label="${item.name}">
            <img src="${item.src}" alt="${item.name}">
          </div>
        `;
        objectsTrack.appendChild(slot);
        
        let startX = (i * spacing) + (spacing / 2) - (140 / 2); 
        slot.style.transform = `translate3d(${startX}px, -50%, 0)`;

        conveyorSlots.push({ el: slot, x: startX, width: 140 });
        enableDrag(slot.querySelector(".object-card"));
      });

      requestAnimationFrame(() => {
        conveyorSlots.forEach(s => s.width = s.el.offsetWidth || 140);
        startConveyor();
      });
    }

    function startConveyor() {
      if (conveyorRAF) return;
      function loop() {
        const zoneWidth = objectsTrack.parentElement.clientWidth;
        conveyorSlots.forEach(slot => {
          slot.x += conveyorSpeed;
          if (slot.x > zoneWidth) {
             slot.x = -slot.width;
          }
          slot.el.style.transform = `translate3d(${slot.x}px, -50%, 0)`;
        });
        conveyorRAF = requestAnimationFrame(loop);
      }
      conveyorRAF = requestAnimationFrame(loop);
    }

    function stopConveyor() {
      if (conveyorRAF) {
        cancelAnimationFrame(conveyorRAF);
        conveyorRAF = null;
      }
    }

    function renderAnswers(){
      answers.innerHTML = "";
      shapeNames.forEach(shape => {
        const card = document.createElement("div");
        card.className = "shape-card";
        card.dataset.shape = shape;
        card.setAttribute("aria-label", shape);
        card.innerHTML = `
          <img class="shape-icon" src="${SHAPE_ICONS[shape]}" alt="${shape}">
          <div class="shape-name">${shape}</div>
        `;
        answers.appendChild(card);
      });
    }

    function enableDrag(card){
      card.addEventListener("pointerdown", onDragStart);
    }

    function onDragStart(e){
      const card = e.currentTarget;
      if (card.classList.contains("placed")) return;
      const rect = card.getBoundingClientRect();
      
      activeDrag = {
        el: card,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        initialX: rect.left,
        initialY: rect.top,
        originParent: card.parentElement,
        currentDrop: null
      };

      card.classList.add("dragging");
      card.style.position = "fixed";
      card.style.margin = "0";
      card.style.left = "0px";
      card.style.top = "0px";
      card.style.width = rect.width + "px";
      card.style.height = rect.height + "px";
      card.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0) scale(1.08)`;
      
      document.body.appendChild(card);
      card.setPointerCapture(e.pointerId);

      window.addEventListener("pointermove", onDragMove);
      window.addEventListener("pointerup", onDragEnd);
      window.addEventListener("pointercancel", onDragEnd);
    }

    function onDragMove(e){
      if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
      const dx = e.clientX - activeDrag.startX;
      const dy = e.clientY - activeDrag.startY;
      
      activeDrag.el.style.transform = `translate3d(${activeDrag.initialX + dx}px, ${activeDrag.initialY + dy}px, 0) scale(1.08)`;

      const elsUnder = document.elementsFromPoint(e.clientX, e.clientY);
      let dropTarget = null;
      for (const el of elsUnder) {
        if (el.closest && el.closest('.shape-card')) {
          dropTarget = el.closest('.shape-card');
          break;
        }
      }
      highlightDropTarget(dropTarget, activeDrag.el.dataset.answer);
    }

    function highlightDropTarget(dropTarget, answer){
      document.querySelectorAll(".shape-card").forEach(card => card.classList.remove("drop-ready"));
      activeDrag && (activeDrag.currentDrop = null);
      if (!dropTarget) return;
      if (dropTarget.classList.contains("matched")) return;
      dropTarget.classList.add("drop-ready");
      if (activeDrag) activeDrag.currentDrop = dropTarget;
    }

    function onDragEnd(e){
      if (!activeDrag || e.pointerId !== activeDrag.pointerId) return;
      window.removeEventListener("pointermove", onDragMove);
      window.removeEventListener("pointerup", onDragEnd);
      window.removeEventListener("pointercancel", onDragEnd);

      const card = activeDrag.el;
      const dropTarget = activeDrag.currentDrop;
      document.querySelectorAll(".shape-card").forEach(shape => shape.classList.remove("drop-ready"));

      if (dropTarget && dropTarget.dataset.shape === card.dataset.answer && !dropTarget.classList.contains("matched")) {
        placeCorrect(card, dropTarget);
      } else {
        revertWrong(card, dropTarget);
      }
      activeDrag = null;
    }

    function placeCorrect(card, dropTarget){
      feedback.textContent = "Correct!";
      playCorrect();
      miniConfetti();
      score++;
      matchedInRound++;
      updateScore();

      dropTarget.classList.add("correct", "matched");

      card.classList.add("placed");
      card.classList.remove("dragging");
      setTimeout(() => {
        if (card && card.parentNode) card.remove();
      }, 180);

      if (matchedInRound >= OBJECTS_PER_ROUND) {
        pendingAdvance = setTimeout(() => {
          if (currentRoundIndex < ROUND_LENGTH - 1) {
            currentRoundIndex++;
            renderRound();
          } else {
            finishGame();
          }
        }, AUTO_NEXT_MS);
      }
    }

    function revertWrong(card, dropTarget){
      feedback.textContent = "Try again!";
      playWrong();
      
      const originParent = activeDrag.originParent;
      const slotRect = originParent.getBoundingClientRect();

      card.classList.remove("dragging");
      card.style.transition = "transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1)";
      card.style.transform = `translate3d(${slotRect.left}px, ${slotRect.top}px, 0) scale(1)`;

      if (dropTarget) {
        dropTarget.classList.remove("drop-ready");
        dropTarget.classList.add("wrong");
        setTimeout(() => dropTarget.classList.remove("wrong"), 360);
      }

      setTimeout(() => {
        if (!card.isConnected) return;
        card.style.transition = "";
        card.style.position = "";
        card.style.left = "";
        card.style.top = "";
        card.style.width = "";
        card.style.height = "";
        card.style.margin = "";
        card.style.zIndex = "";
        card.style.transform = "";
        originParent.appendChild(card);
      }, 230);
    }

    function finishGame(){
      stopConveyor();
      feedback.textContent = "Great job!";
      document.querySelector("#finishOverlay h2").textContent = "Amazing!";
      document.querySelector("#finishOverlay p").textContent = "You matched all the moving objects!";
      finalScore.textContent = `${score} / ${ROUND_LENGTH * OBJECTS_PER_ROUND}`;
      finishOverlay.classList.remove("hidden");
      playFinish();
      confettiBurst(240);
    }

    function speakInstructions(){
      if(!soundOn || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("Drag each moving object to the correct three D shape.");
      u.lang = "en-US";
      u.rate = .9;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    }

    let audioCtx = null;
    function ensureAudio(){
      if(!soundOn) return null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function tone(freq, duration=.12, type="sine", delay=0, gain=.06){
      const ctx = ensureAudio(); if(!ctx) return;
      const t = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + duration);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + duration + .04);
    }
    function playCorrect(){ tone(523,.11,"triangle",0,.06); tone(659,.11,"triangle",.12,.06); tone(784,.18,"triangle",.24,.06); }
    function playWrong(){ tone(180,.12,"sine",0,.045); tone(135,.16,"sine",.1,.04); }
    function playFinish(){ tone(523,.12,"triangle",0,.07); tone(659,.12,"triangle",.13,.07); tone(784,.12,"triangle",.26,.07); tone(1047,.22,"triangle",.39,.075); }

    function updateSoundIcon(){
      soundBtn.innerHTML = soundOn ? `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4h4l5 4V6L9 10H5z"/><path d="M17 9c1.7 1.6 1.7 4.4 0 6"/><path d="M19.5 6.5c3.2 3.1 3.2 7.9 0 11"/></svg>` : `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10v4h4l5 4V6L9 10H5z"/><path d="M18 9l4 6M22 9l-4 6"/></svg>`;
    }

    const c = document.getElementById("confetti");
    const cctx = c.getContext("2d");
    let particles = [];
    function resizeConfetti(){ c.width = innerWidth; c.height = innerHeight; }
    addEventListener("resize", resizeConfetti); resizeConfetti();

    function addPieces(count, small=false){
      const colors = ["#ff5f6d","#ffc83d","#49b6ff","#6bd66b","#a872ef","#ff8c42"];
      const ox = innerWidth/2, oy = small ? innerHeight*.48 : innerHeight*.42;
      for(let i=0;i<count;i++){
        particles.push({
          x: ox + (Math.random()-.5)*(small?180:320), y: oy + (Math.random()-.5)*(small?40:80),
          vx:(Math.random()-.5)*(small?8:14), vy:-(Math.random()*(small?8:15)+4),
          g: small ? .25 : .3, r:Math.random()*5+3, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.28,
          color:colors[Math.floor(Math.random()*colors.length)], life: small ? 70 : 130
        });
      }
    }
    function miniConfetti(){ addPieces(34, true); }
    function confettiBurst(count=220){ addPieces(count, false); }
    function animateConfetti(){
      cctx.clearRect(0,0,c.width,c.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; p.life--;
        cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot);
        cctx.fillStyle = p.color; cctx.fillRect(-p.r, -p.r/2, p.r*2, p.r); cctx.restore();
      });
      particles = particles.filter(p => p.life > 0 && p.y < innerHeight + 50);
      requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    const bgCanvas = document.getElementById("bgCanvas");
    const bgCtx = bgCanvas.getContext("2d", {alpha:false});
    let bgW = 0, bgH = 0, bgTime = 0;
    let clouds = [], flowers = [], reeds = [];

    function resizeBg(){
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      bgW = innerWidth; bgH = innerHeight;
      bgCanvas.width = Math.floor(bgW * dpr); bgCanvas.height = Math.floor(bgH * dpr);
      bgCanvas.style.width = bgW + "px"; bgCanvas.style.height = bgH + "px";
      bgCtx.setTransform(dpr,0,0,dpr,0,0);
      seedBg();
    }

    function seedBg(){
      clouds = []; flowers = []; reeds = [];
      const cloudCount = bgW < 650 ? 4 : 6;
      for(let i=0;i<cloudCount;i++) clouds.push({x: Math.random() * bgW, y: bgH * (0.10 + Math.random() * 0.25), s: 22 + Math.random() * 34, speed: .08 + Math.random() * .08});
      const flowerCount = bgW < 650 ? 14 : 22;
      for(let i=0;i<flowerCount;i++) flowers.push({x: Math.random() * bgW, y: bgH * (.82 + Math.random() * .13), scale: .5 + Math.random() * .5, color: ["#ff87b0","#ffffff","#ffd54f","#95d8ff","#ce93ff"][i % 5]});
      const reedCount = bgW < 650 ? 22 : 42;
      for(let i=0;i<reedCount;i++) reeds.push({x: (i / reedCount) * bgW + Math.random() * 20, h: 14 + Math.random() * 32, sway: Math.random() * Math.PI * 2});
    }

    function updateBg(){
      bgTime += 0.018;
      clouds.forEach(c => { c.x += c.speed; if(c.x - c.s * 3 > bgW) c.x = -c.s * 3; });
    }

    function drawCloud(c){
      bgCtx.save(); bgCtx.translate(c.x, c.y); bgCtx.fillStyle = "rgba(255,255,255,.82)";
      bgCtx.beginPath(); bgCtx.arc(0,0,c.s,0,Math.PI*2); bgCtx.arc(c.s*.82,c.s*.15,c.s*.72,0,Math.PI*2);
      bgCtx.arc(-c.s*.8,c.s*.18,c.s*.66,0,Math.PI*2); bgCtx.arc(c.s*.10,-c.s*.25,c.s*.72,0,Math.PI*2);
      bgCtx.fill(); bgCtx.restore();
    }

    function drawFlower(f){
      bgCtx.save(); bgCtx.translate(f.x + Math.sin(bgTime + f.x * .01) * 2, f.y); bgCtx.scale(f.scale, f.scale);
      bgCtx.strokeStyle = "#4b9e37"; bgCtx.lineWidth = 2.4; bgCtx.beginPath(); bgCtx.moveTo(0, 6); bgCtx.quadraticCurveTo(1, 14, 0, 24); bgCtx.stroke();
      bgCtx.fillStyle = f.color;
      for(let i=0;i<6;i++){ bgCtx.save(); bgCtx.rotate(i * Math.PI / 3); bgCtx.beginPath(); bgCtx.ellipse(0, -9, 5, 10, 0, 0, Math.PI * 2); bgCtx.fill(); bgCtx.restore(); }
      bgCtx.fillStyle = "#ffe16a"; bgCtx.beginPath(); bgCtx.arc(0, 0, 4.5, 0, Math.PI * 2); bgCtx.fill(); bgCtx.restore();
    }

    function drawTreeCluster(x, y, scale=1){
      bgCtx.save(); bgCtx.translate(x, y); bgCtx.scale(scale, scale); bgCtx.fillStyle = "#6f4625"; bgCtx.fillRect(-12, 10, 24, 80);
      bgCtx.fillStyle = "#73b14d";
      [[-38, 4, 36], [0, -15, 42], [34, 3, 34], [-10, 20, 32], [16, 20, 30]].forEach(([tx,ty,r]) => { bgCtx.beginPath(); bgCtx.arc(tx, ty, r, 0, Math.PI * 2); bgCtx.fill(); });
      bgCtx.fillStyle = "rgba(255,255,255,.16)"; bgCtx.beginPath(); bgCtx.arc(-12, -18, 14, 0, Math.PI*2); bgCtx.fill(); bgCtx.restore();
    }

    function drawBush(x, y, scale=1){
      bgCtx.save(); bgCtx.translate(x, y); bgCtx.scale(scale, scale); bgCtx.fillStyle = "#65aa3f";
      [-38,-16,8,32].forEach((dx, i) => { bgCtx.beginPath(); bgCtx.arc(dx, 0, 24 + (i % 2) * 4, Math.PI, Math.PI * 2); bgCtx.fill(); }); bgCtx.restore();
    }

    function drawBench(x, y, scale=1){
      bgCtx.save(); bgCtx.translate(x,y); bgCtx.scale(scale, scale);
      bgCtx.fillStyle = "#c59654"; bgCtx.fillRect(0,0,120,14); bgCtx.fillRect(10,16,96,13);
      bgCtx.fillStyle = "#8b6435"; bgCtx.save(); bgCtx.transform(1,-.45,0,1,0,0); bgCtx.fillRect(8,28,9,44); bgCtx.fillRect(95,28,9,44); bgCtx.restore(); bgCtx.restore();
    }

    function drawBackground(){
      const sky = bgCtx.createLinearGradient(0,0,0,bgH);
      sky.addColorStop(0,"#63b6f2"); sky.addColorStop(.48,"#96daf3"); sky.addColorStop(.70,"#cceff7"); sky.addColorStop(1,"#eef9df");
      bgCtx.fillStyle = sky; bgCtx.fillRect(0,0,bgW,bgH);
      bgCtx.fillStyle = "rgba(255,255,255,.18)"; bgCtx.fillRect(0,bgH*.30,bgW,bgH*.14);
      const sunG = bgCtx.createRadialGradient(90,88,18,90,88,62);
      sunG.addColorStop(0,"rgba(255,245,190,.95)"); sunG.addColorStop(.55,"rgba(255,217,110,.70)"); sunG.addColorStop(1,"rgba(255,217,110,0)");
      bgCtx.fillStyle = sunG; bgCtx.beginPath(); bgCtx.arc(90,88,62,0,Math.PI*2); bgCtx.fill();
      clouds.forEach(drawCloud);

      function mountain(points, fillA, fillB, opacity=1){
        const grad = bgCtx.createLinearGradient(0,bgH*.20,0,bgH*.60);
        grad.addColorStop(0, fillA); grad.addColorStop(1, fillB);
        bgCtx.globalAlpha = opacity; bgCtx.fillStyle = grad; bgCtx.beginPath();
        bgCtx.moveTo(0,bgH); bgCtx.lineTo(points[0][0], points[0][1]);
        for(let i=1;i<points.length;i++) bgCtx.lineTo(points[i][0], points[i][1]);
        bgCtx.lineTo(bgW,bgH); bgCtx.closePath(); bgCtx.fill(); bgCtx.globalAlpha = 1;
      }
      mountain([[0, bgH*.58], [bgW*.10, bgH*.42], [bgW*.18, bgH*.53], [bgW*.30, bgH*.30], [bgW*.44, bgH*.55], [bgW*.58, bgH*.28], [bgW*.72, bgH*.54], [bgW*.86, bgH*.36], [bgW, bgH*.56]], "#8fb6d1", "#6895ba", .65);
      mountain([[0, bgH*.66], [bgW*.12, bgH*.52], [bgW*.23, bgH*.62], [bgW*.36, bgH*.39], [bgW*.52, bgH*.67], [bgW*.68, bgH*.41], [bgW*.79, bgH*.66], [bgW*.91, bgH*.48], [bgW, bgH*.65]], "#b8d5e8", "#8eb6d4", .9);

      bgCtx.fillStyle = "rgba(255,255,255,.88)"; bgCtx.beginPath(); bgCtx.moveTo(bgW*.37, bgH*.39); bgCtx.lineTo(bgW*.41, bgH*.44); bgCtx.lineTo(bgW*.45, bgH*.39); bgCtx.lineTo(bgW*.49, bgH*.44); bgCtx.lineTo(bgW*.53, bgH*.39); bgCtx.lineTo(bgW*.48, bgH*.34); bgCtx.lineTo(bgW*.43, bgH*.37); bgCtx.closePath(); bgCtx.fill();
      bgCtx.fillStyle = "#7fbd51"; bgCtx.beginPath(); bgCtx.moveTo(0, bgH); bgCtx.lineTo(0, bgH*.66);
      for(let x=0; x<=bgW+240; x+=240) bgCtx.quadraticCurveTo(x+80, bgH*.57, x+240, bgH*.66);
      bgCtx.lineTo(bgW, bgH); bgCtx.fill();

      const treeCount = bgW < 650 ? 5 : 9;
      for(let i=0;i<treeCount;i++){ const x = (i/(treeCount-1))*bgW + (Math.sin(i*4.1)*22); drawTreeCluster(x, bgH*.66 + (i%2?8:-6), .38 + (i%3)*.07); }

      const lakeY = bgH*.70; const lake = bgCtx.createLinearGradient(0,lakeY,0,bgH);
      lake.addColorStop(0,"#3ac3e8"); lake.addColorStop(1,"#0f7eb2");
      bgCtx.fillStyle = lake; bgCtx.fillRect(0,lakeY,bgW,bgH-lakeY);
      bgCtx.fillStyle = "rgba(255,255,255,.12)";
      for(let i=0;i<7;i++){ bgCtx.beginPath(); const y = lakeY + 20 + i * 26; bgCtx.ellipse(bgW * (.20 + i*.10), y, 92, 7, 0, 0, Math.PI*2); bgCtx.fill(); }

      bgCtx.fillStyle = "#7ac047";
      bgCtx.beginPath(); bgCtx.moveTo(0,bgH); bgCtx.lineTo(0, bgH*.86); bgCtx.quadraticCurveTo(bgW*.15, bgH*.73, bgW*.36, bgH*.84); bgCtx.lineTo(bgW*.36,bgH); bgCtx.closePath(); bgCtx.fill();
      bgCtx.beginPath(); bgCtx.moveTo(bgW,bgH); bgCtx.lineTo(bgW, bgH*.83); bgCtx.quadraticCurveTo(bgW*.83, bgH*.73, bgW*.62, bgH*.85); bgCtx.lineTo(bgW*.62,bgH); bgCtx.closePath(); bgCtx.fill();

      bgCtx.strokeStyle = "#9ad958"; bgCtx.lineWidth = 12; bgCtx.lineCap = "round";
      bgCtx.beginPath(); bgCtx.moveTo(-10,bgH*.84); bgCtx.quadraticCurveTo(bgW*.20,bgH*.76,bgW*.36,bgH*.84); bgCtx.stroke();
      bgCtx.beginPath(); bgCtx.moveTo(bgW*.62,bgH*.85); bgCtx.quadraticCurveTo(bgW*.82,bgH*.76,bgW+10,bgH*.83); bgCtx.stroke();

      drawBush(110, bgH*.86, 1.1); drawBush(bgW-150, bgH*.85, 1.25); drawBench(18, bgH*.875, .95);
      reeds.forEach(r => { const x = r.x; const baseY = bgH * .97; const sway = Math.sin(bgTime * 1.6 + r.sway) * 3; bgCtx.strokeStyle = "#6dad44"; bgCtx.lineWidth = 2; bgCtx.beginPath(); bgCtx.moveTo(x, baseY); bgCtx.quadraticCurveTo(x + sway, baseY - r.h*.5, x + sway*1.7, baseY - r.h); bgCtx.stroke(); });
      flowers.forEach(drawFlower);
      drawTreeCluster(-10, bgH*.82, 1.55); drawTreeCluster(bgW-25, bgH*.18, 1.82);
    }

    function bgLoop(){ updateBg(); drawBackground(); requestAnimationFrame(bgLoop); }
    window.addEventListener("resize", resizeBg); resizeBg(); requestAnimationFrame(bgLoop);

    document.getElementById("playBtn").addEventListener("click", () => {
      ensureAudio(); startOverlay.classList.add("hidden"); buildRounds();
    });
    document.getElementById("playAgainBtn").addEventListener("click", () => {
      ensureAudio(); finishOverlay.classList.add("hidden"); buildRounds();
    });
    document.getElementById("homeBtn").addEventListener("click", () => {
      finishOverlay.classList.add("hidden"); startOverlay.classList.remove("hidden");
      feedback.textContent = ""; stopConveyor();
    });
    document.getElementById("closeBtn").addEventListener("click", () => {
      finishOverlay.classList.remove("hidden");
      document.querySelector("#finishOverlay h2").textContent = "Game Paused";
      document.querySelector("#finishOverlay p").textContent = "You can play again or return home.";
      finalScore.textContent = `${score} / ${ROUND_LENGTH * OBJECTS_PER_ROUND}`;
    });
    document.getElementById("menuBtn").addEventListener("click", e => {
      e.stopPropagation(); menuPanel.classList.toggle("hidden");
    });
    document.addEventListener("click", e => {
      if(!menuPanel.contains(e.target) && e.target.id !== "menuBtn") menuPanel.classList.add("hidden");
    });
    document.getElementById("restartMenuBtn").addEventListener("click", () => {
      menuPanel.classList.add("hidden"); buildRounds();
    });
    document.getElementById("speakMenuBtn").addEventListener("click", () => {
      menuPanel.classList.add("hidden"); speakInstructions();
    });
    document.getElementById("fullscreenBtn").addEventListener("click", async () => {
      menuPanel.classList.add("hidden");
      try{
        if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      }catch(err){}
    });
    soundBtn.addEventListener("click", () => {
      soundOn = !soundOn;
      if(!soundOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
      updateSoundIcon();
    });
    updateSoundIcon();
  })();
  </script>
</body>
</html>

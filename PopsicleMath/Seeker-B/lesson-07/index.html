        /* BGTemplate-style animated classroom background */
        #backgroundCanvas {
            display: none !important;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Use the canvas background instead of the old CSS-only background */
        body::before,
        body::after {
            display: none !important;
        }

        .decoration,
        .sun-wrapper,
        .cloud,
        .rainbow,
        .tree,
        .flower-field {
            display: none !important;
        }

        #top-bar,
        #game-container,
        #mascot-area {
            position: relative;
        }

        .decoration { position: absolute; z-index: 1; pointer-events: none; opacity: 0.65; }
        .mountain { bottom: 0; width: 100%; height: 23vh; background: linear-gradient(to top, #6EDB83 0%, rgba(120,224,143,0.75) 45%, transparent 100%); clip-path: polygon(0 100%, 12% 46%, 27% 80%, 46% 24%, 68% 76%, 84% 38%, 100% 100%); }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(circle at 18% 18%, rgba(255,255,255,0.75) 0 8%, transparent 9%),
                radial-gradient(circle at 82% 16%, rgba(255,255,255,0.55) 0 6%, transparent 7%),
                linear-gradient(to bottom, #AEEBFF 0%, #DFF8FF 55%, #F7FFF0 100%);
        }
        body::after {
            content: "";
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 13vh;
            pointer-events: none;
            z-index: 2;
            background:
                radial-gradient(circle at 8% 52%, #FF6B9D 0 5px, transparent 6px),
                radial-gradient(circle at 15% 42%, #FFD93D 0 5px, transparent 6px),
                radial-gradient(circle at 24% 58%, #6BCB77 0 5px, transparent 6px),
                radial-gradient(circle at 36% 46%, #4D96FF 0 5px, transparent 6px),
                radial-gradient(circle at 49% 60%, #FF9F1C 0 5px, transparent 6px),
                radial-gradient(circle at 63% 48%, #F15BB5 0 5px, transparent 6px),
                radial-gradient(circle at 78% 57%, #00BBF9 0 5px, transparent 6px),
                radial-gradient(circle at 91% 44%, #9B5DE5 0 5px, transparent 6px),
                linear-gradient(to top, #3EC66B 0%, #8CEB8A 75%, transparent 100%);
            border-top: 6px solid rgba(255,255,255,0.65);
        }
        .rainbow {
            position: absolute;
            top: 7vh;
            left: 6vw;
            width: clamp(190px, 34vw, 430px);
            height: clamp(95px, 17vw, 215px);
            border-radius: 50% 50% 0 0;
            border-top: 16px solid rgba(255, 78, 120, 0.85);
            box-shadow:
                0 -16px 0 0 rgba(255, 205, 86, 0.85) inset,
                0 -32px 0 0 rgba(67, 233, 123, 0.85) inset,
                0 -48px 0 0 rgba(79, 172, 254, 0.85) inset,
                0 -64px 0 0 rgba(162, 155, 254, 0.75) inset;
            opacity: 0.72;
            z-index: 1;
            pointer-events: none;
            transform: rotate(-4deg);
        }
        .tree {
            position: absolute;
            bottom: 7vh;
            width: clamp(54px, 9vw, 105px);
            height: clamp(95px, 17vw, 175px);
            z-index: 3;
            pointer-events: none;
        }
        .tree::before {
            content: "";
            position: absolute;
            left: 42%; bottom: 0;
            width: 18%; height: 46%;
            border-radius: 12px;
            background: linear-gradient(90deg, #8B5A2B, #C8843D, #7A431C);
            box-shadow: inset -4px 0 6px rgba(0,0,0,0.18);
        }
        .tree::after {
            content: "";
            position: absolute;
            left: 5%; top: 0;
            width: 90%; height: 72%;
            border-radius: 50% 50% 46% 46%;
            background:
                radial-gradient(circle at 30% 28%, #9DFF7A 0 14%, transparent 15%),
                radial-gradient(circle at 60% 22%, #6BEA70 0 18%, transparent 19%),
                radial-gradient(circle at 50% 48%, #32C95D 0 44%, #1FA64A 72%);
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.12));
        }
        .tree-left { left: 2vw; }
        .tree-right { right: 4vw; transform: scale(0.9); }
        .flower-field {
            position: fixed;
            bottom: 3.5vh;
            left: 0; right: 0;
            z-index: 4;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            font-size: clamp(16px, 3vmin, 28px);
            filter: drop-shadow(0 3px 3px rgba(0,0,0,0.12));
        }

        .sun-wrapper { position: absolute; top: 2vh; left: 2vw; z-index: 5; width: 12vmin; height: 12vmin; min-width: 60px; min-height: 60px; }
        .sun {
            width: 100%; height: 100%; background: #FFD369; border-radius: 50%;
            box-shadow: 0 0 4vmin #FF9800, 0 0 8vmin #FFD369;
            animation: pulseSun 3s infinite alternate; position: relative;
        }
        .sun-eyes { position: absolute; top: 35%; left: 20%; width: 60%; display: flex; justify-content: space-between; }
        .sun-eye { width: 1.2vmin; height: 1.2vmin; background: #D35400; border-radius: 50%; }
        .sun-smile { position: absolute; top: 55%; left: 35%; width: 30%; height: 1.5vmin; border-bottom: 0.5vmin solid #D35400; border-radius: 50%; }

        @keyframes pulseSun { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .cloud {
            position: absolute; background: white; border-radius: 50px; opacity: 0.9;
            z-index: 2; animation: floatClouds linear infinite; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.05));
        }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: white; border-radius: 50%; }
        .c1 { width: 20vw; height: 6vh; top: 15%; left: -25vw; animation-duration: 48s; }
        .c1::before { width: 10vw; height: 10vw; top: -50%; left: 15%; }
        .c1::after { width: 8vw; height: 8vw; top: -40%; right: 15%; }
        .c2 { width: 16vw; height: 5vh; top: 31%; left: -25vw; animation-duration: 58s; animation-delay: -18s; opacity: 0.75; }
        .c2::before { width: 8vw; height: 8vw; top: -55%; left: 18%; }
        .c2::after { width: 7vw; height: 7vw; top: -45%; right: 18%; }
        .c3 { width: 18vw; height: 5.5vh; top: 8%; left: -25vw; animation-duration: 68s; animation-delay: -34s; opacity: 0.65; }
        .c3::before { width: 9vw; height: 9vw; top: -58%; left: 13%; }
        .c3::after { width: 8vw; height: 8vw; top: -42%; right: 14%; }

        @keyframes floatClouds { from { transform: translateX(-30vw); } to { transform: translateX(140vw); } }

        #top-bar {
            width: 100%; max-width: 1040px;
            padding: clamp(8px, 2vh, 18px) clamp(12px, 4vw, 40px);
            display: grid;
            grid-template-columns: minmax(92px, 1fr) auto minmax(92px, 1fr);
            align-items: center;
            z-index: 100;
            gap: 12px;
        }
        .top-actions {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: clamp(8px, 2vw, 14px);
        }
        .logo-safe-space {
            justify-self: end;
            width: clamp(88px, 15vw, 150px);
            height: clamp(42px, 8vmin, 64px);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
        }
        .oodles-logo {
            display: block !important;
            width: clamp(82px, 13vw, 136px);
            max-width: 100%;
            height: auto;
            object-fit: contain;
            position: relative;
            z-index: 130;
        }
        .icon-btn {
            background: linear-gradient(180deg, #FFFFFF, #F4FBFF); border: 0.45vmin solid #EDF2F7; border-radius: 50%;
            width: clamp(42px, 9vmin, 58px); height: clamp(42px, 9vmin, 58px); font-size: clamp(1.35rem, 4.2vmin, 2rem);
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0.75vmin 0 #CBD5E0, 0 8px 18px rgba(0,0,0,0.12); transition: transform 0.1s;
        }
        .icon-btn:active { transform: translateY(0.75vmin); box-shadow: 0 0 0 #CBD5E0; }
        #score-display {
            background: linear-gradient(135deg, var(--accent), #FFB142); padding: clamp(8px, 1vh, 14px) clamp(28px, 5vw, 80px); border-radius: 40px;
            border: 0.55vmin solid #F6B93B; font-weight: 900; font-size: clamp(1.2rem, 4vw, 1.65rem); color: #B33939;
            display: flex; align-items: center; justify-content: center; gap: 1.5vmin; box-shadow: 0 0.8vmin 0 #F6B93B;
            min-width: clamp(150px, 28vw, 260px);
        }

        #game-container {
            flex: 1; width: 100%; max-width: 850px; position: relative;
            display: flex; flex-direction: column; align-items: center; padding: 1vh 2vw;
            z-index: 10;
            overflow: hidden;
        }

        .screen {
            display: none; flex-direction: column; align-items: center; width: 100%; height: 100%;
            animation: fadeIn 0.6s ease-out; text-align: center;
            justify-content: center;
        }
        .screen.active { display: flex !important; }

        h1, .colorful-title {
            font-size: clamp(1.8rem, 7vw, 3.2rem); font-weight: 900; line-height: 1.1; margin-bottom: 2vh;
            background: linear-gradient(45deg, #FF3E4D, #FFA502, #2ED573, #1E90FF);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(3px 3px 0px white);
        }

        .btn {
            background: linear-gradient(to bottom, #FF5A5F, #E23123); color: white; border: none;
            padding: clamp(1rem, 3vh, 2vh) 8vw; font-size: clamp(1.1rem, 4vw, 1.8rem); font-weight: 900;
            border-radius: 50px; cursor: pointer; box-shadow: 0 1vh 0 #A52A2A;
            transition: all 0.1s; text-transform: uppercase; margin: 2vh;
        }
        .btn:active { transform: translateY(1vh); box-shadow: 0 0 0 #A52A2A; }

        .progress-bg { width: 90%; height: 1.5vh; background: #E2E8F0; border-radius: 15px; margin: 1vh auto; overflow: hidden; border: 0.4vmin solid white; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #FF6B9D, #A29BFE, #6C5CE7); width: 0%; transition: width 0.5s ease; }

        .animals-display {
            font-size: clamp(2rem, 8vw, 4rem); margin: 1.5vh 0; min-height: 12vh;
            display: flex; justify-content: center; align-items: center; gap: 2vw;
            width: 100%;
        }
        .animal-group {
            display: flex; flex-wrap: wrap; justify-content: center; max-width: 48%; gap: 0.5vmin;
            padding: 1.5vmin; background: rgba(255, 255, 255, 0.7); border-radius: 20px;
            border: 2px solid white; box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.05); backdrop-filter: blur(5px);
        }

        .number-bonds {
            position: relative;
            width: clamp(176px, 36vw, 222px);
            height: clamp(144px, 22vh, 170px);
            margin: 0.5vh auto 0.35vh;
        }
        .number-bonds::before {
            content: "";
            position: absolute;
            inset: 8% 6% 6%;
            background:
                radial-gradient(circle at 18% 18%, rgba(255,255,255,0.92) 0 10%, transparent 11%),
                linear-gradient(180deg, rgba(255,255,255,0.96), rgba(246,253,255,0.82));
            border: 3px solid rgba(255,255,255,0.98);
            border-radius: 24px;
            box-shadow: 0 10px 18px rgba(0,0,0,0.08), inset 0 0 0 3px rgba(8,217,214,0.09);
        }
        .number-bonds svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: visible;
        }
        .bond-circle {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            border: 3px solid rgba(255,255,255,0.98);
            box-shadow: 0 8px 14px rgba(0,0,0,0.12), inset 0 4px 8px rgba(255,255,255,0.18);
            z-index: 2;
            text-shadow: 0 2px 0 rgba(0,0,0,0.14);
        }
        .part-circle {
            width: clamp(42px, 8vw, 52px);
            height: clamp(42px, 8vw, 52px);
            font-size: clamp(1rem, 2.25vw, 1.34rem);
            background: linear-gradient(135deg, #7ee7ff 0%, #1cb0f6 58%, #0ea5e9 100%);
            top: 24px;
        }
        .part-left { left: clamp(20px, 5vw, 30px); }
        .part-right { right: clamp(20px, 5vw, 30px); }
        .whole-circle {
            background: linear-gradient(135deg, #FFE08A 0%, #FFB142 58%, #f97316 100%);
            width: clamp(58px, 11vw, 72px);
            height: clamp(58px, 11vw, 72px);
            font-size: clamp(1.45rem, 3.3vw, 1.9rem);
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
        }
        .number-bonds .bond-label {
            position: absolute;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(255,255,255,0.9);
            border: 1.5px solid rgba(148,163,184,0.22);
            font-size: clamp(0.44rem, 1vw, 0.58rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #64748b;
            white-space: nowrap;
        }
        .number-bonds .label-left { top: 12px; left: clamp(22px, 5.2vw, 34px); }
        .number-bonds .label-right { top: 12px; right: clamp(22px, 5.2vw, 34px); }
        .number-bonds .label-whole { bottom: 8px; left: 50%; transform: translateX(-50%); }

        .answer-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(86px, 1fr));
            justify-content: center;
            gap: clamp(10px, 2.2vw, 20px);
            margin: 2vh auto 0;
            width: min(92%, 560px);
            padding-bottom: 2vh;
        }
        .answer-btn {
            position: relative;
            background: linear-gradient(180deg, #ffffff 0%, #effaff 100%);
            border: 4px solid #7dd3fc;
            color: var(--secondary-dark);
            font-size: clamp(1.7rem, 5.6vw, 2.55rem);
            font-weight: 900;
            padding: clamp(12px, 2.2vh, 18px) clamp(8px, 3vw, 24px);
            border-radius: 24px;
            box-shadow: 0 9px 0 #0ea5d7, 0 15px 24px rgba(24,153,214,0.18);
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            min-width: 86px;
            overflow: hidden;
        }
        .answer-btn::after {
            content: "";
            position: absolute;
            top: 9px;
            left: 12px;
            right: 12px;
            height: 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.72);
            pointer-events: none;
        }
        .answer-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); }
        .answer-btn:active:not(:disabled) { transform: translateY(8px); box-shadow: 0 1px 0 #0ea5d7, 0 5px 12px rgba(24,153,214,0.18); }
        .answer-btn:disabled { cursor: default; }
        .answer-btn.correct {
            background: linear-gradient(180deg, #7CFF8E 0%, #2ED573 100%);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 9px 0 #159447, 0 16px 26px rgba(46,213,115,0.28);
            text-shadow: 0 2px 0 rgba(0,0,0,0.12);
        }
        .answer-btn.wrong {
            background: linear-gradient(180deg, #FF8B8B 0%, #FF4757 100%);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 9px 0 #C92A36, 0 16px 26px rgba(255,71,87,0.28);
            text-shadow: 0 2px 0 rgba(0,0,0,0.12);
            animation: answerShake 0.34s ease-in-out;
        }
        @keyframes answerShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }


        /* Ver 2: polished icon tiles and answer flow */
        .math-visual-row {
            width: min(96%, 760px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2.4vw, 24px);
            margin: 0 auto;
            min-height: 18vh;
            flex-wrap: wrap;
        }
        .math-visual-row .animals-display {
            flex: 1 1 390px;
            width: auto;
            min-width: 0;
            margin: 1vh 0;
        }
        .math-visual-row .number-bonds {
            flex: 0 0 clamp(176px, 28vw, 222px);
            margin: 0;
        }
        .animal-icon {
            width: clamp(44px, 7.5vmin, 64px);
            height: clamp(44px, 7.5vmin, 64px);
            display: inline-grid;
            place-items: center;
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(255,255,255,.98), rgba(231,248,255,.94));
            border: 3px solid rgba(255,255,255,.96);
            box-shadow: 0 6px 0 rgba(14,165,215,.18), 0 9px 18px rgba(15,23,42,.10);
            font-size: clamp(1.75rem, 5.2vmin, 2.8rem);
            line-height: 1;
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        }
        .top-svg-icon { width: 58%; height: 58%; display:block; }
        .top-svg-icon path, .top-svg-icon circle, .top-svg-icon polygon { vector-effect: non-scaling-stroke; }
        #next-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0.4vh auto 1.3vh;
            min-width: min(240px, 72vw);
            padding: 13px 28px;
            border: 3px solid #ffffff;
            border-radius: 999px;
            color: #ffffff;
            background: linear-gradient(180deg, #58dd69 0%, #20b854 100%);
            box-shadow: 0 8px 0 #14883e, 0 14px 22px rgba(20,136,62,.18);
            font-size: clamp(1rem, 3.6vw, 1.32rem);
            font-weight: 900;
            cursor: pointer;
            transition: transform .12s ease, box-shadow .12s ease;
        }
        #next-btn.show { display: inline-flex; animation: fadeIn .28s ease-out; }
        #next-btn:active { transform: translateY(7px); box-shadow: 0 1px 0 #14883e; }
        .next-arrow { width: 22px; height: 22px; fill: currentColor; }
        @media (max-width: 640px) {
            .math-visual-row { gap: 8px; min-height: 16vh; }
            .math-visual-row .animals-display { flex-basis: 100%; }
            .math-visual-row .number-bonds { flex-basis: 180px; }
            .animal-icon { border-radius: 14px; }
        }

        .speaker-icon {
            display: inline-flex; align-items: center; justify-content: center;
            width: clamp(35px, 9vmin, 45px); height: clamp(35px, 9vmin, 45px); margin-left: 10px; cursor: pointer;
            background: white; border-radius: 50%; border: 2px solid var(--accent);
            box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: transform 0.2s;
            vertical-align: middle;
        }
        .speaker-icon:hover { transform: scale(1.1); }
        .speaker-icon svg { width: 60%; height: 60%; fill: var(--primary); }

        #game-container.run-mode {
            max-width: 100vw;
            width: 100vw;
            padding: 0;
            overflow: visible;
        }
        #screen-run {
            justify-content: flex-start;
            width: 100vw;
            min-height: 100%;
            overflow: visible;
        }


        /* TAP BALLOONS VER 4: fast, smooth, realistic pop */
        .run-instruction {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 900;
            color: #2D3748;
            margin-bottom: 0.7vh;
            font-size: clamp(0.9rem, 2.6vw, 1.12rem);
            background: rgba(255,255,255,0.82);
            border: 3px solid rgba(255,255,255,0.98);
            border-radius: 999px;
            padding: 6px 14px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }
        .mini-speaker {
            width: clamp(32px, 7vmin, 42px);
            height: clamp(32px, 7vmin, 42px);
            margin-left: 0;
            border: 3px solid #87D37C;
        }
        #balloon-game-area {
            position: relative;
            width: 100vw;
            height: calc(100vh - clamp(92px, 15vh, 136px));
            min-height: 330px;
            overflow: hidden;
            margin-top: 0;
            cursor: crosshair;
            touch-action: none;
        }
        .balloon-hud {
            position: absolute;
            top: clamp(8px, 2vh, 18px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            gap: clamp(8px, 2vw, 14px);
            pointer-events: none;
        }
        .balloon-badge {
            min-width: clamp(108px, 18vw, 148px);
            padding: 7px 14px;
            border-radius: 18px;
            border: 3px solid white;
            background: rgba(255,255,255,0.94);
            box-shadow: 0 7px 16px rgba(0,0,0,0.14);
            font-weight: 900;
            font-size: clamp(0.95rem, 3.2vw, 1.25rem);
            color: #475569;
            text-align: center;
        }
        .balloon-badge.pop-count { color: #e83e8c; }
        .balloon-badge.timer { color: #0f8fbf; }
        .balloon {
            position: absolute;
            width: var(--balloon-w, 78px);
            height: calc(var(--balloon-w, 78px) * 1.2);
            border-radius: 50% 50% 47% 47%;
            background: var(--balloon-color, #ff6b9d);
            border: 3px solid rgba(255,255,255,0.72);
            box-shadow:
                inset -10px -14px 18px rgba(0,0,0,0.11),
                inset 10px 10px 14px rgba(255,255,255,0.30),
                0 9px 18px rgba(0,0,0,0.13);
            transform-origin: center bottom;
            will-change: transform;
            z-index: 8;
            cursor: pointer;
            touch-action: none;
        }
        .balloon::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 12%;
            width: 22%;
            height: 10%;
            transform: translateX(-70%) rotate(-20deg);
            border-radius: 50%;
            background: rgba(255,255,255,0.52);
            filter: blur(.2px);
        }
        .balloon::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: calc(-1 * var(--balloon-w, 78px) * .65);
            width: 2px;
            height: calc(var(--balloon-w, 78px) * .66);
            transform: translateX(-50%);
            background: rgba(76,91,110,0.54);
            box-shadow: 0 1px 0 rgba(255,255,255,0.3);
        }
        .balloon-knot {
            position: absolute;
            left: 50%;
            bottom: -10px;
            width: 0;
            height: 0;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 13px solid var(--balloon-color, #ff6b9d);
            filter: brightness(.9);
        }
        .balloon-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding-top: 17%;
            font-size: calc(var(--balloon-w, 78px) * .30);
            filter: drop-shadow(0 1px 0 rgba(255,255,255,.35));
            pointer-events: none;
        }
        /* Ver 4: the tapped balloon disappears immediately. The pop is drawn by
           lightweight particles/ring so the moving balloon never jitters. */
        .balloon.popped {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        .balloon-pop-dot {
            position: absolute;
            left: 0; top: 0;
            width: var(--dot-size, 8px);
            height: calc(var(--dot-size, 8px) * .55);
            border-radius: 999px;
            background: var(--dot-color, #ff6b9d);
            z-index: 18;
            pointer-events: none;
            will-change: transform, opacity;
            transform: translate3d(var(--sx, 0px), var(--sy, 0px), 0) rotate(var(--rot, 0deg));
            animation: balloonBurstV4 .34s cubic-bezier(.14,.72,.26,1) forwards;
        }
        @keyframes balloonBurstV4 {
            0% { opacity: 1; transform: translate3d(var(--sx, 0px), var(--sy, 0px), 0) rotate(var(--rot, 0deg)) scale(1); }
            72% { opacity: .92; }
            100% { opacity: 0; transform: translate3d(var(--ex, 0px), var(--ey, 0px), 0) rotate(calc(var(--rot, 0deg) + 120deg)) scale(.18); }
        }
        .balloon-pop-ring {
            position: absolute;
            width: 18px; height: 18px;
            border: 4px solid rgba(255,255,255,.95);
            border-radius: 50%;
            z-index: 17;
            pointer-events: none;
            will-change: transform, opacity;
            animation: balloonPopRingV4 .22s ease-out forwards;
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--ring-color, #ff6b9d) 68%, transparent);
        }
        @keyframes balloonPopRingV4 {
            0% { opacity: 1; transform: translate(-50%,-50%) scale(.25); }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(3.3); }
        }
        .balloon-pop-flash {
            position: absolute;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,.98);
            z-index: 19;
            pointer-events: none;
            filter: blur(.2px);
            animation: balloonPopFlashV4 .11s ease-out forwards;
        }
        @keyframes balloonPopFlashV4 {
            from { opacity: 1; transform: translate(-50%,-50%) scale(.5); }
            to { opacity: 0; transform: translate(-50%,-50%) scale(2.1); }
        }
        .balloon-game-hint {
            position: absolute;
            left: 50%;
            bottom: clamp(18px, 4vh, 34px);
            transform: translateX(-50%);
            width: min(660px, calc(100% - 28px));
            background: linear-gradient(180deg, #1cb0f6, #159bdd);
            color: white;
            border-radius: 28px;
            padding: 12px 18px;
            font-weight: 900;
            font-size: clamp(0.9rem, 3.2vw, 1.1rem);
            box-shadow: 0 8px 0 #0f84c0, 0 18px 34px rgba(24,153,214,0.25);
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        #celebration-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: min(46vh, 430px);
            pointer-events: none; z-index: 1000;
        }

        #mascot-area { position: absolute; bottom: 1.5vh; left: 2vw; display: flex; align-items: flex-end; gap: 1.5vmin; z-index: 50; pointer-events: none; }
        #mascot { font-size: clamp(35px, 11vmin, 70px); animation: bounce 2s infinite; }
        .bubble {
            background: white; padding: 1vh 3vw; border-radius: 18px; border: 3px solid var(--secondary);
            font-size: clamp(0.8rem, 2vw, 1.1rem); font-weight: 800; color: #2C3E50; position: relative; box-shadow: 0 0.8vh 1.5vh rgba(0,0,0,0.1); max-width: 220px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes coinSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        .hidden { display: none !important; }

        /* Responsive Fix for small screens and portrait devices */
        @media (max-height: 600px) {
            .animals-display { margin: 1vh 0; min-height: 10vh; }
            .number-bonds { width: 158px; height: 128px; }
            .answer-buttons { margin-top: 1vh; }
            h1 { font-size: 1.6rem; }
            #balloon-game-area { height: calc(100vh - 92px); min-height: 300px; }
            #mascot-area { transform: scale(0.88); transform-origin: bottom left; }
        }
        @media (max-width: 540px) {
            #top-bar { grid-template-columns: 1fr auto 1fr; padding-inline: 10px; }
            .top-actions { gap: 6px; }
            .logo-safe-space { width: 76px; }
            #game-container { padding-inline: 10px; }
            .animals-display { gap: 1vw; }
            .animal-group { max-width: 46%; }
                        .tree-left, .tree-right { opacity: 0.55; transform: scale(0.75); }
            #mascot-area { max-width: 96vw; }
            .bubble { max-width: 180px; }
        }
        @media (orientation: portrait) {
            #balloon-game-area { width: 100vw; height: calc(100vh - 104px); min-height: 360px; }
            .run-instruction { max-width: 94vw; }
        }
    </style>
</head>
<body>
    <canvas id="backgroundCanvas" aria-label="Colorful sky, rainbow, trees, flowers, and grass background"></canvas>
    <div class="decoration mountain"></div>
    <div class="sun-wrapper">
        <div class="sun"><div class="sun-eyes"><div class="sun-eye"></div><div class="sun-eye"></div></div><div class="sun-smile"></div></div>
    </div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="rainbow" aria-hidden="true"></div>
    <div class="tree tree-left" aria-hidden="true"></div>
    <div class="tree tree-right" aria-hidden="true"></div>
    <div class="flower-field" aria-hidden="true"><span>🌷</span><span>🌼</span><span>🌻</span><span>🌸</span><span>🌺</span><span>🌼</span><span>🌷</span></div>

    <canvas id="celebration-canvas"></canvas>

    <div id="top-bar">
        <div class="top-actions">
            <button class="icon-btn" onclick="location.reload()" aria-label="Home" title="Home">
                <svg class="top-svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#1CB0F6" d="M3 11.2 12 3l9 8.2v9.3a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20.5z"/><path fill="#0b7eb8" d="M12 1.8 1.6 11.2l1.9 2.1L12 5.6l8.5 7.7 1.9-2.1z"/></svg>
            </button>
            <button class="icon-btn" onclick="toggleMute()" id="mute-btn" aria-label="Sound" title="Sound">
                <svg class="top-svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF5A5F" d="M4 9v6h4l5 4V5L8 9z"/><path fill="none" stroke="#FF5A5F" stroke-width="2.4" stroke-linecap="round" d="M16 8.2c1.1 1 1.7 2.3 1.7 3.8S17.1 14.8 16 15.8M18.7 5.7c1.8 1.7 2.8 3.8 2.8 6.3s-1 4.6-2.8 6.3"/></svg>
            </button>
        </div>
        <div id="score-display">⭐ <span id="score-val">0</span></div>
        <div class="logo-safe-space"><img src="../assets/logo-oodles-math.png" class="oodles-logo" alt="Oodles Math logo"></div>
    </div>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="screen-start" class="screen active">
            <div style="width:clamp(90px,20vmin,132px);height:clamp(90px,20vmin,132px);display:grid;place-items:center;border-radius:36px;background:linear-gradient(145deg,#fff,#e9fbff);border:5px solid #fff;box-shadow:0 12px 0 rgba(8,217,214,.20),0 18px 35px rgba(0,0,0,.12);font-size:clamp(60px,14vmin,92px);animation:bounce 2s infinite;margin-bottom:2vh;">🦁</div>
            <h1 class="colorful-title">Animal Addition Adventure</h1>
            <p style="font-size: clamp(0.9rem, 3vw, 1.3rem); color: #718096; margin-bottom: 3vh; font-weight: 600;">Play & Learn on all your devices!</p>
            <button class="btn" onclick="startGame()">Start Quest!</button>
        </div>

        <!-- Math Game Screen -->
        <div id="screen-math" class="screen">
            <h2 id="math-header" style="color: var(--secondary); text-shadow: 1px 1px white; font-weight: 900; font-size: clamp(1.15rem, 4.2vw, 1.75rem);">Counting with Oodles!</h2>
            <div class="progress-bg"><div class="progress-fill" id="p-bar"></div></div>
            <div id="question-text-area" style="font-size: clamp(1.45rem, 5vw, 2.2rem); line-height: 1.35; font-weight: 900; margin: 1.2vh 0 1.4vh; color: var(--text-main); min-height: 3.6rem; text-shadow: 1px 1px rgba(255,255,255,0.75);"></div>

            <div class="math-visual-row">
                <div class="animals-display" id="animals-display"></div>
            </div>

            <div class="answer-buttons" id="answer-buttons"></div>
            <div id="feedback" style="height: 3vh; margin-top: 1vh; font-weight: 900; font-size: 1.3rem; min-height: 1.5rem;"></div>
            <button id="next-btn" onclick="goNext()" aria-label="Next question">NEXT
                <svg class="next-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7 2.2 2.2L20.4 12 11.2 2.8z"/></svg>
            </button>
        </div>

        <!-- Tap Balloons Mini-game Screen -->
        <div id="screen-run" class="screen">
            <h1 class="colorful-title" style="font-size: clamp(1.6rem, 5vw, 2.35rem); margin-bottom: 0.45vh;">TAP BALLOONS! 🎈</h1>
            <p class="run-instruction">Tap as many balloons as you can!
                <button class="speaker-icon mini-speaker" onclick="event.stopPropagation(); speakText('Tap as many balloons as you can!')" aria-label="Listen to instruction">
                    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
            </p>
            <div id="balloon-game-area" aria-label="Tap balloons mini game">
                <div class="balloon-hud">
                    <div class="balloon-badge pop-count">🎈 <span id="balloon-pop-val">0</span></div>
                    <div class="balloon-badge timer">⏱️ <span id="balloon-time-val">12</span>s</div>
                </div>
                <div id="balloon-game-hint" class="balloon-game-hint">Tap the balloons before they fly away! 🎈✨</div>
            </div>

        <!-- End Screen -->
        <div id="screen-end" class="screen">
            <h1 class="colorful-title" style="margin-bottom: 2vh;">MISSION COMPLETE! 🌟</h1>
            <div style="font-size: clamp(70px, 15vmin, 100px); animation: bounce 2s infinite; margin-bottom: 2vh;">🤴</div>
            <div style="background: white; padding: 2vh 8vw; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 5px solid var(--accent); margin-bottom: 3vh; width: 80%;">
                <h2 style="margin:0; color: var(--text-main); font-size: clamp(1rem, 4vw, 1.5rem);">Final Score</h2>
                <div style="font-size: clamp(3rem, 12vw, 5rem); font-weight: 900; color: var(--primary);"><span id="final-score">0</span></div>
                <p style="font-weight: 700; color: #718096; font-size: clamp(0.8rem, 2.5vw, 1rem);">Hero Rank: <span style="color: var(--success);">MASTER</span></p>

    <div id="mascot-area" style="display:none;">
        <div id="mascot">🐰</div>
        <div class="bubble" id="mascot-text">Bunny is ready!</div>
    </div>


    <script>
        // Animated background based on BGTemplate.html: sky, clouds, rainbow, hills, trees, flowers, and grass.
        (() => {
            const bgCanvas = document.getElementById('backgroundCanvas');
            if (bgCanvas) bgCanvas.style.display = 'none';
            return; // Ver 2 uses the embedded illustrated background image instead.
            const bgCtx = bgCanvas.getContext('2d', { alpha: false });

            let bgWidth = 0;
            let bgHeight = 0;
            let bgClouds = [];
            let bgTrees = [];
            let bgFlowers = [];
            let bgButterflies = [];

            const flowerColors = ['#ff4b4b', '#ffc800', '#ce82ff', '#ffffff', '#1cb0f6', '#ff8fab'];

            function resizeBackgroundCanvas() {
                const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
                bgWidth = window.innerWidth;
                bgHeight = window.innerHeight;
                bgCanvas.width = Math.floor(bgWidth * dpr);
                bgCanvas.height = Math.floor(bgHeight * dpr);
                bgCanvas.style.width = bgWidth + 'px';
                bgCanvas.style.height = bgHeight + 'px';
                bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
                generateBackgroundEnvironment();
            }

            function generateBackgroundEnvironment() {
                bgClouds = [];
                bgTrees = [];
                bgFlowers = [];
                bgButterflies = [];

                const cloudCount = bgWidth < 600 ? 5 : 8;
                for (let i = 0; i < cloudCount; i++) {
                    bgClouds.push({
                        x: Math.random() * bgWidth,
                        y: bgHeight * (0.08 + Math.random() * 0.34),
                        size: 28 + Math.random() * (bgWidth < 600 ? 34 : 52),
                        speed: Math.random() * 0.16 + 0.05,
                        opacity: 0.72 + Math.random() * 0.24
                    });
                }

                const treeCount = bgWidth < 600 ? 6 : 11;
                for (let i = 0; i < treeCount; i++) {
                    bgTrees.push({
                        x: (i / Math.max(1, treeCount - 1)) * bgWidth + (Math.random() * 70 - 35),
                        y: bgHeight * (0.66 + Math.random() * 0.04),
                        scale: 0.48 + Math.random() * 0.56
                    });
                }

                const flowerCount = bgWidth < 600 ? 10 : 18;
                for (let i = 0; i < flowerCount; i++) {
                    bgFlowers.push({
                        x: Math.random() * bgWidth,
                        y: bgHeight * 0.80 + Math.random() * (bgHeight * 0.16),
                        color: flowerColors[Math.floor(Math.random() * flowerColors.length)],
                        scale: 0.42 + Math.random() * 0.42,
                        sway: Math.random() * Math.PI * 2,
                        petals: Math.random() > 0.45 ? 6 : 5
                    });
                }

                for (let i = 0; i < 4; i++) {
                    bgButterflies.push({
                        x: Math.random() * bgWidth,
                        y: bgHeight * (0.28 + Math.random() * 0.24),
                        size: 5 + Math.random() * 4,
                        speed: 0.18 + Math.random() * 0.18,
                        phase: Math.random() * Math.PI * 2,
                        color: ['#ff6b9d', '#ffd93d', '#9b5de5', '#00bbf9'][i % 4]
                    });
                }
            }

            function updateBackground() {
                bgClouds.forEach(cloud => {
                    cloud.x -= cloud.speed;
                    if (cloud.x + cloud.size * 2.4 < 0) {
                        cloud.x = bgWidth + cloud.size * 2.4;
                        cloud.y = bgHeight * (0.08 + Math.random() * 0.34);
                    }
                });

                bgButterflies.forEach(b => {
                    b.x += b.speed;
                    b.phase += 0.08;
                    if (b.x > bgWidth + 30) {
                        b.x = -30;
                        b.y = bgHeight * (0.28 + Math.random() * 0.24);
                    }
                });
            }

            function drawRoundedCloud(cloud) {
                bgCtx.save();
                bgCtx.globalAlpha = cloud.opacity;
                bgCtx.fillStyle = '#ffffff';
                bgCtx.beginPath();
                bgCtx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                bgCtx.arc(cloud.x + cloud.size * 0.82, cloud.y + cloud.size * 0.2, cloud.size * 0.72, 0, Math.PI * 2);
                bgCtx.arc(cloud.x - cloud.size * 0.85, cloud.y + cloud.size * 0.22, cloud.size * 0.68, 0, Math.PI * 2);
                bgCtx.arc(cloud.x + cloud.size * 0.15, cloud.y - cloud.size * 0.28, cloud.size * 0.72, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }

            function drawSun() {
                const x = Math.min(90, bgWidth * 0.12);
                const y = Math.min(92, bgHeight * 0.13);
                const r = Math.max(35, Math.min(bgWidth, bgHeight) * 0.055);
                bgCtx.save();
                bgCtx.translate(x, y);
                bgCtx.fillStyle = 'rgba(255, 213, 82, 0.22)';
                bgCtx.beginPath();
                bgCtx.arc(0, 0, r * 1.75, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.fillStyle = '#FFD369';
                bgCtx.beginPath();
                bgCtx.arc(0, 0, r, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.fillStyle = '#D35400';
                bgCtx.beginPath();
                bgCtx.arc(-r * 0.32, -r * 0.1, r * 0.08, 0, Math.PI * 2);
                bgCtx.arc(r * 0.32, -r * 0.1, r * 0.08, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.strokeStyle = '#D35400';
                bgCtx.lineWidth = Math.max(3, r * 0.07);
                bgCtx.lineCap = 'round';
                bgCtx.beginPath();
                bgCtx.arc(0, r * 0.12, r * 0.36, 0.15 * Math.PI, 0.85 * Math.PI);
                bgCtx.stroke();
                bgCtx.restore();
            }

            function drawRainbow() {
                bgCtx.save();
                bgCtx.translate(bgWidth * 0.5, bgHeight * 0.67);
                bgCtx.lineWidth = Math.max(13, Math.min(22, bgWidth * 0.015));
                bgCtx.lineCap = 'round';
                const rainbowColors = ['#ff4b4b', '#ff9900', '#ffc800', '#58cc02', '#1cb0f6', '#ce82ff'];
                const baseRadius = Math.min(bgWidth * 0.34, bgHeight * 0.46, 420);
                for (let i = 0; i < rainbowColors.length; i++) {
                    bgCtx.strokeStyle = rainbowColors[i];
                    bgCtx.globalAlpha = 0.82;
                    bgCtx.beginPath();
                    bgCtx.arc(0, 0, baseRadius - i * bgCtx.lineWidth, Math.PI, 0);
                    bgCtx.stroke();
                }
                bgCtx.restore();
            }

            function drawTree(tree) {
                bgCtx.save();
                bgCtx.translate(tree.x, tree.y);
                bgCtx.scale(tree.scale, tree.scale);
                bgCtx.fillStyle = '#8B5A2B';
                bgCtx.fillRect(-9, 0, 18, 56);
                bgCtx.fillStyle = '#4ade80';
                bgCtx.beginPath();
                bgCtx.arc(0, -24, 38, 0, Math.PI * 2);
                bgCtx.arc(-25, -12, 29, 0, Math.PI * 2);
                bgCtx.arc(24, -10, 30, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.fillStyle = 'rgba(255,255,255,0.28)';
                bgCtx.beginPath();
                bgCtx.arc(-12, -34, 12, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.restore();
            }

            function drawFlower(flower, time) {
                bgCtx.save();
                const sway = Math.sin(time * 0.0015 + flower.sway) * 1.4;
                bgCtx.translate(flower.x + sway, flower.y);
                bgCtx.scale(flower.scale, flower.scale);

                bgCtx.strokeStyle = '#259a3f';
                bgCtx.lineWidth = 2.4;
                bgCtx.lineCap = 'round';
                bgCtx.beginPath();
                bgCtx.moveTo(0, 5);
                bgCtx.quadraticCurveTo(2, 14, 0, 23);
                bgCtx.stroke();

                bgCtx.fillStyle = '#55d85a';
                bgCtx.beginPath();
                bgCtx.ellipse(-6, 15, 4, 8, -0.8, 0, Math.PI * 2);
                bgCtx.ellipse(6, 18, 4, 8, 0.75, 0, Math.PI * 2);
                bgCtx.fill();

                const petalCount = flower.petals || 6;
                bgCtx.fillStyle = flower.color;
                for (let petal = 0; petal < petalCount; petal++) {
                    bgCtx.save();
                    bgCtx.rotate((Math.PI * 2 * petal) / petalCount);
                    bgCtx.beginPath();
                    bgCtx.ellipse(0, -9, 5.2, 9.5, 0, 0, Math.PI * 2);
                    bgCtx.fill();
                    bgCtx.restore();
                }

                bgCtx.fillStyle = '#ffe066';
                bgCtx.beginPath();
                bgCtx.arc(0, 0, 5, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.strokeStyle = 'rgba(154,103,0,0.28)';
                bgCtx.lineWidth = 1;
                bgCtx.stroke();
                bgCtx.restore();
            }

            function drawButterfly(b) {
                const y = b.y + Math.sin(b.phase) * 10;
                bgCtx.save();
                bgCtx.translate(b.x, y);
                bgCtx.fillStyle = b.color;
                bgCtx.globalAlpha = 0.88;
                bgCtx.beginPath();
                bgCtx.ellipse(-b.size, 0, b.size, b.size * 1.35, Math.sin(b.phase) * 0.5, 0, Math.PI * 2);
                bgCtx.ellipse(b.size, 0, b.size, b.size * 1.35, -Math.sin(b.phase) * 0.5, 0, Math.PI * 2);
                bgCtx.fill();
                bgCtx.strokeStyle = '#334155';
                bgCtx.lineWidth = 1.4;
                bgCtx.beginPath();
                bgCtx.moveTo(0, -b.size * 1.1);
                bgCtx.lineTo(0, b.size * 1.2);
                bgCtx.stroke();
                bgCtx.restore();
            }

            function drawBackground(time = 0) {
                const skyGradient = bgCtx.createLinearGradient(0, 0, 0, bgHeight * 0.72);
                skyGradient.addColorStop(0, '#7dd3fc');
                skyGradient.addColorStop(0.62, '#bae6fd');
                skyGradient.addColorStop(1, '#e0f8ff');
                bgCtx.fillStyle = skyGradient;
                bgCtx.fillRect(0, 0, bgWidth, bgHeight);

                drawSun();
                drawRainbow();

                bgClouds.forEach(drawRoundedCloud);
                bgButterflies.forEach(drawButterfly);

                bgCtx.fillStyle = '#65a30d';
                bgCtx.beginPath();
                bgCtx.moveTo(0, bgHeight);
                bgCtx.lineTo(0, bgHeight * 0.66);
                for (let x = 0; x <= bgWidth + 280; x += 280) {
                    bgCtx.quadraticCurveTo(x - 140, bgHeight * 0.55, x, bgHeight * 0.66);
                }
                bgCtx.lineTo(bgWidth, bgHeight);
                bgCtx.fill();

                bgTrees.forEach(drawTree);

                bgCtx.fillStyle = '#58cc02';
                bgCtx.beginPath();
                bgCtx.moveTo(0, bgHeight);
                bgCtx.lineTo(0, bgHeight * 0.72);
                bgCtx.quadraticCurveTo(bgWidth * 0.5, bgHeight * 0.66, bgWidth, bgHeight * 0.72);
                bgCtx.lineTo(bgWidth, bgHeight);
                bgCtx.fill();

                bgCtx.strokeStyle = '#84cc16';
                bgCtx.lineWidth = Math.max(10, Math.min(18, bgWidth * 0.014));
                bgCtx.lineCap = 'round';
                bgCtx.beginPath();
                bgCtx.moveTo(-20, bgHeight * 0.72);
                bgCtx.quadraticCurveTo(bgWidth * 0.5, bgHeight * 0.66, bgWidth + 20, bgHeight * 0.72);
                bgCtx.stroke();

                bgFlowers.forEach(flower => drawFlower(flower, time));
            }

            function backgroundAnimationLoop(time) {
                updateBackground();
                drawBackground(time);
                requestAnimationFrame(backgroundAnimationLoop);
            }

            window.addEventListener('resize', resizeBackgroundCanvas);
            resizeBackgroundCanvas();
            requestAnimationFrame(backgroundAnimationLoop);
        })();
    </script>

    <script>
        const animals = ['🐶', '🐱', '🐘', '🐸', '🦁', '🐰', '🐼', '🐯'];
        const animalNames = ['dogs', 'cats', 'elephants', 'frogs', 'lions', 'rabbits', 'pandas', 'tigers'];

        let score = 0, questionIndex = 0, currentStep = 1;
        const totalQuestions = 5;
        let count1, count2, animal1, animal2, correctAnswer;
        let soundEnabled = true, audioCtx = null, currentSpeech = "";
        let attemptHadWrong = false;
        let answerLocked = false;

        function animalIcons(animal, count) {
            return Array.from({ length: count }, () => `<span class="animal-icon" aria-hidden="true">${animal}</span>`).join('');
        }

        // --- AUDIO ENGINE ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTone(f, t, d, v=0.1) {
            if(!soundEnabled || !audioCtx) return;
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            g.gain.setValueAtTime(v, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + d);
        }
        function speak() {
            speakText(currentSpeech);
        }
        function speakText(text) {
            if(!soundEnabled || !window.speechSynthesis || !text) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.92;
            u.pitch = 1.08;
            window.speechSynthesis.speak(u);
        }
        function toggleMute() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('mute-btn');
            if (btn) {
                btn.setAttribute('aria-label', soundEnabled ? 'Sound on' : 'Sound off');
                btn.innerHTML = soundEnabled
                    ? `<svg class="top-svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FF5A5F" d="M4 9v6h4l5 4V5L8 9z"/><path fill="none" stroke="#FF5A5F" stroke-width="2.4" stroke-linecap="round" d="M16 8.2c1.1 1 1.7 2.3 1.7 3.8S17.1 14.8 16 15.8M18.7 5.7c1.8 1.7 2.8 3.8 2.8 6.3s-1 4.6-2.8 6.3"/></svg>`
                    : `<svg class="top-svg-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#94A3B8" d="M4 9v6h4l5 4V5L8 9z"/><path fill="none" stroke="#FF4757" stroke-width="2.5" stroke-linecap="round" d="M16.2 9.2l5.2 5.2m0-5.2-5.2 5.2"/></svg>`;
            }
            if(!soundEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
        }

        // --- NAVIGATION ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('game-container').classList.toggle('run-mode', id === 'screen-run');
        }

        function startGame() {
            initAudio(); score = 0; questionIndex = 0;
            document.getElementById('score-val').innerText = score;
            document.getElementById('mascot-area').style.display = 'flex';
            startMathQuestion();
        }

        function startMathQuestion() {
            if (questionIndex >= totalQuestions) {
                endGame();
                return;
            }
            currentStep = 1;
            const i1 = Math.floor(Math.random() * animals.length);
            let i2 = Math.floor(Math.random() * animals.length);
            while(i1 === i2) i2 = Math.floor(Math.random() * animals.length);

            animal1 = animals[i1]; animal2 = animals[i2];
            count1 = Math.floor(Math.random() * 5) + 2; // Reduced slightly for better mobile fit
            count2 = Math.floor(Math.random() * 5) + 2;

            document.getElementById('p-bar').style.width = (questionIndex / totalQuestions) * 100 + "%";
            showScreen('screen-math');
            loadMathStep();
        }

        function loadMathStep() {
            const display = document.getElementById('animals-display');
            const qText = document.getElementById('question-text-area');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('next-btn');

            feedback.innerText = "";
            nextBtn.classList.remove('show');
            attemptHadWrong = false;
            answerLocked = false;

            if (currentStep === 1) {
                currentSpeech = `How many ${animalNames[animals.indexOf(animal1)]} do you see?`;
                display.innerHTML = `<div class="animal-group">${animalIcons(animal1, count1)}</div>`;
                correctAnswer = count1;
                setMascot("Count the first group of animals!");
            } else if (currentStep === 2) {
                currentSpeech = `How many ${animalNames[animals.indexOf(animal2)]} do you see?`;
                display.innerHTML = `<div class="animal-group">${animalIcons(animal2, count2)}</div>`;
                correctAnswer = count2;
                setMascot("Good job! Now, how many in the second group?");
            } else {
                currentSpeech = `How many animals are there altogether?`;
                display.innerHTML = `<div class="animal-group">${animalIcons(animal1, count1)}</div><div class="plus-sign" style="font-weight:900; color:var(--primary); font-size:1.5rem;">+</div><div class="animal-group">${animalIcons(animal2, count2)}</div>`;
                correctAnswer = count1 + count2;
                setMascot("Fantastic! Add them all together for the total!");
            }

            const speakerSVG = `<button class="speaker-icon" onclick="speak()" aria-label="Listen to question"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>`;
            qText.innerHTML = `<span>${currentSpeech}</span> ${speakerSVG}`;
            generateButtons();

            // Every new question is read aloud automatically after it appears.
            setTimeout(() => speakText(currentSpeech), 260);
        }

        function setAnswerButtonsEnabled(enabled) {
            document.querySelectorAll('.answer-btn').forEach(btn => { btn.disabled = !enabled; });
        }

        function generateButtons() {
            const container = document.getElementById('answer-buttons');
            container.innerHTML = "";
            let opts = [correctAnswer];
            while(opts.length < 3) {
                let r = correctAnswer + (Math.floor(Math.random() * 6) - 3);
                if (r > 0 && !opts.includes(r)) opts.push(r);
            }
            opts.sort((a,b) => a - b).forEach(opt => {
                const b = document.createElement('button');
                b.className = 'answer-btn';
                b.innerText = opt;
                b.setAttribute('aria-label', `Answer ${opt}`);
                b.onclick = () => checkMath(opt, b);
                container.appendChild(b);
            });
        }

        function checkMath(val, buttonEl) {
            if (answerLocked) return;
            const f = document.getElementById('feedback');
            if (val === correctAnswer) {
                answerLocked = true;
                setAnswerButtonsEnabled(false);
                buttonEl.classList.add('correct');
                playTone(600, 'sine', 0.2);
                setTimeout(() => playTone(780, 'sine', 0.18), 120);
                f.innerText = attemptHadWrong ? "🌟 CORRECT! Keep going!" : "🌟 CORRECT! +5 ⭐";
                f.style.color = "var(--success)";

                // A question earns points only when it was answered correctly on the first try.
                if (!attemptHadWrong) {
                    score += 5;
                    document.getElementById('score-val').innerText = score;
                }

                document.getElementById('next-btn').classList.add('show');
            } else {
                attemptHadWrong = true;
                setAnswerButtonsEnabled(false);
                buttonEl.classList.add('wrong');
                playTone(150, 'sawtooth', 0.3);
                f.innerText = "Try again! You can still finish this question.";
                f.style.color = "var(--danger)";
                setTimeout(() => {
                    buttonEl.classList.remove('wrong');
                    setAnswerButtonsEnabled(true);
                }, 720);
            }
        }

        function goNext() {
            if (!answerLocked) return;
            playTone(520, 'triangle', 0.08, 0.06);
            document.getElementById('next-btn').classList.remove('show');

            if (currentStep < 3) {
                currentStep++;
                loadMathStep();
                return;
            }

            // One complete addition task is done. Mini-game appears only after every 2 tasks.
            questionIndex++;
            if (questionIndex >= totalQuestions) {
                endGame();
            } else if (questionIndex % 2 === 0) {
                initBalloonGame();
            } else {
                startMathQuestion();
            }
        }

        function setMascot(t) { document.getElementById('mascot-text').innerText = t; }

        // --- TAP BALLOONS MINI-GAME VER 4 ---
        let balloonActive = false;
        let balloonSpawnInterval = null;
        let balloonAnimationFrame = null;
        let balloonEndTime = 0;
        let balloonLastFrame = 0;
        let balloonPopped = 0;
        const BALLOON_GAME_SECONDS = 12;
        const balloonPalette = ['#ff5a7a', '#ff9f43', '#ffd43b', '#58cc02', '#1cb0f6', '#8b5cf6', '#ec4899', '#06b6d4'];
        const balloonFaces = ['😊', '⭐', '🌈', '✨', '💛', '😄'];

        function clearBalloonGame() {
            clearInterval(balloonSpawnInterval);
            balloonSpawnInterval = null;
            if (balloonAnimationFrame) cancelAnimationFrame(balloonAnimationFrame);
            balloonAnimationFrame = null;
            const area = document.getElementById('balloon-game-area');
            if (!area) return;
            area.querySelectorAll('.balloon, .balloon-pop-dot, .balloon-pop-ring, .balloon-pop-flash').forEach(el => el.remove());
        }

        function spawnBalloon(initial = false) {
            if (!balloonActive) return;
            const area = document.getElementById('balloon-game-area');
            if (!area) return;
            const rect = area.getBoundingClientRect();
            const width = Math.max(320, rect.width);
            const height = Math.max(300, rect.height);
            const size = Math.round(62 + Math.random() * 44);
            const color = balloonPalette[Math.floor(Math.random() * balloonPalette.length)];
            const x = Math.max(8, Math.random() * Math.max(20, width - size - 16));
            const y = initial
                ? height * (0.28 + Math.random() * 0.62)
                : height + size * (0.45 + Math.random() * 0.5);

            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            balloon.style.setProperty('--balloon-w', size + 'px');
            balloon.style.setProperty('--balloon-color', color);
            balloon.dataset.x = x.toFixed(2);
            balloon.dataset.y = y.toFixed(2);
            balloon.dataset.baseX = x.toFixed(2);
            balloon.dataset.speed = (48 + Math.random() * 54).toFixed(2);
            balloon.dataset.phase = (Math.random() * Math.PI * 2).toFixed(4);
            balloon.dataset.sway = (12 + Math.random() * 24).toFixed(2);
            balloon.dataset.size = String(size);
            balloon.innerHTML = `<span class="balloon-face">${balloonFaces[Math.floor(Math.random() * balloonFaces.length)]}</span><span class="balloon-knot"></span>`;
            balloon.addEventListener('pointerdown', popBalloon, { passive: false });
            area.appendChild(balloon);
        }

        function makeBalloonBurst(balloon, popX = null, popY = null) {
            const area = document.getElementById('balloon-game-area');
            if (!area) return;
            const bRect = balloon.getBoundingClientRect();
            const aRect = area.getBoundingClientRect();
            const cx = popX == null ? (bRect.left - aRect.left + bRect.width / 2) : popX;
            const cy = popY == null ? (bRect.top - aRect.top + bRect.height / 2) : popY;
            const color = getComputedStyle(balloon).getPropertyValue('--balloon-color').trim() || '#ff6b9d';

            // Tiny white flash at the exact tap point: instant feedback.
            const flash = document.createElement('span');
            flash.className = 'balloon-pop-flash';
            flash.style.left = cx + 'px';
            flash.style.top = cy + 'px';
            area.appendChild(flash);

            // Quick pressure ring, like stretched rubber releasing.
            const ring = document.createElement('span');
            ring.className = 'balloon-pop-ring';
            ring.style.left = cx + 'px';
            ring.style.top = cy + 'px';
            ring.style.setProperty('--ring-color', color);
            area.appendChild(ring);

            // Rubber-like shards. Each one starts exactly at the balloon center
            // and flies away once; no animation remains on the original balloon.
            const pieces = 14;
            for (let i = 0; i < pieces; i++) {
                const dot = document.createElement('span');
                dot.className = 'balloon-pop-dot';
                const angle = (Math.PI * 2 * i) / pieces + (Math.random() - .5) * .22;
                const distance = 34 + Math.random() * 54;
                const size = 5 + Math.random() * 7;
                dot.style.setProperty('--dot-size', size.toFixed(1) + 'px');
                dot.style.setProperty('--dot-color', i % 5 === 0 ? '#ffffff' : color);
                dot.style.setProperty('--sx', (cx - size / 2) + 'px');
                dot.style.setProperty('--sy', (cy - size / 4) + 'px');
                dot.style.setProperty('--ex', (cx - size / 2 + Math.cos(angle) * distance) + 'px');
                dot.style.setProperty('--ey', (cy - size / 4 + Math.sin(angle) * distance + 10) + 'px');
                dot.style.setProperty('--rot', Math.round(Math.random() * 180) + 'deg');
                area.appendChild(dot);
                setTimeout(() => dot.remove(), 390);
            }

            setTimeout(() => flash.remove(), 140);
            setTimeout(() => ring.remove(), 260);
        }

        function popBalloon(e) {
            if (!balloonActive) return;
            e.preventDefault();
            e.stopPropagation();
            const balloon = e.currentTarget;
            if (!balloon || balloon.dataset.popped === '1') return;
            balloon.dataset.popped = '1';

            const area = document.getElementById('balloon-game-area');
            const aRect = area ? area.getBoundingClientRect() : null;
            const bRect = balloon.getBoundingClientRect();
            // Use balloon center for a natural burst; pointerdown makes the response
            // immediate on mouse, touch, and pen.
            const cx = aRect ? bRect.left - aRect.left + bRect.width / 2 : null;
            const cy = aRect ? bRect.top - aRect.top + bRect.height / 2 : null;

            // Hide/remove the moving balloon synchronously BEFORE playing effects.
            // This eliminates the old scale/transform fight that caused a visible jerk.
            balloon.classList.add('popped');
            makeBalloonBurst(balloon, cx, cy);
            balloon.remove();

            balloonPopped++;
            const popVal = document.getElementById('balloon-pop-val');
            if (popVal) popVal.innerText = balloonPopped;

            score += 2;
            document.getElementById('score-val').innerText = score;
            playTone(920 + Math.random() * 120, 'triangle', 0.045, 0.055);
            setTimeout(() => playTone(1240 + Math.random() * 180, 'sine', 0.035, 0.03), 18);

            // Refill quickly so rapid tapping feels responsive.
            if (Math.random() > 0.25) setTimeout(() => spawnBalloon(false), 55);
        }

        function updateBalloons(now) {
            if (!balloonActive) return;
            const area = document.getElementById('balloon-game-area');
            if (!area) return;
            const dt = Math.min(0.035, Math.max(0.001, (now - balloonLastFrame) / 1000 || 0.016));
            balloonLastFrame = now;
            const height = Math.max(300, area.getBoundingClientRect().height);

            area.querySelectorAll('.balloon:not(.popped)').forEach(balloon => {
                const phase = Number(balloon.dataset.phase || 0);
                const sway = Number(balloon.dataset.sway || 18);
                const speed = Number(balloon.dataset.speed || 70);
                const baseX = Number(balloon.dataset.baseX || 0);
                let y = Number(balloon.dataset.y || height);
                y -= speed * dt;
                balloon.dataset.y = y.toFixed(2);
                const x = baseX + Math.sin(now * 0.0017 + phase) * sway;
                balloon.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${Math.sin(now * 0.002 + phase) * 4}deg)`;
                if (y < -Number(balloon.dataset.size || 80) * 1.8) balloon.remove();
            });

            const remaining = Math.max(0, Math.ceil((balloonEndTime - now) / 1000));
            const timeVal = document.getElementById('balloon-time-val');
            if (timeVal) timeVal.innerText = remaining;

            if (now >= balloonEndTime) {
                endBalloonGame();
                return;
            }
            balloonAnimationFrame = requestAnimationFrame(updateBalloons);
        }

        function initBalloonGame() {
            clearBalloonGame();
            showScreen('screen-run');
            balloonActive = true;
            balloonPopped = 0;
            document.getElementById('balloon-pop-val').innerText = '0';
            document.getElementById('balloon-time-val').innerText = String(BALLOON_GAME_SECONDS);
            setMascot('Pop, pop, pop! Tap the balloons before they fly away!');
            setTimeout(() => speakText('Tap as many balloons as you can!'), 220);

            const hint = document.getElementById('balloon-game-hint');
            hint.style.opacity = '1';
            clearTimeout(window.balloonHintTimer);
            window.balloonHintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 4200);

            for (let i = 0; i < 7; i++) spawnBalloon(true);
            balloonSpawnInterval = setInterval(() => {
                if (!balloonActive) return;
                const area = document.getElementById('balloon-game-area');
                const activeCount = area ? area.querySelectorAll('.balloon:not(.popped)').length : 0;
                if (activeCount < 10) spawnBalloon(false);
            }, 430);

            balloonEndTime = performance.now() + BALLOON_GAME_SECONDS * 1000;
            balloonLastFrame = performance.now();
            balloonAnimationFrame = requestAnimationFrame(updateBalloons);
        }

        function endBalloonGame() {
            if (!balloonActive) return;
            balloonActive = false;
            clearInterval(balloonSpawnInterval);
            balloonSpawnInterval = null;
            if (balloonAnimationFrame) cancelAnimationFrame(balloonAnimationFrame);
            balloonAnimationFrame = null;
            playTone(660, 'sine', 0.12, 0.06);
            setTimeout(() => playTone(880, 'triangle', 0.16, 0.05), 100);
            setMascot(`Great popping! You tapped ${balloonPopped} balloon${balloonPopped === 1 ? '' : 's'}!`);
            const area = document.getElementById('balloon-game-area');
            if (area) area.querySelectorAll('.balloon').forEach(b => { b.style.transition = 'opacity .35s ease'; b.style.opacity = '0'; });
            setTimeout(() => {
                clearBalloonGame();
                startMathQuestion();
            }, 720);
        }

        // --- FIREWORKS & CELEBRATION ---
        let fireworksActive = false;
        function endGame() {
            fireworksActive = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('mascot-area').style.display = 'none';
            showScreen('screen-end');
            playTone(400, 'sine', 0.2);
            setTimeout(() => playTone(500, 'sine', 0.2), 200);
            setTimeout(() => playTone(600, 'sine', 0.4), 400);
            startFireworks();
        }

        function startFireworks() {
            const canvas = document.getElementById('celebration-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = Math.min(window.innerHeight * 0.46, 430);

            let particles = [];
            function createFirework() {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height * 0.72);
                const color = `hsl(${Math.random() * 360}, 100%, 50%)`;
                for(let i=0; i<30; i++) {
                    particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1.0,
                        color
                    });
                }
            }

            function update() {
                if(!fireworksActive) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if(Math.random() < 0.08) createFirework();

                particles.forEach((p, i) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.life -= 0.02;
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    if(p.life <= 0) particles.splice(i, 1);
                });
                requestAnimationFrame(update);
            }
            update();
        }

        window.onload = () => { document.querySelector('.c1').style.left = "-30vw"; };
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('celebration-canvas');
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = Math.min(window.innerHeight * 0.46, 430);
            }
        });
    </script>
</body>

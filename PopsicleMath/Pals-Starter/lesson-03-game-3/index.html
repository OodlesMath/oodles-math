<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/brand.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Story Adventure - Odd & Even Ver2</title>

  <!-- Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS for layout -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti for the end screen -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      /* Duolingo style vibrant sky background */
      background: linear-gradient(180deg, #1CB0F6 0%, #89E219 150%);
      margin: 0;
      height: 100vh;
      overflow: hidden; /* Prevent scrolling */
      display: flex;
      flex-direction: column;
      user-select: none; /* Prevent text selection for kids */
    }

    /* --- Duolingo Inspired Landscape Elements --- */
    .landscape-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    /* Realistic Clouds */
    .cloud {
      position: absolute;
      animation: floatCloud 40s linear infinite;
    }

    .cloud-slow {
      animation: floatCloud 60s linear infinite;
    }

    @keyframes floatCloud {
      from { transform: translateX(-200px); }
      to { transform: translateX(110vw); }
    }

    .cloud-shape {
      background: #FFFFFF;
      border-radius: 100px;
      position: relative;
      width: 180px;
      height: 60px;
      box-shadow: inset -5px -5px 15px rgba(0,0,0,0.05), 0 5px 15px rgba(0,0,0,0.05);
    }

    .cloud-shape::before, .cloud-shape::after {
      content: '';
      position: absolute;
      background: #FFFFFF;
      border-radius: 50%;
    }

    .cloud-shape::before {
      width: 90px;
      height: 90px;
      top: -40px;
      left: 25px;
      box-shadow: inset -5px 5px 10px rgba(0,0,0,0.02);
    }

    .cloud-shape::after {
      width: 70px;
      height: 70px;
      top: -25px;
      right: 25px;
    }

    /* Rolling Hills */
    .hill {
      position: absolute;
      bottom: -10vh;
      border-radius: 100%;
      background: #58CC02; /* Duolingo Feather Green */
      border-top: 15px solid #89E219; /* Duolingo Mask Green */
    }
    .hill-back {
      width: 150%;
      height: 40vh;
      left: -25%;
      background: #43C000; /* Duolingo Wing Overlay */
      border-top: 12px solid #58CC02;
      z-index: 1;
    }
    .hill-front-left {
      width: 80%;
      height: 30vh;
      left: -10%;
      z-index: 2;
    }
    .hill-front-right {
      width: 90%;
      height: 35vh;
      right: -10%;
      z-index: 2;
    }

    /* Trees & Flowers */
    .tree {
      position: absolute;
      width: 40px;
      height: 80px;
      z-index: 3;
    }
    .tree-trunk {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 30px;
      background: #8B4513;
      border-radius: 5px;
    }
    .tree-top {
      position: absolute;
      top: 0;
      width: 40px;
      height: 60px;
      background: #43C000;
      border-radius: 20px;
      border-bottom: 5px solid #2d8200;
    }
    .flower {
      position: absolute;
      font-size: 24px;
      z-index: 3;
    }

    /* --- Game UI Styles --- */

    /* Ensure the main content stays centered and fits within the viewport */
    .game-content-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      z-index: 10;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      position: relative; /* Context for logo */
    }

    /* Logo placeholder in top right (invisible but positioned for user to add logo later) */
    .logo-container {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 100px;
      height: 50px;
      z-index: 50;
      /* Background and border removed as requested */
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), inset 0 -8px 0 rgba(0,0,0,0.05);
      backdrop-filter: blur(10px);
      padding: 24px;
      width: 100%;
      border: 4px solid #E5E5E5; /* Duolingo Swan neutral */
    }

    /* Duolingo style button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 16px;
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .btn:active {
      transform: translateY(4px);
    }

    .btn-primary {
      background-color: #58CC02;
      color: white;
      box-shadow: 0 4px 0 #43C000;
    }
    .btn-primary:active {
      box-shadow: 0 0 0 #43C000;
    }

    .btn-secondary {
      background-color: #1CB0F6;
      color: white;
      box-shadow: 0 4px 0 #1899D6;
    }
    .btn-secondary:active {
      box-shadow: 0 0 0 #1899D6;
    }

    .btn-white {
      background-color: white;
      color: #1CB0F6;
      border: 2px solid #E5E5E5;
      box-shadow: 0 4px 0 #E5E5E5;
    }
    .btn-white:active {
      box-shadow: 0 0 0 #E5E5E5;
    }

    /* Number input box styles */
    .number-box {
      width: 60px;
      height: 70px;
      border: 4px solid #E5E5E5;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 900;
      color: #4B4B4B; /* Duolingo Eel */
      background: #F7F7F7; /* Duolingo Polar */
      cursor: pointer;
      transition: all 0.2s;
    }

    .number-box.active {
      border-color: #1CB0F6;
      background: #E8F5FA;
      box-shadow: 0 0 0 4px rgba(28, 176, 246, 0.2);
    }

    /* Numpad styles */
    .numpad-btn {
      aspect-ratio: 1;
      background: white;
      border: 2px solid #E5E5E5;
      border-radius: 16px;
      font-size: 24px;
      font-weight: 800;
      color: #4B4B4B;
      box-shadow: 0 4px 0 #E5E5E5;
      transition: all 0.1s;
    }
    .numpad-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #E5E5E5;
    }

    /* Large beautiful emojis */
    .emoji-item {
      font-size: 50px;
      line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .emoji-item.removed {
      opacity: 0.3;
      filter: grayscale(100%) drop-shadow(0 2px 2px rgba(0,0,0,0.1));
      transform: scale(0.8);
    }

    /* Animations */
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    .shake { animation: shake 0.3s ease-in-out; }

    /* Responsive adjustments */
    @media (min-width: 768px) {
      .number-box { width: 80px; height: 90px; font-size: 40px; }
      .emoji-item { font-size: 64px; }
      .glass-card { padding: 32px; }
    }

    @media (max-width: 767px) {
      .layout-row-mobile-col { flex-direction: column; }
      .emoji-item { font-size: 40px; }
    }

    /* Utility */
    .hidden { display: none !important; }

    /* Speaker pulse */
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(28, 176, 246, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(28, 176, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(28, 176, 246, 0); }
    }
    .speaking {
      animation: pulse-ring 1s infinite;
      color: #1CB0F6 !important;
    }


    /* ================= VER2 UPGRADES ================= */
    body {
      position: relative;
      background: linear-gradient(180deg, #63c7ff 0%, #a9e4ff 50%, #effcff 100%);
    }

    .landscape-container {
      z-index: 0;
      background:
        radial-gradient(circle at 78% 18%, rgba(255,255,255,.38) 0 5%, transparent 5.3%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0));
    }

    .game-content-wrapper { z-index: 10; }

    .sun-ver2 {
      position: absolute;
      top: 5.5%;
      left: 7%;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffbd1 0 12%, #ffd84d 13% 62%, #ffb51b 63% 100%);
      box-shadow: 0 0 0 12px rgba(255,216,77,.16), 0 0 45px rgba(255,198,33,.45);
      z-index: 0;
      animation: sunPulseVer2 4s ease-in-out infinite alternate;
    }
    .sun-ver2::before, .sun-ver2::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: #8b5a2b;
      top: 37%;
      width: 7px;
      height: 9px;
    }
    .sun-ver2::before { left: 29%; }
    .sun-ver2::after { right: 29%; }
    .sun-smile-ver2 {
      position: absolute;
      left: 50%;
      top: 53%;
      width: 30px;
      height: 15px;
      transform: translateX(-50%);
      border-bottom: 4px solid #8b5a2b;
      border-radius: 0 0 24px 24px;
    }
    @keyframes sunPulseVer2 { from { transform: scale(1); } to { transform: scale(1.06); } }

    .rainbow-ver2 {
      position: absolute;
      left: 50%;
      bottom: 17vh;
      width: min(700px, 72vw);
      aspect-ratio: 2 / 1;
      transform: translateX(-50%);
      border-radius: 700px 700px 0 0;
      background: radial-gradient(ellipse at 50% 100%,
        transparent 0 54%,
        #b784f7 54% 59%,
        #4e8df7 59% 64%,
        #2bc0ef 64% 69%,
        #58cc02 69% 74%,
        #ffd43b 74% 79%,
        #ff9f1c 79% 84%,
        #ff5d73 84% 89%,
        transparent 89% 100%);
      opacity: .42;
      z-index: 0;
    }

    .butterfly-ver2 {
      position: absolute;
      z-index: 3;
      font-size: 27px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.12));
      animation: butterflyFloatVer2 5s ease-in-out infinite;
    }
    .butterfly-ver2.b1 { left: 20%; top: 26%; }
    .butterfly-ver2.b2 { right: 16%; top: 17%; animation-delay: -2s; }
    @keyframes butterflyFloatVer2 {
      0%,100% { transform: translate(0,0) rotate(-5deg); }
      50% { transform: translate(18px,-14px) rotate(7deg); }
    }

    .hill-back {
      background: linear-gradient(180deg, #58c95f 0%, #35a94c 100%);
      border-top-color: #7fe27c;
    }
    .hill-front-left, .hill-front-right {
      background: linear-gradient(180deg, #83dc42 0%, #58bb2a 100%);
      border-top-color: #a8ed66;
    }
    .tree-top {
      background: radial-gradient(circle at 35% 25%, #8fea62 0 13%, transparent 14%),
                  linear-gradient(180deg, #57c84d, #2f9e36);
      border-bottom-color: #267a2e;
      box-shadow: 0 5px 12px rgba(30,110,50,.18);
    }

    .glass-card {
      background: rgba(255,255,255,.92);
      border-color: rgba(255,255,255,.98);
      box-shadow: 0 12px 34px rgba(30,94,133,.18), inset 0 -7px 0 rgba(72,112,145,.05);
    }

    /* Ten-frame: 5 vertical pairs. Complete pairs make even numbers visually obvious. */
    #objects-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
    }
    .ten-frame-ver2 {
      display: grid;
      grid-template-columns: repeat(5, 42px);
      grid-template-rows: repeat(2, 42px);
      gap: 4px;
      padding: 7px;
      border: 5px solid #2497d6;
      background: rgba(236,249,255,.96);
      border-radius: 18px;
      box-shadow: 0 7px 0 #197eb8, 0 13px 24px rgba(30,112,158,.16);
    }
    .ten-cell-ver2 {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border: 2px solid #a9dff5;
      border-radius: 10px;
      background: linear-gradient(180deg, #ffffff 0%, #edfaff 100%);
    }
    .ten-cell-ver2.empty { background: rgba(255,255,255,.55); }
    .ten-cell-ver2.added {
      background: linear-gradient(180deg, #fff8d8 0%, #fff0ae 100%);
      border-color: #f8c74d;
    }
    .ten-cell-ver2.removed {
      background: #f2f4f7;
    }
    .picture-icon-ver2 {
      width: 36px;
      height: 36px;
      display: block;
      filter: drop-shadow(0 3px 2px rgba(15,23,42,.14));
      animation: popIn .42s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .ten-cell-ver2.added .picture-icon-ver2 {
      animation: popIn .42s cubic-bezier(.175,.885,.32,1.275) both, gentleBounceVer2 1.8s ease-in-out .45s infinite;
    }
    @keyframes gentleBounceVer2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .ten-cell-ver2.removed .picture-icon-ver2 {
      opacity: .24;
      filter: grayscale(1);
    }
    .remove-x-ver2 {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 47px;
      line-height: 1;
      color: #ff4b4b;
      font-weight: 900;
      text-shadow: 0 2px 0 #fff;
      pointer-events: none;
    }
    .added-badge-ver2 {
      position: absolute;
      right: 3px;
      top: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #ffc800;
      border: 2px solid #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,.16);
    }

    .answer-heading-ver2 {
      color: #4b4b4b;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 900;
      text-align: center;
    }
    .equation-ver2 {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 37px;
      font-weight: 900;
      color: #4b4b4b;
      white-space: nowrap;
    }
    .equation-number-ver2 {
      min-width: 66px;
      padding: 9px 12px;
      border-radius: 16px;
      background: #f7f7f7;
      border: 3px solid #e5e5e5;
      text-align: center;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.03);
    }
    .equation-answer-ver2 {
      color: #1cb0f6;
      background: #e9f7ff;
      border-color: #8ed5f7;
    }
    .answer-grid-ver2 {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 13px;
    }
    .answer-choice-ver2 {
      min-height: 84px;
      border: 4px solid rgba(255,255,255,.9);
      border-radius: 21px;
      color: white;
      font-size: 34px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      text-shadow: 0 2px 0 rgba(0,0,0,.1);
    }
    .answer-choice-ver2:nth-child(1) { background:#8b5cf6; box-shadow:0 7px 0 #6d28d9; }
    .answer-choice-ver2:nth-child(2) { background:#0ea5e9; box-shadow:0 7px 0 #0284c7; }
    .answer-choice-ver2:nth-child(3) { background:#ec4899; box-shadow:0 7px 0 #be185d; }
    .answer-choice-ver2:nth-child(4) { background:#f97316; box-shadow:0 7px 0 #c2410c; }
    .answer-choice-ver2:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .answer-choice-ver2:active { transform: translateY(6px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
    .answer-choice-ver2.wrong { background:#ff4b4b !important; box-shadow:0 7px 0 #d62f2f !important; animation: shake .3s ease-in-out; }
    .answer-choice-ver2.correct { background:#58cc02 !important; box-shadow:0 7px 0 #43a600 !important; }

    @media (max-width: 767px) {
      .ten-frame-ver2 { grid-template-columns: repeat(5, 34px); grid-template-rows: repeat(2, 34px); }
      .ten-cell-ver2 { width:34px; height:34px; }
      .picture-icon-ver2 { width:29px; height:29px; }
      .equation-ver2 { font-size:30px; }
      .equation-number-ver2 { min-width:54px; padding:7px 9px; }
      .answer-choice-ver2 { min-height:68px; font-size:29px; }
      .sun-ver2 { width:68px; height:68px; }
    }

  </style>
</head>
<body>
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
  <!-- Duolingo Style Background Landscape -->
  <div class="landscape-container">
    <div class="sun-ver2"><div class="sun-smile-ver2"></div></div>
    <div class="rainbow-ver2"></div>
    <div class="butterfly-ver2 b1">🦋</div>
    <div class="butterfly-ver2 b2">🦋</div>
    <!-- Realistic Clouds -->
    <div class="absolute top-10 left-[-200px] cloud">
      <div class="cloud-shape"></div>
    </div>
    <div class="absolute top-32 left-[-200px] cloud-slow" style="animation-delay: -15s;">
      <div class="cloud-shape" style="transform: scale(0.7); opacity: 0.8;"></div>
    </div>
    <div class="absolute top-16 left-[-200px] cloud" style="animation-delay: -30s;">
      <div class="cloud-shape" style="transform: scale(0.9); opacity: 0.9;"></div>
    </div>

    <!-- Hills -->
    <div class="hill hill-back"></div>
    <div class="hill hill-front-left"></div>
    <div class="hill hill-front-right"></div>

    <!-- Details: Trees & Flowers -->
    <div class="tree" style="bottom: 25vh; left: 15%;">
      <div class="tree-trunk"></div>
      <div class="tree-top"></div>
    </div>
    <div class="tree" style="bottom: 30vh; right: 20%; transform: scale(0.8);">
      <div class="tree-trunk"></div>
      <div class="tree-top"></div>
    </div>
    <div class="flower" style="bottom: 15vh; left: 30%;">🌷</div>
    <div class="flower" style="bottom: 10vh; right: 35%;">🌻</div>
    <div class="flower" style="bottom: 20vh; right: 10%;">🌼</div>
  </div>

  <div class="game-content-wrapper">
    <!-- Logo area reserved (invisible placeholder) -->
    <div class="logo-container" id="logo-container">
      <!-- Add your <img> logo tag here in the future -->
    </div>

    <!-- ================= START SCREEN ================= -->
    <div id="screen-start" class="glass-card text-center max-w-md w-full pop-in flex flex-col items-center gap-6">
      <!-- Decorative Numbers -->
      <div class="flex justify-center -space-x-4 mb-4">
        <div class="w-16 h-16 bg-[#FF4B4B] rounded-full border-4 border-white flex items-center justify-center text-white text-3xl font-black rotate-[-10deg] shadow-lg">1</div>
        <div class="w-16 h-16 bg-[#1CB0F6] rounded-full border-4 border-white flex items-center justify-center text-white text-3xl font-black rotate-[5deg] shadow-lg z-10">2</div>
        <div class="w-16 h-16 bg-[#FFC800] rounded-full border-4 border-white flex items-center justify-center text-white text-3xl font-black rotate-[-5deg] shadow-lg">3</div>
      </div>

      <div>
        <h1 class="text-4xl font-black text-[#4B4B4B] leading-tight uppercase">Math Adventure</h1>
        <p class="text-[#777777] font-bold mt-2 text-lg">Count, add, subtract, and find Odd or Even!</p>
      </div>

      <button class="btn btn-primary w-full py-4 text-2xl mt-4" onclick="startGame()">
        <i data-lucide="play" class="w-8 h-8 fill-current"></i> PLAY NOW
      </button>

      <button id="toggle-sound-start" class="btn btn-white w-full py-3 text-lg" onclick="toggleSound()">
        <i data-lucide="volume-2" id="icon-sound-start" class="w-6 h-6"></i> SOUND: ON
      </button>
    </div>

    <!-- ================= GAME SCREEN ================= -->
    <div id="screen-game" class="w-full hidden flex flex-col gap-4 h-full max-h-[800px]">

      <!-- Top Bar: Progress and Controls -->
      <div class="flex justify-between items-center w-full glass-card py-3 px-4 md:px-6 flex-shrink-0">
        <!-- Sound Toggle -->
        <button onclick="toggleSound()" class="p-2 rounded-xl bg-[#F7F7F7] text-[#4B4B4B] hover:bg-[#E5E5E5] transition-colors">
          <i data-lucide="volume-2" id="icon-sound-game" class="w-6 h-6"></i>
        </button>

        <!-- Progress Bar -->
        <div class="flex-1 mx-4 max-w-sm">
          <div class="h-4 w-full bg-[#E5E5E5] rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-[#58CC02] transition-all duration-500 w-0"></div>
          </div>
        </div>

        <!-- Score/Stars -->
        <div class="flex items-center gap-2 bg-[#FFC800] text-white px-4 py-1.5 rounded-xl font-black text-xl shadow-[0_4px_0_0_#D9A300]">
          <i data-lucide="star" class="w-5 h-5 fill-current"></i>
          <span id="score-display">0</span>
        </div>
      </div>

      <!-- Main Game Area -->
      <div class="flex-1 flex flex-col md:flex-row gap-4 min-h-0">

        <!-- Left/Top Side: Story & Visuals -->
        <div class="glass-card flex-1 flex flex-col items-center justify-center p-6 text-center overflow-y-auto">

          <!-- Story Text with Speaker Icon -->
          <div class="bg-[#F7F7F7] p-4 md:p-6 rounded-2xl w-full border-2 border-[#E5E5E5] mb-6 relative group cursor-pointer" onclick="readQuestionAloud()">
             <p id="story-text" class="text-xl md:text-2xl text-[#4B4B4B] font-bold leading-relaxed pr-10"></p>
             <button id="btn-speak" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#AFAFAF] hover:text-[#1CB0F6] transition-colors">

          <!-- Objects Visualization (Emojis) -->
          <div id="objects-container" class="flex flex-wrap justify-center gap-3 md:gap-4 my-auto py-4 w-full">

          </div>

        <!-- Right/Bottom Side: Interaction Phase -->
        <div class="glass-card md:w-[400px] flex-shrink-0 flex flex-col justify-center gap-6">

          <!-- Phase 1: Choose the Math Answer (Ver2) -->
          <div id="phase-math" class="flex flex-col items-center w-full gap-5">

            <div class="equation-ver2" aria-label="Math equation">

              <span id="operator-display">+</span>

              <div class="equation-number-ver2 equation-answer-ver2">?</div>

            <div id="answer-choices" class="answer-grid-ver2" aria-label="Choose one answer">
              <!-- Four answer choices generated by JavaScript -->

          <!-- Phase 2: Odd/Even Classification -->
          <div id="phase-oddeven" class="hidden flex flex-col items-center gap-6 w-full h-full justify-center">

            <div class="flex flex-col gap-4 w-full">
              <!-- Odd Button -->
              <button class="btn py-6 text-2xl flex-col gap-2 bg-[#FF9600] text-white shadow-[0_4px_0_0_#CC7800] border-0" onclick="checkOddEven('odd')">
                <div class="flex gap-1 justify-center">
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                  <div class="w-4 h-4 bg-white/50 rounded-full"></div>
                  <div class="w-4 h-4 bg-white/50 rounded-full"></div>
                </div>
                ODD
              </button>
              <!-- Even Button -->
              <button class="btn py-6 text-2xl flex-col gap-2 bg-[#CE82FF] text-white shadow-[0_4px_0_0_#A568CC] border-0" onclick="checkOddEven('even')">
                <div class="flex gap-1 justify-center">
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                  <div class="w-4 h-4 bg-white/50 rounded-full"></div>
                  <div class="w-4 h-4 bg-white/50 rounded-full"></div>
                </div>
                EVEN
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- ================= END SCREEN ================= -->
    <div id="screen-end" class="glass-card text-center max-w-md w-full hidden flex-col items-center gap-6 relative z-[100]">
      <i data-lucide="trophy" class="w-32 h-32 text-[#FFC800] fill-current drop-shadow-lg mx-auto"></i>

      <div>
        <h2 class="text-4xl font-black text-[#4B4B4B] uppercase">Great Job!</h2>
        <p class="text-[#777777] font-bold text-xl mt-2">You completed the adventure.</p>
      </div>

      <div class="flex items-center justify-center gap-3 text-[#58CC02] text-6xl font-black my-4">
        <i data-lucide="star" class="w-16 h-16 fill-current"></i>
        <span id="final-score">0</span>
      </div>

      <button class="btn btn-primary w-full py-4 text-2xl" onclick="startGame()">
        <i data-lucide="rotate-ccw" class="w-8 h-8"></i> PLAY AGAIN
      </button>
    </div>

  </div>

  <!-- Fullscreen Feedback Overlay (Correct/Incorrect) -->
  <div id="feedback-overlay" class="fixed inset-0 z-[200] hidden flex-col items-center justify-center backdrop-blur-sm transition-all duration-200">
    <div id="feedback-card" class="bg-white p-10 rounded-3xl shadow-2xl flex flex-col items-center gap-4 transform scale-50 opacity-0 transition-all duration-300">
      <div id="feedback-icon-container" class="w-32 h-32 rounded-full flex items-center justify-center mb-4">
        <i id="feedback-icon" class="w-20 h-20 text-white stroke-[3]"></i>
      </div>
      <h2 id="feedback-title" class="text-5xl font-black uppercase"></h2>
    </div>
  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // --- GAME DATA & CONFIG ---
    const apiKey = "";
    const MAX_QUESTIONS = 10;

    // Ver2: cleaner picture icons with separate colors for newly added objects.
    const THEMES = {
      ducks: {
        id: 'ducks', iconType: 'duck', type: 'subtraction',
        baseColor: '#f7c948', addedColor: '#66c7f2',
        storyTemplate: (start, change) => `There are ${start} ducks swimming. ${change} ducks fly away.`,
        question: 'How many ducks are left?', operator: '-'
      },
      cars: {
        id: 'cars', iconType: 'car', type: 'addition',
        baseColor: '#ef4444', addedColor: '#2563eb',
        storyTemplate: (start, change) => `You have ${start} red cars. You find ${change} more blue cars.`,
        question: 'How many cars in total?', operator: '+'
      },
      apples: {
        id: 'apples', iconType: 'apple', type: 'subtraction',
        baseColor: '#ef4444', addedColor: '#84cc16',
        storyTemplate: (start, change) => `There are ${start} apples on the tree. You pick ${change}.`,
        question: 'How many apples remain?', operator: '-'
      },
      candies: {
        id: 'candies', iconType: 'candy', type: 'addition',
        baseColor: '#ec4899', addedColor: '#8b5cf6',
        storyTemplate: (start, change) => `You have ${start} pink candies. A friend gives you ${change} more purple candies.`,
        question: 'How many candies do you have?', operator: '+'
      }
    };

    let state = {
      problems: [],
      currentIndex: 0,
      score: 0,
      soundEnabled: true,
      inputs: { num1: '', num2: '', total: '' },
      activeBox: 'num1',
      isSpeaking: false
    };

    // --- AUDIO SYSTEM (Synthesizer + TTS) ---
    let audioCtx = null;
    let ttsAudioElement = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      const iconStart = document.getElementById('icon-sound-start');
      const iconGame = document.getElementById('icon-sound-game');
      const btnStart = document.getElementById('toggle-sound-start');

      if (state.soundEnabled) {
        iconStart.setAttribute('data-lucide', 'volume-2');
        iconGame.setAttribute('data-lucide', 'volume-2');
        btnStart.innerHTML = `<i data-lucide="volume-2" class="w-6 h-6 inline-block mr-2"></i> SOUND: ON`;
      } else {
        iconStart.setAttribute('data-lucide', 'volume-x');
        iconGame.setAttribute('data-lucide', 'volume-x');
        btnStart.innerHTML = `<i data-lucide="volume-x" class="w-6 h-6 inline-block mr-2"></i> SOUND: OFF`;
        if (ttsAudioElement) {
          ttsAudioElement.pause();
          ttsAudioElement = null;
        }
      }
      lucide.createIcons();
    }

    function playTone(type) {
      if (!state.soundEnabled) return;
      initAudio();

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'success') {
        osc.type = 'sine';
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'tap') {
        osc.type = 'triangle';
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.frequency.setValueAtTime(600, now);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'win') {
        osc.type = 'square';
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
        [523, 659, 783, 1046, 1318].forEach((f, i) => {
          osc.frequency.setValueAtTime(f, now + i * 0.15);
        });
        osc.start(now);
        osc.stop(now + 1.5);
      }
    }

    // --- TTS Logic ---
    const pcmToWav = (pcmData, sampleRate) => {
      const buffer = new ArrayBuffer(44 + pcmData.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 32 + pcmData.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcmData.length * 2, true);
      for (let i = 0; i < pcmData.length; i++) {
        view.setInt16(44 + i * 2, pcmData[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    };

    async function speakText(text) {
      if (!state.soundEnabled || state.isSpeaking) return;

      const btnSpeak = document.getElementById('btn-speak');
      btnSpeak.classList.add('speaking');
      state.isSpeaking = true;

      try {
        if (!apiKey) {
           // Fallback to basic browser TTS if no key
           const utterance = new SpeechSynthesisUtterance(text);
           utterance.onend = () => {
             state.isSpeaking = false;
             btnSpeak.classList.remove('speaking');
           };
           window.speechSynthesis.speak(utterance);
           return;
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Say in a cheerful, slow, and clear teacher's voice for a young child: ${text}` }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } // Friendly female voice
              }
            }
          })
        });

        const result = await response.json();
        const base64Audio = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

        if (base64Audio) {
          const binaryString = atob(base64Audio);
          const len = binaryString.length;
          const bytes = new Int16Array(len / 2);
          for (let i = 0; i < len; i += 2) {
            bytes[i / 2] = (binaryString.charCodeAt(i + 1) << 8) | binaryString.charCodeAt(i);
          }
          const wavBlob = pcmToWav(bytes, 24000);
          const url = URL.createObjectURL(wavBlob);

          if (ttsAudioElement) { ttsAudioElement.pause(); }

          ttsAudioElement = new Audio(url);
          ttsAudioElement.onended = () => {
            state.isSpeaking = false;
            btnSpeak.classList.remove('speaking');
          };
          ttsAudioElement.play();
        } else {
          state.isSpeaking = false;
          btnSpeak.classList.remove('speaking');
        }
      } catch (error) {
        console.error("Speech error:", error);
        state.isSpeaking = false;
        btnSpeak.classList.remove('speaking');
      }
    }

    function readQuestionAloud() {
      const p = state.problems[state.currentIndex];
      const text = `${p.theme.storyTemplate(p.num1, p.num2)} ${p.theme.question}`;
      speakText(text);
    }

    // --- GAME LOGIC ---

    function generateAllUniqueProblems() {
      const allPossibleProblems = [];
      const themeKeys = Object.keys(THEMES);

      // Ver2 requirement: every number shown in the equation stays in the 7-20 range.
      themeKeys.forEach(key => {
        const theme = THEMES[key];
        if (theme.type === 'addition') {
          for (let n1 = 7; n1 <= 13; n1++) {
            for (let n2 = 7; n2 <= 13; n2++) {
              const answer = n1 + n2;
              if (answer >= 7 && answer <= 20) {
                allPossibleProblems.push({ theme, num1: n1, num2: n2, answer });
              }
            }
          }
        } else {
          for (let n1 = 14; n1 <= 20; n1++) {
            for (let n2 = 7; n2 <= 13; n2++) {
              const answer = n1 - n2;
              if (answer >= 7 && answer <= 20) {
                allPossibleProblems.push({ theme, num1: n1, num2: n2, answer });
              }
            }
          }
        }
      });

      for (let i = allPossibleProblems.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allPossibleProblems[i], allPossibleProblems[j]] = [allPossibleProblems[j], allPossibleProblems[i]];
      }

      return allPossibleProblems.slice(0, Math.min(MAX_QUESTIONS, allPossibleProblems.length));
    }

    function startGame() {
      initAudio();
      playTone('tap');

      state.problems = generateAllUniqueProblems();
      state.currentIndex = 0;
      state.score = 0;

      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-end').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');

      renderProblem();
    }

    function getPictureSvg(theme, isAdded = false) {
      const color = isAdded ? theme.addedColor : theme.baseColor;
      const dark = isAdded ? '#1f4f99' : '#9a3412';

      if (theme.iconType === 'duck') {
        return `<svg class="picture-icon-ver2" viewBox="0 0 80 80" aria-hidden="true">
          <ellipse cx="38" cy="49" rx="25" ry="17" fill="${color}"/>
          <circle cx="54" cy="31" r="14" fill="${color}"/>
          <path d="M65 31 L78 36 L65 41 Z" fill="#f59e0b"/>
          <ellipse cx="31" cy="48" rx="12" ry="8" fill="#fff2a8" opacity=".72"/>
          <circle cx="58" cy="28" r="2.8" fill="#1f2937"/>
          <circle cx="59" cy="27" r=".9" fill="#fff"/>
          <path d="M16 47 Q8 40 7 31 Q19 33 25 42" fill="${color}"/>
          <path d="M25 64 Q39 70 54 63" fill="none" stroke="#d99b18" stroke-width="3" stroke-linecap="round" opacity=".65"/>
        </svg>`;
      }

      if (theme.iconType === 'car') {
        return `<svg class="picture-icon-ver2" viewBox="0 0 80 80" aria-hidden="true">
          <path d="M12 48 L18 34 Q20 29 26 28 H52 Q58 29 62 35 L69 48 Z" fill="${color}"/>
          <rect x="9" y="46" width="62" height="17" rx="7" fill="${color}"/>
          <path d="M27 31 H39 V44 H20 Z" fill="#dff4ff" stroke="#ffffff" stroke-width="2"/>
          <path d="M43 31 H52 Q56 32 59 38 L62 44 H43 Z" fill="#dff4ff" stroke="#ffffff" stroke-width="2"/>
          <circle cx="24" cy="62" r="8" fill="#263238"/><circle cx="24" cy="62" r="3.5" fill="#cbd5e1"/>
          <circle cx="58" cy="62" r="8" fill="#263238"/><circle cx="58" cy="62" r="3.5" fill="#cbd5e1"/>
          <rect x="12" y="49" width="8" height="5" rx="2" fill="#ffe066"/>
          <rect x="61" y="49" width="7" height="5" rx="2" fill="#ffd6d6"/>
        </svg>`;
      }

      if (theme.iconType === 'apple') {
        return `<svg class="picture-icon-ver2" viewBox="0 0 80 80" aria-hidden="true">
          <path d="M39 25 Q41 15 50 10" fill="none" stroke="#6b4423" stroke-width="6" stroke-linecap="round"/>
          <path d="M43 20 Q55 12 63 20 Q55 29 43 25 Z" fill="#58a83c"/>
          <path d="M40 28 C24 19 11 31 14 49 C17 68 31 72 40 66 C49 72 64 67 67 48 C70 30 55 20 40 28 Z" fill="${color}"/>
          <ellipse cx="29" cy="38" rx="7" ry="10" fill="#ffffff" opacity=".28" transform="rotate(25 29 38)"/>
          <path d="M24 60 Q40 68 56 59" fill="none" stroke="#a61d24" stroke-width="3" opacity=".35"/>
        </svg>`;
      }

      return `<svg class="picture-icon-ver2" viewBox="0 0 80 80" aria-hidden="true">
        <path d="M18 31 L5 22 L8 39 L5 56 L18 49 Z" fill="${color}" opacity=".78"/>
        <path d="M62 31 L75 22 L72 39 L75 56 L62 49 Z" fill="${color}" opacity=".78"/>
        <rect x="17" y="25" width="46" height="32" rx="15" fill="${color}"/>
        <path d="M27 28 Q39 41 27 54" fill="none" stroke="#fff" stroke-width="4" opacity=".55"/>
        <path d="M52 28 Q40 41 52 54" fill="none" stroke="#fff" stroke-width="4" opacity=".55"/>
        <ellipse cx="34" cy="33" rx="7" ry="4" fill="#fff" opacity=".22"/>
      </svg>`;
    }

    function buildAnswerChoices(correctAnswer) {
      const choices = new Set([correctAnswer]);
      const preferredOffsets = [-3, -2, -1, 1, 2, 3];
      const offsets = [...preferredOffsets].sort(() => Math.random() - .5);

      offsets.forEach(offset => {
        const value = correctAnswer + offset;
        if (value >= 7 && value <= 20 && choices.size < 4) choices.add(value);
      });

      while (choices.size < 4) {
        choices.add(7 + Math.floor(Math.random() * 14));
      }

      return [...choices].sort(() => Math.random() - .5);
    }

    function renderTenFrames(p) {
      const container = document.getElementById('objects-container');
      container.innerHTML = '';

      const renderedCount = p.theme.type === 'addition' ? p.answer : p.num1;
      const frameCount = Math.ceil(renderedCount / 10);
      let objectIndex = 0;

      for (let frameIndex = 0; frameIndex < frameCount; frameIndex++) {
        const frame = document.createElement('div');
        frame.className = 'ten-frame-ver2';

        for (let logicalIndex = 0; logicalIndex < 10; logicalIndex++) {
          const cell = document.createElement('div');
          cell.className = 'ten-cell-ver2 empty';

          // Fill vertically by columns: 1-2 form a pair, 3-4 form a pair, etc.
          const column = Math.floor(logicalIndex / 2) + 1;
          const row = (logicalIndex % 2) + 1;
          cell.style.gridColumn = column;
          cell.style.gridRow = row;

          if (objectIndex < renderedCount) {
            const isAdded = p.theme.type === 'addition' && objectIndex >= p.num1;
            const isRemoved = p.theme.type === 'subtraction' && objectIndex >= p.answer;
            cell.classList.remove('empty');
            if (isAdded) cell.classList.add('added');
            if (isRemoved) cell.classList.add('removed');

            cell.innerHTML = getPictureSvg(p.theme, isAdded);
            const icon = cell.querySelector('.picture-icon-ver2');
            if (icon) icon.style.animationDelay = `${objectIndex * 0.035}s`;

            if (isAdded) {
              const badge = document.createElement('span');
              badge.className = 'added-badge-ver2';
              badge.title = 'New';
              cell.appendChild(badge);
            }
            if (isRemoved) {
              const x = document.createElement('div');
              x.className = 'remove-x-ver2';
              x.textContent = '×';
              cell.appendChild(x);
            }
            objectIndex++;
          }

          frame.appendChild(cell);
        }
        container.appendChild(frame);
      }
    }

    function renderProblem() {
      const p = state.problems[state.currentIndex];

      const progressPercent = (state.currentIndex / MAX_QUESTIONS) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      document.getElementById('score-display').innerText = state.score;

      document.getElementById('story-text').innerHTML =
        `${p.theme.storyTemplate(p.num1, p.num2)} <br><span class="text-[#1CB0F6] font-black">${p.theme.question}</span>`;

      document.getElementById('eq-num1').innerText = p.num1;
      document.getElementById('eq-num2').innerText = p.num2;
      document.getElementById('operator-display').innerText = p.theme.operator;

      renderTenFrames(p);

      const choicesWrap = document.getElementById('answer-choices');
      choicesWrap.innerHTML = '';
      buildAnswerChoices(p.answer).forEach(value => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'answer-choice-ver2';
        button.textContent = value;
        button.onclick = () => selectMathAnswer(value, button);
        choicesWrap.appendChild(button);
      });

      document.getElementById('phase-math').classList.remove('hidden');
      document.getElementById('phase-oddeven').classList.add('hidden');

      if (state.soundEnabled) setTimeout(readQuestionAloud, 800);
    }

    function showFeedback(isCorrect, callback) {
      const overlay = document.getElementById('feedback-overlay');
      const card = document.getElementById('feedback-card');
      const iconContainer = document.getElementById('feedback-icon-container');
      const icon = document.getElementById('feedback-icon');
      const title = document.getElementById('feedback-title');

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

      // Force reflow
      void overlay.offsetWidth;

      if (isCorrect) {
        playTone('success');
        overlay.style.backgroundColor = 'rgba(88, 204, 2, 0.4)'; // Feather Green transparent
        iconContainer.className = 'w-32 h-32 rounded-full flex items-center justify-center mb-4 bg-[#58CC02] shadow-[0_8px_0_0_#43C000]';
        icon.setAttribute('data-lucide', 'check');
        title.innerText = 'AWESOME!';
        title.className = 'text-5xl font-black uppercase text-[#58CC02]';
      } else {
        playTone('error');
        overlay.style.backgroundColor = 'rgba(255, 75, 75, 0.4)'; // Cardinal transparent
        iconContainer.className = 'w-32 h-32 rounded-full flex items-center justify-center mb-4 bg-[#FF4B4B] shadow-[0_8px_0_0_#CC3C3C]';
        icon.setAttribute('data-lucide', 'x');
        title.innerText = 'TRY AGAIN!';
        title.className = 'text-5xl font-black uppercase text-[#FF4B4B]';

      }

      lucide.createIcons();

      // Animate In
      card.classList.remove('scale-50', 'opacity-0');
      card.classList.add('scale-100', 'opacity-100');

      setTimeout(() => {
        // Animate Out
        card.classList.remove('scale-100', 'opacity-100');
        card.classList.add('scale-50', 'opacity-0');

        setTimeout(() => {
          overlay.classList.add('hidden');
          overlay.classList.remove('flex');
          if (callback) callback();
        }, 200);
      }, 1200);
    }

    function selectMathAnswer(value, button) {
      const p = state.problems[state.currentIndex];
      const buttons = document.querySelectorAll('.answer-choice-ver2');
      buttons.forEach(btn => btn.disabled = true);

      if (value === p.answer) {
        button.classList.add('correct');
        state.score += 5;
        document.getElementById('score-display').innerText = state.score;
        showFeedback(true, () => {
          document.getElementById('phase-math').classList.add('hidden');
          document.getElementById('phase-oddeven').classList.remove('hidden');
          buttons.forEach(btn => btn.disabled = false);
        });
      } else {
        button.classList.add('wrong');
        showFeedback(false, () => {
          button.classList.remove('wrong');
          buttons.forEach(btn => btn.disabled = false);
        });
      }
    }

    function checkOddEven(choice) {
      const p = state.problems[state.currentIndex];
      const isEven = p.answer % 2 === 0;
      const correctChoice = isEven ? 'even' : 'odd';

      if (choice === correctChoice) {
        state.score += 3;
        showFeedback(true, nextProblem);
      } else {
        showFeedback(false);
      }
    }

    function nextProblem() {
      if (state.currentIndex < MAX_QUESTIONS - 1) {
        state.currentIndex++;
        renderProblem();
      } else {
        endGame();
      }
    }

    function endGame() {
      playTone('win');

      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-end').classList.remove('hidden');
      document.getElementById('screen-end').classList.add('flex');

      document.getElementById('final-score').innerText = state.score;

      // Confetti effect (from top corners)
      triggerConfetti();
    }

    function triggerConfetti() {
      const duration = 3000;
      const end = Date.now() + duration;

      (function frame() {
        // left side
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.1 },
          colors: ['#58CC02', '#1CB0F6', '#FFC800', '#FF4B4B']
        });
        // right side
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.1 },
          colors: ['#58CC02', '#1CB0F6', '#FFC800', '#FF4B4B']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
  </script>
</body>
</html>

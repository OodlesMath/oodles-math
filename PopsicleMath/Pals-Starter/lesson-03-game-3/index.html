<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="../assets/brand.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Math Adventure Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      overflow: hidden; /* Prevent scrolling for laptop horizontal view */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Button styles inspired by premium kid apps */
    .btn-press {
      box-shadow: 0 6px 0 0 rgba(0,0,0,0.15);
      transition: all 0.15s ease;
    }
    .btn-press:active:not(:disabled) {
      box-shadow: 0 0px 0 0 rgba(0,0,0,0.15);
      transform: translateY(6px);
    }
    .btn-press:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Input Pad specific styles */
    .pad-btn {
      box-shadow: 0 4px 0 0 rgba(79, 70, 229, 0.2);
    }
    .pad-btn:active {
      box-shadow: 0 0px 0 0 rgba(79, 70, 229, 0.2);
      transform: translateY(4px);
    }

    /* Animations */
    @keyframes shake {
      0%, 100% { transform: translate(0,0); }
      25% { transform: translate(-10px, 0); }
      75% { transform: translate(10px, 0); }
    }
    .animate-shake { animation: shake 0.3s ease-in-out; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-float { animation: float 3s ease-in-out infinite; }

    @keyframes cloud-move {
      from { transform: translateX(-100%); }
      to { transform: translateX(100vw); }
    }
    .cloud { animation: cloud-move 40s linear infinite; }
    .cloud-slow { animation: cloud-move 60s linear infinite reverse; }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* Custom Cloud Shapes */
    .cloud-shape {
      border-radius: 50px;
      position: relative;
    }
    .cloud-shape::before, .cloud-shape::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud-shape::before {
      width: 50px; height: 50px;
      top: -20px; left: 15px;
    }
    .cloud-shape::after {
      width: 40px; height: 40px;
      top: -10px; right: 15px;
    }

    /* Ensure responsive fitting on laptops vs phones */
    .game-content-wrapper {
      max-height: 85vh;
    }
  </style>
</head>
<body class="bg-sky-200 text-gray-800 antialiased h-screen w-screen relative">
  <img src="../assets/logo-oodles-math.png" class="oodles-logo">
  <!-- Background Scenery Layer -->
  <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
    <!-- Sky Gradient -->
    <div class="absolute inset-0 bg-gradient-to-b from-sky-300 to-sky-100"></div>
    
    <!-- Sun -->
    <div class="absolute top-12 left-12 w-32 h-32 bg-yellow-400 rounded-full opacity-90 shadow-[0_0_80px_rgba(250,204,21,0.8)] animate-float"></div>
    
    <!-- Rainbow -->
    <div class="absolute top-[10%] left-[10%] w-[80%] h-[150%] rounded-[50%] opacity-30 pointer-events-none" 
         style="box-shadow: inset 0 0 0 30px #ef4444, inset 0 0 0 60px #f97316, inset 0 0 0 90px #eab308, inset 0 0 0 120px #22c55e, inset 0 0 0 150px #3b82f6, inset 0 0 0 180px #a855f7;">
    </div>

    <!-- Clouds -->
    <div class="absolute top-20 left-0 w-32 h-12 bg-white/90 cloud"></div>
    <div class="absolute top-40 w-24 h-10 bg-white/80 cloud-slow" style="animation-delay: -20s;"></div>

    <!-- Hills / Grass -->
    <!-- Back Hill -->
    <div class="absolute bottom-0 left-[-20%] w-[80%] h-[35%] bg-emerald-500 rounded-t-[100%] border-t-8 border-emerald-400"></div>
    <!-- Front Hill -->
    <div class="absolute bottom-[-5%] right-[-10%] w-[70%] h-[40%] bg-green-500 rounded-t-[100%] border-t-8 border-green-400"></div>

    <!-- Note: Top Right is intentionally kept empty for the logo -->
  </div>

  <!-- Main Application Container -->
  <div id="app" class="h-full w-full flex flex-col items-center justify-center p-2 md:p-6 z-10 relative">
    
    <!-- AUDIO CONTROLS (Top Left) -->
    <div class="absolute top-6 left-6 z-50">
      <button id="btn-sound-toggle" class="bg-white text-indigo-600 p-3 rounded-2xl btn-press flex items-center justify-center border-2 border-indigo-100" onclick="toggleSound()">
        <i data-lucide="volume-2" id="icon-sound-on"></i>
        <i data-lucide="volume-x" id="icon-sound-off" class="hidden text-gray-400"></i>
      </button>
    </div>

    <!-- UI: START SCREEN -->
    <div id="screen-start" class="bg-white/95 backdrop-blur-sm rounded-[3rem] p-10 max-w-md w-full text-center shadow-2xl border-b-[12px] border-indigo-100 pop-in flex flex-col items-center gap-8">
      <div class="flex justify-center -space-x-4">
        <div class="w-20 h-20 bg-orange-400 rounded-full border-4 border-white flex items-center justify-center text-white text-4xl font-black rotate-[-10deg] shadow-lg animate-bounce">1</div>
        <div class="w-20 h-20 bg-indigo-500 rounded-full border-4 border-white flex items-center justify-center text-white text-4xl font-black rotate-[5deg] shadow-lg animate-bounce" style="animation-delay: 0.1s">2</div>
        <div class="w-20 h-20 bg-emerald-500 rounded-full border-4 border-white flex items-center justify-center text-white text-4xl font-black rotate-[-5deg] shadow-lg animate-bounce" style="animation-delay: 0.2s">3</div>
      </div>
      <div>
        <h1 class="text-4xl md:text-5xl font-black text-indigo-900 leading-tight mb-2 uppercase">Math<br>Adventures</h1>
        <p class="text-gray-500 font-bold text-lg">Solve the stories and catch stars!</p>
      </div>
      <button onclick="startGame()" class="w-full py-5 text-2xl bg-indigo-600 hover:bg-indigo-500 text-white rounded-3xl btn-press flex items-center justify-center gap-3 font-black tracking-wide border-2 border-indigo-700">
        <i data-lucide="play" class="w-8 h-8 fill-current"></i> START JOURNEY
      </button>
    </div>

    <!-- UI: GAME SCREEN -->
    <div id="screen-game" class="hidden w-full max-w-5xl game-content-wrapper flex flex-col pop-in">
      
      <!-- Progress & Score Header -->
      <div class="flex justify-between items-center mb-4 md:mb-6 px-4">
        <div class="flex-1 max-w-[60%] ml-16"> <!-- ml-16 avoids overlap with sound button -->
          <div class="bg-white/80 backdrop-blur rounded-full px-4 py-3 flex gap-2 border-2 border-white shadow-inner w-full">
            <div id="progress-bar-container" class="w-full flex gap-1.5 h-4">
              <!-- Progress pills injected here -->
            </div>
          </div>
        </div>
        <div class="flex items-center gap-2 bg-white px-6 py-2 md:py-3 rounded-full shadow-lg border-b-4 border-yellow-200">
          <i data-lucide="star" class="w-8 h-8 text-yellow-400 fill-current animate-pulse"></i>
          <span id="score-display" class="font-black text-3xl md:text-4xl text-indigo-900">0</span>
        </div>
      </div>

      <!-- Main Game Content (Responsive Flex Row for Laptops) -->
      <div class="flex-1 flex flex-col md:flex-row gap-4 md:gap-6 w-full h-full min-h-0">
        
        <!-- Left Side: Story & Objects -->
        <div class="bg-white/95 backdrop-blur-sm rounded-[2.5rem] p-6 shadow-2xl border-b-[8px] border-indigo-100 flex-1 flex flex-col items-center relative overflow-y-auto">
          
          <!-- Story Text -->
          <div class="w-full bg-indigo-50/70 p-6 rounded-3xl text-center mb-4 relative">
            <p id="story-text" class="text-2xl md:text-3xl text-indigo-900 font-bold leading-snug mb-2"></p>
            <div class="flex items-center justify-center gap-3">
              <p id="question-text" class="text-3xl md:text-4xl text-emerald-600 font-black tracking-tight drop-shadow-sm inline-block"></p>
              <!-- Speaker Icon at end of question -->
              <button onclick="readQuestionAloud()" class="bg-white p-3 rounded-full shadow-md text-indigo-600 btn-press border border-indigo-100 inline-flex" id="btn-read-aloud">
                <i data-lucide="volume-2" class="w-7 h-7"></i>
              </button>
            </div>
          </div>

          <!-- Objects Rendering Area -->
          <div id="objects-container" class="flex flex-wrap justify-center gap-4 py-4 w-full h-full content-center text-6xl md:text-7xl">
            <!-- Emojis injected here -->
          </div>
        </div>

        <!-- Right Side: Interactions -->
        <div class="flex-[0.8] flex flex-col w-full h-full min-h-0">
          
          <!-- PHASE 1: Math Equation -->
          <div id="phase-math" class="bg-white/95 backdrop-blur-sm rounded-[2.5rem] p-6 shadow-2xl border-b-[8px] border-indigo-100 flex-1 flex flex-col items-center justify-between">
            
            <!-- Equation Display -->
            <div class="flex items-center justify-center gap-2 md:gap-4 w-full">
              <button onclick="setActiveInput('num1')" id="box-num1" class="w-16 h-20 md:w-20 md:h-24 border-4 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-black transition-all border-indigo-600 bg-indigo-50 ring-4 ring-indigo-200 text-indigo-900">?</button>
              <span id="operator-display" class="text-indigo-400 text-4xl md:text-5xl font-black">+</span>
              <button onclick="setActiveInput('num2')" id="box-num2" class="w-16 h-20 md:w-20 md:h-24 border-4 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-black transition-all border-gray-200 bg-gray-50 text-gray-400">?</button>
              <span class="text-indigo-400 text-4xl md:text-5xl font-black">=</span>
              <button onclick="setActiveInput('total')" id="box-total" class="w-16 h-20 md:w-20 md:h-24 border-4 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-black transition-all border-gray-200 bg-gray-50 text-gray-400">?</button>
            </div>

            <!-- Number Pad -->
            <div class="grid grid-cols-3 gap-2 md:gap-3 w-full max-w-[280px] p-4 bg-indigo-50 rounded-[2rem] border border-indigo-100 mt-4 md:mt-0">
              <button onclick="inputNumber(1)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">1</button>
              <button onclick="inputNumber(2)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">2</button>
              <button onclick="inputNumber(3)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">3</button>
              <button onclick="inputNumber(4)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">4</button>
              <button onclick="inputNumber(5)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">5</button>
              <button onclick="inputNumber(6)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">6</button>
              <button onclick="inputNumber(7)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">7</button>
              <button onclick="inputNumber(8)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">8</button>
              <button onclick="inputNumber(9)" class="aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">9</button>
              <button onclick="inputNumber(0)" class="col-start-2 aspect-square bg-white text-indigo-700 font-black text-3xl rounded-xl pad-btn">0</button>
            </div>

            <!-- Submit Button -->
            <button id="btn-check-math" onclick="checkMath()" disabled class="w-full mt-4 py-4 md:py-5 text-2xl md:text-3xl bg-emerald-500 text-white rounded-3xl btn-press font-black flex items-center justify-center gap-2 border-b-4 border-emerald-600">
              CHECK <i data-lucide="chevron-right" class="w-8 h-8"></i>
            </button>
          </div>

          <!-- PHASE 2: Odd/Even -->
          <div id="phase-oddeven" class="hidden bg-white/95 backdrop-blur-sm rounded-[2.5rem] p-8 shadow-2xl border-b-[8px] border-indigo-100 flex-1 flex flex-col items-center justify-center gap-8 pop-in">
            <div class="text-center">
              <p class="text-2xl text-gray-500 font-bold">The result is</p>
              <h3 id="oddeven-result-display" class="text-6xl font-black text-indigo-600 my-2">8</h3>
              <p class="text-3xl font-black text-gray-800">Is it Odd or Even?</p>
            </div>
            <div class="flex w-full gap-4">
              <button onclick="checkOddEven('odd')" class="flex-1 py-8 md:py-12 text-3xl md:text-4xl font-black bg-orange-500 text-white rounded-[2rem] btn-press border-b-8 border-orange-600 flex flex-col items-center gap-2">
                <div class="flex gap-2 mb-2">
                  <div class="w-4 h-4 bg-white/40 rounded-full"></div>
                  <div class="w-4 h-4 bg-white/40 rounded-full"></div>
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                </div>
                ODD
              </button>
              <button onclick="checkOddEven('even')" class="flex-1 py-8 md:py-12 text-3xl md:text-4xl font-black bg-purple-600 text-white rounded-[2rem] btn-press border-b-8 border-purple-700 flex flex-col items-center gap-2">
                <div class="flex gap-2 mb-2">
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                  <div class="w-4 h-4 bg-white rounded-full"></div>
                </div>
                EVEN
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- UI: WHACK BONUS PHASE -->
    <div id="screen-bonus" class="hidden fixed inset-0 bg-emerald-500 z-[200] flex flex-col items-center justify-center p-6 text-white pop-in">
      <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-4 mb-2">
           <i data-lucide="hammer" class="w-12 h-12 animate-bounce"></i>
           <h2 class="text-4xl md:text-6xl font-black italic uppercase tracking-tight">Whack-A-Star!</h2>
        </div>
        <div class="inline-block bg-black/20 backdrop-blur-md px-10 py-3 rounded-full text-4xl md:text-5xl font-black border-2 border-white/30 shadow-2xl">
          <span id="bonus-timer">12</span>s
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4 md:gap-8 max-w-3xl w-full">
        <!-- 6 Moles -->
        <div class="relative aspect-square">
          <div class="absolute inset-0 bg-emerald-900/30 rounded-[2rem] border-4 border-emerald-400/20 transform skew-x-1"></div>
          <div id="mole-0" onclick="whackMole(0)" class="absolute inset-0 flex items-center justify-center cursor-pointer opacity-0 scale-50 transition-all duration-100 ease-out pointer-events-none text-7xl md:text-8xl">
            <div class="bg-white rounded-full p-4 md:p-6 shadow-xl relative"><span class="mole-icon">🍎</span></div>
          </div>
        </div>
        <div class="relative aspect-square">
          <div class="absolute inset-0 bg-emerald-900/30 rounded-[2rem] border-4 border-emerald-400/20 transform skew-x-1"></div>
          <div id="mole-1" onclick="whackMole(1)" class="absolute inset-0 flex items-center justify-center cursor-pointer opacity-0 scale-50 transition-all duration-100 ease-out pointer-events-none text-7xl md:text-8xl">
            <div class="bg-white rounded-full p-4 md:p-6 shadow-xl relative"><span class="mole-icon">🍎</span></div>
          </div>
        </div>
        <div class="relative aspect-square">
          <div class="absolute inset-0 bg-emerald-900/30 rounded-[2rem] border-4 border-emerald-400/20 transform skew-x-1"></div>
          <div id="mole-2" onclick="whackMole(2)" class="absolute inset-0 flex items-center justify-center cursor-pointer opacity-0 scale-50 transition-all duration-100 ease-out pointer-events-none text-7xl md:text-8xl">
            <div class="bg-white rounded-full p-4 md:p-6 shadow-xl relative"><span class="mole-icon">🍎</span></div>
          </div>
        </div>
        <div class="relative aspect-square">
          <div class="absolute inset-0 bg-emerald-900/30 rounded-[2rem] border-4 border-emerald-400/20 transform skew-x-1"></div>
          <div id="mole-3" onclick="whackMole(3)" class="absolute inset-0 flex items-center justify-center cursor-pointer opacity-0 scale-50 transition-all duration-100 ease-out pointer-events-none text-7xl md:text-8xl">
            <div class="bg-white rounded-full p-4 md:p-6 shadow-xl relative"><span class="mole-icon">🍎</span></div>
          </div>
        </div>
        <div class="relative aspect-square">
          <div class="absolute inset-0 bg-emerald-900/30 rounded-[2rem] border-4 border-emerald-400/20 transform skew-x-1"></div>
          <div id="mole-4" onclick="whackMole(4)" class="absolute inset-0 flex items-center justify-center cursor-pointer opacity-0 scale-50 transition-all duration-100 ease-out pointer-events-none text-7xl md:text-8xl">
            <div class="bg-white rounded-full p-4 md:p-6 shadow-xl relative"><span class="mole-icon">🍎</span></div>
          </div>
        </div>
        <div class="relative aspect-square">
          <div class="absolute inset-0 bg-emerald-900/30 rounded-[2rem] border-4 border-emerald-400/20 transform skew-x-1"></div>
          <div id="mole-5" onclick="whackMole(5)" class="absolute inset-0 flex items-center justify-center cursor-pointer opacity-0 scale-50 transition-all duration-100 ease-out pointer-events-none text-7xl md:text-8xl">
            <div class="bg-white rounded-full p-4 md:p-6 shadow-xl relative"><span class="mole-icon">🍎</span></div>
          </div>
        </div>
      </div>
      <p class="mt-8 text-2xl font-black opacity-90 animate-pulse drop-shadow-md">Tap them fast!</p>
    </div>

    <!-- UI: END SCREEN -->
    <div id="screen-end" class="hidden bg-white/95 backdrop-blur-sm rounded-[3rem] p-12 max-w-md w-full text-center shadow-2xl border-b-[12px] border-emerald-100 pop-in relative z-[10000]">
      <i data-lucide="trophy" class="w-32 h-32 text-yellow-400 mx-auto drop-shadow-xl fill-current animate-bounce mb-4"></i>
      <div class="space-y-4">
        <h2 class="text-4xl md:text-5xl font-black text-emerald-600 uppercase tracking-wide">Excellent!</h2>
        <div class="flex items-center justify-center gap-3 text-7xl md:text-8xl font-black text-indigo-600">
          <i data-lucide="star" class="text-yellow-400 fill-current w-16 h-16 md:w-20 md:h-20"></i> <span id="final-score">0</span>
        </div>
        <p class="text-gray-500 font-bold text-xl uppercase">Math Explorer</p>
      </div>
      <button onclick="startGame()" class="mt-8 w-full py-5 text-2xl md:text-3xl bg-emerald-500 hover:bg-emerald-400 text-white rounded-3xl btn-press font-black flex items-center justify-center gap-3 border-b-4 border-emerald-600">
        <i data-lucide="rotate-ccw" class="w-8 h-8"></i> PLAY AGAIN
      </button>
    </div>

    <!-- FEEDBACK POPUP OVERLAY -->
    <div id="feedback-popup" class="hidden fixed inset-0 flex items-center justify-center z-[400] backdrop-blur-md transition-colors duration-300">
      <div id="feedback-card" class="bg-white p-12 rounded-[4rem] shadow-2xl text-center max-w-sm w-full mx-4 transition-transform duration-300 scale-50 opacity-0">
        <div id="feedback-correct" class="hidden">
          <i data-lucide="star" class="w-40 h-40 text-yellow-400 fill-current mx-auto animate-bounce mb-6 drop-shadow-lg"></i>
          <h2 class="text-6xl font-black text-emerald-600">YES!</h2>
          <p class="text-2xl text-gray-500 font-black mt-4 uppercase">Great job!</p>
        </div>
        <div id="feedback-incorrect" class="hidden">
          <i data-lucide="x" class="w-40 h-40 text-rose-500 mx-auto animate-shake mb-6" stroke-width="4"></i>
          <h2 class="text-6xl font-black text-rose-600">OOPS!</h2>
          <p class="text-2xl text-gray-500 font-black mt-4 uppercase">Try again!</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Initialize Icons
    lucide.createIcons();

    // --- GAME DATA & CONFIG ---
    const apiKey = ""; 
    const MAX_QUESTIONS = 5;

    // We use large emojis as "giống thật" objects because they render brightly and beautifully on all devices.
    const THEMES = {
      ducks: {
        id: 'ducks',
        name: 'Ducky Pond',
        emoji: '🦆',
        type: 'subtraction',
        storyTemplate: (start, change) => `There are ${start} ducks in the pond. ${change} ducks fly away.`,
        question: 'How many ducks are left?',
        operator: '-',
      },
      cars: {
        id: 'cars',
        name: 'Car Garage',
        emoji: '🚗',
        type: 'addition',
        storyTemplate: (start, change) => `You have ${start} toy cars. You get ${change} more for your birthday.`,
        question: 'How many cars do you have in total?',
        operator: '+',
      },
      apples: {
        id: 'apples',
        name: 'Apple Tree',
        emoji: '🍎',
        type: 'subtraction',
        storyTemplate: (start, change) => `There are ${start} apples on the tree. You pick ${change} of them.`,
        question: 'How many apples are on the tree now?',
        operator: '-',
      },
      candies: {
        id: 'candies',
        name: 'Candy Jar',
        emoji: '🍬',
        type: 'addition',
        storyTemplate: (start, change) => `You have ${start} candies. Your friend gives you ${change} more.`,
        question: 'How many candies do you have in total?',
        operator: '+',
      }
    };

    // --- STATE ---
    let state = {
      score: 0,
      problems: [],
      currentIndex: 0,
      soundEnabled: true,
      inputs: { num1: '', num2: '', total: '' },
      activeInput: 'num1',
      isSpeaking: false,
      bonusTimer: null,
      moleTimer: null
    };

    // --- AUDIO SYSTEM ---
    let audioCtx = null;
    let ttsAudioElement = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById('icon-sound-on').classList.toggle('hidden', !state.soundEnabled);
      document.getElementById('icon-sound-off').classList.toggle('hidden', state.soundEnabled);
      
      const btn = document.getElementById('btn-sound-toggle');
      if (state.soundEnabled) {
        btn.classList.remove('bg-gray-200', 'text-gray-400');
        btn.classList.add('bg-white', 'text-indigo-600');
      } else {
        btn.classList.add('bg-gray-200', 'text-gray-400');
        btn.classList.remove('bg-white', 'text-indigo-600');
        if (ttsAudioElement) {
          ttsAudioElement.pause();
          state.isSpeaking = false;
          updateReadAloudButton();
        }
      }
    }

    function playTone(type) {
      if (!state.soundEnabled) return;
      initAudio();
      
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'tap') {
        osc.type = 'triangle';
        gainNode.gain.setValueAtTime(0.05, now);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.frequency.setValueAtTime(700, now);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'success') {
        osc.type = 'sine';
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'whack') {
        osc.type = 'sine';
        gainNode.gain.setValueAtTime(0.1, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'win') {
        osc.type = 'square';
        gainNode.gain.setValueAtTime(0.05, now);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
        [523, 659, 783, 1046].forEach((f, i) => {
          osc.frequency.setValueAtTime(f, now + i * 0.15);
        });
        osc.start(now);
        osc.stop(now + 1.2);
      }
    }

    const pcmToWav = (pcmData, sampleRate) => {
      const buffer = new ArrayBuffer(44 + pcmData.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 32 + pcmData.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, pcmData.length * 2, true);
      for (let i = 0; i < pcmData.length; i++) {
        view.setInt16(44 + i * 2, pcmData[i], true);
      }
      return new Blob([buffer], { type: 'audio/wav' });
    };

    async function speakText(text) {
      if (!state.soundEnabled || state.isSpeaking) return;
      initAudio();
      
      state.isSpeaking = true;
      updateReadAloudButton();
      
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `Say in a cheerful teacher's voice, slowly and clearly: ${text}` }] }],
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
            }
          })
        });

        const result = await response.json();
        const base64Audio = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
        if (base64Audio) {
          const binaryString = atob(base64Audio);
          const len = binaryString.length;
          const bytes = new Int16Array(len / 2);
          for (let i = 0; i < len; i += 2) {
            bytes[i / 2] = (binaryString.charCodeAt(i + 1) << 8) | binaryString.charCodeAt(i);
          }
          const wavBlob = pcmToWav(bytes, 24000);
          const url = URL.createObjectURL(wavBlob);
          ttsAudioElement = new Audio(url);
          ttsAudioElement.onended = () => {
            state.isSpeaking = false;
            updateReadAloudButton();
          };
          ttsAudioElement.play();
        } else {
          state.isSpeaking = false;
          updateReadAloudButton();
        }
      } catch (error) {
        console.error("Speech error:", error);
        state.isSpeaking = false;
        updateReadAloudButton();
      }
    }

    function updateReadAloudButton() {
      const btn = document.getElementById('btn-read-aloud');
      if (state.isSpeaking) {
        btn.classList.add('bg-indigo-600', 'text-white', 'animate-pulse');
        btn.classList.remove('bg-white', 'text-indigo-600');
      } else {
        btn.classList.remove('bg-indigo-600', 'text-white', 'animate-pulse');
        btn.classList.add('bg-white', 'text-indigo-600');
      }
    }

    function readQuestionAloud() {
      const p = state.problems[state.currentIndex];
      const text = `${p.theme.storyTemplate(p.num1, p.num2)} ${p.theme.question}`;
      speakText(text);
    }

    // --- GAME LOGIC ---

    function generateProblem() {
      const themeKeys = Object.keys(THEMES);
      const theme = THEMES[themeKeys[Math.floor(Math.random() * themeKeys.length)]];
      let n1, n2, ans;

      if (theme.type === 'addition') {
        n1 = Math.floor(Math.random() * 5) + 1;
        const maxN2 = 9 - n1;
        n2 = Math.floor(Math.random() * maxN2) + 1;
        ans = n1 + n2;
      } else {
        n1 = Math.floor(Math.random() * 7) + 3;
        n2 = Math.floor(Math.random() * (n1 - 1)) + 1;
        ans = n1 - n2;
      }
      return { theme, num1: n1, num2: n2, answer: ans };
    }

    function startGame() {
      playTone('tap');
      state.problems = Array.from({ length: MAX_QUESTIONS }, generateProblem);
      state.currentIndex = 0;
      state.score = 0;
      
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-end').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      
      renderProblem();
    }

    function renderProblem() {
      const p = state.problems[state.currentIndex];
      
      // Update Headers
      document.getElementById('score-display').innerText = state.score;
      
      // Progress Bar
      const bar = document.getElementById('progress-bar-container');
      bar.innerHTML = '';
      for (let i = 0; i < MAX_QUESTIONS; i++) {
        const div = document.createElement('div');
        div.className = `h-full rounded-full transition-all duration-500 flex-1 ${
          i < state.currentIndex ? 'bg-emerald-500' : 
          i === state.currentIndex ? 'bg-indigo-600 scale-y-110 shadow-md' : 'bg-gray-200'
        }`;
        bar.appendChild(div);
      }

      // Story & Question
      document.getElementById('story-text').innerText = p.theme.storyTemplate(p.num1, p.num2);
      document.getElementById('question-text').innerText = p.theme.question;
      
      // Render Emoji Objects
      const objContainer = document.getElementById('objects-container');
      objContainer.innerHTML = '';
      
      const totalToRender = p.theme.type === 'addition' ? (p.num1 + p.num2) : p.num1;
      
      for (let i = 0; i < totalToRender; i++) {
        const isAdded = p.theme.type === 'addition' && i >= p.num1;
        const isRemoved = p.theme.type === 'subtraction' && i >= (p.num1 - p.num2);
        
        const wrapper = document.createElement('div');
        wrapper.className = `relative transition-all duration-700 inline-block ${isRemoved ? 'opacity-30 grayscale scale-75' : 'scale-100'} ${isAdded ? 'animate-bounce' : ''}`;
        
        wrapper.innerHTML = `<span>${p.theme.emoji}</span>`;
        if (isRemoved) {
          wrapper.innerHTML += `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="x" class="text-rose-600 w-12 h-12 absolute z-10" stroke-width="4"></i></div>`;
        }
        objContainer.appendChild(wrapper);
      }
      lucide.createIcons(); // re-init icons

      // Setup Inputs
      document.getElementById('operator-display').innerText = p.theme.operator;
      state.inputs = { num1: '', num2: '', total: '' };
      setActiveInput('num1');
      updateInputDisplay();

      // Phases
      document.getElementById('phase-math').classList.remove('hidden');
      document.getElementById('phase-oddeven').classList.add('hidden');
    }

    function setActiveInput(boxId) {
      state.activeInput = boxId;
      ['num1', 'num2', 'total'].forEach(id => {
        const el = document.getElementById(`box-${id}`);
        if (id === boxId) {
          el.className = `w-16 h-20 md:w-20 md:h-24 border-4 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-black transition-all border-indigo-600 bg-indigo-50 ring-4 ring-indigo-200 text-indigo-900`;
        } else {
          el.className = `w-16 h-20 md:w-20 md:h-24 border-4 rounded-2xl flex items-center justify-center text-4xl md:text-5xl font-black transition-all border-gray-200 bg-gray-50 text-gray-400`;
        }
      });
    }

    function inputNumber(num) {
      playTone('tap');
      state.inputs[state.activeInput] = num.toString();
      updateInputDisplay();
      
      // Auto advance focus
      if (state.activeInput === 'num1') setActiveInput('num2');
      else if (state.activeInput === 'num2') setActiveInput('total');
    }

    function updateInputDisplay() {
      ['num1', 'num2', 'total'].forEach(id => {
        document.getElementById(`box-${id}`).innerText = state.inputs[id] || '?';
      });

      const btn = document.getElementById('btn-check-math');
      if (state.inputs.num1 && state.inputs.num2 && state.inputs.total) {
        btn.disabled = false;
        btn.classList.add('animate-pulse');
      } else {
        btn.disabled = true;
        btn.classList.remove('animate-pulse');
      }
    }

    function checkMath() {
      const p = state.problems[state.currentIndex];
      const n1 = parseInt(state.inputs.num1);
      const n2 = parseInt(state.inputs.num2);
      const tot = parseInt(state.inputs.total);

      if (n1 === p.num1 && n2 === p.num2 && tot === p.answer) {
        handleFeedback(true, () => {
          state.score += 5;
          document.getElementById('score-display').innerText = state.score;
          // Move to odd/even phase
          document.getElementById('phase-math').classList.add('hidden');
          document.getElementById('phase-oddeven').classList.remove('hidden');
          document.getElementById('oddeven-result-display').innerText = p.answer;
        });
      } else {
        handleFeedback(false);
      }
    }

    function checkOddEven(choice) {
      const p = state.problems[state.currentIndex];
      const isEven = p.answer % 2 === 0;
      const correct = (choice === 'even' && isEven) || (choice === 'odd' && !isEven);

      if (correct) {
        handleFeedback(true, () => {
          state.score += 5;
          document.getElementById('score-display').innerText = state.score;
          startBonusPhase();
        });
      } else {
        handleFeedback(false);
      }
    }

    function handleFeedback(isCorrect, onSuccessCallback) {
      const overlay = document.getElementById('feedback-popup');
      const card = document.getElementById('feedback-card');
      const correctDiv = document.getElementById('feedback-correct');
      const incorrectDiv = document.getElementById('feedback-incorrect');

      overlay.classList.remove('hidden');
      if (isCorrect) {
        playTone('success');
        overlay.classList.add('bg-emerald-600/90');
        overlay.classList.remove('bg-rose-600/90');
        correctDiv.classList.remove('hidden');
        incorrectDiv.classList.add('hidden');
      } else {
        playTone('error');
        overlay.classList.add('bg-rose-600/90');
        overlay.classList.remove('bg-emerald-600/90');
        incorrectDiv.classList.remove('hidden');
        correctDiv.classList.add('hidden');
      }

      // Animate In
      setTimeout(() => {
        card.classList.remove('scale-50', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      }, 10);

      // Animate Out
      setTimeout(() => {
        card.classList.add('scale-50', 'opacity-0');
        card.classList.remove('scale-100', 'opacity-100');
        setTimeout(() => {
          overlay.classList.add('hidden');
          if (isCorrect && onSuccessCallback) onSuccessCallback();
        }, 300);
      }, 1500);
    }

    // --- BONUS PHASE (WHACK) ---
    function startBonusPhase() {
      const p = state.problems[state.currentIndex];
      const screen = document.getElementById('screen-bonus');
      screen.classList.remove('hidden');
      
      // Update Icons to current theme emoji
      document.querySelectorAll('.mole-icon').forEach(el => el.innerText = p.theme.emoji);
      
      let timeLeft = 6; // Fast 6 second round
      document.getElementById('bonus-timer').innerText = timeLeft;

      state.bonusTimer = setInterval(() => {
        timeLeft--;
        document.getElementById('bonus-timer').innerText = timeLeft;
        if (timeLeft <= 0) {
          endBonusPhase();
        }
      }, 1000);

      let activeMole = -1;
      state.moleTimer = setInterval(() => {
        // Hide previous
        if (activeMole >= 0) {
          const m = document.getElementById(`mole-${activeMole}`);
          m.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto', 'translate-y-0');
          m.classList.add('opacity-0', 'scale-50', 'pointer-events-none', 'translate-y-8');
        }
        
        // Show next
        activeMole = Math.floor(Math.random() * 6);
        const m = document.getElementById(`mole-${activeMole}`);
        m.classList.remove('opacity-0', 'scale-50', 'pointer-events-none', 'translate-y-8');
        m.classList.add('opacity-100', 'scale-100', 'pointer-events-auto', 'translate-y-0');
      }, 800);
    }

    function whackMole(index) {
      playTone('whack');
      state.score += 2;
      document.getElementById('score-display').innerText = state.score;
      
      const m = document.getElementById(`mole-${index}`);
      m.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto', 'translate-y-0');
      m.classList.add('opacity-0', 'scale-50', 'pointer-events-none', 'translate-y-8');
      
      // Show star effect visually
      m.innerHTML += `<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-50"><i data-lucide="star" class="text-yellow-400 fill-current w-20 h-20 animate-ping"></i></div>`;
      lucide.createIcons();
      setTimeout(() => {
        m.innerHTML = `<div class="bg-white rounded-full p-4 md:p-6 shadow-xl relative"><span class="mole-icon">${state.problems[state.currentIndex].theme.emoji}</span></div>`;
      }, 500);
    }

    function endBonusPhase() {
      clearInterval(state.bonusTimer);
      clearInterval(state.moleTimer);
      
      // Hide all moles
      for(let i=0; i<6; i++) {
        const m = document.getElementById(`mole-${i}`);
        m.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto', 'translate-y-0');
        m.classList.add('opacity-0', 'scale-50', 'pointer-events-none', 'translate-y-8');
      }

      document.getElementById('screen-bonus').classList.add('hidden');
      
      state.currentIndex++;
      if (state.currentIndex < MAX_QUESTIONS) {
        renderProblem();
      } else {
        showEndScreen();
      }
    }

    function showEndScreen() {
      playTone('win');
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-end').classList.remove('hidden');
      document.getElementById('final-score').innerText = state.score;
      
      fireConfetti();
    }

    function fireConfetti() {
      const duration = 3000;
      const end = Date.now() + duration;

      (function frame() {
        // Launch confetti from both sides, staying heavily layered at the top (zIndex: 9999)
        confetti({
          particleCount: 8,
          angle: 60,
          spread: 55,
          origin: { x: 0, y: 0.8 },
          colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d', '#ff36ff'],
          zIndex: 9999
        });
        confetti({
          particleCount: 8,
          angle: 120,
          spread: 55,
          origin: { x: 1, y: 0.8 },
          colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d', '#ff36ff'],
          zIndex: 9999
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
  </script>
</body>
</html>

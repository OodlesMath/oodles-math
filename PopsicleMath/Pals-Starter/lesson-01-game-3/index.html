<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Friends: Compare & Count!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- Kindergarten Theme Styles --- */
        :root {
            --color-a: #29b6f6; /* Bright Sky Blue */
            --color-a-bg: #e1f5fe;
            --color-b: #ff8a80; /* Bright Pink/Red */
            --color-b-bg: #ffebee;
            --bg-color: #fff9c4; /* Sunny Yellow */
            --text-color: #37474f;
            --success-color: #66bb6a;
            --btn-shadow: rgba(0, 0, 0, 0.2);
            --font-stack: 'Poppins', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            background-image: radial-gradient(#fffde7 20%, transparent 20%), radial-gradient(#fffde7 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            margin: 0;
            padding: 10px;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent scroll during animations */
        }

        /* --- Game Container (Dashboard Layout) --- */
        .game-board {
            display: flex;
            flex-direction: row; /* Side-by-side layout */
            gap: 20px;
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 30px;
            border: 5px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            align-items: flex-start;
            position: relative;
            z-index: 10;
        }

        /* --- Left & Right Panels --- */
        .game-main {
            flex: 3; /* Takes up 75% space */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-sidebar {
            flex: 1; /* Takes up 25% space */
            min-width: 260px;
            background: #e3f2fd;
            padding: 20px;
            border-radius: 25px;
            border: 3px solid #90caf9;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: sticky;
            top: 20px; /* Stays visible while scrolling if needed */
        }

        /* Mobile Responsive: Stack them if screen is small */
        @media (max-width: 900px) {
            .game-board { flex-direction: column; align-items: stretch; }
            .game-sidebar { min-width: auto; position: static; }
        }

        /* --- Question Banner --- */
        .question-banner {
            background-color: #fff176;
            border: 4px dashed #fbc02d;
            border-radius: 20px;
            padding: 10px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #e65100;
        }

        .speaker-btn {
            background: #ff7043;
            border: none;
            color: white;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px #d84315;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .speaker-btn:active { transform: translateY(4px); box-shadow: none; }

        /* --- Visual Sets Area --- */
        .sets-container {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            flex-wrap: wrap;
        }

        .set-box {
            flex: 1;
            min-width: 220px;
            border-radius: 25px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-width: 6px;
            border-style: solid;
        }

        .set-box:hover { transform: scale(1.02); }
        .set-box:active { transform: scale(0.98); }

        .set-correct { 
            box-shadow: 0 0 20px 10px #66bb6a; 
            border-color: #66bb6a !important;
            animation: bounce 0.5s;
        }
        .set-wrong { 
            animation: shake 0.4s; 
            border-color: #ef5350 !important;
        }

        .set-a { border-color: var(--color-a); background-color: var(--color-a-bg); }
        .set-b { border-color: var(--color-b); background-color: var(--color-b-bg); }

        .set-label {
            font-size: 1.6rem;
            font-weight: 800;
            background: white;
            padding: 5px 20px;
            border-radius: 50px;
            margin-bottom: 10px;
            box-shadow: 0 3px rgba(0,0,0,0.1);
        }

        .set-a .set-label { color: var(--color-a); }
        .set-b .set-label { color: var(--color-b); }

        /* --- Objects Grid --- */
        .objects-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            min-height: 100px;
            width: 100%;
            pointer-events: none;
        }

        .game-icon {
            font-size: 2.2rem;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.1));
        }

        /* --- Inputs Section --- */
        .inputs-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .count-input {
            width: 70px;
            height: 70px;
            font-size: 1.8rem;
            text-align: center;
            border: 4px solid #b0bec5;
            border-radius: 18px;
            font-family: inherit;
            color: var(--text-color);
            background: #fff;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.1);
        }

        .count-input:focus { outline: none; border-color: #ffa726; background-color: #fff8e1; }
        .focused-input { border-color: #ffa726 !important; background-color: #fff8e1 !important; box-shadow: 0 0 0 4px rgba(255, 167, 38, 0.3); }

        /* --- Comparison Sentence --- */
        .comparison-section {
            background-color: #e8f5e9;
            border: 4px dashed #66bb6a;
            border-radius: 20px;
            padding: 10px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
        }

        .comparison-text {
            font-size: 1.3rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: #2e7d32;
        }

        /* --- Numpad (Sidebar Compact) --- */
        .numpad-header {
            text-align: center;
            color: #1565c0;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columns for compact height */
            gap: 8px;
        }

        .num-btn {
            aspect-ratio: 1;
            font-size: 1.3rem;
            background: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px #90caf9;
            color: #1565c0;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .num-btn:active { transform: translateY(4px); box-shadow: none; }

        /* --- Action Buttons --- */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn:active { transform: scale(0.95); }

        .btn-check { background-color: #66bb6a; color: white; box-shadow: 0 5px #2e7d32; }
        .btn-check:active { box-shadow: none; transform: translateY(5px); }

        .btn-new { background-color: #29b6f6; color: white; box-shadow: 0 5px #0277bd; }
        .btn-new:active { box-shadow: none; transform: translateY(5px); }

        /* --- Feedback Modal --- */
        .feedback-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .feedback-box {
            background: white;
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            width: 400px;
            border: 8px solid #ffca28;
        }

        /* --- BONUS GAME STYLES (3 BASKETS) --- */
        .bonus-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, #87CEEB 60%, #e0e0e0 60%);
            z-index: 200;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bonus-header {
            position: absolute;
            top: 40px;
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 2px 2px #d32f2f;
            font-weight: bold;
            z-index: 210;
        }

        .bonus-score-display {
            position: absolute;
            top: 90px;
            font-size: 1.8rem;
            color: #ffeb3b;
            text-shadow: 2px 2px #000;
            font-weight: bold;
            z-index: 210;
        }

        .baskets-wrapper {
            display: flex;
            justify-content: center;
            gap: 5%;
            width: 100%;
            max-width: 900px;
            margin-top: 50px;
            padding: 20px;
        }

        .basket-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .basket-item:hover { transform: scale(1.05); }

        /* Reusing hoop styles for static display */
        .static-hoop {
            position: relative;
            width: 140px;
            height: 140px;
        }

        .backboard {
            width: 140px;
            height: 90px;
            background: white;
            border: 4px solid #d32f2f;
            border-radius: 5px;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .backboard-inner {
            width: 60px;
            height: 50px;
            border: 3px solid #d32f2f;
        }

        .rim {
            width: 80px;
            height: 12px;
            background: #ff5722;
            position: absolute;
            bottom: 30px;
            left: 30px;
            border-radius: 5px;
            z-index: 205;
        }

        .net {
            width: 70px;
            height: 60px;
            border-left: 2px solid white;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
            position: absolute;
            bottom: -30px;
            left: 35px;
            background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.8) 5px, rgba(255,255,255,0.8) 7px),
                        repeating-linear-gradient(-45deg, transparent, transparent 5px, rgba(255,255,255,0.8) 5px, rgba(255,255,255,0.8) 7px);
            z-index: 204;
        }

        /* Hidden score that pops out */
        .hidden-score {
            position: absolute;
            top: 20px;
            font-size: 3rem;
            color: #ffd700;
            text-shadow: 2px 2px #000;
            font-weight: bold;
            opacity: 0;
            transform: scale(0);
            z-index: 220;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .hidden-score.reveal {
            opacity: 1;
            transform: scale(1) translateY(-80px);
        }

        /* The Ball */
        .basketball-shooter {
            width: 80px;
            height: 80px;
            font-size: 80px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            line-height: 1;
            user-select: none;
            z-index: 206;
            transition: all 0.6s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            25% {transform: translateX(-10px);}
            75% {transform: translateX(10px);}
        }

    </style>
</head>
<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <div class="game-board">
        
        <!-- LEFT PANEL: Game Visuals -->
        <div class="game-main">
            <div class="question-banner">
                <button class="speaker-btn" onclick="speakQuestion()">🗣️</button>
                <span id="question-text">Count the objects!</span>
            </div>

            <div class="sets-container">
                <!-- Set A -->
                <div class="set-box set-a" id="box-a">
                    <div class="set-label">Set A</div>
                    <div class="objects-area" id="area-a"></div>
                </div>

                <!-- Set B -->
                <div class="set-box set-b" id="box-b">
                    <div class="set-label">Set B</div>
                    <div class="objects-area" id="area-b"></div>
                </div>
            </div>

            <div class="inputs-row">
                <div class="input-group">
                    <span style="color:var(--color-a);">Set A has</span>
                    <input type="text" id="input-a" class="count-input" readonly onclick="setFocus('input-a')" placeholder="?">
                </div>
                <div class="input-group">
                    <span style="color:var(--color-b);">Set B has</span>
                    <input type="text" id="input-b" class="count-input" readonly onclick="setFocus('input-b')" placeholder="?">
                </div>
            </div>

            <div class="comparison-section">
                <div class="comparison-text" id="comparison-sentence">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Sidebar Controls -->
        <div class="game-sidebar">
            <div>
                <div class="numpad-header">Number Pad</div>
                <div class="numpad" id="numpad">
                    <!-- Generated JS -->
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-check" onclick="checkAnswer()">✅ Check</button>
                <button class="btn btn-new" onclick="newGame()">✨ New Game</button>
            </div>
        </div>

    </div>

    <!-- Feedback Overlay -->
    <div class="feedback-overlay" id="feedbackOverlay">
        <div class="feedback-box">
            <div style="font-size: 5rem; margin-bottom: 10px;" id="fb-icon">🎉</div>
            <h2 style="font-size: 2rem; color: #ff6f00; margin: 0 0 10px 0;" id="fb-title">Great Job!</h2>
            <p style="font-size: 1.3rem; color: #555;" id="fb-msg">You counted correctly.</p>
            <button class="btn btn-new" style="margin: 20px auto 0;" onclick="closeFeedback()">OK!</button>
        </div>
    </div>

    <!-- BONUS GAME OVERLAY (3 BASKETS) -->
    <div class="bonus-overlay" id="bonusOverlay">
        <div class="bonus-header">PICK A BASKET! 🏀</div>
        <div class="bonus-score-display" id="bonusScoreDisplay">Session Points: 0</div>
        
        <div class="baskets-wrapper">
            <!-- Basket 1 -->
            <div class="basket-item" id="basket-0" onclick="chooseBasket(0)">
                <div class="static-hoop">
                    <div class="backboard"><div class="backboard-inner"></div></div>
                    <div class="rim"></div>
                    <div class="net"></div>
                    <div class="hidden-score" id="score-0">+1</div>
                </div>
            </div>
            <!-- Basket 2 -->
            <div class="basket-item" id="basket-1" onclick="chooseBasket(1)">
                <div class="static-hoop">
                    <div class="backboard"><div class="backboard-inner"></div></div>
                    <div class="rim"></div>
                    <div class="net"></div>
                    <div class="hidden-score" id="score-1">+3</div>
                </div>
            </div>
            <!-- Basket 3 -->
            <div class="basket-item" id="basket-2" onclick="chooseBasket(2)">
                <div class="static-hoop">
                    <div class="backboard"><div class="backboard-inner"></div></div>
                    <div class="rim"></div>
                    <div class="net"></div>
                    <div class="hidden-score" id="score-2">+5</div>
                </div>
            </div>
        </div>

        <div class="basketball-shooter" id="active-ball">🏀</div>
    </div>

    <script>
        // --- Game State ---
        let countA = 0;
        let countB = 0;
        let activeInputId = 'input-a'; // Default focus
        let soundEnabled = true;
        let questionType = 'more';

        // Bonus Game State
        let totalBonusScore = 0;
        let canShoot = false;
        
        const icons = ['🍎', '🐸', '🌟', '🍪', '🚗', '⚽', '🦋', '🎈', '🐱', '🌻', '🧁', '🐢'];
        let currentIcon = '🍎';

        // --- Audio Context for Beeps ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(type) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'success') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'shoot') {
                // Whoosh sound
                const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = noiseBuffer;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                noise.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start();
            } else if (type === 'score') {
                // Buzzer / Swish sound
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- Speech Synthesis ---
        function speakQuestion() {
            if (!soundEnabled) return;
            window.speechSynthesis.cancel();
            
            const text = document.getElementById('question-text').textContent;
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9; 
            utterance.pitch = 1.2; 
            window.speechSynthesis.speak(utterance);
        }

        // --- Initialization ---
        window.onload = () => {
            generateNumpad();
            newGame();
        };

        function generateNumpad() {
            const pad = document.getElementById('numpad');
            // Numbers 0 to 20
            for (let i = 0; i <= 20; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.textContent = i;
                btn.onclick = () => handleNumInput(i);
                pad.appendChild(btn);
            }
            // Clear Button
            const clearBtn = document.createElement('button');
            clearBtn.className = 'num-btn';
            clearBtn.style.backgroundColor = '#ffcdd2';
            clearBtn.style.color = '#c62828';
            clearBtn.textContent = '❌';
            clearBtn.onclick = () => handleNumInput('clear');
            pad.appendChild(clearBtn);
        }

        function handleNumInput(val) {
            playTone('click');
            const input = document.getElementById(activeInputId);
            if (!input) return;

            if (val === 'clear') {
                input.value = '';
            } else {
                input.value = val;
            }
        }

        function setFocus(id) {
            if (activeInputId) {
                document.getElementById(activeInputId).classList.remove('focused-input');
            }
            activeInputId = id;
            document.getElementById(id).classList.add('focused-input');
            playTone('click');
        }

        // --- Game Logic ---
        function newGame() {
            // Reset styles
            document.getElementById('box-a').classList.remove('set-correct', 'set-wrong');
            document.getElementById('box-b').classList.remove('set-correct', 'set-wrong');
            
            // Reset fields
            document.getElementById('input-a').value = '';
            document.getElementById('input-b').value = '';
            
            // Randomize counts (1 to 20), avoid equal counts
            do {
                countA = Math.floor(Math.random() * 20) + 1; 
                countB = Math.floor(Math.random() * 20) + 1;
            } while (countA === countB);
            
            currentIcon = icons[Math.floor(Math.random() * icons.length)];

            renderObjects('area-a', countA);
            renderObjects('area-b', countB);

            // Determine Question
            questionType = Math.random() > 0.5 ? 'more' : 'fewer';
            const qText = questionType === 'more' ? "Which set has MORE?" : "Which set has FEWER?";
            document.getElementById('question-text').textContent = qText;

            // Setup Comparison Sentence Logic
            setupComparisonQuestion();

            // Set initial focus
            setFocus('input-a');

            setTimeout(speakQuestion, 500);
        }

        function renderObjects(id, count) {
            const container = document.getElementById(id);
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const span = document.createElement('div');
                span.className = 'game-icon';
                span.textContent = currentIcon;
                container.appendChild(span);
            }
        }

        function setupComparisonQuestion() {
            const container = document.getElementById('comparison-sentence');
            container.innerHTML = '';

            let textStart, textEnd;

            // Align the sentence with the question type (More or Fewer)
            if (questionType === 'more') {
                if (countA > countB) {
                    textStart = "Set A has";
                    textEnd = "more than Set B.";
                } else {
                    textStart = "Set B has";
                    textEnd = "more than Set A.";
                }
            } else { // questionType === 'fewer'
                if (countA < countB) {
                    textStart = "Set A has";
                    textEnd = "fewer than Set B.";
                } else {
                    textStart = "Set B has";
                    textEnd = "fewer than Set A.";
                }
            }

            const span1 = document.createElement('span');
            span1.textContent = textStart;
            
            const input = document.createElement('input');
            input.type = 'text';
            input.id = 'input-diff';
            input.className = 'count-input';
            input.readOnly = true;
            input.onclick = () => setFocus('input-diff');
            input.style.width = "60px";
            input.style.height = "60px";
            input.style.borderWidth = "3px";
            input.placeholder = "?";

            const span2 = document.createElement('span');
            span2.textContent = textEnd;

            container.appendChild(span1);
            container.appendChild(input);
            container.appendChild(span2);
        }

        // --- Check Logic ---
        function checkAnswer() {
            const userA = parseInt(document.getElementById('input-a').value);
            const userB = parseInt(document.getElementById('input-b').value);
            const userDiff = parseInt(document.getElementById('input-diff').value);

            // Basic Validation
            if (isNaN(userA) || isNaN(userB) || isNaN(userDiff)) {
                showFeedback('error', 'Missing Numbers!', 'Please fill in all the boxes.');
                playTone('error');
                return;
            }

            // Check A
            if (userA !== countA) {
                showFeedback('error', 'Oops!', 'Count Set A again. 🧐');
                playTone('error');
                setFocus('input-a');
                return;
            }

            // Check B
            if (userB !== countB) {
                showFeedback('error', 'Oops!', 'Count Set B again. 🧐');
                playTone('error');
                setFocus('input-b');
                return;
            }

            // Check Difference
            const correctDiff = Math.abs(countA - countB);
            if (userDiff !== correctDiff) {
                showFeedback('error', 'Check the Difference', 'How many extra items?');
                playTone('error');
                setFocus('input-diff');
                return;
            }

            // All correct
            playTone('success');
            
            // Show Feedback and then start Bonus Round
            showFeedback('success', 'You Win!', 'PICK A LUCKY BASKET! 🏀');

            // Auto-advance to bonus after 1.5 seconds
            setTimeout(() => {
                closeFeedback();
                startBonusGame();
            }, 1500);
        }

        // --- Feedback Modal Logic ---
        function showFeedback(type, title, msg) {
            const overlay = document.getElementById('feedbackOverlay');
            const icon = document.getElementById('fb-icon');
            const titleEl = document.getElementById('fb-title');
            const msgEl = document.getElementById('fb-msg');

            overlay.style.display = 'flex';
            
            if (type === 'success') {
                icon.textContent = '🦄';
                titleEl.textContent = title;
                titleEl.style.color = '#66bb6a';
            } else {
                icon.textContent = '🤔';
                titleEl.textContent = title;
                titleEl.style.color = '#ef5350';
            }
            msgEl.textContent = msg;
        }

        function closeFeedback() {
            document.getElementById('feedbackOverlay').style.display = 'none';
        }

        // --- BASKETBALL BONUS GAME LOGIC ---
        let rewards = [0, 0, 0];

        function startBonusGame() {
            const overlay = document.getElementById('bonusOverlay');
            overlay.style.display = 'flex';
            canShoot = true;

            // Reset ball position
            const ball = document.getElementById('active-ball');
            ball.style.transform = "translateX(-50%)";
            ball.style.bottom = "30px";
            ball.style.opacity = "1";

            // Hide old scores
            for(let i=0; i<3; i++) {
                const s = document.getElementById(`score-${i}`);
                s.classList.remove('reveal');
                s.textContent = "";
            }

            // Generate random rewards
            // Values: 1, 2, 3, 5, 10
            const possible = [1, 2, 3, 5, 10];
            rewards = [
                possible[Math.floor(Math.random()*possible.length)],
                possible[Math.floor(Math.random()*possible.length)],
                possible[Math.floor(Math.random()*possible.length)]
            ];
            
            // Ensure at least one is "big" (5 or 10) for excitement
            if(rewards[0] < 5 && rewards[1] < 5 && rewards[2] < 5) {
                rewards[Math.floor(Math.random()*3)] = 10;
            }

            // Assign hidden text but keep class hidden
            document.getElementById('score-0').textContent = "+" + rewards[0];
            document.getElementById('score-1').textContent = "+" + rewards[1];
            document.getElementById('score-2').textContent = "+" + rewards[2];
            
            document.getElementById('bonusScoreDisplay').textContent = "Session Points: " + totalBonusScore;
        }

        function chooseBasket(index) {
            if(!canShoot) return;
            canShoot = false;
            playTone('shoot');

            const ball = document.getElementById('active-ball');
            const targetBasket = document.getElementById(`basket-${index}`);
            
            // Calculate target position relative to the overlay
            // We use getBoundingClientRect
            const overlayRect = document.getElementById('bonusOverlay').getBoundingClientRect();
            const basketRect = targetBasket.getBoundingClientRect();
            
            // Center of basket relative to overlay
            const basketCenterX = basketRect.left + basketRect.width/2 - overlayRect.left;
            const basketCenterY = basketRect.top + basketRect.height/2 - overlayRect.top;
            
            // Center of ball starting position (bottom center)
            // It's absolutely positioned at left: 50%, bottom: 30px
            const startX = overlayRect.width / 2;
            const startY = overlayRect.height - 30 - 40; // 30px bottom + half height(40)

            const deltaX = basketCenterX - startX;
            const deltaY = basketCenterY - startY;

            // Animate Ball
            // Since we used translateX(-50%) initially, we need to account for that or just overwrite transform
            ball.style.transform = `translate(calc(-50% + ${deltaX}px), ${deltaY}px) scale(0.6)`;
            
            // On arrival (approx 600ms)
            setTimeout(() => {
                // Reveal Score
                const scoreEl = document.getElementById(`score-${index}`);
                scoreEl.classList.add('reveal');
                playTone('score');

                // Add points
                totalBonusScore += rewards[index];
                document.getElementById('bonusScoreDisplay').textContent = "Session Points: " + totalBonusScore;

                // Fade ball out
                ball.style.opacity = "0";

                // Finish
                setTimeout(endBonusGame, 2000);
            }, 600);
        }

        function endBonusGame() {
            document.getElementById('bonusOverlay').style.display = 'none';
            newGame();
        }

    </script>

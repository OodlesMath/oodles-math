<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../assets/brand.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Odd & Even Math Adventure - Ver5</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent scrolling, force fit */
            background-color: #D5F0FF;
            touch-action: manipulation; /* Better touch handling */
        }

        .btn-3d {
            transition: all 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
            margin-bottom: 4px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes drift {
            from { transform: translateX(-10vw); }
            to { transform: translateX(10vw); }
        }
        .animate-drift {
            animation: drift 20s alternate ease-in-out infinite;
        }

        @keyframes confetti-fall {
            0% { top: -10%; transform: rotate(0deg) translateX(0); opacity: 1; }
            100% { top: 110%; transform: rotate(720deg) translateX(100px); opacity: 1; }
        }
        .confetti-piece {
            position: fixed;
            animation: confetti-fall linear forwards;
            z-index: 99999;
        }

        @keyframes balloonFloat {
            0% { transform: translate3d(0, 16vh, 0); opacity: 0; }
            8% { opacity: 1; }
            48% { transform: translate3d(var(--drift-mid, 16px), -42vh, 0); opacity: 1; }
            92% { opacity: 1; }
            100% { transform: translate3d(var(--drift-end, -16px), -112vh, 0); opacity: 0; }
        }

        .balloon-btn {
            position: absolute;
            bottom: -120px;
            width: 82px;
            height: 108px;
            padding: 0;
            appearance: none;
            -webkit-appearance: none;
            border: 4px solid rgba(255,255,255,0.94);
            border-radius: 50% 50% 48% 48% / 40% 40% 62% 62%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.16), inset -8px -13px 0 rgba(0,0,0,0.12);
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
            transition: scale 0.14s ease-out, opacity 0.14s ease-out, filter 0.14s ease-out;
            overflow: visible;
            outline: none;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            contain: layout paint style;
            filter: saturate(1.18) contrast(1.04);
            touch-action: manipulation;
        }
        .balloon-btn::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -14px;
            width: 12px;
            height: 14px;
            background: inherit;
            border-left: 3px solid rgba(255,255,255,0.88);
            border-right: 3px solid rgba(255,255,255,0.88);
            border-bottom: 3px solid rgba(255,255,255,0.88);
            transform: translateX(-50%) rotate(45deg);
            border-radius: 2px;
        }
        .balloon-btn::after {
            content: '';
            position: absolute;
            left: 50%;
            top: calc(100% + 10px);
            width: 2px;
            height: 50px;
            background: rgba(255,255,255,0.88);
            transform: translateX(-50%);
            border-radius: 999px;
        }
        .balloon-btn:hover {
            scale: 1.04;
            filter: saturate(1.24) contrast(1.06) brightness(1.04);
        }
        .balloon-btn:active {
            scale: 0.96;
        }
        .balloon-btn.pop {
            scale: 1.26;
            opacity: 0;
            filter: saturate(1.35) brightness(1.12);
            pointer-events: none;
        }

        .bonus-overlay {
            position: fixed;
            inset: 0;
            z-index: 140;
            pointer-events: none;
        }
        .bonus-hint {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            color: #0ea5e9;
            border-radius: 999px;
            padding: 0.75rem 1.1rem;
            font-weight: 900;
            box-shadow: 0 10px 20px rgba(0,0,0,0.12);
            border: 3px solid white;
            font-size: 1rem;
            text-align: center;
        }

        /* More compact layout so the player does not need to scroll. */
        .main-container {
            gap: 0.75rem;
            padding: 0.95rem;
            max-height: 92vh;
        }
        .header-box { padding: 0.55rem 0.95rem; }
        .feedback-box { padding: 0.8rem 1rem; }
        .equation-box { padding: 1rem; gap: 0.5rem; }
        .box-size { width: 4rem; height: 4rem; font-size: 2rem; }
        .plus-equals { font-size: 2.25rem; }
        .interaction-area { min-height: 160px; }
        .number-btn { height: 3rem; font-size: 1.45rem; }
        .guess-btn { padding: 0.95rem; font-size: 1.8rem; }
        #active-game-area { gap: 0.5rem; }
        #view-result { gap: 0.9rem; }
        #result-equation { font-size: 1.45rem; padding: 0.9rem 1.2rem; }
        .result-banner { font-size: 1.45rem; padding: 0.9rem 1.5rem; }
        #next-btn { padding-top: 0.95rem; padding-bottom: 0.95rem; font-size: 1.65rem; }
        #view-bonus .bonus-card { padding: 1rem 1.15rem; }
        #view-bonus .bonus-pill { font-size: 1rem; padding: 0.6rem 0.95rem; }

        @media (min-width: 768px) {
            .main-container { gap: 0.95rem; padding: 1.35rem; }
            .header-box { padding: 0.8rem 1rem; }
            .feedback-box { padding: 1rem 1.15rem; }
            .equation-box { padding: 1.25rem; }
            .box-size { width: 5rem; height: 5rem; font-size: 2.7rem; }
            .plus-equals { font-size: 3rem; }
            .interaction-area { min-height: 180px; }
            .number-btn { height: 3.2rem; font-size: 1.7rem; }
            .guess-btn { padding: 1.1rem; font-size: 2rem; }
            #result-equation { font-size: 1.9rem; }
            .result-banner { font-size: 1.95rem; }
            #next-btn { font-size: 2rem; }
        }

        @media (max-height: 780px) {
            .main-container { max-height: 94vh; padding: 0.8rem; gap: 0.55rem; }
            .box-size { width: 3.55rem; height: 3.55rem; font-size: 1.8rem; }
            .plus-equals { font-size: 2rem; }
            .interaction-area { min-height: 135px; }
            .number-btn { height: 2.8rem; font-size: 1.3rem; }
            .guess-btn { padding: 0.75rem; font-size: 1.55rem; }
            #result-equation { font-size: 1.2rem; padding: 0.75rem 0.95rem; }
            .result-banner { font-size: 1.18rem; padding: 0.7rem 1.1rem; }
            #next-btn { padding-top: 0.8rem; padding-bottom: 0.8rem; font-size: 1.35rem; }
        }

        /* Keep interactive game views above the decorative background. */
        #game-ui { position: relative; z-index: 100; }
        .interaction-area { position: relative; z-index: 110; }
        #view-numbers { position: relative; z-index: 120; }
        #view-numbers:not(.hidden) { visibility: visible !important; opacity: 1 !important; }
    </style>

    <!-- BGnice background styles (Ver2) -->
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #87cefa; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        /* Background template extracted from Odd Even Ver1 */
        body {
            background: transparent !important;
        }
        #bgwao-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            background: linear-gradient(180deg, #48b1fa 0%, #87cefa 35%, #d7f4fc 100%);
            isolation: isolate;
        }
        #bgwao-background > svg:first-child {
            position: absolute !important;
            width: 0 !important;
            height: 0 !important;
            pointer-events: none;
        }
        /* Sun from background */
        #bgwao-background .sun {
            display: block !important;
            position: absolute;
            top: 8%;
            left: 10%;
            width: 120px;
            height: 120px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4), 0 0 0 30px rgba(255, 215, 0, 0.2), 0 0 70px rgba(255, 215, 0, 0.9);
            z-index: 1;
            animation: bgwaoPulseSun 4s infinite alternate ease-in-out;
        }
        @keyframes bgwaoPulseSun {
            0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 0 12px rgba(255, 215, 0, 0.4), 0 0 0 30px rgba(255, 215, 0, 0.2), 0 0 70px rgba(255, 215, 0, 0.9); }
            100% { transform: scale(1.08) rotate(10deg); box-shadow: 0 0 0 18px rgba(255, 215, 0, 0.3), 0 0 0 45px rgba(255, 215, 0, 0.1), 0 0 100px rgba(255, 255, 0, 1); }
        }
        #bgwao-background .rainbow { display: none !important; }

        /* Keep the cloud feel from this code */
        #bgwao-background .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.8;
            z-index: 3;
            animation: bgwaoFloatCloud linear infinite;
            box-shadow: none;
        }
        #bgwao-background .cloud::before,
        #bgwao-background .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: none;
        }
        #bgwao-background .cloud1 {
            width: 100px;
            height: 40px;
            top: 10%;
            left: -100px;
            animation-duration: 25s;
        }
        #bgwao-background .cloud1::before {
            width: 50px;
            height: 50px;
            top: -20px;
            left: 15px;
        }
        #bgwao-background .cloud1::after {
            width: 40px;
            height: 40px;
            top: -15px;
            right: 15px;
        }
        #bgwao-background .cloud2 {
            width: 150px;
            height: 50px;
            top: 25%;
            left: -150px;
            animation-duration: 35s;
            animation-delay: 5s;
        }
        #bgwao-background .cloud2::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 20px;
        }
        #bgwao-background .cloud2::after {
            width: 50px;
            height: 50px;
            top: -20px;
            right: 25px;
        }
        #bgwao-background .cloud3 {
            width: 100px;
            height: 40px;
            top: 42%;
            left: -120px;
            animation-duration: 30s;
            animation-delay: 10s;
            transform: scale(.9);
        }
        #bgwao-background .cloud3::before {
            width: 50px;
            height: 50px;
            top: -20px;
            left: 15px;
        }
        #bgwao-background .cloud3::after {
            width: 40px;
            height: 40px;
            top: -15px;
            right: 15px;
        }
        @keyframes bgwaoFloatCloud {
            from { transform: translateX(-150px); }
            to { transform: translateX(110vw); }
        }

        #bgwao-background .scenery-layer { position: absolute; bottom: 0; left: 0; width: 100%; pointer-events: none; }
        #bgwao-background .layer-back { z-index: 10; height: 35vh; }
        #bgwao-background .layer-mid { z-index: 20; height: 28vh; }
        #bgwao-background .layer-front { z-index: 30; height: 20vh; }
        #bgwao-background .hill-svg { position: absolute; bottom: -5px; left: 0; width: 100%; height: 100%; min-height: 25vh; }
        #bgwao-background .flora { position: absolute; bottom: 0; }
        #bgwao-background .sway { transform-origin: bottom center; animation: bgwaoSway 5s ease-in-out infinite; }
        #bgwao-background .sway-reverse { transform-origin: bottom center; animation: bgwaoSwayReverse 6s ease-in-out infinite; }
        #bgwao-background .sway-fast { transform-origin: bottom center; animation: bgwaoSway 3.5s ease-in-out infinite; }
        @keyframes bgwaoSway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
        @keyframes bgwaoSwayReverse { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }

        #bgwao-background .butterfly {
            position: absolute;
            z-index: 25;
            width: 34px;
            height: 26px;
            pointer-events: none;
            filter: drop-shadow(0 2px 3px rgba(15,23,42,.15));
        }
        #bgwao-background .butterfly svg { width: 100%; height: 100%; overflow: visible; }
        #bgwao-background .butterfly .wing-left,
        #bgwao-background .butterfly .wing-right {
            transform-box: fill-box;
            animation-duration: .34s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        #bgwao-background .butterfly .wing-left { transform-origin: 100% 50%; animation-name: prettyWingLeft; }
        #bgwao-background .butterfly .wing-right { transform-origin: 0% 50%; animation-name: prettyWingRight; }
        @keyframes prettyWingLeft {
            from { transform: scaleX(.38) rotate(-7deg); }
            to { transform: scaleX(1) rotate(7deg); }
        }
        @keyframes prettyWingRight {
            from { transform: scaleX(.38) rotate(7deg); }
            to { transform: scaleX(1) rotate(-7deg); }
        }
        #bgwao-background .butterfly .butterfly-body { filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
        @keyframes bgwaoFlyOne {
            0% { left: -8%; top: 20%; transform: translate(0,0) scale(.95); }
            25% { top: 14%; transform: translate(18vw, -1.2vh) scale(1.05); }
            50% { top: 24%; transform: translate(42vw, 1.8vh) scale(1); }
            75% { top: 17%; transform: translate(67vw, -2vh) scale(1.08); }
            100% { left: 102%; top: 22%; transform: translate(0,0) scale(1); }
        }
        @keyframes bgwaoFlyTwo {
            0% { left: 110%; top: 32%; transform: translate(0,0) scale(.8) scaleX(-1); }
            25% { top: 28%; transform: translate(-22vw, 1vh) scale(.92) scaleX(-1); }
            50% { top: 36%; transform: translate(-45vw, -1.5vh) scale(.84) scaleX(-1); }
            75% { top: 29%; transform: translate(-70vw, 1.8vh) scale(.95) scaleX(-1); }
            100% { left: -10%; top: 34%; transform: translate(0,0) scale(.88) scaleX(-1); }
        }
        @keyframes bgwaoFlyThree {
            0% { left: -6%; top: 48%; transform: translate(0,0) scale(.72); }
            30% { top: 42%; transform: translate(28vw, -2vh) scale(.8); }
            65% { top: 50%; transform: translate(56vw, 2.2vh) scale(.78); }
            100% { left: 104%; top: 44%; transform: translate(0,0) scale(.74); }
        }
        @keyframes bgwaoFlyFour {
            0% { left: 105%; top: 16%; transform: translate(0,0) scale(.82) scaleX(-1); }
            35% { top: 20%; transform: translate(-30vw, 2vh) scale(.9) scaleX(-1); }
            70% { top: 14%; transform: translate(-62vw, -1vh) scale(.86) scaleX(-1); }
            100% { left: -8%; top: 18%; transform: translate(0,0) scale(.82) scaleX(-1); }
        }
        #bgwao-background .butterfly-1 { animation: bgwaoFlyOne 20s linear infinite; }
        #bgwao-background .butterfly-2 { animation: bgwaoFlyTwo 24s linear infinite; }
        #bgwao-background .butterfly-3 { animation: bgwaoFlyThree 18s linear infinite; }
        #bgwao-background .butterfly-4 { animation: bgwaoFlyFour 22s linear infinite; }

        @media (max-width: 600px) {
            #bgwao-background .sun { width: 86px; height: 86px; left: 8%; top: 7%; }
            #bgwao-background .cloud1 { width: 72px; height: 28px; }
            #bgwao-background .cloud2 { width: 108px; height: 36px; }
            #bgwao-background .cloud3 { width: 72px; height: 28px; }
            #bgwao-background .cloud1::before, #bgwao-background .cloud3::before { width: 34px; height: 34px; top: -13px; left: 10px; }
            #bgwao-background .cloud1::after, #bgwao-background .cloud3::after { width: 28px; height: 28px; top: -10px; right: 10px; }
            #bgwao-background .cloud2::before { width: 42px; height: 42px; top: -18px; left: 14px; }
            #bgwao-background .cloud2::after { width: 34px; height: 34px; top: -13px; right: 16px; }
        }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-blue-200">
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
    <!-- BGnice background (Ver2) -->
<div id="bgwao-background" aria-hidden="true">
<!-- GLOBAL SVG DEFINITIONS -->
    <!-- Replaced 'class="hidden"' (display: none) with absolute positioning. 
         display: none breaks SVG gradient URL references in many modern browsers! -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
        <defs>
            <!-- Gradients for Hills -->
            <linearGradient id="hillGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8ce62c" />
                <stop offset="100%" stop-color="#55b300" />
            </linearGradient>
            <linearGradient id="hillGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#73d914" />
                <stop offset="100%" stop-color="#449400" />
            </linearGradient>
            <linearGradient id="hillGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#58cc02" />
                <stop offset="100%" stop-color="#2c7000" />
            </linearGradient>

            <!-- Gradients for Trees -->
            <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#5C3A21" />
                <stop offset="50%" stop-color="#8B5A2B" />
                <stop offset="100%" stop-color="#4A2F1D" />
            </linearGradient>
            <linearGradient id="canopyGradBase" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#58CC02" />
                <stop offset="100%" stop-color="#2D7A00" />
            </linearGradient>
            <linearGradient id="canopyGradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#8bf836" />
                <stop offset="100%" stop-color="#58CC02" />
            </linearGradient>

            <!-- 1. Beautiful Fluffy Tree Template (V10 - Thicker Trunk) -->
            <g id="beautiful-tree">
                <!-- Enlarged shadow at base to match thicker trunk -->
                <ellipse cx="100" cy="245" rx="45" ry="12" fill="rgba(0,0,0,0.15)" />
                
                <!-- Thicker Trunk and Base -->
                <!-- Path adjusted so the base goes from X=70 to X=130 (60px wide) -->
                <path d="M70,250 C80,190 85,150 90,110 L110,110 C115,150 120,190 130,250 Z" fill="url(#trunkGrad)" />
                
                <!-- Branches -->
                <path d="M92,150 C70,130 60,110 50,100" fill="none" stroke="url(#trunkGrad)" stroke-width="8" stroke-linecap="round"/>
                <path d="M108,140 C125,120 135,110 145,95" fill="none" stroke="url(#trunkGrad)" stroke-width="7" stroke-linecap="round"/>

                <!-- Front Canopy Highlights (Lighter Green, shifted up and left) -->
                <path d="M95,25 C45,25 25,70 35,105 C15,115 15,155 45,165 C55,180 85,180 95,175 C105,180 145,180 155,165 C180,155 180,115 165,105 C175,70 155,25 95,25 Z" fill="url(#canopyGradHighlight)" opacity="0.9"/>
                
                <!-- Leaf Texture / Highlights -->
                <circle cx="70" cy="65" r="12" fill="#ef4444" opacity="0.92"/>
                <circle cx="120" cy="70" r="9" fill="#fb7185" opacity="0.88"/>
                <circle cx="145" cy="110" r="14" fill="#f97316" opacity="0.9"/>
                <circle cx="50" cy="120" r="10" fill="#fb7185" opacity="0.85"/>
                <circle cx="95" cy="145" r="16" fill="#dc2626" opacity="0.9"/>
            </g>

            <!-- 2. Beautiful Flower: Daisy -->
            <g id="flower-daisy">
                <path d="M20,60 Q25,30 20,10" stroke="#3A8A00" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M20,40 Q10,35 5,25 Q15,30 20,40" fill="#46A302" />
                <path d="M20,45 Q30,40 35,30 Q25,35 20,45" fill="#46A302" />
                <g fill="#ffffff" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.1))">
                    <ellipse cx="20" cy="5" rx="4" ry="10" />
                    <ellipse cx="20" cy="25" rx="4" ry="10" />

                    <ellipse cx="13" cy="8" rx="8" ry="4" transform="rotate(45 13 8)"/>

                </g>
                <circle cx="20" cy="15" r="5" fill="#FFD700" stroke="#E5B400" stroke-width="1.5"/>
            </g>

            <!-- 3. Beautiful Flower: Pink Tulip -->
            <g id="flower-tulip">
                <path d="M20,60 Q18,35 20,15" stroke="#3A8A00" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M20,50 Q10,30 10,15 Q18,35 20,50" fill="#46A302" />
                <path d="M20,55 Q32,35 32,20 Q22,40 20,55" fill="#46A302" />
                <path d="M10,15 C10,30 30,30 30,15 C25,25 20,10 20,10 C20,10 15,25 10,15 Z" fill="#FF6B8B" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.15))"/>
                <path d="M12,16 C15,25 25,25 28,16 C23,22 20,12 20,12 C20,12 17,22 12,16 Z" fill="#FF9EAF" />
            </g>

            <!-- 4. Beautiful Flower: Blue Starflower -->
            <g id="flower-star">
                <path d="M20,60 Q22,35 20,15" stroke="#3A8A00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M20,35 Q10,30 5,20 Q15,25 20,35" fill="#46A302" />
                <path d="M20,42 Q30,37 35,27 Q25,32 20,42" fill="#46A302" />
                <g fill="#1CB0F6" filter="drop-shadow(0px 2px 2px rgba(0,0,0,0.15))">
                    <path d="M20,15 L23,5 L26,15 L36,18 L26,21 L23,31 L20,21 L10,18 Z" />
                </g>
                <circle cx="23" cy="18" r="3" fill="#ffffff" />
            </g>

    <script>
        // Initialize Icons
        try { if (window.lucide) window.lucide.createIcons(); } catch (e) { console.warn('Lucide icons unavailable'); }

        // Game State Variables
        let roundsList = [];
        let currentRoundIndex = 0;
        let step = 'first'; // 'first', 'second', 'guess', 'bonus', 'result', 'complete'
        let num1 = null;
        let num2 = null;
        let starPoints = 0;

        let bonusTimerInterval;
        let timeLeft = 0;
        let starsCaught = 0;

        // DOM Elements
        const elProgress = document.getElementById('progress-bar');
        const elRoundCounter = document.getElementById('round-counter');
        const elStarPoints = document.getElementById('star-points');
        const elFeedbackContainer = document.getElementById('feedback-container');
        const elFeedbackMsg = document.getElementById('feedback-message');
        const elRoundTitle = document.getElementById('round-title');

        const elBox1Val = document.getElementById('box1-val');
        const elBox1Label = document.getElementById('box1-label');

        const elBox2Val = document.getElementById('box2-val');
        const elBox2Label = document.getElementById('box2-label');

        const elSumVal = document.getElementById('sum-val');
        const elSumLabel = document.getElementById('sum-label');

        const vNumbers = document.getElementById('view-numbers');
        const vGuess = document.getElementById('view-guess');
        const vBonus = document.getElementById('view-bonus');
        const vResult = document.getElementById('view-result');
        const vActiveGame = document.getElementById('active-game-area');
        const vCompletion = document.getElementById('completion-screen');
        const bonusOverlay = document.getElementById('bonus-overlay');
        const balloonsContainer = document.getElementById('balloons-container');

        const hideBonusOverlay = () => {
            if (bonusOverlay) bonusOverlay.classList.add('hidden');
            if (balloonsContainer) balloonsContainer.innerHTML = '';
            clearInterval(bonusTimerInterval);
        };


        // Helper Functions
        const isOdd = (n) => n % 2 !== 0;
        const isEven = (n) => n % 2 === 0;

        // Sound System
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                switch (type) {
                    case 'click':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1); break;
                    case 'correct':
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
                        gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.start(now); osc.stop(now + 0.4); break;
                    case 'error':
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(150, now + 0.3);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3); break;
                    case 'pop':
                        osc.type = 'sine'; osc.frequency.setValueAtTime(1000, now); osc.frequency.exponentialRampToValueAtTime(2000, now + 0.05);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1); break;
                    case 'victory':
                        [440, 554, 659, 880].forEach((freq, i) => {
                            const o = ctx.createOscillator(); const g = ctx.createGain();
                            o.type = 'triangle'; o.connect(g); g.connect(ctx.destination);
                            o.frequency.setValueAtTime(freq, now + i * 0.15);
                            g.gain.setValueAtTime(0, now + i * 0.15); g.gain.linearRampToValueAtTime(0.15, now + i * 0.15 + 0.05); g.gain.linearRampToValueAtTime(0, now + i * 0.15 + 0.4);
                            o.start(now + i * 0.15); o.stop(now + i * 0.15 + 0.5);
                        }); break;
                }
            } catch (e) { console.log("Audio disabled"); }
        };

        const speakFeedback = () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = elFeedbackMsg.innerText;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        };

        const generateUniqueRounds = () => {
            const baseTypes = [
                { t1: 'Odd', t2: 'Odd', goal: 'Even', title: 'Odd + Odd' },
                { t1: 'Even', t2: 'Even', goal: 'Even', title: 'Even + Even' },
                { t1: 'Odd', t2: 'Even', goal: 'Odd', title: 'Odd + Even' },
                { t1: 'Even', t2: 'Odd', goal: 'Odd', title: 'Even + Odd' },
            ];

            let pool = [];
            // Generate standard rounds
            for (let i = 0; i < 20; i++) {
                const type = baseTypes[Math.floor(Math.random() * baseTypes.length)];
                const isBig = Math.random() > 0.5;
                pool.push({
                    id: Math.random(),
                    ...type,
                    title: `${type.title}${isBig ? ' (Big!)' : ''}`,
                    range: isBig ? [11, 20] : [1, 10],
                });
            }

            // Generate missing number rounds
            for (let i = 0; i < 5; i++) {
                const fixedVal = Math.floor(Math.random() * 10) + 2;
                const target = fixedVal + Math.floor(Math.random() * 10) + 5;
                pool.push({
                    id: Math.random(),
                    title: "Find the Missing Number!",
                    t1: (target - fixedVal) % 2 === 0 ? 'Even' : 'Odd',
                    t2: 'Fixed',
                    fixedVal,
                    target,
                    goal: '?',
                    range: [1, 20]
                });
            }

            // Notice: Mystery Choice Rounds have been removed from the pool entirely.

            return pool.sort(() => 0.5 - Math.random()).slice(0, 10);
        };

        const updateFeedback = (type, message) => {
            elFeedbackMsg.innerText = message;
            elFeedbackContainer.className = `p-3 md:p-5 rounded-2xl md:rounded-3xl flex items-center gap-3 md:gap-4 transition-colors duration-300 border-b-4 feedback-box shrink-0 ${
                type === 'success' ? 'bg-green-100 border-green-300' :
                type === 'error' ? 'bg-red-100 border-red-300' :
                'bg-[#E5F3FF] border-[#BBE0FF]'
            }`;
            elFeedbackMsg.className = `text-sm md:text-xl font-bold flex-1 leading-tight ${
                type === 'success' ? 'text-green-700' :
                type === 'error' ? 'text-red-700' :
                'text-[#1CB0F6]'
            }`;

            // Auto-speak feedback when it updates
            speakFeedback();
        };

        const updateBoxColors = () => {
            const currentRound = roundsList[currentRoundIndex];

            // Box 1
            if (num1 !== null) {
                elBox1Val.className = "box-size rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center font-black shadow-inner transition-all bg-[#1CB0F6] text-white border-4 border-[#1899D6] shadow-lg scale-105";
                elBox1Val.innerText = num1;
            } else {
                elBox1Val.className = "box-size rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center font-black shadow-inner transition-all bg-gray-200 text-gray-400 border-4 border-transparent";
                elBox1Val.innerText = "?";
            }

            // Box 2
            if (num2 !== null) {
                elBox2Val.className = "box-size rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center font-black shadow-inner transition-all bg-[#FF4136] text-white border-4 border-[#E03A30] shadow-lg scale-105";
                elBox2Val.innerText = num2;
            } else {
                elBox2Val.className = "box-size rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center font-black shadow-inner transition-all bg-gray-200 text-gray-400 border-4 border-transparent";
                elBox2Val.innerText = "?";
            }

            // Sum Box
            if (['bonus', 'result', 'guess'].includes(step)) {
                elSumVal.className = "box-size rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center font-black shadow-inner transition-all bg-[#FFDC00] text-[#D87000] border-4 border-[#E5C600] scale-110 shadow-[0_0_20px_rgba(255,220,0,0.5)] rotate-3";
                elSumVal.innerText = (num1 + num2);
            } else if (num1 !== null && num2 !== null) {
                elSumVal.className = "box-size rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center font-black shadow-inner transition-all bg-white text-gray-600 border-4 border-gray-300";
                elSumVal.innerText = "?";
            } else {
                elSumVal.className = "box-size rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center font-black shadow-inner transition-all bg-gray-200 text-gray-400";
                elSumVal.innerText = "?";
            }
        };

        const updateLabels = () => {
            const currentRound = roundsList[currentRoundIndex];

            // Labels are now always fixed based on the round type, no choices.
            elBox1Label.innerText = currentRound.t1;
            elBox1Label.className = `font-black text-xs md:text-sm uppercase px-2 py-1 md:px-3 md:py-1.5 rounded-xl md:rounded-2xl ${currentRound.t1 === 'Odd' ? 'bg-orange-100 text-orange-600' : 'bg-purple-100 text-purple-600'}`;

            elBox2Label.innerText = currentRound.t2 === 'Fixed' ? 'Number' : currentRound.t2;
            elBox2Label.className = `font-black text-xs md:text-sm uppercase px-2 py-1 md:px-3 md:py-1.5 rounded-xl md:rounded-2xl ${
                currentRound.t2 === 'Odd' ? 'bg-orange-100 text-orange-600' :
                currentRound.t2 === 'Fixed' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600'
            }`;

            elSumLabel.innerText = currentRound.t2 === 'Fixed' ? 'Target: ' + currentRound.target : 'Sum';
        };

        const renderNumbers = () => {
            const currentRound = roundsList[currentRoundIndex];
            const start = currentRound.range[0];
            const end = currentRound.range[1];
            vNumbers.innerHTML = '';
            for (let n = start; n <= end; n++) {
                const btn = document.createElement('button');
                btn.className = "number-btn font-black rounded-xl md:rounded-[1.5rem] bg-white border-2 border-gray-200 border-b-[4px] md:border-b-[6px] border-b-gray-300 hover:bg-[#F0F9FF] hover:border-[#1CB0F6] hover:border-b-[#1899D6] hover:text-[#1CB0F6] active:border-b-2 active:translate-y-1 transition-all flex items-center justify-center text-gray-700 w-full";
                btn.innerText = n;
                btn.onclick = () => handleNumberClick(n);
                vNumbers.appendChild(btn);
            }
        };

        const switchView = (viewId) => {
            [vNumbers, vGuess, vBonus, vResult].forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        };

        const handleNumberClick = (n) => {
            if (step === 'result' || step === 'bonus') return;
            const currentRound = roundsList[currentRoundIndex];

            if (currentRound.t2 === 'Fixed') {
                if (n + currentRound.fixedVal === currentRound.target) {
                    const typeNeeded = currentRound.t1;
                    if ((typeNeeded === 'Odd' && isOdd(n)) || (typeNeeded === 'Even' && isEven(n))) {
                        playSound('click'); num1 = n; step = 'guess';
                        updateFeedback('success', `Perfect! ${n} + ${currentRound.fixedVal} is ${currentRound.target}. Now guess if the sum is odd or even!`);
                        updateUI();
                    } else {
                        playSound('error');
                        updateFeedback('error', `That makes ${currentRound.target}, but is ${n} ${typeNeeded.toUpperCase()}?`);
                    }
                } else {
                    playSound('error');
                    updateFeedback('error', "Not quite the target! Try another number.");
                }
                return;
            }

            if (step === 'first') {
                const type = currentRound.t1;
                if ((type === 'Odd' && isOdd(n)) || (type === 'Even' && isEven(n))) {
                    playSound('click'); num1 = n; step = 'second';
                    updateFeedback('success', `Great! ${n} is ${type}. Now pick an ${currentRound.t2} number!`);
                    updateUI();
                } else {
                    playSound('error');
                    updateFeedback('error', `Oops! ${n} is ${isOdd(n) ? 'Odd' : 'Even'}. We need an ${type} number.`);
                }
            } else if (step === 'second') {
                const type = currentRound.t2;
                if ((type === 'Odd' && isOdd(n)) || (type === 'Even' && isEven(n))) {
                    playSound('click'); num2 = n; step = 'guess';
                    updateFeedback('info', `Awesome! Now, is ${num1} + ${n} ODD or EVEN?`);
                    updateUI();
                } else {
                    playSound('error');
                    updateFeedback('error', `Wait! ${n} is ${isOdd(n) ? 'Odd' : 'Even'}. We need an ${type} number.`);
                }
            }
        };

        const handleGuess = (type) => {
            const sum = num1 + num2;
            const correctType = isOdd(sum) ? 'Odd' : 'Even';
            if (type === correctType) {
                playSound('correct');
                starsCaught = 0;

                // Bonus game appears only after every 2 completed questions: 2, 4, 6, 8, 10.
                const shouldPlayBonus = ((currentRoundIndex + 1) % 2 === 0);
                if (shouldPlayBonus) {
                    step = 'bonus';
                    timeLeft = 10;
                    document.getElementById('bonus-score').innerText = '0';
                    document.getElementById('bonus-timer').innerText = timeLeft;
                    updateFeedback('success', "Correct! Bonus time — pop the balloons!");
                    startBonusGame();
                } else {
                    step = 'result';
                    updateFeedback('success', "Correct! Great job! One more challenge before Bonus Time!");
                }
                updateUI();
            } else {
                playSound('error');
                updateFeedback('error', "Try again! Check if the sum is odd or even.");
            }
        };

        const startBonusGame = () => {
            // Deeper, more saturated balloon colors for stronger contrast.
            const colors = [
                ['#FF3B46', '#9F1239'],
                ['#2F7BFF', '#1E3A8A'],
                ['#FFB000', '#92400E'],
                ['#12C97A', '#065F46'],
                ['#9333EA', '#581C87'],
                ['#F23888', '#9D174D']
            ];
            if (bonusOverlay) bonusOverlay.classList.remove('hidden');
            if (balloonsContainer) balloonsContainer.innerHTML = '';

            let balloonSerial = 0;

            const createBalloon = (seed = 0, enterFromBottom = false) => {
                if (step !== 'bonus' || !balloonsContainer) return;

                const btn = document.createElement('button');
                const [c1, c2] = colors[(seed + balloonSerial++) % colors.length];
                const duration = 8.5 + Math.random() * 3.5; // slower, calmer movement
                const baseScale = 0.82 + Math.random() * 0.34;
                const driftMid = -34 + Math.random() * 68;
                const driftEnd = -46 + Math.random() * 92;

                btn.type = 'button';
                btn.className = 'balloon-btn';
                btn.setAttribute('aria-label', 'balloon');
                btn.style.left = `${7 + Math.random() * 86}%`;
                btn.style.background = `radial-gradient(circle at 34% 25%, rgba(255,255,255,0.94) 0 8%, ${c1} 9%, ${c1} 35%, ${c2} 100%)`;
                btn.style.setProperty('--drift-mid', `${driftMid}px`);
                btn.style.setProperty('--drift-end', `${driftEnd}px`);
                btn.style.scale = baseScale.toFixed(2);

                // Initial balloons are distributed over the whole flight path so play starts immediately.
                // Replacement balloons enter gently from the bottom after a pop.
                const delay = enterFromBottom ? 0 : -(Math.random() * duration * 0.88);
                btn.style.animation = `balloonFloat ${duration.toFixed(2)}s linear ${delay.toFixed(2)}s infinite`;

                const popBalloon = (e) => {
                    e.preventDefault();
                    if (btn.dataset.popped === '1' || step !== 'bonus') return;
                    btn.dataset.popped = '1';
                    playSound('pop');
                    starsCaught++;
                    document.getElementById('bonus-score').innerText = starsCaught;
                    btn.classList.add('pop');

                    // Remove the popped balloon instead of restarting its animation in-place.
                    // This avoids the visual jump/lag from changing animation properties mid-flight.
                    setTimeout(() => {
                        btn.remove();
                        if (step === 'bonus') {
                            requestAnimationFrame(() => createBalloon(seed + 1, true));
                        }
                    }, 150);
                };

                btn.addEventListener('pointerdown', popBalloon, { passive: false });
                balloonsContainer.appendChild(btn);
            };

            // Fewer DOM nodes + slower transform-only animation = smoother performance.
            for (let i = 0; i < 9; i++) createBalloon(i, false);

            clearInterval(bonusTimerInterval);
            bonusTimerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('bonus-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(bonusTimerInterval);
                    hideBonusOverlay();
                    step = 'result';
                    starPoints += (starsCaught * 10);
                    playSound('victory');
                    updateUI();
                }
            }, 1000);
        };

        const createConfetti = () => {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const colors = ['#FF4136', '#FF851B', '#FFDC00', '#2ECC40', '#0074D9', '#B10DC9', '#F012BE', '#7FDBFF'];
            for (let i = 0; i < 100; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = `${Math.random() * 100}%`;
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDuration = `${Math.random() * 3 + 2}s`;
                piece.style.animationDelay = `${Math.random() * 0.5}s`;
                piece.style.width = `${Math.random() * 10 + 8}px`;
                piece.style.height = `${Math.random() * 10 + 8}px`;
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '4px';
                container.appendChild(piece);
            }
        };

        const nextRound = () => {
            playSound('click');
            if (currentRoundIndex >= 9) {
                playSound('victory');
                step = 'complete';
                createConfetti();
                updateUI();
            } else {
                currentRoundIndex++;
                resetRoundState();
                updateUI();
            }
        };

        const resetRoundState = () => {
            hideBonusOverlay();
            step = 'first';
            num1 = null;
            num2 = null;
            const currentRound = roundsList[currentRoundIndex];

            if (currentRound.t2 === 'Fixed') {
                num2 = currentRound.fixedVal;
                updateFeedback('info', `Find the ${currentRound.t1} number plus ${currentRound.fixedVal} that makes ${currentRound.target}!`);
            } else {
                updateFeedback('info', `Pick an ${currentRound.t1} number!`);
            }
        };

        const resetGame = () => {
            playSound('click');
            document.getElementById('confetti-container').innerHTML = '';
            roundsList = generateUniqueRounds();
            currentRoundIndex = 0;
            starPoints = 0;
            resetRoundState();
            updateUI();
        };

        // Main UI Controller
        const updateUI = () => {
            if (step === 'complete') {
                hideBonusOverlay();
                vActiveGame.classList.add('hidden');
                vCompletion.classList.remove('hidden');
                vCompletion.classList.add('flex');
                document.getElementById('final-score').innerText = starPoints;
                return;
            }

            vActiveGame.classList.remove('hidden');
            vCompletion.classList.add('hidden');
            vCompletion.classList.remove('flex');

            const currentRound = roundsList[currentRoundIndex];
            elRoundCounter.innerText = currentRoundIndex + 1;
            elStarPoints.innerText = starPoints;
            elProgress.style.width = `${((currentRoundIndex) / 10) * 100}%`;
            elRoundTitle.innerText = currentRound.title;

            updateBoxColors();
            updateLabels();

            if (step !== 'bonus') hideBonusOverlay();

            if (step === 'first' || step === 'second') {
                renderNumbers();
                switchView('view-numbers');
            } else if (step === 'guess') {
                switchView('view-guess');
            } else if (step === 'bonus') {
                switchView('view-bonus');
            } else if (step === 'result') {
                const bonusRound = ((currentRoundIndex + 1) % 2 === 0);
                document.getElementById('result-bonus-text').innerText = bonusRound
                    ? (starsCaught > 0 ? `POPPED ${starsCaught} BALLOONS!` : "GOOD EFFORT!")
                    : "GREAT JOB!";
                document.getElementById('result-equation').innerHTML = `${isOdd(num1) ? 'Odd' : 'Even'} + ${isOdd(num2) ? 'Odd' : 'Even'} = <span class="text-[#58CC02] font-black ml-2 uppercase">${(num1 + num2) % 2 === 0 ? 'Even' : 'Odd'}</span>`;

                const btn = document.getElementById('next-btn');
                btn.innerHTML = currentRoundIndex >= 9
                    ? `<span>FINISH</span><i data-lucide="arrow-right" stroke-width="3" class="w-6 h-6 md:w-8 md:h-8"></i>`
                    : `<span>NEXT ROUND</span><i data-lucide="arrow-right" stroke-width="3" class="w-6 h-6 md:w-8 md:h-8"></i>`;
                try { if (window.lucide) window.lucide.createIcons(); } catch (e) { console.warn('Lucide icons unavailable'); }
                switchView('view-result');
            }
        };

        // Initialize Game reliably. Do not wait for every external CDN asset to finish.
        const initializeGame = () => {
            roundsList = generateUniqueRounds();
            currentRoundIndex = 0;
            starPoints = 0;
            resetRoundState();
            updateUI();
            // Safety: make sure the number strip is populated whenever the round starts on a number-picking step.
            if ((step === 'first' || step === 'second') && vNumbers && vNumbers.children.length === 0) {
                renderNumbers();
                switchView('view-numbers');
            }
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeGame, { once: true });
        } else {
            initializeGame();
        }

    </script>
</body>
</html>

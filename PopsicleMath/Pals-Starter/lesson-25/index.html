.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px}
.hidden{display:none!important}

/* Start screen */
.start-card{
  width:min(820px,94vw);padding:34px 34px 30px;border-radius:34px;
  background:rgba(255,255,255,.90);border:5px solid rgba(255,255,255,.96);box-shadow:var(--shadow);
  text-align:center;backdrop-filter:blur(8px)
}
.title-badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:#e9f8ff;color:#1182c5;font-weight:900;font-size:15px;border:2px solid #b6e7ff}
h1{margin:14px 0 6px;font-size:clamp(34px,5vw,58px);line-height:1.05;color:#7951d6;font-weight:900;letter-spacing:-1.5px}
.subtitle{margin:0 auto 24px;font-size:clamp(16px,2vw,21px);font-weight:700;color:#4f6d85}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 24px}
.mode-btn{border:3px solid #dcebf5;border-radius:23px;background:#fff;padding:17px 12px;min-height:112px;cursor:pointer;box-shadow:0 7px 0 #c7dce9;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink);font-weight:900}
.mode-btn .ico{font-size:33px}.mode-btn small{font-size:11px;color:#6f8798;font-weight:700;line-height:1.2}
.mode-btn:hover{transform:translateY(-3px)}
.mode-btn.selected{border-color:#4db6f5;background:#edf9ff;box-shadow:0 7px 0 #1685cf,0 0 0 5px rgba(39,167,242,.16);color:#0e79ba}
.play-btn{border:0;border-radius:22px;background:linear-gradient(#6fdb62,#4fbe43);color:#fff;font-size:25px;font-weight:900;padding:17px 42px;min-width:250px;cursor:pointer;box-shadow:0 8px 0 #338c30;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.play-btn:active,.next-btn:active,.speaker:active,.home-btn:active,.again-btn:active{transform:translateY(6px);box-shadow:none!important}

/* Game */
#gameScreen{padding:18px 18px 20px;align-items:stretch;justify-content:stretch;flex-direction:column}
.hud{height:82px;display:grid;grid-template-columns:140px 1fr 140px;align-items:center;gap:18px;max-width:1180px;width:100%;margin:0 auto;position:relative;z-index:3}
.counter-pill,.star-pill{justify-self:start;background:rgba(255,255,255,.90);border:3px solid #fff;border-radius:18px;padding:9px 14px;box-shadow:0 7px 18px rgba(20,74,110,.14);font-size:14px;font-weight:900;white-space:nowrap}
.star-pill{justify-self:end;color:#b97700}
.progress-wrap{display:flex;flex-direction:column;gap:5px;min-width:0}
.progress-label{text-align:center;font-size:13px;font-weight:900;color:#285777;text-shadow:0 1px 0 white}
.meter{height:18px;border-radius:999px;background:rgba(255,255,255,.70);border:3px solid rgba(255,255,255,.93);overflow:hidden;box-shadow:0 5px 13px rgba(20,74,110,.13)}
.bar{height:100%;width:0;background:linear-gradient(90deg,#59d763,#22b7f5,#a96bea);border-radius:999px;transition:width .45s ease}
.logo-safe{position:absolute;right:16px;top:10px;width:116px;height:48px;pointer-events:none;opacity:.001}

.prompt-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
.prompt{font-size:clamp(22px,3vw,34px);font-weight:900;text-align:center;color:#274f6c;line-height:1.15}
.speaker{width:52px;height:52px;flex:0 0 52px;border:0;border-radius:50%;background:#35b7f4;color:white;font-size:24px;cursor:pointer;box-shadow:0 6px 0 #1685cf}

.group-box{background:white;border:4px solid #d8e5ec;border-radius:24px;min-height:155px;padding:18px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;box-shadow:0 6px 0 #d5e3eb}

.answers.four{grid-template-columns:repeat(4,1fr)}
.answer{min-height:110px;border:4px solid #d6e4ec;border-radius:24px;background:#fff;box-shadow:0 8px 0 #c7d7e2;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.14s;position:relative;padding:12px;color:#284c66;font-weight:900;font-size:22px;text-align:center}
.answer:hover{transform:translateY(-3px);border-color:#a9d7f0}.answer:active{transform:translateY(5px);box-shadow:0 2px 0 #c7d7e2}
.answer.correct{background:#eaffea;border-color:#56c75a;box-shadow:0 8px 0 #3c9e41}.answer.correct::after{content:'✓';position:absolute;right:8px;top:6px;background:#43b94a;color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:18px}

/* Shapes */

.shape.circle{border-radius:50%}.shape.square{border-radius:10%}.shape.rectangle{border-radius:12%}.shape.triangle{width:0!important;height:0!important;background:transparent!important;border-left-style:solid;border-right-style:solid;border-bottom-style:solid;border-left-color:transparent!important;border-right-color:transparent!important;filter:drop-shadow(0 4px 1px rgba(33,70,90,.15))}

/* Mini-game */

.catch-shape{position:absolute;cursor:pointer;animation:fall linear forwards;filter:drop-shadow(0 5px 2px rgba(30,75,95,.18));z-index:2;touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform,opacity;contain:layout style}

/* End */

.end-icon{font-size:76px;animation:bob 2s ease-in-out infinite}.end-card h2{font-size:clamp(34px,5vw,50px);margin:6px 0;color:#7c54da;font-weight:900}.end-card p{font-size:18px;font-weight:700;color:#5e788b}.score-boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}.score-box{background:#f7fbff;border:3px solid #dcecf5;border-radius:22px;padding:15px}.score-box b{display:block;font-size:31px;color:#238ecb}.score-box span{font-size:12px;font-weight:900;color:#8295a4;text-transform:uppercase}.end-buttons{display:flex;gap:12px;justify-content:center}.again-btn,.home-btn{border:0;border-radius:18px;padding:13px 24px;font-weight:900;cursor:pointer;color:white}.again-btn{background:#58c94f;box-shadow:0 6px 0 #359d31}.home-btn{background:#48b5ec;box-shadow:0 6px 0 #1685cf}

}

}

<body>
    <img src="../assets/logo-oodles-math.png" class="oodles-logo">
<canvas id="confetti"></canvas>

<section id="startScreen" class="screen">
  <div class="start-card">

      <button class="mode-btn" data-mode="detective"><span class="ico">🔎</span><span>Shape Detective</span><small>Sort by shape, size, or colour.</small></button>
      <button class="mode-btn" data-mode="mix"><span class="ico">✨</span><span>Mix It Up!</span><small>Patterns, shapes, colours, and sorting.</small></button>
    </div>
    <button id="playBtn" class="play-btn">PLAY ▶</button>
  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <div class="logo-safe" aria-hidden="true"></div>
  <div class="hud">
    <div id="questionCount" class="counter-pill">Question 1 of 10</div>

      <div id="feedback" class="feedback"></div>
      <div id="visualArea" class="visual-area"></div>
      <div id="answers" class="answers"></div>
      <div class="next-row"><button id="nextBtn" class="next-btn hidden">NEXT →</button></div>
    </div>
  </div>
</section>

<section id="miniGame" class="hidden">
  <div id="miniPanel" class="mini-panel">
    <div class="mini-head"><div id="miniTitle" class="mini-title">Tap the circles!</div><div id="timer" class="timer">8</div></div>
    <div id="miniScore" class="mini-score">Mini stars: 0</div>
  </div>
</section>

<section id="endScreen" class="screen hidden">
  <div class="end-card">
    <div class="end-icon">🎉</div>
    <h2>AMAZING JOB!</h2>
    <p>You finished Shape Pattern Adventure!</p>
    <div class="score-boxes">
      <div class="score-box"><span>Score</span><b id="finalScore">0 / 10</b></div>
      <div class="score-box"><span>Stars</span><b id="finalStars">⭐ 0</b></div>
    </div>
    <div class="end-buttons"><button id="againBtn" class="again-btn">PLAY AGAIN</button><button id="homeBtn" class="home-btn">HOME</button></div>
  </div>
</section>

<script>
(() => {
'use strict';
const COLORS={pink:'#ff4f87',purple:'#b457e8',yellow:'#ffd54a',blue:'#36a7f2',cyan:'#58d7dd',green:'#48c96d','light green':'#b6f45e',orange:'#ffa33f',grey:'#a9adb4'};
const SHAPES=['circle','square','rectangle','triangle','pentagon','arch'];
const FRIENDLY={circle:'circle',square:'square',rectangle:'rectangle',triangle:'triangle',pentagon:'pentagon',arch:'arch'};
const praise=['Great job!','Well done!','You got it!','Awesome!'];
const state={mode:'pattern',questions:[],index:0,score:0,stars:0,locked:false,hadMistake:false,miniDone:new Set(),miniTimer:null,spawnTimer:null};
const $=id=>document.getElementById(id);
const els={start:$('startScreen'),game:$('gameScreen'),end:$('endScreen'),mini:$('miniGame'),play:$('playBtn'),prompt:$('prompt'),visual:$('visualArea'),answers:$('answers'),feedback:$('feedback'),next:$('nextBtn'),speaker:$('speakerBtn'),qCount:$('questionCount'),bar:$('progressBar'),progressLabel:$('progressLabel'),stars:$('starCount'),finalScore:$('finalScore'),finalStars:$('finalStars'),again:$('againBtn'),home:$('homeBtn'),miniPanel:$('miniPanel'),miniTitle:$('miniTitle'),timer:$('timer'),miniScore:$('miniScore')};

const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function token(shape,color,size='medium',outline=false){return {shape,color,size,outline}}
function sigToken(t){return `${t.shape}-${t.color}-${t.size}-${t.outline?1:0}`}
function sameToken(a,b){return a.shape===b.shape&&a.color===b.color&&a.size===b.size&&!!a.outline===!!b.outline}
function randomColor(except=[]){return rnd(Object.keys(COLORS).filter(c=>!except.includes(c)))}
function randomShape(except=[]){return rnd(SHAPES.filter(s=>!except.includes(s)))}
function uniqueTokens(list){const out=[];for(const t of list){if(!out.some(x=>sameToken(x,t)))out.push(t)}return out}

function makeShape(t,base=72){
  const el=document.createElement('span');
  const responsiveScale=window.innerWidth<520?.68:window.innerWidth<760?.84:1;
  base*=responsiveScale;
  const size=t.size==='small'?base*.72:t.size==='large'?base*1.08:base;
  el.className=`shape ${t.shape}${t.outline?' outline':''}`;
  el.setAttribute('aria-label',`${t.color} ${t.shape}`);
  const color=COLORS[t.color]||t.color||'#59c';
  if(t.shape==='triangle'){
    const w=size*.88,h=size*.86; el.style.borderLeftWidth=`${w/2}px`;el.style.borderRightWidth=`${w/2}px`;el.style.borderBottomWidth=`${h}px`;el.style.borderBottomColor=color;el.style.borderLeftColor='transparent';el.style.borderRightColor='transparent';
  }else{
    let w=size,h=size;if(t.shape==='rectangle'){w=size*1.28;h=size*.78} if(t.shape==='arch'){w=size*.92;h=size*1.04}
    el.style.width=`${w}px`;el.style.height=`${h}px`;el.style.background=color;
    if(!t.outline) el.style.border='3px solid rgba(41,72,92,.24)';
  }
  return el;
}

function patternCycle(kind,difficulty){
  const shapes=shuffle(SHAPES).slice(0,4); const colors=shuffle(Object.keys(COLORS)).slice(0,4);
  const style=rnd(difficulty<2?['shape','color','combo']:['shape','color','combo','size']);
  const n=kind==='AB'?2:kind==='ABC'?3:kind==='ABCD'?4:3;
  let base=[];
  if(style==='shape'){
    const c=rnd(colors); for(let i=0;i<n;i++)base.push(token(shapes[i],c,'medium'));
  }else if(style==='color'){
    const s=rnd(shapes); for(let i=0;i<n;i++)base.push(token(s,colors[i],'medium'));
  }else if(style==='size'){
    const s=rnd(shapes),c=rnd(colors); const sizes=['small','large','medium','small']; for(let i=0;i<n;i++)base.push(token(s,c,sizes[i]));
  }else{
    for(let i=0;i<n;i++)base.push(token(shapes[i],colors[i],difficulty>1&&Math.random()>.6?(i%2?'small':'large'):'medium'));
  }
  if(kind==='ABB') base=[base[0],base[1],base[1]];
  if(kind==='AAB') base=[base[0],base[0],base[1]];
  return base;
}
function makePatternQuestion(difficulty=1){
  const kinds=difficulty===1?['AB','ABC']:difficulty===2?['AB','ABC','ABB','AAB']:['ABC','ABB','AAB','ABCD'];
  const kind=rnd(kinds),cycle=patternCycle(kind,difficulty);
  const sequence=[...cycle,...cycle].map(x=>({...x}));
  const answer={...cycle[0]};
  let distract=[];
  distract.push({...cycle[Math.min(1,cycle.length-1)]});
  if(difficulty>1) distract.push(token(answer.shape,randomColor([answer.color]),answer.size));
  else distract.push(token(randomShape([answer.shape]),answer.color,answer.size));
  distract=uniqueTokens(distract).filter(x=>!sameToken(x,answer));
  while(distract.length<2){distract.push(token(randomShape([answer.shape]),randomColor([answer.color]),rnd(['small','medium','large'])));distract=uniqueTokens(distract).filter(x=>!sameToken(x,answer));}
  return {type:'pattern',prompt:'What comes next?',sequence,answer,choices:shuffle([answer,...distract.slice(0,2)]),signature:`p:${kind}:${sequence.map(sigToken).join('|')}`};
}

function makeClassificationQuestion(){
  const attribute=rnd(['shape','size','colour']);
  let left=[],right=[];
  if(attribute==='colour'){
    const c1=randomColor(),c2=randomColor([c1]);
    for(let i=0;i<4;i++){left.push(token(randomShape(),c1,rnd(['small','medium','large'])));right.push(token(randomShape(),c2,rnd(['small','medium','large'])))}
  }else if(attribute==='shape'){
    const s1=randomShape(),s2=randomShape([s1]);
    for(let i=0;i<4;i++){left.push(token(s1,randomColor(),rnd(['small','medium','large'])));right.push(token(s2,randomColor(),rnd(['small','medium','large'])))}
  }else{
    for(let i=0;i<4;i++){left.push(token(randomShape(),randomColor(),'small'));right.push(token(randomShape(),randomColor(),'large'))}
  }
  return {type:'classification',prompt:'How are the shapes grouped?',groups:[left,right],answer:attribute,choices:shuffle(['shape','size','colour']),signature:`c:${attribute}:${left.map(sigToken).join('|')}:${right.map(sigToken).join('|')}`};
}
function makeIdentifyShape(){
  const target=randomShape();const choices=shuffle([target,...shuffle(SHAPES.filter(s=>s!==target)).slice(0,3)]).map(s=>token(s,randomColor(),'medium'));
  return {type:'identify-shape',prompt:`Find the ${FRIENDLY[target]}.`,answer:target,choices,signature:`is:${target}:${choices.map(sigToken).join('|')}`};
}
function makeIdentifyColor(){
  const target=randomColor();const s=randomShape();const colors=shuffle([target,...shuffle(Object.keys(COLORS).filter(c=>c!==target)).slice(0,3)]);const choices=colors.map(c=>token(s,c,'medium'));
  return {type:'identify-color',prompt:`Find the ${target} shape.`,answer:target,choices,signature:`ic:${target}:${s}:${colors.join('|')}`};
}
function buildQuestions(mode){
  const out=[],seen=new Set(); let guard=0;
  while(out.length<10&&guard++<300){
    const d=out.length<3?1:out.length<7?2:3; let q;
    if(mode==='pattern')q=makePatternQuestion(d);
    else if(mode==='detective')q=makeClassificationQuestion();
    else{
      const i=out.length; const type=i<6?'pattern':rnd(['classification','identify-shape','identify-color']);
      q=type==='pattern'?makePatternQuestion(d):type==='classification'?makeClassificationQuestion():type==='identify-shape'?makeIdentifyShape():makeIdentifyColor();
    }
    if(!seen.has(q.signature)){seen.add(q.signature);out.push(q)}
  }
  return shuffleWithinBands(out);
}
function shuffleWithinBands(q){
  if(state.mode!=='mix') return q;
  const first=q.slice(0,3),mid=q.slice(3,7),last=q.slice(7);return [...shuffle(first),...shuffle(mid),...shuffle(last)];
}

function speak(text){
  if(!('speechSynthesis' in window))return; window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;u.pitch=1.08;u.volume=1;
  const voices=speechSynthesis.getVoices(); const v=voices.find(v=>/^en(-|_)/i.test(v.lang)&&/female|samantha|zira|ava|google us english/i.test(v.name))||voices.find(v=>/^en(-|_)/i.test(v.lang)); if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function sound(kind){
  try{const A=window.AudioContext||window.webkitAudioContext;const ac=sound.ac||(sound.ac=new A());if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);const t=ac.currentTime;o.type='sine';o.frequency.setValueAtTime(kind==='good'?660:220,t);if(kind==='good')o.frequency.exponentialRampToValueAtTime(980,t+.18);else o.frequency.exponentialRampToValueAtTime(175,t+.18);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.start(t);o.stop(t+.3)}catch(e){}
}
function updateHud(){const n=state.index+1;els.qCount.textContent=`Question ${clamp(n,1,10)} of 10`;els.bar.style.width=`${state.index*10}%`;els.progressLabel.textContent=state.index===0?'Let’s go!':`${state.index} completed`;els.stars.textContent=`⭐ ${state.stars}`}

function renderQuestion(){
  state.locked=false;state.hadMistake=false;els.next.classList.add('hidden');els.feedback.textContent='';els.feedback.className='feedback';els.visual.innerHTML='';els.answers.innerHTML='';els.answers.className='answers';updateHud();
  const q=state.questions[state.index];els.prompt.textContent=q.prompt;
  els.visual.style.minHeight=q.type==='identify-shape'||q.type==='identify-color'?'92px':'195px';
  if(q.type==='pattern')renderPattern(q);else if(q.type==='classification')renderClassification(q);else renderIdentify(q);
  setTimeout(()=>speak(q.prompt),320);
}
function renderPattern(q){
  const row=document.createElement('div');row.className='pattern-row';q.sequence.forEach((t,i)=>{const cell=document.createElement('div');cell.className='pattern-item';cell.style.animationDelay=`${i*70}ms`;cell.appendChild(makeShape(t,66));row.appendChild(cell)});const m=document.createElement('div');m.className='missing-slot';m.id='missingSlot';m.textContent='?';m.style.animationDelay=`${q.sequence.length*70}ms`;row.appendChild(m);els.visual.appendChild(row);
  q.choices.forEach((t,i)=>{const b=answerButton();b.dataset.index=i;b.appendChild(makeShape(t,82));b.addEventListener('click',()=>choosePattern(b,t,q.answer));els.answers.appendChild(b)});
}
function renderClassification(q){
  const wrap=document.createElement('div');wrap.className='group-wrap';q.groups.forEach((g,gi)=>{const box=document.createElement('div');box.className='group-box';const label=document.createElement('div');label.className='group-label';label.textContent=`Group ${gi+1}`;box.appendChild(label);g.forEach(t=>box.appendChild(makeShape(t,48)));wrap.appendChild(box)});els.visual.appendChild(wrap);
  q.choices.forEach(v=>{const b=answerButton();const s=document.createElement('span');s.className='answer-text';s.textContent=v;b.appendChild(s);b.addEventListener('click',()=>chooseText(b,v,q.answer));els.answers.appendChild(b)});
}
function renderIdentify(q){
  els.visual.style.minHeight='92px';els.answers.classList.add('four');q.choices.forEach(t=>{const b=answerButton();b.appendChild(makeShape(t,76));b.addEventListener('click',()=>{const value=q.type==='identify-shape'?t.shape:t.color;chooseText(b,value,q.answer)});els.answers.appendChild(b)});
}
function answerButton(){const b=document.createElement('button');b.className='answer';return b}
function markWrong(btn){state.hadMistake=true;btn.classList.remove('wrong');void btn.offsetWidth;btn.classList.add('wrong');els.feedback.textContent='Try again!';els.feedback.className='feedback wrong';sound('bad');setTimeout(()=>btn.classList.remove('wrong'),430)}
function lockCorrect(btn){state.locked=true;btn.classList.add('correct');[...els.answers.children].forEach(x=>x.classList.add('disabled'));if(!state.hadMistake)state.score++;state.stars++;els.stars.textContent=`⭐ ${state.stars}`;els.feedback.textContent=rnd(praise);els.feedback.className='feedback';els.next.classList.remove('hidden');sound('good');sparkleAt(btn);}
function choosePattern(btn,choice,answer){if(state.locked)return;if(!sameToken(choice,answer))return markWrong(btn);lockCorrect(btn);const slot=$('missingSlot');if(slot){slot.textContent='';slot.style.animation='none';slot.style.borderStyle='solid';slot.style.borderColor='#61c963';slot.style.background='#efffed';slot.appendChild(makeShape(answer,64));}}
function chooseText(btn,value,answer){if(state.locked)return;if(value!==answer)return markWrong(btn);lockCorrect(btn)}
function sparkleAt(el){const r=el.getBoundingClientRect();for(let i=0;i<9;i++){const s=document.createElement('div');s.className='spark';s.textContent=rnd(['✦','★','✧']);s.style.left=`${r.left+r.width/2}px`;s.style.top=`${r.top+r.height/2}px`;s.style.color=rnd(['#ffd84d','#ff6f91','#44bdf4','#7acb54','#a96bea']);s.style.setProperty('--dx',`${Math.random()*120-60}px`);s.style.setProperty('--dy',`${Math.random()*-100+25}px`);document.body.appendChild(s);setTimeout(()=>s.remove(),700)}}

function nextQuestion(){if(!state.locked)return;const completed=state.index+1;if(completed<10 && completed%3===0 && !state.miniDone.has(completed)){state.miniDone.add(completed);return startMiniGame()}state.index++;if(state.index>=10)return finish();renderQuestion()}

function startMiniGame(){
  window.speechSynthesis?.cancel();els.mini.classList.remove('hidden');
  const target=rnd(['circle','triangle','square','rectangle']);els.miniTitle.textContent=`Tap the ${target}s!`;speak(`Tap the ${target}s!`);
  let time=8,miniStars=0;els.timer.textContent=time;els.miniScore.textContent='Mini stars: 0';
  [...els.miniPanel.querySelectorAll('.catch-shape')].forEach(x=>x.remove());
  function tapShape(holder,e){
    if(e){e.preventDefault();e.stopPropagation()}
    if(!holder||holder.dataset.hit==='1'||holder.classList.contains('pop'))return;
    holder.dataset.hit='1';
    if(holder.dataset.target==='1'){
      miniStars++;state.stars++;els.stars.textContent=`⭐ ${state.stars}`;els.miniScore.textContent=`Mini stars: ${miniStars}`;sound('good');sparkleAt(holder);holder.classList.add('pop');setTimeout(()=>holder.remove(),210)
    }else{
      holder.classList.remove('wiggle');void holder.offsetWidth;holder.classList.add('wiggle');sound('bad');setTimeout(()=>{holder.classList.remove('wiggle');holder.dataset.hit='0'},190)
    }
  }
  function spawn(){
    const isTarget=Math.random()<.45;const shape=isTarget?target:rnd(SHAPES.filter(s=>s!==target));const t=token(shape,randomColor(),rnd(['small','medium','large']));const holder=document.createElement('div');holder.className='catch-shape';holder.style.left=`${5+Math.random()*86}%`;holder.style.top='-85px';holder.style.animationDuration=`${4.2+Math.random()*2.1}s`;holder.dataset.target=isTarget?'1':'0';holder.dataset.hit='0';holder.appendChild(makeShape(t,54));holder.addEventListener('pointerdown',e=>tapShape(holder,e),{passive:false});els.miniPanel.appendChild(holder);setTimeout(()=>holder.remove(),7000)
  }
  for(let i=0;i<7;i++)setTimeout(spawn,i*230);state.spawnTimer=setInterval(spawn,420);
  state.miniTimer=setInterval(()=>{time--;els.timer.textContent=time;if(time<=0){clearInterval(state.miniTimer);clearInterval(state.spawnTimer);setTimeout(endMiniGame,350)}},1000);
}
function endMiniGame(){[...els.miniPanel.querySelectorAll('.catch-shape')].forEach(x=>x.remove());els.mini.classList.add('hidden');state.index++;if(state.index>=10)finish();else renderQuestion()}

function confettiBurst(){
  const canvas=$('confetti'),ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;const pieces=Array.from({length:150},()=>({x:Math.random()*canvas.width,y:-20-Math.random()*canvas.height*.25,vx:Math.random()*4-2,vy:2+Math.random()*4,r:3+Math.random()*5,a:Math.random()*Math.PI,c:rnd(['#ff5d88','#ffd84d','#39b8f5','#66ce56','#a85be8','#ff9d42'])}));let frames=0;(function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const p of pieces){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.a+=.12;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()}if(frames++<260)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height)})()
}
function finish(){window.speechSynthesis?.cancel();els.bar.style.width='100%';els.game.classList.add('hidden');els.end.classList.remove('hidden');els.finalScore.textContent=`${state.score} / 10`;els.finalStars.textContent=`⭐ ${state.stars}`;confettiBurst();sound('good');setTimeout(()=>speak('Amazing job! You finished Shape Pattern Adventure!'),350)}
function startGame(){state.questions=buildQuestions(state.mode);state.index=0;state.score=0;state.stars=0;state.locked=false;state.miniDone.clear();els.visual.style.minHeight='195px';els.start.classList.add('hidden');els.end.classList.add('hidden');els.game.classList.remove('hidden');renderQuestion()}
function goHome(){window.speechSynthesis?.cancel();clearInterval(state.miniTimer);clearInterval(state.spawnTimer);els.end.classList.add('hidden');els.game.classList.add('hidden');els.mini.classList.add('hidden');els.start.classList.remove('hidden')}

document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');state.mode=b.dataset.mode}));
els.play.addEventListener('click',startGame);els.speaker.addEventListener('click',()=>speak(state.questions[state.index]?.prompt||''));els.next.addEventListener('click',nextQuestion);els.again.addEventListener('click',startGame);els.home.addEventListener('click',goHome);
window.addEventListener('resize',()=>{const c=$('confetti');c.width=innerWidth;c.height=innerHeight});
})();
</script>
</body>
</html>

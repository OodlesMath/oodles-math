button{font-family:inherit}
.font-game{font-weight:900}
#main-container{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:space-between; padding:86px 20px 16px; gap:24px;}
.oodles-logo{position:fixed; top:20px; right:22px; width:110px; z-index:101; opacity:.96}
.player-area{position:relative; flex:1; display:flex; justify-content:center; align-items:center;}
.score-pill{position:absolute; top:0; background:rgba(255,255,255,.95); border-radius:999px; padding:12px 26px; display:flex; gap:10px; align-items:center; z-index:35; box-shadow:0 10px 20px rgba(0,0,0,.08); border:4px solid #fff;}
.player-area.left .score-pill{left:18px}
.player-area.right .score-pill{right:18px}
.score-pill .label{font-size:15px; font-weight:900; letter-spacing:.08em; text-transform:uppercase}
.score-pill .score{font-size:38px; line-height:1; font-weight:900}
.score-pill.blue{border-color:#bfdbfe} .score-pill.blue .label,.score-pill.blue .score{color:var(--p1-dark)}
.score-pill.red{border-color:#fecaca} .score-pill.red .label,.score-pill.red .score{color:var(--p2-dark)}
.candy-box{position:relative; width:min(100%, 720px); background:rgba(255,255,255,.86); border-radius:42px; border:8px solid rgba(255,255,255,.95); box-shadow:0 22px 40px rgba(0,0,0,.14); padding:26px 24px 22px; backdrop-filter:blur(2px);}
.candy-box::before{content:''; position:absolute; left:20px; right:20px; top:14px; height:24%; border-radius:24px; background:linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0)); pointer-events:none;}
.formula-row{display:flex; align-items:flex-start; justify-content:center; gap:14px; margin-bottom:18px; position:relative; z-index:2;}
.big-num{font-size:90px; line-height:1; font-weight:900; text-shadow:0 3px 0 rgba(255,255,255,.65)}
.operator{font-size:66px; line-height:1; font-weight:900; opacity:.45; margin-top:18px}
.token{border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; position:relative; transition:all .28s cubic-bezier(.34,1.56,.64,1); text-shadow:2px 2px 0 rgba(255,255,255,.7)}
.token::after{content:''; position:absolute; top:5%; left:16%; right:16%; height:35%; border-radius:50%; background:linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)); pointer-events:none}
.token-main{width:112px;height:112px;font-size:56px; background:radial-gradient(circle at 30% 30%, #dcfce7 0%, #4ade80 100%); border:6px solid #fff; box-shadow:0 14px 0 #16a34a, 0 18px 18px rgba(0,0,0,.14), inset 0 -8px 15px rgba(0,0,0,.1); color:#14532d}
.token-p1{width:82px;height:82px;font-size:40px; background:radial-gradient(circle at 30% 30%, #dbeafe 0%, #60a5fa 100%); border:5px solid #fff; box-shadow:0 12px 0 var(--p1-dark), 0 14px 14px rgba(0,0,0,.12), inset 0 -6px 10px rgba(0,0,0,.08); color:#1e3a8a}
.token-p2{width:82px;height:82px;font-size:40px; background:radial-gradient(circle at 30% 30%, #fee2e2 0%, #f87171 100%); border:5px solid #fff; box-shadow:0 12px 0 var(--p2-dark), 0 14px 14px rgba(0,0,0,.12), inset 0 -6px 10px rgba(0,0,0,.08); color:#7f1d1d}
.total-box{border-radius:24px !important; margin-top:8px}
.bond-wrap{position:relative; width:144px; min-width:144px; height:184px; display:flex; flex-direction:column; align-items:center}
.bond-lines{position:absolute; top:44px; width:144px; height:100px; z-index:1}
.bond-line{stroke:#cbd5e1; stroke-width:14; stroke-linecap:round; fill:none; transition:.35s}
.bond-line-active{stroke:#f59e0b; stroke-dasharray:15 15; animation:dashmove 1s linear infinite; stroke-width:18; filter:drop-shadow(0 0 10px #fcd34d)}
@keyframes dashmove{to{stroke-dashoffset:-30}}
.bond-parts{position:absolute; top:94px; width:100%; display:flex; justify-content:center; gap:14px; z-index:2}
.pulse-target{animation:pulse-glow 1.5s infinite}
@keyframes pulse-glow{0%{box-shadow:0 0 0 0 rgba(251,191,36,.55), 0 12px 0 var(--shadow-col, #cbd5e1)}50%{box-shadow:0 0 0 18px rgba(251,191,36,0), 0 12px 0 var(--shadow-col, #cbd5e1); transform:scale(1.05)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0), 0 12px 0 var(--shadow-col, #cbd5e1)}}
.completed-part{background:radial-gradient(circle at 30% 30%, #f0fdf4 0%, #bbf7d0 100%) !important; color:#14532d !important; border-color:#4ade80 !important; --shadow-col:#22c55e; box-shadow:0 12px 0 var(--shadow-col), inset 0 -4px 10px rgba(0,0,0,.08)!important; text-shadow:none !important}
.pop-in{animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{0%{transform:scale(.3);opacity:0}80%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.tenframe-panel{position:relative; z-index:2; display:flex; gap:14px; justify-content:center; align-items:center; margin:4px 0 18px; flex-wrap:wrap}
.tf-card{background:rgba(255,255,255,.9); border:3px solid #dbeafe; border-radius:20px; padding:10px 10px 8px; box-shadow: inset 0 -4px 8px rgba(0,0,0,.04)}
.tf-label{text-align:center; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; color:#64748b}
.tenframe{display:grid; grid-template-columns:repeat(5,34px); grid-template-rows:repeat(2,34px); gap:3px; border:4px solid #60a5fa; background:#eff6ff; border-radius:10px; padding:3px; box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.tenframe.red{border-color:#f87171; background:#fff1f2}
.tf-cell{width:34px; height:34px; border:2px dashed rgba(148,163,184,.35); border-radius:6px; display:flex; align-items:center; justify-content:center}
.dot{width:20px;height:20px;border-radius:50%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.14), 0 1px 2px rgba(0,0,0,.1)}
.dot.primary.blue{background:#3b82f6} .dot.primary.red{background:#ef4444} .dot.secondary{background:#22c55e}
.choices{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; position:relative; z-index:2}
.toy-button{position:relative; min-height:82px; border-radius:28px; font-weight:900; font-size:44px; cursor:pointer; overflow:hidden; color:white; text-shadow:2px 2px 0 rgba(0,0,0,.2); border:4px solid rgba(255,255,255,.6); transition:.15s}
.toy-button::after{content:''; position:absolute; top:2px; left:5%; right:5%; height:35%; border-radius:20px; background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); pointer-events:none}
.btn-blue{background:linear-gradient(180deg,#60a5fa 0%,#3b82f6 100%); box-shadow:0 12px 0 var(--p1-dark), 0 15px 18px rgba(0,0,0,.18)}
.btn-red{background:linear-gradient(180deg,#f87171 0%,#ef4444 100%); box-shadow:0 12px 0 var(--p2-dark), 0 15px 18px rgba(0,0,0,.18)}
.toy-button:active{transform:translateY(7px)}
.correct-flash{background:linear-gradient(180deg,#4ade80 0%,#22c55e 100%)!important; box-shadow:0 12px 0 #14532d, 0 15px 20px rgba(0,0,0,.2)!important}
.wrong-shake{animation:shake .35s linear}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.frozen-area{filter:sepia(.5) hue-rotate(-30deg) saturate(1.8) brightness(.94); pointer-events:none}
.race-track{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:300px; height:72%; z-index:18; display:flex; justify-content:space-between; padding:0 28px; background:transparent;}
.tree-trunk{position:relative; width:72px; height:100%; background:transparent; border:none}
.goal-item{position:absolute; top:-84px; left:50%; transform:translateX(-50%); width:92px; height:92px; display:flex; justify-content:center; animation:bounce-hive 3s infinite ease-in-out; filter:drop-shadow(0 8px 7px rgba(0,0,0,.25))}
@keyframes bounce-hive{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}}
.bear{position:absolute; left:50%; transform:translateX(-58%); bottom:0; width:104px; height:104px; display:flex; align-items:center; justify-content:center; transition:bottom .6s cubic-bezier(.34,1.56,.64,1); filter:drop-shadow(0 8px 8px rgba(0,0,0,.35)); z-index:30}
.mobile-track{display:none}
.bee-swarm{position:absolute; font-size:35px; z-index:50; text-shadow:0 4px 6px rgba(0,0,0,.4); pointer-events:none}
.bee-0{animation:swarm1 .3s infinite alternate; top:-15px; left:-15px}
.bee-1{animation:swarm2 .4s infinite alternate; top:-25px; right:-15px}
.bee-2{animation:swarm3 .35s infinite alternate; top:15px; right:-25px}
@keyframes swarm1{0%{transform:translate(0,0) rotate(-15deg)}100%{transform:translate(20px,-20px) rotate(15deg)}}
@keyframes swarm2{0%{transform:translate(0,0) rotate(20deg)}100%{transform:translate(-25px,-15px) rotate(-20deg)}}
@keyframes swarm3{0%{transform:translate(0,0) rotate(-25deg)}100%{transform:translate(-20px,20px) rotate(25deg)}}
.global-timer{position:fixed; top:18px; left:50%; transform:translateX(-50%); background:rgba(255,255,255,.96); padding:8px 26px; border-radius:999px; border:6px solid #facc15; box-shadow:0 10px 24px rgba(0,0,0,.14); font-size:30px; font-weight:900; display:flex; align-items:center; gap:10px; z-index:100}
.hidden{display:none !important}
#start-screen,#game-over{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(14,165,233,.78); backdrop-filter:blur(6px); z-index:200; padding:16px; overflow:auto}
.modal-card{background:#fff; width:min(980px,100%); border-radius:44px; border:12px solid #facc15; box-shadow:0 20px 60px rgba(0,0,0,.35); padding:28px 24px; text-align:center; position:relative}
.start-title{font-size:64px; color:#0ea5e9; font-weight:900; margin:0 0 20px; text-shadow:3px 3px 0 rgba(0,0,0,.1)}
.control-grid{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-bottom:24px}
.control-card{background:#f8fafc; border:4px solid #e2e8f0; border-radius:26px; padding:14px}
.control-card p{margin:0 0 10px; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#64748b}
.pill-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.setting-btn{border:4px solid #e2e8f0; background:#fff; color:#64748b; box-shadow:0 6px 0 #cbd5e1; border-radius:14px; font-weight:800; padding:10px 14px; cursor:pointer}
.setting-btn.active{background:#10b981; color:#fff; border-color:#047857; box-shadow:0 6px 0 #064e3b; transform:scale(1.05) translateY(-2px)}
.play-btn,.again-btn{display:inline-block; background:linear-gradient(180deg,#fde047,#facc15); color:#78350f; border:4px solid #fff; border-radius:999px; font-weight:900; font-size:42px; padding:18px 42px; box-shadow:0 12px 0 #b45309, 0 18px 18px rgba(0,0,0,.28); cursor:pointer}
.play-btn:active,.again-btn:active{transform:translateY(8px); box-shadow:0 4px 0 #b45309}
.sub-pill{display:inline-block; padding:10px 18px; background:#dcfce7; border:2px solid #86efac; border-radius:999px; color:#047857; font-weight:800; margin:8px 0 22px}
.victory-glow{position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%); width:150vw; height:150vw; background:radial-gradient(circle, rgba(253,224,71,.45) 0%, rgba(0,0,0,0) 50%); animation:spinGlow 15s linear infinite; z-index:-1}
@keyframes spinGlow{100%{transform:translate(-50%,-50%) rotate(360deg)}}
.final-scores{display:flex; gap:16px; justify-content:center; margin:24px 0 28px}
.final-card{flex:1; min-width:180px; border-radius:26px; padding:18px; border:8px solid; font-weight:900}
.final-card.blue{background:#eff6ff; border-color:#bfdbfe; color:var(--p1-dark)} .final-card.red{background:#fff1f2; border-color:#fecaca; color:var(--p2-dark)}
.final-card .num{font-size:72px; line-height:1}

/* ================= VER 2 POLISH ================= */
/* Keep the two question cards at a stable desktop size instead of stretching
   when the viewport changes. */
#main-container{
  padding: 86px 28px 18px;
  gap: 0;
}
.player-area{
  flex: 0 0 auto;
  width: 500px;
  min-width: 500px;
  max-width: 500px;
  height: 100%;
  z-index: 24;
}
.player-area.left{margin-right:auto;}
.player-area.right{margin-left:auto;}
.candy-box{
  width: 500px;
  min-width: 500px;
  max-width: 500px;
  height: 446px;
  min-height: 446px;
  max-height: 446px;
  padding: 30px 24px 24px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  flex-shrink:0;
}
.formula-row{
  min-height: 104px;
  height: 104px;
  margin: 2px 0 14px;
  align-items:center;
  gap: 18px;
}
.big-num{font-size:76px; line-height:1;}
.operator{font-size:54px; line-height:1; margin-top:0;}
.question-mark{
  width:82px; height:82px; flex:0 0 82px;
  border-radius:24px !important;
  margin:0;
}
.tenframe-panel{
  min-height:118px;
  height:118px;
  margin:0 0 18px;
  flex-wrap:nowrap;
}
.tf-card{padding:8px 9px 7px; border-radius:17px;}
.tf-label{font-size:10px; margin-bottom:5px;}
.tenframe{grid-template-columns:repeat(5,28px); grid-template-rows:repeat(2,28px); gap:2px; padding:3px;}
.tf-cell{width:28px;height:28px;border-radius:5px;}
.dot{width:17px;height:17px;}
.choices{
  grid-template-columns:repeat(2, minmax(0,1fr));
  grid-template-rows:repeat(2, 1fr);
  gap:12px 14px;
  height:164px;
  margin-top:auto;
}
.toy-button{min-height:0;height:auto;font-size:38px;border-radius:23px;}

/* Overlay climbers on the two tree trunks already painted into the background. */
.race-track{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  transform:none;
  left:0;
  bottom:auto;
  padding:0;
  z-index:60;
  display:block;
  pointer-events:none;
}
.race-track .tree-trunk{
  position:absolute;
  bottom:7.5%;
  width:74px;
  height:77%;
  background:transparent;
}
#tree-1{left:41.55%; transform:translateX(-50%);}
#tree-2{left:59.15%; transform:translateX(-50%);}
.race-track .bear{
  left:50%;
  width:92px;
  height:92px;
  transform:translateX(-50%);
  margin:0;
  z-index:64;
}
.race-track .goal-item{
  top:-12px;
  width:82px;
  height:82px;
  z-index:63;
}
.gap-pill{
  position:fixed;
  top:27.5%;
  left:50%;
  transform:translateX(-50%);
  z-index:65;
}

/* Prettier setup screen, still preserving the same controls and game options. */
#start-screen{
  background:linear-gradient(180deg, rgba(14,165,233,.46), rgba(2,132,199,.60));
  backdrop-filter:blur(8px) saturate(1.08);
}
#start-screen .modal-card{
  width:min(960px, 92vw);
  padding:38px 42px 42px;
  border:8px solid rgba(255,255,255,.92);
  border-radius:42px;
  background:linear-gradient(180deg, rgba(255,255,255,.97), rgba(248,250,252,.96));
  box-shadow:0 26px 70px rgba(15,23,42,.30), 0 0 0 8px rgba(250,204,21,.88);
  overflow:hidden;
}
#start-screen .modal-card::before,
#start-screen .modal-card::after{
  content:'';
  position:absolute;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, rgba(253,224,71,.30), rgba(253,224,71,0) 68%);
  pointer-events:none;
}
#start-screen .modal-card::before{left:-60px;top:-70px;}
#start-screen .modal-card::after{right:-70px;bottom:-80px;}
.start-title{
  font-size:62px;
  margin:0 0 4px;
  letter-spacing:-.045em;
  color:#0ea5e9;
}
.setup-subtitle{
  margin:0 auto 26px;
  color:#64748b;
  font-size:16px;
  font-weight:800;
}
.setup-mascots{font-size:34px; vertical-align:middle; filter:drop-shadow(0 4px 4px rgba(0,0,0,.10));}
.control-grid{
  display:grid;
  grid-template-columns:1.2fr .9fr 1.45fr;
  align-items:stretch;
  gap:16px;
  margin-bottom:24px;
}
.control-card{
  padding:18px 14px 20px;
  border:3px solid #e2e8f0;
  border-radius:25px;
  background:linear-gradient(180deg,#ffffff,#f8fafc);
  box-shadow:0 8px 0 #e2e8f0, 0 14px 24px rgba(15,23,42,.06);
}
.control-card p{font-size:13px;margin-bottom:12px;color:#475569;}
.setting-btn{padding:10px 13px;border-width:3px;box-shadow:0 5px 0 #cbd5e1;transition:.14s ease;}
.setting-btn:hover{transform:translateY(-2px);}
.setting-btn.active{box-shadow:0 5px 0 #047857;transform:translateY(-2px);}
.sub-pill{margin:10px 0 24px;padding:9px 18px;background:#ecfdf5;border:2px solid #86efac;}
.play-btn{font-size:38px;padding:16px 52px;box-shadow:0 10px 0 #b45309,0 17px 24px rgba(0,0,0,.20);}

/* Desktop cards remain fixed. Only genuinely narrow screens switch to the
   compact stacked layout. */
@media (max-width: 1320px) and (min-width: 1001px){
  #main-container{flex-direction:row;justify-content:space-between;gap:0;padding:86px 18px 18px;}
  .player-area{width:450px;min-width:450px;max-width:450px;padding:0;}
  .candy-box{width:450px;min-width:450px;max-width:450px;}
  .race-track{display:block;}
  .mobile-track{display:none;}
}
@media (max-width:1000px){
  #main-container{flex-direction:column;justify-content:center;gap:18px;padding:76px 8px 10px;overflow:auto;}
  .player-area{width:100%;min-width:0;max-width:none;height:auto;}
  .candy-box{width:min(620px,calc(100vw - 120px));min-width:0;max-width:620px;height:390px;min-height:390px;max-height:390px;padding:18px 16px;}
  .formula-row{height:78px;min-height:78px;margin-bottom:8px;}
  .big-num{font-size:54px}.operator{font-size:40px}.question-mark{width:64px;height:64px;flex-basis:64px;font-size:30px;}
  .tenframe-panel{height:102px;min-height:102px;margin-bottom:10px;}
  .choices{height:126px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr;gap:8px;}
  .toy-button{font-size:28px;border-radius:18px;}
  .race-track{display:none;}
  .mobile-track{display:flex;}
  .control-grid{grid-template-columns:1fr;}
  #start-screen .modal-card{padding:28px 24px 34px;}
}

<div class="global-timer hidden" id="global-timer-box">⏱️ <span id="global-timer-text">2:00</span></div>

<div id="main-container">
  <div class="mobile-track mobile-track-left"><div class="goal-item hive-icon-container" id="hive-m1"></div><div class="tree-trunk" id="tree-m1"></div><div id="bear-m1" class="bear bear-icon-container"></div></div>

  <div class="player-area left">
    <div class="score-pill blue"><span class="label">Team 1</span><span class="score" id="score-1">0</span></div>
    <div class="candy-box" id="p1-area">
      <div class="formula-row">
        <span class="big-num" id="p1-num1">?</span>
        <span class="operator">+</span>
        <span class="big-num" id="p1-num2">?</span>
        <span class="operator">=</span>
        <div class="token token-p1 question-mark" id="p1-total-box"><span id="p1-total">?</span></div>
      </div>
      <div class="tenframe-panel" id="p1-tenframes"></div>
      <div class="choices" id="p1-choices"></div>
    </div>
  </div>

  <div class="race-track">
    <div class="gap-pill" id="gap-info">Race to Honey!</div>
    <div class="tree-trunk" id="tree-1"><div class="goal-item hive-icon-container" id="hive-1"></div><div id="bear-1" class="bear bear-icon-container"></div></div>
    <div class="tree-trunk" id="tree-2"><div class="goal-item hive-icon-container" id="hive-2"></div><div id="bear-2" class="bear bear-icon-container"></div></div>
  </div>

  <div class="player-area right">
    <div class="score-pill red"><span class="label" id="p2-label">Team 2</span><span class="score" id="score-2">0</span></div>
    <div class="candy-box" id="p2-area">
      <div class="formula-row">
        <span class="big-num" id="p2-num1">?</span>
        <span class="operator">+</span>
        <span class="big-num" id="p2-num2">?</span>
        <span class="operator">=</span>
        <div class="token token-p2 question-mark" id="p2-total-box"><span id="p2-total">?</span></div>
      </div>
      <div class="tenframe-panel" id="p2-tenframes"></div>
      <div class="choices" id="p2-choices"></div>
    </div>
  </div>

  <div class="mobile-track mobile-track-right"><div class="goal-item hive-icon-container" id="hive-m2"></div><div class="tree-trunk" id="tree-m2"></div><div id="bear-m2" class="bear bear-icon-container"></div></div>
</div>

<script>
let gameMode='pvp', totalTime=120, mathRange=20, gameActive=false, timerInterval=null, botInterval=null;
const GOAL_SCORE=9;
let gameEnded=false, raceFinishPending=false;
let timeLeft=120, p1Score=0, p2Score=0, p1State='total', p2State='total', p1Prob=null, p2Prob=null, p1Frozen=false, p2Frozen=false;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
  tone(freq=600, dur=.1, type='sine', gainVol=.08){if(audioCtx.state==='suspended') audioCtx.resume(); const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain(); osc.type=type; osc.frequency.setValueAtTime(freq,audioCtx.currentTime); gain.gain.setValueAtTime(gainVol,audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+dur);},
  click(){this.tone(620,.08,'triangle',.05)},
  pop(){this.tone(780,.08,'sine',.06)},
  correct(){this.tone(720,.08,'triangle',.05); setTimeout(()=>this.tone(960,.14,'triangle',.05),70)},
  wrong(){this.tone(220,.15,'sawtooth',.06)},
  buzz(){this.tone(180,.25,'square',.05)},
  win(){this.tone(740,.12,'triangle',.05); setTimeout(()=>this.tone(880,.12,'triangle',.05),100); setTimeout(()=>this.tone(1100,.2,'triangle',.05),220);}
};

function coloredBear(main, dark, light){
  return svgIcons.bear
    .replaceAll('#BCAAA4', main)
    .replaceAll('#A1887F', light)
    .replaceAll('#8D6E63', dark)
    .replaceAll('#6D4C41', dark);
}
const bearBlue = coloredBear('#60A5FA','#1D4ED8','#93C5FD');
const bearRed  = coloredBear('#F87171','#B91C1C','#FCA5A5');

function setRaceArt(){
  const trophy=document.getElementById('trophy-container');
  if(trophy) trophy.innerHTML=svgIcons.trophy;
  ['hive-1','hive-2','hive-m1','hive-m2'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=svgIcons.honey; });
  const b1=document.getElementById('bear-1'), bm1=document.getElementById('bear-m1');
  const b2=document.getElementById('bear-2'), bm2=document.getElementById('bear-m2');
  if(b1) b1.innerHTML=bearBlue; if(bm1) bm1.innerHTML=bearBlue;
  if(b2) b2.innerHTML=bearRed;  if(bm2) bm2.innerHTML=bearRed;
}

function fitGameStage(){
  const stage=document.getElementById('game-stage');
  if(!stage) return;
  const scale=Math.min(window.innerWidth/1600, window.innerHeight/800);
  stage.style.transform=`translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', fitGameStage);
window.addEventListener('load',()=>{ setRaceArt(); fitGameStage(); });

function setMode(mode, btn){ gameMode=mode; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); sounds.click(); }
function setTime(v, btn){ totalTime=v; document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); sounds.click(); }
function setRange(v, btn){ mathRange=v; document.querySelectorAll('.range-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); sounds.click(); }
function formatTime(sec){ const m=Math.floor(sec/60); const s=String(sec%60).padStart(2,'0'); return `${m}:${s}`; }
function updateTimerDisplay(){ document.getElementById('global-timer-text').textContent = formatTime(timeLeft); const box=document.getElementById('global-timer-box'); if(timeLeft<=10){ box.style.borderColor='#ef4444'; box.style.color='#ef4444'; } else { box.style.borderColor='#facc15'; box.style.color='#334155'; } }

function generateProblem(){
  let n1,b1,b2,n2,total, valid=false;
  while(!valid){
    if(mathRange<=20){
      n1 = Math.floor(Math.random()*3)+7; // 7..9 for make-10
      b1 = 10 - n1;
      b2 = Math.floor(Math.random()*(9-b1))+1;
      n2 = b1 + b2;
      total = n1 + n2;
      valid = total <= 20;
    } else {
      const tens = Math.max(0, Math.floor(Math.random()*(Math.floor(mathRange/10))));
      const units = Math.floor(Math.random()*3)+7;
      n1 = tens*10 + units;
      if(n1 >= mathRange - 2) continue;
      b1 = 10 - units;
      b2 = Math.floor(Math.random()*6)+1;
      n2 = b1 + b2;
      total = n1 + n2;
      valid = total <= mathRange;
    }
  }
  return {n1,n2,b1,b2,total};
}

function startGame(){
  if(audioCtx.state==='suspended') audioCtx.resume();
  sounds.pop();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('global-timer-box').classList.remove('hidden');
  document.getElementById('p2-label').textContent = gameMode==='pve' ? 'BOT 🤖' : 'Team 2';
  document.getElementById('team2-title-end').textContent = gameMode==='pve' ? 'BOT 🤖' : 'TEAM 2';
  setRaceArt();
  gameEnded=false; raceFinishPending=false;
  gameActive=true; timeLeft=totalTime; p1Score=0; p2Score=0; p1Frozen=false; p2Frozen=false; updateScoreAndCheckWinner(true); updateTimerDisplay();
  nextProblem(1); nextProblem(2);
  timerInterval = setInterval(()=>{ timeLeft--; updateTimerDisplay(); if(timeLeft<=0) endGame(0); },1000);
  if(gameMode==='pve') startBot();
}

function nextProblem(p){
  const prob=generateProblem();
  if(p===1){p1Prob=prob; p1State='total';}
  else {p2Prob=prob; p2State='total';}
  updateUI(p);
}

function updateUI(p){
  const prob = p===1 ? p1Prob : p2Prob;
  const prefix = `p${p}`;
  document.getElementById(`${prefix}-num1`).textContent = prob.n1;
  document.getElementById(`${prefix}-num2`).textContent = prob.n2;
  document.getElementById(`${prefix}-total`).textContent = '?';
  const totalBox=document.getElementById(`${prefix}-total-box`);
  totalBox.classList.remove('completed-part','pop-in');
  totalBox.classList.add('pulse-target');
  renderTenFrames(p, prob);
  renderChoices(p, prob.total);
}

function renderTenFrames(p, prob){
  const container=document.getElementById(`p${p}-tenframes`);
  const teamClass = p===1 ? 'blue' : 'red';
  const ones = prob.n1 % 10;
  const frame1 = Array.from({length:10}, (_,i)=>{
    if(i < ones) return `<div class="tf-cell"><div class="dot primary ${teamClass}"></div></div>`;
    if(i < ones + prob.b1) return `<div class="tf-cell"><div class="dot secondary"></div></div>`;
    return `<div class="tf-cell"></div>`;
  }).join('');
  const frame2 = Array.from({length:10}, (_,i)=> i < prob.b2 ? `<div class="tf-cell"><div class="dot secondary"></div></div>` : `<div class="tf-cell"></div>`).join('');
  container.innerHTML = `
    <div class="tf-card"><div class="tf-label">Ten Frame 1</div><div class="tenframe ${p===2 ? 'red' : ''}">${frame1}</div></div>
    <div class="tf-card"><div class="tf-label">Ten Frame 2</div><div class="tenframe ${p===2 ? 'red' : ''}">${frame2}</div></div>`;
}

function renderChoices(p, correct){
  const container=document.getElementById(`p${p}-choices`); container.innerHTML='';
  let choices=[correct];
  while(choices.length<4){
    let diff=Math.floor(Math.random()*9)-4; if(diff===0) diff=1;
    let candidate=correct+diff;
    if(candidate>=0 && candidate<=Math.max(mathRange+10,20) && !choices.includes(candidate)) choices.push(candidate);
  }
  choices.sort(()=>Math.random()-0.5);
  choices.forEach(val=>{
    const btn=document.createElement('button');
    btn.className=`toy-button btn-${p===1?'blue':'red'}`;
    btn.textContent=val;
    btn.onclick=()=>handleChoice(p,val,correct,btn);
    container.appendChild(btn);
  });
}

function handleChoice(p,val,correct,btn){
  if(!gameActive) return;
  if((p===1 && p1Frozen) || (p===2 && p2Frozen)) return;
  if(val===correct){
    btn.classList.add('correct-flash');
    sounds.correct();
    if(p===1) p1Score++; else p2Score++;
    document.getElementById(`p${p}-total`).textContent = correct;
    document.getElementById(`p${p}-total-box`).classList.remove('pulse-target');
    document.getElementById(`p${p}-total-box`).classList.add('completed-part','pop-in');
    updateScoreAndCheckWinner();
    setTimeout(()=>{ if(gameActive) nextProblem(p); }, 520);
  } else {
    sounds.wrong();
    btn.style.opacity='.3';
    freezePlayer(p);
  }
}

function freezePlayer(p){
  if(p===1) p1Frozen=true; else p2Frozen=true;
  const area=document.getElementById(`p${p}-area`); area.classList.add('wrong-shake','frozen-area'); setTimeout(()=>area.classList.remove('wrong-shake'),420); sounds.buzz();
  [document.getElementById(`bear-${p}`), document.getElementById(`bear-m${p}`)].forEach(b=>{ if(!b) return; for(let i=0;i<3;i++){ const bee=document.createElement('div'); bee.className=`bee-swarm bee-${i}`; bee.textContent='🐝'; b.appendChild(bee); } });
  setTimeout(()=>{ if(!gameActive) return; if(p===1) p1Frozen=false; else p2Frozen=false; area.classList.remove('frozen-area'); document.querySelectorAll(`#bear-${p} .bee-swarm, #bear-m${p} .bee-swarm`).forEach(el=>el.remove()); },3000);
}

function updateScoreAndCheckWinner(initial=false){
  document.getElementById('score-1').textContent=p1Score; document.getElementById('score-2').textContent=p2Score;
  document.getElementById('final-score-1').textContent=p1Score; document.getElementById('final-score-2').textContent=p2Score;
  document.getElementById('gap-info').textContent='Race to Honey!';

  const maxClimb=86;
  const h1=(Math.min(p1Score,GOAL_SCORE)/GOAL_SCORE*maxClimb)+'%';
  const h2=(Math.min(p2Score,GOAL_SCORE)/GOAL_SCORE*maxClimb)+'%';
  ['bear-1','bear-m1'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.bottom=h1; });
  ['bear-2','bear-m2'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.bottom=h2; });

  if(!initial && !raceFinishPending && (p1Score>=GOAL_SCORE || p2Score>=GOAL_SCORE)){
    raceFinishPending=true;
    const winner=p1Score>=GOAL_SCORE ? 1 : 2;
    gameActive=false;
    clearInterval(timerInterval); clearTimeout(botInterval);
    setTimeout(()=>endGame(winner),650);
  }
}

function startBot(){
  if(!gameActive || gameMode!=='pve') return;
  const thinkTime=Math.random()*1500 + 1400;
  botInterval=setTimeout(()=>{
    if(gameActive && !p2Frozen){
      let correct = p2Prob.total;
      let chosen = Math.random()<0.15 ? correct + (Math.random()<0.5?-1:1) : correct;
      const buttons=[...document.querySelectorAll('#p2-choices button')];
      let target=buttons.find(b=>parseInt(b.textContent,10)===chosen) || buttons.find(b=>parseInt(b.textContent,10)===correct);
      if(target) target.click();
    }
    startBot();
  }, thinkTime);
}

function endGame(forcedWinner=0){
  if(gameEnded) return;
  gameEnded=true; gameActive=false; raceFinishPending=false;
  clearInterval(timerInterval); clearTimeout(botInterval);
  document.getElementById('global-timer-box').classList.add('hidden'); sounds.win();
  let winner=forcedWinner;
  if(!winner){ if(p1Score>p2Score) winner=1; else if(p2Score>p1Score) winner=2; }
  document.getElementById('winner-name').textContent = winner===0 ? "IT'S A TIE!" : (winner===1 ? 'TEAM 1 WINS!' : (gameMode==='pve' ? 'BOT WINS!' : 'TEAM 2 WINS!'));
  document.getElementById('final-score-1').textContent=p1Score;
  document.getElementById('final-score-2').textContent=p2Score;
  document.getElementById('game-over').classList.remove('hidden');
  if(window.confetti){ confetti({particleCount:180, spread:90, origin:{y:.6}}); }
}
</script>
</div></div>
</body>
</html>
